# The owner is deleted while a repair is parked at Failed. A create
# refusal armed for a terminating namespace is consumed by nobody, since a
# parked repair creates nothing until it re-arms; the teardown treats the
# row as a scale-down extra, the Delete operation replacing the spent
# Restart, and the teardown re-observed changes nothing on the wave.
scenario: restart-parked-repair-teardown
arrows:
  - T-ready-restart
  - T-restart-stuck
  - T-failedrepair-teardown
  - T-delete-done
cells:
  - instance/Failed/Repair/api.namespaceTerminating/before
  - instance/Failed/Repair/spec.teardown[deleted]/before
  - instance/Failed/Repair/spec.teardown[deleted]/after@T-failedrepair-teardown
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    scaleDownRequeueInterval: 30s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the rebuilt pod crash-loops and is older than the grace when the wedge is read, so the row fails with its operation preserved
    events:
      - clock.advance: 2m
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 0}, message: "back-off restarting failed container"}
  - tick: 4
    note: the namespace begins terminating and would refuse a create; a parked repair creates nothing, so nothing consumes the refusal
    events:
      - api.namespaceTerminating: {}
  - tick: 5
    note: the owner's deletion begins, so the parked row becomes a scale-down extra and the wave stamps Deleting over the spent Restart
    events:
      - spec.teardown[deleted]: {}
  - tick: 6
    note: the teardown is re-observed; the Delete stamp is committed once and the wave, which owns the row, deletes the wedged pod
    events:
      - spec.teardown[deleted]: {}
  - tick: 7
    note: the pod is gone, so the row is removed
    events:
      - pod.deleted[source]: {pod: {index: 0}}
