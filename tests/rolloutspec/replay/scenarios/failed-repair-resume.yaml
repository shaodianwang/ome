# A repair parked at Failed whose rebuilt pod comes up on its own: the
# ConfigMap key it could not find is back and the kubelet's retry starts
# the container. The restart pass resumes the promote at the incarnation
# the pod already carries - serving gate, then Ready on the running
# revision - with no new attempt and no retry ladder configured.
scenario: failed-repair-resume
arrows:
  - T-ready-restart
  - T-restart-stuck
  - T-failed-repair-resume
cells:
  - instance/Failed/pod.containersReady[source]/before
intentional: >-
  a Failed row another verb still claims is that verb's: the Create pass
  does not re-prove a spent repair's set, so the restart pass's own promote
  is the only Ready stamp and the only InstanceReady announcement
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the rebuilt pod cannot find its ConfigMap key and is older than the grace when the wedge is read, so the row fails with its operation preserved
    events:
      - clock.advance: 2m
      - pod.waiting[CreateContainerConfigError]: {pod: {index: 0}, message: "couldn't find key mode in ConfigMap"}
  - tick: 4
    note: the key is back and the kubelet's retry starts the container, so the parked repair writes the serving gate on the pod it already has
    events:
      - pod.containersReady[source]: {pod: {index: 0}}
  - tick: 5
    note: the kubelet folds the gate into PodReady and the repair finishes with its promote, at the incarnation the pod carries
    events:
      - pod.ready[source]: {pod: {index: 0}}
