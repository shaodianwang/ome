# The patched pod is deleted from outside while the patch converges. The
# in-place path issues no deletes, so it keeps re-reading the Terminating pod
# and makes no progress; the loss itself is decided once the pod is gone.
scenario: inplace-patched-pod-terminating
arrows:
  - T-ready-inplace
  - T-inplace-podlost-recreate
cells:
  - instance/Update/InPlace/pod.terminating[source]/before
initial:
  spec:
    replicas: 1
    strategy: InPlaceIfPossible
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the pod becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: only the image changed, so the update is eligible to run in place
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the pod leaves rotation, so the transition marker is written
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 5
    note: the image patch lands while the source is out of rotation
  - tick: 6
    note: the patched pod is deleted from outside and held Terminating, so the pass re-reads it and makes no progress
    events:
      - pod.terminating[source]: {pod: {index: 0}}
  - tick: 7
    note: the only pod is gone, so the roll re-resolves to recreate rather than polling an empty pod set
    events:
      - pod.deleted[source]: {pod: {index: 0}}
