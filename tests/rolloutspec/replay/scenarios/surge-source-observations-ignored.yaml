# While the replacement is still coming up, the source's binding, readiness
# and gate are re-observed, the controller ticks and restarts, and knobs
# outside the template move; the surge step reads none of them.
scenario: surge-source-observations-ignored
arrows:
  - T-ready-surge
  - T-surge-target-ready
  - T-surgedrain-promote
cells:
  - instance/Update/Surge/pod.scheduled[source]/before
  - instance/Update/Surge/pod.containersReady[source]/before
  - instance/Update/Surge/pod.ready[source]/before
  - instance/Update/Surge/pod.servingOn[source]/before
  - instance/Update/Surge/ctrl.resync/before
  - instance/Update/Surge/ctrl.crash/before
  - instance/Update/Surge/spec.policyTuning[restartPolicy]/before
  - instance/Update/Surge/spec.replicasUp/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the source's binding, readiness and serving gate are re-observed while the replacement is not yet ready; the step reads none of them
    events:
      - pod.scheduled[source]: {pod: {index: 0, ordinal: 0}}
      - pod.containersReady[source]: {pod: {index: 0, ordinal: 0}}
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - pod.servingOn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 5
    note: a pass with nothing changed re-derives the step and writes nothing
  - tick: 6
    note: the controller restarts with no write pending; the pinned operation is re-read from status and the step is unchanged
    events:
      - ctrl.crash: {}
  - tick: 7
    note: the restart policy changes mid-surge; nothing on this path reads it
    events:
      - spec.policyTuning[restartPolicy]: {value: RecreateInstanceOnPodRestart}
  - tick: 8
    note: the replica count grows mid-surge; the new index is the Create pass's and the surging row is untouched
    events:
      - spec.replicasUp: {to: 2}
  - tick: 9
    note: the replacement is serving and in rotation beside the source, so the step advances
    events:
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 10
    note: the source leaves rotation, so the drain has converged
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 11
    note: the drained source is gone and the surge promotes
    events:
      - pod.deleted[source]: {pod: {index: 0, ordinal: 0}}
