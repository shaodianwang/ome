# A draining Instance's pod keeps reporting: re-bound, containers ready, a
# runner restart, a terminal phase once its delete is issued. None of it moves
# the wave, which gates on rotation alone and completes only on absence.
scenario: delete-idle-pod-observations
arrows:
  - T-ready-scaledown
  - T-delete-done
cells:
  - instance/Delete/Drain/ctrl.resync/before
  - instance/Delete/Drain/pod.scheduled[source]/before
  - instance/Delete/Drain/pod.containersReady[source]/before
  - instance/Delete/Drain/pod.containerRestart/before
  - instance/Delete/Drain/endpoint.rotationOut[source]/before
  - instance/Delete/Drain/pod.phaseTerminal[Failed]/before
initial:
  spec:
    replicas: 2
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    containerName: ome-container
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true, node: node-0}
    - {index: 1, ready: true, serving: true, routed: true, node: node-1}
timeline:
  - tick: 1
    note: the operator halves the replica count, and the retired Instance is admitted into a Delete operation
    events:
      - spec.replicasDown: {to: 1}
  - tick: 2
    note: the first drive takes the retired pod's serving gate down and finds it still in rotation, so the wave polls
  - tick: 3
    note: a reconcile with nothing new re-reads the same pod set and writes nothing
  - tick: 4
    note: a minute on, the retired pod is re-bound and reports its containers ready again, which the drain never reads
    events:
      - clock.advance: 1m
      - pod.scheduled[source]: {pod: {index: 1}}
      - pod.containersReady[source]: {pod: {index: 1}}
  - tick: 5
    note: the retired pod's runner restarts after Ready, and the restart trigger that would rebuild a Ready Instance is blind to a draining one
    events:
      - pod.containerRestart: {pod: {index: 1}, message: OOMKilled}
  - tick: 6
    note: the retired pod leaves rotation, which is the one signal the drain reads, so the wave issues the graceful delete
    events:
      - endpoint.rotationOut[source]: {pod: {index: 1}}
  - tick: 7
    note: the terminating pod's container dies and its phase goes Failed, and the row still waits for the object to be gone
    events:
      - pod.phaseTerminal[Failed]: {pod: {index: 1}}
  - tick: 8
    note: the pod is gone and the row leaves the owner's status
    events:
      - pod.deleted[source]: {pod: {index: 1}}
  - tick: 9
    note: the Component is at rest with the retired Instance gone
