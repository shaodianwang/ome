# A repair parked at Failed whose rebuilt pod stays wedged. On the
# operator's retry ladder (config.updateRetry, the one ladder every
# attempt is paced by) the parked repair re-arms: the set is rebuilt at
# the next incarnation under a fresh deadline, the operation counting the
# re-arm. The ladder here allows one re-arm; when that attempt wedges too
# the row parks for good and the escalation pass announces it once.
scenario: failed-repair-rearm
arrows:
  - T-ready-restart
  - T-restart-stuck
  - T-failed-repair-rearm
cells:
  - instance/Failed/timer.repairRetry/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 1, initialDelay: 5m, maxDelay: 30m, multiplier: 2.0}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the rebuilt pod cannot find its ConfigMap key and is older than the grace when the wedge is read, so the row fails with its operation preserved
    events:
      - clock.advance: 2m
      - pod.waiting[CreateContainerConfigError]: {pod: {index: 0}, message: "couldn't find key mode in ConfigMap"}
  - tick: 4
    note: the ladder's first delay has not elapsed since the recorded failure, so the row stays parked and the pass asks to be woken when it has
    events:
      - clock.advance: 1m
  - tick: 5
    note: the delay elapses, so the parked repair re-arms as a fresh Restart at the next incarnation that counts the re-arm, and the wedged pod is drained
    events:
      - timer.repairRetry: {slack: 1s}
  - tick: 6
    note: the drained pod is gone, so the rebuild lands at the bumped incarnation
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 7
    note: the rebuilt pod wedges again past the grace, so the attempt parks with the re-arm on its record
    events:
      - clock.advance: 2m
      - pod.waiting[CreateContainerConfigError]: {pod: {index: 0}, message: "couldn't find key mode in ConfigMap"}
  - tick: 8
    note: the ladder is spent, so however long the wait nothing re-arms, and the escalation pass says so once
    events:
      - clock.advance: 1h
  - tick: 9
    note: a further tick re-arms nothing and announces nothing more
