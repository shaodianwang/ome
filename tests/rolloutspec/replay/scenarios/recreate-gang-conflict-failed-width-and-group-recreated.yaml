# A gang's recreate stands ended by the gang verdict with the Update
# operation kept when the gang is widened and, a pass later, the foreign
# PodGroup is deleted. A width change mints no revision and re-drives
# nothing; the PodGroup pass re-creates the deleted group from the plan
# under this owner, which ends the collision but re-drives nothing either.
# A corrective revision re-drives the continuation, whose Phase B places
# every member of the wider gang behind the group this owner announced, and
# the recreate completes at the new width.
scenario: recreate-gang-conflict-failed-width-and-group-recreated
arrows:
  - T-ready-recreate
  - T-faileddrain-corrective
  - T-drain-ready
cells:
  - instance/Failed/Drain/spec.gangWidth[grow]/before
  - instance/Failed/Drain/gang.podGroup[Deleted]/before
  - instance/Failed/Drain/spec.revision/before
intentional: >-
  a recreate the gang verdict ended stays Failed with its operation kept:
  nothing this controller does frees a name another controller holds, so no
  pass re-drives it at the pinned revision; it resumes through a revision
  other than the pinned one or the reset mailbox
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members are bound to node-0 and report Ready, and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.scheduled[source]: {pod: {index: 0, runner: leader}, message: node-0}
      - pod.scheduled[source]: {pod: {index: 0, runner: worker}, message: node-0}
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the pod template changes and the strategy rebuilds the gang in place of surging, so Phase A takes the serving gates down
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the leader leaves rotation, so Phase A deletes both members
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
  - tick: 5
    note: both members are gone, so Phase B rebuilds the gang at the bumped incarnation behind its existing PodGroup
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
  - tick: 6
    note: the group's controller reference is rewritten to another owner, which is a name this controller may not write, so the gang verdict stamps the Instance Failed with the recreate kept rather than parked
    events:
      - gang.podGroup[OwnershipConflict]: {instance: 0}
  - tick: 7
    note: the gang is widened by one worker, which mints no revision and re-drives nothing; the row stays Failed with the recreate kept
    events:
      - spec.gangWidth[grow]: {to: 2}
  - tick: 8
    note: a pass with nothing new writes nothing
  - tick: 9
    note: the ended attempt's members are gone and the foreign PodGroup is deleted, so the PodGroup pass announces the group again under this owner; a freed name re-drives nothing either
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
      - gang.podGroup[Deleted]: {instance: 0}
  - tick: 10
    note: the name is this controller's again, and the row still waits for the reset mailbox or a corrective revision
  - tick: 11
    note: the template moves to a third revision, which is not the one the ended attempt pinned, so the continuation is re-driven as a recreate at the new revision with the Incarnation bumped, and Phase B places all three members of the wider gang behind the group this owner announced
    events:
      - spec.revision: {image: registry.example.com/runtime:v3}
  - tick: 12
    note: every member reports Ready and the leader enters rotation, so the Instance promotes on the corrective revision at the new width
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - pod.ready[source]: {pod: {index: 0, runner: worker, ordinal: 1}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
