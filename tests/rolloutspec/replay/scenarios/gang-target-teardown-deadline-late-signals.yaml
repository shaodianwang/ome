# The owner of a gang surge is deleted with its teardown deadline already
# elapsed while the replacement gang is still building, and on that same
# observation a member of each gang is lost, the template moves and the
# operation deadline elapses. The release is driven by the owner's clock
# alone and the escalation pass does not run under teardown: the finalizer
# goes, both rows are purged with the owner rather than stamped, and the
# re-observed teardown and a further revision move a tick later find
# nothing to act on.
scenario: gang-target-teardown-deadline-late-signals
arrows:
  - T-empty-gang-surge-target
cells:
  - instance/Update/GangSurgeTarget/timer.teardownDeadline/before
  - instance/Update/GangSurgeTarget/pod.deleted[source]/boundary@T-gangtarget-teardown-deadline
  - instance/Update/GangSurgeTarget/pod.deleted[target]/boundary@T-gangtarget-teardown-deadline
  - instance/Update/GangSurgeTarget/spec.revision/boundary@T-gangtarget-teardown-deadline
  - instance/Update/GangSurgeTarget/timer.operationDeadline/boundary@T-gangtarget-teardown-deadline
  - instance/Update/GangSurgeTarget/timer.teardownDeadline/after@T-gangtarget-teardown-deadline
  - instance/Update/GangSurgeTarget/spec.teardown[deleted]/after@T-gangtarget-teardown-deadline
  - instance/Update/GangSurgeTarget/spec.revision/after@T-gangtarget-teardown-deadline
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    teardownDeadline: 1m
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: the owner's deletion is observed with its teardown deadline already behind the clock, as a member of each gang is lost, the template moves on and the operation deadline elapses; the release consults none of them and the escalation pass does not run under teardown, so the finalizer goes and both rows are purged with the owner
    events:
      - spec.teardown[deleted]: {}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
      - pod.deleted[target]: {pod: {index: 1, runner: worker}}
      - spec.revision: {image: registry.example.com/runtime:v3}
      - timer.operationDeadline: {slack: 1s}
      - timer.teardownDeadline: {slack: 1s}
  - tick: 6
    note: the teardown is observed again, the template moves once more and the deadline elapses again on an owner that is gone; nothing reconciles
    events:
      - spec.teardown[deleted]: {}
      - spec.revision: {image: registry.example.com/runtime:v4}
      - timer.teardownDeadline: {slack: 1s}
