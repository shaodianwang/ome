# Four single-pod Instances under SurgeThenDrain maxSurge 1, maxUnavailable
# 0 and restart policy None. A push to a revision whose runner dies after
# it has served promotes Instance 0 and admits Instance 1's surge. Instance
# 0's runner crashes; with maxUnavailable 0 no further old pod may leave
# rotation, so Instance 1 keeps its old pod while its new one serves beside
# it, and then that new pod crashes too, with the attempt still open. The
# corrected push supersedes that attempt: the crashed pod is taken out of
# rotation and deleted, the attempt stays open until the pod is gone, and
# no other Instance surges meanwhile. Once the pod is gone Instance 1
# returns to Ready on v1 and the corrected roll admits one surge at a time:
# the Component never lists more than replicas plus maxSurge pods.
scenario: surge-corrected-push-abandons-crashed-replacement
arrows:
  - T-ready-surge
  - T-surge-target-ready
  - T-surgedrain-promote
  - T-surge-abandon-superseded
cells:
  - instance/Ready/pod.containerRestart/before
  - instance/Ready/gate.deny[Budget]/before
  - instance/Update/Surge/spec.revision/before
intentional: >-
  an open surge whose new pod crashed keeps its slot through the deletion
  of that pod, so a corrected push opens no second surge beside a pod that
  still terminates; the slot passes to the next start only once the pod is
  gone and the attempt has closed
initial:
  spec:
    replicas: 4
    strategy: SurgeThenDrain
    maxSurge: "1"
    maxUnavailable: "0"
    restartPolicy: None
    image: registry.example.com/runtime:v1
    containerName: ome-container
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 2m, maxDelay: 10m, multiplier: 2}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 2, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 3, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true, node: node-0}
    - {index: 1, ready: true, serving: true, routed: true, node: node-1}
    - {index: 2, ready: true, serving: true, routed: true, node: node-2}
    - {index: 3, ready: true, serving: true, routed: true, node: node-3}
timeline:
  - tick: 1
    note: v2 is pushed, so Instance 0 surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 2
    note: the replacement is bound, serves and enters rotation, so the source leaves the serving gate
    events:
      - pod.scheduled[target]: {pod: {index: 0, ordinal: 1}, message: node-4}
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 3
    note: the source leaves rotation, so it is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 4
    note: the source is gone, so Instance 0 promotes onto v2
    events:
      - pod.deleted[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 5
    note: the surge budget frees, so Instance 1 surges its replacement
  - tick: 6
    note: half a minute later the promoted runner crashes and leaves rotation while Instance 1's replacement is bound; the budget holds every further start behind Instance 0
    events:
      - clock.advance: 30s
      - pod.scheduled[target]: {pod: {index: 1, ordinal: 1}, message: node-5}
      - pod.containerRestart: {pod: {index: 0, ordinal: 1}, message: Error}
      - endpoint.rotationOut[target]: {pod: {index: 0, ordinal: 1}}
      - pod.servingOff[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 7
    note: Instance 1's replacement serves and enters rotation, but with Instance 0 off the floor no source may leave rotation, so the surge waits at its first step with both pods up
    events:
      - pod.ready[target]: {pod: {index: 1, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 1, ordinal: 1}}
  - tick: 8
    note: half a minute later Instance 1's replacement crashes and leaves rotation too
    events:
      - clock.advance: 30s
      - pod.containerRestart: {pod: {index: 1, ordinal: 1}, message: Error}
      - endpoint.rotationOut[target]: {pod: {index: 1, ordinal: 1}}
      - pod.servingOff[target]: {pod: {index: 1, ordinal: 1}}
  - tick: 9
    note: two minutes on the kubelet parks both runners in CrashLoopBackOff; the crash of the promoted set counts on v2's ladder, Instance 1's attempt stays open inside the grace, and no repair opens under restart policy None
    events:
      - clock.advance: 2m
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 0, ordinal: 1}, message: "back-off restarting failed container"}
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 1, ordinal: 1}, message: "back-off restarting failed container"}
  - tick: 10
    note: the operator pushes the corrected revision, which supersedes Instance 1's open attempt; its crashed replacement leaves the serving gate a pass ahead of its deletion, and no other Instance surges
    events:
      - spec.revision: {image: registry.example.com/runtime:v3}
  - tick: 11
    note: the superseded replacement is deleted; the attempt stays open while it terminates, so the slot stays held
    events:
      - clock.advance: 5s
  - tick: 12
    note: the replacement is still terminating and nothing else surges
    events:
      - clock.advance: 5s
  - tick: 13
    note: the replacement is gone, so Instance 1 returns to Ready on v1 and the roll re-enters through the budget on the next pass
    events:
      - pod.deleted[target]: {pod: {index: 1, ordinal: 1}}
  - tick: 14
    note: the budget admits one start, Instance 0 first since it is out of rotation; it surges its corrected replacement beside its crashing pod
  - tick: 15
    note: Instance 0's corrected replacement is bound, serves and enters rotation; the crashing pod is already out of rotation, so it is deleted
    events:
      - pod.scheduled[target]: {pod: {index: 0, ordinal: 0}, message: node-6}
      - pod.ready[target]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 0}}
  - tick: 16
    note: the crashing pod is gone, so Instance 0 promotes onto v3
    events:
      - pod.deleted[source]: {pod: {index: 0, ordinal: 1}}
  - tick: 17
    note: the surge budget frees, so Instance 1 surges its corrected replacement
  - tick: 18
    note: the corrected replacement is bound, serves and enters rotation, so Instance 1's source leaves the serving gate
    events:
      - pod.scheduled[target]: {pod: {index: 1, ordinal: 1}, message: node-7}
      - pod.ready[target]: {pod: {index: 1, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 1, ordinal: 1}}
  - tick: 19
    note: Instance 1's source leaves rotation, so it is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 1, ordinal: 0}}
  - tick: 20
    note: the source is gone, so Instance 1 promotes onto v3
    events:
      - pod.deleted[source]: {pod: {index: 1, ordinal: 0}}
