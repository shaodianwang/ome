# Spec and config edits against a parked attempt whose set is down. An
# edit outside the revision hash, a pause, a freeze, an unpause, a restart
# policy flip, a new readiness timeout and a re-tuned ladder open nothing:
# the attempt keeps the wait it names and the live block keeps its date.
# A replica increase is the Create pass's new index; the parked row keeps
# its own.
scenario: parked-down-spec-edits
arrows:
  - T-ready-recreate
  - T-drain-deadline
cells:
  - instance/Failed/Parked/spec.annotationOnly/before
  - instance/Failed/Parked/spec.pauseTrue/before
  - instance/Failed/Parked/spec.pauseFreeze/before
  - instance/Failed/Parked/spec.unpause/before
  - instance/Failed/Parked/spec.policyTuning[restartPolicy]/before
  - instance/Failed/Parked/spec.policyTuning[instanceReadyTimeout]/before
  - instance/Failed/Parked/config.changed[updateRetry]/before
  - instance/Failed/Parked/spec.replicasUp/before
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
    podLabels: {kueue.x-k8s.io/queue-name: queue-a}
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 1h, maxDelay: 2h, multiplier: 2}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod template changes, so the roll drains the pod for a recreate
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the pod leaves rotation, so it is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 4
    note: the old pod is gone, so the rebuild lands at the new revision
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 5
    note: the deadline elapses on a rebuilt pod that never came up; the ladder counts the wave and the attempt is parked with the row Failed
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the queue label moves; the edit is outside the revision hash, so the target stands and the parked attempt opens nothing
    events:
      - spec.annotationOnly: {labels: {kueue.x-k8s.io/queue-name: queue-b}}
  - tick: 7
    note: the operator pauses; a pause holds no row nobody owns and the attempt keeps the wait it names
    events:
      - spec.pauseTrue: {}
  - tick: 8
    note: the pause becomes a freeze; the phase keeps following the set
    events:
      - spec.pauseFreeze: {}
  - tick: 9
    note: the unpause plans the update and create passes again, which find the ladder still denying a fresh start
    events:
      - spec.unpause: {}
  - tick: 10
    note: the restart policy changes; a parked attempt opens nothing on the change
    events:
      - spec.policyTuning[restartPolicy]: {value: RecreateInstanceOnPodRestart}
  - tick: 11
    note: the readiness timeout is shortened; a parked attempt runs no clock, so the knob waits for the next attempt
    events:
      - spec.policyTuning[instanceReadyTimeout]: {value: 10m}
  - tick: 12
    note: the ladder is re-tuned; a re-tuned ladder never re-dates a live block, which keeps the date it was recorded with
    events:
      - config.changed[updateRetry]: {config: {updateRetry: {maxAttempts: 3, initialDelay: 5m, maxDelay: 10m, multiplier: 2}}}
  - tick: 13
    note: the replica count grows; the new index is the Create pass's and the parked row keeps its own set
    events:
      - spec.replicasUp: {to: 2}
