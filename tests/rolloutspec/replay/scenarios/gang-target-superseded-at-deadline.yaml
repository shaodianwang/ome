# The operation deadline elapses on the same tick a second template change
# retires the incomplete replacement. The claim lands first and the stamp that
# follows is diagnostic; the retirement completes with no RetryBlock recorded.
scenario: gang-target-superseded-at-deadline
arrows:
  - T-empty-gang-surge-target
  - T-gangtarget-cleanup-superseded
  - T-gangcleanup-done
  - T-gangcleanup-deadline
cells:
  - instance/Update/GangSurgeTarget/timer.operationDeadline/boundary@T-gangtarget-cleanup-superseded
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: the template changes again as the deadline elapses; the marker is claimed as a cleanup and then both halves are stamped Failed with their operations preserved
    events:
      - spec.revision: {image: registry.example.com/runtime:v3}
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the retired members are gone, so the marker is removed and the source is reset with no RetryBlock recorded
    events:
      - pod.deleted[target]: {pod: {index: 1, runner: leader}}
      - pod.deleted[target]: {pod: {index: 1, runner: worker}}
