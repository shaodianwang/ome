# A migration surge row left Creating with no operation, its leftover pod
# never bound. The scheduler's refusal, a queue gate and its admission, the
# pod reappearing under a new UID and a late binding are read by nobody: a
# row with no operation carries nothing for a hold to record or a deadline
# to park, and the wave reaps the unplanned index.
scenario: idle-creating-left-pod-unbound-observations
arrows:
  - T-ready-migrate
  - T-empty-migrate-target
  - T-migrate-deadline-restore
  - T-migratetarget-expired
  - T-creating-reap
  - T-delete-done
cells:
  - instance/Creating/pod.unschedulable[source]/before
  - instance/Creating/pod.schedulingGated/before
  - instance/Creating/pod.admitted/before
  - instance/Creating/pod.uidRotated/before
  - instance/Creating/pod.scheduled[source]/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    migrationMode: Auto
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
timeline:
  - tick: 1
    note: the index is planned and no row exists, so the Create pass opens the attempt
  - tick: 2
    note: the pod is bound, becomes Ready and enters rotation, so the row records a running revision on a known node
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-0}
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the operator asks the Instance off node-0, and the migrate pass admits the request and establishes the pair
    events:
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
  - tick: 4
    note: the surge pod waits for a node while the migration waits on its promote
  - tick: 5
    note: the record's deadline elapses with the source healthy, so expiry restores the source and unpins the surge, whose row is left Creating with no operation beyond the desired set
    events:
      - timer.migrationDeadline: {slack: 1s}
  - tick: 6
    note: the leftover pod is refused a node, gated by a queue, admitted again, reappears under a new UID and is finally bound; none of it is read, and the wave reaps the unplanned index
    events:
      - pod.unschedulable[source]: {pod: {index: 1}}
      - pod.schedulingGated: {pod: {index: 1}}
      - pod.admitted: {pod: {index: 1}}
      - pod.uidRotated: {pod: {index: 1}}
      - pod.scheduled[source]: {pod: {index: 1}, message: node-1}
  - tick: 7
    note: the wave owns the row and deletes the leftover pod
  - tick: 8
    note: the leftover pod is gone, so the row is removed
    events:
      - pod.deleted[source]: {pod: {index: 1}}
