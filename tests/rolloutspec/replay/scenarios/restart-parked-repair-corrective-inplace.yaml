# A corrective revision lands on a repair parked at Failed under
# InPlaceIfPossible. The row's running revision is no longer the roll
# target and only the image changed, so the restart pass yields the row and
# the roll replaces the parked repair with a fresh in-place attempt that
# patches the wedged pod; the pod coming up on the corrective image
# completes it.
scenario: restart-parked-repair-corrective-inplace
arrows:
  - T-ready-restart
  - T-restart-stuck
  - T-failedrepair-corrective-inplace
cells:
  - instance/Failed/Repair/spec.revision/boundary@T-failedrepair-corrective-inplace
  - instance/Failed/Repair/spec.revision/after@T-failedrepair-corrective-inplace
initial:
  spec:
    replicas: 1
    strategy: InPlaceIfPossible
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the rebuilt pod crash-loops and is older than the grace when the wedge is read, so the row fails with its operation preserved
    events:
      - clock.advance: 2m
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 0}, message: "back-off restarting failed container"}
  - tick: 4
    note: a corrective revision lands; the row is off the roll target and only the image changed, so the roll replaces the parked repair with a fresh in-place attempt that patches the wedged pod
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 5
    note: the pass issues the image patch for the corrective revision and restamps the revision label on the pod
  - tick: 6
    note: the patched pod comes up on the corrective image and enters rotation, so the in-place attempt completes
    events:
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
