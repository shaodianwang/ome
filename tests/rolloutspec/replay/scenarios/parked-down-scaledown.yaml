# The replica count drops below a parked row's index while its set is
# down: the scale-down wave retires it as it retires a Failed row, and
# the count re-applied changes nothing on the wave.
scenario: parked-down-scaledown
arrows:
  - T-ready-recreate
  - T-drain-deadline
  - T-failedparked-scaledown
  - T-delete-done
cells:
  - instance/Failed/Parked/spec.replicasDown/before
  - instance/Failed/Parked/spec.replicasDown/after@T-failedparked-scaledown
initial:
  spec:
    replicas: 2
    strategy: RecreatePod
    maxUnavailable: "2"
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 1h, maxDelay: 2h, multiplier: 2}
    scaleDownRequeueInterval: 30s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
    - {index: 1, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: both Ready rows are steady on their serving pods
  - tick: 2
    note: the pod template changes, and the budget lets both Instances drain for a recreate at once
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: both pods leave rotation, so they are deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
      - endpoint.rotationOut[source]: {pod: {index: 1}}
  - tick: 4
    note: the old pods are gone, so both rebuilds land at the new revision
    events:
      - pod.deleted[source]: {pod: {index: 0}}
      - pod.deleted[source]: {pod: {index: 1}}
  - tick: 5
    note: the deadline elapses on rebuilt pods that never came up; the ladder counts the wave and both attempts are parked with their rows Failed
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the replica count drops to one, so the second parked row leaves the plan and the wave stamps Deleting over its parked operation
    events:
      - spec.replicasDown: {to: 1}
  - tick: 7
    note: the same count is re-applied; the wave owns the row and deletes its unrouted pod
    events:
      - spec.replicasDown: {to: 1}
  - tick: 8
    note: the retired pod is gone, so its row is removed and the first row stays parked
    events:
      - pod.deleted[source]: {pod: {index: 1}}
