# The surge replacement reports its containers ready and takes the serving
# gate, then its readiness regresses before it ever reports Ready. The
# runtime-ready bar goes false again, so the pass returns without touching
# the step or the source's rotation, and the surge resumes once readiness
# returns.
scenario: surge-target-readiness-regressed
arrows:
  - T-ready-surge
  - T-surge-target-ready
  - T-surgedrain-promote
cells:
  - instance/Update/Surge/pod.containersNotReady[target]/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's containers come up, so it takes the serving gate and waits to report Ready
    events:
      - pod.containersReady[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 5
    note: the replacement's readiness regresses before it reported Ready, so the pass returns with the step at Surge and the source still in rotation
    events:
      - pod.containersNotReady[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 6
    note: readiness returns and the replacement enters rotation, so the step advances and the source leaves rotation
    events:
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 7
    note: the source leaves rotation and is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 8
    note: the drained source is gone and the Instance promotes
    events:
      - pod.deleted[source]: {pod: {index: 0, ordinal: 0}}
