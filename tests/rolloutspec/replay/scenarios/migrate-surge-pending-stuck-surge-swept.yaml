# The surge pod of a migration at SurgePending wedges Terminating under a
# force-delete policy. The Component sweep frees the name at the overdue
# clock and the drive re-creates it in the same pass; the step is unchanged.
scenario: migrate-surge-pending-stuck-surge-swept
arrows:
  - T-ready-migrate
  - T-empty-migrate-target
cells:
  - instance/Migrate/SurgeTarget/pod.stuckTerminating/before
  - instance/Migrate/SurgeTarget/timer.forceDelete[overdueSlack]/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    migrationMode: Auto
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    forceDelete: {overdueSlack: 1m, nodeUnreachableThreshold: 5m}
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
timeline:
  - tick: 1
    note: the index is planned and no row exists, so the Create pass opens the attempt
  - tick: 2
    note: the pod is bound, becomes Ready and enters rotation, so the row records a running revision on a known node
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-0}
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the operator asks the Instance off node-0, and the migrate pass admits the request and establishes the pair
    events:
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
  - tick: 4
    note: the surge pod is bound to node-1, deleted from outside and left with no kubelet behind it; it keeps its name and the drive waits
    events:
      - pod.scheduled[target]: {pod: {index: 1}, message: node-1}
      - pod.terminating[target]: {pod: {index: 1}}
      - pod.stuckTerminating: {pod: {index: 1}}
  - tick: 5
    note: the overdue clock elapses; the Component sweep force-deletes the wedged surge pod and the drive re-creates the freed name in the same pass
    events:
      - timer.forceDelete[overdueSlack]: {slack: 1s}
  - tick: 6
    note: a further pass finds the re-created surge pod not yet ready and the pair as it was
