# A parked attempt whose single pod serves loses ContainersReady while it
# keeps running. Inside the stuck-pod grace the set still reads as the
# attempt's; once the pod has been unready past the grace the set serves
# nothing and the row returns to Failed with the attempt kept. A further
# pass reads the same set and writes nothing.
scenario: parked-serving-running-not-ready
arrows:
  - T-ready-recreate
  - T-drain-deadline
  - T-failed-parked-serves
  - T-parked-down
cells:
  - instance/Update/Parked/pod.containersNotReady[source]/before
  - instance/Update/Parked/pod.runningNotReady[source]/boundary@T-parked-down
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 1h, maxDelay: 2h, multiplier: 2}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod template changes, so the roll drains the pod for a recreate
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the pod leaves rotation, so it is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 4
    note: the old pod is gone, so the rebuild lands at the new revision
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 5
    note: the deadline elapses on a rebuilt pod that never came up; the ladder counts the wave and the attempt is parked with the row Failed
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the pod comes up and is gated serving, so the parked set serves in full and the row reads as the roll in progress with the attempt still parked
    events:
      - pod.containersReady[source]: {pod: {index: 0}}
      - pod.servingOn[source]: {pod: {index: 0}}
  - tick: 7
    note: the pod's readiness regresses while it keeps running; inside the grace the set still reads as the attempt's
    events:
      - pod.containersNotReady[source]: {pod: {index: 0}}
  - tick: 8
    note: the pod has been unready past the grace, so the set serves nothing and the row returns to Failed with the attempt kept
    events:
      - clock.advance: 2m
  - tick: 9
    note: a further pass reads the same set and writes nothing
