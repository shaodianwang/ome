# The template moves to a corrective revision on the pass the stuck-pod
# grace elapses on the wedged replacement; the Failed stamp lands and the
# corrective revision is consumed from Failed as a different subject.
scenario: surge-stuckgrace-corrective
arrows:
  - T-ready-surge
  - T-surge-stuckgrace
cells:
  - instance/Update/Surge/spec.revision/boundary@T-surge-stuckgrace
intentional: >-
  a Failed single-pod surge source is no crash-loop park: its failure
  record names the replacement, not a pod of its promoted set, so once the
  replacement is gone the restart pass does not return the source to Ready
  and the Create pass does not promote a row that ran another revision; the
  row leaves Failed only through the roll
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 5m
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the pull wedges immediately, but the replacement is younger than the grace, so the surge keeps polling
    events:
      - pod.waiting[ImagePullBackOff]: {pod: {index: 0, ordinal: 1}, message: "manifest unknown"}
  - tick: 5
    note: the grace elapses as a corrective revision lands
    events:
      - timer.stuckPodGrace: {slack: 1s}
      - spec.revision: {image: registry.example.com/runtime:v3}
  - tick: 6
    note: the wedged replacement is gone
    events:
      - pod.deleted[target]: {pod: {index: 0, ordinal: 1}}
