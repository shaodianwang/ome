# The owner is deleted while the Instance is draining its source. Every
# observed index becomes a scale-down extra, mid-drain pairs included, so the
# Deleting phase and the Delete Drain operation replace the in-flight Update
# in one status transaction.
scenario: surgedrain-teardown
arrows:
  - T-ready-surge
  - T-surge-target-ready
  - T-surgedrain-teardown
  - T-delete-done
cells:
  - instance/Update/SurgeDrain/spec.teardown[deleted]/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement is serving and in rotation, so the step advances and the source's serving gate is flipped off
    events:
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 5
    note: the owner's deletion begins, so the draining pair becomes a scale-down extra
    events:
      - spec.teardown[deleted]: {}
  - tick: 6
    note: both slots leave rotation, which is the drain the delete waits on
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationOut[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 7
    note: both slots are gone, so the row is removed with them
    events:
      - pod.deleted[source]: {pod: {index: 0, ordinal: 0}}
      - pod.deleted[target]: {pod: {index: 0, ordinal: 1}}
