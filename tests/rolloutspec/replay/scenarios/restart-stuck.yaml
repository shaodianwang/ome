# The Restart's rebuilt pod cannot pull its image. The escalation measures
# the wedge from the start of the pod's waiting episode - its creation, as
# the pod never served - so the reason lands on a pod already older than the
# grace and the row fails on the pass that reads it, with the Restart
# operation preserved.
scenario: restart-stuck
arrows:
  - T-ready-restart
  - T-restart-stuck
cells:
  - instance/Restart/Drain/pod.waiting[ImagePullBackOff]/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the rebuilt pod is still booting two minutes on, which is longer than the grace but proves nothing on its own
    events:
      - clock.advance: 2m
  - tick: 4
    note: the pull wedges on a rebuilt pod already older than the grace, so the row fails with its operation preserved
    events:
      - pod.waiting[ImagePullBackOff]: {pod: {index: 0}, message: "manifest unknown"}
