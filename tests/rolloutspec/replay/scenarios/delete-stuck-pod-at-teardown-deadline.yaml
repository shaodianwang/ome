# A retired Instance whose pod is stuck Terminating on a node that is gone,
# under a force-delete policy, when the owner's teardown deadline elapses
# with the overdue clock. The deadline branch runs before the workload
# dispatch, so once it fires no force-delete evaluation happens: the
# finalizer lifts and the wedged pod is left to background GC.
scenario: delete-stuck-pod-at-teardown-deadline
arrows:
  - T-ready-scaledown
cells:
  - instance/Delete/Drain/pod.stuckTerminating/boundary@T-delete-teardown-deadline
  - instance/Delete/Drain/timer.forceDelete[overdueSlack]/boundary@T-delete-teardown-deadline
initial:
  spec:
    replicas: 2
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
    teardownDeadline: 10m
    forceDelete: {overdueSlack: 1m, nodeUnreachableThreshold: 5m}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true, node: node-0}
    - {index: 1, ready: true, serving: true, routed: true, node: node-1}
timeline:
  - tick: 1
    note: the operator halves the replica count, and the retired Instance is admitted into a Delete operation
    events:
      - spec.replicasDown: {to: 1}
  - tick: 2
    note: the retired pod leaves rotation, so the wave deletes it
    events:
      - endpoint.rotationOut[source]: {pod: {index: 1}}
  - tick: 3
    note: the kubelet stops acknowledging the deletion, the overdue clock elapses, and the owner's teardown deadline has elapsed too; the release runs ahead of the dispatch, so no sweep runs and the wedged pod is left to background GC
    events:
      - pod.stuckTerminating: {pod: {index: 1}}
      - timer.forceDelete[overdueSlack]: {slack: 1s}
      - spec.teardown[deleted]: {}
      - timer.teardownDeadline: {slack: 1s}
  - tick: 4
    note: a late pass finds no owner left to act on
