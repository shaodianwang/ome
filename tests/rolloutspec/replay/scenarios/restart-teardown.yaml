# The owner is deleted while an Instance is repairing itself. Teardown reads
# the planned index set as empty, so the restarting row is a scale-down extra
# and the Delete Drain operation replaces the Restart.
scenario: restart-teardown
arrows:
  - T-ready-restart
  - T-restart-teardown
  - T-delete-done
cells:
  - instance/Restart/Drain/spec.teardown[deleted]/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the owner is deleted, so the repairing Instance is drained instead
    events:
      - spec.teardown[deleted]: {}
  - tick: 4
    note: the rebuilt pod is gone and the row leaves the owner's status
    events:
      - pod.deleted[source]: {pod: {index: 0}}
