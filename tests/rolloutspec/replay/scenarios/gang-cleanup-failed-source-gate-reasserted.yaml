# A gang surge pair fails on its deadline and the abandon claims the
# cleanup marker. A source member then reports Unschedulable, the source
# leader's gate is re-asserted, a source member runs unready for minutes
# and a retired member runs without becoming ready: no source pod is pending
# placement and a row nobody owns records no hold, the source's gate was
# never withdrawn on the abandon path, and readiness on either gang is read
# by nobody while the retirement runs.
scenario: gang-cleanup-failed-source-gate-reasserted
arrows:
  - T-empty-gang-surge-target
  - T-gangtarget-deadline
  - T-failedgangtarget-cleanup-failed
  - T-failedgangsurge-reset
cells:
  - instance/Failed/GangSurge/pod.unschedulable[source]/before
  - instance/Failed/GangSurge/pod.runningNotReady[source]/before
  - instance/Failed/GangSurgeTargetCleanup/pod.servingOn[source]/before
  - instance/Failed/GangSurgeTargetCleanup/pod.runningNotReady[target]/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: the replacement is still not Ready when the deadline elapses, so both halves of the pair are stamped Failed with their operations preserved
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the abandon claims the cleanup marker and deletes the retired replacement's members, and the retired leader comes up on its way out
    events:
      - pod.containersReady[target]: {pod: {index: 1, runner: leader}}
  - tick: 7
    note: a source worker reports Unschedulable and loses readiness, the source leader's gate is re-asserted, and two minutes pass with the source worker and the retired leader running unready; nothing reads any of it
    events:
      - pod.unschedulable[source]: {pod: {index: 0, runner: worker}}
      - pod.containersNotReady[source]: {pod: {index: 0, runner: worker}}
      - pod.servingOn[source]: {pod: {index: 0, runner: leader}}
      - clock.advance: 2m
  - tick: 8
    note: the retired replacement's members are gone, so the marker row is removed and the source is reset Ready on its running revision without its pods being consulted
    events:
      - pod.deleted[target]: {pod: {index: 1, runner: leader}}
      - pod.deleted[target]: {pod: {index: 1, runner: worker}}
