# A scale-down wave resumed from persisted status: the retired row already
# carries Phase Deleting with its Delete/Drain operation while its pod still
# serves. The resumed wave re-selects the row through the Delete-owned pool,
# drains the pod, deletes it and removes the row once it is gone.
scenario: delete-resumed-from-status
arrows:
  - T-delete-done
cells:
  - instance/Delete/Drain/ctrl.crash/before
  - instance/Delete/Drain/pod.deleted[source]/boundary@T-delete-done
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - index: 1
      phase: Deleting
      runningRevision: current
      readySince: 0s
      operation: {type: Delete, step: Drain}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
    - {index: 1, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the resumed wave finds the retired row Delete-owned and takes its pod out of rotation
  - tick: 2
    note: the pod leaves rotation, which is the drain the delete waits on
    events:
      - endpoint.rotationOut[source]: {pod: {index: 1}}
  - tick: 3
    note: the drained pod is gone, so the row is removed with it
    events:
      - pod.deleted[source]: {pod: {index: 1}}
  - tick: 4
    note: nothing is left in flight
