# The surge pod of a migration at SurgePending is deleted from outside and
# its kubelet never acknowledges. The drive's force-delete loop runs over the
# source pods only, so the wedged surge pod is left where it is; expiry
# unpins the index and the scale-down pipeline takes it over.
scenario: migrate-surge-pending-stuck-surge-left
arrows:
  - T-ready-migrate
  - T-empty-migrate-target
  - T-migrate-deadline-restore
  - T-migratetarget-expired
cells:
  - instance/Migrate/SurgeTarget/pod.stuckTerminating/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    migrationMode: Auto
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
timeline:
  - tick: 1
    note: the index is planned and no row exists, so the Create pass opens the attempt
  - tick: 2
    note: the pod is bound, becomes Ready and enters rotation, so the row records a running revision on a known node
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-0}
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the operator asks the Instance off node-0, and the migrate pass admits the request and establishes the pair
    events:
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
  - tick: 4
    note: the surge pod is bound to node-1, deleted from outside and left with no kubelet behind it, so it still occupies its name and the drive waits
    events:
      - pod.scheduled[target]: {pod: {index: 1}, message: node-1}
      - pod.terminating[target]: {pod: {index: 1}}
      - pod.stuckTerminating: {pod: {index: 1}}
  - tick: 5
    note: the record's deadline elapses with the source still serving, so the move is closed, the source is restored and the surge index is unpinned
    events:
      - timer.migrationDeadline: {slack: 1s}
  - tick: 6
    note: the unpinned index is no longer planned, so the scale-down wave commits Phase Deleting on it and the wedged pod is now its to wait on
