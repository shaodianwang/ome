# The roll is pinned back to the revision the source runs while the
# replacement is not yet runtime-ready: the surge is abandoned like any
# superseded one, and releasing the pin afterwards re-aims the roll.
scenario: surge-rollback-abandons-unready-replacement
arrows:
  - T-ready-surge
  - T-surge-abandon-superseded
cells:
  - instance/Update/Surge/spec.rollbackTarget[set]/before
  - instance/Update/Surge/spec.rollbackTarget[clear]/after@T-surge-abandon-superseded
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the roll is pinned back to the stored starting revision while the replacement is not runtime-ready, so the surge unwinds like a superseded one
    events:
      - spec.rollbackTarget[set]: {image: registry.example.com/runtime:v1}
  - tick: 5
    note: the abandoned replacement is gone, so the source is reset to Ready on the revision it never stopped running
    events:
      - pod.deleted[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 6
    note: the pin is released, so the roll target is the rendered template again and a fresh surge opens from Ready
    events:
      - spec.rollbackTarget[clear]: {}
