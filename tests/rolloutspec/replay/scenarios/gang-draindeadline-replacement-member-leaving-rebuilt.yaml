# A gang source fails on its deadline at the drain step with a replacement
# member short of readiness, and a replacement member is then deleted from
# outside while it still reports ContainersReady. A member being deleted is
# gone for the hand-over whatever its readiness says, so the continuation
# reads the replacement as short and does not delete the source behind it;
# it rebuilds the member once its name is free, and the hand-over finishes
# when the rebuilt member comes up.
# Once the member is gone the loss counts the failed attempt on the pinned
# revision's ladder; when the backoff is due the member is rebuilt under the
# same name, the source re-arms under a fresh deadline, and the hand-over
# finishes when the rebuilt member comes up.
scenario: gang-draindeadline-replacement-member-leaving-rebuilt
arrows:
  - T-empty-gang-surge-target
  - T-gangtarget-ready
  - T-surgedrain-deadline
  - T-failedgangsurgedrain-rearm
  - T-failedgangtarget-ready
  - T-failedgangsurgedrain-complete
intentional: >-
  a replacement member lost after the hand-over counts the failed attempt
  on the pinned revision's ladder and is rebuilt under the next one
cells:
  - instance/Failed/GangSurgeDrain/pod.terminating[target]/before
  - instance/Failed/GangSurgeDrain/pod.deleted[target]/before
  - instance/Failed/GangSurgeDrain/timer.retryAt/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    updateRetry: {maxAttempts: 3, initialDelay: 1m, maxDelay: 30m, multiplier: 2}
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: both replacement members report Ready and the leader enters rotation, so the source advances to the drain and leaves the serving gate
    events:
      - pod.ready[target]: {pod: {index: 1, runner: leader}}
      - pod.ready[target]: {pod: {index: 1, runner: worker}}
      - endpoint.rotationIn[target]: {pod: {index: 1, runner: leader}}
  - tick: 6
    note: the replacement worker's readiness regresses while the source is still published, so the pair is no longer fully serving
    events:
      - pod.containersNotReady[target]: {pod: {index: 1, runner: worker}}
  - tick: 7
    note: the deadline elapses with the replacement short, so the source is stamped Failed at its drain step and the marker Failed too, both operations kept
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 8
    note: the replacement worker comes back Ready and is then deleted from outside; a member being deleted is gone for the hand-over whatever its readiness says, so the continuation reads the replacement as short
    events:
      - pod.ready[target]: {pod: {index: 1, runner: worker}}
      - pod.terminating[target]: {pod: {index: 1, runner: worker}}
  - tick: 9
    note: the source leader leaves the routed Service; the drain does not delete the source pods behind a member that is going away
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
  - tick: 10
    note: the terminating member is gone; the loss counts the failed attempt on the pinned revision's ladder, the source stays Failed with its surge kept, and nothing is rebuilt under the attempt that died
    events:
      - pod.deleted[target]: {pod: {index: 1, runner: worker}}
  - tick: 11
    note: the ladder's backoff is due, so the lost member is rebuilt under the same name at the pinned revision and the source re-arms for its next attempt under a fresh deadline with the retry counted on the operation
    events:
      - timer.retryAt: {slack: 1s}
  - tick: 12
    note: the source pods are gone and the rebuilt member reports Ready, so the replacement is promoted Ready on the pinned revision and the source row is removed
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
      - pod.ready[target]: {pod: {index: 1, runner: worker}}
