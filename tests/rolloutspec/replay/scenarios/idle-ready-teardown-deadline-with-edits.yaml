# A Ready Instance whose owner is deleted, with the teardown deadline
# elapsed, its pod gone and the pod template moved in the same
# observation. The finalizer release purges the owner and every row it
# carried; there is nothing left to roll or to rebuild.
scenario: idle-ready-teardown-deadline-with-edits
arrows:

cells:
  - instance/Ready/pod.deleted[source]/boundary@T-ready-teardown-deadline
  - instance/Ready/spec.revision/boundary@T-ready-teardown-deadline
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
    teardownDeadline: 10m
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the owner was deleted and its teardown deadline has elapsed as the pod disappears and the template moves; the release purges the owner and the row, so nothing is rolled or rebuilt
    events:
      - pod.deleted[source]: {pod: {index: 0}}
      - spec.revision: {image: registry.example.com/runtime:v2}
      - spec.teardown[deleted]: {}
      - timer.teardownDeadline: {slack: 1s}
  - tick: 3
    note: a late pass finds no owner left to act on
