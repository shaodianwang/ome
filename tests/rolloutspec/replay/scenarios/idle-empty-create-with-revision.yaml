# An index is added to the plan as the template moves. Nothing is pinned
# until the attempt stamps, so the new index is created at the target
# current at that moment while the index that exists rolls toward it.
scenario: idle-empty-create-with-revision
arrows:
  - T-empty-create
  - T-ready-surge
cells:
  - instance/Empty/spec.revision/boundary@T-empty-create
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true, node: node-0}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: a second index is added as the template moves; the first index surges toward the new template and the new index is created straight at it
    events:
      - spec.replicasUp: {to: 2}
      - spec.revision: {image: registry.example.com/runtime:v2}
