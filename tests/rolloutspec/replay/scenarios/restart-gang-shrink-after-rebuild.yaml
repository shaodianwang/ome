# A gang repair whose Phase B has rebuilt all three members when the width
# is narrowed by a worker. Phase A deletes only old incarnations and Phase
# B only fills missing names, so the extra bumped-incarnation worker stays
# live, and Phase C waits on it and marks it serving before the promote.
scenario: restart-gang-shrink-after-rebuild
arrows:
  - T-ready-restart
  - T-restart-ready
cells:
  - instance/Restart/Drain/spec.gangWidth[shrink]/before
initial:
  spec:
    replicas: 1
    workers: 2
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, runner: leader, ready: true, serving: true, routed: true}
    - {index: 0, runner: worker, ordinal: 0, ready: true, serving: true}
    - {index: 0, runner: worker, ordinal: 1, ready: true, serving: true}
timeline:
  - tick: 1
    note: the Ready gang is steady on its three serving members
  - tick: 2
    note: a worker is deleted out from under the Instance, so the repair opens a Restart over the gang and takes the leader out of serving
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: worker, ordinal: 1}}
  - tick: 3
    note: the leader leaves rotation, so the drain deletes the old members
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
  - tick: 4
    note: the old members are gone, so the gang is rebuilt at the bumped incarnation
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker, ordinal: 0}}
  - tick: 5
    note: the gang narrows by a worker after the rebuild; Phase B only fills missing names, so the extra rebuilt worker stays live and the PodGroup alone is re-reconciled
    events:
      - spec.gangWidth[shrink]: {to: 1}
  - tick: 6
    note: every rebuilt member reports Ready, the extra worker included; Phase C marks them all serving and the repair promotes the row
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker, ordinal: 0}}
      - pod.ready[source]: {pod: {index: 0, runner: worker, ordinal: 1}}
