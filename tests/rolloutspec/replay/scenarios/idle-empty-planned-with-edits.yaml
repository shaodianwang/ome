# A new index is planned on the pass that also reads a changed operator
# configuration and a cache one event behind. Nothing about either is
# persisted on a row that does not exist: the index plans against the new
# values, and a cache that lags cannot hide a row that was never written,
# so the Create pass materializes it.
scenario: idle-empty-planned-with-edits
arrows:
  - T-empty-create
cells:
  - instance/Empty/config.changed[stuckPodGrace]/before
  - instance/Empty/ctrl.staleRead/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod and the second index is not planned
  - tick: 2
    note: the replica count grows as the stuck-pod grace changes and the cache lags one event behind; the empty slot plans against the new values and the Create pass materializes it
    events:
      - spec.replicasUp: {to: 2}
      - config.changed[stuckPodGrace]: {config: {stuckPodGrace: 1m}}
      - ctrl.staleRead: {}
  - tick: 3
    note: the new pod reports Ready and the Instance promotes
    events:
      - pod.ready[source]: {pod: {index: 1}}
