# A gang's recreate is ended by the gang verdict with the Update operation
# kept, and what its members report about their runner, their readiness
# over time and their identity decides nothing: restart evidence is read
# only on a Ready row, no clock runs on a Failed row, no promote waits on an
# ended attempt, and pod identity is re-read from the live list; nothing
# re-drives the row.
scenario: recreate-gang-conflict-failed-runner-observations
arrows:
  - T-ready-recreate
cells:
  - instance/Failed/Drain/pod.containerRestart/before
  - instance/Failed/Drain/pod.runningNotReady[source]/before
  - instance/Failed/Drain/timer.minReady/before
  - instance/Failed/Drain/pod.uidRotated/before
intentional: >-
  a recreate the gang verdict ended stays Failed with its operation kept:
  nothing this controller does frees a name another controller holds, so no
  pass re-drives it at the pinned revision; it resumes through a revision
  other than the pinned one or the reset mailbox
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: RecreatePod
    containerName: ome-container
    minReadySeconds: 30
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members are bound to node-0 and report Ready, and the leader enters rotation, and the promote waits on the availability window
    events:
      - pod.scheduled[source]: {pod: {index: 0, runner: leader}, message: node-0}
      - pod.scheduled[source]: {pod: {index: 0, runner: worker}, message: node-0}
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the availability window elapses, so the Instance promotes as one
    events:
      - clock.advance: 1m
  - tick: 4
    note: the pod template changes and the strategy rebuilds the gang in place of surging, so Phase A takes the serving gates down
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 5
    note: the leader leaves rotation, so Phase A deletes both members
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
  - tick: 6
    note: both members are gone, so Phase B rebuilds the gang at the bumped incarnation behind its existing PodGroup
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
  - tick: 7
    note: the group's controller reference is rewritten to another owner, which is a name this controller may not write, so the gang verdict stamps the Instance Failed with the recreate kept rather than parked
    events:
      - gang.podGroup[OwnershipConflict]: {instance: 0}
  - tick: 8
    note: the ended attempt's leader is bound, its containers come up, drop out of readiness again and its runner restarts, none of which anything reads on a row no pass re-drives
    events:
      - pod.scheduled[source]: {pod: {index: 0, runner: leader}, message: node-1}
      - pod.containersReady[source]: {pod: {index: 0, runner: leader}}
      - pod.containersNotReady[source]: {pod: {index: 0, runner: leader}}
      - pod.containerRestart: {pod: {index: 0, runner: leader}, message: Error}
  - tick: 9
    note: a pass with nothing new writes nothing
  - tick: 10
    note: two minutes pass, longer than the stuck-pod grace and the minReadySeconds window, while the leader runs without readiness; no clock runs on a Failed row and no promote waits on an ended attempt
    events:
      - clock.advance: 2m
  - tick: 11
    note: a further pass with nothing new writes nothing
  - tick: 12
    note: the worker reappears under a new UID, and pod identity is re-read from the live list; nothing re-drives the row
    events:
      - pod.uidRotated: {pod: {index: 0, runner: worker}}
  - tick: 13
    note: a further pass with nothing new writes nothing
