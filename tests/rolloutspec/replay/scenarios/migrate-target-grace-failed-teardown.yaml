# The owner is deleted while a migration surge row stands Failed with its
# Migrate pin kept. Teardown treats the surge index like any other observed
# index: the Delete operation replaces the kept Migrate pin on both rows in
# one pass, the deletion observed again on the next pass moves nothing, and
# the pair drains and leaves the owner's status.
scenario: migrate-target-grace-failed-teardown
arrows:
  - T-ready-migrate
  - T-empty-migrate-target
  - T-failedmigratetarget-teardown
  - T-migrate-teardown
  - T-delete-done
cells:
  - instance/Failed/MigrateTarget/spec.teardown[deleted]/before
  - instance/Failed/MigrateTarget/spec.teardown[deleted]/after@T-failedmigratetarget-teardown
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    migrationMode: Auto
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    unschedulableGrace: 10m
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
timeline:
  - tick: 1
    note: the index is planned and no row exists, so the Create pass opens the attempt
  - tick: 2
    note: the pod is bound, becomes Ready and enters rotation, so the row records a running revision on a known node
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-0}
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the operator asks the Instance off node-0, and the migrate pass admits the request and establishes the pair
    events:
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
  - tick: 4
    note: the scheduler finds the surge no node off node-0, so the scheduler hold is recorded on the surge row and both pair deadlines park
    events:
      - pod.unschedulable[target]: {pod: {index: 1}}
  - tick: 5
    note: the hold outlasts the configured grace, so the escalation stamps the surge row Failed with its Migrate pin kept while the source keeps serving under its own pin
    events:
      - clock.advance: 11m
  - tick: 6
    note: the owner's deletion begins, so every observed index is a scale-down extra and the Delete stamp replaces the kept pin on both rows
    events:
      - spec.teardown[deleted]: {}
  - tick: 7
    note: the deletion is observed again and the Delete stamp was committed once; the drain takes the source's serving gate down and issues the unrouted surge pod's delete
    events:
      - spec.teardown[deleted]: {}
  - tick: 8
    note: the source leaves rotation, so the drain issues its delete
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 9
    note: both pods are gone, so both rows leave the owner's status
    events:
      - pod.deleted[source]: {pod: {index: 0}}
      - pod.deleted[target]: {pod: {index: 1}}
