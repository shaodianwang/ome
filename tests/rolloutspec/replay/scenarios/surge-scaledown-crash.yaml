# The replica count drops while both Instances surge, with the retired
# index's replacement reporting Ready and the controller restarting on that
# pass and the next; the delete wave owns the retired index from its stamp.
scenario: surge-scaledown-crash
arrows:
  - T-ready-surge
  - T-surge-scaledown
  - T-delete-done
cells:
  - instance/Update/Surge/pod.ready[target]/boundary@T-surge-scaledown
  - instance/Update/Surge/ctrl.crash/boundary@T-surge-scaledown
  - instance/Update/Surge/pod.ready[target]/after@T-surge-scaledown
  - instance/Update/Surge/ctrl.crash/after@T-surge-scaledown
  - instance/Update/Surge/spec.replicasDown/after@T-surge-scaledown
  - instance/Update/Surge/pod.deleted[source]/after@T-surge-scaledown
initial:
  spec:
    replicas: 2
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
    - {index: 1, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the pod template changes, so both Instances surge a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 2
    note: the operator halves the replica count as the retired index's replacement reports Ready and the controller restarts; the wave stamps Deleting over the surge and the readiness advances nothing
    events:
      - spec.replicasDown: {to: 1}
      - pod.ready[target]: {pod: {index: 1, ordinal: 1}}
      - ctrl.crash: {}
  - tick: 3
    note: the retired index is on its delete; readiness re-observed, a restart and the same replica count re-applied change nothing on it
    events:
      - pod.ready[target]: {pod: {index: 1, ordinal: 1}}
      - ctrl.crash: {}
      - spec.replicasDown: {to: 1}
  - tick: 4
    note: the retired source leaves rotation, which is the drain the delete waits on
    events:
      - endpoint.rotationOut[source]: {pod: {index: 1, ordinal: 0}}
  - tick: 5
    note: both of the retired index's slots are gone, so the row is removed; the surviving Instance keeps surging
    events:
      - pod.deleted[source]: {pod: {index: 1, ordinal: 0}}
      - pod.deleted[target]: {pod: {index: 1, ordinal: 1}}
