# A repair parked at Failed on the Component's second revision, when the
# operator pins the roll back to the stored first one. The resolved target
# is no longer the running revision, so the row re-drives exactly as a
# corrective revision does, with a fresh recreate attempt draining the
# wedged pod; releasing the pin is that attempt's to read.
scenario: restart-parked-repair-rollback-roll
arrows:
  - T-ready-recreate
  - T-drain-ready
  - T-ready-restart
  - T-restart-stuck
  - T-failedrepair-corrective
cells:
  - instance/Failed/Repair/spec.rollbackTarget[set]/before
  - instance/Failed/Repair/spec.rollbackTarget[clear]/after@T-failedrepair-corrective
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod template changes, so the roll drains the pod for a recreate
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the pod leaves rotation and is gone, so the rebuild lands at the new revision
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 4
    note: the rebuilt pod reports Ready and the Instance promotes onto the second revision
    events:
      - pod.ready[target]: {pod: {index: 0}}
  - tick: 5
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 6
    note: the rebuilt pod crash-loops and is older than the grace when the wedge is read, so the row fails with its operation preserved
    events:
      - clock.advance: 2m
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 0}, message: "back-off restarting failed container"}
  - tick: 7
    note: the operator pins the roll back to the first revision; the running revision is no longer the target, so the roll replaces the parked repair with a fresh recreate attempt and drains the wedged pod
    events:
      - spec.rollbackTarget[set]: {image: registry.example.com/runtime:v1}
  - tick: 8
    note: the pin is released and the wedged pod is gone; the row is the fresh attempt's, which retargets back to the rendered template and rebuilds
    events:
      - spec.rollbackTarget[clear]: {}
      - pod.deleted[source]: {pod: {index: 0}}
