# Readiness, gate and endpoint signals on the SOURCE pods while the replacement
# gang is still forming. The marker reads none of them, a tick with nothing
# changed writes nothing, and the surge completes as if they never came.
scenario: gang-target-source-signals-ignored
arrows:
  - T-empty-gang-surge-target
  - T-surgedrain-gang-complete
  - T-gangtarget-ready
cells:
  - instance/Update/GangSurgeTarget/pod.containersReady[source]/before
  - instance/Update/GangSurgeTarget/pod.ready[source]/before
  - instance/Update/GangSurgeTarget/pod.servingOn[source]/before
  - instance/Update/GangSurgeTarget/pod.servingOff[source]/before
  - instance/Update/GangSurgeTarget/endpoint.rotationIn[source]/before
  - instance/Update/GangSurgeTarget/ctrl.resync/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: a tick with nothing changed re-derives the same surge from the live pods and writes nothing
  - tick: 6
    note: the source re-reports its readiness, its gates move both ways and the worker shows up as an endpoint; the marker is untouched
    events:
      - pod.containersReady[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - pod.servingOn[source]: {pod: {index: 0, runner: leader}}
      - pod.servingOff[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: worker}}
  - tick: 7
    note: the replacement gang reports Ready, so the source advances to the drain and leaves rotation
    events:
      - pod.ready[target]: {pod: {index: 1, runner: leader}}
      - pod.ready[target]: {pod: {index: 1, runner: worker}}
  - tick: 8
    note: the leader's endpoint goes not-ready, which is the guard the drain waits on, so the source pods are deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
  - tick: 9
    note: the source pods are gone, so its row is removed and the replacement index is promoted as the Instance
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
