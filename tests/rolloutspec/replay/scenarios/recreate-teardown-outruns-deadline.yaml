# The owner is deleted while a recreate's rebuilt pod comes up, with its
# teardown deadline already past when the deletion is first observed and the
# pod reporting Ready in the same pass. The release is phase-blind: the
# finalizer check purges the owner and the row ahead of any teardown wave,
# whatever the pod reports, and a late pass finds no owner left.
scenario: recreate-teardown-outruns-deadline
arrows:
  - T-ready-recreate
cells:
  - instance/Update/Drain/timer.teardownDeadline/before
  - instance/Update/Drain/pod.ready[source]/boundary@T-drain-teardown-deadline
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    teardownDeadline: 10m
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the pod is bound, becomes Ready and enters rotation
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-0}
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the pod template changes and the strategy rebuilds in place of surging, so Phase A takes the serving gate down
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the source leaves rotation, which releases the drain guard and issues the delete
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 5
    note: the source is gone, so Phase B rebuilds it at the bumped incarnation
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 6
    note: the owner was deleted and its teardown deadline has elapsed before this pass observes either, while the rebuilt pod reports Ready, so the deadline check releases the owner ahead of any teardown wave and the row goes with it
    events:
      - spec.teardown[deleted]: {}
      - timer.teardownDeadline: {slack: 1s}
      - pod.ready[source]: {pod: {index: 0}}
  - tick: 7
    note: a late pass finds no owner left to act on
