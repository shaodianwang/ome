# A surge wedges and the revision is held; a corrected image re-drives the
# Instance through the gate, and a second correction a pass later lands on
# the surge that is already in flight rather than on a Failed row.
scenario: failed-corrective-then-reedit
arrows:
  - T-ready-surge
  - T-surge-stuck
  - T-failed-corrective-surge
cells:
  - instance/Failed/gate.allow/boundary@T-failed-corrective-surge
  - instance/Failed/spec.revision/after@T-failed-corrective-surge
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true, node: node-0}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the replacement is still booting two minutes on, which is longer than the grace but proves nothing on its own
    events:
      - clock.advance: 2m
  - tick: 4
    note: the pull wedges on a replacement already older than the grace, so the escalation disposes the surge and holds the revision
    events:
      - pod.waiting[ImagePullBackOff]: {pod: {index: 0, ordinal: 1}, message: "manifest unknown"}
  - tick: 5
    note: the operator corrects the image; the gate admits the Instance the trigger selected and the corrective surge starts
    events:
      - spec.revision: {image: registry.example.com/runtime:v3}
  - tick: 6
    note: the operator corrects the image again, and the edit lands on a surge in flight, not on a Failed row
    events:
      - spec.revision: {image: registry.example.com/runtime:v4}
  - tick: 7
    note: the wedged replacement is gone, so the superseded surge is abandoned and the roll re-surges toward the latest correction
    events:
      - pod.deleted[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 8
    note: the surge toward the latest correction starts
