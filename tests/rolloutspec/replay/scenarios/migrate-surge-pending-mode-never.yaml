# The migration mode is set to Never while a live pair stands at
# SurgePending. The mode plans no migrate pass, so nothing drives the pair;
# the Create pass then reads the source as an ordinary Instance whose pods
# are all serving and promotes it, which clears the source's Migrate pin
# while the record still names it, and the plan mints an extra index beside
# the pinned surge. The record's deadline closes the move through the surge
# pin alone, and the scale-down pipeline tears down the surge and the extra
# index.
scenario: migrate-surge-pending-mode-never
arrows:
  - T-ready-migrate
  - T-empty-migrate-target
  - T-migratetarget-expired
cells:
  - instance/Migrate/CreateSurge/spec.policyTuning[migrationPolicy]/before
  - instance/Migrate/SurgeTarget/spec.policyTuning[migrationPolicy]/before
intentional: >-
  the Create pass promote carries no ownership precondition, so a mode flip
  to Never lets it clear the Migrate pin of a source the record still drives;
  the trace records that promote and the extra index it leaves behind
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    migrationMode: Auto
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
timeline:
  - tick: 1
    note: the index is planned and no row exists, so the Create pass opens the attempt
  - tick: 2
    note: the pod is bound, becomes Ready and enters rotation, so the row records a running revision on a known node
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-0}
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the operator asks the Instance off node-0, and the migrate pass admits the request and establishes the pair
    events:
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
  - tick: 4
    note: the surge binds off node-0 and reports ContainersReady, so the drive marks it serving and waits on its rotation and availability gates
    events:
      - pod.scheduled[target]: {pod: {index: 1}, message: node-1}
      - pod.containersReady[target]: {pod: {index: 1}}
  - tick: 5
    note: the migration mode is set to Never, so no migrate pass runs and the Create pass promotes the source, clearing its Migrate pin while the record still drives the pair
    events:
      - spec.policyTuning[migrationPolicy]: {value: Never}
  - tick: 6
    note: a tick with nothing changed plans the unpinned source as an ordinary Instance, so the plan mints an extra index beside the pinned surge and the Create pass materializes it
  - tick: 7
    note: the record's deadline elapses, so the expiry clears the surge pin and closes the record with the source already Ready on its running revision
    events:
      - timer.migrationDeadline: {slack: 1s}
  - tick: 8
    note: the unpinned surge index and the extra index are beyond the desired set, so the scale-down pipeline commits Phase Deleting on both
