# The source of a surge in its drain step is replaced by a same-name pod
# under a new UID. Pods are identified by ordinal slot and revision-hash
# label rather than by UID, so the rotated pod at the source ordinal is
# still the source: it is drained and deleted, and the promote lands once
# it is gone.
scenario: surgedrain-source-uid-rotated
arrows:
  - T-ready-surge
  - T-surge-target-ready
  - T-surgedrain-promote
cells:
  - instance/Update/SurgeDrain/pod.uidRotated/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement is serving and in rotation beside the source, so the step advances and the source leaves the serving gate
    events:
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 5
    note: the draining source reappears under a new UID, fresh and out of every Service, so the drain reads converged and the pod at the source ordinal is deleted
    events:
      - pod.uidRotated: {pod: {index: 0, ordinal: 0}}
  - tick: 6
    note: the rotated source is gone and the Instance promotes onto the replacement's slot
    events:
      - pod.deleted[source]: {pod: {index: 0, ordinal: 0}}
