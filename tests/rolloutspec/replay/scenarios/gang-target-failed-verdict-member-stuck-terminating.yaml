# The replacement gang's PodGroup is taken over by another controller while
# the surge is in flight, so the marker is Failed with its operation kept
# and the source keeps driving the build. The foreign group is deleted, a
# member's node goes unreachable and the member is left Terminating with no
# kubelet behind it: the name is held, node-death evidence reaches the row
# only through the force-delete sweep, and the build refills the name from
# the absence the sweep leaves.
scenario: gang-target-failed-verdict-member-stuck-terminating
arrows:
  - T-empty-gang-surge-target
  - T-gangtarget-ready
  - T-failedgangtarget-ready
cells:
  - instance/Failed/GangSurgeTarget/pod.nodeLost[UnreachableTaint]/before
  - instance/Failed/GangSurgeTarget/pod.terminating[target]/before
  - instance/Failed/GangSurgeTarget/pod.stuckTerminating/before
  - instance/Failed/GangSurgeTarget/timer.forceDelete[nodeUnreachable]/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    containerName: ome-container
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    forceDelete: {overdueSlack: 1m, nodeUnreachableThreshold: 5m}
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: the replacement group's controller reference is rewritten to another owner; the gang verdict ends the marker alone, Failed with its operation kept, while the source stays Updating and keeps driving the surge
    events:
      - gang.podGroup[OwnershipConflict]: {instance: 1}
  - tick: 6
    note: the foreign group is deleted from outside; the surge index is pinned in the plan, so the PodGroup pass restores the group and the names are no longer withheld
    events:
      - gang.podGroup[Deleted]: {instance: 1}
  - tick: 7
    note: the replacement worker is bound and its node then stops reporting; the evidence is on the Node, and nothing on the row reads it yet
    events:
      - pod.scheduled[target]: {pod: {index: 1, runner: worker}, message: node-1}
      - pod.nodeLost[UnreachableTaint]: {pod: {index: 1, runner: worker}}
  - tick: 8
    note: the worker is deleted from outside and left Terminating with no kubelet to finish it; it still holds its name, so nothing is refilled and the source's pass waits
    events:
      - pod.terminating[target]: {pod: {index: 1, runner: worker}}
      - pod.stuckTerminating: {pod: {index: 1, runner: worker}}
  - tick: 9
    note: the node has been unreachable past the threshold, so the sweep force-deletes the stuck member on its own evidence and the build refills the name from the absence
    events:
      - timer.forceDelete[nodeUnreachable]: {slack: 1s}
  - tick: 10
    note: both members report Ready and the leader enters rotation, so the source advances to the drain and leaves the serving gate
    events:
      - pod.ready[target]: {pod: {index: 1, runner: leader}}
      - pod.ready[target]: {pod: {index: 1, runner: worker}}
      - endpoint.rotationIn[target]: {pod: {index: 1, runner: leader}}
  - tick: 11
    note: the source leader leaves the routed Service, so the source pods are deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
  - tick: 12
    note: the source pods are gone, so the Failed marker is promoted Ready on the pinned revision and the source row is removed
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
