# A single-pod recreate attempt parks: the rebuilt pod is still booting when
# the deadline elapses, the ladder counts the wave and the attempt is parked
# with the row Failed. The pod then reports runtime-ready, then Ready. A set
# parked before its promotion carries no serving gate and is promoted only
# by a later attempt: the row keeps Failed with the attempt parked, the
# ladder keeps its count, and the block coming due replaces the pod.
scenario: parked-single-set-ready-not-promoted
arrows:
  - T-ready-recreate
  - T-drain-deadline
  - T-failedparked-retry
cells:
  - instance/Failed/Parked/pod.containersReady[source]/before
  - instance/Failed/Parked/pod.ready[source]/before
  - instance/Failed/Parked/timer.retryAt/before
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 1h, maxDelay: 2h, multiplier: 2}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true, node: node-0}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod template changes, so the roll drains the pod for a recreate
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the pod leaves rotation and is deleted, so the roll recreates it at the new revision
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, ordinal: 0}}
      - pod.deleted[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 4
    note: the rebuilt pod is still booting when the deadline elapses; the ladder counts the wave and the attempt is parked with the row Failed
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 5
    note: the rebuilt pod reports runtime-ready; the set carries no serving gate, so the row keeps Failed with the attempt parked and nothing promotes it
    events:
      - pod.containersReady[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 6
    note: the pod reports Ready; PodReady adds nothing the parked reading does not take from ContainersReady and the serving gate, and the ladder still counts one wave
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 7
    note: the block comes due; the gate admits and a fresh recreate attempt with a new incarnation replaces the parked one
    events:
      - timer.retryAt: {slack: 1s}
