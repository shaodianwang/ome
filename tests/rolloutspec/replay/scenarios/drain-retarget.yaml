# A second target lands while Phase A is still draining. The recreate stamp
# keys its idempotency on the target revision, so the new one falls through
# it: the Incarnation is bumped a second time, the operation is restamped,
# and the drain restarts against the abandoned incarnation.
scenario: drain-retarget
arrows:
  - T-ready-recreate
  - T-drain-retarget
cells:
  - instance/Update/Drain/spec.revision/before
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the pod becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the pod template changes and the strategy rebuilds in place of surging
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the pod stays published, so Phase A holds on the drain
  - tick: 5
    note: a further target lands mid-drain, so the roll reopens at the new one
    events:
      - spec.revision: {image: registry.example.com/runtime:v3}
