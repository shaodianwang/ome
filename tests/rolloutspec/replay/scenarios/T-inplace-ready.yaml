# An image-only template change under InPlaceIfPossible: the running pod is
# patched rather than replaced, and the Instance promotes once the runtime
# reports the new image.
scenario: T-inplace-ready
arrows:
  - T-ready-inplace
  - T-inplace-ready
cells:
  - instance/Ready/spec.revision/boundary@T-ready-inplace
  - instance/Update/InPlace/pod.ready[target]/boundary@T-inplace-ready
initial:
  spec:
    replicas: 1
    strategy: InPlaceIfPossible
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the pod becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: only the image changed, so the update is eligible to run in place
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the patch lands and the pod reports Ready while still on the old image
    events:
      - pod.ready[target]: {pod: {index: 0}}
  - tick: 5
    note: the kubelet has rolled the container, so the runtime reports the new image
    events:
      - pod.ready[target]: {pod: {index: 0}}
      - endpoint.rotationIn[target]: {pod: {index: 0}}
  - tick: 6
    note: the transition marker is observed and the roll converges
  - tick: 7
    note: nothing is left in flight
