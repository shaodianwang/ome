# An image-only template change under InPlaceIfPossible: the running pod is
# patched rather than replaced, and the Instance promotes once the runtime
# reports the new image.
scenario: T-inplace-ready
arrows:
  - T-ready-inplace
  - T-inplace-ready
cells:
  - instance/Ready/spec.revision/boundary@T-ready-inplace
  - instance/Update/InPlace/pod.ready[target]/boundary@T-inplace-ready
intentional: >-
  the in-place patch waits for the source to leave its per-revision routed
  Service, which is the drain the strategy performs before rewriting a
  running pod
initial:
  spec:
    replicas: 1
    strategy: InPlaceIfPossible
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the pod becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: only the image changed, so the update is eligible to run in place
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the source leaves rotation and reports Ready, so the transition marker is written
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
      - pod.ready[target]: {pod: {index: 0}}
  - tick: 5
    note: the image patch lands while the source is out of rotation
  - tick: 6
    note: the kubelet has rolled the container, so the runtime confirms the new image; the pod returns to rotation on the target revision, the Instance promotes and the marker is cleared
    events:
      - pod.ready[target]: {pod: {index: 0}}
  - tick: 7
    note: the endpoint follows the pod back into rotation on the target revision; nothing is left to do
    events:
      - endpoint.rotationIn[target]: {pod: {index: 0}}
  - tick: 8
    note: nothing is left in flight
