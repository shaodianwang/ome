# The roll is pinned back to the starting revision while the source
# drains: the unwind is restricted to the surge step, so the cycle finishes
# on the pinned revision and the pinned target rolls back from Ready.
scenario: surgedrain-rollback-finishes-cycle
arrows:
  - T-ready-surge
  - T-surge-target-ready
  - T-surgedrain-promote
  - T-ready-rollback-surge
cells:
  - instance/Update/SurgeDrain/spec.rollbackTarget[set]/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement is serving and in rotation, so the step advances and the source's serving gate is flipped off
    events:
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 5
    note: the roll is pinned back to the stored starting revision mid-drain; past the surge step the cycle finishes on its pin
    events:
      - spec.rollbackTarget[set]: {image: registry.example.com/runtime:v1}
  - tick: 6
    note: the source leaves rotation, so the drain has converged
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 7
    note: the drained source is gone and the surge promotes on the pinned revision
    events:
      - pod.deleted[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 8
    note: the row is Ready off the pinned roll target, so a fresh surge back to the starting revision opens
