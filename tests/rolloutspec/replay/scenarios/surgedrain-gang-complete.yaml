# A gang cannot surge inside its own index, so the replacement is a whole
# second index. Once its members are Ready the source drains, and when the
# source's pods are gone its row is finalized and removed outright rather
# than promoted: the replacement index becomes the Instance.
scenario: surgedrain-gang-complete
arrows:
  - T-empty-gang-surge-target
  - T-surgedrain-gang-complete
  - T-gangtarget-ready
cells:
  - instance/Update/SurgeDrain/pod.deleted[source]/before
  - instance/Update/GangSurgeTarget/pod.deleted[source]/before
intentional: >-
  the gang path drains its source by flipping the serving gate and deletes on
  the same pass; unlike the single-pod path it consults no EndpointSlice, so
  the leader is still published in the routed Service when its delete is
  issued
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: the replacement gang reports Ready, so the source advances to the drain
    events:
      - pod.ready[target]: {pod: {index: 1, runner: leader}}
      - pod.ready[target]: {pod: {index: 1, runner: worker}}
  - tick: 6
    note: the source's pods are gone, so its row is finalized and removed and the replacement index is the Instance
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
