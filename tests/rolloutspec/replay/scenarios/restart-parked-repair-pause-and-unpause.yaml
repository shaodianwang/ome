# A repair parked at Failed under the operator's pauses. A plain pause
# holds none of the repair's exits; a freeze suspends the restart pass, so
# the pod coming up under it resumes nothing; clearing the freeze only
# un-parks the pass, which writes the gate the resume starts with and
# leaves the row Failed until the pod is PodReady; the promote lands on the
# pass that finds it so.
scenario: restart-parked-repair-pause-and-unpause
arrows:
  - T-ready-restart
  - T-restart-stuck
  - T-failedrepair-resume
cells:
  - instance/Failed/Repair/spec.pauseTrue/before
  - instance/Failed/Repair/spec.pauseFreeze/before
  - instance/Failed/Repair/spec.unpause/before
  - instance/Failed/Repair/pod.ready[source]/before
intentional: >-
  a Failed row another verb still claims is that verb's: the Create pass
  does not re-prove a spent repair's set, so the restart pass's own promote
  is the only Ready stamp and the only InstanceReady announcement
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the rebuilt pod crash-loops and is older than the grace when the wedge is read, so the row fails with its operation preserved
    events:
      - clock.advance: 2m
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 0}, message: "back-off restarting failed container"}
  - tick: 4
    note: the operator pauses; the repair's exits hold under a plain pause and the wedged set gives them nothing to do
    events:
      - spec.pauseTrue: {}
  - tick: 5
    note: the pause becomes a freeze, which suspends the restart pass
    events:
      - spec.pauseFreeze: {}
  - tick: 6
    note: the pod reports ContainersReady under the freeze; only the status-only truth pass runs, so the resume waits
    events:
      - pod.containersReady[source]: {pod: {index: 0}}
  - tick: 7
    note: the freeze is cleared; the un-parked restart pass writes the gate the resume starts with and the row stays Failed until the pod is PodReady
    events:
      - spec.unpause: {}
  - tick: 8
    note: the kubelet folds the gate into PodReady and the resume promotes the row
    events:
      - pod.ready[source]: {pod: {index: 0}}
