# A repair parked at Failed resumes on a Component with a minReadySeconds
# window: the rebuilt pod reports ContainersReady and PodReady, the resume
# writes the gate, and the promote waits out the window, the last guard of
# its bar; the pass after the window elapses re-checks the set and stamps
# Ready.
scenario: restart-parked-repair-minready-window
arrows:
  - T-ready-restart
  - T-restart-stuck
  - T-failedrepair-resume
cells:
  - instance/Failed/Repair/timer.minReady/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
    minReadySeconds: 30
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the rebuilt pod crash-loops and is older than the grace when the wedge is read, so the row fails with its operation preserved
    events:
      - clock.advance: 2m
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 0}, message: "back-off restarting failed container"}
  - tick: 4
    note: the pod reports ContainersReady and PodReady, so the resume writes the gate and waits out the availability window before it promotes
    events:
      - pod.containersReady[source]: {pod: {index: 0}}
      - pod.ready[source]: {pod: {index: 0}}
  - tick: 5
    note: the window elapses; the pass re-checks that the set is complete, serving and PodReady and stamps Ready
    events:
      - clock.advance: 30s
