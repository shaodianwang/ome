# The replacement of a single-pod surge exits successfully before it was
# ever Ready. A Succeeded pod is as terminal as a Failed one, so the attempt
# deletes it at once with the exit on LastFailure while the source serves
# on. The deleted object is never collected here, and a deleting pod is
# skipped at the serving bar, so the source alone keeps the set at bar: the
# elapsed operation deadline is exempted as failed-while-serving and the
# step holds on the outstanding delete.
scenario: surge-replacement-succeeded-holds
arrows:
  - T-ready-surge
  - T-surge-deadline
cells:
  - instance/Update/Surge/pod.phaseTerminal[Succeeded]/before
intentional: >-
  a replacement that exited Succeeded is in a terminal phase and is replaced
  at once, as a pod of any in-flight update attempt is; with its delete never
  observed the serving source exempts the elapsed deadline, where the
  undeleted terminal pod used to disqualify the set and fail the attempt
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement exits with phase Succeeded, which is as terminal as Failed, so the attempt deletes it at once with the exit on LastFailure and the source stays in rotation
    events:
      - pod.phaseTerminal[Succeeded]: {pod: {index: 0, ordinal: 1}}
  - tick: 5
    note: a further pass finds the delete still outstanding and keeps holding
  - tick: 6
    note: the operation deadline elapses with the replacement still deleting; a deleting pod is skipped at the serving bar, so the source alone keeps the set at bar and the escalation exempts the row as failed-while-serving
    events:
      - timer.operationDeadline: {slack: 1s}
