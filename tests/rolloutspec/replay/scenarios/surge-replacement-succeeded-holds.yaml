# The replacement of a single-pod surge exits successfully before it was
# ever Ready. The phase is read nowhere on the surge path, so runtime
# readiness simply stays false and the step holds, with the source still in
# rotation, until the operation deadline ends the attempt.
scenario: surge-replacement-succeeded-holds
arrows:
  - T-ready-surge
  - T-surge-deadline
cells:
  - instance/Update/Surge/pod.phaseTerminal[Succeeded]/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement exits with phase Succeeded; the phase is read nowhere on the surge path, so the step holds with the source in rotation
    events:
      - pod.phaseTerminal[Succeeded]: {pod: {index: 0, ordinal: 1}}
  - tick: 5
    note: a further pass finds the replacement still not runtime-ready and keeps holding
  - tick: 6
    note: the operation deadline elapses with the replacement never Ready, so the escalation pass ends the attempt
    events:
      - timer.operationDeadline: {slack: 1s}
