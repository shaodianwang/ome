# A draining Instance's pod wedges on its image and the stuck-pod grace runs
# out on it. The fast escalation never arms for a Deleting row, so neither a
# RetryBlock nor a Failed stamp appears; the pod is drained and deleted.
scenario: delete-idle-stuck-grace
arrows:
  - T-ready-scaledown
  - T-delete-done
cells:
  - instance/Delete/Drain/pod.waiting[ImagePullBackOff]/before
  - instance/Delete/Drain/timer.stuckPodGrace/before
initial:
  spec:
    replicas: 2
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
    stuckPodGrace: 1m
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true, node: node-0}
    - {index: 1, ready: true, serving: true, routed: true, node: node-1}
timeline:
  - tick: 1
    note: the operator halves the replica count, and the retired Instance is admitted into a Delete operation
    events:
      - spec.replicasDown: {to: 1}
  - tick: 2
    note: the first drive takes the retired pod's serving gate down and finds it still in rotation, so the wave polls
  - tick: 3
    note: the retired pod's container comes back up and wedges pulling its image, which moves nothing on a draining row
    events:
      - pod.waiting[ImagePullBackOff]: {pod: {index: 1}, message: "manifest unknown"}
  - tick: 4
    note: the stuck-pod grace elapses on the wedged pod and no escalation reaches a Deleting row
    events:
      - timer.stuckPodGrace: {slack: 1s}
  - tick: 5
    note: the retired pod leaves rotation, so the wave issues the graceful delete
    events:
      - endpoint.rotationOut[source]: {pod: {index: 1}}
  - tick: 6
    note: the pod is gone and the row leaves the owner's status
    events:
      - pod.deleted[source]: {pod: {index: 1}}
  - tick: 7
    note: the Component is at rest with the retired Instance gone
