# The same two authorities in the other order. The surge reports its
# source out of the routed Service first, and the operator then pauses:
# the pause does not take a row already reporting a fact about the
# Instance, so the operation keeps SourceUnrouted for as long as the
# source is out. Once it is routed again the surge releases its token and
# the pause, which is still in force, takes the row in that same pass —
# release runs before record, so the row is never left unheld.
scenario: hold-unrouted-then-pause
cells:
  - instance/Update/Surge/endpoint.rotationOut[source]/before
  - instance/Update/Surge/spec.pauseTrue/before
  - instance/Update/Surge/endpoint.rotationIn[source]/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the pod template changes, so the rollout surges a replacement beside the source
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 2
    note: the source leaves the routed Service, and the surge is the first authority on the row
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 3
    note: the operator pauses, and the pause does not take a row already reporting SourceUnrouted
    events:
      - spec.pauseTrue: {}
  - tick: 4
    note: the source is still out of rotation, so the token stands and neither authority writes again
  - tick: 5
    note: the source is routed again, so the surge releases its own token and the pause, still in force, takes the row in the same pass
    events:
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 6
    note: the row reports the pause and neither authority writes again
