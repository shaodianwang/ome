# The owner is deleted while a gang's recreate stands ended by the gang
# verdict with the Update operation kept. Teardown ignores the failure: the
# Delete operation replaces the kept Update, the deletion observed again on
# the next pass moves nothing, and the gang drains and leaves the owner's
# status.
scenario: recreate-gang-conflict-failed-teardown
arrows:
  - T-ready-recreate
  - T-faileddrain-teardown
  - T-delete-done
cells:
  - instance/Failed/Drain/spec.teardown[deleted]/before
  - instance/Failed/Drain/spec.teardown[deleted]/after@T-faileddrain-teardown
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members are bound to node-0 and report Ready, and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.scheduled[source]: {pod: {index: 0, runner: leader}, message: node-0}
      - pod.scheduled[source]: {pod: {index: 0, runner: worker}, message: node-0}
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the pod template changes and the strategy rebuilds the gang in place of surging, so Phase A takes the serving gates down
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the leader leaves rotation, so Phase A deletes both members
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
  - tick: 5
    note: both members are gone, so Phase B rebuilds the gang at the bumped incarnation behind its existing PodGroup
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
  - tick: 6
    note: the group's controller reference is rewritten to another owner, which is a name this controller may not write, so the gang verdict stamps the Instance Failed with the recreate kept rather than parked
    events:
      - gang.podGroup[OwnershipConflict]: {instance: 0}
  - tick: 7
    note: the owner's deletion begins, so every observed index is a scale-down extra and the Delete operation replaces the kept recreate
    events:
      - spec.teardown[deleted]: {}
  - tick: 8
    note: the deletion is observed again and the Delete stamp was committed once; the drain finds nothing routed and issues both deletes
    events:
      - spec.teardown[deleted]: {}
  - tick: 9
    note: both members are gone, so the row leaves the owner's status
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
