# A rollback is pinned while an in-place patch converges, then released. The
# pin and its release each replace the roll target, so the in-flight patch
# retargets in place both times and promotes on the target it confirms.
scenario: inplace-rollback-retargets
arrows:
  - T-ready-inplace
  - T-inplace-retarget
  - T-inplace-ready
cells:
  - instance/Update/InPlace/spec.rollbackTarget[set]/before
  - instance/Update/InPlace/spec.rollbackTarget[clear]/before
initial:
  spec:
    replicas: 1
    strategy: InPlaceIfPossible
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the pod becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: only the image changed, so the update is eligible to run in place
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the pod leaves rotation, so the transition marker is written
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 5
    note: the image patch lands while the source is out of rotation
  - tick: 6
    note: the roll is pinned back to the stored v1 revision before the patch converged, so the in-flight patch retargets in place toward it
    events:
      - spec.rollbackTarget[set]: {image: registry.example.com/runtime:v1}
  - tick: 7
    note: the pin is released, so the patch retargets in place again toward the spec revision
    events:
      - spec.rollbackTarget[clear]: {}
  - tick: 8
    note: the kubelet has rolled the container onto the spec revision, so the runtime confirms it and the Instance promotes
    events:
      - pod.ready[target]: {pod: {index: 0}}
