# The owner is deleted while an Instance is still forming. A Pending row is
# a scale-down extra like any other under teardown, so it is committed to
# Phase Deleting with the Delete Drain operation in one status transaction.
scenario: pending-teardown
arrows:
  - T-pending-teardown
  - T-delete-done
cells:
  - instance/Pending/spec.teardown[deleted]/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
  rows:
    - {index: 0, phase: Pending, runningRevision: current}
  pods:
    - {index: 0, node: node-0}
timeline:
  - tick: 1
    note: the Instance is still forming and holds no operation
  - tick: 2
    note: the owner is deleted, so the forming Instance is drained
    events:
      - spec.teardown[deleted]: {}
  - tick: 3
    note: the forming pod is gone and the row leaves the owner's status
    events:
      - pod.deleted[source]: {pod: {index: 0}}
