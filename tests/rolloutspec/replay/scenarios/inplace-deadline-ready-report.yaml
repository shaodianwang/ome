# The patched pod's readiness report lands on the pass the operation deadline
# elapses: the pass confirms the image, restores serving and promotes, and the
# end-of-pass escalation, judging the observation the pass opened with, finds
# the promoted row carrying no operation and leaves it alone.
scenario: inplace-deadline-ready-report
arrows:
  - T-ready-inplace
  - T-inplace-ready
cells:
  - instance/Update/InPlace/timer.operationDeadline/boundary@T-inplace-ready
  - instance/Update/InPlace/pod.containersReady[source]/boundary@T-inplace-ready
initial:
  spec:
    replicas: 1
    strategy: InPlaceIfPossible
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the pod becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: only the image changed, so the update is eligible to run in place
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the pod leaves rotation, so the transition marker is written
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 5
    note: the image patch lands while the source is out of rotation
  - tick: 6
    note: the patched container reports ready on the pass the operation deadline elapses; the promote lands and the deadline stamp finds no operation to end
    events:
      - pod.containersReady[source]: {pod: {index: 0}}
      - timer.operationDeadline: {slack: 1s}
  - tick: 7
    note: the elapsed deadline is dropped; the row stays Ready on the new revision
