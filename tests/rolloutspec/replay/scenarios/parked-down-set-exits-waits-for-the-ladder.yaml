# A recreate attempt parked at Failed with its operation kept, its rebuilt
# pod never having come up, and the parked pod then exits with phase
# Failed. The dead pod changes nothing on its own: the fresh start that
# would rebuild the row is behind the target's ladder. When the block comes
# due the update pass, which runs ahead of the Create pass, re-opens the
# parked row as a fresh recreate and deletes the dead occupant as the old
# incarnation; the Create pass's recycle is never reached.
scenario: parked-down-set-exits-waits-for-the-ladder
arrows:
  - T-ready-recreate
  - T-drain-deadline
  - T-failedparked-retry
cells:
  - instance/Failed/Parked/pod.phaseTerminal[Failed]/before
  - instance/Failed/Parked/pod.phaseTerminal[Failed]/boundary@T-failedparked-retry
  - instance/Failed/Parked/pod.phaseTerminal[Failed]/after@T-failedparked-retry
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    updateRetry: {maxAttempts: 3, initialDelay: 1h, maxDelay: 2h, multiplier: 2}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod template changes, so the roll drains the pod for a recreate
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the pod leaves rotation, so it is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 4
    note: the old pod is gone, so the rebuild lands at the new revision
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 5
    note: the deadline elapses on a rebuilt pod that never came up; the ladder counts the wave and the attempt is parked with the row Failed
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the parked pod exits with phase Failed; a dead pod of a parked set changes nothing on its own, since the fresh start that would rebuild the row is behind the target's ladder
    events:
      - pod.phaseTerminal[Failed]: {pod: {index: 0}}
  - tick: 7
    note: the block comes due with the terminal phase re-observed; the update pass runs ahead of the Create pass and re-opens the parked row as a fresh recreate, which deletes the dead occupant as the old incarnation
    events:
      - pod.phaseTerminal[Failed]: {pod: {index: 0}}
      - timer.retryAt: {slack: 1s}
  - tick: 8
    note: the terminal phase is re-observed on the pod the recreate is deleting; the attempt owns the index and nothing is written
    events:
      - pod.phaseTerminal[Failed]: {pod: {index: 0}}
  - tick: 9
    note: the dead pod is gone, so the fresh attempt rebuilds the index at the new incarnation
    events:
      - pod.deleted[source]: {pod: {index: 0}}
