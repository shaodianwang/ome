# The same wedge as T-create-stuck, observed from the other side: the pull
# failure lands on a pod too young to be stuck, so the attempt keeps polling
# until the grace itself elapses. timer.stuckPodGrace resolves the deadline
# from the pod's creationTimestamp and the configured grace, so the scenario
# states neither duration twice.
scenario: T-create-stuckgrace
arrows:
  - T-empty-create
  - T-create-stuckgrace
cells:
  - instance/Create/CreatePods/timer.stuckPodGrace/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 5m
timeline:
  - tick: 1
    note: the index is planned and no row exists, so the Create pass opens the attempt
  - tick: 2
    note: the pull wedges immediately, but the pod is younger than the grace, so the attempt keeps polling
    events:
      - pod.waiting[ImagePullBackOff]: {pod: {index: 0}, message: "manifest unknown"}
  - tick: 3
    note: the grace elapses on the wedged pod and the escalation disposes the attempt
    events:
      - timer.stuckPodGrace: {slack: 1s}
