# The owner is deleted while a parked attempt serves, and the configured
# teardown deadline has elapsed by the time the controller observes it. A
# create refusal armed for the terminating namespace is consumed by nobody,
# since a parked attempt creates nothing; the deadline check runs ahead of
# the teardown dispatch, so the parked row is never stamped Deleting: the
# pass warns, releases the finalizer, and the owner goes with the row while
# the serving pod is left to background GC. A later pass finds no object
# to act on.
scenario: parked-serving-teardown-deadline
arrows:
  - T-ready-recreate
  - T-drain-deadline
  - T-failed-parked-serves
cells:
  - instance/Update/Parked/api.namespaceTerminating/before
  - instance/Update/Parked/timer.teardownDeadline/boundary@T-parked-teardown-deadline
  - instance/Update/Parked/timer.teardownDeadline/after@T-parked-teardown-deadline
intentional: >-
  an attempt parked after its disposition is the roll's while a pod of its
  set stands: the Create pass neither promotes the set nor re-asserts its
  serving gate, and asks for no wake-up of its own for it, so the pass waits
  on the ladder's next admission instead of its own cadence
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 1h, maxDelay: 2h, multiplier: 2}
    scaleDownRequeueInterval: 30s
    teardownDeadline: 10m
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod template changes, so the roll drains the pod for a recreate
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the pod leaves rotation, so it is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 4
    note: the old pod is gone, so the rebuild lands at the new revision
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 5
    note: the deadline elapses on a rebuilt pod that never came up; the ladder counts the wave and the attempt is parked with the row Failed
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the pod comes up and is gated serving, so the parked set serves in full and the row reads as the roll in progress with the attempt still parked
    events:
      - pod.containersReady[source]: {pod: {index: 0}}
      - pod.servingOn[source]: {pod: {index: 0}}
  - tick: 7
    note: the namespace begins terminating and would refuse a create; a parked attempt creates nothing, so nothing consumes the refusal
    events:
      - api.namespaceTerminating: {}
  - tick: 8
    note: the owner was deleted and its teardown deadline has elapsed before this pass observes either, so the deadline check releases the owner ahead of any teardown wave and the parked row goes with it
    events:
      - spec.teardown[deleted]: {}
      - timer.teardownDeadline: {slack: 1s}
  - tick: 9
    note: a late pass finds no owner left to act on
