# A revision in Backoff comes due and the Create pass reopens the attempt
# in one transaction with the block's move to RetryInProgress. That write
# is refused once: the adapter's retry re-reads the owner, re-applies the
# whole batch and commits it on the second attempt, so the pass that read
# the block due is also the pass that reopens the attempt.
scenario: failed-retry-write-conflict
arrows:
  - T-empty-create
  - T-create-stuckgrace
  - T-failed-retry
cells:
  - instance/Failed/api.conflict/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 5m
    updateRetry: {maxAttempts: 3, initialDelay: 2m, maxDelay: 10m, multiplier: 2}
timeline:
  - tick: 1
    note: the index is planned and no row exists, so the Create pass opens the attempt
  - tick: 2
    note: the pull wedges immediately, but the pod is younger than the grace, so the attempt keeps polling
    events:
      - pod.waiting[ImagePullBackOff]: {pod: {index: 0}, message: "manifest unknown"}
  - tick: 3
    note: the grace elapses, and with a retry budget the revision goes into Backoff instead of being held
    events:
      - timer.stuckPodGrace: {slack: 1s}
  - tick: 4
    note: the wedged pod is recycled, so nothing of the failed attempt remains
    events:
      - pod.deleted[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 5
    note: the block comes due and the write that reopens the attempt and moves the block is refused once, re-applied and committed on the second attempt
    events:
      - timer.retryAt: {slack: 1s}
      - api.conflict: {write: 1}
