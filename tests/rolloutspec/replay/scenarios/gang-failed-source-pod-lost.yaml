# A source gang member is deleted from outside while the failed surge is
# being abandoned. A source that still claims the update verb is not the
# restart pass's: the lost-member trigger declines a preserved Update claim,
# the abandon waits only on the retired replacement, and the reset stamps
# the source Ready without consulting its pods; the short gang is repaired
# only after that.
scenario: gang-failed-source-pod-lost
arrows:
  - T-empty-gang-surge-target
  - T-gangtarget-deadline
  - T-failedgangtarget-cleanup-failed
  - T-failedgangsurge-reset
cells:
  - instance/Failed/GangSurge/pod.terminating[source]/before
  - instance/Failed/GangSurge/pod.deleted[source]/before
  - instance/Failed/GangSurgeTargetCleanup/pod.terminating[source]/before
  - instance/Failed/GangSurgeTargetCleanup/pod.deleted[source]/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: the replacement is still not Ready when the deadline elapses, so both halves of the pair are stamped Failed with their operations preserved
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the abandon claims the cleanup marker and deletes the retired replacement's members
  - tick: 7
    note: the source worker is deleted from outside and stays Terminating; it is live until it is gone, the abandon runs regardless and nothing repairs the source while it claims the update verb
    events:
      - pod.terminating[source]: {pod: {index: 0, runner: worker}}
  - tick: 8
    note: the source worker is gone; the lost-member trigger declines a row with a preserved Update claim, so the abandon still waits only on the retired pods
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
  - tick: 9
    note: the retired replacement's members are gone, so the marker row is removed and the source is reset Ready on its running revision without its short gang being consulted
    events:
      - pod.deleted[target]: {pod: {index: 1, runner: leader}}
      - pod.deleted[target]: {pod: {index: 1, runner: worker}}
  - tick: 10
    note: the reset source is a Ready row still short of the roll target, so the roll claims a fresh surge for the whole short gang rather than the restart pass rebuilding it first
