# A gang surge pair fails on its deadline and quota refuses the abandon's
# deletes for three passes, so the retired replacement lingers under its
# cleanup marker. Its members are gated, found unplaceable, admitted,
# evicted and refused by their nodes meanwhile: a row nobody owns records no
# hold, and every one of them is deleted like any other once the deletes
# are admitted.
scenario: gang-cleanup-failed-gated-and-refused-members
arrows:
  - T-empty-gang-surge-target
  - T-gangtarget-deadline
  - T-failedgangtarget-cleanup-failed
  - T-failedgangsurge-reset
cells:
  - instance/Failed/GangSurgeTargetCleanup/pod.schedulingGated/before
  - instance/Failed/GangSurgeTargetCleanup/pod.unschedulable[target]/before
  - instance/Failed/GangSurgeTargetCleanup/pod.admitted/before
  - instance/Failed/GangSurgeTargetCleanup/pod.evicted/before
  - instance/Failed/GangSurgeTargetCleanup/pod.admissionRejected[OutOfResource]/before
  - instance/Failed/GangSurge/pod.schedulingGated/before
  - instance/Failed/GangSurge/pod.admitted/before
  - instance/Failed/GangSurge/pod.evicted/before
  - instance/Failed/GangSurge/pod.admissionRejected[OutOfResource]/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    containerName: ome-container
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: the replacement is still not Ready when the deadline elapses, so both halves of the pair are stamped Failed with their operations preserved
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: quota refuses the abandon's first delete, so the cleanup claim lands on the marker but the retired members stay
    events:
      - api.quotaDenied: {verb: delete, count: 3}
  - tick: 7
    note: the retired worker is held behind a scheduling gate and the retired leader reports Unschedulable; a row nobody owns records no hold, and quota refuses the delete again
    events:
      - pod.schedulingGated: {pod: {index: 1, runner: worker}}
      - pod.unschedulable[target]: {pod: {index: 1, runner: leader}}
  - tick: 8
    note: the worker is admitted, bound and evicted under node pressure, and the leader is bound and refused by its node; both are terminal now, nothing recycles a retired name, and quota refuses the delete a third time
    events:
      - pod.admitted: {pod: {index: 1, runner: worker}}
      - pod.scheduled[target]: {pod: {index: 1, runner: worker}, message: node-2}
      - pod.evicted: {pod: {index: 1, runner: worker}, message: "The node was low on resource: memory"}
      - pod.scheduled[target]: {pod: {index: 1, runner: leader}, message: node-1}
      - pod.admissionRejected[OutOfResource]: {pod: {index: 1, runner: leader}, resource: nvidia.com/gpu, message: "Pod Node didn't have enough resource: nvidia.com/gpu"}
  - tick: 9
    note: the deletes are admitted, so both terminal retired members are deleted like any other
  - tick: 10
    note: the retired replacement's members are gone, so the marker row is removed and the source is reset Ready on its running revision
    events:
      - pod.deleted[target]: {pod: {index: 1, runner: leader}}
      - pod.deleted[target]: {pod: {index: 1, runner: worker}}
