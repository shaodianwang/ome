# A recreate attempt parked at Failed with its operation kept comes up and
# is gated serving, and the serving pod is then deleted outright, so the
# row returns to Failed with the attempt kept and no pod left. The operator
# then reverts the template to the revision the row runs: the roll has
# nothing to move, and with no pod of the parked set left the Create pass
# re-materializes the index under a fresh Create attempt pinned to that
# revision, replacing the parked one.
scenario: parked-serving-pod-deleted-then-corrective-rebuilds
arrows:
  - T-ready-recreate
  - T-drain-deadline
  - T-failed-parked-serves
  - T-parked-gone
  - T-failedparked-corrective-create
cells:
  - instance/Update/Parked/pod.deleted[source]/boundary@T-parked-gone
  - instance/Failed/Parked/spec.revision/boundary@T-failedparked-corrective-create
  - instance/Failed/Parked/spec.revision/after@T-failedparked-corrective-create
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 1h, maxDelay: 2h, multiplier: 2}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod template changes, so the roll drains the pod for a recreate
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the pod leaves rotation, so it is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 4
    note: the old pod is gone, so the rebuild lands at the new revision
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 5
    note: the deadline elapses on a rebuilt pod that never came up; the ladder counts the wave and the attempt is parked with the row Failed
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the pod comes up and is gated serving, so the parked set serves in full and the row reads as the roll in progress with the attempt still parked
    events:
      - pod.containersReady[source]: {pod: {index: 0}}
      - pod.servingOn[source]: {pod: {index: 0}}
  - tick: 7
    note: the serving pod is deleted outright by another hand; no live pod of the parked set is left and no repair takes the loss, so the row returns to Failed on this tick with the attempt kept
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 8
    note: the operator reverts the template to the revision the row runs; the roll has nothing to move and no pod of the parked set is left, so the Create pass opens a fresh Create attempt pinned to that revision over the parked one
    events:
      - spec.revision: {image: registry.example.com/runtime:v1}
  - tick: 9
    note: the rebuilt pod comes up on the reverted revision and enters rotation, so the row promotes to Ready on it
    events:
      - pod.ready[target]: {pod: {index: 0}}
      - endpoint.rotationIn[target]: {pod: {index: 0}}
