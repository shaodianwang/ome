# A migration's surge pod is held in an admission queue, admitted and queued
# again at SurgePending. Admission gating parks the Instance operation
# deadlines but not the record's deadline, and the gate exit restarts a
# clock that is never consumed under a Migrate pin, so a surge held long
# enough in a queue ends as a migration expiry rather than as an Instance
# failure.
scenario: migrate-surge-pending-gate-and-admission
arrows:
  - T-ready-migrate
  - T-empty-migrate-target
  - T-migrate-deadline-restore
  - T-migratetarget-expired
cells:
  - instance/Migrate/CreateSurge/pod.schedulingGated/before
  - instance/Migrate/SurgeTarget/pod.schedulingGated/before
  - instance/Migrate/CreateSurge/pod.admitted/before
  - instance/Migrate/SurgeTarget/pod.admitted/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    migrationMode: Auto
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
timeline:
  - tick: 1
    note: the index is planned and no row exists, so the Create pass opens the attempt
  - tick: 2
    note: the pod is bound, becomes Ready and enters rotation, so the row records a running revision on a known node
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-0}
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the operator asks the Instance off node-0, and the migrate pass admits the request and establishes the pair
    events:
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
  - tick: 4
    note: a queue admission gates the surge pod, which parks the pair's operation deadlines and leaves the record's deadline running
    events:
      - pod.schedulingGated: {pod: {index: 1}}
  - tick: 5
    note: the gate is lifted, so the gate-exit edge restarts the parked clocks, which are never consumed under a Migrate pin
    events:
      - pod.admitted: {pod: {index: 1}}
  - tick: 6
    note: the queue holds the surge pod again, which parks the operation deadlines once more
    events:
      - pod.schedulingGated: {pod: {index: 1}}
  - tick: 7
    note: the record's deadline elapses with the surge still queued, so the move ends as a migration expiry rather than an Instance failure, the source is restored to Ready and the surge pin cleared
    events:
      - timer.migrationDeadline: {slack: 1s}
  - tick: 8
    note: the unpinned surge index is beyond the desired set, so the scale-down pipeline commits Phase Deleting on it
