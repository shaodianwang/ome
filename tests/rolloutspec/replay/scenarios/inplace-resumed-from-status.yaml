# An in-place roll resumed from persisted status before its drain began:
# the row carries the Update/InPlace operation and the pod still serves on
# the running revision. The resumed pass takes the pod out of rotation,
# patches it once drained and promotes when the runtime confirms the image.
scenario: inplace-resumed-from-status
arrows:
  - T-inplace-ready
cells:
  - instance/Update/InPlace/ctrl.crash/before
  - instance/Update/InPlace/pod.ready[target]/boundary@T-inplace-ready
initial:
  spec:
    replicas: 1
    strategy: InPlaceIfPossible
    image: registry.example.com/runtime:v2
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
  currentRevision: registry.example.com/runtime:v1
  rows:
    - index: 0
      phase: Updating
      runningRevision: registry.example.com/runtime:v1
      targetRevision: current
      readySince: 0s
      operation: {type: Update, step: InPlace, strategy: InPlaceIfPossible}
  pods:
    - {index: 0, previousImage: registry.example.com/runtime:v1, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the resumed pass finds the attempt stamped and the pod still serving, so it begins the drain
  - tick: 2
    note: the pod leaves rotation and reports Ready, so the transition marker is written
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
      - pod.ready[target]: {pod: {index: 0}}
  - tick: 3
    note: the image patch lands while the pod is out of rotation
  - tick: 4
    note: the runtime confirms the new image, so the pod returns to rotation on the target revision and the Instance promotes
    events:
      - pod.ready[target]: {pod: {index: 0}}
  - tick: 5
    note: the endpoint follows the pod back into rotation; nothing is left in flight
    events:
      - endpoint.rotationIn[target]: {pod: {index: 0}}
