# A parked attempt whose three-member gang set is down. Its PodGroup
# deleted is re-created by the ensure pass, and a narrower width is
# rendered by the next attempt, which replaces the parked set whole when
# the ladder's block comes due.
scenario: parked-down-gang-shrink-and-podgroup
arrows:
  - T-empty-create
  - T-ready-recreate
  - T-drain-deadline
  - T-failedparked-retry
cells:
  - instance/Failed/Parked/gang.podGroup[Deleted]/before
  - instance/Failed/Parked/spec.gangWidth[shrink]/before
initial:
  spec:
    replicas: 1
    workers: 2
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 1h, maxDelay: 2h, multiplier: 2}
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes all three
  - tick: 2
    note: every member reports Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker, ordinal: 0}}
      - pod.ready[source]: {pod: {index: 0, runner: worker, ordinal: 1}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the pod template changes, so the roll drains the gang for a recreate
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the leader leaves rotation and the drained members are deleted, so the roll recreates them at the new revision
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker, ordinal: 0}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker, ordinal: 1}}
  - tick: 5
    note: the rebuilt leader reports ContainersReady while the workers are still booting, so the set is short of serving
    events:
      - pod.containersReady[target]: {pod: {index: 0, runner: leader}}
  - tick: 6
    note: the deadline elapses on the live set; the ladder counts the wave and the attempt is parked with the row Failed
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 7
    note: the parked set's PodGroup is deleted; the ensure pass re-creates it from the plan and the row is untouched
    events:
      - gang.podGroup[Deleted]: {instance: 0}
  - tick: 8
    note: the gang narrows by a worker; the PodGroup is re-reconciled for the new width, a parked attempt opens nothing and the surplus member stands
    events:
      - spec.gangWidth[shrink]: {to: 1}
  - tick: 9
    note: the block comes due; the fresh attempt renders the narrower gang and drains the parked set whole
    events:
      - timer.retryAt: {slack: 1s}
  - tick: 10
    note: the parked set is gone, so the fresh attempt rebuilds the gang at the new width
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker, ordinal: 0}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker, ordinal: 1}}
