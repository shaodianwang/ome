# Apiserver answers armed while a parked attempt serves are consumed by
# nobody, since a parked attempt deletes and creates nothing of its own.
# Both wait for the fresh recreate attempt the ladder admits: its drain's
# delete meets the not-found answer, behind which the parked pod is gone,
# and its rebuild meets the already-exists answer and adopts the object
# that holds the name.
scenario: parked-serving-create-refusals-wait
arrows:
  - T-ready-recreate
  - T-drain-deadline
  - T-failed-parked-serves
  - T-parked-retry
cells:
  - instance/Update/Parked/api.notFound/before
  - instance/Update/Parked/api.alreadyExists/before
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 1h, maxDelay: 2h, multiplier: 2}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod template changes, so the roll drains the pod for a recreate
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the pod leaves rotation, so it is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 4
    note: the old pod is gone, so the rebuild lands at the new revision
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 5
    note: the deadline elapses on a rebuilt pod that never came up; the ladder counts the wave and the attempt is parked with the row Failed
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the pod comes up and is gated serving, so the parked set serves in full and the row reads as the roll in progress with the attempt still parked
    events:
      - pod.containersReady[source]: {pod: {index: 0}}
      - pod.servingOn[source]: {pod: {index: 0}}
  - tick: 7
    note: a not-found answer is armed for the next pod delete and an already-exists answer for the next pod create; a parked attempt issues neither, so nothing consumes them
    events:
      - api.notFound: {}
      - api.alreadyExists: {}
  - tick: 8
    note: the block comes due; the gate admits and the fresh recreate attempt's drain meets the not-found answer, behind which the parked pod is already gone
    events:
      - timer.retryAt: {slack: 1s}
  - tick: 9
    note: the fresh attempt's rebuild meets the already-exists answer and adopts the object that already holds the name
