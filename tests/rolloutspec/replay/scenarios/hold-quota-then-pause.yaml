# A quota refusal and an operator pause meet on one surging row, the
# refusal first. Quota reports a fact about the Instance — it is queued
# behind capacity an operator controls — and the pause does not take the
# token from it; the row keeps reporting QuotaExceeded for as long as the
# creates are refused. The first pass whose create lands releases the
# quota token, and the pause takes the row on the pass after that.
scenario: hold-quota-then-pause
cells:
  - instance/Update/Surge/api.quotaDenied/before
  - instance/Update/Surge/spec.pauseTrue/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the pod template changes and the surge's replacement create is refused for lack of quota, twice over
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
      - api.quotaDenied: {verb: create, resource: pods, count: 2}
  - tick: 2
    note: the operator pauses while the second refusal lands, and the pause does not take a row already reporting QuotaExceeded
    events:
      - spec.pauseTrue: {}
  - tick: 3
    note: quota frees up and the replacement is created, so the quota authority releases its token and the pause takes the row in the same pass
  - tick: 4
    note: the row reports the pause and neither authority writes again
