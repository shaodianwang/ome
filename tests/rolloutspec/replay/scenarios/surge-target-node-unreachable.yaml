# The node under the surge replacement stops reporting: the unreachable
# taint lands and the pod leaves Ready. Nothing recycles a replacement
# whose kubelet may still be running it, so the name is held, the deadline
# is parked and the source serves on. Once the node has been unreachable
# past the threshold the force-delete sweep frees the name on proven node
# death, the hold lifts with the clock restarted, and the next pass rebuilds
# the replacement and completes the surge.
scenario: surge-target-node-unreachable
arrows:
  - T-ready-surge
  - T-surge-force-clock
  - T-surge-target-ready
  - T-surgedrain-promote
cells:
  - instance/Update/Surge/pod.nodeLost[UnreachableTaint]/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    migrationMode: Auto
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    autoMigrateBudget: 2
    forceDelete: {overdueSlack: 1m, nodeUnreachableThreshold: 5m}
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source becomes Ready and enters rotation
    events:
      - pod.scheduled[source]: {pod: {index: 0, ordinal: 0}, message: node-0}
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement is bound and comes up on its node
    events:
      - pod.scheduled[target]: {pod: {index: 0, ordinal: 1}, message: node-1}
      - pod.containersReady[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 5
    note: the replacement's node stops reporting, so the pod leaves Ready behind an unreachable taint; the name is held rather than recycled and the deadline parks while the source stays in rotation
    events:
      - pod.nodeLost[UnreachableTaint]: {pod: {index: 0, ordinal: 1}}
  - tick: 6
    note: the node has been unreachable past the threshold, so the sweep force-deletes the replacement on proven node death and the hold lifts with the clock restarted
    events:
      - timer.forceDelete[nodeUnreachable]: {slack: 1s}
  - tick: 7
    note: the name is free, so the attempt rebuilds the replacement at the surge ordinal
  - tick: 8
    note: the rebuilt replacement lands on another node, serves and enters rotation, so the step advances and the source leaves rotation
    events:
      - pod.scheduled[target]: {pod: {index: 0, ordinal: 1}, message: node-2}
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 9
    note: the source leaves rotation and is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 10
    note: the drained source is gone and the Instance promotes
    events:
      - pod.deleted[source]: {pod: {index: 0, ordinal: 0}}
