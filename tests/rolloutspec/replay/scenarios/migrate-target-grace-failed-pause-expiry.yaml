# A freeze and a standard pause land on a migration whose surge row stands
# Failed with its Migrate pin kept. A paused plan selects neither the drive
# nor the expiry, so the pair holds with the pin while the record's deadline
# keeps running underneath; the deadline elapses under the standard pause,
# and the expiry ends the move on the first pass after the unpause.
scenario: migrate-target-grace-failed-pause-expiry
arrows:
  - T-ready-migrate
  - T-empty-migrate-target
  - T-failedmigratetarget-expired
  - T-migrate-deadline-restore
  - T-delete-done
cells:
  - instance/Failed/MigrateTarget/spec.pauseFreeze/before
  - instance/Failed/MigrateTarget/spec.unpause/before
  - instance/Failed/MigrateTarget/spec.pauseTrue/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    migrationMode: Auto
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    unschedulableGrace: 10m
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
timeline:
  - tick: 1
    note: the index is planned and no row exists, so the Create pass opens the attempt
  - tick: 2
    note: the pod is bound, becomes Ready and enters rotation, so the row records a running revision on a known node
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-0}
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the operator asks the Instance off node-0, and the migrate pass admits the request and establishes the pair
    events:
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
  - tick: 4
    note: the scheduler finds the surge no node off node-0, so the scheduler hold is recorded on the surge row and both pair deadlines park
    events:
      - pod.unschedulable[target]: {pod: {index: 1}}
  - tick: 5
    note: the hold outlasts the configured grace, so the escalation stamps the surge row Failed with its Migrate pin kept while the source keeps serving under its own pin
    events:
      - clock.advance: 11m
  - tick: 6
    note: the operator freezes, which suspends the drive and the expiry; the source takes the pause token and the Failed surge row is untouched
    events:
      - spec.pauseFreeze: {}
  - tick: 7
    note: the freeze is lifted, so the source's token clears and the pair goes back to waiting on a promote the Failed surge row cannot take
    events:
      - spec.unpause: {}
  - tick: 8
    note: the operator pauses, which plans no migrate pass again
    events:
      - spec.pauseTrue: {}
  - tick: 9
    note: the record's deadline elapses under the pause, which plans no expiry either, so the pair holds with the deadline behind it
    events:
      - timer.migrationDeadline: {slack: 1s}
  - tick: 10
    note: the pause is lifted, so the first pass expires the record, clears the pin from the Failed surge row and restores the source to Ready on its running revision
    events:
      - spec.unpause: {}
  - tick: 11
    note: the unpinned index is beyond the desired set, so the scale-down pipeline commits Phase Deleting on it
  - tick: 12
    note: the drain finds nothing routed on the retired index, so its pod's delete is issued
  - tick: 13
    note: the surge pod is gone, so its row is removed with it
    events:
      - pod.deleted[target]: {pod: {index: 1}}
