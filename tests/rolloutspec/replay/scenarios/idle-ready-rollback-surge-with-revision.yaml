# An Instance rolled to a new revision is pinned back to the old one as the
# template moves again, in one observation. While the pin is set the roll
# target is the stored revision; the new template is reported, not rolled.
scenario: idle-ready-rollback-surge-with-revision
arrows:
  - T-ready-surge
  - T-surge-target-ready
  - T-surgedrain-promote
  - T-ready-rollback-surge
cells:
  - instance/Ready/spec.revision/boundary@T-ready-rollback-surge
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true, node: node-0}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the template moves to v2, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the replacement is serving and in rotation beside the source
    events:
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 4
    note: the source leaves rotation, so the drain has converged
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 5
    note: the drained source is gone and the Instance is Ready on v2
    events:
      - pod.deleted[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 6
    note: the roll is pinned back to v1 as the template moves to v3; the surge targets the pinned revision and renders its stored template, not the new one
    events:
      - spec.rollbackTarget[set]: {image: registry.example.com/runtime:v1}
      - spec.revision: {image: registry.example.com/runtime:v3}
