# The replacement gang's PodGroup is taken over by another controller while
# the surge is in flight, so the marker is Failed with its operation kept
# and the source keeps driving the build. Admission signals, a boot-time
# restart and a UID rotation on the marker's members are read as they would
# be on a live marker: the source's clock parks and re-arms through the
# surge index, the Failed marker's own clock is never re-armed, and the
# members are read by name from the live list.
scenario: gang-target-failed-verdict-member-signals
arrows:
  - T-empty-gang-surge-target
  - T-gangtarget-ready
  - T-failedgangtarget-ready
cells:
  - instance/Failed/GangSurgeTarget/pod.scheduled[target]/before
  - instance/Failed/GangSurgeTarget/pod.schedulingGated/before
  - instance/Failed/GangSurgeTarget/pod.admitted/before
  - instance/Failed/GangSurgeTarget/pod.containerRestart/before
  - instance/Failed/GangSurgeTarget/pod.uidRotated/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    containerName: ome-container
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: the replacement group's controller reference is rewritten to another owner; the gang verdict ends the marker alone, Failed with its operation kept, while the source stays Updating and keeps driving the surge
    events:
      - gang.podGroup[OwnershipConflict]: {instance: 1}
  - tick: 6
    note: the replacement leader binds and the worker is held behind a scheduling gate; the binding advances nothing, and the gated member parks the source's deadline through the surge index while the Failed marker's own clock stays as it is
    events:
      - pod.scheduled[target]: {pod: {index: 1, runner: leader}, message: node-1}
      - pod.schedulingGated: {pod: {index: 1, runner: worker}}
  - tick: 7
    note: the worker is admitted; it joins the set the source's pass reads and the source's clock is re-armed, while the deadline reconciler touches no row nobody owns
    events:
      - pod.admitted: {pod: {index: 1, runner: worker}}
  - tick: 8
    note: the replacement leader comes up and its runner restarts in place while the worker reappears under a new UID; restart evidence is dated against a ReadySince the marker never stamped, the gate write waits for the whole gang to be runtime-ready, and the members are read by name
    events:
      - pod.containersReady[target]: {pod: {index: 1, runner: leader}}
      - pod.containerRestart: {pod: {index: 1, runner: leader}, message: OOMKilled}
      - pod.uidRotated: {pod: {index: 1, runner: worker}}
  - tick: 9
    note: both members report Ready and the leader enters rotation, so the source advances to the drain and leaves the serving gate
    events:
      - pod.ready[target]: {pod: {index: 1, runner: leader}}
      - pod.ready[target]: {pod: {index: 1, runner: worker}}
      - endpoint.rotationIn[target]: {pod: {index: 1, runner: leader}}
  - tick: 10
    note: the source leader leaves the routed Service, so the source pods are deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
  - tick: 11
    note: the source pods are gone, so the Failed marker is promoted Ready on the pinned revision and the source row is removed
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
