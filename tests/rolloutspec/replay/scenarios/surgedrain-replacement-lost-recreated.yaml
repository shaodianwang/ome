# The replacement is lost while the source drains: it is recreated at the
# surge ordinal with the source already out of rotation, its fresh binding
# matters only to that recreate, and the drain resumes once it is Ready.
scenario: surgedrain-replacement-lost-recreated
arrows:
  - T-ready-surge
  - T-surge-target-ready
  - T-surgedrain-promote
cells:
  - instance/Update/SurgeDrain/pod.deleted[target]/before
  - instance/Update/SurgeDrain/pod.scheduled[target]/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement is serving and in rotation, so the step advances and the source's serving gate is flipped off
    events:
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 5
    note: the replacement is gone, so the pass recreates it at the surge ordinal while the source stays out of rotation
    events:
      - pod.deleted[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 6
    note: the recreated replacement is bound; binding advances nothing on the step
    events:
      - pod.scheduled[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 7
    note: the recreated replacement reports Ready and enters rotation; the source is still routable, so the drain keeps waiting
    events:
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 8
    note: the source leaves rotation, so the drain has converged
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 9
    note: the drained source is gone and the surge promotes
    events:
      - pod.deleted[source]: {pod: {index: 0, ordinal: 0}}
