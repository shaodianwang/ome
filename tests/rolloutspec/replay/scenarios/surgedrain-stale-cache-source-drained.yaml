# The drained source leaves rotation, and the pass that observes it reads
# its cache one event behind. The drain check reads the EndpointSlices
# through the live reader, so the lagging cache cannot make the drain
# declare done early or late: the pass sees the endpoint gone and deletes
# the source on the cached object, whose identity has not changed.
scenario: surgedrain-stale-cache-source-drained
arrows:
  - T-ready-surge
  - T-surge-target-ready
  - T-surgedrain-promote
cells:
  - instance/Update/SurgeDrain/ctrl.staleRead/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement is serving and in rotation, so the step advances and the source leaves the serving gate
    events:
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 5
    note: the source leaves rotation while the cache lags; the drain check reads the slices live, so the source is deleted on this pass
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, ordinal: 0}}
      - ctrl.staleRead: {}
  - tick: 6
    note: the drained source is gone and the Instance promotes
    events:
      - pod.deleted[source]: {pod: {index: 0, ordinal: 0}}
