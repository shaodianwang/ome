# A retired Instance whose owner is deleted, with the teardown deadline
# elapsed, on the observation that also finds its pod gone, the replica
# count raised and a migration requested. The deadline is evaluated ahead
# of the scale-down pass, so it cannot race the completion commit: the
# finalizer lifts, the owner and every row go in one delete, the raised
# count dies with the object and the migration record with it.
scenario: delete-teardown-deadline-at-completion
arrows:
  - T-ready-scaledown
cells:
  - instance/Delete/Drain/timer.teardownDeadline/boundary@T-delete-teardown-deadline
  - instance/Delete/Drain/timer.teardownDeadline/boundary@T-delete-done
  - instance/Delete/Drain/pod.deleted[source]/boundary@T-delete-teardown-deadline
  - instance/Delete/Drain/spec.replicasUp/boundary@T-delete-teardown-deadline
  - instance/Delete/Drain/spec.migrateRequest/boundary@T-delete-teardown-deadline
  - instance/Delete/Drain/timer.teardownDeadline/after@T-delete-teardown-deadline
initial:
  spec:
    replicas: 2
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
    teardownDeadline: 10m
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true, node: node-0}
    - {index: 1, ready: true, serving: true, routed: true, node: node-1}
timeline:
  - tick: 1
    note: the operator halves the replica count, and the retired Instance is admitted into a Delete operation
    events:
      - spec.replicasDown: {to: 1}
  - tick: 2
    note: the retired pod leaves rotation, so the wave deletes it
    events:
      - endpoint.rotationOut[source]: {pod: {index: 1}}
  - tick: 3
    note: the owner was deleted and its teardown deadline has elapsed by the time the pass runs, which also finds the pod gone, the count raised and a migration requested; the release runs ahead of the wave, so nothing completes, rolls or moves and the owner goes with every row
    events:
      - pod.deleted[source]: {pod: {index: 1}}
      - spec.replicasUp: {to: 3}
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
      - spec.teardown[deleted]: {}
      - timer.teardownDeadline: {slack: 1s}
  - tick: 4
    note: a late pass finds no owner left to act on
