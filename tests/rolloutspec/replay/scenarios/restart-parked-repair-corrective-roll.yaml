# A corrective revision lands on a repair parked at Failed. The row's
# running revision is no longer the roll target, so the restart pass yields
# the row and the roll replaces it outright with a fresh recreate attempt
# that drains the wedged pod; the template moving again is that attempt's
# to read.
scenario: restart-parked-repair-corrective-roll
arrows:
  - T-ready-restart
  - T-restart-stuck
  - T-failedrepair-corrective
cells:
  - instance/Failed/Repair/spec.revision/boundary@T-failedrepair-corrective
  - instance/Failed/Repair/spec.revision/after@T-failedrepair-corrective
  - instance/Failed/Repair/gate.allow/before
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the rebuilt pod crash-loops and is older than the grace when the wedge is read, so the row fails with its operation preserved
    events:
      - clock.advance: 2m
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 0}, message: "back-off restarting failed container"}
  - tick: 4
    note: a corrective revision lands; the row is off the roll target, so the roll replaces the parked repair with a fresh recreate attempt and drains the wedged pod
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 5
    note: the template moves again and the wedged pod is gone; the row is the fresh attempt's, which retargets and rebuilds
    events:
      - spec.revision: {image: registry.example.com/runtime:v3}
      - pod.deleted[source]: {pod: {index: 0}}
