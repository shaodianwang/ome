# A gang surge pair fails on its deadline while one replacement member has
# exited with a terminal phase and the other runs without ever becoming
# ready. No pass recreates a terminal replacement pod on a stable name and
# the retired replacement's readiness is read by nobody: the abandon claims
# the cleanup marker and deletes both members like any other, and the reset
# follows once they are gone.
scenario: gang-failed-replacement-terminal-member
arrows:
  - T-empty-gang-surge-target
  - T-gangtarget-deadline
  - T-failedgangtarget-cleanup-failed
  - T-failedgangsurge-reset
cells:
  - instance/Failed/GangSurge/pod.phaseTerminal[Failed]/before
  - instance/Failed/GangSurge/pod.runningNotReady[target]/before
  - instance/Failed/GangSurgeTarget/pod.phaseTerminal[Failed]/boundary@T-failedgangtarget-cleanup-failed
  - instance/Failed/GangSurgeTargetCleanup/pod.phaseTerminal[Failed]/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: the replacement is still not Ready when the deadline elapses, so both halves of the pair are stamped Failed with their operations preserved
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the replacement worker exits with a terminal phase and the leader comes up without becoming ready as two minutes pass; nothing recreates a terminal pod on a stable name, readiness is read by nobody, and the abandon claims the cleanup marker and deletes both members
    events:
      - pod.phaseTerminal[Failed]: {pod: {index: 1, runner: worker}}
      - pod.containersReady[target]: {pod: {index: 1, runner: leader}}
      - clock.advance: 2m
  - tick: 7
    note: the retired leader exits with a terminal phase on its way out; a retired pod in a terminal phase is deleted like any other and the removal waits only on the object being gone
    events:
      - pod.phaseTerminal[Failed]: {pod: {index: 1, runner: leader}}
  - tick: 8
    note: the retired replacement's members are gone, so the marker row is removed and the source is reset Ready on its running revision
    events:
      - pod.deleted[target]: {pod: {index: 1, runner: leader}}
      - pod.deleted[target]: {pod: {index: 1, runner: worker}}
