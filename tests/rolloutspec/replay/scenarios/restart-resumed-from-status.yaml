# A repair resumed from persisted status at its drain step: the row carries
# the bumped Incarnation and the Restart/Drain operation while the failing
# pod of the previous incarnation still stands. The resumed pass drains and
# deletes it, rebuilds at the recorded incarnation and returns the Instance
# to Ready on the same revision.
scenario: restart-resumed-from-status
arrows:
  - T-restart-ready
cells:
  - instance/Restart/Drain/ctrl.crash/before
  - instance/Restart/Drain/pod.ready[target]/boundary@T-restart-ready
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
  rows:
    - index: 0
      incarnation: 2
      phase: Restarting
      runningRevision: current
      readySince: 0s
      operation: {type: Restart, step: Drain, reason: container restarted after the Instance was Ready}
  pods:
    - {index: 0, incarnation: 1, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the resumed pass drives the open repair whatever the trigger was, and begins draining the old pod
  - tick: 2
    note: the old pod leaves rotation, so it is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 3
    note: the old pod is gone, so the rebuild lands at the recorded incarnation on the running revision
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 4
    note: the rebuilt pod reports Ready and the repair completes
    events:
      - pod.ready[target]: {pod: {index: 0}}
