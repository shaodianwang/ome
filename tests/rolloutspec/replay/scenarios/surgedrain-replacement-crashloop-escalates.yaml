# The replacement of a single-pod surge at its drain step crash-loops past
# the stuck-pod grace with the source already out of rotation. The
# replacement served before, so the grace runs from the regression; once
# it elapses nothing suppresses the fast escalator past the drain claim (the
# drained source covers no slot and the wedged replacement is out of
# rotation), and the attempt is failed on the ambiguous reason with its
# source unrouted.
scenario: surgedrain-replacement-crashloop-escalates
arrows:
  - T-ready-surge
  - T-surge-target-ready
  - T-surgedrain-stuckgrace
cells:
  - instance/Update/SurgeDrain/pod.waiting[CrashLoopBackOff]/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement is serving and in rotation, so the step advances and the source leaves the serving gate
    events:
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 5
    note: the replacement crash-loops; it served before, so the grace runs from the regression and nothing is disposed yet
    events:
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 0, ordinal: 1}, message: "back-off 5m0s restarting failed container"}
  - tick: 6
    note: the grace elapses on the wedged replacement; the drained source covers no slot and the replacement is out of rotation, so nothing suppresses the escalation and the attempt is failed
    events:
      - timer.stuckPodGrace: {slack: 1s}
  - tick: 7
    note: the pass after the stamp reads the failed attempt
