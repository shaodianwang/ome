# A gang's Create attempt is ended by the gang verdict with its Create
# operation kept while its members stand short of readiness. The update
# trigger reads a Failed row with no running revision through its pods, but
# not one keeping an attempt the verdict ended: it withholds the revision
# that attempt pinned, so the very next pass opens no fresh start at the
# same target - under SurgeThenDrain no gang surge onto a free index - and
# the Create pass leaves the row. It stays Failed with its Create kept; the
# collision itself stands unread.
scenario: create-failed-unready-set-rolled
cells:
  - instance/Failed/Create/ctrl.resync/before
  - instance/Failed/Create/gate.allow/before
  - instance/Failed/Create/gang.podGroup[OwnershipConflict]/before
  - instance/Failed/Create/timer.retryAt/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    containerName: ome-container
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: the group's controller reference is rewritten to another owner; the gang verdict ends the attempt, Failed with its Create operation kept
    events:
      - gang.podGroup[OwnershipConflict]: {instance: 0}
  - tick: 3
    note: a pass with nothing new reads two members on the target that are not runtime-ready and writes nothing; no gang surge opens at the same target and the kept Create stays
  - tick: 4
    note: a further pass writes nothing either; no second gang is built beside the failed one
