# The migration surge row stands Failed with its Migrate pin kept, and the
# controller and the cluster around its pods change under it. A restart
# re-derives the same nothing, a container waiting
# outside the terminal set is no evidence, an own pod the kubelet stops
# reporting, a lost node under the source and an own pod stuck on its way
# out are left to the force-delete sweep, which has no policy to act on, and
# the record's deadline is still what ends the move.
scenario: migrate-target-grace-failed-lifecycle-observations
arrows:
  - T-ready-migrate
  - T-empty-migrate-target
  - T-failedmigratetarget-expired
  - T-migrate-deadline-restore
cells:
  - instance/Failed/MigrateTarget/ctrl.crash/before
  - instance/Failed/MigrateTarget/pod.waiting[DeadlineExceeded]/before
  - instance/Failed/MigrateTarget/pod.phaseTerminal[Unknown]/before
  - instance/Failed/MigrateTarget/pod.nodeLost[NodeGone]/before
  - instance/Failed/MigrateTarget/pod.terminating[target]/before
  - instance/Failed/MigrateTarget/pod.stuckTerminating/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    migrationMode: Auto
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    unschedulableGrace: 10m
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
timeline:
  - tick: 1
    note: the index is planned and no row exists, so the Create pass opens the attempt
  - tick: 2
    note: the pod is bound, becomes Ready and enters rotation, so the row records a running revision on a known node
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-0}
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the operator asks the Instance off node-0, and the migrate pass admits the request and establishes the pair
    events:
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
  - tick: 4
    note: the scheduler finds the surge no node off node-0, so the scheduler hold is recorded on the surge row and both pair deadlines park
    events:
      - pod.unschedulable[target]: {pod: {index: 1}}
  - tick: 5
    note: the hold outlasts the configured grace, so the escalation stamps the surge row Failed with its Migrate pin kept while the source keeps serving under its own pin
    events:
      - clock.advance: 11m
  - tick: 6
    note: the controller restarts, and the pin and the record are durable, so the next manager re-reads both and drives nothing
    events:
      - ctrl.crash: {}
  - tick: 7
    note: the surge pod is bound and a container waits with DeadlineExceeded, which is outside the terminal waiting set and is no early-failure evidence
    events:
      - pod.scheduled[target]: {pod: {index: 1}, message: node-1}
      - pod.waiting[DeadlineExceeded]: {pod: {index: 1}, message: "context deadline exceeded"}
  - tick: 8
    note: the surge pod's kubelet stops reporting it, which routes the name to the force-delete sweep rather than to any clock on this row
    events:
      - pod.phaseTerminal[Unknown]: {pod: {index: 1}}
  - tick: 9
    note: the node under the source is gone, which reaches the pair only through its pods and the sweep
    events:
      - pod.nodeLost[NodeGone]: {pod: {index: 0}}
  - tick: 10
    note: something else deletes the surge pod, and a pod on its way out is live until it is gone
    events:
      - pod.terminating[target]: {pod: {index: 1}}
  - tick: 11
    note: the kubelet behind the surge pod stops acknowledging the deletion, and with no force-delete policy the sweep leaves it where it is
    events:
      - pod.stuckTerminating: {pod: {index: 1}}
  - tick: 12
    note: the record's deadline elapses, so the expiry clears the pin from the Failed surge row, closes the record and restores the source to Ready on its running revision
    events:
      - timer.migrationDeadline: {slack: 1s}
  - tick: 13
    note: the unpinned index is beyond the desired set, so the scale-down pipeline commits Phase Deleting on it
  - tick: 14
    note: the drain finds nothing routed on the retired index and skips a pod already on its way out, so nothing is issued and the row waits for it to be gone
