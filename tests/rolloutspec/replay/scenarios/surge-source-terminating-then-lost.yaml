# The source is deleted from under the surge and reported out of rotation;
# once it is gone the Ready replacement is promoted directly, and readiness,
# a controller restart and a newer target around that promote write nothing.
scenario: surge-source-terminating-then-lost
arrows:
  - T-ready-surge
  - T-surge-source-lost-promote
cells:
  - instance/Update/Surge/pod.ready[target]/boundary@T-surge-source-lost-promote
  - instance/Update/Surge/ctrl.crash/boundary@T-surge-source-lost-promote
  - instance/Update/Surge/pod.ready[target]/after@T-surge-source-lost-promote
  - instance/Update/Surge/ctrl.crash/after@T-surge-source-lost-promote
  - instance/Update/Surge/spec.revision/after@T-surge-source-lost-promote
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the source is deleted by another hand while the replacement is not yet ready; the step holds and the surge reports its source out of rotation
    events:
      - pod.terminating[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 5
    note: the source is gone as the replacement reports Ready and the controller restarts, so the promote lands with no drain to run
    events:
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - pod.deleted[source]: {pod: {index: 0, ordinal: 0}}
      - ctrl.crash: {}
  - tick: 6
    note: the row is Ready at the replacement's ordinal; its readiness and a restart write nothing, and a newer target rolls from Ready through the gate
    events:
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - ctrl.crash: {}
      - spec.revision: {image: registry.example.com/runtime:v3}
