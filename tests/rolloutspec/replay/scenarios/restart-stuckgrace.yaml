# The same rebuild wedge as restart-stuck, observed from the other side: the
# waiting reason lands on a pod younger than the grace, so the Restart keeps
# polling until the grace itself elapses.
scenario: restart-stuckgrace
arrows:
  - T-ready-restart
  - T-restart-stuckgrace
cells:
  - instance/Restart/Drain/timer.stuckPodGrace/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 5m
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the pull wedges immediately, but the rebuilt pod is younger than the grace, so the Restart keeps polling
    events:
      - pod.waiting[ImagePullBackOff]: {pod: {index: 0}, message: "manifest unknown"}
  - tick: 4
    note: the grace elapses on the wedged rebuild and the row fails with its operation preserved
    events:
      - timer.stuckPodGrace: {slack: 1s}
