# A gang surge pair fails on its deadline and the apiserver rejects the
# abandon's first delete as invalid, after the cleanup claim has landed on
# the marker. A 422 is permanent, so the refusal is disposed on the
# marker: Failed with the rejection on LastFailure and the cleanup
# operation kept, the revision in force held, one Warning. The retirement
# issues nothing for the members still standing while the ladder denies,
# so a second refusal staged for the next pass is never consumed; once
# the members are gone on their own there is nothing left to refuse, and
# the retirement finalizes the marker and resets the source as any
# abandon does.
scenario: gang-failed-invalid-delete-retried
arrows:
  - T-empty-gang-surge-target
  - T-gangtarget-deadline
  - T-failedgangtarget-cleanup-failed
  - T-failedgangsurge-reset
cells:
  - instance/Failed/GangSurge/api.invalid/before
  - instance/Failed/GangSurgeTargetCleanup/api.invalid/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: the replacement is still not Ready when the deadline elapses, so both halves of the pair are stamped Failed with their operations preserved
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the abandon claims the cleanup marker and the apiserver rejects its first delete as invalid; the marker is disposed Failed with the rejection and keeps the claim, the revision in force is held and one Warning names the pod
    events:
      - api.invalid: {verb: delete}
  - tick: 7
    note: the next pass leaves the marker as the rejection left it and issues no delete, so the refusal staged for it is never consumed
    events:
      - api.invalid: {verb: delete}
  - tick: 8
    note: a further pass still issues nothing while the ladder denies
  - tick: 9
    note: the retired replacement's members are gone, so the marker row is removed and the source is reset Ready on its running revision with the failed revision's wave recorded
    events:
      - pod.deleted[target]: {pod: {index: 1, runner: leader}}
      - pod.deleted[target]: {pod: {index: 1, runner: worker}}
