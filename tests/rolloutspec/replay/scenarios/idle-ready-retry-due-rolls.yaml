# A surge wedges and puts the new revision in Backoff; the wedged
# replacement is deleted from outside and the Instance stays Failed on its
# serving source, its roll denied by the block. When the block comes due the
# roll starts on that pass, through the gate, and the block flips to
# RetryInProgress.
scenario: idle-ready-retry-due-rolls
arrows:
  - T-ready-surge
  - T-surge-stuck
cells:
  - instance/Failed/pod.deleted[target]/before
  - instance/Failed/timer.retryAt/before
  - instance/Failed/gate.allow/before
intentional: >-
  a Failed single-pod surge source whose wedged replacement is deleted
  stays Failed: its record names the replacement, so it is no crash-loop
  park for the restart pass to return to Ready, and a row that ran another
  revision is not the Create pass's to promote; the due block re-opens the
  roll from Failed
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 2m, maxDelay: 10m, multiplier: 2}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true, node: node-0}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the replacement is still booting two minutes on, which is longer than the grace but proves nothing on its own
    events:
      - clock.advance: 2m
  - tick: 4
    note: the pull wedges on a replacement already older than the grace, so the surge is disposed and the revision goes into Backoff
    events:
      - pod.waiting[ImagePullBackOff]: {pod: {index: 0, ordinal: 1}, message: "manifest unknown"}
  - tick: 5
    note: something else deletes the wedged replacement and it is gone; the row stays Failed on its serving source and its roll is denied by the block
    events:
      - pod.terminating[target]: {pod: {index: 0, ordinal: 1}}
      - pod.deleted[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 6
    note: the block comes due, so it no longer denies the trigger; the roll starts from Failed on this pass through the gate and the block flips to RetryInProgress
    events:
      - timer.retryAt: {slack: 1s}
