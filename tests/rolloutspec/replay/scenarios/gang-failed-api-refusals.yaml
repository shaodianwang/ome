# Apiserver refusals land on a gang surge pair that failed on its deadline
# while the abandon retires the replacement. A shed delete leaves the pass
# through its error path once the cleanup claim has committed, and is
# retried on the next; a status conflict is re-applied under the conflict
# retry; a delete the apiserver answers not found is the outcome the abandon
# waited for; and the create refusals are never consumed, because the
# abandon creates nothing.
scenario: gang-failed-api-refusals
arrows:
  - T-empty-gang-surge-target
  - T-gangtarget-deadline
  - T-failedgangtarget-cleanup-failed
  - T-failedgangsurge-reset
cells:
  - instance/Failed/GangSurge/api.throttled[TooManyRequests]/before
  - instance/Failed/GangSurge/api.conflict/before
  - instance/Failed/GangSurge/api.notFound/before
  - instance/Failed/GangSurge/api.quotaDenied/before
  - instance/Failed/GangSurge/api.alreadyExists/before
  - instance/Failed/GangSurge/api.namespaceTerminating/before
  - instance/Failed/GangSurgeTargetCleanup/api.throttled[TooManyRequests]/before
  - instance/Failed/GangSurgeTargetCleanup/api.conflict/before
  - instance/Failed/GangSurgeTargetCleanup/api.notFound/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: the replacement is still not Ready when the deadline elapses, so both halves of the pair are stamped Failed with their operations preserved
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the cleanup claim commits and the apiserver then sheds the abandon's first delete, so the pass leaves through its error path; quota, already-exists and terminating-namespace answers armed for a create are never met, because the abandon creates nothing
    events:
      - api.throttled[TooManyRequests]: {verb: delete, retryAfter: 30s}
      - api.quotaDenied: {verb: create}
      - api.alreadyExists: {verb: create}
      - api.namespaceTerminating: {verb: create}
  - tick: 7
    note: the retried pass has its first status write refused once with a conflict and re-applied, and its first delete answered not found, which leaves the leader gone at once; the worker's delete lands
    events:
      - api.conflict: {write: 1, count: 1}
      - api.notFound: {verb: delete}
  - tick: 8
    note: the retired worker is gone, so the marker row is removed and the source is reset Ready on its running revision
    events:
      - pod.deleted[target]: {pod: {index: 1, runner: worker}}
