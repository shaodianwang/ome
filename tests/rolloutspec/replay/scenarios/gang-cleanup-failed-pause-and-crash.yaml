# A gang surge pair fails on its deadline and the abandon claims the
# cleanup marker. The controller then restarts, create refusals are armed
# that nothing meets, a partition is raised, and a frozen pause lands
# before the retired pods are gone: the cleanup claim is durable, nothing
# is created at a retired index, a marker is never a partition candidate,
# the retirement halts under the freeze, and it resumes on the unpause.
scenario: gang-cleanup-failed-pause-and-crash
arrows:
  - T-empty-gang-surge-target
  - T-gangtarget-deadline
  - T-failedgangtarget-cleanup-failed
  - T-failedgangsurge-reset
cells:
  - instance/Failed/GangSurgeTargetCleanup/ctrl.crash/before
  - instance/Failed/GangSurgeTargetCleanup/api.alreadyExists/before
  - instance/Failed/GangSurgeTargetCleanup/api.namespaceTerminating/before
  - instance/Failed/GangSurgeTargetCleanup/spec.partition/before
  - instance/Failed/GangSurgeTargetCleanup/spec.pauseFreeze/before
  - instance/Failed/GangSurgeTargetCleanup/spec.unpause/before
  - instance/Failed/GangSurge/api.namespaceTerminating/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    containerName: ome-container
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: the replacement is still not Ready when the deadline elapses, so both halves of the pair are stamped Failed with their operations preserved
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the abandon claims the cleanup marker and deletes the retired replacement's members
  - tick: 7
    note: the controller restarts, already-exists and terminating-namespace answers are armed for a create, and a partition is raised; the next manager re-derives the retirement from the durable claim, nothing is created at a retired index, and a marker is no partition candidate
    events:
      - ctrl.crash: {}
      - api.alreadyExists: {verb: create}
      - api.namespaceTerminating: {verb: create}
      - spec.partition: {to: 1}
  - tick: 8
    note: a frozen pause lands; the update pass is suspended, so the retirement halts
    events:
      - spec.pauseFreeze: {}
  - tick: 9
    note: the retired members are gone under the freeze; nothing runs to remove the marker or reset the source
    events:
      - pod.deleted[target]: {pod: {index: 1, runner: leader}}
      - pod.deleted[target]: {pod: {index: 1, runner: worker}}
  - tick: 10
    note: the pause is cleared, which only un-parks the passes; the retirement resumes on the pass that follows, removes the marker and resets the source Ready
    events:
      - spec.unpause: {}
