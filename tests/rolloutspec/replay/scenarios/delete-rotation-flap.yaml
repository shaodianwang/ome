# A draining Instance's endpoint drops out of rotation and comes back before
# the pass reads it. A pod back in rotation un-drains the index: the wave
# issues no delete and polls, until the endpoint is gone for good.
scenario: delete-rotation-flap
arrows:
  - T-ready-scaledown
  - T-delete-done
cells:
  - instance/Delete/Drain/endpoint.rotationIn[source]/before
initial:
  spec:
    replicas: 2
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true, node: node-0}
    - {index: 1, ready: true, serving: true, routed: true, node: node-1}
timeline:
  - tick: 1
    note: the operator halves the replica count, and the retired Instance is admitted into a Delete operation
    events:
      - spec.replicasDown: {to: 1}
  - tick: 2
    note: the first drive takes the retired pod's serving gate down and finds it still in rotation, so the wave polls
  - tick: 3
    note: the retired pod's endpoint drops and is published Ready again before the pass reads it, so the index is not drained and the wave issues no delete
    events:
      - endpoint.rotationOut[source]: {pod: {index: 1}}
      - endpoint.rotationIn[source]: {pod: {index: 1}}
  - tick: 4
    note: the endpoint is gone for good, so the wave issues the graceful delete
    events:
      - endpoint.rotationOut[source]: {pod: {index: 1}}
  - tick: 5
    note: the pod is gone and the row leaves the owner's status
    events:
      - pod.deleted[source]: {pod: {index: 1}}
  - tick: 6
    note: the Component is at rest with the retired Instance gone
