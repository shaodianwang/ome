# A gang parked at Failed with no operation and its target Held is
# narrowed by a worker. A narrower width changes only what the Create pass
# counts as missing and what the PodGroup asks for; the running extra
# member is neither wreckage nor a scale-down extra, so no pass removes it.
scenario: failed-held-gang-shrink
arrows:

cells:
  - instance/Failed/spec.gangWidth[shrink]/before
initial:
  spec:
    replicas: 1
    workers: 2
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
  rows:
    - {index: 0, phase: Failed, runningRevision: current}
  pods:
    - {index: 0, runner: leader}
    - {index: 0, runner: worker, ordinal: 0}
    - {index: 0, runner: worker, ordinal: 1}
  retryBlocks:
    - {revision: current, state: Held, attemptsStarted: 1, reason: ImagePullBackOff}
timeline:
  - tick: 1
    note: the gang is parked at Failed behind a Held target with its three members still present
  - tick: 2
    note: the gang narrows by a worker; the PodGroup is re-reconciled and the surplus member stands
    events:
      - spec.gangWidth[shrink]: {to: 1}
  - tick: 3
    note: a further pass finds the surplus worker still standing
