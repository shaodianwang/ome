# A gang source fails on its deadline at the drain step, after its
# replacement cleared the promote bar and then lost a member's readiness,
# and the roll is then pinned back onto the running revision. Past the
# Surge step the cycle finishes on its pin: the rollback reaches the row at
# zero revision distance, through no wreckage path and no abandon, so the
# replacement stays in rotation, the drained source is deleted once the
# routed Service has let it go, the replacement is promoted on the pinned
# revision, and the rolled-back target re-enters with a fresh surge from the
# promoted gang.
scenario: gang-draindeadline-rollback-keeps-replacement
arrows:
  - T-empty-gang-surge-target
  - T-gangtarget-ready
  - T-surgedrain-deadline
  - T-failedgangtarget-ready
  - T-failedgangsurgedrain-complete
cells:
  - instance/Failed/GangSurgeDrain/spec.rollbackTarget[set]/before
  - instance/Failed/GangSurgeDrain/pod.ready[target]/before
  - instance/Failed/GangSurgeDrain/endpoint.rotationOut[source]/before
  - instance/Failed/GangSurgeDrain/pod.deleted[source]/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: both replacement members report Ready and the leader enters rotation, so the source advances to the drain and leaves the serving gate
    events:
      - pod.ready[target]: {pod: {index: 1, runner: leader}}
      - pod.ready[target]: {pod: {index: 1, runner: worker}}
      - endpoint.rotationIn[target]: {pod: {index: 1, runner: leader}}
  - tick: 6
    note: the replacement worker's readiness regresses while the source is still published, so the pair is no longer fully serving
    events:
      - pod.containersNotReady[target]: {pod: {index: 1, runner: worker}}
  - tick: 7
    note: the deadline elapses with the replacement short, so the source is stamped Failed at its drain step and the marker Failed too, both operations kept
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 8
    note: the roll is pinned back to the first revision; past the Surge step the cycle finishes on its pin, so the replacement keeps its gate and nothing is abandoned
    events:
      - spec.rollbackTarget[set]: {image: registry.example.com/runtime:v1}
  - tick: 9
    note: the replacement worker comes back Ready, so the continuation re-reads a complete runtime-ready gang and waits for the drained source to leave the routed Service
    events:
      - pod.ready[target]: {pod: {index: 1, runner: worker}}
  - tick: 10
    note: the source leader leaves the routed Service, so the drain has converged and the source pods are deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
  - tick: 11
    note: the source pods are gone, so the replacement is promoted Ready on the pinned revision and the source row is removed
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
  - tick: 12
    note: the promoted replacement runs the pinned revision while the roll target is the first one, so a fresh gang surge toward the rolled-back revision opens from it
  - tick: 13
    note: the fresh surge's PodGroup is announced before its first member, and both members are created at the rolled-back revision
