# A Phase B pod wedges on the target image. The escalation blames only a pod
# carrying the target revision hash, so the wedge has to be on the rebuilt
# pod; it is already older than the stuck-pod grace, so the disposition lands
# on the pass that first reads the reason.
scenario: drain-stuck
arrows:
  - T-ready-recreate
  - T-drain-stuck
cells:
  - instance/Update/Drain/pod.waiting[ImagePullBackOff]/before
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the pod becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the pod template changes and the strategy rebuilds in place of surging
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the pod leaves rotation, so the rebuild may start
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 5
    note: the old pod is gone and Phase B rebuilds it at the bumped incarnation
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 6
    note: the rebuilt pod is still booting two minutes on, which is longer than the grace but proves nothing on its own
    events:
      - clock.advance: 2m
  - tick: 7
    note: the rebuilt pod wedges on the target image, and being older than the grace it is escalated on the pass that reads the reason
    events:
      - pod.waiting[ImagePullBackOff]: {pod: {index: 0}, message: "manifest unknown"}
