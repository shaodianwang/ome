# A gang's Create attempt is ended by the gang verdict with its Create
# operation kept, and its members are then all lost. With no pod standing
# the Create pass finds every name missing, but it leaves an attempt the
# verdict ended: no Create is restamped at the pinned revision, the members
# are not re-created, the verdict is not announced again, and the foreign
# group going away changes none of that. The row waits for the reset
# mailbox or a corrective revision.
scenario: create-failed-podless-restamp-loop
cells:
  - instance/Failed/Create/pod.deleted[source]/before
  - instance/Failed/Create/gang.podGroup[OwnershipConflict]/before
  - instance/Failed/Create/gang.podGroup[Deleted]/before
  - instance/Failed/Create/ctrl.resync/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    containerName: ome-container
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: the group's controller reference is rewritten to another owner; the gang verdict ends the attempt, Failed with its Create operation kept
    events:
      - gang.podGroup[OwnershipConflict]: {instance: 0}
  - tick: 3
    note: both members are lost at once; with no survivor the lost-member repair does not fire, and the Create pass leaves the kept attempt rather than restamping it
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
  - tick: 4
    note: the name still belongs to another controller; with no attempt restamped there is nothing for the verdict to end again, and no warning
  - tick: 5
    note: a further pass writes nothing; there is no alternation to go on
  - tick: 6
    note: the foreign PodGroup is deleted, so the PodGroup pass announces the name under this owner; nothing re-drives the ended attempt, so no member is created
    events:
      - gang.podGroup[Deleted]: {instance: 0}
  - tick: 7
    note: the attempt waits on its members like any first materialization
