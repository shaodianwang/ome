# The replacement wedges on its image under a stuck-pod grace long enough
# that nothing escalates. The operator then shortens the grace. The knob is
# re-read on every pass and bounds the stuck-pod evidence, so the edit
# changes nothing by itself and the very next pass escalates the wedge that
# is already older than the new grace.
scenario: surge-stuck-grace-shortened
arrows:
  - T-ready-surge
  - T-surge-stuck
cells:
  - instance/Update/Surge/config.changed[stuckPodGrace]/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1h
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the pull wedges two minutes into the replacement's life, well inside the hour of grace, so the surge keeps waiting
    events:
      - clock.advance: 2m
      - pod.waiting[ImagePullBackOff]: {pod: {index: 0, ordinal: 1}, message: "manifest unknown"}
  - tick: 5
    note: the operator shortens the grace to a minute; the next pass reads the new bound and disposes the wedge that is already older than it
    events:
      - config.changed[stuckPodGrace]: {config: {stuckPodGrace: 1m}}
