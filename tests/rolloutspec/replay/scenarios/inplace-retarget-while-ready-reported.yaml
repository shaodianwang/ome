# A further image edit lands on the pass that reads the patched pod ready on
# the superseded image. The retarget rewrites the expected images, so that
# readiness completes nothing and the confirmation re-runs against the new
# marker; once promoted, a yet newer target re-enters from Ready.
scenario: inplace-retarget-while-ready-reported
arrows:
  - T-ready-inplace
  - T-inplace-retarget
  - T-inplace-ready
cells:
  - instance/Update/InPlace/pod.containersReady[source]/boundary@T-inplace-retarget
  - instance/Update/InPlace/spec.revision/after@T-inplace-ready
initial:
  spec:
    replicas: 1
    strategy: InPlaceIfPossible
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the pod becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: only the image changed, so the update is eligible to run in place
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the pod leaves rotation, so the transition marker is written
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 5
    note: the image patch lands while the source is out of rotation
  - tick: 6
    note: the kubelet confirms the superseded image as a further image-only edit lands, so the roll retargets in place and that readiness completes nothing
    events:
      - pod.containersReady[source]: {pod: {index: 0}}
      - spec.revision: {image: registry.example.com/runtime:v3}
  - tick: 7
    note: the kubelet has rolled the container onto the new target, so the runtime confirms it and the Instance promotes
    events:
      - pod.ready[target]: {pod: {index: 0}}
  - tick: 8
    note: a newer target lands on the promoted Instance and re-enters through the trigger from Ready
    events:
      - spec.revision: {image: registry.example.com/runtime:v4}
