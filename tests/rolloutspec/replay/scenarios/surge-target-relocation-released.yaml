# The relocation directive meets a pool with no room elsewhere. Two
# Instances surge to a new revision; Instance 1 promotes on it, Instance
# 0's replacement wedges on node-1 and the deadline records a directive
# against that node. The wedged replacement is removed and the roll
# re-surges a replacement that must avoid node-1; the scheduler finds it
# no other node and the hold outlasts the configured grace. The exclusion
# is what stands between the pod and the only room there is, so the
# disposition releases it with one event, fails the attempt with the
# scheduler's verdict and charges no revision; the next rebuild is free
# to land on node-1 again.
scenario: surge-target-relocation-released
arrows:
  - T-ready-surge
  - T-surge-target-ready
  - T-surgedrain-promote
  - T-surge-deadline
cells:
  - instance/Update/Surge/timer.operationDeadline/before
  - instance/Update/Surge/pod.unschedulable[target]/before
intentional: >-
  a node exclusion whose rebuild the scheduler could not place is
  released past the unschedulable grace; the attempt fails
  environment-caused and the budget the directive spent stays spent. The
  Failed source whose wedged replacement is removed is no crash-loop park
  (its record names the replacement, not its own pod) and is not promoted
  by the Create pass, so it re-surges from Failed rather than from Ready
initial:
  spec:
    replicas: 2
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
    migrationMode: Auto
  config:
    requeueOperation: 5s
    requeueGate: 3s
    autoMigrateBudget: 3
    unschedulableGrace: 10m
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
    - {index: 1, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: both sources are bound to node-0, then the pod template changes, so both Instances surge a replacement
    events:
      - pod.scheduled[source]: {pod: {index: 0, ordinal: 0}, message: node-0}
      - pod.scheduled[source]: {pod: {index: 1, ordinal: 0}, message: node-0}
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 2
    note: Instance 1's replacement is bound to node-2, serves and enters rotation, so the new revision is known to work
    events:
      - pod.scheduled[target]: {pod: {index: 1, ordinal: 1}, message: node-2}
      - pod.ready[target]: {pod: {index: 1, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 1, ordinal: 1}}
  - tick: 3
    note: Instance 1's source leaves rotation and is deleted, so Instance 1 promotes on the new revision
    events:
      - endpoint.rotationOut[source]: {pod: {index: 1, ordinal: 0}}
      - pod.deleted[source]: {pod: {index: 1, ordinal: 0}}
  - tick: 4
    note: Instance 0's replacement is bound to node-1 and wedges there
    events:
      - pod.scheduled[target]: {pod: {index: 0, ordinal: 1}, message: node-1}
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 0, ordinal: 1}, message: "back-off restarting failed container"}
  - tick: 5
    note: the operation deadline elapses; the attempt is disposed with a relocation directive against node-1 and the wave is not counted on the ladder
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the wedged replacement is gone and the roll re-drives the surge; the new replacement must avoid node-1
    events:
      - pod.deleted[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 7
    note: the scheduler finds the replacement no node that is not node-1, so the hold is recorded and the clock parks
    events:
      - pod.unschedulable[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 8
    note: the hold outlasts the grace; the exclusion of node-1 is released with one event, the attempt fails with the scheduler's verdict and no revision is charged
    events:
      - clock.advance: 11m
