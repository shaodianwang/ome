# Two Instances roll one surge at a time under an unavailability budget of
# one. The first promotes onto the new revision and its runner then
# restarts, so the restart policy opens a repair that consumes every pass
# until the rebuilt pod serves. The second Instance's surge, already in
# flight, advances beside it: its replacement gets the serving gate on a
# pass the repair consumes, the drain is admitted because the one Instance
# not serving the target is within the budget, and the source is drained,
# deleted and the Instance promoted while the repair is still open.
scenario: surge-beside-repair-drains-under-unavailable-budget
arrows:
  - T-ready-surge
  - T-surge-target-ready
  - T-surgedrain-promote
  - T-ready-restart-crash
  - T-restart-ready
cells:
  - instance/Ready/spec.revision/before
  - instance/Ready/pod.containerRestart/boundary@T-ready-restart-crash
  - instance/Update/Surge/pod.containersReady[target]/before
  - instance/Update/Surge/pod.ready[target]/boundary@T-surge-target-ready
  - instance/Update/SurgeDrain/pod.deleted[source]/boundary@T-surgedrain-promote
initial:
  spec:
    replicas: 2
    strategy: SurgeThenDrain
    maxSurge: "1"
    maxUnavailable: "1"
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    containerName: ome-container
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
timeline:
  - tick: 1
    note: cold start materializes both Instances on the starting revision
  - tick: 2
    note: both sources become Ready and enter rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
      - pod.ready[source]: {pod: {index: 1, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 1, ordinal: 0}}
  - tick: 3
    note: a new revision is pushed, so the first Instance surges a replacement and the second waits on the surge budget
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the first replacement is serving and in rotation beside its source, so the source leaves the serving gate
    events:
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 5
    note: the first source leaves rotation, so the drain has converged and the source is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 6
    note: the first source is gone, so the first Instance promotes onto the new revision
    events:
      - pod.deleted[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 7
    note: the surge budget frees, so the second Instance surges its replacement
  - tick: 8
    note: half a minute later the promoted runner restarts and leaves rotation, so the restart policy opens a repair on the first Instance and takes the crashed pod out; the pass is the repair's, and the second Instance's surge, with its replacement still booting, has nothing to advance yet
    events:
      - clock.advance: 30s
      - pod.containerRestart: {pod: {index: 0, ordinal: 1}, message: Error}
      - endpoint.rotationOut[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 9
    note: the crashed pod is gone, so the repair rebuilds the set at the bumped incarnation on the revision it ran
    events:
      - pod.deleted[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 10
    note: the second replacement reports ContainersReady on a pass the open repair consumes, and the surge in flight still writes its serving gate
    events:
      - pod.containersReady[target]: {pod: {index: 1, ordinal: 1}}
  - tick: 11
    note: the second replacement reports Ready and enters rotation; the one Instance on the target not serving it is within the unavailability budget, so the drain is admitted beside the open repair and the source leaves the serving gate
    events:
      - pod.ready[target]: {pod: {index: 1, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 1, ordinal: 1}}
  - tick: 12
    note: the second source leaves rotation, so it is deleted while the repair is still open
    events:
      - endpoint.rotationOut[source]: {pod: {index: 1, ordinal: 0}}
  - tick: 13
    note: the second source is gone, so the second Instance promotes onto the new revision beside the open repair
    events:
      - pod.deleted[source]: {pod: {index: 1, ordinal: 0}}
  - tick: 14
    note: the rebuilt pod reports Ready and enters rotation, so the repair completes and every Instance serves the new revision
    events:
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
