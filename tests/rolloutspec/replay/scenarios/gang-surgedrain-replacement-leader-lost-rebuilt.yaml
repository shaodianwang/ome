# A gang surge hands over and the replacement's leader is deleted from
# outside while its worker stands. The loss closes the attempt on the
# pushed revision's ladder; once the backoff is due the leader is rebuilt
# under the same name at the pinned revision beside the standing worker,
# the source re-arms under a fresh deadline, and the hand-over finishes with
# the whole gang on the pinned revision.
scenario: gang-surgedrain-replacement-leader-lost-rebuilt
arrows:
  - T-ready-surge
  - T-surgedrain-gang-replacement-lost
  - T-failedgangsurgedrain-rearm
  - T-surgedrain-gang-complete
cells:
  - instance/Update/SurgeDrain/pod.deleted[target]/before
  - instance/Failed/GangSurgeDrain/timer.retryAt/before
  - instance/Update/SurgeDrain/pod.ready[target]/before
  - instance/Update/SurgeDrain/pod.deleted[source]/before
intentional: >-
  a replacement gang that lost its leader after the hand-over is whole
  again before it is judged: the leader is rebuilt beside the standing
  worker and the pair finishes on the pinned revision with both members
initial:
  spec:
    replicas: 2
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    maxSurge: "1"
    maxUnavailable: "0"
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    updateRetry: {maxAttempts: 3, initialDelay: 1m, maxDelay: 30m, multiplier: 2}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, runner: leader, ready: true, serving: true, routed: true, node: node-0}
    - {index: 0, runner: worker, ready: true, serving: true, node: node-1}
    - {index: 1, runner: leader, ready: true, serving: true, routed: true, node: node-2}
    - {index: 1, runner: worker, ready: true, serving: true, node: node-3}
timeline:
  - tick: 1
    note: the template changes, so the first gang claims the free index as its replacement and the other gang waits on the surge budget
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 2
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 3
    note: both replacement members report Ready and the leader enters rotation, so the source advances to the drain and leaves the serving gate
    events:
      - pod.ready[target]: {pod: {index: 2, runner: leader}}
      - pod.ready[target]: {pod: {index: 2, runner: worker}}
      - endpoint.rotationIn[target]: {pod: {index: 2, runner: leader}}
  - tick: 4
    note: the replacement leader is deleted from outside while the worker stands; the loss closes the attempt, so the source is stamped Failed with its surge kept and the pushed revision's ladder counts the attempt
    events:
      - pod.deleted[target]: {pod: {index: 2, runner: leader}}
  - tick: 5
    note: a pass with nothing changed
  - tick: 6
    note: the ladder's backoff is due, so the lost leader is rebuilt at the pinned revision beside the standing worker and the source re-arms under a fresh deadline with the retry counted
    events:
      - timer.retryAt: {slack: 1s}
  - tick: 7
    note: the rebuilt leader reports Ready and enters rotation, so the whole replacement is runtime-ready again
    events:
      - pod.ready[target]: {pod: {index: 2, runner: leader}}
      - endpoint.rotationIn[target]: {pod: {index: 2, runner: leader}}
  - tick: 8
    note: the source leader leaves the routed Service, so the drain has converged and the source pods are deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
  - tick: 9
    note: the source pods are gone, so the whole replacement is promoted Ready on the pinned revision, the ladder is pruned and the source row is removed
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
  - tick: 10
    note: a pass with nothing changed
