# The route T-failed-adopt-revision is written for, recorded as the engine
# actually walks it. A create attempt runs out of deadline before its pod
# ever reported ready, so the row is Failed with no recorded RunningRevision;
# when the pod then reports ContainersReady the AdoptRevision backfill is
# supposed to stamp Ready on the target. It does not: the backfill's
# spec-match test compares the live pod's PodSpec against the raw desired
# template, and the renderer adds Hostname, Subdomain and the serving
# readiness gate to every pod it writes, so the two never compare equal and
# the trigger takes the ordinary roll instead.
scenario: failed-runtime-ready-resurge
arrows:
  - T-empty-create
  - T-create-deadline
intentional: >-
  the arrow out of Failed on pod.containersReady[source] says Ready by
  AdoptRevision; the engine opens a fresh Surge at the same target instead,
  because podMatchesTarget compares a rendered pod against the unrendered
  desired PodSpec and no rendered pod can match it
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the index is planned and no row exists, so the Create pass opens the attempt
  - tick: 2
    note: the pod exists but reports no readiness
  - tick: 3
    note: the operation deadline elapses with the pod still not ready, so the attempt is disposed and RunningRevision is never recorded
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 4
    note: the pod reports runtime readiness on the target revision, and the row re-surges at that same target rather than adopting it
    events:
      - pod.containersReady[source]: {pod: {index: 0}}
