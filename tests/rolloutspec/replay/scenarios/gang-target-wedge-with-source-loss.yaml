# A source pod is lost on the tick a replacement member's pull wedge is read.
# The blamed pod is the replacement's, so the loss changes no evidence; the
# source abandons the surge on the next pass as it would have anyway.
scenario: gang-target-wedge-with-source-loss
arrows:
  - T-empty-gang-surge-target
  - T-gangtarget-stuck-failed
  - T-gangtarget-cleanup-failed
  - T-gangcleanup-done
cells:
  - instance/Update/GangSurgeTarget/pod.deleted[source]/boundary@T-gangtarget-stuck-failed
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 2m, maxDelay: 10m, multiplier: 2}
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: the replacement gang is still booting two minutes on, which is longer than the grace but proves nothing on its own
    events:
      - clock.advance: 2m
  - tick: 6
    note: the pull wedges on a member older than the grace as the source worker disappears; both halves are stamped Failed on the replacement's evidence
    events:
      - pod.waiting[ImagePullBackOff]: {pod: {index: 1, runner: worker}, message: "manifest unknown"}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
  - tick: 7
    note: the source reads its own Failed on this surge and abandons it, claiming the marker as a cleanup
  - tick: 8
    note: the retired members are gone, so the marker is removed, the short source is reset Ready and the retired revision's block is recorded
    events:
      - pod.deleted[target]: {pod: {index: 1, runner: leader}}
      - pod.deleted[target]: {pod: {index: 1, runner: worker}}
  - tick: 9
    note: the reset source is short a member and off a blocked target, which is where the next pass leaves it
