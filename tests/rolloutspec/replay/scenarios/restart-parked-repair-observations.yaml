# A repair parked at Failed on a crash-looping rebuilt pod, with no retry
# ladder configured. Binding, rotation, the gate leaving, an in-place
# runner restart, the pod reappearing under a new UID, a queue gate and its
# admission, the node under it going NotReady and a kubelet that stops
# reporting are read by none of the repair's exits; a tick with nothing
# changed, a controller restart and a lagging cache write nothing either,
# and neither do an edit outside the revision hash, a strategy edit, a
# promote knob and a replica increase.
scenario: restart-parked-repair-observations
arrows:
  - T-ready-restart
  - T-restart-stuck
cells:
  - instance/Failed/Repair/pod.scheduled[source]/before
  - instance/Failed/Repair/endpoint.rotationIn[source]/before
  - instance/Failed/Repair/endpoint.rotationOut[source]/before
  - instance/Failed/Repair/pod.servingOff[source]/before
  - instance/Failed/Repair/pod.containerRestart/before
  - instance/Failed/Repair/pod.uidRotated/before
  - instance/Failed/Repair/pod.schedulingGated/before
  - instance/Failed/Repair/pod.admitted/before
  - instance/Failed/Repair/pod.nodeLost[NodeNotReady]/before
  - instance/Failed/Repair/pod.phaseTerminal[Unknown]/before
  - instance/Failed/Repair/ctrl.resync/before
  - instance/Failed/Repair/ctrl.crash/before
  - instance/Failed/Repair/ctrl.staleRead/before
  - instance/Failed/Repair/spec.annotationOnly/before
  - instance/Failed/Repair/spec.strategy/before
  - instance/Failed/Repair/spec.policyTuning[markNotReady]/before
  - instance/Failed/Repair/spec.replicasUp/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
    containerName: ome-container
    podLabels: {kueue.x-k8s.io/queue-name: queue-a}
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the rebuilt pod crash-loops and is older than the grace when the wedge is read, so the row fails with its operation preserved
    events:
      - clock.advance: 2m
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 0}, message: "back-off restarting failed container"}
  - tick: 4
    note: the wedged pod is bound; binding is observation only
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-1}
  - tick: 5
    note: the pod's endpoint enters the routed Service; the resume reads ContainersReady and PodReady, never the endpoints
    events:
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 6
    note: the endpoint leaves again; a parked repair's set is out of rotation and leaving it moves counters alone
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 7
    note: the gate is withdrawn from a pod that never carried it; nothing is written
    events:
      - pod.servingOff[source]: {pod: {index: 0}}
  - tick: 8
    note: the runner restarts in place; restart evidence is read against ReadySince for a Ready row only, and this wedge is already recorded
    events:
      - pod.containerRestart: {pod: {index: 0}, message: OOMKilled}
  - tick: 9
    note: the pod reappears under a new UID, fresh and Pending; the exits read the incarnation label, not the UID
    events:
      - pod.uidRotated: {pod: {index: 0}}
  - tick: 10
    note: a queue admission gates the fresh pod; a gate parks no clock on a row whose clock is the ladder's
    events:
      - pod.schedulingGated: {pod: {index: 0}}
  - tick: 11
    note: the queue admits the pod; the deadline reconciler restarts no clock for a Failed row
    events:
      - pod.admitted: {pod: {index: 0}}
  - tick: 12
    note: the pod is bound and its node goes NotReady; node-death evidence reaches the row through its pods and the sweep, and no exit reads it directly
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-2}
      - pod.nodeLost[NodeNotReady]: {pod: {index: 0}}
  - tick: 13
    note: the kubelet stops reporting and the pod reads Unknown, which is not terminal; the pod stays a live name-holder the close never counts out
    events:
      - pod.phaseTerminal[Unknown]: {pod: {index: 0}}
  - tick: 14
    note: a tick with nothing changed re-evaluates the set and writes nothing
  - tick: 15
    note: the controller restarts; the kept operation and the recorded failure are persisted, so the next manager reads the same park
    events:
      - ctrl.crash: {}
  - tick: 16
    note: the cache lags one event behind for this pass; every exit re-reads the row and nothing is written
    events:
      - ctrl.staleRead: {}
  - tick: 17
    note: the queue label moves; the edit is outside the revision hash, so the target is unchanged and the exits stand
    events:
      - spec.annotationOnly: {labels: {kueue.x-k8s.io/queue-name: queue-b}}
  - tick: 18
    note: the update strategy changes; a repair rebuilds at the running revision whatever the strategy says
    events:
      - spec.strategy: {strategy: RecreatePod}
  - tick: 19
    note: the in-place mark-not-ready knob flips; it is read by no exit of a parked repair
    events:
      - spec.policyTuning[markNotReady]: {value: "true"}
  - tick: 20
    note: the replica count grows; the new index is the Create pass's and this row's index stays in the desired set as it was
    events:
      - spec.replicasUp: {to: 2}
