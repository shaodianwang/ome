# A parked attempt whose single pod is deleted by another hand before it
# ever came up. On its way out the pod is live and holds its name, so the
# set reads short and nothing opens; its kubelet going silent changes
# nothing without a force-delete policy; once the object is gone no pod of
# the set is left and the fresh start waits on the ladder.
scenario: parked-down-pod-leaving
arrows:
  - T-ready-recreate
  - T-drain-deadline
cells:
  - instance/Failed/Parked/pod.terminating[source]/before
  - instance/Failed/Parked/pod.stuckTerminating/before
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 1h, maxDelay: 2h, multiplier: 2}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod template changes, so the roll drains the pod for a recreate
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the pod leaves rotation, so it is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 4
    note: the old pod is gone, so the rebuild lands at the new revision
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 5
    note: the deadline elapses on a rebuilt pod that never came up; the ladder counts the wave and the attempt is parked with the row Failed
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the parked pod is deleted by another hand; on its way out it is live and holds its name, so the set reads short and nothing opens
    events:
      - pod.terminating[source]: {pod: {index: 0}}
  - tick: 7
    note: the pod's kubelet stops acknowledging the deletion; with no force-delete policy nothing frees the name and the row reads the set as it is
    events:
      - pod.stuckTerminating: {pod: {index: 0}}
  - tick: 8
    note: the object is gone, so no pod of the set is left
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 9
    note: a further pass
