# A further target lands on the pass that also reads the old pod ready.
# The second Incarnation bump restarts Phase A, so the ready pod belongs to
# an incarnation the retarget is about to drain and delete.
scenario: recreate-retarget-while-source-reports-ready
arrows:
  - T-ready-recreate
  - T-drain-retarget
cells:
  - instance/Update/Drain/pod.ready[source]/boundary@T-drain-retarget
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the pod becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the pod template changes and the strategy rebuilds in place of surging
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the pod stays published, so Phase A holds on the drain
  - tick: 5
    note: a further target lands as the old pod reports ready again, so the roll reopens at the new one and the pod is still Phase A's to drain
    events:
      - pod.ready[source]: {pod: {index: 0}}
      - spec.revision: {image: registry.example.com/runtime:v3}
