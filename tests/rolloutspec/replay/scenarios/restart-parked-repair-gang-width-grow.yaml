# A gang repair parked at Failed on a crash-looping rebuilt worker is
# widened by a worker. A width change mints no revision, so the widened
# expectation reads the live set as short of a member and the lost-member
# trigger re-arms the gang as a whole at the running revision; the width
# re-applied changes nothing on the repair in flight.
scenario: restart-parked-repair-gang-width-grow
arrows:
  - T-ready-restart
  - T-restart-stuck
  - T-failedrepair-member-lost
cells:
  - instance/Failed/Repair/spec.gangWidth[grow]/before
  - instance/Failed/Repair/spec.gangWidth[grow]/boundary@T-failedrepair-member-lost
  - instance/Failed/Repair/spec.gangWidth[grow]/after@T-failedrepair-member-lost
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, runner: leader, ready: true, serving: true, routed: true}
    - {index: 0, runner: worker, ready: true, serving: true}
timeline:
  - tick: 1
    note: the Ready gang is steady on its two serving members
  - tick: 2
    note: the worker is deleted out from under the Instance, so the repair opens a Restart over the gang and takes the leader out of serving
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
  - tick: 3
    note: the leader leaves rotation, so the drain deletes it
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
  - tick: 4
    note: the old leader is gone, so both members are rebuilt at the bumped incarnation
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
  - tick: 5
    note: the rebuilt leader comes up while the rebuilt worker crash-loops past the grace, so the repair parks at Failed with its operation preserved
    events:
      - clock.advance: 2m
      - pod.containersReady[source]: {pod: {index: 0, runner: leader}}
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 0, runner: worker}, message: "back-off restarting failed container"}
  - tick: 6
    note: the gang widens by a worker; the widened expectation reads the live set as short, so the lost-member trigger re-arms the gang as a whole at the running revision and drains both members
    events:
      - spec.gangWidth[grow]: {to: 2}
  - tick: 7
    note: the width is re-applied; the row is Restarting and the edit changes nothing on the repair in flight
    events:
      - spec.gangWidth[grow]: {to: 2}
  - tick: 8
    note: the drained members are gone, so the rebuild lands at the bumped incarnation with the new width
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
