# The apiserver rejects the scale-down wave's pod delete as invalid. The
# victim ends as a rejected create does: Failed with the rejection as its
# reason, the Delete operation released, the revision in force held, one
# Warning. The wave neither re-issues the delete nor holds the pass open
# behind the victim.
scenario: delete-delete-invalid
arrows:
  - T-ready-scaledown
cells:
  - instance/Delete/Drain/api.invalid/before
initial:
  spec:
    replicas: 2
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true, node: node-0}
    - {index: 1, ready: true, serving: true, routed: true, node: node-1}
timeline:
  - tick: 1
    note: the operator halves the replica count, and the retired Instance is admitted into a Delete operation
    events:
      - spec.replicasDown: {to: 1}
  - tick: 2
    note: the retired pod leaves rotation and the wave's delete is rejected as invalid; the victim is disposed Failed with the Delete operation released and the revision in force held
    events:
      - endpoint.rotationOut[source]: {pod: {index: 1}}
      - api.invalid: {verb: delete}
  - tick: 3
    note: a further pass leaves the victim out of the wave and issues no write; the pass is not held open behind it
