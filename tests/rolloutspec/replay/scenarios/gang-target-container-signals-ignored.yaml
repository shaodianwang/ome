# Container evidence on a replacement member: a DeadlineExceeded waiting reason
# on a pod older than the stuck-pod grace, and an in-place container restart.
# Neither is read before Ready, so the surge is unmoved.
scenario: gang-target-container-signals-ignored
arrows:
  - T-empty-gang-surge-target
  - T-surgedrain-gang-complete
  - T-gangtarget-ready
cells:
  - instance/Update/GangSurgeTarget/pod.waiting[DeadlineExceeded]/before
  - instance/Update/GangSurgeTarget/pod.containerRestart/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    containerName: ome-container
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: two minutes on, the replacement is still booting, so any terminal waiting reason read now would be past the grace
    events:
      - clock.advance: 2m
  - tick: 6
    note: the worker reports DeadlineExceeded, which is not a terminal waiting reason, so the escalation stamps nothing
    events:
      - pod.waiting[DeadlineExceeded]: {pod: {index: 1, runner: worker}, message: "context deadline exceeded"}
  - tick: 7
    note: the leader's runner container restarts in place before the marker ever had a ReadySince, so the evidence is not dated against anything
    events:
      - pod.containersReady[target]: {pod: {index: 1, runner: leader}}
      - pod.containerRestart: {pod: {index: 1, runner: leader}, message: OOMKilled}
  - tick: 8
    note: the replacement gang reports Ready, so the source advances to the drain and leaves rotation
    events:
      - pod.ready[target]: {pod: {index: 1, runner: leader}}
      - pod.ready[target]: {pod: {index: 1, runner: worker}}
  - tick: 9
    note: the leader's endpoint goes not-ready, which is the guard the drain waits on, so the source pods are deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
  - tick: 10
    note: the source pods are gone, so its row is removed and the replacement index is promoted as the Instance
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
