# A gang is narrowed while its migration is at SurgePending. The surge
# mirrors the plan's live Runner list, but a shrink reaches it only through
# the names it must still create: the member it already built above the new
# width stays, is still read by the runtime-ready gate, and the source keeps
# the pod set it already had. Nothing removes the surplus on either side;
# the record's deadline ends the move and the scale-down pipeline takes the
# surge index with every pod it holds.
scenario: migrate-gang-surge-pending-width-shrink
arrows:
  - T-ready-migrate
  - T-empty-migrate-target
  - T-migrate-deadline-restore
  - T-migratetarget-expired
cells:
  - instance/Migrate/CreateSurge/spec.gangWidth[shrink]/before
  - instance/Migrate/SurgeTarget/spec.gangWidth[shrink]/before
initial:
  spec:
    replicas: 1
    workers: 2
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    migrationMode: Auto
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes all three
  - tick: 2
    note: every member is bound to node-0 and reports Ready, and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.scheduled[source]: {pod: {index: 0, runner: leader}, message: node-0}
      - pod.scheduled[source]: {pod: {index: 0, runner: worker, ordinal: 0}, message: node-0}
      - pod.scheduled[source]: {pod: {index: 0, runner: worker, ordinal: 1}, message: node-0}
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker, ordinal: 0}}
      - pod.ready[source]: {pod: {index: 0, runner: worker, ordinal: 1}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the operator asks the Instance off node-0, and the migrate pass admits the request and establishes the pair
    events:
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
  - tick: 4
    note: the surge gang's PodGroup is announced before its first member, and all three members are created
  - tick: 5
    note: the gang is narrowed by one worker, so the surge's desired pod set shrinks under a member already built, which stays, and the source keeps the pod set it already had
    events:
      - spec.gangWidth[shrink]: {to: 1}
  - tick: 6
    note: a tick with nothing changed finds the surplus member still standing on both sides and waits on the surge gates
  - tick: 7
    note: the record's deadline elapses, so the expiry clears both pins, closes the record and restores the source to Ready on its running revision
    events:
      - timer.migrationDeadline: {slack: 1s}
  - tick: 8
    note: the unpinned surge index is beyond the desired set, so the scale-down pipeline commits Phase Deleting on it with every pod it holds
