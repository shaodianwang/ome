# The update strategy and the restart policy change while a retired replacement
# is being cleaned up. The retirement reads neither; it runs to completion and
# the reset source takes the next roll under the new settings.
scenario: gang-cleanup-spec-edits-ignored
arrows:
  - T-empty-gang-surge-target
  - T-gangtarget-cleanup-superseded
  - T-gangcleanup-done
cells:
  - instance/Update/GangSurgeTargetCleanup/spec.strategy/before
  - instance/Update/GangSurgeTargetCleanup/spec.policyTuning[restartPolicy]/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: the template changes again while the replacement is still incomplete, so the marker is claimed as a cleanup and its members are deleted
    events:
      - spec.revision: {image: registry.example.com/runtime:v3}
  - tick: 6
    note: the strategy and the restart policy are both edited; the retirement continues to wait on its Terminating members
    events:
      - spec.strategy: {strategy: RecreatePod}
      - spec.policyTuning[restartPolicy]: {value: None}
  - tick: 7
    note: the retired members are gone, so the marker is removed and the source is reset Ready on its running revision
    events:
      - pod.deleted[target]: {pod: {index: 1, runner: leader}}
      - pod.deleted[target]: {pod: {index: 1, runner: worker}}
  - tick: 8
    note: the reset source is off the new target, and the roll that follows reads the edited strategy
