# The desired gang width narrows while an attempt is parked: the narrower
# gang is the next attempt's to render, and the parked set is replaced
# whole rather than resized.
scenario: parked-gang-width-edits
arrows:
  - T-empty-create
  - T-ready-recreate
  - T-drain-deadline
  - T-failed-parked-serves
cells:
  - instance/Update/Parked/spec.gangWidth[shrink]/before
intentional: >-
  an attempt parked after its disposition is the roll's while a pod of its
  set stands: the Create pass neither promotes the set nor re-asserts its
  serving gate, and asks for no wake-up of its own for it, so the pass waits
  on the ladder's next admission instead of its own cadence
initial:
  spec:
    replicas: 1
    workers: 2
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 1h, maxDelay: 2h, multiplier: 2}
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes the leader and two workers
  - tick: 2
    note: every member reports Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker, ordinal: 0}}
      - pod.ready[source]: {pod: {index: 0, runner: worker, ordinal: 1}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the pod template changes, so the roll drains the gang for a recreate
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the leader leaves rotation and the drained members are deleted, so the roll recreates them at the new revision
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker, ordinal: 0}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker, ordinal: 1}}
  - tick: 5
    note: the rebuilt leader reports ContainersReady while the workers are still booting, so the set is short of serving
    events:
      - pod.containersReady[target]: {pod: {index: 0, runner: leader}}
  - tick: 6
    note: the deadline elapses on the live set; the ladder counts the wave and the attempt is parked with the row Failed
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 7
    note: the workers come up and every member carries the serving gate, so the parked set serves in full and the row reads as the roll in progress with the attempt still parked
    events:
      - pod.containersReady[source]: {pod: {index: 0, runner: worker, ordinal: 0}}
      - pod.containersReady[source]: {pod: {index: 0, runner: worker, ordinal: 1}}
      - pod.servingOn[source]: {pod: {index: 0, runner: worker, ordinal: 0}}
      - pod.servingOn[source]: {pod: {index: 0, runner: worker, ordinal: 1}}
      - pod.servingOn[source]: {pod: {index: 0, runner: leader}}
  - tick: 8
    note: the gang narrows by a worker; the parked set is replaced whole by the next attempt, not resized
    events:
      - spec.gangWidth[shrink]: {to: 1}
  - tick: 9
    note: a further pass finds the row where its set put it and the surplus worker still standing
