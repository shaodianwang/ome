# A recreate's rebuilt pod reaches Phase C, loses readiness and regains it,
# and the availability window is raised and lowered under it. Phase C gates
# on every bumped-incarnation pod being ContainersReady before it flips
# serving, so a regression re-closes that gate and the promote waits for
# readiness to return; the promote re-reads the window from the live plan on
# every pass, so raising it re-opens the availability wait and lowering it
# lets the next pass promote.
scenario: recreate-rebuilt-pod-regression-and-window
arrows:
  - T-ready-recreate
  - T-drain-ready
cells:
  - instance/Update/Drain/pod.containersNotReady[source]/before
  - instance/Update/Drain/spec.policyTuning[minReadySeconds]/before
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the pod is bound, becomes Ready and enters rotation
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-0}
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the pod template changes and the strategy rebuilds in place of surging, so Phase A takes the serving gate down
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the source leaves rotation, which releases the drain guard and issues the delete
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 5
    note: the source is gone, so Phase B rebuilds it at the bumped incarnation
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 6
    note: the rebuilt pod is bound, reports ContainersReady and its endpoint returns, so Phase C flips serving on and waits for PodReady
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-0}
      - pod.containersReady[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 7
    note: the rebuilt pod's containers drop readiness while it keeps running, which re-closes the readiness gate Phase C requires, so the promote waits for readiness to return
    events:
      - pod.containersNotReady[source]: {pod: {index: 0}}
  - tick: 8
    note: the availability window is raised to five minutes as the pod reports Ready again, so the promote re-opens the wait on it
    events:
      - spec.policyTuning[minReadySeconds]: {value: "300"}
      - pod.containersReady[source]: {pod: {index: 0}}
      - pod.ready[source]: {pod: {index: 0}}
  - tick: 9
    note: the window is lowered to zero, so the next pass promotes
    events:
      - spec.policyTuning[minReadySeconds]: {value: "0"}
