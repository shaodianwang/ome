# A gang surge pair fails on its deadline and the elapsed deadline is read
# again on every pass that follows: while the source still drives the
# abandon from its Failed Surge step, in the pass whose cleanup claim lands
# on the marker, and once the marker carries the cleanup claim. The
# escalation pass skips a row already Failed, so the clock produces no
# second stamp and no second event anywhere in the pair, and the retirement
# runs to its reset on the claim alone.
scenario: gang-failed-deadline-read-again
arrows:
  - T-empty-gang-surge-target
  - T-gangtarget-deadline
  - T-failedgangtarget-cleanup-failed
  - T-failedgangsurge-reset
cells:
  - instance/Failed/GangSurge/timer.operationDeadline/before
  - instance/Failed/GangSurgeTarget/timer.operationDeadline/boundary@T-failedgangtarget-cleanup-failed
  - instance/Failed/GangSurgeTargetCleanup/timer.operationDeadline/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: the replacement is still not Ready when the deadline elapses, so both halves of the pair are stamped Failed with their operations preserved
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the elapsed deadline is read again in the pass whose cleanup claim lands on the marker; both rows are already Failed, so neither is stamped again and the abandon deletes the retired replacement's pods
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 7
    note: the deadline is read once more against the cleanup marker; the retirement reads the claim and never the phase, and the escalation pass skips the Failed row, so nothing is written while the retired pods terminate
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 8
    note: the retired replacement's members are gone, so the marker row is removed and the source is reset Ready on its running revision with the failed revision's wave recorded
    events:
      - pod.deleted[target]: {pod: {index: 1, runner: leader}}
      - pod.deleted[target]: {pod: {index: 1, runner: worker}}
