# The repair's rebuilt pod is refused by its node after scheduling. A
# rejection is phase Failed, so the pod drops out of Phase B's name diff
# and the terminal recycle deletes it before the recreate, with the
# kubelet's reason on LastFailure; the refusal re-observed on the recycled
# object changes nothing, and the rebuild lands again once it is gone.
scenario: restart-rebuilt-pod-admission-rejected
arrows:
  - T-ready-restart
  - T-restart-recycle-terminal
  - T-restart-ready
cells:
  - instance/Restart/Drain/pod.admissionRejected[OutOfResource]/before
  - instance/Restart/Drain/pod.admissionRejected[OutOfResource]/boundary@T-restart-recycle-terminal
  - instance/Restart/Drain/pod.admissionRejected[OutOfResource]/after@T-restart-recycle-terminal
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the rebuilt pod is bound and its node refuses it for lack of a resource, so the recycle deletes the occupant of the rebuild's name with the kubelet's reason on LastFailure
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-1}
      - pod.admissionRejected[OutOfResource]: {pod: {index: 0}, resource: nvidia.com/gpu, message: "Node didn't have enough resource: nvidia.com/gpu, requested: 1, used: 8, capacity: 8"}
  - tick: 4
    note: the refusal is re-observed on the recycled object; the recycle writes no step and the delete in flight already answers it
    events:
      - pod.admissionRejected[OutOfResource]: {pod: {index: 0}, resource: nvidia.com/gpu, message: "Node didn't have enough resource: nvidia.com/gpu, requested: 1, used: 8, capacity: 8"}
  - tick: 5
    note: the refused pod is gone, so the rebuild lands again under the same name
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 6
    note: the rebuilt pod reports Ready, so the repair promotes the row on the same revision
    events:
      - pod.ready[source]: {pod: {index: 0}}
