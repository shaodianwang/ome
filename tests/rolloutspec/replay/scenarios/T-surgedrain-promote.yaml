# The whole SurgeThenDrain walk for a single-pod Instance: the replacement
# is created beside the source, the step advances once the replacement is
# serving, and the promote lands after the drained source is gone.
scenario: T-surgedrain-promote
arrows:
  - T-ready-surge
  - T-surge-target-ready
  - T-surgedrain-promote
cells:
  - instance/Ready/spec.revision/boundary@T-ready-surge
  - instance/Update/Surge/pod.ready[target]/boundary@T-surge-target-ready
  - instance/Update/SurgeDrain/pod.deleted[source]/boundary@T-surgedrain-promote
intentional: >-
  the source is deleted only once the per-revision routed Service has
  dropped its endpoint, which is the drain the step waits on
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement is serving and in rotation beside the source
    events:
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 5
    note: the source leaves rotation, so the drain has converged
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 6
    note: the drained source is gone
    events:
      - pod.deleted[source]: {pod: {index: 0, ordinal: 0}}
