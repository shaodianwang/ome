# A repair parked at Failed whose wedged pod exits with a terminal phase.
# Every remaining pod of the set is terminal, which the repair's exits read
# as no live pod left, so the restart pass closes the spent operation; the
# phase re-observed on the next pass is the Failed row's, whose recycle
# frees the name and rebuilds the index.
scenario: restart-parked-repair-terminal-closes
arrows:
  - T-ready-restart
  - T-restart-stuck
  - T-failedrepair-close-terminal
  - T-failed-recycle-rebuild
cells:
  - instance/Failed/Repair/pod.phaseTerminal[Failed]/boundary@T-failedrepair-close-terminal
  - instance/Failed/Repair/pod.phaseTerminal[Failed]/after@T-failedrepair-close-terminal
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the rebuilt pod crash-loops and is older than the grace when the wedge is read, so the row fails with its operation preserved
    events:
      - clock.advance: 2m
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 0}, message: "back-off restarting failed container"}
  - tick: 4
    note: the wedged pod exits with phase Failed; the set has no live pod left, so the restart pass closes the spent operation and the close writes no phase
    events:
      - pod.phaseTerminal[Failed]: {pod: {index: 0}}
  - tick: 5
    note: the terminal phase is re-observed on a Failed row with no operation, so its recycle frees the name under a fresh Create
    events:
      - pod.phaseTerminal[Failed]: {pod: {index: 0}}
  - tick: 6
    note: the recycled pod is gone, so the fresh start rebuilds the index
    events:
      - pod.deleted[source]: {pod: {index: 0}}
