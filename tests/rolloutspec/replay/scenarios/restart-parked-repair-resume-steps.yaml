# A repair parked at Failed on a crash-looping rebuilt pod resumes in
# steps. The gate flipped by another hand is nothing the resume reads; the
# pod reporting ContainersReady is, and the gate it would write is already
# on the pod; a readiness regression withdraws that precondition; the
# promote lands on the pass that finds the pod ContainersReady and PodReady
# together, and the readiness re-observed on the Ready row changes nothing.
scenario: restart-parked-repair-resume-steps
arrows:
  - T-ready-restart
  - T-restart-stuck
  - T-failedrepair-resume
cells:
  - instance/Failed/Repair/pod.servingOn[source]/before
  - instance/Failed/Repair/pod.containersNotReady[source]/before
  - instance/Failed/Repair/pod.containersReady[source]/boundary@T-failedrepair-resume
  - instance/Failed/Repair/pod.containersReady[source]/after@T-failedrepair-resume
intentional: >-
  a Failed row another verb still claims is that verb's: the Create pass
  does not re-prove a spent repair's set, so the restart pass's own promote
  is the only Ready stamp and the only InstanceReady announcement
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the rebuilt pod crash-loops and is older than the grace when the wedge is read, so the row fails with its operation preserved
    events:
      - clock.advance: 2m
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 0}, message: "back-off restarting failed container"}
  - tick: 4
    note: the serving gate is flipped on the wedged pod by another hand; the gate is the resume's to write after ContainersReady, so nothing is written
    events:
      - pod.servingOn[source]: {pod: {index: 0}}
  - tick: 5
    note: the container starts and the pod reports ContainersReady; the gate the resume would write is already on the pod, so nothing is written and the promote waits for PodReady
    events:
      - pod.containersReady[source]: {pod: {index: 0}}
  - tick: 6
    note: the pod's readiness regresses while it keeps running, which withdraws the resume's precondition; the set reads wedged again and the row keeps its state
    events:
      - pod.containersNotReady[source]: {pod: {index: 0}}
  - tick: 7
    note: the pod reports ContainersReady and PodReady in one observation, so the resume promotes the row on its running revision at the incarnation the pod carries
    events:
      - pod.containersReady[source]: {pod: {index: 0}}
      - pod.ready[source]: {pod: {index: 0}}
  - tick: 8
    note: the readiness is re-observed on the Ready row; the repair is over and nothing is written
    events:
      - pod.containersReady[source]: {pod: {index: 0}}
