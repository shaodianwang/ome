# The apiserver refuses the wave's pod writes as invalid: first the drain
# patch that takes the retired pod's serving gate down, then the pod
# delete. Nothing on this path classifies a 422, so each refusal returns
# as a plain error and the next pass issues the same write again until it
# lands; the row stays Deleting throughout and completes on absence.
scenario: delete-refused-writes-retry
arrows:
  - T-ready-scaledown
  - T-delete-done
cells:
  - instance/Delete/Drain/api.invalid/before
initial:
  spec:
    replicas: 2
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true, node: node-0}
    - {index: 1, ready: true, serving: true, routed: true, node: node-1}
timeline:
  - tick: 1
    note: the operator halves the replica count, and the retired Instance is admitted into a Delete operation
    events:
      - spec.replicasDown: {to: 1}
  - tick: 2
    note: the apiserver refuses the drain patch as invalid, so the pass ends on the error with the retired pod still serving
    events:
      - api.invalid: {verb: patch}
  - tick: 3
    note: the next pass issues the same patch again and it lands; the pod is still in rotation, so no delete follows yet
  - tick: 4
    note: the pod leaves rotation and the apiserver refuses the wave's delete as invalid, so the expectation rolls back and the pass ends with the pod still there
    events:
      - endpoint.rotationOut[source]: {pod: {index: 1}}
      - api.invalid: {verb: delete}
  - tick: 5
    note: the next pass re-reads the set and issues the same delete again
  - tick: 6
    note: the pod is gone and the row leaves the owner's status
    events:
      - pod.deleted[source]: {pod: {index: 1}}
