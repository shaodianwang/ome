# The apiserver refuses the wave's drain patch, the write that takes the
# retired pod's serving gate down, as invalid. A 422 is permanent, so the
# victim gets the ending a rejected create gets: the Delete operation is
# released, the row reads Failed with the apiserver's reason, the revision
# in force is held and one Warning names the pod. The next passes issue
# nothing for the row - neither the patch again nor the delete - while
# the ladder denies and the refused pod still stands; once the pod leaves
# on its own there is nothing left to refuse, so the wave takes the row
# again and it completes on absence.
scenario: delete-refused-writes-retry
arrows:
  - T-ready-scaledown
  - T-delete-done
cells:
  - instance/Delete/Drain/api.invalid/before
initial:
  spec:
    replicas: 2
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true, node: node-0}
    - {index: 1, ready: true, serving: true, routed: true, node: node-1}
timeline:
  - tick: 1
    note: the operator halves the replica count, and the retired Instance is admitted into a Delete operation
    events:
      - spec.replicasDown: {to: 1}
  - tick: 2
    note: the apiserver refuses the drain patch as invalid; the row is disposed Failed with the reason, the revision in force is held and one Warning names the pod, with the retired pod still serving
    events:
      - api.invalid: {verb: patch}
  - tick: 3
    note: the next pass leaves the row as the rejection left it and issues no write; the ladder denies a fresh start
  - tick: 4
    note: the pod leaves rotation on its own; the row is out of the wave's selection, so no delete is issued and the staged refusal is never consumed
    events:
      - endpoint.rotationOut[source]: {pod: {index: 1}}
      - api.invalid: {verb: delete}
  - tick: 5
    note: a further pass still issues nothing
  - tick: 6
    note: the pod is gone, so nothing of the refused write is left to refuse; the wave takes the row again and re-opens its Delete operation
    events:
      - pod.deleted[source]: {pod: {index: 1}}
  - tick: 7
    note: the next pass finds no pod behind the row and removes it from the owner's status
