# A single-pod surge resumed from persisted status: the row already carries
# the Update/Surge operation and the replacement already exists beside the
# serving source, as a controller restarted mid-surge finds them. The
# resumed pass picks the attempt up where the status says it is and runs it
# to the promote.
scenario: surge-resumed-from-status
arrows:
  - T-surge-target-ready
  - T-surgedrain-promote
cells:
  - instance/Update/Surge/ctrl.crash/before
  - instance/Update/Surge/pod.ready[target]/boundary@T-surge-target-ready
  - instance/Update/SurgeDrain/pod.deleted[source]/boundary@T-surgedrain-promote
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v2
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
  currentRevision: registry.example.com/runtime:v1
  rows:
    - index: 0
      phase: Updating
      runningRevision: registry.example.com/runtime:v1
      targetRevision: current
      readySince: 0s
      operation: {type: Update, step: Surge, strategy: SurgeThenDrain}
  pods:
    - {index: 0, ordinal: 0, previousImage: registry.example.com/runtime:v1, ready: true, serving: true, routed: true}
    - {index: 0, ordinal: 1, phase: Pending}
timeline:
  - tick: 1
    note: the resumed pass finds the surge in flight with its replacement created and not yet Ready, so it changes nothing and waits
  - tick: 2
    note: the replacement is serving and in rotation beside the source, so the step advances and the source leaves rotation
    events:
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 3
    note: the source leaves rotation, so the drain has converged and the source is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 4
    note: the drained source is gone, so the Instance promotes onto the replacement's slot
    events:
      - pod.deleted[source]: {pod: {index: 0, ordinal: 0}}
