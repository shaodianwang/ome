# Four Instances serve a revision; a push to a revision whose runner
# crashes under load after it has served is held by the ladder, and a
# move of the promoted Instance is asked for while the hold stands. The
# first Instance surges, promotes and crashes three times, each crash
# counting on the pushed revision's block until it Holds. The second
# Instance's replacement never serves and reaches its deadline under the
# hold: the pushed revision served on the first Instance, but the ladder
# has Held it, so the disposition blames no node, files no relocation
# directive and ends the attempt terminal against the Held block. The
# move is then answered in the pass that picks it: the source runs the
# held revision, so the record closes Failed naming the revision and its
# ladder, and nothing writes it again across the passes and the clock
# that follow, the record's own deadline included.
scenario: held-crash-load-move
arrows:
  - T-ready-surge
  - T-surge-target-ready
  - T-surgedrain-promote
  - T-ready-crashloop-restart
  - T-restart-ready
  - T-surge-deadline
cells:
  - instance/Update/Surge/timer.operationDeadline/before
  - instance/Ready/spec.migrateRequest/before
intentional: >-
  a move rejected for a held source revision is recorded once, as one
  Failed record and nothing more on any later pass or at its deadline;
  the second Instance's attempt expiring under the hold files no
  relocation directive, since a revision the ladder has Held is the
  failure itself and no node is blamed for it
initial:
  spec:
    replicas: 4
    strategy: SurgeThenDrain
    maxSurge: "1"
    maxUnavailable: "0"
    image: registry.example.com/runtime:v1
    containerName: ome-container
    instanceReadyTimeout: 30m
    migrationMode: Auto
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 2m, maxDelay: 10m, multiplier: 2}
    migrationAudit: {maxInFlight: 3, maxPerWindow: 10, window: 1h}
    autoMigrateBudget: 3
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 2, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 3, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true, node: node-0}
    - {index: 1, ready: true, serving: true, routed: true, node: node-1}
    - {index: 2, ready: true, serving: true, routed: true, node: node-2}
    - {index: 3, ready: true, serving: true, routed: true, node: node-3}
timeline:
  - tick: 1
    note: v2 is pushed, so Instance 0 surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 2
    note: the replacement is bound, serves and enters rotation, so the source leaves the serving gate
    events:
      - pod.scheduled[target]: {pod: {index: 0, ordinal: 1}, message: node-4}
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 3
    note: the source leaves rotation, so it is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 4
    note: the source is gone, so Instance 0 promotes onto v2
    events:
      - pod.deleted[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 5
    note: the surge budget frees, so Instance 1 surges its replacement
  - tick: 6
    note: half a minute later the promoted runner crashes under load and leaves rotation; Instance 1's replacement is bound
    events:
      - clock.advance: 30s
      - pod.scheduled[target]: {pod: {index: 1, ordinal: 1}, message: node-5}
      - pod.containerRestart: {pod: {index: 0, ordinal: 1}, message: Error}
      - endpoint.rotationOut[target]: {pod: {index: 0, ordinal: 1}}
      - pod.servingOff[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 7
    note: two minutes on the kubelet parks the runner in CrashLoopBackOff past the grace, so the repair opens a Restart on Instance 0
    events:
      - clock.advance: 2m
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 0, ordinal: 1}, message: "back-off restarting failed container"}
  - tick: 8
    note: the block comes due, so the ladder re-drives Instance 0 at the same target and drains the wedged pod
    events:
      - timer.retryAt: {slack: 1s}
  - tick: 9
    note: the drained pod is gone, so the rebuild lands
    events:
      - pod.deleted[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 10
    note: the rebuilt pod is bound, serves and enters rotation, so the attempt completes and Instance 0 is Ready on v2 again
    events:
      - pod.scheduled[target]: {pod: {index: 0, ordinal: 1}, message: node-6}
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 11
    note: half a minute later the runner crashes under load again and leaves rotation
    events:
      - clock.advance: 30s
      - pod.containerRestart: {pod: {index: 0, ordinal: 1}, message: Error}
      - endpoint.rotationOut[target]: {pod: {index: 0, ordinal: 1}}
      - pod.servingOff[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 12
    note: two minutes on the kubelet parks the runner in CrashLoopBackOff past the grace, so the wave counts on the revision's block
    events:
      - clock.advance: 2m
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 0, ordinal: 1}, message: "back-off restarting failed container"}
  - tick: 13
    note: the block comes due, so the ladder re-drives Instance 0 at the same target and drains the wedged pod
    events:
      - timer.retryAt: {slack: 1s}
  - tick: 14
    note: the drained pod is gone, so the rebuild lands
    events:
      - pod.deleted[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 15
    note: the rebuilt pod is bound, serves and enters rotation, so the attempt completes and Instance 0 is Ready on v2 again
    events:
      - pod.scheduled[target]: {pod: {index: 0, ordinal: 1}, message: node-7}
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 16
    note: half a minute later the runner crashes under load again and leaves rotation
    events:
      - clock.advance: 30s
      - pod.containerRestart: {pod: {index: 0, ordinal: 1}, message: Error}
      - endpoint.rotationOut[target]: {pod: {index: 0, ordinal: 1}}
      - pod.servingOff[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 17
    note: Instance 1's replacement never serves and reaches its operation deadline, so its surge attempt is disposed and nothing else is in flight
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 18
    note: the operator asks Instance 0 off its node while the push is held
    events:
      - spec.migrateRequest: {instance: 0, fromNode: node-7, reason: NodeDrain}
  - tick: 19
    note: the next pass reads the record
    events:
      - clock.advance: 5s
  - tick: 20
    note: a minute later
    events:
      - clock.advance: 1m
  - tick: 21
    note: another minute
    events:
      - clock.advance: 1m
  - tick: 22
    note: well past the record's own deadline
    events:
      - clock.advance: 31m
  - tick: 23
    note: a further pass
    events:
      - clock.advance: 1m
  - tick: 24
    note: and another
    events:
      - clock.advance: 1m
