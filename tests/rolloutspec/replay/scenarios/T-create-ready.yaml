# The cold-start walk: a planned index with no row is materialized, and the
# attempt promotes once the kubelet folds the controller's serving gate into
# the pod's own Ready condition.
scenario: T-create-ready
arrows:
  - T-empty-create
  - T-create-ready
cells:
  - instance/Create/CreatePods/pod.containersReady[source]/boundary@T-create-ready
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the index is planned and no row exists, so the Create pass opens the attempt
  - tick: 2
    note: the pod reports Ready, which is the bar every promote shares
    events:
      - pod.ready: {pod: {index: 0}}
