# A Restart pins nothing in the plan, so the Instance repairing itself falls
# out of the desired set when replicas drop. The scale-down wave replaces the
# Restart operation with a Delete Drain in one status transaction.
scenario: restart-scaledown
arrows:
  - T-ready-restart
  - T-restart-scaledown
  - T-delete-done
cells:
  - instance/Restart/Drain/spec.replicasDown/before
initial:
  spec:
    replicas: 2
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
    - {index: 1, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: both Instances serve
  - tick: 2
    note: the second Instance loses its pod, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 1}}
  - tick: 3
    note: the operator halves the replica count, and the repairing index falls out of the plan
    events:
      - spec.replicasDown: {to: 1}
  - tick: 4
    note: the retired Instance's rebuilt pod is gone and the row leaves the owner's status
    events:
      - pod.deleted[source]: {pod: {index: 1}}
