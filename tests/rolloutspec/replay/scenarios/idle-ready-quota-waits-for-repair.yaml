# A Ready Instance with a quota refusal armed and its configuration
# re-tuned. No pod create is outstanding for a Ready row, so the refusal
# surfaces only on the repair that issues one once the pod is lost, where
# it is recorded and retried; the re-tuned grace is read by the next
# escalation alone.
scenario: idle-ready-quota-waits-for-repair
arrows:
  - T-ready-restart
cells:
  - instance/Ready/api.quotaDenied/before
  - instance/Ready/config.changed[stuckPodGrace]/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: a quota refusal is armed and the stuck-pod grace changes; no create is outstanding for a Ready row and nothing about the grace is persisted on it
    events:
      - api.quotaDenied: {}
      - config.changed[stuckPodGrace]: {config: {stuckPodGrace: 1m}}
  - tick: 3
    note: the pod is lost, so the repair opens a Restart whose create meets the quota refusal, recorded on that attempt
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 4
    note: the quota admits the create on the requeue, so the rebuild lands
