# A surge row persisted without a pinned strategy, while the desired
# strategy has since moved to RecreatePod. The surge-owned status holds the
# ordinal slot and the source's drain, which no other mode knows how to
# release, so the attempt resumes on the surge machine whatever the plan now
# says and the edit reaches the Instance at its next attempt.
scenario: surge-resumed-without-strategy-pin
arrows:
  - T-surge-target-ready
  - T-surgedrain-promote
cells:
  - instance/Update/Surge/spec.strategy/before
  - instance/Update/Surge/ctrl.crash/before
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v2
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
  currentRevision: registry.example.com/runtime:v1
  rows:
    - index: 0
      phase: Updating
      runningRevision: registry.example.com/runtime:v1
      targetRevision: current
      readySince: 0s
      operation: {type: Update, step: Surge}
  pods:
    - {index: 0, ordinal: 0, previousImage: registry.example.com/runtime:v1, ready: true, serving: true, routed: true}
    - {index: 0, ordinal: 1, phase: Pending}
timeline:
  - tick: 1
    note: the resumed pass reads the row as surge-owned and waits for the replacement rather than draining the source for a rebuild
  - tick: 2
    note: the replacement is serving and in rotation, so the surge advances to its drain
    events:
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 3
    note: the source leaves rotation and is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 4
    note: the source is gone and the surge promotes under the mechanism it opened with
    events:
      - pod.deleted[source]: {pod: {index: 0, ordinal: 0}}
