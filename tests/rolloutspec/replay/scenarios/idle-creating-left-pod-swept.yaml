# A migration surge row left Creating with no operation, its leftover pod
# deleted by another hand and stuck Terminating on a node that is gone,
# under a force-delete policy. The Component sweep acts on the stuck pod,
# not on the row; the wave that owns the row finds the name freed and
# removes it.
scenario: idle-creating-left-pod-swept
arrows:
  - T-ready-migrate
  - T-empty-migrate-target
  - T-migrate-deadline-restore
  - T-migratetarget-expired
  - T-creating-reap
  - T-delete-force-clock
  - T-delete-done
cells:
  - instance/Creating/timer.forceDelete[overdueSlack]/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    migrationMode: Auto
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
    forceDelete: {overdueSlack: 1m, nodeUnreachableThreshold: 5m}
timeline:
  - tick: 1
    note: the index is planned and no row exists, so the Create pass opens the attempt
  - tick: 2
    note: the pod is bound, becomes Ready and enters rotation, so the row records a running revision on a known node
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-0}
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the operator asks the Instance off node-0, and the migrate pass admits the request and establishes the pair
    events:
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
  - tick: 4
    note: the surge pod is bound and comes up on its node while the migration waits on its promote
    events:
      - pod.scheduled[target]: {pod: {index: 1}, message: node-1}
      - pod.containersReady[target]: {pod: {index: 1}}
  - tick: 5
    note: the record's deadline elapses with the source healthy, so expiry restores the source and unpins the surge, whose row is left Creating with no operation beyond the desired set
    events:
      - timer.migrationDeadline: {slack: 1s}
  - tick: 6
    note: the leftover pod is deleted by another hand and its kubelet stops acknowledging the deletion; the wave reaps the unplanned index and waits on the object
    events:
      - pod.terminating[source]: {pod: {index: 1}}
      - pod.stuckTerminating: {pod: {index: 1}}
  - tick: 7
    note: the overdue clock lands on a pod whose node is gone, so the sweep force-deletes it ahead of the wave, whose own read then finds it absent and removes the row
    events:
      - timer.forceDelete[overdueSlack]: {slack: 1s}
  - tick: 8
    note: the Component is at rest with the unplanned index gone
