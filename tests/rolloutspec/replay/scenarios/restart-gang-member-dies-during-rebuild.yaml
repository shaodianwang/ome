# A rebuilt gang member dies in a terminal phase on the tick its sibling reports
# ready. The recycle returns before the recreate, so the sibling's readiness is
# not evaluated until the dead name is free and rebuilt.
scenario: restart-gang-member-dies-during-rebuild
arrows:
  - T-ready-restart
  - T-restart-recycle-terminal
  - T-restart-ready
cells:
  - instance/Restart/Drain/pod.containersReady[source]/boundary@T-restart-recycle-terminal
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    updateRetry: {maxAttempts: 3, initialDelay: 2m, maxDelay: 10m, multiplier: 2}
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the worker is lost while the gang runs the target, so the repair opens a Restart and takes the surviving leader out of service
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
  - tick: 4
    note: the leader's endpoint goes not-ready, which is the guard the drain waits on, so the leader is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
  - tick: 5
    note: the old gang is gone, so the repair rebuilds both members at the bumped incarnation
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
  - tick: 6
    note: the rebuilt worker dies before it was ever Ready as the rebuilt leader reports its containers ready; the dead name is recycled and the readiness waits
    events:
      - pod.phaseTerminal[Failed]: {pod: {index: 0, runner: worker}}
      - pod.containersReady[source]: {pod: {index: 0, runner: leader}}
  - tick: 7
    note: the recycle delete is observed, freeing the worker's name, so it is rebuilt inside the same Restart
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
  - tick: 8
    note: both members report Ready, so the repair promotes the row on the same revision
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
