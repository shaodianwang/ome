# The migration surge row stands Failed with its Migrate pin kept while its
# own pod dies, reappears under a new UID and is held in and released from
# a scheduling gate. The restart trigger and the escalation both skip a
# Migrate-pinned row, the pair is driven by nothing while the surge reads
# Failed, and the deadline park and re-arm steps touch only a transient
# phase, so none of it moves a clock or a stamp; the record's deadline ends
# the move.
scenario: migrate-target-grace-failed-terminal-own-pod
arrows:
  - T-ready-migrate
  - T-empty-migrate-target
  - T-failedmigratetarget-expired
  - T-migrate-deadline-restore
  - T-delete-done
cells:
  - instance/Failed/MigrateTarget/pod.phaseTerminal[Failed]/before
  - instance/Failed/MigrateTarget/pod.uidRotated/before
  - instance/Failed/MigrateTarget/pod.schedulingGated/before
  - instance/Failed/MigrateTarget/pod.admitted/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    migrationMode: Auto
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    unschedulableGrace: 10m
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
timeline:
  - tick: 1
    note: the index is planned and no row exists, so the Create pass opens the attempt
  - tick: 2
    note: the pod is bound, becomes Ready and enters rotation, so the row records a running revision on a known node
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-0}
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the operator asks the Instance off node-0, and the migrate pass admits the request and establishes the pair
    events:
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
  - tick: 4
    note: the scheduler finds the surge no node off node-0, so the scheduler hold is recorded on the surge row and both pair deadlines park
    events:
      - pod.unschedulable[target]: {pod: {index: 1}}
  - tick: 5
    note: the hold outlasts the configured grace, so the escalation stamps the surge row Failed with its Migrate pin kept while the source keeps serving under its own pin
    events:
      - clock.advance: 11m
  - tick: 6
    note: the surge pod is bound after all and dies, and a terminal own pod is neither replaced nor stamped on a Migrate-pinned row
    events:
      - pod.scheduled[target]: {pod: {index: 1}, message: node-1}
      - pod.phaseTerminal[Failed]: {pod: {index: 1}}
  - tick: 7
    note: a pod of the same name reappears under a new UID, fresh and unscheduled, and nothing reads a pod of this row by anything but its name
    events:
      - pod.uidRotated: {pod: {index: 1}}
  - tick: 8
    note: a queue admission holds the new pod behind a scheduling gate, which parks no clock on a row whose clock is the record's
    events:
      - pod.schedulingGated: {pod: {index: 1}}
  - tick: 9
    note: the gate is lifted, and the deadline re-arm that follows a gate exit restarts no clock on a row nobody owns
    events:
      - pod.admitted: {pod: {index: 1}}
  - tick: 10
    note: the record's deadline elapses, so the expiry clears the pin from the Failed surge row, closes the record and restores the source to Ready on its running revision
    events:
      - timer.migrationDeadline: {slack: 1s}
  - tick: 11
    note: the unpinned index is beyond the desired set, so the scale-down pipeline commits Phase Deleting on it
  - tick: 12
    note: the drain finds nothing routed on the retired index, so its pod's delete is issued
  - tick: 13
    note: the surge pod is gone, so its row is removed with it
    events:
      - pod.deleted[target]: {pod: {index: 1}}
