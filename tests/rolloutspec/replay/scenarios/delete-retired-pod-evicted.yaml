# The retired Instance's pod is evicted under node pressure before the wave
# drains it. The eviction is no input to the drain, which gates on the
# endpoint still published for the pod: the wave withdraws the gate and
# waits, counts the object's disappearance as progress, and removes the
# row once it is gone.
scenario: delete-retired-pod-evicted
arrows:
  - T-ready-scaledown
  - T-delete-done
cells:
  - instance/Delete/Drain/pod.evicted/before
initial:
  spec:
    replicas: 2
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true, node: node-0}
    - {index: 1, ready: true, serving: true, routed: true, node: node-1}
timeline:
  - tick: 1
    note: the operator halves the replica count, and the retired Instance is admitted into a Delete operation
    events:
      - spec.replicasDown: {to: 1}
  - tick: 2
    note: the retired pod is evicted under memory pressure; its endpoint is still published, so the wave withdraws the gate and keeps waiting on the drain
    events:
      - pod.evicted: {pod: {index: 1}, message: "The node was low on resource: memory."}
  - tick: 3
    note: the evicted object is gone, which the wave counts as progress, so the row leaves the owner's status
    events:
      - pod.deleted[source]: {pod: {index: 1}}
