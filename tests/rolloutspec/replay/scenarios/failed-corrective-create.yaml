# A create attempt wedges, the revision goes into Backoff and the wedged pod
# is recycled, leaving the Failed row with no pod at all. A corrective edit
# names a revision the block does not deny, so the Create pass re-materializes
# the Instance at the new target rather than waiting for the block to come due.
scenario: failed-corrective-create
arrows:
  - T-empty-create
  - T-create-stuckgrace
  - T-failed-corrective
cells:
  - instance/Failed/spec.revision/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 5m
    updateRetry: {maxAttempts: 3, initialDelay: 2m, maxDelay: 10m, multiplier: 2}
timeline:
  - tick: 1
    note: the index is planned and no row exists, so the Create pass opens the attempt
  - tick: 2
    note: the pull wedges immediately, but the pod is younger than the grace, so the attempt keeps polling
    events:
      - pod.waiting[ImagePullBackOff]: {pod: {index: 0}, message: "manifest unknown"}
  - tick: 3
    note: the grace elapses and the revision goes into Backoff
    events:
      - timer.stuckPodGrace: {slack: 1s}
  - tick: 4
    note: the wedged pod is recycled, so nothing of the failed attempt remains
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 5
    note: the operator corrects the image, and the Create pass claims the empty row at the revision no block denies
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
