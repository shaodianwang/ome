# A new index is planned under a quota that refuses its pod. No create is
# outstanding before the write-ahead stamp lands, so the refusal surfaces
# on the Creating attempt the stamp opens, is recorded there, and the
# create is retried on the requeue.
scenario: idle-empty-create-quota-denied
arrows:
  - T-empty-create
cells:
  - instance/Empty/api.quotaDenied/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod and the second index is not planned
  - tick: 2
    note: the replica count grows and the quota refuses the new index's pod; the stamp lands first, so the refusal is recorded on the Creating attempt
    events:
      - spec.replicasUp: {to: 2}
      - api.quotaDenied: {}
  - tick: 3
    note: the quota admits the create on the requeue
