# An operator migration request lands while the Instance is repairing itself. The
# migrate pass requires a steady Ready source, so the record stays unallocated and
# is picked up once the repair has promoted the row.
scenario: restart-migrate-request-waits
arrows:
  - T-ready-restart
  - T-restart-ready
  - T-ready-migrate
  - T-empty-migrate-target
cells:
  - instance/Restart/Drain/spec.migrateRequest/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    migrationMode: Auto
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true, node: node-0}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the operator asks the Instance off its node; the record stays unallocated while the row is restarting
    events:
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
  - tick: 4
    note: the rebuilt pod binds, reports Ready and enters rotation, so the repair promotes the row
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-0}
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 5
    note: the source is a steady Ready now, so the waiting request is admitted and the pair is established
