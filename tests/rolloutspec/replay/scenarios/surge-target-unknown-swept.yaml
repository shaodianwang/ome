# A surge replacement goes Unknown on a node the cluster no longer has,
# with a force-delete policy in force. The name is not recycled the way a
# dead pod's is; the sweep frees it on the pass that first reads it, the
# source keeps serving, and the same attempt rebuilds the replacement at
# the surge ordinal once the object is collected, under the deadline it
# was stamped with.
scenario: surge-target-unknown-swept
intentional: >-
  a replacement the kubelet will never report again is freed by the
  force-delete sweep and rebuilt at the surge ordinal inside the same
  attempt; the source is never touched, no step moves, and the name the
  sweep frees on this pass is not recorded as a wait.
arrows:
  - T-ready-surge
cells:
  - instance/Update/Surge/pod.phaseTerminal[Unknown]/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    forceDelete: {overdueSlack: 1m, nodeUnreachableThreshold: 5m}
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement is bound to a node the cluster no longer has
    events:
      - pod.scheduled[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 5
    note: the replacement's kubelet stops reporting; node death is proven on the spot, so the sweep force-deletes it, the source keeps serving and no wait is recorded
    events:
      - pod.phaseTerminal[Unknown]: {pod: {index: 0, ordinal: 1}}
  - tick: 6
    note: the force-deleted object is collected, and the same attempt rebuilds the replacement at the surge ordinal
    events:
      - pod.deleted[target]: {pod: {index: 0, ordinal: 1}}
