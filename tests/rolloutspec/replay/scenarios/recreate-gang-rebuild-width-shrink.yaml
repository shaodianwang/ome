# A gang is narrowed by one worker in the pass its recreate rebuilds it.
# Phase A has already deleted every old-incarnation pod, so a shrink observed
# before Phase B simply narrows the set the recreate builds: Phase B creates
# only the missing names of the narrower gang and deletes nothing.
scenario: recreate-gang-rebuild-width-shrink
arrows:
  - T-ready-recreate
  - T-drain-ready
cells:
  - instance/Update/Drain/spec.gangWidth[shrink]/before
initial:
  spec:
    replicas: 1
    workers: 2
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes all three
  - tick: 2
    note: every member reports Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - pod.ready[source]: {pod: {index: 0, runner: worker, ordinal: 1}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the pod template changes and the strategy rebuilds the gang in place of surging
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the leader leaves rotation, so Phase A deletes all three members
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
  - tick: 5
    note: every member is gone and the gang is narrowed by one worker, so Phase B rebuilds only the leader and one worker at the bumped incarnation
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker, ordinal: 1}}
      - spec.gangWidth[shrink]: {to: 1}
  - tick: 6
    note: both members report Ready and the leader enters rotation, so the Instance promotes at the narrower width
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
