# A Restart's rebuilt pod comes up and receives the serving gate, but its
# Ready condition never follows: a readiness gate the pod declares stays
# unsatisfied. The pod is in no Service's endpoints, so it is not capacity
# and the operation deadline ends the repair, with the readiness wait
# recorded as the cause instead of the bare elapsed timeout.
scenario: restart-running-not-ready-to-deadline
arrows:
  - T-ready-restart
  - T-restart-deadline
cells:
  - instance/Restart/Drain/pod.runningNotReady[source]/before
  - instance/Restart/Drain/timer.operationDeadline/before
intentional: >-
  a pod that is ContainersReady with the serving gate written but never
  PodReady is in no Service's endpoints, so it does not exempt the repair
  from its deadline; the deadline fails the row with the Restart preserved
  and the unsatisfied readiness gate named
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the rebuilt pod's containers come up but the pod never reports Ready, so the repair writes the gate and keeps waiting
    events:
      - pod.containersReady[source]: {pod: {index: 0}}
  - tick: 4
    note: five minutes on, the pod still runs without readiness and the repair still waits
    events:
      - clock.advance: 5m
  - tick: 5
    note: the deadline elapses, so the row fails with its operation preserved and the readiness wait recorded as the cause
    events:
      - timer.operationDeadline: {slack: 1s}
