# A gang surge pair fails on its deadline. While the abandon retires the
# replacement, the source's own PodGroup is deleted from outside and the
# operator scales up, and then the retired group is deleted too: the ensure
# pass re-creates the source's group from the plan, a scale-up only adds a
# fresh index beside the pair, and a retired index is terminal-owned, so
# nothing re-creates its group and the removal only completes sooner.
scenario: gang-failed-podgroup-and-scale-up
arrows:
  - T-empty-gang-surge-target
  - T-gangtarget-deadline
  - T-failedgangtarget-cleanup-failed
  - T-failedgangsurge-reset
cells:
  - instance/Failed/GangSurge/gang.podGroup[Deleted]/before
  - instance/Failed/GangSurge/spec.replicasUp/before
  - instance/Failed/GangSurgeTarget/spec.replicasUp/boundary@T-failedgangtarget-cleanup-failed
  - instance/Failed/GangSurgeTargetCleanup/gang.podGroup[Deleted]/before
  - instance/Failed/GangSurgeTargetCleanup/spec.replicasUp/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: the replacement is still not Ready when the deadline elapses, so both halves of the pair are stamped Failed with their operations preserved
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the source's PodGroup is deleted from outside and the operator asks for a second Instance; the ensure pass re-creates the source's group from the plan, the new index is announced and created beside the pair, and the abandon claims the cleanup marker and deletes the replacement
    events:
      - gang.podGroup[Deleted]: {instance: 0}
      - spec.replicasUp: {to: 2}
  - tick: 7
    note: the retired replacement's group is deleted from outside and the operator asks for a third Instance; the retired index is terminal-owned, so nothing re-creates its group, and the new index is created beside the pair
    events:
      - gang.podGroup[Deleted]: {instance: 1}
      - spec.replicasUp: {to: 3}
  - tick: 8
    note: the retired replacement's members are gone, so the marker row is removed and the source is reset Ready on its running revision
    events:
      - pod.deleted[target]: {pod: {index: 1, runner: leader}}
      - pod.deleted[target]: {pod: {index: 1, runner: worker}}
