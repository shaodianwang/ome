# A Failed Instance is retired by a replica reduction, and the same reduction
# is observed again on the next pass. The admission is committed once per
# wave; the re-read re-derives the same Delete stamp and writes nothing.
scenario: failed-scaledown-reobserved
arrows:
  - T-failed-scaledown
  - T-delete-done
cells:
  - instance/Failed/spec.replicasDown/after@T-failed-scaledown
initial:
  spec:
    replicas: 2
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Failed, runningRevision: current}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
    - {index: 1, node: node-1}
timeline:
  - tick: 1
    note: one Instance serves and the second is parked at Failed
  - tick: 2
    note: the operator halves the replica count, retiring the Failed Instance
    events:
      - spec.replicasDown: {to: 1}
  - tick: 3
    note: the same replica count is observed again, which re-derives the admitted wave and stamps nothing new while the drain deletes the pod
    events:
      - spec.replicasDown: {to: 1}
  - tick: 4
    note: the pod is gone and the row leaves the owner's status
    events:
      - pod.deleted[source]: {pod: {index: 1}}
