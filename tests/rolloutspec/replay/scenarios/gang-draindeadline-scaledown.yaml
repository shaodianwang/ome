# Two gangs serve under a partition that holds the first; the second surges
# into a third index, its replacement clears the promote bar and then loses
# a member's readiness, and the pair fails on its deadline at the drain
# step. The operator then scales to one. A failed source pins nothing in the
# plan, so the pair ranks as one unit behind the serving row and falls
# beyond the desired set: both rows take a Delete Drain operation over their
# kept ones in one wave, and a re-observed reduction re-derives the same
# stamps.
scenario: gang-draindeadline-scaledown
arrows:
  - T-empty-gang-surge-target
  - T-gangtarget-ready
  - T-surgedrain-deadline
  - T-failedgangsurgedrain-scaledown
  - T-failedgangtarget-scaledown
cells:
  - instance/Failed/GangSurgeDrain/spec.replicasDown/before
  - instance/Failed/GangSurgeDrain/spec.replicasDown/after@T-failedgangsurgedrain-scaledown
initial:
  spec:
    replicas: 2
    workers: 1
    partition: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: both gangs' PodGroups are announced before their first members, and the Create pass materializes all four pods
  - tick: 2
    note: every member reports Ready and both leaders enter rotation, so both Instances promote
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 1, runner: leader}}
      - pod.ready[source]: {pod: {index: 1, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 1, runner: leader}}
  - tick: 3
    note: the template changes; the partition keeps index 0 on its revision and index 1 claims index 2 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: both replacement members report Ready and the leader enters rotation, so the surging source advances to the drain and leaves the serving gate
    events:
      - pod.ready[target]: {pod: {index: 2, runner: leader}}
      - pod.ready[target]: {pod: {index: 2, runner: worker}}
      - endpoint.rotationIn[target]: {pod: {index: 2, runner: leader}}
  - tick: 6
    note: the replacement worker's readiness regresses while the source is still published, so the pair is no longer fully serving
    events:
      - pod.containersNotReady[target]: {pod: {index: 2, runner: worker}}
  - tick: 7
    note: the deadline elapses with the replacement short, so the source is stamped Failed at its drain step and the marker Failed too, both operations kept
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 8
    note: the operator scales to one; the failed pair pins nothing and ranks behind the serving row, so it falls beyond the desired set and both rows take a Delete Drain operation over their kept ones in one wave
    events:
      - spec.replicasDown: {to: 1}
  - tick: 9
    note: the reduction is observed again; the admission was committed once, so the same stamps are re-derived and only the drains advance
    events:
      - spec.replicasDown: {to: 1}
  - tick: 10
    note: both leaders leave the routed Service, so both drains have converged and every pod of the pair is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 1, runner: leader}}
      - endpoint.rotationOut[target]: {pod: {index: 2, runner: leader}}
  - tick: 11
    note: every pod of the pair is gone, so both rows are removed and the held gang is the one Instance left
    events:
      - pod.deleted[target]: {pod: {index: 2, runner: leader}}
      - pod.deleted[target]: {pod: {index: 2, runner: worker}}
      - pod.deleted[source]: {pod: {index: 1, runner: leader}}
      - pod.deleted[source]: {pod: {index: 1, runner: worker}}
