# The retired Instance's pod is stuck Terminating on a node that is gone,
# and the overdue clock frees it under the force-delete policy; the owner's
# teardown deadline elapses on the next pass. The force-delete is an
# in-pass effect and the deadline is re-read at the top of the next pass,
# so the two never contend: the escalation that fired stands, the row is
# already gone, and the release purges an owner that no longer carries it.
scenario: delete-force-clock-then-teardown-deadline
arrows:
  - T-ready-scaledown
  - T-delete-force-clock
  - T-delete-done
cells:
  - instance/Delete/Drain/timer.teardownDeadline/after@T-delete-force-clock
initial:
  spec:
    replicas: 2
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
    teardownDeadline: 10m
    forceDelete: {overdueSlack: 1m, nodeUnreachableThreshold: 5m}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true, node: node-0}
    - {index: 1, ready: true, serving: true, routed: true, node: node-1}
timeline:
  - tick: 1
    note: the operator halves the replica count, and the retired Instance is admitted into a Delete operation
    events:
      - spec.replicasDown: {to: 1}
  - tick: 2
    note: the retired pod leaves rotation, so the wave deletes it
    events:
      - endpoint.rotationOut[source]: {pod: {index: 1}}
  - tick: 3
    note: the kubelet stops acknowledging the deletion, which leaves the object behind with no finalizer on it
    events:
      - pod.stuckTerminating: {pod: {index: 1}}
  - tick: 4
    note: the overdue clock lands on a pod whose node is gone, so the sweep force-deletes it ahead of the wave, whose own read finds it absent and removes the row
    events:
      - timer.forceDelete[overdueSlack]: {slack: 1s}
  - tick: 5
    note: the owner was deleted and its teardown deadline has elapsed; the escalation that already fired stands and the release purges an owner that carries no retired row
    events:
      - spec.teardown[deleted]: {}
      - timer.teardownDeadline: {slack: 1s}
  - tick: 6
    note: a late pass finds no owner left to act on
