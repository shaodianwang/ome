# The scheduler hold on a migration surge and the grace that ends it land in
# one pass, so the surge row is stamped Failed with its Migrate pin and its
# operation deadline both kept while only the source's deadline parks. That
# deadline is never consumed: the escalation skips a Failed row, and when
# the clock reaches it the record's own deadline, minted at the same instant,
# is what ends the move.
scenario: migrate-target-grace-failed-operation-deadline
arrows:
  - T-ready-migrate
  - T-empty-migrate-target
  - T-failedmigratetarget-expired
  - T-migrate-deadline-restore
  - T-delete-done
cells:
  - instance/Failed/MigrateTarget/timer.operationDeadline/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    migrationMode: Auto
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    unschedulableGrace: 10m
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
timeline:
  - tick: 1
    note: the index is planned and no row exists, so the Create pass opens the attempt
  - tick: 2
    note: the pod is bound, becomes Ready and enters rotation, so the row records a running revision on a known node
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-0}
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the operator asks the Instance off node-0, and the migrate pass admits the request and establishes the pair
    events:
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
  - tick: 4
    note: the surge's placement verdict is observed only after it has already outlasted the grace, so the hold is recorded and the escalation stamps the surge row Failed in the same pass, with the pin and the operation deadline kept
    events:
      - pod.unschedulable[target]: {pod: {index: 1}}
      - clock.advance: 11m
  - tick: 5
    note: a tick with nothing changed drives nothing on a surge row that reads Failed
  - tick: 6
    note: the kept operation deadline elapses, and the record's deadline with it; the escalation skips the Failed row and the expiry clears its pin, closes the record and restores the source to Ready on its running revision
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 7
    note: the unpinned index is beyond the desired set, so the scale-down pipeline commits Phase Deleting on it
  - tick: 8
    note: the drain finds nothing routed on the retired index, so its pod's delete is issued
  - tick: 9
    note: the surge pod is gone, so its row is removed with it
    events:
      - pod.deleted[target]: {pod: {index: 1}}
