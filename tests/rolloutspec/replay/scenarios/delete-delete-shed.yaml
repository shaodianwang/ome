# The apiserver sheds the wave's pod delete with a Retry-After. The shed
# delete is absorbed as a plain error: the expectation is rolled back and
# the next pass re-reads and re-issues it on the wave's own cadence, since
# the pacing that honors a Retry-After is fed by the create path alone.
scenario: delete-delete-shed
arrows:
  - T-ready-scaledown
  - T-delete-done
cells:
  - instance/Delete/Drain/api.throttled[TooManyRequests]/before
initial:
  spec:
    replicas: 2
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true, node: node-0}
    - {index: 1, ready: true, serving: true, routed: true, node: node-1}
timeline:
  - tick: 1
    note: the operator halves the replica count, and the retired Instance is admitted into a Delete operation
    events:
      - spec.replicasDown: {to: 1}
  - tick: 2
    note: the retired pod leaves rotation and the apiserver sheds the wave's delete, so the expectation rolls back and the pass ends with the pod still there
    events:
      - endpoint.rotationOut[source]: {pod: {index: 1}}
      - api.throttled[TooManyRequests]: {verb: delete, retryAfter: 30s}
  - tick: 3
    note: the next pass re-reads the set and re-issues the delete
  - tick: 4
    note: the pod is gone and the row leaves the owner's status
    events:
      - pod.deleted[source]: {pod: {index: 1}}
