# The update strategy changes while an Instance is repairing itself. The repair
# path never consults the strategy; the edit applies to the next update the
# Instance takes from Ready.
scenario: restart-strategy-edit-ignored
arrows:
  - T-ready-restart
  - T-restart-ready
cells:
  - instance/Restart/Drain/spec.strategy/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the strategy is edited; the repair reads nothing from it
    events:
      - spec.strategy: {strategy: RecreatePod}
  - tick: 4
    note: the rebuilt pod reports Ready, so the repair promotes the row on the same revision
    events:
      - pod.ready[source]: {pod: {index: 0}}
