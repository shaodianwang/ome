# The replacement gang's PodGroup is taken over by another controller while
# the surge is in flight, so the marker is Failed with its operation kept
# and the source keeps driving the build. A member then wedges on its image
# past the stuck-pod grace: the escalation skips the Failed marker, stamps
# the source instead with the replacement as its blame bucket, and the
# abandon retires the replacement from there.
scenario: gang-target-failed-verdict-member-wedges
arrows:
  - T-empty-gang-surge-target
  - T-surge-stuck
  - T-failedgangtarget-cleanup-failed
  - T-failedgangsurge-reset
cells:
  - instance/Failed/GangSurgeTarget/pod.waiting[ImagePullBackOff]/before
  - instance/Failed/GangSurgeTarget/timer.stuckPodGrace/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    containerName: ome-container
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: the replacement group's controller reference is rewritten to another owner; the gang verdict ends the marker alone, Failed with its operation kept, while the source stays Updating and keeps driving the surge
    events:
      - gang.podGroup[OwnershipConflict]: {instance: 1}
  - tick: 6
    note: the replacement worker wedges on its image; the pod is younger than the grace, so nothing is disposed yet
    events:
      - pod.waiting[ImagePullBackOff]: {pod: {index: 1, runner: worker}, message: "manifest unknown"}
  - tick: 7
    note: the grace elapses on the wedged member; the escalation skips the Failed marker and stamps the source Failed with the worker as its blame, the marker's own record untouched
    events:
      - timer.stuckPodGrace: {slack: 1s}
  - tick: 8
    note: the source is a failed continuation now, so the abandon claims the cleanup marker and deletes the replacement
  - tick: 9
    note: the retired replacement's members are gone, so the marker row is removed and the source is reset Ready on its running revision
    events:
      - pod.deleted[target]: {pod: {index: 1, runner: leader}}
      - pod.deleted[target]: {pod: {index: 1, runner: worker}}
