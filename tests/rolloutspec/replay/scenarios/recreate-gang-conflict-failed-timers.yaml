# The clocks around a gang's recreate that the gang verdict ended with the
# Update operation kept. The fast escalator skips a row already stamped
# Failed, so an elapsed stuck-pod grace ends nothing; the kept operation's
# deadline is replaced by the re-drive's fresh one, so its elapsing ends
# nothing either; and the Component sweep acts on a stuck pod, not on the
# row. Each Failed pass is re-driven and failed again on the pass after.
scenario: recreate-gang-conflict-failed-timers
arrows:
  - T-ready-recreate
  - T-faileddrain-redrive
cells:
  - instance/Failed/Drain/timer.stuckPodGrace/before
  - instance/Failed/Drain/timer.operationDeadline/before
  - instance/Failed/Drain/timer.forceDelete[overdueSlack]/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 20m
    forceDelete: {overdueSlack: 1m, nodeUnreachableThreshold: 10m}
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members are bound to node-0 and report Ready, and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.scheduled[source]: {pod: {index: 0, runner: leader}, message: node-0}
      - pod.scheduled[source]: {pod: {index: 0, runner: worker}, message: node-0}
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the pod template changes and the strategy rebuilds the gang in place of surging, so Phase A takes the serving gates down
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the leader leaves rotation, so Phase A deletes both members
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
  - tick: 5
    note: both members are gone, so Phase B rebuilds the gang at the bumped incarnation behind its existing PodGroup
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
  - tick: 6
    note: the group's controller reference is rewritten to another owner, which is a name this controller may not write, so the gang verdict stamps the Instance Failed with the recreate kept rather than parked
    events:
      - gang.podGroup[OwnershipConflict]: {instance: 0}
  - tick: 7
    note: the rebuilt leader is bound and its pull wedges, which the escalation skips on a Failed row, so the re-drive restamps the recreate and drains the set
    events:
      - pod.scheduled[source]: {pod: {index: 0, runner: leader}, message: node-1}
      - pod.scheduled[source]: {pod: {index: 0, runner: worker}, message: node-1}
      - pod.waiting[ImagePullBackOff]: {pod: {index: 0, runner: leader}, message: "manifest unknown"}
  - tick: 8
    note: the name still belongs to another controller, so the verdict fails the re-driven attempt again with the recreate kept
  - tick: 9
    note: the stuck-pod grace elapses on the wedged leader, and the fast escalator skips a row already stamped Failed, so the re-drive restamps the recreate under a deadline re-derived at the clock's new reading, while the sweep only reports the two draining members still pinned by their finalizers
    events:
      - timer.stuckPodGrace: {slack: 1s}
  - tick: 10
    note: the verdict fails the re-driven attempt again
  - tick: 11
    note: the kept operation's deadline elapses, which the escalation skips on a Failed row, and the re-drive replaces it with a fresh one
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 12
    note: the verdict fails the re-driven attempt again
  - tick: 13
    note: the kubelets behind both draining members stop acknowledging their deletion and both are past their overdue slack on a node the cluster no longer holds, so the sweep at the top of the pass force-deletes them on their own evidence and the re-drive restamps a row with nothing left to drain
    events:
      - pod.stuckTerminating: {pod: {index: 0, runner: leader}}
      - pod.stuckTerminating: {pod: {index: 0, runner: worker}}
      - timer.forceDelete[overdueSlack]: {slack: 1s}
  - tick: 14
    note: the verdict fails the re-driven attempt again, with no member left to drain
