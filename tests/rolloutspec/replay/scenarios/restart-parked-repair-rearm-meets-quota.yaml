# A quota refusal armed while a repair is parked at Failed is consumed by
# nobody, since a parked repair creates nothing until it re-arms. On the
# ladder the re-arm drains the wedged pod and its rebuild meets the
# refusal, which is recorded on the re-armed Restart attempt and reported
# until a create completes without one.
scenario: restart-parked-repair-rearm-meets-quota
arrows:
  - T-ready-restart
  - T-restart-stuck
  - T-failedrepair-rearm
cells:
  - instance/Failed/Repair/api.quotaDenied/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 2, initialDelay: 5m, maxDelay: 30m, multiplier: 2.0}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the rebuilt pod crash-loops and is older than the grace when the wedge is read, so the row fails with its operation preserved
    events:
      - clock.advance: 2m
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 0}, message: "back-off restarting failed container"}
  - tick: 4
    note: a quota refusal is armed for the next pod create; a parked repair creates nothing, so nothing consumes it
    events:
      - api.quotaDenied: {}
  - tick: 5
    note: the ladder's delay elapses, so the repair re-arms at the next incarnation and drains the wedged pod
    events:
      - timer.repairRetry: {slack: 1s}
  - tick: 6
    note: the drained pod is gone and the re-armed attempt's rebuild meets the quota refusal, which is recorded on that attempt
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 7
    note: the quota admits the next create, so the rebuild lands at the bumped incarnation
