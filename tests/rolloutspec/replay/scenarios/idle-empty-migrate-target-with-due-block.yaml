# A Ready Instance runs the old revision while the new one sits in Backoff
# from an earlier failed attempt; the block comes due in the observation
# that asks the Instance off its node. The retry gate governs revision
# rollouts, not placement moves, so the migration claims a free index as
# its surge on that pass, ahead of the roll the due block would release,
# and a block still due on the next pass changes nothing about that index.
scenario: idle-empty-migrate-target-with-due-block
arrows:
  - T-ready-migrate
  - T-empty-migrate-target
cells:
  - instance/Empty/timer.retryAt/boundary@T-empty-migrate-target
  - instance/Empty/timer.retryAt/after@T-empty-migrate-target
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v2
    migrationMode: Auto
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    updateRetry: {maxAttempts: 3, initialDelay: 2m, maxDelay: 10m, multiplier: 2}
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
  retryBlocks:
    - {revision: registry.example.com/runtime:v2, state: Backoff, attemptsStarted: 1, nextRetryAt: 2m, reason: ImagePullBackOff}
  rows:
    - {index: 0, phase: Ready, runningRevision: registry.example.com/runtime:v1, readySince: 0s}
  pods:
    - {index: 0, previousImage: registry.example.com/runtime:v1, ready: true, serving: true, routed: true, node: node-0}
timeline:
  - tick: 1
    note: the Ready row serves the old revision and the roll to the new one is held by its Backoff block
  - tick: 2
    note: the block comes due as the operator asks the Instance off node-0; the migrate pass runs ahead of the roll and claims index 1 as the surge at the source's running revision, asking the block nothing
    events:
      - timer.retryAt: {slack: 1s}
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
  - tick: 3
    note: the block is still due and the claimed index stays the migration's own
    events:
      - timer.retryAt: {slack: 1s}
