# The recreate never converges because Phase A's drain never does, and the
# operation deadline elapses. Phase A already drove the serving gate off, so
# the fully-serving suppression cannot cover the row.
scenario: drain-deadline
arrows:
  - T-ready-recreate
  - T-drain-deadline
cells:
  - instance/Update/Drain/timer.operationDeadline/before
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the pod becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the pod template changes and the strategy rebuilds in place of surging
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the pod stays published, so Phase A holds on the drain
  - tick: 5
    note: the operation deadline elapses with the old pod still routed
    events:
      - timer.operationDeadline: {slack: 1s}
