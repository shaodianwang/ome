# A new index is planned and the write-ahead stamp that opens its Create
# attempt is refused with a conflict for every attempt of the adapter's
# retry. Nothing commits in that pass and no pod is created; the next pass
# re-checks the plan against the fresh owner and opens the attempt.
scenario: idle-empty-create-stamp-conflict
arrows:
  - T-empty-create
cells:
  - instance/Empty/api.conflict/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod and the second index is not planned
  - tick: 2
    note: the replica count grows and the stamp that opens the new index's attempt is refused on every retry, so nothing commits and no pod is created
    events:
      - spec.replicasUp: {to: 2}
      - api.conflict: {write: 1, count: 5}
  - tick: 3
    note: the next pass re-checks the plan against the fresh owner and opens the attempt
