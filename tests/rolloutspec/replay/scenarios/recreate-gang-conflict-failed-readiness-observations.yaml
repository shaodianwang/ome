# A gang's recreate is ended by the gang verdict - its PodGroup name belongs
# to another controller - with the Update operation kept, so the row reads
# Failed/Drain for the one pass before the update pass re-drives it as a
# continuation. What the rebuilt members report in that pass is read by
# nobody: the re-drive restamps a fresh recreate with the Incarnation bumped
# and drains them as the old incarnation, and the verdict fails the Instance
# again on the pass after; readiness, serving gates and rotation move
# counters and nothing else.
scenario: recreate-gang-conflict-failed-readiness-observations
arrows:
  - T-ready-recreate
  - T-faileddrain-redrive
cells:
  - instance/Failed/Drain/pod.scheduled[source]/before
  - instance/Failed/Drain/pod.containersReady[source]/before
  - instance/Failed/Drain/pod.ready[source]/before
  - instance/Failed/Drain/pod.servingOn[source]/before
  - instance/Failed/Drain/endpoint.rotationIn[source]/before
  - instance/Failed/Drain/endpoint.rotationOut[source]/before
  - instance/Failed/Drain/pod.servingOff[source]/before
  - instance/Failed/Drain/pod.containersNotReady[source]/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members are bound to node-0 and report Ready, and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.scheduled[source]: {pod: {index: 0, runner: leader}, message: node-0}
      - pod.scheduled[source]: {pod: {index: 0, runner: worker}, message: node-0}
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the pod template changes and the strategy rebuilds the gang in place of surging, so Phase A takes the serving gates down
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the leader leaves rotation, so Phase A deletes both members
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
  - tick: 5
    note: both members are gone, so Phase B rebuilds the gang at the bumped incarnation behind its existing PodGroup
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
  - tick: 6
    note: the group's controller reference is rewritten to another owner, which is a name this controller may not write, so the gang verdict stamps the Instance Failed with the recreate kept rather than parked
    events:
      - gang.podGroup[OwnershipConflict]: {instance: 0}
  - tick: 7
    note: the rebuilt members are bound, report readiness and the leader's serving gate and endpoint come up, none of which anyone reads before the re-drive restamps the recreate at a bumped incarnation and takes the leader's gate down again to drain them as the old one
    events:
      - pod.scheduled[source]: {pod: {index: 0, runner: leader}, message: node-1}
      - pod.scheduled[source]: {pod: {index: 0, runner: worker}, message: node-1}
      - pod.containersReady[source]: {pod: {index: 0, runner: worker}}
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.servingOn[source]: {pod: {index: 0, runner: leader}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 8
    note: the name still belongs to another controller, so the verdict fails the re-driven attempt again with the recreate kept
  - tick: 9
    note: the draining leader leaves rotation and its serving gate reads False while the worker's containers stop being ready, which move counters on the Failed row; the re-drive that follows finds the leader unrouted and deletes both members as the old incarnation
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
      - pod.servingOff[source]: {pod: {index: 0, runner: leader}}
      - pod.containersNotReady[source]: {pod: {index: 0, runner: worker}}
  - tick: 10
    note: the verdict fails the re-driven attempt again
