# With the source draining, its binding, readiness and gate are re-observed
# and the replacement's are too; the step re-asserts the two gates it owns
# and reads nothing else, and a runner restart below Ready triggers nothing.
scenario: surgedrain-pod-observations-ignored
arrows:
  - T-ready-surge
  - T-surge-target-ready
  - T-surgedrain-promote
cells:
  - instance/Update/SurgeDrain/pod.scheduled[source]/before
  - instance/Update/SurgeDrain/pod.containersReady[source]/before
  - instance/Update/SurgeDrain/pod.ready[source]/before
  - instance/Update/SurgeDrain/pod.servingOn[source]/before
  - instance/Update/SurgeDrain/pod.containersReady[target]/before
  - instance/Update/SurgeDrain/pod.servingOn[target]/before
  - instance/Update/SurgeDrain/pod.servingOff[target]/before
  - instance/Update/SurgeDrain/pod.containerRestart/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    containerName: ome-container
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement is serving and in rotation, so the step advances and the source's serving gate is flipped off
    events:
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 5
    note: the draining source's binding and readiness are re-observed; nothing on the step reads them
    events:
      - pod.scheduled[source]: {pod: {index: 0, ordinal: 0}}
      - pod.containersReady[source]: {pod: {index: 0, ordinal: 0}}
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 6
    note: another writer re-enables the source's gate; the pass flips it off again under its own writer key
    events:
      - pod.servingOn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 7
    note: the replacement's readiness and gate are re-observed; it is the routed capacity for the whole drain and nothing changes
    events:
      - pod.containersReady[target]: {pod: {index: 0, ordinal: 1}}
      - pod.servingOn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 8
    note: a foreign writer drops the replacement's gate; the pass re-asserts it
    events:
      - pod.servingOff[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 9
    note: the replacement's runner restarts in place; below Ready the restart trigger reads no container restarts
    events:
      - pod.containerRestart: {pod: {index: 0, ordinal: 1}, message: OOMKilled}
  - tick: 10
    note: the source leaves rotation, so the drain has converged
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 11
    note: the drained source is gone and the surge promotes
    events:
      - pod.deleted[source]: {pod: {index: 0, ordinal: 0}}
