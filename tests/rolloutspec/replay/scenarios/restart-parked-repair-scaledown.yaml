# The replica count drops below the index of a repair parked at Failed: the
# scale-down wave retires the row, the Delete operation replacing the spent
# Restart, and the count re-applied changes nothing on the wave.
scenario: restart-parked-repair-scaledown
arrows:
  - T-ready-restart
  - T-restart-stuck
  - T-failedrepair-scaledown
  - T-delete-done
cells:
  - instance/Failed/Repair/spec.replicasDown/boundary@T-failedrepair-scaledown
  - instance/Failed/Repair/spec.replicasDown/after@T-failedrepair-scaledown
initial:
  spec:
    replicas: 2
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    scaleDownRequeueInterval: 30s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
    - {index: 1, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: both Ready rows are steady on their serving pods
  - tick: 2
    note: the second Instance's pod is deleted out from under it, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 1}}
  - tick: 3
    note: the rebuilt pod crash-loops and is older than the grace when the wedge is read, so the row fails with its operation preserved
    events:
      - clock.advance: 2m
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 1}, message: "back-off restarting failed container"}
  - tick: 4
    note: the replica count drops to one, so the parked repair's index leaves the plan and the wave stamps Deleting over the spent Restart
    events:
      - spec.replicasDown: {to: 1}
  - tick: 5
    note: the same count is re-applied; the wave owns the row and deletes the wedged pod
    events:
      - spec.replicasDown: {to: 1}
  - tick: 6
    note: the retired pod is gone, so its row is removed
    events:
      - pod.deleted[source]: {pod: {index: 1}}
