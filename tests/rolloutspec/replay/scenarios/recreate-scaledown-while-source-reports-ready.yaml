# The replica count is halved mid-recreate on the pass that also reads the
# retired pod ready. The index has left the planned set, so the scale-down
# wave claims it whatever its pod reports.
scenario: recreate-scaledown-while-source-reports-ready
arrows:
  - T-ready-recreate
  - T-drain-scaledown
  - T-delete-done
cells:
  - instance/Update/Drain/pod.ready[source]/boundary@T-drain-scaledown
initial:
  spec:
    replicas: 2
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
    - {index: 1, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the pod template changes, so both Instances open a recreate
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 2
    note: the operator halves the replica count as the retired pod reports ready again, so the retired index leaves the plan whatever it reports
    events:
      - spec.replicasDown: {to: 1}
      - pod.ready[source]: {pod: {index: 1}}
  - tick: 3
    note: the retired index's pod leaves rotation, which is the drain the delete waits on
    events:
      - endpoint.rotationOut[source]: {pod: {index: 1}}
  - tick: 4
    note: the drained pod is gone, so the row is removed with it
    events:
      - pod.deleted[source]: {pod: {index: 1}}
