# The surge of a migration comes up while the record is at SurgePending. The
# drive re-reads both pod sets every pass: binding, readiness and the serving
# gate on either side move no stamp, and the pin holds on both rows.
scenario: migrate-surge-pending-observations
arrows:
  - T-ready-migrate
  - T-empty-migrate-target
cells:
  - instance/Migrate/CreateSurge/pod.scheduled[target]/before
  - instance/Migrate/SurgeTarget/pod.scheduled[target]/before
  - instance/Migrate/CreateSurge/pod.containersReady[target]/before
  - instance/Migrate/SurgeTarget/pod.containersReady[target]/before
  - instance/Migrate/CreateSurge/pod.ready[target]/before
  - instance/Migrate/SurgeTarget/pod.ready[target]/before
  - instance/Migrate/CreateSurge/pod.servingOn[target]/before
  - instance/Migrate/SurgeTarget/pod.servingOn[target]/before
  - instance/Migrate/CreateSurge/pod.ready[source]/before
  - instance/Migrate/SurgeTarget/pod.ready[source]/before
  - instance/Migrate/CreateSurge/pod.containersReady[source]/before
  - instance/Migrate/SurgeTarget/pod.containersReady[source]/before
  - instance/Migrate/CreateSurge/ctrl.resync/before
  - instance/Migrate/SurgeTarget/ctrl.resync/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    migrationMode: Auto
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
timeline:
  - tick: 1
    note: the index is planned and no row exists, so the Create pass opens the attempt
  - tick: 2
    note: the pod is bound, becomes Ready and enters rotation, so the row records a running revision on a known node
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-0}
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the operator asks the Instance off node-0, and the migrate pass admits the request and establishes the pair
    events:
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
  - tick: 4
    note: the surge binds to a node off node-0, which is observed and stamps nothing on either row
    events:
      - pod.scheduled[target]: {pod: {index: 1}, message: node-1}
  - tick: 5
    note: the surge reports ContainersReady, so the drive marks it serving and then waits on its rotation and availability gates with the record still SurgePending
    events:
      - pod.containersReady[target]: {pod: {index: 1}}
  - tick: 6
    note: the surge reports PodReady and its serving gate reads True, and neither readiness alone nor the gate advances the record
    events:
      - pod.ready[target]: {pod: {index: 1}}
      - pod.servingOn[target]: {pod: {index: 1}}
  - tick: 7
    note: the source reports its readiness again, which gates no step of the migration
    events:
      - pod.containersReady[source]: {pod: {index: 0}}
      - pod.ready[source]: {pod: {index: 0}}
  - tick: 8
    note: a tick with nothing changed re-reads both pod sets, re-derives the same wait and requeues
