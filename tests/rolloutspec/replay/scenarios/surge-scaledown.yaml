# Both Instances are surging when the operator halves the replica count. A
# single-pod surge source carries no SurgeIndex, so it is not pinned as a
# handoff pair: the retired index falls out of the plan and the scale-down
# wave stamps Deleting over its in-flight Update operation, taking both
# ordinal slots with it.
scenario: surge-scaledown
arrows:
  - T-ready-surge
  - T-surge-scaledown
  - T-delete-done
cells:
  - instance/Update/Surge/spec.replicasDown/before
initial:
  spec:
    replicas: 2
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
    - {index: 1, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the pod template changes, so both Instances surge a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 2
    note: the operator halves the replica count, so the retired index leaves the plan mid-surge
    events:
      - spec.replicasDown: {to: 1}
  - tick: 3
    note: the retired source leaves rotation, which is the drain the delete waits on
    events:
      - endpoint.rotationOut[source]: {pod: {index: 1, ordinal: 0}}
  - tick: 4
    note: both of the retired index's slots are gone
    events:
      - pod.deleted[source]: {pod: {index: 1, ordinal: 0}}
      - pod.deleted[target]: {pod: {index: 1, ordinal: 1}}
  - tick: 5
    note: nothing of the retired index is left, and the surviving Instance keeps surging
