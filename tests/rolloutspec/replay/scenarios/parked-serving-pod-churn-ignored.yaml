# A parked attempt's serving pod reappears under a new UID, fresh and
# Pending, and a queue admission gates and then admits it. The set reads by
# the attempt's revision, so the same-name pod is the same member, and
# nothing of a parked attempt is being admitted: no deadline is parked or
# re-armed and no pass writes the row.
scenario: parked-serving-pod-churn-ignored
arrows:
  - T-ready-recreate
  - T-drain-deadline
  - T-failed-parked-serves
cells:
  - instance/Update/Parked/pod.uidRotated/before
  - instance/Update/Parked/pod.schedulingGated/before
  - instance/Update/Parked/pod.admitted/before
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 1h, maxDelay: 2h, multiplier: 2}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod template changes, so the roll drains the pod for a recreate
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the pod leaves rotation, so it is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 4
    note: the old pod is gone, so the rebuild lands at the new revision
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 5
    note: the deadline elapses on a rebuilt pod that never came up; the ladder counts the wave and the attempt is parked with the row Failed
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the pod comes up and is gated serving, so the parked set serves in full and the row reads as the roll in progress with the attempt still parked
    events:
      - pod.containersReady[source]: {pod: {index: 0}}
      - pod.servingOn[source]: {pod: {index: 0}}
  - tick: 7
    note: the serving pod reappears under a new UID, fresh and Pending; the set keys on the attempt's revision, so it is the same member and nothing is written
    events:
      - pod.uidRotated: {pod: {index: 0}}
  - tick: 8
    note: a queue admission gates the fresh pod; no pod of a parked attempt is being admitted, so no deadline is parked
    events:
      - pod.schedulingGated: {pod: {index: 0}}
  - tick: 9
    note: the queue admits the pod; the deadline reconciler re-arms no clock on a row nobody owns
    events:
      - pod.admitted: {pod: {index: 0}}
  - tick: 10
    note: a further pass reads the same set and writes nothing
