# Apiserver answers armed while a repair is parked at Failed are consumed
# by nobody, since a parked repair creates and deletes nothing until it
# re-arms. On the ladder the re-arm's drain meets the not-found answer,
# behind which the wedged pod is gone, and its rebuild meets the
# already-exists answer and adopts the object that holds the name.
scenario: restart-parked-repair-rearm-meets-answers
arrows:
  - T-ready-restart
  - T-restart-stuck
  - T-failedrepair-rearm
cells:
  - instance/Failed/Repair/api.notFound/before
  - instance/Failed/Repair/api.alreadyExists/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 2, initialDelay: 5m, maxDelay: 30m, multiplier: 2.0}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the rebuilt pod crash-loops and is older than the grace when the wedge is read, so the row fails with its operation preserved
    events:
      - clock.advance: 2m
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 0}, message: "back-off restarting failed container"}
  - tick: 4
    note: a not-found answer is armed for the next pod delete and an already-exists answer for the next pod create; a parked repair issues neither, so nothing consumes them
    events:
      - api.notFound: {}
      - api.alreadyExists: {}
  - tick: 5
    note: the ladder's delay elapses, so the repair re-arms at the next incarnation and its drain meets the not-found answer, behind which the wedged pod is already gone
    events:
      - timer.repairRetry: {slack: 1s}
  - tick: 6
    note: the re-armed attempt's rebuild meets the already-exists answer and adopts the object that already holds the name
