# A migration surge gang left Creating with no operation whose PodGroup is
# deleted as the width grows. An unplanned index's group is not re-created
# and its width is not consulted; the wave reaps the index and deletes the
# leftover members.
scenario: idle-creating-gang-podgroup-deleted
arrows:
  - T-ready-migrate
  - T-empty-migrate-target
  - T-migrate-deadline-restore
  - T-migratetarget-expired
  - T-creating-reap
cells:
  - instance/Creating/gang.podGroup[Deleted]/before
  - instance/Creating/spec.gangWidth[grow]/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    migrationMode: Auto
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members are bound and report Ready, and the leader enters rotation, so the Instance promotes as one on a known node
    events:
      - pod.scheduled[source]: {pod: {index: 0, runner: leader}, message: node-0}
      - pod.scheduled[source]: {pod: {index: 0, runner: worker}, message: node-0}
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the operator asks the Instance off node-0, and the migrate pass admits the request, announces the surge gang's PodGroup and establishes the pair
    events:
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
  - tick: 4
    note: the surge gang's PodGroup is announced ahead of its members, which the next pass creates
  - tick: 5
    note: the surge members are bound and come up while the migration waits on its promote
    events:
      - pod.scheduled[target]: {pod: {index: 1, runner: leader}, message: node-1}
      - pod.scheduled[target]: {pod: {index: 1, runner: worker}, message: node-1}
      - pod.containersReady[target]: {pod: {index: 1, runner: leader}}
      - pod.containersReady[target]: {pod: {index: 1, runner: worker}}
  - tick: 6
    note: the record's deadline elapses with the source healthy, so expiry restores the source and unpins the surge, whose row is left Creating with no operation beyond the desired set
    events:
      - timer.migrationDeadline: {slack: 1s}
  - tick: 7
    note: the leftover gang's PodGroup is deleted and the width grows; an unplanned index's group is not re-created and its width is not consulted, so the wave reaps it
    events:
      - gang.podGroup[Deleted]: {instance: 1}
      - spec.gangWidth[grow]: {to: 2}
  - tick: 8
    note: the wave owns the row and deletes the leftover members
  - tick: 9
    note: the leftover members are gone, so the row is removed
    events:
      - pod.deleted[source]: {pod: {index: 1, runner: leader}}
      - pod.deleted[source]: {pod: {index: 1, runner: worker}}
