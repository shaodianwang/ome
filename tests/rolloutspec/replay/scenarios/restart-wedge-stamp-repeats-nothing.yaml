# After a wedged rebuild stamped the row Failed and the parked repair was
# diagnosed once, the grace is long elapsed and the same pull failure is reported
# again. The escalation pass skips an already-Failed row, so nothing is stamped twice.
scenario: restart-wedge-stamp-repeats-nothing
arrows:
  - T-ready-restart
  - T-restart-stuck
cells:
  - instance/Restart/Drain/pod.waiting[ImagePullBackOff]/after@T-restart-stuck
  - instance/Restart/Drain/timer.stuckPodGrace/after@T-restart-stuck
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the rebuilt pod is still booting two minutes on, which is longer than the grace but proves nothing on its own
    events:
      - clock.advance: 2m
  - tick: 4
    note: the pull wedges on a rebuilt pod already older than the grace, so the row fails with its operation preserved
    events:
      - pod.waiting[ImagePullBackOff]: {pod: {index: 0}, message: "manifest unknown"}
  - tick: 5
    note: the pass after the stamp diagnoses the parked repair once
  - tick: 6
    note: the grace is long elapsed and the pull failure is reported again; the already-Failed row is stamped nothing further
    events:
      - timer.stuckPodGrace: {slack: 1s}
      - pod.waiting[ImagePullBackOff]: {pod: {index: 0}, message: "manifest unknown"}
