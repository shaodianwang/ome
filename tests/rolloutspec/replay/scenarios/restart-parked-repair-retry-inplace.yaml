# A repair parked at Failed on a revision that is no longer the roll
# target, resumed from status beside a Backoff block on the target under
# InPlaceIfPossible: the roll that would replace the row waits on the
# ladder. The block coming due admits exactly one fresh in-place attempt
# over the parked repair, which patches the rebuilt pod, and the block read
# as due again admits nothing more.
scenario: restart-parked-repair-retry-inplace
arrows:
  - T-failedrepair-retry-inplace
cells:
  - instance/Failed/Repair/timer.retryAt/boundary@T-failedrepair-retry-inplace
  - instance/Failed/Repair/timer.retryAt/after@T-failedrepair-retry-inplace
initial:
  spec:
    replicas: 1
    strategy: InPlaceIfPossible
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v2
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 2m, maxDelay: 10m, multiplier: 2}
  currentRevision: registry.example.com/runtime:v1
  rows:
    - index: 0
      incarnation: 2
      phase: Failed
      runningRevision: registry.example.com/runtime:v1
      readySince: 0s
      operation: {type: Restart, step: Drain, reason: pod count 0 below desired 1}
  pods:
    - {index: 0, incarnation: 2, previousImage: registry.example.com/runtime:v1}
  retryBlocks:
    - {revision: current, state: Backoff, attemptsStarted: 1, nextRetryAt: 2m, reason: DeadlineExceeded}
timeline:
  - tick: 1
    note: the parked repair sits off the roll target while the target's block runs, so the roll waits on the ladder and the repair's exits find nothing to do
  - tick: 2
    note: the block comes due, so the roll replaces the parked repair with a fresh in-place attempt that patches the rebuilt pod
    events:
      - timer.retryAt: {slack: 1s}
  - tick: 3
    note: the block is read as due again; it admitted exactly one attempt and the patched pod is still coming up
    events:
      - timer.retryAt: {slack: 1s}
  - tick: 4
    note: the patched pod comes up on the target image and enters rotation, so the in-place attempt completes
    events:
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
