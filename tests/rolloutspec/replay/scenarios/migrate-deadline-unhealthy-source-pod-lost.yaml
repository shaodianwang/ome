# The record's deadline elapses on a source that was already crash-looping,
# and the same pass finds its pod gone. Expiry takes the unhealthy branch
# either way, so the lost pod changes nothing about the Failed stamp.
scenario: migrate-deadline-unhealthy-source-pod-lost
arrows:
  - T-ready-migrate
  - T-empty-migrate-target
  - T-migrate-deadline
  - T-migratetarget-expired
cells:
  - instance/Migrate/CreateSurge/pod.deleted[source]/boundary@T-migrate-deadline
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    migrationMode: Auto
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
timeline:
  - tick: 1
    note: the index is planned and no row exists, so the Create pass opens the attempt
  - tick: 2
    note: the pod is bound, becomes Ready and enters rotation, so the row records a running revision on a known node
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-0}
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the operator asks the Instance off node-0, and the migrate pass admits the request and establishes the pair
    events:
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
  - tick: 4
    note: the source itself starts crash-looping; a wedged source pod leaves the migration driving rather than closing the record
    events:
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 0}, message: "back-off restarting failed container"}
  - tick: 5
    note: the crash-looping pod is gone on the pass the record's deadline elapses, and expiry fails the source as it would have anyway
    events:
      - pod.deleted[source]: {pod: {index: 0}}
      - timer.migrationDeadline: {slack: 1s}
  - tick: 6
    note: the unpinned index is no longer planned, so the scale-down wave commits Phase Deleting with a Delete Drain operation on it
