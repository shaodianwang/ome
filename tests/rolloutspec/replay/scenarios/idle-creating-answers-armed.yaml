# Apiserver answers armed against a migration surge row left Creating with
# no operation. The Delete stamp refused once is retried by the adapter
# within the pass; an already-exists and a quota answer wait on creates
# that never come, since nothing is created for an unplanned index; the
# not-found answer meets the wave's delete, behind which the leftover pod
# is gone.
scenario: idle-creating-answers-armed
arrows:
  - T-ready-migrate
  - T-empty-migrate-target
  - T-migrate-deadline-restore
  - T-migratetarget-expired
  - T-creating-reap
  - T-delete-done
cells:
  - instance/Creating/api.conflict/before
  - instance/Creating/api.alreadyExists/before
  - instance/Creating/api.quotaDenied/before
  - instance/Creating/api.notFound/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    migrationMode: Auto
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
timeline:
  - tick: 1
    note: the index is planned and no row exists, so the Create pass opens the attempt
  - tick: 2
    note: the pod is bound, becomes Ready and enters rotation, so the row records a running revision on a known node
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-0}
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the operator asks the Instance off node-0, and the migrate pass admits the request and establishes the pair
    events:
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
  - tick: 4
    note: the surge pod is bound and comes up on its node while the migration waits on its promote
    events:
      - pod.scheduled[target]: {pod: {index: 1}, message: node-1}
      - pod.containersReady[target]: {pod: {index: 1}}
  - tick: 5
    note: the record's deadline elapses with the source healthy, so expiry restores the source and unpins the surge, whose row is left Creating with no operation beyond the desired set
    events:
      - timer.migrationDeadline: {slack: 1s}
  - tick: 6
    note: the Delete stamp is refused once and re-applied under the adapter's retry; the create answers are consumed by nobody, since nothing is created for an unplanned index
    events:
      - api.conflict: {write: 1, count: 1}
      - api.alreadyExists: {}
      - api.quotaDenied: {}
      - api.notFound: {}
  - tick: 7
    note: the wave's delete meets the not-found answer, behind which the leftover pod is already gone
  - tick: 8
    note: the wave finds the pod gone and removes the row
