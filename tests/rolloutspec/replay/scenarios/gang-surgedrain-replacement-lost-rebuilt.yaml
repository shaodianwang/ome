# A gang surge hands over: the replacement is complete and in rotation, the
# source has left the serving gate at the drain step. The whole replacement
# gang is then deleted from outside. The loss closes the attempt: the source
# is stamped Failed with its surge kept and the pinned revision's ladder
# counts the attempt. Once the ladder's backoff is due the gang is rebuilt
# under a fresh deadline with the retry counted on the operation, and the
# hand-over finishes on the pinned revision.
scenario: gang-surgedrain-replacement-lost-rebuilt
arrows:
  - T-empty-gang-surge-target
  - T-gangtarget-ready
  - T-surgedrain-gang-replacement-lost
  - T-failedgangsurgedrain-rearm
  - T-surgedrain-gang-complete
intentional: >-
  a replacement gang lost after the hand-over closes the attempt and is
  rebuilt under the next one, counted on the pinned revision's ladder
cells:
  - instance/Update/SurgeDrain/pod.deleted[target]/before
  - instance/Failed/GangSurgeDrain/pod.deleted[target]/before
  - instance/Update/GangSurgeTarget/pod.deleted[target]/before
  - instance/Update/SurgeDrain/pod.deleted[source]/before
  - instance/Failed/GangSurgeDrain/timer.retryAt/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    updateRetry: {maxAttempts: 3, initialDelay: 1m, maxDelay: 30m, multiplier: 2}
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: both replacement members report Ready and the leader enters rotation, so the source advances to the drain and leaves the serving gate
    events:
      - pod.ready[target]: {pod: {index: 1, runner: leader}}
      - pod.ready[target]: {pod: {index: 1, runner: worker}}
      - endpoint.rotationIn[target]: {pod: {index: 1, runner: leader}}
  - tick: 6
    note: the whole replacement gang is deleted from outside after the hand-over; the loss closes the attempt, so the source is stamped Failed with its surge kept, the pinned revision's ladder counts the attempt and nothing is rebuilt under the attempt that died
    events:
      - pod.deleted[target]: {pod: {index: 1, runner: leader}}
      - pod.deleted[target]: {pod: {index: 1, runner: worker}}
  - tick: 7
    note: the ladder's backoff is due, so the replacement gang is rebuilt at the pinned revision and the source re-arms for its next attempt under a fresh deadline with the retry counted on the operation
    events:
      - timer.retryAt: {slack: 1s}
  - tick: 8
    note: both rebuilt members report Ready, so the continuation marks them serving and waits for the drained source to leave the routed Service
    events:
      - pod.ready[target]: {pod: {index: 1, runner: leader}}
      - pod.ready[target]: {pod: {index: 1, runner: worker}}
  - tick: 9
    note: the source leader leaves the routed Service, so the drain has converged and the source pods are deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
  - tick: 10
    note: the source pods are gone, so the rebuilt replacement is promoted Ready on the pinned revision, the ladder is pruned and the source row is removed
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
