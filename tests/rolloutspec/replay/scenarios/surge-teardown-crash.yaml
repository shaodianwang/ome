# The owner is deleted mid-surge while the replacement reports Ready, the
# controller restarts and the template moves, on that pass and the next;
# teardown takes precedence and none of those observations is acted on.
scenario: surge-teardown-crash
arrows:
  - T-ready-surge
  - T-surge-teardown
  - T-delete-done
cells:
  - instance/Update/Surge/pod.ready[target]/boundary@T-surge-teardown
  - instance/Update/Surge/ctrl.crash/boundary@T-surge-teardown
  - instance/Update/Surge/spec.revision/boundary@T-surge-teardown
  - instance/Update/Surge/pod.ready[target]/after@T-surge-teardown
  - instance/Update/Surge/ctrl.crash/after@T-surge-teardown
  - instance/Update/Surge/spec.revision/after@T-surge-teardown
  - instance/Update/Surge/spec.teardown[deleted]/after@T-surge-teardown
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the owner's deletion begins as the replacement reports Ready, the controller restarts and the template moves; the surging Instance becomes a scale-down extra and nothing else runs
    events:
      - spec.teardown[deleted]: {}
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - ctrl.crash: {}
      - spec.revision: {image: registry.example.com/runtime:v3}
  - tick: 5
    note: the delete wave owns the row; the teardown re-observed, readiness, a restart and another edit change nothing
    events:
      - spec.teardown[deleted]: {}
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - ctrl.crash: {}
      - spec.revision: {image: registry.example.com/runtime:v4}
  - tick: 6
    note: the source leaves rotation, which is the drain the delete waits on
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 7
    note: both slots are gone, so the row is removed with them
    events:
      - pod.deleted[source]: {pod: {index: 0, ordinal: 0}}
      - pod.deleted[target]: {pod: {index: 0, ordinal: 1}}
