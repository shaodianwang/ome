# A new index is planned while its namespace is being deleted. The create
# that materializes the index stamps Creating first, so the terminating
# cause is classified and disposed on that state; namespace GC then
# deletes the owner and the next pass runs teardown instead.
scenario: idle-empty-create-in-terminating-namespace
arrows:
  - T-empty-create
  - T-ready-teardown
cells:
  - instance/Empty/api.namespaceTerminating/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod and the second index is not planned
  - tick: 2
    note: the replica count grows while the namespace is being deleted; the stamp lands first, so the refusal is classified and disposed on the Creating attempt
    events:
      - spec.replicasUp: {to: 2}
      - api.namespaceTerminating: {count: 2}
  - tick: 3
    note: namespace GC deletes the owner, so the next pass runs teardown instead of another create
    events:
      - spec.teardown[deleted]: {}
