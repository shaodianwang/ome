# Two hold authorities meet on one row, pause first. The operator pause
# records the Paused token on the surging Instance; the source then leaves
# the routed Service, and "this Instance is serving nothing" is the fact
# that takes the token over — the one ordered pair in the external-hold
# contract. When the source is routed again the surge releases its own
# token and the pause, still in force, takes the row back.
scenario: hold-pause-then-unrouted
cells:
  - instance/Update/Surge/spec.pauseTrue/before
  - instance/Update/Surge/endpoint.rotationOut[source]/before
  - instance/Update/Surge/endpoint.rotationIn[source]/before
  - instance/Update/Surge/spec.unpause/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the pod template changes, so the rollout surges a replacement beside the source
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 2
    note: the operator pauses, and the pause is the first authority on the row - the operation carries Paused
    events:
      - spec.pauseTrue: {}
  - tick: 3
    note: the source leaves the routed Service, and the fact about the Instance takes the token from the pause
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 4
    note: the source is routed again, so the surge releases its own token and the pause, still in force, takes the row back in the same pass
    events:
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 5
    note: the row reports the pause and neither authority writes again
  - tick: 6
    note: the pause is lifted and the row is released by the authority that set it
    events:
      - spec.unpause: {}
