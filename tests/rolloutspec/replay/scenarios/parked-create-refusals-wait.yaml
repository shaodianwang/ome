# An invalid-spec refusal and a shed write armed while a parked attempt
# stands - first with its set serving, then with it down - are consumed by
# nobody, since a parked attempt creates nothing of its own in either
# phase. Both wait for the fresh recreate attempt the ladder admits: its
# rebuild's create is shed and paced, and the create after meets the
# refusal on that attempt's own state.
scenario: parked-create-refusals-wait
arrows:
  - T-ready-recreate
  - T-drain-deadline
  - T-failed-parked-serves
  - T-parked-backoff
  - T-failedparked-retry
cells:
  - instance/Update/Parked/api.invalid/before
  - instance/Update/Parked/api.throttled[TooManyRequests]/before
  - instance/Failed/Parked/api.invalid/before
  - instance/Failed/Parked/api.throttled[TooManyRequests]/before
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 1h, maxDelay: 2h, multiplier: 2}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod template changes, so the roll drains the pod for a recreate
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the pod leaves rotation, so it is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 4
    note: the old pod is gone, so the rebuild lands at the new revision
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 5
    note: the deadline elapses on a rebuilt pod that never came up; the ladder counts the wave and the attempt is parked with the row Failed
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the pod comes up and is gated serving, so the parked set serves in full and the row reads as the roll in progress with the attempt still parked
    events:
      - pod.containersReady[source]: {pod: {index: 0}}
      - pod.servingOn[source]: {pod: {index: 0}}
  - tick: 7
    note: a shed write and an invalid-spec refusal are armed for the next pod creates; a parked attempt whose set serves creates nothing, so neither is consumed
    events:
      - api.throttled[TooManyRequests]: {retryAfter: 30s}
      - api.invalid: {}
  - tick: 8
    note: the pod's container parks in the kubelet's back-off, so the set serves nothing and the row returns to Failed with the attempt kept; a parked attempt whose set is down creates nothing either
    events:
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 0}, message: "back-off 5m0s restarting failed container"}
  - tick: 9
    note: a further pass while the ladder runs consumes nothing
  - tick: 10
    note: the block comes due; the fresh recreate attempt replaces the parked one and drains the parked pod
    events:
      - timer.retryAt: {slack: 1s}
  - tick: 11
    note: the parked pod is gone, and the rebuild's create is shed, which paces the pass on the server's delay
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 12
    note: the create after meets the invalid-spec refusal, which disposes that attempt on its own state
