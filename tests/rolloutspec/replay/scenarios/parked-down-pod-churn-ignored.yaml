# A parked attempt whose single pod never came up churns in place: it
# reappears under a new UID, is gated by a queue and admitted again, is
# bound to a node that goes NotReady, and is finally evicted. The set keys
# on the attempt's revision and is down throughout; no deadline is parked
# or re-armed on a row nobody owns, no exit reads the node, and the
# terminal pod the eviction leaves frees a name the ladder still denies a
# fresh start for.
scenario: parked-down-pod-churn-ignored
arrows:
  - T-ready-recreate
  - T-drain-deadline
cells:
  - instance/Failed/Parked/pod.uidRotated/before
  - instance/Failed/Parked/pod.schedulingGated/before
  - instance/Failed/Parked/pod.admitted/before
  - instance/Failed/Parked/pod.nodeLost[NodeNotReady]/before
  - instance/Failed/Parked/pod.evicted/before
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 1h, maxDelay: 2h, multiplier: 2}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod template changes, so the roll drains the pod for a recreate
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the pod leaves rotation, so it is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 4
    note: the old pod is gone, so the rebuild lands at the new revision
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 5
    note: the deadline elapses on a rebuilt pod that never came up; the ladder counts the wave and the attempt is parked with the row Failed
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the parked pod reappears under a new UID, fresh and Pending; the set keys on the attempt's revision, so it is the same member and nothing is written
    events:
      - pod.uidRotated: {pod: {index: 0}}
  - tick: 7
    note: a queue admission gates the pod; no pod of a parked attempt is being admitted and a Failed row has no deadline to park
    events:
      - pod.schedulingGated: {pod: {index: 0}}
  - tick: 8
    note: the queue admits the pod; the deadline reconciler re-arms no clock on a row nobody owns
    events:
      - pod.admitted: {pod: {index: 0}}
  - tick: 9
    note: the pod is bound and its node goes NotReady; the loss reaches the row only through its pod, which is down already
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-1}
      - pod.nodeLost[NodeNotReady]: {pod: {index: 0}}
  - tick: 10
    note: the pod is evicted under memory pressure; the terminal pod frees its name, but the fresh start the Create pass would open is behind the ladder, so nothing moves
    events:
      - pod.evicted: {pod: {index: 0}, message: "The node was low on resource: memory."}
  - tick: 11
    note: a further pass reads the same set and writes nothing
