# A migration surge row left Creating with no operation whose leftover pod
# wedged on its image before the record expired. The escalation pass reads
# a row with no operation only for a leftover pod whose revision disagrees
# with the current one, and this one agrees, so neither the wedge nor the
# grace elapsing on it stamps anything; the wave reaps the unplanned index.
scenario: idle-creating-left-pod-wedged
arrows:
  - T-ready-migrate
  - T-empty-migrate-target
  - T-migrate-deadline-restore
  - T-migratetarget-expired
  - T-creating-reap
  - T-delete-done
cells:
  - instance/Creating/pod.waiting[ImagePullBackOff]/before
  - instance/Creating/timer.stuckPodGrace/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    migrationMode: Auto
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
    stuckPodGrace: 1m
timeline:
  - tick: 1
    note: the index is planned and no row exists, so the Create pass opens the attempt
  - tick: 2
    note: the pod is bound, becomes Ready and enters rotation, so the row records a running revision on a known node
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-0}
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the operator asks the Instance off node-0, and the migrate pass admits the request and establishes the pair
    events:
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
  - tick: 4
    note: the surge pod waits for a node while the migration waits on its promote
    events:
      - pod.waiting[ImagePullBackOff]: {pod: {index: 1}, message: "manifest unknown"}
  - tick: 5
    note: the record's deadline elapses with the source healthy, so expiry restores the source and unpins the surge, whose row is left Creating with no operation beyond the desired set
    events:
      - timer.migrationDeadline: {slack: 1s}
  - tick: 6
    note: the wedge is re-observed and the stuck-pod grace has elapsed on it; the leftover pod runs the current revision, so nothing is stamped and the wave reaps the unplanned index
    events:
      - pod.waiting[ImagePullBackOff]: {pod: {index: 1}, message: "manifest unknown"}
      - timer.stuckPodGrace: {slack: 1s}
  - tick: 7
    note: the wave owns the row and deletes the leftover pod
  - tick: 8
    note: the leftover pod is gone, so the row is removed
    events:
      - pod.deleted[source]: {pod: {index: 1}}
