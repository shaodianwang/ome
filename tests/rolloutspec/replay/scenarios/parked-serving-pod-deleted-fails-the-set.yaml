# A recreate attempt parked at Failed with its operation kept comes up and
# is gated serving, so the row reads as the roll in progress with the
# attempt still parked, and the serving pod is then deleted outright. No
# live pod of the parked set is left and no repair takes the loss, so the
# row returns to Failed on the tick the deletion is observed, the attempt
# kept. The fresh start that would rebuild it waits on the target's ladder,
# and when the block comes due the update pass, which runs ahead of the
# Create pass, re-opens the parked row as a fresh recreate with nothing to
# drain; the Create pass's own rebuild is never reached.
scenario: parked-serving-pod-deleted-fails-the-set
arrows:
  - T-ready-recreate
  - T-drain-deadline
  - T-failed-parked-serves
  - T-parked-gone
  - T-failedparked-retry
cells:
  - instance/Update/Parked/pod.deleted[source]/boundary@T-parked-gone
  - instance/Failed/Parked/timer.retryAt/boundary@T-failedparked-retry
  - instance/Failed/Parked/timer.retryAt/after@T-failedparked-retry
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 1h, maxDelay: 2h, multiplier: 2}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod template changes, so the roll drains the pod for a recreate
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the pod leaves rotation, so it is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 4
    note: the old pod is gone, so the rebuild lands at the new revision
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 5
    note: the deadline elapses on a rebuilt pod that never came up; the ladder counts the wave and the attempt is parked with the row Failed
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the pod comes up and is gated serving, so the parked set serves in full and the row reads as the roll in progress with the attempt still parked
    events:
      - pod.containersReady[source]: {pod: {index: 0}}
      - pod.servingOn[source]: {pod: {index: 0}}
  - tick: 7
    note: the serving pod is deleted outright by another hand; no live pod of the parked set is left and no repair takes the loss, so the row returns to Failed on this tick with the attempt kept
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 8
    note: a further pass finds the parked row with no pod; the fresh start that would rebuild it still waits on the target's ladder
  - tick: 9
    note: the block comes due; the update pass runs ahead of the Create pass and re-opens the parked row as a fresh recreate at a new incarnation, which has nothing to drain and creates the pod at once, and the block flips to RetryInProgress
    events:
      - timer.retryAt: {slack: 1s}
  - tick: 10
    note: the block is read as due again; it admitted exactly one attempt and the rebuilt pod is still coming up
    events:
      - timer.retryAt: {slack: 1s}
