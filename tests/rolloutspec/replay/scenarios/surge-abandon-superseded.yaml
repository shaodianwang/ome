# A second template edit lands while the replacement is still coming up. The
# uncommitted surge is abandoned rather than retargeted: the replacement pod
# is deleted and the source is reset to Ready on its running revision, so the
# next pass re-enters through the budget and the gate.
scenario: surge-abandon-superseded
arrows:
  - T-ready-surge
  - T-surge-abandon-superseded
cells:
  - instance/Update/Surge/spec.revision/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: a further edit supersedes the pinned target while the replacement is not yet runtime-ready, so the surge is abandoned
    events:
      - spec.revision: {image: registry.example.com/runtime:v3}
  - tick: 5
    note: the abandoned replacement is gone, so the source is reset to Ready on the revision it runs
    events:
      - pod.deleted[target]: {pod: {index: 0, ordinal: 1}}
