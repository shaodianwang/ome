# Spec and config edits land while the migration surge row stands Failed
# with its Migrate pin kept. A stale pass, a label the hasher derives, a
# strategy edit, four lifecycle knobs and a new pod template all write
# nothing on the pair: the update trigger declines a migrate-owned status
# and no clock on these rows reads a knob. The record's deadline ends the
# move, and only once the source is restored and the retired surge index is
# gone does the new revision roll it, under the strategy and the ready
# timeout the edits left behind.
scenario: migrate-target-grace-failed-spec-edits-wait
arrows:
  - T-ready-migrate
  - T-empty-migrate-target
  - T-failedmigratetarget-expired
  - T-migrate-deadline-restore
  - T-delete-done
  - T-ready-recreate
cells:
  - instance/Failed/MigrateTarget/ctrl.staleRead/before
  - instance/Failed/MigrateTarget/spec.annotationOnly/before
  - instance/Failed/MigrateTarget/spec.strategy/before
  - instance/Failed/MigrateTarget/spec.policyTuning[instanceReadyTimeout]/before
  - instance/Failed/MigrateTarget/spec.policyTuning[restartPolicy]/before
  - instance/Failed/MigrateTarget/spec.policyTuning[minReadySeconds]/before
  - instance/Failed/MigrateTarget/spec.policyTuning[markNotReady]/before
  - instance/Failed/MigrateTarget/spec.revision/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    podLabels: {kueue.x-k8s.io/queue-name: queue-a}
    migrationMode: Auto
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    unschedulableGrace: 10m
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
timeline:
  - tick: 1
    note: the index is planned and no row exists, so the Create pass opens the attempt
  - tick: 2
    note: the pod is bound, becomes Ready and enters rotation, so the row records a running revision on a known node
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-0}
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the operator asks the Instance off node-0, and the migrate pass admits the request and establishes the pair
    events:
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
  - tick: 4
    note: the scheduler finds the surge no node off node-0, so the scheduler hold is recorded on the surge row and both pair deadlines park
    events:
      - pod.unschedulable[target]: {pod: {index: 1}}
  - tick: 5
    note: the hold outlasts the configured grace, so the escalation stamps the surge row Failed with its Migrate pin kept while the source keeps serving under its own pin
    events:
      - clock.advance: 11m
  - tick: 6
    note: the cache lags a tick behind, and a pass that writes nothing on the pair has nothing a stale read could misplace
    events:
      - ctrl.staleRead: {}
  - tick: 7
    note: the queue label is re-pointed, which the hasher derives rather than reads, so the target revision stands and nothing reaches the pair
    events:
      - spec.annotationOnly: {labels: {kueue.x-k8s.io/queue-name: queue-b}}
  - tick: 8
    note: the update strategy is edited, which a placement move never reads
    events:
      - spec.strategy: {strategy: RecreatePod}
  - tick: 9
    note: the ready timeout, the restart policy, the availability window and the mark-not-ready flag are edited at once, and none is read by a row whose clock is the record's
    events:
      - spec.policyTuning[instanceReadyTimeout]: {value: 5m}
      - spec.policyTuning[restartPolicy]: {value: RecreateInstanceOnPodRestart}
      - spec.policyTuning[minReadySeconds]: {value: "10"}
      - spec.policyTuning[markNotReady]: {value: "false"}
  - tick: 10
    note: the pod template changes, and the update trigger declines both rows of a migrate-owned pair
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 11
    note: the record's deadline elapses, so the expiry clears the pin from the Failed surge row, closes the record and restores the source to Ready on its running revision
    events:
      - timer.migrationDeadline: {slack: 1s}
  - tick: 12
    note: the unpinned index is beyond the desired set, so the scale-down pipeline commits Phase Deleting on it
  - tick: 13
    note: the drain finds nothing routed on the retired index, so its pod's delete is issued
  - tick: 14
    note: the surge pod is gone, so its row is removed with it
    events:
      - pod.deleted[target]: {pod: {index: 1}}
  - tick: 15
    note: with the pair gone the new revision reaches the restored source, which the edited strategy rebuilds in place of surging under the edited ready timeout
