# Replicas drop on the tick a repairing Instance's rebuilt pod reports Ready, and
# the owner is deleted the tick after. The scale-down wave claims the index whatever
# its pod reports, and the teardown finds the delete stamp already in place.
scenario: restart-scaledown-then-teardown
arrows:
  - T-ready-restart
  - T-restart-scaledown
  - T-ready-teardown
  - T-delete-done
cells:
  - instance/Restart/Drain/pod.containersReady[source]/boundary@T-restart-scaledown
  - instance/Restart/Drain/spec.teardown[deleted]/after@T-restart-scaledown
initial:
  spec:
    replicas: 2
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
    - {index: 1, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: both Instances serve
  - tick: 2
    note: the second Instance loses its pod, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 1}}
  - tick: 3
    note: the operator halves the replica count as the rebuilt pod reports Ready; the index has left the plan, so the wave claims it
    events:
      - spec.replicasDown: {to: 1}
      - pod.ready[source]: {pod: {index: 1}}
  - tick: 4
    note: the owner is deleted; the retiring row keeps its delete operation and its pod is deleted, while the serving Instance waits for the wave
    events:
      - spec.teardown[deleted]: {}
  - tick: 5
    note: the retired pod is gone, so its row is removed
    events:
      - pod.deleted[source]: {pod: {index: 1}}
  - tick: 6
    note: the serving Instance is admitted into the wave as its endpoint goes not-ready
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 7
    note: its pod is gone, so the last row leaves the owner's status
    events:
      - pod.deleted[source]: {pod: {index: 0}}
