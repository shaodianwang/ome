# A gang's recreate is ended by the gang verdict with the Update operation
# kept, and in the one pass the row reads Failed something else deletes its
# rebuilt leader while its worker's kubelet stops reporting. A pod on its way
# out and a member whose kubelet is gone are both the force-delete sweep's,
# which has no policy to act on, so the re-drive's Phase A waits on both
# names; a kubelet that never acknowledges the deletion changes nothing.
scenario: recreate-gang-conflict-failed-terminating-and-unknown
arrows:
  - T-ready-recreate
  - T-faileddrain-redrive
cells:
  - instance/Failed/Drain/pod.terminating[source]/before
  - instance/Failed/Drain/pod.phaseTerminal[Unknown]/before
  - instance/Failed/Drain/pod.stuckTerminating/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members are bound to node-0 and report Ready, and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.scheduled[source]: {pod: {index: 0, runner: leader}, message: node-0}
      - pod.scheduled[source]: {pod: {index: 0, runner: worker}, message: node-0}
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the pod template changes and the strategy rebuilds the gang in place of surging, so Phase A takes the serving gates down
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the leader leaves rotation, so Phase A deletes both members
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
  - tick: 5
    note: both members are gone, so Phase B rebuilds the gang at the bumped incarnation behind its existing PodGroup
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
  - tick: 6
    note: the group's controller reference is rewritten to another owner, which is a name this controller may not write, so the gang verdict stamps the Instance Failed with the recreate kept rather than parked
    events:
      - gang.podGroup[OwnershipConflict]: {instance: 0}
  - tick: 7
    note: the rebuilt members are bound, something else deletes the leader and the worker's kubelet stops reporting it, and the re-drive restamps the recreate and issues the worker's delete while the leader is already on its way out
    events:
      - pod.scheduled[source]: {pod: {index: 0, runner: leader}, message: node-1}
      - pod.scheduled[source]: {pod: {index: 0, runner: worker}, message: node-1}
      - pod.terminating[source]: {pod: {index: 0, runner: leader}}
      - pod.phaseTerminal[Unknown]: {pod: {index: 0, runner: worker}}
  - tick: 8
    note: the hold pass records the worker's node-unknown token on the re-driven row, and the name still belongs to another controller, so the verdict fails the attempt again with the recreate kept
  - tick: 9
    note: the kubelet behind the leader stops acknowledging the deletion, and with no force-delete policy the sweep leaves it where it is, so the re-drive restamps again and Phase A keeps waiting on both names
    events:
      - pod.stuckTerminating: {pod: {index: 0, runner: leader}}
  - tick: 10
    note: the node-unknown token is recorded again and the verdict fails the re-driven attempt again
