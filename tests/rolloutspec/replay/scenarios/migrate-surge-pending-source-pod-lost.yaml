# The source's only pod disappears while its migration is at SurgePending.
# Losing a source pod early does not shorten the migration: the surge must
# still pass its gates, the pin holds on both rows, and the delete loop at
# the end simply has one pod less to delete.
scenario: migrate-surge-pending-source-pod-lost
arrows:
  - T-ready-migrate
  - T-empty-migrate-target
cells:
  - instance/Migrate/CreateSurge/pod.deleted[source]/before
  - instance/Migrate/SurgeTarget/pod.deleted[source]/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    migrationMode: Auto
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
timeline:
  - tick: 1
    note: the index is planned and no row exists, so the Create pass opens the attempt
  - tick: 2
    note: the pod is bound, becomes Ready and enters rotation, so the row records a running revision on a known node
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-0}
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the operator asks the Instance off node-0, and the migrate pass admits the request and establishes the pair
    events:
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
  - tick: 4
    note: the source pod is gone, and neither row moves because the surge has still to pass its gates
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 5
    note: the next pass finds the same pair and the same wait, and nothing rebuilds the source while the pin is held
