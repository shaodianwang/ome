# Readiness, gate and endpoint signals on the SOURCE pods while a retired
# replacement is being cleaned up. The source was never drained on this path,
# so none of them changes the retirement or the reset that ends it.
scenario: gang-cleanup-source-signals-ignored
arrows:
  - T-empty-gang-surge-target
  - T-gangtarget-cleanup-superseded
  - T-gangcleanup-done
  - T-ready-surge
cells:
  - instance/Update/GangSurgeTargetCleanup/pod.containersReady[source]/before
  - instance/Update/GangSurgeTargetCleanup/pod.ready[source]/before
  - instance/Update/GangSurgeTargetCleanup/pod.servingOn[source]/before
  - instance/Update/GangSurgeTargetCleanup/pod.servingOff[source]/before
  - instance/Update/GangSurgeTargetCleanup/endpoint.rotationIn[source]/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: the template changes again while the replacement is still incomplete, so the marker is claimed as a cleanup and its members are deleted
    events:
      - spec.revision: {image: registry.example.com/runtime:v3}
  - tick: 6
    note: the source re-reports its readiness, its gates move both ways and the worker shows up as an endpoint; the retirement is unchanged
    events:
      - pod.containersReady[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - pod.servingOn[source]: {pod: {index: 0, runner: leader}}
      - pod.servingOff[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: worker}}
  - tick: 7
    note: the retired members are gone, so the marker is removed and the source is reset Ready on its running revision
    events:
      - pod.deleted[target]: {pod: {index: 1, runner: leader}}
      - pod.deleted[target]: {pod: {index: 1, runner: worker}}
  - tick: 8
    note: the reset source is off the new target, and the roll claims a fresh replacement for it
