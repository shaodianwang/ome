# Both Instances are mid-recreate when the operator halves the replica count.
# A recreate roll pins nothing in the plan, so the retired index falls out and
# the scale-down wave stamps Deleting over its Update operation.
scenario: drain-scaledown
arrows:
  - T-ready-recreate
  - T-drain-scaledown
  - T-delete-done
cells:
  - instance/Update/Drain/spec.replicasDown/before
initial:
  spec:
    replicas: 2
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
    - {index: 1, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the pod template changes, so both Instances open a recreate
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 2
    note: the operator halves the replica count, so the retired index leaves the plan mid-recreate
    events:
      - spec.replicasDown: {to: 1}
  - tick: 3
    note: the retired index's pod leaves rotation, which is the drain the delete waits on
    events:
      - endpoint.rotationOut[source]: {pod: {index: 1}}
  - tick: 4
    note: the drained pod is gone, so the row is removed with it
    events:
      - pod.deleted[source]: {pod: {index: 1}}
