# The owner of a gang surge pair that failed on its deadline, with the
# abandon already on its cleanup claim, was deleted long enough ago that its
# teardown deadline has already elapsed when the controller first observes
# the deletion. The release is phase-blind: the finalizer goes and both rows
# of the pair are purged with the owner, and a later tick finds nothing to
# reconcile.
scenario: gang-cleanup-failed-teardown-deadline
arrows:
  - T-empty-gang-surge-target
  - T-gangtarget-deadline
  - T-failedgangtarget-cleanup-failed
cells:
  - instance/Failed/GangSurgeTargetCleanup/timer.teardownDeadline/before
  - instance/Failed/GangSurgeTargetCleanup/timer.teardownDeadline/after@T-failedgangcleanup-teardown-deadline
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    containerName: ome-container
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    teardownDeadline: 1m
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: the replacement is still not Ready when the deadline elapses, so both halves of the pair are stamped Failed with their operations preserved
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the abandon claims the cleanup marker and deletes the retired replacement's members
  - tick: 7
    note: the owner's deletion is observed with its teardown deadline already behind the clock; the finalizer is released and both rows of the pair are purged with the owner, the surviving pods left to background GC
    events:
      - spec.teardown[deleted]: {}
      - timer.teardownDeadline: {slack: 1s}
  - tick: 8
    note: the deadline is observed again on an owner that is gone; the finalizer was removed once and nothing reconciles
    events:
      - timer.teardownDeadline: {slack: 1s}
