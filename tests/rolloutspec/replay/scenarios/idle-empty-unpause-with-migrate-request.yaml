# A planned index with no row waits under a pause, and the pause clears as
# the operator asks that index to migrate. The create pins a plain index;
# a migration surge index is only ever allocated by the record.
scenario: idle-empty-unpause-with-migrate-request
arrows:
  - T-empty-unpause
cells:
  - instance/Empty/spec.migrateRequest/boundary@T-empty-unpause
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    migrationMode: Auto
    instanceReadyTimeout: 30m
    paused: true
  config:
    requeueOperation: 5s
    requeueGate: 3s
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
timeline:
  - tick: 1
    note: the index is planned but pause holds the Create pass, so no row is written
  - tick: 2
    note: the pause clears as the operator asks the index that does not exist yet to migrate; the request finds no source to move and fails, which ends the pass
    events:
      - spec.unpause: {}
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
  - tick: 3
    note: the Create pass opens a plain attempt on the next pass; the record never claimed the index
