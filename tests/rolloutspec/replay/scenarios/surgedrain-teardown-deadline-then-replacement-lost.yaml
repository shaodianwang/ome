# The owner of a single-pod surge at its drain step is deleted with its
# teardown deadline already elapsed, and the replacement is lost on the tick
# after the release. The finalizer went with the owner and its row, so there
# is no row left to recreate the replacement for and nothing reconciles.
scenario: surgedrain-teardown-deadline-then-replacement-lost
arrows:
  - T-ready-surge
  - T-surge-target-ready
cells:
  - instance/Update/SurgeDrain/pod.deleted[target]/after@T-surgedrain-teardown-deadline
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    teardownDeadline: 1m
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement is serving and in rotation, so the step advances and the source leaves the serving gate
    events:
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 5
    note: the owner's deletion is observed with its teardown deadline already behind the clock; the release consults no pod state, so the finalizer goes and the row is purged with the owner
    events:
      - spec.teardown[deleted]: {}
      - timer.teardownDeadline: {slack: 1s}
  - tick: 6
    note: the replacement is lost on an owner that is gone; there is no row left to recreate it for and nothing reconciles
    events:
      - pod.deleted[target]: {pod: {index: 0, ordinal: 1}}
      - timer.teardownDeadline: {slack: 1s}
