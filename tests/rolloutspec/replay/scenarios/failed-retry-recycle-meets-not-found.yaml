# An Instance parked at Failed with no operation whose pod exits with a
# terminal phase while its target sits in Backoff: the recycle is the
# Create pass's fresh start, so nothing moves until the block comes due.
# Then the fresh start claims the row and its recycle delete meets a
# not-found answer, behind which the dead pod is already gone, and the
# rebuild lands on the next pass.
scenario: failed-retry-recycle-meets-not-found
arrows:
  - T-failed-retry
cells:
  - instance/Failed/api.notFound/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 2m, maxDelay: 10m, multiplier: 2}
  rows:
    - {index: 0, phase: Failed, runningRevision: current}
  pods:
    - {index: 0, node: node-0}
  retryBlocks:
    - {revision: current, state: Backoff, attemptsStarted: 1, nextRetryAt: 2m, reason: DeadlineExceeded}
timeline:
  - tick: 1
    note: the Instance is parked at Failed while its target sits in Backoff, so no fresh start is admitted
  - tick: 2
    note: the pod exits with phase Failed; the recycle is the fresh start's and the fresh start is behind the ladder, so nothing moves
    events:
      - pod.phaseTerminal[Failed]: {pod: {index: 0}}
  - tick: 3
    note: the block comes due with a not-found answer armed; the fresh start claims the row and its recycle delete meets the answer, behind which the dead pod is already gone
    events:
      - timer.retryAt: {slack: 1s}
      - api.notFound: {}
  - tick: 4
    note: the name is free, so the fresh Create rebuilds the index
