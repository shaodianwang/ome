# Two Instances roll with a partition of one, so the lowest is held on its
# revision and the other recreates; its rebuilt pod never comes up, and at
# the deadline the ladder counts the wave and parks the attempt with the
# row Failed. The partition is then raised to two, which holds the parked
# row as the Failed row it stands for, so the roll may not take it even
# once the block comes due. Its parked pod then exits with phase Failed:
# every remaining pod of the set is terminal, so the Create pass claims the
# row under a fresh Create attempt pinned to the target, replacing the
# parked one, deletes the dead occupant with a TerminalPodRecycled warning,
# and recreates the pod once it is gone.
scenario: parked-down-held-by-partition-set-exits-recycles
arrows:
  - T-ready-recreate
  - T-drain-deadline
  - T-failedparked-recycle-rebuild
cells:
  - instance/Failed/Parked/spec.partition/before
  - instance/Failed/Parked/timer.retryAt/before
  - instance/Failed/Parked/pod.phaseTerminal[Failed]/boundary@T-failedparked-recycle-rebuild
  - instance/Failed/Parked/pod.deleted[source]/after@T-failedparked-recycle-rebuild
initial:
  spec:
    replicas: 2
    strategy: RecreatePod
    partition: 1
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 1h, maxDelay: 2h, multiplier: 2}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
    - {index: 1, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: both Ready rows are steady on their serving pods
  - tick: 2
    note: the pod template changes; the partition holds the lowest Instance on its revision and the roll drains the other for a recreate
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the rolling pod leaves rotation, so it is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 1}}
  - tick: 4
    note: the old pod is gone, so the rebuild lands at the new revision
    events:
      - pod.deleted[source]: {pod: {index: 1}}
  - tick: 5
    note: the deadline elapses on a rebuilt pod that never came up; the ladder counts the wave and the attempt is parked with the row Failed
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the partition is raised to two, so the parked row is held like the Failed row it stands for and the roll may not take it
    events:
      - spec.partition: {to: 2}
  - tick: 7
    note: the block comes due; the partition keeps the roll off the parked row, and while its pod stands the Create pass leaves it alone
    events:
      - timer.retryAt: {slack: 1s}
  - tick: 8
    note: the parked pod exits with phase Failed; every pod of the set is terminal, so the Create pass claims the row under a fresh Create attempt pinned to the target, replacing the parked one, and deletes the dead occupant with a TerminalPodRecycled warning
    events:
      - pod.phaseTerminal[Failed]: {pod: {index: 1}}
  - tick: 9
    note: the dead pod is gone, so the Create attempt recreates it at the target
    events:
      - pod.deleted[source]: {pod: {index: 1}}
