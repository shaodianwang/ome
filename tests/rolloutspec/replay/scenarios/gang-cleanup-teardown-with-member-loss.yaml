# Owner deletion lands on a retirement in flight as one retired member goes.
# The delete wave owns the index from here, the lost pod is one fewer to drain,
# and the teardown re-asserted next pass finds the stamps already committed.
scenario: gang-cleanup-teardown-with-member-loss
arrows:
  - T-empty-gang-surge-target
  - T-gangtarget-cleanup-superseded
  - T-gangcleanup-teardown
  - T-delete-done
cells:
  - instance/Update/GangSurgeTargetCleanup/pod.deleted[target]/boundary@T-gangcleanup-teardown
  - instance/Update/GangSurgeTargetCleanup/spec.teardown[deleted]/after@T-gangcleanup-teardown
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: the template changes again while the replacement is still incomplete, so the marker is claimed as a cleanup and its members are deleted
    events:
      - spec.revision: {image: registry.example.com/runtime:v3}
  - tick: 6
    note: the owner's deletion begins as the retired worker disappears, so the retiring marker and its source are both scale-down extras
    events:
      - spec.teardown[deleted]: {}
      - pod.deleted[target]: {pod: {index: 1, runner: worker}}
  - tick: 7
    note: the teardown is observed again, and the Deleting stamps are already in place
    events:
      - spec.teardown[deleted]: {}
  - tick: 8
    note: the source leaves rotation, which is the drain the source's delete waits on
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
  - tick: 9
    note: the remaining pods of both gangs are gone, so both rows are removed
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
      - pod.deleted[target]: {pod: {index: 1, runner: leader}}
