# The owner is deleted while an attempt is parked with its set down. A
# create refusal armed for a terminating namespace is consumed by nobody,
# since a parked attempt creates nothing; the teardown treats the parked
# row as a scale-down extra, and the teardown re-observed changes nothing
# on the wave.
scenario: parked-down-teardown
arrows:
  - T-ready-recreate
  - T-drain-deadline
  - T-failedparked-teardown
  - T-delete-done
cells:
  - instance/Failed/Parked/api.namespaceTerminating/before
  - instance/Failed/Parked/spec.teardown[deleted]/before
  - instance/Failed/Parked/spec.teardown[deleted]/after@T-failedparked-teardown
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 1h, maxDelay: 2h, multiplier: 2}
    scaleDownRequeueInterval: 30s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod template changes, so the roll drains the pod for a recreate
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the pod leaves rotation, so it is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 4
    note: the old pod is gone, so the rebuild lands at the new revision
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 5
    note: the deadline elapses on a rebuilt pod that never came up; the ladder counts the wave and the attempt is parked with the row Failed
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the namespace begins terminating and would refuse a create; a parked attempt creates nothing, so nothing consumes the refusal
    events:
      - api.namespaceTerminating: {}
  - tick: 7
    note: the owner's deletion begins, so the parked row becomes a scale-down extra and the wave stamps Deleting over the parked operation
    events:
      - spec.teardown[deleted]: {}
  - tick: 8
    note: the teardown is re-observed; the Delete stamp is committed once and the wave, which owns the row, deletes the unrouted pod
    events:
      - spec.teardown[deleted]: {}
  - tick: 9
    note: the pod is gone, so the row is removed
    events:
      - pod.deleted[source]: {pod: {index: 0}}
