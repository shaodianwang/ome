# A demoted Instance whose revision sits in Backoff, its leftover pod
# evicted as the block comes due. The row is no fresh start, so the Create
# pass asks the block only whether it is Held: a Backoff block, due or not,
# does not deny the recycle, which commits on the same pass and flips the
# block to RetryInProgress as any attempt at the revision does; a block
# already due changes nothing while the delete lands.
scenario: idle-pending-evicted-recycled-with-due-block
arrows:
  - T-pending-recycle-evicted
  - T-create-ready
cells:
  - instance/Pending/timer.retryAt/boundary@T-pending-recycle-evicted
  - instance/Pending/timer.retryAt/after@T-pending-recycle-evicted
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: None
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    updateRetry: {maxAttempts: 3, initialDelay: 2m, maxDelay: 10m, multiplier: 2}
  retryBlocks:
    - {revision: current, state: Backoff, attemptsStarted: 1, nextRetryAt: 2m, reason: ImagePullBackOff}
  rows:
    - {index: 0, phase: Pending, runningRevision: current}
  pods:
    - {index: 0, node: node-0}
timeline:
  - tick: 1
    note: the demoted row sits with its pod present while its revision's block sits in Backoff, so the Create pass creates nothing
  - tick: 2
    note: the block comes due as the pod is evicted; the row is no fresh start, so only a Held block could deny it, and the Create pass commits its attempt, which flips the block to RetryInProgress as any attempt at the revision does, and recycles the dead occupant
    events:
      - timer.retryAt: {slack: 1s}
      - pod.evicted: {pod: {index: 0}, message: "The node was low on resource: memory."}
  - tick: 3
    note: the block is still due as the evicted pod is gone; the attempt already committed recreates the pod
    events:
      - timer.retryAt: {slack: 1s}
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 4
    note: the recreated pod reports Ready and enters rotation, so the Instance promotes on its running revision
    events:
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
