# A Pending row's forming pod clears the promote bar as its revision's retry
# block comes due. A set that clears the bar is promoted without consulting
# any block.
scenario: idle-pending-retry-due-at-promote
arrows:
  - T-pending-promote
cells:
  - instance/Pending/timer.retryAt/boundary@T-pending-promote
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    updateRetry: {maxAttempts: 3, initialDelay: 2m, maxDelay: 10m, multiplier: 2}
  retryBlocks:
    - {revision: current, state: Backoff, attemptsStarted: 1, nextRetryAt: 2m, reason: ImagePullBackOff}
  rows:
    - {index: 0, phase: Pending, runningRevision: current}
  pods:
    - {index: 0, node: node-0}
timeline:
  - tick: 1
    note: the row is Pending on a forming pod while its revision sits in Backoff
  - tick: 2
    note: the pod reports Ready as the block comes due, and the row promotes with no operation stamped and no block consulted
    events:
      - pod.ready[source]: {pod: {index: 0}}
      - timer.retryAt: {slack: 1s}
