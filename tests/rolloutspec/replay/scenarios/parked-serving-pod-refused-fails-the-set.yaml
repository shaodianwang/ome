# A recreate attempt parked at Failed with its operation kept comes up and
# is gated serving, so the row reads as the roll in progress with the
# attempt still parked, and the serving pod is then refused by its node. A
# parked attempt's phase follows its set on every pass: the refused pod is
# phase Failed and serves nothing, so the row returns to Failed on the tick
# the refusal is observed, the attempt kept, and from there the fresh start
# that would rebuild it waits on the target's ladder.
scenario: parked-serving-pod-refused-fails-the-set
arrows:
  - T-ready-recreate
  - T-drain-deadline
  - T-failed-parked-serves
  - T-parked-refused
cells:
  - instance/Update/Parked/pod.admissionRejected[OutOfResource]/before
  - instance/Update/Parked/pod.admissionRejected[OutOfResource]/boundary@T-parked-refused
  - instance/Failed/Parked/pod.admissionRejected[OutOfResource]/before
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    updateRetry: {maxAttempts: 3, initialDelay: 1h, maxDelay: 2h, multiplier: 2}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod template changes, so the roll drains the pod for a recreate
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the pod leaves rotation, so it is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 4
    note: the old pod is gone, so the rebuild lands at the new revision
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 5
    note: the deadline elapses on a rebuilt pod that never came up; the ladder counts the wave and the attempt is parked with the row Failed
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the pod comes up and is gated serving, so the parked set serves in full and the row reads as the roll in progress with the attempt still parked
    events:
      - pod.containersReady[source]: {pod: {index: 0}}
      - pod.servingOn[source]: {pod: {index: 0}}
  - tick: 7
    note: the serving pod is bound and its node refuses it for lack of a resource; a refused pod is phase Failed and serves nothing, so the parked attempt's phase follows its set back to Failed on this tick with the attempt kept
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-1}
      - pod.admissionRejected[OutOfResource]: {pod: {index: 0}, resource: nvidia.com/gpu, message: "Node didn't have enough resource: nvidia.com/gpu, requested: 1, used: 8, capacity: 8"}
  - tick: 8
    note: the refusal is re-observed on the Failed row; a refused pod of a parked set changes nothing while the ladder runs, and no RetryBlock is charged for it
    events:
      - pod.admissionRejected[OutOfResource]: {pod: {index: 0}, resource: nvidia.com/gpu, message: "Node didn't have enough resource: nvidia.com/gpu, requested: 1, used: 8, capacity: 8"}
