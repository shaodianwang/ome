# A one-pod Instance is pushed to version 2. The new pod (the replacement)
# serves, the old pod (the source) is taken out of rotation to drain, and
# the replacement then crash-loops. The stuck-pod grace elapses, so the
# attempt is given up and counted on version 2's retry ladder, the count
# of failed attempts that paces the next one: the row is Failed with no
# attempt, and the source is still out of rotation under the drain's hold,
# the mark the drain put on it. The replacement is lost while the ladder
# waits, and the operator re-applies version 1. The source runs version 1,
# so the Create pass puts the Instance back into service: the hold is
# lifted, the source returns to rotation and the row is Ready on version
# 1. The ladder's entry goes with that, so its clock finds nothing to
# admit; no pod of the withdrawn version is created again.
scenario: surgedrain-replacement-lost-rollback
arrows:
  - T-ready-surge
  - T-surge-target-ready
  - T-surgedrain-stuckgrace
cells:
  - instance/Update/SurgeDrain/pod.waiting[CrashLoopBackOff]/before
  - instance/Failed/spec.revision/before
intentional: >-
  a source a given-up surge attempt left out of rotation at its drain
  step returns to rotation when the Instance is put back into service:
  the hold is lifted before the row reads Ready, and nothing is rebuilt
  at the withdrawn version
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 1m, maxDelay: 30m, multiplier: 2}
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement is serving and in rotation, so the step advances and the source's serving gate is flipped off
    events:
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 5
    note: the replacement crash-loops after serving; the grace runs from the regression and nothing is disposed yet
    events:
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 0, ordinal: 1}, message: "back-off 5m0s restarting failed container"}
  - tick: 6
    note: the grace elapses on the wedged replacement, so the attempt is disposed and counted on the pushed revision's ladder; the source stays out of rotation under the drain's hold
    events:
      - timer.stuckPodGrace: {slack: 1s}
  - tick: 7
    note: the replacement is lost while the ladder's backoff runs; the roll waits on the ladder and nothing is rebuilt
    events:
      - pod.deleted[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 8
    note: the operator re-applies the starting revision, which the source runs, so the Create pass puts the Instance back into service; the drain's hold is lifted, the source returns to rotation and the row is Ready on the starting revision
    events:
      - spec.revision: {image: registry.example.com/runtime:v1}
  - tick: 9
    note: a pass with nothing changed
  - tick: 10
    note: the clock passes the backoff the ladder had set
    events:
      - clock.advance: 5m
  - tick: 11
    note: a pass with nothing changed
