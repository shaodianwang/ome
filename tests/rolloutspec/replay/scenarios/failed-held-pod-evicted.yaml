# An Instance parked at Failed with no operation, its target Held and its
# bound pod evicted under node pressure. The eviction resolves into a
# terminal pod, which is where a repair or an abandon would pick it up;
# neither is in flight, and the fresh start the terminal pod would free the
# name for is held, so the row is untouched.
scenario: failed-held-pod-evicted
arrows:

cells:
  - instance/Failed/pod.evicted/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
  rows:
    - {index: 0, phase: Failed, runningRevision: current}
  pods:
    - {index: 0, node: node-0}
  retryBlocks:
    - {revision: current, state: Held, attemptsStarted: 1, reason: ImagePullBackOff}
timeline:
  - tick: 1
    note: the Instance is parked at Failed behind a Held target with its pod still present
  - tick: 2
    note: the pod is evicted under memory pressure; it resolves into a terminal pod, and the fresh start that would recycle it is held
    events:
      - pod.evicted: {pod: {index: 0}, message: "The node was low on resource: memory."}
  - tick: 3
    note: a further pass reads the same row and writes nothing
