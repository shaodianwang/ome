# The controller restarts on the pass a wedged replacement is read past the
# grace, and again once the row is Failed; the stuck evidence lives on the
# pod and the restart replays no part of the escalation.
scenario: surge-stuck-crash
arrows:
  - T-ready-surge
  - T-surge-stuck
cells:
  - instance/Update/Surge/ctrl.crash/boundary@T-surge-stuck
  - instance/Update/Surge/ctrl.crash/after@T-surge-stuck
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement is still booting two minutes on, which is longer than the grace but proves nothing on its own
    events:
      - clock.advance: 2m
  - tick: 5
    note: the pull wedges on a replacement already older than the grace as the controller restarts; the stamp lands on this pass
    events:
      - pod.waiting[ImagePullBackOff]: {pod: {index: 0, ordinal: 1}, message: "manifest unknown"}
      - ctrl.crash: {}
  - tick: 6
    note: the controller restarts again; the row is Failed with the reason on LastFailure and nothing is replayed
    events:
      - ctrl.crash: {}
