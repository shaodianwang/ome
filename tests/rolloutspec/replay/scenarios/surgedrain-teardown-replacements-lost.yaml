# The owner is deleted while two Instances drain: a replacement lost as
# the delete stamps, or the pass after, is not recreated, and the teardown
# re-observed changes nothing on the wave.
scenario: surgedrain-teardown-replacements-lost
arrows:
  - T-ready-surge
  - T-surge-target-ready
  - T-surgedrain-teardown
  - T-delete-done
cells:
  - instance/Update/SurgeDrain/pod.deleted[target]/boundary@T-surgedrain-teardown
  - instance/Update/SurgeDrain/pod.deleted[target]/after@T-surgedrain-teardown
  - instance/Update/SurgeDrain/spec.teardown[deleted]/after@T-surgedrain-teardown
initial:
  spec:
    replicas: 2
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
    - {index: 1, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the pod template changes, so both Instances surge a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 2
    note: both replacements are serving and in rotation, so both steps advance to the drain
    events:
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
      - pod.ready[target]: {pod: {index: 1, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 1, ordinal: 1}}
  - tick: 3
    note: the owner's deletion begins as the first Instance loses its replacement; both rows are stamped Deleting and nothing is recreated
    events:
      - spec.teardown[deleted]: {}
      - pod.deleted[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 4
    note: the second Instance loses its replacement and the teardown is re-observed; the wave owns both rows
    events:
      - pod.deleted[target]: {pod: {index: 1, ordinal: 1}}
      - spec.teardown[deleted]: {}
  - tick: 5
    note: both sources leave rotation, which is the drain the deletes wait on
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationOut[source]: {pod: {index: 1, ordinal: 0}}
  - tick: 6
    note: both sources are gone, so the rows are removed
    events:
      - pod.deleted[source]: {pod: {index: 0, ordinal: 0}}
      - pod.deleted[source]: {pod: {index: 1, ordinal: 0}}
