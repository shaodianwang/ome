# A Ready gang is widened as its template moves, under a restart policy that
# does not claim the row. The update pass runs ahead of the Create pass and
# rebuilds the gang at the new width and the target; the widening never claims it.
scenario: idle-ready-gang-width-with-revision-rolls
arrows:
  - T-ready-surge
  - T-empty-gang-surge-target
cells:
  - instance/Ready/spec.revision/boundary@T-ready-gangwidth-create
initial:
  spec:
    replicas: 1
    workers: 1
    restartPolicy: None
    topologyKey: topology.example.com/fabric-domain
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, runner: leader, ready: true, serving: true, routed: true, node: node-0}
    - {index: 0, runner: worker, ready: true, serving: true, node: node-1}
timeline:
  - tick: 1
    note: the Ready gang is steady on its two serving members
  - tick: 2
    note: the gang is widened by one worker as the template moves; the roll takes the row ahead of the Create pass and claims a replacement gang at the new width and the target
    events:
      - spec.gangWidth[grow]: {to: 2}
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the replacement gang's three members are created at the new revision while the source keeps serving
