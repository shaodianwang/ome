# The same wedge as drain-stuck, observed from the other side: the reason
# lands on the rebuilt pod while it is still younger than the grace, so the
# recreate keeps polling until the grace itself elapses.
scenario: drain-stuckgrace
arrows:
  - T-ready-recreate
  - T-drain-stuckgrace
cells:
  - instance/Update/Drain/timer.stuckPodGrace/before
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 5m
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the pod becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the pod template changes and the strategy rebuilds in place of surging
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the pod leaves rotation, so the rebuild may start
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 5
    note: the old pod is gone and Phase B rebuilds it at the bumped incarnation
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 6
    note: the rebuilt pod wedges on the target image while it is still younger than the grace, so the recreate keeps polling
    events:
      - pod.waiting[ImagePullBackOff]: {pod: {index: 0}, message: "manifest unknown"}
  - tick: 7
    note: the grace elapses on the wedged pod and the escalation ends the roll
    events:
      - timer.stuckPodGrace: {slack: 1s}
