# The replacement wedges on its image while the source keeps serving. The
# escalation measures the wedge from the start of the pod's waiting episode -
# its creation, as the replacement never served - so the reason lands on a
# replacement already older than the stuck-pod grace and the attempt is
# disposed on the pass that first reads it.
scenario: surge-stuck
arrows:
  - T-ready-surge
  - T-surge-stuck
cells:
  - instance/Update/Surge/pod.waiting[ImagePullBackOff]/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement is still booting two minutes on, which is longer than the grace but proves nothing on its own
    events:
      - clock.advance: 2m
  - tick: 5
    note: the pull wedges on a replacement already older than the grace, so the escalation disposes the surge on the pass that reads the reason
    events:
      - pod.waiting[ImagePullBackOff]: {pod: {index: 0, ordinal: 1}, message: "manifest unknown"}
