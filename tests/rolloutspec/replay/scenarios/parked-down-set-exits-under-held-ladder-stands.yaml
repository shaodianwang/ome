# A recreate attempt parked at Failed with its operation kept, its rebuilt
# pod never having come up, on a ladder that allowed one attempt: the
# target is Held, so the roll may not take the row. The parked pod then
# exits with phase Failed. The dead pod changes nothing: the roll is held
# off the row, and the Create pass's fresh start would pin the same held
# target, so it neither recycles the dead occupant nor rebuilds the index,
# and the row stays Failed with the attempt kept until an operator releases
# the hold or publishes a corrective revision.
scenario: parked-down-set-exits-under-held-ladder-stands
arrows:
  - T-ready-recreate
  - T-drain-deadline
cells:
  - instance/Failed/Parked/pod.phaseTerminal[Failed]/before
  - instance/Failed/Parked/gate.deny[Held]/before
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 1, initialDelay: 1h, maxDelay: 2h, multiplier: 2}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod template changes, so the roll drains the pod for a recreate
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the pod leaves rotation, so it is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 4
    note: the old pod is gone, so the rebuild lands at the new revision
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 5
    note: the deadline elapses on a rebuilt pod that never came up; the ladder's one attempt is spent, so the target is Held and the attempt is parked with the row Failed
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the parked pod exits with phase Failed; the roll is held off the row and the Create pass's fresh start would pin the held target, so the dead occupant stands and nothing is written
    events:
      - pod.phaseTerminal[Failed]: {pod: {index: 0}}
  - tick: 7
    note: the terminal phase is re-observed; the hold still answers and the dead occupant stands
    events:
      - pod.phaseTerminal[Failed]: {pod: {index: 0}}
  - tick: 8
    note: the dead pod is gone; the row has no pod and no admitted revision to rebuild on, so it stays Failed with the attempt kept and the hold reported
    events:
      - pod.deleted[source]: {pod: {index: 0}}
