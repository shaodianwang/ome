# A source taken out of the per-revision routed Service by something
# outside the rollout, while the surge step is still waiting for its
# replacement. The serving gate is untouched, so only the endpoint view
# can see it: the Instance is covering none of its capacity, and the
# operation says so with a SourceUnrouted token until the source is
# routed again.
scenario: source-unrouted-midsurge
arrows:
  - T-ready-surge
cells:
  - instance/Update/Surge/endpoint.rotationOut[source]/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the pod template changes, so the rollout surges a replacement beside the source
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 2
    note: the source loses its routed endpoint while its serving gate still reads True
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 3
    note: the source is still out of rotation, and the report is not written twice
  - tick: 4
    note: the source is routed again, so the report is released by the authority that set it
    events:
      - endpoint.rotationIn[source]: {pod: {index: 0}}
