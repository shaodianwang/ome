# Spec and config edits against a migration surge row left Creating with
# no operation: an edit outside the revision hash, a strategy edit, a
# partition, a readiness timeout, a rollback onto the running revision and
# a re-tuned scale-down cadence write nothing to a row below Ready that
# nobody drives; the wave reaps the unplanned index.
scenario: idle-creating-spec-edits
arrows:
  - T-ready-migrate
  - T-empty-migrate-target
  - T-migrate-deadline-restore
  - T-migratetarget-expired
  - T-creating-reap
  - T-delete-done
cells:
  - instance/Creating/spec.annotationOnly/before
  - instance/Creating/spec.strategy/before
  - instance/Creating/spec.partition/before
  - instance/Creating/spec.policyTuning[instanceReadyTimeout]/before
  - instance/Creating/spec.rollbackTarget[set]/before
  - instance/Creating/config.changed[scaleDownInterval]/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    migrationMode: Auto
    instanceReadyTimeout: 30m
    podLabels: {kueue.x-k8s.io/queue-name: queue-a}
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
timeline:
  - tick: 1
    note: the index is planned and no row exists, so the Create pass opens the attempt
  - tick: 2
    note: the pod is bound, becomes Ready and enters rotation, so the row records a running revision on a known node
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-0}
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the operator asks the Instance off node-0, and the migrate pass admits the request and establishes the pair
    events:
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
  - tick: 4
    note: the surge pod is bound and comes up on its node while the migration waits on its promote
    events:
      - pod.scheduled[target]: {pod: {index: 1}, message: node-1}
      - pod.containersReady[target]: {pod: {index: 1}}
  - tick: 5
    note: the record's deadline elapses with the source healthy, so expiry restores the source and unpins the surge, whose row is left Creating with no operation beyond the desired set
    events:
      - timer.migrationDeadline: {slack: 1s}
  - tick: 6
    note: the queue label, the strategy, the partition, the readiness timeout, a rollback pin onto the running revision and the scale-down cadence all change; none is read by a row with no operation, and the wave reaps the unplanned index
    events:
      - spec.annotationOnly: {labels: {kueue.x-k8s.io/queue-name: queue-b}}
      - spec.strategy: {strategy: RecreatePod}
      - spec.partition: {to: 1}
      - spec.policyTuning[instanceReadyTimeout]: {value: 10m}
      - spec.rollbackTarget[set]: {image: registry.example.com/runtime:v1}
      - config.changed[scaleDownInterval]: {config: {scaleDownRequeueInterval: 1m}}
  - tick: 7
    note: the wave owns the row and deletes the leftover pod
  - tick: 8
    note: the leftover pod is gone, so the row is removed
    events:
      - pod.deleted[source]: {pod: {index: 1}}
