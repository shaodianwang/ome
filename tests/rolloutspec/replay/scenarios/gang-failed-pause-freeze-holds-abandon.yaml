# A frozen pause lands on a gang surge pair that has just failed on its
# deadline. The abandon is a continuation of the kept Update, and a frozen
# pause suspends the update pass outright, so the abandon halts with the
# replacement's pods still owned by the marker; the unpause only un-parks
# the passes, and the continuation is re-driven on the pass that follows.
scenario: gang-failed-pause-freeze-holds-abandon
arrows:
  - T-empty-gang-surge-target
  - T-gangtarget-deadline
  - T-failedgangtarget-cleanup-failed
  - T-failedgangsurge-reset
cells:
  - instance/Failed/GangSurge/spec.pauseFreeze/before
  - instance/Failed/GangSurge/spec.unpause/before
  - instance/Failed/GangSurgeTarget/spec.pauseFreeze/before
  - instance/Failed/GangSurgeTarget/spec.unpause/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: the replacement is still not Ready when the deadline elapses, so both halves of the pair are stamped Failed with their operations preserved
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: a frozen pause lands before the abandon runs; the update pass is suspended, so the marker keeps its claim and its pods and nothing is deleted
    events:
      - spec.pauseFreeze: {}
  - tick: 7
    note: a further pass under the freeze changes nothing; the pair stays as it failed
  - tick: 8
    note: the pause is cleared, which only un-parks the passes; the abandon is re-driven on the pass that follows, claims the cleanup marker and deletes the replacement
    events:
      - spec.unpause: {}
  - tick: 9
    note: the retired replacement's members are gone, so the marker row is removed and the source is reset Ready on its running revision
    events:
      - pod.deleted[target]: {pod: {index: 1, runner: leader}}
      - pod.deleted[target]: {pod: {index: 1, runner: worker}}
