# A single-pod repair parks at Failed with its operation kept when the
# rebuilt pod crash-loops past the grace; the wedged pod is then deleted by
# another hand and its kubelet never finishes the deletion. Under a
# force-delete policy the Component sweep, which runs ahead of the verb
# passes, frees the name at the overdue clock with node-gone evidence, and
# the same pass reads the set as gone: the restart pass closes the spent
# repair and the Create pass rebuilds the row as a fresh start.
scenario: restart-parked-repair-stuck-pod-swept-rebuilds
arrows:
  - T-ready-restart
  - T-restart-stuck
  - T-failedrepair-close
  - T-create-ready
cells:
  - instance/Failed/Repair/timer.forceDelete[overdueSlack]/before
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    forceDelete: {overdueSlack: 1m, nodeUnreachableThreshold: 5m}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the rebuilt pod crash-loops and is older than the grace when the wedge is read, so the row fails with its operation preserved
    events:
      - clock.advance: 2m
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 0}, message: "back-off restarting failed container"}
  - tick: 4
    note: the wedged pod is bound and then deleted by another hand; a pod on its way out is live until it is gone, so the close waits
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-1}
      - pod.terminating[source]: {pod: {index: 0}}
  - tick: 5
    note: the pod's kubelet stops acknowledging the deletion, so the object stays behind with no finalizer on it
    events:
      - pod.stuckTerminating: {pod: {index: 0}}
  - tick: 6
    note: the overdue clock lands on a pod whose node is gone, so the sweep force-deletes it ahead of the verb passes; the restart pass reads no live pod left and closes the spent repair, and the Create pass rebuilds the row as a fresh start in the same pass
    events:
      - timer.forceDelete[overdueSlack]: {slack: 1s}
  - tick: 7
    note: the fresh start's pod reports Ready and enters rotation, so the Instance promotes on its running revision
    events:
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
