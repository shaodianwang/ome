# An Instance rebuilt at a new revision is pinned back to the old one as its
# pod is deleted, in one observation. The recreate was about to delete that
# incarnation anyway, so the loss is folded into its drain step.
scenario: idle-ready-rollback-recreate-with-loss
arrows:
  - T-ready-recreate
  - T-drain-ready
  - T-ready-rollback-recreate
cells:
  - instance/Ready/pod.deleted[source]/boundary@T-ready-rollback-recreate
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true, node: node-0}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the template moves to v2 and the strategy rebuilds in place of surging
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the pod leaves rotation, so the rebuild may start
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 4
    note: the old pod is gone and Phase B rebuilds it at the bumped incarnation
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 5
    note: the rebuilt pod becomes Ready and enters rotation, so the Instance is Ready on v2
    events:
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 6
    note: the roll is pinned back to v1 as the v2 pod is deleted; the recreate the pin starts was about to delete it anyway, and the loss is folded into its drain
    events:
      - spec.rollbackTarget[set]: {image: registry.example.com/runtime:v1}
      - pod.deleted[source]: {pod: {index: 0}}
