# The same leftover wedge as pending-stuck, observed from the other side:
# the waiting reason lands on a pod too young to be stuck, so the row keeps
# forming until the grace itself elapses. timer.stuckPodGrace resolves the
# deadline from the start of the pod's waiting episode and the configured grace.
scenario: pending-stuckgrace
arrows:
  - T-pending-stuckgrace
cells:
  - instance/Pending/timer.stuckPodGrace/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v2
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 5m
  rows:
    - {index: 0, phase: Pending, runningRevision: current}
  pods:
    - {index: 0, node: node-0, previousImage: registry.example.com/runtime:v1}
timeline:
  - tick: 1
    note: the row is forming on a pod the Component's current revision no longer claims
  - tick: 2
    note: the pull wedges immediately, but the pod is younger than the grace, so nothing escalates
    events:
      - pod.waiting[ImagePullBackOff]: {pod: {index: 0}, message: "manifest unknown"}
  - tick: 3
    note: the grace elapses on the leftover pod and the row is stamped Failed
    events:
      - timer.stuckPodGrace: {slack: 1s}
