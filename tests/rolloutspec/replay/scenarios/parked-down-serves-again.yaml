# A parked attempt whose single pod finally comes up and is gated serving:
# the set serves in full, so the row reads as the roll in progress with the
# attempt still parked. The readiness and the gate re-observed change
# nothing; the reading is taken once per pass.
scenario: parked-down-serves-again
arrows:
  - T-ready-recreate
  - T-drain-deadline
  - T-failedparked-serves
cells:
  - instance/Failed/Parked/pod.containersReady[source]/boundary@T-failedparked-serves
  - instance/Failed/Parked/pod.servingOn[source]/boundary@T-failedparked-serves
  - instance/Failed/Parked/pod.containersReady[source]/after@T-failedparked-serves
  - instance/Failed/Parked/pod.servingOn[source]/after@T-failedparked-serves
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 1h, maxDelay: 2h, multiplier: 2}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod template changes, so the roll drains the pod for a recreate
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the pod leaves rotation, so it is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 4
    note: the old pod is gone, so the rebuild lands at the new revision
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 5
    note: the deadline elapses on a rebuilt pod that never came up; the ladder counts the wave and the attempt is parked with the row Failed
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the pod comes up and is gated serving, so the parked set serves in full and the row reads as the roll in progress with the attempt still parked
    events:
      - pod.containersReady[source]: {pod: {index: 0}}
      - pod.servingOn[source]: {pod: {index: 0}}
  - tick: 7
    note: the readiness and the gate are re-observed; the row is Update/Parked and the reading is unchanged
    events:
      - pod.containersReady[source]: {pod: {index: 0}}
      - pod.servingOn[source]: {pod: {index: 0}}
