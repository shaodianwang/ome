# A corrective revision arrives on a gang whose Create attempt the gang
# verdict ended with its Create operation kept. The superseded-attempt
# retirement reads only a Creating row, so the kept Create is not retired;
# the update trigger reads the pin instead and rolls the row toward the
# other revision. A never-promoted row has no source for a surge to keep,
# so under SurgeThenDrain too the roll is a recreate in place at the
# corrective revision, the kept Create replaced and no gang surge opened
# beside the failed gang; the name is still foreign, so the verdict ends the
# new attempt the same way, once.
scenario: create-failed-corrective-surge
cells:
  - instance/Failed/Create/spec.revision/before
  - instance/Failed/Create/spec.revision/after@T-failedcreate-corrective
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    containerName: ome-container
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: the group's controller reference is rewritten to another owner; the gang verdict ends the attempt, Failed with its Create operation kept
    events:
      - gang.podGroup[OwnershipConflict]: {instance: 0}
  - tick: 3
    note: the pod template changes; the roll re-enters the row as a recreate at the corrective revision, the incarnation bumped, the kept Create replaced and the ended attempt's members deleted
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the edit was consumed once; the name is still foreign, so the verdict ends the new attempt, Failed with its recreate kept, and warns once
