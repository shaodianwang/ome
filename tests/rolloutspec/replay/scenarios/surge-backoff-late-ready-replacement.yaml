# A single-pod surge wedges and the stuck-pod grace puts the revision in
# Backoff with the wedged replacement still standing beside the serving
# source. The registry comes back and the replacement reports runtime-ready
# before the block is due: that rescues nothing, the row stays Failed and
# the replacement unrouted. The block coming due is what re-opens the surge,
# which finds its replacement already runtime-ready.
scenario: surge-backoff-late-ready-replacement
arrows:
  - T-ready-surge
  - T-surge-stuckgrace
  - T-failed-retry-surge
cells:
  - instance/Failed/pod.containersReady[target]/before
  - instance/Update/Surge/pod.ready[target]/after@T-surge-stuckgrace
  - instance/Failed/timer.retryAt/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 2m, maxDelay: 10m, multiplier: 2}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true, node: node-0}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the pull wedges immediately, but the replacement is younger than the grace, so the surge keeps polling
    events:
      - pod.waiting[ImagePullBackOff]: {pod: {index: 0, ordinal: 1}, message: "manifest unknown"}
  - tick: 4
    note: the grace elapses on the wedged replacement; the surge is disposed, the revision goes into Backoff and the replacement is left standing beside the source
    events:
      - timer.stuckPodGrace: {slack: 1s}
  - tick: 5
    note: the registry has the tag again and the replacement reports runtime-ready, then Ready; neither un-fails the row, nothing marks the replacement serving, and the source alone serves
    events:
      - pod.containersReady[target]: {pod: {index: 0, ordinal: 1}}
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 6
    note: the block comes due, so the roll re-opens the surge from Failed through the gate; the replacement it finds is already runtime-ready
    events:
      - timer.retryAt: {slack: 1s}
  - tick: 7
    note: a further pass carries the re-opened surge on
