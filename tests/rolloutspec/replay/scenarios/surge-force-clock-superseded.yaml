# The force-delete sweep clears a source wedged on a dead node on the pass
# the template moves again; the sweep leaves the operation and its pin
# untouched, so the surge machine decides the superseded target afterwards.
scenario: surge-force-clock-superseded
arrows:
  - T-ready-surge
  - T-surge-force-clock
  - T-surge-abandon-superseded
cells:
  - instance/Update/Surge/spec.revision/boundary@T-surge-force-clock
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    forceDelete: {overdueSlack: 1m, nodeUnreachableThreshold: 5m}
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source is bound to node-0, becomes Ready and enters rotation
    events:
      - pod.scheduled[source]: {pod: {index: 0, ordinal: 0}}
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: node-0 goes away under the source and its kubelet never confirms the deletion, so the source is left Terminating with nothing holding it
    events:
      - pod.terminating: {pod: {index: 0, ordinal: 0}}
      - pod.stuckTerminating: {pod: {index: 0, ordinal: 0}}
  - tick: 5
    note: the overdue clock lands as the template moves again; the sweep force-deletes the source and the surge machine then abandons the superseded, not yet runtime-ready replacement
    events:
      - timer.forceDelete[overdueSlack]: {slack: 1s}
      - spec.revision: {image: registry.example.com/runtime:v3}
  - tick: 6
    note: the abandoned replacement is gone
    events:
      - pod.deleted[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 7
    note: a further pass settles the row toward the newest target
