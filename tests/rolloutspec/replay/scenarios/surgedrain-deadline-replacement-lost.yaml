# The replacement is lost on the pass the operation deadline elapses, and
# the recreated one on the next: the set is not serving, so the stamp lands
# over the recreate, and from Failed the lost pod is nobody's attempt.
scenario: surgedrain-deadline-replacement-lost
arrows:
  - T-ready-surge
  - T-surge-target-ready
  - T-surgedrain-deadline
cells:
  - instance/Update/SurgeDrain/pod.deleted[target]/boundary@T-surgedrain-deadline
  - instance/Update/SurgeDrain/timer.operationDeadline/boundary@T-surgedrain-deadline
  - instance/Update/SurgeDrain/pod.deleted[target]/after@T-surgedrain-deadline
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement is serving and in rotation, so the step advances and the source's serving gate is flipped off
    events:
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 5
    note: the source stays published, so the drain does not converge
  - tick: 6
    note: the replacement is lost as the deadline elapses twice over; the pass recreates it and the escalation then disposes the attempt once
    events:
      - pod.deleted[target]: {pod: {index: 0, ordinal: 1}}
      - timer.operationDeadline: {slack: 1s}
      - timer.operationDeadline: {slack: 1s}
  - tick: 7
    note: the recreated replacement is lost too; the row is Failed with no operation, so the loss is owned from there
    events:
      - pod.deleted[target]: {pod: {index: 0, ordinal: 1}}
