# A repair parked at Failed whose wedged pod is refused by its node once it
# is bound. A rejection is phase Failed, so the set reads as having no live
# pod left and the restart pass closes the spent operation; the refusal
# re-observed is the Failed row's, whose recycle frees the name with the
# kubelet's reason on LastFailure and rebuilds the index.
scenario: restart-parked-repair-admission-rejected-closes
arrows:
  - T-ready-restart
  - T-restart-stuck
  - T-failedrepair-close-terminal
  - T-failed-recycle-rebuild
cells:
  - instance/Failed/Repair/pod.admissionRejected[OutOfResource]/before
  - instance/Failed/Repair/pod.admissionRejected[OutOfResource]/boundary@T-failedrepair-close-terminal
  - instance/Failed/Repair/pod.admissionRejected[OutOfResource]/after@T-failedrepair-close-terminal
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the rebuilt pod crash-loops and is older than the grace when the wedge is read, so the row fails with its operation preserved
    events:
      - clock.advance: 2m
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 0}, message: "back-off restarting failed container"}
  - tick: 4
    note: the wedged pod is bound and its node refuses it for lack of a resource; the refused pod is the whole set, so the restart pass closes the spent operation
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-1}
      - pod.admissionRejected[OutOfResource]: {pod: {index: 0}, resource: nvidia.com/gpu, message: "Node didn't have enough resource: nvidia.com/gpu, requested: 1, used: 8, capacity: 8"}
  - tick: 5
    note: the refusal is re-observed on a Failed row with no operation, so its recycle frees the name with the kubelet's reason on LastFailure
    events:
      - pod.admissionRejected[OutOfResource]: {pod: {index: 0}, resource: nvidia.com/gpu, message: "Node didn't have enough resource: nvidia.com/gpu, requested: 1, used: 8, capacity: 8"}
  - tick: 6
    note: the refused pod is gone, so the fresh start rebuilds the index
    events:
      - pod.deleted[source]: {pod: {index: 0}}
