# Three Instances drain when the replica count drops to one: a retired
# index's replacement lost as the delete stamps, or the pass after, is not
# recreated, and the count re-applied changes nothing on the wave.
scenario: surgedrain-scaledown-replacements-lost
arrows:
  - T-ready-surge
  - T-surge-target-ready
  - T-surgedrain-scaledown
  - T-delete-done
cells:
  - instance/Update/SurgeDrain/pod.deleted[target]/boundary@T-surgedrain-scaledown
  - instance/Update/SurgeDrain/pod.deleted[target]/after@T-surgedrain-scaledown
  - instance/Update/SurgeDrain/spec.replicasDown/after@T-surgedrain-scaledown
initial:
  spec:
    replicas: 3
    strategy: SurgeThenDrain
    maxSurge: "3"
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 2, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
    - {index: 1, ready: true, serving: true, routed: true}
    - {index: 2, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the pod template changes, so every Instance surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 2
    note: every replacement is serving and in rotation, so every step advances to the drain
    events:
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
      - pod.ready[target]: {pod: {index: 1, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 1, ordinal: 1}}
      - pod.ready[target]: {pod: {index: 2, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 2, ordinal: 1}}
  - tick: 3
    note: the replica count drops to one as the first retired index loses its replacement; both retired indices are stamped Deleting and nothing is recreated
    events:
      - spec.replicasDown: {to: 1}
      - pod.deleted[target]: {pod: {index: 1, ordinal: 1}}
  - tick: 4
    note: the second retired index loses its replacement and the same count is re-applied; the wave owns both rows and a missing pod only brings it closer to done
    events:
      - pod.deleted[target]: {pod: {index: 2, ordinal: 1}}
      - spec.replicasDown: {to: 1}
  - tick: 5
    note: both retired sources leave rotation, which is the drain the deletes wait on
    events:
      - endpoint.rotationOut[source]: {pod: {index: 1, ordinal: 0}}
      - endpoint.rotationOut[source]: {pod: {index: 2, ordinal: 0}}
  - tick: 6
    note: both retired sources are gone, so their rows are removed
    events:
      - pod.deleted[source]: {pod: {index: 1, ordinal: 0}}
      - pod.deleted[source]: {pod: {index: 2, ordinal: 0}}
