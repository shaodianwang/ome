# The Restart's deadline keeps elapsing on the tick after it stamped the row
# Failed. The escalation pass skips an already-Failed row, so the stamp and its
# warning fire once.
scenario: restart-deadline-repeats-nothing
arrows:
  - T-ready-restart
  - T-restart-deadline
cells:
  - instance/Restart/Drain/timer.operationDeadline/after@T-restart-deadline
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the rebuilt pod reports no readiness until the attempt deadline elapses, and the row fails with its operation preserved
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 4
    note: the deadline is still behind the clock, and the Failed row is stamped nothing further
    events:
      - timer.operationDeadline: {slack: 2s}
