# An in-place patch lands and the pod never passes its probes again; at the
# deadline the ladder counts the wave and parks the attempt with the row
# Failed and the patched pod kept. The pod then comes up on the patched
# image and is gated serving, so the parked set serves in full and the row
# reads as the roll in progress with the attempt still parked. A corrective
# revision then lands: it is a different ladder subject and only the image
# changed, so a fresh in-place attempt at the corrective revision replaces
# the parked one.
scenario: parked-serving-corrective-inplace
arrows:
  - T-ready-inplace
  - T-inplace-deadline
  - T-failedparked-serves
  - T-parked-corrective-inplace
cells:
  - instance/Update/Parked/spec.revision/boundary@T-parked-corrective-inplace
  - instance/Update/Parked/spec.revision/after@T-parked-corrective-inplace
initial:
  spec:
    replicas: 1
    strategy: InPlaceIfPossible
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 1h, maxDelay: 2h, multiplier: 2}
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the pod is bound, becomes Ready and enters rotation
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-0}
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: only the image changed, so the update is eligible to run in place
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the pod leaves rotation and its gate reads False, which the pass already drove, so the drain check passes and the transition marker is written
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
      - pod.servingOff[source]: {pod: {index: 0}}
  - tick: 5
    note: the image patch lands while the source is out of rotation
  - tick: 6
    note: the patched pod's containers drop readiness and stay down, which holds the promote
    events:
      - pod.containersNotReady[source]: {pod: {index: 0}}
  - tick: 7
    note: the operation deadline elapses on a patched pod that never came back; the ladder counts the wave and the in-place attempt is parked with the row Failed, the pod kept
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 8
    note: the patched pod comes up and is gated serving, so the parked set serves in full and the row reads as the roll in progress with the attempt still parked
    events:
      - pod.containersReady[source]: {pod: {index: 0}}
      - pod.servingOn[source]: {pod: {index: 0}}
  - tick: 9
    note: a corrective revision lands; it is a different ladder subject and only the image changed, so a fresh in-place attempt at the corrective revision replaces the parked one and drains the serving pod for the patch
    events:
      - spec.revision: {image: registry.example.com/runtime:v3}
  - tick: 10
    note: the template moves again; the row is the fresh attempt's now and the parked machinery reads nothing
    events:
      - spec.revision: {image: registry.example.com/runtime:v4}
