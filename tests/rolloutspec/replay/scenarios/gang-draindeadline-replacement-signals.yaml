# A gang source fails on its deadline at the drain step with a replacement
# member short of readiness. Signals land on both gangs while the
# continuation waits: an unplaceable replacement member records no hold on
# a row nobody owns, a wedged member past the grace produces no second
# stamp, a minReadySeconds window no longer applies past the Surge step, a
# scale-up adds a fresh index beside the pair, and a dead or evicted source
# member is deleted with the rest of the drain.
scenario: gang-draindeadline-replacement-signals
arrows:
  - T-empty-gang-surge-target
  - T-gangtarget-ready
  - T-surgedrain-deadline
  - T-failedgangtarget-ready
  - T-failedgangsurgedrain-complete
cells:
  - instance/Failed/GangSurgeDrain/pod.unschedulable[target]/before
  - instance/Failed/GangSurgeDrain/pod.waiting[ImagePullBackOff]/before
  - instance/Failed/GangSurgeDrain/timer.stuckPodGrace/before
  - instance/Failed/GangSurgeDrain/timer.minReady/before
  - instance/Failed/GangSurgeDrain/spec.replicasUp/before
  - instance/Failed/GangSurgeDrain/pod.phaseTerminal[Failed]/before
  - instance/Failed/GangSurgeDrain/pod.evicted/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.scheduled[source]: {pod: {index: 0, runner: leader}, message: node-0}
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: both replacement members report Ready and the leader enters rotation, so the source advances to the drain and leaves the serving gate
    events:
      - pod.ready[target]: {pod: {index: 1, runner: leader}}
      - pod.ready[target]: {pod: {index: 1, runner: worker}}
      - endpoint.rotationIn[target]: {pod: {index: 1, runner: leader}}
  - tick: 6
    note: the replacement worker's readiness regresses while the source is still published, so the pair is no longer fully serving
    events:
      - pod.containersNotReady[target]: {pod: {index: 1, runner: worker}}
  - tick: 7
    note: the deadline elapses with the replacement short, so the source is stamped Failed at its drain step and the marker Failed too, both operations kept
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 8
    note: the short replacement worker reports Unschedulable and then wedges on its image as a minReadySeconds window is set and the operator asks for a second Instance; a row nobody owns records no hold, the fresh index is created beside the pair, and the window is read by nothing past the Surge step
    events:
      - pod.unschedulable[target]: {pod: {index: 1, runner: worker}}
      - pod.waiting[ImagePullBackOff]: {pod: {index: 1, runner: worker}, message: "manifest unknown"}
      - spec.policyTuning[minReadySeconds]: {value: "60"}
      - spec.replicasUp: {to: 2}
  - tick: 9
    note: the grace elapses on the wedged member and the window passes; both rows are already Failed, so neither clock produces a stamp
    events:
      - timer.stuckPodGrace: {slack: 1s}
      - clock.advance: 1m1s
  - tick: 10
    note: a tick with nothing changed finds the replacement still short and waits
  - tick: 11
    note: the source leader is evicted under node pressure and the source worker exits with a terminal phase; the drain will delete both with the rest of the source, and the replacement worker comes back Ready, so the gang is whole again
    events:
      - pod.evicted: {pod: {index: 0, runner: leader}, message: "The node was low on resource: memory"}
      - pod.phaseTerminal[Failed]: {pod: {index: 0, runner: worker}}
      - pod.containersReady[target]: {pod: {index: 1, runner: worker}}
      - pod.ready[target]: {pod: {index: 1, runner: worker}}
  - tick: 12
    note: the source leader leaves the routed Service, so the drain has converged and both terminal source pods are deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
  - tick: 13
    note: the source pods are gone, so the replacement is promoted Ready on the pinned revision and the source row is removed
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
