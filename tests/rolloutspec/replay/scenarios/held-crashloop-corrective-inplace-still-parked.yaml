# The same held crash loop and corrective push as
# held-crashloop-corrective-inplace, but the pod is still parked a full
# grace after the corrective attempt opened: the fixed image crashes the
# same way, or the kubelet never rolled the container. The attempt is
# then disposed on the pod's own wedge and the wave counts on the fix's
# ladder, so the grace the attempt is given weakens no ladder.
scenario: held-crashloop-corrective-inplace-still-parked
arrows:
  - T-ready-inplace
  - T-inplace-stuck
  - T-failed-retry-inplace
  - T-failed-corrective-inplace
cells:
  - instance/Failed/timer.retryAt/before
  - instance/Failed/spec.revision/before
  - instance/Update/InPlace/pod.waiting[CrashLoopBackOff]/before
intentional: >-
  a pod still parked in a crash loop one grace after the corrective
  attempt opened is that attempt's own wedge, whatever container the
  kubelet is running, and counts on the fix's ladder
initial:
  spec:
    replicas: 4
    strategy: InPlaceIfPossible
    maxUnavailable: "1"
    restartPolicy: None
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 2m, maxDelay: 10m, multiplier: 2}
timeline:
  - tick: 1
    note: cold start materializes four Instances on the starting revision
  - tick: 2
    note: every pod becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
      - pod.ready[source]: {pod: {index: 1}}
      - endpoint.rotationIn[source]: {pod: {index: 1}}
      - pod.ready[source]: {pod: {index: 2}}
      - endpoint.rotationIn[source]: {pod: {index: 2}}
      - pod.ready[source]: {pod: {index: 3}}
      - endpoint.rotationIn[source]: {pod: {index: 3}}
  - tick: 3
    note: a revision that crashes at start is pushed; only the image changed, so the budget admits the first Instance in place and holds the other three
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the first pod leaves rotation and two minutes pass, which is longer than the grace
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
      - clock.advance: 2m
  - tick: 5
    note: the image patch lands and the revision label is restamped
  - tick: 6
    note: the new image crashes on every start, so the pod parks in CrashLoopBackOff on the pushed revision
    events:
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 0}, message: "back-off restarting failed container"}
  - tick: 7
    note: the crash loop has held past the grace, so the attempt is disposed and the first wave counts on the revision's ladder
    events:
      - timer.stuckPodGrace: {slack: 1s}
  - tick: 8
    note: the block comes due and the roll re-drives the first Instance in place at the same target
    events:
      - timer.retryAt: {slack: 1s}
  - tick: 9
    note: the pod is still crash-looping, so the second wave is disposed and the block backs off again
    events:
      - clock.advance: 5m
  - tick: 10
    note: the block comes due again and the roll re-drives the first Instance once more
    events:
      - timer.retryAt: {slack: 1s}
  - tick: 11
    note: the third wave is disposed on the same crash loop and the bound Holds the revision while three Instances keep serving
    events:
      - clock.advance: 5m
  - tick: 12
    note: nothing re-drives a Held revision
    events:
      - clock.advance: 1m
  - tick: 13
    note: the operator pushes a fixed image; the Failed Instance re-enters in place toward it and the held block of the crashing revision is removed
    events:
      - spec.revision: {image: registry.example.com/runtime:v3}
  - tick: 14
    note: the image patch lands and the revision label is restamped before the kubelet has acted on the patch
  - tick: 15
    note: half a minute into the attempt the pod still shows the replaced container's crash loop, inside the attempt's grace, so nothing is charged
    events:
      - clock.advance: 30s
  - tick: 16
    note: a grace after the attempt opened the pod is still parked, so the attempt is disposed on its own wedge and the first wave counts on the fix's ladder
    events:
      - clock.advance: 1m
  - tick: 17
    note: the fix's block comes due and the roll re-drives the Instance in place at the fix
    events:
      - timer.retryAt: {slack: 1s}
