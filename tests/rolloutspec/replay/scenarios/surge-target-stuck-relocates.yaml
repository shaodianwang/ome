# A single-pod surge whose replacement wedges on a node other than the
# source's. No stuck-pod grace is configured, so the fast escalator is off
# and the operation deadline is what ends the attempt. The source keeps
# serving on node-0; the disposition reads the suspect node off the
# replacement alone and records a relocation directive against node-1 —
# the source it shares the Instance index with neither names the node nor,
# by sitting on a second one, turns the reading empty.
scenario: surge-target-stuck-relocates
arrows:
  - T-ready-surge
  - T-surge-deadline
cells:
  - instance/Update/Surge/timer.operationDeadline/before
  - instance/Update/Surge/pod.waiting[CrashLoopBackOff]/before
intentional: >-
  the relocation directive names the replacement's node; the serving
  source shares the Instance index but not the attempt, so its node is
  neither blamed nor a veto on the reading
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
    migrationMode: Auto
  config:
    requeueOperation: 5s
    requeueGate: 3s
    autoMigrateBudget: 3
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source is bound to node-0, becomes Ready and enters rotation
    events:
      - pod.scheduled[source]: {pod: {index: 0, ordinal: 0}, message: node-0}
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement is bound to node-1 and wedges there; with no stuck-pod grace configured nothing escalates yet
    events:
      - pod.scheduled[target]: {pod: {index: 0, ordinal: 1}, message: node-1}
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 0, ordinal: 1}, message: "back-off restarting failed container"}
  - tick: 5
    note: the operation deadline elapses; the attempt is disposed with a relocation directive against node-1, the replacement's node, while the source keeps serving on node-0
    events:
      - timer.operationDeadline: {slack: 1s}
