# The surge wedges on its image. The migration fails EARLY and through the
# record rather than by stamping either row: the record is closed Failed,
# the surge index is torn down, and the source is restored to Ready on its
# untouched running revision with its drain hold released.
scenario: migrate-surge-wedged
arrows:
  - T-ready-migrate
  - T-empty-migrate-target
  - T-migrate-surge-terminal
  - T-migratetarget-terminal
  - T-delete-done
cells:
  - instance/Migrate/CreateSurge/pod.waiting[ImagePullBackOff]/before
  - instance/Migrate/SurgeTarget/pod.waiting[ImagePullBackOff]/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    migrationMode: Auto
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
timeline:
  - tick: 1
    note: the index is planned and no row exists, so the Create pass opens the attempt
  - tick: 2
    note: the pod is bound, becomes Ready and enters rotation, so the row records a running revision on a known node
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-0}
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the operator asks the Instance off node-0, and the migrate pass admits the request and establishes the pair
    events:
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
  - tick: 4
    note: the surge is still booting two minutes on, which is longer than the grace but proves nothing on its own
    events:
      - clock.advance: 2m
  - tick: 5
    note: the pull wedges on a surge already older than the grace, so the record consumes it as early failure evidence
    events:
      - pod.waiting[ImagePullBackOff]: {pod: {index: 1}, message: "manifest unknown"}
  - tick: 6
    note: the pin is gone, so the surge index is no longer planned and the scale-down pipeline commits Phase Deleting on it
  - tick: 7
    note: the drain finds nothing routed on the retired index, so its pod's delete is issued
  - tick: 8
    note: the surge's pod is gone, so its row is removed with it
    events:
      - pod.deleted[target]: {pod: {index: 1}}
