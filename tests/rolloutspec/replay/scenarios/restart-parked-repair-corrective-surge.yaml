# A corrective revision lands on a repair parked at Failed under
# SurgeThenDrain. The row's running revision is no longer the roll target,
# so the restart pass yields the row and the roll replaces the parked repair
# with a fresh surge attempt: a replacement is created beside the wedged
# pod, and once it is Ready and in rotation the wedged pod is deleted and
# the replacement promoted.
scenario: restart-parked-repair-corrective-surge
arrows:
  - T-ready-restart
  - T-restart-stuck
  - T-failedrepair-corrective-surge
  - T-surge-target-ready
  - T-surgedrain-promote
cells:
  - instance/Failed/Repair/spec.revision/boundary@T-failedrepair-corrective-surge
  - instance/Failed/Repair/spec.revision/after@T-failedrepair-corrective-surge
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the rebuilt pod crash-loops and is older than the grace when the wedge is read, so the row fails with its operation preserved
    events:
      - clock.advance: 2m
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 0}, message: "back-off restarting failed container"}
  - tick: 4
    note: a corrective revision lands; the row is off the roll target, so the roll replaces the parked repair with a fresh surge attempt and creates the replacement beside the wedged pod
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 5
    note: the replacement becomes Ready and enters rotation, so the handoff moves to the drain and deletes the wedged source, which never served
    events:
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 6
    note: the wedged source is gone, so the replacement is promoted and the row reads Ready on the corrective revision
    events:
      - pod.deleted[source]: {pod: {index: 0}}
