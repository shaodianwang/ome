# A Ready Instance under RecreateInstanceOnPodRestart loses its pod to a
# terminal phase and the repair opens; the drained pod is still Terminating
# when the template moves to a new revision. The repair has created no pod
# of its own yet, so its rebuild follows the new target: the row records
# the new revision before the create, the pod it rebuilds carries that
# revision's label and image, and the roll finds the Instance on target
# once the repair promotes it.
scenario: restart-retarget
arrows:
  - T-ready-restart-podterminal
  - T-restart-ready
cells:
  - instance/Restart/Drain/spec.revision/before
intentional: >-
  a rebuild that has created no pod yet follows the target the operator
  pushed, so the Instance is rebuilt once, on the fix, and the roll has
  nothing left to do
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod leaves rotation and reports Failed, so the repair opens a Restart and deletes it; the kubelet still holds it Terminating
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
      - pod.servingOff[source]: {pod: {index: 0}}
      - pod.phaseTerminal[Failed]: {pod: {index: 0}}
  - tick: 3
    note: the template moves to a new revision while the repair is open and has created no pod; the repair is driven on and waits for the old pod to clear
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the old pod is gone and the repair records the new revision on the row, then rebuilds the Instance from its template under its label
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 5
    note: the rebuilt pod reports Ready and enters rotation, and the repair promotes the row on the new revision
    events:
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 6
    note: the roll finds the repaired Instance already on the new revision and opens nothing
