# A migration claims a free index as its surge target; on the next pass a
# new template and a scale-up arrive. The claimed index stays the record's
# own: it is neither retargeted nor re-planned.
scenario: idle-empty-migrate-target-after
arrows:
  - T-ready-migrate
  - T-empty-migrate-target
cells:
  - instance/Empty/spec.migrateRequest/boundary@T-empty-migrate-target
  - instance/Empty/spec.revision/after@T-empty-migrate-target
  - instance/Empty/spec.replicasUp/after@T-empty-migrate-target
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    migrationMode: Auto
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true, node: node-0}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the operator asks the Instance off node-0, and the migrate pass claims index 1 as the surge at the source's running revision and establishes the pair
    events:
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
  - tick: 3
    note: the template moves and the replica count climbs in the same observation; the claimed index stays the migration's own and the source, being migrate-owned, is not rolled
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
      - spec.replicasUp: {to: 2}
