# A roll of two Instances is held because the first Instance, already on
# the pushed revision, crashes under load: its runner restarts after the
# Instance entered Ready, so it is not serving for the window, no further
# source may leave rotation, and the second Instance's surge waits with
# its replacement up beside the source. The restart policy is edited from
# None to RecreateInstanceOnPodRestart while the roll is held, so the
# policy rebuilds the crashed set on the revision the Component still
# wants.
# The fix is pushed while the crashed pod is still terminating: the repair
# has created no pod yet, so its rebuild follows the roll target and the
# crashed Instance comes back on the fix directly, with no pod of the
# broken revision created after the push; the second Instance's committed
# surge promotes on the revision it was pinned to and rolls to the fix
# from there.
scenario: held-crash-policy-flip-fix-before-rebuild
arrows:
  - T-ready-surge
  - T-surge-target-ready
  - T-surgedrain-promote
  - T-ready-restart-crash
cells:
  - instance/Ready/spec.policyTuning[restartPolicy]/before
  - instance/Ready/pod.containerRestart/boundary@T-ready-surge
  - instance/Update/Surge/spec.revision/boundary@T-surge-target-ready
initial:
  spec:
    replicas: 2
    strategy: SurgeThenDrain
    maxSurge: "1"
    maxUnavailable: "0"
    restartPolicy: None
    image: registry.example.com/runtime:v1
    containerName: ome-container
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
timeline:
  - tick: 1
    note: cold start materializes both Instances on the starting revision
  - tick: 2
    note: both sources become Ready and enter rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
      - pod.ready[source]: {pod: {index: 1, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 1, ordinal: 0}}
  - tick: 3
    note: a broken revision is pushed, so the first Instance surges a replacement and the second waits on the surge budget
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the first replacement is serving and in rotation beside its source, so the source leaves the serving gate
    events:
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 5
    note: the first source leaves rotation, so the drain has converged and the source is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 6
    note: the first source is gone, so the first Instance promotes onto the pushed revision
    events:
      - pod.deleted[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 7
    note: the surge budget frees, so the second Instance surges its replacement
  - tick: 8
    note: half a minute later the promoted runner crashes under load and leaves rotation while the second replacement comes up; the first Instance is not serving for the window, so no source leaves rotation and the roll is held
    events:
      - clock.advance: 30s
      - pod.containerRestart: {pod: {index: 0, ordinal: 1}, message: Error}
      - endpoint.rotationOut[target]: {pod: {index: 0, ordinal: 1}}
      - pod.ready[target]: {pod: {index: 1, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 1, ordinal: 1}}
  - tick: 9
    note: the restart policy is edited to RecreateInstanceOnPodRestart while the roll is held, so the restarted runner's Instance is rebuilt and its crashed pod, already out of rotation, is deleted
    events:
      - spec.policyTuning[restartPolicy]: {value: RecreateInstanceOnPodRestart}
  - tick: 10
    note: the fix is pushed while the crashed pod is still terminating, so the repair has nothing to rebuild yet and waits for the name to free
    events:
      - spec.revision: {image: registry.example.com/runtime:v3}
  - tick: 11
    note: the crashed pod is gone, so the repair records the fix as the revision it rebuilds at and creates the set on it
    events:
      - pod.deleted[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 12
    note: the rebuilt pod reports Ready, so the repair completes with the first Instance on the fix; the second Instance's drain stays withheld while the rebuilt set is Ready for less than the window
    events:
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 13
    note: the rebuilt set has served for the window, so the second Instance's committed cycle drains the source toward the revision it was pinned to
    events:
      - clock.advance: 1m
  - tick: 14
    note: the second source leaves rotation, so it is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 1, ordinal: 0}}
  - tick: 15
    note: the second source is gone, so the second Instance promotes onto the pinned revision and now owes a roll to the fix
    events:
      - pod.deleted[source]: {pod: {index: 1, ordinal: 0}}
  - tick: 16
    note: the surge budget is free, so the second Instance surges toward the fix
  - tick: 17
    note: the replacement on the fix is serving and in rotation beside its source on the broken revision
    events:
      - pod.ready[target]: {pod: {index: 1, ordinal: 0}}
      - endpoint.rotationIn[target]: {pod: {index: 1, ordinal: 0}}
  - tick: 18
    note: the source on the broken revision leaves rotation, so it is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 1, ordinal: 1}}
  - tick: 19
    note: the source is gone and the fix has landed on every Instance
    events:
      - pod.deleted[source]: {pod: {index: 1, ordinal: 1}}
