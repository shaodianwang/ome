# A surge replacement goes Unknown with no force-delete policy in force.
# Nothing can prove the node dead, so the name stays held: the surge
# neither deletes the replacement nor creates over its name, the source
# keeps serving, and the hold pass reports the wait — the surge ordinal
# is one of the names it reads on a surging row — with the attempt's
# deadline parked rather than spent in silence.
scenario: surge-target-unknown-held
intentional: >-
  without a force-delete policy a quiet replacement is a held wait, not a
  failure and not a recycle: the row carries the NodeUnknown token with
  the replacement on LastFailure, its deadline is parked, and the source
  is untouched.
arrows:
  - T-ready-surge
cells:
  - instance/Update/Surge/pod.phaseTerminal[Unknown]/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement is bound to a node
    events:
      - pod.scheduled[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 5
    note: the replacement's kubelet stops reporting; with no policy the name is held, the row reports NodeUnknown and its deadline is parked
    events:
      - pod.phaseTerminal[Unknown]: {pod: {index: 0, ordinal: 1}}
  - tick: 6
    note: nothing else arrives; the held row re-derives the same wait and the source is still in rotation
    events:
      - clock.advance: 5m
