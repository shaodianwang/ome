# A three-member gang repair parked at Failed on a crash-looping rebuilt
# worker is narrowed by a worker. The narrower width changes what the exits
# count as complete, and the surplus member is neither wreckage nor a
# scale-down extra, so no pass removes it; the ladder's re-arm then drains
# the whole set and rebuilds it at the new width.
scenario: restart-parked-repair-gang-shrink
arrows:
  - T-ready-restart
  - T-restart-stuck
  - T-failedrepair-rearm
cells:
  - instance/Failed/Repair/spec.gangWidth[shrink]/before
initial:
  spec:
    replicas: 1
    workers: 2
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 2, initialDelay: 5m, maxDelay: 30m, multiplier: 2.0}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, runner: leader, ready: true, serving: true, routed: true}
    - {index: 0, runner: worker, ordinal: 0, ready: true, serving: true}
    - {index: 0, runner: worker, ordinal: 1, ready: true, serving: true}
timeline:
  - tick: 1
    note: the Ready gang is steady on its three serving members
  - tick: 2
    note: a worker is deleted out from under the Instance, so the repair opens a Restart over the gang and takes the leader out of serving
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: worker, ordinal: 1}}
  - tick: 3
    note: the leader leaves rotation, so the drain deletes the old members
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
  - tick: 4
    note: the old members are gone, so the gang is rebuilt at the bumped incarnation
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker, ordinal: 0}}
  - tick: 5
    note: the rebuilt leader and first worker come up while the second worker crash-loops past the grace, so the repair parks at Failed with its operation preserved
    events:
      - clock.advance: 2m
      - pod.containersReady[source]: {pod: {index: 0, runner: leader}}
      - pod.containersReady[source]: {pod: {index: 0, runner: worker, ordinal: 0}}
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 0, runner: worker, ordinal: 1}, message: "back-off restarting failed container"}
  - tick: 6
    note: the gang narrows by a worker; the surplus member is neither wreckage nor a scale-down extra, so no pass removes it and the row keeps its state
    events:
      - spec.gangWidth[shrink]: {to: 1}
  - tick: 7
    note: the ladder's delay elapses, so the repair re-arms at the next incarnation and drains the whole set, surplus member included
    events:
      - timer.repairRetry: {slack: 1s}
  - tick: 8
    note: the drained members are gone, so the rebuild lands at the new width
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker, ordinal: 0}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker, ordinal: 1}}
