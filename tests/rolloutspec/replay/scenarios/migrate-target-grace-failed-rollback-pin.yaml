# An Instance rolled to a second revision is asked off its node, its
# migration surge fails the scheduler grace with its pin kept, and the
# operator pins the roll back to the stored first revision. The update
# trigger declines a migrate-owned status, so the pin reaches neither row;
# the record's deadline ends the move, and once the source is restored and
# the retired surge index is gone the rolled-back target rolls it.
scenario: migrate-target-grace-failed-rollback-pin
arrows:
  - T-ready-surge
  - T-surge-target-ready
  - T-surgedrain-promote
  - T-ready-migrate
  - T-empty-migrate-target
  - T-failedmigratetarget-expired
  - T-migrate-deadline-restore
  - T-delete-done
cells:
  - instance/Failed/MigrateTarget/spec.rollbackTarget[set]/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    migrationMode: Auto
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    unschedulableGrace: 10m
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
timeline:
  - tick: 1
    note: the index is planned and no row exists, so the Create pass opens the attempt
  - tick: 2
    note: the pod is bound, becomes Ready and enters rotation, so the row records a running revision on a known node
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-0}
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement is bound to node-0 as well, serves and enters rotation
    events:
      - pod.scheduled[target]: {pod: {index: 0, ordinal: 1}, message: node-0}
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 5
    note: the source leaves rotation and is deleted, so the Instance promotes on the second revision
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, ordinal: 0}}
      - pod.deleted[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 6
    note: the operator asks the Instance off node-0, and the migrate pass admits the request and establishes the pair
    events:
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
  - tick: 7
    note: the scheduler finds the surge no node off node-0, so the scheduler hold is recorded on the surge row and both pair deadlines park
    events:
      - pod.unschedulable[target]: {pod: {index: 1}}
  - tick: 8
    note: the hold outlasts the configured grace, so the escalation stamps the surge row Failed with its Migrate pin kept while the source keeps serving under its own pin
    events:
      - clock.advance: 11m
  - tick: 9
    note: the roll is pinned back to the stored first revision, and the update trigger declines both rows of a migrate-owned pair
    events:
      - spec.rollbackTarget[set]: {image: registry.example.com/runtime:v1}
  - tick: 10
    note: the record's deadline elapses, so the expiry clears the pin from the Failed surge row, closes the record and restores the source to Ready on its running revision
    events:
      - timer.migrationDeadline: {slack: 1s}
  - tick: 11
    note: the unpinned index is beyond the desired set, so the scale-down pipeline commits Phase Deleting on it
  - tick: 12
    note: the drain finds nothing routed on the retired index, so its pod's delete is issued
  - tick: 13
    note: the surge pod is gone, so its row is removed with it
    events:
      - pod.deleted[target]: {pod: {index: 1}}
  - tick: 14
    note: with the pair gone the rolled-back target reaches the restored source, which surges a replacement rebuilt from the stored first revision
