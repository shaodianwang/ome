# A gang surge hands over, and while the drained source gang is still being
# removed the replacement's leader is deleted by hand with a grace period:
# the container exits cleanly, the pod reads Succeeded, the recycle takes it
# and writes the exit on the source row, and the member is recreated under
# the same attempt. The recreated leader comes up and the replacement is
# promoted, but the status write that removes the source row is refused,
# so the source stands one more pass beside its promoted replacement, the
# way the adapter leaves it while it finalizes the Instance's own
# resources. The plan then reads the hand-over as complete and the
# scale-down wave retires the source. A promoted replacement is a
# successful attempt, so the wave records nothing on the pinned revision's
# ladder, whatever the source row still carries from the recycle, and the
# second gang's own surge opens at once instead of waiting out a backoff
# for a kill nothing in the revision caused.
scenario: gang-surgedrain-promoted-source-retired-uncharged
arrows:
  - T-ready-surge
  - T-surgedrain-gang-complete
cells:
  - instance/Update/SurgeDrain/endpoint.rotationOut[source]/before
  - instance/Update/SurgeDrain/pod.terminating[target]/before
  - instance/Update/SurgeDrain/pod.phaseTerminal[Succeeded]/before
  - instance/Update/SurgeDrain/pod.deleted[target]/before
  - instance/Update/SurgeDrain/pod.deleted[source]/before
  - instance/Update/SurgeDrain/pod.ready[target]/before
  - instance/Update/SurgeDrain/api.conflict/before
intentional: >-
  a source retired after its replacement was promoted on the pinned
  revision ended a successful attempt, so its removal charges nothing on
  that revision's ladder whatever failure record the recycle left on its
  row; the next gang's surge is admitted at once rather than paced by a
  backoff the revision never earned
initial:
  spec:
    replicas: 2
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    maxSurge: "1"
    maxUnavailable: "0"
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    updateRetry: {maxAttempts: 3, initialDelay: 1m, maxDelay: 30m, multiplier: 2}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
    - {index: 1, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, runner: leader, ready: true, serving: true, routed: true, node: node-0}
    - {index: 0, runner: worker, ready: true, serving: true, node: node-1}
    - {index: 1, runner: leader, ready: true, serving: true, routed: true, node: node-2}
    - {index: 1, runner: worker, ready: true, serving: true, node: node-3}
timeline:
  - tick: 1
    note: the template changes, so the first gang claims the free index as its replacement and the other gang waits on the surge budget
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 2
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 3
    note: both replacement members report Ready and the leader enters rotation, so the source advances to the drain and leaves the serving gate
    events:
      - pod.ready[target]: {pod: {index: 2, runner: leader}}
      - pod.ready[target]: {pod: {index: 2, runner: worker}}
      - endpoint.rotationIn[target]: {pod: {index: 2, runner: leader}}
  - tick: 4
    note: the source leader leaves the routed Service, so the drain has converged and the source pods are deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
  - tick: 5
    note: while the source pods are still being removed, the replacement leader is deleted by hand with a grace period and its container exits cleanly, so the pod reads Succeeded; the recycle takes the dead member and writes the exit on the source row
    events:
      - pod.terminating[target]: {pod: {index: 2, runner: leader}}
      - pod.phaseTerminal[Succeeded]: {pod: {index: 2, runner: leader}}
  - tick: 6
    note: the leader object is gone, so the recycled member is recreated under the same name at the pinned revision beside the standing worker
    events:
      - pod.deleted[target]: {pod: {index: 2, runner: leader}}
  - tick: 7
    note: the source pods are gone, but the recreated leader is not Ready yet, so there is nothing to promote onto
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
  - tick: 8
    note: the recreated leader reports Ready and enters rotation, so the whole replacement is promoted on the pinned revision; the write that removes the source row is refused, so the source stands one more pass beside its promoted replacement
    events:
      - pod.ready[target]: {pod: {index: 2, runner: leader}}
      - endpoint.rotationIn[target]: {pod: {index: 2, runner: leader}}
      - api.conflict: {write: 5, count: 5}
  - tick: 9
    note: the plan reads the hand-over as complete and leaves the source out, so the scale-down wave retires it; a promoted replacement is a successful attempt and the wave records nothing on the pinned revision's ladder
  - tick: 10
    note: the retired source has no pod left, so its row is removed
  - tick: 11
    note: the second gang's own surge opens at once, nothing on the pinned revision's ladder standing in its way
