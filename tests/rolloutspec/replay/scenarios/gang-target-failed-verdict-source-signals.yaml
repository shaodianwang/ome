# The replacement gang's PodGroup is taken over by another controller while
# the surge is in flight, so the marker is Failed with its operation kept
# and the source keeps driving the build. Signals about the source gang, a
# partition and a widened minReadySeconds window land on the way: source
# gates and readiness are not consulted by the surge, a marker is never a
# partition candidate, and the window is consumed by the source's drain
# gate while the marker reads none.
scenario: gang-target-failed-verdict-source-signals
arrows:
  - T-empty-gang-surge-target
  - T-gangtarget-ready
  - T-failedgangtarget-ready
cells:
  - instance/Failed/GangSurgeTarget/pod.servingOff[source]/before
  - instance/Failed/GangSurgeTarget/pod.containersNotReady[source]/before
  - instance/Failed/GangSurgeTarget/pod.runningNotReady[source]/before
  - instance/Failed/GangSurgeTarget/spec.partition/before
  - instance/Failed/GangSurgeTarget/spec.policyTuning[minReadySeconds]/before
  - instance/Failed/GangSurgeTarget/timer.minReady/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    containerName: ome-container
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: the replacement group's controller reference is rewritten to another owner; the gang verdict ends the marker alone, Failed with its operation kept, while the source stays Updating and keeps driving the surge
    events:
      - gang.podGroup[OwnershipConflict]: {instance: 1}
  - tick: 6
    note: the source leader's gate is dropped from outside, the source worker's readiness regresses, a partition is raised and a thirty-second minReadySeconds window is set; the surge reads none of it on the marker, which is untouched
    events:
      - pod.servingOff[source]: {pod: {index: 0, runner: leader}}
      - pod.containersNotReady[source]: {pod: {index: 0, runner: worker}}
      - spec.partition: {to: 1}
      - spec.policyTuning[minReadySeconds]: {value: "30"}
  - tick: 7
    note: the source leader's gate is restored and two minutes pass with the source worker running but not ready; source readiness is still not consulted and no clock of the marker runs
    events:
      - pod.servingOn[source]: {pod: {index: 0, runner: leader}}
      - clock.advance: 2m
  - tick: 8
    note: both replacement members report Ready and the leader enters rotation; the drain gate now waits out the window, which the source's pass consumes while the source is still in rotation
    events:
      - pod.ready[target]: {pod: {index: 1, runner: leader}}
      - pod.ready[target]: {pod: {index: 1, runner: worker}}
      - endpoint.rotationIn[target]: {pod: {index: 1, runner: leader}}
  - tick: 9
    note: the window elapses, so the source advances to the drain and leaves the serving gate; the marker read no window
    events:
      - clock.advance: 31s
  - tick: 10
    note: the source leader leaves the routed Service, so the source pods are deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
  - tick: 11
    note: the source pods are gone, so the Failed marker is promoted Ready on the pinned revision and the source row is removed
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
