# A RecreatePod rebuild wedges on its image and the attempt is parked behind
# the held revision. What the rebuilt pod then reports leaves the park where
# it is: a serving gate flip, a node it cannot find, an outside delete.
scenario: failed-idle-parked-replacement
arrows:
  - T-ready-recreate
  - T-drain-stuck
cells:
  - instance/Failed/pod.servingOn[target]/before
  - instance/Failed/pod.servingOff[target]/before
  - instance/Failed/pod.unschedulable[target]/before
  - instance/Failed/pod.terminating[target]/before
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true, node: node-0}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod template changes and the strategy rebuilds in place of surging
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the pod leaves rotation, so the rebuild may start
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 4
    note: the old pod is gone and Phase B rebuilds it at the bumped incarnation
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 5
    note: the rebuilt pod is still booting two minutes on, which is longer than the grace but proves nothing on its own
    events:
      - clock.advance: 2m
  - tick: 6
    note: the rebuilt pod wedges on the target image, so the attempt is disposed and parked behind the held revision
    events:
      - pod.waiting[ImagePullBackOff]: {pod: {index: 0}, message: "manifest unknown"}
  - tick: 7
    note: the serving gate flips on under a pod whose containers never came up, and a park follows its pod set, which still serves nothing
    events:
      - pod.servingOn[target]: {pod: {index: 0}}
  - tick: 8
    note: and off again, which changes nothing either
    events:
      - pod.servingOff[target]: {pod: {index: 0}}
  - tick: 9
    note: the pod reports it cannot be placed, and the hold pass skips a row already stamped Failed
    events:
      - pod.unschedulable[target]: {pod: {index: 0}}
  - tick: 10
    note: something else deletes the rebuilt pod; a Terminating pod still holds its name, so the park waits for it to disappear
    events:
      - pod.terminating[target]: {pod: {index: 0}}
  - tick: 11
    note: the row is still Failed with its attempt parked
