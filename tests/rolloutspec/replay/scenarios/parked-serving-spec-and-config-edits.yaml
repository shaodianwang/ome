# Edits against a parked attempt whose single pod serves. An edit outside
# the revision hash, a new readiness timeout and a re-tuned stuck-pod grace
# open nothing and run no clock; a cache lagging one event behind costs one
# pass and writes nothing.
scenario: parked-serving-spec-and-config-edits
arrows:
  - T-ready-recreate
  - T-drain-deadline
  - T-failed-parked-serves
cells:
  - instance/Update/Parked/spec.annotationOnly/before
  - instance/Update/Parked/spec.policyTuning[instanceReadyTimeout]/before
  - instance/Update/Parked/config.changed[stuckPodGrace]/before
  - instance/Update/Parked/ctrl.staleRead/before
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
    podLabels: {kueue.x-k8s.io/queue-name: queue-a}
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 1h, maxDelay: 2h, multiplier: 2}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod template changes, so the roll drains the pod for a recreate
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the pod leaves rotation, so it is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 4
    note: the old pod is gone, so the rebuild lands at the new revision
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 5
    note: the deadline elapses on a rebuilt pod that never came up; the ladder counts the wave and the attempt is parked with the row Failed
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the pod comes up and is gated serving, so the parked set serves in full and the row reads as the roll in progress with the attempt still parked
    events:
      - pod.containersReady[source]: {pod: {index: 0}}
      - pod.servingOn[source]: {pod: {index: 0}}
  - tick: 7
    note: the queue label moves; the edit is outside the revision hash, so the target stands and the parked attempt opens nothing
    events:
      - spec.annotationOnly: {labels: {kueue.x-k8s.io/queue-name: queue-b}}
  - tick: 8
    note: the readiness timeout is shortened; a parked attempt runs no clock, so the knob waits for the next attempt
    events:
      - spec.policyTuning[instanceReadyTimeout]: {value: 10m}
  - tick: 9
    note: the stuck-pod grace is shortened; the grace is read afresh every pass and the serving set gives it nothing to measure
    events:
      - config.changed[stuckPodGrace]: {config: {stuckPodGrace: 10s}}
  - tick: 10
    note: the cache lags one event behind for this pass; the phase is re-read from the set and nothing is written
    events:
      - ctrl.staleRead: {}
