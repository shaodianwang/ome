# A Restart's rebuilt pod dies in a terminal phase before it ever reported
# ready. The attempt is intact: the dead occupant of the rebuild's target
# name is deleted and recreated inside the same Restart rather than the
# Instance failing.
scenario: restart-recycle-terminal
arrows:
  - T-ready-restart
  - T-restart-recycle-terminal
cells:
  - instance/Restart/Drain/pod.phaseTerminal[Failed]/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    updateRetry: {maxAttempts: 3, initialDelay: 10s, maxDelay: 2m, multiplier: 2}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the rebuilt pod lands in a terminal phase before it ever became Ready, so the dead occupant is recycled
    events:
      - pod.phaseTerminal[Failed]: {pod: {index: 0}}
  - tick: 4
    note: the recycle delete is observed, freeing the rebuild's target name
    events:
      - pod.deleted[source]: {pod: {index: 0}}
