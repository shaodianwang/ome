# A leftover pod off the current revision wedges young on a Pending row; the
# grace elapses as the current revision's retry block comes due. The
# escalation reads the grace and the pod, never the retry gate.
scenario: idle-pending-retry-due-at-stuckgrace
arrows:
  - T-pending-stuckgrace
cells:
  - instance/Pending/timer.retryAt/boundary@T-pending-stuckgrace
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v2
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 5m
    updateRetry: {maxAttempts: 3, initialDelay: 2m, maxDelay: 10m, multiplier: 2}
  retryBlocks:
    - {revision: current, state: Backoff, attemptsStarted: 1, nextRetryAt: 2m, reason: ImagePullBackOff}
  rows:
    - {index: 0, phase: Pending, runningRevision: current}
  pods:
    - {index: 0, node: node-0, previousImage: registry.example.com/runtime:v1}
timeline:
  - tick: 1
    note: the row is forming on a pod the Component's current revision no longer claims, and that revision sits in Backoff
  - tick: 2
    note: the pull wedges immediately, but the pod is younger than the grace, so nothing escalates
    events:
      - pod.waiting[ImagePullBackOff]: {pod: {index: 0}, message: "manifest unknown"}
  - tick: 3
    note: the grace elapses with the block long due, and the row is stamped Failed without the block being read
    events:
      - timer.stuckPodGrace: {slack: 1s}
      - timer.retryAt: {slack: 1s}
