# The restart policy is set to None while a repair is open. The policy
# governs whether a repair starts, not whether one finishes: the open repair
# is driven to Ready, and the new policy governs the next trigger.
scenario: restart-policy-flip-mid-repair-ignored
arrows:
  - T-ready-restart
  - T-restart-ready
cells:
  - instance/Restart/Drain/spec.policyTuning[restartPolicy]/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the restart policy is set to None; the open repair reads nothing from it and keeps waiting on its rebuilt pod
    events:
      - spec.policyTuning[restartPolicy]: {value: None}
  - tick: 4
    note: the rebuilt pod reports Ready, so the repair promotes the row on the same revision
    events:
      - pod.ready[source]: {pod: {index: 0}}
  - tick: 5
    note: the pod is lost again under the new policy; no repair opens and the Create pass refills the name instead
    events:
      - pod.deleted[source]: {pod: {index: 0}}
