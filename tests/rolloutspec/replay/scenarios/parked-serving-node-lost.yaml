# The node under a parked attempt's serving pod stops reporting and is
# then deleted. The pod leaves Ready behind the unreachable taint while its
# containers and its gate stay as the kubelet left them, so the parked
# reading, which takes ContainersReady and the gate, is unchanged; the loss
# would reach the row only through the pod turning terminal, unready past
# the grace, or gone.
scenario: parked-serving-node-lost
arrows:
  - T-ready-recreate
  - T-drain-deadline
  - T-failed-parked-serves
cells:
  - instance/Update/Parked/pod.nodeLost[UnreachableTaint]/before
  - instance/Update/Parked/pod.nodeLost[NodeGone]/before
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 1h, maxDelay: 2h, multiplier: 2}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod template changes, so the roll drains the pod for a recreate
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the pod leaves rotation, so it is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 4
    note: the old pod is gone, so the rebuild lands at the new revision
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 5
    note: the deadline elapses on a rebuilt pod that never came up; the ladder counts the wave and the attempt is parked with the row Failed
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: the pod comes up and is gated serving, so the parked set serves in full and the row reads as the roll in progress with the attempt still parked
    events:
      - pod.containersReady[source]: {pod: {index: 0}}
      - pod.servingOn[source]: {pod: {index: 0}}
  - tick: 7
    note: the serving pod is bound and its node stops reporting; the pod leaves Ready behind the taint while its containers and gate stand, so the reading is unchanged
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-1}
      - pod.nodeLost[UnreachableTaint]: {pod: {index: 0}}
  - tick: 8
    note: the node object is deleted; nothing of the row reads the node
    events:
      - pod.nodeLost[NodeGone]: {pod: {index: 0}}
  - tick: 9
    note: a further pass reads the same set and writes nothing
