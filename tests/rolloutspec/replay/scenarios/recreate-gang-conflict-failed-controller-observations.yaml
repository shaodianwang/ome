# The controller and the apiserver around a gang's recreate that the gang
# verdict ended with the Update operation kept. The kept operation and the
# recorded verdict are persisted, so a restarted manager reads the same row
# and re-drives nothing; a pass with nothing new writes nothing; a stale
# read changes nothing; and when a corrective revision re-drives the
# continuation, a status write refused with a conflict is re-read and
# re-applied.
scenario: recreate-gang-conflict-failed-controller-observations
arrows:
  - T-ready-recreate
  - T-faileddrain-corrective
cells:
  - instance/Failed/Drain/ctrl.crash/before
  - instance/Failed/Drain/ctrl.resync/before
  - instance/Failed/Drain/ctrl.staleRead/before
  - instance/Failed/Drain/api.conflict/before
  - instance/Failed/Drain/spec.revision/before
intentional: >-
  a recreate the gang verdict ended stays Failed with its operation kept:
  nothing this controller does frees a name another controller holds, so no
  pass re-drives it at the pinned revision; it resumes through a revision
  other than the pinned one or the reset mailbox
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members are bound to node-0 and report Ready, and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.scheduled[source]: {pod: {index: 0, runner: leader}, message: node-0}
      - pod.scheduled[source]: {pod: {index: 0, runner: worker}, message: node-0}
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the pod template changes and the strategy rebuilds the gang in place of surging, so Phase A takes the serving gates down
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the leader leaves rotation, so Phase A deletes both members
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
  - tick: 5
    note: both members are gone, so Phase B rebuilds the gang at the bumped incarnation behind its existing PodGroup
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
  - tick: 6
    note: the group's controller reference is rewritten to another owner, which is a name this controller may not write, so the gang verdict stamps the Instance Failed with the recreate kept rather than parked
    events:
      - gang.podGroup[OwnershipConflict]: {instance: 0}
  - tick: 7
    note: the controller restarts; the kept operation and the recorded verdict are persisted, so the next manager reads the same row and re-drives nothing
    events:
      - ctrl.crash: {}
  - tick: 8
    note: a pass with nothing new writes nothing
  - tick: 9
    note: the cache lags a tick behind, and a row no pass re-drives reads the same either way
    events:
      - ctrl.staleRead: {}
  - tick: 10
    note: the template moves to a third revision and the first status write of the pass is refused once with a conflict; the restamp of the re-driven recreate is re-read and re-applied against a fresh snapshot, and Phase A deletes the ended attempt's members
    events:
      - spec.revision: {image: registry.example.com/runtime:v3}
      - api.conflict: {write: 1, count: 1}
  - tick: 11
    note: the name still belongs to another controller, so the verdict ends the re-driven attempt with the recreate kept
