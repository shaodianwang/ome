# A gang source fails on its deadline at the drain step with a replacement
# member short of readiness. Create refusals are armed that nothing meets,
# minutes pass with a source member and the replacement member running
# unready, and the pass that sees the member come back reads its cache one
# event behind: nothing is created past the drain claim, a drained source
# member's readiness is read by nobody, the continuation waits for the
# replacement to be runtime-ready with no clock of its own, and the gang
# path reads its members from the live list.
scenario: gang-draindeadline-unmet-create-arms
arrows:
  - T-empty-gang-surge-target
  - T-gangtarget-ready
  - T-surgedrain-deadline
  - T-failedgangtarget-ready
  - T-failedgangsurgedrain-complete
cells:
  - instance/Failed/GangSurgeDrain/api.alreadyExists/before
  - instance/Failed/GangSurgeDrain/api.quotaDenied/before
  - instance/Failed/GangSurgeDrain/api.namespaceTerminating/before
  - instance/Failed/GangSurgeDrain/pod.runningNotReady[source]/before
  - instance/Failed/GangSurgeDrain/pod.runningNotReady[target]/before
  - instance/Failed/GangSurgeDrain/ctrl.staleRead/before
initial:
  spec:
    replicas: 1
    workers: 1
    topologyKey: topology.example.com/fabric-domain
    gangScheduling: true
    schedulerName: gang-scheduler
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: the gang's PodGroup is announced before its first member, and the Create pass materializes both
  - tick: 2
    note: both members report Ready and the leader enters rotation, so the Instance promotes as one
    events:
      - pod.ready[source]: {pod: {index: 0, runner: leader}}
      - pod.ready[source]: {pod: {index: 0, runner: worker}}
      - endpoint.rotationIn[source]: {pod: {index: 0, runner: leader}}
  - tick: 3
    note: the template changes, and with no free ordinal inside the gang the source claims index 1 as its replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement's PodGroup is announced before its first member, and both members are created
  - tick: 5
    note: both replacement members report Ready and the leader enters rotation, so the source advances to the drain and leaves the serving gate
    events:
      - pod.ready[target]: {pod: {index: 1, runner: leader}}
      - pod.ready[target]: {pod: {index: 1, runner: worker}}
      - endpoint.rotationIn[target]: {pod: {index: 1, runner: leader}}
  - tick: 6
    note: the replacement worker's readiness regresses while the source is still published, so the pair is no longer fully serving
    events:
      - pod.containersNotReady[target]: {pod: {index: 1, runner: worker}}
  - tick: 7
    note: the deadline elapses with the replacement short, so the source is stamped Failed at its drain step and the marker Failed too, both operations kept
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 8
    note: already-exists, quota and terminating-namespace answers are armed for a create and a source member's readiness regresses; nothing is created past the drain claim, so none of them is met
    events:
      - api.alreadyExists: {verb: create}
      - api.quotaDenied: {verb: create}
      - api.namespaceTerminating: {verb: create}
      - pod.containersNotReady[source]: {pod: {index: 0, runner: worker}}
  - tick: 9
    note: two minutes pass with the source member and the replacement member running unready; the drained source's readiness is read by nobody and the continuation waits for the replacement with no clock of its own
    events:
      - clock.advance: 2m
  - tick: 10
    note: the replacement worker comes back Ready while the cache lags one event behind; the gang path reads its members from the live list, so the lag costs nothing
    events:
      - pod.ready[target]: {pod: {index: 1, runner: worker}}
      - ctrl.staleRead: {}
  - tick: 11
    note: the source leader leaves the routed Service, so the drain has converged and the source pods are deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, runner: leader}}
  - tick: 12
    note: the source pods are gone, so the replacement is promoted Ready on the pinned revision and the source row is removed
    events:
      - pod.deleted[source]: {pod: {index: 0, runner: leader}}
      - pod.deleted[source]: {pod: {index: 0, runner: worker}}
