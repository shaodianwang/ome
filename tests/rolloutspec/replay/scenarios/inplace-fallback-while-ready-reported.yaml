# The diff exceeds container images on the pass that also reads the pod
# ready. The fallback is decided by the re-resolved mode, not by readiness:
# the pod belongs to the Incarnation the recreate supersedes.
scenario: inplace-fallback-while-ready-reported
arrows:
  - T-ready-inplace
  - T-inplace-fallback
cells:
  - instance/Update/InPlace/pod.containersReady[source]/boundary@T-inplace-fallback
initial:
  spec:
    replicas: 1
    strategy: InPlaceIfPossible
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the pod becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: only the image changed, so the update is eligible to run in place
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the pod leaves rotation, so the transition marker is written
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 5
    note: the environment changes too as the pod reports ContainersReady, so the roll re-resolves to recreate whatever the pod reports
    events:
      - pod.containersReady[source]: {pod: {index: 0}}
      - spec.revision: {env: {OME_FEATURE_GATE: enabled}}
