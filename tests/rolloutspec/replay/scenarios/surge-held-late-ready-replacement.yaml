# A single-pod surge wedges on a revision whose ladder allows one attempt,
# so the stuck-pod grace holds the revision with the wedged replacement
# still standing beside the serving source. The registry comes back and the
# replacement reports runtime-ready, then Ready: neither rescues the Failed
# source. The row stays Failed on its running revision, the replacement is
# never marked serving, and only the source serves.
scenario: surge-held-late-ready-replacement
arrows:
  - T-ready-surge
  - T-surge-stuckgrace
cells:
  - instance/Update/Surge/pod.ready[target]/after@T-surge-stuckgrace
  - instance/Failed/pod.containersReady[target]/before
  - instance/Failed/pod.ready[target]/before
  - instance/Failed/gate.deny[Held]/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 1, initialDelay: 2m, maxDelay: 10m, multiplier: 2}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true, node: node-0}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the pull wedges immediately, but the replacement is younger than the grace, so the surge keeps polling
    events:
      - pod.waiting[ImagePullBackOff]: {pod: {index: 0, ordinal: 1}, message: "manifest unknown"}
  - tick: 4
    note: the grace elapses on the wedged replacement; the surge is disposed and the one-attempt ladder holds the revision, with the replacement left standing beside the source
    events:
      - timer.stuckPodGrace: {slack: 1s}
  - tick: 5
    note: the registry has the tag again and the replacement reports runtime-ready; a replacement becoming runtime-ready does not rescue a Failed source, and nothing marks it serving
    events:
      - pod.containersReady[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 6
    note: the replacement reports Ready; the row stays Failed on its running revision and the source alone serves
    events:
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 7
    note: a further pass finds the row where the hold left it
