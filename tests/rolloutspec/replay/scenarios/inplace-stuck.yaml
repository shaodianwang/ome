# The patched pod wedges on its image. The escalation measures the wedge from
# the start of the pod's waiting episode - the patch that took a serving pod
# out of service, not the pod's creation - so the attempt is disposed on the
# pass that reads a reason held for longer than the stuck-pod grace.
scenario: inplace-stuck
arrows:
  - T-ready-inplace
  - T-inplace-stuck
cells:
  - instance/Update/InPlace/pod.waiting[ImagePullBackOff]/before
initial:
  spec:
    replicas: 1
    strategy: InPlaceIfPossible
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the pod becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: only the image changed, so the update is eligible to run in place
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the pod leaves rotation and two minutes pass, which is longer than the grace but proves nothing on its own
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
      - clock.advance: 2m
  - tick: 5
    note: the new image cannot be pulled, and the same pass issues the image patch and restamps the revision label
    events:
      - pod.waiting[ImagePullBackOff]: {pod: {index: 0}, message: "manifest unknown"}
  - tick: 6
    note: the wedged pod now carries the target revision and the pull has failed for longer than the grace, so the escalation charges that revision and disposes the roll
    events:
      - clock.advance: 2m
