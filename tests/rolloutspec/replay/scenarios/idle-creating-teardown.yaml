# The owner is deleted while a migration surge row is left Creating with
# no operation. A create refusal armed for the terminating namespace is
# consumed by nobody; teardown treats every observed index as a scale-down
# extra, the Delete stamp is committed once, and the row is removed once
# its leftover pod is gone.
scenario: idle-creating-teardown
arrows:
  - T-ready-migrate
  - T-empty-migrate-target
  - T-migrate-deadline-restore
  - T-migratetarget-expired
  - T-creating-teardown
  - T-ready-teardown
  - T-delete-done
cells:
  - instance/Creating/api.namespaceTerminating/before
  - instance/Creating/spec.teardown[deleted]/before
  - instance/Creating/spec.teardown[deleted]/after@T-creating-teardown
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    migrationMode: Auto
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    scaleDownRequeueInterval: 30s
    migrationAudit: {maxInFlight: 1, maxPerWindow: 4, window: 1h}
timeline:
  - tick: 1
    note: the index is planned and no row exists, so the Create pass opens the attempt
  - tick: 2
    note: the pod is bound, becomes Ready and enters rotation, so the row records a running revision on a known node
    events:
      - pod.scheduled[source]: {pod: {index: 0}, message: node-0}
      - pod.ready[source]: {pod: {index: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0}}
  - tick: 3
    note: the operator asks the Instance off node-0, and the migrate pass admits the request and establishes the pair
    events:
      - spec.migrateRequest: {instance: 0, fromNode: node-0, reason: NodeDrain}
  - tick: 4
    note: the surge pod is bound and comes up on its node while the migration waits on its promote
    events:
      - pod.scheduled[target]: {pod: {index: 1}, message: node-1}
      - pod.containersReady[target]: {pod: {index: 1}}
  - tick: 5
    note: the record's deadline elapses with the source healthy, so expiry restores the source and unpins the surge, whose row is left Creating with no operation beyond the desired set
    events:
      - timer.migrationDeadline: {slack: 1s}
  - tick: 6
    note: the namespace begins terminating and the owner's deletion begins; nothing is created for the leftover row, and teardown stamps Deleting over it as a scale-down extra
    events:
      - api.namespaceTerminating: {}
      - spec.teardown[deleted]: {}
  - tick: 7
    note: the teardown is re-observed; the Delete stamp is committed once and the wave deletes the leftover pod
    events:
      - spec.teardown[deleted]: {}
  - tick: 8
    note: the leftover pod is gone, so the row is removed
    events:
      - pod.deleted[source]: {pod: {index: 1}}
