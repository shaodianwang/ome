# A Restart's rebuilt pod never becomes Ready and the operation deadline
# stamped at restart entry elapses. A Restart attempt is not disposable, so
# the stamp keeps the operation and records the bare DeadlineExceeded
# diagnostic on LastFailure.
scenario: restart-deadline
arrows:
  - T-ready-restart
  - T-restart-deadline
cells:
  - instance/Restart/Drain/timer.operationDeadline/before
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the rebuilt pod reports no readiness until the attempt deadline elapses, and the row fails with its operation preserved
    events:
      - timer.operationDeadline: {slack: 1s}
