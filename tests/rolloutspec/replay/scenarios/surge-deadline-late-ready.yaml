# The operation deadline elapses on the pass that sees the replacement,
# gated on an earlier pass, report Ready and enter rotation beside the
# source. The escalation judges capacity on the pass's pod observation, and
# a set PodReady and gated at the desired count is capacity, so the deadline
# write is withheld and the surge advances; the elapsed deadline stays behind
# the clock for the rest of the cycle and ends nothing while the replacement
# serves.
scenario: surge-deadline-late-ready
arrows:
  - T-ready-surge
  - T-surge-target-ready
  - T-surgedrain-promote
cells:
  - instance/Update/Surge/pod.ready[target]/boundary@T-surge-deadline
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 1m
  config:
    requeueOperation: 5s
    requeueGate: 3s
timeline:
  - tick: 1
    note: cold start
  - tick: 2
    note: the source becomes Ready and enters rotation
    events:
      - pod.ready[source]: {pod: {index: 0, ordinal: 0}}
      - endpoint.rotationIn[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 3
    note: the pod template changes, so the rollout surges a replacement
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 4
    note: the replacement reports ContainersReady, which permits the pass to write its serving gate
    events:
      - pod.containersReady[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 5
    note: the deadline elapses on the pass that sees the gated replacement report Ready and enter rotation beside the source; the set is capacity, so no stamp lands and the step advances
    events:
      - timer.operationDeadline: {slack: 1s}
      - pod.ready[target]: {pod: {index: 0, ordinal: 1}}
      - endpoint.rotationIn[target]: {pod: {index: 0, ordinal: 1}}
  - tick: 6
    note: the source leaves rotation; the elapsed deadline still ends nothing because the replacement is the set's capacity, so the drained source is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0, ordinal: 0}}
  - tick: 7
    note: the drained source is gone and the surge promotes past its own deadline
    events:
      - pod.deleted[source]: {pod: {index: 0, ordinal: 0}}
