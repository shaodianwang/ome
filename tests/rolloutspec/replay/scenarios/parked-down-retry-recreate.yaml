# The ladder's block comes due on a parked attempt whose single pod never
# came up. The gate admits and a fresh recreate attempt with a new
# incarnation replaces the parked one, draining the parked pod; the block
# read as due again admits nothing more. A create refusal armed while the
# attempt was parked is consumed by nobody until that fresh attempt
# rebuilds the pod, since a parked attempt creates nothing. The fresh start
# over a row that still reads Failed consults no coordination gate.
scenario: parked-down-retry-recreate
arrows:
  - T-ready-recreate
  - T-drain-deadline
  - T-failedparked-retry
cells:
  - instance/Failed/Parked/api.alreadyExists/before
  - instance/Failed/Parked/timer.retryAt/boundary@T-failedparked-retry
  - instance/Failed/Parked/timer.retryAt/after@T-failedparked-retry
  - instance/Failed/Parked/gate.allow/before
initial:
  spec:
    replicas: 1
    strategy: RecreatePod
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    updateRetry: {maxAttempts: 3, initialDelay: 1h, maxDelay: 2h, multiplier: 2}
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod template changes, so the roll drains the pod for a recreate
    events:
      - spec.revision: {image: registry.example.com/runtime:v2}
  - tick: 3
    note: the pod leaves rotation, so it is deleted
    events:
      - endpoint.rotationOut[source]: {pod: {index: 0}}
  - tick: 4
    note: the old pod is gone, so the rebuild lands at the new revision
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 5
    note: the deadline elapses on a rebuilt pod that never came up; the ladder counts the wave and the attempt is parked with the row Failed
    events:
      - timer.operationDeadline: {slack: 1s}
  - tick: 6
    note: an already-exists answer is armed for the next pod create; a parked attempt creates nothing, so nothing consumes it
    events:
      - api.alreadyExists: {}
  - tick: 7
    note: the block comes due; the gate admits and a fresh recreate attempt with a new incarnation replaces the parked one and drains the parked pod
    events:
      - timer.retryAt: {slack: 1s}
  - tick: 8
    note: the block is read as due again and the parked pod is gone; the block admitted exactly one attempt, and the fresh attempt's rebuild meets the armed answer and adopts the object that already holds the name
    events:
      - timer.retryAt: {slack: 1s}
      - pod.deleted[source]: {pod: {index: 0}}
