# The owner is deleted while a repair is parked at Failed, and the
# configured teardown deadline has elapsed by the time the controller
# observes it. The deadline check runs ahead of the teardown dispatch, so
# the row is never stamped Deleting: the pass warns, releases the
# finalizer, and the owner goes with the row while the wedged pod is left
# to background GC. A later pass finds no object to act on.
scenario: restart-parked-repair-teardown-deadline
arrows:
  - T-ready-restart
  - T-restart-stuck
cells:
  - instance/Failed/Repair/timer.teardownDeadline/before
  - instance/Failed/Repair/timer.teardownDeadline/after@T-failedrepair-teardown-deadline
initial:
  spec:
    replicas: 1
    strategy: SurgeThenDrain
    restartPolicy: RecreateInstanceOnPodRestart
    image: registry.example.com/runtime:v1
    instanceReadyTimeout: 30m
  config:
    requeueOperation: 5s
    requeueGate: 3s
    stuckPodGrace: 1m
    scaleDownRequeueInterval: 30s
    teardownDeadline: 10m
  rows:
    - {index: 0, phase: Ready, runningRevision: current, readySince: 0s}
  pods:
    - {index: 0, ready: true, serving: true, routed: true}
timeline:
  - tick: 1
    note: the Ready row is steady on its one serving pod
  - tick: 2
    note: the pod is deleted out from under the Instance, so the repair opens a Restart and rebuilds it
    events:
      - pod.deleted[source]: {pod: {index: 0}}
  - tick: 3
    note: the rebuilt pod crash-loops and is older than the grace when the wedge is read, so the row fails with its operation preserved
    events:
      - clock.advance: 2m
      - pod.waiting[CrashLoopBackOff]: {pod: {index: 0}, message: "back-off restarting failed container"}
  - tick: 4
    note: the owner was deleted and its teardown deadline has elapsed before this pass observes either, so the deadline check releases the owner ahead of any teardown wave and the parked row goes with it
    events:
      - spec.teardown[deleted]: {}
      - timer.teardownDeadline: {slack: 1s}
  - tick: 5
    note: a late pass finds no owner left to act on
