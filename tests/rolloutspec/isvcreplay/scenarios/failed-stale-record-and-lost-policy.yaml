scenario: failed-stale-record-and-lost-policy
cells:
  - canary/Failed/pass.staleRecord/before
  - canary/Failed/plan.unresolved/before
intentional: >-
  the first step's capacity wait outlives the ready timeout and the unit parks
  Failed; a pass that reads the copy from before the park re-decides the park
  and the flush keeps the live record, and once the policy stops resolving the
  unit is not dispatched: the park's heartbeat stops and nothing else changes
initial:
  service:
    components:
      engine: {replicas: 2, image: registry.example.com/runtime:v1}
    groups:
      - components: [engine]
        policyRef: {name: canary-policy, progression: canary}
  policies:
    - name: canary-policy
      spec:
        canary:
          scaleDownDelaySeconds: 600
          steps:
            - {capacity: "50%", traffic: 10, pause: {}}
            - {capacity: "100%", traffic: 100}
  config: {requeue: 10s, parkedRequeue: 1m, defaultReadyTimeout: 10m, rolloutPolicyEnabled: true}
timeline:
  - tick: 1
    note: a settled service; the policy resolves and the unit reads Stable
  - tick: 2
    note: the template edit lands
    events:
      - spec.revision[new]: {component: engine, image: registry.example.com/runtime:v2}
  - tick: 3
    note: the run opens from the live policy and the unit arms at step 0; its capacity wait is clocked
    events:
      - ctrl.resync
  - tick: 4
    note: the wait outlives the ready timeout; the unit parks Failed with the stable revision serving
    events:
      - timer.readyTimeout: {slack: 1s}
  - tick: 5
    note: the pass reads the copy from before the park; it decides from that record and the flush keeps the live one, so the pass requeues without writing its decision
    events:
      - pass.staleRecord
  - tick: 6
    note: the pin is lost and the policy is deleted in the same tick; with no body to execute the run layer parks the plan and the unit is not dispatched, so its record, phase and split freeze in the park
    events:
      - clock.advance: 1m
      - run.lost
      - plan.unresolved: {name: canary-policy}
  - tick: 7
    note: a later pass finds the same park; nothing moves the unit
    events:
      - clock.advance: 1m
      - ctrl.resync
