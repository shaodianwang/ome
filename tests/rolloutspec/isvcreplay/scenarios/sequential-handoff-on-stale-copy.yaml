scenario: sequential-handoff-on-stale-copy
cells:
  - coordination/SeqAwaiting/ctrl.staleRead[phaseRegressed]/before
  - coordination/SeqAwaiting/timer.soak/boundary@T-await-soak
  - coordination/Surging/member.converged/before
intentional: >-
  the previous member finished and the group entered its soak window; the
  next pass reads a copy whose entry still shows that member Surging, sees
  the hand-off again, restamps the transition time the state-side soak is
  measured from, and the flush copies the restarted clock over the live
  entry, so the next member is released later than the live entry said
initial:
  service:
    components:
      decoder: {replicas: 1, image: registry.example.com/runtime:v1}
      engine: {replicas: 2, image: registry.example.com/runtime:v1}
    groups:
      - components: [decoder]
        soak: 5m
      - components: [engine]
  config: {requeue: 10s, parkedRequeue: 1m}
timeline:
  - tick: 1
    note: a settled service; the two single-Component groups collapse into one Sequential group
  - tick: 2
    note: both templates are edited at once
    events:
      - spec.revision[new]: {component: decoder, image: registry.example.com/runtime:v2}
      - spec.revision[new]: {component: engine, image: registry.example.com/runtime:v2}
  - tick: 3
    note: the run opens; the decoder rolls first and the engine's bump is deferred
    events:
      - ctrl.resync
  - tick: 4
    note: the decoder converges in one tick; the engine is next but the soak holds the group Awaiting from the hand-off instant
    events:
      - member.surgePodCreated: {component: decoder}
      - member.readyOnTarget: {component: decoder}
      - member.oldPodsGone: {component: decoder}
      - member.converged: {component: decoder}
  - tick: 5
    note: three minutes later the pass reads the copy from before the hand-off; the merge sees the decoder leave Surging again and restamps the transition time
    events:
      - clock.advance: 3m
      - ctrl.staleRead[phaseRegressed]
  - tick: 6
    note: the soak measured from the restamped transition time elapses; the engine is released
    events:
      - timer.soak: {slack: 1s}
