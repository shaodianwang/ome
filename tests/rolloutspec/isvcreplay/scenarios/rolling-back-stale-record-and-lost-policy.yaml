scenario: rolling-back-stale-record-and-lost-policy
cells:
  - canary/RollingBack/pass.staleRecord/before
  - canary/RollingBack/plan.unresolved/before
intentional: >-
  the operator rolls back the serving split; a pass that reads the copy from
  before the rejection re-decides from the serving record and the flush keeps
  the live one, while the revert signal the dispatch wrote before stands on
  the replica, and once the policy stops resolving the unit is not dispatched:
  the revert's completion is never read and the signal is neither re-asserted
  nor cleared
initial:
  service:
    components:
      engine: {replicas: 2, image: registry.example.com/runtime:v1}
    groups:
      - components: [engine]
        policyRef: {name: canary-policy, progression: canary}
  policies:
    - name: canary-policy
      spec:
        canary:
          scaleDownDelaySeconds: 600
          steps:
            - {capacity: "50%", traffic: 10, pause: {}}
            - {capacity: "100%", traffic: 100}
  config: {requeue: 10s, parkedRequeue: 1m, defaultReadyTimeout: 10m, rolloutPolicyEnabled: true}
timeline:
  - tick: 1
    note: a settled service; the policy resolves and the unit reads Stable
  - tick: 2
    note: the template edit lands
    events:
      - spec.revision[new]: {component: engine, image: registry.example.com/runtime:v2}
  - tick: 3
    note: the run opens from the live policy and the unit arms at step 0
    events:
      - ctrl.resync
  - tick: 4
    note: the staged Instance is Ready; the split serves at 10% under the manual pause
    events:
      - capacity.reached: {component: engine}
  - tick: 5
    note: the operator rolls back; the rejection is recorded, traffic returns to the stable revision and the replica is pointed at its stable ControllerRevision
    events:
      - verb.rollback
  - tick: 6
    note: the pass reads the copy from before the rejection; it decides from that record and the flush keeps the live one, so the pass requeues without writing its decision
    events:
      - pass.staleRecord
  - tick: 7
    note: the pin is lost and the policy is deleted in the same tick; with no body to execute the run layer parks the plan and the unit is not dispatched, so its record, phase and split freeze in the revert
    events:
      - clock.advance: 1m
      - run.lost
      - plan.unresolved: {name: canary-policy}
  - tick: 8
    note: a later pass finds the same park; nothing moves the unit
    events:
      - clock.advance: 1m
      - ctrl.resync
