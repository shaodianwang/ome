scenario: promotion-lands-before-the-run-opens
cells:
  - revision/Settled/replica.targetBumped/before
  - revision/Settled/replica.currentPromoted[roll]/before
  - revision/Behind/write.coordRolledOut/before
  - revision/Behind/write.coordReady/before
intentional: >-
  the replica promotes its current revision in the pass that first reads
  the edit fresh, so no run opens: the record trails the promotion for the
  length of that pass, and coordination catches it up on the one revision
  with Ready pods, demoting the prior latest to previous
initial:
  service:
    components:
      engine: {replicas: 2, image: registry.example.com/runtime:v1}
    groups:
      - components: [engine]
        blueGreen: {}
  config: {requeue: 10s, parkedRequeue: 1m}
timeline:
  - tick: 1
    note: a settled service records its one revision and no run
  - tick: 2
    note: the template edit lands; the projection catches up one pass behind it, so the run layer waits and the record follows no target
    events:
      - spec.revision[new]: {component: engine, image: registry.example.com/runtime:v2}
  - tick: 3
    note: the replica has promoted its current revision before the run layer reads the pair fresh; nothing diverges, no run opens, and coordination records the promoted revision with the prior latest as previous
    events:
      - ir.converged: {component: engine}
  - tick: 4
    note: a resync changes nothing
    events:
      - ctrl.resync
