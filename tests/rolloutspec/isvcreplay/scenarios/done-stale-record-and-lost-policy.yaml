scenario: done-stale-record-and-lost-policy
cells:
  - canary/Done/pass.staleRecord/before
  - canary/Done/plan.unresolved/before
intentional: >-
  the cutover landed, the promoted revisions are recorded and the unit reads
  Stable with its sentinel kept; a pass that reads the copy from before the
  cutover re-decides it and the flush keeps the live record, the run closes
  Completed, and once the policy stops resolving the unit is not dispatched,
  which changes nothing a finished unit still does
initial:
  service:
    components:
      engine: {replicas: 2, image: registry.example.com/runtime:v1}
    groups:
      - components: [engine]
        policyRef: {name: canary-policy, progression: canary}
  policies:
    - name: canary-policy
      spec:
        canary:
          scaleDownDelaySeconds: 600
          steps:
            - {capacity: "50%", traffic: 10, pause: {}}
            - {capacity: "100%", traffic: 100}
  config: {requeue: 10s, parkedRequeue: 1m, defaultReadyTimeout: 10m, rolloutPolicyEnabled: true}
timeline:
  - tick: 1
    note: a settled service; the policy resolves and the unit reads Stable
  - tick: 2
    note: the template edit lands
    events:
      - spec.revision[new]: {component: engine, image: registry.example.com/runtime:v2}
  - tick: 3
    note: the run opens from the live policy and the unit arms at step 0
    events:
      - ctrl.resync
  - tick: 4
    note: the staged Instance is Ready; the split serves at 10% under the manual pause
    events:
      - capacity.reached: {component: engine}
  - tick: 5
    note: the operator promotes; the record advances to the final step and waits on its capacity
    events:
      - verb.promote: {component: engine}
  - tick: 6
    note: the final step's capacity already stands, so 100% shifts onto it; the held stable Instance drains through the window
    events:
      - ctrl.resync
  - tick: 7
    note: the window elapsed with the capacity Ready; the sentinel is set and partition 0 projected
    events:
      - clock.advance: 11m
      - ctrl.resync
  - tick: 8
    note: the released Instance rolled; every member stands on the target, which the dispatch reads on the next pass
    events:
      - pod.lastStableRolled: {component: engine}
  - tick: 9
    note: every member serves on its target alone; the promoted revisions are recorded, the stable identity dropped and the unit reads Stable
    events:
      - ctrl.resync
  - tick: 10
    note: the pass reads the copy from before the cutover; it decides the same cutover from that record and the flush keeps the live one, so the pass requeues without writing its decision
    events:
      - pass.staleRecord
  - tick: 11
    note: the run closes Completed on the Stable unit and the converged replica
    events:
      - ctrl.resync
  - tick: 12
    note: the policy is deleted after the run closed; with no pin to fall back on the run layer parks the plan and the unit is not dispatched, which a finished unit does not notice
    events:
      - clock.advance: 1m
      - plan.unresolved: {name: canary-policy}
  - tick: 13
    note: a later pass finds the same park; nothing moves the unit
    events:
      - clock.advance: 1m
      - ctrl.resync
