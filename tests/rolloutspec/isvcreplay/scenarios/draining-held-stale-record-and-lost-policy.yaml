scenario: draining-held-stale-record-and-lost-policy
cells:
  - canary/Draining/Held/pass.staleRecord/before
  - canary/Draining/Held/plan.unresolved/before
intentional: >-
  the final step shifted 100% behind a bare pause; a pass that reads the copy
  from before the shift re-decides it and the flush keeps the live record, and
  once the policy stops resolving the unit is not dispatched: the held gate
  freezes at 100% and nobody re-reads it
initial:
  service:
    components:
      engine: {replicas: 2, image: registry.example.com/runtime:v1}
    groups:
      - components: [engine]
        policyRef: {name: canary-policy, progression: canary}
  policies:
    - name: canary-policy
      spec:
        canary:
          scaleDownDelaySeconds: 600
          steps:
            - {capacity: "50%", traffic: 10, pause: {}}
            - {capacity: "100%", traffic: 100, pause: {}}
  config: {requeue: 10s, parkedRequeue: 1m, defaultReadyTimeout: 10m, rolloutPolicyEnabled: true}
timeline:
  - tick: 1
    note: a settled service; the policy resolves and the unit reads Stable
  - tick: 2
    note: the template edit lands
    events:
      - spec.revision[new]: {component: engine, image: registry.example.com/runtime:v2}
  - tick: 3
    note: the run opens from the live policy and the unit arms at step 0
    events:
      - ctrl.resync
  - tick: 4
    note: the staged Instance is Ready; the split serves at 10% under the manual pause
    events:
      - capacity.reached: {component: engine}
  - tick: 5
    note: the operator promotes; the record advances to the final step and waits on its capacity
    events:
      - verb.promote: {component: engine}
  - tick: 6
    note: the final step's capacity already stands, so 100% shifts onto it; the held stable Instance drains through the window
    events:
      - ctrl.resync
  - tick: 7
    note: the pass reads the copy from before the 100% shift; it decides from that record and the flush keeps the live one, so the pass requeues without writing its decision
    events:
      - pass.staleRecord
  - tick: 8
    note: the pin is lost and the policy is deleted in the same tick; with no body to execute the run layer parks the plan and the unit is not dispatched, so its record, phase and split freeze in the held gate
    events:
      - clock.advance: 1m
      - run.lost
      - plan.unresolved: {name: canary-policy}
  - tick: 9
    note: a later pass finds the same park; nothing moves the unit
    events:
      - clock.advance: 1m
      - ctrl.resync
