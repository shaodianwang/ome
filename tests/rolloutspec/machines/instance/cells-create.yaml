  # --- kubelet admission and slow readiness ---------------------------------
  - state: Create/CreatePods
    event: pod.admissionRejected
    windows: [before]
    outcome: transition
    to: Create/CreatePods
    guard: the rejected pod holds one of the attempt's target names, the attempt's deadline has not elapsed, and its outstanding expectations are satisfied
    note: a rejection is phase Failed, so query.IsTerminalPod reads the name as missing and ops/terminal_recycle.go deletes the occupant with the expectation recorded first; terminalPodTermination captures the pod-level status.reason onto LastFailure, so the kubelet's refusal is legible rather than a bare PodFailed. The create is withheld this pass and the name is rebuilt once the delete is observed, paced inside the attempt by the same-target retry ladder. Environment-caused throughout - the node's capacity accounting refused a pod the revision renders correctly, so no RetryBlock is charged
    placement: kind
    coverage: {perm: [], unit: [TestQueryPodAdmissionRejected], kind: []}
    status: current
  - state: Create/CreatePods
    event: pod.admissionRejected
    windows: [boundary, after]
    outcome: defer
    note: the recycle is a pod delete that leaves phase and step where they are, so a re-observed rejection lands on the same row and is either paced by the ladder or satisfied by the delete already in flight
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Create/CreatePods
    event: pod.runningNotReady
    variants: [source]
    outcome: defer
    note: a readiness wait is evidence, never a decision input - the promote needs every pod PodReady with its minReadySeconds window elapsed and simply keeps returning, so the attempt's operation deadline is the only exit. What changes is what that exit records - the deadline disposition names the limbo pod, its first unready container and the readiness condition's message under reason ContainersNotReady instead of a bare DeadlineExceeded, and names the unsatisfied readiness gates under reason ReadinessGateNotSatisfied for the other limbo, where the containers are ready and only the gate keeps the pod out of its Service. The blame is unaffected - readiness limbo is ambiguous between the revision and the node, so it is excluded from the workload-caused set and the relocation branch still runs first where its conditions hold. A pod set with any container parked in a waiting state suppresses the classification outright, because the kubelet already named that failure (pkg/controller/v1beta1/workload/ops/create.go, pkg/controller/v1beta1/workload/escalation/deadline.go)
    placement: kind
    coverage: {perm: [], unit: [TestPodRunningNotReady_ExcludesWaitingContainers, TestEscalation_DeadlineWithRunningNotReadyPod_NamesTheProbe, TestEscalation_RunningNotReadyBeforeDeadline_Untouched], kind: []}
    status: current
