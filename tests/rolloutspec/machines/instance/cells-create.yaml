  # --- Failed/Create (planned): a Create attempt ended by the gang verdict
  # with its committed operation kept. The engine resolves this shape to
  # Failed. Entered through the parent cell Create/CreatePods ·
  # gang.podGroup[OwnershipConflict]. "source" is a pod of the attempt's set.
  #
  # No pass re-drives the row at the revision the ended attempt pinned: the
  # Create pass leaves it, podless or standing, and the update trigger
  # withholds the pinned revision, so no surge or recreate opens to it, no
  # podless restamp cycles against the foreign name, and a set that comes up
  # is adopted by nobody. The row leaves through a lost member under
  # RecreateInstanceOnPodRestart, a revision other than the pinned one - a
  # recreate in place under every strategy, since a never-promoted row has
  # no source for a surge to keep - the reset mailbox, a scale-down or the
  # teardown. Each cell below says what its event does on its own.
  - {state: Failed/Create, event: pod.scheduled, variants: [source], outcome: ignore, note: "binding is observation only; the verdict is about the PodGroup name, not the nodes, and nothing reads a bound member on a row no pass re-drives", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [create-failed-paused-set-observations]}, status: decided}
