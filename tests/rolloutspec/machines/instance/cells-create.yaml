# Cells for Create/CreatePods — the write-ahead marker an Instance carries
# from the moment its Creating status commits until the pass promotes it to
# Ready, retires it, or the escalation pass fails it.
#
# Two properties shape most of the outcomes below. First, the Create pass is
# the last op pass to run and it is its own detector: it re-lists pods every
# reconcile and acts on the diff, so an event that merely changes the pod set
# is absorbed inside the same attempt instead of moving the row. Second, the
# promote clears the one bar every path shares: the pod set is complete, every
# pod is PodReady, and the minReadySeconds window has elapsed. Each of those is
# only one guard of the bar, so none of them commits the promote on its own.
#
# Two edges leave this state under another pass's ownership: a shrink makes
# the index a scale-down extra even mid-create (T-create-scaledown), and a
# gang that keeps a survivor is claimed by the restart pass, which runs
# before Create (T-create-gang-restart).
cells:
  - state: Create/CreatePods
    event: pod.scheduled
    variants: [source]
    outcome: ignore
    note: binding is a counter observation; the pass still waits for the whole set to clear the promote bar, and the only side effect is that an ungated pod restarts the parked operation deadline from admission
    placement: perm
    coverage: {perm: [], unit: [TestReconcileGatedDeadlines_RestartsOnUngate], kind: [], replay: [hold-unschedulable-then-gang, hold-unschedulable-then-nodeunknown]}
    status: current

  - state: Create/CreatePods
    event: pod.containersReady
    variants: [source]
    windows: [before]
    outcome: transition
    to: Ready
    guard: the observation completes the set — every expected pod exists, every one of them is PodReady, and the minReadySeconds window has elapsed; a partial or not-yet-available set leaves the row in CreatePods and requeues
    note: the promote writes the serving gate on each pod first, then commits Phase Ready with the operation cleared, stamping RunningRevision only when every pod carries the target revision hash. Create shares the one promote bar with every other path
    placement: kind
    coverage: {perm: [], unit: [TestCreate_AllPodsReady_FlipsServingAndMarksReady, TestCreate_AllPodsExistButNotReady_HoldsCreating], kind: []}
    status: decided

  - state: Create/CreatePods
    event: pod.containersReady
    variants: [source]
    windows: [boundary, after]
    outcome: ignore
    note: the Ready mutation is idempotent and returns no-change once the row is already Ready with no operation, so a repeat observation of the same readiness writes nothing
    placement: perm
    coverage: {perm: [], unit: [TestCreate_BatchedReadyPromotionsUseOneMutationBatch], kind: []}
    status: current

  - state: Create/CreatePods
    event: pod.ready
    variants: [source]
    outcome: ignore
    note: PodReady is half of the promote bar the create shares with every other path; it commits nothing on its own, because the set must also be complete and past its minReadySeconds window
    placement: kind
    coverage: {perm: [], unit: [TestCreate_AllPodsReady_FlipsServingAndMarksReady, TestCreate_PromotionWaitsOutTheWindowAndRequeuesAtItsRemainder], kind: []}
    status: decided

  - state: Create/CreatePods
    event: pod.servingOn
    variants: [source]
    outcome: ignore
    note: the promote is what flips the gate, so observing it back is a no-op; a pod already serving is skipped when the next pass re-walks the set
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current

  - state: Create/CreatePods
    event: pod.servingOff
    variants: [source]
    outcome: ignore
    note: a freshly created pod is rendered with the lifecycle hold in place, so the gate is already off; another writer re-adding a hold is simply re-cleared when the pass promotes
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current

  - state: Create/CreatePods
    event: pod.deleted
    variants: [source]
    windows: [before]
    outcome: transition
    to: Restart/Drain
    guard: RecreateInstanceOnPodRestart, a multi-pod Instance that still has a surviving member, no RetryBlock denying the rebuild revision, and the attempt's pinned revision still the roll target
    note: partial gang loss hands the whole Instance to the restart pass, which runs ahead of Create and which the create gate defers to; an attempt pinned to a superseded revision is not repaired - the restart pass yields it and the Create pass retires it into a fresh attempt at the target (T-create-retire-superseded); every other shape — single pod, total loss, or a policy without instance recreate — stays in this state and the missing pod is re-created inside the same attempt at the same operation and deadline, unless a Held block denies the revision that pod would carry
    placement: unit
    coverage: {perm: [], unit: [TestCreate_RecreateInstance_DefersPartialGangToRestart, TestCreate_NonRecreatePolicy_SelfHealsMissingPod, TestCreate_PartialPods_CreatesOnlyMissing, TestCreate_RetryBlockHeld_DeniesRemainderOfInFlightAttempt, TestRepairYieldsToTarget], kind: [], replay: [T-create-gang-restart]}
    status: decided

  - state: Create/CreatePods
    event: pod.deleted
    variants: [source]
    windows: [boundary, after]
    outcome: ignore
    note: the restart hand-off is re-derived from the live pod read on every pass, so a deletion observed while it commits changes nothing; the row either already carries the Restart operation or the next pass re-selects it
    placement: perm
    coverage: {perm: [], unit: [TestCreate_RecreateInstance_DefersInterruptedGangMaterialization], kind: []}
    status: current

  - state: Create/CreatePods
    event: pod.waiting
    variants: [ImagePullBackOff, ErrImagePull, InvalidImageName, CreateContainerConfigError]
    windows: [before]
    outcome: escalate
    to: Failed
    guard: the pod has held the reason past the stuck-pod grace and the pod set is not fully serving; a shorter dwell keeps the attempt polling
    note: a Create attempt is always disposable, so the fast escalator routes it through the disposition, which records a RetryBlock against the attempt's pinned revision and clears the operation in one write; the pin is what keeps a corrective revision from being charged for the bad one
    invariants: [one.operation.per.instance]
    placement: perm
    coverage: {perm: [], unit: [TestDispose_WorkloadCaused_EachReason, TestDispose_PinnedCreateUsesAttemptRevisionAfterCorrectiveEdit, TestEscalateStuckPodFailures_DisposesSinglePodWorkloadCaused], kind: [], replay: [T-create-stuck]}
    status: decided

  - state: Create/CreatePods
    event: pod.waiting
    variants: [ImagePullBackOff, ErrImagePull, InvalidImageName, CreateContainerConfigError]
    windows: [boundary, after]
    outcome: ignore
    note: the escalation pass skips a row that already reads Failed, so the same wedged pod raises the operator event exactly once
    placement: perm
    coverage: {perm: [], unit: [TestExpireOperations_AlreadyFailedNoOp], kind: []}
    status: current

  - state: Create/CreatePods
    event: pod.waiting
    variants: [CreateContainerError, CrashLoopBackOff, RunContainerError]
    windows: [before]
    outcome: escalate
    to: Failed
    guard: the pod has held the reason past the stuck-pod grace and the pod set is not fully serving
    note: these reasons are terminal but ambiguous between a bad revision and bad hardware. The node is blamed only for a revision some Instance has served (a row whose RunningRevision is the attempt's target, a sibling serving it now or this Instance before the attempt) — then the disposition records a relocation directive when migration is automatic, the attempt sits on one resolvable node and the budget allows; a revision nobody has served is its own suspect, so the attempt disposes terminal with no node blame and leaves no exclusion for a corrected revision to inherit. Either way the operation is cleared and the row stamps Failed. The crash loop reads the same under either face the pass catches it in, parked in CrashLoopBackOff or Running again between two crashes with the restarts on its status. A terminal disposition counts the attempt on the target revision's RetryBlock toward lifecycle.updateRetry.maxAttempts like any failed attempt, so the Create is paced by the block and denied once the revision is Held; with no updateRetry configured it writes no RetryBlock and the Create pass re-materializes the row on the next pass
    placement: unit
    coverage: {perm: [], unit: [TestExpireOperations_SinglePodCrashLoopRecordsDirective, TestDispose_RelocationDirective_GPUCase, TestDispose_CrashLoopOnServedRevisionBlamesTheNode, TestDispose_Terminal, TestDispose_Terminal_WaveCountsOnTheLadder, TestFirstCrashLoopingPod_ReadsBothFacesOfTheLoop], kind: []}
    status: decided

  - state: Create/CreatePods
    event: pod.waiting
    variants: [CreateContainerError, CrashLoopBackOff, RunContainerError]
    windows: [boundary, after]
    outcome: ignore
    note: an already-Failed row is skipped by the escalation pass and a relocation directive is deduplicated on replay, so a repeat observation adds nothing
    placement: perm
    coverage: {perm: [], unit: [TestDispose_RelocationDirective_ReplayDedup], kind: []}
    status: current

  - state: Create/CreatePods
    event: pod.waiting
    variants: [DeadlineExceeded]
    outcome: defer
    note: this reason is not in the terminal waiting set the fast escalator matches, so there is no fast path; the pod keeps its name slot, the pass cannot replace it, and the attempt runs out on the operation deadline instead
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current

  - state: Create/CreatePods
    event: pod.containerRestart
    outcome: ignore
    note: restart evidence is Ready-gated — a container that dies while the Instance is still forming is the ordinary boot path, and the trigger only compares restarts against ReadySince, which this row has not stamped yet
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current

  - state: Create/CreatePods
    event: pod.uidRotated
    outcome: defer
    note: the pass addresses pods by name, so a same-name replacement is adopted on the next list; only a rotation that lands between this pass's list and its serving-gate write trips the identity guard, which fails the promote and retries it on the requeue
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current

  - state: Create/CreatePods
    event: pod.stuckTerminating
    outcome: defer
    note: the pod read is not filtered on deletionTimestamp, so a wedged terminating pod still occupies its name slot and the pass sees nothing missing to create; there is no force-delete path outside the scale-down pipeline, so the attempt converges only when the pod finally goes or the operation deadline elapses
    placement: kind
    coverage: {perm: [], unit: [], kind: []}
    status: current

  - state: Create/CreatePods
    event: pod.nodeLost
    outcome: defer
    note: node loss produces no fast evidence of its own for a pod that never reached Ready; the pass keeps polling and the operation deadline is what ends the attempt, at which point the disposition may record a relocation directive so the rebuild is steered off the suspect node, provided the revision has served on some Instance. A pod of the attempt that had reached Ready before its node went silent has its Ready withdrawn by the control plane and is freed by the silent-kubelet sweep at the policy's threshold, as a Ready row's pod is (see Ready/pod.nodeLost), and the same attempt rebuilds the name
    placement: perm
    coverage: {perm: [], unit: [TestDispose_RelocationDirective_GPUCase], kind: []}
    status: current

  - state: Create/CreatePods
    event: pod.schedulingGated
    outcome: defer
    note: a pod queued by an external admission authority is waiting, not stuck — the parking step zeroes the operation deadline on the gate-enter and the escalation pass skips the row outright, so the attempt can queue indefinitely without failing
    placement: perm
    coverage: {perm: [], unit: [TestReconcileGatedDeadlines_ParksGatedInstance, TestGatedInstance_NotFailedByDeadlineBackstop, TestEscalation_AdmissionGatedInstance_DeadlineSkipped], kind: []}
    status: current

  - state: Create/CreatePods
    event: pod.evicted
    outcome: ignore
    note: eviction resolves into the same two shapes as a plain deletion — once the object is gone the freed name is re-created inside the same attempt, and a gang that keeps a survivor hands off to the restart pass; while the evicted object lingers it holds its slot and the attempt waits
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current

  - state: Create/CreatePods
    event: spec.revision
    windows: [before]
    outcome: transition
    to: Create/CreatePods
    guard: the attempt's pinned revision is not the roll target, or an unpinned attempt's pod label proves it belongs to another revision
    note: a superseded spec is not a failure of the retired revision, so the half-built attempt is retired straight into a fresh Create at the new target — the operation is replaced in one write with no Failed phase, no failure event and no RetryBlock, for a single pod and for a gang alike. An attempt whose pin still matches is untouched and finishes, and three shapes are held back from retirement — an attempt whose pods are all runtime-ready is one promote from serving, so it promotes and the update machinery rolls it through a surge instead; a row with a recorded RunningRevision is a serving materialization being rebuilt, which is the update machinery's business and never Create's; and a retirement onto a revision the RetryBlock currently denies is deferred, because the replacement is a fresh attempt that gate would refuse, which would tear the old attempt down with nothing to take its place. The pods the retired attempt leaves behind are the fresh attempt's to clear — it takes a still-routed one out of rotation first and deletes it on a later pass, so a gang is never mixed-revision and no pod is dropped while it is still carrying traffic
    invariants: [one.operation.per.instance]
    placement: perm
    coverage:
      perm: []
      unit:
        - TestCreate_SupersededAttempt_ReplacedByFreshAttempt
        - TestCreate_FreshAttemptRecreatesRetiredPodsAtItsRevision
        - TestCreate_RuntimeReadyAttemptPromotesRatherThanRetiring
        - TestCreate_RetargetOntoBlockedRevisionDefersRetirement
        - TestCreate_PromotedInstanceRepairIsNotRetired
        - TestCreate_BatchesSupersededAttemptRetirement
        - TestCreate_CorrectiveEditDuringPartialGangDoesNotMixRevisions
        - TestCreate_CorrectiveEditDoesNotAdoptUnpinnedPartialGang
      kind: []
      replay: [create-superseded]
    status: decided

  - state: Create/CreatePods
    event: spec.revision
    windows: [boundary, after]
    outcome: ignore
    note: the replacement mutation is preconditioned on the incarnation and the exact operation id and target, so it no-ops once the attempt has already been replaced, and a further move is picked up by the fresh attempt on the next pass
    placement: perm
    coverage: {perm: [], unit: [TestCreate_AdoptsUnpinnedAttemptWithoutPods], kind: []}
    status: decided

  - state: Create/CreatePods
    event: spec.annotationOnly
    outcome: ignore
    note: excluded annotations and labels are outside the hashed template, so the target revision is unchanged and the attempt keeps its pin
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current

  - state: Create/CreatePods
    event: spec.strategy
    outcome: ignore
    note: the Create pass renders and promotes identically under every update strategy; the new strategy first matters on the first update after this Instance reaches Ready
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current

  - state: Create/CreatePods
    event: spec.replicasUp
    outcome: ignore
    note: new indices are materialized as their own rows and this attempt is untouched; the per-pass scale-up pod batch may hold the new indices for a later wave, which never stalls an attempt already committed
    placement: unit
    coverage: {perm: [], unit: [TestCreate_BatchedFreshStartsHonorConfiguredCapAndCommitBeforePods, TestCreate_BatchedWavesAdvancePastOversizedGangAndConverge], kind: []}
    status: current

  - state: Create/CreatePods
    event: spec.replicasDown
    windows: [before]
    outcome: transition
    to: Delete/Drain
    guard: the index is beyond the new desired set and the scale-down wave admits it
    note: scale-down selection runs before every other pass and does not exempt a Creating row, so an index that leaves the desired set mid-create is drained and removed rather than finished; a wave that defers the victim leaves the row in CreatePods untouched for that pass
    placement: unit
    coverage: {perm: [], unit: [TestPlan_ScaleDown_SelectsExtras, TestReconcileFreshScaleDownAdmissionEndsThePass], kind: [], replay: [create-scaledown]}
    status: decided

  - state: Create/CreatePods
    event: spec.replicasDown
    windows: [boundary, after]
    outcome: ignore
    note: the scale-down admission and the Delete stamp land in one status transaction, and a deferred victim receives no lifecycle mutation at all, so there is no half-applied shape for a late observation to act on
    placement: perm
    coverage: {perm: [], unit: [TestExecuteActiveScaleDownExcludesDeferredExtrasFromEscalation], kind: []}
    status: decided

  - state: Create/CreatePods
    event: spec.pauseTrue
    outcome: ignore
    note: pause blocks new operations and new steps, never a step already under way, so a half-built set is completed at its pinned revision and promoted; holding a complete set unpromoted would leave the Instance with nothing serving, which is exactly what a pause may not do. The hold applies to the next operation, and an attempt the pass would retire rather than finish is that next operation — a first materialization committed to a revision the Component no longer converges to is left exactly where it is and retired on the unpause, since replacing it is a new attempt. A Create attempt never carries the Paused token — what the pause holds is the operation after it, not this one
    placement: unit
    coverage: {perm: [], unit: [TestPlan_Paused_RepairRunsFleetChangesDoNot, TestPlan_Create_AlwaysPlannedUnlessPaused], kind: []}
    status: decided

  - state: Create/CreatePods
    event: spec.pauseFreeze
    outcome: ignore
    note: the in-flight create finishes at its pinned revision exactly as under a standard pause; what freeze adds is that the restart pass no longer repairs a gang that loses a member mid-materialization
    placement: unit
    coverage: {perm: [], unit: [TestPlan_Paused_RepairRunsFleetChangesDoNot], kind: []}
    status: decided

  - state: Create/CreatePods
    event: spec.unpause
    outcome: ignore
    note: a committed attempt the pause let finish is already done; one the pause left alone because the pass would retire it is retired on the first unpaused pass, and an index with no row at all is materialized then. A resuming attempt keeps the operation and the pinned revision it was never stripped of, and a deadline parked by a hold re-arms with a full window measured from the unpause rather than from the original start, so the hold does not eat the attempt's budget
    placement: perm
    coverage: {perm: [], unit: [TestReconcileGatedDeadlines_RestartsOnUngate], kind: []}
    status: decided

  - state: Create/CreatePods
    event: spec.teardown
    windows: [before]
    outcome: transition
    to: Delete/Drain
    guard: the owner carries a deletionTimestamp, so the planned index set is treated as empty and every observed index becomes a scale-down extra
    note: teardown bypasses the pause gate and every op pass including escalation; the mid-create row is drained by the scale-down pipeline like any other, and its pods are deleted rather than allowed to finish coming up
    placement: unit
    coverage: {perm: [], unit: [TestReconcile_Teardown_DeletesEveryObservedInstance, TestReconcile_Teardown_IgnoresPaused], kind: [], replay: [create-teardown]}
    status: current

  - state: Create/CreatePods
    event: spec.teardown
    windows: [boundary, after]
    outcome: ignore
    note: teardown is re-derived from the owner's deletionTimestamp on every reconcile and the Delete stamp is idempotent, so a late observation re-enters the same branch with nothing left to do
    placement: unit
    coverage: {perm: [], unit: [TestReconcile_Teardown_PodlessInstances_RemovedAndDone], kind: []}
    status: current

  - state: Create/CreatePods
    event: spec.migrateRequest
    outcome: defer
    note: a fresh migration record refuses to stamp Migrating unless the source is a steady Ready with a recorded running revision, precisely so a mid-create stamp cannot deadlock the Create pass; the record stays Accepted, ownership is not taken, and the pass falls through so the attempt can converge first
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current

  - state: Create/CreatePods
    event: spec.partition
    outcome: ignore
    note: the partition hold is evaluated only inside the update selection, so it can hold a revision roll but never a materialization; a held index still gets its pods created and promoted
    placement: unit
    coverage: {perm: [], unit: [TestPlan_Update_HeldByPartition], kind: []}
    status: current

  - state: Create/CreatePods
    event: spec.releaseHeldRevision
    outcome: defer
    note: the mailbox rewrites the Component's RetryBlock and never touches a row; a Held block denies every pod at its revision, including the ones this attempt has yet to create, so the release is what lets the attempt finish its set on the next pass (pkg/controller/v1beta1/inferencereplica/release_held.go)
    placement: unit
    coverage: {perm: [], unit: [TestCreate_RetryBlockReleased_RebuildsMissingMember], kind: []}
    status: decided

  - state: Create/CreatePods
    event: gate.deny
    variants: [Held]
    outcome: defer
    note: the pods an attempt has not created yet are pods at the held revision like any other, so a block that goes Held while this attempt is mid-materialization stops the rest of its set. The attempt is not parked - nothing records an external wait - so its own deadline stays the backstop that ends the wedge, which is what fails the row through the record rather than holding it open
    placement: unit
    coverage: {perm: [], unit: [TestCreate_RetryBlockHeld_DeniesMissingMemberRebuild], kind: []}
    status: decided

  - state: Create/CreatePods
    event: timer.operationDeadline
    windows: [before]
    outcome: escalate
    to: Failed
    guard: the deadline elapsed, the operation carries no external waiting token and no pod of the attempt is held by an admission scheduling gate, and the pod set is not fully serving
    note: the broad backstop for an attempt that never converges; a Create attempt is always disposable, so the disposition classifies it — RetryBlock against the pinned revision for a workload-caused pod, a relocation directive for a single-node ambiguous failure of a revision some Instance has served, terminal otherwise — and clears the operation so the next pass can start fresh. An attempt the disposition leaves un-disposed still records the blamed pod's workload-caused waiting reason on LastFailure when one exists, so the cause survives the teardown that deletes the pod. Where no container named a failure but a pod ran every container without ever reporting ContainersReady, the evidence names that pod, its first unready container and the readiness condition's own message under reason ContainersNotReady; the branch is unchanged by it, since readiness limbo is ambiguous between the revision and the node and so charges no ladder. The other readiness limbo is named the same way — a pod whose containers all run and report ContainersReady but whose Ready condition never follows, because a readiness gate it declares stays unsatisfied, is recorded under reason ReadinessGateNotSatisfied with the unsatisfied gates and the Ready condition's own message. It is equally evidence only — the gate can be one nobody owns, one a second writer holds, or the serving gate this pass has not written — so it selects no branch and relocation keeps first try. Only an attempt with none of these kinds of evidence falls back to the bare DeadlineExceeded diagnostic. An op pass that errors elsewhere in the Component does not suppress this stamp - the end-of-pass escalation runs after every eligible pass and re-derives its evidence per Instance from the snapshot, so a rejected or shed write on another row cannot hold this one past its timeout
    invariants: [one.operation.per.instance]
    placement: perm
    coverage: {perm: [], unit: [TestEscalation_DeadlineElapsedBelowDesiredServing_StillEscalates, TestExpireOperations_GangCreateDisposed, TestEscalation_DeadlineWithRunningNotReadyPod_NamesTheProbe, TestEscalation_DeadlineWithCrashLoopPod_KeepsAmbiguousBlame, TestExecuteErroredSiblingKeepsRelocationFirstTry], kind: []}
    status: decided

  - state: Create/CreatePods
    event: timer.operationDeadline
    windows: [boundary, after]
    outcome: ignore
    note: the deadline stamp no-ops on a row that is already Failed or whose operation has since been cleared, so a promote that landed first keeps the Instance Ready and the elapsed deadline is simply dropped
    placement: perm
    coverage: {perm: [], unit: [TestExpireOperations_AlreadyFailedNoOp, TestExpireOperations_NoOperationUntouched, TestExpireOperations_ExactBoundary], kind: []}
    status: current

  - state: Create/CreatePods
    event: timer.minReady
    outcome: defer
    note: the elapsed window releases the last promote guard but commits nothing by itself; the next pass re-checks that the set is complete and every pod PodReady before stamping Ready
    placement: perm
    coverage: {perm: [], unit: [TestCreate_PromotionWaitsOutTheWindowAndRequeuesAtItsRemainder], kind: []}
    status: decided

  - state: Create/CreatePods
    event: timer.expectationsTTL
    outcome: ignore
    note: an expired expectation reads as satisfied, which only removes a throttle — the next pass re-lists, creates whatever is genuinely missing, and tolerates AlreadyExists when the watch was merely late
    placement: sim
    coverage: {perm: [], unit: [TestCreate_IdempotentOnAlreadyExists], kind: []}
    status: current

  - state: Create/CreatePods
    event: ctrl.crash
    outcome: ignore
    note: the operation is committed before any pod create precisely so a crash is recoverable from status alone; the rebuilt pass re-lists pods, creates only the missing ones and promotes from observation, and the lost expectation cache costs nothing but a throttle
    placement: kind
    coverage: {perm: [], unit: [TestCreate_RecreateInstance_DefersInterruptedGangMaterialization], kind: []}
    status: current

  - state: Create/CreatePods
    event: ctrl.staleRead
    outcome: defer
    note: outstanding create expectations hold the pod create until the watch catches up, so a lagging cache does not produce a duplicate; if the expectation is already gone the duplicate create is absorbed as AlreadyExists instead
    placement: sim
    coverage: {perm: [], unit: [TestCreate_IdempotentOnAlreadyExists], kind: []}
    status: current

  - state: Create/CreatePods
    event: api.conflict
    outcome: defer
    note: every status and readiness-gate write re-reads its object inside a conflict-retry loop, so a losing write is re-applied against fresh state; an exhausted loop returns the error, the committed Creating row and its created pods are left in place, and the attempt continues on the requeue
    placement: sim
    coverage: {perm: [], unit: [TestCreate_BatchedCreatingPersistenceFailureCreatesNoPods, TestCreate_BatchedReadyPersistenceFailureRestoresFailFastServingPrefix], kind: []}
    status: decided

  - state: Create/CreatePods
    event: api.alreadyExists
    outcome: ignore
    note: a create that races the watch cache is tolerated — the expectation is released and the pod already in the apiserver is adopted by name, because the name is derived from the index, runner and ordinal rather than generated
    placement: sim
    coverage: {perm: [], unit: [TestCreate_IdempotentOnAlreadyExists], kind: []}
    status: current

  - state: Create/CreatePods
    event: api.notFound
    outcome: ignore
    note: a missing owner is reported as owner-gone and ends the pass without any further write, which is the correct outcome while the owner is being collected; a pod read that 404s is simply absent from the next list and re-created
    placement: perm
    coverage: {perm: [], unit: [TestCreate_BatchedMissingStatusOwnerCreatesNoPods], kind: []}
    status: current

  - state: Create/CreatePods
    event: api.quotaDenied
    outcome: defer
    note: a ResourceQuota refusal is classified as capacity-blocked rather than returned opaquely - the committed Creating row and any pods already created are left alone, the refusal is recorded on the operation and the InstanceReadyTimeout deadline parks on that pass, while the QuotaExceeded waiting token names the wait from the next one. The record is retired by the first pass whose creates all land, which re-arms the deadline from that moment and releases the token on the pass after; the pass itself ends quietly on the create requeue instead of escalating controller-runtime backoff
    placement: perm
    coverage: {perm: [], unit: [TestCreate_BatchedPodCreateFailureStopsAndRollsBackUnattemptedInstances, TestCreate_BatchedPodCreateFailureRestoresPriorUnattemptedStatus], kind: []}
    status: decided

  - state: Create/CreatePods
    event: pod.unschedulable
    variants: [source]
    outcome: defer
    guard: the row is not fully serving and its operation carries no other authority's waiting token except an operator pause, which a fact about the Instance takes the row from; the hold lasts while lifecycle.unschedulableGracePeriod is unconfigured or unelapsed, and past it the attempt is failed environment-caused
