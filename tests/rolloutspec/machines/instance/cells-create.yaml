    note: a 422 on a pod create is permanent - the same revision reproduces it byte for byte - so the attempt ends here rather than at the deadline. The rejection classifies as workload-caused - LastFailure carries InvalidPodSpec plus the apiserver's own explanation, a RetryBlock is recorded against the attempt's target revision before the operation is cleared, and Phase goes Failed in one write. A corrected revision is admitted immediately; the held one is not
