    decided_in: pkg/controller/v1beta1/workload/escalation/escalation.go
    note: the escalation pass stamped the failure; a disposed Create attempt, and a disposed recreate or in-place Update attempt whose own pods are gone, also had its operation cleared, while a gang surge keeps its operation for the abandon path to consume. A disposed recreate or in-place attempt whose own pod set is still alive keeps its operation on the parked step (Update/Parked) - Operation.Waiting names the wait the next attempt stands behind and the deadline is parked - and the row reads this state while that set is gone, parked in the kubelet's back-off or unready past the stuck-pod grace, and Update/Parked once it serves, a restart in place inside the grace moving nothing; the roll re-opens the row as a fresh start once the wait ends, and the Create pass does once the set is gone. A kept Restart operation records a parked repair, which keeps two exits of its own - the restart pass resumes its promote when the rebuilt set comes up, and re-arms it on the operator's retry ladder while the set stays wedged - besides the gang-member-loss trigger that re-arms over it and the operator reset mailbox that clears it outright
    not_applicable:
      timer.migrationDeadline: a migration record that failed its Instance is already terminal
