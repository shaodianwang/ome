    applies: {strategies: [SurgeThenDrain, RecreatePod, InPlaceIfPossible, InPlaceOnly], shape: [single, gang]}
    decided_in: pkg/controller/v1beta1/workload/escalation/escalation.go
    note: the escalation pass stamped the failure; a disposable single-pod Create or Update attempt also had its operation cleared, while a gang surge and a multi-pod recreate keep theirs for the owning machine to consume. A kept Restart operation records a parked repair, which keeps two exits of its own - the restart pass resumes its promote when the rebuilt set comes up, and re-arms it on the operator's retry ladder while the set stays wedged - besides the gang-member-loss trigger that re-arms over it and the operator reset mailbox that clears it outright
    not_applicable:
      timer.migrationDeadline: a migration record that failed its Instance is already terminal
  - id: Create/CreatePods
