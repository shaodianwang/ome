    op: {type: Create, step: CreatePods}
    applies: {strategies: [SurgeThenDrain, RecreatePod, InPlaceIfPossible, InPlaceOnly], shape: [single, gang]}
    decided_in: pkg/controller/v1beta1/workload/ops/create.go
    note: write-ahead marker committed before any pod create; the attempt pins its target revision so a failure is charged to the right RetryBlock subject
    not_applicable:
      timer.repairRetry: a parked repair's re-arm is measured from a Restart parking at Failed, and this row holds no parked repair
      spec.resetInstances: the reset verb addresses Failed Instances only, so a row in any other phase is skipped before anything about it is read
      timer.retryAt: a backoff coming due opens an attempt, and this row already carries one
      timer.migrationDeadline: no operation pins this index to a migration record
