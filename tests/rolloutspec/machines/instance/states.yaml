      endpoint.rotationIn: no pod is attributed to an index with no status row
      endpoint.rotationOut: no pod is attributed to an index with no status row
      timer.stuckPodGrace: no pod is attributed to an index with no status row
      timer.forceDelete: no pod is attributed to an index with no status row
      timer.operationDeadline: no operation is in flight
      timer.minReady: no pod has become Ready
      timer.expectationsTTL: no expectation has been seeded for an index that was never created
      spec.resetInstances: the reset verb addresses an Instance through its status row, and an index with no row is answered as no such instance
      timer.migrationDeadline: no operation pins this index to a migration record
      gate.allow: the coordination update gate is consulted only for an Instance the update trigger selected
      gate.deny: the coordination update gate is consulted only for an Instance the update trigger selected
  - id: Pending
    phase: Pending
    applies: {strategies: [SurgeThenDrain, RecreatePod, InPlaceIfPossible, InPlaceOnly], shape: [single, gang]}
    decided_in: pkg/controller/v1beta1/workload/reconcile.go
    note: status-only demotion of a Ready row with no live pods and no operation, written by the paused truth pass and by the status publication at the end of every pass; the running revision is kept for the pass that rebuilds the row
    not_applicable:
      timer.repairRetry: a parked repair's re-arm is measured from a Restart parking at Failed, and this row holds no parked repair
      spec.resetInstances: the reset verb addresses Failed Instances only, so a row in any other phase is skipped before anything about it is read
      timer.operationDeadline: no operation is in flight
      timer.migrationDeadline: no operation pins this index to a migration record
      gate.allow: the update trigger declines below Ready, so the coordination gate is never consulted for this row
      gate.deny[Plan]: the update trigger declines below Ready, so the coordination gate is never consulted for this row
      gate.deny[Pairing]: the update trigger declines below Ready, so the coordination gate is never consulted for this row
      gate.deny[Ratio]: the update trigger declines below Ready, so the coordination gate is never consulted for this row
      gate.deny[Sequential]: the update trigger declines below Ready, so the coordination gate is never consulted for this row
      gate.deny[Budget]: the update trigger declines below Ready, so the coordination gate is never consulted for this row
      gate.deny[RetryBlock]: a backoff still running and a live one-at-a-time authorization both govern the opening of an attempt, and this row rebuilds what it lost rather than opening one
