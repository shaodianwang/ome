      gate.deny[RetryBlock]: a backoff still running and a live one-at-a-time authorization both govern the opening of an attempt, and this row is the attempt they authorized
      pod.ready[target]: no replacement generation exists outside a surge or migration pair
      pod.scheduled[target]: no replacement generation exists outside a surge or migration pair
