    phase: ""
    applies: {strategies: [SurgeThenDrain, RecreatePod, InPlaceIfPossible, InPlaceOnly], shape: [single, gang]}
    decided_in: pkg/controller/v1beta1/workload/plan_decision.go
    note: no status row exists for the index, or the row is the fresh-empty slot the status writer's append path hands out
    not_applicable:
      timer.repairRetry: a parked repair's re-arm is measured from a Restart parking at Failed, and this row holds no parked repair
      pod.scheduled: no pod is attributed to an index with no status row
      pod.containersReady: no pod is attributed to an index with no status row
      pod.ready: no pod is attributed to an index with no status row
