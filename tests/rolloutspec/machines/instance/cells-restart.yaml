# Cells for Restart/Drain — repair under RecreateInstanceOnPodRestart at the
# Instance's running revision. One persisted step spans all three phases of
# the repair: drain plus delete of the old incarnation (A), recreate at the
# bumped incarnation (B), and the serving flip before promotion (C). Which
# phase an event lands in is therefore a guard on this state, never a state
# of its own.
#
# A shrink that puts a restarting index beyond the desired set stamps
# Delete/Drain over Restart/Drain (T-restart-scaledown): the extras scan
# excludes only Migrate-owned rows and the delete admission overwrites
# whatever phase it finds.
cells:
  # --- pod, source generation ---------------------------------------------
  - state: Restart/Drain
    event: pod.scheduled
    variants: [source]
    outcome: ignore
    note: the pass re-derives its phase from the live pod set on every wake-up, so a fresh pod binding to a node is progress toward the readiness wait rather than a step boundary
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [restart-rebuilt-pod-signals-ignored]}
    status: current
  - state: Restart/Drain
    event: pod.containersReady
    variants: [source]
    windows: [before]
    outcome: transition
    to: Ready
    guard: old-incarnation pods are gone on the live read, the bumped-incarnation set is complete, every pod is PodReady, and the minReadySeconds window has elapsed
    note: Phase C writes the serving gate on the fresh pods, then promotes with ReadySince restamped and the operation cleared once the rebuilt set clears the one promote bar every path shares (ops/restart.go)
    invariants: [one.operation.per.instance]
    placement: perm
    coverage: {perm: [], unit: [TestRestart_ConvergesAcrossPasses, TestRestart_CreatesNewPodAtBumpedIncarnation], kind: []}
    status: current
  - state: Restart/Drain
    event: pod.containersReady
    variants: [source]
    transition: T-restart-recycle-terminal
    outcome: defer
    note: the recycle returns before the recreate, so the promote is not evaluated on the pass that issues the delete; readiness on the surviving members is re-read once the dead name is free and its pod rebuilt
    placement: sim
    coverage: {perm: [], unit: [], kind: [], replay: [restart-gang-member-dies-during-rebuild]}
    status: current
  - state: Restart/Drain
    event: pod.containersReady
    variants: [source]
    transition: T-restart-ready
    outcome: ignore
    note: the promote consumed the readiness and cleared the operation, so a repeated report finds a Ready row and writes nothing
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [restart-promoted-row-ignores-late-signals]}
    status: current
  - state: Restart/Drain
    event: pod.containersReady
    variants: [source]
    windows: [boundary]
    transition: T-restart-deadline
    outcome: transition
    to: Ready
    note: the restart pass runs before the end-of-pass escalation, so a promote landing in the same reconcile clears the operation and the buffered Failed stamp no-ops on the cleared operation (workload/deadline.go)
    placement: sim
    coverage: {perm: [], unit: [], kind: [], replay: [restart-promote-deadline-race]}
    status: current
  - state: Restart/Drain
    event: pod.containersReady
    variants: [source]
    windows: [after]
    transition: T-restart-deadline
    outcome: transition
    to: Ready
    note: the row is Failed with the Restart operation preserved, and the restart pass resumes the promote from there once the rebuilt set is complete, at the row's incarnation and ContainersReady - serving gate, then Ready on the running revision with the spent operation cleared, no new attempt (T-failed-repair-resume); a gang short of a member instead re-arms the whole Restart over the spent attempt, and a set still wedged waits for the retry ladder
    placement: unit
    coverage:
      perm: []
      unit: [TestRestart_DeadlineFailedRowResumesItsPromote]
      kind: []
    status: decided
  - state: Restart/Drain
    event: pod.containersReady
    variants: [source]
    windows: [boundary]
    transition: T-restart-stuck
    outcome: transition
    to: Ready
    note: same ordering as the deadline race — the promote clears the operation before the stuck-pod stamp is applied, and the fully-serving guard skips the stamp for a healthy pod set (workload/escalation.go)
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Restart/Drain
    event: pod.containersReady
    variants: [source]
    windows: [after]
    transition: T-restart-stuck
    outcome: transition
    to: Ready
    note: the row is Failed with the Restart operation preserved, and the restart pass resumes the promote from there once the rebuilt set is complete, at the row's incarnation and ContainersReady (T-failed-repair-resume); the kubelet's retry succeeding once the cause is gone is exactly this readiness
    placement: unit
    coverage:
      perm: []
      unit: [TestSpentRepair_RebuiltSetComesUp_ResumesThePromote]
      kind: [failed_repair_heal]
    status: decided
  - state: Restart/Drain
    event: pod.containersReady
    variants: [source]
    transition: T-restart-teardown
    outcome: ignore
    note: the teardown branch runs the scale-down pipeline alone, so no restart pass observes the readiness (workload/reconcile.go)
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [restart-teardown-with-readiness]}
    status: current
  - state: Restart/Drain
    event: pod.containersReady
    variants: [source]
    windows: [boundary, after]
    transition: T-restart-scaledown
    outcome: ignore
    note: the index has left the planned set, so the scale-down wave claims it whatever its pods report; a completed recreate no longer keeps it alive
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [restart-scaledown-then-teardown]}
    status: current
  - state: Restart/Drain
    event: pod.ready
    variants: [source]
    outcome: ignore
    note: PodReady is one guard of the promote bar the repair shares with every other path; it commits nothing on its own, because the bumped set must also be complete, serving and past its minReadySeconds window
    placement: kind
    coverage: {perm: [], unit: [TestRestart_PromotionWaitsForPodReadyAndWindow], kind: []}
    status: current
  - state: Restart/Drain
    event: pod.servingOn
    variants: [source]
    outcome: ignore
    note: Phase C owns the flip and skips a pod that already serves; an old-incarnation pod that reappears in rotation is marked not-serving again by Phase A
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [restart-rebuilt-pod-signals-ignored]}
    status: current
  - state: Restart/Drain
    event: pod.servingOff
    variants: [source]
    outcome: ignore
    note: Phase A's own drain write; the pass then polls the per-revision routed Service endpoints before deleting, and a fresh pod that drops out of rotation is marked serving again by Phase C
    placement: perm
    coverage: {perm: [], unit: [TestRestart_DrainOldPod_FlipsServingFalse], kind: []}
    status: current
  - state: Restart/Drain
    event: pod.deleted
    variants: [source]
    windows: [before]
    outcome: ignore
    note: the in-flight restart owns the pod set — Phase A counts the deletion as drain progress and Phase B recreates any missing pod at the bumped incarnation; the loss-below-Ready trigger excludes Phase Restarting, so no second restart is armed
    placement: perm
    coverage: {perm: [], unit: [TestRestart_DeletesOldPodOnceDrained, TestRestart_ConvergesAcrossPasses, TestDeadlineElapsesAsTheDrainDeletes_RepairKeepsItsPodSet], kind: []}
    status: decided
  - state: Restart/Drain
    event: pod.deleted
    variants: [source]
    windows: [boundary, after]
    outcome: ignore
    note: the transition's own write owns the row, and a loss seen at or after it is evaluated against the state that landed — a Ready row arms a fresh restart, and a Failed row arms one too when a gang member is missing, because a preserved Restart operation is a spent attempt rather than an owner
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [restart-repeats-after-promote]}
    status: current
  - state: Restart/Drain
    event: pod.waiting
    variants: [ImagePullBackOff, ErrImagePull, InvalidImageName, CreateContainerConfigError, CreateContainerError, CrashLoopBackOff, RunContainerError]
    windows: [before]
    outcome: escalate
    to: Failed
    guard: the reason is in the terminal waiting set, the pod is at the row's incarnation, it has held the reason past StuckPodGrace since its waiting episode began, and the pod set is not fully serving
    note: the fast escalation stamps Phase Failed with the waiting reason and the pod's termination detail on LastFailure and preserves the operation, since a Restart attempt is never disposed (workload/escalation.go). A pod of the incarnation before the row's is the set the repair drains and deletes - the repair owns it until the rebuild runs - so its wedge is the repair's reason and never fails the row (evidence.AttemptStuckPods), and a stamp decided on an observation older than the repair's claim is withheld on the fresh row (status.StampFailedOnStuckPod); a row never holds a Restart operation at Failed with no pod set behind it
    placement: perm
    coverage: {perm: [], unit: [TestRestart_CapturesLastFailureBeforeDrain], kind: [], replay: [restart-stuck]}
    status: decided
  - state: Restart/Drain
    event: pod.waiting
    variants: [ImagePullBackOff, ErrImagePull, InvalidImageName, CreateContainerConfigError, CreateContainerError, CrashLoopBackOff, RunContainerError]
    windows: [boundary, after]
    outcome: ignore
    note: the stamp is idempotent and the escalation pass skips an already-Failed row, so repeated evidence writes nothing
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [restart-wedge-stamp-repeats-nothing]}
    status: current
  - state: Restart/Drain
    event: pod.waiting
    variants: [DeadlineExceeded]
    outcome: defer
    guard: the pod is still Running
    note: DeadlineExceeded is outside the terminal waiting set, so the fast escalation ignores it and the step holds. Once the container death drives the pod to phase Failed the recycle claims it instead - the name is freed and rebuilt - so the operation deadline is the only exit for a pod that keeps the reason while still Running (workload/escalation.go, ops/terminal_recycle.go)
    placement: sim
    coverage: {perm: [], unit: [TestEscalation_RestartDeadlineExceededWaiting_NoFastFail], kind: []}
    status: decided
  - state: Restart/Drain
    event: pod.containerRestart
    outcome: ignore
    note: restart evidence is read only for a Ready row, a Restarting row re-selects unconditionally, and the promote restamps ReadySince so a container restart during the recreate never reads as a post-Ready failure
    placement: perm
    coverage: {perm: [], unit: [TestDetectRestartTrigger_RunnerRestartAfterReady, TestDetectRestartTrigger_BootRestartsForgiven], kind: []}
    status: decided
  - state: Restart/Drain
    event: pod.uidRotated
    outcome: ignore
    note: the pass partitions pods by the incarnation label and addresses the recreate by name, so a pod that reappears under a new UID is reclassified on the next wake-up — an old-incarnation reappearance is drained and deleted, a bumped-incarnation one satisfies the recreate
    placement: sim
    coverage: {perm: [], unit: [], kind: [], replay: [restart-rebuild-ignores-edits]}
    status: current
  - state: Restart/Drain
    event: pod.stuckTerminating
    outcome: defer
    note: Phase A blocks on the live old-pod check until the object disappears. The Component-wide force-delete sweep runs ahead of every verb pass, the restart pass included, so under a configured policy it frees the name at the overdue-slack or node-death clock and Phase B rebuilds; with none configured nothing frees the name and the operation deadline is this state's single exit - a pod deleting past its own deletion deadline is live for the stamp, so the elapsed deadline parks the repair at Failed with the Restart kept, and the close waits on the object going away
    placement: kind
    coverage: {perm: [], unit: [TestRepairDrainStuckTerminatingOnADeadNode_ParksAtTheDeadline, TestEscalation_RestartDeadlineParksOnlyALiveSet], kind: [], replay: [restart-drain-stuck-pod-swept-at-node-death, restart-old-pod-stuck-terminating]}
    status: current
  - state: Restart/Drain
    event: pod.nodeLost
    outcome: defer
    note: pods on a lost node stay Terminating and hold Phase A on the same drain check; node-death evidence is read for them by the Component-wide force-delete sweep under a configured policy, never by the repair itself, and with no policy no node is read, so the row waits on the object until the operation deadline parks the repair
    placement: kind
    coverage: {perm: [], unit: [TestRepairDrainStuckTerminatingOnADeadNode_ParksAtTheDeadline], kind: [], replay: [restart-drain-stuck-pod-swept-at-node-death, restart-old-pod-stuck-terminating]}
    status: current
  - state: Restart/Drain
    event: pod.schedulingGated
    outcome: defer
    note: a gated pod parks the operation deadline and the escalation pass skips a gated Instance, so the recreate waits for admission with no clock running
    placement: perm
    coverage: {perm: [], unit: [TestReconcileGatedDeadlines_RestartsOnUngate], kind: []}
    status: current
  - state: Restart/Drain
    event: pod.evicted
    outcome: transition
    to: Restart/Drain
    guard: the evicted pod carries the bumped incarnation and the attempt's deadline has not elapsed; an evicted old-incarnation pod is simply drained and deleted by Phase A
    note: an eviction leaves the pod in phase Failed, so the recycle in ops/terminal_recycle.go treats it as absent, deletes the dead occupant with the expectation recorded first and frees the name for Phase B to rebuild on a later pass; the attempt's own deadline still bounds how many recycles it gets
    placement: sim
    coverage: {perm: [], unit: [TestRestart_RecyclesEvictedNewIncarnationPod], kind: []}
    status: decided

  # --- operator edits ------------------------------------------------------
  - state: Restart/Drain
    event: spec.revision
    outcome: defer
    guard: a rebuild that has created no pod of its own yet renders the roll target when the row is off it, the roll could start on it - not paused, not Held - and the canary step's projected partition does not hold the Instance, and the row records the target before the first create; a rebuild whose pods exist renders the stored template of the revision it stamped, label and content alike
    note: an open repair is driven on whatever the target says. While no pod of the rebuild exists the Instance serves nothing and the rebuild is the pass that puts it on the target (ops/restart.go rebuildFollowsTarget), so the Instance comes back once, on the fix, with the row's revision and the pods' labels naming it, no pod of the superseded revision is created after the push, and the update pass finds the row on target at Ready; the roll's budget is not charged, since no serving capacity was removed for it. Once a pod of the rebuild exists the repair finishes on the revision those pods carry and the update pass takes the row from Ready, because tearing down a starting pod set is the roll's job under its budget. A pause or a Held target keeps every rebuild on the revision the row records, as the roll it would follow cannot start. An Instance the canary step's partition holds keeps the revision it records as well, since it is the step's stable side, which the step machine alone promotes, so the rebuild never grows the canary by one Instance beyond the step. A recorded revision whose ControllerRevision is gone rebuilds nothing - the pass announces RepairRevisionGone once per attempt and the attempt runs to its deadline - because rendering the moved template under the old label would route, count and drain one revision while running another
    placement: perm
    coverage: {perm: [], unit: [TestPlan_Restart_OpenRepairIsDrivenWhateverTheTarget, TestRepairYieldsToTarget, TestDetectUpdateTrigger_NewTargetAgainstACrashLoopRepair, TestReconcile_OpenRepair_TargetMovesBeforeTheCreate, TestReconcile_OpenRepair_TargetMovesAfterThePodsExist, TestReconcile_OpenRepair_PeersStayInRotationWhileTheTargetMoves, TestRepair_RebuildsTheRevisionItStamps_UnderPause, TestRestart_RebuildWithNoPodYetFollowsTheTarget, TestRestart_RebuildWithNoPodYetKeepsTheRevisionTheCanaryStepHolds, TestRestart_RendersTheStampedRevisionTemplate, TestStoredTemplate_RendersTheRevisionItNames, TestReconcile_PushedGangCrashesAfterPromotion_RollbackLandsOnItsRepair], kind: [crashloop_open_repair_retarget], replay: [restart-retarget]}
    status: decided
  - state: Restart/Drain
    event: spec.annotationOnly
    outcome: ignore
    note: an excluded annotation or label leaves the revision hash alone, and the repair reads only the Instance's running revision
    placement: unit
    coverage: {perm: [], unit: [], kind: [], replay: [restart-rebuild-ignores-edits]}
    status: current
  - state: Restart/Drain
    event: spec.strategy
    outcome: ignore
    note: the repair path never consults lifecycle.updateStrategy; the edited strategy applies to the next update the Instance takes from Ready
    placement: unit
    coverage: {perm: [], unit: [], kind: [], replay: [restart-strategy-edit-ignored]}
    status: current
  - state: Restart/Drain
    event: spec.replicasUp
    outcome: ignore
    note: the repair keeps this index while the Create pass materializes the other fresh indices from a plan that excludes every restart selection (planExcludingRestartSelections)
    placement: perm
    coverage: {perm: [], unit: [TestReconcile_ScaleUpDuringRestart_CreatesFreshIndices, TestReconcile_ScaleUpDuringRestart_ExcludesRestartSelectedCreateOwner, TestScaleUp_BesideAnOpenRepair_AddsExactlyOneInstance], kind: [scale_up_beside_open_repair]}
    status: decided
  - state: Restart/Drain
    event: spec.replicasDown
    windows: [before]
    outcome: transition
    to: Delete/Drain
    guard: the index falls beyond the desired set and the scale-down wave admits it within its pod budget
    note: scale-down is selected ahead of the restart pass and the delete admission stamps Deleting with a Delete Drain operation over the restart's
    placement: perm
    coverage: {perm: [], unit: [TestPlan_ScaleDownPrecedesRestart, TestScaleDown_BesideAnOpenRepair_RemovesTheBrokenInstanceFirst], kind: [], replay: [restart-scaledown]}
    status: current
  - state: Restart/Drain
    event: spec.replicasDown
    windows: [boundary, after]
    outcome: ignore
    note: a shrink seen at or after the transition's write is re-evaluated against the state that landed
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [restart-promoted-then-scaled-down]}
    status: current
  - state: Restart/Drain
    event: spec.pauseTrue
    outcome: ignore
    note: a standard pause plans scale-down and repair only, so the restart keeps converging at the running revision while updates and creates are held. Repair is not what an ordinary pause holds, so the attempt takes no Paused token and its clock keeps running with it; a pause suspends the escalation pass, so the elapsed deadline is consumed once the pause is cleared, while the hold pass that runs before it goes on recording and releasing what the authorities observe throughout
    placement: perm
    coverage: {perm: [], unit: [TestPlan_Paused_RepairRunsFleetChangesDoNot, TestPause_LandsOnAnOpenGangRestart_APushDuringTheHoldRollsItAfterTheUnpause], kind: []}
    status: decided
  - state: Restart/Drain
    event: spec.pauseFreeze
    outcome: defer
    note: freeze suspends the repair pass, but the step already under way still runs to its boundary — pods the repair deleted are recreated at the bumped incarnation — so no Instance is left with nothing serving; the hold lands after that, carrying Operation.Waiting=Paused with its deadline parked
    placement: perm
    coverage: {perm: [], unit: [TestPlan_Paused_RepairRunsFleetChangesDoNot, TestPauseFreeze_LandsOnAnOpenGangRestart_TheRepairFinishesUnderIt], kind: []}
    status: decided
  - state: Restart/Drain
    event: spec.unpause
    outcome: ignore
    note: the restart pass is planned again and resumes at the same step from its durable operation; a Paused token, which only a freeze puts on a repair, is released and the deadline it parked re-arms with a full window measured from the unpause
    placement: perm
    coverage: {perm: [], unit: [TestPauseFreeze_LandsOnAnOpenGangRestart_TheRepairFinishesUnderIt], kind: []}
    status: current
  - state: Restart/Drain
    event: spec.teardown
    windows: [before]
    outcome: transition
    to: Delete/Drain
    guard: the owner carries a deletionTimestamp so every observed index is treated as a scale-down extra
    note: the teardown branch runs the scale-down pipeline alone — no pause gate, no repair, no escalation (workload/reconcile.go)
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [restart-teardown]}
    status: current
  - state: Restart/Drain
    event: spec.teardown
    windows: [boundary, after]
    outcome: ignore
    note: the delete operation owns the row once its stamp lands, and teardown is re-asserted on every pass regardless
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [restart-scaledown-then-teardown]}
    status: current
  - state: Restart/Drain
    event: spec.migrateRequest
    outcome: defer
    note: the migrate pass requires a steady source — Phase Ready, no operation, a recorded running revision — so a request against a restarting Instance stays an unallocated record and is re-picked after the promote
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [restart-migrate-request-waits]}
    status: current
  - state: Restart/Drain
    event: spec.partition
    outcome: ignore
    note: rollingUpdate.partition holds update dispatch for the selected Instances; repair is never partitioned, but a rebuild that has created no pod yet keeps the revision its row records while the canary step's projected partition holds the Instance, instead of following the roll target
    placement: unit
    coverage: {perm: [], unit: [TestRestart_RebuildWithNoPodYetKeepsTheRevisionTheCanaryStepHolds], kind: []}
    status: decided

  # --- timers --------------------------------------------------------------
  - state: Restart/Drain
    event: timer.operationDeadline
    windows: [before]
    outcome: escalate
    to: Failed
    guard: the deadline elapsed, no pod of the Instance is held by an admission scheduling gate, the pod set is not in rotation at the desired count (every live pod PodReady with the serving gate), and a pod of the Instance is live on a fresh read - not deleting, or deleting past its own deletion deadline
    note: a Restart attempt is not disposable, so the stamp keeps the operation and records on LastFailure the blamed pod's workload-caused waiting reason when one exists, falling back to the bare DeadlineExceeded diagnostic when none does, because the teardown that follows deletes the blamed pods. Two readiness limbos are named rather than left bare — a pod that ran every container without ever reporting ContainersReady is recorded under reason ContainersNotReady, and a pod whose containers all report ready but whose Ready condition never follows a readiness gate it declares is recorded under reason ReadinessGateNotSatisfied with the unsatisfied gates. Both are evidence only and select no branch, since either limbo is ambiguous between the revision and the node. The preserved operation does not park the row for good, because a Restart parked at Failed is read as a spent attempt whose exits are read off its pod set - a rebuilt set that comes up resumes the promote, a wedged one re-arms on the ladder, and a gang short of a member re-arms through the lost-member trigger under a fresh deadline. A set the repair's drain has already deleted - every pod of the Instance gone, or deleting inside its own deletion deadline, on a fresh read - is the repair's until the rebuilt set exists, so the stamp waits for the pass that observes it (escalation.repairSetGone); a row never holds a Restart operation at Failed with no pod set behind it. A pod deleting past its own deletion deadline is not that delete in flight - a live kubelet removes a pod within moments of the deadline, and only its kubelet, a finalizer owner or the force-delete sweep ever will - so it is live for the stamp, and the elapsed deadline parks the repair with the Restart kept over the name it holds; the close on the object going away, or the sweep under a configured policy, is the way out
    placement: perm
    coverage: {perm: [], unit: [TestEscalation_RestartDeadlineElapsed_FailsInstance, TestEscalation_RestartDeadlineParksOnlyALiveSet, TestDeadlineElapsesAsTheDrainDeletes_RepairKeepsItsPodSet, TestDeadlineElapsesOnAWedgedRebuild_RepairParksWithItsPodSet, TestRepairDrainStuckTerminatingOnADeadNode_ParksAtTheDeadline, TestEscalation_RestartDeadlineWithGateWrittenButNeverReady_NamesTheGate, TestEscalation_RestartDeadlineWithOneGangMemberNeverReady_NamesItsGate, TestRestart_RebuiltPodGateWrittenButNeverReady_FailsAtTheDeadline], kind: [], replay: [restart-deadline, restart-running-not-ready-to-deadline, restart-old-pod-stuck-terminating]}
    status: decided
  - state: Restart/Drain
    event: timer.operationDeadline
    windows: [boundary, after]
    outcome: ignore
    note: the escalation pass skips an already-Failed row, and the stamp no-ops against a slot whose operation the promote cleared
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [restart-deadline-repeats-nothing]}
    status: current
  - state: Restart/Drain
    event: timer.minReady
    outcome: defer
    note: the elapsed window releases the last promote guard but commits nothing by itself; the next pass re-checks that the bumped set is complete, serving and PodReady before stamping Ready
    placement: perm
    coverage: {perm: [], unit: [TestRestart_PromotionWaitsForPodReadyAndWindow], kind: []}
    status: decided
  - state: Restart/Drain
    event: timer.expectationsTTL
    outcome: ignore
    note: the lapsed expectation releases the satisfied-guard that holds the delete and create batches, and the next pass re-derives the outstanding work from the live pod read
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current

  # --- controller and apiserver -------------------------------------------
  - state: Restart/Drain
    event: ctrl.crash
    outcome: ignore
    note: phase, operation and the bumped Incarnation are durable in status, so the next manager re-enters at the same step; the emptied expectation cache reports satisfied and the pass re-derives its phase from the live pod set
    placement: kind
    coverage: {perm: [], unit: [TestRestart_ConvergesAcrossPasses], kind: [], replay: [restart-resumed-from-status]}
    status: current
  - state: Restart/Drain
    event: ctrl.staleRead
    outcome: ignore
    note: the pass lists the Instance's pods through the cached client but re-checks the old set live before recreating and reads endpoints live during the drain, so a lagging cache costs a requeue rather than a double create
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [restart-rebuild-stale-cache]}
    status: current
  - state: Restart/Drain
    event: api.conflict
    outcome: ignore
    note: every status write goes through the adapter's conflict retry, and each phase of the repair is idempotent on re-entry
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [restart-rebuild-create-raced]}
    status: current
  - state: Restart/Drain
    event: api.alreadyExists
    outcome: ignore
    note: a pod create that races the cache is tolerated and the target counts as present, so the recreate converges without a second object
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [restart-rebuild-create-raced]}
    status: current
  - state: Restart/Drain
    event: api.notFound
    outcome: ignore
    note: a pod delete that reports NotFound counts as drained and the pass continues; an owner that has disappeared ends the reconcile through the owner-gone sentinel; a running revision whose ControllerRevision reads NotFound leaves the rebuild with no template to render, so the pass creates nothing rather than rendering the current template under that revision's label, announces RepairRevisionGone once per attempt, and the attempt runs to its deadline, from where the roll takes the row (ops/template.go)
    placement: perm
    coverage: {perm: [], unit: [TestRestart_HoldsWhenTheStampedRevisionIsGone, TestRepair_HoldsWhenTheStampedRevisionIsGone, TestStoredTemplate_GoneOrEmptyRevisionIsNotTheCurrentTemplate], kind: []}
    status: decided
  - state: Restart/Drain
    event: api.quotaDenied
    outcome: defer
    note: the refused Phase B create is classified as capacity-blocked, so the refusal is recorded on the operation and the InstanceReadyTimeout deadline parks on that pass, while the QuotaExceeded waiting token names the wait from the next one while it is held rather than counting a wait an operator controls against the repair. The pass ends quietly on the repair requeue, and the token is released on the first pass whose creates all land
    placement: perm
    coverage: {perm: [], unit: [TestRestartPhaseB_QuotaExceeded_WaitsWithoutFailing], kind: []}
    status: decided

  # --- pod, newly expressible inputs ---------------------------------------
  - state: Restart/Drain
    event: pod.unschedulable
    variants: [source]
    outcome: defer
    guard: the row is not fully serving and its operation carries no other authority's waiting token except an operator pause, which a fact about the Instance takes the row from; the hold lasts while lifecycle.unschedulableGracePeriod is unconfigured or unelapsed, and past it the attempt is failed environment-caused
    note: an unplaceable recreated pod holds Phase C on the runtime-ready check, and the hold pass records the Unschedulable waiting token on the Restart operation, which parks the clock so the repair is not failed for a placement the cluster cannot give it. The scheduler's message reaches LastFailure once per hold. Past the configured grace the attempt is failed with that message and no RetryBlock, since an unplaceable pod proves nothing about the pod template (ops/restart.go, escalation.go)
    placement: kind
    coverage: {perm: [], unit: [TestEscalation_UnschedulableRestartHoldsThenFailsPastGrace, TestPreemptedPod_ReturnsAndSaysWhyUntilPlaced], kind: []}
    status: decided
  - state: Restart/Drain
    event: pod.containersNotReady
    variants: [source]
    outcome: defer
    note: Phase C re-reads the bumped-incarnation set on every wake-up and promotes only over the one bar every path shares — every pod PodReady with its minReadySeconds window elapsed — and losing ContainersReady drops a pod below the first guard of it, so a regression withholds the promote until the deadline; a regression landing at or after a transition's write is re-evaluated against the state that landed (ops/restart.go)
    placement: kind
    coverage: {perm: [], unit: [], kind: [], replay: [restart-rebuilt-pod-readiness-regresses]}
    status: current
  - state: Restart/Drain
    event: pod.terminating
    variants: [source]
    outcome: defer
    note: Phase A skips re-deleting a pod that already carries a deletionTimestamp and keeps returning until the old object is gone from the live list; a bumped-incarnation pod that starts terminating counts as present for Phase B and not runtime-ready for Phase C, so the promote waits for it to disappear and be recreated (ops/restart.go)
    placement: kind
    coverage: {perm: [], unit: [], kind: [], replay: [restart-drain-waits-on-old-pod]}
    status: current
  - state: Restart/Drain
    event: pod.phaseTerminal
    variants: [Failed, Succeeded]
    windows: [before]
    outcome: transition
    to: Restart/Drain
    guard: the dead pod carries the bumped incarnation and holds one of the rebuild's target names, the attempt's deadline has not elapsed, and its outstanding expectations are satisfied; a terminal pod at the old incarnation is drained and deleted by Phase A like any other
    note: query.ExcludeTerminalPods makes the dead pod absent for Phase B's name diff and for the survivor count, so the recycle deletes it - expectation recorded before the delete, diagnostics captured onto LastFailure, TerminalPodRecycled warning - and returns before the recreate; the name is rebuilt on a later pass, paced inside the attempt by the same-target retry ladder (ops/terminal_recycle.go)
    placement: unit
    coverage: {perm: [], unit: [TestRestart_RecyclesSucceededNewIncarnationPod, TestRestart_RecyclesTerminalNewIncarnationPod, TestRestart_TerminalNewIncarnationPodIsNotPromoted], kind: [], replay: [restart-recycle-terminal]}
    status: decided
  - state: Restart/Drain
    event: pod.phaseTerminal
    variants: [Failed, Succeeded]
    windows: [boundary, after]
    outcome: defer
    note: the recycle writes no phase or step, so a re-observed terminal phase lands on the same row and is either paced by the ladder or already satisfied by the delete in flight
    placement: unit
    coverage: {perm: [], unit: [TestRestart_TerminalPodReobservedKeepsPhaseAndStep], kind: []}
    status: decided
  - state: Restart/Drain
    event: pod.phaseTerminal
    variants: [Unknown]
    outcome: defer
    guard: node death is proven - the Node object is gone, or has carried an unreachable taint or a NotReady condition past the threshold - and a force-delete policy is configured; with neither, the row holds instead of acting
    note: an Unknown pod is never recycled by name, because the node has stopped reporting rather than the pod having died and a returning kubelet may still be running it. It is routed to the force-delete sweep instead, the same authority pod.nodeLost answers to, which deletes it only on proven node death under a configured force-delete policy; until then the operation carries a NodeUnknown waiting token with its deadline parked, so the hold is visible rather than silently spending the attempt's budget, and the rebuild resumes on the resulting absence
    placement: sim
    coverage: {perm: [], unit: [TestRestart_UnknownPhasePodHoldsWithoutForceDeletePolicy, TestRestart_UnknownPhasePodForceDeletedOnProvenNodeDeath, TestNodeUnknown_HoldsATargetNameASilentNodeKeeps, TestRestart_UnknownPhasePodOnLiveNodeIsNeverDeleted], kind: []}
    status: decided
  - state: Restart/Drain
    event: pod.admitted
    outcome: ignore
    note: the gate-exit edge re-arms the parked operation deadline at now plus instanceReadyTimeout and the escalation pass stops skipping the row, so the recreate resumes on a fresh clock rather than a spent one (workload/deadline.go)
    placement: perm
    coverage: {perm: [], unit: [TestReconcileGatedDeadlines_RestartsOnUngate], kind: []}
    status: current
  - state: Restart/Drain
    event: pod.containersReady
    variants: [source]
    windows: [boundary]
    transition: T-restart-stuckgrace
    outcome: transition
    to: Ready
    note: same ordering as the other escalation races — the restart pass runs before the end-of-pass escalation, so the promote clears the operation and the fully-serving guard skips the stamp for a healthy pod set (workload/escalation.go)
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Restart/Drain
    event: pod.containersReady
    variants: [source]
    windows: [after]
    transition: T-restart-stuckgrace
    outcome: transition
    to: Ready
    note: the row is Failed with the Restart operation preserved, and the restart pass resumes the promote from there once the rebuilt set is complete, at the row's incarnation and ContainersReady (T-failed-repair-resume); the kubelet's retry succeeding once the cause is gone is exactly this readiness
    placement: unit
    coverage:
      perm: []
      unit: [TestSpentRepair_RebuiltSetComesUp_ResumesThePromote]
      kind: [failed_repair_heal]
    status: decided
  - state: Restart/Drain
    event: pod.containersReady
    variants: [source]
    windows: [boundary, after]
    transition: T-restart-teardown-deadline
    outcome: ignore
    note: the finalizer release deletes the owner and every InstanceStatus row with it, so no pass is left to observe the readiness (inferencereplica/teardown.go)
    placement: sim
    coverage: {perm: [], unit: [], kind: [], replay: [restart-teardown-deadline]}
    status: current

  # --- gang ----------------------------------------------------------------
  - state: Restart/Drain
    event: gang.podGroup
    variants: [Terminating]
    outcome: defer
    guard: the repair is in flight, the pod set is not fully serving, and no other authority except an operator pause already holds the operation's waiting token
    note: the deterministic name is still occupied by an object being collected, so Phase B withholds every member rather than enlisting a rebuilt pod in a group this owner does not yet control. The hold pass records the PodGroupTerminating waiting token, which parks the InstanceReadyTimeout clock, and the group is announced again on the pass after the old object is gone; the wait resolves itself and never escalates (inferencereplica/reconciler.go, podgroup/podgroup.go)
    invariants: [podgroup.before.pods]
    placement: unit
    coverage: {perm: [], unit: [TestEscalation_GangReadingsOnARepairRow], kind: []}
    status: decided
  - state: Restart/Drain
    event: gang.podGroup
    variants: [OwnershipConflict]
    outcome: escalate
    to: Failed
    guard: the repair is in flight to end and the pod set is not fully serving
    note: a group held by another owner is neither updated nor deleted, and nothing this controller does frees the name, so the repair ends on it - LastFailure carries PodGroupOwnershipConflict naming the foreign controller, Phase goes Failed and the Operation is preserved. ENVIRONMENT-CAUSED, so no RetryBlock is recorded, and the verdict is scoped to this row while the PodGroup pass finishes the other gangs (podgroup/podgroup.go)
    placement: unit
    coverage: {perm: [], unit: [TestEscalation_GangReadingsOnARepairRow], kind: []}
    status: decided
  - state: Restart/Drain
    event: gang.podGroup
    variants: [Deleted]
    outcome: ignore
    note: the PodGroup pass re-creates the deterministic group from the plan before the restart pass runs, and the surviving pods keep the group label, so the gang is re-announced without a step of its own; a gang waiting token the row was carrying is released in the same pass (gang/gang.go)
    invariants: [podgroup.before.pods]
    placement: kind
    coverage: {perm: [], unit: [TestEscalation_GangReadingsOnARepairRow], kind: []}
    status: decided
  - state: Restart/Drain
    event: gang.podGroup
    variants: [PhaseFailed]
    outcome: defer
    guard: the index is planned and its outcome belongs to this machine
    note: the gang scheduler's Failed phase is absorbing, so the PodGroup pass deletes the group and builds a fresh one on the next reconcile, withholding the rebuild's members meanwhile and emitting one PodGroupReset warning with the group's own failure message. The repair row is untouched - no phase change, no waiting token, no RetryBlock - and a member pod still phase Failed holds the reset back until Phase A's recycle removes it (gang/gang.go)
    placement: unit
    coverage: {perm: [], unit: [TestEscalation_GangReadingsOnARepairRow, TestGang_FailedPodGroupIsResetNotEscalated], kind: []}
    status: decided
  - state: Restart/Drain
    event: gang.podGroup
    variants: [Unschedulable, ScheduleTimeout]
    outcome: defer
    note: neither reading exists on the PodGroup the controller watches - the vendored gang scheduler writes no Unknown phase and no ScheduleStartTime - so there is no group-level clock to consult. A rebuilt gang that cannot be placed reaches the repair on its MEMBER PODS, as PodScheduled=False with reason Unschedulable, and the pod-level scheduler hold parks the clock on that (see pod.unschedulable)
    placement: sim
    coverage: {perm: [], unit: [TestObserveGang_SchedulingPhasesReportNothing], kind: []}
    status: decided

  # --- endpoints -----------------------------------------------------------
  - state: Restart/Drain
    event: endpoint.rotationIn
    variants: [source]
    outcome: defer
    note: Phase A polls the per-revision routed Service's EndpointSlices live before deleting, so an old pod that is still or again a ready endpoint holds the drain; a fresh pod entering rotation is the consequence of Phase C's serving flip and is not read back (ops/restart.go, workload/drain)
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [restart-drain-waits-on-old-pod]}
    status: current
  - state: Restart/Drain
    event: endpoint.rotationOut
    variants: [source]
    outcome: ignore
    note: absence from the ready endpoint set is the level Phase A polls for, so it releases the delete rather than being a step of its own; a fresh pod dropping out of rotation is re-marked serving by Phase C (ops/restart.go, workload/drain)
    placement: perm
    coverage: {perm: [], unit: [TestRestart_DeletesOldPodOnceDrained], kind: []}
    status: current

  # --- operator edits, newly expressible -----------------------------------
  - state: Restart/Drain
    event: spec.gangWidth
    variants: [grow]
    outcome: ignore
    note: Phase B enumerates the desired pod names from the live plan, so the wider set is filled at the bumped incarnation on the next pass, and the PodGroup pass raises MinMember ahead of it (ops/create.go expectedPodNamesForInstance, podgroup/podgroup.go)
    placement: sim
    coverage: {perm: [], unit: [], kind: [], replay: [restart-gang-width-grow]}
    status: current
  # GAP: a narrower width is supposed to retire the pods beyond it, and the
  # repair leaves them running and routable.
  - state: Restart/Drain
    event: spec.gangWidth
    variants: [shrink]
    outcome: ignore
    note: a shrink seen before Phase B converges cleanly because Phase A deletes every old-incarnation pod, but one seen after it leaves the extra bumped-incarnation pods live — Phase A deletes only old incarnations, Phase B only fills missing names, and Phase C then waits on those extras and marks them serving (ops/restart.go)
    placement: sim
    coverage: {perm: [], unit: [], kind: [], replay: [restart-gang-shrink-after-rebuild]}
    status: current
  - state: Restart/Drain
    event: spec.gangWidth
    variants: [runnerSetChanged]
    outcome: ignore
    note: the width half behaves as grow or shrink above, including the stranded-extras case; the shape flip also mints a revision and moves the pod-group label, so the recreated pods carry the new shape under the running revision's hash while the survivors keep the old one (ops/restart.go, ops/render.go)
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Restart/Drain
    event: spec.rollbackTarget
    outcome: defer
    note: the override moves the Component's roll target only; the recreate labels its pods with the Instance's running revision, so the rollback is taken up by the update pass once the promote lands Ready (ops/restart.go revisionHashForInstance)
    placement: unit
    coverage: {perm: [], unit: [], kind: [], replay: [restart-rollback-waits-for-promote]}
    status: current
  - state: Restart/Drain
    event: spec.policyTuning
    variants: [restartPolicy]
    windows: [before]
    outcome: ignore
    note: an open repair is driven to completion whatever the policy says — the policy governs whether a repair starts, and a half-drained Instance abandoned mid-repair is worse than one never repaired (ops/restart.go DetectRestartTriggerWithPods); the new policy is read against the Ready row the repair leaves and governs the next trigger
    placement: sim
    coverage: {perm: [], unit: [TestDetectRestartTrigger_OpenRepairKeepsDrivingUnderPolicyNone], kind: [], replay: [restart-policy-flip-mid-repair-ignored]}
    status: current
  - state: Restart/Drain
    event: spec.policyTuning
    variants: [restartPolicy]
    windows: [boundary, after]
    outcome: ignore
    note: the transition's own write owns the row, and the policy is re-read against the state that landed
    placement: sim
    coverage: {perm: [], unit: [], kind: [], replay: [restart-promoted-row-ignores-late-signals]}
    status: current
  - state: Restart/Drain
    event: spec.policyTuning
    variants: [instanceReadyTimeout]
    outcome: ignore
    note: the Restart operation's deadline is stamped once at entry and preserved by the skip-write guard, so a new value reaches this row only through the gate-exit re-arm; the PodGroup's ScheduleTimeoutSeconds is re-reconciled from it on the same pass, bounded by lifecycle.gangScheduleTimeout when the operator configured one and passed through unbounded when none is set (ops/restart.go, workload/deadline.go, podgroup/podgroup.go)
    placement: unit
    coverage: {perm: [], unit: [], kind: [], replay: [restart-rebuild-ignores-edits]}
    status: current
  - state: Restart/Drain
    event: spec.policyTuning
    variants: [minReadySeconds]
    outcome: ignore
    note: the promote re-reads the window from the live plan on every pass (ops/restart.go), so a change re-aims the availability wait the repair already waits out; the edit itself stamps nothing
    placement: unit
    coverage: {perm: [], unit: [], kind: [], replay: [restart-rebuilt-pod-readiness-regresses]}
    status: current
  - state: Restart/Drain
    event: spec.policyTuning
    variants: [markNotReady]
    outcome: ignore
    note: the knob is consulted on the in-place path only; Phase A marks every serving old pod not-serving unconditionally before it deletes (ops/restart.go, ops/update_inplace.go)
    placement: unit
    coverage: {perm: [], unit: [], kind: [], replay: [restart-rebuild-ignores-edits]}
    status: current
  - state: Restart/Drain
    event: spec.policyTuning
    variants: [migrationPolicy]
    outcome: ignore
    note: the mode gates the disposition's relocation branch, and a Restart attempt is never disposed, so the repair never reaches it (workload/disposition.go, workload/escalation.go)
    placement: unit
    coverage: {perm: [], unit: [], kind: [], replay: [restart-rebuild-ignores-edits]}
    status: current

  # --- operator configuration ----------------------------------------------
  - state: Restart/Drain
    event: config.changed
    variants: [updateRetry, scaleDownInterval, autoMigrateBudget]
    outcome: ignore
    note: none of the three is read on the repair path — the retry gate is consulted before an attempt starts, the scale-down cadence belongs to the delete pipeline, and a Restart attempt is never disposed so the auto-migrate budget is never consulted (ops/restart.go, workload/disposition.go)
    placement: unit
    coverage: {perm: [], unit: [], kind: [], replay: [restart-rebuild-ignores-edits]}
    status: current
  - state: Restart/Drain
    event: config.changed
    variants: [stuckPodGrace]
    outcome: ignore
    note: the grace is re-read from config on every reconcile, so a shortened value can arm the fast escalation against pods the previous pass tolerated and a zero or negative value disables that path outright; neither is a step of this state (workload/escalation.go, workload/status_aggregate.go)
    placement: unit
    coverage: {perm: [], unit: [], kind: [], replay: [restart-stuck-grace-shortened]}
    status: current
  - state: Restart/Drain
    event: config.changed
    variants: [forceDelete]
    outcome: ignore
    note: the policy is read by the next pass's Component sweep (ops/force_delete.go), so one configured after the wedge frees the old pod at its clock and one changed later moves that clock; nothing on the row changes on the edit itself
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [restart-drain-stuck-pod-swept-at-node-death]}
    status: current
  - state: Restart/Drain
    event: config.changed
    variants: [teardownDeadline]
    outcome: ignore
    note: the deadline re-times the finalizer-release arrow, which becomes reachable only once the owner carries a deletionTimestamp (inferencereplica/teardown.go)
    placement: unit
    coverage: {perm: [], unit: [], kind: [], replay: [restart-rebuild-ignores-edits]}
    status: current
  - state: Restart/Drain
    event: config.changed
    variants: [gangScheduleTimeout]
    outcome: ignore
    note: the clamp is applied where the PodGroup is built, not where the operation is stamped, so a new bound reaches this repair through the next ensure of the Instance's group; with none configured the timeout derived from InstanceReadyTimeout is passed through unbounded, and a Component whose timeout is unusable as a gang deadline leaves the field unset for the scheduler's own default
    placement: unit
    coverage: {perm: [], unit: [TestRestart_OperatorConfigChangesDoNotChangeWhatItDecides], kind: []}
    status: decided
  - state: Restart/Drain
    event: config.changed
    variants: [requeue]
    outcome: ignore
    note: the operation cadence is re-read per pass and only paces how soon a repair with work left wakes again; with none configured the pass rides the controller's rate-limited backoff. An explicit wait the pass already holds - a promote window remainder, a RetryBlock due time - still wins over the cadence, and neither changes what the repair decides
    placement: unit
    coverage: {perm: [], unit: [TestRestart_OperatorConfigChangesDoNotChangeWhatItDecides], kind: []}
    status: decided
  - state: Restart/Drain
    event: config.changed
    variants: [audit, retryBlockHistoryLimit]
    outcome: ignore
    note: neither is read on the repair path - the migration capacity caps bound new requests a repair never raises, and the RetryBlock history cap shapes the end-of-pass prune of superseded blocks rather than anything on this row
    placement: unit
    coverage: {perm: [], unit: [TestRestart_OperatorConfigChangesDoNotChangeWhatItDecides], kind: []}
    status: decided

  # --- controller ticks ----------------------------------------------------
  - state: Restart/Drain
    event: ctrl.resync
    outcome: ignore
    note: the restart pass is level-triggered — a tick re-lists the pods live, re-derives the phase, and the Restarting stamp's skip-write guard keeps an unchanged row from being written at all (ops/restart.go)
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [restart-rebuilt-pod-signals-ignored]}
    status: current

  # --- apiserver rejections ------------------------------------------------
  - state: Restart/Drain
    event: api.invalid
    outcome: escalate
    to: Failed
    guard: the rejected write is the Phase B pod create, whose object is a faithful render of the revision the repair is rebuilding on
    note: a 422 on the rebuild create is permanent, so the repair ends here instead of erroring every pass - LastFailure carries InvalidPodSpec plus the apiserver's explanation, a RetryBlock is recorded against the revision the attempt pinned, and the operation is cleared with Phase=Failed. An unclassified rejection instead returns the pass error, which changes nothing about the other rows - the end-of-pass escalation and the superseded-RetryBlock prune run after every eligible pass, errored or not, so one row's failed write never freezes another's deadline clock (ops/create.go, workload/reconcile.go)
    placement: unit
    coverage: {perm: [], unit: [TestRestartPhaseB_RejectionDispositions], kind: []}
    status: decided
  - state: Restart/Drain
    event: api.throttled
    outcome: defer
    note: a shed create is classified as throttled and writes nothing; the server's Retry-After is deposited on the pass pacing, which floors the requeue so the repair wakes no earlier than the apiserver asked. The pass ends quietly rather than erroring, and the operation deadline is evaluated as usual and keeps running - an errored pass would be evaluated the same way, since the end-of-pass escalation runs after every eligible pass whatever the op returned (ops/create.go, workload/reconcile.go)
    placement: unit
    coverage: {perm: [], unit: [TestRestartPhaseB_RejectionDispositions], kind: []}
    status: decided
  - state: Restart/Drain
    event: api.namespaceTerminating
    outcome: escalate
    to: Failed
    guard: the rejected write is the Phase B pod create
    note: no rebuild can succeed in a terminating namespace, so the repair ends on the first rejection with NamespaceTerminating plus the apiserver's message on LastFailure and the operation cleared. Environment-caused, so the revision keeps a clean retry ladder; the namespace GC deleting the owner is what removes the row (ops/create.go, workload/reconcile.go)
    placement: unit
    coverage: {perm: [], unit: [TestRestartPhaseB_RejectionDispositions], kind: []}
    status: decided

  # --- timers, newly expressible -------------------------------------------
  - state: Restart/Drain
    event: timer.stuckPodGrace
    windows: [before]
    outcome: escalate
    to: Failed
    guard: a recreated pod, at the row's incarnation, has held a terminal waiting reason for the configured grace since its waiting episode began - its creation, or the moment its containers last stopped being ready - and the pod set is not fully serving
    note: the fast path fails the Instance without waiting out the operation deadline, recording the waiting reason and the pod's termination detail on LastFailure and preserving the operation, since a Restart attempt is never disposed (workload/escalation.go)
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [restart-stuckgrace]}
    status: current
  - state: Restart/Drain
    event: timer.stuckPodGrace
    windows: [boundary, after]
    outcome: ignore
    note: the escalation pass skips an already-Failed row, and the stamp no-ops against a slot whose operation the promote cleared
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [restart-wedge-stamp-repeats-nothing]}
    status: current
  # GAP: the scale-down, migration and update drains all reach the force-delete
  # sweep; the restart drain is the one drain that still cannot.
  - state: Restart/Drain
    event: timer.forceDelete
    outcome: transition
    to: Restart/Drain
    guard: a force-delete policy is configured and the old pod Phase A deleted is past its deletion deadline plus the overdue slack while its node is gone or has been unreachable or not ready past the threshold
    note: the Component sweep runs ahead of every verb pass and force-deletes the wedged old pod with grace zero under a UID precondition (ops/force_delete.go); the name is free on the same pass, so Phase B rebuilds the set at the bumped incarnation and the repair goes on. One clock alone frees nothing - the overdue slack elapsed on a pod whose node is still under the unreachable threshold leaves it where it is - and with no policy configured neither clock fires, so Phase A stays blocked on the live old-pod check
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [restart-drain-stuck-pod-swept-at-node-death]}
    status: current
  - state: Restart/Drain
    event: timer.teardownDeadline
    windows: [before]
    outcome: transition
    to: Empty
    guard: the owner is Terminating, the configured teardown deadline has passed since its deletionTimestamp, and the teardown finalizer is still held
    note: reachable only when the teardown branch never got its Delete stamp onto this row; the finalizer release purges the owner and every InstanceStatus row it carried in one delete, leaving surviving pods to background GC (inferencereplica/teardown.go)
    placement: sim
    coverage: {perm: [], unit: [], kind: [], replay: [restart-teardown-deadline]}
    status: current
  - state: Restart/Drain
    event: timer.teardownDeadline
    windows: [boundary, after]
    outcome: ignore
    note: the row is gone with the owner, so a later expiry has nothing to act on
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [restart-teardown-deadline]}
    status: current

  # --- kubelet admission and slow readiness ---------------------------------
  - state: Restart/Drain
    event: pod.admissionRejected
    windows: [before]
    outcome: transition
    to: Restart/Drain
    guard: the rejected pod carries the bumped incarnation and holds one of the rebuild's target names, the attempt's deadline has not elapsed, and its outstanding expectations are satisfied
    note: a rejection is phase Failed, so query.ExcludeTerminalPods drops it from Phase B's name diff and ops/terminal_recycle.go deletes it before the recreate; terminalPodTermination captures the pod-level status.reason onto LastFailure, so a rebuild that keeps being refused for capacity says so instead of reporting a bare PodFailed. Environment-caused throughout - the node's capacity accounting refused a pod the revision renders correctly, so no RetryBlock is charged. A rejected pod at the old incarnation is drained and deleted by Phase A like any other
    placement: kind
    coverage: {perm: [], unit: [], kind: [], replay: [restart-rebuilt-pod-admission-rejected]}
    status: current
  - state: Restart/Drain
    event: pod.admissionRejected
    windows: [boundary, after]
    outcome: defer
    note: the recycle writes no phase or step, so a re-observed rejection lands on the same row and is either paced by the ladder or already satisfied by the delete in flight
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [restart-rebuilt-pod-admission-rejected]}
    status: current
  - state: Restart/Drain
    event: pod.runningNotReady
