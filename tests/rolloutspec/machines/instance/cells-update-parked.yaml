  - {state: Update/Parked, event: pod.runningNotReady, variants: [source], windows: [boundary, after], outcome: ignore, note: "the grace is read once per pass; the row is Failed from there until the set serves again", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Parked, event: pod.uidRotated, outcome: ignore, note: "a parked set's pod coming back under a new UID is the same set to the reading, which keys on the attempt's revision", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
