# Cells for the Update/Parked state of the instance machine: a recreate or
# in-place attempt parked after its disposition, read while its own pod set
# serves. The disposition kept the operation on the parked step with
# Operation.Waiting naming the wait the next attempt stands behind and the
# deadline parked, and charged the ladder as for a cleared attempt. Nobody
# owns the row and it claims no verb: it holds no budget slot, is no
# continuation, pins no strategy, no clock runs against it and no hold is
# recorded on it. It is gated and re-opened as the Failed row it stands for
# - the roll opens a fresh attempt over it when the ladder, the budget and
# the gate admit, the Create pass does once its pods are gone - and its
# phase is its pod set's, read on every pass whether or not the Component
# is paused: the set gone, parked in the kubelet's back-off or unready past
# the stuck-pod grace returns it to Failed with the attempt kept, a runner
# restarting in place inside the grace moves nothing, and the full set
# serving brings it back here (escalation/parked.go).

cells:
  - {state: Update/Parked, event: pod.scheduled, variants: [source], outcome: ignore, note: "binding is observation only: a parked set's pods are bound already, and no pass keys on their node", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Parked, event: pod.unschedulable, variants: [source], outcome: ignore, note: "no pod of a parked attempt is being placed - the next attempt's pods belong to the operation that opens over it - and the scheduler hold reads a row nobody owns as one with no attempt to hold (holds/pass.go)", placement: unit, coverage: {perm: [], unit: [TestRun_SkipsRowsNoFactMayTouch], kind: []}, status: decided}
  - {state: Update/Parked, event: pod.containersReady, variants: [source], outcome: ignore, note: "the set already serves; a member regaining readiness confirms the reading the row carries", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Parked, event: pod.containersNotReady, variants: [source], outcome: defer, note: "a parked attempt's phase is its set's, read with the stuck-pod grace: a runner dying again and restarted in place inside the grace moves nothing, so the row keeps reading as the roll in progress and the pass writes no status; the set unready past the grace (T-parked-down) or parked in the kubelet's back-off (T-parked-backoff) returns the row to Failed with the attempt kept, and the full set serving again brings it back (T-failed-parked-serves). Nothing opens either way; the ladder paces the next attempt", placement: unit, coverage: {perm: [], unit: [TestFollowParkedAttempts_PhaseFollowsThePodSet, TestFollowParkedAttempts_RestartInsideTheGraceMovesNothing, TestCrashBeforePromotion_DisposedRollAttemptFollowsItsPods, TestGroupPhase_ParkedAttemptRestartingInsideTheGraceDoesNotReenterFailed], kind: []}, status: decided}
  - {state: Update/Parked, event: pod.ready, variants: [source], outcome: ignore, note: "PodReady adds nothing the parked reading does not take from ContainersReady and the serving gate", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Parked, event: pod.servingOn, variants: [source], outcome: ignore, note: "the gate on a parked set stays as the attempt's own promote left it; the reading is the set's readiness under that gate", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Parked, event: pod.servingOff, variants: [source], outcome: ignore, note: "only a fresh attempt's drain withdraws the gate on a parked set, and that attempt replaces the parked operation first; a withdrawn gate otherwise reads through the set's rotation like any readiness loss", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Parked, event: pod.terminating, variants: [source], outcome: defer, note: "a pod on its way out is live until it is gone; the set reads short once it is", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Parked, event: pod.deleted, variants: [source], windows: [before], outcome: transition, to: Failed, guard: "no live pod of the parked attempt's own set is left, or the set lost the member it serves through", note: "the row reads Failed with the attempt kept (T-parked-gone): with no pod left the Create pass's fresh start rebuilds it under the revision's RetryBlock gate, and a gang short of a member is the roll's to replace at the target, or the restart pass's to rebuild as a whole where the roll may not take it (T-parked-member-lost) - read exactly as the Failed row with no operation is. A gang that lost a worker while its leader still serves keeps the reading it had until a pass takes it or the leader goes unready past the grace", placement: unit, coverage: {perm: [], unit: [TestFollowParkedAttempts_PhaseFollowsThePodSet, TestDetectRestartTrigger_ParkedAttemptDoesNotOwnALostMember, TestCreateFreshStart_ParkedAttemptIsAFreshStart], kind: []}, status: decided}
