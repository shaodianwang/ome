  - {state: Update/InPlace, event: api.invalid, outcome: escalate, to: Failed, guard: "the rejection is on one of the in-place pod patches - image, marker, annotation or revision label", note: "a pod mutation the apiserver permanently rejects is a statement about the revision, not a hiccup: the object this revision asks for is not admissible, so the attempt is disposed exactly as a rejected create is - LastFailure carries InvalidPodSpec plus the apiserver's explanation, a RetryBlock is recorded against the target revision, and the operation is cleared with Phase=Failed. A corrected revision is then admitted immediately (ops/update_inplace.go)", placement: unit, coverage: {perm: [], unit: [TestUpdateInPlace_InvalidPatch_DisposesAndHoldsRevision], kind: []}, status: decided}
