  # --- Update/Drain: timer, controller and apiserver families -------
  - {state: Update/Drain, event: timer.operationDeadline, outcome: escalate, to: Failed, note: "a recreate is disposable, single-pod or gang, so the elapsed deadline routes through the disposition: the wave counts on the ladder, and the operation is kept parked while a pod of the attempt's revision is alive - Operation.Waiting naming the ladder's wait, the deadline parked - and cleared once none is. A replacement caught Running between two crashes is read as the crash loop it is, named with its exit on the record, and blames a node only when the revision has served on some Instance. The clock is parked while any pod is admission-gated and the escalation is skipped entirely once the pod set is fully serving", placement: perm, coverage: {perm: [], unit: [TestDispose_CrashLoopOnUnservedRevisionBlamesNoNode, TestDispose_LiveSetParksTheAttempt, TestCrashBeforePromotion_DisposedRollAttemptFollowsItsPods], kind: [], replay: [drain-deadline, pause-failed-recreate-parks]}, status: decided}
