  # --- Update/InPlace: timer, controller and apiserver families -----
  - {state: Update/InPlace, event: timer.operationDeadline, outcome: escalate, to: Failed, note: "a single-pod in-place attempt is always disposable, so the elapsed deadline routes through the disposition: the wave counts on the ladder, and the operation is kept parked while the patched pod is alive - Operation.Waiting naming the ladder's wait, the deadline parked - and cleared once it is gone. The clock is parked while any pod is admission-gated, the escalation is skipped entirely once the pod set is fully serving, and the stamp is a no-op if the promote cleared the operation first", placement: unit, coverage: {perm: [], unit: [TestDispose_LiveSetParksTheAttempt, TestDispose_RowThatMovedOnSinceTheObservationIsLeftAlone, TestDeadlineOnThePromotePass_InPlaceRowStaysReady], kind: [], replay: [inplace-deadline, inplace-deadline-ready-report]}, status: decided}
  - {state: Update/InPlace, event: timer.minReady, outcome: defer, note: "the elapsed window releases the last promote guard but commits nothing by itself; the next pass re-checks the runtime images on top of the one bar every path shares - every pod PodReady - before stamping Ready", placement: perm, coverage: {perm: [], unit: [TestInPlaceUpdate_PromotionWaitsForMinReadySeconds, TestInPlaceUpdate_ZeroWindowPromotionRetryDoesNotRedrain], kind: []}, status: decided}
  - {state: Update/InPlace, event: timer.expectationsTTL, outcome: ignore, note: "the step seeds a delete expectation when it recycles a terminal pod and reads an empty pod set as evidence only once that delete is observed; an expectation that ages past its TTL reads as satisfied, so the next pass reads the pod set afresh - a pod still there is patched as before, an empty set re-resolves the roll to recreate on the same operation (ops/update_inplace.go)", placement: unit, coverage: {perm: [], unit: [TestUpdateInPlace_ExpiredExpectationsReleaseThePass], kind: []}, status: decided}
  - {state: Update/InPlace, event: ctrl.crash, outcome: ignore, note: "the operation and the pending-image marker on the pod are both durable, so a restarted manager resumes the same patch from status and from the pod itself with no in-memory state to rebuild", placement: kind, coverage: {perm: [], unit: [], kind: [], replay: [inplace-patch-observations, inplace-resumed-from-status]}, status: decided}
  - {state: Update/InPlace, event: ctrl.staleRead, outcome: ignore, note: "the step re-reads every pod through the live reader before mutating it, precisely because kubelet status writes advance resourceVersion independently of the cache, so a lagging cache cannot drive the patch or the convergence check; the escalation pass judges the cached pod list, so a wedge that cleared behind the cache is still disposed on what that pass observed", placement: perm, coverage: {perm: [], unit: [TestUpdateInPlaceUsesLivePodForOptimisticImagePatch], kind: [], replay: [inplace-stuck-while-ready-reported, inplace-stuckgrace-while-ready-reported]}, status: decided}
  - {state: Update/InPlace, event: api.conflict, outcome: defer, note: "the image patch, the marker write and the readiness-gate writes all pin the resourceVersion of the read they were computed against, so a concurrent mutation rejects the patch and the pass retries from a fresh read on the requeue; the marker clear after the promote names only its key and takes no lock, so a concurrent write cannot leave the marker behind", placement: perm, coverage: {perm: [], unit: [TestPatchPodImagesRejectsStaleResourceVersion, TestRemoveInPlaceImageTransitionClearsOnlyTheMarker], kind: []}, status: decided}
  - {state: Update/InPlace, event: api.alreadyExists, outcome: n/a, reason: "an in-place roll creates no object, so no create can collide with an existing name", status: decided}
  - {state: Update/InPlace, event: api.notFound, outcome: ignore, note: "a pod gone by the time of the image patch fails the pass once - the not-found error is the requeue - and the next pass re-derives the pod set, finds the roll's only pod gone and re-resolves the mode to a recreate on the same pass; a pod gone before the live re-read is the same loss read a pass earlier. One lost pass, and the roll heals itself", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [inplace-patch-meets-not-found]}, status: decided}
  - {state: Update/InPlace, event: api.quotaDenied, outcome: n/a, reason: "an in-place roll creates no pod, so no quota admission applies to it", status: decided}
  - {state: Update/InPlace, event: timer.stuckPodGrace, outcome: escalate, to: Failed, note: "the grace is measured from the start of the pod's waiting episode (its creation, or the moment its containers last stopped being ready) and arms the fast escalator on a different clock than the operation deadline; once it elapses over a terminal waiting reason the disposition ends the attempt, keeping the operation parked while the patched pod is alive, and with no such reason the elapsed grace ends no attempt (workload/escalation.go); over a pod whose kubelet readiness has failed for the grace under a step that replaces no container, the update pass re-resolves the mode to recreate on the same operation instead (ops/update.go InPlaceCannotRestore)", guard: "the patched pod holds a terminal waiting reason and the pod set is not fully serving", placement: sim, coverage: {perm: [], unit: [TestUpdateWithPods_InPlacePatchOverAPodDarkPastTheGraceMovesToRecreate, TestReconcile_MetadataPushOverADarkInstance_InPlaceStepRecreatesIt], kind: [], replay: [inplace-stuckgrace]}, status: decided}
  - {state: Update/InPlace, event: timer.teardownDeadline, outcome: transition, to: Empty, note: "past the deadline the teardown pass stops waiting for the Delete pipeline, warns, and releases the finalizer, which purges the owner and every InstanceStatus row it carried in one delete while surviving pods fall to background GC (inferencereplica/teardown.go)", guard: "the owner is Terminating, the configured teardown deadline has passed since its deletionTimestamp, and the teardown finalizer is still held", placement: sim, coverage: {perm: [], unit: [], kind: [], replay: [inplace-teardown-outruns-deadline]}, status: decided}
