  - {state: Update/Drain, event: timer.expectationsTTL, outcome: ignore, note: "an expired delete or create expectation only unblocks the next pass, which re-derives the outstanding work from the live pod set; both the delete and the stable-name create are idempotent", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Drain, event: ctrl.crash, outcome: ignore, note: "the operation and the bumped Incarnation are durable, so a restarted manager resumes the same recreate and re-derives its phase from the incarnation partition; the lost expectation cache only costs one redundant idempotent pass", placement: kind, coverage: {perm: [], unit: [], kind: [], replay: [recreate-rebuild-observations, recreate-resumed-from-status]}, status: current}
  - {state: Update/Drain, event: ctrl.staleRead, outcome: ignore, note: "the drain check and the Phase A completion check both read through the live reader, precisely so a stale cache cannot let Phase B create against a still-terminating previous incarnation", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [drain-stale-cache-source-gone]}, status: current}
  - {state: Update/Drain, event: api.conflict, outcome: defer, note: "the readiness-gate writes pin the resourceVersion of the read they were computed against, so a concurrent mutation rejects the patch and the pass retries from a fresh read on the requeue", placement: perm, coverage: {perm: [], unit: [TestRecreateDrain_ConflictOnTheServingFlipRetriesFromAFreshRead], kind: []}, status: decided}
  - {state: Update/Drain, event: api.alreadyExists, outcome: ignore, note: "a Phase B create that collides with a name is swallowed and the pass moves on: the collision means either a prior reconcile already created the pod or the previous incarnation has not been collected yet", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [recreate-rebuild-apiserver-answers]}, status: current}
