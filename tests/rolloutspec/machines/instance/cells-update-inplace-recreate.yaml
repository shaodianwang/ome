  - {state: Update/Drain, event: api.quotaDenied, outcome: defer, note: "a refused Phase B create is classified as capacity-blocked: the refusal is recorded on the operation and its deadline parks on that pass, while the QuotaExceeded waiting token names the wait from the next one while it is held, which is how a wait no pod exists to carry a scheduling gate for still stops the clock. The token is released on the first pass whose creates all land, and the recreate retries on its own requeue", placement: perm, coverage: {perm: [], unit: [TestRecreatePhaseB_QuotaExceeded_WaitsWithoutFailing], kind: []}, status: decided}
  - {state: Update/Drain, event: timer.stuckPodGrace, outcome: escalate, to: Failed, note: "the grace is measured from the start of the pod's waiting episode (its creation, or the moment its containers last stopped being ready) and arms the fast escalator on a different clock than the operation deadline; once it elapses over a terminal waiting reason the stuck pod's diagnostics are recorded and the Instance is failed, with the operation kept parked while a pod of the attempt's revision is alive, and with no such reason the elapsed grace does nothing (workload/escalation.go)", guard: "a pod holds a terminal waiting reason and the pod set is not fully serving", placement: sim, coverage: {perm: [], unit: [], kind: [], replay: [drain-stuckgrace]}, status: current}
