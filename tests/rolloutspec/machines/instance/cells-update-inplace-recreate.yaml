  - {state: Update/Drain, event: pod.waiting, variants: [ImagePullBackOff, ErrImagePull, InvalidImageName, CreateContainerConfigError], outcome: escalate, to: Failed, note: "a workload-caused reason held past the stuck-pod grace fails the Instance. A recreate is disposable, single-pod or gang, so a RetryBlock is recorded against the target revision ahead of the write that ends the attempt: the operation is kept parked while a pod of the attempt's revision is alive, naming the ladder's wait, and cleared once none is", guard: "the pod set is not fully serving and the cause pod carries the target revision hash", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [drain-stuck]}, status: decided}
