# Cells for the two non-surge Update families of the instance machine.
#
# Update/InPlace is single-pod only: the mode is re-resolved on every pass
# and a multi-pod Instance always resolves to recreate. The step patches
# container images on the live pod at the same Incarnation and UID, and
# promotes once every changed image is confirmed from container status, the
# serving gate is back, the pod is PodReady and the availability window has
# elapsed.
#
# Update/Drain is the recreate roll for RecreatePod and for the in-place
# strategies that fall back. One step spans three phases, all guards on
# the same persisted state: Phase A drains and deletes the old-incarnation
# pods, Phase B recreates them at the bumped Incarnation under the same
# stable pod names, Phase C flips serving and waits for PodReady plus the
# availability window before promoting.
#
# The strategy is pinned for the life of an operation, so an edit reaches
# the Instance only at its next admitted attempt and no in-flight roll
# changes mode. A revision retarget does fall through each stamp's
# idempotency guard (T-inplace-retarget, T-drain-retarget), which for the
# recreate means a second Incarnation bump and a restart of Phase A while
# the state id stays Update/Drain.
#
# An attempt either state's disposition ends while the attempt's own pod
# set is still alive is kept on the row on its own step, Update/Parked,
# which reads Failed while that set is down; the cells here describe the
# attempt in flight.

cells:
  # --- Update/InPlace: pod family -----------------------------------
  - {state: Update/InPlace, event: pod.scheduled, variants: [source], outcome: n/a, reason: "an in-place roll patches an already-bound pod and creates none, so no pod of this Instance can be newly bound while the step runs", status: decided}
  - {state: Update/InPlace, event: pod.containersReady, variants: [source], windows: [before], outcome: defer, note: "ContainersReady is below the promote bar and can stay true across an image patch in a stale observation, so the pass additionally requires every changed container to report the target image at runtime, the pending-image marker cleared, the pod PodReady and the availability window elapsed", guard: "runtime image confirmation for the containers whose image differs between the running and target revisions, on top of the PodReady plus minReadySeconds bar every promote shares", placement: kind, coverage: {perm: [], unit: [TestPodRuntimeImageChangesMatch, TestUpdateInPlaceMetadataRollRepairsImageDriftBeforePromotion], kind: []}, status: decided}
  - {state: Update/InPlace, event: pod.containersReady, variants: [source], transition: T-inplace-ready, outcome: transition, to: Ready, note: "images confirmed at runtime (the kubelet reports the target image, or has replaced the container since the patch the marker recorded), so the pass restores serving, restamps the revision hash and pairing labels on the live pod, stamps Ready on the target revision once the pod is PodReady and the availability window has elapsed, and clears the marker after the stamp; the step is taken on a pass an open repair on another Instance consumes as well, since an in-place patch in flight advances beside a repair", placement: kind, coverage: {perm: [], unit: [TestUpdateInPlaceMetadataRollRepairsImageDriftBeforePromotion, TestReconcile_InPlaceOnly_ImagePushRollsEveryInstance], kind: [], replay: [inplace-deadline-ready-report]}, status: decided}
  - {state: Update/InPlace, event: pod.containersReady, variants: [source], transition: T-inplace-fallback, outcome: ignore, note: "the fallback is decided by the re-resolved update mode, not by readiness; a pod reporting ready while the Drain restamp lands belongs to the Incarnation the recreate is about to supersede", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [inplace-fallback-while-ready-reported]}, status: decided}
  - {state: Update/InPlace, event: pod.containersReady, variants: [source], transition: T-inplace-deadline, outcome: ignore, note: "the escalation retracts only for a pod set that is PodReady with the serving gate set at the desired count, judged as the pass observed it; an in-place pod the step holds out of rotation does not qualify, so the deadline disposes the attempt whatever the pod reports", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [inplace-deadline-while-ready-reported]}, status: decided}
  - {state: Update/InPlace, event: pod.containersReady, variants: [source], transition: T-inplace-stuck, outcome: ignore, note: "same fully-serving guard as the deadline path, judged on the pods as the pass observed them: a readiness report that lands behind that observation does not retract a terminal waiting reason held past the stuck-pod grace, so the attempt is parked and the revision held even where the step's own live re-read has already restored the gate", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [inplace-stuck-while-ready-reported]}, status: decided}
  - {state: Update/InPlace, event: pod.containersReady, variants: [source], transition: T-inplace-scaledown, outcome: ignore, note: "the index has left the planned set, so the scale-down wave claims it whatever its pods report; converging on the target image no longer keeps it alive", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [inplace-scaledown-with-edits]}, status: decided}
  - {state: Update/InPlace, event: pod.containersReady, variants: [source], transition: T-inplace-teardown, outcome: ignore, note: "teardown treats every observed index as a scale-down extra whatever its pods report", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [inplace-teardown-with-edits]}, status: decided}
  - {state: Update/InPlace, event: pod.containersReady, variants: [source], transition: T-inplace-retarget, outcome: ignore, note: "the retarget rewrites the expected images, so readiness confirmed against the superseded set does not complete the patch; the confirmation re-runs against the new marker", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [inplace-retarget-while-ready-reported]}, status: decided}
  - {state: Update/InPlace, event: pod.ready, variants: [source], outcome: defer, note: "PodReady is one half of the shared promote bar and commits nothing on its own; the in-place step also needs every changed image confirmed from container status, the marker cleared and the availability window elapsed. The bar is read on a pass an open repair on another Instance consumes as well: an in-place patch in flight advances beside a repair, while a fresh in-place start waits for a pass no repair consumes", placement: kind, coverage: {perm: [], unit: [TestInPlaceUpdate_PromotionWaitsForMinReadySeconds], kind: []}, status: decided}
  - {state: Update/InPlace, event: pod.servingOn, variants: [source], outcome: defer, note: "restoring the gate is the pass's own write once every changed image is confirmed at runtime, and the same pass promotes if the pod is PodReady with the availability window elapsed; the gate flip alone commits nothing, and a window still running defers the Ready stamp to a later pass", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [inplace-patch-observations]}, status: decided}
  - {state: Update/InPlace, event: pod.servingOff, variants: [source], outcome: ignore, note: "the pass drove the gate off to drain the pod before patching; the drain check reads EndpointSlice membership through a live reader rather than the gate", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [inplace-patch-observations]}, status: decided}
  - {state: Update/InPlace, event: pod.deleted, variants: [source], windows: [before], outcome: transition, to: Update/Drain, guard: "the roll's only pod is gone, so there is nothing left to patch in place", note: "losing the pod re-resolves the roll to recreate on the same pass rather than polling an empty pod set to the operation deadline: the operation keeps its identity, its target revision and its deadline, the step is restamped to Drain and the replacement is rendered at the target revision. This is the one place an operation's pinned strategy moves, and the restamp writes RecreatePod onto the pin so every later pass agrees on the mode", placement: kind, coverage: {perm: [], unit: [TestUpdateWithPods_InPlaceRollLosingItsOnlyPodReResolvesToRecreate, TestUpdateWithPods_InPlaceRollKeepsPatchingWhileItsPodLives, TestUpdateWithPods_InPlaceRollWaitsForItsOwnExpectations], kind: [], replay: [inplace-podlost-recreate]}, status: decided}
  - {state: Update/InPlace, event: pod.deleted, variants: [source], windows: [boundary, after], outcome: ignore, note: "the re-resolution is a step restamp on the same operation, so a re-observed disappearance re-derives the same write and the recreate owns the empty pod set from there", placement: kind, coverage: {perm: [], unit: [TestUpdateWithPods_InPlaceRollLosingItsPodTwiceReDerivesTheSameRecreate], kind: []}, status: decided}
  - {state: Update/InPlace, event: pod.waiting, variants: [ImagePullBackOff, ErrImagePull, InvalidImageName, CreateContainerConfigError], outcome: escalate, to: Failed, note: "a workload-caused reason held past the stuck-pod grace disposes the single-pod attempt: a RetryBlock is recorded against the target revision ahead of the write that ends the attempt, and the operation is kept parked while the patched pod is alive, naming the ladder's wait, so the ladder or a corrective revision re-drives the Instance as a fresh start", guard: "the pod set is not fully serving and the pod carries the target revision hash", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [inplace-stuck]}, status: decided}
  - {state: Update/InPlace, event: pod.waiting, variants: [CreateContainerError, CrashLoopBackOff, RunContainerError], outcome: escalate, to: Failed, guard: "the pod already carries the target revision hash, which the patch restamps together with the image", note: "an ambiguous reason is terminal for the stuck check but never blamed on the revision outright: the disposition records a bounded relocation directive when the migration mode allows it and the target revision has served on some Instance and its retry block is not Held; a revision nobody serves blames no node; otherwise it stamps Failed, keeps the operation parked while a pod of the attempt's revision is alive (cleared once none is) and counts the attempt on the target revision's RetryBlock toward lifecycle.updateRetry.maxAttempts like any failed attempt (Held at the bound; a corrected revision patches the same pod again and converges), and with no updateRetry configured it writes no RetryBlock and the same attempt is re-opened on the next pass. A crash loop the pod carried before the patch, on the prior revision, is the wedge the roll corrects: the attempt is judged on the pods carrying its own revision (evidence.AttemptStuckPods), so the patch lands and the kubelet's restart with the new image is what the row waits on", placement: perm, coverage: {perm: [], unit: [TestEscalateStuckPodFailures_UpdateAttemptIgnoresTheWedgedSource, TestCrashLoopBound_NewRevisionCrashesAtStart], kind: [], replay: [ready-crashloop-retarget-inplace]}, status: decided}
  - {state: Update/InPlace, event: pod.waiting, variants: [DeadlineExceeded], outcome: defer, note: "not one of the terminal waiting reasons the stuck check matches, so the fast escalation never fires and only the operation deadline ends the roll", placement: sim, coverage: {perm: [], unit: [], kind: [], replay: [inplace-deadline-exceeded-reason-waits]}, status: decided}
  - {state: Update/InPlace, event: pod.containerRestart, outcome: ignore, note: "the kubelet restart is how a patched image takes effect, and the promote re-anchors ReadySince, so the restart cannot later read as a post-Ready loss of the runner process", placement: kind, coverage: {perm: [], unit: [TestUpdateInPlace_PodObservationsThatDecideNothing], kind: []}, status: decided}
  - {state: Update/InPlace, event: pod.uidRotated, outcome: defer, note: "nothing in the in-place path reads the pod UID: the pass re-reads by name and re-runs the marker, image and label patches against whatever pod carries that name, so a rotated pod is patched from scratch", placement: sim, coverage: {perm: [], unit: [], kind: [], replay: [inplace-patched-pod-uid-rotated]}, status: decided}
  - {state: Update/InPlace, event: pod.stuckTerminating, outcome: defer, note: "the in-place path issues no deletes, so a deletionTimestamp can only come from outside; the pass keeps re-reading the pod and makes no progress, but the update pass sweeps such pods at the top of every pass, so one wedged on a provably dead node is cleared instead of waiting out the operation deadline (ops/update.go)", placement: sim, coverage: {perm: [], unit: [TestUpdateInPlace_PodObservationsThatDecideNothing], kind: []}, status: decided}
  - {state: Update/InPlace, event: pod.nodeLost, outcome: defer, note: "a lost node is not a terminal waiting reason, so a pod that is not Terminating polls until the operation deadline and the disposition then records a relocation directive when the migration mode and the relocation budget allow; a pod already Terminating on that node is instead cleared by the force-delete sweep at the top of the update pass (ops/force_delete.go)", placement: sim, coverage: {perm: [], unit: [TestUpdateInPlace_PodObservationsThatDecideNothing], kind: []}, status: decided}
  - {state: Update/InPlace, event: pod.schedulingGated, outcome: n/a, reason: "scheduling gates may only be cleared after a pod is created, and an in-place roll creates no pod", status: decided}
  - {state: Update/InPlace, event: pod.evicted, outcome: transition, to: Update/InPlace, guard: "the evicted pod holds the roll's name, the operation deadline has not elapsed, and the row's outstanding expectations are satisfied", note: "an eviction leaves the pod Failed, which is as terminal as any exit, so the attempt replaces it at once: the shared terminal recycle deletes the occupant with the expectation recorded first and the Evicted reason lifted onto LastFailure, and the empty set re-resolves the roll to recreate on the pass that finds the pod gone; a re-observed eviction lands on the same row and is either paced by the ladder or satisfied by the delete already in flight (pkg/controller/v1beta1/workload/ops/update_inplace.go, pkg/controller/v1beta1/workload/ops/terminal_recycle.go)", placement: unit, coverage: {perm: [], unit: [TestUpdateInPlace_TerminalPodIsRecycled], kind: []}, status: decided}
  - {state: Update/InPlace, event: pod.containersReady, variants: [source], transition: T-inplace-force-clock, outcome: ignore, note: "the sweep acts only on a pod that already carries a deletionTimestamp on a provably dead node; a pod still reporting ContainersReady from a live kubelet is never its subject (ops/force_delete.go)", placement: sim, coverage: {perm: [], unit: [], kind: [], replay: [inplace-force-clock-while-ready-reported]}, status: decided}
  - {state: Update/InPlace, event: spec.revision, transition: T-inplace-force-clock, outcome: defer, note: "the sweep is a pod-level unwedge that writes nothing to the row, so the retarget is decided by the mode that runs after it on the same pass (ops/update.go)", placement: sim, coverage: {perm: [], unit: [], kind: [], replay: [inplace-force-clock-with-edits]}, status: decided}
  - {state: Update/InPlace, event: pod.containersReady, variants: [source], transition: T-inplace-stuckgrace, outcome: ignore, note: "the fast escalation carries the same fully-serving guard as the deadline path and judges the pods as the pass observed them, so a readiness report that lands behind that observation does not retract an elapsed stuck-pod grace: the attempt is parked and the revision held even where the step's own live re-read has already restored the gate", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [inplace-stuckgrace-while-ready-reported]}, status: decided}
  - {state: Update/InPlace, event: pod.containersReady, variants: [source], transition: T-inplace-teardown-deadline, outcome: ignore, note: "the owner is Terminating past its teardown deadline and the finalizer release purges the owner with every InstanceStatus row it carried, whatever the pod reports (inferencereplica/teardown.go)", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [inplace-teardown-outruns-deadline]}, status: decided}
  - {state: Update/InPlace, event: pod.unschedulable, variants: [source], outcome: defer, guard: "the row is not fully serving and its operation carries no other authority's waiting token except an operator pause, which a fact about the Instance takes the row from; the hold lasts while lifecycle.unschedulableGracePeriod is unconfigured or unelapsed, and past it the attempt is failed environment-caused", note: "the in-place step creates no pod, so an unbound pod can only be one a recreate left behind when the strategy flipped to in-place; it fails the runtime-ready gate, and the hold pass records the Unschedulable waiting token, which parks the operation deadline instead of letting it dispose the attempt. Past the configured grace the attempt is failed with the scheduler's message and no RetryBlock (ops/update_inplace.go)", placement: sim, coverage: {perm: [], unit: [TestEscalation_UnschedulableRollHoldsThenFailsPastGrace], kind: []}, status: decided}
  - {state: Update/InPlace, event: pod.containersNotReady, variants: [source], outcome: defer, note: "the kubelet dropping ContainersReady is the expected effect of an image patch, and the runtime-ready gate before the image confirmation holds the promote until readiness returns on the target image (ops/update_inplace.go); a step that replaces no container has nothing to wait for on a pod whose readiness has failed for the stuck-pod grace, so the mode re-resolves to recreate on the same operation, its identity and deadline kept (ops/update.go InPlaceCannotRestore, status.StampRecreateFromInPlace)", placement: sim, coverage: {perm: [], unit: [TestUpdateWithPods_InPlacePatchOverAPodDarkPastTheGraceMovesToRecreate, TestUpdateWithPods_InPlaceStepOverAnUnreadyPodKeepsPatching], kind: [], replay: [inplace-patch-edits-and-readiness-regression]}, status: decided}
  - {state: Update/InPlace, event: pod.terminating, variants: [source], outcome: defer, note: "the in-place path issues no deletes, so a deletionTimestamp can only come from outside; the pass keeps re-reading and patching the same pod name and makes no progress, and the loss itself is decided by the pod.deleted cell (ops/update_inplace.go)", placement: sim, coverage: {perm: [], unit: [], kind: [], replay: [inplace-patched-pod-terminating]}, status: decided}
  - {state: Update/InPlace, event: pod.phaseTerminal, variants: [Failed, Succeeded], windows: [before], outcome: transition, to: Update/InPlace, guard: "the pod the roll is patching is in a terminal phase, the operation deadline has not elapsed, and the row's outstanding expectations are satisfied", note: "a dead pod can never report the new image, so the attempt replaces it at once instead of polling it to the operation deadline: the shared terminal recycle deletes the occupant with the expectation recorded first and the exit captured onto LastFailure, counted on the attempt and paced inside it by the same-target retry ladder; the step stays on the patch, and the empty set re-resolves the roll to recreate on the pass that finds the pod gone, which renders the replacement at the target revision (pkg/controller/v1beta1/workload/ops/update_inplace.go, pkg/controller/v1beta1/workload/ops/terminal_recycle.go)", placement: unit, coverage: {perm: [], unit: [TestUpdateInPlace_TerminalPodIsRecycled], kind: [], replay: [inplace-patched-pod-terminal]}, status: decided}
  - {state: Update/InPlace, event: pod.phaseTerminal, variants: [Failed, Succeeded], windows: [boundary, after], outcome: defer, note: "the recycle is a pod delete that leaves phase and step where they are, so a re-observed terminal phase lands on the same row and is either paced by the ladder or satisfied by the delete already in flight", placement: unit, coverage: {perm: [], unit: [TestUpdateAttempt_TerminalPodReobservedKeepsPhaseAndStep], kind: []}, status: decided}
  - {state: Update/InPlace, event: pod.phaseTerminal, variants: [Unknown], outcome: defer, note: "phase Unknown is not terminal for the recycle: the kubelet has stopped reporting rather than the pod having died, so the name is not freed and the roll reads the pod's last conditions until the operation deadline; a pod already Terminating on a provably dead node is cleared by the force-delete sweep at the top of the update pass (pkg/controller/v1beta1/workload/ops/update.go)", placement: sim, coverage: {perm: [], unit: [TestUpdateAttempt_UnknownPhasePodIsNotRecycled], kind: []}, status: decided}
  - {state: Update/InPlace, event: pod.admitted, outcome: n/a, reason: "an admission scheduling gate can only be removed from a pod that was created carrying one, and an in-place roll creates no pod", status: decided}

  # --- Update/InPlace: endpoint family ------------------------------
  - {state: Update/InPlace, event: endpoint.rotationIn, variants: [source], outcome: ignore, note: "the in-place promote reads the serving gate and the runtime images, never EndpointSlice membership; the returning endpoint feeds only the Component-level available counters (workload/status_aggregate.go)", placement: sim, coverage: {perm: [], unit: [], kind: [], replay: [inplace-patch-observations]}, status: decided}
  - {state: Update/InPlace, event: endpoint.rotationOut, variants: [source], outcome: defer, note: "the drain check before the patch is exactly this edge read through a live reader, so the rotation-out releases the guard that lets the image patch be issued but commits nothing by itself (workload/drain/drain.go)", placement: sim, coverage: {perm: [], unit: [], kind: [], replay: [inplace-patch-observations]}, status: decided}

  # --- Update/InPlace: operator family ------------------------------
  - {state: Update/InPlace, event: spec.revision, windows: [before], outcome: transition, to: Update/InPlace, note: "the trigger fires unconditionally while Updating, so the in-flight patch retargets: the status stamp rewrites the target revision and the deadline, and the pending-image marker keeps its container names with the new expected images; the Component's revision rollup, withdrawn while the attempt was pinned to the superseded revision, comes back once every Instance runs the revision it was withdrawn from and none is pinned to another, the retargeted attempt included, so a rollback whose Instance comes back broken reads landed with a Failed Instance rather than in flight for good: the Held block that attempt leaves gates the next attempt, not the rollup", invariants: [rollup.restored.once.back], placement: perm, coverage: {perm: [], unit: [TestInPlaceImageTransitionRetargetsUnconfirmedImages, TestRollback_AtTheLastInstanceOfAnInPlaceRollComesBackInPlace, TestCurrentRevisionFor, TestReconcile_RollbackOverABrokenInstanceRestoresTheCurrentRevisionOnceEveryInstanceIsBackOnIt], kind: []}, status: decided}
  - {state: Update/InPlace, event: spec.revision, transition: T-inplace-fallback, outcome: transition, to: Update/Drain, note: "a retarget whose diff against the running revision is no longer regular-container-images-only re-resolves to recreate, and the Incarnation bump restamps the step to Drain", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [inplace-fallback]}, status: decided}
  - {state: Update/InPlace, event: spec.revision, transition: T-inplace-ready, outcome: defer, note: "the promote commits the revision it confirmed at runtime; the newer target re-enters through the trigger, the budget and the coordination gate from Ready on the next pass", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [inplace-retarget-while-ready-reported]}, status: decided}
  - {state: Update/InPlace, event: spec.revision, transition: T-inplace-deadline, outcome: defer, note: "the disposition is already committed; a corrective revision is a different retry subject, so the gate admits it and the Instance re-drives from Failed", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [inplace-deadline-exceeded-reason-waits]}, status: decided}
  - {state: Update/InPlace, event: spec.revision, transition: T-inplace-stuck, outcome: defer, note: "same as the deadline path: the held revision denies a repeat of the same target and the corrective one re-drives the Instance from Failed", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [inplace-stuck-corrective-revision]}, status: decided}
  - {state: Update/InPlace, event: spec.revision, transition: T-inplace-scaledown, outcome: ignore, note: "an index leaving the desired set is never updated; the scale-down wave owns it and the new revision reaches only the indices that remain", placement: unit, coverage: {perm: [], unit: [], kind: [], replay: [inplace-scaledown-with-edits]}, status: decided}
  - {state: Update/InPlace, event: spec.revision, transition: T-inplace-teardown, outcome: ignore, note: "the owner carries a deletionTimestamp, so no revision can retarget an index that is being torn down", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [inplace-teardown-with-edits]}, status: decided}
  - {state: Update/InPlace, event: spec.revision, transition: T-inplace-retarget, outcome: transition, to: Update/InPlace, note: "the stamp's idempotency guard is the target revision, so a further move falls through it again and rewrites the expected images once more on the same row", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [inplace-retarget]}, status: decided}
  - {state: Update/InPlace, event: spec.annotationOnly, outcome: ignore, note: "an excluded annotation or label does not change the rendered hash, so the target revision is unchanged and the roll in flight is unaffected", placement: unit, coverage: {perm: [], unit: [], kind: [], replay: [inplace-queue-label-edit]}, status: decided}
  - {state: Update/InPlace, event: spec.strategy, outcome: ignore, note: "the strategy is pinned for the life of the operation on InstanceOperation.Strategy, so the in-flight patch finishes in place under the mode it started in and the edit reaches the Instance at its next admitted attempt", guard: "the operation's pinned strategy, not the desired one, decides the mode of an attempt already under way", placement: perm, coverage: {perm: [], unit: [TestUpdateWithPods_InPlacePatchIgnoresAStrategyEdit], kind: []}, status: decided}
  - {state: Update/InPlace, event: spec.replicasUp, outcome: ignore, note: "the full Create pass is skipped while an update is in flight, but brand-new surge-free indices are still materialized in the same wake-up, so the scale-up proceeds alongside and this Instance is untouched", placement: unit, coverage: {perm: [], unit: [], kind: [], replay: [inplace-patch-observations]}, status: decided}
  - {state: Update/InPlace, event: spec.replicasDown, outcome: transition, to: Delete/Drain, note: "the scale-down pass runs before every other pass and claims any observed index that left the planned set, whatever operation it carries", guard: "this index is beyond the new desired set", placement: unit, coverage: {perm: [], unit: [], kind: [], replay: [inplace-scaledown]}, status: decided}
  - {state: Update/InPlace, event: spec.pauseTrue, outcome: defer, note: "pause blocks new operations and new steps, never a step already under way: the patch runs to its step boundary and the promote that closes it, and only a further step is held. A hold carries Operation.Waiting=Paused with the deadline parked, so no Instance is left below its serving capacity by a pause", placement: perm, coverage: {perm: [], unit: [TestUpdate_InPlacePausedCompletesThePatch, TestPause_RecordsAndReleasesTheHold], kind: []}, status: decided}
  - {state: Update/InPlace, event: spec.pauseFreeze, outcome: defer, note: "freeze additionally suspends repair; the in-flight patch is held on the same step boundary as a standard pause, with Operation.Waiting=Paused and the deadline parked", placement: perm, coverage: {perm: [], unit: [TestPlan_PauseFreeze_AdvancesTheOpenRollOnly], kind: []}, status: decided}
  - {state: Update/InPlace, event: spec.unpause, outcome: ignore, note: "the update pass is planned again and re-enters the same in-flight patch from its persisted operation; nothing is restamped, and a deadline parked by the hold re-arms with a full window measured from the unpause", placement: perm, coverage: {perm: [], unit: [TestPause_RecordsAndReleasesTheHold], kind: []}, status: decided}
  - {state: Update/InPlace, event: spec.teardown, outcome: transition, to: Delete/Drain, note: "teardown short-circuits the whole pipeline: every observed index becomes a scale-down extra and the Deleting phase with the Delete Drain operation is committed in one status transaction", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [inplace-teardown]}, status: decided}
  - {state: Update/InPlace, event: spec.migrateRequest, outcome: defer, note: "the migrate pass declines a fresh record while the source is not steady-Ready and falls through so the in-flight patch converges; the same record is re-picked once the Instance is Ready", placement: perm, coverage: {perm: [], unit: [TestMigrate_SourceMidOperationOnAReadyRow_StillWaits], kind: []}, status: decided}
  - {state: Update/InPlace, event: spec.partition, outcome: ignore, note: "partition candidacy skips any Instance already converging to the target, so an Updating row is never held and the roll finishes", placement: unit, coverage: {perm: [], unit: [], kind: [], replay: [inplace-patch-edits-and-readiness-regression]}, status: decided}
  - {state: Update/InPlace, event: spec.revision, transition: T-inplace-stuckgrace, outcome: defer, note: "the fast escalation already committed its disposition; a corrective revision is a different retry subject, so the held revision does not block it and the Instance re-drives from Failed (workload/disposition.go)", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [inplace-stuckgrace-corrective-revision]}, status: decided}
  - {state: Update/InPlace, event: spec.revision, transition: T-inplace-teardown-deadline, outcome: ignore, note: "the finalizer release purges the owner object and every InstanceStatus row it carried, so no revision can retarget a row that no longer exists (inferencereplica/teardown.go)", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [inplace-teardown-outruns-deadline]}, status: decided}
