  - {state: Update/Drain, event: ctrl.resync, outcome: ignore, note: "the update pass is level-triggered and idempotent: a tick with nothing changed re-derives the phase from the incarnation partition and writes nothing, and the in-flight roll keeps polling on its own requeue interval (ops/update.go)", placement: sim, coverage: {perm: [], unit: [], kind: [], replay: [recreate-rebuild-observations]}, status: current}
