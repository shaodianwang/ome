  - {state: Update/Drain, event: api.throttled, outcome: defer, note: "a shed create is classified as throttled and writes nothing; the server's Retry-After is deposited on the pass pacing, which floors the requeue so the recreate wakes no earlier than the apiserver asked. A shed gate patch is not classified and still retries on controller-runtime backoff; the operation deadline bounds both (ops/create.go)", placement: unit, coverage: {perm: [], unit: [TestRecreatePhaseB_Throttled_HonorsServerDelay], kind: []}, status: decided}
  - {state: Update/Drain, event: timer.forceDelete, windows: [before], outcome: transition, to: Update/Drain, guard: "a force-delete policy is configured and an old-incarnation pod Phase A deleted is past its deletion deadline plus the overdue slack while its node is gone or has been unreachable past the threshold", note: "the update pass sweeps its Terminating pods before dispatching any mode, so a Phase A pod pinned on a dead node is force-deleted with grace zero under a UID precondition and the stable name frees up for Phase B instead of the recreate parking until the operation deadline (ops/update.go, ops/force_delete.go)", placement: sim, coverage: {perm: [], unit: [TestForceDeletePods_SweepsOnlyActionableTerminatingPods, TestUpdateWithPods_ForceDeletesStuckTerminatingSource], kind: [], replay: [drain-force-clock]}, status: decided}
  - {state: Update/Drain, event: timer.forceDelete, windows: [boundary, after], outcome: ignore, note: "the sweep writes nothing to the row, so a clock re-evaluated while another edge commits finds the pod already gone or its evidence unchanged", placement: sim, coverage: {perm: [], unit: [], kind: [], replay: [recreate-force-clock-while-source-reports-ready]}, status: current}
  - {state: Update/Drain, event: api.namespaceTerminating, outcome: escalate, to: Failed, guard: "the rejected write is the Phase B pod create", note: "no rebuild can succeed in a terminating namespace, so Phase B ends on the first rejection with NamespaceTerminating plus the apiserver's message on LastFailure and the operation cleared. Environment-caused, so the revision keeps a clean retry ladder; the namespace teardown deleting the owner is what removes the row (ops/create.go)", placement: unit, coverage: {perm: [], unit: [TestRecreatePhaseB_RejectionDispositions], kind: []}, status: decided}

  # --- Update/InPlace and Update/Drain: admission and slow readiness --
  # GAP: neither in-place nor recreate recycles a dead pod, so a kubelet
  # refusal is polled like a slow start and LastFailure records the generic
  # DeadlineExceeded instead of the reason the kubelet already published.
  - {state: Update/InPlace, event: pod.admissionRejected, outcome: defer, note: "a patched pod is never re-admitted, so a rejection here is a pod the kubelet refused before the patch landed; it is phase Failed, the shared readiness gate rejects it outright rather than reading its stale conditions, and the promote waits out the operation deadline (pkg/controller/v1beta1/workload/ops/update_inplace.go)", placement: kind, coverage: {perm: [], unit: [], kind: [], replay: [inplace-patch-shed-then-refused-pod]}, status: current}
  - {state: Update/Drain, event: pod.admissionRejected, windows: [before], outcome: transition, to: Update/Drain, guard: "the rejected pod holds one of the rebuild's target names, the operation deadline has not elapsed, and the row's outstanding expectations are satisfied", note: "a pod the node refused never ran, and the refusal is the node's capacity accounting rather than anything the revision asked for, so the name is freed immediately instead of being polled to the operation deadline: the shared terminal recycle deletes the occupant with the expectation recorded first, lifts the kubelet's pod-level reason onto LastFailure, and Phase B rebuilds the name once the delete is observed. Environment-caused - no RetryBlock is charged - and the recycle is paced inside the attempt by the same-target retry ladder (pkg/controller/v1beta1/workload/ops/update_recreate.go, pkg/controller/v1beta1/workload/ops/terminal_recycle.go)", placement: unit, coverage: {perm: [], unit: [TestRecreatePhaseB_AdmissionRejectedTargetIsRecycled], kind: []}, status: decided}
  - {state: Update/Drain, event: pod.admissionRejected, windows: [boundary, after], outcome: defer, note: "the recycle is a pod delete that leaves phase and step where they are, so a re-observed rejection lands on the same row and is either paced by the ladder or satisfied by the delete already in flight", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/InPlace, event: pod.runningNotReady, variants: [source], outcome: defer, note: "completion is proven from the container status images plus ContainersReady, and how long the patched pod has been failing its probes drives no decision, so the wait ends only at the operation deadline - where the record names the pod, its first unready container and the readiness condition's message under reason ContainersNotReady instead of a bare DeadlineExceeded (pkg/controller/v1beta1/workload/ops/update_inplace.go, pkg/controller/v1beta1/workload/escalation/deadline.go)", placement: kind, coverage: {perm: [], unit: [], kind: [], replay: [inplace-patched-pod-never-ready-at-deadline]}, status: current}
  - {state: Update/Drain, event: pod.runningNotReady, variants: [source], outcome: defer, note: "Phase C promotes only over the one bar every path shares - every pod PodReady with its minReadySeconds window elapsed - and re-derives it every wake-up, so a recreated pod that runs but never passes its probes holds the roll to the operation deadline. At that deadline the readiness wait is evidence - the record names the pod, its first unready container and the readiness condition's message under reason ContainersNotReady, or names the unsatisfied readiness gates under reason ReadinessGateNotSatisfied when only the gate is missing - but it decides no branch, because readiness limbo is ambiguous between the revision and the node and charges no ladder (pkg/controller/v1beta1/workload/ops/update_recreate.go, pkg/controller/v1beta1/workload/escalation/deadline.go)", placement: kind, coverage: {perm: [], unit: [], kind: [], replay: [recreate-rebuilt-pod-never-ready-at-deadline]}, status: current}

