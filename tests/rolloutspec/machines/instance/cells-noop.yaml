  - {state: Ready, event: gate.deny, variants: [Plan, Pairing, Ratio, Sequential, Budget], outcome: defer, note: "the first denial stops the start and records a RolloutHold carrying the gate name, reason and target; the pass requeues at the gate interval and the hold is cleared as soon as any Instance of the Component makes forward progress. The per-Component budget projects the starts in flight plus the Instances already on the target revision that do not serve it - a promoted Instance whose pods crash-loop, or whose runner restarted since it entered Ready - so a revision that crashes after promotion stops the roll at the budget, and the Budget hold names those Instances and the revision. On a roll with nothing left to start the budget's hold stands only while such an Instance is out of rotation: a promoted set that crashed and is back in rotation is unproven for the window, which paces a further start at the admission, where the denial is reported, and a roll with none to start publishes no hold for it, so a service whose Instance lost a pod reads unheld once the Instance is Ready and serving again (pass_update.go standingHold, ops/update.go RolledSetInRotation). A rolled Instance short of serving by dark pods alone - promoted pods that served and have failed readiness for the stuck-pod grace, none restarted since Ready - is not counted: nothing those pods do lifts the shortfall and no policy rebuilds them, so the Instance holds no slot and the next start is admitted past it (ops/update.go RolledInstanceDark); inside the grace it is counted and the pass wakes for the grace left", placement: perm, coverage: {perm: [p5959, p5961, p5965], unit: [TestCrashAfterPromotion_RollHoldsAtTheBudget, TestPlan_Update_CrashedSetBackInRotationLeavesTheRollIdle, TestSteadyService_PodLossHoldClearsOnceTheInstanceServesAgain, TestRolledSetInRotation, TestRolledInstanceDark_ShortfallOfDarkPodsAloneIsNotTheRollsOpenWork, TestPlan_Update_DarkInstanceOnTheTargetHoldsNoSlot, TestReconcil