# Cells for the three operation-free states of the instance machine:
# Empty (no persisted row), Pending (the paused truth pass's status-only
# demotion) and Ready (every pod runtime-ready and serving).
#
# Authoring convention: one cell per (state, event) row with an empty
# window and transition selector, so a later edge added to the state is
# absorbed rather than left uncovered. A row is split per outgoing
# transition only where the edges genuinely disagree — Ready/spec.revision
# (four strategy-resolved destinations) and Ready/pod.deleted[source]
# (restart repair versus the paused demotion) are the two such rows, plus
# Pending/timer.retryAt, whose only live consumer is the gang rebuild.
# Three further rows split by window alone — Ready/pod.phaseTerminal[Failed],
# Ready/spec.gangWidth[grow] and Ready/spec.rollbackTarget — because the
# event drives an edge of its own in the before window and is absorbed by
# whichever edge is committing in the other two.
#
# Three edges are easy to miss. A planned index with no row stays Empty
# while paused, because pause parks the Create pass, and clearing the pause
# materializes it (T-empty-unpause). A Pending row whose pod set is complete
# and runtime-ready is promoted straight to Ready without a Create operation
# (T-pending-promote). And the escalation pass does not exclude a Pending
# row: with no operation in flight the stuck check falls through to the
# wedged-pod shape, so a leftover pod off the Component's current revision
# can stamp Failed (T-pending-stuck-failed).
cells:
  # --- Empty -------------------------------------------------------------
  - {state: Empty, event: spec.revision, windows: [before], outcome: ignore, note: "a new target revision does not allocate a row; the Create pass stamps Creating only once the index is planned and its pods are missing", placement: unit, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-paused-edits]}, status: current}
  - {state: Empty, event: spec.revision, transition: T-empty-gang-surge-target, outcome: transition, to: Update/GangSurgeTarget, guard: "a gang surge source claimed this free index as its replacement", note: "the marker pins the index in the plan so its PodGroup is created and scale-down leaves it alone", placement: perm, coverage: {perm: [], unit: [TestGangSurgeUpdate_StampsReplacementAtNewIndex], kind: [], replay: [T-empty-gang-surge-target]}, status: current}
  - {state: Empty, event: spec.revision, transition: T-empty-create, outcome: ignore, note: "the attempt pins the revision it stamped; a pin the desired state no longer asks for is retired from Create/CreatePods rather than retargeted here", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-create-with-revision]}, status: current}
  - {state: Empty, event: spec.revision, transition: T-empty-create-retry, outcome: ignore, note: "same pinned-attempt rule as the first create: the retry pins whatever target is current when the block comes due (ops/create.go createRevision), so a template that moved meanwhile is built at the moved revision and the released block's revision is never built; the block that came due no longer denies anything", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-retry-due-with-moved-template]}, status: current}
  - {state: Empty, event: spec.revision, transition: T-empty-migrate-target, outcome: ignore, note: "a migration replacement runs the source's running revision with the anti-affinity overlay; a new target does not retarget it", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-migrate-target-after]}, status: current}
  - {state: Empty, event: spec.revision, transition: T-empty-unpause, outcome: ignore, note: "nothing is pinned until the attempt stamp lands, so the create the unpause releases pins whatever target is current at that moment", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-paused-edits]}, status: current}
  - {state: Empty, event: spec.annotationOnly, outcome: ignore, note: "excluded annotations and labels are filtered out of the revision payload so the hash does not move and nothing is planned", placement: unit, coverage: {perm: [], unit: [TestOpLessRows_ExcludedAnnotationEditStartsNoWork], kind: []}, status: decided}
  - {state: Empty, event: spec.strategy, outcome: ignore, note: "the update strategy is not part of the revision payload and the Create pass is strategy-agnostic", placement: unit, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-paused-edits]}, status: current}
  - {state: Empty, event: spec.replicasUp, windows: [before], outcome: defer, note: "the index is not yet in the plan, or a RetryBlock denies the revision the attempt would pin; the Create pass re-evaluates on its requeue", placement: unit, coverage: {perm: [], unit: [TestCreate_FirstMaterializationRendersTheTarget], kind: [], replay: [idle-empty-retry-with-new-index]}, status: current}
  - {state: Empty, event: spec.replicasUp, transition: T-empty-create, outcome: transition, to: Create/CreatePods, guard: "the index is planned, pods are missing, and no RetryBlock denies the pinned revision", note: "the write-ahead Creating stamp is committed before any pod create, and a surge-free index is materialized even while another index rolls or restarts", placement: perm, coverage: {perm: [], unit: [TestCreate_EmptyClusterCreatesPodsAndRequeues, TestCreateFreshIndices_CreatesAbsentSkipsUpdating], kind: []}, status: decided}
  - {state: Empty, event: spec.replicasUp, transition: T-empty-create-retry, outcome: transition, to: Create/CreatePods, note: "the same create admits the newly planned index once the block is due", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-retry-with-new-index]}, status: current}
  - {state: Empty, event: spec.replicasUp, transition: T-empty-gang-surge-target, outcome: ignore, note: "a replacement-gang index is pinned by its source; scale-up plans the remaining free indices", placement: perm, coverage: {perm: [], unit: [TestCreateFreshIndices_PreservesSurgeTargetMarker], kind: []}, status: current}
  - {state: Empty, event: spec.replicasUp, transition: T-empty-migrate-target, outcome: ignore, note: "the migration record owns its surge index; scale-up plans the remaining free indices", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-migrate-target-after]}, status: current}
  - {state: Empty, event: spec.replicasUp, transition: T-empty-unpause, outcome: ignore, note: "the plan is recomputed from desired replicas on every pass, so an index added while the pause clears is materialized by the same create batch", placement: unit, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-paused-edits]}, status: current}
  - {state: Empty, event: spec.replicasDown, outcome: ignore, note: "the scale-down selection walks observed status rows, so an index with no row has nothing to admit", placement: unit, coverage: {perm: [], unit: [TestPlan_ScaleDown_SelectsExtras], kind: []}, status: current}
  - {state: Empty, event: spec.pauseTrue, outcome: ignore, note: "pause parks the Create pass, so a planned index with no row stays empty until the pause is cleared", placement: unit, coverage: {perm: [], unit: [TestPlan_Create_AlwaysPlannedUnlessPaused], kind: []}, status: decided}
  - {state: Empty, event: spec.pauseFreeze, outcome: ignore, note: "freeze parks the restart pass too; the Create pass was already parked by the ordinary pause", placement: unit, coverage: {perm: [], unit: [TestPlan_Paused_RepairRunsFleetChangesDoNot], kind: []}, status: decided}
  - {state: Empty, event: spec.unpause, outcome: transition, to: Create/CreatePods, guard: "the index is planned and its pods are missing", note: "clearing the pause lets the Create pass materialize the index exactly as it does for a Pending row", placement: perm, coverage: {perm: [], unit: [TestUnpause_EmptyIndexIsMaterializedLikeAPendingRow], kind: [], replay: [empty-unpause]}, status: decided}
  - {state: Empty, event: spec.teardown, outcome: ignore, note: "teardown treats every observed row as a scale-down extra, and an index with no row owns no pods or resources to finalize", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-teardown]}, status: current}
  - {state: Empty, event: spec.migrateRequest, windows: [before], outcome: ignore, note: "a migration request names a source index; the surge index is allocated by the migration record once the source is accepted", placement: unit, coverage: {perm: [], unit: [], kind: [], replay: [T-ready-migrate]}, status: current}
  - {state: Empty, event: spec.migrateRequest, transition: T-empty-migrate-target, outcome: transition, to: Migrate/SurgeTarget, guard: "the migration record allocated this index as its surge", note: "the pin carries the request uuid and a sibling pointer back at the source", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-migrate-target-after]}, status: current}
  - {state: Empty, event: spec.migrateRequest, transition: T-empty-create, outcome: ignore, note: "a fresh migration waits for any in-flight surge, and the create pins a plain index the record never claimed", placement: perm, coverage: {perm: [], unit: [TestPlan_MigrationSurgeWaitsForUpdateSurge], kind: []}, status: current}
  - {state: Empty, event: spec.migrateRequest, transition: T-empty-create-retry, outcome: ignore, note: "same as the first create: the retried attempt owns the index, not the migration record", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-retry-with-migrate-request]}, status: current}
  - {state: Empty, event: spec.migrateRequest, transition: T-empty-gang-surge-target, outcome: ignore, note: "a fresh migration defers while an update surge is in flight, so the replacement-gang index is never claimed by both", placement: perm, coverage: {perm: [], unit: [TestPlan_MigrationSurgeWaitsForUpdateSurge], kind: []}, status: current}
  - {state: Empty, event: spec.migrateRequest, transition: T-empty-unpause, outcome: ignore, note: "the unpaused create pins a plain index; a migration surge index is allocated by the record, never by the Create pass", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-unpause-with-migrate-request]}, status: current}
  - {state: Empty, event: spec.partition, outcome: ignore, note: "the partition hold selects observed rows off the target revision; a first materialization is not partition-gated and renders the target under any hold, having no revision of its own to keep", placement: unit, coverage: {perm: [], unit: [TestPlan_Update_HeldByPartition, TestCreate_FirstMaterializationUnderACanaryRendersTheTarget], kind: []}, status: current}
  - {state: Empty, event: spec.releaseHeldRevision, outcome: defer, note: "the mailbox rewrites the Component's RetryBlock and never touches a row; the create gate consults that block for a fresh start, so a released Held block stops denying the index on the next pass (pkg/controller/v1beta1/inferencereplica/release_held.go)", placement: unit, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Empty, event: timer.retryAt, windows: [before], outcome: defer, note: "the block is not due, or an authorized attempt at that revision is already in flight; the decision layer folds the earliest wake-up into the requeue", placement: unit, coverage: {perm: [], unit: [TestPlan_Update_RetryBlockWait], kind: []}, status: current}
  - {state: Empty, event: timer.retryAt, transition: T-empty-create-retry, outcome: transition, to: Create/CreatePods, guard: "the RetryBlock that denied the create is due and no authorized attempt at that revision is in flight", note: "a RetryBlock is revision-scoped and component-wide, so an index that was never created can be denied by a block another Instance recorded", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [T-empty-create-retry]}, status: current}
  - {state: Empty, event: timer.retryAt, transition: T-empty-create, outcome: ignore, note: "the create is already starting; the block flips to RetryInProgress at attempt-stamp time, after the budget and gate admit", placement: unit, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-retry-with-new-index]}, status: current}
  - {state: Empty, event: timer.retryAt, transition: T-empty-gang-surge-target, outcome: ignore, note: "the replacement-gang marker is stamped by its source, which holds its own continuation exemption from the retry gate", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Empty, event: timer.retryAt, transition: T-empty-migrate-target, outcome: ignore, note: "the retry gate governs revision rollouts, not placement moves", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Empty, event: timer.retryAt, transition: T-empty-unpause, outcome: ignore, note: "the create the unpause releases is already starting; the block flips to RetryInProgress at attempt-stamp time", placement: unit, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-unpause-with-due-block]}, status: current}
  - {state: Empty, event: ctrl.crash, outcome: ignore, note: "an index with no row carries no durable state to lose; the next pass re-plans it from the desired spec and rebuilds expectations from observed pods", placement: kind, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-paused-edits]}, status: current}
  - {state: Empty, event: ctrl.staleRead, outcome: defer, note: "a lagged cache can hide a row that already exists; the destructive passes confirm against a live read and the Create pass adopts an existing pod by name", placement: sim, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-planned-with-edits]}, status: current}
  - {state: Empty, event: api.conflict, outcome: defer, note: "status mutations are read-modify-write and re-check their preconditions on the fresh row, so a conflicting write is retried on the next pass", placement: sim, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-create-stamp-conflict]}, status: current}
  - {state: Empty, event: api.alreadyExists, outcome: ignore, note: "a pod that already carries the index name is adopted rather than recreated, so a retried create after cache lag is harmless", placement: sim, coverage: {perm: [], unit: [TestCreate_IdempotentOnAlreadyExists], kind: []}, status: current}
  - {state: Empty, event: api.notFound, outcome: ignore, note: "a 404 for an index with no row is the expected read; the Create pass materializes it", placement: sim, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Empty, event: api.quotaDenied, outcome: defer, note: "no pod create is outstanding before the write-ahead stamp lands; a quota denial surfaces once the attempt is stamped and is retried on the requeue", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-create-quota-denied]}, status: current}
  - {state: Empty, event: gang.podGroup, variants: [Terminating], outcome: defer, note: "EnsurePodGroupsWithState classifies every planned gang index before the dispatcher, and a leftover terminating object at the deterministic name withholds the members the Create pass would place there - each pod is stamped with that name and would enlist in a group this owner does not yet control. The index waits without a stamp of its own; the hold pass writes a gang hold, and the escalation pass a gang verdict, onto an in-flight operation, and this row carries none, so neither reaches it (pkg/controller/v1beta1/inferencereplica/reconciler.go)", invariants: [podgroup.before.pods], placement: unit, coverage: {perm: [], unit: [TestEnsurePodGroupsWithState_ForeignCollisionAndTerminatingGate], kind: []}, status: decided}
  - {state: Empty, event: gang.podGroup, variants: [OwnershipConflict], outcome: defer, note: "a group at that name owned by another UID is recorded as a collision and its members are withheld, while the pass finishes the Component's other gangs rather than aborting. No verdict is raised against an index with no row - the hold pass writes a gang hold, and the escalation pass a gang verdict, onto an in-flight operation, and this row carries none, so neither reaches it - so the collision is visible only once the Create pass stamps an attempt (pkg/controller/v1beta1/workload/podgroup/podgroup.go)", placement: unit, coverage: {perm: [], unit: [TestEnsurePodGroupsWithState_ForeignCollisionAndTerminatingGate], kind: []}, status: decided}
  - {state: Empty, event: gang.podGroup, variants: [Deleted], outcome: ignore, note: "the PodGroup watch admits deletes, and the ensure recreates the group from the plan before any pod of the index exists, so the loss is invisible to the row (pkg/controller/v1beta1/workload/gang/gang.go)", placement: unit, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-paused-edits]}, status: current}
  - {state: Empty, event: gang.podGroup, variants: [PhaseFailed], outcome: defer, note: "podGroupPredicate admits the phase change, and the PodGroup pass deletes the failed group and rebuilds it on the next reconcile with one PodGroupReset warning; the index's members are withheld until the replacement exists. The absorbing Failed phase is why the group is replaced rather than waited on - the gang scheduler's controller stops reconciling it and the ensure only touches labels, ownership and size (pkg/controller/v1beta1/inferencereplica/watches.go)", placement: unit, coverage: {perm: [], unit: [TestEscalation_GangFailedReadingOnAnOpLessRowIsInert], kind: []}, status: decided}
  - {state: Empty, event: gang.podGroup, variants: [Unschedulable, ScheduleTimeout], outcome: ignore, note: "neither reading exists on the PodGroup - the vendored gang scheduler writes no Unknown phase and no ScheduleStartTime - so there is nothing to enqueue. A gang that cannot be placed says so on its member pods, and an index with no pods yet has none to say it (pkg/controller/v1beta1/inferencereplica/watches.go)", placement: unit, coverage: {perm: [], unit: [TestObserveGang_SchedulingPhasesReportNothing], kind: []}, status: decided}
  - {state: Empty, event: spec.gangWidth, outcome: ignore, note: "the per-Instance pod count is recomputed from the plan every pass and PodGroup MinMember is re-derived with it, so an index with no row is simply created at the width current when its attempt stamps (pkg/controller/v1beta1/workload/types/plan.go)", placement: unit, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-paused-edits]}, status: current}
  - {state: Empty, event: spec.policyTuning, outcome: ignore, note: "no lifecycle knob feeds the revision payload and none is persisted on a row that does not exist; the create the pass eventually stamps reads them fresh from the projected spec (pkg/controller/v1beta1/inferenceservice/reconcilers/irprojector/projector.go)", placement: unit, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-paused-edits]}, status: current}
  - {state: Empty, event: spec.rollbackTarget, outcome: ignore, note: "the override rewrites the desired spec and the roll target before the plan is built, and nothing is pinned until the attempt stamp lands, so the create pins whatever target resolves at that moment (pkg/controller/v1beta1/inferencereplica/reconciler.go)", placement: unit, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-paused-edits]}, status: current}
  - {state: Empty, event: config.changed, outcome: ignore, note: "operator lifecycle config is read through the TTL cache on each pass and nothing about it is persisted on the row, so an index with no row simply plans against the new values (pkg/controller/v1beta1/inferencereplica/reconciler.go)", placement: unit, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-planned-with-edits]}, status: current}
  - {state: Empty, event: ctrl.resync, outcome: ignore, note: "the tick re-derives the same plan from the desired spec and observed pods; it is what eventually materializes a planned index, but by itself it changes nothing (pkg/controller/v1beta1/workload/plan_decision.go)", placement: unit, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-paused-edits]}, status: current}
  - {state: Empty, event: timer.teardownDeadline, outcome: ignore, note: "the deadline releases the teardown finalizer so the owner and every row it carried are purged; an index with no row is already what that purge leaves behind (pkg/controller/v1beta1/inferencereplica/teardown.go)", placement: unit, coverage: {perm: [], unit: [TestTeardown_DeadlineExceeded_WarnsAndReleases], kind: []}, status: current}
  # GAP: a 422 is not retriable, but nothing classifies it and this state
  # carries no operation deadline, so the write is retried without bound.
  - {state: Empty, event: api.invalid, outcome: defer, note: "the rejection classifier is reached from a pod create, and the create that materializes this index stamps Creating first, so a 422 on it is classified and disposed on that state; a write issued while the row is still Empty falls into controller-runtime's exponential backoff with no event and no condition", placement: sim, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-create-invalid]}, status: current}
  - {state: Empty, event: api.throttled, outcome: defer, note: "a shed pod create is classified as throttled and its Retry-After floors the pass requeue, but that create belongs to the Creating attempt it stamps first; any other shed write from an Empty row retries on controller-runtime backoff (pkg/controller/v1beta1/workload/ops/create.go)", placement: sim, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-create-shed]}, status: current}
  - {state: Empty, event: api.namespaceTerminating, outcome: defer, note: "the terminating cause is read on the pod create, and that create stamps Creating first, so the refusal is classified and disposed on that state; the row is in any case flipped onto the teardown path once namespace GC deletes the owner (pkg/controller/v1beta1/inferencereplica/teardown.go)", placement: sim, coverage: {perm: [], unit: [], kind: [], replay: [idle-empty-create-in-terminating-namespace]}, status: current}

  # --- Pending -----------------------------------------------------------
  # A Pending row is a Ready row demoted for losing every pod with no
  # operation in flight: the paused truth pass writes it, and the status
  # publication writes the same shape at the end of every pass. Counters,
  # revisions and Incarnation are preserved, so recovery is the ordinary
  # Create pass — or, under RecreateInstanceOnPodRestart, the restart pass,
  # which reads the kept running revision and rebuilds at it.
  - {state: Pending, event: pod.scheduled, variants: [source], outcome: ignore, note: "the Create pass owns a Pending row's pods and consumes nothing until the whole set is runtime-ready", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [idle-pending-paused-pod-observations]}, status: current}
  - {state: Pending, event: pod.containersReady, variants: [source], outcome: transition, to: Ready, guard: "the pod set is complete, every pod is PodReady, and the minReadySeconds window has elapsed", note: "the Create pass promotes a set that clears the shared promote bar straight to Ready, stamping RunningRevision when the pods carry the target hash, so the paused demotion is reversible without a Create operation", placement: perm, coverage: {perm: [], unit: [TestCreate_AllPodsReady_FlipsServingAndMarksReady, TestCreate_PromoteRecordsRunningRevision], kind: [], replay: [pending-promote]}, status: decided}
  - {state: Pending, event: pod.ready, variants: [source], outcome: ignore, note: "PodReady is half of the promote bar but the promote is driven by the Create pass re-deriving the whole set, not by this observation, and the wreckage scan is confined to Ready and Failed rows", placement: perm, coverage: {perm: [], unit: [TestPendingRow_PodObservationsAreInert], kind: []}, status: decided}
  - {state: Pending, event: pod.servingOn, variants: [source], outcome: ignore, note: "the serving gate is written by the Create promote itself, immediately before the Ready commit", placement: perm, coverage: {perm: [], unit: [TestPendingRow_PodObservationsAreInert], kind: []}, status: decided}
  - {state: Pending, event: pod.servingOff, variants: [source], outcome: ignore, note: "a Pending row claims no serving capacity; the gate is flipped on again by the promote", placement: perm, coverage: {perm: [], unit: [TestPendingRow_PodObservationsAreInert], kind: []}, status: decided}
  - {state: Pending, event: pod.deleted, variants: [source], outcome: ignore, note: "the row already claims no backing pods; once the pause is cleared the Create pass re-materializes whatever is missing, or under RecreateInstanceOnPodRestart the restart pass rebuilds the row at the revision it records, unless a Held block denies the target revision the replacements would carry", placement: perm, coverage: {perm: [], unit: [TestPendingRow_PodObservationsAreInert, TestCreate_RetryBlockHeld_DeniesMissingMemberRebuild], kind: []}, status: decided}
  - {state: Pending, event: pod.waiting, outcome: escalate, note: "with no operation in flight the stuck-pod check falls through to the wedged-pod shape, so a leftover pod whose revision hash disagrees with the Component's current revision stamps Failed past the grace; there is no attempt to dispose, so the plain stamp applies and no RetryBlock is recorded", guard: "the pod set is not fully serving and the stuck-pod grace is configured", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [pending-stuck]}, status: current}
  - {state: Pending, event: pod.containerRestart, outcome: ignore, note: "restart evidence is anchored on ReadySince, so a container restart below Ready is the ordinary boot path", placement: perm, coverage: {perm: [], unit: [TestDetectRestartTrigger_BootRestartsForgiven], kind: []}, status: current}
  - {state: Pending, event: pod.uidRotated, outcome: ignore, note: "an Instance is keyed by index and incarnation, not by pod UID; a same-name pod is observed as the same member", placement: kind, coverage: {perm: [], unit: [], kind: [], replay: [idle-pending-pod-churn-ignored]}, status: current}
  - {state: Pending, event: pod.stuckTerminating, outcome: ignore, note: "force-delete escalation belongs to the scale-down wave; elsewhere a Terminating pod simply counts as live and defers the truth pass", placement: kind, coverage: {perm: [], unit: [], kind: [], replay: [idle-pending-paused-pod-observations]}, status: current}
  - {state: Pending, event: pod.nodeLost, outcome: ignore, note: "a Pending row holds no serving pods - a demoted row has none and a row before its first create has none - so the loss has nothing of this row's to reach; a pod it does hold is swept like a Ready row's under the force-delete policy (see Ready/pod.nodeLost) and the Create pass re-materializes the name", placement: kind, coverage: {perm: [], unit: [], kind: [], replay: [idle-pending-pod-churn-ignored]}, status: current}
  - {state: Pending, event: pod.schedulingGated, outcome: defer, note: "a gated pod counts as present, so the Create pass creates no duplicate and waits on its requeue", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [idle-pending-gated-pod-waits]}, status: current}
  - {state: Pending, event: pod.evicted, outcome: transition, to: Create/CreatePods, guard: "the restart pass does not take the row: a policy other than RecreateInstanceOnPodRestart, or no running revision recorded", note: "an evicted pod is terminal, so the Create pass reads its name as free, commits the Create attempt ahead of any pod write and recycles the dead occupant on the same pass - the recycle counted on the attempt, the kubelet's reason on LastFailure, TerminalPodRecycled - and recreates it once the delete is observed (T-pending-recycle-evicted); under RecreateInstanceOnPodRestart a row that records the revision it ran is the restart pass's, as for any terminal pod", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [idle-pending-pod-evicted-recycled]}, status: current}
  - {state: Pending, event: spec.revision, outcome: ignore, note: "the update trigger declines for any phase below Ready, so a new target neither rolls nor retargets a Pending row. A demoted row with no pod left is materialized by the Create pass at the new target, because the restart pass yields a row whose recorded revision is not the roll target — unless the canary step's projected partition holds the Instance, in which case the rebuild renders and pins the revision the row records, so the step keeps its planned size and the step machine alone promotes the Instance; one that holds survivors again is still rebuilt by the repair at the revision it records, since no update trigger reads a Pending row, and the roll follows once it is Ready", placement: unit, coverage: {perm: [], unit: [TestPlan_Restart_DemotedRowOffTarget, TestRepairYieldsToTarget, TestCreate_PodlessDemotedRowRendersTheTarget, TestCreate_PodlessStableRowUnderACanaryKeepsItsRevision], kind: []}, status: decided}
