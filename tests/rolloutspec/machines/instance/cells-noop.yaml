  - {state: Ready, event: gate.deny, variants: [RetryBlock], outcome: defer, note: "a not-yet-due Backoff block for the current target denies the fresh trigger; the decision layer folds the earliest wake-up across Instances into the requeue so the gate is re-evaluated on time. While Instances already on the target that crashed after promotion stand behind the ladder - its backoff not yet due, its attempt due or under way as a Restart, or the rebuilt set not yet proven - the RetryBlock hold is the roll's standing, on a roll that completed before the crash as on one in flight: it names the failed attempts and the Instances the attempt rebuilds, and the status writer publishes it for a converged subject as for one mid-roll, so the status says why from the ladder's first rebuild rather than at its end (pass_update.go ladderHold, ops/update.go RetryBlockOfCrashedAttempt, inferencereplica/status.go effectiveRolloutHold)", placement: unit, coverage: {perm: [], unit: [TestPlan_Update_RetryBlockWait, TestCrashAfterPromotion_FullyRolledGangLadderSaysWhyFromItsFirstRebuild, TestCrashAfterPromotion_FullyRolledGangSaysWhyWithinACadence, TestRetryBlockOfCrashedAttempt, TestLadderAttemptRebuilds_NamesTheRestartThatIsTheAttempt, TestRolledInstanceCrashed_RememberedCrashReadsThroughTheRebuild], kind: []}, status: current}
  - {state: Ready, event: gate.deny, variants: [Held], outcome: defer, note: "a Held block has no time bound: it denies every pod at that target - the fresh attempt, and equally the Create pass's fill of a member a serving row lost - until a different target revision arrives, which is a different RetrySubject and passes; superseded blocks are pruned by the end-of-pass bookkeeping. A Ready row whose promoted pod set crashes inside its crash window on a Held revision is not rebuilt, and its park follows the pod set: the restart pass parks it Failed naming the crash, with an InstanceFailed warning once per pod set, while the set is out of serving, and keeps it Ready naming the crash loop on its failure record while the set serves between crashes, with ReadySince and the record's time kept; the note clears once the set has held Ready for the proven window or the hold is gone, so the hold is visible on the row for as long as the loop is", placement: perm, coverage: {perm: [], unit: [TestDetectRestartTrigger_CrashLoopDeniedByHeldRetryBlock, TestRestart_HeldLadderKeepsAServingSetReadyAndNamesTheLoop, TestRestart_HeldLadderParksTheSetOnceItLeavesServing, TestRestart_CrashLoopParkReturnsToReadyWhileItsSetServes, TestRestart_ProvenSetClearsTheCrashLoopNote, TestCrashLoopNote_RecordedOnceAndCleared, TestCrashLoopAfterPromotion_HeldRowFollowsItsServingPod, TestCreate_RetryBlockHeld_DeniesMissingMemberRebuild, TestCrashAfterPromotion_WholeGangComponentMovedSaysWhy, TestCrashAfterPromotion_GangPushStopsAtItsBudgetAndSaysWhy, TestCrashAfterPromotion_FullyRolledGangLadderSaysWhyFromItsFirstRebuild, TestConvergedSubject_HeldLadderOnItsRevisionIsReportedWithNothingToRun], kind: []}, status: decided}
