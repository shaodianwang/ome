  - {state: Ready, event: timer.stuckPodGrace, outcome: escalate, guard: "a pod of the row holds a terminal waiting reason and the pod set is not fully serving", note: "the grace is a different clock and origin than the operation deadline, and it is what arms both responses on a Ready row, each measuring it its own way - the repair from the pod's creation, the time a pod gets to come up before a parked pod is a wedge at once, and the leftover escalation from the start of the pod's waiting episode, its creation or the moment its containers last stopped being ready: an on-target pod opens a Restart operation, which the unavailability budget and then the coordination gate must admit when the pod set still serves, and a leftover pod whose revision-hash label disagrees with the Component's current revision is stamped Failed (pkg/controller/v1beta1/workload/escalation/escalation.go). The grace ending raises no watch event, so the pass that reads an on-target pod parked inside it opens nothing and deposits the grace left - the earliest among a gang's parked members - as its own wake-up (ops/restart.go crashLoopRepairReason over evidence.CrashLoopWedge): the repair opens the moment the grace ends, not on the next cadence tick and not on the rate-limited backoff a pass with no cadence falls to. A promoted pod that stopped passing readiness measures the same grace from the ContainersReady condition's last transition out of True (evidence.PodUnreadyPastGrace): past it the pod is dark for the budgets and the gates under every policy, but on an idle row no repair opens and no wake is owed for it, because readiness is the runtime's own signal and no restart policy rebuilds a pod that runs; the restart pass reads the shape as a wedge, and deposits its grace left, only against the running revision's ladder once the set's crash is counted there (the pod.runningNotReady cell)", placement: perm, coverage: {perm: [], unit: [TestEscalation_DeadlineElapsedButServing_NoFailedStamp, TestRe