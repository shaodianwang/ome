  - {state: Ready, event: pod.runningNotReady, variants: [source], windows: [boundary, after], outcome: ignore, note: "on an update transition the dark pod is why the roll takes the row first: its start skips the coordination gate consult on a drain-first strategy and is listed ahead of the serving peers under every strategy, the update pass replaces the pod set at the target, and no repair opens; a rollback that lands once the dark Instance has moved brings it back on a fresh pod the same way, with the starting revision never held behind the unready pod. An Instance the roll moved onto the target whose fresh pod served and failed readiness again is dark for the roll as well: short of serving by dark pods alone, none restarted since Ready, it holds no slot in either arm's budget and opens no floor hold (ops/update.go RolledInstanceDark), a hold names it only while the pod is inside the grace, and the roll reaches its end past it; a rollback started there lands, and the row the Instance comes back on stays Ready with its serving count below its pod count while the cause stays, the signal an idle row gives, with no pass demoting it", placement: unit, coverage: {perm: [p5959, p5961, p5965, p4014, p4094], unit: [TestReconcile_MetadataPushOverADarkInstance_InPlaceStepRecreatesIt, TestRollback_AtTheLastStepOfAMetadataRollOverADarkInstance_Lands, TestUpdateWithPods_InPlaceStartOverADarkPodRecreatesWhenItReplacesNoContainer, TestPlan_Update_CoordGateExempt_ReadyRowUnreadyPastTheWindow, TestReconcile_UnreadyVictimPastTheWindow_DrainFirstRollTakesItFirst, TestRollback_OverAnUnreadyVictimPastTheWindow_SettlesOnTheStartingRevision, TestRolledInstanceDark_ShortfallOfDarkPodsAloneIsNotTheRollsOpenWork, TestPlan_Update_DarkInstanceOnTheTargetHoldsNoSlot, TestReconcile_DarkRolledInstanceHoldsNoFloor, TestReconcile_RollOverADarkInstanceOnTheTarget_ReachesItsEndAndTheRollbackLands], kind: [], replay: [inplace-dark-recreate]}, status: decided}


