    effects: [the dead occupant deleted with the expectation recorded before the delete, the recycle counted on the operation and paced by the same-target retry ladder, the dead pod's diagnostics captured onto LastFailure, TerminalPodRecycled warning, the name recreated on a later pass once the delete is observed]
