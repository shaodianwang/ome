# Each guard states, in one line, the condition the named file actually
# checks before the write that leaves the source state. A transition whose
# "to" is Empty removes the InstanceStatus row.
#
# lane says which harness drives the edge. The default, workload, means the
# replay lane drives it: everything its guard reads is an input
# workload.Reconcile receives. lane: adapter marks an edge whose guard
# depends on something only the InferenceReplica adapter produces — the
# teardown deadline, the published pod counters, the reset annotation — and
# its why names that input. An adapter-lane edge is covered by a tagged Go
# test in the adapter package instead.
transitions:
  # --- Empty -------------------------------------------------------------
  - id: T-empty-create
    from: Empty
    event: spec.replicasUp
    guard: the index is planned, pods are missing, and no RetryBlock denies the revision the attempt would pin
    to: Create/CreatePods
    effects: [Phase Creating with a Create CreatePods operation committed before any pod create, pods created]
    decided_in: pkg/controller/v1beta1/workload/ops/create.go
  - id: T-empty-create-retry
    from: Empty
    event: timer.retryAt
    guard: the RetryBlock that denied the create is due and no authorized attempt at that revision is in flight
    to: Create/CreatePods
    effects: [Phase Creating with a Create CreatePods operation committed, pods created]
    decided_in: pkg/controller/v1beta1/workload/ops/create.go
  - id: T-empty-unpause
    from: Empty
    event: spec.unpause
    guard: a standard pause plans nothing past the restart pass, so a planned index with no row stays Empty until pause is cleared and the Create pass runs again
    to: Create/CreatePods
    effects: [Phase Creating with a Create CreatePods operation committed, pods created]
    decided_in: pkg/controller/v1beta1/workload/ops/create.go
  - id: T-empty-gang-surge-target
    from: Empty
    event: spec.revision
    guard: a gang surge source claimed this free index as its replacement and the slot is still empty
    to: Update/GangSurgeTarget
    effects: [Phase Creating with the gang surge-target marker stamped at Incarnation one, the index pinned in the plan]
    decided_in: pkg/controller/v1beta1/workload/status/decision.go
  - id: T-empty-migrate-target
    from: Empty
    event: spec.migrateRequest
    guard: the migration record allocated this index as its surge and the pair stamp is being established
    to: Migrate/SurgeTarget
    effects: [Phase Creating with the Migrate pin carrying the request uuid and a sibling pointer at the source]
    decided_in: pkg/controller/v1beta1/workload/ops/migrate.go

  # --- Pending -----------------------------------------------------------
  - id: T-pending-create
    from: Pending
    event: spec.unpause
    guard: pause is cleared so the Create pass runs again, pods are missing, no RetryBlock denies the revision, and the row is not one the restart pass repairs (under RecreateInstanceOnPodRestart a row that records the revision it ran takes T-pending-restart instead, unless that revision is not the roll target and no pod is left, in which case the Create pass materializes it at the target)
    to: Create/CreatePods
    effects: [Phase Creating with a Create CreatePods operation committed, pods created]
    decided_in: pkg/controller/v1beta1/workload/ops/create.go
  - id: T-pending-restart
    from: Pending
    event: spec.unpause
    guard: policy RecreateInstanceOnPodRestart, the row records the revision it ran, the pause does not suspend the restart pass, the live pod count is below the Instance's desired pod count, no RetryBlock denies that revision, and that revision is still the roll target or the Component remains paused (a plain pause withholds the roll, so the repair keeps the row); once the pause clears, a demoted row off the target with no pod left is the Create pass's at the target
    to: Restart/Drain
    effects: [Incarnation bumped, Phase Restarting with the Restart Drain operation and the pod-count reason recorded, the pod set rebuilt at the running revision rather than the target]
    decided_in: pkg/controller/v1beta1/workload/ops/restart.go
  - id: T-pending-promote
    from: Pending
    event: pod.containersReady
    variant: source
    guard: the Create pass finds the pod set complete and every pod PodReady past its minReadySeconds window, so its ready action promotes without stamping Creating first
    to: Ready
    effects: [Phase Ready with ReadySince stamped and the operation left nil, RunningRevision set when the pods carry the target revision hash]
    decided_in: pkg/controller/v1beta1/workload/ops/create.go
  - id: T-pending-stuck-failed
    from: Pending
    event: pod.waiting
    guard: a leftover pod whose revision-hash label disagrees with the Component's current revision stays in a terminal waiting reason past the stuck-pod grace, and the pod set is not fully serving
    to: Failed
    effects: [Phase Failed with the stuck pod's termination on LastFailure and no operation, since an operation-less row is never disposed]
    decided_in: pkg/controller/v1beta1/workload/escalation/escalation.go
  - id: T-pending-gang-restart
    from: Pending
    event: timer.retryAt
    guard: a gang row whose recorded pod count is complete but whose live pods are fewer, and whose RetryBlock has come due so the rebuild gate no longer denies; the same test is unsatisfiable at one expected pod
    to: Restart/Drain
    effects: [Operation Restart Drain stamped, the surviving pods drained and deleted before the rebuild at a bumped incarnation]
    decided_in: pkg/controller/v1beta1/workload/ops/restart.go
    lane: adapter
    why: below Ready the rebuild trigger compares live pods against the row's recorded PodCount, which only the adapter's status publication writes
  - id: T-pending-terminal-restart
    from: Pending
    event: pod.phaseTerminal
    guard: a gang row whose recorded pod count is complete but whose live pods are fewer once terminal-phase pods are excluded, with at least one survivor and the rebuild gate admitting
    to: Restart/Drain
    effects: [Operation Restart Drain stamped, the surviving pods drained and deleted before the rebuild at a bumped incarnation]
    decided_in: pkg/controller/v1beta1/workload/ops/restart.go
    lane: adapter
    why: below Ready the rebuild trigger compares live pods against the row's recorded PodCount, which only the adapter's status publication writes
  - id: T-pending-scaledown
    from: Pending
    event: spec.replicasDown
    guard: the index is beyond the desired set and the scale-down wave admits it
    to: Delete/Drain
    effects: [Phase Deleting and the Delete Drain operation committed in one status transaction]
    decided_in: pkg/controller/v1beta1/workload/ops/delete_batch.go
  - id: T-pending-teardown
    from: Pending
    event: spec.teardown
    guard: the owner carries a deletionTimestamp so every observed index is treated as a scale-down extra
    to: Delete/Drain
    effects: [Phase Deleting and the Delete Drain operation committed in one status transaction]
    decided_in: pkg/controller/v1beta1/workload/reconcile.go
  - id: T-pending-stuckgrace
    from: Pending
    event: timer.stuckPodGrace
    guard: the grace elapsed on a leftover pod whose revision-hash label disagrees with the Component current revision while it holds a terminal waiting reason, and the pod set is not fully serving
    to: Failed
    effects: [Phase Failed with the stuck pod termination on LastFailure and no operation, since an operation-less row is never disposed]
    decided_in: pkg/controller/v1beta1/workload/escalation/escalation.go
  - id: T-pending-teardown-deadline
    from: Pending
    event: timer.teardownDeadline
    guard: the owner is Terminating, the configured teardown deadline has passed since its deletionTimestamp, and the teardown finalizer is still held
    to: Empty
    effects: [TeardownDeadlineExceeded warning, the teardown finalizer released so the owner object and every InstanceStatus row it carried are purged in one delete, surviving pods and their owner references left to background GC]
    decided_in: pkg/controller/v1beta1/inferencereplica/teardown.go
    lane: adapter
    why: the owner's teardown deadline and the finalizer release are the adapter's teardown pass, which runs outside workload.Reconcile

  # --- Ready -------------------------------------------------------------
  - id: T-ready-surge
    from: Ready
    event: spec.revision
    guard: strategy SurgeThenDrain, the coordination gate and the per-Component surge budget both admit a fresh start
    to: Update/Surge
    effects: [Phase Updating with the Surge step pinned to the rolling revision, replacement pod or gang created, any due RetryBlock flipped to RetryInProgress]
    decided_in: pkg/controller/v1beta1/workload/ops/update_surge.go
  - id: T-ready-inplace
    from: Ready
    event: spec.revision
    guard: a single-pod Instance under InPlaceIfPossible or InPlaceOnly whose diff against the running revision is regular-container images only
    to: Update/InPlace
    effects: [Phase Updating with the InPlace step, the image-transition marker written before the patch]
    decided_in: pkg/controller/v1beta1/workload/ops/update.go
  - id: T-ready-recreate
    from: Ready
    event: spec.revision
    guard: strategy RecreatePod, or an in-place strategy whose diff is not image-only or whose Instance is multi-pod, with the unavailability budget and the gate admitting
    to: Update/Drain
    effects: [Incarnation bumped, Phase Updating with the Drain step and the revision-pair cause recorded, source serving gate off]
    decided_in: pkg/controller/v1beta1/workload/ops/update_recreate.go
  - id: T-ready-inplaceonly-reject
    from: Ready
    event: spec.revision
    guard: a single-pod Instance under InPlaceOnly whose diff exceeds container images
    to: Ready
    effects: [InPlaceUpdateNotPossible warning event, the update pass returns an error and no operation is stamped]
    decided_in: pkg/controller/v1beta1/workload/ops/update.go
  - id: T-ready-restart
    from: Ready
    event: pod.deleted
    variant: source
    guard: policy RecreateInstanceOnPodRestart, the live pod count is below the Instance's desired pod count, and the revision the row runs is still the roll target (or the Component is paused or the target is Held, which withhold the roll the row would otherwise be left to)
    to: Restart/Drain
    effects: [Incarnation bumped, Phase Restarting with the Restart Drain operation and the trigger reason recorded]
    decided_in: pkg/controller/v1beta1/workload/ops/restart.go
  - id: T-ready-restart-crash
    from: Ready
    event: pod.containerRestart
    guard: policy RecreateInstanceOnPodRestart, the runner container started or terminated after ReadySince, and the revision the row runs is still the roll target (or the Component is paused or the target is Held)
    to: Restart/Drain
    effects: [Incarnation bumped, Phase Restarting, the failing pod's termination captured into LastFailure before the drain]
    decided_in: pkg/controller/v1beta1/workload/ops/restart.go
  - id: T-ready-demote
    from: Ready
    event: pod.deleted
    variant: source
    guard: paused with no restart pass repairing the row this reconcile (a frozen pause, or a policy other than RecreateInstanceOnPodRestart), no operation, and the live read confirms no pod backs the row
    to: Pending
    effects: [Phase Pending with counters, revisions and Incarnation preserved so the pass that rebuilds the row still finds the revision it ran, InstanceDemoted warning event]
    decided_in: pkg/controller/v1beta1/workload/reconcile.go
  - id: T-ready-stuck-failed
    from: Ready
    event: pod.waiting
    guard: a pod whose revision-hash label disagrees with the Component's current revision stays in a terminal waiting reason past the stuck-pod grace, and the pod set is not fully serving
    to: Failed
    effects: [Phase Failed with the stuck pod's termination on LastFailure]
    decided_in: pkg/controller/v1beta1/workload/escalation/escalation.go
  - id: T-ready-crashloop-restart
    from: Ready
    event: pod.waiting
    guard: a pod of a Ready row with no operation holds a terminal waiting reason past lifecycle.stuckPodGracePeriod while its revision-hash label still matches the Component's current revision, whatever the restart policy says, the revision the row runs is still the roll target (or the Component is paused or the target is Held), and the RetryBlock for that revision admits a fresh attempt, as must the unavailability budget and the coordination gate when the pod set still serves (a pod set that serves nothing is admitted by neither), and the pass has opened fewer than lifecycle.repairBatchSize fresh repairs
    to: Restart/Drain
    effects: [Incarnation bumped, Phase Restarting with the crash-loop reason recorded on LastFailure, the rebuild paced by the per-Component budget when the pod set still serves and by lifecycle.repairBatchSize fresh repairs per pass either way, and gated by the revision's RetryBlock]
    decided_in: pkg/controller/v1beta1/workload/ops/restart.go

  - id: T-ready-migrate
    from: Ready
    event: spec.migrateRequest
    guard: migration mode allows it, the source is steady Ready with a recorded running revision, and the from-node, capacity and overlay checks pass
    to: Migrate/CreateSurge
    effects: [record advanced to SurgePending with the allocated surge index, Phase Migrating with the Migrate pin, Started ledger row persisted]
    decided_in: pkg/controller/v1beta1/workload/ops/migrate.go
  - id: T-ready-scaledown
    from: Ready
    event: spec.replicasDown
    guard: the index leaves the desired set - a Ready row with a pod out of rotation before a healthy one, then the highest index - and the scale-down wave admits it within its pod budget
    to: Delete/Drain
    effects: [Phase Deleting and the Delete Drain operation committed in one status transaction]
    decided_in: pkg/controller/v1beta1/workload/ops/delete_batch.go
  - id: T-ready-teardown
    from: Ready
    event: spec.teardown
    guard: the owner carries a deletionTimestamp so every observed index is treated as a scale-down extra
    to: Delete/Drain
    effects: [Phase Deleting and the Delete Drain operation committed in one status transaction]
    decided_in: pkg/controller/v1beta1/workload/reconcile.go
  - id: T-ready-restart-podterminal
    from: Ready
    event: pod.phaseTerminal
    guard: policy RecreateInstanceOnPodRestart, the revision the row runs is still the roll target (or the Component is paused or the target is Held), and a pod of the Instance reaches a terminal phase - Failed, which the Ready-phase restart detector reads as an explicit phase check, or Succeeded, which drops the pod out of the live count that detector compares against the desired one; phase Unknown is neither
    to: Restart/Drain
    effects: [Incarnation bumped, Phase Restarting with the Restart Drain operation, the terminated pod's termination captured into LastFailure before the drain]
    decided_in: pkg/controller/v1beta1/workload/ops/restart.go
  - id: T-ready-gangwidth-create
    from: Ready
    event: spec.gangWidth
    variant: grow
    guard: policy not RecreateInstanceOnPodRestart, so the Create pass owns the shortfall; the widened runner set leaves ordinals missing at an unchanged revision hash
    to: Create/CreatePods
    effects: [Phase Creating with a Create CreatePods operation stamped over the Ready row, only the missing ordinals created, Incarnation and RunningRevision untouched, PodGroup MinMember raised on the same pass]
    decided_in: pkg/controller/v1beta1/workload/ops/create.go
  - id: T-ready-gangwidth-restart
    from: Ready
    event: spec.gangWidth
    variant: grow
    guard: policy RecreateInstanceOnPodRestart and the revision the row runs is still the roll target, so the restart detector reads the live pod count as below the widened expectation and claims the row ahead of the Create pass; a widening that lands with a new revision is the roll's, which rebuilds the gang at the new width and the target
    to: Restart/Drain
    effects: [Incarnation bumped, Phase Restarting, the whole gang drained and deleted before it is rebuilt at the new width]
    decided_in: pkg/controller/v1beta1/workload/ops/restart.go
  - id: T-ready-rollback-surge
    from: Ready
    event: spec.rollbackTarget
    guard: the roll target resolves to the stored revision, or back to the rendered template when the override is cleared, and strategy SurgeThenDrain with the gate and the surge budget admitting a fresh start
    to: Update/Surge
    effects: [Phase Updating with the Surge step pinned to the resolved roll target, replacement pod or gang created; the rendered template is still reported as UpdateRevision]
    decided_in: pkg/controller/v1beta1/inferencereplica/reconciler.go
  - id: T-ready-rollback-inplace
    from: Ready
    event: spec.rollbackTarget
    guard: the roll target resolves to the stored revision, or back to the rendered template when the override is cleared, on a single-pod Instance under an in-place strategy whose diff against the running revision is regular-container images only
    to: Update/InPlace
    effects: [Phase Updating with the InPlace step at the resolved roll target, the image-transition marker written before the patch]
    decided_in: pkg/controller/v1beta1/inferencereplica/reconciler.go
  - id: T-ready-rollback-recreate
    from: Ready
    event: spec.rollbackTarget
    guard: the roll target resolves to the stored revision, or back to the rendered template when the override is cleared, under a recreate-resolved strategy with the unavailability budget and the gate admitting
    to: Update/Drain
    effects: [Incarnation bumped, Phase Updating with the Drain step at the resolved roll target and the revision-pair cause recorded, source serving gate off]
    decided_in: pkg/controller/v1beta1/inferencereplica/reconciler.go
  - id: T-ready-stuckgrace
    from: Ready
    event: timer.stuckPodGrace
    guard: the grace elapsed on a pod whose revision-hash label disagrees with the Component current revision while it holds a terminal waiting reason, and the pod set is not fully serving
    to: Failed
    effects: [Phase Failed with the stuck pod termination on LastFailure]
    decided_in: pkg/controller/v1beta1/workload/escalation/escalation.go
  - id: T-ready-teardown-deadline
    from: Ready
    event: timer.teardownDeadline
    guard: the owner is Terminating, the configured teardown deadline has passed since its deletionTimestamp, and the teardown finalizer is still held
    to: Empty
    effects: [TeardownDeadlineExceeded warning, the teardown finalizer released so the owner object and every InstanceStatus row it carried are purged in one delete, surviving pods and their owner references left to background GC]
    decided_in: pkg/controller/v1beta1/inferencereplica/teardown.go
    lane: adapter
    why: the owner's teardown deadline and the finalizer release are the adapter's teardown pass, which runs outside workload.Reconcile

  # --- Failed ------------------------------------------------------------
  - id: T-failed-corrective
    from: Failed
    event: spec.revision
    guard: no pod of the Instance remains, so the Create pass re-materializes it, and no RetryBlock denies the corrective revision
    to: Create/CreatePods
    effects: [Phase Creating with a Create CreatePods operation pinned to the corrective revision]
    decided_in: pkg/controller/v1beta1/workload/ops/create.go
  - id: T-failed-corrective-surge
    from: Failed
    event: spec.revision
    guard: strategy SurgeThenDrain and the corrective revision is a different RetryBlock subject than the held one
    to: Update/Surge
    effects: [the surge re-commits to the current target so the held revision is superseded]
    decided_in: pkg/controller/v1beta1/workload/ops/update_surge.go
  - id: T-failed-corrective-recreate
    from: Failed
    event: spec.revision
    guard: a recreate-resolved strategy and the corrective revision is a different RetryBlock subject than the held one
    to: Update/Drain
    effects: [Incarnation bumped, Phase Updating with the Drain step at the corrective revision]
    decided_in: pkg/controller/v1beta1/workload/ops/update_recreate.go
  - id: T-failed-corrective-inplace
    from: Failed
    event: spec.revision
    guard: an in-place-resolved strategy and the corrective revision is a different RetryBlock subject than the held one
    to: Update/InPlace
    effects: [Phase Updating with the InPlace step at the corrective revision]
    decided_in: pkg/controller/v1beta1/workload/ops/update_inplace.go
  - id: T-failed-retry
    from: Failed
    event: timer.retryAt
    guard: the Backoff RetryBlock for the same revision is due, no authorized attempt is in flight, and no pod of the Instance remains
    to: Create/CreatePods
    effects: [Phase Creating with a Create CreatePods operation, the block flipped to RetryInProgress when the attempt starts]
    decided_in: pkg/controller/v1beta1/workload/ops/create.go
  - id: T-failed-retry-surge
    from: Failed
    event: timer.retryAt
    guard: the Backoff RetryBlock for the same target is due and strategy SurgeThenDrain re-drives the Instance
    to: Update/Surge
    effects: [Phase Updating with the Surge step, the block flipped to RetryInProgress when the attempt starts]
    decided_in: pkg/controller/v1beta1/workload/ops/update_surge.go
  - id: T-failed-retry-recreate
    from: Failed
    event: timer.retryAt
    guard: the Backoff RetryBlock for the same target is due and a recreate-resolved strategy re-drives the Instance
    to: Update/Drain
    effects: [Incarnation bumped, Phase Updating with the Drain step, the block flipped to RetryInProgress]
    decided_in: pkg/controller/v1beta1/workload/ops/update_recreate.go
  - id: T-failed-retry-inplace
    from: Failed
    event: timer.retryAt
    guard: the Backoff RetryBlock for the same target is due and an in-place-resolved strategy re-drives the Instance
    to: Update/InPlace
    effects: [Phase Updating with the InPlace step, the block flipped to RetryInProgress]
    decided_in: pkg/controller/v1beta1/workload/ops/update_inplace.go
  - id: T-failed-gang-surge-reset
    from: Failed
    event: pod.deleted
    variant: target
    guard: a failed gang surge source whose replacement pods are gone and whose cleanup marker is claimed
    to: Ready
    effects: [replacement index finalized and its row removed, source reset to Ready on its running revision, the failed revision's RetryBlock charged toward Held only when the source's LastFailure reason is workload-caused and otherwise entered into Backoff at the current rung with AttemptsStarted unchanged, so no number of environment-caused waves reaches Held, GangSurgeAbandoned warning event]
    decided_in: pkg/controller/v1beta1/workload/ops/update_gang.go
  - id: T-failed-adopt-revision
    from: Failed
    event: pod.containersReady
    variant: source
    guard: RunningRevision is empty, every pod carries the target revision's hash and is ContainersReady, so the update trigger selects the AdoptRevision backfill instead of a roll
    to: Ready
    effects: [Phase Ready on the target revision with the operation cleared and that revision's RetryBlock pruned]
    decided_in: pkg/controller/v1beta1/workload/ops/update.go
  - id: T-failed-recycle-resurge
    from: Failed
    event: pod.deleted
    variant: target
    guard: a single-pod surge target that failed with CreateContainerError on a node the disposition excluded has been recycled, leaving the surge slot empty, and no RetryBlock denies the target because the reason is not workload-caused
    to: Update/Surge
    effects: [Phase Updating with the Surge step restamped at the same target, a fresh replacement pod created away from the excluded node]
    decided_in: pkg/controller/v1beta1/workload/ops/update_surge.go
  - id: T-failed-repair-resume
    from: Failed
    event: pod.containersReady
    variant: source
    guard: a Restart parked at Failed whose live pod set is complete, every pod at the row's incarnation and ContainersReady, whatever the restart policy says and whether or not a retry ladder is configured
    to: Ready
    effects: [the serving gate written on the rebuilt pods, then once they clear the shared promote bar Phase Ready with the spent operation cleared and RunningRevision untouched, at the incarnation the pods already carry, RestartCompleted event]
    decided_in: pkg/controller/v1beta1/workload/ops/restart.go
  - id: T-failed-repair-rearm
    from: Failed
    event: timer.repairRetry
    guard: a Restart parked at Failed whose live pod set is complete but not one the resume takes, its recorded failure not workload-caused (a cause the kubelet retries in place owes no re-arm and waits for the configuration or image), lifecycle.updateRetry is configured, its delay for the next attempt has elapsed since the recorded failure, the attempts are not spent, and no RetryBlock denies rebuilding the running revision
    to: Restart/Drain
    effects: [Incarnation bumped, Phase Restarting with a fresh Restart whose RetryCount continues the spent one's, the re-arm and the failure that parked the last attempt on its Reason, RestartTriggered event, the wedged set drained and rebuilt under a fresh deadline]
    decided_in: pkg/controller/v1beta1/workload/ops/restart.go
  - id: T-failed-restart
    from: Failed
    event: pod.deleted
    variant: source
    guard: policy RecreateInstanceOnPodRestart, a multi-pod Instance with at least one surviving member below the desired count and terminal-phase pods counted as lost rather than live, no preserved Update or Migrate operation, no RetryBlock denying the rebuild, and the revision the rebuild would land on still the roll target (a Failed row off the target re-enters through its corrective roll instead); a Restart parked at Failed is a spent attempt rather than an owner, so the gang may re-arm as a whole under a fresh deadline
    to: Restart/Drain
    effects: [Incarnation bumped, Phase Restarting with the gang-member-lost reason recorded, a gang that never ran a revision carrying the interrupted attempt's Operation.TargetRevision onto the rebuild so the per-revision Service selects the new pods]
    decided_in: pkg/controller/v1beta1/workload/ops/restart.go
  - id: T-failed-reset
    from: Failed
    event: spec.resetInstances
    guard: the operator named this Instance, no pod of it is still in the serving rotation, and the preserved operation is one the reset owns - none, a Create, or a Restart
    to: Failed
    effects: [every live-listed pod deleted with the expectation recorded before each delete, the preserved operation cleared through the MutateInstance seam, Phase and LastFailure untouched so the row is left in the fresh-start shape the Create pass rebuilds, InstancesReset event, the annotation consumed only after those effects commit]
    decided_in: pkg/controller/v1beta1/inferencereplica/reset_instances.go
    lane: adapter
    why: the operator reset mailbox is the spec.resetInstances annotation, which the adapter consumes outside workload.Reconcile
  - id: T-failed-recycle-rebuild
    from: Failed
    event: pod.phaseTerminal
    guard: no operation is preserved - a Restart the restart pass closed for having no live pod left included - and the Instance's remaining pods are in a terminal phase, so the missing-pod diff reads their names as free and the Create pass claims the row as a fresh start
    to: Create/CreatePods
    effects: [the dead occupants deleted with expectations recorded first and a TerminalPodRecycled warning, the targets recreated on a later pass under a fresh Create CreatePods operation]
    decided_in: pkg/controller/v1beta1/workload/ops/terminal_recycle.go
  - id: T-failed-scaledown
    from: Failed
    event: spec.replicasDown
    guard: the index is beyond the new desired set and the scale-down wave admits it
    to: Delete/Drain
    effects: [Phase Deleting and the Delete Drain operation committed in one status transaction]
    decided_in: pkg/controller/v1beta1/workload/ops/delete_batch.go
  - id: T-failed-teardown
    from: Failed
    event: spec.teardown
    guard: the owner carries a deletionTimestamp so every observed index is treated as a scale-down extra
    to: Delete/Drain
    effects: [Phase Deleting and the Delete Drain operation committed in one status transaction]
    decided_in: pkg/controller/v1beta1/workload/reconcile.go
  - id: T-failed-teardown-deadline
    from: Failed
    event: timer.teardownDeadline
    guard: the owner is Terminating, the configured teardown deadline has passed since its deletionTimestamp, and the teardown finalizer is still held
    to: Empty
    effects: [TeardownDeadlineExceeded warning, the teardown finalizer released so the owner object and every InstanceStatus row it carried are purged in one delete, surviving pods and their owner references left to background GC]
    decided_in: pkg/controller/v1beta1/inferencereplica/teardown.go
    lane: adapter
    why: the owner's teardown deadline and the finalizer release are the adapter's teardown pass, which runs outside workload.Reconcile

  # --- Create/CreatePods -------------------------------------------------
  - id: T-create-ready
    from: Create/CreatePods
    event: pod.containersReady
    variant: source
