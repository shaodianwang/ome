    to: Create/CreatePods
    effects: [the half-built attempt retired and replaced by a fresh Create CreatePods operation pinned to the current target, with no Failed phase, no failure event and no RetryBlock, because a superseded spec is not a failure of the retired revision; the pods of the retired attempt are cleaned up under the new operation]
