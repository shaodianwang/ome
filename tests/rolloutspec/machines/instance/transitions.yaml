    to: Update/Drain
    effects: [Incarnation bumped again and the operation restamped at the new target, so the drain and delete phase restarts against the previous incarnation]
    decided_in: pkg/controller/v1beta1/workload/ops/update_recreate.go
  - id: T-drain-deadline
    from: Update/Drain
    event: timer.operationDeadline
    guard: the operation deadline elapsed and no pod is held by an admission scheduling gate
    to: Failed
    effects: [the recreate is disposed and its operation cleared, single-pod or gang; with a retry ladder configured the wave counts on the target revision's RetryBlock]
    decided_in: pkg/controller/v1beta1/workload/escalation/escalation.go
  - id: T-drain-stuck
    from: Update/Drain
    event: pod.waiting
    guard: a pod held a terminal waiting reason past the stuck-pod grace and the pod set is not fully serving
    to: Failed
    effects: [the stuck pod's termination is recorded on LastFailure before the recreate deletes it]
    decided_in: pkg/controller/v1beta1/workload/escalation/escalation.go
  - id: T-drain-force-clock
    from: Update/Drain
    event: timer.forceDelete
    guard: a force-delete policy is configured and an old-incarnation pod Phase A deleted is past its deletion deadline plus the overdue slack while its node is gone or has been unreachable past the threshold; the sweep runs at the top of the update pass, ahead of every mode and its expectations gate
    to: Update/Drain
    effects: [the wedged pod force-deleted with grace zero under a UID precondition, Warning event and a ledger row recorded, Phase A left to complete on the resulting absence so the stable name frees up for Phase B]
    decided_in: pkg/controller/v1beta1/workload/ops/force_delete.go
  - id: T-drain-scaledown
    from: Update/Drain
    event: spec.replicasDown
    guard: a recreate roll pins nothing in the plan, so the index falls out when replicas drop and the scale-down wave admits it
    to: Delete/Drain
    effects: [the Update operation replaced by a Delete Drain operation and Phase Deleting, committed in one status transaction]
    decided_in: pkg/controller/v1beta1/workload/ops/delete_batch.go
  - id: T-drain-teardown
    from: Update/Drain
    event: spec.teardown
    guard: the owner carries a deletionTimestamp so every observed index is treated as a scale-down extra
    to: Delete/Drain
    effects: [Phase Deleting and the Delete Drain operation committed in one status transaction]
    decided_in: pkg/controller/v1beta1/workload/reconcile.go
  - id: T-drain-stuckgrace
    from: Update/Drain
    event: timer.stuckPodGrace
    guard: the grace elapsed on a pod that holds a terminal waiting reason, and the pod set is not fully serving
    to: Failed
    effects: [the stuck pod termination is recorded on LastFailure before the recreate deletes it]
    decided_in: pkg/controller/v1beta1/workload/escalation/escalation.go
  - id: T-drain-teardown-deadline
    from: Update/Drain
    event: timer.teardownDeadline
    guard: the owner is Terminating, the configured teardown deadline has passed since its deletionTimestamp, and the teardown finalizer is still held
    to: Empty
    effects: [TeardownDeadlineExceeded warning, the teardown finalizer released so the owner object and every InstanceStatus row it carried are purged in one delete, surviving pods and their owner references left to background GC]
    decided_in: pkg/controller/v1beta1/inferencereplica/teardown.go
    lane: adapter
    why: the owner's teardown deadline and the finalizer release are the adapter's teardown pass, which runs outside workload.Reconcile

