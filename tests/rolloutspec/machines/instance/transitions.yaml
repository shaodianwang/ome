  # --- Migrate/CreateSurge -----------------------------------------------
  - id: T-migrate-complete
    from: Migrate/CreateSurge
    event: pod.deleted
    variant: source
    guard: the surge is promoted Ready on the source's running revision and the source's pods and resources are gone
    to: Empty
    effects: [source status row removed under the ownership guard, Completed ledger row persisted, record stamped Completed last so a crash re-runs the tail]
    decided_in: pkg/controller/v1beta1/workload/ops/migrate.go
    lane: adapter
    why: the completion tail runs past the same surge availability gate, whose PodCount and AvailablePodCount only the adapter's status publication writes
  - id: T-migrate-deadline
    from: Migrate/CreateSurge
    event: timer.migrationDeadline
    guard: the migration record passed its deadline and the source's live pods are not all runtime-ready
    to: Failed
    effects: [Migrate pin cleared, source-drain hold released on every source pod, Phase Failed with a migration-expired LastFailure, record closed]
    decided_in: pkg/controller/v1beta1/workload/ops/migrate_expire.go
  - id: T-migrate-deadline-restore
    from: Migrate/CreateSurge
    event: timer.migrationDeadline
    guard: the migration record passed its deadline and every live source pod is runtime-ready
    to: Ready
    effects: [Migrate pin cleared, source-drain hold released so the source returns to rotation, RunningRevision untouched, record closed]
    decided_in: pkg/controller/v1beta1/workload/ops/migrate_expire.go
  - id: T-migrate-surge-terminal
    from: Migrate/CreateSurge
    event: pod.waiting
    guard: a surge pod holds a terminal waiting reason past the stuck-pod grace, which the record consumes as early failure evidence
    to: Ready
    effects: [the record closed Failed, the surge index torn down, the source restored to Ready on its untouched RunningRevision with the source-drain hold released; the source is never stamped directly and the record deadline remains the backstop]
    decided_in: pkg/controller/v1beta1/workload/ops/migrate.go

  - id: T-migrate-teardown
    from: Migrate/CreateSurge
    event: spec.teardown
    guard: teardown deletes a mid-migration pair like everything else, so the migration exclusion does not apply
    to: Delete/Drain
    effects: [Phase Deleting and the Delete Drain operation committed in one status transaction]
    decided_in: pkg/controller/v1beta1/workload/reconcile.go
  - id: T-migrate-force-delete
    from: Migrate/CreateSurge
    event: timer.forceDelete
    guard: a force-delete policy is configured and a source pod is past its deletion deadline plus the overdue slack while its node is gone or has been unreachable past the threshold; both clocks are required and whichever lands last is the trigger
    to: Migrate/CreateSurge
    effects: [source pod force-deleted with grace zero under a UID precondition, Warning event and a ledger row recorded, the migration drain left to complete on the resulting absence]
    decided_in: pkg/controller/v1beta1/workload/ops/force_delete.go
    lane: adapter
    why: the sweep runs in the source drain, which is behind the surge availability gate on the adapter-published PodCount and AvailablePodCount
  - id: T-migrate-teardown-deadline
    from: Migrate/CreateSurge
    event: timer.teardownDeadline
    guard: the owner is Terminating, the configured teardown deadline has passed since its deletionTimestamp, and the teardown finalizer is still held
    to: Empty
    effects: [TeardownDeadlineExceeded warning, the teardown finalizer released so the owner object and every InstanceStatus row it carried are purged in one delete, surviving pods and their owner references left to background GC]
    decided_in: pkg/controller/v1beta1/inferencereplica/teardown.go
    lane: adapter
    why: the owner's teardown deadline and the finalizer release are the adapter's teardown pass, which runs outside workload.Reconcile

  # --- Migrate/SurgeTarget -----------------------------------------------
  - id: T-migratetarget-promote
