  - state: Migrate/CreateSurge
    event: pod.deleted
    variants: [source]
    windows: [after]
    transition: T-migrate-surge-terminal
    outcome: ignore
    note: the row is Ready on its untouched running revision with the pin cleared, so pod loss is owned by the ordinary repair from there
