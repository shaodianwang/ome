  - state: Migrate/SurgeTarget
    event: pod.deleted
    variants: [source]
    windows: [after]
    transition: T-migratetarget-terminal
    outcome: ignore
    note: the unpinned index is on Delete/Drain and the paired source was restored through the record, so neither side reads this loss
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: decided
  - state: Migrate/SurgeTarget
    event: timer.migrationDeadline
    windows: [boundary]
    transition: T-migratetarget-terminal
    outcome: ignore
    note: the record is being closed Failed on the surge's own evidence, and expiry does not reopen a record that is already terminal
    invariants: [record.is.timeout.authority]
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: decided
  - state: Migrate/SurgeTarget
    event: timer.migrationDeadline
    windows: [after]
    transition: T-migratetarget-terminal
    outcome: ignore
    note: the pin is already cleared and the index is being torn down, so the deadline that remained the backstop has nothing left to end
    invariants: [record.is.timeout.authority]
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: decided
