    note: a dead member can never complete the gang, so the source's pass replaces it at once instead of holding the surge to the operation deadline - the restart trigger still declines the marker, whose pods belong to the surge. The shared terminal recycle deletes the occupant under the surge index with the expectation recorded first; the recycle count, the ladder pacing and the exit on LastFailure land on the source, which owns the operation, and the member is created again under the same name once the delete is observed while the source gang keeps serving (pkg/controller/v1beta1/workload/ops/update_gang.go, pkg/controller/v1beta1/workload/ops/terminal_recycle.go)
