  - state: Update/GangSurgeTarget
    event: pod.unschedulable
    variants: [target]
    outcome: defer
    guard: the row is not fully serving and its operation carries no other authority's waiting token except an operator pause, which a fact about the Instance takes the row from; the hold lasts while lifecycle.unschedulableGracePeriod is unconfigured or unelapsed, and past it the attempt is failed environment-caused
    note: the hold pass reads PodScheduled=False/Unschedulable off the replacement gang and records the Unschedulable waiting token, which parks the operation deadline rather than letting a gang that cannot be placed burn the whole InstanceReadyTimeout. One unplaceable member holds the whole Instance - a gang converges as a unit - and it is chosen by name so the recorded pod does not change from pass to pass. Past the configured grace the row is stamped Failed with the scheduler's message and no RetryBlock, keeping its operation, since a gang Update attempt is never disposable and the abandon path consumes the continuation
