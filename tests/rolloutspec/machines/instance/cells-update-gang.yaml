    to: Empty
    guard: every pod of the retired replacement is gone and the per-Instance resource finalization reports complete
    note: the marker row removal and the source reset are ONE status transaction, so marker absence can never be mistaken for an interrupted stamp and restored as active work; a failed revision records its RetryBlock in the same write and expectations for the index are forgotten. The reset is Ready on the source's running revision; a source that never ran one is left in the fresh-start Failed shape with its failure record kept, since Ready with no revision would count a gang that never served as capacity
