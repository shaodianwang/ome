  - state: Update/GangSurgeTargetCleanup
    event: pod.deleted
    variants: [target]
    windows: [boundary, after]
    transition: T-gangcleanup-done
    outcome: ignore
    note: the removal is landing; the pair guard rejects the write if either identity drifted, and a marker already absent from the authoritative snapshot counts as removed rather than as an error
    placement: kind
    coverage: {perm: [], unit: [TestGangSurge_PodlessSourcePersistsTerminalMarkerBeforeFinalization], kind: []}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: pod.deleted
    variants: [target]
    windows: [boundary, after]
    transition: T-gangcleanup-teardown
    outcome: ignore
    note: under teardown the delete wave owns the index, so the last retired pod disappearing is just progress toward the scale-down completion rather than the cleanup's own terminator
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.waiting
    outcome: ignore
    note: the stuck classifier skips pods carrying a deletionTimestamp, so a wedged pod of a retired replacement raises no escalation once its delete is issued; DeadlineExceeded is not a kubelet waiting reason at all
    placement: kind
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.containerRestart
    outcome: ignore
    note: restart evidence is Ready-gated and the retirement owns this pod set regardless, so a container restart in a retired gang changes nothing
    placement: kind
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.uidRotated
    outcome: ignore
    note: nothing recreates a pod at a retired index; the retirement deletes whatever the live list returns, whichever UID it carries
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.stuckTerminating
    outcome: defer
    note: the retirement waits for the pod to disappear and cannot reach the force-delete sweep, which covers only the pods of the row the update pass dispatches and never this separate marker index, so the wait is bounded only by the operation deadline and, past that, by operator action
    placement: kind
    coverage: {perm: [], unit: [TestEscalation_TerminatingMarkerPodEndsNothing], kind: []}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: pod.nodeLost
    outcome: defer
    note: a pod whose node is gone lingers Terminating and holds the marker open for the same reason a stuck-terminating pod does; no node-death evidence is consulted on this path
    placement: kind
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.schedulingGated
    outcome: ignore
    note: a gated pod is deleted like any other, and the gated-deadline park only affects the clock, never the retirement itself
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.evicted
    outcome: ignore
    note: an eviction removes a pod the retirement was going to delete, so it only brings the terminator closer
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: spec.revision
    outcome: ignore
    note: the cleanup claim is terminal even when the desired revision moves BACK to the one this replacement was pinned to; the fresh roll re-enters through the source after it is reset, so the retired gang is never adopted
    placement: kind
    coverage: {perm: [], unit: [TestGangSurge_CleanupMarkerRemainsTerminalWhenDesiredRevisionReturns], kind: []}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: spec.annotationOnly
    outcome: ignore
    note: excluded annotations and labels do not change the revision hash, so they reach neither the retirement nor the source reset
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: spec.strategy
    outcome: ignore
    note: the retirement runs to completion whatever the strategy now says; the gang surge path reads no strategy field once the pair is claimed
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: spec.replicasUp
    outcome: ignore
    note: the retired index is still taken, so scale-up allocates around it and the retirement is unaffected
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: spec.replicasDown
    outcome: ignore
    note: the marker stays pinned while its source references the index, so the scale-down wave cannot take the retirement away from it; an UNREFERENCED marker is a different shape and is reaped by the scale-down pipeline
    invariants: [marker.pinned.while.referenced]
    placement: perm
    coverage: {perm: [], unit: [TestInstancePlanIndices_GangCleanupMarkerPinnedWhileReferenced], kind: []}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: spec.pauseTrue
    outcome: defer
    note: pause plans no update pass, so the retirement halts with its pods and PodGroup still owned and the attempt carrying Operation.Waiting=Paused; the marker is exactly what keeps them from being reaped meanwhile
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: spec.pauseFreeze
    outcome: defer
    note: freeze halts the retirement the same way and additionally suspends repair of the source, which stays serving on its running revision
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: spec.unpause
    outcome: ignore
    note: the retirement resumes from its durable marker with no re-entry through the budget or the gate
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: spec.teardown
    windows: [before]
    outcome: transition
    to: Delete/Drain
    guard: the owner carries a deletionTimestamp, so the planned index set is emptied and every observed index becomes a scale-down extra
    note: the teardown branch runs before any other pass, so the retired index is admitted into the scale-down wave instead of finishing its own cleanup
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gangcleanup-teardown]}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: spec.teardown
    windows: [boundary, after]
    transition: T-gangcleanup-teardown
    outcome: transition
    to: Delete/Drain
    note: phase and operation are committed in one transaction, so re-observing the teardown is idempotent
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: spec.teardown
    windows: [boundary, after]
    transition: T-gangcleanup-done
    outcome: transition
    to: Delete/Drain
    note: teardown outranks the terminator — if the marker row was already removed the index is simply gone, and if the removal had not landed the delete wave picks it up
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: spec.migrateRequest
    outcome: defer
    note: a fresh migration record is not driven while a surge is counted in flight, and the source still carries its Surge step until the retirement resets it
    placement: perm
    coverage: {perm: [], unit: [TestPlan_MigrationRequestWaitsForAGangSurgeToResolve], kind: []}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: spec.partition
    outcome: ignore
    note: partition candidacy excludes every row carrying an Update operation, so a retired marker is never held nor released by a partition edit
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: timer.operationDeadline
    outcome: escalate
    note: the escalation pass stamps this row Failed with the operation preserved, because its phase is Creating with an in-flight Update and a gang Update attempt is never disposable. The retirement continues regardless — the cleanup claim matches on revision and step, not phase — so the stamp is diagnostic only (T-gangcleanup-deadline)
    placement: kind
    coverage: {perm: [], unit: [], kind: [], replay: [gangcleanup-deadline]}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: timer.expectationsTTL
    outcome: ignore
    note: the expired delete barrier lets the next pass re-issue deletes for whatever the live list still returns; a delete that did land is tolerated as NotFound
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: ctrl.crash
    outcome: ignore
    note: the marker is the durable record of the retirement; a restart that finds it missing while the source still claims the index restores it straight into the cleanup claim rather than as active work
    placement: kind
    coverage: {perm: [], unit: [TestGangSurge_RestartAfterTargetStampFailureRestoresCleanupBeforeRedirects, TestAbandonFailedGangSurge_PersistsCleanupMarkerAcrossRemovalFailure], kind: []}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: ctrl.staleRead
    outcome: ignore
    note: the retirement lists the retired index's pods live and fences both status writes on the authoritative snapshot, so a stale cached cleanup view can never delete pods that belong to a live claim
    placement: sim
    coverage: {perm: [], unit: [TestGangSurge_StaleCachedCleanupDoesNotDeletePods], kind: []}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: api.conflict
    outcome: defer
    note: a precondition or owner-gone failure on the paired removal-and-reset write returns without effect, leaving the marker in place; the pass retries on the requeue against a fresh snapshot
    placement: sim
    coverage: {perm: [], unit: [TestAbandonFailedGangSurge_PersistsCleanupMarkerAcrossRemovalFailure], kind: []}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: api.alreadyExists
    outcome: n/a
    reason: the retirement issues no create — it only deletes the retired replacement's pods and removes its status row
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: api.notFound
    outcome: ignore
    note: a pod delete that 404s counts as already gone, and a status write against a removed owner returns the owner-gone sentinel the pass maps to no effect
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: api.quotaDenied
    outcome: n/a
    reason: no pod is created at a retired index, so no ResourceQuota admission applies
    status: current

  # The retired marker's own escalation edges. Both stamp Phase Failed with
  # the operation preserved; the cleanup claim matches on revision and step,
  # never on phase, so the retirement still completes.
  - state: Update/GangSurgeTargetCleanup
    event: pod.deleted
    variants: [target]
    windows: [boundary, after]
    transition: T-gangcleanup-deadline
    outcome: ignore
    note: the retirement deletes every replacement pod anyway, so a member disappearing while the Failed stamp lands only shortens the wait for the removal
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.deleted
    variants: [target]
    windows: [boundary, after]
    transition: T-gangcleanup-stuck-failed
    outcome: ignore
    note: the wedged pod disappearing is the retirement doing its job; the stamp is diagnostic and the removal still waits for the whole set to be gone
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: spec.teardown
    windows: [boundary, after]
    transition: T-gangcleanup-deadline
    outcome: transition
    to: Delete/Drain
    note: teardown outranks the diagnostic stamp; the escalation pass does not run under the teardown branch at all
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: spec.teardown
    windows: [boundary, after]
    transition: T-gangcleanup-stuck-failed
    outcome: transition
    to: Delete/Drain
    note: same as the deadline stamp — the delete wave supersedes the retirement and owns wedge escalation from then on
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current

  # Inputs the retired replacement can receive that the retirement does not
  # read. Its only two questions are whether a live pod still exists at the
  # retired index and whether that index's resources are finalized, so pod
  # health, scheduling and rotation are all inert here.
  - state: Update/GangSurgeTargetCleanup
    event: pod.unschedulable
    variants: [source]
    outcome: n/a
    reason: the paired source gang has been running since before the surge and is reset to Ready on its running revision, so no source pod is ever pending placement while the retirement runs
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.unschedulable
    variants: [target]
    outcome: ignore
    note: a retired pod that never got a node is deleted like any other; the retirement reads the live list, never PodScheduled
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.containersNotReady
    variants: [source]
    outcome: ignore
    note: the reset restamps the source Ready on its running revision without consulting its pod health, so a regression there is repaired afterwards by the ordinary repair passes
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.containersNotReady
    variants: [target]
    outcome: ignore
    note: the cleanup claim is terminal, so health in either direction is irrelevant — the pod is deleted whatever its conditions say
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.terminating
    variants: [source]
    outcome: ignore
    note: no writer deletes a source pod on the abandon path, so an observed terminating source pod is external and is repaired after the reset by the restart or create pass
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.terminating
    variants: [target]
    outcome: defer
    note: the retirement in pkg/controller/v1beta1/workload/ops/update_gang.go skips a pod that already carries a deletionTimestamp and waits for it to disappear; that is the normal mid-retirement state
    placement: kind
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.phaseTerminal
    outcome: ignore
    note: a retired pod in a terminal phase is deleted like any other; the removal waits only on the object being gone from the live list
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.admitted
    outcome: ignore
    note: a retired pod leaving its admission gate is deleted regardless; the gate exit only restarts this row's parked deadline in pkg/controller/v1beta1/workload/deadline.go, and that stamp is diagnostic
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: gang.podGroup
    variants: [Terminating]
    outcome: defer
    note: the retired index is terminal-owned so no pass re-ensures its PodGroup; FinalizeOwnedName in pkg/controller/v1beta1/workload/gang/inventory.go reports the index incomplete until the terminating object is gone, holding the marker one more pass
    placement: kind
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: gang.podGroup
    variants: [OwnershipConflict]
    outcome: ignore
    note: a PodGroup at the retired name that is not controlled by this owner is reported finalized and left untouched by pkg/controller/v1beta1/workload/gang/inventory.go, so a foreign collision never blocks the removal
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: gang.podGroup
    variants: [Deleted]
    outcome: ignore
    note: EnsurePodGroups in pkg/controller/v1beta1/workload/gang/gang.go skips a terminal-owned index, so nothing recreates the group and an externally deleted one only makes the finalization report complete sooner
    placement: kind
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: gang.podGroup
    variants: [Unschedulable, ScheduleTimeout, PhaseFailed]
    outcome: ignore
    note: the PodGroup pass skips a terminal-owned index before it reads the object at all, so the retired group is neither classified nor reset whatever its phase says; Unschedulable and ScheduleTimeout are not readings the vendored gang scheduler writes in any case, and a gang being retired has nothing to learn from them
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: endpoint.rotationIn
    outcome: ignore
    note: EndpointSlice readiness feeds only the Component availability counters aggregated in pkg/controller/v1beta1/inferencereplica/status.go, and a retired index contributes nothing the retirement reads back
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: endpoint.rotationOut
    outcome: ignore
    note: the retirement deletes without waiting for rotation-out, which is safe because a replacement is retired only while it is incomplete or not runtime-ready and therefore never entered rotation
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: spec.gangWidth
    outcome: ignore
    note: the retirement deletes whatever the live list returns at the retired index, so the desired per-Runner size is never consulted
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: spec.policyTuning
    outcome: ignore
    note: no lifecycle knob is read on the retirement path — it issues plain deletes, waits for finalization, and restamps the source on its running revision
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: spec.rollbackTarget
    outcome: ignore
    note: the cleanup claim is terminal even when the roll target is overridden back to the retired revision; the fresh roll re-enters through the source after it is reset
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: config.changed
    outcome: ignore
    note: the retirement reads no operator configuration of its own; a new stuck-pod grace only changes whether the diagnostic Failed stamp fires, a new update-retry policy shapes the RetryBlock written at completion, a new retryBlockHistoryLimit shapes how many superseded blocks survive the prune, a new requeue cadence paces the next wake-up, and a new teardown deadline arms the teardown edge
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: ctrl.resync
    outcome: ignore
    note: the update requeue cadence is what re-issues the deletes and re-checks finalization; a tick with nothing changed recomputes the same decision and writes nothing
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  # GAP: an unsatisfiable write is retried until the diagnostic stamp lands.
  - state: Update/GangSurgeTargetCleanup
    event: api.invalid
    outcome: defer
    note: the rejection classifier is reached only from a pod create or an in-place pod patch, and the retirement issues neither, so a rejected pod delete or status write returns an opaque error and is retried on controller-runtime backoff with no event and no bound other than the operation deadline
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: api.throttled
    outcome: defer
    note: the retirement issues no create, so its shed deletes and status writes miss the create-path pacing and propagate verbatim; the only retry is controller-runtime backoff and the retirement simply resumes on a later pass
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: api.namespaceTerminating
    outcome: n/a
    reason: the retirement issues no create — it only deletes the retired replacement's pods and removes its status row
    status: current
  # GAP: a retired pod wedged on a dead node has no unwedger.
  - state: Update/GangSurgeTargetCleanup
    event: timer.forceDelete
    outcome: ignore
    note: the update pass sweeps the Terminating pods of the row it is dispatching, and the retired marker is a different index the source's pass never lists, so pkg/controller/v1beta1/workload/ops/force_delete.go stays unreachable, the clock elapsing on a retired pod force-deletes nothing and the marker cannot complete until an operator intervenes
    placement: kind
    coverage: {perm: [], unit: [TestUpdateWithPods_MarkerPodsAreOutsideTheSourcesSweep], kind: []}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: timer.stuckPodGrace
    windows: [before]
    outcome: transition
    to: Failed
    guard: a retired replacement pod still holds a terminal waiting reason and has not yet been marked for deletion, the set is not fully serving, and a gang Update attempt is never disposable
    note: pkg/controller/v1beta1/workload/escalation.go stamps Phase Failed with the operation preserved; once the retirement's delete lands the classifier skips the pod, so this edge is reachable only before it does
    placement: kind
    coverage: {perm: [], unit: [], kind: [], replay: [gangcleanup-stuckgrace]}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: timer.stuckPodGrace
    windows: [boundary, after]
    outcome: ignore
    note: the escalation pass skips an already-Failed row, the removed row has nothing to stamp, and under teardown the pass does not run at all
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: timer.teardownDeadline
    windows: [before]
    outcome: transition
    to: Empty
    guard: the owner is Terminating and the teardown finalizer is still held past the configured deadline
    note: pkg/controller/v1beta1/inferencereplica/teardown.go releases the finalizer so the owner and every InstanceStatus row it carries are purged in one delete, leaving the retired pods and their PodGroup to background GC
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: timer.teardownDeadline
    windows: [boundary, after]
    outcome: ignore
    note: the finalizer is released once; a deadline that keeps elapsing finds no finalizer to release and background GC owns the remainder
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.deleted
    variants: [target]
    windows: [boundary, after]
    transition: T-gangcleanup-stuckgrace
    outcome: ignore
    note: the wedged pod disappearing is the retirement doing its job; the stamp is diagnostic and the removal still waits for the whole set to be gone
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.deleted
    variants: [target]
    windows: [boundary, after]
    transition: T-gangcleanup-teardown-deadline
    outcome: ignore
    note: surviving retired pods are left to background GC once the finalizer is released, so one fewer is simply one fewer
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: spec.teardown
    windows: [boundary, after]
    transition: T-gangcleanup-stuckgrace
    outcome: transition
    to: Delete/Drain
    note: teardown outranks the diagnostic stamp; the escalation pass does not run under the teardown branch at all and the retired index is admitted into the scale-down wave
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: spec.teardown
    windows: [boundary, after]
    transition: T-gangcleanup-teardown-deadline
    outcome: ignore
    note: the deadline release already gave up on a graceful drain, so re-observing the teardown opens no Delete operation — the row is purged with the owner
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current

  # --- kubelet admission and slow readiness ------------------------------
  - state: Update/GangSurgeTarget
    event: pod.admissionRejected
    windows: [before]
    outcome: transition
    to: Update/GangSurgeTarget
    guard: the rejected pod holds one of the surge gang's target names, the operation deadline has not elapsed, and the surge bucket's outstanding expectations are satisfied
    note: a member the node refused never ran, so the gang could never complete while it held its name; the shared terminal recycle frees it immediately instead of holding the surge to the operation deadline. The bookkeeping - retry pacing, LastFailure carrying the kubelet's pod-level reason - lands on the source, which owns the operation, while the delete and its expectation bucket on the surge index. Environment-caused, so no RetryBlock is charged, and the create is withheld until the delete is observed (pkg/controller/v1beta1/workload/ops/update_gang.go, pkg/controller/v1beta1/workload/ops/terminal_recycle.go)
    placement: unit
    coverage: {perm: [], unit: [TestGangSurgeCreate_AdmissionRejectedTargetIsRecycled, TestGangSurgeCreate_RecycleWaitsOnTheSurgeBucketExpectations], kind: []}
    status: decided
  - state: Update/GangSurgeTarget
    event: pod.admissionRejected
    windows: [boundary, after]
    outcome: defer
    note: the recycle is a pod delete that leaves phase and step where they are, so a re-observed rejection lands on the same row and is either paced by the ladder or satisfied by the delete already in flight
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.admissionRejected
    outcome: ignore
    note: a refused pod of a retired replacement is deleted like any other; the removal waits only on the object being gone from the live list
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: pod.runningNotReady
    variants: [source]
    outcome: ignore
    note: gangSurgeUpdate reads source pods only as a count, so a source failing its probes closes no gate on this row (pkg/controller/v1beta1/workload/ops/update_gang.go)
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: pod.runningNotReady
    variants: [target]
    outcome: defer
    note: AllPodsRuntimeReady is recomputed from a live list every pass and how long a member has been trying drives no decision, so one member failing its probes keeps the whole gang's drain gate closed until the operation deadline. At that deadline the readiness wait is evidence - the record names the first such member, its first unready container and the readiness condition's message under reason ContainersNotReady - but it decides no branch, because readiness limbo is ambiguous between the revision and the node and charges no ladder (pkg/controller/v1beta1/workload/ops/update_gang.go, pkg/controller/v1beta1/workload/deadline.go)
    placement: kind
    coverage: {perm: [], unit: [TestEscalation_GangDeadlineWithRunningNotReadyPods_NamesTheProbe], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.runningNotReady
    outcome: ignore
    note: the cleanup claim is terminal on both sides - the retired pods are deleted whatever their conditions say, and the source is restamped Ready on its running revision without consulting its pod health (pkg/controller/v1beta1/workload/ops/update_gang.go)
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
