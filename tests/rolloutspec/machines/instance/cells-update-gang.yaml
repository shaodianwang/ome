    event: api.notFound
    outcome: ignore
    note: a pod delete that 404s counts as already gone, and a status write against a removed owner returns the owner-gone sentinel the pass maps to no effect
    placement: sim
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-live-api-answers]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: api.quotaDenied
    outcome: n/a
    reason: no pod is created at a retired index, so no ResourceQuota admission applies
    status: decided

  # The retired marker's own escalation edges. Both stamp Phase Failed with
  # the operation preserved; the cleanup claim matches on revision and step,
  # never on phase, so the retirement still completes.
  - state: Update/GangSurgeTargetCleanup
    event: pod.deleted
    variants: [target]
    windows: [boundary, after]
    transition: T-gangcleanup-deadline
    outcome: ignore
    note: the retirement deletes every replacement pod anyway, so a member disappearing while the Failed stamp lands only shortens the wait for the removal
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-deadline-member-lost-then-teardown]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: pod.deleted
    variants: [target]
    windows: [boundary, after]
    transition: T-gangcleanup-stuck-failed
    outcome: ignore
    note: the wedged pod disappearing is the retirement doing its job; the stamp is diagnostic and the removal still waits for the whole set to be gone
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-wedge-member-lost]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: spec.teardown
    windows: [boundary, after]
    transition: T-gangcleanup-deadline
    outcome: transition
    to: Delete/Drain
    note: teardown outranks the diagnostic stamp; the escalation pass does not run under the teardown branch at all
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-deadline-member-lost-then-teardown]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: spec.teardown
    windows: [boundary, after]
    transition: T-gangcleanup-stuck-failed
    outcome: transition
    to: Delete/Drain
    note: same as the deadline stamp — the delete wave supersedes the retirement and owns wedge escalation from then on
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-wedge-then-teardown]}
    status: decided

  # Inputs the retired replacement can receive that the retirement does not
  # read. Its only two questions are whether a live pod still exists at the
  # retired index and whether that index's resources are finalized, so pod
  # health, scheduling and rotation are all inert here.
  - state: Update/GangSurgeTargetCleanup
    event: pod.unschedulable
    variants: [source]
    outcome: n/a
    reason: the paired source gang has been running since before the surge and is reset to Ready on its running revision, so no source pod is ever pending placement while the retirement runs
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: pod.unschedulable
    variants: [target]
    outcome: defer
    note: the hold pass records the Unschedulable waiting token on the marker as on every Update-owned row (holds/scheduler.go; the owner rule refuses only a teardown and an unowned row), parking both the marker's and the source's deadlines for the pass before the retirement deletes the pod; the token leaves with the pod and the removal is never held
    placement: sim
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-unplaced-member-holds-a-pass]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: pod.containersNotReady
    variants: [source]
    outcome: ignore
    note: the reset restamps the source Ready on its running revision without consulting its pod health, so a regression there is repaired afterwards by the ordinary repair passes
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-live-retired-member-signals]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: pod.containersNotReady
    variants: [target]
    outcome: ignore
    note: the cleanup claim is terminal, so health in either direction is irrelevant — the pod is deleted whatever its conditions say
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-live-retired-member-signals]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: pod.terminating
    variants: [source]
    outcome: ignore
    note: no writer deletes a source pod on the abandon path, so an observed terminating source pod is external and is repaired after the reset by the restart or create pass
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-source-pod-lost]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: pod.terminating
    variants: [target]
    outcome: defer
    note: the retirement in pkg/controller/v1beta1/workload/ops/update_gang.go skips a pod that already carries a deletionTimestamp and waits for it to disappear; that is the normal mid-retirement state
    placement: kind
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-member-already-terminating]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: pod.phaseTerminal
    outcome: ignore
    note: a retired pod in a terminal phase is deleted like any other; the removal waits only on the object being gone from the live list
    placement: sim
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-container-signals-ignored]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: pod.admitted
    outcome: ignore
    note: a retired pod leaving its admission gate is deleted regardless; the gate exit only restarts this row's parked deadline in pkg/controller/v1beta1/workload/escalation/deadline.go, and that stamp is diagnostic
    placement: sim
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-live-retired-member-signals]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: gang.podGroup
    variants: [Terminating]
    outcome: defer
    note: the retired index is terminal-owned so no pass re-ensures its PodGroup; FinalizeOwnedName in pkg/controller/v1beta1/workload/gang/inventory.go reports the index incomplete until the terminating object is gone, holding the marker one more pass
    placement: unit
    coverage: {perm: [], unit: [TestFinalizeOwnedName_TerminatingGroupHoldsTheIndex], kind: []}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: gang.podGroup
    variants: [OwnershipConflict]
    outcome: ignore
    note: a PodGroup at the retired name that is not controlled by this owner is reported finalized and left untouched by pkg/controller/v1beta1/workload/gang/inventory.go, so a foreign collision never blocks the removal
    placement: sim
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-foreign-podgroup-ignored]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: gang.podGroup
    variants: [Deleted]
    outcome: ignore
    note: EnsurePodGroups in pkg/controller/v1beta1/workload/gang/gang.go skips a terminal-owned index, so nothing recreates the group and an externally deleted one only makes the finalization report complete sooner
    placement: kind
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-podgroup-deleted-not-recreated]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: gang.podGroup
    variants: [Unschedulable, ScheduleTimeout, PhaseFailed]
    outcome: ignore
    note: the PodGroup pass skips a terminal-owned index before it reads the object at all, so the retired group is neither classified nor reset whatever its phase says; Unschedulable and ScheduleTimeout are not readings the vendored gang scheduler writes in any case, and a gang being retired has nothing to learn from them
    placement: unit
    coverage: {perm: [], unit: [TestObserveGang_SchedulingPhasesReportNothing], kind: [], replay: [gang-cleanup-podgroup-failed-reading-skipped]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: endpoint.rotationIn
    outcome: ignore
    note: EndpointSlice readiness feeds only the Component availability counters aggregated in pkg/controller/v1beta1/inferencereplica/status.go, and a retired index contributes nothing the retirement reads back
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-source-signals-ignored, gang-cleanup-replacement-signals-ignored]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: endpoint.rotationOut
    outcome: ignore
    note: the retirement deletes without waiting for rotation-out, which is safe because a replacement is retired only while it is incomplete or not runtime-ready and therefore never entered rotation
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-replacement-signals-ignored]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: spec.gangWidth
    outcome: ignore
    note: the retirement deletes whatever the live list returns at the retired index, so the desired per-Runner size is never consulted; an engine change under review would make the width part of the revision, so the edit would reach this row as spec.revision
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-width-grow-ignored]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: spec.policyTuning
    outcome: ignore
    note: no lifecycle knob is read on the retirement path — it issues plain deletes, waits for finalization, and restamps the source on its running revision
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-spec-edits-ignored]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: spec.rollbackTarget
    outcome: ignore
    note: the cleanup claim is terminal even when the roll target is overridden back to the retired revision; the fresh roll re-enters through the source after it is reset
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-rollback-to-retired-revision]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: config.changed
    outcome: ignore
    note: the retirement reads no operator configuration of its own; a new stuck-pod grace only changes whether the diagnostic Failed stamp fires, a new update-retry policy shapes the RetryBlock written at completion, a new retryBlockHistoryLimit shapes how many superseded blocks survive the prune, a new requeue cadence paces the next wake-up, and a new teardown deadline arms the teardown edge
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-live-retired-member-signals]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: ctrl.resync
    outcome: ignore
    note: the update requeue cadence is what re-issues the deletes and re-checks finalization; a tick with nothing changed recomputes the same decision and writes nothing
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-member-already-terminating]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: api.invalid
    outcome: escalate
    to: Failed/GangSurgeTargetCleanup
    guard: the rejected write is the retirement's unroute patch or delete over a member of the retired replacement; a 422 on a status write stays an opaque error
    note: the retirement's unroute patch and delete reach the rejection classifier as a pod create does, so the marker reads Failed with InvalidPodSpec plus the apiserver's explanation on LastFailure and keeps the cleanup operation that pins it to its source; a RetryBlock is recorded against the revision in force and one Warning names the pod. The retirement then issues nothing for the members still standing while that revision's ladder denies a fresh start - the source stays at its surge step holding the budget, as it does for any member still standing - and a corrected revision re-arms it; once no member stands there is nothing left to refuse, so the retirement finalizes the marker and resets the source as any abandon does (ops/update_gang.go, ops/create_rejection.go). A rejected status write returns an opaque error and is retried on controller-runtime backoff with no event and no bound other than the operation deadline
    placement: unit
    coverage: {perm: [], unit: [TestAbandonFailedGangSurge_RejectedDeleteParksRetirementOnce, TestAbandonFailedGangSurge_ParkedRetirementCompletesOnceMembersAreGone], kind: [], replay: [gang-cleanup-invalid-delete]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: api.throttled
    outcome: defer
    note: the retirement issues no create, so its shed deletes and status writes miss the create-path pacing and propagate verbatim; the only retry is controller-runtime backoff and the retirement simply resumes on a later pass
    placement: sim
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-live-api-answers]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: api.namespaceTerminating
    outcome: n/a
    reason: the retirement issues no create — it only deletes the retired replacement's pods and removes its status row
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: timer.forceDelete
    outcome: ignore
    note: the update pass sweeps only the Terminating pods of the row it dispatches and the retired marker is a different index, but the Component pass sweeps every Terminating pod of the Component ahead of it - a retired pod wedged on a dead node is force-deleted there once the node is gone or unreachable past the threshold and the pod is past its own deadline plus the slack, and the retirement completes on the resulting absence (pkg/controller/v1beta1/workload/reconcile.go)
    placement: unit
    coverage: {perm: [], unit: [TestUpdateWithPods_MarkerPodsAreOutsideTheSourcesSweep, TestForceDelete_DrainedPodNoOperationWaitsOnIsSweptAtThePolicyBoundary], kind: []}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: timer.stuckPodGrace
    windows: [before]
    outcome: transition
    to: Failed
    guard: a retired replacement pod still holds a terminal waiting reason and has not yet been marked for deletion, the set is not fully serving, and a gang Update attempt is never disposable
    note: pkg/controller/v1beta1/workload/escalation/escalation.go stamps Phase Failed with the operation preserved; once the retirement's delete lands the classifier skips the pod, so this edge is reachable only before it does
    placement: kind
    coverage: {perm: [], unit: [], kind: [], replay: [gangcleanup-stuckgrace]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: timer.stuckPodGrace
    windows: [boundary, after]
    outcome: ignore
    note: the escalation pass skips an already-Failed row, the removed row has nothing to stamp, and under teardown the pass does not run at all
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-wedge-member-lost]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: timer.teardownDeadline
    windows: [before]
    outcome: transition
    to: Empty
    guard: the owner is Terminating and the teardown finalizer is still held past the configured deadline
    note: pkg/controller/v1beta1/inferencereplica/teardown.go releases the finalizer so the owner and every InstanceStatus row it carries are purged in one delete, leaving the retired pods and their PodGroup to background GC
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-teardown-deadline-late-signals]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: timer.teardownDeadline
    windows: [boundary, after]
    outcome: ignore
    note: the finalizer is released once; a deadline that keeps elapsing finds no finalizer to release and background GC owns the remainder
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-teardown-deadline-late-signals]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: pod.deleted
    variants: [target]
    windows: [boundary, after]
    transition: T-gangcleanup-stuckgrace
    outcome: ignore
    note: the wedged pod disappearing is the retirement doing its job; the stamp is diagnostic and the removal still waits for the whole set to be gone
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-grace-with-member-loss]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: pod.deleted
    variants: [target]
    windows: [boundary, after]
    transition: T-gangcleanup-teardown-deadline
    outcome: ignore
    note: surviving retired pods are left to background GC once the finalizer is released, so one fewer is simply one fewer
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-teardown-deadline-late-signals]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: spec.teardown
    windows: [boundary, after]
    transition: T-gangcleanup-stuckgrace
    outcome: transition
    to: Delete/Drain
    note: teardown outranks the diagnostic stamp; the escalation pass does not run under the teardown branch at all and the retired index is admitted into the scale-down wave
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-grace-then-teardown]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: spec.teardown
    windows: [boundary, after]
    transition: T-gangcleanup-teardown-deadline
    outcome: ignore
    note: the deadline release already gave up on a graceful drain, so re-observing the teardown opens no Delete operation — the row is purged with the owner
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-teardown-deadline-late-signals]}
    status: decided

  # --- kubelet admission and slow readiness ------------------------------
  - state: Update/GangSurgeTarget
    event: pod.admissionRejected
    windows: [before]
    outcome: transition
    to: Update/GangSurgeTarget
    guard: the rejected pod holds one of the surge gang's target names, the operation deadline has not elapsed, and the surge bucket's outstanding expectations are satisfied
    note: a member the node refused never ran, so the gang could never complete while it held its name; the shared terminal recycle frees it immediately instead of holding the surge to the operation deadline. The bookkeeping - retry pacing, LastFailure carrying the kubelet's pod-level reason - lands on the source, which owns the operation, while the delete and its expectation bucket on the surge index. Environment-caused, so no RetryBlock is charged, and the create is withheld until the delete is observed (pkg/controller/v1beta1/workload/ops/update_gang.go, pkg/controller/v1beta1/workload/ops/terminal_recycle.go)
    placement: unit
    coverage: {perm: [], unit: [TestGangSurgeCreate_AdmissionRejectedTargetIsRecycled, TestGangSurgeCreate_RecycleWaitsOnTheSurgeBucketExpectations], kind: []}
    status: decided
  - state: Update/GangSurgeTarget
    event: pod.admissionRejected
    windows: [boundary, after]
    outcome: defer
    note: the recycle is a pod delete that leaves phase and step where they are, so a re-observed rejection lands on the same row and is either paced by the ladder or satisfied by the delete already in flight
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-target-admission-rejected-twice]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: pod.admissionRejected
    outcome: ignore
    note: a refused pod of a retired replacement is deleted like any other; the removal waits only on the object being gone from the live list
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-live-retired-member-signals]}
    status: decided
  - state: Update/GangSurgeTarget
    event: pod.runningNotReady
    variants: [source]
    outcome: ignore
    note: gangSurgeUpdate reads source pods only as a count, so a source failing its probes closes no gate on this row (pkg/controller/v1beta1/workload/ops/update_gang.go)
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-target-source-running-not-ready]}
    status: decided
  - state: Update/GangSurgeTarget
    event: pod.runningNotReady
    variants: [target]
    outcome: defer
    note: AllPodsRuntimeReady is recomputed from a live list every pass and how long a member has been trying drives no decision, so one member failing its probes keeps the whole gang's drain gate closed until the operation deadline. At that deadline the readiness wait is evidence - the record names the first such member, its first unready container and the readiness condition's message under reason ContainersNotReady - but it decides no branch, because readiness limbo is ambiguous between the revision and the node and charges no ladder (pkg/controller/v1beta1/workload/ops/update_gang.go, pkg/controller/v1beta1/workload/escalation/deadline.go)
    placement: kind
    coverage: {perm: [], unit: [TestEscalation_GangDeadlineWithRunningNotReadyPods_NamesTheProbe], kind: []}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: pod.runningNotReady
    outcome: ignore
    note: the cleanup claim is terminal on both sides - the retired pods are deleted whatever their conditions say, and the source is restamped Ready on its running revision without consulting its pod health (pkg/controller/v1beta1/workload/ops/update_gang.go)
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-container-signals-ignored]}
    status: decided

  # --- Failed/GangSurge (planned): the gang-surge SOURCE failed at the Surge
  # step with its operation kept for the abandon. The engine resolves this
  # shape to Failed. "source" is a pod of this gang, "target" a pod of the
  # replacement gang at the surge index. Entered through the parent arrows
  # T-surge-deadline, T-surge-stuck and T-surge-stuckgrace on a gang source,
  # the gang verdict and the scheduler grace.
  - {state: Failed/GangSurge, event: pod.scheduled, variants: [source], outcome: ignore, note: "the source gang is bound already; nothing reads its nodes", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [gang-failed-source-observations-ignored]}, status: decided}
  - {state: Failed/GangSurge, event: pod.scheduled, variants: [target], outcome: ignore, note: "the abandon retires the replacement whatever its placement; a member binding late changes nothing", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [gang-failed-replacement-observations-ignored]}, status: decided}
  - {state: Failed/GangSurge, event: pod.unschedulable, variants: [source], outcome: ignore, note: "the source gang has been running since before the surge; no source pod is pending placement", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-failed-source-gate-reasserted]}, status: decided}
  - {state: Failed/GangSurge, event: pod.unschedulable, variants: [target], outcome: ignore, note: "the hold pass skips a row nobody owns and the escalation pass skips a Failed row, so neither a token nor the grace lands here; the unplaceable replacement member is deleted by the abandon like any other", placement: perm, coverage: {perm: [], unit: [TestAbandonFailedGangSurge_SchedulerHoldRecordsNoBlock], kind: []}, status: decided}
  - {state: Failed/GangSurge, event: pod.containersReady, variants: [source], outcome: ignore, note: "the source keeps serving on its running revision throughout the abandon; its readiness drives nothing", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [gang-failed-source-observations-ignored]}, status: decided}
  - {state: Failed/GangSurge, event: pod.containersReady, variants: [target], outcome: ignore, note: "a replacement becoming runtime-ready does not rescue a failed source: the abandon path retires it whatever its readiness", placement: perm, coverage: {perm: [], unit: [TestAbandonFailedGangSurge_AtomicallyRemovesMarkerAndResetsSource], kind: []}, status: decided}
  - {state: Failed/GangSurge, event: pod.containersNotReady, variants: [source], outcome: ignore, note: "a source member losing readiness moves counters; the row's next move is the abandon's reset, after which the restart pass reads the source as a Ready row again", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [gang-failed-source-observations-ignored]}, status: decided}
  - {state: Failed/GangSurge, event: pod.containersNotReady, variants: [target], outcome: ignore, note: "the retired replacement's readiness is read by nobody; the abandon is driven off its pods disappearing", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [gang-failed-replacement-observations-ignored]}, status: decided}
  - {state: Failed/GangSurge, event: pod.ready, variants: [source], outcome: ignore, note: "PodReady on a source member moves counters and nothing else", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [gang-failed-source-observations-ignored]}, status: decided}
  - {state: Failed/GangSurge, event: pod.ready, variants: [target], outcome: ignore, note: "a retired replacement in rotation is still retired; the abandon unroutes a routed member a pass ahead of its deletion", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [gang-failed-replacement-observations-ignored, gang-failed-timers-ignored]}, status: decided}
  - {state: Failed/GangSurge, event: pod.servingOn, variants: [source], outcome: ignore, note: "the source's gate was never withdrawn at the Surge step; a member rejoining the rotation moves counters", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [gang-failed-source-observations-ignored]}, status: decided}
  - {state: Failed/GangSurge, event: pod.servingOn, variants: [target], outcome: ignore, note: "a routed replacement member is unrouted by the abandon a pass ahead of its deletion whatever its gate says", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [gang-failed-replacement-observations-ignored]}, status: decided}
  - {state: Failed/GangSurge, event: pod.servingOff, variants: [source], outcome: ignore, note: "serving loss on the source moves counters; the source-unrouted hold reads a row nobody owns as one with no attempt to hold", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [gang-failed-source-observations-ignored]}, status: decided}
  - {state: Failed/GangSurge, event: pod.servingOff, variants: [target], outcome: ignore, note: "the replacement leaving rotation is part of its teardown; the abandon is driven by the pods disappearing, not by the gate", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [gang-failed-replacement-observations-ignored]}, status: decided}
  - {state: Failed/GangSurge, event: pod.terminating, variants: [source], outcome: defer, note: "a source pod on its way out is live until it is gone; the abandon runs regardless, and the loss is repaired once the source is reset to Ready", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [gang-failed-source-pod-lost]}, status: decided}
