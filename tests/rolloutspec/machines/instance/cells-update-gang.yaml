  # --- Update/GangSurgeTargetCleanup -------------------------------------
  # A retired replacement gang. The marker holds ownership of its pods and
  # PodGroup until they are gone, then the row is removed in the same status
  # transaction that resets the source to Ready on its running revision. The
  # claim is sticky: the cleanup predicates match on revision and step, so
  # neither a returning desired revision nor a pod that finally comes up
  # revives the replacement.
  - state: Update/GangSurgeTargetCleanup
    event: pod.scheduled
    variants: [source]
    outcome: n/a
    reason: the paired source gang has been running since before the surge and is reset to Ready on its running revision, so no source pod is bound to a node while the retirement runs
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.scheduled
    variants: [target]
    outcome: ignore
    note: a retired pod that only now binds is deleted with the rest; the retirement lists live pods each pass and issues a delete for every one that is not already terminating
    placement: kind
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.containersReady
    variants: [source]
    outcome: ignore
    note: the source's pods were never drained on the abandon path — the retirement is reachable only from the Surge step, before the drain claim — so its readiness is unchanged and the reset simply restamps Ready on its running revision
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.containersReady
    variants: [target]
    outcome: ignore
    note: the cleanup claim is terminal — a retired pod becoming ready does not revive the replacement, because the claim predicates match on revision and step and never on health
    placement: kind
    coverage: {perm: [], unit: [TestGangSurge_CleanupMarkerRemainsTerminalWhenDesiredRevisionReturns], kind: []}
