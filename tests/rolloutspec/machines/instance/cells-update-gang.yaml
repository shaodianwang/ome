  # --- Update/GangSurgeTargetCleanup -------------------------------------
  # A retired replacement gang. The marker holds ownership of its pods and
  # PodGroup until they are gone, then the row is removed in the same status
  # transaction that resets the source: Ready on its running revision, or the
  # fresh-start Failed shape when it never ran one. The
  # claim is sticky: the cleanup predicates match on revision and step, so
  # neither a returning desired revision nor a pod that finally comes up
  # revives the replacement.
  - state: Update/GangSurgeTargetCleanup
    event: pod.scheduled
    variants: [source]
    outcome: n/a
    reason: the paired source gang has been running since before the surge and is reset to Ready on its running revision, so no source pod is bound to a node while the retirement runs
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: pod.scheduled
    variants: [target]
    outcome: ignore
    note: a retired pod that only now binds is deleted with the rest; the retirement lists live pods each pass and issues a delete for every one that is not already terminating
    placement: kind
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-replacement-signals-ignored]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: pod.containersReady
    variants: [source]
    outcome: ignore
    note: the source's pods were never drained on the abandon path — the retirement is reachable only from the Surge step, before the drain claim — so its readiness is unchanged and the reset simply restamps Ready on its running revision
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-source-signals-ignored]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: pod.containersReady
    variants: [target]
    outcome: ignore
    note: the cleanup claim is terminal — a retired pod becoming ready does not revive the replacement, because the claim predicates match on revision and step and never on health
    placement: kind
    coverage: {perm: [], unit: [TestGangSurge_CleanupMarkerRemainsTerminalWhenDesiredRevisionReturns], kind: []}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: pod.ready
    variants: [source]
    outcome: ignore
    note: the source keeps serving throughout the retirement; that is the point of abandoning the replacement rather than the source
    invariants: [source.serves.through.retirement]
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-source-signals-ignored]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: pod.ready
    variants: [target]
    outcome: ignore
    note: same as ContainersReady — a late-ready retired pod is still deleted, and the row's minReadySeconds column is row-level n/a for exactly this reason
    placement: kind
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-replacement-signals-ignored]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: pod.servingOn
    variants: [source]
    outcome: ignore
    note: the source never left rotation, so its gate being asserted again is a no-op for the retirement
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-source-signals-ignored]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: pod.servingOn
    variants: [target]
    outcome: ignore
    note: the retirement takes a replacement member that is in rotation out of it a pass ahead of deleting it (ops/update.go unrouteServingPods, under the delete-drain writer key), so a serving gate asserted on a retired pod is flipped off rather than left to the deletion; the marker row itself is untouched
    placement: sim
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-serving-member-unrouted-first]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: pod.servingOff
    variants: [source]
    outcome: ignore
    note: no writer takes the source out of rotation on this path, so an observed flip is external and does not change the retirement
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-source-signals-ignored]}
    status: decided
  - state: Update/GangSurgeTargetCleanup
    event: pod.servingOff
    variants: [target]
    outcome: ignore
    note: a retired pod leaving rotation is the direction the retirement is already going; nothing re-asserts the gate once the cleanup claim is stamped
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gang-cleanup-replacement-signals-ignored]}
