# Cells for the two gang surge-target rows: Update/GangSurgeTarget and
# Update/GangSurgeTargetCleanup. Both describe the REPLACEMENT gang at its
# own instance index; the source gang that drives them sits in Update/Surge.
#
# Reading key for the pod variants in these two states: "target" is a pod of
# THIS replacement gang, "source" is a pod of the paired source gang.
#
# Both rows are passive markers. They carry no pass of their own: the update
# trigger skips them (isGangSurgeTargetMarker), the wreckage scan skips them,
# the restart trigger declines them (a preserved non-Create operation keeps
# ownership), the create pass leaves them alone (surgeFreeIndex), and
# scale-down keeps them pinned while a source references the index. Every
# effect on these rows is written by the source's gangSurgeUpdate, so most
# cells are ignore or defer rather than transition.
#
# Both states can also be stamped Failed by the escalation pass. Their phase
# is Creating with an in-flight Update operation, so the stuck check
# qualifies them and a gang Update attempt is never disposable, producing a
# plain Failed-preserving-Operation stamp on the marker itself when a
# replacement pod wedges past the stuck-pod grace or when the marker's own
# operation deadline elapses. The stamp is diagnostic for the surge — the
# claim predicates match on revision and step, never on phase.
cells:
  - state: Update/GangSurgeTarget
    event: pod.scheduled
    variants: [source]
    outcome: n/a
    reason: the paired source gang was already running when the marker was stamped, and no pass recreates a source pod while the surge is in flight
    status: current
  - state: Update/GangSurgeTarget
    event: pod.scheduled
    variants: [target]
    outcome: ignore
    note: the surge pass advances on runtime readiness of the whole replacement gang, never on a single pod binding
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: pod.containersReady
    variants: [source]
    outcome: ignore
    note: source readiness is not consulted while the replacement is being built; the source is drained on the replacement's readiness, not its own
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: pod.containersReady
    variants: [target]
    outcome: ignore
    guard: every pod of the replacement gang ContainersReady and the pod set complete
    note: the source's pass flips serving=True on the replacement pods at ContainersReady because PodReady includes that gate, then keeps polling; the marker row itself is untouched
    placement: kind
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: pod.ready
    variants: [source]
    outcome: ignore
    note: the source keeps serving on its running revision until the replacement is available; its own readiness moves nothing
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: pod.ready
    variants: [target]
    outcome: ignore
    guard: EVERY replacement pod PodReady, plus the minReadySeconds window while the source is still in rotation; a partial gang holds the source drain
    note: the source's pass releases its drain only on the whole gang, and the marker row is not rewritten by it
    placement: kind
    coverage: {perm: [], unit: [TestGangSurgeUpdate_HoldsSourceDrainUntilReplacementPodReady], kind: []}
    status: decided
  - state: Update/GangSurgeTarget
    event: pod.servingOn
    variants: [source]
    outcome: ignore
    note: the source is in rotation for the whole surge window; re-asserting its gate changes nothing for the marker
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: pod.servingOn
    variants: [target]
    outcome: ignore
    note: the source's pass wrote the gate; kubelet folding it into PodReady is the next thing the pass waits for
    placement: kind
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: pod.servingOff
    variants: [source]
    outcome: ignore
    note: the source's drain flip is owned by its own row, which advances to the SurgeDrain step when it lands
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: pod.servingOff
    variants: [target]
    outcome: ignore
    note: self-healing — the surge pass re-asserts serving=True on any replacement pod whose gate is off before it looks at the source
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: pod.deleted
    variants: [source]
    windows: [before]
    outcome: transition
    to: Ready
    guard: the paired source is on the SurgeDrain step with an empty pod set, and this marker still matches the source claim for the pinned revision
    note: the promote is driven by the source's pods being GONE, not by the replacement becoming Ready; it stamps Ready on the pinned revision, clears the marker operation, and prunes that revision's RetryBlock
    invariants: [one.operation.per.instance]
    placement: kind
    coverage: {perm: [], unit: [TestGangSurge_PromoteEmitsCompletedEvent, TestGangSurge_ResumesPromotedTargetWithPodlessSource], kind: [], replay: [surgedrain-gang-complete]}
    status: decided
  - state: Update/GangSurgeTarget
    event: pod.deleted
    variants: [source]
    windows: [boundary, after]
    transition: T-gangtarget-ready
    outcome: ignore
    note: the promote write is landing; a further source pod disappearance adds nothing, and the authoritative pair guard rejects the write if either side drifted
    placement: kind
    coverage: {perm: [], unit: [TestPromoteGangSurgeTarget_RejectsAuthoritativePairDrift], kind: []}
    status: decided
  - state: Update/GangSurgeTarget
    event: pod.deleted
    variants: [source]
    windows: [boundary, after]
    transition: T-gangtarget-cleanup-failed
    outcome: ignore
    note: the retirement is claiming the marker; losing a source pod does not revive the promote, and the source is reset to Ready on its running revision when the cleanup completes
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: pod.deleted
    variants: [source]
    windows: [boundary, after]
    transition: T-gangtarget-cleanup-superseded
    outcome: ignore
    note: same as the failed retirement — the marker is being retired, and source pod loss is repaired after the source is reset
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: pod.deleted
    variants: [source]
    windows: [boundary, after]
    transition: T-gangtarget-teardown
    outcome: ignore
    note: teardown treats every observed index as a scale-down extra, so both sides of the pair are already headed for deletion
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: pod.deleted
    variants: [target]
    windows: [before]
    outcome: ignore
    guard: the marker's preserved Update operation keeps ownership, so the restart trigger declines the loss below Ready
    note: the source's surge pass recreates the missing member at the SAME index and ensures the gang PodGroup before the pod, so the replacement is refilled rather than reallocated
    invariants: [podgroup.before.pods]
    placement: kind
    coverage: {perm: [], unit: [TestGangSurgeUpdate_EnsuresPodGroupBeforeSurgePods, TestGangSurge_PromotedPinnedTargetRecreatesMissingPodsBeforeNewerRevision], kind: []}
    status: decided
  - state: Update/GangSurgeTarget
    event: pod.deleted
    variants: [target]
    windows: [boundary, after]
    transition: T-gangtarget-ready
    outcome: ignore
    note: once the promote lands the index is an ordinary Ready Instance with no operation, so the restart pass owns a missing member from that point on
    placement: kind
    coverage: {perm: [], unit: [TestDetectRestartTrigger_PromotedGangTargetOwnsAMissingMember], kind: []}
    status: decided
  - state: Update/GangSurgeTarget
    event: pod.deleted
    variants: [target]
    windows: [boundary, after]
    transition: T-gangtarget-cleanup-failed
    outcome: ignore
    note: the retirement deletes every replacement pod anyway, so losing one early only shortens the wait for the cleanup to finish
    placement: perm
    coverage: {perm: [], unit: [TestAbandonFailedGangSurge_DeletesStalePodsFirst], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: pod.deleted
    variants: [target]
    windows: [boundary, after]
    transition: T-gangtarget-cleanup-superseded
    outcome: ignore
    note: same as the failed retirement — the superseded replacement is being deleted, and no RetryBlock is recorded because a spec change is not a failure
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: pod.deleted
    variants: [target]
    windows: [boundary, after]
    transition: T-gangtarget-teardown
    outcome: ignore
    note: teardown deletes the index outright, so a member lost while the delete stamp lands is simply one fewer pod to drain
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: pod.waiting
    variants: [ImagePullBackOff, ErrImagePull, InvalidImageName, CreateContainerConfigError, CreateContainerError, CrashLoopBackOff, RunContainerError]
    outcome: escalate
    guard: a replacement pod held the reason past the stuck-pod grace and the replacement pod set is not fully serving
    note: all seven are terminal waiting reasons, so the escalation pass stamps BOTH the source (its blame bucket is the replacement gang) and this marker Failed with the operation preserved; the source's Failed is what drives the abandon path. Unlike a single-pod surge, a gang target is never recycled in place
    placement: kind
    coverage: {perm: [], unit: [TestEscalation_WedgedGangReplacementFailsBothHalvesOfThePair], kind: [], replay: [gangtarget-stuck]}
    status: decided
  - state: Update/GangSurgeTarget
    event: pod.waiting
    variants: [DeadlineExceeded]
    outcome: ignore
    note: DeadlineExceeded is the diagnostic the deadline backstop stamps, not a kubelet waiting reason, so the stuck classifier never matches it; only the operation deadline can fail this row
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: pod.containerRestart
    outcome: ignore
    note: pod-level restart evidence is Ready-gated, so a container restart while the replacement gang is still forming reads as the ordinary boot path
    placement: kind
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: pod.uidRotated
    outcome: ignore
    note: the surge pass keys missing pods by name, so a same-name pod under a new UID is simply observed as present on the next live list
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: pod.stuckTerminating
    outcome: defer
    note: the stuck classifier skips pods carrying a deletionTimestamp, and the name is still occupied so no replacement pod is created; the update pass sweeps only the pods of the row it dispatches, and this marker is a different index, so the wait is bounded only by the operation deadline
    placement: kind
    coverage: {perm: [], unit: [TestEscalation_TerminatingMarkerPodEndsNothing], kind: []}
    status: decided
  - state: Update/GangSurgeTarget
    event: pod.nodeLost
    outcome: defer
    note: node death has no handler on the gang surge path — a gang Update attempt is not disposable, so no relocation directive is recorded and the operation deadline is the only bound; the exclusion memory carried into the replacement plan is the source's, not evidence from this loss
    placement: kind
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: pod.schedulingGated
    outcome: defer
    note: a queued replacement is not stuck — the gated-deadline step parks this row's deadline, the escalation pass skips the row outright, and the source's deadline is parked too because its blame bucket is this index
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: pod.evicted
    outcome: ignore
    note: an eviction reads as pod loss at this index and the source's surge pass refills the gang at the same index, PodGroup first
    invariants: [podgroup.before.pods]
    placement: kind
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: spec.revision
    windows: [before]
    outcome: transition
    to: Update/GangSurgeTargetCleanup
    guard: the replacement gang is incomplete or not all runtime-ready; a replacement that is already complete and runtime-ready finishes on its pinned revision instead and the next revision rolls afterwards
    note: the in-flight surge is ABANDONED, not retargeted — the marker's step advances to the cleanup claim and no RetryBlock is recorded, because a spec change is not a failure of the retired revision
    placement: kind
    coverage: {perm: [], unit: [TestGangSurge_PromotedPinnedTargetRecreatesMissingPodsBeforeNewerRevision], kind: [], replay: [gangtarget-abandon-superseded]}
    status: decided
  - state: Update/GangSurgeTarget
    event: spec.revision
    windows: [boundary, after]
    transition: T-gangtarget-cleanup-superseded
    outcome: ignore
    note: the cleanup claim is being stamped; a further revision move does not re-open the retired replacement, and the fresh roll re-enters from the source once it is reset to Ready
    placement: kind
    coverage: {perm: [], unit: [TestGangSurge_CleanupMarkerRemainsTerminalWhenDesiredRevisionReturns], kind: []}
    status: decided
  - state: Update/GangSurgeTarget
    event: spec.revision
    windows: [boundary, after]
    transition: T-gangtarget-ready
    outcome: ignore
    note: the promote is committing on the pinned revision; the newer target is visible afterwards as RunningRevision not equal to target and starts a fresh surge from the promoted index
    placement: kind
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: spec.revision
    windows: [boundary, after]
    transition: T-gangtarget-cleanup-failed
    outcome: ignore
    note: the failure retirement already owns the marker; the corrective revision is consumed by the source once the cleanup resets it, which is also where the failed revision's RetryBlock is recorded
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: spec.revision
    windows: [boundary, after]
    transition: T-gangtarget-teardown
    outcome: ignore
    note: teardown outranks every rollout decision — no revision is rolled once the owner carries a deletionTimestamp
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: spec.annotationOnly
    outcome: ignore
    note: excluded annotations and labels are not part of the revision payload, so the pinned surge revision and the desired target still agree and nothing is retired
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: spec.strategy
    outcome: ignore
    note: the strategy is pinned for the life of the operation, so the gang surge stays in control and finishes under SurgeThenDrain; the edit reaches the pair at its next admitted attempt
    placement: perm
    coverage: {perm: [], unit: [TestEffectiveUpdateStrategy_GangSurgePairStaysOnThePinnedStrategy], kind: []}
    status: decided
  - state: Update/GangSurgeTarget
    event: spec.replicasUp
    outcome: ignore
    note: the marker's index is already taken, so scale-up allocates fresh indices around it; those are surge-free and are materialized by the restricted create path while the rollout runs
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: spec.replicasDown
    outcome: ignore
    note: the marker is pinned in the plan for as long as a source references the index, so the scale-down wave cannot pick it; the reduction takes effect once the surge resolves
    invariants: [marker.pinned.while.referenced]
    placement: perm
    coverage: {perm: [], unit: [TestInstancePlanIndices_GangSurgePinsPair], kind: []}
    status: decided
  - state: Update/GangSurgeTarget
    event: spec.pauseTrue
    outcome: defer
    note: a standard pause plans nothing past the restart pass, so the source stops driving the surge; the marker keeps its pods and its claim, escalation is suspended with the rest of the lifecycle, and the attempt carries Operation.Waiting=Paused with its deadline parked. A gang SurgeThenDrain cycle is held whole rather than run to a step boundary — it spans the source and this marker and keeps the source serving from its first pass to its last, so parking it costs the Instance no capacity
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: spec.pauseFreeze
    outcome: defer
    note: freeze truncates after the truth pass, so repair is suspended too; the frozen marker is otherwise identical to a standard pause
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: spec.unpause
    outcome: ignore
    note: the surge resumes from its durable claim — the source's SurgeIndex plus this marker — with no re-entry through the budget or the gate
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: spec.teardown
    windows: [before]
    outcome: transition
    to: Delete/Drain
    guard: the owner carries a deletionTimestamp, so the planned index set is emptied and every observed index becomes a scale-down extra
    note: teardown short-circuits the whole pipeline before the update pass runs, so the marker is admitted into the scale-down wave like any other index
    placement: perm
    coverage: {perm: [], unit: [], kind: [], replay: [gangtarget-teardown]}
    status: current
  - state: Update/GangSurgeTarget
    event: spec.teardown
    windows: [boundary, after]
    transition: T-gangtarget-teardown
    outcome: transition
    to: Delete/Drain
    note: the Deleting phase and the Delete Drain operation are committed in one status transaction, so the stamp is idempotent across the passes that follow
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: spec.teardown
    windows: [boundary, after]
    transition: T-gangtarget-ready
    outcome: transition
    to: Delete/Drain
    note: teardown outranks the promote — the next reconcile takes the teardown branch before the update pass, whether or not the promote landed
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: spec.teardown
    windows: [boundary, after]
    transition: T-gangtarget-cleanup-failed
    outcome: transition
    to: Delete/Drain
    note: the scale-down pipeline owns wedge escalation under teardown, so the retirement's own drain is superseded by the delete wave
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: spec.teardown
    windows: [boundary, after]
    transition: T-gangtarget-cleanup-superseded
    outcome: transition
    to: Delete/Drain
    note: same as the failed retirement — the delete wave supersedes it and no RetryBlock bookkeeping survives teardown
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: spec.migrateRequest
    outcome: defer
    note: a fresh migration record is not driven while any surge is in flight, and the source's Surge step is counted, so the request waits for the gang surge to resolve
    placement: perm
    coverage: {perm: [], unit: [TestPlan_MigrationRequestWaitsForAGangSurgeToResolve], kind: []}
    status: decided
  - state: Update/GangSurgeTarget
    event: spec.partition
    outcome: ignore
    note: partition candidacy excludes every row carrying an Update operation, so a marker is never held nor released by a partition edit
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: timer.minReady
    outcome: ignore
    note: the window is consumed by the source's drain gate while the source is still in rotation; past the Surge step it no longer applies, so a replacement that flaps Ready cannot hold a drained source out of service for another window
    placement: kind
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: timer.expectationsTTL
    outcome: ignore
    note: the expired create barrier simply lets the next pass recompute the missing pod set from a live list; a create that did land is adopted by name through AlreadyExists
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: timer.operationDeadline
    windows: [before]
    outcome: transition
    to: Update/GangSurgeTargetCleanup
    guard: the paired source escalated to Failed on this surge before the replacement was promoted, and no replacement pod is held by an admission scheduling gate
    note: the modeled edge is the source's escalation driving the abandon path, which claims the cleanup marker so it keeps ownership of its pods and PodGroup. The marker's OWN deadline additionally stamps this row Failed with the operation preserved (T-gangtarget-deadline)
    placement: kind
    coverage: {perm: [], unit: [TestAbandonFailedGangSurge_PersistsCleanupMarkerAcrossRemovalFailure], kind: [], replay: [gangtarget-deadline]}
    status: decided
  - state: Update/GangSurgeTarget
    event: timer.operationDeadline
    windows: [boundary, after]
    transition: T-gangtarget-cleanup-failed
    outcome: ignore
    note: the escalation pass skips an already-Failed row, so a deadline that keeps elapsing while the cleanup claim lands produces no second stamp and no second event
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: timer.operationDeadline
    windows: [boundary, after]
    transition: T-gangtarget-ready
    outcome: ignore
    note: the promote clears the marker operation, and a Ready row has no deadline to elapse; a deadline observed against the pre-promote snapshot is dropped because the mutation refuses a slot whose operation is already gone
    placement: kind
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: timer.operationDeadline
    windows: [boundary, after]
    transition: T-gangtarget-cleanup-superseded
    outcome: ignore
    note: the supersede retirement is already claiming the marker; the elapsed deadline adds no RetryBlock because a spec change is not a failure
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: timer.operationDeadline
    windows: [boundary, after]
    transition: T-gangtarget-teardown
    outcome: ignore
    note: the escalation pass does not run at all under teardown — the scale-down pipeline owns wedge escalation there
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: ctrl.crash
    outcome: ignore
    note: the durable anchor is the pair — the source's SurgeIndex plus this marker row — so a restart resumes the surge; a marker lost between the two writes is re-established before any pod effect, and a marker restored over an incomplete replacement is restored straight into the cleanup claim
    placement: kind
    coverage: {perm: [], unit: [TestGangSurge_RestoresMissingTargetMarkerBeforeEffects, TestGangSurge_RestartAfterTargetStampFailureRestoresCleanupBeforeRedirects], kind: []}
    status: decided
  - state: Update/GangSurgeTarget
    event: ctrl.staleRead
    outcome: ignore
    note: every destructive step reads the replacement and source pods live, and each status write is fenced on the authoritative snapshot of BOTH lifecycle identities, so a lagging cache cannot claim an occupied target or delete a live one
    placement: sim
    coverage: {perm: [], unit: [TestGangSurge_StaleSnapshotDoesNotClaimOccupiedTarget, TestGangSurge_CachedTargetMissingAuthoritativelyRestoresBeforeEffects], kind: []}
    status: decided
  - state: Update/GangSurgeTarget
    event: api.conflict
    outcome: defer
    note: a precondition or owner-gone failure on the paired status write returns without effect and the pass retries on the requeue; the pair guard is re-evaluated against the fresh snapshot each attempt
    placement: sim
    coverage: {perm: [], unit: [TestStartGangSurge_WriteFailureLeavesPairUnchanged, TestStartGangSurge_RejectsAuthoritativeDrift], kind: []}
    status: decided
  - state: Update/GangSurgeTarget
    event: api.alreadyExists
    outcome: ignore
    note: a replacement pod create that races cache lag is adopted by name — the create expectation is rolled back and the pod counts as present on the next list
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: api.notFound
    outcome: ignore
    note: a pod that is already gone is treated as deleted, and a status write against a removed owner returns the owner-gone sentinel, which the pass maps to no effect rather than an error
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: api.quotaDenied
    outcome: defer
    note: a refused gang-member create is classified as capacity-blocked and the QuotaExceeded waiting token is recorded on the surge row; the source's own deadline parks through it, because the governing operation and its clock live on the source while the pods are created under the surge index, and the parking step follows that SurgeIndex. A quota rejection leaves no pod to carry a scheduling gate, which is exactly why the wait is recorded on the Operation instead. The token is released on the first pass whose creates all land
    placement: perm
    coverage: {perm: [], unit: [TestGangSurgeCreate_QuotaExceeded_WaitsWithoutFailing], kind: []}
    status: decided

  # The marker's own escalation edges. Both stamp Phase Failed with the
  # operation preserved (a gang Update attempt is never disposable), and
  # both are diagnostic only: the source's claim predicates match on
  # revision and step, never on phase, so the surge machine keeps driving.
  - state: Update/GangSurgeTarget
    event: pod.deleted
    variants: [source]
    windows: [boundary, after]
    transition: T-gangtarget-deadline
    outcome: ignore
    note: the Failed stamp does not consume the promote; a source pod disappearing still drives the pair's promote on a later pass because the claim ignores phase
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: pod.deleted
    variants: [source]
    windows: [boundary, after]
    transition: T-gangtarget-stuck-failed
    outcome: ignore
    note: the blamed pod is a replacement pod, so a source pod disappearing neither adds to nor removes the wedge evidence, and the promote remains available
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTarget
    event: pod.deleted
    variants: [target]
    windows: [boundary, after]
    transition: T-gangtarget-deadline
