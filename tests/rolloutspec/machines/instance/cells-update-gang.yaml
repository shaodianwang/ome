  - state: Update/GangSurgeTargetCleanup
    event: pod.ready
    variants: [source]
    outcome: ignore
    note: the source keeps serving throughout the retirement; that is the point of abandoning the replacement rather than the source
    invariants: [source.serves.through.retirement]
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.ready
    variants: [target]
    outcome: ignore
    note: same as ContainersReady — a late-ready retired pod is still deleted, and the row's minReadySeconds column is row-level n/a for exactly this reason
    placement: kind
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.servingOn
    variants: [source]
    outcome: ignore
    note: the source never left rotation, so its gate being asserted again is a no-op for the retirement
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.servingOn
    variants: [target]
    outcome: ignore
    note: the retirement deletes the replacement pods outright and issues no drain flip for them; a serving gate asserted before the retirement is released by the deletion itself
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.servingOff
    variants: [source]
    outcome: ignore
    note: no writer takes the source out of rotation on this path, so an observed flip is external and does not change the retirement
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.servingOff
    variants: [target]
    outcome: ignore
    note: a retired pod leaving rotation is the direction the retirement is already going; nothing re-asserts the gate once the cleanup claim is stamped
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.deleted
    variants: [source]
    outcome: ignore
    note: the reset stamps the source Ready on its running revision without consulting its pods, so a source pod lost mid-retirement is repaired afterwards by the restart or create pass
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Update/GangSurgeTargetCleanup
    event: pod.deleted
    variants: [target]
    windows: [before]
    outcome: transition
    to: Empty
    guard: every pod of the retired replacement is gone and the per-Instance resource finalization reports complete
    note: the marker row removal and the source reset are ONE status transaction, so marker absence can never be mistaken for an interrupted stamp and restored as active work; a failed revision records its RetryBlock in the same write and expectations for the index are forgotten
    invariants: [marker.owns.its.pods.until.removed]
    placement: kind
    coverage: {perm: [], unit: [TestAbandonFailedGangSurge_AtomicallyRemovesMarkerAndResetsSource, TestAbandonFailedGangSurge_ResetsSourceAfterPodsGone, TestAbandonFailedGangSurge_RecordsRetryBlockWithPolicy], kind: [], replay: [gangtarget-deadline]}
