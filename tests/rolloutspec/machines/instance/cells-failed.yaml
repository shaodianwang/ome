# Cells for the Failed state of the instance machine.
#
# Failed is the escalation pass's terminal stamp. It keeps its operation
# for a gang surge and a Restart, and has it cleared for a disposed Create,
# recreate or in-place Update attempt, single-pod or gang; both shapes are
# live here, so the operation-bearing events are real rather than n/a. A kept
# Restart operation is a record of a spent attempt rather than a claim: the
# gang-member-loss trigger re-arms over it, the restart pass closes it once
# no live pod is left, and the operator reset mailbox clears it outright. The
# escalation pass skips an already-Failed row, so failure evidence arriving
# in this state is an ignore, not a second escalation.
#
# Three exits are easy to miss. The update trigger's AdoptRevision backfill
# stamps Ready-on-target from ContainersReady alone when RunningRevision is
# empty and the pods carry the target revision's hash — and only then: an
# unhealthy pod set on the target is a row to recover, so it takes the
# ordinary roll (T-failed-adopt-revision); a
# Failed single-pod source whose wedged CreateContainerError replacement is
# recycled re-enters the surge on the next pass (T-failed-recycle-resurge);
# and a row whose remaining pods are all in a terminal phase has them
# recycled and is rebuilt by the Create pass (T-failed-recycle-rebuild).
#
# A parked repair - a kept Restart operation - has exits of its own, all
# decided in the restart pass: its rebuilt set coming up resumes the
# promote at the incarnation the pods carry (T-failed-repair-resume), and a
# set that stays wedged is rebuilt again on the operator's retry ladder,
# lifecycle.updateRetry (T-failed-repair-rearm), whose delay runs from the
# recorded failure and whose attempts are counted on the operation. A park
# whose recorded failure is workload-caused - a container config or image
# the pod template names, which the kubelet retries in place and a fresh
# pod set would wedge on identically - is owed no re-arm: it stays Failed
# with its reason, says once what it waits for, and leaves through the
# resume when the configuration or image is fixed. No ladder configured
# leaves the row parked for the reset mailbox or a new revision. A park
# whose pod set is entirely gone or terminal has nothing left to resume or
# rebuild under the spent operation, whatever the cause or the ladder: the
# restart pass closes the operation (ops/restart.go spentRepairPodSetGone,
# RepairClosed event) and the row takes the Create pass's fresh start as
# every total loss does - the dead occupants recycled, the set rebuilt
# under the row's incarnation, gated like any fresh start.
#
# GAP: no event models the unconditioned re-create. A Failed row with no
# pods and no RetryBlock at all is re-materialized by the Create pass on
# the very next pass (ops/create.go allowCreateForMissingInstance treats
# Failed-with-no-operation as a fresh start); both T-failed-retry and
# T-failed-corrective presuppose a due block or a new target.
cells:
  - state: Failed
    event: pod.scheduled
    variants: [source]
    outcome: ignore
    note: binding is observation only; the aggregator counts the pod and no pass keys on where a Failed row's pod landed
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: pod.scheduled
    variants: [target]
    outcome: ignore
    note: the abandon and recycle paths key on the replacement pod existing, not on its node; a retired replacement being bound changes nothing
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: pod.containersReady
    variants: [source]
    outcome: transition
    to: Ready
    guard: either RunningRevision is empty, every pod carries the target revision's hash AND is ContainersReady, and no RetryBlock denies that target (the AdoptRevision backfill), or the row is a Restart parked at Failed whose live set is complete, at the row's incarnation and ContainersReady (the repair resume), or the row is a crash-loop park - Failed with no operation, remembering a crash of its promoted set - whose live set is complete at the row's incarnation on the running revision and fully serving (the park follows its pod set)
    note: three routes. A crash-loop park whose set serves again returns to Ready with ReadySince and the failure record's time kept, so the ladder and the roll keep reading the set as the one that crashed, naming the crash loop on the record while the ladder holds (ops/restart.go readCrashLoopEpisode); it parks again when the set leaves serving. A parked repair whose rebuilt set came up on its own - the kubelet's retry succeeded once a missing image tag or ConfigMap key was back - is resumed by the restart pass at the incarnation the pods carry - serving gate, then Ready on the running revision with the spent operation cleared, with no operator action and whether or not a retry ladder is configured (ops/restart.go). Otherwise a pod's revision is its revision-hash label, which is what the renderer stamps and what every other pass reads, so the pods the engine already wrote at the target are recognised as being on it; the adoption path then stamps Ready-on-target from ContainersReady alone and prunes that revision's RetryBlock. Adoption is that one shape and nothing wider - a pod carrying another hash or no hash at all is not on the target, an on-target pod set that is not runtime-ready is a row to recover, and both take the ordinary roll, which is the retry, recreate or relocation the row's strategy and disposition resolve; a Failed row with a recorded RunningRevision is never adopted and returns only through the park's own route
    invariants: [ready.requires.proof]
    placement: unit
    coverage:
      perm: []
      unit: [TestRestart_CrashLoopParkReturnsToReadyWhileItsSetServes, TestUnparkServing_ReturnsAParkToReadyKeepingItsAnchor, TestCrashLoopAfterPromotion_HeldRowFollowsItsServingPod, TestDetectUpdate_BackfillAdoptsRuntimeReadyPods, TestDetectUpdate_BackfillAdoptsEngineRenderedPods, TestDetectUpdate_BackfillRefusesWedgedPods, TestDetectUpdate_BackfillRollsPodSetWithAForeignRevision, TestDetectUpdate_WedgedPodsReachHeld, TestDetectUpdate_StuckPodOnTargetRelocates, TestPatchReadyOnRevision_PrunesBlock, TestPlan_Update_AdoptRevision, TestSpentRepair_RebuiltSetComesUp_ResumesThePromote, TestRestart_DeadlineFailedRowResumesItsPromote, TestSpentRepair_KubeletRetriedCause_WaitsForTheFixWithoutReArm, TestRestart_KubeletRetriedCauseClearedResumesThePromote, TestDetectRestartTrigger_SpentRepairWithALivePodIsNotClosed, TestSpentRepair_LiveSetIsNeverClosed]
      kind: [failed_repair_heal]
      replay: [failed-runtime-ready-adopt, failed-repair-resume, failed-repair-waits-on-workload]
    status: decided
  - state: Failed
    event: pod.containersReady
    variants: [target]
    outcome: ignore
    note: a replacement becoming runtime-ready does not rescue a Failed source; the gang abandon path retires it and a single-pod surge only resumes when its block is due or a corrective revision arrives
    placement: perm
    coverage:
      perm: []
      unit: [TestAbandonFailedGangSurge_AtomicallyRemovesMarkerAndResetsSource]
      kind: []
    status: decided
  - state: Failed
    event: pod.ready
    variants: [source]
    outcome: ignore
    note: PodReady adds nothing the Failed row reads; both the adoption path and the stuck-pod guard are written against ContainersReady plus the serving gate
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: pod.ready
    variants: [target]
    outcome: ignore
    note: the replacement's own readiness is consumed by the surge machine, which a Failed source has already left
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: pod.servingOn
    variants: [source]
    outcome: transition
    to: Ready
    guard: the row is a crash-loop park - Failed with no operation, remembering a crash of its promoted set - and the gate rejoining the rotation completes a live set that is complete at the row's incarnation on the running revision and fully serving
    note: a Failed row whose current set is fully serving returns to Ready - the restart pass returns the park with ReadySince and the failure record's time kept, naming the crash loop on the record while the ladder holds (ops/restart.go readCrashLoopEpisode), and parks it again when the set leaves serving. The escalation pass still never un-stamps a row whose set is down, and a parked repair whose set is complete and ContainersReady re-enters through T-failed-repair-resume on that readiness, not on the gate; for every other Failed row rejoining the rotation only raises ServingPodCount once the kubelet folds the gate into the pod's Ready condition
    placement: unit
    coverage:
      perm: []
      unit: [TestRestart_CrashLoopParkReturnsToReadyWhileItsSetServes, TestUnparkServing_ReturnsAParkToReadyKeepingItsAnchor, TestCrashLoopAfterPromotion_HeldRowFollowsItsServingPod]
      kind: []
    status: decided
  - state: Failed
    event: pod.servingOn
    variants: [target]
    outcome: ignore
    note: a retired replacement in rotation is still retired; the abandon path deletes it whatever its serving gate says
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: pod.servingOff
    variants: [source]
    outcome: ignore
    note: serving loss only moves counters, but a Failed row at zero serving pods on a non-surge strategy becomes coordination-gate exempt so its own recreate is not starved by the outage it caused
    placement: unit
    coverage:
      perm: []
      unit: [TestPlan_Update_CoordGateExempt_FailedZeroServing, TestPlan_UpdateCoordGateExemptSurgeKeepsConsult]
      kind: []
    status: current
  - state: Failed
    event: pod.servingOff
    variants: [target]
    outcome: ignore
    note: the replacement leaving rotation is part of its teardown; the abandon path is driven by the pods disappearing, not by the gate
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: pod.deleted
    variants: [source]
    windows: [before]
    outcome: transition
    to: Restart/Drain
    guard: RecreateInstanceOnPodRestart, a multi-pod Instance with at least one survivor once terminal-phase pods are excluded from the live count, no preserved Update or Migrate operation, no RetryBlock denying the rebuild, and the revision the rebuild would land on still the roll target
    note: partial gang loss is repaired from Failed because the recovery cannot be gated on a Ready the gang cannot reach; total loss instead falls to the Create pass's fresh start - a parked repair's included, once the restart pass has closed the spent operation for having no live pod left (ops/restart.go spentRepairPodSetGone). A Failed row off the target is never repaired - the restart pass yields it and its corrective roll (spec.revision) replaces the gang at the target. A Restart parked at Failed is read as a spent attempt rather than an owner, so it re-arms the whole gang - only another Restart can rebuild it as one, with the incarnation bumped, the survivors drained and the fresh operation's RetryCount continuing the spent one's - and each cycle is bounded by the attempt deadline; an Update or Migrate continuation still blocks the trigger because its own pass owns the row (ops/restart.go)
    invariants: [one.operation.per.instance]
    placement: unit
    coverage:
      perm: []
      unit: [TestDetectRestartTrigger_GangMemberLossBelowReady, TestRepairYieldsToTarget, TestDetectRestartTrigger_SpentRepairWithNoPodsCloses, TestSpentRepair_NoPodsLeft_ClosesAndRebuildsAsAFreshStart]
      kind: []
      replay: [failed-restart]
    status: decided
  - state: Failed
    event: pod.deleted
    variants: [source]
    windows: [boundary, after]
    outcome: ignore
    note: the loss is consumed once; the Restart stamp is idempotent on re-observation and after it lands the row is Restarting
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: pod.deleted
    variants: [target]
    windows: [before]
    outcome: transition
    to: Ready
    guard: the retired replacement's pods are all gone and the cleanup marker is claimed by this source
    note: the abandon finalizes the replacement index, removes its row and resets the source Ready on its running revision in one transaction, recording the failed revision's RetryBlock; that block counts the wave toward updateRetry.maxAttempts whatever the source's LastFailure reason (a crash-looping replacement gang ends Held at that bound the way a bad image does), except a scheduler hold, which is the environment's and records nothing; with no updateRetry configured a wave the revision is not blamed for records nothing and the source re-surges on the next pass. A recycled single-pod CreateContainerError target instead lets the ordinary surge path stamp a fresh attempt
    invariants: [serving.source.untouched]
    placement: perm
    coverage:
      perm: []
      unit: [TestAbandonFailedGangSurge_ResetsSourceAfterPodsGone, TestAbandonFailedGangSurge_AtomicallyRemovesMarkerAndResetsSource, TestAbandonFailedGangSurge_RecordsRetryBlockWithPolicy, TestAbandonFailedGangSurge_WavesHoldAtMaxAttempts, TestCrashLoopBound_NewRevisionCrashesAtStart]
      kind: []
      replay: [failed-gang-surge-reset, failed-recycle-resurge]
    status: decided
  - state: Failed
    event: pod.deleted
    variants: [target]
    windows: [boundary, after]
    outcome: ignore
    note: the reset is written once under the source's ownership guard; a re-observed disappearance re-derives the same write
    placement: perm
    coverage:
      perm: []
      unit: [TestAbandonFailedGangSurge_PersistsCleanupMarkerAcrossRemovalFailure]
      kind: []
    status: decided
  - state: Failed
    event: pod.waiting
    variants: [ImagePullBackOff, ErrImagePull, InvalidImageName, CreateContainerConfigError, CrashLoopBackOff, RunContainerError, DeadlineExceeded]
    outcome: ignore
    note: a Failed row takes no new edge on fresh pod evidence; the single effect is an evidence refresh, one LastFailure overwrite when the recorded reason is the generic deadline and the pod now names a concrete cause. The recorded time survives the overwrite - what changes is the cause, not when the row failed - and the refresh is edge-triggered by that generic reason, so a concrete cause already on the record is the first named one and is never replaced. No second event, no change to the RetryBlock, and the phase and operation are untouched
    invariants: [failed.is.sticky]
    placement: perm
    coverage:
      perm: []
      unit: [TestEscalation_StuckPodNotServing_IdenticalDispositionOutcome]
      kind: []
    status: current
  - state: Failed
    event: pod.waiting
    variants: [CreateContainerError]
    outcome: escalate
    guard: a disposed single-pod surge whose LastFailure names CreateContainerError, whose serving source is still healthy on its running revision, and whose failed node the disposition already authorized relocating away from
    note: the wedged replacement is deleted rather than left parked, so the next attempt is steered onto another node by the exclusion overlay; the serving source is never touched
    invariants: [serving.source.untouched]
    placement: perm
    coverage:
      perm: []
      unit: [TestSurgeUpdate_RecyclesFailedCreateContainerTargetThenRetries, TestSurgeUpdate_FailedCreateContainerTargetParksWithoutRelocationAuthorization, TestSurgeUpdate_FailedCreateContainerTargetRequiresServingSource]
      kind: []
    status: decided
  - state: Failed
    event: pod.containerRestart
    outcome: ignore
    note: restart evidence is read against ReadySince and only for a Ready row; a container dying under a Failed row is the failure that is already recorded
    placement: perm
    coverage:
      perm: []
      unit: [TestDetectRestartTrigger_RichReasonForFailedPod]
      kind: []
    status: current
  - state: Failed
    event: pod.uidRotated
    outcome: ignore
    note: no attempt is in flight to invalidate; pod identity is re-read from the live list on the next pass and the incarnation label decides ownership
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: pod.stuckTerminating
    outcome: defer
    note: the abandon and cleanup paths skip a pod that already carries a deletionTimestamp and re-poll; force-delete is owned by the delete pass, so a Failed row's stuck pod is waited on rather than forced
    placement: kind
    coverage:
      perm: []
      unit: [TestAbandonFailedGangSurge_DeletesStalePodsFirst]
      kind: []
    status: current
  - state: Failed
    event: pod.nodeLost
    outcome: ignore
    note: node-death evidence drives the relocation directive at disposition time and the force-delete policy in the delete pass; neither reads it again from a Failed row
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: pod.schedulingGated
    outcome: ignore
    note: the deadline parking step and the escalation gate-skip both apply to transient phases only, so a gate entering or leaving a Failed row's pod changes nothing
    placement: unit
    coverage:
      perm: []
      unit: [TestEscalation_AdmissionGatedInstance_DeadlineSkipped]
      kind: []
    status: current
  - state: Failed
    event: pod.evicted
    outcome: ignore
    note: an eviction resolves into the pod disappearing, which is where the gang repair and the abandon path pick it up
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  # The corrective and retry rows both fan out: `to` names the no-pods
  # destination and the note names the rest, because the grid has no
  # discriminator for the strategy that resolves the re-entry.
  - state: Failed
    event: spec.revision
    windows: [before]
    outcome: transition
    to: Create/CreatePods
    guard: the corrective revision is a different RetryBlock subject than the held one
    note: a new target re-drives a Failed row exactly as it re-drives a Ready one; the destination is resolved per pass — the Create pass when no pod remains, otherwise Surge, Drain or InPlace. A re-surge at the SAME target is suppressed so a bad revision cannot storm Failed against Updating, a preserved Update operation is a continuation that skips both the retry gate and the budget charge, and a corrective edit at zero revision distance routes to wreckage cleanup instead of an update.
    invariants: [retryblock.gates.fresh.attempts, one.operation.per.instance]
    placement: perm
    coverage:
      perm: []
      unit: [TestDetectUpdateTrigger_PhaseFailedRetriggersOnMismatch, TestDetectUpdate_NewRevisionPassesGate, TestDetectUpdate_FailedContinuationPassesGate, TestPatchInstanceStatusSurgingForUpdate_FailedStickyOnSameTarget, TestPlan_Update_CleanupOnly_RollBackWreckage, TestCorrectiveRecovery_SinglePod_RollForward, TestCorrectiveRecovery_Gang_RollForward, TestCorrectiveRecovery_SinglePod_RollBack]
      kind: []
      replay: [failed-corrective-create, failed-corrective-inplace, failed-corrective-recreate, failed-corrective-surge]
    status: decided
  - state: Failed
    event: spec.revision
    windows: [boundary, after]
    outcome: ignore
    note: the corrective edit is consumed once; the same attempt stamp is re-derived idempotently at the boundary and after it lands the row no longer reads Failed
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: spec.annotationOnly
    outcome: ignore
    note: excluded annotations and labels are kept out of the revision hash, so the target is unchanged and nothing re-drives the row
    placement: unit
    coverage: {perm: [], unit: [TestFailedRow_ExcludedAnnotationEditDoesNotRedriveIt], kind: []}
    status: decided
  - state: Failed
    event: spec.strategy
    outcome: defer
    note: a Failed row is deliberately not held on the surge machine, so editing the strategy is a usable rescue lever — the strategy pinned on the preserved operation does not bind a row that holds no attempt, so the next admitted attempt reads the edited spec - it still waits for a due RetryBlock or a corrective revision
    placement: perm
    coverage:
      perm: []
      unit: [TestUpdateWithPods_FailedRowPicksUpTheEditedStrategy]
      kind: []
    status: decided
  - state: Failed
    event: spec.replicasUp
    outcome: ignore
    note: a scale-up adds fresh indices and leaves this row's index in the desired set exactly as it was
    placement: unit
    coverage: {perm: [], unit: [TestScaleWhilePushFailed_ScaleUpStaysUnderTheCeiling], kind: []}
    status: current
  - state: Failed
    event: spec.replicasDown
    windows: [before]
    outcome: transition
    to: Delete/Drain
    guard: the index is beyond the new desired set and the scale-down wave admits it within its pod budget
    note: scale-down precedes every other pass and does not care that the row failed; phase and operation are committed in one transaction
    placement: unit
    coverage:
      perm: []
      unit: [TestPlan_ScaleDown_SelectsExtras, TestPlan_FullPrecedenceOrder, TestScaleWhilePushFailed_ScaleDownRemovesTheStuckInstanceFirst]
      kind: []
      replay: [failed-scaledown]
    status: current
  - state: Failed
    event: spec.replicasDown
    windows: [boundary, after]
    outcome: ignore
    note: the admission is committed once per wave; a re-observed reduction re-derives the same Delete stamp
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: spec.pauseTrue
    outcome: ignore
    note: pause parks the update and create passes, so no corrective or retry attempt starts; the paused selection is decided by the row's claim, so a Failed row that still claims an Update is a continuation, not a start - the escalation leaves that claim only on a gang surge, whose cycle the pause parks whole, while a disposed recreate or in-place attempt, single-pod or gang, is Failed with no claim and waits for the unpause; scale-down and the pod-loss repair keep running
    placement: unit
    coverage:
      perm: []
      unit: [TestPlan_Paused_RepairRunsFleetChangesDoNot, TestPlan_Paused_ReDrivesAFailedUpdateContinuation, TestReconcile_PausedSkipsCreate, TestReconcile_PausedStillScalesDown]
      kind: []
      replay: [pause-failed-recreate-parks]
    status: decided
  - state: Failed
    event: spec.pauseFreeze
    outcome: ignore
    note: a frozen pause additionally suspends repair, so even the gang-member-loss rebuild is held; only the status-only truth pass runs
    placement: unit
    coverage:
      perm: []
      unit: [TestPlan_Paused_RepairRunsFleetChangesDoNot]
      kind: []
    status: decided
  - state: Failed
    event: spec.unpause
    outcome: defer
    note: clearing pause only un-parks the passes; the row leaves Failed through whichever trigger the next pass finds, a corrective revision, a due RetryBlock, or the same target when no ladder is configured
    placement: unit
    coverage:
      perm: []
      unit: [TestPlan_Create_AlwaysPlannedUnlessPaused]
      kind: []
      replay: [pause-failed-recreate-parks]
    status: current
  - state: Failed
    event: spec.teardown
    windows: [before]
    outcome: transition
    to: Delete/Drain
    guard: the owner carries a deletionTimestamp so every observed index is treated as a scale-down extra
    note: teardown ignores pause and the failure alike; the Delete operation takes ownership of the drain and of the stuck-pod escalation
    placement: unit
    coverage:
      perm: []
      unit: [TestReconcile_Teardown_IgnoresPaused]
      kind: []
      replay: [failed-teardown]
    status: current
  - state: Failed
    event: spec.teardown
    windows: [boundary, after]
    outcome: ignore
    note: the Delete stamp is committed once; a re-observed teardown re-derives it and the row is then Deleting
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: spec.migrateRequest
    outcome: reject
    guard: the row carries no operation and its target revision is not the one it runs - a disposed Create or Update attempt whose revision never started
    note: a fresh migration record on such a row is closed Failed in the pass that picks it, the revision and its retry ladder named on the record message and a MigrationRequestRejected event, since only a corrected or released revision moves the row and a defer would park the record silently until its deadline (ops/migrate.go migrationSourceRevisionNotStarted). A Failed row at its running revision - a parked repair, or no repair open - still defers without taking ownership, as every source that is not steady Ready does, but not mute - the record stays Accepted carrying the failure and where the repair and its ladder stand, one MigrationDeferred event per cause change says the same, a pass that finds nothing changed rewrites nothing, the row coming back Ready lets the same record allocate, and a deadline that passes first closes the record naming that wait rather than the surge it never allocated (ops/migrate.go migrationSourceRepairParked)
    placement: perm
    coverage:
      perm: []
      unit: [TestPlan_Migrate_SelectsOldestManualRecord, TestMigrate_SourceFailedOnARevisionThatHasNotStarted_RejectedAtOnce, TestMigrationSourceRevisionNotStarted, TestMigrate_SourceFailedAtItsRunningRevision_WaitsNamingTheParkedRepair, TestMigrateExpiry_AcceptedRecordNamesTheCauseItWaitedOn]
      kind: []
    status: current
  - state: Failed
    event: spec.resetInstances
    windows: [before]
    outcome: transition
    to: Failed
    guard: no pod of the Instance is still in the serving rotation, and the preserved operation is one the reset owns - none, a Create, or a Restart
    note: the operator mailbox is the manual exit from a parked repair. Every pod is live-listed and deleted with the expectation recorded before each delete, then the operation is cleared through the MutateInstance seam, which re-checks Phase and the owner on the fresh read; Phase and LastFailure stay, so the row lands in the fresh-start shape the Create pass rebuilds. A row still serving, or one whose preserved operation is an Update or Migrate continuation the rollout and migration machinery owns, is skipped untouched with an InstancesResetSkipped event, and a malformed annotation value resets nothing; the annotation is consumed after the effects commit either way (inferencereplica/reset_instances.go, workload/reset.go)
    placement: unit
    coverage:
      perm: []
      unit: [TestConsumeResetInstances_All_ResetsEveryFailedInstance, TestConsumeResetInstances_ExplicitList_ResetsOnlyNamed, TestConsumeResetInstances_RepairOwnedTargets_Reset]
      kind: []
    status: decided
  - state: Failed
    event: spec.resetInstances
    windows: [boundary, after]
    outcome: ignore
    note: the mailbox is consumed before the workload input is built, so at most one reset runs per pass; a request re-delivered while another edge commits finds nothing left to tear down and is answered as a skip
    placement: unit
    coverage:
      perm: []
      unit: [TestConsumeResetInstances_CrashBeforeConsume_RedeliveryIsNoOp, TestConsumeResetInstances_AllWithNoFailed_SkipConsumed]
      kind: []
    status: decided
  - state: Failed
    event: spec.releaseHeldRevision
    outcome: defer
    note: the mailbox rewrites the Component's RetryBlock and never touches a row; releasing the Held block for this row's target is what lets the retry gate admit a fresh attempt, so the row re-drives through the ordinary create or update trigger on the next pass (inferencereplica/release_held.go)
    placement: unit
    coverage:
      perm: []
      unit: []
      kind: []
    status: current
  - state: Failed
    event: spec.partition
    outcome: defer
    note: a Failed row with no preserved Update operation is an ordinary partition candidate and is simply not selected while held, with no RolloutHold recorded; widening the partition lets the next pass pick it up. The Create pass is not partitioned either, except that a Failed row with no pod left and a recorded running revision that the canary step's projected partition holds is rebuilt at that revision rather than the target, so the step keeps its planned size; one that never ran a revision renders the target
    placement: unit
    coverage:
      perm: []
      unit: [TestPlan_Update_HeldByPartition, TestPlan_Update_PartitionHoldsCountOnSparseIndices, TestCreate_PodlessStableRowUnderACanaryKeepsItsRevision, TestCreate_FirstMaterializationUnderACanaryRendersTheTarget]
      kind: []
    status: decided
  - state: Failed
    event: gate.allow
    outcome: ignore
    note: admission is consulted inside the pass that already decided to re-drive this row, so it only removes a denial; the state change is attributed to the trigger that caused it
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: gate.deny
    variants: [Held]
    outcome: defer
