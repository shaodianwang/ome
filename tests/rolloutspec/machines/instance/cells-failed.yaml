    event: api.namespaceTerminating
    outcome: defer
    note: the NamespaceTerminatingCause check runs on a pod create, and the create that re-materializes this index stamps Creating first, so the refusal is classified and disposed on that state; a write issued while the row still reads Failed is an ordinary error and the row is re-driven under backoff until the owner is itself collected
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: timer.stuckPodGrace
    outcome: ignore
    note: the grace arms the fast escalator in escalation/escalation.go, which skips a row already stamped Failed, so the clock keeps running against a preserved gang surge or restart without producing a second stamp
    invariants: [failed.is.sticky]
    placement: unit
    coverage:
      perm: []
      unit: [TestEscalation_StuckPodNotServing_IdenticalDispositionOutcome]
      kind: []
    status: current
  - state: Failed
    event: timer.forceDelete
    outcome: ignore
    note: a Failed row's stuck pods are swept like every other row's - the Component pass force-deletes a Terminating pod of the row whose node is gone or has been unreachable past the threshold once the pod is past its own deadline plus the slack, with the event and the audit row, and wakes itself at the exact boundary; the row itself is untouched, and the pass that waits on the pod - a gang surge's abandon, a parked repair - goes on from the resulting absence (pkg/controller/v1beta1/workload/reconcile.go, pkg/controller/v1beta1/workload/ops/force_delete.go)
    placement: unit
    coverage: {perm: [], unit: [TestForceDelete_DrainedPodNoOperationWaitsOnIsSweptAtThePolicyBoundary, TestSweepStuckTerminatingPods_VisitsEveryBucketInOrderAndWakesOnTheEarliestBoundary], kind: []}
    status: decided
  - state: Failed
    event: timer.teardownDeadline
    windows: [before]
    outcome: transition
    to: Empty
    guard: the owner is Terminating, the configured teardown deadline has passed since its deletionTimestamp, and the teardown finalizer is still held
    note: inferencereplica/teardown.go tests the deadline before dispatching any pass, so the release is phase-blind — the finalizer goes, the owner and every InstanceStatus row it carried are purged in one delete, and surviving pods fall to background GC through their owner references
    placement: kind
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: timer.teardownDeadline
    windows: [boundary, after]
    outcome: ignore
    note: the finalizer is removed once; a re-observed deadline finds no finalizer and the teardown pass returns immediately, leaving cleanup to background GC
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current

  # --- kubelet admission and slow readiness ---------------------------------
  - state: Failed
    event: pod.admissionRejected
    windows: [before]
    outcome: transition
    to: Create/CreatePods
    guard: no operation is preserved, so the Create pass reads the row as a fresh start, and the rejected pods hold the index's target names
    note: a rejection is phase Failed, so query.IsTerminalPod reads the occupant as absent and ops/terminal_recycle.go deletes it; terminalPodTermination replaces the bare PodFailed placeholder with the pod-level status.reason, so the kubelet's refusal reaches LastFailure verbatim. Environment-caused - no RetryBlock is charged - and the index is re-materialized under a fresh Create CreatePods operation once the deletes are observed
    placement: kind
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: pod.admissionRejected
    windows: [boundary, after]
    outcome: ignore
    note: the recycle writes no phase, and once the Create stamp lands the attempt owns the index; the rejection reason is already on LastFailure
    placement: perm
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: pod.runningNotReady
    outcome: defer
    note: no clock runs on a Failed row at all - isTransientPhase excludes the phase, so neither escalation path arms - and the adoption precondition is ContainersReady, which a pod failing readiness simply never satisfies, so the row takes the ordinary roll instead of the stamp. That roll is how a node-scoped fault is answered — the disposition's terminal AutoRecover directive is executed by the rebuild, which recreates the pod under the recorded node's exclusion overlay. The re-drive is still paced by the RetryBlock gate and attributed to the retry or corrective cell (pkg/controller/v1beta1/workload/escalation/deadline.go, pkg/controller/v1beta1/workload/ops/update.go)
    placement: unit
    coverage:
      perm: []
      unit: [TestDetectUpdate_StuckPodOnTargetRelocates]
      kind: []
    status: decided
  - state: Failed
    event: config.changed
    variants: [retryBlockHistoryLimit]
    outcome: ignore
    note: the cap bounds how many RetryBlocks for SUPERSEDED targets survive the end-of-pass prune, so a tightened value drops older history while the block this row is waiting on, which is for the current target, is never a prune candidate; with none configured nothing is pruned and the list grows with the Component's revision history
    placement: unit
    coverage: {perm: [], unit: [TestFailedRow_SupersedePruneKeepsTheBlockItWaitsOn], kind: []}
    status: decided
  - state: Failed
    event: config.changed
    variants: [requeue]
    outcome: ignore
    note: the cadence paces how soon a row with work left wakes again and is superseded by any explicit wait the pass holds, which for a Failed row is the RetryBlock's own due time; with none configured the pass rides the controller's rate-limited backoff. Neither re-dates the block nor releases it
    placement: unit
    coverage: {perm: [], unit: [TestFailedRow_OperatorConfigChangesLeaveItParked], kind: []}
    status: decided
  - state: Failed
    event: config.changed
    variants: [gangScheduleTimeout, audit]
    outcome: ignore
    note: neither has a reader on a row holding no attempt - the gang schedule clamp is consulted when an attempt builds a PodGroup, and the migration capacity caps bound new requests, which the escalation pass never raises for a Failed row
    placement: unit
    coverage: {perm: [], unit: [TestFailedRow_OperatorConfigChangesLeaveItParked], kind: []}
    status: decided
