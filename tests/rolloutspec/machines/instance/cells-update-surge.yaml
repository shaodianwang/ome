# Cells for the SurgeThenDrain source states: Update/Surge and
# Update/SurgeDrain. The replacement generation of
# a gang surge carries its own states in another file; a single-pod surge
# keeps the source and its replacement on one Instance index, so both pod
# variants are meaningful in every state here.
#
# Outcome convention used throughout this file:
#   ignore  the observation changes no persisted field; the pass may still
#           re-assert an idempotent write such as a serving gate or a step
#           stamp.
#   defer   the step holds: the pass declines to progress, requeues, and
#           re-derives its next action from the persisted step and the live
#           pod set.
# A cell that names a transition covers only that transition's boundary or
# after key; the before key of the same row is a separate cell.
#
# Source pods disappearing before the drain step skip the whole drain block
# (T-surge-source-lost-promote), but not the promote bar: every path stamps
# Ready only once the replacement is PodReady and its minReadySeconds window
# has elapsed.
#
# The strategy is pinned for the life of an operation, so an in-flight surge
# is never unwound by a strategy edit; the edit reaches the Instance at its
# next admitted attempt.
#
# The escalation fast path applies to every transient phase that holds an
# in-flight operation, so a wedged pod fails the Instance from both states
# here: T-surge-stuck and T-surgedrain-stuck.
cells:
  # --- Update/Surge: pod observations -----------------------------------
  - {state: Update/Surge, event: pod.scheduled, variants: [source], outcome: ignore, note: "the surge reads the source's ordinal label and readiness, never its binding", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: pod.scheduled, variants: [target], outcome: ignore, note: "binding advances nothing; the step waits for ContainersReady on the replacement, and leaving the gate also restarts the parked deadline clock", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [hold-unschedulable-then-pause]}, status: current}
  - {state: Update/Surge, event: pod.containersReady, variants: [source], outcome: ignore, note: "the source's own readiness gates nothing at this step; it is read only by the failed-target recycle path, which requires Phase=Failed", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: pod.containersReady, variants: [target], outcome: ignore, note: "ContainersReady only permits writing the replacement's serving gate; the step stays Surge until PodReady and the availability window, per ops/update_surge.go", placement: kind, coverage: {perm: [], unit: [TestSurgeUpdate_Phase1WaitsForSurgeReady, TestSurgeUpdate_HoldsSourceDrainUntilReplacementPodReady], kind: []}, status: decided}
  - {state: Update/Surge, event: pod.ready, variants: [source], outcome: ignore, note: "the source is expected to stay Ready and in rotation for the whole step", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: pod.servingOn, variants: [source], outcome: ignore, note: "the source is in rotation by design until the step advances to SurgeDrain", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: pod.servingOn, variants: [target], outcome: ignore, note: "the gate the pass itself wrote once the replacement reported ContainersReady; PodReady is what the step waits on", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: pod.servingOff, variants: [source], outcome: defer, guard: "the source is out of rotation while the replacement is not yet promotable, so the Instance covers none of its desired capacity", note: "a source unrouted by a foreign writer holds the step visibly: the operation carries a SourceUnrouted waiting token so the outage is reported rather than silent. The fully-serving suppression keys on a source pod still being in rotation, not on old pods merely existing, so it lifts here and the stuck-pod fast path can end the attempt well before the operation deadline", placement: perm, coverage: {perm: [], unit: [TestSourceRotation_ReportsASourceTakenOutFromUnderTheSurge], kind: []}, status: decided}
  - {state: Update/Surge, event: pod.servingOff, variants: [target], outcome: ignore, note: "the pass re-asserts the lifecycle serving gate on every replacement that is ContainersReady, so a dropped gate is repaired on the next pass", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: pod.deleted, variants: [source], windows: [before], outcome: transition, to: Ready, guard: "single-pod source; a gang source instead stamps SurgeDrain and has its row removed once the replacement is promoted", note: "restart does not claim the loss - the trigger is suppressed for every non-Ready phase - and the drain block is skipped entirely when no source pod remains, so the replacement is promoted on the pinned revision as soon as it clears the shared promote bar of PodReady plus the elapsed minReadySeconds window", placement: kind, coverage: {perm: [], unit: [TestSurgeUpdate_SourceLostBeforeTheDrainPromotesTheReplacement], kind: [], replay: [surge-source-lost-promote]}, status: decided}
  - {state: Update/Surge, event: pod.deleted, variants: [source], windows: [boundary, after], outcome: ignore, note: "a write for this row is mid-commit or has landed; the next pass re-partitions the observed pods by ordinal and recomputes from the persisted step", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: pod.deleted, variants: [target], outcome: defer, note: "the step holds at Surge and the next pass recreates the replacement at the surge ordinal once the delete expectation is observed; the source never left rotation so capacity is unaffected", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [hold-pause-then-quota]}, status: current}
  - {state: Update/Surge, event: pod.waiting, variants: [ImagePullBackOff, ErrImagePull, InvalidImageName, CreateContainerConfigError], outcome: escalate, to: Failed, guard: "the reason persists past the stuck-pod grace and the pod set is not fully serving", note: "a workload-caused reason blames the pinned surge revision - the disposition records its RetryBlock - and the Failed stamp is sticky because the surge entry stamp refuses to resurrect a Failed row at the same target", placement: perm, coverage: {perm: [], unit: [TestPatchInstanceStatusSurgingForUpdate_FailedStickyOnSameTarget], kind: [], replay: [surge-stuck]}, status: decided}
  - {state: Update/Surge, event: pod.waiting, variants: [CreateContainerError], outcome: escalate, to: Failed, note: "an ambiguous reason takes the relocation branch; once the directive excludes the node the recycle path deletes the failed non-serving replacement while the source keeps serving and the empty slot re-enters the surge", placement: perm, coverage: {perm: [], unit: [TestSurgeUpdate_RecyclesFailedCreateContainerTargetThenRetries, TestSurgeUpdate_FailedCreateContainerTargetParksWithoutRelocationAuthorization], kind: []}, status: decided}
  - {state: Update/Surge, event: pod.waiting, variants: [CrashLoopBackOff, RunContainerError], outcome: escalate, to: Failed, note: "ambiguous scope - the fault may be the revision or the node - so the disposition records a relocation directive when the budget allows and otherwise stamps the terminal Failed with no RetryBlock", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: pod.waiting, variants: [DeadlineExceeded], outcome: escalate, to: Failed, note: "a terminated container carrying the deadline reason is classified like any other ambiguous reason; the operation deadline reaches the same Failed state through its own path", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: pod.containerRestart, outcome: ignore, note: "the restart trigger reads container restarts only for a Ready Instance; below Ready only gang-member loss triggers, and a mid-flight Updating row is excluded from that too", placement: perm, coverage: {perm: [], unit: [TestSurge_PodObservationsThatHoldTheStep], kind: []}, status: decided}
  - {state: Update/Surge, event: pod.uidRotated, outcome: ignore, note: "the surge identifies pods by ordinal slot and revision-hash label, never by UID; a rotated pod at the surge ordinal is classified exactly like the one it replaced", placement: sim, coverage: {perm: [], unit: [TestReclassifyByRevisionHash_KeepsValidSurge], kind: []}, status: current}
  - {state: Update/Surge, event: pod.stuckTerminating, outcome: defer, note: "a pod wedged in Terminating at the surge ordinal still counts as occupying the slot, so the replacement is not recreated and the step holds; the update pass sweeps such pods at the top of every pass, so the wedge clears as soon as the overdue slack and node-death evidence are both satisfied, and only a pod wedged on a live node runs out the operation deadline (ops/update.go)", placement: kind, coverage: {perm: [], unit: [TestSurge_PodObservationsThatHoldTheStep], kind: []}, status: decided}
  - {state: Update/Surge, event: pod.nodeLost, outcome: defer, note: "the step holds while the replacement is unreachable; the operation deadline is the backstop and the disposition may record a relocation directive against the dead node", placement: kind, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: pod.schedulingGated, outcome: defer, note: "a gated pod is queued rather than stuck - the deadline is parked at zero and the escalation pass skips the Instance - so the surge waits without consuming its timeout", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: pod.evicted, outcome: defer, note: "an evicted replacement is recreated at the surge ordinal on the next pass; an evicted source is handled as its deletion", placement: kind, coverage: {perm: [], unit: [], kind: []}, status: current}

  - {state: Update/Surge, event: pod.unschedulable, outcome: defer, guard: 'the row is not fully serving and its operation carries no other authority''s waiting token except an operator pause, which a fact about the Instance takes the row from; the hold lasts while lifecycle.unschedulableGracePeriod is unconfigured or unelapsed, and past it the attempt is failed environment-caused', note: 'the replacement is not ContainersReady so the step holds at Phase 1, and the hold pass records the Unschedulable waiting token on the operation, which parks the shared InstanceReadyTimeout clock rather than letting it run through a wait the cluster owns. The scheduler''s message reaches LastFailure once per hold. Past the configured grace the attempt is failed with that message and no RetryBlock, and the blamed set is narrowed to the pod with no placement - a single-pod surge shares its index with the source it is replacing, so reading the source''s own container failure there would charge the target revision for a shortage of nodes', placement: kind, coverage: {perm: [], unit: [TestReconcileGatedDeadlines_ParksUnschedulableGangSurgeSource, TestEscalation_UnschedulableSurgeBlamesOnlyTheTarget, TestHoldEvidence_PausedRowRecordsTheSchedulerHold, TestHoldEvidence_PausedRowTakesNoRepairAction, TestHoldEvidence_PausedRowKeepsTheIncumbentFact], kind: [], replay: [hold-pause-then-unschedulable, hold-unschedulable-then-pause, hold-unrouted-with-unschedulable]}, status: decided}
  - {state: Update/Surge, event: pod.containersNotReady, variants: [source], outcome: ignore, note: "the surge reads only the replacement's readiness; the source going unhealthy moves the aggregate counters and lifts the fully-serving suppression in escalation.go, but drives no step", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: pod.containersNotReady, variants: [target], outcome: defer, note: "AllPodsRuntimeReady in ops/update_surge.go goes false, so the pass returns before the serving-gate write and the step stays at Surge with the source still in rotation", placement: kind, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: pod.terminating, variants: [source], outcome: ignore, note: "the ordinal partition in ops/update_surge.go keeps a deletionTimestamped pod in the drain set, so the source-lost promote is withheld until the object is gone; escalation.go meanwhile drops it from the fully-serving count", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: pod.terminating, variants: [target], outcome: defer, note: "the slot still counts as occupied so ops/update_surge.go neither recreates the replacement nor re-deletes it; the step waits for the object to disappear", placement: kind, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: pod.phaseTerminal, variants: [Failed], outcome: defer, note: "AllPodsRuntimeReady rejects a terminal pod outright, so the step holds even when the pod keeps stale ContainersReady conditions a dead kubelet never updated; the same exclusion lifts the fully-serving suppression, so the escalation is no longer covered by a serving sibling (workload/query/discover.go, workload/escalation.go)", placement: perm, coverage: {perm: [], unit: [TestSurge_PodObservationsThatHoldTheStep], kind: []}, status: decided}
  # GAP: a Succeeded or Unknown pod is terminal and will never become Ready,
  # but no reader classifies either phase.
  - {state: Update/Surge, event: pod.phaseTerminal, variants: [Succeeded, Unknown], outcome: defer, note: "neither phase is read anywhere in workload/; AllPodsRuntimeReady in ops/update_surge.go simply stays false and the step holds until the operation deadline", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: pod.admitted, outcome: ignore, note: "the step does not advance; the only write is ReconcileGatedDeadlines in deadline.go restarting the parked clock at now plus InstanceReadyTimeout, so the queued wait never counted against the surge", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: gang.podGroup, variants: [Terminating, OwnershipConflict], outcome: defer, note: "a gang-surge SOURCE is never judged on its own group - while it carries a SurgeIndex the hold pass reads an empty gang reading for it, because the replacement being built under the surge index carries the reading and the hold that matter. The top-level PodGroup pass still classifies and re-ensures the source's own name, and withholds any member it would place there, so neither state ends this row or parks its clock; the surge makes no progress on the unusable name and the operation deadline stays the bound (inferencereplica/reconciler.go)", placement: perm, coverage: {perm: [], unit: [TestEscalation_GangReadingsOnASurgeSource], kind: []}, status: decided}
  - {state: Update/Surge, event: gang.podGroup, variants: [Deleted], outcome: ignore, note: "the delete event is admitted by podGroupPredicate and EnsurePodGroups recreates the group from the plan before the dispatcher runs; the already-running gang is unaffected", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: gang.podGroup, variants: [PhaseFailed], outcome: defer, note: "the watch admits the phase change and the top-level PodGroup pass deletes the failed group and rebuilds it, with one PodGroupReset warning carrying its failure message; members it would place are withheld meanwhile. The source row is untouched - no phase change, no waiting token, no RetryBlock - and the surge it is running makes no progress on that name until the replacement group exists", placement: perm, coverage: {perm: [], unit: [TestEscalation_GangReadingsOnASurgeSource], kind: []}, status: decided}
  - {state: Update/Surge, event: gang.podGroup, variants: [Unschedulable, ScheduleTimeout], outcome: ignore, note: "neither reading exists on the PodGroup the controller watches - the vendored gang scheduler writes no Unknown phase and no ScheduleStartTime - so there is no group-level verdict to enqueue. A gang that cannot be placed arrives on its member pods instead, where the pod-level scheduler hold parks the clock (see pod.unschedulable)", placement: perm, coverage: {perm: [], unit: [TestObserveGang_SchedulingPhasesReportNothing], kind: []}, status: decided}
  - {state: Update/Surge, event: endpoint.rotationIn, variants: [source], outcome: ignore, note: "the source is in rotation by design for the whole step; its endpoint only feeds the Available counters through AvailablePodSet in status_aggregate.go", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [hold-pause-then-unrouted, hold-unrouted-then-pause]}, status: current}
  # GAP: the surge releases the source on pod conditions alone, so the
  # replacement's arrival in the routed Service is never confirmed - the
  # migration path does confirm it, through drain.IsPodInRotation.
  - {state: Update/Surge, event: endpoint.rotationIn, variants: [target], outcome: ignore, note: "ops/update_surge.go gates the drain on PodReady plus the minReadySeconds window measured from pod conditions, never on EndpointSlice membership, so this observation moves only the Available counters", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: endpoint.rotationOut, variants: [source], outcome: defer, guard: "the source has left the routed Service while the replacement is not yet promotable, so the Instance covers none of its desired capacity", note: "the EndpointSlice form of pod.servingOff[source] and decided the same way: the step holds with a SourceUnrouted waiting token on the operation, and because the fully-serving suppression keys on a source still being in rotation the stuck-pod fast path applies while the source is out", placement: perm, coverage: {perm: [], unit: [TestSourceRotation_ReportsASourceTakenOutFromUnderTheSurge], kind: [], replay: [source-unrouted-midsurge, hold-pause-then-unrouted, hold-unrouted-then-pause, hold-unrouted-with-unschedulable]}, status: decided}
  - {state: Update/Surge, event: endpoint.rotationOut, variants: [target], outcome: ignore, note: "the replacement leaving rotation is invisible to the step for the same reason rotationIn is - the gates read pod conditions - so the surge can advance to SurgeDrain and unroute the source with nothing routed", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}

  # --- Update/Surge: the replacement becoming Ready, per transition ------
  - {state: Update/Surge, event: pod.ready, variants: [target], windows: [before], outcome: defer, note: "PodReady alone does not advance the step: while the source is still in rotation the pass also waits out the minReadySeconds availability window, so it requeues and re-reads until the window elapses", placement: kind, coverage: {perm: [], unit: [TestSurgeUpdate_HoldsSourceDrainUntilReplacementPodReady, TestSurgeUpdate_HoldsSourceDrainForMinReadySeconds], kind: []}, status: decided}
  - {state: Update/Surge, event: pod.ready, variants: [target], windows: [boundary], transition: T-surge-target-ready, outcome: transition, to: Update/SurgeDrain, note: "the same pass stamps SurgeDrain and flips the source's serving gate off under the surge-drain writer key; promotion of the step waits for PodReady rather than ContainersReady", invariants: [surge.le.budget, one.operation.per.instance], placement: kind, coverage: {perm: [], unit: [TestSurgeUpdate_HoldsSourceDrainUntilReplacementPodReady], kind: []}, status: decided}
  - {state: Update/Surge, event: pod.ready, variants: [target], windows: [after], transition: T-surge-target-ready, outcome: ignore, note: "the row is on SurgeDrain; re-observing the replacement's readiness changes nothing because the availability window is consulted only at Step=Surge", placement: perm, coverage: {perm: [], unit: [TestSurgeUpdate_WindowGatesOnlyStepSurge], kind: []}, status: current}
  - {state: Update/Surge, event: pod.ready, variants: [target], windows: [boundary], transition: T-surge-abandon-superseded, outcome: transition, to: Update/SurgeDrain, note: "a replacement that is runtime-ready when the superseded-surge abandon would fire keeps the pin: the abandon guard excludes a ready replacement, so the pass falls through and finishes the cycle on the pinned revision", placement: kind, coverage: {perm: [], unit: [TestSurgeUpdate_BumpDuringBump_ConvergesToFinalRev], kind: []}, status: decided}
  - {state: Update/Surge, event: pod.ready, variants: [target], windows: [after], transition: T-surge-abandon-superseded, outcome: ignore, note: "the abandon already deleted the replacement and reset the source to Ready; a readiness event from the deleted generation is dropped", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: pod.ready, variants: [target], windows: [boundary], transition: T-surge-deadline, outcome: ignore, note: "the failed-while-serving guard skips an Instance whose live pods are all ContainersReady and in rotation, so a replacement that reached serving before the deadline write prevents the escalation and the surge advances instead", placement: kind, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: pod.ready, variants: [target], windows: [after], transition: T-surge-deadline, outcome: ignore, note: "Phase=Failed is sticky in surge: the surge entry stamp refuses to resurrect a Failed row at the same target, so a late-Ready replacement does not un-fail the Instance", placement: perm, coverage: {perm: [], unit: [TestPatchInstanceStatusSurgingForUpdate_FailedStickyOnSameTarget], kind: []}, status: decided}
  - {state: Update/Surge, event: pod.ready, variants: [target], windows: [boundary], transition: T-surge-stuck, outcome: ignore, note: "same guard as the deadline boundary - a fully serving pod set is never escalated - so a replacement that recovers into rotation before the stamp lands keeps the surge alive", placement: kind, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: pod.ready, variants: [target], windows: [after], transition: T-surge-stuck, outcome: ignore, note: "the row is Failed with the stuck reason recorded; recovery is a corrective revision or the retry gate, not a late readiness observation", placement: perm, coverage: {perm: [], unit: [TestSurgeUpdate_LateReadyReplacementDoesNotUnfailAStuckSurge], kind: []}, status: decided}
  - {state: Update/Surge, event: pod.ready, variants: [target], windows: [boundary], transition: T-surge-scaledown, outcome: defer, note: "the wave is stamping Deleting over the operation; the readiness observation is consumed by the delete wave instead of advancing the step", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: pod.ready, variants: [target], windows: [after], transition: T-surge-scaledown, outcome: ignore, note: "the row is on Delete/Drain and both ordinal slots are being drained out", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: pod.ready, variants: [target], windows: [boundary], transition: T-surge-teardown, outcome: defer, note: "teardown treats every observed index as a scale-down extra; the Delete stamp lands and the readiness observation is consumed by the delete wave", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: pod.ready, variants: [target], windows: [after], transition: T-surge-teardown, outcome: ignore, note: "the row is on Delete/Drain and its pods are being drained out", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: pod.ready, variants: [target], windows: [boundary], transition: T-surge-source-lost-promote, outcome: ignore, note: "PodReady is one half of the bar the promote that is landing already cleared, so re-observing it adds nothing to the write", placement: kind, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: pod.ready, variants: [target], windows: [after], transition: T-surge-source-lost-promote, outcome: ignore, note: "the row is Ready with ActiveOrdinal advanced, so readiness on what is now the Instance's own pod writes nothing", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}

  # --- Update/Surge: a new target revision, per transition ---------------
  - {state: Update/Surge, event: spec.revision, windows: [before], outcome: transition, to: Ready, guard: "the replacement is not yet runtime-ready", note: "an uncommitted surge is abandoned rather than retargeted - the replacement pods are deleted and the source is reset to Ready on its running revision - so the next pass re-enters through the budget and the gate; a replacement that is already runtime-ready keeps its pin and finishes the cycle", invariants: [surge.le.budget, one.operation.per.instance], placement: perm, coverage: {perm: [], unit: [TestSurgeUpdate_SupersededSurge_AbandonsAndKeepsSource, TestGangSurgeUpdate_BumpDuringBump_AbandonsSupersededSurge], kind: [], replay: [surge-abandon-superseded]}, status: decided}
  - {state: Update/Surge, event: spec.revision, windows: [boundary], transition: T-surge-target-ready, outcome: ignore, note: "a superseded edit arriving as the replacement goes Ready does not abandon anything: the abandon guard excludes a runtime-ready replacement, the cycle promotes on the pinned revision, and the newer target rolls afterwards because RunningRevision then differs from it", placement: kind, coverage: {perm: [], unit: [TestSurgeUpdate_BumpDuringBump_ConvergesToFinalRev, TestGangSurgeUpdate_BumpDuringBump_PromotesPinnedRev], kind: []}, status: decided}
  - {state: Update/Surge, event: spec.revision, windows: [after], transition: T-surge-target-ready, outcome: defer, note: "the row is on SurgeDrain, past the point of no return; the drain finishes on the pinned revision and the newer target rolls from Ready", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [revert-midsurge-ready-replacement]}, status: decided}
  - {state: Update/Surge, event: spec.revision, windows: [boundary], transition: T-surge-abandon-superseded, outcome: transition, to: Ready, note: "the abandon is the write this edit drives; the replacement pods are deleted first and the reset to Ready lands on the pass that observes them gone", placement: perm, coverage: {perm: [], unit: [TestSurgeUpdate_SupersededSurge_AbandonsAndKeepsSource], kind: []}, status: decided}
  - {state: Update/Surge, event: spec.revision, windows: [after], transition: T-surge-abandon-superseded, outcome: ignore, note: "the row is Ready on its running revision; the trigger re-fires from there toward whatever the desired state now asks for", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: spec.revision, windows: [boundary], transition: T-surge-deadline, outcome: defer, note: "the escalation stamp is mid-commit; the corrective edit is not lost because a Failed surge drops its pin and re-commits to the current target on a later pass", placement: perm, coverage: {perm: [], unit: [TestEscalation_CorrectiveRevisionDoesNotRideTheFailingSurge], kind: []}, status: decided}
  - {state: Update/Surge, event: spec.revision, windows: [after], transition: T-surge-deadline, outcome: defer, note: "the row is Failed; the corrective revision is a different RetryBlock subject and the Failed row owns the decision to re-drive the surge", placement: perm, coverage: {perm: [], unit: [TestEscalation_CorrectiveRevisionDoesNotRideTheFailingSurge], kind: []}, status: decided}
  - {state: Update/Surge, event: spec.revision, windows: [boundary], transition: T-surge-stuck, outcome: defer, note: "same race as the deadline boundary: the stuck stamp lands and the corrective revision is consumed from Failed", placement: perm, coverage: {perm: [], unit: [TestEscalation_CorrectiveRevisionDoesNotRideTheFailingSurge], kind: []}, status: decided}
  - {state: Update/Surge, event: spec.revision, windows: [after], transition: T-surge-stuck, outcome: defer, note: "the row is Failed with the stuck reason held against the pinned revision; a corrective revision passes the gate as a different subject", placement: perm, coverage: {perm: [], unit: [TestEscalation_CorrectiveRevisionDoesNotRideTheFailingSurge], kind: []}, status: decided}
  - {state: Update/Surge, event: spec.revision, windows: [boundary], transition: T-surge-scaledown, outcome: ignore, note: "the index is leaving the plan, so the update pass stops selecting it and the newer target is decided for the surviving indices only", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: spec.revision, windows: [after], transition: T-surge-scaledown, outcome: ignore, note: "the row is on Delete/Drain; no revision edit reaches a deleting index", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: spec.revision, windows: [boundary], transition: T-surge-teardown, outcome: ignore, note: "the owner is being deleted; a revision edit no longer selects any work", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: spec.revision, windows: [after], transition: T-surge-teardown, outcome: ignore, note: "the row is on Delete/Drain and the update pass no longer selects it", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
  - {state: Update/Surge, event: spec.revision, windows: [boundary], transition: T-surge-source-lost-promote, outcome: ignore, note: "the abandon guard excludes a runtime-ready replacement, so the promote lands on the pinned revision rather than unwinding for the newer target", placement: perm, coverage: {perm: [], unit: [], kind: []}, status: current}
