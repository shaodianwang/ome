# Cells for the SurgeThenDrain source states: Update/Surge and
# Update/SurgeDrain. The replacement generation of
# a gang surge carries its own states in another file; a single-pod surge
# keeps the source and its replacement on one Instance index, so both pod
# variants are meaningful in every state here.
#
# Outcome convention used throughout this file:
#   ignore  the observation changes no persisted field; the pass may still
#           re-assert an idempotent write such as a serving gate or a step
#           stamp.
#   defer   the step holds: the pass declines to progress, requeues, and
#           re-derives its next action from the persisted step and the live
#           pod set.
# A cell that names a transition covers only that transition's boundary or
# after key; the before key of the same row is a separate cell.
#
# Source pods disappearing before the drain step skip the whole drain block
# (T-surge-source-lost-promote), but not the promote bar: every path stamps
# Ready only once the replacement is PodReady and its minReadySeconds window
# has elapsed.
#
# The strategy is pinned for the life of an operation, so an in-flight surge
# is never unwound by a strategy edit; the edit reaches the Instance at its
# next admitted attempt.
#
# The escalation fast path applies to every transient phase that holds an
# in-flight operation, so a wedged pod fails the Instance from both states
# here: T-surge-stuck and T-surgedrain-stuck.
cells:
  # --- Update/Surge: pod observations -----------------------------------
  - {state: Update/Surge, event: pod.scheduled, variants: [source], outcome: ignore, note: "the surge reads the source by its ordinal label, its serving gate and its rotation, never by its binding, so a re-observed binding writes nothing", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [surge-source-observations-ignored]}, status: decided}
  - {state: Update/Surge, event: pod.scheduled, variants: [target], outcome: ignore, note: "a binding advances nothing: the step waits for ContainersReady on the replacement; the one write a binding can cause is the scheduler hold releasing its token, which restarts the parked deadline clock", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [hold-unschedulable-then-pause]}, status: decided}
  - {state: Update/Surge, event: pod.containersReady, variants: [source], outcome: ignore, note: "the source's own readiness gates nothing at this step; it is read only by the failed-target recycle, which requires Phase=Failed", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [surge-source-observations-ignored]}, status: decided}
  - {state: Update/Surge, event: pod.containersReady, variants: [target], outcome: ignore, note: "ContainersReady only permits writing the replacement's serving gate, which a pass an open repair on another Instance consumes still writes; the step stays Surge until PodReady and the availability window, per ops/update_surge.go", placement: kind, coverage: {perm: [], unit: [TestSurgeUpdate_Phase1WaitsForSurgeReady, TestSurgeUpdate_HoldsSourceDrainUntilReplacementPodReady, TestReconcile_RepairInFlight_UpdateAttemptsInFlightAdvance, TestRepairWaitingOnPlacement_UpdateInFlightKeepsAdvancing], kind: [], replay: [surge-beside-repair-drains-under-unavailable-budget]}, status: decided}
  - {state: Update/Surge, event: pod.ready, variants: [source], outcome: ignore, note: "the source is expected to stay Ready and in rotation for the whole step, so its readiness drives no write", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [surge-source-observations-ignored]}, status: decided}
  - {state: Update/Surge, event: pod.servingOn, variants: [source], outcome: ignore, note: "the source is in rotation by design until the step advances to SurgeDrain, so its gate reporting on is the expected state and writes nothing", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [surge-source-observations-ignored]}, status: decided}
  - {state: Update/Surge, event: pod.servingOn, variants: [target], outcome: ignore, note: "this is the gate the pass itself wrote once the replacement reported ContainersReady; PodReady plus the availability window is what the step waits on, so the gate alone advances nothing", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [surge-target-gate-flaps-before-window]}, status: decided}
  - {state: Update/Surge, event: pod.servingOff, variants: [source], outcome: defer, guard: "the source is out of rotation while the replacement is not yet promotable, so the Instance covers none of its desired capacity", note: "a source unrouted by a foreign writer holds the step visibly: the operation carries a SourceUnrouted waiting token so the outage is reported rather than silent. The fully-serving suppression keys on a source pod still being in rotation, not on old pods merely existing, so it lifts here and the stuck-pod fast path can end the attempt well before the operation deadline", placement: perm, coverage: {perm: [], unit: [TestSourceRotation_ReportsASourceTakenOutFromUnderTheSurge], kind: []}, status: decided}
  - {state: Update/Surge, event: pod.servingOff, variants: [target], outcome: ignore, note: "the pass re-asserts the lifecycle serving gate on every replacement that is ContainersReady, so a gate dropped by another writer is repaired on the next pass and the step is unchanged", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [surge-target-gate-flaps-before-window]}, status: decided}
  - {state: Update/Surge, event: pod.deleted, variants: [source], windows: [before], outcome: transition, to: Ready, guard: "single-pod source; a gang source instead stamps SurgeDrain and has its row removed once the replacement is promoted", note: "restart does not claim the loss - the trigger is suppressed for every non-Ready phase - and the drain block is skipped entirely when no source pod remains, so the replacement is promoted on the pinned revision as soon as it clears the shared promote bar of PodReady plus the elapsed minReadySeconds window", placement: kind, coverage: {perm: [], unit: [TestSurgeUpdate_SourceLostBeforeTheDrainPromotesTheReplacement], kind: [], replay: [surge-source-lost-promote]}, status: decided}
  - {state: Update/Surge, event: pod.deleted, variants: [source], windows: [boundary, after], outcome: ignore, note: "a write for this row is mid-commit or has landed; the next pass re-partitions the observed pods by ordinal and recomputes from the persisted step, so the re-observed loss writes nothing of its own", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [surge-scaledown-crash]}, status: decided}
  - {state: Update/Surge, event: pod.deleted, variants: [target], outcome: defer, note: "the step holds at Surge and the next pass recreates the replacement at the surge ordinal once the delete expectation is observed; the source never left rotation, so capacity is unaffected", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [hold-pause-then-quota, surge-replacement-terminating-then-lost]}, status: decided}
  - {state: Update/Surge, event: pod.waiting, variants: [ImagePullBackOff, ErrImagePull, InvalidImageName, CreateContainerConfigError], outcome: escalate, to: Failed, guard: "the reason persists past the stuck-pod grace and the pod set is not fully serving", note: "a workload-caused reason blames the pinned surge revision - the disposition records its RetryBlock - and the Failed stamp is sticky because the surge entry stamp refuses to resurrect a Failed row at the same target", placement: perm, coverage: {perm: [], unit: [TestPatchInstanceStatusSurgingForUpdate_FailedStickyOnSameTarget], kind: [], replay: [surge-stuck]}, status: decided}
  - {state: Update/Surge, event: pod.waiting, variants: [CreateContainerError], outcome: escalate, to: Failed, note: "an ambiguous reason takes the relocation branch; once the directive excludes the node the recycle path deletes the failed non-serving replacement while the source keeps serving and the empty slot re-enters the surge", placement: perm, coverage: {perm: [], unit: [TestSurgeUpdate_RecyclesFailedCreateContainerTargetThenRetries, TestSurgeUpdate_FailedCreateContainerTargetParksWithoutRelocationAuthorization], kind: []}, status: decided}
  - {state: Update/Surge, event: pod.waiting, variants: [CrashLoopBackOff, RunContainerError], outcome: escalate, to: Failed, guard: "the wedged pod carries the pinned surge revision; the source it replaces is read by no stuck check of this attempt", note: "ambiguous scope - the fault may be the revision or the node - so the disposition records a relocation directive when the budget allows and the target revision has served on some Instance (a sibling promoted on it, or this Instance before the attempt) and whose retry block is not Held - a revision the ladder has Held is the failure itself, so no node is blamed, no exclusion is recorded and the attempt ends terminal with the Held block left as it is; a revision nobody serves is its own suspect and earns no directive, under either face of the crash loop; otherwise the attempt is terminal and counts on the target revision's RetryBlock toward lifecycle.updateRetry.maxAttempts like any failed attempt (Backoff on the ladder, Held at the bound with the RetryHeld warning, the rolloutHold naming the crash loop; a new revision or the release annotation reopens it), and with no updateRetry configured it stamps Failed with no RetryBlock and the same attempt is re-opened on the next pass. One wave counts once: a wave the relocation directive claimed is not counted on the block, a scheduler hold is never counted, and a replacement on another revision charges nothing. The source keeps serving throughout. A source crash-looping on the prior revision is the wedge this roll corrects, never its failure: the attempt is judged on the pods carrying its own revision (evidence.AttemptStuckPods), so a corrective surge over a broken source proceeds", placement: kind, coverage: {perm: [], unit: [TestEscalateStuckPodFailures_UpdateAttemptIgnoresTheWedgedSource, TestCrashLoopBound_NewRevisionCrashesAtStart, TestCrashLoopBound_NewRevisionCrashesAfterReady, TestCrashLoopBound_PeersKeepServingWhileTheTargetIsRetried, TestCrashLoopBound_NoRetryPolicyKeepsRetrying, TestDispose_Terminal_WaveCountsOnTheLadder, TestDispose_RelocationDirective_DoesNotCountOnTheLadder, TestDispose_HeldRevisionBlamesNoNode], kind: [crashloop_new_revision_bound], replay: [surge-target-stuck-relocates, surge-target-stuck-unserved, ready-crashloop-retarget-surge, surge-crashloop-bound, ladder-backoff-survives-sibling-restamps]}, status: decided}
  - {state: Update/Surge, event: pod.waiting, variants: [DeadlineExceeded], outcome: ignore, note: "DeadlineExceeded is outside the terminal waiting set the stuck-pod classifier reads, so a replacement reporting it is no escalation evidence however long it stands; the attempt waits, and the operation deadline is its exit", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [surge-replacement-deadline-exceeded-reason-waits]}, status: decided}
  - {state: Update/Surge, event: pod.containerRestart, outcome: ignore, note: "the restart trigger reads container restarts only for a Ready Instance; below Ready only gang-member loss triggers, and a mid-flight Updating row is excluded from that too", placement: perm, coverage: {perm: [], unit: [TestSurge_PodObservationsThatHoldTheStep], kind: []}, status: decided}
  - {state: Update/Surge, event: pod.uidRotated, outcome: ignore, note: "the surge identifies pods by ordinal slot and revision-hash label, never by UID, so a rotated pod at the surge ordinal is classified exactly like the one it replaced and the step reads it as before", placement: sim, coverage: {perm: [], unit: [TestReclassifyByRevisionHash_KeepsValidSurge], kind: []}, status: decided}
  - {state: Update/Surge, event: pod.stuckTerminating, outcome: defer, note: "a pod wedged in Terminating at the surge ordinal still counts as occupying the slot, so the replacement is not recreated and the step holds; the update pass sweeps such pods at the top of every pass, so the wedge clears as soon as the overdue slack and node-death evidence are both satisfied, and only a pod wedged on a live node runs out the operation deadline (ops/update.go)", placement: kind, coverage: {perm: [], unit: [TestSurge_PodObservationsThatHoldTheStep], kind: []}, status: decided}
  - {state: Update/Surge, event: pod.nodeLost, outcome: defer, note: "a replacement whose kubelet has stopped reporting is not dead evidence: its name is held rather than recycled, the NodeUnknown hold parks the deadline and the source serves on; the force-delete sweep frees the name on proven node death under a configured policy and the same attempt rebuilds the replacement", placement: kind, coverage: {perm: [], unit: [], kind: [], replay: [surge-target-node-unreachable]}, status: decided}
  - {state: Update/Surge, event: pod.schedulingGated, outcome: defer, note: "a gated pod is queued rather than stuck: the deadline is parked at zero and the escalation pass skips the Instance, so the surge waits without consuming its timeout", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [surge-target-queued]}, status: decided}
  - {state: Update/Surge, event: pod.evicted, outcome: transition, to: Update/Surge, guard: "the evicted pod holds the surge target name, the operation deadline has not elapsed, and the row's outstanding expectations are satisfied; an evicted source is handled as its deletion", note: "an eviction leaves the replacement Failed, which is as terminal as any exit, so the attempt replaces it at once: the shared terminal recycle deletes the occupant with the expectation recorded first and the Evicted reason lifted onto LastFailure, the source keeps serving, and the replacement is created again at the surge ordinal once the delete is observed; a re-observed eviction lands on the same row and is paced by the ladder or satisfied by the delete already in flight", placement: unit, coverage: {perm: [], unit: [TestSurge_TerminalReplacementIsRecycled], kind: [], replay: [surge-target-evicted]}, status: decided}

  - {state: Update/Surge, event: pod.unschedulable, outcome: defer, guard: 'the row is not fully serving and its operation carries no other authority''s waiting token except an operator pause, which a fact about the Instance takes the row from; the hold lasts while lifecycle.unschedulableGracePeriod is unconfigured or unelapsed, and past it the attempt is failed environment-caused', note: 'the replacement is not ContainersReady so the step holds at Phase 1, and the hold pass records the Unschedulable waiting token on the operation, which parks the shared InstanceReadyTimeout clock rather than letting it run through a wait the cluster owns. The scheduler''s message reaches LastFailure once per hold. Past the configured grace the attempt is failed with that message and no RetryBlock, and the blamed set is narrowed to the pod with no placement - a single-pod surge shares its index with the source it is replacing, so reading the source''s own container failure there would charge the target revision for a shortage of nodes. When the rebuild carried node exclusions for its revision, the grace also releases them, since the scheduler''s verdict says no other node had room, so the next rebuild may land on the blamed node again (one Normal NodeExclusionReleased event; the relocation budget the directives spent stays spent).', placement: kind, coverage: {perm: [], unit: [TestReconcileGatedDeadlines_ParksUnschedulableGangSurgeSource, TestEscalation_UnschedulableSurgeBlamesOnlyTheTarget, TestHoldEvidence_PausedRowRecordsTheSchedulerHold, TestHoldEvidence_PausedRowTakesNoRepairAction, TestHoldEvidence_PausedRowKeepsTheIncumbentFact], kind: [], replay: [surge-target-relocation-released, hold-pause-then-unschedulable, hold-unschedulable-then-pause, hold-unrouted-with-unschedulable]}, status: decided}
  - {state: Update/Surge, event: pod.containersNotReady, variants: [source], outcome: ignore, note: "the surge reads only the replacement's readiness; the source going unhealthy moves the aggregate counters and lifts the fully-serving suppression in the escalation pass, but drives no step", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [surge-source-and-knob-signals]}, status: decided}
  - {state: Update/Surge, event: pod.containersNotReady, variants: [target], outcome: defer, note: "the runtime-ready bar over the replacement goes false, so the pass returns before the serving-gate write and the step stays at Surge with the source still in rotation", placement: kind, coverage: {perm: [], unit: [], kind: [], replay: [surge-target-readiness-regressed]}, status: decided}
  - {state: Update/Surge, event: pod.terminating, variants: [source], outcome: defer, note: "a source on its way out reads as out of rotation (a deletionTimestamped pod is neither serving nor routable), so the step holds with the SourceUnrouted waiting token and LastFailure naming it, as for pod.servingOff[source]; the ordinal partition keeps the pod in the source set, so the source-lost promote waits for the object to be gone", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [surge-source-terminating-holds-step]}, status: decided}
  - {state: Update/Surge, event: pod.terminating, variants: [target], outcome: defer, note: "a replacement being deleted is gone for the promote whatever its readiness says - the kubelet keeps a terminating container answering its probe while the pod is already out of its Service - so the shared promote readings in workload/query/discover.go leave it out of the set they judge and the source stays in rotation; the slot still counts as occupied, so ops/update_surge.go neither recreates the replacement nor re-deletes it, and the step waits for the object to disappear", placement: unit, coverage: {perm: [], unit: [TestSurge_PodObservationsThatHoldTheStep], kind: [], replay: [surge-replacement-terminating-then-lost]}, status: decided}
  - {state: Update/Surge, event: pod.phaseTerminal, variants: [Failed, Succeeded], windows: [before], outcome: transition, to: Update/Surge, guard: "the replacement at the surge ordinal is in a terminal phase, the operation deadline has not elapsed, and the row's outstanding expectations are satisfied", note: "a dead replacement can never clear the promote bar, so the attempt replaces it at once instead of polling it to the operation deadline: the shared terminal recycle deletes the occupant with the expectation recorded first and the exit captured onto LastFailure, counted on the attempt and paced inside it by the same-target retry ladder; the source keeps serving at the active ordinal and the replacement is created again at the surge ordinal once the delete is observed (pkg/controller/v1beta1/workload/ops/update_surge.go, pkg/controller/v1beta1/workload/ops/terminal_recycle.go)", placement: unit, coverage: {perm: [], unit: [TestSurge_TerminalReplacementIsRecycled], kind: [], replay: [surge-replacement-terminal, surge-replacement-succeeded-holds]}, status: decided}
  - {state: Update/Surge, event: pod.phaseTerminal, variants: [Failed, Succeeded], windows: [boundary, after], outcome: defer, note: "the recycle is a pod delete that leaves phase and step where they are, so a re-observed terminal phase lands on the same row and is either paced by the ladder or satisfied by the delete already in flight", placement: unit, coverage: {perm: [], unit: [TestUpdateAttempt_TerminalPodReobservedKeepsPhaseAndStep], kind: []}, status: decided}
  - state: Update/Surge
    event: pod.phaseTerminal
    variants: [Unknown]
    outcome: defer
    guard: node death is proven - the Node object is gone, or has carried an unreachable taint or a NotReady condition past the threshold - and a force-delete policy is configured; with neither, the row holds instead of acting
    note: a replacement the kubelet will never report again is not recycled by name, because the node has stopped reporting rather than the pod having died and a returning kubelet may still be running it. The surge step routes it to the force-delete sweep, the same authority pod.nodeLost answers to, which deletes it only on proven node death under a configured force-delete policy, and the same attempt rebuilds the replacement at the surge ordinal on the pass that observes it gone; the source at the active ordinal is never touched and stays in rotation throughout. Without a policy nothing frees the name, so the hold pass records the NodeUnknown token on the row - the surge ordinal is one of the names the hold reads - with the deadline parked, the visible wait a Create row reports for the same pod
    placement: unit
    coverage: {perm: [], unit: [TestSurgeUpdate_UnknownTargetSweptOnProvenNodeDeath, TestSurgeUpdate_UnknownTargetHeldWithoutForceDeletePolicy, TestNodeUnknown_HoldsTheSurgeOrdinalOfASinglePodRow], kind: [], replay: [surge-target-unknown-swept, surge-target-unknown-held]}
    status: decided
  - {state: Update/Surge, event: pod.admitted, outcome: ignore, note: "the step does not advance; the only write is the gated-deadline reconcile restarting the parked clock at now plus InstanceReadyTimeout, so the queued wait never counts against the surge", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [surge-target-queued]}, status: decided}
  - {state: Update/Surge, event: gang.podGroup, variants: [Terminating, OwnershipConflict], outcome: defer, note: "a gang-surge SOURCE is never judged on its own group - while it carries a SurgeIndex the hold pass reads an empty gang reading for it, because the replacement being built under the surge index carries the reading and the hold that matter. The top-level PodGroup pass still classifies and re-ensures the source's own name, and withholds any member it would place there, so neither state ends this row or parks its clock; the surge makes no progress on the unusable name and the operation deadline stays the bound (inferencereplica/reconciler.go)", placement: perm, coverage: {perm: [], unit: [TestEscalation_GangReadingsOnASurgeSource], kind: []}, status: decided}
  - {state: Update/Surge, event: gang.podGroup, variants: [Deleted], outcome: ignore, note: the delete is admitted by the PodGroup watch and the PodGroup pass recreates the group from the plan before the dispatcher runs; the already-running gang and the surge are unaffected, placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [surge-gang-source-podgroup-deleted]}, status: decided}
  - {state: Update/Surge, event: gang.podGroup, variants: [PhaseFailed], outcome: defer, note: "the watch admits the phase change and the top-level PodGroup pass deletes the failed group and rebuilds it, with one PodGroupReset warning carrying its failure message; members it would place are withheld meanwhile. The source row is untouched - no phase change, no waiting token, no RetryBlock - and the surge it is running makes no progress on that name until the replacement group exists", placement: perm, coverage: {perm: [], unit: [TestEscalation_GangReadingsOnASurgeSource], kind: []}, status: decided}
  - {state: Update/Surge, event: gang.podGroup, variants: [Unschedulable, ScheduleTimeout], outcome: ignore, note: "neither reading exists on the PodGroup the controller watches - the vendored gang scheduler writes no Unknown phase and no ScheduleStartTime - so there is no group-level verdict to enqueue. A gang that cannot be placed arrives on its member pods instead, where the pod-level scheduler hold parks the clock (see pod.unschedulable)", placement: perm, coverage: {perm: [], unit: [TestObserveGang_SchedulingPhasesReportNothing], kind: []}, status: decided}
  - {state: Update/Surge, event: endpoint.rotationIn, variants: [source], outcome: ignore, note: "the source is in rotation by design for the whole step; a source back in the routed Service releases the SourceUnrouted token if one was recorded, and otherwise its endpoint only feeds the Available counters", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [hold-pause-then-unrouted, hold-unrouted-then-pause]}, status: decided}
  # GAP: the surge releases the source on pod conditions alone, so the
  # replacement's arrival in the routed Service is never confirmed - the
  # migration path does confirm it, through drain.IsPodInRotation.
  - {state: Update/Surge, event: endpoint.rotationIn, variants: [target], outcome: ignore, note: "the drain is gated on PodReady plus the minReadySeconds window measured from pod conditions, never on EndpointSlice membership, so this observation moves only the Available counters", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [surge-source-and-knob-signals]}, status: decided}
  - {state: Update/Surge, event: endpoint.rotationOut, variants: [source], outcome: defer, guard: "the source has left the routed Service while the replacement is not yet promotable, so the Instance covers none of its desired capacity", note: "the EndpointSlice form of pod.servingOff[source] and decided the same way: the step holds with a SourceUnrouted waiting token on the operation, and because the fully-serving suppression keys on a source still being in rotation the stuck-pod fast path applies while the source is out", placement: perm, coverage: {perm: [], unit: [TestSourceRotation_ReportsASourceTakenOutFromUnderTheSurge], kind: [], replay: [source-unrouted-midsurge, hold-pause-then-unrouted, hold-unrouted-then-pause, hold-unrouted-with-unschedulable]}, status: decided}
  - {state: Update/Surge, event: endpoint.rotationOut, variants: [target], outcome: ignore, note: "today the step gates the drain on pod conditions alone, so a replacement that left the routed Service does not hold the surge and the source can be unrouted with nothing routed, which is wrong because the no-downtime invariant wants the replacement confirmed in rotation before the source leaves it, as the migration path confirms through drain.IsPodInRotation", placement: perm, coverage: {perm: [], unit: [], kind: [], replay: [surge-target-gate-flaps-before-window]}, status: decided}

  # --- Update/Surge: the replacement becoming Ready, per transition ------
  - {state: Update/Surge, event: pod.ready, variants: [target], windows: [before], outcome: defer, note: "PodReady alone does not advance the step: while the source is still in rotation the pass also waits out the minReadySeconds availability window, so it requeues and re-reads until the window elapses", placement: kind, coverage: {perm: [], unit: [TestSurgeUpdate_HoldsSourceDrainUntilReplacementPodReady, TestSurgeUpdate_HoldsSourceDrainForMinReadySeconds], kind: []}, status: decided}
  - {state: Update/Surge, event: pod.ready, variants: [target], windows: [boundary], transition: T-surge-target-ready, outcome: transition, to: Update/SurgeDrain, note: "the same pass stamps SurgeDrain and flips the source's serving gate off under the surge-drain writer key; promotion of the step waits for PodReady rather than ContainersReady. The step is taken on a pass an open repair on another Instance consumes as well: an attempt in flight advances beside a repair, under the same drain gate and floor a full pass applies", invariants: [surge.le.budget, one.operation.per.instance], placement: kind, coverage: {perm: [], unit: [TestSurgeUpdate_HoldsSourceDrainUntilReplacementPodReady, TestReconcile_RepairInFlight_UpdateAttemptsInFlightAdvance], kind: [], replay: [surge-beside-repair-drains-under-unavailable-budget]}, status: decided}
  - {state: Update/Surge, event: pod.ready, variants: [target], windows: [after], transition: T-surge-target-ready, outcome: ignore, note: "the row is on SurgeDrain; re-observing the replacement's readiness changes nothing because the availability window is consulted only at Step=Surge and the drain reads the source's convergence", placement: perm, coverage: {perm: [], unit: [TestSurgeUpdate_WindowGatesOnlyStepSurge], kind: []}, status: decided}
  - {state: Update/Surge, event: pod.ready, variants: [target], windows: [boundary], transition: T-surge-abandon-superseded, outcome: ignore, note: "readiness arriving as the superseded-surge abandon fires changes nothing: while the source stands the replacement is abandoned whether or not it is runtime-ready; a replacement in rotation leaves it a pass ahead of its deletion, and the reset to Ready lands on the pass that observes it gone", placement: kind, coverage: {perm: [], unit: [TestSurgeUpdate_WithdrawnTargetAbandonsReadyReplacement], kind: []}, status: decided}
  - state: Update/Surge
    event: gate.deny
    variants: [Pairing]
    outcome: defer
    note: "the pairing drain gate runs when the replacement is past the promote bar and the source would leave rotation: a denial keeps the source serving at Step=Surge, records a RolloutHold with gate Pairing on the InferenceReplica, and requeues; the source leaves rotation on the first pass the gate admits. Every other gate but the per-Component floor is consulted only before a fresh dispatch"
    placement: kind
    coverage:
      perm: [p1817, p1818, p1819]
      unit: [TestSurgeUpdate_DrainGateHoldsTheSourceUntilAllowed, TestGangSurgeUpdate_DrainGateHoldsTheSourceGang]
      kind: ["1x1 surge transition keeps the old pair serving until the new cohort serves on both sides"]
    status: decided
  - state: Update/Surge
    event: gate.deny
    variants: [Budget]
    outcome: defer
    note: "the per-Component floor withholds the drain: while the Instances already on the target revision that do not serve it - promoted Instances whose pods crash-loop or whose runner restarted since Ready - exceed the unavailability budget, the Component is below its floor and no source leaves rotation, single-pod or gang. The replacement keeps serving beside its source at Step=Surge, the Budget hold names those Instances and the revision, and the source leaves rotation on the first pass the floor holds again; a replacement that then crash-loops itself is disposed on the ladder like any failed attempt. The floor is read where the pairing drain gate is, at Step=Surge only. An Instance on the target short of serving by dark pods alone - promoted pods that served and have failed readiness for the stuck-pod grace, none restarted since Ready - is not counted toward the floor: nothing those pods do lifts the shortfall and no policy rebuilds them, so the source leaves rotation past it (ops/update.go RolledInstanceDark); inside the grace it is counted and the pass wakes for the grace left"
    placement: unit
    coverage:
      perm: [p5959, p5961, p5965]
      unit: [TestCrashAfterPromotion_RollHoldsAtTheBudget, TestReconcile_HealedRunnerStopsHoldingTheFloor, TestRunnerKilledTwiceAfterPromotion_ServesTheWindowAndTheRollResumes, TestReconcile_DarkRolledInstanceHoldsNoFloor, TestReconcile_RollOverADarkInstanceOnTheTarget_ReachesItsEndAndTheRollbackLands]
      kind: []
    status: decided
  - {state: Update/Surge, event: pod.ready, variants: [target], windows: [after], transition: T-surge-abandon-superseded, outcome: n/a, reason: "the reset to Ready lands only on a pass that observes the surge ordinal empty - a single-pod abandon deletes the replacement and resets on the pass that finds it gone, a gang abandon finalizes the retired replacement before the source is reset - so no replacement remains to report readiness once the row is Ready, and the Ready state declares pod.ready[target] n/a for the same reason", status: decided}
