# Cells for Open: a run is pinned by a fresh open. Executors read the plan
# through the pin; the run layer re-judges the pin on every pass against
# the live replica revision pairs (retarget, close) and the canary unit's
# persisted record and phase (rolled back, completed), and reports edits
# as drift (rolloutrun.go reconcile, retargeted, closedOutcome, updateDrift).
cells:
  - state: Open
    event: spec.revision
    variants: [new]
    windows: [before]
    outcome: transition
    to: Open
    guard: "a pinned member's observed target moved off its pinned revision to a hash that is not its unit's rejected one, every replica is fresh, and the plan composes"
    note: "the pinned run closes Superseded and a fresh run opens in the same pass under a new RunID; a member that moved carries its pinned stable revision forward, a member still on its pinned revision is on its stable, and a canary unit whose targets moved is reset by BindRun to step zero. A plan that no longer composes parks instead after the Superseded close (T-open-retarget-park)"
    invariants: [one.active.run, decision.reads.live.replicas]
    placement: unit
    coverage: {perm: [], unit: [TestRetargetClosesSupersededAndReopens, TestRetargetDoesNotGuessMissingStableRevision, TestRetargetKeepsUnmovedComponentStableKnown], kind: [canary_retarget_rollback_kind_test.go], replay: [stale-read-misses-close]}
    status: decided
  - state: Open
    event: spec.revision
    variants: [new]
    windows: [boundary, after]
    outcome: ignore
    note: "the superseding pin is in memory from one live read; a target that moves again is the next pass's retarget against that pin"
    placement: unit
    coverage: {perm: [], unit: [TestATargetThatMovesAfterTheReadIsTheNextPassesRetarget/Open], kind: []}
    status: decided
  - state: Open
    event: spec.revision
    variants: [revert]
    windows: [before]
    outcome: transition
    to: Open
    guard: "the target returned to the revision the member's Instances run while some still trail it"
    note: "a revert is a retarget like any other: the run closes Superseded and a fresh run opens toward the restored revision so the plan gate admits the trailing Instances' roll back; when nothing trails and no unit is mid-ladder the close is not followed by an open and the service reads Closed (T-open-revert-settle)"
    invariants: [one.active.run]
    placement: unit
    coverage: {perm: [], unit: [TestRevertMidSurgeKeepsOneRunOpen, TestRevertAtTheLastInPlaceInstanceClosesTheRunSuperseded], kind: [cancel_midrollout_kind_test.go]}
    status: decided
  - state: Open
    event: spec.revision
    variants: [revert]
    windows: [boundary, after]
    outcome: ignore
    note: "the revert was read once against the pin; the fresh run or the settled close is what the next pass finds"
    placement: unit
    coverage: {perm: [], unit: [TestAPinnedRunRetargetsAndTheNextPassFindsTheFreshPin/Open/revert], kind: []}
    status: decided
  - state: Open
    event: spec.revision
    variants: [rejected]
    outcome: ignore
    note: "a target that lands on its unit's rejected revision is a hold, not a retarget: the retarget check skips it and the run continues on its pin; the plan gate keeps that member's Instances on the stable revision"
    invariants: [rejected.target.is.a.hold]
    placement: unit
    coverage: {perm: [], unit: [TestATargetOnItsUnitsRejectedRevisionIsAHoldUnderAPinnedRun/Open], kind: []}
    status: decided
  - state: Open
    event: spec.planEdit
    variants: [inlineBody]
    outcome: ignore
    note: "the pinned plan continues; RolloutPlanDrift reads True with reason SpecNewerThanRun until the next open or an applied repin"
    invariants: [plan.executes.only.pinned]
    placement: unit
    coverage: {perm: [], unit: [TestMidRunEditIsInertWithDrift], kind: [], replay: [repin-consumed-before-failed-flush]}
    status: decided
  - state: Open
    event: spec.planEdit
    variants: [groupShape]
    outcome: ignore
    note: "the pinned plan continues under RolloutPlanDrift SpecNewerThanRun; a canary group that left the spec gets a RolloutGroupRemovedMidRun warning, since deleting a group never aborts a pinned run"
    invariants: [plan.executes.only.pinned]
    placement: unit
    coverage: {perm: [], unit: ["TestAPinnedRunContinuesOnItsPin/Open/spec.planEdit[groupShape]"], kind: []}
    status: decided
  - state: Open
    event: spec.planEdit
    variants: [allGroupsRemoved]
    outcome: ignore
    note: "the pinned plan continues under RolloutPlanDrift SpecNewerThanRun with a RolloutGroupRemovedMidRun warning and a ten-second requeue; with no spec groups the pass never reaches the convergence check, so only the rollback verb or a repin to the empty plan ends this run"
    invariants: [plan.executes.only.pinned]
    placement: unit
    coverage: {perm: [], unit: ["TestAPinnedRunContinuesOnItsPin/Open/spec.planEdit[allGroupsRemoved]"], kind: []}
    status: decided
  - state: Open
    event: policy.changed
    outcome: ignore
    note: "the pinned body keeps executing; RolloutPlanDrift reads True with reason PolicyNewerThanRun and the next open composes the new body from a live read"
    invariants: [plan.executes.only.pinned]
    placement: kind
    coverage: {perm: [], unit: [], kind: [rolloutpolicy_run_kind_test.go]}
    status: decided
  - state: Open
    event: policy.unresolved
    outcome: ignore
    note: "a reference that stops resolving mid-run does not park a pinned run: the live digest reads unresolvable, RolloutPlanDrift reads True, and the pin keeps executing"
    invariants: [plan.executes.only.pinned]
    placement: unit
    coverage: {perm: [], unit: [TestAPinnedRunReportsPolicyDriftAndKeepsExecuting/Open], kind: []}
    status: decided
  - state: Open
    event: policy.resolved
    outcome: ignore
    note: "RolloutPlanDrift returns to InSync when the live digest equals the pinned one again"
    placement: unit
    coverage: {perm: [], unit: [TestAPinnedRunReportsPolicyDriftAndKeepsExecuting/Open], kind: []}
    status: decided
  - state: Open
    event: ir.stale
    outcome: defer
    note: "no retarget or close is judged on a replica whose status trails its spec or whose projection trails the service's generation; the pass requeues in ten seconds"
    invariants: [decision.reads.live.replicas]
    placement: unit
    coverage: {perm: [], unit: [TestRevertAtTheLastInstanceWaitsForTheProjectionBeforeJudgingTheRun], kind: []}
    status: decided
  - state: Open
    event: ir.missing
    outcome: defer
    note: "a member with no replica reads as an empty pair: never retargeted, never converged; the run stays pinned until the replica reappears"
    placement: unit
    coverage: {perm: [], unit: [TestAPinnedRunContinuesOnItsPin/Open/ir.missing], kind: []}
    status: decided
  - state: Open
    event: ir.converged
    windows: [before]
    outcome: transition
    to: Closed
    guard: "every pinned member's current and target revisions equal its pinned revision with no Instance trailing, and every canary unit is done and reads Stable"
    note: "the close keeps a bounded record with the targets and per-group provenance; a member that converged while another still rolls keeps the run open"
    placement: unit
    coverage: {perm: [], unit: [TestCompletedCloseKeepsBoundedRecord, TestCreationRunClosesWithoutCanaryState], kind: [rolloutpolicy_run_kind_test.go], replay: [open-and-close]}
    status: decided
  - state: Open
    event: ir.converged
    windows: [boundary, after]
    outcome: ignore
    note: "the close consumed the convergence; a converged member is what Closed reads"
    placement: unit
    coverage: {perm: [], unit: [TestAClosedRunStaysClosedOnTheNextPass/ir.converged], kind: []}
    status: decided
  - state: Open
    event: ir.straggling
    outcome: defer
    note: "the close waits for every Instance to reach the pinned revision; the canary's done sentinel can lead the replica counters by a pass and closing early would reopen at once through the straggler trigger"
    placement: unit
    coverage: {perm: [], unit: [TestCanaryRunClosesOnceTheUnitReadsStable], kind: []}
    status: decided
  - state: Open
    event: canary.progress
    outcome: ignore
    note: "the step counter is read only at the close; a step short of the ladder's end keeps the run pinned"
    placement: unit
    coverage: {perm: [], unit: [TestAPinnedRunContinuesOnItsPin/Open/canary.progress], kind: []}
    status: decided
  - state: Open
    event: canary.completed
    windows: [before]
    outcome: transition
    to: Closed
    guard: "the step counter is at the ladder's end, the primary reads Stable, no member of the group trails, and every other pinned member converged"
    note: "a unit still Promoting at the done sentinel keeps its run pinned, because a plan resolved only through the pin must still drive the unit to report Stable"
    placement: unit
    coverage: {perm: [], unit: [TestCanaryRunClosesOnceTheUnitReadsStable], kind: [rolloutpolicy_run_kind_test.go]}
    status: decided
  - state: Open
    event: canary.completed
    windows: [boundary, after]
    outcome: ignore
    note: "the close consumed the completion; the done sentinel stays on the record"
    placement: unit
    coverage: {perm: [], unit: [TestAClosedRunStaysClosedOnTheNextPass/canary.completed], kind: []}
    status: decided
  - state: Open
    event: canary.rolledBack
    variants: [inFlight]
    outcome: defer
    note: "a revert still draining keeps the run pinned; the plan gate admits the roll back to stable only under a pinned run"
    placement: unit
    coverage: {perm: [], unit: [TestRollingBackRunStaysOpen], kind: []}
    status: decided
  - state: Open
    event: canary.rolledBack
    variants: [settled]
    windows: [before]
    outcome: transition
    to: RejectedSticky
    guard: "the pinned revision of the unit's primary is the rejected hash and the primary reads RolledBack"
    note: "only a rollback of what this run presented is this run's outcome; a group still holding an older rejection was pinned at its stable revision and its standing rejection is inert here, so another group's rollout is not ended by it"
    invariants: [rejected.target.is.a.hold]
    placement: unit
    coverage: {perm: [], unit: [TestRolledBackRunStillClosesForTheGroupThatFailed, TestStandingRollbackDoesNotCloseAnotherGroupsRun], kind: []}
    status: decided
  - state: Open
    event: canary.rolledBack
    variants: [settled]
    windows: [boundary, after]
    outcome: ignore
    note: "the close consumed the settled revert; the rejected hash stays on the record as the hold"
    placement: unit
    coverage: {perm: [], unit: ["TestAClosedRunStaysClosedOnTheNextPass/canary.rolledBack[settled]"], kind: []}
    status: decided
  - state: Open
    event: canary.failed
    outcome: defer
    note: "a unit parked Failed is short of its ladder's end, so the run stays pinned while the stable revision serves; a rollback or resume verb or a new target ends the park, and nothing in the run layer closes on it"
    placement: unit
    coverage: {perm: [], unit: [TestAPinnedRunContinuesOnItsPin/Open/canary.failed], kind: []}
    status: decided
  - state: Open
    event: canary.parked
    outcome: defer
    note: "today a rollback that found no stable revision parks the unit with the rejected hash recorded and nothing draining, and the run layer reads that record as a revert that never settles: the run stays pinned until a retarget or a repin ends it and neither a rolled-back nor a completed close can fire; which is wrong because the park is terminal for the unit, so the run is left with no closing path of its own"
    placement: unit
    coverage: {perm: [], unit: [], kind: [], replay: [rollback-finds-no-stable-revision]}
    status: decided
  - state: Open
    event: canary.resumed
    outcome: ignore
    note: "the executor re-arms the unit under the pin; the run continues on the same targets"
    placement: unit
    coverage: {perm: [], unit: [TestAPinnedRunContinuesOnItsPin/Open/canary.resumed], kind: []}
    status: decided
  - state: Open
    event: coord.staged
    windows: [before]
    outcome: transition
    to: Closed
    guard: "every member that has not converged belongs to a coordination group whose persisted phase is Staged, and every other pinned member converged"
    note: "a lifecycle partition deliberately holds mixed revisions; keying the close on full convergence alone would pin such a run forever. The phase is read from the pass's cached copy of the InferenceService, one flush behind the coordination pass that wrote it"
    placement: unit
    coverage: {perm: [], unit: [TestAStagedGroupClosesAPinnedRun/Open], kind: [runtime_partition_sequential_kind_test.go]}
    status: decided
  - state: Open
    event: coord.staged
    windows: [boundary, after]
    outcome: ignore
    note: "the close consumed the staged rest, but the staged member still diverges on its replica pair: the next pass opens a fresh run over it and the pass after closes it again, so a service resting Staged alternates an open and a close on every pass; which is wrong because a partition held by design is not pending work"
    placement: unit
    coverage: {perm: [], unit: [TestAStagedGroupClosesAPinnedRun/Open], kind: []}
    status: decided
  - state: Open
    event: coord.settled
    outcome: ignore
    note: "the run layer reads the replica pairs, not the group phase; an Idle group with a converged member is ir.converged"
    placement: unit
    coverage: {perm: [], unit: [TestAPinnedRunContinuesOnItsPin/Open/coord.settled], kind: []}
    status: decided
  - state: Open
    event: verb.repin
    windows: [before]
    outcome: transition
    to: RepinPending
    note: "the annotation is persisted metadata; the next pass consumes it before it reads freshness, retargets or closes"
    placement: unit
    coverage: {perm: [], unit: [TestRepinCASAndClamp], kind: [rolloutpolicy_run_kind_test.go], replay: [repin-consumed-before-failed-flush]}
    status: decided
  - state: Open
    event: verb.repin
    windows: [boundary, after]
    outcome: ignore
    note: "the annotation is already present; a rewrite of its value is what the consuming pass reads"
    placement: unit
    coverage: {perm: [], unit: [TestARepinOnAnAdoptedRunKeepsItsIdentity], kind: []}
    status: decided
  - state: Open
    event: verb.rollback
    outcome: ignore
    note: "the rollback verb is the canary executor's: it records the rejection on the unit and drives the revert; the run layer sees the result as canary.rolledBack"
    placement: unit
    coverage: {perm: [], unit: [TestAPinnedRunContinuesOnItsPin/Open/verb.rollback], kind: []}
    status: decided
  - state: Open
    event: ctrl.staleRead
    variants: [missesOpen]
    outcome: transition
    to: Open
    note: "today a pass whose cached copy lacks the pin opens the same roll again under a new RunID and OpenedAt, the newer clock wins at the flush and the canary unit, bound by an unchanged TargetID, is not reset; which is wrong because an open over an identical target set re-mints the run's identity and fires a second RolloutRunOpened for the same roll"
    invariants: [pin.newer.wins]
    placement: sim
    coverage: {perm: [], unit: [], kind: [], replay: [stale-read-misses-open]}
    status: decided
  - state: Open
    event: ctrl.staleRead
    variants: [missesClose]
    outcome: transition
    to: Open
    note: "today a cached copy that still shows the predecessor pinned re-judges it against the live replicas, closes it again with a fresh ClosedAt and opens a successor, and the flush keeps that write because the preserve rule compares wall clocks; which is wrong because a stale pass overwrites the newer live successor and the predecessor's recorded outcome"
    invariants: [pin.newer.wins]
    placement: sim
    coverage: {perm: [], unit: [], kind: [], replay: [stale-read-misses-close]}
    status: decided
  - state: Open
    event: ctrl.staleRead
    variants: [missesRepin]
    outcome: ignore
    note: "a cached copy with the old plan reports RolloutPlanDrift True against the live render for that one pass; the flush keeps the live pin by its newer PinnedAt and the live unit record by its difference from the base, so the pre-step hold the repin armed stays on the per-unit record and the next pass reads the repinned plan again"
    invariants: [pin.newer.wins]
    placement: sim
    coverage: {perm: [], unit: [], kind: [], replay: [stale-read-misses-repin]}
    status: decided
  - state: Open
    event: ctrl.resync
    outcome: ignore
    note: "drift is re-evaluated from the cached policies and RolloutPlanReady Pinned is re-stamped only on change"
    placement: unit
    coverage: {perm: [], unit: [TestAPinnedRunContinuesOnItsPin/Open/ctrl.resync], kind: []}
    status: decided
  - state: Open
    event: api.flushFailed
    variants: [afterOpen, afterClose]
    windows: [before, after]
    outcome: n/a
    reason: a boundary flush exists only while a retarget or a close is in memory and not yet persisted
    status: decided
  - state: Open
    event: api.flushFailed
    variants: [afterOpen, afterClose]
    windows: [boundary]
    outcome: defer
    note: "the pass returns the error with nothing persisted; the next pass recomputes the same boundary from the persisted pin and the live replicas. A retarget re-mints its RunID; a close lands a later ClosedAt"
    placement: sim
    coverage: {perm: [], unit: [], kind: [], replay: [flush-fails-at-each-run-boundary]}
    status: decided
  - state: Open
    event: api.conflict
    outcome: defer
    note: "the flush is rebased onto the live object; the ActiveRun and LastRun pair with the newer clock is kept, so a rebase from a stale copy never rolls the pin back to a predecessor"
    invariants: [pin.newer.wins]
    placement: unit
    coverage: {perm: [], unit: [TestPreserveNewerRunKeepsFresherPin], kind: []}
    status: decided
