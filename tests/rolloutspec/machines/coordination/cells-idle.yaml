# Cells for Unobserved, Idle and the Sequential soak window: no member
# rolls. The first observation writes the entry at the phase the facts
# compute; an Idle group leaves on the first bump; an Awaiting group leaves
# when the next member in Order rolls and the soak has elapsed
# (reconciler.go Reconcile, buildGroupObservation, buildRatioState;
# state.go sequentialTransition; status.go MergeGroupStatus).

cells:
  # --- Unobserved ------------------------------------------------------------
  - state: Unobserved
    event: ctrl.resync
    windows: [before]
    outcome: transition
    to: Idle
    guard: "the first pass that resolves the group finds no member rolling, no Failed row and no pause"
    note: "the first observation writes the entry at whatever phase the member facts compute: Surging, Waiting, Shifting or ScalingDown for a roll in flight (T-unobs-rolling), Failed for a Failed row (T-unobs-failed), Paused under the annotation (T-unobs-paused), Staged for a converged partition (T-unobs-staged); no transition event or metric fires because there is no prior phase, and the anchor is snapshotted once every member reports a replica count"
    invariants: [phase.follows.members]
    placement: unit
    coverage: {perm: [], unit: [TestReconcile_WritesGroupStatus, TestEmitPhaseEvents_OnlyOnTransition, TestBuildRatioState_DefersSnapshotWhenStatusEmpty], kind: []}
    status: decided
  - state: Unobserved
    event: ctrl.resync
    windows: [boundary, after]
    outcome: ignore
    note: "the entry is written once and read back by the next pass as the group's only memory; a resync that finds the same facts keeps it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestMergeGroupStatus_PreservesLastTransitionTimeOnSamePhase], kind: [], replay: [idle-group-reads-each-fact-on-the-next-pass, open-and-close]}
    status: decided
  # --- Idle ------------------------------------------------------------------
  - state: Idle
    event: member.targetChanged
    variants: [first]
    windows: [before]
    outcome: transition
    to: Surging
    guard: "a member's target differs from its current revision and it has no new-revision pod yet"
    note: "BlueGreen and RollingUpdate read Surging until every rolling member has a new pod; Independent reads Shifting for the whole roll; Sequential names the first rolling member in Order on the composite phase, skipping idle members ahead of it"
    invariants: [phase.follows.members, one.rolls.at.a.time]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_BlueGreenSurging, TestComputeTransition_RollingUpdateSurging, TestComputeTransition_IndependentInFlight, TestComputeTransition_SequentialActiveComponent, TestCheckSequentialGate_LaterOnlyBumpReleasesLaterComponent], kind: [bluegreen_kind_test.go, sequential_kind_test.go, sequential_later_only_bump_kind_test.go], replay: [flush-overwrites-group-fields, open-and-close]}
    status: decided
  - state: Idle
    event: member.targetChanged
    variants: [first]
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed], kind: [], replay: [open-and-close, stale-copy-restamps-every-phase]}
    status: decided
  - state: Idle
    event: member.surgePodCreated
    windows: [before]
    outcome: transition
    to: Waiting
    guard: "the bump and its first new-revision pod are observed in one pass and not every new pod is Ready"
    note: "a coordination pass that lags the replica sees the bump and an Instance already counted on the target together; the phase is the facts', not the history's"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/idle-surge-pod-observed-with-the-bump], kind: []}
    status: decided
  - state: Idle
    event: member.surgePodCreated
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/idle-surge-pod-observed-with-the-bump], kind: []}
    status: decided
  - state: Idle
    event: member.readyOnTarget
    windows: [before]
    outcome: transition
    to: Shifting
    guard: "the bump and its Ready new-revision pods are observed in one pass while old pods remain"
    note: "observed late, the group enters at Shifting while old pods remain and at ScalingDown when none does"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/idle-ready-target-observed-with-the-bump, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/idle-ready-target-observed-with-no-old-pod], kind: []}
    status: decided
  - state: Idle
    event: member.readyOnTarget
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/idle-ready-target-observed-with-the-bump], kind: []}
    status: decided
  - state: Idle
    event: member.capacityLost
    outcome: ignore
    note: "no roll is in flight; a readiness loss moves the pod-proportional traffic weights and the replica's own Ready condition, not the group phase"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/idle-capacity-lost-keeps-idle], kind: [], replay: [idle-group-reads-each-fact-on-the-next-pass]}
    status: decided
  - state: Idle
    event: member.converged
    outcome: ignore
    note: "already Idle; nothing changes"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/idle-converged-members-keep-idle], kind: [], replay: [open-and-close]}
    status: decided
  - state: Idle
    event: member.staged
    windows: [before]
    outcome: transition
    to: Staged
    guard: "a roll under a non-zero partition is observed already at its staged shape"
    note: "observed late, the group enters at Staged"
    invariants: [staged.is.rest]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_BlueGreenStaged, TestBuildComponentObservation_AtDesiredShapeWithStaticPartition], kind: []}
    status: decided
  - state: Idle
    event: member.staged
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestComputeTransition_BlueGreenStaged], kind: []}
    status: decided
  - state: Idle
    event: member.failed
    windows: [before]
    outcome: transition
    to: Failed
    guard: "an Instance row of a member reads Failed"
    note: "any Failed row marks the member Failed and every policy rolls that into the group's Failed phase, with the failed indices on the message and RolloutCoordinationReady False"
    invariants: [failed.is.not.latched]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_BlueGreenFailed, TestComputeTransition_RollingUpdateFailed, TestComputeTransition_IndependentFailed, TestBuildComponentObservation_AnyFailedInstanceMarksComponentFailed, TestBuildComponentObservation_FailedPropagatesThroughBlueGreen], kind: [sequential_failure_hold_kind_test.go]}
    status: decided
  - state: Idle
    event: member.failed
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed], kind: [], replay: [stale-copy-restamps-every-phase]}
    status: decided
  - state: Idle
    event: member.dark
    outcome: ignore
    note: "the group phase keys on revisions, not on capacity: a dark member with no Failed row is not rolling and not failed, so the group stays Idle and RolloutCoordinationReady True while the replica's own Ready condition reports the loss"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/idle-dark-member-keeps-idle], kind: [], replay: [idle-group-reads-each-fact-on-the-next-pass]}
    status: decided
  - state: Idle
    event: ratio.anchorMissing
    outcome: ignore
    note: "the anchor is snapshotted now from the members' replica counters once every member reports a positive count, and deferred to a later pass otherwise; until then the surge budget is the MaxSurge alone and no skew is possible"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestBuildRatioState_DefersSnapshotWhenStatusEmpty, TestBuildRatioState_PartiallyPopulatedStatusDefersSnapshot, TestBuildRatioState_AllAnchorsStaleFallsBackToSnapshot, TestCheckRatioGate_NoAnchorWithCompleteIRAllowed], kind: []}
    status: decided
  - state: Idle
    event: spec.pause
    windows: [before]
    outcome: transition
    to: Paused
    guard: "the pause annotation is set, with either accepted value"
    note: "the pause is checked before any member fact; pause and freeze hold the group identically, and the replica keeps repairing under a plain pause while a freeze stops it"
    invariants: [pause.holds.every.group]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PausedGlobal, TestComputeTransition_BlueGreenPaused], kind: [pause_midrollout_kind_test.go, sequential_pause_mid_kind_test.go, ratio_pause_resume_kind_test.go]}
    status: decided
  - state: Idle
    event: spec.pause
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed], kind: [], replay: [idle-group-reads-each-fact-on-the-next-pass]}
    status: decided
  - state: Idle
    event: spec.groupEdited
    variants: [memberAdded]
    outcome: ignore
    note: "the member joins the group on the next pass; its anchor entry is added from its replica count once it reports one and the existing entries are untouched"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestBuildRatioState_LateMemberGainsAnchor, TestBuildRatioState_LateMemberWithZeroStatusDeferred], kind: [ratio_late_member_anchor_kind_test.go]}
    status: decided
  - state: Idle
    event: spec.groupEdited
    variants: [memberRemoved]
    outcome: ignore
    note: "the member's anchor entry is dropped so a stale entry cannot keep constraining the band, and the phase is recomputed over the remaining members"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestBuildRatioState_RemovedMemberAnchorDropped, TestCheckRatioGate_RemovedMemberStaleAnchorIgnored], kind: []}
    status: decided
  - state: Idle
    event: spec.groupEdited
    variants: [policyChanged]
    outcome: ignore
    note: "the group is re-resolved from the effective plan every pass under the same index-derived name, so its entry, anchor and transition time carry over and the phase is recomputed under the new policy from the same facts; an Idle group reads Idle under every policy"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/idle-under-rollingupdate, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/idle-under-independent, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/idle-under-sequential], kind: []}
    status: decided
  - state: Idle
    event: spec.groupEdited
    variants: [groupRemoved]
    windows: [before]
    outcome: transition
    to: Unobserved
    guard: "the group is absent from the effective plan"
    note: "entries absent from the freshly computed set are pruned, and with no coordination-style group left the whole status block and the RolloutCoordinationReady condition are cleared"
    placement: unit
    coverage: {perm: [], unit: [TestMergeAndPersistGroupStatuses_PrunesRemovedGroups, TestReconcile_ClearsStaleCoordinationStatusWhenGroupsGone], kind: []}
    status: decided
  - state: Idle
    event: spec.groupEdited
    variants: [groupRemoved]
    windows: [boundary, after]
    outcome: ignore
    note: "the entry is gone; a redeclared group starts Unobserved and is written at the phase its facts compute"
    placement: sim
    coverage: {perm: [], unit: [TestMergeAndPersistGroupStatuses_PrunesRemovedGroups], kind: [], replay: [idle-group-reads-each-fact-on-the-next-pass]}
    status: decided
  - state: Idle
    event: ir.readError
    outcome: defer
    note: "the pass fails before any group status is written, so the entry is untouched and the pass is retried; fabricating a zero observation would fake an Idle group and reset its soak anchor"
    placement: unit
    coverage: {perm: [], unit: [TestReconcile_IRReadErrorFailsReconcile], kind: []}
    status: decided
  - state: Idle
    event: ctrl.staleRead
    variants: [anchorMissing]
    outcome: transition
    to: Idle
    note: "today a copy with no anchor snapshots one from the replicas the pass sees and the flush copies it over the live anchor, so a scale between the anchor write and the stale pass moves the band to the new shape; which is wrong because anchor.kept.for.the.roll says the anchor is taken once and carried unchanged. Only the pass after the first observation can miss the anchor, which is written with the first entry"
    invariants: [anchor.kept.for.the.roll]
    placement: sim
    coverage: {perm: [], unit: [TestBuildRatioState_CopyWithoutAnchorSnapshotsTodaysReplicas], kind: [], replay: [anchor-resnapshot-on-a-copy-without-one]}
    status: decided
  - state: Idle
    event: ctrl.staleRead
    variants: [phaseRegressed]
    outcome: transition
    to: Idle
    note: "today the pass recomputes Idle from fresh facts, but the merge against a cached entry still at the previous phase sees the change again: it restamps lastTransitionTime to now, re-fires the transition event and the dwell metric, and the flush copies the restamped entry over the live one; under Sequential the restamp restarts the state-side soak; which is wrong because transition.time.marks.base.phase says the time moves only when the base phase changes"
    invariants: [transition.time.marks.base.phase]
    placement: sim
    coverage: {perm: [], unit: [TestMergeGroupStatus_NewPhaseUpdatesTransitionTime, TestEmitPhaseEvents_OnlyOnTransition], kind: [], replay: [stale-copy-restamps-every-phase]}
    status: decided
  - state: Idle
    event: flush.staleOverwrite
    outcome: transition
    to: Idle
    note: "today the flush copies the pass's group entry over the live one with no preserve rule and no clock, so the live phase, composite, current and previous component, transition time and anchor become the pass's: a pass that read a stale copy rolls the live entry back at its boundary flush and restamps it at its final flush; which is wrong because the run pin and the canary record are preserved against a stale writer and the group entry is not"
    placement: sim
    coverage: {perm: [], unit: [], kind: [], replay: [stale-copy-restamps-every-phase, anchor-resnapshot-on-a-copy-without-one]}
    status: decided
  - state: Idle
    event: api.serviceWriteFailed
    variants: [ensure]
    outcome: defer
    note: "the per-revision Service write fails before the group is evaluated, whatever the phase; the pass fails for a retry and the entry stays as the previous pass wrote it"
    placement: unit
    coverage: {perm: [], unit: [TestReconcile_ServiceWriteFailureLeavesTheGroupEntry], kind: []}
    status: decided
  - state: Idle
    event: api.serviceWriteFailed
    variants: [namespaceTerminating]
    outcome: ignore
    note: "a create the apiserver refuses for a terminating namespace ends the pass cleanly before the group is evaluated; the entry stays as the previous pass wrote it and the service goes away with its namespace"
    placement: unit
    coverage: {perm: [], unit: [TestReconcile_NamespaceTerminatingStopsBeforeTheGroup], kind: []}
    status: decided
  - state: Idle
    event: api.conflict
    outcome: defer
    note: "a 409 on the status write is rebased onto the live object inside the pass and the group entry lands from the pass's copy; the Lifecycle, canary and run fields have preserve rules, the group fields do not"
    placement: unit
    coverage: {perm: [], unit: [], kind: [], replay: [apiserver-refusals-leave-the-group-entry]}
    status: decided
  - state: Idle
    event: spec.replicas
    variants: [up]
    outcome: ignore
    note: "the phase keys on revisions and readiness, not on counts; the anchor is kept so the band is measured against the shape the roll began with, and the gate reads the new desired count from the replica spec"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestBuildRatioState_PreservesAlreadyRecordedAnchor], kind: [scale_during_rollout_kind_test.go]}
    status: decided
  - state: Idle
    event: spec.replicas
    variants: [down]
    outcome: ignore
    note: "the phase keys on revisions and readiness, not on counts; the anchor is kept across a deliberate scale-down so the band is not re-anchored to the smaller shape"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestBuildRatioState_PreservesAlreadyRecordedAnchor], kind: [ratio_anchor_scaledown_kind_test.go]}
    status: decided
  - state: Idle
    event: spec.partition
    variants: [set]
    outcome: ignore
    note: "the partition takes effect through the replica, which stops the roll at the staged shape; the phase keys on the rows and reads Staged only once the shape holds (member.staged)"
    invariants: [staged.is.rest]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/idle-partition-set-keeps-idle], kind: [], replay: [idle-group-reads-each-fact-on-the-next-pass]}
    status: decided
  - state: Idle
    event: spec.partition
    variants: [cleared]
    outcome: ignore
    note: "the held Instances roll on through the replica; the phase keys on the rows and the group leaves through member.converged"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/idle-partition-cleared-keeps-idle], kind: [], replay: [idle-group-reads-each-fact-on-the-next-pass]}
    status: decided
  - state: Idle
    event: ir.missing
    outcome: ignore
    note: "a member with no replica reads as a zero observation: not rolling, not failed; the group stays Idle"
    placement: unit
    coverage: {perm: [], unit: [TestBuildComponentObservation_NoStatusReturnsZero], kind: []}
    status: decided
  - state: Idle
    event: ir.stale
    outcome: ignore
    note: "the observation applies no freshness rule; a trailing counter on an Idle group costs at most a late Surging"
    placement: unit
    coverage: {perm: [], unit: [TestBuildComponentObservation_CountersTrailingThePodsReadTheCounters, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/idle-counters-trailing-keep-idle], kind: [], replay: [idle-group-reads-each-fact-on-the-next-pass]}
    status: decided
  - state: Idle
    event: ctrl.resync
    outcome: ignore
    note: "the phase is recomputed and found unchanged; lastTransitionTime is kept, no event or metric fires, and the status write is skipped when nothing differs"
    placement: unit
    coverage: {perm: [], unit: [TestReconcile_SteadyStateEmitsNoGroupEvents, TestEmitPhaseEvents_OnlyOnTransition, TestMergeGroupStatus_PreservesLastTransitionTimeOnSamePhase], kind: []}
    status: decided
  # --- SeqAwaiting -----------------------------------------------------------
  - state: SeqAwaiting
    event: member.targetChanged
    variants: [first]
    windows: [before]
    outcome: transition
    to: Surging
    guard: "the next member in Order records a target off its current revision and no soak is running"
    note: "the next member becomes the active one and the composite phase names it; with a soak still running the group stays Awaiting until timer.soak"
    invariants: [one.rolls.at.a.time]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_SequentialNextStartsAfterPrevious, TestComputeTransition_SequentialNoSoakRunsImmediately], kind: [sequential_kind_test.go, n3_sequential_kind_test.go]}
    status: decided
  - state: SeqAwaiting
    event: member.targetChanged
    variants: [first]
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/awaiting-soak-elapsed-enters-the-member-phase], kind: []}
    status: decided
  - state: SeqAwaiting
    event: member.surgePodCreated
    windows: [before]
    outcome: ignore
    note: "the soak hold is judged before the active member's pods, so an Instance counted on the target under the window (the replica-side gate releases on its own clock) leaves the group Awaiting; the member enters at Waiting when the soak elapses"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/awaiting-surge-pod-under-the-soak-keeps-awaiting, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/awaiting-soak-elapsed-enters-the-member-phase], kind: []}
    status: decided
  - state: SeqAwaiting
    event: member.surgePodCreated
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/awaiting-surge-pod-under-the-soak-keeps-awaiting], kind: []}
    status: decided
  - state: SeqAwaiting
    event: member.readyOnTarget
    windows: [before]
    outcome: ignore
    note: "the soak hold is judged before the active member's pods, so pods Ready on the target under the window leave the group Awaiting; the member enters at the phase its pods compute when the soak elapses"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/awaiting-ready-target-under-the-soak-keeps-awaiting, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/awaiting-soak-elapsed-enters-the-member-phase], kind: []}
    status: decided
  - state: SeqAwaiting
    event: member.readyOnTarget
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/awaiting-ready-target-under-the-soak-keeps-awaiting], kind: []}
    status: decided
  - state: SeqAwaiting
    event: member.capacityLost
    outcome: ignore
    note: "the soak hold is judged before any pod fact; a readiness loss on the completed member moves traffic weights, not the phase, unless a row reads Failed"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/awaiting-completed-member-capacity-lost-keeps-awaiting], kind: []}
    status: decided
  - state: SeqAwaiting
    event: member.converged
    windows: [before]
    outcome: transition
    to: Idle
    guard: "every member in Order is done for handoff"
    note: "the chain is complete and the composite phase returns to Idle; a member converging while others remain keeps the group Awaiting"
    placement: unit
    coverage: {perm: [], unit: [TestCompletedSequentialComponents_CountsAtDesiredShape], kind: [sequential_kind_test.go]}
    status: decided
  - state: SeqAwaiting
    event: member.converged
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestCompletedSequentialComponents_CountsAtDesiredShape], kind: []}
    status: decided
  - state: SeqAwaiting
    event: member.staged
    outcome: ignore
    note: "a member at its staged shape counts as done for handoff, so it advances the completed count rather than making the group read Staged; a Sequential group never rests Staged"
    invariants: [staged.is.rest]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_SequentialHandsOffOnStaged, TestActiveSequentialComponent_SkipsAtDesiredShape], kind: [runtime_partition_sequential_kind_test.go]}
    status: decided
  - state: SeqAwaiting
    event: member.failed
    windows: [before]
    outcome: transition
    to: Failed
    guard: "an Instance row of a member reads Failed"
    note: "any Failed row marks the member Failed and every policy rolls that into the group's Failed phase, with the failed indices on the message and RolloutCoordinationReady False; the composite phase reads Sequential.Failed and the members after the failed one stay held"
    invariants: [failed.is.not.latched]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_BlueGreenFailed, TestComputeTransition_RollingUpdateFailed, TestComputeTransition_IndependentFailed, TestBuildComponentObservation_AnyFailedInstanceMarksComponentFailed, TestBuildComponentObservation_FailedPropagatesThroughBlueGreen], kind: [sequential_failure_hold_kind_test.go]}
    status: decided
  - state: SeqAwaiting
    event: member.failed
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/failed-under-sequential], kind: []}
    status: decided
  - state: SeqAwaiting
    event: member.dark
    outcome: ignore
    note: "a dark completed member with no Failed row does not hold the chain: the soak hold is judged before any pod fact and the next member starts when it elapses"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/awaiting-completed-member-capacity-lost-keeps-awaiting], kind: []}
    status: decided
  - state: SeqAwaiting
    event: seq.nextTurn
    windows: [before]
    outcome: transition
    to: Surging
    guard: "the previous member is done for handoff, a later member rolls, and the group has no soak"
    note: "the first member in Order whose roll is in flight and not at its staged shape becomes active; the gate on the replica side releases the same member"
    invariants: [one.rolls.at.a.time]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_SequentialNoSoakRunsImmediately, TestActiveSequentialComponent_SkipsCompletedToFindRolling, TestCheckSequentialGate_PostDecoderConvergence_AllowsEngine], kind: [sequential_kind_test.go]}
    status: decided
  - state: SeqAwaiting
    event: seq.nextTurn
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestComputeTransition_SequentialNoSoakRunsImmediately], kind: []}
    status: decided
  - state: SeqAwaiting
    event: timer.soak
    windows: [before]
    outcome: transition
    to: Surging
    guard: "the next member rolls and now minus the group's lastTransitionTime exceeds the configured soak"
    note: "the state-side soak reads the group's lastTransitionTime, the time the base phase last changed; the replica-side gate reads the previous member's Ready condition transition instead, so the two release independently"
    invariants: [transition.time.marks.base.phase]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_SequentialSoakHolds, TestComputeTransition_SequentialSoakReleases, TestCheckSequentialGate_SoakReleasesAfterDuration], kind: [sequential_soak_kind_test.go]}
    status: decided
  - state: SeqAwaiting
    event: timer.soak
    windows: [boundary, after]
    outcome: ignore
    note: "once the soak elapsed and the next member's phase is written, a later reading of the clock changes nothing on the state side; the replica-side gate releases on the previous member's Ready transition, its own clock, so the two can admit the member on different passes, which is wrong because one soak is measured by two clocks"
    invariants: [transition.time.marks.base.phase]
    placement: sim
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/awaiting-soak-long-elapsed-reads-the-member-phase, TestCheckSequentialGate_SoakReleasesAfterDuration], kind: [], replay: [sequential-handoff-on-stale-copy, sequential-soak-restarts-after-unpause]}
    status: decided
  - state: SeqAwaiting
    event: spec.pause
    windows: [before]
    outcome: transition
    to: Paused
    guard: "the pause annotation is set, with either accepted value"
    note: "the pause is checked before any member fact; pause and freeze hold the group identically, and the replica keeps repairing under a plain pause while a freeze stops it"
    invariants: [pause.holds.every.group]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PausedGlobal, TestComputeTransition_BlueGreenPaused], kind: [pause_midrollout_kind_test.go, sequential_pause_mid_kind_test.go, ratio_pause_resume_kind_test.go]}
    status: decided
  - state: SeqAwaiting
    event: spec.pause
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed], kind: [], replay: [sequential-soak-restarts-after-unpause]}
    status: decided
  - state: SeqAwaiting
    event: spec.groupEdited
    variants: [memberAdded]
    outcome: ignore
    note: "the member joins the group on the next pass; its anchor entry is added from its replica count once it reports one and the existing entries are untouched"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestBuildRatioState_LateMemberGainsAnchor, TestBuildRatioState_LateMemberWithZeroStatusDeferred], kind: [ratio_late_member_anchor_kind_test.go]}
    status: decided
  - state: SeqAwaiting
    event: spec.groupEdited
    variants: [memberRemoved]
    outcome: ignore
    note: "the member's anchor entry is dropped so a stale entry cannot keep constraining the band, and the phase is recomputed over the remaining members"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestBuildRatioState_RemovedMemberAnchorDropped, TestCheckRatioGate_RemovedMemberStaleAnchorIgnored], kind: []}
    status: decided
  - state: SeqAwaiting
    event: spec.groupEdited
    variants: [policyChanged]
    outcome: transition
    to: Surging
    note: "the soak hold is a Sequential rule: a plan edit that collapses the pair into one BlueGreen or RollingUpdate group under the same index drops the hold and the group reads the rolling member's phase; the entry, anchor and transition time carry over"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/awaiting-collapsed-to-bluegreen-reads-the-rolling-member], kind: []}
    status: decided
  - state: SeqAwaiting
    event: spec.groupEdited
    variants: [groupRemoved]
    windows: [before]
    outcome: transition
    to: Unobserved
    guard: "the group is absent from the effective plan"
    note: "entries absent from the freshly computed set are pruned, and with no coordination-style group left the whole status block and the RolloutCoordinationReady condition are cleared"
    placement: unit
    coverage: {perm: [], unit: [TestMergeAndPersistGroupStatuses_PrunesRemovedGroups, TestReconcile_ClearsStaleCoordinationStatusWhenGroupsGone], kind: []}
    status: decided
  - state: SeqAwaiting
    event: spec.groupEdited
    variants: [groupRemoved]
    windows: [boundary, after]
    outcome: ignore
    note: "the entry is gone; a redeclared group starts Unobserved and is written at the phase its facts compute"
    placement: sim
    coverage: {perm: [], unit: [TestMergeAndPersistGroupStatuses_PrunesRemovedGroups], kind: [], replay: [idle-group-reads-each-fact-on-the-next-pass]}
    status: decided
  - state: SeqAwaiting
    event: ir.readError
    outcome: defer
    note: "the pass fails before any group status is written, so the entry is untouched and the pass is retried; fabricating a zero observation would fake an Idle group and reset its soak anchor"
    placement: unit
    coverage: {perm: [], unit: [TestReconcile_IRReadErrorFailsReconcile], kind: []}
    status: decided
  - state: SeqAwaiting
    event: ctrl.staleRead
    variants: [anchorMissing]
    outcome: n/a
    reason: "a Sequential group carries no ratio anchor, since RatioBalanced pacing is ignored on its single-member groups, so no copy can miss one"
    status: decided
  - state: SeqAwaiting
    event: ctrl.staleRead
    variants: [phaseRegressed]
    outcome: transition
    to: SeqAwaiting
    note: "today the pass recomputes the soak window from fresh facts, but the merge against a cached entry still at the previous phase sees the change again: it restamps lastTransitionTime to now, re-fires the transition event and the dwell metric, and the flush copies the restamped entry over the live one; the restamp restarts the state-side soak while the replica-side gate keeps the previous member's Ready transition; which is wrong because transition.time.marks.base.phase says the time moves only when the base phase changes"
    invariants: [transition.time.marks.base.phase]
    placement: sim
    coverage: {perm: [], unit: [TestMergeGroupStatus_NewPhaseUpdatesTransitionTime, TestEmitPhaseEvents_OnlyOnTransition], kind: [], replay: [sequential-handoff-on-stale-copy]}
    status: decided
  - state: SeqAwaiting
    event: flush.staleOverwrite
    outcome: transition
    to: SeqAwaiting
    note: "today the flush copies the pass's group entry over the live one with no preserve rule and no clock, so the live phase, composite, current and previous component, transition time and anchor become the pass's: a pass that read a stale copy rolls the live entry back at its boundary flush and restamps it at its final flush; which is wrong because the run pin and the canary record are preserved against a stale writer and the group entry is not"
    placement: sim
    coverage: {perm: [], unit: [], kind: [], replay: [sequential-handoff-on-stale-copy, stale-copy-restamps-every-phase]}
    status: decided
  - state: SeqAwaiting
    event: api.serviceWriteFailed
    variants: [ensure]
    outcome: defer
    note: "the per-revision Service write fails before the group is evaluated, whatever the phase; the pass fails for a retry and the entry stays as the previous pass wrote it"
    placement: unit
    coverage: {perm: [], unit: [TestReconcile_ServiceWriteFailureLeavesTheGroupEntry], kind: []}
    status: decided
  - state: SeqAwaiting
    event: api.serviceWriteFailed
    variants: [namespaceTerminating]
    outcome: ignore
    note: "a create the apiserver refuses for a terminating namespace ends the pass cleanly before the group is evaluated; the entry stays as the previous pass wrote it and the service goes away with its namespace"
    placement: unit
    coverage: {perm: [], unit: [TestReconcile_NamespaceTerminatingStopsBeforeTheGroup], kind: []}
    status: decided
  - state: SeqAwaiting
    event: api.conflict
    outcome: defer
    note: "a 409 on the status write is rebased onto the live object inside the pass and the group entry lands from the pass's copy; the Lifecycle, canary and run fields have preserve rules, the group fields do not"
    placement: unit
    coverage: {perm: [], unit: [], kind: [], replay: [apiserver-refusals-leave-the-group-entry]}
    status: decided
  - state: SeqAwaiting
    event: spec.replicas
    variants: [up]
    outcome: ignore
    note: "the phase keys on revisions and readiness, not on counts; the anchor is kept so the band is measured against the shape the roll began with, and the gate reads the new desired count from the replica spec"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestBuildRatioState_PreservesAlreadyRecordedAnchor], kind: [scale_during_rollout_kind_test.go]}
    status: decided
  - state: SeqAwaiting
    event: spec.replicas
    variants: [down]
    outcome: ignore
    note: "the phase keys on revisions and readiness, not on counts; the anchor is kept across a deliberate scale-down so the band is not re-anchored to the smaller shape"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestBuildRatioState_PreservesAlreadyRecordedAnchor], kind: [ratio_anchor_scaledown_kind_test.go]}
    status: decided
  - state: SeqAwaiting
    event: spec.partition
    variants: [set]
    outcome: ignore
    note: "the partition takes effect through the replica, which stops the roll at the staged shape; the phase keys on the rows and reads Staged only once the shape holds (member.staged)"
    invariants: [staged.is.rest]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/awaiting-partition-on-the-next-member-keeps-awaiting], kind: []}
    status: decided
  - state: SeqAwaiting
    event: spec.partition
    variants: [cleared]
    outcome: ignore
    note: "the held Instances roll on through the replica; the phase keys on the rows and the group leaves through member.converged"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/awaiting-partition-cleared-keeps-awaiting], kind: []}
    status: decided
  - state: SeqAwaiting
    event: ir.missing
    outcome: transition
    to: Idle
    note: "a member with no replica reads as a zero observation and counts as done for handoff: with the next member gone the chain reads complete and the group Idle; with the completed member gone the hold keeps running for the next one"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/awaiting-next-member-missing-reads-complete, TestReconcile_MissingReplicaReadsIdleOnTheNextPass], kind: []}
    status: decided
  - state: SeqAwaiting
    event: ir.stale
    outcome: ignore
    note: "the observation applies no freshness rule; the replica-side gate waits for a fresh replica before it releases the next member, so a trailing counter here costs a pass of Awaiting"
    placement: unit
    coverage: {perm: [], unit: [TestBuildComponentObservation_CountersTrailingThePodsReadTheCounters, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/awaiting-counters-trailing-keep-awaiting], kind: []}
    status: decided
  - state: SeqAwaiting
    event: ctrl.resync
    outcome: ignore
    note: "the phase is recomputed unchanged and lastTransitionTime is kept; the message carries the remaining soak, so the entry is rewritten while the window runs and no event or metric fires"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/awaiting-resync-keeps-awaiting, TestMergeGroupStatus_PreservesLastTransitionTimeOnSamePhase], kind: [], replay: [sequential-soak-restarts-after-unpause]}
    status: decided
