# Cells for the three resting phases: Staged (converged to a non-zero
# partition), Failed (a rollup of Failed Instance rows, never latched) and
# Paused (the annotation, checked before any member fact). Each leaves on
# the pass whose facts no longer support it (state.go).

cells:
  # --- Staged ----------------------------------------------------------------
  - state: Staged
    event: member.targetChanged
    variants: [first]
    windows: [before]
    outcome: transition
    to: Surging
    guard: "a member's target moves to a revision with no pod yet"
    note: "the staged shape is judged against the new target, which no Instance runs yet, so the roll starts over at Surging"
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: member.targetChanged
    variants: [first]
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that changes after the read is the next pass's"
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: member.targetChanged
    variants: [later]
    outcome: ignore
    note: "a Sequential group never rests Staged; outside Sequential the member joins the roll and the group leaves Staged through its own re-bump cell"
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: member.surgePodCreated
    windows: [before]
    outcome: transition
    to: Waiting
    guard: "a new-revision pod beyond the staged shape exists and is not Ready yet"
    note: "a lowered partition releases more Instances; the group reads Waiting until they are Ready and Staged again once the new shape holds"
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: member.surgePodCreated
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that changes after the read is the next pass's"
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: member.readyOnTarget
    outcome: ignore
    note: "the staged shape already has every unheld Instance Ready on the target; a further Ready pod keeps the rest"
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: member.capacityLost
    variants: [newRevision]
    windows: [before]
    outcome: transition
    to: Waiting
    guard: "a new-revision pod leaves readiness, so the member is no longer at its staged shape"
    note: "the staged shape requires the unheld Instances Ready on the target; the group reads Waiting until it holds again"
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: member.capacityLost
    variants: [newRevision]
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that changes after the read is the next pass's"
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: member.capacityLost
    variants: [oldRevision]
    windows: [before]
    outcome: transition
    to: Shifting
    guard: "a held old-revision Instance leaves readiness, so the member is no longer at its staged shape while its old pods remain"
    note: "the staged shape also requires the held Instances Ready on the prior revision; the group reads Shifting until the replica restores it"
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: member.capacityLost
    variants: [oldRevision]
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that changes after the read is the next pass's"
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: member.oldPodsGone
    windows: [before]
    outcome: transition
    to: ScalingDown
    guard: "the held old-revision pods are gone before the replica rebuilt them"
    note: "with no old pod the roll reads ScalingDown; the replica rebuilds the held Instances on the prior revision and the group returns to Staged"
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: member.oldPodsGone
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that changes after the read is the next pass's"
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: member.converged
    windows: [before]
    outcome: transition
    to: Idle
    guard: "the partition was cleared and every Instance reached the target, so the replica promoted its current revision"
    note: "a cleared partition rolls the held Instances on; the group passes through Shifting and ScalingDown and reads Idle on promotion"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_StagedNotWhenPartitionZero], kind: []}
    status: decided
  - state: Staged
    event: member.converged
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that changes after the read is the next pass's"
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: member.staged
    outcome: ignore
    note: "already at rest; RolloutCoordinationReady reads True with reason Staged"
    invariants: [staged.is.rest]
    placement: unit
    coverage: {perm: [], unit: [TestComputeCoordinationReady_Staged], kind: []}
    status: decided
  - state: Staged
    event: member.rollback
    windows: [before]
    outcome: transition
    to: Idle
    guard: "the member's target returned to its current revision"
    note: "the roll no longer reads in flight; the replica drains the abandoned revision's Instances and the group reads Idle at once"
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: member.rollback
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that changes after the read is the next pass's"
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: member.failed
    windows: [before]
    outcome: transition
    to: Failed
    guard: "an Instance row of a member reads Failed"
    note: "any Failed row marks the member Failed and every policy rolls that into the group's Failed phase, with the failed indices on the message and RolloutCoordinationReady False"
    invariants: [failed.is.not.latched]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_BlueGreenFailed, TestComputeTransition_RollingUpdateFailed, TestComputeTransition_IndependentFailed, TestBuildComponentObservation_AnyFailedInstanceMarksComponentFailed, TestBuildComponentObservation_FailedPropagatesThroughBlueGreen], kind: [sequential_failure_hold_kind_test.go]}
    status: decided
  - state: Staged
    event: member.failed
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that changes after the read is the next pass's"
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: member.dark
    outcome: ignore
    note: "a dark member with no Failed row changes nothing; its staged shape no longer holds, which reads through member.capacityLost"
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: ratio.anchorMissing
    outcome: ignore
    note: "the anchor is snapshotted now from the members' replica counters once every member reports a positive count, and deferred to a later pass otherwise; until then the surge budget is the MaxSurge alone and no skew is possible"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestBuildRatioState_DefersSnapshotWhenStatusEmpty, TestBuildRatioState_PartiallyPopulatedStatusDefersSnapshot, TestBuildRatioState_AllAnchorsStaleFallsBackToSnapshot, TestCheckRatioGate_NoAnchorWithCompleteIRAllowed], kind: []}
    status: decided
  - state: Staged
    event: spec.pause
    windows: [before]
    outcome: transition
    to: Paused
    guard: "the pause annotation is set, with either accepted value"
    note: "the pause is checked before any member fact; pause and freeze hold the group identically, and the replica keeps repairing under a plain pause while a freeze stops it"
    invariants: [pause.holds.every.group]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PausedGlobal, TestComputeTransition_BlueGreenPaused], kind: [pause_midrollout_kind_test.go, sequential_pause_mid_kind_test.go, ratio_pause_resume_kind_test.go]}
    status: decided
  - state: Staged
    event: spec.pause
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that changes after the read is the next pass's"
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: spec.groupEdited
    variants: [memberAdded]
    outcome: ignore
    note: "the member joins the group on the next pass; its anchor entry is added from its replica count once it reports one and the existing entries are untouched"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestBuildRatioState_LateMemberGainsAnchor, TestBuildRatioState_LateMemberWithZeroStatusDeferred], kind: [ratio_late_member_anchor_kind_test.go]}
    status: decided
  - state: Staged
    event: spec.groupEdited
    variants: [memberRemoved]
    outcome: ignore
    note: "the member's anchor entry is dropped so a stale entry cannot keep constraining the band, and the phase is recomputed over the remaining members"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestBuildRatioState_RemovedMemberAnchorDropped, TestCheckRatioGate_RemovedMemberStaleAnchorIgnored], kind: []}
    status: decided
  - state: Staged
    event: spec.groupEdited
    variants: [policyChanged]
    outcome: ignore
    note: "the group is re-resolved from the effective plan every pass under the same index-derived name, so its entry, anchor and transition time carry over; under a pinned run the pinned body governs until the next open or a repin"
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: spec.groupEdited
    variants: [groupRemoved]
    windows: [before]
    outcome: transition
    to: Unobserved
    guard: "the group is absent from the effective plan"
    note: "entries absent from the freshly computed set are pruned, and with no coordination-style group left the whole status block and the RolloutCoordinationReady condition are cleared"
    placement: unit
    coverage: {perm: [], unit: [TestMergeAndPersistGroupStatuses_PrunesRemovedGroups, TestReconcile_ClearsStaleCoordinationStatusWhenGroupsGone], kind: []}
    status: decided
  - state: Staged
    event: spec.groupEdited
    variants: [groupRemoved]
    windows: [boundary, after]
    outcome: ignore
    note: "the entry is gone; a redeclared group starts Unobserved"
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: ir.readError
    outcome: defer
    note: "the pass fails before any group status is written, so the entry is untouched and the pass is retried; fabricating a zero observation would fake an Idle group and reset its soak anchor"
    placement: unit
    coverage: {perm: [], unit: [TestReconcile_IRReadErrorFailsReconcile], kind: []}
    status: decided
  - state: Staged
    event: ctrl.staleRead
    variants: [anchorMissing]
    outcome: DECIDE
    note: "the pass's cached copy carries no anchor, so the anchor is snapshotted again from today's replica counters (a row count that includes surge and migration indices) and the flush, which has no preserve rule for the group fields, overwrites the live anchor; the band moves mid-roll. The owner must decide whether the anchor is seeded from the replica spec and preserved from the live object at the flush"
    invariants: [anchor.kept.for.the.roll]
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: review
  - state: Staged
    event: ctrl.staleRead
    variants: [phaseRegressed]
    outcome: DECIDE
    note: "the cached entry shows an older phase, so the merge sees a phase change, restamps lastTransitionTime to now, re-fires the transition event, the dwell metric and under Sequential restarts the state-side soak; the gate side keeps the replica's Ready transition time, so the two soak clocks disagree. The owner must decide which clock the soak reads and whether the transition time is preserved from the live object"
    invariants: [transition.time.marks.base.phase]
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: review
  - state: Staged
    event: flush.staleOverwrite
    outcome: DECIDE
    note: "the flush copies the pass's rolloutCoordination over the live object's with no clock and no equality check, so a pass that read a stale copy rolls the live phase, anchor and transition time back by one pass; the owner must decide whether the group fields get a preserve rule like the run pin and the canary record"
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: review
  - state: Staged
    event: api.serviceWriteFailed
    variants: [ensure]
    outcome: defer
    note: "the per-revision Service write fails before the group is evaluated; the entry is untouched and the pass is retried"
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: api.serviceWriteFailed
    variants: [namespaceTerminating]
    outcome: ignore
    note: "the pass returns cleanly without evaluating the group; the service is going away with its namespace"
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: api.conflict
    outcome: defer
    note: "the flush is rebased onto the live object and the group entry is taken from the pass's copy; the live Lifecycle, canary and run fields have preserve rules, the group fields do not"
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: spec.replicas
    windows: [before]
    outcome: transition
    to: Shifting
    guard: "the desired count changed, so the staged shape no longer holds while old pods remain"
    note: "the new Instance comes up on the target revision (its index is beyond the partition) and the group reads Shifting until the new shape is reached and Staged again; the anchor is kept"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: spec.replicas
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that changes after the read is the next pass's"
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: spec.partition
    variants: [set]
    windows: [before]
    outcome: transition
    to: Shifting
    guard: "the partition moved to another non-zero value"
    note: "the staged shape is re-judged against the new partition; the group reads Shifting or Waiting until it holds and Staged again"
    invariants: [staged.is.rest]
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: spec.partition
    variants: [cleared]
    windows: [before]
    outcome: transition
    to: Shifting
    guard: "the partition is zero, so the held Instances roll on"
    note: "a zero partition is never Staged; the group reads Shifting, then ScalingDown, then Idle when the replica promotes its current revision"
    invariants: [staged.is.rest]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_StagedNotWhenPartitionZero], kind: []}
    status: decided
  - state: Staged
    event: spec.partition
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read"
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: ir.missing
    windows: [before]
    outcome: transition
    to: Idle
    guard: "the only rolling member's replica is gone, so it reads a zero observation"
    note: "a missing replica reads not rolling and not failed; the group recomputes over what is left"
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: ir.missing
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that changes after the read is the next pass's"
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: ir.stale
    outcome: ignore
    note: "the observation applies no freshness rule; a trailing counter can show Shifting for a pass before Staged holds again"
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Staged
    event: ctrl.resync
    outcome: ignore
    note: "the phase is recomputed and found unchanged; lastTransitionTime is kept, no event or metric fires, and the status write is skipped when nothing differs"
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  # --- Failed ----------------------------------------------------------------
  - state: Failed
    event: member.targetChanged
    variants: [first]
    outcome: ignore
    note: "Failed stands while any row reads Failed; a corrective target (roll forward to a fixed revision or back to the prior one) is what replaces the failed row through the replica, and the group exits on the pass that finds none"
    invariants: [failed.is.not.latched]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_FailedExitsOnRecovery], kind: [sequential_failure_hold_kind_test.go]}
    status: decided
  - state: Failed
    event: member.targetChanged
    variants: [later]
    outcome: ignore
    note: "under Sequential the chain is blocked: the composite phase reads Sequential.Failed naming the failed member and the replica-side gate holds every member after it until the failed one recovers"
    invariants: [one.rolls.at.a.time, failed.is.not.latched]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_SequentialFailedBlocks], kind: [sequential_failure_hold_kind_test.go]}
    status: decided
  - state: Failed
    event: member.surgePodCreated
    outcome: ignore
    note: "Failed is a rollup of rows; a new pod of another member changes nothing until no row reads Failed"
    invariants: [failed.is.not.latched]
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: member.readyOnTarget
    outcome: ignore
    note: "Failed is a rollup of rows; readiness elsewhere changes nothing until no row reads Failed"
    invariants: [failed.is.not.latched]
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: member.oldPodsGone
    outcome: ignore
    note: "Failed is a rollup of rows; the old pods leaving changes nothing until no row reads Failed"
    invariants: [failed.is.not.latched]
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: member.converged
    outcome: ignore
    note: "Failed is a rollup of rows; a member converging changes nothing until no row reads Failed"
    invariants: [failed.is.not.latched]
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: member.staged
    outcome: ignore
    note: "Failed is a rollup of rows; a staged shape elsewhere changes nothing until no row reads Failed"
    invariants: [failed.is.not.latched]
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: member.rollback
    outcome: ignore
    note: "the revert itself clears no row; the replica's corrective roll replaces the failed row and the group exits on member.recovered"
    invariants: [failed.is.not.latched]
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: member.capacityLost
    outcome: ignore
    note: "Failed is a rollup of rows; a capacity loss elsewhere changes nothing until no row reads Failed"
    invariants: [failed.is.not.latched]
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: member.failed
    outcome: ignore
    note: "another Failed row joins the message, which lists every failed index; the phase and its transition time are unchanged"
    invariants: [failed.is.not.latched]
    placement: unit
    coverage: {perm: [], unit: [TestBuildComponentObservation_MultipleFailedInstancesListedInMessage, TestCollectFailedInstanceIndices_PreservesOrder], kind: []}
    status: decided
  - state: Failed
    event: member.recovered
    windows: [before]
    outcome: transition
    to: Surging
    guard: "no Instance row reads Failed and a member rolls with no new-revision pod yet"
    note: "nothing is latched: the phase is whatever the members compute on the pass that finds no Failed row, Idle when nothing rolls (T-failed-recover-idle), Waiting, Shifting or ScalingDown when the corrective roll is further along; a parked attempt whose runner restarts inside the grace does not re-enter Failed"
    invariants: [failed.is.not.latched]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_FailedExitsOnRecovery, TestGroupPhase_ParkedAttemptRestartingInsideTheGraceDoesNotReenterFailed], kind: [sequential_failure_hold_kind_test.go]}
    status: decided
  - state: Failed
    event: member.recovered
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that changes after the read is the next pass's"
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: member.dark
    outcome: ignore
    note: "a dark member with a Failed row is what Failed already reads; a dark member without one changes nothing"
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: ratio.anchorMissing
    outcome: ignore
    note: "the anchor is snapshotted now from the members' replica counters once every member reports a positive count, and deferred to a later pass otherwise; until then the surge budget is the MaxSurge alone and no skew is possible"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestBuildRatioState_DefersSnapshotWhenStatusEmpty, TestBuildRatioState_PartiallyPopulatedStatusDefersSnapshot, TestBuildRatioState_AllAnchorsStaleFallsBackToSnapshot, TestCheckRatioGate_NoAnchorWithCompleteIRAllowed], kind: []}
    status: decided
  - state: Failed
    event: spec.pause
    windows: [before]
    outcome: transition
    to: Paused
    guard: "the pause annotation is set, with either accepted value"
    note: "the pause is checked before any member fact; pause and freeze hold the group identically, and the replica keeps repairing under a plain pause while a freeze stops it"
    invariants: [pause.holds.every.group]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PausedGlobal, TestComputeTransition_BlueGreenPaused], kind: [pause_midrollout_kind_test.go, sequential_pause_mid_kind_test.go, ratio_pause_resume_kind_test.go]}
    status: decided
  - state: Failed
    event: spec.pause
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that changes after the read is the next pass's"
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: spec.groupEdited
    variants: [memberAdded]
    outcome: ignore
    note: "the member joins the group on the next pass; its anchor entry is added from its replica count once it reports one and the existing entries are untouched"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestBuildRatioState_LateMemberGainsAnchor, TestBuildRatioState_LateMemberWithZeroStatusDeferred], kind: [ratio_late_member_anchor_kind_test.go]}
    status: decided
  - state: Failed
    event: spec.groupEdited
    variants: [memberRemoved]
    outcome: defer
    note: "the member's anchor entry is dropped; if it carried the Failed row the phase is recomputed over the remaining members on the next pass"
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: spec.groupEdited
    variants: [policyChanged]
    outcome: ignore
    note: "the group is re-resolved from the effective plan every pass under the same index-derived name, so its entry, anchor and transition time carry over; under a pinned run the pinned body governs until the next open or a repin"
    placement: unit
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: spec.groupEdited
    variants: [groupRemoved]
    windows: [before]
    outcome: transition
    to: Unobserved
    guard: "the group is absent from the effective plan"
    note: "entries absent from the freshly computed set are pruned, and with no coordination-style group left the whole status block and the RolloutCoordinationReady condition are cleared"
    placement: unit
    coverage: {perm: [], unit: [TestMergeAndPersistGroupStatuses_PrunesRemovedGroups, TestReconcile_ClearsStaleCoordinationStatusWhenGroupsGone], kind: []}
    status: decided
  - state: Failed
    event: spec.groupEdited
    variants: [groupRemoved]
    windows: [boundary, after]
    outcome: ignore
    note: "the entry is gone; a redeclared group starts Unobserved"
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: current
  - state: Failed
    event: ir.readError
    outcome: defer
    note: "the pass fails before any group status is written, so the entry is untouched and the pass is retried; fabricating a zero observation would fake an Idle group and reset its soak anchor"
    placement: unit
    coverage: {perm: [], unit: [TestReconcile_IRReadErrorFailsReconcile], kind: []}
    status: decided
  - state: Failed
    event: ctrl.staleRead
    variants: [anchorMissing]
    outcome: DECIDE
    note: "the pass's cached copy carries no anchor, so the anchor is snapshotted again from today's replica counters (a row count that includes surge and migration indices) and the flush, which has no preserve rule for the group fields, overwrites the live anchor; the band moves mid-roll. The owner must decide whether the anchor is seeded from the replica spec and preserved from the live object at the flush"
    invariants: [anchor.kept.for.the.roll]
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: review
  - state: Failed
    event: ctrl.staleRead
    variants: [phaseRegressed]
    outcome: DECIDE
    note: "the cached entry shows an older phase, so the merge sees a phase change, restamps lastTransitionTime to now, re-fires the transition event, the dwell metric and under Sequential restarts the state-side soak; the gate side keeps the replica's Ready transition time, so the two soak clocks disagree. The owner must decide which clock the soak reads and whether the transition time is preserved from the live object"
    invariants: [transition.time.marks.base.phase]
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: review
  - state: Failed
    event: flush.staleOverwrite
    outcome: DECIDE
    note: "the flush copies the pass's rolloutCoordination over the live object's with no clock and no equality check, so a pass that read a stale copy rolls the live phase, anchor and transition time back by one pass; the owner must decide whether the group fields get a preserve rule like the run pin and the canary record"
    placement: sim
    coverage: {perm: [], unit: [], kind: []}
    status: review
