# Cells for the three resting phases: Staged (converged to a non-zero
# partition), Failed (a rollup of Failed Instance rows, never latched) and
# Paused (the annotation, checked before any member fact). Each leaves on
# the pass whose facts no longer support it (state.go).

cells:
  # --- Staged ----------------------------------------------------------------
  - state: Staged
    event: member.targetChanged
    variants: [first]
    windows: [before]
    outcome: transition
    to: Surging
    guard: "a member's target moves to a revision with no pod yet"
    note: "the staged shape is judged against the new target, which no Instance runs yet, so the roll starts over at Surging"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/staged-rebump-reads-surging], kind: []}
    status: decided
  - state: Staged
    event: member.targetChanged
    variants: [first]
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/staged-rebump-reads-surging], kind: []}
    status: decided
  - state: Staged
    event: member.targetChanged
    variants: [later]
    outcome: n/a
    reason: "a later member exists only under Sequential, whose bumps behind the active member are deferred, and a Sequential group never rests Staged"
    status: decided
  - state: Staged
    event: member.surgePodCreated
    windows: [before]
    outcome: transition
    to: Waiting
    guard: "a new-revision pod beyond the staged shape exists and is not Ready yet"
    note: "a lowered partition releases more Instances; once one is counted on the target the group reads Waiting until it is Ready and Staged again once the new shape holds"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/staged-released-instance-surges-reads-waiting], kind: []}
    status: decided
  - state: Staged
    event: member.surgePodCreated
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/staged-released-instance-surges-reads-waiting], kind: []}
    status: decided
  - state: Staged
    event: member.readyOnTarget
    outcome: ignore
    note: "the staged shape already has every unheld Instance Ready on the target; a further Ready pod keeps the rest"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/staged-another-ready-pod-keeps-staged], kind: []}
    status: decided
  - state: Staged
    event: member.capacityLost
    variants: [newRevision]
    windows: [before]
    outcome: transition
    to: Waiting
    guard: "a new-revision pod leaves readiness, so the member is no longer at its staged shape"
    note: "the staged shape requires the unheld Instances Ready on the target; the group reads Waiting until it holds again"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/staged-new-pod-unready-reads-waiting], kind: []}
    status: decided
  - state: Staged
    event: member.capacityLost
    variants: [newRevision]
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/staged-new-pod-unready-reads-waiting], kind: []}
    status: decided
  - state: Staged
    event: member.capacityLost
    variants: [oldRevision]
    windows: [before]
    outcome: transition
    to: Shifting
    guard: "a held old-revision Instance leaves readiness, so the member is no longer at its staged shape while its old pods remain"
    note: "the staged shape also requires the held Instances Ready on the prior revision; the group reads Shifting until the replica restores it"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/staged-held-pod-unready-reads-shifting], kind: []}
    status: decided
  - state: Staged
    event: member.capacityLost
    variants: [oldRevision]
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/staged-held-pod-unready-reads-shifting], kind: []}
    status: decided
  - state: Staged
    event: member.oldPodsGone
    windows: [before]
    outcome: transition
    to: ScalingDown
    guard: "the held old-revision pods are gone before the replica rebuilt them"
    note: "with no old pod the roll reads ScalingDown; the replica rebuilds the held Instances on the prior revision and the group returns to Staged"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/staged-held-pods-gone-reads-scalingdown], kind: []}
    status: decided
  - state: Staged
    event: member.oldPodsGone
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/staged-held-pods-gone-reads-scalingdown], kind: []}
    status: decided
  - state: Staged
    event: member.converged
    windows: [before]
    outcome: transition
    to: Idle
    guard: "the partition was cleared and every Instance reached the target, so the replica promoted its current revision"
    note: "a cleared partition rolls the held Instances on; the group passes through Shifting and ScalingDown and reads Idle on promotion"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_StagedNotWhenPartitionZero], kind: []}
    status: decided
  - state: Staged
    event: member.converged
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/idle-converged-members-keep-idle], kind: []}
    status: decided
  - state: Staged
    event: member.staged
    outcome: ignore
    note: "already at rest; RolloutCoordinationReady reads True with reason Staged"
    invariants: [staged.is.rest]
    placement: unit
    coverage: {perm: [], unit: [TestComputeCoordinationReady_Staged], kind: []}
    status: decided
  - state: Staged
    event: member.rollback
    windows: [before]
    outcome: transition
    to: Idle
    guard: "the member's target returned to its current revision"
    note: "the roll no longer reads in flight; the replica drains the abandoned revision's Instances and the group reads Idle at once"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/staged-rollback-reads-idle], kind: []}
    status: decided
  - state: Staged
    event: member.rollback
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/staged-rollback-reads-idle], kind: []}
    status: decided
  - state: Staged
    event: member.failed
    windows: [before]
    outcome: transition
    to: Failed
    guard: "an Instance row of a member reads Failed"
    note: "any Failed row marks the member Failed and every policy rolls that into the group's Failed phase, with the failed indices on the message and RolloutCoordinationReady False"
    invariants: [failed.is.not.latched]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_BlueGreenFailed, TestComputeTransition_RollingUpdateFailed, TestComputeTransition_IndependentFailed, TestBuildComponentObservation_AnyFailedInstanceMarksComponentFailed, TestBuildComponentObservation_FailedPropagatesThroughBlueGreen], kind: [sequential_failure_hold_kind_test.go]}
    status: decided
  - state: Staged
    event: member.failed
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/failed-staged-elsewhere-keeps-failed], kind: []}
    status: decided
  - state: Staged
    event: member.dark
    outcome: transition
    to: Waiting
    note: "a dark member's rows read Pending, so its staged shape no longer holds and its Instances on the target read unready; the group reads Waiting until the shape holds again, the same path as member.capacityLost"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/staged-dark-member-reads-waiting], kind: []}
    status: decided
  - state: Staged
    event: ratio.anchorMissing
    outcome: ignore
    note: "the anchor is snapshotted now from the members' replica counters once every member reports a positive count, and deferred to a later pass otherwise; until then the surge budget is the MaxSurge alone and no skew is possible"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestBuildRatioState_DefersSnapshotWhenStatusEmpty, TestBuildRatioState_PartiallyPopulatedStatusDefersSnapshot, TestBuildRatioState_AllAnchorsStaleFallsBackToSnapshot, TestCheckRatioGate_NoAnchorWithCompleteIRAllowed], kind: []}
    status: decided
  - state: Staged
    event: spec.pause
    windows: [before]
    outcome: transition
    to: Paused
    guard: "the pause annotation is set, with either accepted value"
    note: "the pause is checked before any member fact; pause and freeze hold the group identically, and the replica keeps repairing under a plain pause while a freeze stops it"
    invariants: [pause.holds.every.group]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PausedGlobal, TestComputeTransition_BlueGreenPaused], kind: [pause_midrollout_kind_test.go, sequential_pause_mid_kind_test.go, ratio_pause_resume_kind_test.go]}
    status: decided
  - state: Staged
    event: spec.pause
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestComputeTransition_PausedGlobal], kind: []}
    status: decided
  - state: Staged
    event: spec.groupEdited
    variants: [memberAdded]
    outcome: ignore
    note: "the member joins the group on the next pass; its anchor entry is added from its replica count once it reports one and the existing entries are untouched"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestBuildRatioState_LateMemberGainsAnchor, TestBuildRatioState_LateMemberWithZeroStatusDeferred], kind: [ratio_late_member_anchor_kind_test.go]}
    status: decided
  - state: Staged
    event: spec.groupEdited
    variants: [memberRemoved]
    outcome: ignore
    note: "the member's anchor entry is dropped so a stale entry cannot keep constraining the band, and the phase is recomputed over the remaining members"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestBuildRatioState_RemovedMemberAnchorDropped, TestCheckRatioGate_RemovedMemberStaleAnchorIgnored], kind: []}
    status: decided
  - state: Staged
    event: spec.groupEdited
    variants: [policyChanged]
    outcome: ignore
    note: "the group is re-resolved from the effective plan every pass under the same index-derived name, so its entry, anchor and transition time carry over and the phase is recomputed under the new policy from the same facts; BlueGreen and RollingUpdate rest Staged on the same rows, Independent reads Shifting for any roll"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/staged-under-rollingupdate, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/staged-under-independent-reads-shifting], kind: []}
    status: decided
  - state: Staged
    event: spec.groupEdited
    variants: [groupRemoved]
    windows: [before]
    outcome: transition
    to: Unobserved
    guard: "the group is absent from the effective plan"
    note: "entries absent from the freshly computed set are pruned, and with no coordination-style group left the whole status block and the RolloutCoordinationReady condition are cleared"
    placement: unit
    coverage: {perm: [], unit: [TestMergeAndPersistGroupStatuses_PrunesRemovedGroups, TestReconcile_ClearsStaleCoordinationStatusWhenGroupsGone], kind: []}
    status: decided
  - state: Staged
    event: spec.groupEdited
    variants: [groupRemoved]
    windows: [boundary, after]
    outcome: ignore
    note: "the entry is gone; a redeclared group starts Unobserved and is written at the phase its facts compute"
    placement: sim
    coverage: {perm: [], unit: [TestMergeAndPersistGroupStatuses_PrunesRemovedGroups], kind: [], replay: [idle-group-reads-each-fact-on-the-next-pass]}
    status: decided
  - state: Staged
    event: ir.readError
    outcome: defer
    note: "the pass fails before any group status is written, so the entry is untouched and the pass is retried; fabricating a zero observation would fake an Idle group and reset its soak anchor"
    placement: unit
    coverage: {perm: [], unit: [TestReconcile_IRReadErrorFailsReconcile], kind: []}
    status: decided
  - state: Staged
    event: ctrl.staleRead
    variants: [anchorMissing]
    outcome: transition
    to: Staged
    note: "today a copy with no anchor snapshots one from the replicas the pass sees and the flush copies it over the live anchor, so a scale between the anchor write and the stale pass moves the band to the new shape; which is wrong because anchor.kept.for.the.roll says the anchor is taken once and carried unchanged. Only the pass after the first observation can miss the anchor, which is written with the first entry"
    invariants: [anchor.kept.for.the.roll]
    placement: sim
    coverage: {perm: [], unit: [TestBuildRatioState_CopyWithoutAnchorSnapshotsTodaysReplicas], kind: []}
    status: decided
  - state: Staged
    event: ctrl.staleRead
    variants: [phaseRegressed]
    outcome: transition
    to: Staged
    note: "today the pass recomputes Staged from fresh facts, but the merge against a cached entry still at the previous phase sees the change again: it restamps lastTransitionTime to now, re-fires the transition event and the dwell metric, and the flush copies the restamped entry over the live one (shown on the other phases; the merge does not read which phase it restamps); which is wrong because transition.time.marks.base.phase says the time moves only when the base phase changes"
    invariants: [transition.time.marks.base.phase]
    placement: sim
    coverage: {perm: [], unit: [TestMergeGroupStatus_NewPhaseUpdatesTransitionTime, TestEmitPhaseEvents_OnlyOnTransition], kind: [], replay: [stale-copy-restamps-every-phase]}
    status: decided
  - state: Staged
    event: flush.staleOverwrite
    outcome: transition
    to: Staged
    note: "today the flush copies the pass's group entry over the live one with no preserve rule and no clock, so the live phase, composite, current and previous component, transition time and anchor become the pass's: a pass that read a stale copy rolls the live entry back at its boundary flush and restamps it at its final flush; which is wrong because the run pin and the canary record are preserved against a stale writer and the group entry is not (shown on the other phases; the flush does not read the phase)"
    placement: sim
    coverage: {perm: [], unit: [], kind: [], replay: [stale-copy-restamps-every-phase]}
    status: decided
  - state: Staged
    event: api.serviceWriteFailed
    variants: [ensure]
    outcome: defer
    note: "the per-revision Service write fails before the group is evaluated, whatever the phase; the pass fails for a retry and the entry stays as the previous pass wrote it"
    placement: unit
    coverage: {perm: [], unit: [TestReconcile_ServiceWriteFailureLeavesTheGroupEntry], kind: []}
    status: decided
  - state: Staged
    event: api.serviceWriteFailed
    variants: [namespaceTerminating]
    outcome: ignore
    note: "a create the apiserver refuses for a terminating namespace ends the pass cleanly before the group is evaluated; the entry stays as the previous pass wrote it and the service goes away with its namespace"
    placement: unit
    coverage: {perm: [], unit: [TestReconcile_NamespaceTerminatingStopsBeforeTheGroup], kind: []}
    status: decided
  - state: Staged
    event: api.conflict
    outcome: defer
    note: "a 409 on the status write is rebased onto the live object inside the pass and the group entry lands from the pass's copy; the Lifecycle, canary and run fields have preserve rules, the group fields do not"
    placement: unit
    coverage: {perm: [], unit: [], kind: [], replay: [apiserver-refusals-leave-the-group-entry]}
    status: decided
  - state: Staged
    event: spec.replicas
    windows: [before]
    outcome: transition
    to: Waiting
    guard: "the desired count changed, so the staged shape no longer holds while old pods remain"
    note: "the staged shape is re-judged at the new count: an added Instance is counted on the target before it has a Ready pod, so the group reads Waiting until it is Ready and Staged again once the shape at the new count holds; a removed Instance drops its row, and with no Instance left on the target the group reads Surging. The anchor is kept"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/staged-scale-up-reads-waiting, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/staged-scale-down-drops-the-target-rows-reads-surging], kind: []}
    status: decided
  - state: Staged
    event: spec.replicas
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/staged-scale-up-reads-waiting], kind: []}
    status: decided
  - state: Staged
    event: spec.partition
    variants: [set]
    windows: [before]
    outcome: transition
    to: Shifting
    guard: "the partition moved to another non-zero value"
    note: "the staged shape is re-judged against the new partition; the group reads Shifting or Waiting until it holds and Staged again"
    invariants: [staged.is.rest]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/staged-partition-moved-reads-shifting], kind: []}
    status: decided
  - state: Staged
    event: spec.partition
    variants: [cleared]
    windows: [before]
    outcome: transition
    to: Shifting
    guard: "the partition is zero, so the held Instances roll on"
    note: "a zero partition is never Staged; the group reads Shifting, then ScalingDown, then Idle when the replica promotes its current revision"
    invariants: [staged.is.rest]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_StagedNotWhenPartitionZero], kind: []}
    status: decided
  - state: Staged
    event: spec.partition
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/staged-partition-moved-reads-shifting], kind: []}
    status: decided
  - state: Staged
    event: ir.missing
    windows: [before]
    outcome: transition
    to: Idle
    guard: "the only rolling member's replica is gone, so it reads a zero observation"
    note: "a member with no InferenceReplica reads as a zero observation, not rolling and not failed, so the group recomputes over what is left and reads Idle when nothing else rolls"
    placement: unit
    coverage: {perm: [], unit: [TestReconcile_MissingReplicaReadsIdleOnTheNextPass, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/staged-only-rolling-member-missing-reads-idle], kind: []}
    status: decided
  - state: Staged
    event: ir.missing
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_MissingReplicaReadsIdleOnTheNextPass], kind: []}
    status: decided
  - state: Staged
    event: ir.stale
    outcome: ignore
    note: "the observation applies no freshness rule; a trailing counter can show Shifting or Waiting for a pass before Staged holds again, and the transition event fires on each such flap"
    placement: unit
    coverage: {perm: [], unit: [TestBuildComponentObservation_CountersTrailingThePodsReadTheCounters], kind: []}
    status: decided
  - state: Staged
    event: ctrl.resync
    outcome: ignore
    note: "the phase is recomputed and found unchanged; lastTransitionTime is kept, no event or metric fires, and the status write is skipped when nothing differs"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/staged-resync-keeps-staged, TestMergeGroupStatus_PreservesLastTransitionTimeOnSamePhase], kind: []}
    status: decided
  # --- Failed ----------------------------------------------------------------
  - state: Failed
    event: member.targetChanged
    variants: [first]
    outcome: ignore
    note: "Failed stands while any row reads Failed; a corrective target (roll forward to a fixed revision or back to the prior one) is what replaces the failed row through the replica, and the group exits on the pass that finds none"
    invariants: [failed.is.not.latched]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_FailedExitsOnRecovery], kind: [sequential_failure_hold_kind_test.go]}
    status: decided
  - state: Failed
    event: member.targetChanged
    variants: [later]
    outcome: ignore
    note: "under Sequential the chain is blocked: the composite phase reads Sequential.Failed naming the failed member and the replica-side gate holds every member after it until the failed one recovers"
    invariants: [one.rolls.at.a.time, failed.is.not.latched]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_SequentialFailedBlocks], kind: [sequential_failure_hold_kind_test.go]}
    status: decided
  - state: Failed
    event: member.surgePodCreated
    outcome: ignore
    note: "Failed is a rollup of rows; a new pod of another member changes nothing until no row reads Failed"
    invariants: [failed.is.not.latched]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/failed-surge-pod-elsewhere-keeps-failed], kind: [], replay: [failed-row-blocks-then-releases-the-pair]}
    status: decided
  - state: Failed
    event: member.readyOnTarget
    outcome: ignore
    note: "Failed is a rollup of rows; readiness elsewhere changes nothing until no row reads Failed"
    invariants: [failed.is.not.latched]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/failed-ready-target-elsewhere-keeps-failed], kind: [], replay: [failed-row-blocks-then-releases-the-pair]}
    status: decided
  - state: Failed
    event: member.oldPodsGone
    outcome: ignore
    note: "Failed is a rollup of rows; the old pods leaving changes nothing until no row reads Failed"
    invariants: [failed.is.not.latched]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/failed-old-pods-gone-elsewhere-keeps-failed], kind: [], replay: [failed-row-blocks-then-releases-the-pair]}
    status: decided
  - state: Failed
    event: member.converged
    outcome: ignore
    note: "Failed is a rollup of rows; a member converging changes nothing until no row reads Failed"
    invariants: [failed.is.not.latched]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/failed-converged-elsewhere-keeps-failed], kind: [], replay: [failed-row-blocks-then-releases-the-pair]}
    status: decided
  - state: Failed
    event: member.staged
    outcome: ignore
    note: "Failed is a rollup of rows; a staged shape elsewhere changes nothing until no row reads Failed"
    invariants: [failed.is.not.latched]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/failed-staged-elsewhere-keeps-failed], kind: []}
    status: decided
  - state: Failed
    event: member.rollback
    outcome: ignore
    note: "the revert itself clears no row; the replica's corrective roll replaces the failed row and the group exits on member.recovered"
    invariants: [failed.is.not.latched]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/failed-rollback-keeps-failed], kind: [], replay: [failed-row-blocks-then-releases-the-pair]}
    status: decided
  - state: Failed
    event: member.capacityLost
    outcome: ignore
    note: "Failed is a rollup of rows; a capacity loss elsewhere changes nothing until no row reads Failed"
    invariants: [failed.is.not.latched]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/failed-capacity-lost-keeps-failed], kind: []}
    status: decided
  - state: Failed
    event: member.failed
    outcome: ignore
