# Cells for the four rolling phases. The phase is recomputed on every pass
# from the members' replica counters and cached pods; BlueGreen moves as a
# gang, RollingUpdate as the union of its members, Independent reads
# Shifting throughout, and Sequential drives the active member through the
# BlueGreen phases (state.go blueGreenTransition, rollingUpdateTransition,
# independentTransition, sequentialTransition; ratio.go EvaluateSurge).

cells:
  # --- Surging ---------------------------------------------------------------
  - state: Surging
    event: member.targetChanged
    variants: [first]
    outcome: ignore
    note: "the member already rolls; a re-bump moves its target and its count on the target restarts at zero, so the group keeps reading Surging"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/surging-rebump-keeps-surging], kind: []}
    status: decided
  - state: Surging
    event: member.targetChanged
    variants: [later]
    outcome: ignore
    note: "under Sequential the bump is observed but deferred: a SequentialNextSpecBumpDeferred warning fires once per active member and the replica-side gate holds the later member until the members before it are done for handoff; outside Sequential the member simply joins the roll and the group phase is the union of the members' phases"
    invariants: [one.rolls.at.a.time]
    placement: unit
    coverage: {perm: [], unit: [TestEmitSequentialDeferred_FiresWhenLaterComponentAlsoBumped, TestEmitSequentialDeferred_DedupWhenActiveUnchanged, TestCheckSequentialGate_NonActiveComponentDenied], kind: [n3_sequential_kind_test.go]}
    status: decided
  - state: Surging
    event: member.surgePodCreated
    windows: [before]
    outcome: transition
    to: Waiting
    guard: "every rolling member now has a new-revision pod and not all of them are Ready"
    note: "BlueGreen moves on only when every member has a new pod; one member with a pod while another has none keeps Surging. RollingUpdate moves on when no rolling member lacks a pod"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_BlueGreenWaiting], kind: [bluegreen_kind_test.go]}
    status: decided
  - state: Surging
    event: member.surgePodCreated
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed], kind: [], replay: [scale-up-mid-roll-reads-shifting]}
    status: decided
  - state: Surging
    event: member.readyOnTarget
    windows: [before]
    outcome: transition
    to: Shifting
    guard: "every new-revision pod is Ready and old-revision pods remain"
    note: "the traffic writer moves weight by ready pods and the replica drains the old ones; ScalingDown when no old pod remains (T-surging-scalingdown)"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_BlueGreenShifting, TestComputeTransition_BlueGreenScalingDown], kind: [bluegreen_kind_test.go, ratiobalanced_kind_test.go]}
    status: decided
  - state: Surging
    event: member.readyOnTarget
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/idle-ready-target-observed-with-the-bump], kind: []}
    status: decided
  - state: Surging
    event: member.capacityLost
    variants: [newRevision]
    outcome: ignore
    note: "the lost pod is the replica's to replace; a member with no Instance on the target is what Surging already means, and an unready one elsewhere keeps it"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/surging-new-pod-unready-elsewhere-keeps-surging], kind: []}
    status: decided
  - state: Surging
    event: member.capacityLost
    variants: [oldRevision]
    outcome: ignore
    note: "old-side capacity does not pick the phase; it moves the traffic weights and feeds the ratio and unavailability gates on the replica side"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/surging-old-capacity-lost-keeps-surging], kind: []}
    status: decided
  - state: Surging
    event: member.oldPodsGone
    outcome: ignore
    note: "under a drain-first strategy the old pod leaves before the new one exists; the phase keys on the Instances counted on the target, and the roll reads ScalingDown rather than Shifting once they are Ready"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/surging-old-pods-gone-first-keeps-surging], kind: []}
    status: decided
  - state: Surging
    event: member.converged
    windows: [before]
    outcome: transition
    to: Idle
    guard: "no member's target differs from its current revision any more"
    note: "the replica promotes its current revision once every row is on the target; BlueGreen, RollingUpdate and Independent read Idle with a CoordinationGroupCompleted event; Sequential hands off instead: Awaiting when the next member is not bumped or a soak runs (T-surging-seq-await), the next member's phase when it rolls and no soak holds"
    invariants: [phase.follows.members]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_RollingUpdateIdle, TestComputeTransition_SequentialAwaitingNext, TestComputeTransition_SequentialNextStartsAfterPrevious], kind: [bluegreen_kind_test.go, sequential_kind_test.go], replay: [sequential-handoff-on-stale-copy]}
    status: decided
  - state: Surging
    event: member.converged
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed], kind: [], replay: [apiserver-refusals-leave-the-group-entry]}
    status: decided
  - state: Surging
    event: member.staged
    windows: [before]
    outcome: transition
    to: Staged
    guard: "every rolling member is at its staged shape and at least one holds old Instances under a non-zero partition"
    note: "the group rests instead of churning Shifting and ScalingDown forever; under Sequential the staged member is skipped for handoff and the group reads Awaiting or the next member's phase instead"
    invariants: [staged.is.rest]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_BlueGreenStaged, TestComputeTransition_RollingUpdateStaged, TestComputeTransition_StagedNotWhenMidRoll, TestComputeTransition_SequentialHandsOffOnStaged], kind: [runtime_partition_sequential_kind_test.go]}
    status: decided
  - state: Surging
    event: member.staged
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestComputeTransition_BlueGreenStaged], kind: []}
    status: decided
  - state: Surging
    event: member.rollback
    windows: [before]
    outcome: transition
    to: Idle
    guard: "the member's target returned to its current revision"
    note: "the roll no longer reads in flight, so the group reads Idle at once while the replica drains the abandoned revision's pods; the group never reads RollingBack"
    placement: unit
    coverage: {perm: [], unit: [], kind: [cancel_midrollout_kind_test.go, rolling_cancel_revert_kind_test.go]}
    status: decided
  - state: Surging
    event: member.rollback
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/staged-rollback-reads-idle], kind: []}
    status: decided
  - state: Surging
    event: member.failed
    windows: [before]
    outcome: transition
    to: Failed
    guard: "an Instance row of a member reads Failed"
    note: "any Failed row marks the member Failed and every policy rolls that into the group's Failed phase, with the failed indices on the message and RolloutCoordinationReady False"
    invariants: [failed.is.not.latched]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_BlueGreenFailed, TestComputeTransition_RollingUpdateFailed, TestComputeTransition_IndependentFailed, TestBuildComponentObservation_AnyFailedInstanceMarksComponentFailed, TestBuildComponentObservation_FailedPropagatesThroughBlueGreen], kind: [sequential_failure_hold_kind_test.go]}
    status: decided
  - state: Surging
    event: member.failed
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed], kind: [], replay: [failed-row-blocks-then-releases-the-pair]}
    status: decided
  - state: Surging
    event: member.dark
    outcome: ignore
    note: "a rolling member with no pod at all is what Surging means; a dark member outside the roll with no Failed row keeps it, since a member with no Instance on the target already holds the group here"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/surging-dark-settled-member-keeps-surging], kind: []}
    status: decided
  - state: Surging
    event: ratio.met
    outcome: ignore
    note: "the surge budget admits the next step and no skew is recorded; the replica-side gate opens on its own live read and the group phase does not move"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/surging-ratio-admits-the-step-keeps-surging, TestComputeSurgeBudgetWithRatio_UsesServingPodsBaseline], kind: []}
    status: decided
  - state: Surging
    event: ratio.lost
    outcome: ignore
    note: "the member's surge budget is zeroed, RatioSkewRejected fires as an event and a counter on every pass while the skew stands, and the phase does not move; the band projects live serving capacity against the anchor, and a leading member is held until its peer's new-revision progress catches up"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestComputeSurgeBudgetWithRatio_UsesServingPodsBaseline, TestComputeSurgeBudgetWithRatio_NewPodsBaselineWouldDeadlock, TestEvaluateUpdateGate_RatioBalancedHoldsLeadingComponent, TestEvaluateSurge_AlreadySkewedRejectsAnyFurtherSurge], kind: [ratiobalanced_kind_test.go, ratio_n3_kind_test.go]}
    status: decided
  - state: Surging
    event: ratio.anchorMissing
    outcome: ignore
    note: "the anchor is snapshotted now from the members' replica counters once every member reports a positive count, and deferred to a later pass otherwise; until then the surge budget is the MaxSurge alone and no skew is possible"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestBuildRatioState_DefersSnapshotWhenStatusEmpty, TestBuildRatioState_PartiallyPopulatedStatusDefersSnapshot, TestBuildRatioState_AllAnchorsStaleFallsBackToSnapshot, TestCheckRatioGate_NoAnchorWithCompleteIRAllowed], kind: []}
    status: decided
  - state: Surging
    event: spec.pause
    windows: [before]
    outcome: transition
    to: Paused
    guard: "the pause annotation is set, with either accepted value"
    note: "the pause is checked before any member fact; pause and freeze hold the group identically, and the replica keeps repairing under a plain pause while a freeze stops it"
    invariants: [pause.holds.every.group]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PausedGlobal, TestComputeTransition_BlueGreenPaused], kind: [pause_midrollout_kind_test.go, sequential_pause_mid_kind_test.go, ratio_pause_resume_kind_test.go]}
    status: decided
  - state: Surging
    event: spec.pause
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestComputeTransition_PausedGlobal], kind: []}
    status: decided
  - state: Surging
    event: spec.groupEdited
    variants: [memberAdded]
    outcome: ignore
    note: "the member joins the group on the next pass; its anchor entry is added from its replica count once it reports one and the existing entries are untouched"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestBuildRatioState_LateMemberGainsAnchor, TestBuildRatioState_LateMemberWithZeroStatusDeferred], kind: [ratio_late_member_anchor_kind_test.go]}
    status: decided
  - state: Surging
    event: spec.groupEdited
    variants: [memberRemoved]
    outcome: ignore
    note: "the member's anchor entry is dropped so a stale entry cannot keep constraining the band, and the phase is recomputed over the remaining members"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestBuildRatioState_RemovedMemberAnchorDropped, TestCheckRatioGate_RemovedMemberStaleAnchorIgnored], kind: []}
    status: decided
  - state: Surging
    event: spec.groupEdited
    variants: [policyChanged]
    outcome: ignore
    note: "the group is re-resolved from the effective plan every pass under the same index-derived name, so its entry, anchor and transition time carry over and the phase is recomputed under the new policy from the same facts; BlueGreen and RollingUpdate read Surging, Independent reads Shifting for any roll"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/surging-under-rollingupdate, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/surging-under-independent-reads-shifting], kind: []}
    status: decided
  - state: Surging
    event: spec.groupEdited
    variants: [groupRemoved]
    windows: [before]
    outcome: transition
    to: Unobserved
    guard: "the group is absent from the effective plan"
    note: "entries absent from the freshly computed set are pruned, and with no coordination-style group left the whole status block and the RolloutCoordinationReady condition are cleared"
    placement: unit
    coverage: {perm: [], unit: [TestMergeAndPersistGroupStatuses_PrunesRemovedGroups, TestReconcile_ClearsStaleCoordinationStatusWhenGroupsGone], kind: []}
    status: decided
  - state: Surging
    event: spec.groupEdited
    variants: [groupRemoved]
    windows: [boundary, after]
    outcome: ignore
    note: "the entry is gone; a redeclared group starts Unobserved and is written at the phase its facts compute"
    placement: sim
    coverage: {perm: [], unit: [TestMergeAndPersistGroupStatuses_PrunesRemovedGroups], kind: [], replay: [idle-group-reads-each-fact-on-the-next-pass]}
    status: decided
  - state: Surging
    event: ir.readError
    outcome: defer
    note: "the pass fails before any group status is written, so the entry is untouched and the pass is retried; fabricating a zero observation would fake an Idle group and reset its soak anchor"
    placement: unit
    coverage: {perm: [], unit: [TestReconcile_IRReadErrorFailsReconcile], kind: []}
    status: decided
  - state: Surging
    event: ctrl.staleRead
    variants: [anchorMissing]
    outcome: transition
    to: Surging
    note: "today a copy with no anchor snapshots one from the replicas the pass sees and the flush copies it over the live anchor, so a scale between the anchor write and the stale pass moves the band to the new shape; which is wrong because anchor.kept.for.the.roll says the anchor is taken once and carried unchanged. Only the pass after the first observation can miss the anchor, which is written with the first entry"
    invariants: [anchor.kept.for.the.roll]
    placement: sim
    coverage: {perm: [], unit: [TestBuildRatioState_CopyWithoutAnchorSnapshotsTodaysReplicas], kind: []}
    status: decided
  - state: Surging
    event: ctrl.staleRead
    variants: [phaseRegressed]
    outcome: transition
    to: Surging
    note: "today the pass recomputes Surging from fresh facts, but the merge against a cached entry still at the previous phase sees the change again: it restamps lastTransitionTime to now, re-fires the transition event and the dwell metric, and the flush copies the restamped entry over the live one; which is wrong because transition.time.marks.base.phase says the time moves only when the base phase changes"
    invariants: [transition.time.marks.base.phase]
    placement: sim
    coverage: {perm: [], unit: [TestMergeGroupStatus_NewPhaseUpdatesTransitionTime, TestEmitPhaseEvents_OnlyOnTransition], kind: [], replay: [flush-overwrites-group-fields, stale-copy-restamps-every-phase]}
    status: decided
  - state: Surging
    event: flush.staleOverwrite
    outcome: transition
    to: Surging
    note: "today the flush copies the pass's group entry over the live one with no preserve rule and no clock, so the live phase, composite, current and previous component, transition time and anchor become the pass's: a pass that read a stale copy rolls the live entry back at its boundary flush and restamps it at its final flush; which is wrong because the run pin and the canary record are preserved against a stale writer and the group entry is not"
    placement: sim
    coverage: {perm: [], unit: [], kind: [], replay: [flush-overwrites-group-fields, stale-copy-restamps-every-phase]}
    status: decided
  - state: Surging
    event: api.serviceWriteFailed
    variants: [ensure]
    outcome: defer
    note: "the per-revision Service write fails before the group is evaluated, whatever the phase; the pass fails for a retry and the entry stays as the previous pass wrote it"
    placement: unit
    coverage: {perm: [], unit: [TestReconcile_ServiceWriteFailureLeavesTheGroupEntry], kind: [], replay: [apiserver-refusals-leave-the-group-entry]}
    status: decided
  - state: Surging
    event: api.serviceWriteFailed
    variants: [namespaceTerminating]
    outcome: ignore
    note: "a create the apiserver refuses for a terminating namespace ends the pass cleanly before the group is evaluated; the entry stays as the previous pass wrote it and the service goes away with its namespace"
    placement: unit
    coverage: {perm: [], unit: [TestReconcile_NamespaceTerminatingStopsBeforeTheGroup], kind: [], replay: [apiserver-refusals-leave-the-group-entry]}
    status: decided
  - state: Surging
    event: api.conflict
    outcome: defer
    note: "a 409 on the status write is rebased onto the live object inside the pass and the group entry lands from the pass's copy; the Lifecycle, canary and run fields have preserve rules, the group fields do not"
    placement: unit
    coverage: {perm: [], unit: [], kind: [], replay: [apiserver-refusals-leave-the-group-entry]}
    status: decided
  - state: Surging
    event: spec.replicas
    variants: [up]
    outcome: ignore
    note: "the phase keys on revisions and readiness, not on counts; the anchor is kept so the band is measured against the shape the roll began with, and the gate reads the new desired count from the replica spec"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestBuildRatioState_PreservesAlreadyRecordedAnchor], kind: [scale_during_rollout_kind_test.go]}
    status: decided
  - state: Surging
    event: spec.replicas
    variants: [down]
    outcome: ignore
    note: "the phase keys on revisions and readiness, not on counts; the anchor is kept across a deliberate scale-down so the band is not re-anchored to the smaller shape"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestBuildRatioState_PreservesAlreadyRecordedAnchor], kind: [ratio_anchor_scaledown_kind_test.go]}
    status: decided
  - state: Surging
    event: spec.partition
    variants: [set]
    outcome: ignore
    note: "the partition takes effect through the replica, which stops the roll at the staged shape; the phase keys on the rows and reads Staged only once the shape holds (member.staged)"
    invariants: [staged.is.rest]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/surging-partition-set-keeps-surging], kind: []}
    status: decided
  - state: Surging
    event: spec.partition
    variants: [cleared]
    outcome: ignore
    note: "the held Instances roll on through the replica; the phase keys on the rows and the group leaves through member.converged"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/surging-partition-cleared-keeps-surging], kind: []}
    status: decided
  - state: Surging
    event: ir.missing
    windows: [before]
    outcome: transition
    to: Idle
    guard: "the only rolling member's replica is gone, so it reads a zero observation"
    note: "a member with no InferenceReplica reads as a zero observation, not rolling and not failed, so the group recomputes over what is left and reads Idle when nothing else rolls"
    placement: unit
    coverage: {perm: [], unit: [TestReconcile_MissingReplicaReadsIdleOnTheNextPass, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/surging-only-rolling-member-missing-reads-idle], kind: []}
    status: decided
  - state: Surging
    event: ir.missing
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_MissingReplicaReadsIdleOnTheNextPass], kind: []}
    status: decided
  - state: Surging
    event: ir.stale
    outcome: ignore
    note: "today the counters are taken as the replica published them while the pod totals come from the cache, so a replica whose counters trail the pods reads the counters' phase for that pass and moves on the next; which is wrong because the transition event and the dwell metric fire on each such flap while the replica-side gate waits for a fresh replica"
    placement: unit
    coverage: {perm: [], unit: [TestBuildComponentObservation_CountersTrailingThePodsReadTheCounters], kind: []}
    status: decided
  - state: Surging
    event: ctrl.resync
    outcome: ignore
    note: "the phase is recomputed and found unchanged; lastTransitionTime is kept, no event or metric fires, and the status write is skipped when nothing differs"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/surging-resync-keeps-surging, TestMergeGroupStatus_PreservesLastTransitionTimeOnSamePhase], kind: [], replay: [open-and-close]}
    status: decided
  # --- Waiting ---------------------------------------------------------------
  - state: Waiting
    event: member.targetChanged
    variants: [first]
    windows: [before]
    outcome: transition
    to: Surging
    guard: "a member's target moves to a revision with no pod yet, or a member outside Sequential joins the roll"
    note: "the group phase is the union of its members: a member with no Instance on the target pulls BlueGreen and RollingUpdate back to Surging; Independent keeps reading Shifting"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/waiting-rebump-reads-surging, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/waiting-member-joining-the-roll-reads-surging], kind: []}
    status: decided
  - state: Waiting
    event: member.targetChanged
    variants: [first]
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/waiting-rebump-reads-surging], kind: []}
    status: decided
  - state: Waiting
    event: member.targetChanged
    variants: [later]
    outcome: ignore
    note: "under Sequential the bump is observed but deferred: a SequentialNextSpecBumpDeferred warning fires once per active member and the replica-side gate holds the later member until the members before it are done for handoff; outside Sequential the member simply joins the roll and the group phase is the union of the members' phases"
    invariants: [one.rolls.at.a.time]
    placement: unit
    coverage: {perm: [], unit: [TestEmitSequentialDeferred_FiresWhenLaterComponentAlsoBumped, TestEmitSequentialDeferred_DedupWhenActiveUnchanged, TestCheckSequentialGate_NonActiveComponentDenied], kind: [n3_sequential_kind_test.go]}
    status: decided
  - state: Waiting
    event: member.surgePodCreated
    outcome: ignore
    note: "another Instance counted on the target; the group keeps waiting for all of them to be Ready"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/waiting-further-new-pod-keeps-waiting], kind: [], replay: [scale-up-mid-roll-reads-shifting]}
    status: decided
  - state: Waiting
    event: member.readyOnTarget
    windows: [before]
    outcome: transition
    to: Shifting
    guard: "every new-revision pod is Ready and old-revision pods remain"
    note: "the traffic writer moves weight by ready pods and the replica drains the old ones; ScalingDown when no old pod remains (T-waiting-scalingdown)"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_BlueGreenShifting, TestComputeTransition_BlueGreenScalingDown], kind: [bluegreen_kind_test.go, ratiobalanced_kind_test.go]}
    status: decided
  - state: Waiting
    event: member.readyOnTarget
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed], kind: [], replay: [stale-copy-restamps-every-phase, scale-up-mid-roll-reads-shifting]}
    status: decided
  - state: Waiting
    event: member.capacityLost
    variants: [newRevision]
    windows: [before]
    outcome: transition
    to: Surging
    guard: "a rolling member's new-revision pods are all gone"
    note: "with no Instance left on the target the member reads as not yet surged; a pod merely unready keeps the group Waiting"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/waiting-new-pods-all-gone-reads-surging], kind: []}
    status: decided
  - state: Waiting
    event: member.capacityLost
    variants: [newRevision]
    windows: [boundary, after]
    outcome: ignore
