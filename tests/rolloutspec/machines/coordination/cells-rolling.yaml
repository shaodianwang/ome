    invariants: [one.rolls.at.a.time]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_SequentialNextStartsAfterPrevious, TestComputeTransition_SequentialNoSoakRunsImmediately, TestActiveSequentialComponent_PicksFirstInFlight], kind: [sequential_kind_test.go, n3_sequential_kind_test.go]}
    status: decided
  - state: ScalingDown
    event: seq.nextTurn
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestComputeTransition_SequentialNextStartsAfterPrevious], kind: []}
    status: decided
  - state: ScalingDown
    event: spec.pause
    windows: [before]
    outcome: transition
    to: Paused
    guard: "the pause annotation is set, with either accepted value"
    note: "the pause is checked before any member fact; pause and freeze hold the group identically, and the replica keeps repairing under a plain pause while a freeze stops it"
    invariants: [pause.holds.every.group]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PausedGlobal, TestComputeTransition_BlueGreenPaused], kind: [pause_midrollout_kind_test.go, sequential_pause_mid_kind_test.go, ratio_pause_resume_kind_test.go]}
    status: decided
  - state: ScalingDown
    event: spec.pause
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_EachPassWritesThePhaseItsOwnReadComputed, TestComputeTransition_PausedGlobal], kind: []}
    status: decided
  - state: ScalingDown
    event: spec.groupEdited
    variants: [memberAdded]
    outcome: ignore
    note: "the member joins the group on the next pass; its anchor entry is added from its replica count once it reports one and the existing entries are untouched"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestBuildRatioState_LateMemberGainsAnchor, TestBuildRatioState_LateMemberWithZeroStatusDeferred], kind: [ratio_late_member_anchor_kind_test.go]}
    status: decided
  - state: ScalingDown
    event: spec.groupEdited
    variants: [memberRemoved]
    outcome: ignore
    note: "the member's anchor entry is dropped so a stale entry cannot keep constraining the band, and the phase is recomputed over the remaining members"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestBuildRatioState_RemovedMemberAnchorDropped, TestCheckRatioGate_RemovedMemberStaleAnchorIgnored], kind: []}
    status: decided
  - state: ScalingDown
    event: spec.groupEdited
    variants: [policyChanged]
    outcome: ignore
    note: "the group is re-resolved from the effective plan every pass under the same index-derived name, so its entry, anchor and transition time carry over and the phase is recomputed under the new policy from the same facts; RollingUpdate labels the step with no old pod left Shifting and the step with old pods still up ScalingDown, the reverse of BlueGreen, and Independent reads Shifting for any roll"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/scalingdown-under-rollingupdate-reads-shifting], kind: []}
    status: decided
  - state: ScalingDown
    event: spec.groupEdited
    variants: [groupRemoved]
    windows: [before]
    outcome: transition
    to: Unobserved
    guard: "the group is absent from the effective plan"
    note: "entries absent from the freshly computed set are pruned, and with no coordination-style group left the whole status block and the RolloutCoordinationReady condition are cleared"
    placement: unit
    coverage: {perm: [], unit: [TestMergeAndPersistGroupStatuses_PrunesRemovedGroups, TestReconcile_ClearsStaleCoordinationStatusWhenGroupsGone], kind: []}
    status: decided
  - state: ScalingDown
    event: spec.groupEdited
    variants: [groupRemoved]
    windows: [boundary, after]
    outcome: ignore
    note: "the entry is gone; a redeclared group starts Unobserved and is written at the phase its facts compute"
    placement: sim
    coverage: {perm: [], unit: [TestMergeAndPersistGroupStatuses_PrunesRemovedGroups], kind: [], replay: [idle-group-reads-each-fact-on-the-next-pass]}
    status: decided
  - state: ScalingDown
    event: ir.readError
    outcome: defer
    note: "the pass fails before any group status is written, so the entry is untouched and the pass is retried; fabricating a zero observation would fake an Idle group and reset its soak anchor"
    placement: unit
    coverage: {perm: [], unit: [TestReconcile_IRReadErrorFailsReconcile], kind: []}
    status: decided
  - state: ScalingDown
    event: ctrl.staleRead
    variants: [anchorMissing]
    outcome: transition
    to: ScalingDown
    note: "today a copy with no anchor snapshots one from the replicas the pass sees and the flush copies it over the live anchor, so a scale between the anchor write and the stale pass moves the band to the new shape; which is wrong because anchor.kept.for.the.roll says the anchor is taken once and carried unchanged. Only the pass after the first observation can miss the anchor, which is written with the first entry"
    invariants: [anchor.kept.for.the.roll]
    placement: sim
    coverage: {perm: [], unit: [TestBuildRatioState_CopyWithoutAnchorSnapshotsTodaysReplicas], kind: []}
    status: decided
  - state: ScalingDown
    event: ctrl.staleRead
    variants: [phaseRegressed]
    outcome: transition
    to: ScalingDown
    note: "today the pass recomputes ScalingDown from fresh facts, but the merge against a cached entry still at the previous phase sees the change again: it restamps lastTransitionTime to now, re-fires the transition event and the dwell metric, and the flush copies the restamped entry over the live one; which is wrong because transition.time.marks.base.phase says the time moves only when the base phase changes"
    invariants: [transition.time.marks.base.phase]
    placement: sim
    coverage: {perm: [], unit: [TestMergeGroupStatus_NewPhaseUpdatesTransitionTime, TestEmitPhaseEvents_OnlyOnTransition], kind: [], replay: [stale-copy-restamps-every-phase]}
    status: decided
  - state: ScalingDown
    event: flush.staleOverwrite
    outcome: transition
    to: ScalingDown
    note: "today the flush copies the pass's group entry over the live one with no preserve rule and no clock, so the live phase, composite, current and previous component, transition time and anchor become the pass's: a pass that read a stale copy rolls the live entry back at its boundary flush and restamps it at its final flush; which is wrong because the run pin and the canary record are preserved against a stale writer and the group entry is not"
    placement: sim
    coverage: {perm: [], unit: [], kind: [], replay: [stale-copy-restamps-every-phase]}
    status: decided
  - state: ScalingDown
    event: api.serviceWriteFailed
    variants: [ensure]
    outcome: defer
    note: "the per-revision Service write fails before the group is evaluated, whatever the phase; the pass fails for a retry and the entry stays as the previous pass wrote it"
    placement: unit
    coverage: {perm: [], unit: [TestReconcile_ServiceWriteFailureLeavesTheGroupEntry], kind: []}
    status: decided
  - state: ScalingDown
    event: api.serviceWriteFailed
    variants: [namespaceTerminating]
    outcome: ignore
    note: "a create the apiserver refuses for a terminating namespace ends the pass cleanly before the group is evaluated; the entry stays as the previous pass wrote it and the service goes away with its namespace"
    placement: unit
    coverage: {perm: [], unit: [TestReconcile_NamespaceTerminatingStopsBeforeTheGroup], kind: []}
    status: decided
  - state: ScalingDown
    event: api.conflict
    outcome: defer
    note: "a 409 on the status write is rebased onto the live object inside the pass and the group entry lands from the pass's copy; the Lifecycle, canary and run fields have preserve rules, the group fields do not"
    placement: unit
    coverage: {perm: [], unit: [], kind: [], replay: [apiserver-refusals-leave-the-group-entry]}
    status: decided
  - state: ScalingDown
    event: spec.replicas
    variants: [up]
    outcome: ignore
    note: "the phase keys on revisions and readiness, not on counts; the anchor is kept so the band is measured against the shape the roll began with, and the gate reads the new desired count from the replica spec"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestBuildRatioState_PreservesAlreadyRecordedAnchor], kind: [scale_during_rollout_kind_test.go]}
    status: decided
  - state: ScalingDown
    event: spec.replicas
    variants: [down]
    outcome: ignore
    note: "the phase keys on revisions and readiness, not on counts; the anchor is kept across a deliberate scale-down so the band is not re-anchored to the smaller shape"
    invariants: [anchor.kept.for.the.roll]
    placement: unit
    coverage: {perm: [], unit: [TestBuildRatioState_PreservesAlreadyRecordedAnchor], kind: [ratio_anchor_scaledown_kind_test.go]}
    status: decided
  - state: ScalingDown
    event: spec.partition
    variants: [set]
    outcome: ignore
    note: "the partition takes effect through the replica, which stops the roll at the staged shape; the phase keys on the rows and reads Staged only once the shape holds (member.staged)"
    invariants: [staged.is.rest]
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/scalingdown-partition-set-keeps-scalingdown], kind: []}
    status: decided
  - state: ScalingDown
    event: spec.partition
    variants: [cleared]
    outcome: ignore
    note: "the held Instances roll on through the replica; the phase keys on the rows and the group leaves through member.converged"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/scalingdown-partition-cleared-keeps-scalingdown], kind: []}
    status: decided
  - state: ScalingDown
    event: ir.missing
    windows: [before]
    outcome: transition
    to: Idle
    guard: "the only rolling member's replica is gone, so it reads a zero observation"
    note: "a member with no InferenceReplica reads as a zero observation, not rolling and not failed, so the group recomputes over what is left and reads Idle when nothing else rolls"
    placement: unit
    coverage: {perm: [], unit: [TestReconcile_MissingReplicaReadsIdleOnTheNextPass, TestComputeTransition_PhaseFollowsTheMembersFromEveryState/scalingdown-only-rolling-member-missing-reads-idle], kind: []}
    status: decided
  - state: ScalingDown
    event: ir.missing
    windows: [boundary, after]
    outcome: ignore
    note: "the phase is written once per pass from the facts the pass read; a fact that lands after that read is the next pass's, which recomputes the phase from it"
    placement: sim
    coverage: {perm: [], unit: [TestReconcile_MissingReplicaReadsIdleOnTheNextPass], kind: []}
    status: decided
  - state: ScalingDown
    event: ir.stale
    outcome: ignore
    note: "today the counters are taken as the replica published them while the pod totals come from the cache, so a replica whose counters trail the pods reads the counters' phase for that pass and moves on the next; which is wrong because the transition event and the dwell metric fire on each such flap while the replica-side gate waits for a fresh replica"
    placement: unit
    coverage: {perm: [], unit: [TestBuildComponentObservation_CountersTrailingThePodsReadTheCounters], kind: []}
    status: decided
  - state: ScalingDown
    event: ctrl.resync
    outcome: ignore
    note: "the phase is recomputed and found unchanged; lastTransitionTime is kept, no event or metric fires, and the status write is skipped when nothing differs"
    placement: unit
    coverage: {perm: [], unit: [TestComputeTransition_PhaseFollowsTheMembersFromEveryState/scalingdown-resync-keeps-scalingdown, TestMergeGroupStatus_PreservesLastTransitionTimeOnSamePhase], kind: []}
    status: decided
