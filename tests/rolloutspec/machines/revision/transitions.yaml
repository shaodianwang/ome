# Edges of the record. A write that lands the record on the running revision
# settles it; the replica moving past the record puts it behind; the fleet
# leaving the recorded revision puts it ahead; a run's pin and close move
# the Component between the pinned shapes and the record shapes.
transitions:
  - {id: T-empty-settle-coord, from: Empty, event: write.coordRolledOut, guard: "exactly one revision has Ready pods on a coordination-owned Component", to: Settled, effects: [latestRolledout and latestReady written, previous stays empty], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/coordination/traffic.go}
  - {id: T-empty-settle-canary, from: Empty, event: write.canarySettled, guard: "no ladder is active and the member's replica settled on one revision with a Ready pod", to: Settled, effects: [latestRolledout and latestReady written], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/revisions.go}
  - {id: T-empty-pin-stable, from: Empty, event: run.open, variant: stableFromCurrentOffPin, guard: "the replica's current revision differs from the pinned target", to: Pinned/Stable, effects: [the pin carries the replica's current revision as stable], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/rolloutrun/rolloutrun.go}
  - {id: T-empty-pin-nostable, from: Empty, event: run.open, variant: stableUnknown, guard: "the replica has no current revision and no record answers", to: Pinned/NoStable, effects: [the pin carries no stable, so no ladder arms], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/rolloutrun/rolloutrun.go}
  - {id: T-settled-behind, from: Settled, event: replica.currentPromoted, guard: "the replica promoted a current revision the record does not name yet", to: Behind, decided_in: pkg/controller/v1beta1/workload/status/aggregate.go}
  - {id: T-settled-behind-ready, from: Settled, event: write.canaryReady, guard: "a canary target gained Ready capacity while the record names the stable revision", to: Behind, effects: [latestReady leads latestRolledout], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/revisions.go}
  - {id: T-settled-ahead, from: Settled, event: replica.currentWithdrawn, guard: "an Instance is off the recorded revision while current equals update", to: Ahead, decided_in: pkg/controller/v1beta1/workload/status/aggregate.go}
  - {id: T-settled-ahead-scope, from: Settled, event: scope.rotated, guard: "the replica was re-projected under a new scope", to: Ahead, effects: [the record names a hash no retained ControllerRevision carries], decided_in: pkg/controller/v1beta1/inferencereplica/reconciler.go}
  - {id: T-settled-empty, from: Settled, event: write.modeSwitch, guard: "the Component leaves the OMENative mode", to: Empty, effects: [the three fields and the phase cleared live], decided_in: pkg/controller/v1beta1/inferenceservice/cleanup.go}
  - {id: T-settled-pin-stable, from: Settled, event: run.open, guard: "a run opens with a target off the record and the chooser answers a stable the history carries", to: Pinned/Stable, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/rolloutrun/rolloutrun.go}
  - {id: T-settled-pin-disagrees, from: Settled, event: run.open, variant: stableFromLatestRolledout, guard: "the chooser falls to a record that names a revision no retained ControllerRevision the replica controls carries", to: Pinned/Disagrees, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/rolloutrun/rolloutrun.go}
  - {id: T-behind-settle-coord, from: Behind, event: write.coordRolledOut, guard: "exactly one revision has Ready pods", to: Settled, effects: [the prior latest demoted to previous], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/coordination/traffic.go}
  - {id: T-behind-settle-promoted, from: Behind, event: write.canaryPromoted, guard: "the cutover landed on every member", to: Settled, effects: [the pre-canary stable recorded as previous], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/revisions.go}
  - {id: T-behind-settle-canary, from: Behind, event: write.canarySettled, guard: "no ladder is active and the member settled on one revision", to: Settled, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/revisions.go}
  - {id: T-behind-empty, from: Behind, event: write.modeSwitch, guard: "the Component leaves the OMENative mode", to: Empty, decided_in: pkg/controller/v1beta1/inferenceservice/cleanup.go}
  - {id: T-behind-pin-stable, from: Behind, event: run.open, guard: "a run opens while the record trails the replica; the replica answers the stable", to: Pinned/Stable, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/rolloutrun/rolloutrun.go}
  - {id: T-ahead-settle-coord, from: Ahead, event: write.coordRolledOut, guard: "exactly one revision has Ready pods", to: Settled, effects: [the revision the fleet left demoted to previous], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/coordination/traffic.go}
  - {id: T-ahead-settle-rolledback, from: Ahead, event: write.canaryRolledBack, guard: "the revert completed on every member", to: Settled, effects: [the stable revision recorded as latest], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/revisions.go}
  - {id: T-ahead-settle-canary, from: Ahead, event: write.canarySettled, guard: "no ladder is active and the member settled on one revision", to: Settled, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/revisions.go}
  - {id: T-ahead-empty, from: Ahead, event: write.modeSwitch, guard: "the Component leaves the OMENative mode", to: Empty, decided_in: pkg/controller/v1beta1/inferenceservice/cleanup.go}
  - {id: T-ahead-pin-stable, from: Ahead, event: run.open, guard: "the replica's current revision answers the stable off the pin", to: Pinned/Stable, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/rolloutrun/rolloutrun.go}
  - {id: T-ahead-pin-disagrees, from: Ahead, event: run.open, variant: stableFromLatestRolledout, guard: "the chooser falls to the record, which names a revision no Instance runs", to: Pinned/Disagrees, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/rolloutrun/rolloutrun.go}
  - {id: T-pinned-close-completed, from: Pinned/Stable, event: run.close, variant: completed, guard: "every pinned member converged on the target", to: Settled, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/rolloutrun/rolloutrun.go}
  - {id: T-pinned-close-rolledback, from: Pinned/Stable, event: run.close, variant: rolledBack, guard: "the unit's revert settled", to: Settled, effects: [the stable revision owns the record again], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/rolloutrun/rolloutrun.go}
  - {id: T-pinned-retarget, from: Pinned/Stable, event: run.retarget, guard: "a new target supersedes the run; the pinned stable is carried for a moved Component", to: Pinned/Stable, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/rolloutrun/rolloutrun.go}
  - {id: T-pinned-collected, from: Pinned/Stable, event: cr.collected, guard: "the pinned stable's ControllerRevision has no live name left and the sweep removes it", to: Pinned/Disagrees, decided_in: pkg/controller/v1beta1/inferencereplica/retention.go}
  - {id: T-pinned-scope, from: Pinned/Stable, event: scope.rotated, guard: "the replica was re-projected under a new scope", to: Pinned/Disagrees, decided_in: pkg/controller/v1beta1/inferencereplica/reconciler.go}
  - {id: T-nostable-close, from: Pinned/NoStable, event: run.close, variant: completed, guard: "every pinned member converged on the target", to: Settled, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/rolloutrun/rolloutrun.go}
  - {id: T-nostable-retarget-unmoved, from: Pinned/NoStable, event: run.retarget, variant: unmoved, guard: "the Component is still on its pinned revision, so its stable is resolved afresh", to: Pinned/Stable, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/rolloutrun/rolloutrun.go}
  - {id: T-nostable-retarget-moved, from: Pinned/NoStable, event: run.retarget, variant: moved, guard: "the Component moved, so the unknown stable is carried", to: Pinned/NoStable, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/rolloutrun/rolloutrun.go}
  - {id: T-disagrees-close, from: Pinned/Disagrees, event: run.close, variant: completed, guard: "every pinned member converged on the target", to: Settled, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/rolloutrun/rolloutrun.go}
  - {id: T-disagrees-retarget, from: Pinned/Disagrees, event: run.retarget, guard: "the disagreeing stable is carried for a moved Component", to: Pinned/Disagrees, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/rolloutrun/rolloutrun.go}
  - {id: T-empty-settle-promoted, from: Empty, event: write.canaryPromoted, guard: "a cutover lands on a member with no record", to: Settled, effects: [latestRolledout written with the pre-canary stable as previous], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/revisions.go}
  - {id: T-settled-promoted, from: Settled, event: write.canaryPromoted, guard: "a cutover lands while the record still names the stable revision", to: Settled, effects: [the record moves to the target with the stable as previous; the shape is unchanged], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/revisions.go}
  - {id: T-behind-settle-rolledback, from: Behind, event: write.canaryRolledBack, guard: "the revert completed and the replica is back on the recorded revision", to: Settled, effects: [the record is unchanged and level again], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/revisions.go}
  - {id: T-behind-ahead-collected, from: Behind, event: cr.collected, guard: "the recorded revision has no live name left and the sweep removes its ControllerRevision", to: Ahead, decided_in: pkg/controller/v1beta1/inferencereplica/retention.go}
  - {id: T-behind-ahead-scope, from: Behind, event: scope.rotated, guard: "the replica was re-projected under a new scope", to: Ahead, decided_in: pkg/controller/v1beta1/inferencereplica/reconciler.go}
  - {id: T-ahead-settle-promoted, from: Ahead, event: write.canaryPromoted, guard: "a cutover lands on a member whose record named a revision the fleet left", to: Settled, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/revisions.go}
  - {id: T-ahead-settle-current, from: Ahead, event: replica.currentPromoted, guard: "the replica promotes its current revision to the one the record names, a roll back onto the last promoted revision completing", to: Settled, decided_in: pkg/controller/v1beta1/workload/status/aggregate.go}
