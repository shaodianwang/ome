# The four record shapes outside a pinned run. Cells with a DECIDE outcome
# name the owner question in the note, after what the code does today.
cells:
  # --- Empty -------------------------------------------------------------------
  - {state: Empty, event: write.coordRolledOut, outcome: transition, to: Settled, note: "coordination records the one Ready revision of a Component it owns; previous stays empty", invariants: [one.writer.per.component], placement: unit, status: current}
  - {state: Empty, event: write.coordReady, outcome: ignore, note: "latestReady is written; the rolled-out record stays empty until one revision owns the traffic", placement: unit, status: current}
  - {state: Empty, event: write.canaryReady, outcome: ignore, note: "latestReady is written ahead of the capacity gate; the rolled-out record waits for the cutover", placement: unit, status: current}
  - {state: Empty, event: write.canaryPromoted, outcome: transition, to: Settled, note: "the cutover records the target with the pre-canary stable as previous even when nothing was recorded before", invariants: [one.writer.per.component], placement: unit, status: current}
  - {state: Empty, event: write.canarySettled, outcome: transition, to: Settled, note: "a member with no ladder active is recorded on the revision its replica settled on", placement: unit, status: current}
  - {state: Empty, event: write.modeSwitch, outcome: ignore, note: "nothing to clear", placement: unit, status: current}
  - {state: Empty, event: run.open, variants: [stableFromCurrentOffPin], outcome: transition, to: Pinned/Stable, note: "the replica's current revision differs from the target: it is the stable, and the record plays no part", invariants: [replica.answers.first], placement: unit, status: current}
  - {state: Empty, event: run.open, variants: [stableFromSettledCurrent, stableFromCurrentFallback], outcome: transition, to: Pinned/Stable, note: "the replica is on the pinned revision: it is pinned as both target and stable and sits the run out", invariants: [replica.answers.first], placement: unit, status: current}
  - {state: Empty, event: run.open, variants: [stableFromCanaryRecord], outcome: transition, to: Pinned/Stable, note: "a canary unit record can outlive the cleared fields; its stable identity answers for an adopted ladder", placement: unit, status: current}
  - {state: Empty, event: run.open, variants: [stableUnknown], outcome: transition, to: Pinned/NoStable, note: "a first rollout: no current revision and no record; the pin carries no stable and no ladder arms", placement: unit, status: current}
  - {state: Empty, event: canary.armed, outcome: ignore, note: "the unit's stable identity is seeded from the pin, else the replica, else the pods; the empty record plays no part", invariants: [pin.outranks.record], placement: unit, status: current}
  - {state: Empty, event: replica.currentPromoted, outcome: ignore, note: "the replica's first promotion with no record: coordination or the canary records it on the next pass that sees one Ready revision", placement: unit, status: current}
  - {state: Empty, event: replica.targetBumped, outcome: ignore, note: "the record follows promotions, not targets", placement: unit, status: current}
  - {state: Empty, event: cr.collision, outcome: ignore, note: "a new hash for the same template; nothing is recorded yet", placement: unit, status: current}
  - {state: Empty, event: scope.rotated, outcome: ignore, note: "nothing recorded can go stale", placement: unit, status: current}
  - {state: Empty, event: read.pinStable, variants: [replicaCurrent, canaryRecord, fallbackCurrent], outcome: ignore, note: "the link answers without the record", invariants: [replica.answers.first], placement: unit, status: current}
  - {state: Empty, event: read.pinStable, variants: [none], outcome: ignore, note: "no link answers: the pin carries no stable and the bind refuses to arm a ladder", placement: unit, status: current}
  - {state: Empty, event: read.statusTrails, outcome: defer, note: "the run layer and the canary dispatch wait for a fresh replica status before pinning or arming", placement: unit, status: current}
  # --- Settled -----------------------------------------------------------------
  - {state: Settled, event: write.coordRolledOut, outcome: ignore, note: "recording the revision already recorded changes nothing", invariants: [previous.never.collapses], placement: unit, status: current}
  - {state: Settled, event: write.coordReady, outcome: ignore, note: "latestReady is level with the record", placement: unit, status: current}
  - {state: Settled, event: write.canaryReady, outcome: transition, to: Behind, note: "a canary target gained Ready capacity: latestReady leads the record while the ladder is in flight", placement: unit, status: current}
  - {state: Settled, event: write.canaryPromoted, outcome: transition, to: Settled, note: "the record moves to the target with the stable as previous; the shape is unchanged", invariants: [one.writer.per.component], placement: unit, status: current}
  - {state: Settled, event: write.canaryRolledBack, outcome: ignore, note: "the member is already recorded on its stable; the rejected revision never enters previous", invariants: [previous.never.collapses], placement: unit, status: current}
  - {state: Settled, event: write.canarySettled, outcome: ignore, note: "already recorded", placement: unit, status: current}
  - {state: Settled, event: write.modeSwitch, outcome: transition, to: Empty, note: "the three fields and the phase are cleared on the live object", placement: unit, status: current}
  - {state: Settled, event: run.open, variants: [stableFromCurrentOffPin], outcome: transition, to: Pinned/Stable, note: "a new target: the replica's current revision is the stable", invariants: [replica.answers.first], placement: unit, status: current}
  - {state: Settled, event: run.open, variants: [stableFromSettledCurrent, stableFromCurrentFallback], outcome: transition, to: Pinned/Stable, note: "the Component is on the pinned revision and sits the run out", invariants: [replica.answers.first], placement: unit, status: current}
  - {state: Settled, event: run.open, variants: [stableFromCanaryRecord], outcome: transition, to: Pinned/Stable, note: "an adopted ladder: the unit record names the stable its ladder shifts traffic from", placement: unit, status: current}
  - {state: Settled, event: run.open, variants: [stableFromLatestRolledout], outcome: DECIDE, to: Pinned/Stable, note: "today: for a Component whose ladder is adopted or whose agreeing pair still trails Instances, the chooser falls past the replica and the unit record to latestRolledoutRevision; on a settled record that is the running revision and the pin is sound. Question: should the chooser consult the record at all, or resolve the remaining case from the ControllerRevision history the replica controls and pin no stable when none answers?", invariants: [replica.answers.first], placement: unit, status: current}
  - {state: Settled, event: run.open, variants: [stableUnknown], outcome: transition, to: Pinned/NoStable, note: "an adopted ladder with nothing known: the pin carries no stable", placement: unit, status: current}
  - {state: Settled, event: canary.armed, outcome: ignore, note: "the unit's stable identity is seeded from the pin and never re-inferred", invariants: [pin.outranks.record], placement: unit, status: current}
  - {state: Settled, event: canary.cutoverCleared, outcome: ignore, note: "the unit's identity drops; the record is unaffected", placement: unit, status: current}
  - {state: Settled, event: replica.currentPromoted, outcome: transition, to: Behind, note: "the replica promoted a revision the record does not name yet, after a roll or an in-place update; the next write catches the record up", placement: unit, status: current}
  - {state: Settled, event: replica.currentWithdrawn, outcome: transition, to: Ahead, note: "an Instance is off the recorded revision while current equals update: a rollback onto the last promoted revision is in flight and the record names a revision the fleet is leaving", placement: unit, status: current}
  - {state: Settled, event: replica.targetBumped, outcome: ignore, note: "the record follows promotions, not targets; the run layer reads the bump", placement: unit, status: current}
  - {state: Settled, event: cr.collected, outcome: ignore, note: "the recorded revision is the replica's current one, a live name the sweep keeps; the record itself keeps nothing alive", invariants: [live.names.retained], placement: unit, status: current}
  - {state: Settled, event: cr.collision, outcome: ignore, note: "a new hash for the same template is a bump the record follows on promotion", placement: unit, status: current}
  - {state: Settled, event: scope.rotated, outcome: transition, to: Ahead, note: "the replica's hashes mint under a new scope; the record names a hash no retained ControllerRevision carries", placement: unit, status: current}
  - {state: Settled, event: read.pinStable, variants: [replicaCurrent, canaryRecord, fallbackCurrent, none], outcome: ignore, note: "the link answers without the record", invariants: [replica.answers.first], placement: unit, status: current}
  - {state: Settled, event: read.pinStable, variants: [latestRolledout], outcome: DECIDE, note: "today: the record answers the running revision, so the pin is sound. Question: as run.open[stableFromLatestRolledout].", placement: unit, status: current}
  - {state: Settled, event: read.staleCopy, variants: [canaryOwned], outcome: defer, note: "the flush keeps the live fields of every canary-owned unit when the live record differs from the base, and the pass requeues", placement: sim, status: current}
  - {state: Settled, event: read.staleCopy, variants: [coordinationOwned], outcome: DECIDE, note: "today: no guard covers coordination-owned fields; the pass writes its cached copy back over a newer live write. Question: should coordination-owned revision fields be guarded like canary-owned ones, or re-derived from the pods on every pass so a stale copy cannot stick?", placement: sim, status: current}
  - {state: Settled, event: read.statusTrails, outcome: defer, note: "readers wait for a fresh replica status", placement: unit, status: current}
  # --- Behind ------------------------------------------------------------------
  - {state: Behind, event: write.coordRolledOut, outcome: transition, to: Settled, note: "exactly one revision has Ready pods: it is recorded and the prior latest is demoted to previous, since the pod view knows no superseded revision", placement: unit, status: current}
  - {state: Behind, event: write.coordReady, outcome: ignore, note: "latestReady already leads", placement: unit, status: current}
  - {state: Behind, event: write.canaryReady, outcome: ignore, note: "latestReady already leads", placement: unit, status: current}
  - {state: Behind, event: write.canaryPromoted, outcome: transition, to: Settled, note: "the cutover records the target with the pre-canary stable as previous", placement: unit, status: current}
  - {state: Behind, event: write.canaryRolledBack, outcome: transition, to: Settled, note: "the revert completed: the replica is back on the recorded stable revision and the record is level again without changing", invariants: [previous.never.collapses], placement: unit, status: current}
  - {state: Behind, event: write.canarySettled, outcome: transition, to: Settled, note: "no ladder is active and the member settled on one revision", placement: unit, status: current}
  - {state: Behind, event: write.modeSwitch, outcome: transition, to: Empty, note: "the fields are cleared live", placement: unit, status: current}
  - {state: Behind, event: run.open, variants: [stableFromCurrentOffPin], outcome: transition, to: Pinned/Stable, note: "the replica's current revision, newer than the record, is the stable", invariants: [replica.answers.first], placement: unit, status: current}
  - {state: Behind, event: run.open, variants: [stableFromSettledCurrent, stableFromCurrentFallback, stableFromCanaryRecord], outcome: transition, to: Pinned/Stable, note: "the replica or the unit record answers; the trailing record plays no part", invariants: [replica.answers.first], placement: unit, status: current}
  - {state: Behind, event: run.open, variants: [stableFromLatestRolledout], outcome: DECIDE, to: Pinned/Stable, note: "today: an adopted unit whose replica already sits on the pin (a fully rolled canary primary) falls to the record, which names the revision before the promotion, the pre-canary stable its ladder shifts from. Question: as Settled/run.open[stableFromLatestRolledout].", placement: unit, status: current}
  - {state: Behind, event: run.open, variants: [stableUnknown], outcome: transition, to: Pinned/NoStable, note: "nothing known: the pin carries no stable", placement: unit, status: current}
  - {state: Behind, event: canary.armed, outcome: ignore, note: "the unit's stable identity is seeded from the pin", invariants: [pin.outranks.record], placement: unit, status: current}
  - {state: Behind, event: canary.cutoverCleared, outcome: ignore, note: "the record is caught up by the same pass's promoted write", placement: unit, status: current}
  - {state: Behind, event: replica.currentPromoted, outcome: ignore, note: "the replica moves further ahead; the next write catches the record up", placement: unit, status: current}
  - {state: Behind, event: replica.currentWithdrawn, outcome: ignore, note: "the record stays where it is; the next write re-reads the pods", placement: unit, status: current}
  - {state: Behind, event: replica.targetBumped, outcome: ignore, note: "the record follows promotions, not targets", placement: unit, status: current}
  - {state: Behind, event: cr.collected, outcome: transition, to: Ahead, note: "the recorded revision has no live name once every Instance rolled, so the sweep may remove its ControllerRevision; the record then names a hash no retained revision carries", invariants: [live.names.retained], placement: unit, status: current}
  - {state: Behind, event: cr.collision, outcome: ignore, note: "a new hash for the same template", placement: unit, status: current}
  - {state: Behind, event: scope.rotated, outcome: transition, to: Ahead, note: "the record names a hash no retained ControllerRevision carries", placement: unit, status: current}
  - {state: Behind, event: read.pinStable, variants: [replicaCurrent, canaryRecord, fallbackCurrent, none], outcome: ignore, note: "the link answers without the record", invariants: [replica.answers.first], placement: unit, status: current}
  - {state: Behind, event: read.pinStable, variants: [latestRolledout], outcome: DECIDE, note: "today: the trailing record answers the pre-promotion revision. Question: as Settled/run.open[stableFromLatestRolledout].", placement: unit, status: current}
  - {state: Behind, event: read.staleCopy, variants: [canaryOwned], outcome: defer, note: "the flush keeps the live fields and the pass requeues", placement: sim, status: current}
  - {state: Behind, event: read.staleCopy, variants: [coordinationOwned], outcome: DECIDE, note: "today: the cached copy is written back. Question: as Settled/read.staleCopy[coordinationOwned].", placement: sim, status: current}
  - {state: Behind, event: read.statusTrails, outcome: defer, note: "readers wait for a fresh replica status", placement: unit, status: current}
  # --- Ahead -------------------------------------------------------------------
  - {state: Ahead, event: write.coordRolledOut, outcome: transition, to: Settled, note: "exactly one revision has Ready pods: it is recorded and the revision the fleet left is demoted to previous", placement: unit, status: current}
  - {state: Ahead, event: write.coordReady, outcome: ignore, note: "latestReady follows the Ready pods; the rolled-out record waits for one revision to own the traffic", placement: unit, status: current}
  - {state: Ahead, event: write.canaryReady, outcome: ignore, note: "latestReady follows the target", placement: unit, status: current}
  - {state: Ahead, event: write.canaryPromoted, outcome: transition, to: Settled, note: "the cutover records the target with the stable as previous", placement: unit, status: current}
  - {state: Ahead, event: write.canaryRolledBack, outcome: transition, to: Settled, note: "the revert completed: the stable revision is recorded as latest", placement: unit, status: current}
  - {state: Ahead, event: write.canarySettled, outcome: transition, to: Settled, note: "no ladder is active and the member settled on one revision; the stale record is replaced", placement: unit, status: current}
  - {state: Ahead, event: write.modeSwitch, outcome: transition, to: Empty, note: "the fields are cleared live", placement: unit, status: current}
  - {state: Ahead, event: run.open, variants: [stableFromCurrentOffPin, stableFromSettledCurrent, stableFromCurrentFallback, stableFromCanaryRecord], outcome: transition, to: Pinned/Stable, note: "the replica or the unit record answers; the stale record plays no part", invariants: [replica.answers.first], placement: unit, status: current}
  - {state: Ahead, event: run.open, variants: [stableFromLatestRolledout], outcome: DECIDE, to: Pinned/Disagrees, note: "today: the chooser pins a stable no Instance runs and possibly no retained ControllerRevision carries; the bind then arms a ladder toward it and a rollback finds nothing to point the replica at and parks. Question: should the chooser pin no stable (and refuse to arm) rather than take a record that names a revision the fleet left?", placement: unit, status: current}
  - {state: Ahead, event: run.open, variants: [stableUnknown], outcome: transition, to: Pinned/NoStable, note: "nothing known: the pin carries no stable", placement: unit, status: current}
  - {state: Ahead, event: canary.armed, outcome: ignore, note: "the unit's stable identity is seeded from the pin; a pin taken from this record is the Pinned/Disagrees shape", invariants: [pin.outranks.record], placement: unit, status: current}
  - {state: Ahead, event: canary.cutoverCleared, outcome: ignore, note: "the record is replaced by the same pass's promoted write", placement: unit, status: current}
  - {state: Ahead, event: replica.currentPromoted, outcome: transition, to: Settled, note: "the replica promotes the revision the record names: a roll back onto the last promoted revision completing", placement: unit, status: current}
  - {state: Ahead, event: replica.currentWithdrawn, outcome: ignore, note: "the record stays ahead until a write", placement: unit, status: current}
  - {state: Ahead, event: replica.targetBumped, outcome: ignore, note: "the record follows promotions, not targets", placement: unit, status: current}
  - {state: Ahead, event: cr.collected, outcome: ignore, note: "the recorded revision has no live name and may be collected; the record is already stale and keeps nothing alive", invariants: [live.names.retained], placement: unit, status: current}
  - {state: Ahead, event: cr.collision, outcome: ignore, note: "a new hash for the same template", placement: unit, status: current}
  - {state: Ahead, event: scope.rotated, outcome: ignore, note: "already stale", placement: unit, status: current}
  - {state: Ahead, event: read.pinStable, variants: [replicaCurrent, canaryRecord, fallbackCurrent, none], outcome: ignore, note: "the link answers without the record", invariants: [replica.answers.first], placement: unit, status: current}
  - {state: Ahead, event: read.pinStable, variants: [latestRolledout], outcome: DECIDE, note: "today: the record answers a revision the fleet left and the pin takes it. Question: as run.open[stableFromLatestRolledout].", placement: unit, status: current}
  - {state: Ahead, event: read.staleCopy, variants: [canaryOwned], outcome: defer, note: "the flush keeps the live fields and the pass requeues", placement: sim, status: current}
  - {state: Ahead, event: read.staleCopy, variants: [coordinationOwned], outcome: DECIDE, note: "today: the cached copy is written back; a record cleared on the live object is resurrected this way and reaches the next run's pin. Question: as Settled/read.staleCopy[coordinationOwned].", placement: sim, status: current}
  - {state: Ahead, event: read.statusTrails, outcome: defer, note: "readers wait for a fresh replica status", placement: unit, status: current}
