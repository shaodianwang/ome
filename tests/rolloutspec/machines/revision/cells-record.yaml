# The four record shapes outside a pinned run. Cells with a DECIDE outcome
# name the owner question in the note, after what the code does today.
cells:
  # --- Empty -------------------------------------------------------------------
  - {state: Empty, event: write.coordRolledOut, outcome: transition, to: Settled, note: "coordination records the one revision with Ready pods on a Component it owns as latestRolledoutRevision; with nothing recorded before there is nothing to demote, so previousRolledoutRevision stays empty", invariants: [one.writer.per.component], placement: unit, coverage: {unit: [TestRecordRolledOutRevision, TestReconcile_PreviousRolledoutRecordedOnAdvance], replay: [open-and-close]}, status: decided}
  - {state: Empty, event: write.coordReady, outcome: ignore, note: "latestReadyRevision is written as soon as the replica's update revision (current when none) has a Ready pod, apart from the rolled-out record, which waits until exactly one revision has Ready pods", placement: unit, coverage: {unit: [TestSetLatestReadyRevision, TestUpdateTrafficStatusRepairsRevisionMetadataWhenTrafficIsCurrent], replay: [record-starts-with-a-diverged-pair]}, status: decided}
  - {state: Empty, event: write.canaryReady, outcome: ignore, note: "the executor writes latestReadyRevision for a member whose target has Ready capacity, ahead of the capacity gate; the rolled-out record waits for the cutover", placement: unit, coverage: {unit: [TestDispatch_MembersRecordTheRolledOutRevisions, TestReconcile_UnreadyTargetPublishesNoReadyRevision]}, status: decided}
  - {state: Empty, event: write.canaryPromoted, outcome: transition, to: Settled, note: "the cutover records the member's target as latestRolledoutRevision with the pre-canary stable as previous, whether or not anything was recorded before, and brings latestReady level", invariants: [one.writer.per.component], placement: unit, coverage: {unit: [TestDispatch_MembersRecordTheRolledOutRevisions, TestReconcile_CompletionRecordsEveryMembersRevisions, TestRecordRolledOutRevision]}, status: decided}
  - {state: Empty, event: write.canarySettled, outcome: transition, to: Settled, note: "with no ladder active the dispatch records a member whose replica has settled on one revision with a Ready pod and no pod of another; the first pass over a canary-owned Component records it this way", placement: unit, coverage: {replay: [rollback-finds-no-stable-revision]}, status: decided}
  - {state: Empty, event: write.modeSwitch, outcome: ignore, note: "a Component with none of the OMENative-only fields is left alone: no live read and no write", placement: unit, coverage: {unit: [TestCleanupReplacedBackendsClearsTheOMENativeStatus/a_second_pass_has_nothing_to_clear]}, status: decided}
  - {state: Empty, event: run.open, variants: [stableFromCurrentOffPin], outcome: transition, to: Pinned/Stable, note: "the replica's current revision differs from the pinned target, so it is the stable; the chooser never reaches the record", invariants: [replica.answers.first], placement: unit, coverage: {unit: [TestComponentStableRevision/a_current_revision_off_the_pin_is_the_stable, TestOpenPinsInlinePlan], replay: [record-starts-with-a-diverged-pair]}, status: decided}
  - {state: Empty, event: run.open, variants: [stableFromSettledCurrent, stableFromCurrentFallback], outcome: transition, to: Pinned/Stable, note: "a Component whose current revision is the pinned one is pinned at it as both target and stable and sits the run out; with Instances still trailing and nothing on record, the current revision is the last fallback and pins the same way", invariants: [replica.answers.first], placement: unit, coverage: {unit: ["TestComponentStableRevision/settled_on_the_pin:_the_IR,_not_the_record", TestComponentStableRevision/stragglers_with_no_record_fall_back_to_the_current_revision, TestOpenPinsUnchangedGroupMemberAsStable]}, status: decided}
  - {state: Empty, event: run.open, variants: [stableFromCanaryRecord], outcome: transition, to: Pinned/Stable, note: "for the unit a run adopts, the primary's canary record answers the stable before the rolled-out fields; a record left by a cleared Component still answers", placement: unit, coverage: {unit: ["TestComponentStableRevision/an_adopting_unit's_stable_identity_answers_before_the_record"]}, status: decided}
  - {state: Empty, event: run.open, variants: [stableUnknown], outcome: transition, to: Pinned/NoStable, note: "with no current revision and nothing on record the chooser answers nothing: the pin carries no stable, and the bind arms no ladder for it", placement: unit, coverage: {unit: [TestComponentStableRevision/no_IR_revision_and_no_record_pins_no_stable, TestComponentStableRevision/an_adopting_run_with_nothing_on_record_pins_no_stable, TestBindRunSkipsAUnitWithoutAStableRevision]}, status: decided}
  - {state: Empty, event: canary.armed, outcome: ignore, note: "the bind seeds the unit's stable identity from the pin; the dispatch backfills a missing one from the replica's current revision, else from the pods off the target; the empty record plays no part", invariants: [pin.outranks.record], placement: unit, coverage: {unit: [TestBindRunAtomicallyResetsFreshRun, TestDispatch_ArmsFromLivePodsWhenCurrentRevisionUnpromoted]}, status: decided}
  - {state: Empty, event: replica.currentPromoted, outcome: ignore, note: "the replica promotes once every Instance is Ready on the update revision and no RetryBlock names it; the record follows on the next pass that sees one revision with Ready pods", placement: unit, coverage: {unit: [TestCurrentRevisionFor/every_Instance_Ready_on_the_update_revision_promotes_it, TestReconcile_PreviousRolledoutRecordedOnAdvance]}, status: decided}
  - {state: Empty, event: replica.targetBumped, outcome: ignore, note: "the record follows Ready pods, not the pair's update revision: a bumped target with no Ready pod leaves the record empty", placement: unit, coverage: {replay: [record-starts-with-a-diverged-pair]}, status: decided}
  - {state: Empty, event: cr.collision, outcome: ignore, note: "a same-name different-payload or foreign-owned ControllerRevision is a collision; the collision count salts the next hash, and nothing is recorded that could name it", placement: unit, coverage: {unit: [TestEnsureControllerRevision_DetectsCollision, TestEnsureControllerRevision_RejectsForeignOwnerAsCollision, TestRevisionHash_CollisionCountChangesHash]}, status: decided}
  - {state: Empty, event: scope.rotated, outcome: ignore, note: "the owner UID is part of the hash, so a re-projected replica mints new names; nothing recorded can go stale", placement: unit, coverage: {unit: [TestRevisionHash_OwnerUIDPartitionsTheNameSpace, TestRevisionScopeUIDFollowsTheForm]}, status: decided}
  - {state: Empty, event: read.pinStable, variants: [replicaCurrent, canaryRecord, fallbackCurrent], outcome: ignore, note: "the replica's current revision off the pin, the settled current revision, the unit's canary record and the current revision as last fallback each answer before the rolled-out fields are read", invariants: [replica.answers.first], placement: unit, coverage: {unit: [TestComponentStableRevision], replay: [record-starts-with-a-diverged-pair]}, status: decided}
  - {state: Empty, event: read.pinStable, variants: [none], outcome: ignore, note: "no link answers: the pin carries no stable and the bind refuses to arm a ladder for the unit", placement: unit, coverage: {unit: [TestComponentStableRevision/no_IR_revision_and_no_record_pins_no_stable, TestBindRunSkipsAUnitWithoutAStableRevision, TestReconcile_NoStableRevisionDoesNotArm]}, status: decided}
  - {state: Empty, event: read.statusTrails, outcome: defer, note: "the run layer requeues without pinning while a replica's status trails its generation or the projection stamp trails the service, and the dispatch waits for a fresh snapshot before arming", placement: unit, coverage: {unit: [TestRevertAtTheLastInstanceWaitsForTheProjectionBeforeJudgingTheRun, TestSecondaryCapacityReadyRequiresAuthoritativeIR, TestDispatch_HoldsUntilIRIdentifiesCanaryTarget], replay: [open-and-close]}, status: decided}
  # --- Settled -----------------------------------------------------------------
  - {state: Settled, event: write.coordRolledOut, outcome: ignore, note: "recording the revision already recorded changes nothing: latest and previous stay as they are", invariants: [previous.never.collapses], placement: unit, coverage: {unit: [TestRecordRolledOutRevision, TestReconcile_PreviousRolledoutRecordedOnAdvance], replay: [open-and-close, record-starts-with-a-diverged-pair]}, status: decided}
  - {state: Settled, event: write.coordReady, outcome: ignore, note: "latestReady names the update revision's Ready pods, which is the recorded revision while settled; the write is a no-op", placement: unit, coverage: {unit: [TestSetLatestReadyRevision], replay: [open-and-close]}, status: decided}
  - {state: Settled, event: write.canaryReady, outcome: transition, to: Behind, note: "the executor writes latestReady for a member's target the pass its capacity is Ready, ahead of the capacity gate, while the rolled-out record waits for the cutover; latestReady leads the record from here (under a pinned run the pin's shape is the one read)", placement: unit, coverage: {unit: [TestDispatch_MembersRecordTheRolledOutRevisions, TestReconcile_UnreadyTargetPublishesNoReadyRevision], replay: [rollback-finds-no-stable-revision]}, status: decided}
  - {state: Settled, event: write.canaryPromoted, outcome: transition, to: Settled, note: "the cutover records the target as latest with the pre-canary stable as previous and brings latestReady level; a member whose target is its stable records it without demotion", invariants: [one.writer.per.component], placement: unit, coverage: {unit: [TestReconcile_CompletionRecordsEveryMembersRevisions, TestReconcile_UnbumpedMemberRecordsItsRevisionWithoutDemotion, TestRecordRolledOutRevision]}, status: decided}
  - {state: Settled, event: write.canaryRolledBack, outcome: ignore, note: "the member is already recorded on its stable, so the write changes nothing and the rejected revision never enters previous", invariants: [previous.never.collapses], placement: unit, coverage: {unit: [TestReconcile_RollbackCompletionRecordsTheStableRevision, TestRecordRolledOutRevision]}, status: decided}
  - {state: Settled, event: write.canarySettled, outcome: ignore, note: "a member recorded on the revision it settled on changes nothing", placement: unit, coverage: {unit: [TestRecordRolledOutRevision], replay: [rollback-finds-no-stable-revision]}, status: decided}
  - {state: Settled, event: write.modeSwitch, outcome: transition, to: Empty, note: "the lifecycle block, the phase, the three revision fields and the traffic are cleared on the live object first and in the pass's copy after it", placement: unit, coverage: {unit: [TestCleanupReplacedBackendsClearsTheOMENativeStatus]}, status: decided}
  - {state: Settled, event: run.open, variants: [stableFromCurrentOffPin], outcome: transition, to: Pinned/Stable, note: "a new target: the replica's current revision differs from the pin and is the stable; the record is not read", invariants: [replica.answers.first], placement: unit, coverage: {unit: [TestComponentStableRevision/a_current_revision_off_the_pin_is_the_stable, TestOpenPinsInlinePlan], replay: [open-and-close]}, status: decided}
  - {state: Settled, event: run.open, variants: [stableFromSettledCurrent], outcome: transition, to: Pinned/Stable, note: "a Component whose current revision is the pin with no Instance trailing is pinned at it as both target and stable and sits the run out; its record is not read", invariants: [replica.answers.first], placement: unit, coverage: {unit: ["TestComponentStableRevision/settled_on_the_pin:_the_IR,_not_the_record", TestOpenPinsSettledUnitAtItsOwnRevisionOverStaleRolledOutRecord, TestOpenPinsUnchangedGroupMemberAsStable]}, status: decided}
  - {state: Settled, event: run.open, variants: [stableFromCurrentFallback], outcome: n/a, reason: "the record answers before the last fallback, so this link cannot answer while a record exists", placement: unit, status: decided}
  - {state: Settled, event: run.open, variants: [stableFromCanaryRecord], outcome: transition, to: Pinned/Stable, note: "for the unit a run adopts, the primary's canary record answers the stable before the rolled-out fields", placement: unit, coverage: {unit: ["TestComponentStableRevision/an_adopting_unit's_stable_identity_answers_before_the_record", TestOpenPinsSettledUnitAtItsOwnRevisionOverStaleCanaryRecord]}, status: decided}
  - {state: Settled, event: run.open, variants: [stableFromLatestRolledout], outcome: transition, to: Pinned/Stable, note: "for a Component whose ladder the run adopts, or whose agreeing pair still trails Instances, the chooser passes the current revision and the unit record and takes latestRolledoutRevision; on a settled record that is the running revision, so the pin is sound", invariants: [replica.answers.first], placement: unit, coverage: {unit: ["TestComponentStableRevision/stragglers_are_a_pending_roll:_the_record_stands", TestComponentStableRevision/an_adopting_run_keeps_the_record, TestAdoptedRunPinsStableFromTheRolledOutRevision, TestStragglingUnitResolvesStableFromItsRecord]}, status: decided}
  - {state: Settled, event: run.open, variants: [stableUnknown], outcome: n/a, reason: "the record answers before the chooser can answer nothing, so an unknown stable cannot occur while a record exists", placement: unit, status: decided}
  - {state: Settled, event: canary.armed, outcome: ignore, note: "the bind seeds the unit's stable identity from the pin and never re-infers it; the record is not read", invariants: [pin.outranks.record], placement: unit, coverage: {unit: [TestBindRunAtomicallyResetsFreshRun]}, status: decided}
  - {state: Settled, event: canary.cutoverCleared, outcome: ignore, note: "the cutover's pass records the promoted revisions and drops the unit's stable identity; the record is left as that write made it", placement: unit, coverage: {unit: [TestReconcile_CompleteClearsStableIdentity]}, status: decided}
  - {state: Settled, event: replica.currentPromoted, outcome: transition, to: Behind, note: "the replica promotes once every Instance is Ready on the update revision and no RetryBlock names it; the record trails it until the next write that sees one revision with Ready pods", placement: unit, coverage: {unit: [TestCurrentRevisionFor/every_Instance_Ready_on_the_update_revision_promotes_it], replay: [promotion-lands-before-the-run-opens, straggling-pair-pins-the-record]}, status: decided}
  - {state: Settled, event: replica.currentWithdrawn, outcome: transition, to: Ahead, note: "current already names the update revision while an Instance runs, or is pinned to, another revision: the replica withdraws it to empty and raises the CurrentRevisionWithdrawn condition; the record keeps naming the revision the fleet is returning to", placement: unit, coverage: {unit: [TestCurrentRevisionFor/a_rollback_onto_the_current_revision_withdraws_it_while_every_Instance_runs_the_superseded_one, TestCurrentRevisionFor/one_Instance_still_on_the_superseded_revision_is_enough_to_withdraw, TestWithdrawnRevisionAfter], replay: [withdrawn-current-opens-a-run-on-the-record]}, status: decided}
  - {state: Settled, event: replica.targetBumped, outcome: ignore, note: "the record follows Ready pods, not the pair's update revision; the run layer reads the bump", placement: unit, coverage: {replay: [open-and-close, promotion-lands-before-the-run-opens]}, status: decided}
  - {state: Settled, event: cr.collected, outcome: ignore, note: "the sweep keeps the replica's current and update revisions and every row's running and target revision, and the recorded revision is the current one; the record itself keeps nothing alive", invariants: [live.names.retained], placement: unit, coverage: {unit: [TestRetainControllerRevisions_NeverDeletesLiveRevisions, TestCollectLiveRevisionNames_UnionAcrossInstanceStatuses, TestReconcile_RetainsControllerRevisions]}, status: decided}
  - {state: Settled, event: cr.collision, outcome: ignore, note: "a collision bumps the collision count and the same template mints a new hash, which is a target bump the record follows on promotion", placement: unit, coverage: {unit: [TestEnsureControllerRevision_DetectsCollision, TestRevisionHash_CollisionCountChangesHash]}, status: decided}
  - {state: Settled, event: scope.rotated, outcome: transition, to: Ahead, note: "the owner UID is part of the hash, so a re-projected replica mints new names and the record keeps naming a hash no retained ControllerRevision under the new scope carries", placement: unit, coverage: {unit: [TestRevisionHash_OwnerUIDPartitionsTheNameSpace, TestRevisionScopeUIDFollowsTheForm]}, status: decided}
  - {state: Settled, event: read.pinStable, variants: [replicaCurrent, canaryRecord], outcome: ignore, note: "the replica's current revision, off the pin or settled on it, and the unit's canary record each answer before the rolled-out fields are read", invariants: [replica.answers.first], placement: unit, coverage: {unit: [TestComponentStableRevision], replay: [open-and-close]}, status: decided}
  - {state: Settled, event: read.pinStable, variants: [fallbackCurrent, none], outcome: n/a, reason: "the record answers before the last fallback and before nothing, so neither link can answer while a record exists", placement: unit, status: decided}
  - {state: Settled, event: read.pinStable, variants: [latestRolledout], outcome: ignore, note: "the record answers for an adopted or straggling Component once the replica and the unit record have not; on a settled record it names the running revision and the pin is sound", placement: unit, coverage: {unit: ["TestComponentStableRevision/stragglers_are_a_pending_roll:_the_record_stands", TestComponentStableRevision/an_adopting_run_keeps_the_record]}, status: decided}
  - {state: Settled, event: read.staleCopy, variants: [canaryOwned], outcome: defer, note: "the flush compares the live executor state of every canary-owned unit with the base the pass read and keeps the live record, phase, traffic and revision fields when they differ; the pass is marked stale and requeues", placement: sim, coverage: {unit: [TestBaseKeepsTheLiveRolledOutRevisionsOverAStalePass, TestBaseKeepsTheLiveRecordOverAStalePass], replay: [stale-read-misses-repin]}, status: decided}
  - {state: Settled, event: read.staleCopy, variants: [coordinationOwned], outcome: transition, to: Ahead, note: "today nothing guards a coordination-owned record: a pass whose Component has no Ready pod to re-derive the record from flushes its cached copy of the three fields back over the newer live write, so the record names what the copy named, a revision the fleet has left; which is wrong because a record no pass derived from the pods is written as if it were", placement: sim, coverage: {replay: [stale-copy-resurrects-the-coordination-record]}, status: decided}
  - {state: Settled, event: read.statusTrails, outcome: defer, note: "the run layer requeues without pinning while a replica's status trails its generation or the projection stamp trails the service; the dispatch waits for a fresh snapshot", placement: unit, coverage: {unit: [TestRevertAtTheLastInstanceWaitsForTheProjectionBeforeJudgingTheRun, TestSecondaryCapacityReadyRequiresAuthoritativeIR], replay: [open-and-close]}, status: decided}
  # --- Behind ------------------------------------------------------------------
  - {state: Behind, event: write.coordRolledOut, outcome: transition, to: Settled, note: "exactly one revision has Ready pods: coordination records it and demotes the prior latest to previous, since the pod view knows no superseded revision", placement: unit, coverage: {unit: [TestRecordRolledOutRevision, TestReconcile_PreviousRolledoutRecordedOnAdvance], replay: [promotion-lands-before-the-run-opens]}, status: decided}
  - {state: Behind, event: write.coordReady, outcome: ignore, note: "latestReady names the update revision's Ready pods and already leads; the pass that catches the record up leaves it level", placement: unit, coverage: {unit: [TestSetLatestReadyRevision], replay: [promotion-lands-before-the-run-opens]}, status: decided}
  - {state: Behind, event: write.canaryReady, outcome: ignore, note: "latestReady already names the member's target; a repeat of the write changes nothing", placement: unit, coverage: {unit: [TestDispatch_MembersRecordTheRolledOutRevisions], replay: [stale-read-misses-repin]}, status: decided}
  - {state: Behind, event: write.canaryPromoted, outcome: transition, to: Settled, note: "the cutover records the target as latest with the pre-canary stable as previous; latestReady, which led, is level again", placement: unit, coverage: {unit: [TestReconcile_CompletionRecordsEveryMembersRevisions, TestDispatch_MembersRecordTheRolledOutRevisions, TestRecordRolledOutRevision]}, status: decided}
  - {state: Behind, event: write.canaryRolledBack, outcome: transition, to: Settled, note: "the revert completed and the member is already recorded on its stable: the write changes nothing, the rejected revision never enters previous, and the record is level again", invariants: [previous.never.collapses], placement: unit, coverage: {unit: [TestReconcile_RollbackCompletionRecordsTheStableRevision, TestRecordRolledOutRevision]}, status: decided}
  - {state: Behind, event: write.canarySettled, outcome: transition, to: Settled, note: "no ladder is active and the member's replica settled on one revision with a Ready pod and no pod of another: it is recorded and the prior latest demoted to previous", placement: unit, coverage: {unit: [TestRecordSettledRevisionsFollowsTheReplica, TestRecordRolledOutRevision]}, status: decided}
  - {state: Behind, event: write.modeSwitch, outcome: transition, to: Empty, note: "the lifecycle block, the phase, the three revision fields and the traffic are cleared on the live object first and in the pass's copy after it", placement: unit, coverage: {unit: [TestCleanupReplacedBackendsClearsTheOMENativeStatus]}, status: decided}
  - {state: Behind, event: run.open, variants: [stableFromCurrentOffPin], outcome: transition, to: Pinned/Stable, note: "the replica's current revision, newer than the record, differs from the pin and is the stable; the record is not read", invariants: [replica.answers.first], placement: unit, coverage: {unit: [TestComponentStableRevision/a_current_revision_off_the_pin_is_the_stable, TestOpenPinsInlinePlan]}, status: decided}
  - {state: Behind, event: run.open, variants: [stableFromSettledCurrent, stableFromCanaryRecord], outcome: transition, to: Pinned/Stable, note: "a Component settled on the pin is pinned at its own revision; for an adopted unit the primary's canary record answers; the trailing record plays no part", invariants: [replica.answers.first], placement: unit, coverage: {unit: ["TestComponentStableRevision/settled_on_the_pin:_the_IR,_not_the_record", "TestComponentStableRevision/an_adopting_unit's_stable_identity_answers_before_the_record", TestOpenPinsSettledUnitAtItsOwnRevisionOverStaleRolledOutRecord]}, status: decided}
  - {state: Behind, event: run.open, variants: [stableFromCurrentFallback], outcome: n/a, reason: "the record answers before the last fallback, so this link cannot answer while a record exists", placement: unit, status: decided}
  - {state: Behind, event: run.open, variants: [stableFromLatestRolledout], outcome: transition, to: Pinned/Stable, note: "an adopted unit, or a pair that agrees on the pin while Instances still trail it, falls to the record, which names the revision promoted before: the pre-canary stable a ladder shifts from, and a retained revision an Instance may still run", placement: unit, coverage: {unit: [TestAdoptedRunPinsStableFromTheRolledOutRevision, "TestComponentStableRevision/stragglers_are_a_pending_roll:_the_record_stands"], replay: [straggling-pair-pins-the-record]}, status: decided}
  - {state: Behind, event: run.open, variants: [stableUnknown], outcome: n/a, reason: "the record answers before the chooser can answer nothing, so an unknown stable cannot occur while a record exists", placement: unit, status: decided}
  - {state: Behind, event: canary.armed, outcome: ignore, note: "the bind seeds the unit's stable identity from the pin and never re-infers it; the record is not read", invariants: [pin.outranks.record], placement: unit, coverage: {unit: [TestBindRunAtomicallyResetsFreshRun]}, status: decided}
  - {state: Behind, event: canary.cutoverCleared, outcome: ignore, note: "the pass that drops the identity records the promoted revisions first, so the record is caught up before the identity is gone", placement: unit, coverage: {unit: [TestReconcile_CompleteClearsStableIdentity, TestReconcile_CompletionRecordsEveryMembersRevisions]}, status: decided}
  - {state: Behind, event: replica.currentPromoted, outcome: ignore, note: "the replica promotes once every Instance is Ready on the update revision and no RetryBlock names it; the record trails further until the next write that sees one revision with Ready pods", placement: unit, coverage: {unit: [TestCurrentRevisionFor/every_Instance_Ready_on_the_update_revision_promotes_it]}, status: decided}
  - {state: Behind, event: replica.currentWithdrawn, outcome: ignore, note: "the replica withdraws its current revision to empty; the record stays where it is and the next write re-reads the pods", placement: unit, coverage: {unit: [TestCurrentRevisionFor/one_Instance_still_on_the_superseded_revision_is_enough_to_withdraw]}, status: decided}
  - {state: Behind, event: replica.targetBumped, outcome: ignore, note: "the record follows Ready pods, not the pair's update revision; the run layer reads the bump", placement: unit, coverage: {unit: [TestReconcile_PreviousRolledoutRecordedOnAdvance], replay: [open-and-close]}, status: decided}
  - {state: Behind, event: cr.collected, outcome: transition, to: Ahead, note: "the recorded revision has no live name once every Instance rolled; the sweep removes it once more than the configured number of newer non-live revisions exist, and the record then names a hash no retained ControllerRevision carries", invariants: [live.names.retained], placement: unit, coverage: {unit: [TestRetainControllerRevisions_DropsOldestNonLive, TestCollectLiveRevisionNames_UnionAcrossInstanceStatuses]}, status: decided}
  - {state: Behind, event: cr.collision, outcome: ignore, note: "a collision bumps the collision count and the same template mints a new hash, a target bump the record follows on promotion", placement: unit, coverage: {unit: [TestEnsureControllerRevision_DetectsCollision, TestRevisionHash_CollisionCountChangesHash]}, status: decided}
  - {state: Behind, event: scope.rotated, outcome: transition, to: Ahead, note: "the owner UID is part of the hash, so a re-projected replica mints new names and the record keeps naming a hash no retained ControllerRevision under the new scope carries", placement: unit, coverage: {unit: [TestRevisionHash_OwnerUIDPartitionsTheNameSpace, TestRevisionScopeUIDFollowsTheForm]}, status: decided}
  - {state: Behind, event: read.pinStable, variants: [replicaCurrent, canaryRecord], outcome: ignore, note: "the replica's current revision, off the pin or settled on it, and the unit's canary record each answer before the rolled-out fields are read", invariants: [replica.answers.first], placement: unit, coverage: {unit: [TestComponentStableRevision]}, status: decided}
  - {state: Behind, event: read.pinStable, variants: [fallbackCurrent, none], outcome: n/a, reason: "the record answers before the last fallback and before nothing, so neither link can answer while a record exists", placement: unit, status: decided}
  - {state: Behind, event: read.pinStable, variants: [latestRolledout], outcome: ignore, note: "the trailing record answers the revision promoted before; the pin takes it as the stable", placement: unit, coverage: {unit: ["TestComponentStableRevision/stragglers_are_a_pending_roll:_the_record_stands"], replay: [straggling-pair-pins-the-record]}, status: decided}
  - {state: Behind, event: read.staleCopy, variants: [canaryOwned], outcome: defer, note: "the flush keeps the live record, phase, traffic and revision fields of every canary-owned unit when they differ from the base the pass read; the pass is marked stale and requeues", placement: sim, coverage: {unit: [TestBaseKeepsTheLiveRolledOutRevisionsOverAStalePass], replay: [stale-read-misses-repin]}, status: decided}
  - {state: Behind, event: read.staleCopy, variants: [coordinationOwned], outcome: transition, to: Ahead, note: "today nothing guards a coordination-owned record: a pass whose Component has no Ready pod to re-derive the record from flushes its cached copy of the three fields back over the newer live write, so the record names an older revision the fleet has left; which is wrong because a record no pass derived from the pods is written as if it were", placement: sim, coverage: {replay: [stale-copy-resurrects-the-coordination-record]}, status: decided}
  - {state: Behind, event: read.statusTrails, outcome: defer, note: "the run layer requeues without pinning while a replica's status trails its generation or the projection stamp trails the service; the dispatch waits for a fresh snapshot", placement: unit, coverage: {unit: [TestRevertAtTheLastInstanceWaitsForTheProjectionBeforeJudgingTheRun, TestSecondaryCapacityReadyRequiresAuthoritativeIR], replay: [open-and-close]}, status: decided}
  # --- Ahead -------------------------------------------------------------------
