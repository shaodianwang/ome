# The three pinned shapes. Every reader takes the pin first, so the writes
# of the record move under it without touching it; the questions sit where
# the pin and the ControllerRevision history disagree.
cells:
  # --- Pinned/Stable -----------------------------------------------------------
  - {state: Pinned/Stable, event: write.coordRolledOut, outcome: ignore, note: "the record moves under the pin; the pin is immutable until the run closes or retargets", invariants: [pin.outranks.record], placement: unit, status: current}
  - {state: Pinned/Stable, event: write.coordReady, outcome: ignore, note: "latestReady moves under the pin", placement: unit, status: current}
  - {state: Pinned/Stable, event: write.canaryReady, outcome: ignore, note: "latestReady moves under the pin", placement: unit, status: current}
  - {state: Pinned/Stable, event: write.canaryPromoted, outcome: ignore, note: "the record settles on the target under the pin; the run closes Completed once every member converged", invariants: [pin.outranks.record], placement: unit, status: current}
  - {state: Pinned/Stable, event: write.canaryRolledBack, outcome: ignore, note: "the record returns to the stable under the pin; the run closes RolledBack once the revert settles", invariants: [pin.outranks.record], placement: unit, status: current}
  - {state: Pinned/Stable, event: write.canarySettled, outcome: ignore, note: "a member with no ladder active is recorded under the pin", placement: unit, status: current}
  - {state: Pinned/Stable, event: run.retarget, variants: [moved], outcome: transition, to: Pinned/Stable, note: "the pinned stable is carried into the fresh run, so a mid-ladder retarget keeps the pre-canary stable as the rollback target", placement: unit, status: current}
  - {state: Pinned/Stable, event: run.retarget, variants: [unmoved], outcome: transition, to: Pinned/Stable, note: "a Component still on its pinned revision resolves its stable afresh; the replica answers", invariants: [replica.answers.first], placement: unit, status: current}
  - {state: Pinned/Stable, event: run.close, variants: [completed], outcome: transition, to: Settled, note: "the pin becomes the last-run record; the Component's record settled on the target before the close", placement: unit, status: current}
  - {state: Pinned/Stable, event: run.close, variants: [rolledBack], outcome: transition, to: Settled, note: "the pin becomes the last-run record with its outcome; a later revert read for a member with no active pin still finds its stable there", placement: unit, status: current}
  - {state: Pinned/Stable, event: canary.armed, outcome: ignore, note: "the unit's stable identity is seeded from the pin and never re-inferred", invariants: [pin.outranks.record], placement: unit, status: current}
  - {state: Pinned/Stable, event: canary.cutoverCleared, outcome: ignore, note: "the unit's identity drops; the pin keeps its stable until the run closes", placement: unit, status: current}
  - {state: Pinned/Stable, event: replica.currentPromoted, outcome: ignore, note: "the pin is immutable; the run layer judges convergence on the live pair", placement: unit, status: current}
  - {state: Pinned/Stable, event: replica.currentWithdrawn, outcome: ignore, note: "the pin is immutable; the run layer reads the withdrawal as a roll in flight", placement: unit, status: current}
  - {state: Pinned/Stable, event: replica.targetBumped, outcome: ignore, note: "the run layer reads the bump as a retarget on its next pass", placement: unit, status: current}
  - {state: Pinned/Stable, event: cr.collected, outcome: DECIDE, to: Pinned/Disagrees, note: "today: the retention sweep keeps only live names (the replica's current and update revisions and the rows' revisions), so a pinned stable whose last Instance rolled can be collected mid-run; a rollback then finds no retained ControllerRevision and the unit parks. Question: should the pinned stable, and the canary unit's stable identity, count as live names for retention while the run is open?", invariants: [live.names.retained], placement: unit, status: current}
  - {state: Pinned/Stable, event: cr.collision, outcome: ignore, note: "a new hash for the same template is a retarget to the run layer", placement: unit, status: current}
  - {state: Pinned/Stable, event: scope.rotated, outcome: transition, to: Pinned/Disagrees, note: "the replica re-projected mid-run mints new hashes; the pinned stable is no longer carried by any retained ControllerRevision", placement: unit, status: current}
  - {state: Pinned/Stable, event: read.pinStable, outcome: ignore, note: "within a run the chooser runs only for an unmoved member at a retarget; the pin stands", invariants: [pin.outranks.record], placement: unit, status: current}
  - {state: Pinned/Stable, event: read.rollbackStable, variants: [activeRun], outcome: ignore, note: "the pin's stable answers the revert signal and the rollback inputs", invariants: [pin.outranks.record], placement: unit, status: current}
  - {state: Pinned/Stable, event: read.stableCR, variants: [retained], outcome: ignore, note: "the exact hash resolves to the ControllerRevision the replica controls; the revert signal names it", invariants: [history.is.exact], placement: unit, status: current}
  - {state: Pinned/Stable, event: read.rollbackCR, variants: [retained], outcome: ignore, note: "the replica renders the stored payload and rolls every Instance to it while its update revision keeps reporting the spec target", invariants: [history.is.exact], placement: unit, status: current}
  - {state: Pinned/Stable, event: read.staleCopy, variants: [canaryOwned], outcome: defer, note: "the flush keeps the live fields and the pass requeues; the pin is kept by its newer clock", placement: sim, status: current}
  - {state: Pinned/Stable, event: read.staleCopy, variants: [coordinationOwned], outcome: DECIDE, note: "today: the cached copy of the fields is written back under the pin. Question: as Settled/read.staleCopy[coordinationOwned].", placement: sim, status: current}
  - {state: Pinned/Stable, event: read.statusTrails, outcome: defer, note: "no retarget or close is judged on a trailing status", invariants: [replica.answers.first], placement: unit, status: current}
  # --- Pinned/NoStable ---------------------------------------------------------
  - {state: Pinned/NoStable, event: write.coordRolledOut, outcome: ignore, note: "the first rollout's record lands under the pin; the pin stays without a stable until the run closes", placement: unit, status: current}
  - {state: Pinned/NoStable, event: write.coordReady, outcome: ignore, note: "latestReady moves under the pin", placement: unit, status: current}
  - {state: Pinned/NoStable, event: write.canaryReady, outcome: ignore, note: "a member whose unit never armed still publishes its Ready target", placement: unit, status: current}
  - {state: Pinned/NoStable, event: write.canarySettled, outcome: ignore, note: "recorded under the pin", placement: unit, status: current}
  - {state: Pinned/NoStable, event: run.retarget, variants: [unmoved], outcome: transition, to: Pinned/Stable, note: "a Component still on its pinned revision resolves its stable afresh: the replica's current revision answers now", invariants: [replica.answers.first], placement: unit, status: current}
  - {state: Pinned/NoStable, event: run.retarget, variants: [moved], outcome: transition, to: Pinned/NoStable, note: "the unknown stable is carried for a Component that moved, so the fresh run arms no ladder for it either", placement: unit, status: current}
  - {state: Pinned/NoStable, event: run.close, variants: [completed], outcome: transition, to: Settled, note: "the first rollout converged; the record names it and the next run finds a current revision to answer with", placement: unit, status: current}
  - {state: Pinned/NoStable, event: replica.currentPromoted, outcome: ignore, note: "the pin is immutable; the run layer judges convergence on the live pair", placement: unit, status: current}
  - {state: Pinned/NoStable, event: replica.currentWithdrawn, outcome: ignore, note: "the pin is immutable", placement: unit, status: current}
  - {state: Pinned/NoStable, event: replica.targetBumped, outcome: ignore, note: "a retarget to the run layer", placement: unit, status: current}
  - {state: Pinned/NoStable, event: cr.collected, outcome: ignore, note: "nothing is pinned that a collected revision could invalidate", placement: unit, status: current}
  - {state: Pinned/NoStable, event: cr.collision, outcome: ignore, note: "a new hash for the same template", placement: unit, status: current}
  - {state: Pinned/NoStable, event: scope.rotated, outcome: ignore, note: "nothing pinned to disagree with", placement: unit, status: current}
  - {state: Pinned/NoStable, event: read.pinStable, outcome: ignore, note: "the chooser runs only for an unmoved member at a retarget; the replica answers", invariants: [replica.answers.first], placement: unit, status: current}
  - {state: Pinned/NoStable, event: read.rollbackStable, variants: [lastRunRolledBack], outcome: ignore, note: "a member with no pinned stable takes the stable the last rolled-back run recorded for it", placement: unit, status: current}
  - {state: Pinned/NoStable, event: read.rollbackStable, variants: [canaryRecord], outcome: ignore, note: "the unit record's stable identity answers for the primary alone", placement: unit, status: current}
  - {state: Pinned/NoStable, event: read.rollbackStable, variants: [latestRolledout], outcome: DECIDE, note: "today: a secondary with no pinned stable and no record of its own takes latestRolledoutRevision as its revert target, a record written from a past pod view. Question: should a member's revert target come only from the pin (made to pin a stable for every grouped member) and the ControllerRevision history, never from the record?", placement: unit, status: current}
  - {state: Pinned/NoStable, event: read.rollbackStable, variants: [none], outcome: ignore, note: "no revert is signalled for the member and the revert does not wait on it", placement: unit, status: current}
  - {state: Pinned/NoStable, event: read.staleCopy, variants: [canaryOwned], outcome: defer, note: "the flush keeps the live fields and the pass requeues", placement: sim, status: current}
  - {state: Pinned/NoStable, event: read.staleCopy, variants: [coordinationOwned], outcome: DECIDE, note: "today: the cached copy is written back. Question: as Settled/read.staleCopy[coordinationOwned].", placement: sim, status: current}
  - {state: Pinned/NoStable, event: read.statusTrails, outcome: defer, note: "no retarget or close is judged on a trailing status", placement: unit, status: current}
  # --- Pinned/Disagrees --------------------------------------------------------
  - {state: Pinned/Disagrees, event: write.coordRolledOut, outcome: ignore, note: "the record moves under the pin; the pin keeps the stable the history does not carry", invariants: [pin.outranks.record], placement: unit, status: current}
  - {state: Pinned/Disagrees, event: write.coordReady, outcome: ignore, note: "latestReady moves under the pin", placement: unit, status: current}
  - {state: Pinned/Disagrees, event: write.canaryReady, outcome: ignore, note: "latestReady moves under the pin", placement: unit, status: current}
  - {state: Pinned/Disagrees, event: write.canaryPromoted, outcome: ignore, note: "a cutover can land although the pinned stable is unreachable; the record settles on the target", placement: unit, status: current}
  - {state: Pinned/Disagrees, event: write.canaryRolledBack, outcome: ignore, note: "a revert toward a stable the history does not carry parks instead of completing, so this write does not come", placement: unit, status: current}
  - {state: Pinned/Disagrees, event: write.canarySettled, outcome: ignore, note: "recorded under the pin", placement: unit, status: current}
  - {state: Pinned/Disagrees, event: run.retarget, variants: [moved], outcome: DECIDE, to: Pinned/Disagrees, note: "today: the disagreeing stable is carried into the fresh run for a Component that moved, so the new run inherits a rollback target the history does not carry. Question: should a retarget re-resolve a pinned stable that no retained ControllerRevision carries instead of carrying it?", placement: unit, status: current}
  - {state: Pinned/Disagrees, event: run.retarget, variants: [unmoved], outcome: transition, to: Pinned/Stable, note: "a Component still on its pinned revision resolves its stable afresh from the replica", invariants: [replica.answers.first], placement: unit, status: current}
  - {state: Pinned/Disagrees, event: run.close, variants: [completed], outcome: transition, to: Settled, note: "the run converged forward; the unreachable stable leaves with the pin", placement: unit, status: current}
  - {state: Pinned/Disagrees, event: canary.armed, outcome: DECIDE, note: "today: the bind arms the ladder with the disagreeing stable as the unit's identity; traffic shifts from a revision no Instance may run and the rollback target is unreachable until a new target appears. Question: should the bind refuse to arm when the pinned stable is not a retained ControllerRevision the replica controls?", invariants: [pin.outranks.record], placement: unit, status: current}
  - {state: Pinned/Disagrees, event: canary.cutoverCleared, outcome: ignore, note: "the unit's identity drops; the pin keeps its stable until the run closes", placement: unit, status: current}
  - {state: Pinned/Disagrees, event: replica.currentPromoted, outcome: ignore, note: "the pin is immutable; the run layer judges convergence on the live pair", placement: unit, status: current}
  - {state: Pinned/Disagrees, event: replica.currentWithdrawn, outcome: ignore, note: "the pin is immutable", placement: unit, status: current}
  - {state: Pinned/Disagrees, event: replica.targetBumped, outcome: ignore, note: "a retarget to the run layer", placement: unit, status: current}
  - {state: Pinned/Disagrees, event: cr.collected, outcome: ignore, note: "the pinned stable is already missing from the history", placement: unit, status: current}
  - {state: Pinned/Disagrees, event: cr.collision, outcome: ignore, note: "a new hash for the same template", placement: unit, status: current}
  - {state: Pinned/Disagrees, event: scope.rotated, outcome: ignore, note: "already disagreeing", placement: unit, status: current}
  - {state: Pinned/Disagrees, event: read.pinStable, outcome: ignore, note: "the chooser runs only for an unmoved member at a retarget; the replica answers", invariants: [replica.answers.first], placement: unit, status: current}
  - {state: Pinned/Disagrees, event: read.rollbackStable, variants: [activeRun], outcome: DECIDE, note: "today: the pin's stable answers first although the history does not carry it; the dispatch then finds no ControllerRevision and parks the unit with the StableRevisionMissing marker, and no reader falls back to the newest retained revision. Question: when the pin and the ControllerRevision history disagree, which wins for a rollback: the pin (park, as today), the newest retained revision the replica controls, or a refusal that asks the operator?", invariants: [history.is.exact], placement: unit, status: current}
  - {state: Pinned/Disagrees, event: read.stableCR, variants: [notRetained], outcome: DECIDE, note: "today: no retained ControllerRevision carries the hash, so no revert target is written and the canary unit parks Failed with the StableRevisionMissing marker; the request is handed back. Question: as read.rollbackStable[activeRun].", invariants: [history.is.exact], placement: unit, status: current}
  - {state: Pinned/Disagrees, event: read.stableCR, variants: [foreign], outcome: escalate, note: "a revision only another object controls is never pinned onto the replica; the unit parks as for a missing one", invariants: [history.is.exact], placement: unit, status: current}
  - {state: Pinned/Disagrees, event: read.rollbackCR, variants: [gone], outcome: DECIDE, note: "today: a pinned rollback revision the replica cannot find makes it roll to its spec target instead, with no event, while the canary unit still reads the revert as in progress. Question: should a missing rollback revision hold the replica and be reported rather than turn the revert into a forward roll?", invariants: [history.is.exact], placement: unit, status: current}
  - {state: Pinned/Disagrees, event: read.rollbackCR, variants: [foreign], outcome: reject, note: "a revision another object controls is refused with a RollbackRevisionForeign warning and the replica rolls to its spec", invariants: [history.is.exact], placement: unit, status: current}
  - {state: Pinned/Disagrees, event: read.staleCopy, variants: [canaryOwned], outcome: defer, note: "the flush keeps the live fields and the pass requeues", placement: sim, status: current}
  - {state: Pinned/Disagrees, event: read.staleCopy, variants: [coordinationOwned], outcome: DECIDE, note: "today: the cached copy is written back. Question: as Settled/read.staleCopy[coordinationOwned].", placement: sim, status: current}
  - {state: Pinned/Disagrees, event: read.statusTrails, outcome: defer, note: "no retarget or close is judged on a trailing status", placement: unit, status: current}
