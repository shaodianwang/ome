# The three pinned shapes. Every reader takes the pin first, so the writes
# of the record move under it without touching it; the questions sit where
# the pin and the ControllerRevision history disagree.
cells:
  # --- Pinned/Stable -----------------------------------------------------------
  - {state: Pinned/Stable, event: write.coordRolledOut, outcome: ignore, note: "the record moves under the pin as the one revision with Ready pods changes; the pin is immutable until the run closes or retargets", invariants: [pin.outranks.record], placement: unit, coverage: {unit: [TestRecordRolledOutRevision], replay: [open-and-close, record-starts-with-a-diverged-pair, straggling-pair-pins-the-record]}, status: decided}
  - {state: Pinned/Stable, event: write.coordReady, outcome: ignore, note: "latestReady moves under the pin once the update revision has a Ready pod; until then it stays as it was", placement: unit, coverage: {unit: [TestSetLatestReadyRevision], replay: [record-starts-with-a-diverged-pair, straggling-pair-pins-the-record]}, status: decided}
  - {state: Pinned/Stable, event: write.canaryReady, outcome: ignore, note: "latestReady moves under the pin the pass the member's target has Ready capacity", placement: unit, coverage: {unit: [TestDispatch_MembersRecordTheRolledOutRevisions], replay: [rollback-finds-no-stable-revision, stale-read-misses-repin]}, status: decided}
  - {state: Pinned/Stable, event: write.canaryPromoted, outcome: ignore, note: "the record settles on the target under the pin; the run closes Completed once every member converged and the unit reads Stable", invariants: [pin.outranks.record], placement: unit, coverage: {unit: [TestReconcile_CompletionRecordsEveryMembersRevisions, TestCanaryRunClosesOnceTheUnitReadsStable]}, status: decided}
  - {state: Pinned/Stable, event: write.canaryRolledBack, outcome: ignore, note: "the record returns to the stable under the pin; the run closes RolledBack once the revert of the revision it presented settles", invariants: [pin.outranks.record], placement: unit, coverage: {unit: [TestReconcile_RollbackCompletionRecordsTheStableRevision, TestRolledBackRunStillClosesForTheGroupThatFailed]}, status: decided}
  - {state: Pinned/Stable, event: write.canarySettled, outcome: ignore, note: "a member whose unit has no ladder active is recorded on the revision its replica settled on, under the pin", placement: unit, coverage: {unit: [TestRecordSettledRevisionsFollowsTheReplica]}, status: decided}
  - {state: Pinned/Stable, event: run.retarget, variants: [moved], outcome: transition, to: Pinned/Stable, note: "the run closes Superseded and a fresh run opens; the pinned stable is carried for a Component that moved, so a mid-ladder retarget keeps the pre-canary stable as the rollback target", placement: unit, coverage: {unit: [TestRetargetClosesSupersededAndReopens, TestRetargetDuringRollbackUsesActiveComponentTargets]}, status: decided}
  - {state: Pinned/Stable, event: run.retarget, variants: [unmoved], outcome: transition, to: Pinned/Stable, note: "a known pinned stable is carried for a Component still on its pinned revision as much as for one that moved; the fresh run resolves a stable afresh only where the pin recorded none", placement: unit, coverage: {unit: [TestRetargetCarriesAKnownStableForAnUnmovedComponent, TestRetargetKeepsUnmovedComponentStableKnown]}, status: decided}
  - {state: Pinned/Stable, event: run.close, variants: [completed], outcome: transition, to: Settled, note: "every pinned member converged on the target: the pin becomes the bounded last-run record and the record, which settled on the target under the pin, stands", placement: unit, coverage: {unit: [TestCompletedCloseKeepsBoundedRecord, TestCanaryRunClosesOnceTheUnitReadsStable], replay: [open-and-close, record-starts-with-a-diverged-pair, straggling-pair-pins-the-record, withdrawn-current-opens-a-run-on-the-record]}, status: decided}
  - {state: Pinned/Stable, event: run.close, variants: [rolledBack], outcome: transition, to: Settled, note: "the revert of the revision this run presented settled: the pin becomes the last-run record with its outcome, and a later revert read for a member with no active pin finds its stable there", placement: unit, coverage: {unit: [TestRolledBackRunStillClosesForTheGroupThatFailed, TestComponentStableRevisionHashPrecedence]}, status: decided}
  - {state: Pinned/Stable, event: canary.armed, outcome: ignore, note: "the bind resets the unit's record for the new target and seeds its stable identity from the pin; it is never re-inferred afterwards", invariants: [pin.outranks.record], placement: unit, coverage: {unit: [TestBindRunAtomicallyResetsFreshRun], replay: [rollback-finds-no-stable-revision]}, status: decided}
  - {state: Pinned/Stable, event: canary.cutoverCleared, outcome: ignore, note: "the unit's identity drops with the cutover; the pin keeps its stable until the run closes", placement: unit, coverage: {unit: [TestReconcile_CompleteClearsStableIdentity]}, status: decided}
  - {state: Pinned/Stable, event: replica.currentPromoted, outcome: ignore, note: "the pin is immutable; the run layer judges convergence on the live pair and closes once current and update both name the pin with no Instance trailing", placement: unit, coverage: {unit: [TestCompletedCloseKeepsBoundedRecord], replay: [open-and-close, record-starts-with-a-diverged-pair]}, status: decided}
  - {state: Pinned/Stable, event: replica.currentWithdrawn, outcome: ignore, note: "the pin is immutable; a withdrawn current revision is not the pinned one, so the run layer reads a roll still in flight and keeps the run open", placement: unit, coverage: {unit: [TestRevertMidSurgeKeepsOneRunOpen, TestCurrentRevisionFor/one_Instance_still_on_the_superseded_revision_is_enough_to_withdraw]}, status: decided}
  - {state: Pinned/Stable, event: replica.targetBumped, outcome: ignore, note: "an update revision off the pin that is not the unit's rejected one is a retarget on the run layer's next pass", placement: unit, coverage: {unit: [TestRetargetClosesSupersededAndReopens, TestStickyRejectSuppressesReopen], replay: [stale-read-misses-close]}, status: decided}
  - {state: Pinned/Stable, event: cr.collected, outcome: transition, to: Pinned/Disagrees, note: "today the sweep keeps only live names, the replica's pair and the rows' running and target revisions, so a pinned stable whose last Instance rolled is collected once more than the configured number of newer non-live revisions exist; a rollback then finds no retained ControllerRevision and the unit parks Failed; which is wrong because the engine discards a rollback target its own pin still names", invariants: [live.names.retained], placement: unit, coverage: {unit: [TestRetainControllerRevisions_DropsOldestNonLive, TestCollectLiveRevisionNames_UnionAcrossInstanceStatuses, TestDispatch_RollbackWithoutStableRevisionParksFailed]}, status: decided}
  - {state: Pinned/Stable, event: cr.collision, outcome: ignore, note: "a collision bumps the collision count and the same template mints a new hash, a retarget to the run layer", placement: unit, coverage: {unit: [TestEnsureControllerRevision_DetectsCollision, TestRevisionHash_CollisionCountChangesHash]}, status: decided}
  - {state: Pinned/Stable, event: scope.rotated, outcome: transition, to: Pinned/Disagrees, note: "the re-projected replica mints its hashes under the new owner UID; the pinned stable is carried by no retained ControllerRevision any more", placement: unit, coverage: {unit: [TestRevisionHash_OwnerUIDPartitionsTheNameSpace, TestRevisionScopeUIDFollowsTheForm]}, status: decided}
  - {state: Pinned/Stable, event: read.pinStable, outcome: ignore, note: "within a run the chooser runs only at a retarget, for a Component whose pin recorded no stable; a known pin stands", invariants: [pin.outranks.record], placement: unit, coverage: {unit: [TestRetargetCarriesAKnownStableForAnUnmovedComponent, TestRetargetKeepsUnmovedComponentStableKnown]}, status: decided}
  - {state: Pinned/Stable, event: read.rollbackStable, variants: [activeRun], outcome: ignore, note: "the active run's pinned stable answers the revert signal and the rollback inputs before any record", invariants: [pin.outranks.record], placement: unit, coverage: {unit: [TestComponentStableRevisionHashPrecedence, TestDispatch_RollbackTargetsPersistedStableAfterRetarget]}, status: decided}
  - {state: Pinned/Stable, event: read.stableCR, variants: [retained], outcome: ignore, note: "the exact hash resolves to the ControllerRevision the replica controls, and the revert signal names it on every member", invariants: [history.is.exact], placement: unit, coverage: {unit: [TestStableRevisionName_PersistedIdentity, TestRollbackSignal_PinsOnlyARevisionTheReplicaControls, TestDispatch_PDRouterRollbackTargetsStable]}, status: decided}
  - {state: Pinned/Stable, event: read.rollbackCR, variants: [retained], outcome: ignore, note: "the replica renders the stored payload and rolls every Instance to it while its update revision keeps reporting the spec target", invariants: [history.is.exact], placement: unit, coverage: {unit: [TestRollbackRevisionMustBeControlledByTheReplica, TestApplyRollbackPayload_RecordedTopologyIsAuthoritative]}, status: decided}
  - {state: Pinned/Stable, event: read.staleCopy, variants: [canaryOwned], outcome: defer, note: "the flush keeps the live executor state of every canary-owned unit and the pass requeues; the pin is kept by its newer clock", placement: sim, coverage: {unit: [TestBaseKeepsTheLiveRecordOverAStalePass, TestPreserveNewerRunKeepsFresherPin], replay: [stale-read-misses-repin]}, status: decided}
  - {state: Pinned/Stable, event: read.staleCopy, variants: [coordinationOwned], outcome: ignore, note: "today the cached copy of a coordination-owned Component's three fields is written back under the pin, which the flush keeps by its newer clock; the pin is unchanged, but the record is wrong for the same reason as outside a run", placement: sim, coverage: {unit: [TestPreserveNewerRunKeepsFresherPin], replay: [stale-copy-resurrects-the-coordination-record]}, status: decided}
  - {state: Pinned/Stable, event: read.statusTrails, outcome: defer, note: "no retarget or close is judged on a trailing status: the run layer requeues until every pinned replica is fresh", invariants: [replica.answers.first], placement: unit, coverage: {unit: [TestRevertAtTheLastInstanceWaitsForTheProjectionBeforeJudgingTheRun]}, status: decided}
  # --- Pinned/NoStable ---------------------------------------------------------
  - {state: Pinned/NoStable, event: write.coordRolledOut, outcome: ignore, note: "the first rollout's record lands under the pin once one revision has Ready pods; the pin stays without a stable until the run closes", placement: unit, coverage: {unit: [TestRecordRolledOutRevision, TestReconcile_PreviousRolledoutRecordedOnAdvance]}, status: decided}
  - {state: Pinned/NoStable, event: write.coordReady, outcome: ignore, note: "latestReady moves under the pin once the update revision has a Ready pod", placement: unit, coverage: {unit: [TestSetLatestReadyRevision]}, status: decided}
  - {state: Pinned/NoStable, event: write.canaryReady, outcome: ignore, note: "a unit with no stable never arms, so the executor's ready write never runs for its members; their revisions are recorded by the settled write once each replica settles on the target", placement: unit, coverage: {unit: [TestReconcile_NoStableRevisionDoesNotArm, TestRecordSettledRevisionsFollowsTheReplica]}, status: decided}
  - {state: Pinned/NoStable, event: write.canarySettled, outcome: ignore, note: "a member whose replica settled on one revision with a Ready pod is recorded on it under the pin", placement: unit, coverage: {unit: [TestRecordSettledRevisionsFollowsTheReplica]}, status: decided}
  - {state: Pinned/NoStable, event: run.retarget, variants: [unmoved], outcome: transition, to: Pinned/Stable, note: "a Component still on its pinned revision with no stable recorded resolves its stable afresh, and the replica's current revision answers now", invariants: [replica.answers.first], placement: unit, coverage: {unit: [TestRetargetKeepsUnmovedComponentStableKnown]}, status: decided}
  - {state: Pinned/NoStable, event: run.retarget, variants: [moved], outcome: transition, to: Pinned/NoStable, note: "the unknown stable is carried for a Component that moved, so the fresh run arms no ladder for it either", placement: unit, coverage: {unit: [TestRetargetKeepsUnmovedComponentStableKnown, TestRetargetDoesNotGuessMissingStableRevision]}, status: decided}
  - {state: Pinned/NoStable, event: run.close, variants: [completed], outcome: transition, to: Settled, note: "a unit with no stable never armed, so the run closes Completed once every member's pair names the pin with no Instance trailing; the record names it and the next run finds a current revision to answer with", placement: unit, coverage: {unit: [TestCreationRunClosesWithoutCanaryState]}, status: decided}
  - {state: Pinned/NoStable, event: replica.currentPromoted, outcome: ignore, note: "the pin is immutable; the run layer judges convergence on the live pair", placement: unit, coverage: {unit: [TestCreationRunClosesWithoutCanaryState]}, status: decided}
  - {state: Pinned/NoStable, event: replica.currentWithdrawn, outcome: ignore, note: "the pin is immutable; a withdrawn current revision is not the pinned one, so the run stays open", placement: unit, coverage: {unit: [TestCurrentRevisionFor/one_Instance_still_on_the_superseded_revision_is_enough_to_withdraw, TestRevertMidSurgeKeepsOneRunOpen]}, status: decided}
  - {state: Pinned/NoStable, event: replica.targetBumped, outcome: ignore, note: "an update revision off the pin is a retarget on the run layer's next pass", placement: unit, coverage: {unit: [TestRetargetDoesNotGuessMissingStableRevision]}, status: decided}
  - {state: Pinned/NoStable, event: cr.collected, outcome: ignore, note: "nothing is pinned that a collected revision could invalidate; the sweep keeps the pair and the rows' revisions", placement: unit, coverage: {unit: [TestRetainControllerRevisions_NeverDeletesLiveRevisions]}, status: decided}
  - {state: Pinned/NoStable, event: cr.collision, outcome: ignore, note: "a collision bumps the collision count and the same template mints a new hash", placement: unit, coverage: {unit: [TestEnsureControllerRevision_DetectsCollision]}, status: decided}
  - {state: Pinned/NoStable, event: scope.rotated, outcome: ignore, note: "the re-projected replica mints new names; nothing is pinned to disagree with them", placement: unit, coverage: {unit: [TestRevisionHash_OwnerUIDPartitionsTheNameSpace]}, status: decided}
  - {state: Pinned/NoStable, event: read.pinStable, outcome: ignore, note: "the chooser runs at a retarget for a Component still on its pinned revision; the replica's current revision answers", invariants: [replica.answers.first], placement: unit, coverage: {unit: [TestRetargetKeepsUnmovedComponentStableKnown]}, status: decided}
  - {state: Pinned/NoStable, event: read.rollbackStable, variants: [lastRunRolledBack], outcome: ignore, note: "a member with no pinned stable takes the stable the last rolled-back run recorded for it", placement: unit, coverage: {unit: [TestComponentStableRevisionHashPrecedence]}, status: decided}
  - {state: Pinned/NoStable, event: read.rollbackStable, variants: [canaryRecord], outcome: ignore, note: "the unit record's stable identity answers for the primary alone", placement: unit, coverage: {unit: [TestComponentStableRevisionHashPrecedence]}, status: decided}
  - {state: Pinned/NoStable, event: read.rollbackStable, variants: [latestRolledout], outcome: ignore, note: "a member with no pinned stable, no rolled-back run record and no canary record of its own takes latestRolledoutRevision as its revert target: the record every writer keeps at each completed promotion and rollback, so a secondary resolves although no run records it", placement: unit, coverage: {unit: [TestComponentStableRevisionHashPrecedence, TestDispatch_RollbackStableResolvesFromTheRolledOutRevision]}, status: decided}
  - {state: Pinned/NoStable, event: read.rollbackStable, variants: [none], outcome: ignore, note: "with no stable known the dispatch writes no revert signal for the member and does not clear one already there; the revert does not wait on it", placement: unit, coverage: {unit: [TestRollbackSignal_UnknownStableKeepsTarget]}, status: decided}
  - {state: Pinned/NoStable, event: read.staleCopy, variants: [canaryOwned], outcome: defer, note: "the flush keeps the live executor state of every canary-owned unit and the pass requeues", placement: sim, coverage: {unit: [TestBaseKeepsTheLiveRecordOverAStalePass], replay: [stale-read-misses-repin]}, status: decided}
  - {state: Pinned/NoStable, event: read.staleCopy, variants: [coordinationOwned], outcome: ignore, note: "today the cached copy of a coordination-owned Component's three fields is written back under the pin; the pin is unchanged, but the record is wrong for the same reason as outside a run", placement: sim, coverage: {replay: [stale-copy-resurrects-the-coordination-record]}, status: decided}
  - {state: Pinned/NoStable, event: read.statusTrails, outcome: defer, note: "no retarget or close is judged on a trailing status: the run layer requeues until every pinned replica is fresh", placement: unit, coverage: {unit: [TestRevertAtTheLastInstanceWaitsForTheProjectionBeforeJudgingTheRun]}, status: decided}
  # --- Pinned/Disagrees --------------------------------------------------------
  - {state: Pinned/Disagrees, event: write.coordRolledOut, outcome: ignore, note: "the record moves under the pin; the pin keeps the stable the history does not carry", invariants: [pin.outranks.record], placement: unit, coverage: {unit: [TestRecordRolledOutRevision]}, status: decided}
  - {state: Pinned/Disagrees, event: write.coordReady, outcome: ignore, note: "latestReady moves under the pin once the update revision has a Ready pod", placement: unit, coverage: {unit: [TestSetLatestReadyRevision]}, status: decided}
  - {state: Pinned/Disagrees, event: write.canaryReady, outcome: ignore, note: "latestReady moves under the pin the pass the member's target has Ready capacity", placement: unit, coverage: {unit: [TestDispatch_MembersRecordTheRolledOutRevisions], replay: [rollback-finds-no-stable-revision]}, status: decided}
  - {state: Pinned/Disagrees, event: write.canaryPromoted, outcome: ignore, note: "a cutover lands although the pinned stable is unreachable: the record settles on the target with the pinned stable as previous", placement: unit, coverage: {unit: [TestReconcile_CompletionRecordsEveryMembersRevisions]}, status: decided}
  - {state: Pinned/Disagrees, event: write.canaryRolledBack, outcome: ignore, note: "a revert toward a stable the history does not carry parks the unit Failed instead of completing, so this write never comes", placement: unit, coverage: {unit: [TestDispatch_RollbackWithoutStableRevisionParksFailed], replay: [rollback-finds-no-stable-revision]}, status: decided}
  - {state: Pinned/Disagrees, event: write.canarySettled, outcome: ignore, note: "a member whose unit has no ladder active is recorded on the revision its replica settled on, under the pin", placement: unit, coverage: {unit: [TestRecordSettledRevisionsFollowsTheReplica]}, status: decided}
  - {state: Pinned/Disagrees, event: run.retarget, variants: [moved], outcome: transition, to: Pinned/Disagrees, note: "today a known stable is carried into the fresh run for a Component that moved whether or not the history carries it, so the new run inherits a rollback target no retained ControllerRevision carries; which is wrong because the retarget is the one pass that could resolve the stable afresh from the replica", placement: unit, coverage: {unit: [TestRetargetClosesSupersededAndReopens, TestRetargetCarriesAKnownStableForAnUnmovedComponent]}, status: decided}
  - {state: Pinned/Disagrees, event: run.retarget, variants: [unmoved], outcome: transition, to: Pinned/Disagrees, note: "today a known stable is carried for a Component still on its pinned revision too; only a pin with no stable is resolved afresh, so the disagreeing stable survives the retarget; which is wrong because the replica's current revision could answer here", placement: unit, coverage: {unit: [TestRetargetCarriesAKnownStableForAnUnmovedComponent, TestRetargetKeepsUnmovedComponentStableKnown]}, status: decided}
  - {state: Pinned/Disagrees, event: run.close, variants: [completed], outcome: transition, to: Settled, note: "the run converged forward: the pin becomes the last-run record and the unreachable stable leaves with it", placement: unit, coverage: {unit: [TestCompletedCloseKeepsBoundedRecord]}, status: decided}
  - {state: Pinned/Disagrees, event: canary.armed, outcome: ignore, note: "today the bind copies the pinned stable into the unit's identity without consulting the history, so the ladder arms and shifts traffic from a revision no Instance may run, and a rollback cannot resolve its target until a new target appears; which is wrong because the bind could refuse to arm a unit whose stable is not a retained ControllerRevision the replica controls", invariants: [pin.outranks.record], placement: unit, coverage: {unit: [TestBindRunAtomicallyResetsFreshRun]}, status: decided}
  - {state: Pinned/Disagrees, event: canary.cutoverCleared, outcome: ignore, note: "the unit's identity drops with the cutover; the pin keeps its stable until the run closes", placement: unit, coverage: {unit: [TestReconcile_CompleteClearsStableIdentity]}, status: decided}
  - {state: Pinned/Disagrees, event: replica.currentPromoted, outcome: ignore, note: "the pin is immutable; the run layer judges convergence on the live pair", placement: unit, coverage: {unit: [TestCompletedCloseKeepsBoundedRecord]}, status: decided}
  - {state: Pinned/Disagrees, event: replica.currentWithdrawn, outcome: ignore, note: "the pin is immutable; a withdrawn current revision is not the pinned one, so the run stays open", placement: unit, coverage: {unit: [TestRevertMidSurgeKeepsOneRunOpen]}, status: decided}
  - {state: Pinned/Disagrees, event: replica.targetBumped, outcome: ignore, note: "an update revision off the pin is a retarget on the run layer's next pass", placement: unit, coverage: {unit: [TestRetargetClosesSupersededAndReopens]}, status: decided}
  - {state: Pinned/Disagrees, event: cr.collected, outcome: ignore, note: "the pinned stable is already missing from the history; the sweep keeps the pair and the rows' revisions", placement: unit, coverage: {unit: [TestRetainControllerRevisions_DropsOldestNonLive]}, status: decided}
  - {state: Pinned/Disagrees, event: cr.collision, outcome: ignore, note: "a collision bumps the collision count and the same template mints a new hash", placement: unit, coverage: {unit: [TestEnsureControllerRevision_DetectsCollision]}, status: decided}
  - {state: Pinned/Disagrees, event: scope.rotated, outcome: ignore, note: "the re-projected replica mints new names; the pin already disagrees with the history", placement: unit, coverage: {unit: [TestRevisionHash_OwnerUIDPartitionsTheNameSpace]}, status: decided}
  - {state: Pinned/Disagrees, event: read.pinStable, outcome: ignore, note: "the chooser runs at a retarget only for a Component whose pin recorded no stable; a known pin stands", invariants: [replica.answers.first], placement: unit, coverage: {unit: [TestRetargetCarriesAKnownStableForAnUnmovedComponent]}, status: decided}
  - {state: Pinned/Disagrees, event: read.rollbackStable, variants: [activeRun], outcome: ignore, note: "the pin's stable answers first although the history does not carry it; the dispatch then finds no ControllerRevision the replica controls, parks the unit Failed with the StableRevisionMissing marker and spends the request, and no reader falls back to the newest retained revision", invariants: [history.is.exact], placement: unit, coverage: {unit: [TestComponentStableRevisionHashPrecedence, TestDispatch_RollbackWithoutStableRevisionParksFailed], replay: [rollback-finds-no-stable-revision]}, status: decided}
  - {state: Pinned/Disagrees, event: read.stableCR, variants: [notRetained], outcome: escalate, note: "no retained ControllerRevision carries the hash: no revert target is written, the unit parks Failed with the StableRevisionMissing marker, and the request is handed back once the flush carried the park", invariants: [history.is.exact], placement: unit, coverage: {unit: [TestStableRevisionName_PersistedIdentity, TestDispatch_RollbackWithoutStableRevisionParksFailed, TestDispatch_MissingStableParkAppliesTheRollbackOnce]}, status: decided}
  - {state: Pinned/Disagrees, event: read.stableCR, variants: [foreign], outcome: escalate, note: "a revision only another object controls is never pinned onto the replica; the unit parks as for a missing one", invariants: [history.is.exact], placement: unit, coverage: {unit: [TestRollbackSignal_PinsOnlyARevisionTheReplicaControls], replay: [rollback-finds-no-stable-revision]}, status: decided}
  - {state: Pinned/Disagrees, event: read.rollbackCR, variants: [gone], outcome: ignore, note: "today a pinned rollback revision the replica cannot find yields no payload and no event, and the replica rolls to its spec target instead while the canary unit still reads the revert as in progress; which is wrong because a revert turns into a forward roll with nothing reported", invariants: [history.is.exact], placement: unit, coverage: {unit: [TestRollbackRevisionMustBeControlledByTheReplica]}, status: decided}
  - {state: Pinned/Disagrees, event: read.rollbackCR, variants: [foreign], outcome: reject, note: "a revision another object controls is refused with a RollbackRevisionForeign warning and the replica rolls to its spec", invariants: [history.is.exact], placement: unit, coverage: {unit: [TestRollbackRevisionMustBeControlledByTheReplica]}, status: decided}
  - {state: Pinned/Disagrees, event: read.staleCopy, variants: [canaryOwned], outcome: defer, note: "the flush keeps the live executor state of every canary-owned unit and the pass requeues", placement: sim, coverage: {unit: [TestBaseKeepsTheLiveRecordOverAStalePass], replay: [stale-read-misses-repin]}, status: decided}
  - {state: Pinned/Disagrees, event: read.staleCopy, variants: [coordinationOwned], outcome: ignore, note: "today the cached copy of a coordination-owned Component's three fields is written back under the pin; the pin is unchanged, but the record is wrong for the same reason as outside a run", placement: sim, coverage: {replay: [stale-copy-resurrects-the-coordination-record]}, status: decided}
  - {state: Pinned/Disagrees, event: read.statusTrails, outcome: defer, note: "no retarget or close is judged on a trailing status: the run layer requeues until every pinned replica is fresh", placement: unit, coverage: {unit: [TestRevertAtTheLastInstanceWaitsForTheProjectionBeforeJudgingTheRun]}, status: decided}
