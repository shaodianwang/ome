# Staging: an intermediate step armed and short of its capacity. The pass
# clocks the wait, keeps a held split on whichever side serves, and parks on
# the ready timeout or a crash; verbs that need the step's gate wait behind
# the capacity gate.
cells:
  - {state: Staging, event: verb.pause, outcome: ignore, note: "the pass observes only: the partition echoes the step, no clock is stamped, a forced promote present is consumed with the reason", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/pause"]}, status: decided}
  - {state: Staging, event: verb.unpause, outcome: ignore, note: "the wait resumes with the clock the pause left; a wait that began before the pause keeps counting through it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/unpause"]}, status: current}
  - {state: Staging, event: verb.promote, variants: [match], outcome: ignore, note: "the capacity gate holds in front of the step's gate; the promote stays live and unconsumed for the pass that meets the capacity", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/promote"]}, status: decided}
  - {state: Staging, event: verb.promote, variants: [stale], outcome: ignore, note: "a value naming another revision opens nothing and is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/promote[stale]"]}, status: current}
  - {state: Staging, event: verb.promote, variants: [applied], outcome: DECIDE, note: "today: a value equal to PromotedThrough is the applied verb re-shown by a lagging cache; the pass hands it back for removal again and clears the record only once no key carries the value, so a promote re-issued with the same value before a pass observed the previous removal is inert. Question: is a same-value promote at the next step acceptable as inert until the record clears, or should the record carry the step it applied to?", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/promote[applied]"]}, status: current}
  - {state: Staging, event: verb.promoteForce, variants: [match], windows: [before], outcome: transition, to: Staging/Final, note: "the force lifts the capacity wait, clears its clock, and opens the step's gate on the same verb; the step advances with PromotedThrough recorded and the split written on the pods that serve. Lands on Staging when the next step is intermediate (T-staging-force), on Staging/Final when it is the last (T-staging-force-final), as in the cited row", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/promoteForce"]}, status: decided}
  - {state: Staging, event: verb.promoteForce, variants: [match], windows: [boundary, after], outcome: ignore, note: "a copy re-shown as or after the advance lands is inert by PromotedThrough; a force racing a rollback or a park is consumed with the reason", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/promoteForce[reshown]"]}, status: current}
  - {state: Staging, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "a value naming another revision lifts nothing and is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/promoteForce[stale]"]}, status: decided}
  - {state: Staging, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "the applied force re-shown is inert and handed back for removal", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/promoteForce[applied]"]}, status: current}
  - {state: Staging, event: verb.rollback, variants: [stableServes], windows: [before], outcome: transition, to: RollingBack, note: "the rejection is recorded and the revert evaluated in the same pass: with no pod off the stable revision, as in the cited row, the unit reads RolledBack at once", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/rollback"]}, status: decided}
  - {state: Staging, event: verb.rollback, variants: [stableServes], windows: [boundary, after], outcome: ignore, note: "the recorded rejection keeps a re-shown request inert; a unit carrying one never takes a request again", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/rollback[reshown]"]}, status: current}
  - {state: Staging, event: verb.rollback, variants: [stableEmpty], outcome: DECIDE, to: RollingBack, note: "today: the operator's rollback proceeds toward a stable revision that runs no live Instance, with a CanaryStableRevisionEmpty warning, and rebuilds every Instance of that member onto it. Question: should an operator rollback toward an empty stable revision be refused like the gate-decided one, or proceed as today?", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/rollback[stableEmpty]"]}, status: current}
  - {state: Staging, event: verb.resume, variants: [own], outcome: reject, note: "nothing is parked: the verb is consumed silently rather than left to fire at the next terminal hold; resume runs ahead of the holds", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/resume"]}, status: decided}
  - {state: Staging, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary: removed with a RolloutResumeRejected warning", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/resume[stale]"]}, status: decided}
  - {state: Staging, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "a value another unit's canary carries is left for that unit's dispatch", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/resume[otherUnit]"]}, status: current}
  - {state: Staging, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "the run layer clamps the step index into the new ladder; the wait continues under the clamped step's capacity", placement: unit, status: current}
  - {state: Staging, event: plan.repin, variants: [raise], outcome: transition, to: PreHold, note: "the clamped step would raise traffic, so the run layer arms the pre-step hold; capacity still converges to the clamped step", placement: unit, status: current}
  - {state: Staging, event: plan.drift, outcome: ignore, note: "the pinned plan executes; the run layer reports the drift and a repin applies it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/planDrift"]}, status: current}
  - {state: Staging, event: plan.unresolved, outcome: DECIDE, note: "today: the controller does not dispatch the unit; its record, phase and projected partition freeze where they are and nothing requeues it. Question: should a unit with a live record whose group stops resolving be parked loudly (an event, a Failed marker) rather than frozen silently?", placement: unit, status: current}
  - {state: Staging, event: run.lost, outcome: DECIDE, note: "today: the unit holds at its step with the step's partition projected and a CanaryRunLost warning until the run layer reopens or adopts it; no grid row covers a staging unit. Question: should a staging unit without a run keep holding instances on the stable revision through its partition, or release the partition until a run is pinned?", invariants: [unpinned.never.steps], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/runLost"]}, status: current}
  - {state: Staging, event: run.adopted, outcome: ignore, note: "the bind attaches the run's target id to the record; the step and its clocks are kept", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/runAdopted"]}, status: current}
  - {state: Staging, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "the record is reset to step 0 toward the new target with the stable identity preserved; the wait starts over", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/newTarget"]}, status: decided}
  - {state: Staging, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "a retarget mid-ladder supersedes the run; the bind resets the record toward the new run's target before the executor's pass", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/newTarget[runOpen]"]}, status: current}
  - {state: Staging, event: capacity.reached, outcome: transition, to: Serving/Manual, note: "the step's split is written on every member and the soak anchor stamped; the gate then decides: Serving/Manual for a bare pause (the cited row), Serving/Timed for a timed one, Serving/Analysis for analysis, and an ungated step advances in the same pass. A rollback or a park landing in the same pass wins", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/capacityReached"]}, status: decided}
  - {state: Staging, event: spec.replicas, outcome: ignore, note: "the step's staged count and partition are recomputed from the new desired count; the wait continues", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/replicasUp"]}, status: current}
  - {state: Staging, event: timer.readyTimeout, outcome: transition, to: Failed, note: "the wait, clocked from when it began, outlived the ready timeout: the unit parks with the stable revision still serving", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/readyTimeout"]}, status: decided}
  - {state: Staging, event: pod.canaryCrashed, outcome: transition, to: Failed, note: "a canary pod that served and keeps dying parks the ladder before any count is read; the split returns to stable", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/canaryCrashed"]}, status: decided}
  - {state: Staging, event: pod.canaryRestarted, outcome: ignore, note: "the restart instant is read by a timed soak only once the split serves", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/canaryRestarted"]}, status: decided}
  - {state: Staging, event: pod.canaryDeleted, outcome: ignore, note: "a pod on its way out is a dip; the wait continues on its clock", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/canaryPodDeleted"]}, status: decided}
  - {state: Staging, event: record.legacy, variants: [noTargetID], outcome: DECIDE, note: "today: a record with no target id under a pinned run adopts the run's id in place and keeps its step. Question: should a pre-run record be adopted silently or re-armed against the pinned target?", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/record[noTargetID]"]}, status: current}
  - {state: Staging, event: record.legacy, variants: [stableEqualsCanary], outcome: DECIDE, note: "today: a persisted pair whose stable equals its canary hash is repaired from the replica's distinct current revision when the controller supplies one; a secondary-only run keeps the equal pair on purpose. Question: is an equal pair on a primary-retargeted unit a repair case or a record to park on?", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/record[stableEqualsCanary]"]}, status: current}
  - {state: Staging, event: record.legacy, variants: [noStable], outcome: ignore, note: "the stable identity is backfilled from the observed stable revision and then never re-inferred", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/record[noStable]"]}, status: current}
  - {state: Staging, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "a negative step from an external status write is clamped to 0 before it can index the plan", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/record[negativeStep]"]}, status: current}
  - {state: Staging, event: record.legacy, variants: [failedPhaseNoMarker], outcome: transition, to: Failed, note: "a Failed phase with no marker is status written before the marker existed and still parks; the hold re-projects the phase", invariants: [phase.is.input], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/record[failedPhaseNoMarker]"]}, status: current}
  - {state: Staging, event: pass.resync, outcome: ignore, note: "the wait continues on its clock; the held split follows the pods", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/resync"]}, status: decided}
  - {state: Staging, event: pass.staleRecord, outcome: defer, note: "the flush keeps the live record over the pass's decisions and the pass requeues; the partition projected earlier in the pass stands", placement: sim, status: current}
