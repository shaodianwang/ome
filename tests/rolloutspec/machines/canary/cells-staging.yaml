# Staging: an intermediate step armed and short of its capacity. The pass
# clocks the wait, keeps a held split on whichever side serves, and parks on
# the ready timeout or a crash; verbs that need the step's gate wait behind
# the capacity gate.
cells:
  - {state: Staging, event: verb.pause, outcome: ignore, note: "the pass observes only: the partition echoes the step, no clock is stamped, a forced promote present is consumed with the reason", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/pause"]}, status: decided}
  - {state: Staging, event: verb.unpause, outcome: ignore, note: "the wait resumes with the clock the pause left, so a wait that began before the pause keeps counting through it; the pause stamps and clears nothing", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/unpause"]}, status: decided}
  - {state: Staging, event: verb.promote, variants: [match], outcome: ignore, note: "the capacity gate holds in front of the step's gate; the promote stays live and unconsumed for the pass that meets the capacity", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/promote"]}, status: decided}
  - {state: Staging, event: verb.promote, variants: [stale], outcome: ignore, note: "a value naming another revision opens nothing and is left in place; only the canary revision's hash is a promote of this ladder", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/promote[stale]"]}, status: decided}
  - {state: Staging, event: verb.promote, variants: [applied], outcome: ignore, note: "a value equal to PromotedThrough is the applied verb re-shown by a lagging cache: it is handed back for removal again and the record clears only once no key carries the value, so a same-value promote re-issued before that is inert; the record keeps one verb to one step", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/promote[applied]"]}, status: decided}
  - {state: Staging, event: verb.promoteForce, variants: [match], windows: [before], outcome: transition, to: Staging/Final, note: "the force lifts the capacity wait, clears its clock, and opens the step's gate on the same verb; the step advances with PromotedThrough recorded and the split written on the pods that serve. Lands on Staging when the next step is intermediate (T-staging-force), on Staging/Final when it is the last (T-staging-force-final), as in the cited row", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/promoteForce"]}, status: decided}
  - {state: Staging, event: verb.promoteForce, variants: [match], windows: [boundary, after], outcome: ignore, note: "a copy re-shown as or after the advance lands is inert by PromotedThrough and handed back for removal; a force racing a rollback or a park is consumed with the reason so it cannot open a later gate", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/promoteForce[reshown]"]}, status: decided}
  - {state: Staging, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "a value naming another revision lifts nothing and is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/promoteForce[stale]"]}, status: decided}
  - {state: Staging, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "the applied force re-shown is inert by PromotedThrough and handed back for removal", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/promoteForce[applied]"]}, status: decided}
  - {state: Staging, event: verb.rollback, variants: [stableServes], windows: [before], outcome: transition, to: RollingBack, note: "the rejection is recorded and the revert evaluated in the same pass: with no pod off the stable revision, as in the cited row, the unit reads RolledBack at once", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/rollback"]}, status: decided}
  - {state: Staging, event: verb.rollback, variants: [stableServes], windows: [boundary, after], outcome: ignore, note: "the recorded rejection is the record that the request was applied, so a copy re-shown after the flush is inert; a unit carrying one never takes a request again", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/rollback[reshown]"]}, status: decided}
  - {state: Staging, event: verb.rollback, variants: [stableEmpty], outcome: transition, to: RollingBack, note: "the operator's rollback is the operator's decision: it proceeds toward a stable revision that runs no live Instance, with a CanaryStableRevisionEmpty warning, and the revert rebuilds every Instance of that member onto it; only a gate-decided rollback parks on an empty stable", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/rollback[stableEmpty]"]}, status: decided}
  - {state: Staging, event: verb.resume, variants: [own], outcome: reject, note: "nothing is parked: the verb is consumed silently rather than left to fire at the next terminal hold; resume runs ahead of the holds", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/resume"]}, status: decided}
  - {state: Staging, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary: removed with a RolloutResumeRejected warning", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/resume[stale]"]}, status: decided}
  - {state: Staging, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "a bare hash is addressed to whichever unit's record carries it, so a value another unit's canary carries is left for that unit's dispatch", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/resume[otherUnit]"]}, status: decided}
  - {state: Staging, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "the run layer clamps the step index into the new ladder and arms no hold when the clamped step's traffic does not exceed the weight on record; the wait continues under the clamped step's capacity", placement: unit, coverage: {replay: ["repin-clamps-a-staging-step"]}, status: decided}
  - {state: Staging, event: plan.repin, variants: [raise], outcome: transition, to: PreHold, note: "a clamped step whose traffic exceeds the weight on record would be immediate exposure once the capacity gate passes, so the run layer arms the pre-step hold; capacity still converges to the clamped step while the traffic raise waits for a promote", placement: unit, coverage: {replay: ["repin-clamps-a-staging-step"]}, status: decided}
  - {state: Staging, event: plan.drift, outcome: ignore, note: "the pinned plan executes; the run layer reports the drift and only a repin applies the edit", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/planDrift"]}, status: decided}
  - {state: Staging, event: plan.unresolved, outcome: ignore, note: "with no executable body the unit is not dispatched and its Components take the full plan-gate hold, so the record, phase and partition freeze where they are until the plan resolves again; the run layer's plan conditions carry the signal", placement: unit, coverage: {unit: ["TestPlanGateHoldPartition"], replay: ["canary-group-stops-resolving-while-staging"]}, status: decided}
  - {state: Staging, event: run.lost, outcome: ignore, note: "the unit holds at its step with the step's partition projected and a CanaryRunLost warning until the run layer reopens or adopts it; keeping the partition leaves the staged instances where they are instead of rolling them back and forth while no plan is pinned", invariants: [unpinned.never.steps], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/runLost"]}, status: decided}
  - {state: Staging, event: run.adopted, outcome: ignore, note: "the bind attaches the run's target id to a record that carries none and keeps its step and clocks, so an in-flight ladder continues under the adopting run", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/runAdopted"]}, status: decided}
  - {state: Staging, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "the record is reset to step 0 toward the new target with the stable identity preserved; the wait starts over", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/newTarget"]}, status: decided}
  - {state: Staging, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "a retarget mid-ladder supersedes the run; the bind resets the record to step 0 toward the new run's target before the executor's pass, with the stable identity preserved", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/newTarget[runOpen]"]}, status: decided}
  - {state: Staging, event: capacity.reached, outcome: transition, to: Serving/Manual, note: "the step's split is written on every member and the soak anchor stamped; the gate then decides: Serving/Manual for a bare pause (the cited row), Serving/Timed for a timed one, Serving/Analysis for analysis, and an ungated step advances in the same pass. A rollback or a park landing in the same pass wins", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/capacityReached"]}, status: decided}
  - {state: Staging, event: spec.replicas, outcome: ignore, note: "the step's staged count and partition are recomputed from the new desired count on every pass; the wait continues", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/replicasUp"]}, status: decided}
  - {state: Staging, event: timer.readyTimeout, outcome: transition, to: Failed, note: "the wait, clocked from when it began, outlived the ready timeout: the unit parks with the stable revision still serving", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/readyTimeout"]}, status: decided}
  - {state: Staging, event: pod.canaryCrashed, outcome: transition, to: Failed, note: "a canary pod that served and keeps dying parks the ladder before any count is read; the split returns to stable", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/canaryCrashed"]}, status: decided}
  - {state: Staging, event: pod.canaryRestarted, outcome: ignore, note: "the restart instant is read by a timed soak only once the split serves", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/canaryRestarted"]}, status: decided}
  - {state: Staging, event: pod.canaryDeleted, outcome: ignore, note: "a pod on its way out is a dip; the wait continues on its clock", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/canaryPodDeleted"]}, status: decided}
  - {state: Staging, event: record.legacy, variants: [noTargetID], outcome: ignore, note: "a record with no target id under a pinned run adopts the run's id in place and keeps its step: the record predates target ids, and re-arming it would restart a ladder that is already in flight", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/record[noTargetID]"]}, status: decided}
  - {state: Staging, event: record.legacy, variants: [stableEqualsCanary], outcome: ignore, note: "a persisted pair whose stable equals its canary hash is repaired from the replica's distinct current revision when the controller supplies one, because the two identities must stay distinct for a primary retarget; a secondary-only run keeps the equal pair on purpose and is told apart by its target id", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/record[stableEqualsCanary]"]}, status: decided}
  - {state: Staging, event: record.legacy, variants: [noStable], outcome: ignore, note: "the stable identity is backfilled from the observed stable revision and then never re-inferred, because the live pod set stops naming the pre-canary stable as revisions retarget and drain", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/record[noStable]"]}, status: decided}
  - {state: Staging, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "status is an unvalidated subresource, so a negative step from an external write is clamped to 0 before it can index the plan", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/record[negativeStep]"]}, status: decided}
  - {state: Staging, event: record.legacy, variants: [failedPhaseNoMarker], outcome: transition, to: Failed, note: "a Failed phase with no marker is status written before the marker existed and still parks; the Failed hold re-projects the phase, so a write that dropped the marker cannot un-park the canary", invariants: [phase.is.input], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/record[failedPhaseNoMarker]"]}, status: decided}
  - {state: Staging, event: pass.resync, outcome: ignore, note: "the wait continues on its clock; the held split follows the pods", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging/resync"]}, status: decided}
  - {state: Staging, event: pass.staleRecord, outcome: defer, note: "the flush compares the live record with the one the pass read and keeps the live record, phase and traffic when they differ; the pass requeues to decide again from the current record, so a decision made from a stale record is never written", placement: unit, coverage: {unit: ["TestBaseKeepsTheLiveRecordOverAStalePass"], replay: ["stale-pass-keeps-the-live-canary-record"]}, status: decided}
