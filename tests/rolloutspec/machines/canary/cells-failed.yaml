# Failed and Failed/StableMissing: the parks. A park is not re-evaluated
# and its clocks are not re-stamped; the stable revision keeps serving until
# the operator rolls back or resumes, or a new target re-arms the unit. The
# grid's Failed fixture has no canary pod left, its Failed[release] fixture
# still has the release's canary pods; both are this one state.
cells:
  - {state: Failed, event: verb.pause, outcome: ignore, note: "the pass observes only; a forced promote present is consumed with the reason", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/pause", "TestReconcileCells/canary/Failed[release]/pause"]}, status: decided}
  - {state: Failed, event: verb.unpause, outcome: ignore, note: "the park stands; the hold re-projects the phase and nothing is re-evaluated", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/unpause"]}, status: decided}
  - {state: Failed, event: verb.promote, variants: [match], outcome: ignore, note: "a park evaluates no gate; the promote is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/promote", "TestReconcileCells/canary/Failed[release]/promote"]}, status: decided}
  - {state: Failed, event: verb.promote, variants: [stale], outcome: ignore, note: "a value naming another revision is left in place; a park reads no promote", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/promote[stale]"]}, status: decided}
  - {state: Failed, event: verb.promote, variants: [applied], outcome: ignore, note: "left in place; the record's sync does not run inside the hold, so the copy is neither taken nor cleared until the unit is live again", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/promote[applied]"]}, status: decided}
  - {state: Failed, event: verb.promoteForce, variants: [match], outcome: reject, note: "a forced promote has nothing to act on while the canary is parked Failed: removed with a CanaryForceIgnored warning", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/promoteForce", "TestReconcileCells/canary/Failed[release]/promoteForce"]}, status: decided}
  - {state: Failed, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "a value naming another revision is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/promoteForce[stale]"]}, status: decided}
  - {state: Failed, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "left in place; the record's sync does not run inside the hold", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/promoteForce[applied]"]}, status: decided}
  - {state: Failed, event: verb.rollback, variants: [stableServes], windows: [before], outcome: transition, to: RollingBack, note: "the request branch precedes the Failed hold: the rollback is the operator's decision about a parked canary, so it ends the park, clears the marker and drains the rejected revision; RolledBack in the same pass when no canary pod remains, RollingBack while the release's canary pods drain", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/rollback", "TestReconcileCells/canary/Failed[release]/rollback"]}, status: decided}
  - {state: Failed, event: verb.rollback, variants: [stableServes], windows: [boundary, after], outcome: ignore, note: "the recorded rejection keeps a re-shown request inert", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/rollback[reshown]"]}, status: decided}
  - {state: Failed, event: verb.rollback, variants: [stableEmpty], outcome: transition, to: RollingBack, note: "the request is the operator's decision, so it proceeds from the park where a gate-decided rollback would park: the marker is cleared, the rejection recorded with a warning naming the member whose stable revision runs no Instance, and the revert rebuilds every Instance of it onto that revision", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/rollback[stableEmpty]"]}, status: decided}
  - {state: Failed, event: verb.resume, variants: [own], windows: [before], outcome: transition, to: Staging, note: "the park is terminal: the record re-arms at step 0 toward the parked revision, every gate re-runs, and the pass returns; a park with no pinned run rejects the resume with a warning instead, since there is no plan to re-enter", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/resume", "TestReconcileCells/canary/Failed[release]/resume"]}, status: decided}
  - {state: Failed, event: verb.resume, variants: [own], windows: [boundary, after], outcome: reject, note: "today a resume leaves no record in status: a copy re-shown while the re-armed unit is live is consumed silently, but one re-shown after the ladder parks again re-arms it a second time, which is wrong because one verb is meant to have one effect", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/resume[reshown]"]}, status: decided}
  - {state: Failed, event: verb.resume, variants: [stale], outcome: reject, note: "the value is not the parked canary revision: removed with a warning, the park stays", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/resume[stale]"]}, status: decided}
  - {state: Failed, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "left for the unit that owns it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/resume[otherUnit]"]}, status: decided}
  - {state: Failed, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "the run layer clamps the index into the new ladder and arms no hold; the park stands under the clamped step", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/repin[holdOrTighten]"]}, status: decided}
  - {state: Failed, event: plan.repin, variants: [raise], outcome: ignore, note: "the clamp arms the pre-step hold under the park, which outranks it; the next re-arm's reset clears both", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/repin[raise]"]}, status: decided}
  - {state: Failed, event: plan.drift, outcome: ignore, note: "the pinned plan stays pinned on a park; a spec edit applies at the next run or a repin", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/planDrift"]}, status: decided}
  - {state: Failed, event: plan.unresolved, outcome: ignore, note: "with no pin and no body the run layer parks the plan with a warning and the unit is not dispatched: the park's heartbeat stops, the projection holds every Instance where it stands, and nothing else changes", placement: unit, coverage: {replay: [failed-stale-record-and-lost-policy]}, status: decided}
  - {state: Failed, event: run.lost, outcome: ignore, note: "the Failed hold precedes the run-lost hold, so the park is serviced without a run: the phase is re-projected and a forced promote consumed with the reason; a rollback from the park still proceeds, while a resume is rejected because there is no pinned plan to re-enter", invariants: [exec.order.fixed, unpinned.never.steps], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/runLost", "TestReconcileCells/canary/Failed/resume[runLost]", "TestReconcileCells/canary/Failed/rollback[runLost]"]}, status: decided}
  - {state: Failed, event: run.adopted, outcome: ignore, note: "a park is mid-flight to the run layer: the target id is attached and the park stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/runAdopted"]}, status: decided}
  - {state: Failed, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "a target that is neither the parked canary nor the stable revision re-arms the unit, clearing the marker", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/newTarget", "TestReconcileCells/canary/Failed[release]/newTarget"]}, status: decided}
  - {state: Failed, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "the bind resets the record toward the new run's target, clearing the marker", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/newTarget[runOpen]"]}, status: decided}
  - {state: Failed, event: capacity.reached, outcome: ignore, note: "the Failed hold precedes the capacity gate: a park is not re-evaluated by capacity coming back", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/capacityReached", "TestReconcileCells/canary/Failed[release]/capacityReached"]}, status: decided}
  - {state: Failed, event: capacity.dropped, outcome: ignore, note: "the park stands; the traffic already rests on the stable revision", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/capacityDropped"]}, status: decided}
  - {state: Failed, event: spec.replicas, outcome: ignore, note: "the step's partition is re-projected from the new count; the park stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/replicasUp"]}, status: decided}
  - {state: Failed, event: pod.canaryCrashed, outcome: ignore, note: "a park is not moved by a crash; the hold precedes the crash reading", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/canaryCrashed", "TestReconcileCells/canary/Failed[release]/canaryCrashed"]}, status: decided}
  - {state: Failed, event: pod.canaryRestarted, outcome: ignore, note: "a park evaluates no soak", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/canaryRestarted"]}, status: decided}
  - {state: Failed, event: pod.canaryDeleted, outcome: ignore, note: "a park is not moved by a dip", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/canaryPodDeleted"]}, status: decided}
  - {state: Failed, event: record.legacy, variants: [noTargetID], outcome: ignore, note: "a record with no target id under a pinned run adopts the run's id in place; the park stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/record[noTargetID]"]}, status: decided}
  - {state: Failed, event: record.legacy, variants: [stableEqualsCanary], outcome: ignore, note: "a pair whose stable equals its canary hash is repaired from the replica's distinct current revision when the pass supplies one; the park stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/record[stableEqualsCanary]"]}, status: decided}
  - {state: Failed, event: record.legacy, variants: [noStable], outcome: ignore, note: "nothing is backfilled inside the hold; a rollback from the park infers its target from the live pods", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/record[noStable]"]}, status: decided}
  - {state: Failed, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "a negative step is clamped to 0 before the plan is indexed; the park stands at the clamped step", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/record[negativeStep]"]}, status: decided}
  - {state: Failed, event: record.legacy, variants: [failedPhaseNoMarker], outcome: ignore, note: "the marker is the record and the phase is re-projected from it; a phase-only Failed parks the same way", invariants: [phase.is.input], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/record[failedPhaseNoMarker]"]}, status: decided}
  - {state: Failed, event: pass.resync, outcome: ignore, note: "the park stands and comes back at the parked cadence", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/resync", "TestReconcileCells/canary/Failed[release]/resync"]}, status: decided}
  - {state: Failed, event: pass.staleRecord, outcome: defer, note: "the flush finds the live record past the pass's base, keeps the live record, phase and traffic and marks the pass stale, so its verbs are not consumed and it requeues", placement: sim, coverage: {replay: [failed-stale-record-and-lost-policy]}, status: decided}
  # --- Failed/StableMissing -----------------------------------------------------------
  - {state: Failed/StableMissing, event: verb.pause, outcome: ignore, note: "the pass echoes the recorded rollback so the controller neither arms nor clears the replica's revert signal; nothing else is written", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/pause"]}, status: decided}
  - {state: Failed/StableMissing, event: verb.unpause, outcome: ignore, note: "the park stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/unpause"]}, status: decided}
  - {state: Failed/StableMissing, event: verb.promote, variants: [match], outcome: ignore, note: "a park evaluates no gate; the promote is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/promote"]}, status: decided}
  - {state: Failed/StableMissing, event: verb.promote, variants: [stale], outcome: ignore, note: "a value naming another revision is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/promote[stale]"]}, status: decided}
  - {state: Failed/StableMissing, event: verb.promote, variants: [applied], outcome: ignore, note: "left in place; the record's sync does not run inside the hold", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/promote[applied]"]}, status: decided}
  - {state: Failed/StableMissing, event: verb.promoteForce, variants: [match], outcome: reject, note: "a forced promote has nothing to act on in a park: removed with a warning", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/promoteForce"]}, status: decided}
  - {state: Failed/StableMissing, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "a value naming another revision is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/promoteForce[stale]"]}, status: decided}
  - {state: Failed/StableMissing, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "left in place; the record's sync does not run inside the hold", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/promoteForce[applied]"]}, status: decided}
  - {state: Failed/StableMissing, event: verb.rollback, variants: [stableServes], outcome: reject, note: "the marker outranks the recorded rejection, so the request branch is skipped and the Failed hold refuses the request and removes it: the park already carries the rejection the request asks for, and the revert it asks for is the one that could not run", invariants: [exec.order.fixed, one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/rollback"]}, status: decided}
  - {state: Failed/StableMissing, event: verb.resume, variants: [own], windows: [before], outcome: transition, to: Staging, note: "the park is terminal: the record re-arms at step 0 toward the parked revision and the pass returns; the replica's revert signal, never written for this park, needs no clearing", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/resume"]}, status: decided}
  - {state: Failed/StableMissing, event: verb.resume, variants: [own], windows: [boundary, after], outcome: reject, note: "today a resume leaves no record in status: a copy re-shown while the re-armed unit is live is consumed silently, but one re-shown after the ladder parks again re-arms it a second time, which is wrong because one verb is meant to have one effect", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/resume[reshown]"]}, status: decided}
  - {state: Failed/StableMissing, event: verb.resume, variants: [stale], outcome: reject, note: "the value is not the parked canary revision: removed with a warning", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/resume[stale]"]}, status: decided}
  - {state: Failed/StableMissing, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "left for the unit that owns it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/resume[otherUnit]"]}, status: decided}
  - {state: Failed/StableMissing, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "the run layer clamps the index into the new ladder and arms no hold; the park stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/repin[holdOrTighten]"]}, status: decided}
  - {state: Failed/StableMissing, event: plan.repin, variants: [raise], outcome: ignore, note: "the clamp arms the pre-step hold under the park, which outranks it; the next re-arm's reset clears both", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/repin[raise]"]}, status: decided}
  - {state: Failed/StableMissing, event: plan.drift, outcome: ignore, note: "the pinned plan stays pinned on a park", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/planDrift"]}, status: decided}
  - {state: Failed/StableMissing, event: plan.unresolved, outcome: ignore, note: "with no pin and no body the unit is not dispatched: the projection holds every Instance where it stands and the park stands as recorded", placement: unit, coverage: {replay: [stable-missing-park-stale-record-and-lost-policy]}, status: decided}
  - {state: Failed/StableMissing, event: run.lost, outcome: ignore, note: "the park is serviced without a run, like any Failed hold, and a resume is then rejected for lack of a plan to re-enter; while a run is pinned it stays open, reading the recorded rejection as a revert that never settles", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/runLost", "TestReconcileCells/canary/Failed[stableMissing]/resume[runLost]"]}, status: decided}
  - {state: Failed/StableMissing, event: run.adopted, outcome: ignore, note: "the target id is attached; the park stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/runAdopted"]}, status: decided}
  - {state: Failed/StableMissing, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "a target that is neither the rejected nor the stable revision re-arms the unit, clearing the marker", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/newTarget"]}, status: decided}
  - {state: Failed/StableMissing, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "the bind removes the request durably and resets the record toward the new run's target", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/newTarget[runOpen]"]}, status: decided}
  - {state: Failed/StableMissing, event: capacity.reached, outcome: ignore, note: "a park is not re-evaluated by capacity", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/capacityReached"]}, status: decided}
  - {state: Failed/StableMissing, event: capacity.dropped, outcome: ignore, note: "the park stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/capacityDropped"]}, status: decided}
  - {state: Failed/StableMissing, event: spec.replicas, outcome: ignore, note: "today partition 0 is projected under the recorded rejection whatever the count, while no revert signal was written for this park, so the replica is free to roll the held Instances forward onto the rejected revision, which is wrong because the park promises that nothing moves", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/replicasUp"]}, status: decided}
  - {state: Failed/StableMissing, event: pod.canaryCrashed, outcome: ignore, note: "a park is not moved by a crash", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/canaryCrashed"]}, status: decided}
  - {state: Failed/StableMissing, event: pod.canaryRestarted, outcome: ignore, note: "a park evaluates no soak", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/canaryRestarted"]}, status: decided}
  - {state: Failed/StableMissing, event: pod.canaryDeleted, outcome: ignore, note: "a park is not moved by a dip", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/canaryPodDeleted"]}, status: decided}
  - {state: Failed/StableMissing, event: stable.crMissing, outcome: ignore, note: "the park is already recorded; the hold reports no revert, so the dispatch writes no revert signal and reads the missing revision as nothing new", placement: unit, coverage: {replay: [rollback-finds-no-stable-revision]}, status: decided}
  - {state: Failed/StableMissing, event: record.legacy, variants: [noTargetID], outcome: ignore, note: "a record with no target id under a pinned run adopts the run's id in place; the park stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/record[noTargetID]"]}, status: decided}
  - {state: Failed/StableMissing, event: record.legacy, variants: [stableEqualsCanary], outcome: ignore, note: "a pair whose stable equals its canary hash is repaired from the replica's distinct current revision when the pass supplies one; the park stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/record[stableEqualsCanary]"]}, status: decided}
  - {state: Failed/StableMissing, event: record.legacy, variants: [noStable], outcome: ignore, note: "nothing is backfilled inside the hold", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/record[noStable]"]}, status: decided}
  - {state: Failed/StableMissing, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "a negative step is clamped to 0 before the plan is indexed; the park stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/record[negativeStep]"]}, status: decided}
  - {state: Failed/StableMissing, event: record.legacy, variants: [failedPhaseNoMarker], outcome: ignore, note: "the marker is the only record of this park: without it the executor reads the recorded rejection as a revert in flight and re-projects RollingBack, and the dispatch, finding the stable revision still unretained, parks the unit again with a fresh marker", invariants: [phase.is.input], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/record[failedPhaseNoMarker]"]}, status: decided}
  - {state: Failed/StableMissing, event: pass.resync, outcome: ignore, note: "today the park stands and comes back at the parked cadence, but the recorded rejection projects partition 0 while no revert signal was written for this park, so the replica is free to roll the held Instances forward onto the rejected revision, which is wrong because the park promises that nothing moves", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/resync"], replay: [rollback-finds-no-stable-revision]}, status: decided}
  - {state: Failed/StableMissing, event: pass.staleRecord, outcome: defer, note: "the flush finds the live record past the pass's base, keeps the live record, phase and traffic and marks the pass stale, so its verbs are not consumed and it requeues; a stale pass that re-decides the park re-emits its warning", placement: sim, coverage: {replay: [stable-missing-park-stale-record-and-lost-policy]}, status: decided}
