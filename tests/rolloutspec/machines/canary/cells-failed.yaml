# Failed and Failed/StableMissing: the parks. A park is not re-evaluated
# and its clocks are not re-stamped; the stable revision keeps serving until
# the operator rolls back or resumes, or a new target re-arms the unit. The
# grid's Failed fixture has no canary pod left, its Failed[release] fixture
# still has the release's canary pods; both are this one state.
cells:
  - {state: Failed, event: verb.pause, outcome: ignore, note: "the pass observes only; a forced promote present is consumed with the reason", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/pause", "TestReconcileCells/canary/Failed[release]/pause"]}, status: decided}
  - {state: Failed, event: verb.unpause, outcome: ignore, note: "the park stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/unpause"]}, status: current}
  - {state: Failed, event: verb.promote, variants: [match], outcome: ignore, note: "a park evaluates no gate; the promote is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/promote", "TestReconcileCells/canary/Failed[release]/promote"]}, status: decided}
  - {state: Failed, event: verb.promote, variants: [stale], outcome: ignore, note: "left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/promote[stale]"]}, status: current}
  - {state: Failed, event: verb.promote, variants: [applied], outcome: ignore, note: "left in place; the record's sync does not run inside the hold", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/promote[applied]"]}, status: current}
  - {state: Failed, event: verb.promoteForce, variants: [match], outcome: reject, note: "a forced promote has nothing to act on while the canary is parked Failed: removed with a CanaryForceIgnored warning", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/promoteForce", "TestReconcileCells/canary/Failed[release]/promoteForce"]}, status: decided}
  - {state: Failed, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "another value is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/promoteForce[stale]"]}, status: current}
  - {state: Failed, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/promoteForce[applied]"]}, status: current}
  - {state: Failed, event: verb.rollback, variants: [stableServes], windows: [before], outcome: transition, to: RollingBack, note: "the request branch precedes the Failed hold: the rollback is the operator's decision about a parked canary, so it ends the park, clears the marker and drains the rejected revision; RolledBack in the same pass when no canary pod remains, RollingBack while the release's canary pods drain", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/rollback", "TestReconcileCells/canary/Failed[release]/rollback"]}, status: decided}
  - {state: Failed, event: verb.rollback, variants: [stableServes], windows: [boundary, after], outcome: ignore, note: "the recorded rejection keeps a re-shown request inert", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/rollback[reshown]"]}, status: current}
  - {state: Failed, event: verb.rollback, variants: [stableEmpty], outcome: DECIDE, to: RollingBack, note: "today: the operator's rollback from a park proceeds toward an empty stable revision with a warning. Question: as Staging/verb.rollback[stableEmpty].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/rollback[stableEmpty]"]}, status: current}
  - {state: Failed, event: verb.resume, variants: [own], windows: [before], outcome: transition, to: Staging, note: "the park is terminal: the record re-arms at step 0 toward the parked revision, every gate re-runs, and the pass returns; a park with no pinned run rejects the resume with a warning instead, since there is no plan to re-enter", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/resume", "TestReconcileCells/canary/Failed[release]/resume"]}, status: decided}
  - {state: Failed, event: verb.resume, variants: [own], windows: [boundary, after], outcome: DECIDE, note: "today: a resume leaves no record; a re-shown copy is consumed silently while the unit is live, and resumes a second park if one happens first. Question: as RolledBack/verb.resume[own].", invariants: [one.verb.one.effect], placement: sim, status: current}
  - {state: Failed, event: verb.resume, variants: [stale], outcome: reject, note: "the value is not the parked canary revision: removed with a warning, the park stays", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/resume[stale]"]}, status: decided}
  - {state: Failed, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "left for the unit that owns it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/resume[otherUnit]"]}, status: current}
  - {state: Failed, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "the index is clamped under the park; the park stands", placement: unit, status: current}
  - {state: Failed, event: plan.repin, variants: [raise], outcome: ignore, note: "a pre-step hold set under the park is outranked by it until a re-arm clears both", placement: unit, status: current}
  - {state: Failed, event: plan.drift, outcome: ignore, note: "the pinned plan stays pinned on a park", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/planDrift"]}, status: current}
  - {state: Failed, event: plan.unresolved, outcome: ignore, note: "the unit is not dispatched; the park's heartbeat stops but nothing else changes", placement: unit, status: current}
  - {state: Failed, event: run.lost, outcome: DECIDE, note: "today: the Failed hold precedes the run-lost hold, so the park is serviced without a run (phase re-projected, verbs consumed with the reason), and a resume is then rejected for lack of a run while a rollback still proceeds. Question: should a park without a run accept a resume (opening a run over the parked revision, as RolledBack does) rather than reject it?", invariants: [exec.order.fixed, unpinned.never.steps], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/runLost", "TestReconcileCells/canary/Failed/resume[runLost]", "TestReconcileCells/canary/Failed/rollback[runLost]"]}, status: current}
  - {state: Failed, event: run.adopted, outcome: ignore, note: "a park is mid-flight to the run layer: the target id is attached and the park stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/runAdopted"]}, status: current}
  - {state: Failed, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "a target that is neither the parked canary nor the stable revision re-arms the unit, clearing the marker", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/newTarget", "TestReconcileCells/canary/Failed[release]/newTarget"]}, status: decided}
  - {state: Failed, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "the bind resets the record toward the new run's target", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/newTarget[runOpen]"]}, status: current}
  - {state: Failed, event: capacity.reached, outcome: ignore, note: "the Failed hold precedes the capacity gate: a park is not re-evaluated by capacity coming back", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/capacityReached", "TestReconcileCells/canary/Failed[release]/capacityReached"]}, status: decided}
  - {state: Failed, event: capacity.dropped, outcome: ignore, note: "the park stands; the traffic already rests on the stable revision", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/capacityDropped"]}, status: current}
  - {state: Failed, event: spec.replicas, outcome: ignore, note: "the step's partition is re-projected from the new count; the park stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/replicasUp"]}, status: current}
  - {state: Failed, event: pod.canaryCrashed, outcome: ignore, note: "a park is not moved by a crash", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/canaryCrashed", "TestReconcileCells/canary/Failed[release]/canaryCrashed"]}, status: decided}
  - {state: Failed, event: pod.canaryRestarted, outcome: ignore, note: "a park evaluates no soak", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/canaryRestarted"]}, status: current}
  - {state: Failed, event: pod.canaryDeleted, outcome: ignore, note: "a park is not moved by a dip", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/canaryPodDeleted"]}, status: current}
  - {state: Failed, event: record.legacy, variants: [noTargetID], outcome: DECIDE, note: "today: adopted in place. Question: as Staging/record.legacy[noTargetID].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/record[noTargetID]"]}, status: current}
  - {state: Failed, event: record.legacy, variants: [stableEqualsCanary], outcome: DECIDE, note: "today: repaired from the replica's distinct current revision. Question: as Staging/record.legacy[stableEqualsCanary].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/record[stableEqualsCanary]"]}, status: current}
  - {state: Failed, event: record.legacy, variants: [noStable], outcome: ignore, note: "nothing is backfilled inside the hold; a rollback from the park infers its target from the live pods", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/record[noStable]"]}, status: current}
  - {state: Failed, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "clamped to 0", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/record[negativeStep]"]}, status: current}
  - {state: Failed, event: record.legacy, variants: [failedPhaseNoMarker], outcome: ignore, note: "the marker is the record and the phase is re-projected from it; a phase-only Failed parks the same way", invariants: [phase.is.input], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/record[failedPhaseNoMarker]"]}, status: current}
  - {state: Failed, event: pass.resync, outcome: ignore, note: "the park stands and comes back at the parked cadence", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed/resync", "TestReconcileCells/canary/Failed[release]/resync"]}, status: decided}
  - {state: Failed, event: pass.staleRecord, outcome: defer, note: "the flush keeps the live record and the pass requeues", placement: sim, status: current}
  # --- Failed/StableMissing -----------------------------------------------------------
  - {state: Failed/StableMissing, event: verb.pause, outcome: ignore, note: "the pass echoes the recorded rollback; nothing else is written", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/pause"]}, status: current}
  - {state: Failed/StableMissing, event: verb.unpause, outcome: ignore, note: "the park stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/unpause"]}, status: current}
  - {state: Failed/StableMissing, event: verb.promote, variants: [match], outcome: ignore, note: "a park evaluates no gate; the promote is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/promote"]}, status: current}
  - {state: Failed/StableMissing, event: verb.promote, variants: [stale], outcome: ignore, note: "left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/promote[stale]"]}, status: current}
  - {state: Failed/StableMissing, event: verb.promote, variants: [applied], outcome: ignore, note: "left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/promote[applied]"]}, status: current}
  - {state: Failed/StableMissing, event: verb.promoteForce, variants: [match], outcome: reject, note: "a forced promote has nothing to act on in a park: removed with a warning", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/promoteForce"]}, status: decided}
  - {state: Failed/StableMissing, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "another value is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/promoteForce[stale]"]}, status: current}
  - {state: Failed/StableMissing, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/promoteForce[applied]"]}, status: current}
  - {state: Failed/StableMissing, event: verb.rollback, variants: [stableServes], outcome: reject, note: "the marker outranks the recorded rejection, so the request branch is skipped and the Failed hold refuses the request and removes it: the park already carries the rejection the request asks for, and the revert it asks for is the one that could not run", invariants: [exec.order.fixed, one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/rollback"]}, status: decided}
  - {state: Failed/StableMissing, event: verb.resume, variants: [own], windows: [before], outcome: transition, to: Staging, note: "the park is terminal: the record re-arms at step 0 toward the parked revision and the pass returns; the replica's revert signal, never written for this park, needs no clearing", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/resume"]}, status: decided}
  - {state: Failed/StableMissing, event: verb.resume, variants: [own], windows: [boundary, after], outcome: DECIDE, note: "today: a resume leaves no record. Question: as RolledBack/verb.resume[own].", invariants: [one.verb.one.effect], placement: sim, status: current}
  - {state: Failed/StableMissing, event: verb.resume, variants: [stale], outcome: reject, note: "the value is not the parked canary revision: removed with a warning", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/resume[stale]"]}, status: current}
  - {state: Failed/StableMissing, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "left for the unit that owns it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/resume[otherUnit]"]}, status: current}
  - {state: Failed/StableMissing, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "the index is clamped under the park", placement: unit, status: current}
  - {state: Failed/StableMissing, event: plan.repin, variants: [raise], outcome: ignore, note: "a pre-step hold set under the park is outranked by it", placement: unit, status: current}
  - {state: Failed/StableMissing, event: plan.drift, outcome: ignore, note: "the pinned plan stays pinned on a park", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/planDrift"]}, status: current}
  - {state: Failed/StableMissing, event: plan.unresolved, outcome: ignore, note: "the unit is not dispatched; the park stands", placement: unit, status: current}
  - {state: Failed/StableMissing, event: run.lost, outcome: DECIDE, note: "today: the park is serviced without a run and a resume is then rejected for lack of one; the run layer reads the recorded rejection as a revert that never settles. Question: as Failed/run.lost, and should the run close on this park?", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/runLost", "TestReconcileCells/canary/Failed[stableMissing]/resume[runLost]"]}, status: current}
  - {state: Failed/StableMissing, event: run.adopted, outcome: ignore, note: "the target id is attached; the park stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/runAdopted"]}, status: current}
  - {state: Failed/StableMissing, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "a target that is neither the rejected nor the stable revision re-arms the unit, clearing the marker", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/newTarget"]}, status: decided}
  - {state: Failed/StableMissing, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "the bind removes the request durably and resets the record toward the new run's target", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/newTarget[runOpen]"]}, status: current}
  - {state: Failed/StableMissing, event: capacity.reached, outcome: ignore, note: "a park is not re-evaluated by capacity", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/capacityReached"]}, status: current}
  - {state: Failed/StableMissing, event: capacity.dropped, outcome: ignore, note: "the park stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/capacityDropped"]}, status: current}
  - {state: Failed/StableMissing, event: spec.replicas, outcome: ignore, note: "partition 0 is projected under the recorded rejection; the park stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/replicasUp"]}, status: current}
  - {state: Failed/StableMissing, event: pod.canaryCrashed, outcome: ignore, note: "a park is not moved by a crash", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/canaryCrashed"]}, status: current}
  - {state: Failed/StableMissing, event: pod.canaryRestarted, outcome: ignore, note: "a park evaluates no soak", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/canaryRestarted"]}, status: current}
  - {state: Failed/StableMissing, event: pod.canaryDeleted, outcome: ignore, note: "a park is not moved by a dip", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/canaryPodDeleted"]}, status: current}
  - {state: Failed/StableMissing, event: stable.crMissing, outcome: ignore, note: "the park is already recorded; the revert signal is not re-written while the unit reads Failed", placement: unit, status: current}
  - {state: Failed/StableMissing, event: record.legacy, variants: [noTargetID], outcome: DECIDE, note: "today: adopted in place. Question: as Staging/record.legacy[noTargetID].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/record[noTargetID]"]}, status: current}
  - {state: Failed/StableMissing, event: record.legacy, variants: [stableEqualsCanary], outcome: DECIDE, note: "today: repaired from the replica's distinct current revision. Question: as Staging/record.legacy[stableEqualsCanary].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/record[stableEqualsCanary]"]}, status: current}
  - {state: Failed/StableMissing, event: record.legacy, variants: [noStable], outcome: ignore, note: "nothing is backfilled inside the hold", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/record[noStable]"]}, status: current}
  - {state: Failed/StableMissing, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "clamped to 0", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/record[negativeStep]"]}, status: current}
  - {state: Failed/StableMissing, event: record.legacy, variants: [failedPhaseNoMarker], outcome: ignore, note: "the marker is the record; the phase is re-projected from it", invariants: [phase.is.input], placement: unit, status: current}
  - {state: Failed/StableMissing, event: pass.resync, outcome: ignore, note: "the park stands and comes back at the parked cadence", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Failed[stableMissing]/resync"]}, status: decided}
  - {state: Failed/StableMissing, event: pass.staleRecord, outcome: defer, note: "the flush keeps the live record and the pass requeues", placement: sim, status: current}
