# Serving/Manual: an intermediate step's split serves and a bare Pause
# holds it for an explicit promote. A dip keeps the phase and the recorded
# weight; the wait it opens is clocked and can park the unit.
cells:
  - {state: Serving/Manual, event: verb.pause, outcome: ignore, note: "the pass observes only: the split stays, no clock moves, a forced promote present is consumed with the reason", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/pause"]}, status: decided}
  - {state: Serving/Manual, event: verb.unpause, outcome: ignore, note: "the hold resumes as it was; a bare pause has no clock the rollout pause could have stopped", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/unpause"]}, status: decided}
  - {state: Serving/Manual, event: verb.promote, variants: [match], windows: [before], outcome: transition, to: Staging/Final, note: "the gate opens: the step advances with PromotedThrough recorded, the next step reads Pending until its capacity is up. Lands on Staging when the next step is intermediate (T-servm-advance), on Staging/Final when it is the last (T-servm-advance-final), as in the cited row", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/promote[match]"]}, status: decided}
  - {state: Serving/Manual, event: verb.promote, variants: [match], windows: [boundary, after], outcome: ignore, note: "a copy re-shown as or after the advance lands is inert by PromotedThrough and handed back for removal; a promote racing a rollback or a park is left in place because those holds read no promote", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/promote[reshown]"]}, status: decided}
  - {state: Serving/Manual, event: verb.promote, variants: [stale], outcome: ignore, note: "a value naming another revision opens nothing and is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/promote[stale]"]}, status: decided}
  - {state: Serving/Manual, event: verb.promote, variants: [applied], outcome: ignore, note: "the applied verb re-shown is inert by PromotedThrough and handed back for removal; the record clears once no key carries the value", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/promote[applied]"]}, status: decided}
  - {state: Serving/Manual, event: verb.promoteForce, variants: [match], windows: [before], outcome: transition, to: Staging/Final, note: "a force at a served step is a promote: the gate opens and the step advances (Staging when the next step is intermediate)", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/promoteForce[match]"]}, status: decided}
  - {state: Serving/Manual, event: verb.promoteForce, variants: [match], windows: [boundary, after], outcome: ignore, note: "inert by PromotedThrough once the advance lands; a force racing a rollback or a park is consumed with the reason so it cannot open a later gate", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/promoteForce[reshown]"]}, status: decided}
  - {state: Serving/Manual, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "a value naming another revision lifts nothing", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/promoteForce[stale]"]}, status: decided}
  - {state: Serving/Manual, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "the applied force re-shown is inert by PromotedThrough and handed back for removal", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/promoteForce[applied]"]}, status: decided}
  - {state: Serving/Manual, event: verb.rollback, variants: [stableServes], windows: [before], outcome: transition, to: RollingBack, note: "the rejection is recorded, traffic moves onto the stable capacity that serves, and the rejected pods drain", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/rollback"], replay: [rollback-finds-no-stable-revision]}, status: decided}
  - {state: Serving/Manual, event: verb.rollback, variants: [stableServes], windows: [boundary, after], outcome: ignore, note: "the recorded rejection is the record that the request was applied, so a copy re-shown after the flush is inert; a unit carrying one never takes a request again", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/rollback[reshown]"]}, status: decided}
  - {state: Serving/Manual, event: verb.rollback, variants: [stableEmpty], outcome: transition, to: RollingBack, note: "the operator's rollback is the operator's decision: it proceeds toward a stable revision that runs no live Instance, with a CanaryStableRevisionEmpty warning, and the split it held stands until a stable pod serves again; only a gate-decided rollback parks on an empty stable", placement: unit, coverage: {unit: ["TestReconcile_OperatorRollbackToAnEmptyStableFromEveryLiveState"]}, status: decided}
  - {state: Serving/Manual, event: verb.resume, variants: [own], outcome: reject, note: "nothing is parked: consumed silently ahead of the holds", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/resume"]}, status: decided}
  - {state: Serving/Manual, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary: removed with a warning", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/resume[stale]"]}, status: decided}
  - {state: Serving/Manual, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "a bare hash is addressed to whichever unit's record carries it, so a value another unit's canary carries is left for that unit's dispatch", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/resume[otherUnit]"]}, status: decided}
  - {state: Serving/Manual, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "the index clamps into the new ladder and no hold arms when the clamped step's traffic does not exceed the weight on record; the split is written at the clamped weight on the same pass and the clamped step's gate decides", placement: unit, coverage: {replay: ["repin-lowers-a-serving-step"]}, status: decided}
  - {state: Serving/Manual, event: plan.repin, variants: [raise], outcome: transition, to: PreHold, note: "a clamped step whose traffic exceeds the weight on record would be immediate exposure, so the run layer arms the pre-step hold and the split keeps its recorded weight until a promote releases it", placement: unit, coverage: {replay: [stale-read-misses-repin]}, status: decided}
  - {state: Serving/Manual, event: plan.drift, outcome: ignore, note: "the pinned plan executes; the run layer reports the drift and only a repin applies the edit", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/planDrift"]}, status: decided}
  - {state: Serving/Manual, event: plan.unresolved, outcome: ignore, note: "with no executable body the unit is not dispatched and its Components take the full plan-gate hold, so the served split freezes with nobody writing its traffic until the plan resolves again; the run layer's plan conditions carry the signal", placement: unit, coverage: {unit: ["TestPlanGateHoldPartition"], replay: ["canary-group-stops-resolving"]}, status: decided}
  - {state: Serving/Manual, event: run.lost, outcome: ignore, note: "the unit holds where it is with a CanaryRunLost warning: the split keeps serving and the step cannot advance until the run layer reopens or adopts it", invariants: [unpinned.never.steps], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/runLost"], replay: [canary-group-stops-resolving]}, status: decided}
  - {state: Serving/Manual, event: run.adopted, outcome: ignore, note: "the bind attaches the run's target id to a record that carries none; the step, split and clocks are kept", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/runAdopted"]}, status: decided}
  - {state: Serving/Manual, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "the record is reset to step 0 toward the new target with the stable identity preserved", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/newTarget"]}, status: decided}
  - {state: Serving/Manual, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "a retarget mid-ladder supersedes the run; the bind resets the record to step 0 toward the new run's target before the executor's pass, with the stable identity preserved", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/newTarget[runOpen]"]}, status: decided}
  - {state: Serving/Manual, event: capacity.reached, outcome: ignore, note: "the split already serves; a count back at the staged number clears the wait clock a dip opened, so a later dip is clocked from its own start", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/capacityReached"], replay: [stale-read-misses-repin]}, status: decided}
  - {state: Serving/Manual, event: capacity.dropped, outcome: ignore, note: "a served split keeps its phase and recorded weight through a dip; the split follows the pods that serve and the wait is clocked", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/capacityDropped"]}, status: decided}
  - {state: Serving/Manual, event: spec.replicas, variants: [up], outcome: ignore, note: "more capacity to stage holds the step where it is", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/replicasUp"]}, status: decided}
  - {state: Serving/Manual, event: spec.replicas, variants: [down], outcome: ignore, note: "the staged count and the held floor are recomputed from the new desired count; the step holds its split", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/replicasDown"]}, status: decided}
  - {state: Serving/Manual, event: timer.readyTimeout, outcome: transition, to: Failed, note: "a split that served, dipped and stays short past the ready timeout parks Failed with the marker CapacityTimeout; the split keeps following the pods that serve, and the park is the capacity gate's verdict that the step's capacity did not hold", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/readyTimeout"]}, status: decided}
  - {state: Serving/Manual, event: pod.canaryCrashed, outcome: transition, to: Failed, note: "the ladder parks at its step whatever the counts say; the split returns to stable", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/canaryCrashed"]}, status: decided}
  - {state: Serving/Manual, event: pod.canaryRestarted, outcome: ignore, note: "a manual hold is unmoved by a restart", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/canaryRestarted"]}, status: decided}
  - {state: Serving/Manual, event: pod.canaryDeleted, outcome: ignore, note: "a pod on its way out is a dip: the step keeps its phase and weight", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/canaryPodDeleted"]}, status: decided}
  - {state: Serving/Manual, event: record.legacy, variants: [noTargetID], outcome: ignore, note: "a record with no target id under a pinned run adopts the run's id in place and keeps its step and split: re-arming it would restart a ladder that is already in flight", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/record[noTargetID]"]}, status: decided}
  - {state: Serving/Manual, event: record.legacy, variants: [stableEqualsCanary], outcome: ignore, note: "a persisted pair whose stable equals its canary hash is repaired from the replica's distinct current revision when the controller supplies one, because the two identities must stay distinct for a primary retarget", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/record[stableEqualsCanary]"]}, status: decided}
  - {state: Serving/Manual, event: record.legacy, variants: [noStable], outcome: ignore, note: "the stable identity is backfilled from the observed stable revision and then never re-inferred, because the live pod set stops naming the pre-canary stable as revisions retarget and drain", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/record[noStable]"]}, status: decided}
  - {state: Serving/Manual, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "status is an unvalidated subresource, so a negative step from an external write is read back from the record before it can index the plan: the last step whose traffic weight the recorded weight reached, so a second split keeps its step and its weight", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/record[negativeStep]", "TestReconcileCells/canary/Serving[second]/record[negativeStep]"]}, status: decided}
  - {state: Serving/Manual, event: record.legacy, variants: [failedPhaseNoMarker], outcome: transition, to: Failed, note: "a Failed phase with no marker is status written before the marker existed and still parks; the Failed hold re-projects the phase, so a write that dropped the marker cannot un-park the canary", invariants: [phase.is.input], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/record[failedPhaseNoMarker]"]}, status: decided}
  - {state: Serving/Manual, event: pass.resync, outcome: ignore, note: "the hold stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/resync"]}, status: decided}
  - {state: Serving/Manual, event: pass.staleRecord, outcome: defer, note: "the flush compares the live record with the one the pass read and keeps the live record, phase and traffic when they differ; the pass requeues to decide again from the current record, so a decision made from a stale record is never written", placement: unit, coverage: {unit: ["TestBaseKeepsTheLiveRecordOverAStalePass"], replay: ["stale-pass-keeps-the-live-canary-record"]}, status: decided}
