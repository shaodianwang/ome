# Serving/Manual: an intermediate step's split serves and a bare Pause
# holds it for an explicit promote. A dip keeps the phase and the recorded
# weight; the wait it opens is clocked and can park the unit.
cells:
  - {state: Serving/Manual, event: verb.pause, outcome: ignore, note: "the pass observes only: the split stays, no clock moves, a forced promote present is consumed with the reason", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/pause"]}, status: decided}
  - {state: Serving/Manual, event: verb.unpause, outcome: ignore, note: "the hold resumes as it was", placement: unit, status: current}
  - {state: Serving/Manual, event: verb.promote, variants: [match], windows: [before], outcome: transition, to: Staging/Final, note: "the gate opens: the step advances with PromotedThrough recorded, the next step reads Pending until its capacity is up. Lands on Staging when the next step is intermediate (T-servm-advance), on Staging/Final when it is the last (T-servm-advance-final), as in the cited row", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/promote[match]"]}, status: decided}
  - {state: Serving/Manual, event: verb.promote, variants: [match], windows: [boundary, after], outcome: ignore, note: "a copy re-shown as or after the advance lands is inert by PromotedThrough and handed back for removal; a promote racing a rollback or a park is left in place", invariants: [one.verb.one.effect], placement: unit, status: current}
  - {state: Serving/Manual, event: verb.promote, variants: [stale], outcome: ignore, note: "a value naming another revision opens nothing and is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/promote[stale]"]}, status: decided}
  - {state: Serving/Manual, event: verb.promote, variants: [applied], outcome: ignore, note: "the applied verb re-shown is inert and handed back for removal", invariants: [one.verb.one.effect], placement: unit, status: current}
  - {state: Serving/Manual, event: verb.promoteForce, variants: [match], windows: [before], outcome: transition, to: Staging/Final, note: "a force at a served step is a promote: the gate opens and the step advances (Staging when the next step is intermediate)", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/promoteForce[match]"]}, status: decided}
  - {state: Serving/Manual, event: verb.promoteForce, variants: [match], windows: [boundary, after], outcome: ignore, note: "inert by PromotedThrough once the advance lands; consumed with the reason when it races a rollback or a park", invariants: [one.verb.one.effect], placement: unit, status: current}
  - {state: Serving/Manual, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "a value naming another revision lifts nothing", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/promoteForce[stale]"]}, status: decided}
  - {state: Serving/Manual, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "the applied force re-shown is inert and handed back for removal", invariants: [one.verb.one.effect], placement: unit, status: current}
  - {state: Serving/Manual, event: verb.rollback, variants: [stableServes], windows: [before], outcome: transition, to: RollingBack, note: "the rejection is recorded, traffic moves onto the stable capacity that serves, and the rejected pods drain", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/rollback"], replay: [rollback-finds-no-stable-revision]}, status: decided}
  - {state: Serving/Manual, event: verb.rollback, variants: [stableServes], windows: [boundary, after], outcome: ignore, note: "the recorded rejection keeps a re-shown request inert", invariants: [one.verb.one.effect], placement: unit, status: current}
  - {state: Serving/Manual, event: verb.rollback, variants: [stableEmpty], outcome: DECIDE, to: RollingBack, note: "today: the operator's rollback proceeds toward a stable revision that runs no live Instance, with a warning. Question: as Staging/verb.rollback[stableEmpty].", placement: unit, status: current}
  - {state: Serving/Manual, event: verb.resume, variants: [own], outcome: reject, note: "nothing is parked: consumed silently ahead of the holds", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/resume"]}, status: decided}
  - {state: Serving/Manual, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary: removed with a warning", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/resume[stale]"]}, status: decided}
  - {state: Serving/Manual, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "left for the unit that owns it", placement: unit, status: current}
  - {state: Serving/Manual, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "the index clamps into the new ladder; the split keeps its programmed weight and the new step's gate decides", placement: unit, status: current}
  - {state: Serving/Manual, event: plan.repin, variants: [raise], outcome: transition, to: PreHold, note: "the clamped step would raise traffic, so the run layer arms the pre-step hold", placement: unit, coverage: {replay: [stale-read-misses-repin]}, status: current}
  - {state: Serving/Manual, event: plan.drift, outcome: ignore, note: "the pinned plan executes", placement: unit, status: current}
  - {state: Serving/Manual, event: plan.unresolved, outcome: DECIDE, note: "today: the unit is not dispatched; the served split freezes with nobody writing its traffic. Question: as Staging/plan.unresolved.", placement: unit, coverage: {replay: [canary-group-stops-resolving]}, status: current}
  - {state: Serving/Manual, event: run.lost, outcome: ignore, note: "the unit holds where it is with a CanaryRunLost warning: the split keeps serving and the step cannot advance until the run layer reopens or adopts it", invariants: [unpinned.never.steps], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/runLost"], replay: [canary-group-stops-resolving]}, status: decided}
  - {state: Serving/Manual, event: run.adopted, outcome: ignore, note: "the target id is attached; the step, split and clocks are kept", placement: unit, status: current}
  - {state: Serving/Manual, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "the record is reset to step 0 toward the new target with the stable identity preserved", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/newTarget"]}, status: decided}
  - {state: Serving/Manual, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "the bind resets the record toward the new run's target", invariants: [stable.never.reinferred], placement: unit, status: current}
  - {state: Serving/Manual, event: capacity.reached, outcome: ignore, note: "the split already serves; a count back at the staged number clears the wait clock a dip opened", placement: unit, coverage: {replay: [stale-read-misses-repin]}, status: current}
  - {state: Serving/Manual, event: capacity.dropped, outcome: ignore, note: "a served split keeps its phase and recorded weight through a dip; the split follows the pods that serve and the wait is clocked", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/capacityDropped"]}, status: decided}
  - {state: Serving/Manual, event: spec.replicas, variants: [up], outcome: ignore, note: "more capacity to stage holds the step where it is", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/replicasUp"]}, status: decided}
  - {state: Serving/Manual, event: spec.replicas, variants: [down], outcome: ignore, note: "the staged count and the floor are recomputed; the step holds", placement: unit, status: current}
  - {state: Serving/Manual, event: timer.readyTimeout, outcome: DECIDE, to: Failed, note: "today: a split that dipped and stays short past the ready timeout parks Failed with the traffic returned to stable; no grid row covers a served step's timeout. Question: should a split that served and then dipped park on the capacity timeout, or keep serving its split while the workload repairs the pod?", placement: unit, status: current}
  - {state: Serving/Manual, event: pod.canaryCrashed, outcome: transition, to: Failed, note: "the ladder parks at its step whatever the counts say; the split returns to stable", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/canaryCrashed"]}, status: decided}
  - {state: Serving/Manual, event: pod.canaryRestarted, outcome: ignore, note: "a manual hold is unmoved by a restart", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/canaryRestarted"]}, status: decided}
  - {state: Serving/Manual, event: pod.canaryDeleted, outcome: ignore, note: "a pod on its way out is a dip: the step keeps its phase and weight", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/canaryPodDeleted"]}, status: decided}
  - {state: Serving/Manual, event: record.legacy, variants: [noTargetID], outcome: DECIDE, note: "today: adopted in place. Question: as Staging/record.legacy[noTargetID].", placement: unit, status: current}
  - {state: Serving/Manual, event: record.legacy, variants: [stableEqualsCanary], outcome: DECIDE, note: "today: repaired from the replica's distinct current revision. Question: as Staging/record.legacy[stableEqualsCanary].", placement: unit, status: current}
  - {state: Serving/Manual, event: record.legacy, variants: [noStable], outcome: ignore, note: "backfilled from the observed stable revision", invariants: [stable.never.reinferred], placement: unit, status: current}
  - {state: Serving/Manual, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "clamped to 0", placement: unit, status: current}
  - {state: Serving/Manual, event: record.legacy, variants: [failedPhaseNoMarker], outcome: transition, to: Failed, note: "a Failed phase with no marker still parks", invariants: [phase.is.input], placement: unit, status: current}
  - {state: Serving/Manual, event: pass.resync, outcome: ignore, note: "the hold stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving/resync"]}, status: decided}
  - {state: Serving/Manual, event: pass.staleRecord, outcome: defer, note: "the flush keeps the live record and the pass requeues", placement: sim, status: current}
