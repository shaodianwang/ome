# PreHold: a repin clamped the ladder onto a step whose traffic would exceed
# the programmed weight. Capacity converges to the clamped step while the
# traffic raise waits for a promote naming the canary revision; the release
# spends the verb, so the step's own gate holds afterwards.
cells:
  - {state: PreHold, event: verb.pause, outcome: ignore, note: "the pass observes only; a forced promote present is consumed with the reason", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/pause"]}, status: decided}
  - {state: PreHold, event: verb.unpause, outcome: ignore, note: "the hold stands as it was; the pause stamps no clock the hold could resume from", placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/unpause"]}, status: decided}
  - {state: PreHold, event: verb.promote, variants: [match], windows: [before], outcome: transition, to: Serving/Manual, note: "the release: PreStepHold is cleared, PromotedThrough recorded and the step's split written; the verb is deleted in memory before the step's gate reads it, so the gate then holds (Serving/Timed or Serving/Analysis for those gates, an ungated step advances, a final step opens into its drain)", invariants: [exec.order.fixed, one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/promote"]}, status: decided}
  - {state: PreHold, event: verb.promote, variants: [match], windows: [boundary, after], outcome: ignore, note: "the release is recorded like an applied promote, so a copy re-shown after the flush is inert and handed back for removal; the hold cannot be released twice", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/promote[reshown]"]}, status: decided}
  - {state: PreHold, event: verb.promote, variants: [stale], outcome: ignore, note: "the release needs the canary revision's hash; another value leaves the hold standing", placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/promote[stale]"]}, status: decided}
  - {state: PreHold, event: verb.promote, variants: [applied], outcome: ignore, note: "the applied copy is taken by the promote record's sync before the release reads the annotations, so it does not release the hold; one verb releases one gate", invariants: [exec.order.fixed, one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/promote[applied]"]}, status: decided}
  - {state: PreHold, event: verb.promoteForce, variants: [match], windows: [before], outcome: transition, to: Serving/Manual, note: "a force is spent on the release like a promote and opens no gate on the same pass", invariants: [exec.order.fixed, one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/promoteForce"]}, status: decided}
  - {state: PreHold, event: verb.promoteForce, variants: [match], windows: [boundary, after], outcome: ignore, note: "inert by the recorded release; a force racing a rollback or a park is consumed with the reason so it cannot open a later gate", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/promoteForce[reshown]"]}, status: decided}
  - {state: PreHold, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "another value leaves the hold standing; only the canary revision's hash releases it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/promoteForce[stale]"]}, status: decided}
  - {state: PreHold, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "the applied copy is taken by the promote record's sync before the release reads the annotations, so it does not release the hold", invariants: [exec.order.fixed, one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/promoteForce[applied]"]}, status: decided}
  - {state: PreHold, event: verb.rollback, variants: [stableServes], windows: [before], outcome: transition, to: RollingBack, note: "the rejection is recorded and the held split drains back to stable", placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/rollback"]}, status: decided}
  - {state: PreHold, event: verb.rollback, variants: [stableServes], windows: [boundary, after], outcome: ignore, note: "the recorded rejection is the record that the request was applied, so a copy re-shown after the flush is inert", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/rollback[reshown]"]}, status: decided}
  - {state: PreHold, event: verb.rollback, variants: [stableEmpty], outcome: transition, to: RollingBack, note: "the operator's rollback is the operator's decision: it proceeds toward a stable revision that runs no live Instance, with a CanaryStableRevisionEmpty warning, and the held split stands until a stable pod serves again; only a gate-decided rollback parks on an empty stable", placement: unit, coverage: {unit: ["TestReconcile_OperatorRollbackToAnEmptyStableFromEveryLiveState"]}, status: decided}
  - {state: PreHold, event: verb.resume, variants: [own], outcome: reject, note: "nothing is parked: consumed silently", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/resume"]}, status: decided}
  - {state: PreHold, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary, parked or in flight: removed with a RolloutResumeRejected warning so it cannot fire on a later canary carrying the same hash", placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/resume[stale]"]}, status: decided}
  - {state: PreHold, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "a bare hash is addressed to whichever unit's record carries it, so a value another unit's canary carries is left for that unit's dispatch", placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/resume[otherUnit]"]}, status: decided}
  - {state: PreHold, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "a further repin re-clamps the index; a clamped step at or below the recorded weight arms nothing new, and the hold stays set because only a promote naming the canary revision clears it", placement: unit, coverage: {replay: ["repin-clamps-a-timed-step"]}, status: decided}
  - {state: PreHold, event: plan.repin, variants: [raise], outcome: ignore, note: "the hold is already armed; the index is re-clamped and the traffic raise still waits for a promote", placement: unit, coverage: {replay: ["repin-clamps-a-timed-step"]}, status: decided}
  - {state: PreHold, event: plan.drift, outcome: ignore, note: "the pinned plan executes; the run layer reports the drift and only a repin applies the edit", placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/planDrift"]}, status: decided}
  - {state: PreHold, event: plan.unresolved, outcome: ignore, note: "with no executable body the unit is not dispatched and its Components take the full plan-gate hold, so the held split freezes where it is until the plan resolves again; the run layer's plan conditions carry the signal", placement: unit, coverage: {unit: ["TestPlanGateHoldPartition"]}, status: decided}
  - {state: PreHold, event: run.lost, outcome: ignore, note: "the unit holds at its step with the step's partition projected and a CanaryRunLost warning; the run-lost hold runs ahead of the pre-step hold, so the release is not read without a pinned run", invariants: [unpinned.never.steps], placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/runLost"]}, status: decided}
  - {state: PreHold, event: run.adopted, outcome: ignore, note: "the bind attaches the run's target id to a record that carries none; the hold, step and clocks are kept", placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/runAdopted"]}, status: decided}
  - {state: PreHold, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "the record is reset to step 0 toward the new target; the reset clears the pre-step hold", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/newTarget"]}, status: decided}
  - {state: PreHold, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "the bind resets the record to step 0 toward the new run's target, which clears the pre-step hold with the rest of the per-target state; the stable identity is preserved", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/newTarget[runOpen]"]}, status: decided}
  - {state: PreHold, event: capacity.reached, outcome: ignore, note: "capacity converging to the clamped step is the supported warm-up; the traffic raise still waits for the promote, since exposure is the traffic write and not the capacity", placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/capacityReached"]}, status: decided}
  - {state: PreHold, event: capacity.dropped, outcome: ignore, note: "the held split keeps its phase and recorded weight through a dip; the wait is clocked", placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/capacityDropped"]}, status: decided}
  - {state: PreHold, event: spec.replicas, outcome: ignore, note: "the staged count is recomputed from the new desired count on every pass; the hold stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/replicasUp"]}, status: decided}
  - {state: PreHold, event: timer.readyTimeout, outcome: transition, to: Failed, note: "a held split that dipped and stays short past the ready timeout parks Failed with the marker CapacityTimeout, as any live step does; the park is the capacity gate's verdict that the step's capacity did not hold", placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/readyTimeout"]}, status: decided}
  - {state: PreHold, event: pod.canaryCrashed, outcome: transition, to: Failed, note: "the ladder parks at its step; the split returns to stable", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/canaryCrashed"]}, status: decided}
  - {state: PreHold, event: pod.canaryRestarted, outcome: ignore, note: "the hold is unmoved by a restart; no soak runs under the pre-step hold", placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/canaryRestarted"]}, status: decided}
  - {state: PreHold, event: pod.canaryDeleted, outcome: ignore, note: "a pod on its way out is a dip: the hold keeps its phase and weight", placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/canaryPodDeleted"]}, status: decided}
  - {state: PreHold, event: record.legacy, variants: [noTargetID], outcome: ignore, note: "a record with no target id under a pinned run adopts the run's id in place and keeps its step and hold: re-arming it would restart a ladder that is already in flight", placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/record[noTargetID]"]}, status: decided}
  - {state: PreHold, event: record.legacy, variants: [stableEqualsCanary], outcome: ignore, note: "a persisted pair whose stable equals its canary hash is repaired from the replica's distinct current revision when the controller supplies one, because the two identities must stay distinct for a primary retarget", placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/record[stableEqualsCanary]"]}, status: decided}
  - {state: PreHold, event: record.legacy, variants: [noStable], outcome: ignore, note: "the stable identity is backfilled from the observed stable revision and then never re-inferred, because the live pod set stops naming the pre-canary stable as revisions retarget and drain", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/record[noStable]"]}, status: decided}
  - {state: PreHold, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "status is an unvalidated subresource, so a negative step from an external write is read back from the record before it can index the plan: the last step whose traffic weight the recorded weight reached, which here is step 0", placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/record[negativeStep]"]}, status: decided}
  - {state: PreHold, event: record.legacy, variants: [failedPhaseNoMarker], outcome: transition, to: Failed, note: "a Failed phase with no marker is status written before the marker existed and still parks; the Failed hold re-projects the phase, so a write that dropped the marker cannot un-park the canary", invariants: [phase.is.input], placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/record[failedPhaseNoMarker]"]}, status: decided}
  - {state: PreHold, event: pass.resync, outcome: ignore, note: "the hold stands and reads Paused; the held split follows the pods on every pass", placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/resync"]}, status: decided}
  - {state: PreHold, event: pass.staleRecord, outcome: defer, note: "the flush compares the live record with the one the pass read and keeps the live record, phase and traffic when they differ; the pass requeues to decide again from the current record, so a stale pass cannot drop the hold", placement: unit, coverage: {unit: ["TestBaseKeepsTheLiveRecordOverAStalePass"], replay: ["stale-read-misses-repin"]}, status: decided}
