# PreHold: a repin clamped the ladder onto a step whose traffic would exceed
# the programmed weight. Capacity converges to the clamped step while the
# traffic raise waits for a promote naming the canary revision; the release
# spends the verb, so the step's own gate holds afterwards.
cells:
  - {state: PreHold, event: verb.pause, outcome: ignore, note: "the pass observes only; a forced promote present is consumed with the reason", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/pause"]}, status: decided}
  - {state: PreHold, event: verb.unpause, outcome: ignore, note: "the hold stands as it was", placement: unit, status: current}
  - {state: PreHold, event: verb.promote, variants: [match], windows: [before], outcome: transition, to: Serving/Manual, note: "the release: PreStepHold is cleared, PromotedThrough recorded and the step's split written; the verb is deleted in memory before the step's gate reads it, so the gate then holds (Serving/Timed or Serving/Analysis for those gates, an ungated step advances, a final step opens into its drain)", invariants: [exec.order.fixed, one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/promote"]}, status: decided}
  - {state: PreHold, event: verb.promote, variants: [match], windows: [boundary, after], outcome: ignore, note: "the release is recorded like an applied promote, so a copy re-shown after the flush is inert and handed back for removal", invariants: [one.verb.one.effect], placement: unit, status: current}
  - {state: PreHold, event: verb.promote, variants: [stale], outcome: ignore, note: "the release needs the canary revision's hash; another value leaves the hold standing", placement: unit, status: current}
  - {state: PreHold, event: verb.promote, variants: [applied], outcome: ignore, note: "the applied copy is taken by the promote record's sync before the release reads the annotations, so it does not release the hold", invariants: [exec.order.fixed, one.verb.one.effect], placement: unit, status: current}
  - {state: PreHold, event: verb.promoteForce, variants: [match], windows: [before], outcome: transition, to: Serving/Manual, note: "a force is spent on the release like a promote and opens no gate on the same pass", invariants: [exec.order.fixed, one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/promoteForce"]}, status: decided}
  - {state: PreHold, event: verb.promoteForce, variants: [match], windows: [boundary, after], outcome: ignore, note: "inert by the recorded release; consumed with the reason when it races a rollback or a park", invariants: [one.verb.one.effect], placement: unit, status: current}
  - {state: PreHold, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "another value leaves the hold standing", placement: unit, status: current}
  - {state: PreHold, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "the applied copy is taken by the promote record's sync first", invariants: [exec.order.fixed, one.verb.one.effect], placement: unit, status: current}
  - {state: PreHold, event: verb.rollback, variants: [stableServes], windows: [before], outcome: transition, to: RollingBack, note: "the rejection is recorded and the held split drains back to stable", placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/rollback"]}, status: decided}
  - {state: PreHold, event: verb.rollback, variants: [stableServes], windows: [boundary, after], outcome: ignore, note: "the recorded rejection keeps a re-shown request inert", invariants: [one.verb.one.effect], placement: unit, status: current}
  - {state: PreHold, event: verb.rollback, variants: [stableEmpty], outcome: DECIDE, to: RollingBack, note: "today: the operator's rollback proceeds toward an empty stable revision with a warning. Question: as Staging/verb.rollback[stableEmpty].", placement: unit, status: current}
  - {state: PreHold, event: verb.resume, variants: [own], outcome: reject, note: "nothing is parked: consumed silently", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/resume"]}, status: decided}
  - {state: PreHold, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary: removed with a warning", placement: unit, status: current}
  - {state: PreHold, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "left for the unit that owns it", placement: unit, status: current}
  - {state: PreHold, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "a second repin re-clamps the index; a clamped step at or below the recorded weight leaves the hold set until a promote releases it", placement: unit, status: current}
  - {state: PreHold, event: plan.repin, variants: [raise], outcome: ignore, note: "the hold is already armed; the index is re-clamped", placement: unit, status: current}
  - {state: PreHold, event: plan.drift, outcome: ignore, note: "the pinned plan executes", placement: unit, status: current}
  - {state: PreHold, event: plan.unresolved, outcome: DECIDE, note: "today: the unit is not dispatched; the held split freezes. Question: as Staging/plan.unresolved.", placement: unit, status: current}
  - {state: PreHold, event: run.lost, outcome: DECIDE, note: "today: the unit holds at its step with the step's partition projected and a CanaryRunLost warning; the pre-step hold is not reached. Question: as Staging/run.lost.", invariants: [unpinned.never.steps], placement: unit, status: current}
  - {state: PreHold, event: run.adopted, outcome: ignore, note: "the target id is attached; the hold, step and clocks are kept", placement: unit, status: current}
  - {state: PreHold, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "the record is reset to step 0 toward the new target; the reset clears the pre-step hold", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/newTarget"]}, status: decided}
  - {state: PreHold, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "the bind resets the record toward the new run's target", invariants: [stable.never.reinferred], placement: unit, status: current}
  - {state: PreHold, event: capacity.reached, outcome: ignore, note: "capacity converging to the clamped step is the supported warm-up; the traffic raise still waits for the promote", placement: unit, status: current}
  - {state: PreHold, event: capacity.dropped, outcome: ignore, note: "the held split keeps its phase and recorded weight through a dip; the wait is clocked", placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/capacityDropped"]}, status: decided}
  - {state: PreHold, event: spec.replicas, outcome: ignore, note: "the staged count is recomputed; the hold stands", placement: unit, status: current}
  - {state: PreHold, event: timer.readyTimeout, outcome: DECIDE, to: Failed, note: "today: a held split that dipped and stays short past the ready timeout parks Failed; no grid row covers it. Question: as Serving/Manual/timer.readyTimeout.", placement: unit, status: current}
  - {state: PreHold, event: pod.canaryCrashed, outcome: transition, to: Failed, note: "the ladder parks at its step; the split returns to stable", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/canaryCrashed"]}, status: decided}
  - {state: PreHold, event: pod.canaryRestarted, outcome: ignore, note: "the hold is unmoved by a restart", placement: unit, status: current}
  - {state: PreHold, event: pod.canaryDeleted, outcome: ignore, note: "a pod on its way out is a dip: the hold keeps its phase and weight", placement: unit, coverage: {unit: ["TestReconcileCells/canary/PreHold/canaryPodDeleted"]}, status: decided}
  - {state: PreHold, event: record.legacy, variants: [noTargetID], outcome: DECIDE, note: "today: adopted in place. Question: as Staging/record.legacy[noTargetID].", placement: unit, status: current}
  - {state: PreHold, event: record.legacy, variants: [stableEqualsCanary], outcome: DECIDE, note: "today: repaired from the replica's distinct current revision. Question: as Staging/record.legacy[stableEqualsCanary].", placement: unit, status: current}
  - {state: PreHold, event: record.legacy, variants: [noStable], outcome: ignore, note: "backfilled from the observed stable revision", invariants: [stable.never.reinferred], placement: unit, status: current}
  - {state: PreHold, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "clamped to 0", placement: unit, status: current}
  - {state: PreHold, event: record.legacy, variants: [failedPhaseNoMarker], outcome: transition, to: Failed, note: "a Failed phase with no marker still parks", invariants: [phase.is.input], placement: unit, status: current}
  - {state: PreHold, event: pass.resync, outcome: ignore, note: "the hold stands and reads Paused", placement: unit, status: current}
  - {state: PreHold, event: pass.staleRecord, outcome: defer, note: "the flush keeps the live record and the pass requeues", placement: sim, status: current}
