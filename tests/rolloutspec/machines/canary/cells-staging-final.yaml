# Staging/Final: the last step armed and short of its capacity before it
# ever shifted traffic. No canary pod serves while it waits, so the held
# split rests on the stable revision; a forced promote opens the step
# straight into its drain.
cells:
  - {state: Staging/Final, event: verb.pause, outcome: ignore, note: "the pass observes only: the partition echoes the step, no clock is stamped, and a forced promote present is consumed with the reason so it cannot open the final gate once the pause clears", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/pause"]}, status: decided}
  - {state: Staging/Final, event: verb.unpause, outcome: ignore, note: "the wait resumes with the clock the pause left, so a wait that began before the pause keeps counting through it; the pause stamps and clears nothing", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/unpause"]}, status: decided}
  - {state: Staging/Final, event: verb.promote, variants: [match], outcome: ignore, note: "the capacity gate in front of the final gate holds; the promote stays live for the pass that meets the capacity", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/promote"]}, status: decided}
  - {state: Staging/Final, event: verb.promote, variants: [stale], outcome: ignore, note: "a value naming another revision opens nothing and is left in place; only the canary revision's hash is a promote of this ladder", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/promote[stale]"]}, status: decided}
  - {state: Staging/Final, event: verb.promote, variants: [applied], outcome: ignore, note: "the applied verb re-shown is inert by PromotedThrough and handed back for removal; the record clears once no key carries the value", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/promote[applied]"]}, status: decided}
  - {state: Staging/Final, event: verb.promoteForce, variants: [match], windows: [before], outcome: transition, to: Draining, note: "the force clears the wait clock and every hold branch yields to it before the traffic write, so the final gate opens into its drain with no canary pod serving: the stable revision carries everything and the force stays live until the release records it", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/promoteForce"]}, status: decided}
  - {state: Staging/Final, event: verb.promoteForce, variants: [match], windows: [boundary, after], outcome: ignore, note: "the final step re-reads a live promote on every pass until the release records it, so a copy re-shown in the drain is the same live force by design; it is recorded and handed back only at the completion edge", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/promoteForce[reshown]"]}, status: decided}
  - {state: Staging/Final, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "a value naming another revision lifts nothing and is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/promoteForce[stale]"]}, status: decided}
  - {state: Staging/Final, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "the applied force re-shown is inert by PromotedThrough and handed back for removal", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/promoteForce[applied]"]}, status: decided}
  - {state: Staging/Final, event: verb.rollback, variants: [stableServes], windows: [before], outcome: transition, to: RollingBack, note: "the rejection is recorded and the revert evaluated in the same pass; with no canary pod serving before the shift the unit reads RolledBack at once", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/rollback"]}, status: decided}
  - {state: Staging/Final, event: verb.rollback, variants: [stableServes], windows: [boundary, after], outcome: ignore, note: "the recorded rejection is the record that the request was applied, so a copy re-shown after the flush is inert; a unit carrying one never takes a request again", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/rollback[reshown]"]}, status: decided}
  - {state: Staging/Final, event: verb.rollback, variants: [stableEmpty], outcome: transition, to: RollingBack, note: "the operator's rollback is the operator's decision: it proceeds toward a stable revision that runs no live Instance, with a CanaryStableRevisionEmpty warning, and the split it held stands until a stable pod serves again; only a gate-decided rollback parks on an empty stable", placement: unit, coverage: {unit: ["TestReconcile_OperatorRollbackToAnEmptyStableFromEveryLiveState"]}, status: decided}
  - {state: Staging/Final, event: verb.resume, variants: [own], outcome: reject, note: "nothing is parked, so the verb is consumed silently rather than left to fire at the next terminal hold; resume runs ahead of the holds", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/resume"]}, status: decided}
  - {state: Staging/Final, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary, parked or in flight: removed with a RolloutResumeRejected warning so it cannot fire on a later canary carrying the same hash", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/resume[stale]"]}, status: decided}
  - {state: Staging/Final, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "a bare hash is addressed to whichever unit's record carries it, so a value another unit's canary carries is left for that unit's dispatch", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/resume[otherUnit]"]}, status: decided}
  - {state: Staging/Final, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "the step index clamps into the new ladder and no hold arms when the clamped step's traffic does not exceed the weight on record; the wait continues under the clamped step, which a longer ladder makes an intermediate one", placement: unit, coverage: {replay: ["repin-lengthens-the-ladder-at-the-final-step"]}, status: decided}
  - {state: Staging/Final, event: plan.repin, variants: [raise], outcome: transition, to: PreHold, note: "a shorter ladder clamps the index onto its last step, whose 100% exceeds the weight on record, so the run layer arms the pre-step hold and the shift waits for a promote while the capacity converges", placement: unit, coverage: {replay: ["repin-shortens-the-ladder-at-the-final-step"]}, status: decided}
  - {state: Staging/Final, event: plan.drift, outcome: ignore, note: "the pinned plan executes; the run layer reports the drift and only a repin applies the edit", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/planDrift"]}, status: decided}
  - {state: Staging/Final, event: plan.unresolved, outcome: ignore, note: "with no executable body the unit is not dispatched and its Components take the full plan-gate hold, so the record and the held split freeze where they are until the plan resolves again; the run layer's plan conditions carry the signal", placement: unit, coverage: {unit: ["TestPlanGateHoldPartition"], replay: ["canary-group-stops-resolving-at-the-final-step"]}, status: decided}
  - {state: Staging/Final, event: run.lost, outcome: ignore, note: "the unit holds at the final step with its partition projected and a CanaryRunLost warning; without a pinned run the executor neither shifts the traffic nor steps, so the shift waits for the run layer to reopen or adopt the run", invariants: [unpinned.never.steps], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/runLost"]}, status: decided}
  - {state: Staging/Final, event: run.adopted, outcome: ignore, note: "the bind attaches the run's target id to a record that carries none and keeps its step and clocks, so an in-flight ladder continues under the adopting run", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/runAdopted"]}, status: decided}
  - {state: Staging/Final, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "the record is reset to step 0 toward the new target with the stable identity preserved, so a later rollback still targets the revision that was stable when the rollout began", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/newTarget"]}, status: decided}
  - {state: Staging/Final, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "a retarget mid-ladder supersedes the run; the bind resets the record to step 0 toward the new run's target before the executor's pass, with the stable identity preserved", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/newTarget[runOpen]"]}, status: decided}
  - {state: Staging/Final, event: capacity.reached, outcome: transition, to: Draining, note: "100% is written on every member and the drain window anchored to the pass that shifted it, so slow capacity cannot spend the window before the cutover; a gated final step reads Draining/Held until its gate opens and an ungated one drains at once", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/capacityReached"]}, status: decided}
  - {state: Staging/Final, event: spec.replicas, outcome: ignore, note: "the staged count and the held floor are recomputed from the new desired count on every pass; the wait continues", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/replicasUp"]}, status: decided}
  - {state: Staging/Final, event: timer.readyTimeout, outcome: transition, to: Failed, note: "the wait, clocked from when it began, outlived the ready timeout: the unit parks at the final step with the marker CapacityTimeout and the stable revision serving", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/readyTimeout"]}, status: decided}
  - {state: Staging/Final, event: pod.canaryCrashed, outcome: transition, to: Failed, note: "a canary pod that served and keeps dying parks the ladder before any count is read; the split returns to stable because capacity that keeps dying cannot be trusted with traffic", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/canaryCrashed"]}, status: decided}
  - {state: Staging/Final, event: pod.canaryRestarted, outcome: ignore, note: "no soak runs before the shift, so a restart instant is not read at the final step's capacity wait", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/canaryRestarted"]}, status: decided}
  - {state: Staging/Final, event: pod.canaryDeleted, outcome: ignore, note: "a pod on its way out is a dip the capacity gate waits out; the wait continues on its clock", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/canaryPodDeleted"]}, status: decided}
  - {state: Staging/Final, event: record.legacy, variants: [noTargetID], outcome: ignore, note: "a record with no target id under a pinned run adopts the run's id in place and keeps its step: the record predates target ids, and re-arming it would restart a ladder that is already in flight", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/record[noTargetID]"]}, status: decided}
  - {state: Staging/Final, event: record.legacy, variants: [stableEqualsCanary], outcome: ignore, note: "a persisted pair whose stable equals its canary hash is repaired from the replica's distinct current revision when the controller supplies one, because the two identities must stay distinct for a primary retarget; a secondary-only run keeps the equal pair on purpose", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/record[stableEqualsCanary]"]}, status: decided}
  - {state: Staging/Final, event: record.legacy, variants: [noStable], outcome: ignore, note: "the stable identity is backfilled from the observed stable revision and then never re-inferred, because the live pod set stops naming the pre-canary stable as revisions retarget and drain", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/record[noStable]"]}, status: decided}
  - {state: Staging/Final, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "status is an unvalidated subresource, so a negative step from an external write is clamped to 0 before it can index the plan; the unit stages step 0 again", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/record[negativeStep]"]}, status: decided}
  - {state: Staging/Final, event: record.legacy, variants: [failedPhaseNoMarker], outcome: transition, to: Failed, note: "a Failed phase with no marker is status written before the marker existed and still parks; the Failed hold re-projects the phase, so a write that dropped the marker cannot un-park the canary", invariants: [phase.is.input], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/record[failedPhaseNoMarker]"]}, status: decided}
  - {state: Staging/Final, event: pass.resync, outcome: ignore, note: "the wait continues on its clock and the held split rests on the stable revision, since no canary pod serves before the shift", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/resync"]}, status: decided}
  - {state: Staging/Final, event: pass.staleRecord, outcome: defer, note: "the flush compares the live record with the one the pass read and keeps the live record, phase and traffic when they differ; the pass requeues to decide again from the current record, so a decision made from a stale record is never written", placement: unit, coverage: {unit: ["TestBaseKeepsTheLiveRecordOverAStalePass"], replay: ["stale-pass-keeps-the-live-canary-record"]}, status: decided}
