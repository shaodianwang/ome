# Staging/Final: the last step armed and short of its capacity before it
# ever shifted traffic. No canary pod serves while it waits, so the held
# split rests on the stable revision; a forced promote opens the step
# straight into its drain.
cells:
  - {state: Staging/Final, event: verb.pause, outcome: ignore, note: "the pass observes only; a forced promote present is consumed with the reason", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/pause"]}, status: current}
  - {state: Staging/Final, event: verb.unpause, outcome: ignore, note: "the wait resumes with the clock the pause left", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/unpause"]}, status: current}
  - {state: Staging/Final, event: verb.promote, variants: [match], outcome: ignore, note: "the capacity gate in front of the final gate holds; the promote stays live for the pass that meets the capacity", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/promote"]}, status: decided}
  - {state: Staging/Final, event: verb.promote, variants: [stale], outcome: ignore, note: "a value naming another revision opens nothing", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/promote[stale]"]}, status: current}
  - {state: Staging/Final, event: verb.promote, variants: [applied], outcome: ignore, note: "the applied verb re-shown is inert and handed back for removal", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/promote[applied]"]}, status: current}
  - {state: Staging/Final, event: verb.promoteForce, variants: [match], windows: [before], outcome: transition, to: Draining, note: "the force clears the wait clock and every hold branch yields to it before the traffic write, so the final gate opens into its drain with no canary pod serving: the stable revision carries everything and the force stays live until the release records it", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/promoteForce"]}, status: decided}
  - {state: Staging/Final, event: verb.promoteForce, variants: [match], windows: [boundary, after], outcome: ignore, note: "the final step re-reads a live promote on every pass until the release records it; a copy re-shown in the drain is the same live force, by design", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/promoteForce[reshown]"]}, status: current}
  - {state: Staging/Final, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "a value naming another revision lifts nothing", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/promoteForce[stale]"]}, status: current}
  - {state: Staging/Final, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "the applied force re-shown is inert and handed back for removal", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/promoteForce[applied]"]}, status: current}
  - {state: Staging/Final, event: verb.rollback, variants: [stableServes], windows: [before], outcome: transition, to: RollingBack, note: "the rejection is recorded; with no canary pod serving the unit reads RolledBack in the same pass", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/rollback"]}, status: current}
  - {state: Staging/Final, event: verb.rollback, variants: [stableServes], windows: [boundary, after], outcome: ignore, note: "the recorded rejection keeps a re-shown request inert", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/rollback[reshown]"]}, status: current}
  - {state: Staging/Final, event: verb.rollback, variants: [stableEmpty], outcome: DECIDE, to: RollingBack, note: "today: the operator's rollback proceeds toward a stable revision that runs no live Instance, with a warning. Question: as Staging/verb.rollback[stableEmpty].", placement: unit, status: current}
  - {state: Staging/Final, event: verb.resume, variants: [own], outcome: reject, note: "nothing is parked: consumed silently", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/resume"]}, status: current}
  - {state: Staging/Final, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary: removed with a warning", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/resume[stale]"]}, status: current}
  - {state: Staging/Final, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "left for the unit that owns it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/resume[otherUnit]"]}, status: current}
  - {state: Staging/Final, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "the step index clamps into the new ladder; the wait continues under the clamped step", placement: unit, status: current}
  - {state: Staging/Final, event: plan.repin, variants: [raise], outcome: transition, to: PreHold, note: "the clamped step would raise traffic over the recorded weight, so the run layer arms the pre-step hold", placement: unit, status: current}
  - {state: Staging/Final, event: plan.drift, outcome: ignore, note: "the pinned plan executes", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/planDrift"]}, status: current}
  - {state: Staging/Final, event: plan.unresolved, outcome: DECIDE, note: "today: the unit is not dispatched and freezes where it is. Question: as Staging/plan.unresolved.", placement: unit, status: current}
  - {state: Staging/Final, event: run.lost, outcome: DECIDE, note: "today: the unit holds at the final step with its partition projected and a CanaryRunLost warning. Question: as Staging/run.lost.", invariants: [unpinned.never.steps], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/runLost"]}, status: current}
  - {state: Staging/Final, event: run.adopted, outcome: ignore, note: "the target id is attached; the step and clocks are kept", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/runAdopted"]}, status: current}
  - {state: Staging/Final, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "the record is reset to step 0 toward the new target with the stable identity preserved", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/newTarget"]}, status: current}
  - {state: Staging/Final, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "the bind resets the record toward the new run's target", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/newTarget[runOpen]"]}, status: current}
  - {state: Staging/Final, event: capacity.reached, outcome: transition, to: Draining, note: "100% is written on every member and the drain anchored to this pass; a gated final step reads Draining/Held until its gate opens", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/capacityReached"]}, status: current}
  - {state: Staging/Final, event: spec.replicas, outcome: ignore, note: "the staged count and the held floor are recomputed; the wait continues", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/replicasUp"]}, status: current}
  - {state: Staging/Final, event: timer.readyTimeout, outcome: transition, to: Failed, note: "the wait outlived the ready timeout: the unit parks at the final step with the stable revision serving", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/readyTimeout"]}, status: current}
  - {state: Staging/Final, event: pod.canaryCrashed, outcome: transition, to: Failed, note: "a canary pod that served and keeps dying parks the ladder before any count is read", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/canaryCrashed"]}, status: current}
  - {state: Staging/Final, event: pod.canaryRestarted, outcome: ignore, note: "no soak runs before the shift", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/canaryRestarted"]}, status: current}
  - {state: Staging/Final, event: pod.canaryDeleted, outcome: ignore, note: "a pod on its way out is a dip; the wait continues", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/canaryPodDeleted"]}, status: current}
  - {state: Staging/Final, event: record.legacy, variants: [noTargetID], outcome: DECIDE, note: "today: the record adopts the run's target id in place. Question: as Staging/record.legacy[noTargetID].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/record[noTargetID]"]}, status: current}
  - {state: Staging/Final, event: record.legacy, variants: [stableEqualsCanary], outcome: DECIDE, note: "today: the equal pair is repaired from the replica's distinct current revision. Question: as Staging/record.legacy[stableEqualsCanary].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/record[stableEqualsCanary]"]}, status: current}
  - {state: Staging/Final, event: record.legacy, variants: [noStable], outcome: ignore, note: "backfilled from the observed stable revision, then never re-inferred", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/record[noStable]"]}, status: current}
  - {state: Staging/Final, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "clamped to 0 before it can index the plan", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/record[negativeStep]"]}, status: current}
  - {state: Staging/Final, event: record.legacy, variants: [failedPhaseNoMarker], outcome: transition, to: Failed, note: "a Failed phase with no marker still parks", invariants: [phase.is.input], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/record[failedPhaseNoMarker]"]}, status: current}
  - {state: Staging/Final, event: pass.resync, outcome: ignore, note: "the wait continues on its clock", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Staging[final]/resync"]}, status: current}
  - {state: Staging/Final, event: pass.staleRecord, outcome: defer, note: "the flush keeps the live record and the pass requeues", placement: sim, status: current}
