# RollingBack and RolledBack: a rejected revision is recorded. The revert
# drains every member back to its stable revision and reads complete only
# when no pod off stable remains; the settled hold keeps the rejected
# revision out until a target the run offers this unit appears or the
# operator resumes.
cells:
  - {state: RollingBack, event: verb.pause, outcome: ignore, note: "the pass echoes the rollback so the controller neither arms nor clears the replica's revert signal; nothing else is written", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/pause"]}, status: decided}
  - {state: RollingBack, event: verb.unpause, outcome: ignore, note: "the revert is re-read as it stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/unpause"]}, status: current}
  - {state: RollingBack, event: verb.promote, variants: [match], outcome: ignore, note: "the rollback hold reads no promote; the verb is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/promote"]}, status: current}
  - {state: RollingBack, event: verb.promote, variants: [stale], outcome: ignore, note: "left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/promote[stale]"]}, status: current}
  - {state: RollingBack, event: verb.promote, variants: [applied], outcome: ignore, note: "left in place; the record's sync does not run inside the hold", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/promote[applied]"]}, status: current}
  - {state: RollingBack, event: verb.promoteForce, variants: [match], outcome: reject, note: "a forced promote has nothing to act on while the canary is rolling back: removed with a CanaryForceIgnored warning", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/promoteForce"]}, status: decided}
  - {state: RollingBack, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "another value is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/promoteForce[stale]"]}, status: current}
  - {state: RollingBack, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/promoteForce[applied]"]}, status: current}
  - {state: RollingBack, event: verb.rollback, variants: [stableServes], outcome: ignore, note: "the recorded rejection is the record that the request was applied; a unit carrying one never takes a request again", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/rollback"]}, status: current}
  - {state: RollingBack, event: verb.resume, variants: [own], outcome: reject, note: "a revert in flight is not terminal: the verb is consumed silently and the drain continues", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/resume"]}, status: decided}
  - {state: RollingBack, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary: removed with a warning", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/resume[stale]"]}, status: current}
  - {state: RollingBack, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "left for the unit that owns it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/resume[otherUnit]"]}, status: current}
  - {state: RollingBack, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "the run layer clamps the index of a record it does not know is rolling back; the hold is unaffected", placement: unit, status: current}
  - {state: RollingBack, event: plan.repin, variants: [raise], outcome: ignore, note: "a pre-step hold is set under the rollback hold, which outranks it; the next re-arm's reset clears both", placement: unit, status: current}
  - {state: RollingBack, event: plan.drift, outcome: ignore, note: "the pinned plan executes", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/planDrift"]}, status: current}
  - {state: RollingBack, event: plan.unresolved, outcome: DECIDE, note: "today: the unit is not dispatched: the revert's completion is never read and the replica's revert signal is neither re-asserted nor cleared. Question: as Staging/plan.unresolved.", placement: unit, status: current}
  - {state: RollingBack, event: run.lost, outcome: ignore, note: "the revert keeps draining: the rollback branch precedes the run-lost hold, and the run layer adopts the revert in place", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/runLost"]}, status: decided}
  - {state: RollingBack, event: run.adopted, outcome: ignore, note: "a revert still draining is adopted in place; the pin names the rejected revision so the run's close recognizes the rollback as its own", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/runAdopted"]}, status: current}
  - {state: RollingBack, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "the run retargeted the unit: the rollback request is removed durably before the reset, and the record re-arms at step 0 while the rejected pods are still draining", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/newTarget"]}, status: decided}
  - {state: RollingBack, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "the bind removes the request durably and resets the record toward the new run's target", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/newTarget[runOpen]"]}, status: decided}
  - {state: RollingBack, event: target.new, variants: [otherGroup], outcome: ignore, note: "another group's run pins this unit at its stable revision in place of the rejected one, so its target id changes without offering it a target; the hold stays", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/newTarget[otherGroup]"]}, status: decided}
  - {state: RollingBack, event: spec.replicas, outcome: ignore, note: "partition 0 is forced during a revert; the replica rolls every Instance back whatever the count", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/replicasUp"]}, status: current}
  - {state: RollingBack, event: pod.canaryCrashed, outcome: ignore, note: "a crash of a rejected pod changes nothing: it is draining anyway", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/canaryCrashed"]}, status: decided}
  - {state: RollingBack, event: pod.canaryRestarted, outcome: ignore, note: "a restart of a rejected pod changes nothing", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/canaryRestarted"]}, status: current}
  - {state: RollingBack, event: pod.rejectedGone, variants: [unit], outcome: transition, to: RolledBack, note: "no pod of any member with a stable identity runs a revision other than its stable one, ready or not: the rolled-back revisions are recorded and the revert reads complete", invariants: [revert.whole.unit], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/rejectedPodsGone", "TestReconcileCells/canary/RollingBack[PD]/groupReverted"]}, status: decided}
  - {state: RollingBack, event: pod.rejectedGone, variants: [primaryOnly], outcome: ignore, note: "the primary is back on stable but a member still has a rejected pod: the unit reverts as a whole, so the revert stays in flight", invariants: [revert.whole.unit], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack[PD]/primaryReverted"]}, status: decided}
  - {state: RollingBack, event: pod.rejectedGone, variants: [primaryUnreadyRemains], outcome: ignore, note: "every ready pod is on stable but an unready rejected pod still exists: a revert is complete only when the rejected pods are gone, not merely unready", invariants: [revert.whole.unit], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack[PD]/primaryRejectedPodUnready"]}, status: decided}
  - {state: RollingBack, event: pod.rejectedGone, variants: [memberWithoutStable], outcome: transition, to: RolledBack, note: "a member with no stable identity is sent no revert signal and is not waited on; the unit reads complete without it", invariants: [revert.whole.unit], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack[PD]/memberStableUnknown"]}, status: decided}
  - {state: RollingBack, event: stable.crMissing, outcome: transition, to: Failed/StableMissing, note: "the dispatch finds no retained ControllerRevision the replica controls for a member's stable revision: it parks the unit with the marker, emits CanaryStableRevisionMissing and hands the request back for removal; the replica is sent no revert target", placement: unit, coverage: {replay: [rollback-finds-no-stable-revision]}, status: current}
  - {state: RollingBack, event: record.legacy, variants: [noTargetID], outcome: DECIDE, note: "today: adopted in place. Question: as Staging/record.legacy[noTargetID].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/record[noTargetID]"]}, status: current}
  - {state: RollingBack, event: record.legacy, variants: [stableEqualsCanary], outcome: DECIDE, note: "today: repaired from the replica's distinct current revision when the controller supplies one. Question: as Staging/record.legacy[stableEqualsCanary].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/record[stableEqualsCanary]"]}, status: current}
  - {state: RollingBack, event: record.legacy, variants: [noStable], outcome: DECIDE, note: "today: with no persisted stable identity the revert's target and the re-arm's stable exclusion are inferred from the live pod set, the revision with the most pods off the rejected one, and the revert-complete check degrades to the rejected pods alone. Question: should a rollback with no persisted stable identity park rather than infer its target from the pods?", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/record[noStable]"]}, status: current}
  - {state: RollingBack, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "clamped to 0; the hold does not index the plan", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/record[negativeStep]"]}, status: current}
  - {state: RollingBack, event: record.legacy, variants: [failedPhaseNoMarker], outcome: ignore, note: "the recorded rejection outranks a phase-only Failed; the revert is re-evaluated and re-projects its phase", invariants: [phase.is.input], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/record[failedPhaseNoMarker]"]}, status: current}
  - {state: RollingBack, event: pass.resync, outcome: ignore, note: "the revert is re-evaluated against the pods; traffic rests on stable capacity that serves and the pass asks to come back", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack[PD]/resync"]}, status: decided}
  - {state: RollingBack, event: pass.staleRecord, outcome: DECIDE, note: "today: the flush keeps the live record and the pass requeues, but the revert signal the dispatch wrote onto the replica before the flush stands; a gate-decided rollback has no annotation to re-decide from, and a later pass that reads no rejection clears the signal again. Question: should the replica's revert signal be written only after the status write that records the rejection has landed?", placement: sim, status: current}
  # --- RolledBack ---------------------------------------------------------------------
  - {state: RolledBack, event: verb.pause, outcome: ignore, note: "the pass echoes the rollback; nothing else is written", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/pause"]}, status: decided}
  - {state: RolledBack, event: verb.unpause, outcome: ignore, note: "the hold is re-read as it stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/unpause"]}, status: current}
  - {state: RolledBack, event: verb.promote, variants: [match], outcome: ignore, note: "the hold reads no promote; the verb is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/promote"]}, status: decided}
  - {state: RolledBack, event: verb.promote, variants: [stale], outcome: ignore, note: "left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/promote[stale]"]}, status: current}
  - {state: RolledBack, event: verb.promote, variants: [applied], outcome: ignore, note: "left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/promote[applied]"]}, status: current}
  - {state: RolledBack, event: verb.promoteForce, variants: [match], outcome: reject, note: "a forced promote has nothing to act on while the canary is held rolled back: removed with a warning", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/promoteForce"]}, status: decided}
  - {state: RolledBack, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "another value is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/promoteForce[stale]"]}, status: current}
  - {state: RolledBack, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/promoteForce[applied]"]}, status: current}
  - {state: RolledBack, event: verb.rollback, variants: [stableServes], outcome: ignore, note: "the recorded rejection keeps the request inert and unconsumed; clearing the annotation alone never retries the rejected revision", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/rollback"]}, status: decided}
  - {state: RolledBack, event: verb.resume, variants: [own], windows: [before], outcome: transition, to: Staging, note: "the rollback request is removed durably, the record re-arms at step 0 toward the parked revision and the pass returns; no run is needed, because the cleared rejection lets the run layer open a fresh run over the same revision", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/resume"]}, status: decided}
  - {state: RolledBack, event: verb.resume, variants: [own], windows: [boundary, after], outcome: DECIDE, note: "today: a resume leaves no record; a copy re-shown after the re-arm finds the unit non-terminal and is consumed silently, but a ladder that parks again before the copy is removed is resumed a second time. Question: should the resume leave a record, as the promote does, so a re-shown copy cannot resume a later park?", invariants: [one.verb.one.effect], placement: sim, status: current}
  - {state: RolledBack, event: verb.resume, variants: [stale], outcome: reject, note: "the value is not the parked canary revision: removed with a warning, the hold stays", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/resume[stale]"]}, status: decided}
  - {state: RolledBack, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "left for the unit that owns it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/resume[otherUnit]"]}, status: current}
  - {state: RolledBack, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "the index is clamped under the hold; the hold is unaffected", placement: unit, status: current}
  - {state: RolledBack, event: plan.repin, variants: [raise], outcome: ignore, note: "a pre-step hold set under the rollback hold is outranked by it and cleared by the next re-arm", placement: unit, status: current}
  - {state: RolledBack, event: plan.drift, outcome: ignore, note: "no run is pinned on a settled hold; the live view changes nothing until a target appears", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/planDrift"]}, status: current}
  - {state: RolledBack, event: plan.unresolved, outcome: ignore, note: "the unit is not dispatched; a settled hold has nothing to drive", placement: unit, status: current}
  - {state: RolledBack, event: run.lost, outcome: ignore, note: "a settled hold stays settled; the run that presented the revision closed RolledBack", invariants: [unpinned.never.steps], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/runLost"]}, status: decided}
  - {state: RolledBack, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "a target that is neither the rejected nor the stable revision re-arms the unit; the request is removed durably before the reset", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/newTarget"]}, status: decided}
  - {state: RolledBack, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "the bind removes the request durably and resets the record toward the new run's target", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/newTarget[runOpen]"]}, status: decided}
  - {state: RolledBack, event: target.new, variants: [otherGroup], outcome: ignore, note: "another group's run pins this unit at its stable revision: its target id changes without offering a target, and the hash test reads the stable revision as the hold it sits in", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/newTarget[otherGroup]"]}, status: decided}
  - {state: RolledBack, event: spec.replicas, outcome: ignore, note: "partition 0 is projected under the hold; the workload scales on the stable revision", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/replicasUp"]}, status: current}
  - {state: RolledBack, event: pod.canaryCrashed, outcome: ignore, note: "no canary pod remains; a crash reading is not acted on", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/canaryCrashed"]}, status: decided}
  - {state: RolledBack, event: record.legacy, variants: [noTargetID], outcome: DECIDE, note: "today: adopted in place. Question: as Staging/record.legacy[noTargetID].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/record[noTargetID]"]}, status: current}
  - {state: RolledBack, event: record.legacy, variants: [stableEqualsCanary], outcome: DECIDE, note: "today: repaired from the replica's distinct current revision. Question: as Staging/record.legacy[stableEqualsCanary].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/record[stableEqualsCanary]"]}, status: current}
  - {state: RolledBack, event: record.legacy, variants: [noStable], outcome: DECIDE, note: "today: the hold's stable exclusion is inferred from the live pod set. Question: as RollingBack/record.legacy[noStable].", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/record[noStable]"]}, status: current}
  - {state: RolledBack, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "clamped to 0", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/record[negativeStep]"]}, status: current}
  - {state: RolledBack, event: record.legacy, variants: [failedPhaseNoMarker], outcome: ignore, note: "the recorded rejection outranks a phase-only Failed; a lost RolledBack phase reads RollingBack until the revert is re-evaluated as complete", invariants: [phase.is.input], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/record[failedPhaseNoMarker]"]}, status: current}
  - {state: RolledBack, event: pass.resync, outcome: ignore, note: "the hold stands; the revert is re-evaluated as complete", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/resync"]}, status: decided}
  - {state: RolledBack, event: pass.staleRecord, outcome: defer, note: "the flush keeps the live record and the pass requeues", placement: sim, status: current}
