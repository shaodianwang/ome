# RollingBack and RolledBack: a rejected revision is recorded. The revert
# drains every member back to its stable revision and reads complete only
# when no pod off stable remains; the settled hold keeps the rejected
# revision out until a target the run offers this unit appears or the
# operator resumes.
cells:
  - {state: RollingBack, event: verb.pause, outcome: ignore, note: "the pass echoes the rollback so the controller neither arms nor clears the replica's revert signal; nothing else is written", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/pause"]}, status: decided}
  - {state: RollingBack, event: verb.unpause, outcome: ignore, note: "the revert is re-read as it stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/unpause"]}, status: decided}
  - {state: RollingBack, event: verb.promote, variants: [match], outcome: ignore, note: "the rollback hold reads no promote; the verb is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/promote"]}, status: decided}
  - {state: RollingBack, event: verb.promote, variants: [stale], outcome: ignore, note: "a value naming another revision is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/promote[stale]"]}, status: decided}
  - {state: RollingBack, event: verb.promote, variants: [applied], outcome: ignore, note: "left in place; the record's sync does not run inside the hold", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/promote[applied]"]}, status: decided}
  - {state: RollingBack, event: verb.promoteForce, variants: [match], outcome: reject, note: "a forced promote has nothing to act on while the canary is rolling back: removed with a CanaryForceIgnored warning", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/promoteForce"]}, status: decided}
  - {state: RollingBack, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "a value naming another revision is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/promoteForce[stale]"]}, status: decided}
  - {state: RollingBack, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "left in place; the record's sync does not run inside the hold", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/promoteForce[applied]"]}, status: decided}
  - {state: RollingBack, event: verb.rollback, variants: [stableServes], outcome: ignore, note: "the recorded rejection is the record that the request was applied; a unit carrying one never takes a request again, so the copy is inert and left for the controller's removal", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/rollback"]}, status: decided}
  - {state: RollingBack, event: verb.resume, variants: [own], outcome: reject, note: "a revert in flight is not terminal: the verb is consumed silently and the drain continues", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/resume"]}, status: decided}
  - {state: RollingBack, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary: removed with a warning", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/resume[stale]"]}, status: decided}
  - {state: RollingBack, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "left for the unit that owns it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/resume[otherUnit]"]}, status: decided}
  - {state: RollingBack, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "the run layer clamps the index of a record it does not know is rolling back and arms no hold; the revert does not index the plan, so the hold is unaffected", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/repin[holdOrTighten]"]}, status: decided}
  - {state: RollingBack, event: plan.repin, variants: [raise], outcome: ignore, note: "the clamp arms the pre-step hold under the rollback hold, which outranks it; the next re-arm's reset clears both", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/repin[raise]"]}, status: decided}
  - {state: RollingBack, event: plan.drift, outcome: ignore, note: "the pinned plan executes", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/planDrift"]}, status: decided}
  - {state: RollingBack, event: plan.unresolved, outcome: ignore, note: "with no pin and no body the run layer parks the plan with a warning and the unit is not dispatched: the revert signal already on the replica stands, neither re-asserted nor cleared, and the revert's completion is not read until a body resolves", placement: unit, coverage: {replay: [rolling-back-stale-record-and-lost-policy]}, status: decided}
  - {state: RollingBack, event: run.lost, outcome: ignore, note: "the revert keeps draining: the rollback branch precedes the run-lost hold, and the run layer adopts the revert in place", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/runLost"]}, status: decided}
  - {state: RollingBack, event: run.adopted, outcome: ignore, note: "a revert still draining is adopted in place; the pin names the rejected revision so the run's close recognizes the rollback as its own", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/runAdopted"]}, status: decided}
  - {state: RollingBack, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "the run retargeted the unit: the rollback request is removed durably before the reset, and the record re-arms at step 0 while the rejected pods are still draining", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/newTarget"]}, status: decided}
  - {state: RollingBack, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "the bind removes the request durably and resets the record toward the new run's target", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/newTarget[runOpen]"]}, status: decided}
  - {state: RollingBack, event: target.new, variants: [otherGroup], outcome: ignore, note: "another group's run pins this unit at its stable revision in place of the rejected one, so its target id changes without offering it a target; the hold stays", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/newTarget[otherGroup]"]}, status: decided}
  - {state: RollingBack, event: spec.replicas, outcome: ignore, note: "partition 0 is forced during a revert; the replica rolls every Instance back whatever the count", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/replicasUp"]}, status: decided}
  - {state: RollingBack, event: pod.canaryCrashed, outcome: ignore, note: "a crash of a rejected pod changes nothing: it is draining anyway", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/canaryCrashed"]}, status: decided}
  - {state: RollingBack, event: pod.canaryRestarted, outcome: ignore, note: "a restart of a rejected pod changes nothing", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/canaryRestarted"]}, status: decided}
  - {state: RollingBack, event: pod.rejectedGone, variants: [unit], outcome: transition, to: RolledBack, note: "no pod of any member with a stable identity runs a revision other than its stable one, ready or not: the rolled-back revisions are recorded and the revert reads complete", invariants: [revert.whole.unit], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/rejectedPodsGone", "TestReconcileCells/canary/RollingBack[PD]/groupReverted"], replay: [rolled-back-loses-policy]}, status: decided}
  - {state: RollingBack, event: pod.rejectedGone, variants: [primaryOnly], outcome: ignore, note: "the primary is back on stable but a member still has a rejected pod: the unit reverts as a whole, so the revert stays in flight", invariants: [revert.whole.unit], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack[PD]/primaryReverted"]}, status: decided}
  - {state: RollingBack, event: pod.rejectedGone, variants: [primaryUnreadyRemains], outcome: ignore, note: "every ready pod is on stable but an unready rejected pod still exists: a revert is complete only when the rejected pods are gone, not merely unready", invariants: [revert.whole.unit], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack[PD]/primaryRejectedPodUnready"]}, status: decided}
  - {state: RollingBack, event: pod.rejectedGone, variants: [memberWithoutStable], outcome: transition, to: RolledBack, note: "a member with no stable identity is sent no revert signal and is not waited on; the unit reads complete without it", invariants: [revert.whole.unit], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack[PD]/memberStableUnknown"]}, status: decided}
  - {state: RollingBack, event: stable.crMissing, outcome: transition, to: Failed/StableMissing, note: "the dispatch finds no retained ControllerRevision the replica controls for a member's stable revision: it parks the unit with the marker, emits CanaryStableRevisionMissing and hands the request back for removal; the replica is sent no revert target", placement: unit, coverage: {replay: [rollback-finds-no-stable-revision]}, status: decided}
  - {state: RollingBack, event: record.legacy, variants: [noTargetID], outcome: ignore, note: "a record with no target id under a pinned run adopts the run's id in place; the revert continues", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/record[noTargetID]"]}, status: decided}
  - {state: RollingBack, event: record.legacy, variants: [stableEqualsCanary], outcome: ignore, note: "a pair whose stable equals its canary hash is repaired from the replica's distinct current revision when the pass supplies one; the revert continues toward it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/record[stableEqualsCanary]"]}, status: decided}
  - {state: RollingBack, event: record.legacy, variants: [noStable], outcome: ignore, note: "with no persisted stable identity the revert's target and the re-arm's stable exclusion are seeded from the live pod set, the revision with the most pods off the rejected one, and the revert-complete check degrades to the rejected pods alone; the pod set is the identity's last seeding source and is not re-read once an identity is held", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/record[noStable]"]}, status: decided}
  - {state: RollingBack, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "read back from the record, step 0 here; the hold does not index the plan", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/record[negativeStep]"]}, status: decided}
  - {state: RollingBack, event: record.legacy, variants: [failedPhaseNoMarker], outcome: ignore, note: "the recorded rejection outranks a phase-only Failed; the revert is re-evaluated and re-projects its phase", invariants: [phase.is.input], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack/record[failedPhaseNoMarker]"]}, status: decided}
  - {state: RollingBack, event: pass.resync, outcome: ignore, note: "the revert is re-evaluated against the pods; traffic rests on stable capacity that serves and the pass asks to come back", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RollingBack[PD]/resync"]}, status: decided}
  - {state: RollingBack, event: pass.staleRecord, outcome: defer, note: "today the flush keeps the live record and the pass requeues, but the revert signal the dispatch wrote onto the replica before the flush stands: a gate-decided rollback made from a stale record can point the replica at stable while the status keeps a live record that carries no rejection, which is wrong because the replica should revert only on a rejection the status has recorded", placement: sim, coverage: {replay: [rolling-back-stale-record-and-lost-policy]}, status: decided}
  # --- RolledBack ---------------------------------------------------------------------
  - {state: RolledBack, event: verb.pause, outcome: ignore, note: "the pass echoes the rollback; nothing else is written", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/pause"]}, status: decided}
  - {state: RolledBack, event: verb.unpause, outcome: ignore, note: "the hold is re-read as it stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/unpause"]}, status: decided}
  - {state: RolledBack, event: verb.promote, variants: [match], outcome: ignore, note: "the hold reads no promote; the verb is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/promote"]}, status: decided}
  - {state: RolledBack, event: verb.promote, variants: [stale], outcome: ignore, note: "a value naming another revision is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/promote[stale]"]}, status: decided}
  - {state: RolledBack, event: verb.promote, variants: [applied], outcome: ignore, note: "left in place; the record's sync does not run inside the hold", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/promote[applied]"]}, status: decided}
  - {state: RolledBack, event: verb.promoteForce, variants: [match], outcome: reject, note: "a forced promote has nothing to act on while the canary is held rolled back: removed with a warning", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/promoteForce"]}, status: decided}
  - {state: RolledBack, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "a value naming another revision is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/promoteForce[stale]"]}, status: decided}
  - {state: RolledBack, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "left in place; the record's sync does not run inside the hold", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/promoteForce[applied]"]}, status: decided}
  - {state: RolledBack, event: verb.rollback, variants: [stableServes], outcome: ignore, note: "the recorded rejection keeps the request inert and unconsumed; clearing the annotation alone never retries the rejected revision", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/rollback"]}, status: decided}
  - {state: RolledBack, event: verb.resume, variants: [own], windows: [before], outcome: transition, to: Staging, note: "the rollback request is removed durably, the record re-arms at step 0 toward the parked revision and the pass returns; no run is needed, because the cleared rejection lets the run layer open a fresh run over the same revision", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/resume"]}, status: decided}
  - {state: RolledBack, event: verb.resume, variants: [own], windows: [boundary, after], outcome: reject, note: "today a resume leaves no record in status: a copy re-shown while the re-armed unit is live is consumed silently, but one re-shown after the ladder parks again re-arms it a second time, which is wrong because one verb is meant to have one effect", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/resume[reshown]"]}, status: decided}
  - {state: RolledBack, event: verb.resume, variants: [stale], outcome: reject, note: "the value is not the parked canary revision: removed with a warning, the hold stays", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/resume[stale]"]}, status: decided}
  - {state: RolledBack, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "left for the unit that owns it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/resume[otherUnit]"]}, status: decided}
  - {state: RolledBack, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "the run layer clamps the index under the hold and arms no hold of its own; the settled revert does not index the plan", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/repin[holdOrTighten]"]}, status: decided}
  - {state: RolledBack, event: plan.repin, variants: [raise], outcome: ignore, note: "the clamp arms the pre-step hold under the rollback hold, which outranks it; the next re-arm's reset clears both", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/repin[raise]"]}, status: decided}
  - {state: RolledBack, event: plan.drift, outcome: ignore, note: "no run is pinned on a settled hold; the live view changes nothing until a target appears", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/planDrift"]}, status: decided}
  - {state: RolledBack, event: plan.unresolved, outcome: ignore, note: "with no pin and no body the run layer parks the plan with a warning and the unit is not dispatched; a settled hold has nothing left to drive, and the projection's full hold changes nothing for Instances already on the stable revision", placement: unit, coverage: {replay: [rolled-back-loses-policy]}, status: decided}
  - {state: RolledBack, event: run.lost, outcome: ignore, note: "a settled hold stays settled; the run that presented the revision closed RolledBack", invariants: [unpinned.never.steps], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/runLost"]}, status: decided}
  - {state: RolledBack, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "a target that is neither the rejected nor the stable revision re-arms the unit; the request is removed durably before the reset", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/newTarget"]}, status: decided}
  - {state: RolledBack, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "the bind removes the request durably and resets the record toward the new run's target", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/newTarget[runOpen]"]}, status: decided}
  - {state: RolledBack, event: target.new, variants: [otherGroup], outcome: ignore, note: "another group's run pins this unit at its stable revision: its target id changes without offering a target, and the hash test reads the stable revision as the hold it sits in", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/newTarget[otherGroup]"]}, status: decided}
  - {state: RolledBack, event: spec.replicas, outcome: ignore, note: "partition 0 is projected under the hold; the workload scales on the stable revision", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/replicasUp"]}, status: decided}
  - {state: RolledBack, event: pod.canaryCrashed, outcome: ignore, note: "no canary pod remains; a crash reading is not acted on", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/canaryCrashed"]}, status: decided}
  - {state: RolledBack, event: record.legacy, variants: [noTargetID], outcome: ignore, note: "a record with no target id under a pinned run adopts the run's id in place; the hold stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/record[noTargetID]"]}, status: decided}
  - {state: RolledBack, event: record.legacy, variants: [stableEqualsCanary], outcome: ignore, note: "a pair whose stable equals its canary hash is repaired from the replica's distinct current revision when the pass supplies one; the hold stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/record[stableEqualsCanary]"]}, status: decided}
  - {state: RolledBack, event: record.legacy, variants: [noStable], outcome: ignore, note: "with no persisted stable identity the hold's stable exclusion and the revert-complete check are seeded from the live pod set, the identity's last seeding source", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/record[noStable]"]}, status: decided}
  - {state: RolledBack, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "read back from the record, step 0 here; the hold does not index the plan", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/record[negativeStep]"]}, status: decided}
  - {state: RolledBack, event: record.legacy, variants: [failedPhaseNoMarker], outcome: ignore, note: "the recorded rejection outranks a phase-only Failed; a lost RolledBack phase reads RollingBack until the revert is re-evaluated as complete", invariants: [phase.is.input], placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/record[failedPhaseNoMarker]"]}, status: decided}
  - {state: RolledBack, event: pass.resync, outcome: ignore, note: "the hold stands; the revert is re-evaluated as complete", placement: unit, coverage: {unit: ["TestReconcileCells/canary/RolledBack/resync"]}, status: decided}
  - {state: RolledBack, event: pass.staleRecord, outcome: defer, note: "the flush compares the record and the phase it projects, so a pass that read the copy from before the revert completed keeps the live record and phase and requeues without writing its decision", placement: sim, coverage: {unit: ["TestBaseKeepsALiveHoldOverAPassThatMissedItsClockOrPhase"]}, status: decided}
