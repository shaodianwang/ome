# One edge per move the executor makes, with the condition the named file
# checks before it. An edge names the event that fires it in the common
# case; a cell of another event may name the same destination (a forced
# promote opens the gate a timed soak would, a promote advances the step a
# pass sample would), so an edge is a destination, not a column. Edges that
# land on Staging from a live or held unit are the re-arm: the record is
# reset to step 0 toward the new target with its stable identity preserved.
# A step advance lands on Staging when the next step is intermediate and on
# Staging/Final when it is the last; the pass that advances writes nothing
# else for the new step.
transitions:
  # --- Idle ----------------------------------------------------------------
  - {id: T-idle-arm-bind, from: Idle, event: target.new, variant: runOpen, guard: "the opened run retargets the unit and pins a stable revision for its primary", to: Staging, effects: [record armed at step 0 toward the pinned target with the pinned stable, phase Pending], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/run_binding.go}
  - {id: T-idle-arm, from: Idle, event: target.new, variant: observed, guard: "a pinned run names a target the unit does not already fully serve, a stable revision is known, and the run retargets the unit", to: Staging, effects: [record armed at step 0 with the observed stable, phase Pending], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  # --- Staging ---------------------------------------------------------------
  - {id: T-staging-serve-manual, from: Staging, event: capacity.reached, guard: "the step's staged capacity is Ready on every member and its gate is a bare Pause", to: Serving/Manual, effects: [the step's split written on every member, soak anchor stamped, phase Paused], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-staging-serve-timed, from: Staging, event: capacity.reached, guard: "the step's staged capacity is Ready on every member and its gate is a timed Pause", to: Serving/Timed, effects: [the step's split written, soak anchor stamped, phase Paused], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-staging-serve-analysis, from: Staging, event: capacity.reached, guard: "the step's staged capacity is Ready on every member and the step opts into analysis", to: Serving/Analysis, effects: [the step's split written, soak anchor stamped, phase Paused], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-staging-advance, from: Staging, event: capacity.reached, guard: "the step's staged capacity is Ready and the step has neither Pause nor Analysis, and the next step is intermediate", to: Staging, effects: [the step's split written, step advanced, phase Pending], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/promotion.go}
  - {id: T-staging-advance-final, from: Staging, event: capacity.reached, guard: "the step's staged capacity is Ready and the step is ungated, and the next step is the last", to: Staging/Final, effects: [the step's split written, step advanced, phase Pending], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/promotion.go}
  - {id: T-staging-force, from: Staging, event: verb.promoteForce, variant: match, guard: "the forced promote lifts the capacity wait and opens the step's gate; the next step is intermediate", to: Staging, effects: [split written on the pods that serve, step advanced, PromotedThrough recorded, phase Pending], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-staging-force-final, from: Staging, event: verb.promoteForce, variant: match, guard: "the forced promote lifts the capacity wait and opens the step's gate; the next step is the last", to: Staging/Final, effects: [split written on the pods that serve, step advanced, PromotedThrough recorded, phase Pending], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-staging-rollback, from: Staging, event: verb.rollback, guard: "the request is true and the step is below the ladder's end", to: RollingBack, effects: [RolledBackRevisionHash recorded, the revert evaluated in the same pass, phase RollingBack or RolledBack], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  - {id: T-staging-rearm, from: Staging, event: target.new, guard: "the run's target id for the unit changed", to: Staging, effects: [record reset to step 0 toward the new target, stable identity preserved, phase Pending], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  - {id: T-staging-crash, from: Staging, event: pod.canaryCrashed, guard: "a canary pod of the unit is crash-looping after it served", to: Failed, effects: [split returned to stable, Failed marker CapacityTimeout, phase Failed], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-staging-timeout, from: Staging, event: timer.readyTimeout, guard: "the capacity wait outlived the resolved ready timeout", to: Failed, effects: [Failed marker CapacityTimeout, phase Failed], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-staging-repin-hold, from: Staging, event: plan.repin, variant: raise, guard: "the clamped step's traffic exceeds the recorded weight", to: PreHold, effects: [PreStepHold set by the run layer], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/rolloutrun/rolloutrun.go}
  - {id: T-staging-phase-failed, from: Staging, event: record.legacy, variant: failedPhaseNoMarker, guard: "the primary's phase reads Failed", to: Failed, effects: [the Failed hold runs and re-projects the phase], decided_in: pkg/rollout/canary_state.go}
  # --- Staging/Final -----------------------------------------------------------
  - {id: T-final-shift, from: Staging/Final, event: capacity.reached, guard: "the final step's staged capacity is Ready on every member and the step is ungated", to: Draining, effects: [100% written on every member, drain anchor stamped, phase Promoting], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-final-shift-held, from: Staging/Final, event: capacity.reached, guard: "the final step's staged capacity is Ready and the step carries a Pause or Analysis", to: Draining/Held, effects: [100% written, drain anchor stamped, phase Paused], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-final-force, from: Staging/Final, event: verb.promoteForce, variant: match, guard: "the forced promote lifts the final step's capacity wait and opens its gate", to: Draining, effects: [the split written on the pods that serve, drain anchor stamped, phase Promoting, the force stays live for the release], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-final-rollback, from: Staging/Final, event: verb.rollback, guard: "the request is true", to: RollingBack, effects: [RolledBackRevisionHash recorded, the revert evaluated in the same pass], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  - {id: T-final-rearm, from: Staging/Final, event: target.new, guard: "the run's target id for the unit changed", to: Staging, effects: [record reset to step 0, phase Pending], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  - {id: T-final-crash, from: Staging/Final, event: pod.canaryCrashed, guard: "a canary pod of the unit is crash-looping after it served", to: Failed, effects: [split returned to stable, Failed marker CapacityTimeout], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-final-timeout, from: Staging/Final, event: timer.readyTimeout, guard: "the capacity wait outlived the resolved ready timeout", to: Failed, effects: [Failed marker CapacityTimeout, phase Failed], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-final-repin-hold, from: Staging/Final, event: plan.repin, variant: raise, guard: "the clamped step's traffic exceeds the recorded weight", to: PreHold, effects: [PreStepHold set by the run layer], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/rolloutrun/rolloutrun.go}
  - {id: T-final-phase-failed, from: Staging/Final, event: record.legacy, variant: failedPhaseNoMarker, guard: "the primary's phase reads Failed", to: Failed, decided_in: pkg/rollout/canary_state.go}
  # --- Serving/Manual ----------------------------------------------------------
  - {id: T-servm-advance, from: Serving/Manual, event: verb.promote, variant: match, guard: "the promote names the canary revision and is not the value already applied; the next step is intermediate", to: Staging, effects: [step advanced, PromotedThrough recorded, phase Pending], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/promotion.go}
  - {id: T-servm-advance-final, from: Serving/Manual, event: verb.promote, variant: match, guard: "the promote names the canary revision and is not the value already applied; the next step is the last", to: Staging/Final, effects: [step advanced, PromotedThrough recorded, phase Pending], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/promotion.go}
  - {id: T-servm-rollback, from: Serving/Manual, event: verb.rollback, guard: "the request is true", to: RollingBack, effects: [RolledBackRevisionHash recorded, traffic moved onto serving stable capacity], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  - {id: T-servm-rearm, from: Serving/Manual, event: target.new, guard: "the run's target id for the unit changed", to: Staging, effects: [record reset to step 0, phase Pending], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  - {id: T-servm-crash, from: Serving/Manual, event: pod.canaryCrashed, guard: "a canary pod of the unit is crash-looping after it served", to: Failed, effects: [split returned to stable, Failed marker CapacityTimeout], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-servm-timeout, from: Serving/Manual, event: timer.readyTimeout, guard: "the split dipped and the capacity wait outlived the ready timeout", to: Failed, effects: [Failed marker CapacityTimeout, phase Failed], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-servm-repin-hold, from: Serving/Manual, event: plan.repin, variant: raise, guard: "the clamped step's traffic exceeds the recorded weight", to: PreHold, effects: [PreStepHold set by the run layer], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/rolloutrun/rolloutrun.go}
  - {id: T-servm-phase-failed, from: Serving/Manual, event: record.legacy, variant: failedPhaseNoMarker, guard: "the primary's phase reads Failed", to: Failed, decided_in: pkg/rollout/canary_state.go}
  # --- Serving/Timed -----------------------------------------------------------
  - {id: T-servt-advance, from: Serving/Timed, event: timer.pauseElapsed, variant: elapsed, guard: "the soak elapsed since the later of the split first serving and the newest canary pod restart; the next step is intermediate", to: Staging, effects: [step advanced, phase Pending], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/promotion.go}
  - {id: T-servt-advance-final, from: Serving/Timed, event: timer.pauseElapsed, variant: elapsed, guard: "the soak elapsed as above; the next step is the last", to: Staging/Final, effects: [step advanced, phase Pending], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/promotion.go}
  - {id: T-servt-rollback, from: Serving/Timed, event: verb.rollback, guard: "the request is true", to: RollingBack, effects: [RolledBackRevisionHash recorded], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  - {id: T-servt-rearm, from: Serving/Timed, event: target.new, guard: "the run's target id for the unit changed", to: Staging, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  - {id: T-servt-crash, from: Serving/Timed, event: pod.canaryCrashed, guard: "a canary pod of the unit is crash-looping after it served", to: Failed, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-servt-timeout, from: Serving/Timed, event: timer.readyTimeout, guard: "the split dipped and the capacity wait outlived the ready timeout", to: Failed, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-servt-repin-hold, from: Serving/Timed, event: plan.repin, variant: raise, guard: "the clamped step's traffic exceeds the recorded weight", to: PreHold, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/rolloutrun/rolloutrun.go}
  - {id: T-servt-phase-failed, from: Serving/Timed, event: record.legacy, variant: failedPhaseNoMarker, guard: "the primary's phase reads Failed", to: Failed, decided_in: pkg/rollout/canary_state.go}
  # --- Serving/Analysis --------------------------------------------------------
  - {id: T-serva-advance, from: Serving/Analysis, event: analysis.sample, variant: passBaked, guard: "a passing sample lands once the bake window has elapsed; the next step is intermediate", to: Staging, effects: [step advanced, analysis budget reset, phase Pending], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/promotion.go}
  - {id: T-serva-advance-final, from: Serving/Analysis, event: analysis.sample, variant: passBaked, guard: "a passing sample lands once the bake window has elapsed; the next step is the last", to: Staging/Final, effects: [step advanced, analysis budget reset, phase Pending], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/promotion.go}
  - {id: T-serva-gate-rollback, from: Serving/Analysis, event: analysis.sample, variant: failAtLimit, guard: "the failing checks reach the failure limit and every member's stable revision runs a live Instance", to: RollingBack, effects: [RolledBackRevisionHash recorded, the revert evaluated in the same pass], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/rollback_target.go}
  - {id: T-serva-gate-park, from: Serving/Analysis, event: analysis.sample, variant: failAtLimitStableEmpty, guard: "the failing checks reach the failure limit while a member's stable revision runs no live Instance under a held floor", to: Failed/StableMissing, effects: [split rewritten through the serving rule, Failed marker StableRevisionMissing, no revert signalled], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/rollback_target.go}
  - {id: T-serva-stall, from: Serving/Analysis, event: analysis.sample, variant: stalled, guard: "inconclusive samples outlived the stall timeout under the default policy", to: Failed, effects: [Failed marker AnalysisStalled, phase Failed], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/promotion.go}
  - {id: T-serva-rollback, from: Serving/Analysis, event: verb.rollback, guard: "the request is true", to: RollingBack, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  - {id: T-serva-rearm, from: Serving/Analysis, event: target.new, guard: "the run's target id for the unit changed", to: Staging, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  - {id: T-serva-crash, from: Serving/Analysis, event: pod.canaryCrashed, guard: "a canary pod of the unit is crash-looping after it served", to: Failed, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-serva-timeout, from: Serving/Analysis, event: timer.readyTimeout, guard: "the split dipped and the capacity wait outlived the ready timeout", to: Failed, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-serva-repin-hold, from: Serving/Analysis, event: plan.repin, variant: raise, guard: "the clamped step's traffic exceeds the recorded weight", to: PreHold, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/rolloutrun/rolloutrun.go}
  - {id: T-serva-phase-failed, from: Serving/Analysis, event: record.legacy, variant: failedPhaseNoMarker, guard: "the primary's phase reads Failed", to: Failed, decided_in: pkg/rollout/canary_state.go}
  # --- PreHold -------------------------------------------------------------------
  - {id: T-prehold-release, from: PreHold, event: verb.promote, variant: match, guard: "a promote or forced promote names the canary revision; the clamped step's gate is a bare Pause (a timed or analysis gate lands on Serving/Timed or Serving/Analysis, an ungated step advances)", to: Serving/Manual, effects: [PreStepHold cleared, PromotedThrough recorded, the step's split written, phase Paused], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-prehold-release-final, from: PreHold, event: verb.promote, variant: match, guard: "a promote or forced promote names the canary revision and the clamped step is the final one", to: Draining, effects: [PreStepHold cleared, PromotedThrough recorded, 100% written, drain anchor stamped, phase Promoting], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-prehold-rollback, from: PreHold, event: verb.rollback, guard: "the request is true", to: RollingBack, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  - {id: T-prehold-rearm, from: PreHold, event: target.new, guard: "the run's target id for the unit changed", to: Staging, effects: [record reset to step 0 with PreStepHold cleared], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  - {id: T-prehold-crash, from: PreHold, event: pod.canaryCrashed, guard: "a canary pod of the unit is crash-looping after it served", to: Failed, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-prehold-timeout, from: PreHold, event: timer.readyTimeout, guard: "the held split dipped and the capacity wait outlived the ready timeout", to: Failed, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-prehold-phase-failed, from: PreHold, event: record.legacy, variant: failedPhaseNoMarker, guard: "the primary's phase reads Failed", to: Failed, decided_in: pkg/rollout/canary_state.go}
  # --- Draining ------------------------------------------------------------------
  - {id: T-drain-release, from: Draining, event: timer.drainElapsed, guard: "the scale-down delay elapsed since the 100% shift and the step's capacity is Ready", to: Done/Rolling, effects: [promote record taken, done sentinel set, cutover traffic written, partition 0 projected], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-drain-dip, from: Draining, event: capacity.dropped, guard: "a Ready canary pod is lost inside the window", to: Draining/ShortInWindow, effects: [capacity wait clocked, split follows the pods that serve], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-drain-rollback, from: Draining, event: verb.rollback, guard: "the request is true", to: RollingBack, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  - {id: T-drain-rearm, from: Draining, event: target.new, guard: "the run's target id for the unit changed", to: Staging, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  - {id: T-drain-crash, from: Draining, event: pod.canaryCrashed, guard: "a canary pod of the unit is crash-looping after it served", to: Failed, effects: [traffic returned to the held stable instance], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-drain-phase-failed, from: Draining, event: record.legacy, variant: failedPhaseNoMarker, guard: "the primary's phase reads Failed", to: Failed, decided_in: pkg/rollout/canary_state.go}
  # --- Draining/Held -------------------------------------------------------------
  - {id: T-drainheld-open, from: Draining/Held, event: verb.promote, variant: match, guard: "a promote or forced promote names the canary revision; the drain continues, and the release follows in the same pass when the window has already elapsed", to: Draining, effects: [phase Promoting], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-drainheld-elapsed, from: Draining/Held, event: timer.pauseElapsed, variant: elapsed, guard: "the final step's timed Pause elapsed since the 100% shift", to: Draining, effects: [phase Promoting], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/promotion.go}
  - {id: T-drainheld-pass, from: Draining/Held, event: analysis.sample, variant: passBaked, guard: "a passing sample lands once the bake window has elapsed", to: Draining, effects: [phase Promoting], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/promotion.go}
  - {id: T-drainheld-gate-rollback, from: Draining/Held, event: analysis.sample, variant: failAtLimit, guard: "the failing checks reach the failure limit at 100% traffic and every member's stable revision runs a live Instance", to: RollingBack, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/rollback_target.go}
  - {id: T-drainheld-gate-park, from: Draining/Held, event: analysis.sample, variant: failAtLimitStableEmpty, guard: "the failing checks reach the failure limit while a member's stable revision runs no live Instance under the held floor", to: Failed/StableMissing, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/rollback_target.go}
  - {id: T-drainheld-stall, from: Draining/Held, event: analysis.sample, variant: stalled, guard: "inconclusive samples outlived the stall timeout under the default policy", to: Failed, effects: [Failed marker AnalysisStalled], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/promotion.go}
  - {id: T-drainheld-rollback, from: Draining/Held, event: verb.rollback, guard: "the request is true", to: RollingBack, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  - {id: T-drainheld-rearm, from: Draining/Held, event: target.new, guard: "the run's target id for the unit changed", to: Staging, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  - {id: T-drainheld-crash, from: Draining/Held, event: pod.canaryCrashed, guard: "a canary pod of the unit is crash-looping after it served", to: Failed, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-drainheld-phase-failed, from: Draining/Held, event: record.legacy, variant: failedPhaseNoMarker, guard: "the primary's phase reads Failed", to: Failed, decided_in: pkg/rollout/canary_state.go}
  # --- Draining/ShortInWindow ---------------------------------------------------
  - {id: T-drainshort-back, from: Draining/ShortInWindow, event: capacity.reached, guard: "every staged canary instance serves again inside the window", to: Draining, effects: [capacity wait cleared, split back on the canary revision], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-drainshort-elapsed, from: Draining/ShortInWindow, event: timer.drainElapsed, guard: "the window elapsed while the capacity is still short", to: Draining/ShortElapsed, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-drainshort-timeout, from: Draining/ShortInWindow, event: timer.readyTimeout, guard: "the capacity wait outlived the ready timeout", to: Failed, effects: [traffic returned to the held stable instance, Failed marker CapacityTimeout], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-drainshort-rollback, from: Draining/ShortInWindow, event: verb.rollback, guard: "the request is true", to: RollingBack, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  - {id: T-drainshort-rearm, from: Draining/ShortInWindow, event: target.new, guard: "the run's target id for the unit changed", to: Staging, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  - {id: T-drainshort-crash, from: Draining/ShortInWindow, event: pod.canaryCrashed, guard: "a canary pod of the unit is crash-looping after it served", to: Failed, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-drainshort-phase-failed, from: Draining/ShortInWindow, event: record.legacy, variant: failedPhaseNoMarker, guard: "the primary's phase reads Failed", to: Failed, decided_in: pkg/rollout/canary_state.go}
  # --- Draining/ShortElapsed -----------------------------------------------------
  - {id: T-drainelapsed-release, from: Draining/ShortElapsed, event: capacity.reached, guard: "every staged canary instance serves again; the release is read on a count taken with the capacity back", to: Done/Rolling, effects: [promote record taken, done sentinel set, cutover traffic written], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-drainelapsed-timeout, from: Draining/ShortElapsed, event: timer.readyTimeout, guard: "the capacity wait outlived the ready timeout", to: Failed, effects: [traffic returned to the held stable instance, Failed marker CapacityTimeout], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-drainelapsed-rollback, from: Draining/ShortElapsed, event: verb.rollback, guard: "the request is true", to: RollingBack, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  - {id: T-drainelapsed-rearm, from: Draining/ShortElapsed, event: target.new, guard: "the run's target id for the unit changed", to: Staging, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  - {id: T-drainelapsed-crash, from: Draining/ShortElapsed, event: pod.canaryCrashed, guard: "a canary pod of the unit is crash-looping after it served", to: Failed, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-drainelapsed-phase-failed, from: Draining/ShortElapsed, event: record.legacy, variant: failedPhaseNoMarker, guard: "the primary's phase reads Failed", to: Failed, decided_in: pkg/rollout/canary_state.go}
  # --- Done/Rolling and Done -------------------------------------------------------
  - {id: T-donerolling-complete, from: Done/Rolling, event: pod.lastStableRolled, guard: "every member's target has its full capacity Ready and no ready pod serves another revision", to: Done, effects: [promoted revisions recorded on every member, the stable identity dropped, phase Stable, the one Complete pass], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-donerolling-rearm, from: Done/Rolling, event: target.new, guard: "the run's target id for the unit changed", to: Staging, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  - {id: T-donerolling-phase-failed, from: Done/Rolling, event: record.legacy, variant: failedPhaseNoMarker, guard: "the primary's phase reads Failed; the marker outranks the sentinel", to: Failed, decided_in: pkg/rollout/canary_state.go}
  - {id: T-done-rearm, from: Done, event: target.new, guard: "the run's target id for the unit changed", to: Staging, decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  - {id: T-done-phase-failed, from: Done, event: record.legacy, variant: failedPhaseNoMarker, guard: "the primary's phase reads Failed; the marker outranks the sentinel", to: Failed, decided_in: pkg/rollout/canary_state.go}
  # --- RollingBack and RolledBack --------------------------------------------------
  - {id: T-rb-complete, from: RollingBack, event: pod.rejectedGone, variant: unit, guard: "no pod of any member with a stable identity runs a revision other than its stable one, ready or not", to: RolledBack, effects: [rolled-back revisions recorded on every member, phase RolledBack], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/reconciler.go}
  - {id: T-rb-rearm, from: RollingBack, event: target.new, guard: "the run retargeted the unit toward a target that is neither the rejected nor the stable revision", to: Staging, effects: [the rollback request removed durably before the reset, record reset to step 0], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  - {id: T-rb-park-missing, from: RollingBack, event: stable.crMissing, guard: "no retained ControllerRevision the replica controls carries a member's stable revision", to: Failed/StableMissing, effects: [Failed marker StableRevisionMissing, the request handed back for removal], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/dispatch.go}
  - {id: T-rbd-rearm, from: RolledBack, event: target.new, guard: "the run retargeted the unit toward a target that is neither the rejected nor the stable revision", to: Staging, effects: [the rollback request removed durably before the reset, record reset to step 0], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  - {id: T-rbd-resume, from: RolledBack, event: verb.resume, variant: own, guard: "the value names the parked canary revision; no pinned run is needed, the cleared rejection lets the run layer open one", to: Staging, effects: [the rollback request removed durably, record reset to step 0 toward the parked revision, phase Pending], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/resume.go}
  # --- Failed and Failed/StableMissing ---------------------------------------------
  - {id: T-failed-rearm, from: Failed, event: target.new, guard: "the run's target id changed toward a target that is neither the current canary nor the stable revision", to: Staging, effects: [record reset to step 0, the marker cleared, phase Pending], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  - {id: T-failed-resume, from: Failed, event: verb.resume, variant: own, guard: "the value names the parked canary revision and a run is pinned", to: Staging, effects: [record reset to step 0 toward the parked revision, phase Pending], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/resume.go}
  - {id: T-failed-rollback, from: Failed, event: verb.rollback, guard: "the request is true and the step is below the ladder's end", to: RollingBack, effects: [the marker cleared, RolledBackRevisionHash recorded, the revert evaluated in the same pass], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  - {id: T-fsm-rearm, from: Failed/StableMissing, event: target.new, guard: "the run's target id changed toward a target that is neither the rejected nor the stable revision", to: Staging, effects: [record reset to step 0, the marker cleared, phase Pending], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/holds.go}
  - {id: T-fsm-resume, from: Failed/StableMissing, event: verb.resume, variant: own, guard: "the value names the parked canary revision; the hold is read as terminal", to: Staging, effects: [record reset to step 0 toward the parked revision, phase Pending], decided_in: pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/resume.go}
