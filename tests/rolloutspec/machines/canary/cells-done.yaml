# Done/Rolling and Done: the done sentinel. The sentinel releases the held
# floor (partition 0); the unit stays Promoting while the last stable
# instance rolls and reads Stable once every member serves on its target
# alone, recording the promoted revisions and dropping the stable identity.
cells:
  - {state: Done/Rolling, event: verb.pause, outcome: ignore, note: "a unit at its sentinel reads inactive under the pause; the released floor keeps rolling underneath", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/pause"]}, status: decided}
  - {state: Done/Rolling, event: verb.unpause, outcome: ignore, note: "the cutover is re-read as it stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/unpause"]}, status: current}
  - {state: Done/Rolling, event: verb.promote, variants: [match], outcome: ignore, note: "a done canary evaluates no gate; the verb is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/promote"]}, status: current}
  - {state: Done/Rolling, event: verb.promote, variants: [stale], outcome: ignore, note: "another value is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/promote[stale]"]}, status: current}
  - {state: Done/Rolling, event: verb.promote, variants: [applied], outcome: DECIDE, note: "today: a lingering applied promote at the sentinel is handed back for removal again and the record clears only once no key carries the value. Question: should the done sentinel clear PromotedThrough unconditionally, since a done canary evaluates no gate the record could re-open?", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/promote[applied]"]}, status: current}
  - {state: Done/Rolling, event: verb.promoteForce, variants: [match], outcome: ignore, note: "a done canary evaluates no gate; the force is left in place, live and inert", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/promoteForce"]}, status: decided}
  - {state: Done/Rolling, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "another value is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/promoteForce[stale]"]}, status: current}
  - {state: Done/Rolling, event: verb.promoteForce, variants: [applied], outcome: DECIDE, note: "today: as verb.promote[applied]. Question: as verb.promote[applied].", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/promoteForce[applied]"]}, status: current}
  - {state: Done/Rolling, event: verb.rollback, variants: [stableServes], outcome: reject, note: "a finished ladder has no canary to roll back: the request is removed with a CanaryRollbackIgnored warning while the released instance keeps rolling", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/rollback"]}, status: decided}
  - {state: Done/Rolling, event: verb.resume, variants: [own], outcome: reject, note: "nothing is parked: consumed silently", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/resume"]}, status: current}
  - {state: Done/Rolling, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary: removed with a warning", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/resume[stale]"]}, status: current}
  - {state: Done/Rolling, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "left for the unit that owns it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/resume[otherUnit]"]}, status: current}
  - {state: Done/Rolling, event: plan.repin, variants: [pastDone], outcome: ignore, note: "done stays done: the sentinel is re-set at the new ladder's length and the cutover continues", placement: unit, status: current}
  - {state: Done/Rolling, event: plan.drift, outcome: ignore, note: "the pinned plan executes", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/planDrift"]}, status: current}
  - {state: Done/Rolling, event: plan.unresolved, outcome: DECIDE, note: "today: the unit is not dispatched: the released instance rolls under no partition at all, and nobody records the promoted revisions or projects Stable. Question: as Staging/plan.unresolved.", placement: unit, status: current}
  - {state: Done/Rolling, event: run.lost, outcome: DECIDE, note: "today: the done sentinel precedes the run-lost hold, so the cutover is finished and recorded with no run pinned, and the run layer closes nothing for it. Question: should a finished cutover complete without a run (today) or hold like every other live state until the run layer adopts it?", invariants: [exec.order.fixed, unpinned.never.steps], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/runLost"]}, status: current}
  - {state: Done/Rolling, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "the record is reset to step 0 toward the new target; the pre-canary stable identity is kept, so the superseded canary is not the rollback target of the new ladder", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/newTarget"]}, status: decided}
  - {state: Done/Rolling, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "the bind resets the record toward the new run's target", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/newTarget[runOpen]"]}, status: current}
  - {state: Done/Rolling, event: capacity.dropped, outcome: ignore, note: "the cutover is not complete while the target is short of its full capacity; the unit stays Promoting and the workload repairs", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/capacityDropped"]}, status: current}
  - {state: Done/Rolling, event: spec.replicas, outcome: ignore, note: "partition 0 is projected regardless; the cutover waits for the new full capacity", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/replicasUp"]}, status: current}
  - {state: Done/Rolling, event: pod.canaryCrashed, outcome: ignore, note: "a finished cutover is not moved: a canary pod that dies after the release is the workload's repair", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/canaryCrashed"]}, status: decided}
  - {state: Done/Rolling, event: pod.canaryRestarted, outcome: ignore, note: "no soak runs at the sentinel", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/canaryRestarted"]}, status: current}
  - {state: Done/Rolling, event: pod.canaryDeleted, outcome: ignore, note: "a pod on its way out leaves the target short; the cutover waits", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/canaryPodDeleted"]}, status: current}
  - {state: Done/Rolling, event: pod.replacementReady, outcome: ignore, note: "the replacement serving is not enough while the stable instance still serves; the pass that finds nothing on the stable revision completes", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/replacementReady"]}, status: decided}
  - {state: Done/Rolling, event: pod.lastStableRolled, outcome: transition, to: Done, note: "every member's target owns its traffic: the promoted revisions are recorded with the pre-canary stable as the superseded one, the stable identity is dropped and the unit reads Stable; the one Complete pass", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/lastInstanceRolled"]}, status: decided}
  - {state: Done/Rolling, event: record.legacy, variants: [noTargetID], outcome: DECIDE, note: "today: adopted in place. Question: as Staging/record.legacy[noTargetID].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/record[noTargetID]"]}, status: current}
  - {state: Done/Rolling, event: record.legacy, variants: [stableEqualsCanary], outcome: DECIDE, note: "today: repaired from the replica's distinct current revision. Question: as Staging/record.legacy[stableEqualsCanary].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/record[stableEqualsCanary]"]}, status: current}
  - {state: Done/Rolling, event: record.legacy, variants: [noStable], outcome: ignore, note: "a unit with no pre-canary identity at the sentinel has nothing left to roll and reads Stable at once", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/record[noStable]"]}, status: current}
  - {state: Done/Rolling, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "clamped to 0; a sentinel cannot be negative", placement: unit, status: current}
  - {state: Done/Rolling, event: record.legacy, variants: [failedPhaseNoMarker], outcome: transition, to: Failed, note: "the Failed reading outranks the sentinel, so a phase-only Failed parks a finished cutover", invariants: [phase.is.input], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/record[failedPhaseNoMarker]"]}, status: current}
  - {state: Done/Rolling, event: pass.resync, outcome: ignore, note: "the unit stays Promoting at partition 0 and comes back at the step cadence; the roll it waits on moves no annotation and no step", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/resync"]}, status: decided}
  - {state: Done/Rolling, event: pass.staleRecord, outcome: defer, note: "the flush keeps the live record and the pass requeues", placement: sim, status: current}
  # --- Done --------------------------------------------------------------------------
  - {state: Done, event: verb.pause, outcome: ignore, note: "a finished unit reads inactive under the pause", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/pause"]}, status: decided}
  - {state: Done, event: verb.unpause, outcome: ignore, note: "the unit re-reads Stable", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/unpause"]}, status: current}
  - {state: Done, event: verb.promote, variants: [match], outcome: ignore, note: "a done canary evaluates no gate; the verb is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/promote"]}, status: decided}
  - {state: Done, event: verb.promote, variants: [stale], outcome: ignore, note: "another value is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/promote[stale]"]}, status: current}
  - {state: Done, event: verb.promote, variants: [applied], outcome: DECIDE, note: "today: a lingering applied promote is handed back for removal again and the record clears only once no key carries the value. Question: as Done/Rolling/verb.promote[applied].", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/promote[applied]"]}, status: current}
  - {state: Done, event: verb.promoteForce, variants: [match], outcome: ignore, note: "a done canary evaluates no gate; the force is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/promoteForce"]}, status: decided}
  - {state: Done, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "another value is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/promoteForce[stale]"]}, status: current}
  - {state: Done, event: verb.promoteForce, variants: [applied], outcome: DECIDE, note: "today: as verb.promote[applied]. Question: as Done/Rolling/verb.promote[applied].", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/promoteForce[applied]"]}, status: current}
  - {state: Done, event: verb.rollback, variants: [stableServes], outcome: reject, note: "a finished ladder has no canary to roll back: the request is removed with a warning; the stable identity is gone, so the superseded revision is not a rollback target", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/rollback"]}, status: decided}
  - {state: Done, event: verb.resume, variants: [own], outcome: reject, note: "nothing is parked: consumed silently", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/resume"]}, status: decided}
  - {state: Done, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary: removed with a warning", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/resume[stale]"]}, status: decided}
  - {state: Done, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "left for the unit that owns it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/resume[otherUnit]"]}, status: current}
  - {state: Done, event: plan.repin, variants: [pastDone], outcome: ignore, note: "done stays done: a canary that finished under the old ladder is not resurrected by a repin", placement: unit, status: current}
  - {state: Done, event: plan.drift, outcome: ignore, note: "the pinned plan executes until the run closes", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/planDrift"]}, status: current}
  - {state: Done, event: plan.unresolved, outcome: ignore, note: "the unit is not dispatched; a finished unit has nothing left to drive", placement: unit, status: current}
  - {state: Done, event: run.lost, outcome: DECIDE, note: "today: the done sentinel precedes the run-lost hold, so a finished unit with no run re-runs the cutover check and re-projects Stable on every pass. Question: as Done/Rolling/run.lost.", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/runLost"]}, status: current}
  - {state: Done, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "the record is reset to step 0 toward the new target; with the stable identity dropped at completion, the new ladder seeds its stable from the run pin or the replica's current revision", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/newTarget"]}, status: decided}
  - {state: Done, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "the bind resets the record toward the new run's target with its pinned stable", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/newTarget[runOpen]"]}, status: current}
  - {state: Done, event: capacity.dropped, outcome: ignore, note: "a canary pod lost after the cutover completed is the workload's repair, not a canary state", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/capacityDropped"]}, status: decided}
  - {state: Done, event: spec.replicas, outcome: ignore, note: "partition 0 is projected; the workload scales", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/replicasUp"]}, status: current}
  - {state: Done, event: pod.canaryCrashed, outcome: ignore, note: "a finished cutover is not moved by a crash", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/canaryCrashed"]}, status: decided}
  - {state: Done, event: pod.canaryRestarted, outcome: ignore, note: "no soak runs after completion", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/canaryRestarted"]}, status: current}
  - {state: Done, event: pod.canaryDeleted, outcome: ignore, note: "the workload's repair", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/canaryPodDeleted"]}, status: current}
  - {state: Done, event: record.legacy, variants: [noTargetID], outcome: DECIDE, note: "today: adopted in place. Question: as Staging/record.legacy[noTargetID].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/record[noTargetID]"]}, status: current}
  - {state: Done, event: record.legacy, variants: [stableEqualsCanary], outcome: DECIDE, note: "today: repaired from the replica's distinct current revision. Question: as Staging/record.legacy[stableEqualsCanary].", placement: unit, status: current}
  - {state: Done, event: record.legacy, variants: [noStable], outcome: ignore, note: "the stable identity is dropped at completion by design; nothing is backfilled at the sentinel", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/record[noStable]"]}, status: current}
  - {state: Done, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "clamped to 0", placement: unit, status: current}
  - {state: Done, event: record.legacy, variants: [failedPhaseNoMarker], outcome: transition, to: Failed, note: "the Failed reading outranks the sentinel", invariants: [phase.is.input], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/record[failedPhaseNoMarker]"]}, status: current}
  - {state: Done, event: pass.resync, outcome: ignore, note: "the unit reads Stable and is inactive", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/resync"]}, status: decided}
  - {state: Done, event: pass.staleRecord, outcome: defer, note: "the flush keeps the live record and the pass requeues", placement: sim, status: current}
