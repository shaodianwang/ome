# Done/Rolling and Done: the done sentinel. The sentinel releases the held
# floor (partition 0); the unit stays Promoting while the last stable
# instance rolls and reads Stable once every member serves on its target
# alone, recording the promoted revisions and dropping the stable identity.
cells:
  - {state: Done/Rolling, event: verb.pause, outcome: ignore, note: "a unit at its sentinel reads inactive under the pause; the released floor keeps rolling underneath", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/pause"]}, status: decided}
  - {state: Done/Rolling, event: verb.unpause, outcome: ignore, note: "the cutover is re-read as it stands", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/unpause"]}, status: decided}
  - {state: Done/Rolling, event: verb.promote, variants: [match], outcome: ignore, note: "a done canary evaluates no gate; the verb is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/promote"]}, status: decided}
  - {state: Done/Rolling, event: verb.promote, variants: [stale], outcome: ignore, note: "a value naming another revision is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/promote[stale]"]}, status: decided}
  - {state: Done/Rolling, event: verb.promote, variants: [applied], outcome: ignore, note: "the sentinel's sync hands a lingering applied copy back for removal again and clears PromotedThrough only once no key carries the value, so a copy a lagging cache re-shows can never re-apply", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/promote[applied]"]}, status: decided}
  - {state: Done/Rolling, event: verb.promoteForce, variants: [match], outcome: ignore, note: "a done canary evaluates no gate; the force is left in place, live and inert", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/promoteForce"]}, status: decided}
  - {state: Done/Rolling, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "a value naming another revision is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/promoteForce[stale]"]}, status: decided}
  - {state: Done/Rolling, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "the applied copy is handed back for removal again and the record clears once no key carries the value, as for the promote", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/promoteForce[applied]"]}, status: decided}
  - {state: Done/Rolling, event: verb.rollback, variants: [stableServes], outcome: reject, note: "a finished ladder has no canary to roll back: the request is removed with a CanaryRollbackIgnored warning while the released instance keeps rolling", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/rollback"]}, status: decided}
  - {state: Done/Rolling, event: verb.resume, variants: [own], outcome: reject, note: "nothing is parked: consumed silently", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/resume"]}, status: decided}
  - {state: Done/Rolling, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary: removed with a warning", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/resume[stale]"]}, status: decided}
  - {state: Done/Rolling, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "left for the unit that owns it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/resume[otherUnit]"]}, status: decided}
  - {state: Done/Rolling, event: plan.repin, variants: [pastDone], outcome: ignore, note: "done stays done: the run layer re-sets the sentinel at the new ladder's length and the cutover continues", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/repin[pastDone]"]}, status: decided}
  - {state: Done/Rolling, event: plan.drift, outcome: ignore, note: "the pinned plan executes", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/planDrift"]}, status: decided}
  - {state: Done/Rolling, event: plan.unresolved, outcome: ignore, note: "with no pin and no body the run layer parks the plan with a warning and the unit is not dispatched: the projection's full hold re-holds the released Instance where it stands, so the roll stops and nobody records the promoted revisions or projects Stable until a body resolves", placement: unit, coverage: {replay: [done-rolling-stale-record-and-lost-policy]}, status: decided}
  - {state: Done/Rolling, event: run.lost, outcome: ignore, note: "the done sentinel precedes the run-lost hold, so the cutover finishes and is recorded with no run pinned: the traffic already moved, and holding would strand the released floor", invariants: [exec.order.fixed, unpinned.never.steps], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/runLost"]}, status: decided}
  - {state: Done/Rolling, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "the record is reset to step 0 toward the new target; the pre-canary stable identity is kept, so the superseded canary is not the rollback target of the new ladder", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/newTarget"]}, status: decided}
  - {state: Done/Rolling, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "the bind resets the record toward the new run's target", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/newTarget[runOpen]"]}, status: decided}
  - {state: Done/Rolling, event: capacity.dropped, outcome: ignore, note: "the cutover is not complete while the target is short of its full capacity; the unit stays Promoting and the workload repairs", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/capacityDropped"]}, status: decided}
  - {state: Done/Rolling, event: spec.replicas, outcome: ignore, note: "partition 0 is projected regardless; the cutover waits for the new full capacity", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/replicasUp"]}, status: decided}
  - {state: Done/Rolling, event: pod.canaryCrashed, outcome: ignore, note: "a finished cutover is not moved: a canary pod that dies after the release is the workload's repair", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/canaryCrashed"]}, status: decided}
  - {state: Done/Rolling, event: pod.canaryRestarted, outcome: ignore, note: "no soak runs at the sentinel", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/canaryRestarted"]}, status: decided}
  - {state: Done/Rolling, event: pod.canaryDeleted, outcome: ignore, note: "a pod on its way out leaves the target short; the cutover waits", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/canaryPodDeleted"]}, status: decided}
  - {state: Done/Rolling, event: pod.replacementReady, outcome: ignore, note: "the replacement serving is not enough while the stable instance still serves; the pass that finds nothing on the stable revision completes", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/replacementReady"]}, status: decided}
  - {state: Done/Rolling, event: pod.lastStableRolled, outcome: transition, to: Done, note: "every member's target owns its traffic: the promoted revisions are recorded with the pre-canary stable as the superseded one, the stable identity is dropped and the unit reads Stable; the one Complete pass", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/lastInstanceRolled"]}, status: decided}
  - {state: Done/Rolling, event: record.legacy, variants: [noTargetID], outcome: ignore, note: "a record with no target id under a pinned run adopts the run's id in place; the cutover continues", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/record[noTargetID]"]}, status: decided}
  - {state: Done/Rolling, event: record.legacy, variants: [stableEqualsCanary], outcome: ignore, note: "a pair whose stable equals its canary hash is repaired from the replica's distinct current revision when the pass supplies one; the cutover continues toward that revision as the superseded one", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/record[stableEqualsCanary]"]}, status: decided}
  - {state: Done/Rolling, event: record.legacy, variants: [noStable], outcome: ignore, note: "a unit with no pre-canary identity at the sentinel has nothing left to roll and reads Stable at once", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/record[noStable]"]}, status: decided}
  - {state: Done/Rolling, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "a negative step is read back from the record: the recorded 100% places it at the final step, whose elapsed drain restores the sentinel in the same pass, so the cutover goes on rolling at partition 0", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/record[negativeStep]"]}, status: decided}
  - {state: Done/Rolling, event: record.legacy, variants: [failedPhaseNoMarker], outcome: transition, to: Failed, note: "the Failed reading outranks the sentinel, so a phase-only Failed parks a finished cutover; the hold re-projects the phase", invariants: [phase.is.input], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/record[failedPhaseNoMarker]"]}, status: decided}
  - {state: Done/Rolling, event: pass.resync, outcome: ignore, note: "the unit stays Promoting at partition 0 and comes back at the step cadence; the roll it waits on moves no annotation and no step", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done[rolling]/resync"]}, status: decided}
  - {state: Done/Rolling, event: pass.staleRecord, outcome: defer, note: "the flush finds the live record past the pass's base, keeps the live record, phase and traffic and marks the pass stale, so its verbs are not consumed and it requeues", placement: sim, coverage: {replay: [done-rolling-stale-record-and-lost-policy]}, status: decided}
  # --- Done --------------------------------------------------------------------------
  - {state: Done, event: verb.pause, outcome: ignore, note: "a finished unit reads inactive under the pause", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/pause"]}, status: decided}
  - {state: Done, event: verb.unpause, outcome: ignore, note: "the unit re-reads Stable", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/unpause"]}, status: decided}
  - {state: Done, event: verb.promote, variants: [match], outcome: ignore, note: "a done canary evaluates no gate; the verb is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/promote"]}, status: decided}
  - {state: Done, event: verb.promote, variants: [stale], outcome: ignore, note: "a value naming another revision is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/promote[stale]"]}, status: decided}
  - {state: Done, event: verb.promote, variants: [applied], outcome: ignore, note: "the sentinel's sync hands a lingering applied copy back for removal again and clears PromotedThrough only once no key carries the value, so a copy a lagging cache re-shows can never re-apply", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/promote[applied]"]}, status: decided}
  - {state: Done, event: verb.promoteForce, variants: [match], outcome: ignore, note: "a done canary evaluates no gate; the force is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/promoteForce"]}, status: decided}
  - {state: Done, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "a value naming another revision is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/promoteForce[stale]"]}, status: decided}
  - {state: Done, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "the applied copy is handed back for removal again and the record clears once no key carries the value, as for the promote", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/promoteForce[applied]"]}, status: decided}
  - {state: Done, event: verb.rollback, variants: [stableServes], outcome: reject, note: "a finished ladder has no canary to roll back: the request is removed with a warning; the stable identity is gone, so the superseded revision is not a rollback target", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/rollback"]}, status: decided}
  - {state: Done, event: verb.resume, variants: [own], outcome: reject, note: "nothing is parked: consumed silently", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/resume"]}, status: decided}
  - {state: Done, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary: removed with a warning", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/resume[stale]"]}, status: decided}
  - {state: Done, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "left for the unit that owns it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/resume[otherUnit]"]}, status: decided}
  - {state: Done, event: plan.repin, variants: [pastDone], outcome: ignore, note: "done stays done: a canary that finished under the old ladder is re-set at the new ladder's length, not resurrected", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/repin[pastDone]"]}, status: decided}
  - {state: Done, event: plan.drift, outcome: ignore, note: "the pinned plan executes until the run closes", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/planDrift"]}, status: decided}
  - {state: Done, event: plan.unresolved, outcome: ignore, note: "with no pin and no body the run layer parks the plan with a warning and the unit is not dispatched; the projection's full hold changes nothing for a unit already on its target, and a finished unit has nothing left to drive", placement: unit, coverage: {replay: [done-stale-record-and-lost-policy]}, status: decided}
  - {state: Done, event: run.lost, outcome: ignore, note: "the done sentinel precedes the run-lost hold, so a finished unit with no run re-runs the cutover check and re-projects Stable on every pass, inactive and without a requeue of its own", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/runLost"]}, status: decided}
  - {state: Done, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "the record is reset to step 0 toward the new target; with the stable identity dropped at completion, the new ladder seeds its stable from the run pin or the replica's current revision", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/newTarget"]}, status: decided}
  - {state: Done, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "the bind resets the record toward the new run's target with its pinned stable", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/newTarget[runOpen]"]}, status: decided}
  - {state: Done, event: capacity.dropped, outcome: ignore, note: "a canary pod lost after the cutover completed is the workload's repair, not a canary state", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/capacityDropped"]}, status: decided}
  - {state: Done, event: spec.replicas, outcome: ignore, note: "partition 0 is projected; the workload scales on the target revision", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/replicasUp"]}, status: decided}
  - {state: Done, event: pod.canaryCrashed, outcome: ignore, note: "a finished cutover is not moved by a crash", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/canaryCrashed"]}, status: decided}
  - {state: Done, event: pod.canaryRestarted, outcome: ignore, note: "no soak runs after completion", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/canaryRestarted"]}, status: decided}
  - {state: Done, event: pod.canaryDeleted, outcome: ignore, note: "the workload's repair", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/canaryPodDeleted"]}, status: decided}
  - {state: Done, event: record.legacy, variants: [noTargetID], outcome: ignore, note: "a record with no target id under a pinned run adopts the run's id in place; the unit stays Stable", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/record[noTargetID]"]}, status: decided}
  - {state: Done, event: record.legacy, variants: [stableEqualsCanary], outcome: ignore, note: "a pair whose stable equals its canary hash is repaired from the replica's distinct current revision when the pass supplies one; a unit that already read Stable drops the identity again, with no second completion edge and no re-recorded promotion", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/record[stableEqualsCanary]"], kind: [canary_status_rewrite]}, status: decided}
  - {state: Done, event: record.legacy, variants: [noStable], outcome: ignore, note: "the stable identity is dropped at completion by design; nothing is backfilled at the sentinel", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/record[noStable]"]}, status: decided}
  - {state: Done, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "a negative step is read back from the record: a unit that already read Stable is placed at the sentinel again, so nothing is re-seeded and no step runs", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/record[negativeStep]"]}, status: decided}
  - {state: Done, event: record.legacy, variants: [failedPhaseNoMarker], outcome: transition, to: Failed, note: "the Failed reading outranks the sentinel; the hold re-projects the phase", invariants: [phase.is.input], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/record[failedPhaseNoMarker]"]}, status: decided}
  - {state: Done, event: pass.resync, outcome: ignore, note: "the unit reads Stable and is inactive", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Done/resync"]}, status: decided}
  - {state: Done, event: pass.staleRecord, outcome: defer, note: "the flush finds the live record past the pass's base, keeps the live record, phase and traffic and marks the pass stale, so its verbs are not consumed and it requeues; a stale pass that re-decides the cutover re-emits its event", placement: sim, coverage: {replay: [done-stale-record-and-lost-policy]}, status: decided}
