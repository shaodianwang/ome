# Serving/Timed: an intermediate step's split serves under a timed Pause.
# The soak is measured from the later of the split first serving and the
# newest canary pod restart; a promote is the operator's decision on the
# soak. The grid pins this fixture for promote, force, run loss, crash and
# the soak itself; the other rows run the same code as Serving/Manual but
# are not pinned on the timed fixture, which the DECIDE cells say.
cells:
  - {state: Serving/Timed, event: verb.pause, outcome: DECIDE, note: "today: the pause observes only and leaves StepEnteredTime, so the soak keeps counting under the pause; a pause longer than the soak advances the step on the first pass after it clears. Question: should a pause stop the soak clock (re-anchor on unpause) or keep counting as today?", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/pause"]}, status: current}
  - {state: Serving/Timed, event: verb.unpause, outcome: DECIDE, note: "today: the step advances at once when the soak elapsed during the pause. Question: as verb.pause.", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/unpause", "TestReconcileCells/canary/Serving[T]/unpause[soaked]"]}, status: current}
  - {state: Serving/Timed, event: verb.promote, variants: [match], windows: [before], outcome: transition, to: Staging/Final, note: "a promote is the operator's decision on the soak, a restart inside it included: the step advances with PromotedThrough recorded (Staging when the next step is intermediate)", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/promote", "TestReconcileCells/canary/Serving[T]/promote[restartInSoak]"]}, status: decided}
  - {state: Serving/Timed, event: verb.promote, variants: [match], windows: [boundary, after], outcome: ignore, note: "inert by PromotedThrough once the advance lands", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/promote[reshown]"]}, status: current}
  - {state: Serving/Timed, event: verb.promote, variants: [stale], outcome: ignore, note: "a value naming another revision opens nothing", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/promote[stale]"]}, status: current}
  - {state: Serving/Timed, event: verb.promote, variants: [applied], outcome: ignore, note: "the applied verb re-shown is inert and handed back for removal", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/promote[applied]"]}, status: current}
  - {state: Serving/Timed, event: verb.promoteForce, variants: [match], windows: [before], outcome: transition, to: Staging/Final, note: "a force at a served step is a promote: the step advances", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/promoteForce"]}, status: decided}
  - {state: Serving/Timed, event: verb.promoteForce, variants: [match], windows: [boundary, after], outcome: ignore, note: "inert by PromotedThrough once the advance lands; consumed with the reason when it races a rollback or a park", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/promoteForce[reshown]"]}, status: current}
  - {state: Serving/Timed, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "a value naming another revision lifts nothing", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/promoteForce[stale]"]}, status: current}
  - {state: Serving/Timed, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "the applied force re-shown is inert", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/promoteForce[applied]"]}, status: current}
  - {state: Serving/Timed, event: verb.rollback, variants: [stableServes], windows: [before], outcome: DECIDE, to: RollingBack, note: "today: as Serving/Manual, the rejection is recorded and the rejected pods drain; the timed fixture is not pinned for it. Question: should rollback, resume, a new target, a dip and a resync be pinned on the timed fixture as well, since the soak clock is the one input that differs?", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/rollback"]}, status: current}
  - {state: Serving/Timed, event: verb.rollback, variants: [stableServes], windows: [boundary, after], outcome: ignore, note: "the recorded rejection keeps a re-shown request inert", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/rollback[reshown]"]}, status: current}
  - {state: Serving/Timed, event: verb.rollback, variants: [stableEmpty], outcome: DECIDE, to: RollingBack, note: "today: the operator's rollback proceeds toward an empty stable revision with a warning. Question: as Staging/verb.rollback[stableEmpty].", placement: unit, status: current}
  - {state: Serving/Timed, event: verb.resume, variants: [own], outcome: DECIDE, note: "today: nothing is parked, so the verb is consumed silently. Question: as verb.rollback[stableServes] (pin the timed fixture).", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/resume"]}, status: current}
  - {state: Serving/Timed, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary: removed with a warning", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/resume[stale]"]}, status: current}
  - {state: Serving/Timed, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "left for the unit that owns it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/resume[otherUnit]"]}, status: current}
  - {state: Serving/Timed, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "the index clamps into the new ladder; the soak anchor is kept and the clamped step's gate reads it", placement: unit, status: current}
  - {state: Serving/Timed, event: plan.repin, variants: [raise], outcome: transition, to: PreHold, note: "the clamped step would raise traffic, so the run layer arms the pre-step hold", placement: unit, status: current}
  - {state: Serving/Timed, event: plan.drift, outcome: ignore, note: "the pinned plan executes", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/planDrift"]}, status: current}
  - {state: Serving/Timed, event: plan.unresolved, outcome: DECIDE, note: "today: the unit is not dispatched; the split freezes. Question: as Staging/plan.unresolved.", placement: unit, status: current}
  - {state: Serving/Timed, event: run.lost, outcome: ignore, note: "the unit holds where it is; even an elapsed soak does not advance it without a pinned run", invariants: [unpinned.never.steps, exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/runLost"]}, status: decided}
  - {state: Serving/Timed, event: run.adopted, outcome: ignore, note: "the target id is attached; the step, split and soak anchor are kept", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/runAdopted"]}, status: current}
  - {state: Serving/Timed, event: target.new, variants: [observed], outcome: DECIDE, to: Staging, note: "today: as Serving/Manual, the record is reset to step 0 toward the new target. Question: as verb.rollback[stableServes] (pin the timed fixture).", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/newTarget"]}, status: current}
  - {state: Serving/Timed, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "the bind resets the record toward the new run's target", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/newTarget[runOpen]"]}, status: current}
  - {state: Serving/Timed, event: capacity.reached, outcome: ignore, note: "the split already serves; a count back at the staged number clears the wait clock", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/capacityReached"]}, status: current}
  - {state: Serving/Timed, event: capacity.dropped, outcome: DECIDE, note: "today: as Serving/Manual, the split keeps its phase and weight and the wait is clocked; the soak keeps counting through the dip. Question: as verb.rollback[stableServes] (pin the timed fixture), and should a dip pause the soak?", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/capacityDropped"]}, status: current}
  - {state: Serving/Timed, event: spec.replicas, outcome: ignore, note: "the staged count is recomputed; the step holds", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/replicasUp"]}, status: current}
  - {state: Serving/Timed, event: timer.readyTimeout, outcome: DECIDE, to: Failed, note: "today: a split that dipped and stays short past the ready timeout parks Failed. Question: as Serving/Manual/timer.readyTimeout.", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/readyTimeout"]}, status: current}
  - {state: Serving/Timed, event: timer.pauseElapsed, variants: [elapsed], outcome: transition, to: Staging/Final, note: "the soak elapsed since the split first served: the step advances (Staging when the next step is intermediate)", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/pauseElapsed"]}, status: decided}
  - {state: Serving/Timed, event: timer.pauseElapsed, variants: [restartInSoak], outcome: ignore, note: "a canary pod that died and came back has served only since then; the step holds until it has served a full soak", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/pauseElapsed[restartInSoak]"]}, status: decided}
  - {state: Serving/Timed, event: timer.pauseElapsed, variants: [restartSoaked], outcome: transition, to: Staging/Final, note: "the restarted pod has served a full soak: the step advances", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/pauseElapsed[restartSoaked]"]}, status: decided}
  - {state: Serving/Timed, event: pod.canaryCrashed, outcome: transition, to: Failed, note: "the ladder parks at its step; the split returns to stable", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/canaryCrashed"]}, status: decided}
  - {state: Serving/Timed, event: pod.canaryRestarted, outcome: ignore, note: "the soak re-anchors on the newest restart; the step moves only once the restarted pod has served a full soak", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/canaryRestarted"]}, status: current}
  - {state: Serving/Timed, event: pod.canaryDeleted, outcome: ignore, note: "a pod on its way out is a dip: the step keeps its phase and weight", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/canaryPodDeleted"]}, status: current}
  - {state: Serving/Timed, event: record.legacy, variants: [noTargetID], outcome: DECIDE, note: "today: adopted in place. Question: as Staging/record.legacy[noTargetID].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/record[noTargetID]"]}, status: current}
  - {state: Serving/Timed, event: record.legacy, variants: [stableEqualsCanary], outcome: DECIDE, note: "today: repaired from the replica's distinct current revision. Question: as Staging/record.legacy[stableEqualsCanary].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/record[stableEqualsCanary]"]}, status: current}
  - {state: Serving/Timed, event: record.legacy, variants: [noStable], outcome: ignore, note: "backfilled from the observed stable revision", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/record[noStable]"]}, status: current}
  - {state: Serving/Timed, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "clamped to 0", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/record[negativeStep]"]}, status: current}
  - {state: Serving/Timed, event: record.legacy, variants: [failedPhaseNoMarker], outcome: transition, to: Failed, note: "a Failed phase with no marker still parks", invariants: [phase.is.input], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/record[failedPhaseNoMarker]"]}, status: current}
  - {state: Serving/Timed, event: pass.resync, outcome: DECIDE, note: "today: the hold stands and the soak counts. Question: as verb.rollback[stableServes] (pin the timed fixture).", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/resync"]}, status: current}
  - {state: Serving/Timed, event: pass.staleRecord, outcome: defer, note: "the flush keeps the live record and the pass requeues", placement: sim, status: current}
