# Serving/Timed: an intermediate step's split serves under a timed Pause.
# The soak is measured from the later of the split first serving and the
# newest canary pod restart; a promote is the operator's decision on the
# soak. Every row is pinned on the grid's timed fixture, since the soak
# clock is the one input that differs from Serving/Manual.
cells:
  - {state: Serving/Timed, event: verb.pause, outcome: ignore, note: "the pause observes only and leaves the soak anchor, so the soak keeps counting under it and a pause longer than the soak advances the step on the first pass after it clears; the pause holds the step, it does not re-anchor it", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/pause"]}, status: decided}
  - {state: Serving/Timed, event: verb.unpause, outcome: ignore, note: "the first pass after the pause reads the soak as it stands: still running, the step holds; elapsed under the pause, the step advances through the soak's own edge, since the pause stopped no clock", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/unpause", "TestReconcileCells/canary/Serving[T]/unpause[soaked]"]}, status: decided}
  - {state: Serving/Timed, event: verb.promote, variants: [match], windows: [before], outcome: transition, to: Staging/Final, note: "a promote is the operator's decision on the soak, a restart inside it included: the step advances with PromotedThrough recorded (Staging when the next step is intermediate)", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/promote", "TestReconcileCells/canary/Serving[T]/promote[restartInSoak]"]}, status: decided}
  - {state: Serving/Timed, event: verb.promote, variants: [match], windows: [boundary, after], outcome: ignore, note: "a copy re-shown as or after the advance lands is inert by PromotedThrough and handed back for removal", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/promote[reshown]"]}, status: decided}
  - {state: Serving/Timed, event: verb.promote, variants: [stale], outcome: ignore, note: "a value naming another revision opens nothing and is left in place; only the canary revision's hash is a promote of this ladder", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/promote[stale]"]}, status: decided}
  - {state: Serving/Timed, event: verb.promote, variants: [applied], outcome: ignore, note: "the applied verb re-shown is inert by PromotedThrough and handed back for removal; the record clears once no key carries the value", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/promote[applied]"]}, status: decided}
  - {state: Serving/Timed, event: verb.promoteForce, variants: [match], windows: [before], outcome: transition, to: Staging/Final, note: "a force at a served step is a promote: the step advances", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/promoteForce"]}, status: decided}
  - {state: Serving/Timed, event: verb.promoteForce, variants: [match], windows: [boundary, after], outcome: ignore, note: "inert by PromotedThrough once the advance lands; a force racing a rollback or a park is consumed with the reason so it cannot open a later gate", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/promoteForce[reshown]"]}, status: decided}
  - {state: Serving/Timed, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "a value naming another revision lifts nothing and is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/promoteForce[stale]"]}, status: decided}
  - {state: Serving/Timed, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "the applied force re-shown is inert by PromotedThrough and handed back for removal", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/promoteForce[applied]"]}, status: decided}
  - {state: Serving/Timed, event: verb.rollback, variants: [stableServes], windows: [before], outcome: transition, to: RollingBack, note: "the rejection is recorded and the rejected pods drain; the request runs ahead of the step's gate, so the soak clock plays no part in a rollback", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/rollback"]}, status: decided}
  - {state: Serving/Timed, event: verb.rollback, variants: [stableServes], windows: [boundary, after], outcome: ignore, note: "the recorded rejection is the record that the request was applied, so a copy re-shown after the flush is inert", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/rollback[reshown]"]}, status: decided}
  - {state: Serving/Timed, event: verb.rollback, variants: [stableEmpty], outcome: transition, to: RollingBack, note: "the operator's rollback is the operator's decision: it proceeds toward a stable revision that runs no live Instance, with a CanaryStableRevisionEmpty warning, and the split it held stands until a stable pod serves again; only a gate-decided rollback parks on an empty stable", placement: unit, coverage: {unit: ["TestReconcile_OperatorRollbackToAnEmptyStableFromEveryLiveState"]}, status: decided}
  - {state: Serving/Timed, event: verb.resume, variants: [own], outcome: reject, note: "nothing is parked, so the verb is consumed silently ahead of the holds rather than left to fire at the next terminal hold", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/resume"]}, status: decided}
  - {state: Serving/Timed, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary, parked or in flight: removed with a RolloutResumeRejected warning so it cannot fire on a later canary carrying the same hash", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/resume[stale]"]}, status: decided}
  - {state: Serving/Timed, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "a bare hash is addressed to whichever unit's record carries it, so a value another unit's canary carries is left for that unit's dispatch", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/resume[otherUnit]"]}, status: decided}
  - {state: Serving/Timed, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "the index clamps into the new ladder, the soak anchor is kept and the clamped weight is written on the same pass; no hold arms when the clamped step's traffic does not exceed the weight on record", placement: unit, coverage: {replay: ["repin-clamps-a-timed-step"]}, status: decided}
  - {state: Serving/Timed, event: plan.repin, variants: [raise], outcome: transition, to: PreHold, note: "a clamped step whose traffic exceeds the weight on record would be immediate exposure, so the run layer arms the pre-step hold and the split keeps its recorded weight until a promote releases it", placement: unit, coverage: {replay: ["repin-clamps-a-timed-step"]}, status: decided}
  - {state: Serving/Timed, event: plan.drift, outcome: ignore, note: "the pinned plan executes; the run layer reports the drift and only a repin applies the edit", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/planDrift"]}, status: decided}
  - {state: Serving/Timed, event: plan.unresolved, outcome: ignore, note: "with no executable body the unit is not dispatched and its Components take the full plan-gate hold, so the split and the soak anchor freeze where they are until the plan resolves again; the run layer's plan conditions carry the signal", placement: unit, coverage: {unit: ["TestPlanGateHoldPartition"], replay: ["canary-group-stops-resolving-under-a-timed-pause"]}, status: decided}
  - {state: Serving/Timed, event: run.lost, outcome: ignore, note: "the unit holds where it is; even an elapsed soak does not advance it without a pinned run", invariants: [unpinned.never.steps, exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/runLost"]}, status: decided}
  - {state: Serving/Timed, event: run.adopted, outcome: ignore, note: "the bind attaches the run's target id to a record that carries none; the step, split and soak anchor are kept", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/runAdopted"]}, status: decided}
  - {state: Serving/Timed, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "the record is reset to step 0 toward the new target with the stable identity preserved; the soak anchor goes with the rest of the per-target state", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/newTarget"]}, status: decided}
  - {state: Serving/Timed, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "a retarget mid-ladder supersedes the run; the bind resets the record to step 0 toward the new run's target before the executor's pass, with the stable identity preserved", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/newTarget[runOpen]"]}, status: decided}
  - {state: Serving/Timed, event: capacity.reached, outcome: ignore, note: "the split already serves; a count back at the staged number clears the wait clock a dip opened, so a later dip is clocked from its own start", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/capacityReached"]}, status: decided}
  - {state: Serving/Timed, event: capacity.dropped, outcome: ignore, note: "the split keeps its phase and recorded weight through a dip, the wait is clocked and the soak keeps counting; a pod that merely vanished is the workload's repair, and only a pod that comes back re-anchors the soak", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/capacityDropped"]}, status: decided}
  - {state: Serving/Timed, event: spec.replicas, outcome: ignore, note: "the staged count is recomputed from the new desired count on every pass; the step holds its split", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/replicasUp"]}, status: decided}
  - {state: Serving/Timed, event: timer.readyTimeout, outcome: transition, to: Failed, note: "a split that served, dipped and stays short past the ready timeout parks Failed with the marker CapacityTimeout; the split keeps following the pods that serve, and the park is the capacity gate's verdict that the step's capacity did not hold", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/readyTimeout"]}, status: decided}
  - {state: Serving/Timed, event: timer.pauseElapsed, variants: [elapsed], outcome: transition, to: Staging/Final, note: "the soak elapsed since the split first served: the step advances (Staging when the next step is intermediate)", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/pauseElapsed"]}, status: decided}
  - {state: Serving/Timed, event: timer.pauseElapsed, variants: [restartInSoak], outcome: ignore, note: "a canary pod that died and came back has served only since then; the step holds until it has served a full soak", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/pauseElapsed[restartInSoak]"]}, status: decided}
  - {state: Serving/Timed, event: timer.pauseElapsed, variants: [restartSoaked], outcome: transition, to: Staging/Final, note: "the restarted pod has served a full soak: the step advances", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/pauseElapsed[restartSoaked]"]}, status: decided}
  - {state: Serving/Timed, event: pod.canaryCrashed, outcome: transition, to: Failed, note: "the ladder parks at its step; the split returns to stable", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/canaryCrashed"]}, status: decided}
  - {state: Serving/Timed, event: pod.canaryRestarted, outcome: ignore, note: "the soak re-anchors on the newest restart, so the step moves only once the restarted pod has served a full soak; a pod that died has served only since it came back", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/canaryRestarted"]}, status: decided}
  - {state: Serving/Timed, event: pod.canaryDeleted, outcome: ignore, note: "a pod on its way out is a dip: the step keeps its phase and weight while the workload repairs it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/canaryPodDeleted"]}, status: decided}
  - {state: Serving/Timed, event: record.legacy, variants: [noTargetID], outcome: ignore, note: "a record with no target id under a pinned run adopts the run's id in place and keeps its step and soak: re-arming it would restart a ladder that is already in flight", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/record[noTargetID]"]}, status: decided}
  - {state: Serving/Timed, event: record.legacy, variants: [stableEqualsCanary], outcome: ignore, note: "a persisted pair whose stable equals its canary hash is repaired from the replica's distinct current revision when the controller supplies one, because the two identities must stay distinct for a primary retarget", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/record[stableEqualsCanary]"]}, status: decided}
  - {state: Serving/Timed, event: record.legacy, variants: [noStable], outcome: ignore, note: "the stable identity is backfilled from the observed stable revision and then never re-inferred, because the live pod set stops naming the pre-canary stable as revisions retarget and drain", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/record[noStable]"]}, status: decided}
  - {state: Serving/Timed, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "status is an unvalidated subresource, so a negative step from an external write is clamped to 0 before it can index the plan", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/record[negativeStep]"]}, status: decided}
  - {state: Serving/Timed, event: record.legacy, variants: [failedPhaseNoMarker], outcome: transition, to: Failed, note: "a Failed phase with no marker is status written before the marker existed and still parks; the Failed hold re-projects the phase, so a write that dropped the marker cannot un-park the canary", invariants: [phase.is.input], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/record[failedPhaseNoMarker]"]}, status: decided}
  - {state: Serving/Timed, event: pass.resync, outcome: ignore, note: "the hold stands and the soak counts from its anchor; a pass inside the soak writes nothing new", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[T]/resync"]}, status: decided}
  - {state: Serving/Timed, event: pass.staleRecord, outcome: defer, note: "the flush compares the live record with the one the pass read and keeps the live record, phase and traffic when they differ; the pass requeues to decide again from the current record, so a decision made from a stale record is never written", placement: unit, coverage: {unit: ["TestBaseKeepsTheLiveRecordOverAStalePass"], replay: ["repin-clamps-a-timed-step"]}, status: decided}
