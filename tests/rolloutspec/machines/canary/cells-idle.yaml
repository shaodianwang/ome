# Idle: no record. The pass projects the Stable phase when a target is known
# and the unit has replicas, arms only under a pinned run that retargets the
# unit with a known stable revision, and consumes the verbs that have no
# canary to act on. Convention for every cells file of this machine: a cell
# with no window and no transition selector is the row's outcome in every
# window; a verb row is split into before (the verb lands) and boundary/after
# (a copy re-shown as or after the write lands) only where the record keeps
# the re-shown copy inert. A DECIDE note starts with what the code does today.
cells:
  - {state: Idle, event: verb.pause, outcome: ignore, note: "a pause never initializes the record; a target that appears while paused arms once the pause clears", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/pause"]}, status: decided}
  - {state: Idle, event: verb.unpause, outcome: ignore, note: "nothing was held, so the first pass after the pause is a plain resync that re-projects Stable; an unarmed unit has no clock a pause could have stopped", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/unpause"]}, status: decided}
  - {state: Idle, event: verb.promote, variants: [match], outcome: ignore, note: "no record to advance; the verb is left in place and the Stable phase is projected", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/promote"]}, status: decided}
  - {state: Idle, event: verb.promote, variants: [stale], outcome: ignore, note: "no record to advance; the value is left in place because a promote is consumed only by the pass that applies it, and an unarmed unit applies none", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/promote[stale]"]}, status: decided}
  - {state: Idle, event: verb.promoteForce, variants: [match], outcome: ignore, note: "no record to force; the verb is left in place and the Stable phase is projected", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/promoteForce"]}, status: decided}
  - {state: Idle, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "no record to force; the value is left in place for the same reason as a promote, and the Stable phase is projected", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/promoteForce[stale]"]}, status: decided}
  - {state: Idle, event: verb.rollback, variants: [stableServes], outcome: reject, note: "no canary is in flight: the request is removed with a CanaryRollbackIgnored warning so it cannot fire on the next canary's first pass", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/rollback"]}, status: decided}
  - {state: Idle, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary, parked or in flight: removed with a RolloutResumeRejected warning", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/resume"]}, status: decided}
  - {state: Idle, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "a bare hash is addressed to whichever unit's record carries it, so a value another unit's canary carries is left for that unit's dispatch", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/resume[otherUnit]"]}, status: decided}
  - {state: Idle, event: plan.drift, outcome: ignore, note: "with no run pinned the live spec is the effective plan, so the edit is simply what the next arming reads; there is no pin for it to drift from", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/planDrift"]}, status: decided}
  - {state: Idle, event: plan.unresolved, outcome: ignore, note: "a canary-kind group with no executable body is not dispatched and its Components take the full plan-gate hold, so no record is written and every Instance stays where it is until the plan resolves again", placement: unit, coverage: {unit: ["TestPlanGateHoldPartition"], replay: ["canary-group-stops-resolving-while-idle"]}, status: decided}
  - {state: Idle, event: run.lost, outcome: ignore, note: "a target that diverges from the stable revision with no pinned run is held as-is and no phase is written: opening, adopting or parking the run is the run layer's job and its plan conditions carry the signal, while the update gates hold the forward roll fail-closed", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/runLost"]}, status: decided}
  - {state: Idle, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "the bind arms the record at step 0 toward the pinned target with the pinned stable identity and projects Pending, so the pinned plan and the step state become visible in one write", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/newTarget[runOpen]"]}, status: decided}
  - {state: Idle, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "the executor arms the record itself when a pinned run retargets the unit and a stable revision is known; a unit the run did not retarget projects Stable instead, so no ladder walks over a rollout that never happened", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/newTarget"]}, status: decided}
  - {state: Idle, event: capacity.reached, outcome: ignore, note: "an unarmed unit with a known target and replicas projects Stable on every pass, so a phase an earlier ladder left behind cannot outlive the record that produced it; nothing arms without a retargeting run", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/resync"]}, status: decided}
  - {state: Idle, event: pass.resync, outcome: ignore, note: "the same Stable projection as capacity.reached and no other write; the phase is derived from the record on every pass rather than kept", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/resync"]}, status: decided}
  - {state: Idle, event: spec.replicas, outcome: ignore, note: "an unarmed unit under an effective canary plan projects step 0's partition, so a replica change only moves that partition; nothing arms", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/replicasUp"]}, status: decided}
  - {state: Idle, event: pod.canaryCrashed, outcome: ignore, note: "a crash reading with no record parks nothing", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/canaryCrashed"]}, status: decided}
