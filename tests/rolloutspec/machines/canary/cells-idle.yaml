# Idle: no record. The pass projects the Stable phase when a target is known
# and the unit has replicas, arms only under a pinned run that retargets the
# unit with a known stable revision, and consumes the verbs that have no
# canary to act on. Convention for every cells file of this machine: a cell
# with no window and no transition selector is the row's outcome in every
# window; a verb row is split into before (the verb lands) and boundary/after
# (a copy re-shown as or after the write lands) only where the record keeps
# the re-shown copy inert. A DECIDE note starts with what the code does today.
cells:
  - {state: Idle, event: verb.pause, outcome: ignore, note: "a pause never initializes the record; a target that appears while paused arms once the pause clears", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/pause"]}, status: decided}
  - {state: Idle, event: verb.unpause, outcome: ignore, note: "nothing was held; the pass is a resync", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/unpause"]}, status: current}
  - {state: Idle, event: verb.promote, variants: [match], outcome: ignore, note: "no record to advance; the verb is left in place and the Stable phase is projected", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/promote"]}, status: decided}
  - {state: Idle, event: verb.promote, variants: [stale], outcome: ignore, note: "no record to advance; a value naming no canary is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/promote[stale]"]}, status: current}
  - {state: Idle, event: verb.promoteForce, variants: [match], outcome: ignore, note: "no record to force; the verb is left in place and the Stable phase is projected", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/promoteForce"]}, status: decided}
  - {state: Idle, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "no record to force; the value is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/promoteForce[stale]"]}, status: current}
  - {state: Idle, event: verb.rollback, variants: [stableServes], outcome: reject, note: "no canary is in flight: the request is removed with a CanaryRollbackIgnored warning so it cannot fire on the next canary's first pass", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/rollback"]}, status: decided}
  - {state: Idle, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary, parked or in flight: removed with a RolloutResumeRejected warning", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/resume"]}, status: decided}
  - {state: Idle, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "a value another unit's canary carries is left for that unit's dispatch", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/resume[otherUnit]"]}, status: current}
  - {state: Idle, event: plan.drift, outcome: ignore, note: "a spec or policy edit with no run pinned changes the live view; the next arming reads it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/planDrift"]}, status: current}
  - {state: Idle, event: plan.unresolved, outcome: ignore, note: "the unit is not dispatched; its Components take the plan-gate hold partition instead", placement: unit, status: current}
  - {state: Idle, event: run.lost, outcome: DECIDE, note: "today: a target that diverges from the stable revision with no pinned run is held as-is, silently; the update gates hold the forward roll fail-closed and the executor arms nothing (holds.go, the diverged-target branch). Question: should the unit surface the hold (an event or a condition) instead of waiting silently for the run layer?", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/runLost"]}, status: current}
  - {state: Idle, event: target.new, variants: [runOpen], outcome: DECIDE, to: Staging, note: "today: the bind arms the record at step 0 toward the pinned target with the pinned stable identity, phase Pending (T-idle-arm-bind); the grid exercises it only as a fixture step and never asserts it. Question: should the arming cell be pinned by the grid (record fields, phase, step-0 partition) rather than inherited from fixtures?", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/newTarget[runOpen]"]}, status: current}
  - {state: Idle, event: target.new, variants: [observed], outcome: DECIDE, to: Staging, note: "today: the executor arms the record itself when a pinned run retargets the unit, a stable revision is known, and the target is not already fully served (T-idle-arm); no grid row asserts it. Question: same as the bind: should the observed arming be pinned by the grid, and should a target already fully served still project Stable rather than arm?", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/newTarget"]}, status: current}
  - {state: Idle, event: capacity.reached, outcome: DECIDE, note: "today: an unarmed unit with a known target and replicas re-projects the Stable phase on every pass, over whatever phase an earlier ladder left (holds.go, the arming branch); no grid row asserts the projection on its own. Question: is re-projecting Stable on every unarmed pass the wanted behavior when the record was cleared by hand after a park or a rollback?", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/resync"]}, status: current}
  - {state: Idle, event: pass.resync, outcome: DECIDE, note: "today: the same Stable projection as capacity.reached, with no other write. Question: as capacity.reached.", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/resync"]}, status: current}
  - {state: Idle, event: spec.replicas, outcome: ignore, note: "a step-0 partition is projected for an unarmed unit under an effective canary plan, so a replica change only moves that partition", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/replicasUp"]}, status: current}
  - {state: Idle, event: pod.canaryCrashed, outcome: ignore, note: "a crash reading with no record parks nothing", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Idle/canaryCrashed"]}, status: decided}
