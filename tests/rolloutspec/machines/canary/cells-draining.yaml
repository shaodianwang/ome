# Draining and Draining/Held: the final step shifted 100% of the traffic.
# Draining is the ungated drain inside its window with the capacity full;
# Draining/Held is the same shift behind a final gate that still holds. The
# release follows the window and the gate, never the step entry.
cells:
  - {state: Draining, event: verb.pause, outcome: ignore, note: "the pass observes only: the drain clock is left as it is, so the window keeps elapsing under the pause", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/pause"]}, status: decided}
  - {state: Draining, event: verb.unpause, outcome: ignore, note: "the drain resumes with its clock as the pause left it; a window that elapsed under the pause releases on the first pass after it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/unpause"]}, status: decided}
  - {state: Draining, event: verb.promote, variants: [match], outcome: ignore, note: "an ungated final step has no gate for a promote to open; the promote stays live, unconsumed, for the release to record", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/promote"]}, status: decided}
  - {state: Draining, event: verb.promote, variants: [stale], outcome: ignore, note: "a value naming another revision opens nothing and is left in place; only the canary revision's hash is a promote of this unit", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/promote[stale]"]}, status: decided}
  - {state: Draining, event: verb.promote, variants: [applied], outcome: ignore, note: "the applied copy matches PromotedThrough, so it is inert and handed back for removal again; the record clears once no key carries the value", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/promote[applied]"]}, status: decided}
  - {state: Draining, event: verb.promoteForce, variants: [match], outcome: ignore, note: "the drain keeps running under the force: no clock, no park, and the force stays live until the completion edge records it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/promoteForce"]}, status: decided}
  - {state: Draining, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "a value naming another revision lifts nothing and is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/promoteForce[stale]"]}, status: decided}
  - {state: Draining, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "the applied copy is inert and handed back for removal; the record keeps it from re-applying", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/promoteForce[applied]"]}, status: decided}
  - {state: Draining, event: verb.rollback, variants: [stableServes], windows: [before], outcome: transition, to: RollingBack, note: "the rejection is recorded; traffic returns to the held stable instance as it serves and the canary pods drain", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/rollback"]}, status: decided}
  - {state: Draining, event: verb.rollback, variants: [stableServes], windows: [boundary, after], outcome: ignore, note: "the recorded rejection is the record that the request was applied, so a re-shown request is inert; a unit carrying one never takes a request again", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/rollback[reshown]"]}, status: decided}
  - {state: Draining, event: verb.rollback, variants: [stableEmpty], outcome: transition, to: RollingBack, note: "the request is the operator's decision, so it proceeds where a gate-decided rollback would park: the rejection is recorded with a warning naming the member whose stable revision runs no Instance, and the revert rebuilds every Instance of it onto that revision; the split keeps the canary until a stable pod serves", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/rollback[stableEmpty]"]}, status: decided}
  - {state: Draining, event: verb.resume, variants: [own], outcome: reject, note: "nothing is parked: consumed silently", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/resume"]}, status: decided}
  - {state: Draining, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary, parked or in flight: removed with a warning so it cannot fire on a later canary that carries the hash", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/resume[stale]"]}, status: decided}
  - {state: Draining, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "a value another unit's canary carries is left for that unit; one unit's pass never consumes a verb aimed at another", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/resume[otherUnit]"]}, status: decided}
  - {state: Draining, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "the run layer clamps the index onto the new ladder's last step, whose 100% does not exceed the recorded weight, so no hold is armed; the drain continues under it with its clock kept", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/repin[holdOrTighten]"]}, status: decided}
  - {state: Draining, event: plan.drift, outcome: ignore, note: "the pinned plan executes; a spec edit applies at the next run or a repin", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/planDrift"]}, status: decided}
  - {state: Draining, event: plan.unresolved, outcome: ignore, note: "with no pin and no body the run layer parks the plan with a warning and the unit is not dispatched: the projection holds every Instance where it stands, so the drain freezes at 100% with the stable instance held and nothing reads the release until a body resolves", placement: unit, coverage: {replay: [draining-stale-record-and-lost-policy]}, status: decided}
  - {state: Draining, event: run.lost, outcome: ignore, note: "the unit holds in the drain with a CanaryRunLost warning; the release is not read without a pinned run, because stepping an unpinned plan is the hazard arming one would be", invariants: [unpinned.never.steps], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/runLost"]}, status: decided}
  - {state: Draining, event: run.adopted, outcome: ignore, note: "the bind attaches the run's target id to the record without a reset; the drain clock is kept", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/runAdopted"]}, status: decided}
  - {state: Draining, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "the record is reset to step 0 toward the new target with the stable identity preserved", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/newTarget"]}, status: decided}
  - {state: Draining, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "the bind resets the record toward the new run's target with its pinned stable", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/newTarget[runOpen]"]}, status: decided}
  - {state: Draining, event: capacity.dropped, outcome: transition, to: Draining/ShortInWindow, note: "a drain is exempt from the capacity hold, so the phase stays Promoting and the split follows the pods that serve; the wait is clocked and the release will be read on a count taken with the capacity back", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/capacityDropped"], replay: [draining-short-in-window-loses-policy]}, status: decided}
  - {state: Draining, event: spec.replicas, outcome: ignore, note: "the held floor and the full capacity the release waits for are recomputed from the new count; a count the canary cannot yet fill clocks the wait as a dip would", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/replicasUp"]}, status: decided}
  - {state: Draining, event: timer.drainElapsed, outcome: transition, to: Done/Rolling, note: "the window elapsed with the capacity Ready: the promote record is taken, the sentinel set, the cutover traffic written and partition 0 released; the unit is not Stable until the held instance has rolled", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/drainElapsed"]}, status: decided}
  - {state: Draining, event: pod.canaryCrashed, outcome: transition, to: Failed, note: "the ladder parks at the final step; the traffic returns to the held stable instance", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/canaryCrashed"]}, status: decided}
  - {state: Draining, event: pod.canaryRestarted, outcome: ignore, note: "an ungated drain has no soak to re-anchor; a single restart is read as a dip at most", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/canaryRestarted"]}, status: decided}
  - {state: Draining, event: pod.canaryDeleted, outcome: transition, to: Draining/ShortInWindow, note: "a pod on its way out is a dip in the drain, not a crash: the capacity wait is clocked and the split follows the pods", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/canaryPodDeleted"]}, status: decided}
  - {state: Draining, event: record.legacy, variants: [noTargetID], outcome: ignore, note: "a record with no target id under a pinned run adopts the run's id in place and keeps its step; it predates target ids, and re-arming would restart a drain already at 100%", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/record[noTargetID]"]}, status: decided}
  - {state: Draining, event: record.legacy, variants: [stableEqualsCanary], outcome: ignore, note: "a pair whose stable equals its canary hash is repaired from the replica's distinct current revision when the pass supplies one; the drain continues", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/record[stableEqualsCanary]"]}, status: decided}
  - {state: Draining, event: record.legacy, variants: [noStable], outcome: ignore, note: "backfilled from the observed stable revision and then never re-inferred; a unit with no stable identity at the sentinel reads Stable at once", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/record[noStable]"]}, status: decided}
  - {state: Draining, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "a negative step is an external write and is read back from the record before the plan is indexed: the drain's recorded 100% places it at the final step, so the drain keeps its traffic, its window and its held floor", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/record[negativeStep]"], kind: [canary_status_rewrite]}, status: decided}
  - {state: Draining, event: record.legacy, variants: [failedPhaseNoMarker], outcome: transition, to: Failed, note: "a Failed phase with no marker is status written before the marker existed and still parks; the hold re-projects the phase and leaves the drain's split as it stands", invariants: [phase.is.input], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/record[failedPhaseNoMarker]"]}, status: decided}
  - {state: Draining, event: pass.resync, outcome: ignore, note: "the drain runs on; the window is re-read against the shift instant", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/resync"]}, status: decided}
  - {state: Draining, event: pass.staleRecord, outcome: defer, note: "the flush finds the live record past the pass's base, keeps the live record, phase and traffic and marks the pass stale, so its verbs are not consumed and it requeues to decide from the current record", placement: sim, coverage: {replay: [draining-stale-record-and-lost-policy]}, status: decided}
  # --- Draining/Held ---------------------------------------------------------------
  - {state: Draining/Held, event: verb.pause, outcome: ignore, note: "the pass observes only; the gate's clocks are left as they are", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/pause"]}, status: decided}
  - {state: Draining/Held, event: verb.unpause, outcome: ignore, note: "the gate resumes deciding with its clocks as the pause left them", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/unpause"]}, status: decided}
  - {state: Draining/Held, event: verb.promote, variants: [match], windows: [before], outcome: transition, to: Draining, note: "the final gate opens and the drain continues; the release follows in the same pass when the window has already elapsed, as in the cited row where the window is nil, and the promote is recorded at that edge", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/promote"]}, status: decided}
  - {state: Draining/Held, event: verb.promote, variants: [match], windows: [boundary, after], outcome: ignore, note: "the final step re-reads a live promote on every pass until the release records it; a copy re-shown after the release is inert by PromotedThrough", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/promote[reshown]"]}, status: decided}
  - {state: Draining/Held, event: verb.promote, variants: [stale], outcome: ignore, note: "a value naming another revision opens nothing and is left in place; the gate holds", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/promote[stale]"]}, status: decided}
  - {state: Draining/Held, event: verb.promote, variants: [applied], outcome: ignore, note: "the applied copy matches PromotedThrough, so it is inert and handed back for removal; the gate holds", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/promote[applied]"]}, status: decided}
  - {state: Draining/Held, event: verb.promoteForce, variants: [match], windows: [before], outcome: transition, to: Draining, note: "a force opens the final gate like a promote; the release follows in the same pass when the window has elapsed", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/promoteForce"]}, status: decided}
  - {state: Draining/Held, event: verb.promoteForce, variants: [match], windows: [boundary, after], outcome: ignore, note: "live until the release records it; inert afterwards by PromotedThrough", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/promoteForce[reshown]"]}, status: decided}
  - {state: Draining/Held, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "a value naming another revision opens nothing and is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/promoteForce[stale]"]}, status: decided}
  - {state: Draining/Held, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "the applied copy is inert and handed back for removal", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/promoteForce[applied]"]}, status: decided}
  - {state: Draining/Held, event: verb.rollback, variants: [stableServes], windows: [before], outcome: transition, to: RollingBack, note: "the request branch precedes the gate: the rejection is recorded and the canary pods drain back to the held stable instance", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/rollback"]}, status: decided}
  - {state: Draining/Held, event: verb.rollback, variants: [stableServes], windows: [boundary, after], outcome: ignore, note: "the recorded rejection keeps a re-shown request inert", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/rollback[reshown]"]}, status: decided}
  - {state: Draining/Held, event: verb.rollback, variants: [stableEmpty], outcome: transition, to: RollingBack, note: "the request is the operator's decision, so it proceeds where a gate-decided rollback would park: the rejection is recorded with a warning naming the member whose stable revision runs no Instance, and the revert rebuilds every Instance of it onto that revision", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/rollback[stableEmpty]"]}, status: decided}
  - {state: Draining/Held, event: verb.resume, variants: [own], outcome: reject, note: "nothing is parked: consumed silently", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/resume"]}, status: decided}
  - {state: Draining/Held, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary: removed with a warning", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/resume[stale]"]}, status: decided}
  - {state: Draining/Held, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "left for the unit that owns it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/resume[otherUnit]"]}, status: decided}
  - {state: Draining/Held, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "the run layer clamps the index onto the new ladder's last step, whose 100% does not exceed the recorded weight, so no hold is armed; that step's gate decides from the clocks already stamped", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/repin[holdOrTighten]"]}, status: decided}
  - {state: Draining/Held, event: plan.drift, outcome: ignore, note: "the pinned plan executes; a spec edit applies at the next run or a repin", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/planDrift"]}, status: decided}
  - {state: Draining/Held, event: plan.unresolved, outcome: ignore, note: "with no pin and no body the run layer parks the plan with a warning and the unit is not dispatched: the projection holds every Instance where it stands and the held gate freezes at 100%, nobody re-reading it until a body resolves", placement: unit, coverage: {replay: [draining-held-stale-record-and-lost-policy]}, status: decided}
  - {state: Draining/Held, event: run.lost, outcome: ignore, note: "the unit holds with a CanaryRunLost warning; the gate is not evaluated without a pinned run", invariants: [unpinned.never.steps], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/runLost"]}, status: decided}
  - {state: Draining/Held, event: run.adopted, outcome: ignore, note: "the bind attaches the run's target id without a reset; the gate's clocks are kept", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/runAdopted"]}, status: decided}
  - {state: Draining/Held, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "the record is reset to step 0 toward the new target with the stable identity preserved", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/newTarget"]}, status: decided}
  - {state: Draining/Held, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "the bind resets the record toward the new run's target", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/newTarget[runOpen]"]}, status: decided}
  - {state: Draining/Held, event: capacity.dropped, outcome: ignore, note: "a drain is exempt from the capacity hold: the gate keeps deciding and the release behind it waits for the capacity; the wait is clocked, so a dip that outlives the ready timeout parks even behind the gate, and the split follows the pods that serve", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/capacityDropped"]}, status: decided}
  - {state: Draining/Held, event: spec.replicas, outcome: ignore, note: "the held floor and the release's full capacity are recomputed from the new count; the gate keeps deciding", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/replicasUp"]}, status: decided}
  - {state: Draining/Held, event: timer.pauseElapsed, variants: [elapsed, restartSoaked], outcome: transition, to: Draining, note: "the final step's timed Pause elapsed since the 100% shift (or since the newest canary pod restart): the gate opens and the drain continues toward the release", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[T]/pauseElapsed", "TestReconcileCells/canary/Draining[T]/pauseElapsed[restartSoaked]"]}, status: decided}
  - {state: Draining/Held, event: timer.pauseElapsed, variants: [restartInSoak], outcome: ignore, note: "a canary pod restarted inside the soak has not served a full soak; the gate holds until it has", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[T]/pauseElapsed[restartInSoak]"]}, status: decided}
  - {state: Draining/Held, event: timer.drainElapsed, outcome: ignore, note: "the window is read only after the gate opens; elapsing behind a held gate changes nothing until then, and the release then follows the opening pass", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/drainElapsed"]}, status: decided}
  - {state: Draining/Held, event: analysis.sample, variants: [pass], outcome: ignore, note: "a passing sample inside the bake window is recorded and the gate holds at 100%; the final step's analysis runs the same gate as an intermediate step's", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[A]/sample[pass]"]}, status: decided}
  - {state: Draining/Held, event: analysis.sample, variants: [passBaked], outcome: transition, to: Draining, note: "a passing sample once the bake window has elapsed opens the gate into the drain", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[A]/sample[passBaked]"]}, status: decided}
  - {state: Draining/Held, event: analysis.sample, variants: [fail], outcome: ignore, note: "a breach at 100% counts one failing check toward the step's limit and the gate holds", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[A]/sample[fail]"]}, status: decided}
  - {state: Draining/Held, event: analysis.sample, variants: [failAtLimit], outcome: transition, to: RollingBack, note: "a breach at the limit inside the drain window rolls back: the rejection is recorded and the canary pods drain back to the held stable instance", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[A]/sample[failAtLimit]"]}, status: decided}
  - {state: Draining/Held, event: analysis.sample, variants: [failAtLimitStableEmpty], outcome: transition, to: Failed/StableMissing, note: "a gate-decided rollback whose stable revision runs no live Instance has nothing to return to on its own: the split is rewritten through the serving rule and the unit parks with the marker StableRevisionMissing, signalling no revert; an operator's rollback still proceeds from the park", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[A]/sample[failAtLimitStableEmpty]"]}, status: decided}
  - {state: Draining/Held, event: analysis.sample, variants: [inconclusive], outcome: ignore, note: "an inconclusive sample under the default policy holds the gate; it is not a breach", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[A]/sample[inconclusive]"]}, status: decided}
  - {state: Draining/Held, event: analysis.sample, variants: [inconclusiveRollbackPolicy], outcome: transition, to: RollingBack, note: "under OnInconclusive=Rollback an unreadable gate is a rejection, at 100% as at any step", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[A]/sample[inconclusiveRollbackPolicy]"]}, status: decided}
  - {state: Draining/Held, event: analysis.sample, variants: [stalled], outcome: transition, to: Failed, note: "today an inconclusive stall past the timeout parks Failed with the marker AnalysisStalled and leaves the split where the gate held it, so the canary keeps serving everything, which is wrong because a park is meant to rest the traffic on the stable revision as the crash and capacity parks do", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[A]/sample[stalled]"]}, status: decided}
  - {state: Draining/Held, event: analysis.sample, variants: [stalledRollbackOnStall], outcome: transition, to: RollingBack, note: "under OnInconclusive=RollbackOnStall the stall reverts instead of parking, so an unreadable gate cannot leave the fleet split", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[A]/sample[stalledRollbackOnStall]"]}, status: decided}
  - {state: Draining/Held, event: analysis.unavailable, outcome: ignore, note: "no sampler wired holds silently rather than advance ungated, a source that cannot be built reads as an inconclusive sample, and a miss kicks a background query and holds for its result", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[A]/unavailable[noSampler]", "TestReconcileCells/canary/Draining[A]/unavailable[sourceError]", "TestReconcileCells/canary/Draining[A]/unavailable[noFreshSample]"]}, status: decided}
  - {state: Draining/Held, event: pod.canaryCrashed, outcome: transition, to: Failed, note: "the ladder parks at the final step; the traffic returns to the held stable instance", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/canaryCrashed"]}, status: decided}
  - {state: Draining/Held, event: pod.canaryRestarted, outcome: ignore, note: "a timed or analysis final gate re-anchors its soak on the newest restart; a bare pause is unmoved", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/canaryRestarted"]}, status: decided}
  - {state: Draining/Held, event: pod.canaryDeleted, outcome: ignore, note: "a pod on its way out is a dip the held gate waits through, not a crash", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/canaryPodDeleted"]}, status: decided}
  - {state: Draining/Held, event: record.legacy, variants: [noTargetID], outcome: ignore, note: "a record with no target id under a pinned run adopts the run's id in place and keeps its step and gate", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/record[noTargetID]"]}, status: decided}
  - {state: Draining/Held, event: record.legacy, variants: [stableEqualsCanary], outcome: ignore, note: "a pair whose stable equals its canary hash is repaired from the replica's distinct current revision when the pass supplies one; the gate holds", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/record[stableEqualsCanary]"]}, status: decided}
  - {state: Draining/Held, event: record.legacy, variants: [noStable], outcome: ignore, note: "backfilled from the observed stable revision and then never re-inferred", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/record[noStable]"]}, status: decided}
  - {state: Draining/Held, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "a negative step is read back from the record: the recorded 100% places it at the final step, whose gate goes on holding the drain behind the traffic the ladder already shifted", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/record[negativeStep]"]}, status: decided}
  - {state: Draining/Held, event: record.legacy, variants: [failedPhaseNoMarker], outcome: transition, to: Failed, note: "a Failed phase with no marker still parks; the hold re-projects the phase and leaves the split as the gate held it", invariants: [phase.is.input], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/record[failedPhaseNoMarker]"]}, status: decided}
  - {state: Draining/Held, event: pass.resync, outcome: ignore, note: "the gate holds and the unit reads Paused at 100%", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/gateHolds"]}, status: decided}
  - {state: Draining/Held, event: pass.staleRecord, outcome: defer, note: "the flush finds the live record past the pass's base, keeps the live record, phase and traffic and marks the pass stale, so its verbs are not consumed and it requeues", placement: sim, coverage: {replay: [draining-held-stale-record-and-lost-policy]}, status: decided}
