# Draining and Draining/Held: the final step shifted 100% of the traffic.
# Draining is the ungated drain inside its window with the capacity full;
# Draining/Held is the same shift behind a final gate that still holds. The
# release follows the window and the gate, never the step entry.
cells:
  - {state: Draining, event: verb.pause, outcome: ignore, note: "the pass observes only: the drain clock is left as it is, so the window keeps elapsing under the pause", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/pause"]}, status: decided}
  - {state: Draining, event: verb.unpause, outcome: ignore, note: "the drain resumes; a window that elapsed under the pause releases on the first pass after it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/unpause"]}, status: current}
  - {state: Draining, event: verb.promote, variants: [match], outcome: ignore, note: "an ungated final step has no gate for a promote to open; the promote stays live, unconsumed, for the release to record", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/promote"]}, status: current}
  - {state: Draining, event: verb.promote, variants: [stale], outcome: ignore, note: "another value opens nothing", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/promote[stale]"]}, status: current}
  - {state: Draining, event: verb.promote, variants: [applied], outcome: ignore, note: "the applied copy is inert and handed back for removal", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/promote[applied]"]}, status: current}
  - {state: Draining, event: verb.promoteForce, variants: [match], outcome: ignore, note: "the drain keeps running under the force: no clock, no park, and the force stays live until the completion edge records it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/promoteForce"]}, status: decided}
  - {state: Draining, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "another value lifts nothing", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/promoteForce[stale]"]}, status: current}
  - {state: Draining, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "the applied copy is inert and handed back for removal", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/promoteForce[applied]"]}, status: current}
  - {state: Draining, event: verb.rollback, variants: [stableServes], windows: [before], outcome: transition, to: RollingBack, note: "the rejection is recorded; traffic returns to the held stable instance as it serves and the canary pods drain", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/rollback"]}, status: decided}
  - {state: Draining, event: verb.rollback, variants: [stableServes], windows: [boundary, after], outcome: ignore, note: "the recorded rejection keeps a re-shown request inert", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/rollback[reshown]"]}, status: current}
  - {state: Draining, event: verb.rollback, variants: [stableEmpty], outcome: DECIDE, to: RollingBack, note: "today: the operator's rollback proceeds toward an empty stable revision with a warning. Question: as Staging/verb.rollback[stableEmpty].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/rollback[stableEmpty]"]}, status: current}
  - {state: Draining, event: verb.resume, variants: [own], outcome: reject, note: "nothing is parked: consumed silently", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/resume"]}, status: decided}
  - {state: Draining, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary: removed with a warning", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/resume[stale]"]}, status: current}
  - {state: Draining, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "left for the unit that owns it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/resume[otherUnit]"]}, status: current}
  - {state: Draining, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "the index clamps onto the new ladder's last step; the drain continues under it", placement: unit, status: current}
  - {state: Draining, event: plan.drift, outcome: ignore, note: "the pinned plan executes", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/planDrift"]}, status: current}
  - {state: Draining, event: plan.unresolved, outcome: DECIDE, note: "today: the unit is not dispatched; the drain freezes at 100% with the stable instance held. Question: as Staging/plan.unresolved.", placement: unit, status: current}
  - {state: Draining, event: run.lost, outcome: ignore, note: "the unit holds in the drain with a CanaryRunLost warning; the release is not read without a pinned run", invariants: [unpinned.never.steps], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/runLost"]}, status: current}
  - {state: Draining, event: run.adopted, outcome: ignore, note: "the target id is attached; the drain clock is kept", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/runAdopted"]}, status: current}
  - {state: Draining, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "the record is reset to step 0 toward the new target with the stable identity preserved", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/newTarget"]}, status: decided}
  - {state: Draining, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "the bind resets the record toward the new run's target", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/newTarget[runOpen]"]}, status: current}
  - {state: Draining, event: capacity.dropped, outcome: transition, to: Draining/ShortInWindow, note: "a drain is exempt from the capacity hold, so the phase stays Promoting and the split follows the pods that serve; the wait is clocked and the release will be read on a count taken with the capacity back", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/capacityDropped"]}, status: decided}
  - {state: Draining, event: spec.replicas, outcome: ignore, note: "the held floor and the full capacity the release waits for are recomputed", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/replicasUp"]}, status: current}
  - {state: Draining, event: timer.drainElapsed, outcome: transition, to: Done/Rolling, note: "the window elapsed with the capacity Ready: the promote record is taken, the sentinel set, the cutover traffic written and partition 0 released; the unit is not Stable until the held instance has rolled", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/drainElapsed"]}, status: decided}
  - {state: Draining, event: pod.canaryCrashed, outcome: transition, to: Failed, note: "the ladder parks at the final step; the traffic returns to the held stable instance", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/canaryCrashed"]}, status: decided}
  - {state: Draining, event: pod.canaryRestarted, outcome: ignore, note: "an ungated drain has no soak to re-anchor", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/canaryRestarted"]}, status: current}
  - {state: Draining, event: pod.canaryDeleted, outcome: transition, to: Draining/ShortInWindow, note: "a pod on its way out is a dip in the drain: the capacity wait is clocked and the split follows the pods", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/canaryPodDeleted"]}, status: current}
  - {state: Draining, event: record.legacy, variants: [noTargetID], outcome: DECIDE, note: "today: adopted in place. Question: as Staging/record.legacy[noTargetID].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/record[noTargetID]"]}, status: current}
  - {state: Draining, event: record.legacy, variants: [stableEqualsCanary], outcome: DECIDE, note: "today: repaired from the replica's distinct current revision. Question: as Staging/record.legacy[stableEqualsCanary].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/record[stableEqualsCanary]"]}, status: current}
  - {state: Draining, event: record.legacy, variants: [noStable], outcome: ignore, note: "backfilled from the observed stable revision; a unit with no stable identity at the sentinel reads Stable at once", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/record[noStable]"]}, status: current}
  - {state: Draining, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "clamped to 0", placement: unit, status: current}
  - {state: Draining, event: record.legacy, variants: [failedPhaseNoMarker], outcome: transition, to: Failed, note: "a Failed phase with no marker still parks", invariants: [phase.is.input], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/record[failedPhaseNoMarker]"]}, status: current}
  - {state: Draining, event: pass.resync, outcome: ignore, note: "the drain runs on; the window is re-read against the shift instant", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/resync"]}, status: decided}
  - {state: Draining, event: pass.staleRecord, outcome: defer, note: "the flush keeps the live record and the pass requeues", placement: sim, status: current}
  # --- Draining/Held ---------------------------------------------------------------
  - {state: Draining/Held, event: verb.pause, outcome: ignore, note: "the pass observes only; the gate's clocks are left as they are", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/pause"]}, status: current}
  - {state: Draining/Held, event: verb.unpause, outcome: ignore, note: "the gate resumes deciding", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/unpause"]}, status: current}
  - {state: Draining/Held, event: verb.promote, variants: [match], windows: [before], outcome: transition, to: Draining, note: "the final gate opens and the drain continues; the release follows in the same pass when the window has already elapsed, as in the cited row where the window is nil, and the promote is recorded at that edge", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/promote"]}, status: decided}
  - {state: Draining/Held, event: verb.promote, variants: [match], windows: [boundary, after], outcome: ignore, note: "the final step re-reads a live promote on every pass until the release records it; a copy re-shown after the release is inert by PromotedThrough", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/promote[reshown]"]}, status: current}
  - {state: Draining/Held, event: verb.promote, variants: [stale], outcome: ignore, note: "another value opens nothing; the gate holds", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/promote[stale]"]}, status: current}
  - {state: Draining/Held, event: verb.promote, variants: [applied], outcome: ignore, note: "the applied copy is inert and handed back for removal", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/promote[applied]"]}, status: current}
  - {state: Draining/Held, event: verb.promoteForce, variants: [match], windows: [before], outcome: transition, to: Draining, note: "a force opens the final gate like a promote; the release follows in the same pass when the window has elapsed", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/promoteForce"]}, status: decided}
  - {state: Draining/Held, event: verb.promoteForce, variants: [match], windows: [boundary, after], outcome: ignore, note: "live until the release records it; inert afterwards", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/promoteForce[reshown]"]}, status: current}
  - {state: Draining/Held, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "another value opens nothing", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/promoteForce[stale]"]}, status: current}
  - {state: Draining/Held, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "the applied copy is inert", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/promoteForce[applied]"]}, status: current}
  - {state: Draining/Held, event: verb.rollback, variants: [stableServes], windows: [before], outcome: transition, to: RollingBack, note: "the rejection is recorded and the canary pods drain back to the held stable instance", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/rollback"]}, status: current}
  - {state: Draining/Held, event: verb.rollback, variants: [stableServes], windows: [boundary, after], outcome: ignore, note: "the recorded rejection keeps a re-shown request inert", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/rollback[reshown]"]}, status: current}
  - {state: Draining/Held, event: verb.rollback, variants: [stableEmpty], outcome: DECIDE, to: RollingBack, note: "today: the operator's rollback proceeds toward an empty stable revision with a warning. Question: as Staging/verb.rollback[stableEmpty].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/rollback[stableEmpty]"]}, status: current}
  - {state: Draining/Held, event: verb.resume, variants: [own], outcome: reject, note: "nothing is parked: consumed silently", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/resume"]}, status: current}
  - {state: Draining/Held, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary: removed with a warning", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/resume[stale]"]}, status: current}
  - {state: Draining/Held, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "left for the unit that owns it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/resume[otherUnit]"]}, status: current}
  - {state: Draining/Held, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "the index clamps onto the new ladder's last step and that step's gate decides", placement: unit, status: current}
  - {state: Draining/Held, event: plan.drift, outcome: ignore, note: "the pinned plan executes", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/planDrift"]}, status: current}
  - {state: Draining/Held, event: plan.unresolved, outcome: DECIDE, note: "today: the unit is not dispatched; the held gate freezes at 100%. Question: as Staging/plan.unresolved.", placement: unit, status: current}
  - {state: Draining/Held, event: run.lost, outcome: ignore, note: "the unit holds with a CanaryRunLost warning; the gate is not evaluated without a pinned run", invariants: [unpinned.never.steps], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/runLost"]}, status: current}
  - {state: Draining/Held, event: run.adopted, outcome: ignore, note: "the target id is attached; the gate's clocks are kept", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/runAdopted"]}, status: current}
  - {state: Draining/Held, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "the record is reset to step 0 toward the new target", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/newTarget"]}, status: current}
  - {state: Draining/Held, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "the bind resets the record toward the new run's target", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/newTarget[runOpen]"]}, status: current}
  - {state: Draining/Held, event: capacity.dropped, outcome: ignore, note: "a drain is exempt from the capacity hold: the gate keeps deciding and the release behind it waits for the capacity; the split follows the pods that serve", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/capacityDropped"]}, status: current}
  - {state: Draining/Held, event: spec.replicas, outcome: ignore, note: "the held floor and the release's full capacity are recomputed", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/replicasUp"]}, status: current}
  - {state: Draining/Held, event: timer.pauseElapsed, variants: [elapsed, restartSoaked], outcome: transition, to: Draining, note: "the final step's timed Pause elapsed since the 100% shift (or since the newest canary pod restart): the gate opens and the drain continues toward the release", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[T]/pauseElapsed", "TestReconcileCells/canary/Draining[T]/pauseElapsed[restartSoaked]"]}, status: current}
  - {state: Draining/Held, event: timer.pauseElapsed, variants: [restartInSoak], outcome: ignore, note: "a canary pod restarted inside the soak has not served a full soak; the gate holds", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[T]/pauseElapsed[restartInSoak]"]}, status: current}
  - {state: Draining/Held, event: timer.drainElapsed, outcome: ignore, note: "the window is read only after the gate opens; elapsing behind a held gate changes nothing until then", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/drainElapsed"]}, status: current}
  - {state: Draining/Held, event: analysis.sample, variants: [pass], outcome: DECIDE, note: "today: a passing sample inside the bake window holds the gate at 100%. Question: should the grid pin an analysis-gated final step, which today is decided in promotion.go and reconciler.go alone?", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[A]/sample[pass]"]}, status: current}
  - {state: Draining/Held, event: analysis.sample, variants: [passBaked], outcome: DECIDE, to: Draining, note: "today: a passing sample past the bake window opens the gate into the drain. Question: as analysis.sample[pass].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[A]/sample[passBaked]"]}, status: current}
  - {state: Draining/Held, event: analysis.sample, variants: [fail], outcome: DECIDE, note: "today: a breach at 100% counts one failing check and the gate holds. Question: as analysis.sample[pass].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[A]/sample[fail]"]}, status: current}
  - {state: Draining/Held, event: analysis.sample, variants: [failAtLimit], outcome: DECIDE, to: RollingBack, note: "today: a breach at the limit inside the drain window rolls back: the rejection is recorded and the canary pods drain back to the held stable instance. Question: as analysis.sample[pass].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[A]/sample[failAtLimit]"]}, status: current}
  - {state: Draining/Held, event: analysis.sample, variants: [failAtLimitStableEmpty], outcome: DECIDE, to: Failed/StableMissing, note: "today: a gate-decided rollback whose stable revision runs no live Instance parks with the marker StableRevisionMissing and signals no revert. Question: as Serving/Analysis/analysis.sample[failAtLimitStableEmpty].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[A]/sample[failAtLimitStableEmpty]"]}, status: current}
  - {state: Draining/Held, event: analysis.sample, variants: [inconclusive], outcome: DECIDE, note: "today: an inconclusive sample under the default policy holds the gate. Question: as analysis.sample[pass].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[A]/sample[inconclusive]"]}, status: current}
  - {state: Draining/Held, event: analysis.sample, variants: [inconclusiveRollbackPolicy], outcome: DECIDE, to: RollingBack, note: "today: an inconclusive sample under OnInconclusive=Rollback rolls back at 100%. Question: as analysis.sample[pass].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[A]/sample[inconclusiveRollbackPolicy]"]}, status: current}
  - {state: Draining/Held, event: analysis.sample, variants: [stalled], outcome: DECIDE, to: Failed, note: "today: an inconclusive stall at 100% parks Failed with the marker AnalysisStalled and the canary serving everything. Question: as analysis.sample[pass], and should a stall park at 100% traffic rather than return the traffic to stable?", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[A]/sample[stalled]"]}, status: current}
  - {state: Draining/Held, event: analysis.sample, variants: [stalledRollbackOnStall], outcome: DECIDE, to: RollingBack, note: "today: a stall under OnInconclusive=RollbackOnStall rolls back. Question: as analysis.sample[pass].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[A]/sample[stalledRollbackOnStall]"]}, status: current}
  - {state: Draining/Held, event: analysis.unavailable, outcome: DECIDE, note: "today: as Serving/Analysis: no sampler holds silently, a source error reads inconclusive, a miss kicks a background query. Question: as Serving/Analysis/analysis.unavailable.", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[A]/unavailable[noSampler]", "TestReconcileCells/canary/Draining[A]/unavailable[sourceError]", "TestReconcileCells/canary/Draining[A]/unavailable[noFreshSample]"]}, status: current}
  - {state: Draining/Held, event: pod.canaryCrashed, outcome: transition, to: Failed, note: "the ladder parks at the final step; the traffic returns to the held stable instance", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/canaryCrashed"]}, status: current}
  - {state: Draining/Held, event: pod.canaryRestarted, outcome: ignore, note: "a timed or analysis final gate re-anchors on the newest restart; a bare pause is unmoved", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/canaryRestarted"]}, status: current}
  - {state: Draining/Held, event: pod.canaryDeleted, outcome: ignore, note: "a pod on its way out is a dip the held gate waits through", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/canaryPodDeleted"]}, status: current}
  - {state: Draining/Held, event: record.legacy, variants: [noTargetID], outcome: DECIDE, note: "today: adopted in place. Question: as Staging/record.legacy[noTargetID].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/record[noTargetID]"]}, status: current}
  - {state: Draining/Held, event: record.legacy, variants: [stableEqualsCanary], outcome: DECIDE, note: "today: repaired from the replica's distinct current revision. Question: as Staging/record.legacy[stableEqualsCanary].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/record[stableEqualsCanary]"]}, status: current}
  - {state: Draining/Held, event: record.legacy, variants: [noStable], outcome: ignore, note: "backfilled from the observed stable revision", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/record[noStable]"]}, status: current}
  - {state: Draining/Held, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "clamped to 0", placement: unit, status: current}
  - {state: Draining/Held, event: record.legacy, variants: [failedPhaseNoMarker], outcome: transition, to: Failed, note: "a Failed phase with no marker still parks", invariants: [phase.is.input], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/record[failedPhaseNoMarker]"]}, status: current}
  - {state: Draining/Held, event: pass.resync, outcome: ignore, note: "the gate holds and the unit reads Paused at 100%", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[M]/gateHolds"]}, status: decided}
  - {state: Draining/Held, event: pass.staleRecord, outcome: defer, note: "the flush keeps the live record and the pass requeues", placement: sim, status: current}
