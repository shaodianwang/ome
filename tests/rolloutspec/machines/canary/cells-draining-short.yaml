# Draining/ShortInWindow and Draining/ShortElapsed: the final step shifted
# 100% and a canary pod has since been lost. Inside the window the drain
# runs on; past it the release waits for the capacity with the stable
# instance still held, inside the ready timeout clocked from the dip.
cells:
  - {state: Draining/ShortInWindow, event: verb.pause, outcome: ignore, note: "the pass observes only; the wait and drain clocks keep counting", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/pause"]}, status: current}
  - {state: Draining/ShortInWindow, event: verb.unpause, outcome: ignore, note: "the drain resumes with its clocks as the pause left them", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/unpause"]}, status: current}
  - {state: Draining/ShortInWindow, event: verb.promote, variants: [match], outcome: ignore, note: "an ungated final step has no gate to open; the promote stays live for the release to record", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/promote"]}, status: current}
  - {state: Draining/ShortInWindow, event: verb.promote, variants: [stale], outcome: ignore, note: "another value opens nothing", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/promote[stale]"]}, status: current}
  - {state: Draining/ShortInWindow, event: verb.promote, variants: [applied], outcome: ignore, note: "the applied copy is inert and handed back for removal", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/promote[applied]"]}, status: current}
  - {state: Draining/ShortInWindow, event: verb.promoteForce, variants: [match], outcome: ignore, note: "the force lifts the wait's clock so the dip cannot park the drain; the force stays live until the release records it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/promoteForce"]}, status: current}
  - {state: Draining/ShortInWindow, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "another value lifts nothing", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/promoteForce[stale]"]}, status: current}
  - {state: Draining/ShortInWindow, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "the applied copy is inert", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/promoteForce[applied]"]}, status: current}
  - {state: Draining/ShortInWindow, event: verb.rollback, variants: [stableServes], windows: [before], outcome: transition, to: RollingBack, note: "the rejection is recorded; traffic returns to the held stable instance and the canary pods drain", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/rollback"]}, status: current}
  - {state: Draining/ShortInWindow, event: verb.rollback, variants: [stableServes], windows: [boundary, after], outcome: ignore, note: "the recorded rejection keeps a re-shown request inert", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/rollback[reshown]"]}, status: current}
  - {state: Draining/ShortInWindow, event: verb.rollback, variants: [stableEmpty], outcome: DECIDE, to: RollingBack, note: "today: the operator's rollback proceeds toward an empty stable revision with a warning. Question: as Staging/verb.rollback[stableEmpty].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/rollback[stableEmpty]"]}, status: current}
  - {state: Draining/ShortInWindow, event: verb.resume, variants: [own], outcome: reject, note: "nothing is parked: consumed silently", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/resume"]}, status: current}
  - {state: Draining/ShortInWindow, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary: removed with a warning", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/resume[stale]"]}, status: current}
  - {state: Draining/ShortInWindow, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "left for the unit that owns it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/resume[otherUnit]"]}, status: current}
  - {state: Draining/ShortInWindow, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "the index clamps onto the new ladder's last step; the drain continues", placement: unit, status: current}
  - {state: Draining/ShortInWindow, event: plan.drift, outcome: ignore, note: "the pinned plan executes", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/planDrift"]}, status: current}
  - {state: Draining/ShortInWindow, event: plan.unresolved, outcome: DECIDE, note: "today: the unit is not dispatched; the drain freezes short of its capacity. Question: as Staging/plan.unresolved.", placement: unit, status: current}
  - {state: Draining/ShortInWindow, event: run.lost, outcome: ignore, note: "the unit holds in the drain with a CanaryRunLost warning", invariants: [unpinned.never.steps], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/runLost"]}, status: current}
  - {state: Draining/ShortInWindow, event: run.adopted, outcome: ignore, note: "the target id is attached; the clocks are kept", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/runAdopted"]}, status: current}
  - {state: Draining/ShortInWindow, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "the record is reset to step 0 toward the new target", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/newTarget"]}, status: current}
  - {state: Draining/ShortInWindow, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "the bind resets the record toward the new run's target", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/newTarget[runOpen]"]}, status: current}
  - {state: Draining/ShortInWindow, event: capacity.reached, outcome: transition, to: Draining, note: "the capacity is back inside the window: the wait clears and the drain resumes toward its release", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/capacityReached"]}, status: decided}
  - {state: Draining/ShortInWindow, event: spec.replicas, outcome: ignore, note: "the held floor and the release's full capacity are recomputed", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/replicasUp"]}, status: current}
  - {state: Draining/ShortInWindow, event: timer.readyTimeout, outcome: transition, to: Failed, note: "the wait, clocked from the dip, outlived the ready timeout inside the window: the park keeps the final step and the held stable instance and returns the traffic to it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/readyTimeout"]}, status: decided}
  - {state: Draining/ShortInWindow, event: timer.drainElapsed, outcome: transition, to: Draining/ShortElapsed, note: "the window elapsed while the capacity is short: the release waits for the capacity with the stable instance still held", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/capacityDropped[drainElapsed]"]}, status: decided}
  - {state: Draining/ShortInWindow, event: pod.canaryCrashed, outcome: transition, to: Failed, note: "the ladder parks at the final step; the traffic returns to the held stable instance", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/canaryCrashed"]}, status: current}
  - {state: Draining/ShortInWindow, event: pod.canaryRestarted, outcome: ignore, note: "an ungated drain has no soak to re-anchor", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/canaryRestarted"]}, status: current}
  - {state: Draining/ShortInWindow, event: pod.canaryDeleted, outcome: ignore, note: "a further pod on its way out deepens the dip; the wait keeps its clock", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/canaryPodDeleted"]}, status: current}
  - {state: Draining/ShortInWindow, event: record.legacy, variants: [noTargetID], outcome: DECIDE, note: "today: adopted in place. Question: as Staging/record.legacy[noTargetID].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/record[noTargetID]"]}, status: current}
  - {state: Draining/ShortInWindow, event: record.legacy, variants: [stableEqualsCanary], outcome: DECIDE, note: "today: repaired from the replica's distinct current revision. Question: as Staging/record.legacy[stableEqualsCanary].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/record[stableEqualsCanary]"]}, status: current}
  - {state: Draining/ShortInWindow, event: record.legacy, variants: [noStable], outcome: ignore, note: "backfilled from the observed stable revision", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/record[noStable]"]}, status: current}
  - {state: Draining/ShortInWindow, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "clamped to 0", placement: unit, status: current}
  - {state: Draining/ShortInWindow, event: record.legacy, variants: [failedPhaseNoMarker], outcome: transition, to: Failed, note: "a Failed phase with no marker still parks", invariants: [phase.is.input], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/record[failedPhaseNoMarker]"]}, status: current}
  - {state: Draining/ShortInWindow, event: pass.resync, outcome: ignore, note: "the drain runs on with the capacity short; the release is not read before the window elapses", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/resync"]}, status: decided}
  - {state: Draining/ShortInWindow, event: pass.staleRecord, outcome: defer, note: "the flush keeps the live record and the pass requeues", placement: sim, status: current}
  # --- Draining/ShortElapsed --------------------------------------------------------
  - {state: Draining/ShortElapsed, event: verb.pause, outcome: ignore, note: "the pass observes only; the wait clock keeps counting", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/pause"]}, status: decided}
