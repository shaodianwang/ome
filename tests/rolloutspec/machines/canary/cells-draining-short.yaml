  - {state: Draining/ShortElapsed, event: capacity.reached, outcome: transition, to: Done/Rolling, note: "the capacity the release waited for is back: the pass reads it and releases the held instance", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/capacityReached"]}, status: decided}
  - {state: Draining/ShortElapsed, event: spec.replicas, outcome: ignore, note: "the held floor and the release's full capacity are recomputed", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/replicasUp"]}, status: current}
