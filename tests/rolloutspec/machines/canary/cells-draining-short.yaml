  - {state: Draining/ShortElapsed, event: verb.promoteForce, variants: [match], outcome: ignore, note: "the force lifts the wait: no clock, no park even past the ready timeout; the release still waits for the capacity and the force stays live until it records it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/promoteForce", "TestReconcileCells/canary/Draining[capacityShort]/promoteForce[pastTimeout]"]}, status: decided}
  - {state: Draining/ShortElapsed, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "another value lifts nothing", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/promoteForce[stale]"]}, status: current}
  - {state: Draining/ShortElapsed, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "the applied copy is inert", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/promoteForce[applied]"]}, status: current}
