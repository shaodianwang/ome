  - {state: Draining/ShortElapsed, event: verb.promoteForce, variants: [match], outcome: ignore, note: "the force lifts the wait: no clock, no park even past the ready timeout; the release still waits for the capacity and the force stays live until it records it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/promoteForce", "TestReconcileCells/canary/Draining[capacityShort]/promoteForce[pastTimeout]"]}, status: decided}
  - {state: Draining/ShortElapsed, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "a value naming another revision lifts nothing and is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/promoteForce[stale]"]}, status: decided}
  - {state: Draining/ShortElapsed, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "the applied copy is inert and handed back for removal", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/promoteForce[applied]"]}, status: decided}
  - {state: Draining/ShortElapsed, event: verb.rollback, variants: [stableServes], windows: [before], outcome: transition, to: RollingBack, note: "the rejection is recorded; traffic returns to the held stable instance and the canary pods drain", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/rollback"]}, status: decided}
  - {state: Draining/ShortElapsed, event: verb.rollback, variants: [stableServes], windows: [boundary, after], outcome: ignore, note: "the recorded rejection keeps a re-shown request inert", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/rollback[reshown]"]}, status: decided}
  - {state: Draining/ShortElapsed, event: verb.rollback, variants: [stableEmpty], outcome: transition, to: RollingBack, note: "the request is the operator's decision, so it proceeds where a gate-decided rollback would park: the rejection is recorded with a warning naming the member whose stable revision runs no Instance, and the revert rebuilds every Instance of it onto that revision", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/rollback[stableEmpty]"]}, status: decided}
  - {state: Draining/ShortElapsed, event: verb.resume, variants: [own], outcome: reject, note: "nothing is parked: consumed silently", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/resume"]}, status: decided}
  - {state: Draining/ShortElapsed, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary: removed with a warning", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/resume[stale]"]}, status: decided}
  - {state: Draining/ShortElapsed, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "left for the unit that owns it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/resume[otherUnit]"]}, status: decided}
  - {state: Draining/ShortElapsed, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "the run layer clamps the index onto the new ladder's last step at the recorded weight, so no hold is armed; the release keeps waiting for the capacity with the wait clock kept", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/repin[holdOrTighten]"]}, status: decided}
  - {state: Draining/ShortElapsed, event: plan.drift, outcome: ignore, note: "the pinned plan executes", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/planDrift"]}, status: decided}
  - {state: Draining/ShortElapsed, event: plan.unresolved, outcome: ignore, note: "with no pin and no body the run layer parks the plan with a warning and the unit is not dispatched: the projection holds every Instance where it stands and the release is never read, the wait clock standing until a body resolves", placement: unit, coverage: {replay: [draining-short-elapsed-loses-policy]}, status: decided}
  - {state: Draining/ShortElapsed, event: run.lost, outcome: ignore, note: "the unit holds with a CanaryRunLost warning; the release is not read without a pinned run", invariants: [unpinned.never.steps], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/runLost"]}, status: decided}
  - {state: Draining/ShortElapsed, event: run.adopted, outcome: ignore, note: "the bind attaches the run's target id without a reset; the clocks are kept", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/runAdopted"]}, status: decided}
  - {state: Draining/ShortElapsed, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "the record is reset to step 0 toward the new target with the stable identity preserved", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/newTarget"]}, status: decided}
  - {state: Draining/ShortElapsed, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "the bind resets the record toward the new run's target", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/newTarget[runOpen]"]}, status: decided}
  - {state: Draining/ShortElapsed, event: capacity.reached, outcome: transition, to: Done/Rolling, note: "the capacity the release waited for is back: the pass reads it and releases the held instance", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/capacityReached"]}, status: decided}
  - {state: Draining/ShortElapsed, event: spec.replicas, outcome: ignore, note: "the held floor and the release's full capacity are recomputed from the new count; the wait keeps its clock", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/replicasUp"]}, status: decided}
