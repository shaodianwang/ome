  - {state: Draining/ShortElapsed, event: verb.rollback, variants: [stableServes], windows: [boundary, after], outcome: ignore, note: "the recorded rejection keeps a re-shown request inert", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/rollback[reshown]"]}, status: current}
  - {state: Draining/ShortElapsed, event: verb.rollback, variants: [stableEmpty], outcome: DECIDE, to: RollingBack, note: "today: the operator's rollback proceeds toward an empty stable revision with a warning. Question: as Staging/verb.rollback[stableEmpty].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/rollback[stableEmpty]"]}, status: current}
  - {state: Draining/ShortElapsed, event: verb.resume, variants: [own], outcome: reject, note: "nothing is parked: consumed silently", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/resume"]}, status: decided}
  - {state: Draining/ShortElapsed, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary: removed with a warning", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/resume[stale]"]}, status: current}
  - {state: Draining/ShortElapsed, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "left for the unit that owns it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/resume[otherUnit]"]}, status: current}
  - {state: Draining/ShortElapsed, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "the index clamps onto the new ladder's last step; the wait continues", placement: unit, status: current}
  - {state: Draining/ShortElapsed, event: plan.drift, outcome: ignore, note: "the pinned plan executes", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/planDrift"]}, status: current}
