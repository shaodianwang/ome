# Draining/ShortInWindow and Draining/ShortElapsed: the final step shifted
# 100% and a canary pod has since been lost. Inside the window the drain
# runs on; past it the release waits for the capacity with the stable
# instance still held, inside the ready timeout clocked from the dip.
cells:
  - {state: Draining/ShortInWindow, event: verb.pause, outcome: ignore, note: "the pass observes only; the wait and drain clocks keep counting under the pause", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/pause"]}, status: decided}
  - {state: Draining/ShortInWindow, event: verb.unpause, outcome: ignore, note: "the drain resumes with its clocks as the pause left them", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/unpause"]}, status: decided}
  - {state: Draining/ShortInWindow, event: verb.promote, variants: [match], outcome: ignore, note: "an ungated final step has no gate to open; the promote stays live, unconsumed, for the release to record", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/promote"]}, status: decided}
  - {state: Draining/ShortInWindow, event: verb.promote, variants: [stale], outcome: ignore, note: "a value naming another revision opens nothing and is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/promote[stale]"]}, status: decided}
  - {state: Draining/ShortInWindow, event: verb.promote, variants: [applied], outcome: ignore, note: "the applied copy matches PromotedThrough, so it is inert and handed back for removal", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/promote[applied]"]}, status: decided}
  - {state: Draining/ShortInWindow, event: verb.promoteForce, variants: [match], outcome: ignore, note: "the force lifts the wait's clock so the dip cannot park the drain; the release still waits for the capacity and the force stays live until it records it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/promoteForce"]}, status: decided}
  - {state: Draining/ShortInWindow, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "a value naming another revision lifts nothing and is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/promoteForce[stale]"]}, status: decided}
  - {state: Draining/ShortInWindow, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "the applied copy is inert and handed back for removal", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/promoteForce[applied]"]}, status: decided}
  - {state: Draining/ShortInWindow, event: verb.rollback, variants: [stableServes], windows: [before], outcome: transition, to: RollingBack, note: "the rejection is recorded; traffic returns to the held stable instance and the canary pods drain", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/rollback"]}, status: decided}
  - {state: Draining/ShortInWindow, event: verb.rollback, variants: [stableServes], windows: [boundary, after], outcome: ignore, note: "the recorded rejection keeps a re-shown request inert", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/rollback[reshown]"]}, status: decided}
  - {state: Draining/ShortInWindow, event: verb.rollback, variants: [stableEmpty], outcome: transition, to: RollingBack, note: "the request is the operator's decision, so it proceeds where a gate-decided rollback would park: the rejection is recorded with a warning naming the member whose stable revision runs no Instance, and the revert rebuilds every Instance of it onto that revision", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/rollback[stableEmpty]"]}, status: decided}
  - {state: Draining/ShortInWindow, event: verb.resume, variants: [own], outcome: reject, note: "nothing is parked: consumed silently", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/resume"]}, status: decided}
  - {state: Draining/ShortInWindow, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary: removed with a warning", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/resume[stale]"]}, status: decided}
  - {state: Draining/ShortInWindow, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "left for the unit that owns it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/resume[otherUnit]"]}, status: decided}
  - {state: Draining/ShortInWindow, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "the run layer clamps the index onto the new ladder's last step at the recorded weight, so no hold is armed; the drain continues short of its capacity with the wait clock kept", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/repin[holdOrTighten]"]}, status: decided}
  - {state: Draining/ShortInWindow, event: plan.drift, outcome: ignore, note: "the pinned plan executes", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/planDrift"]}, status: decided}
  - {state: Draining/ShortInWindow, event: plan.unresolved, outcome: ignore, note: "with no pin and no body the run layer parks the plan with a warning and the unit is not dispatched: the projection holds every Instance where it stands and the drain freezes short of its capacity, its wait clock standing until a body resolves", placement: unit, coverage: {replay: [draining-short-in-window-loses-policy]}, status: decided}
  - {state: Draining/ShortInWindow, event: run.lost, outcome: ignore, note: "the unit holds in the drain with a CanaryRunLost warning; neither the wait nor the release is read without a pinned run", invariants: [unpinned.never.steps], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/runLost"]}, status: decided}
  - {state: Draining/ShortInWindow, event: run.adopted, outcome: ignore, note: "the bind attaches the run's target id without a reset; the clocks are kept", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/runAdopted"]}, status: decided}
  - {state: Draining/ShortInWindow, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "the record is reset to step 0 toward the new target with the stable identity preserved", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/newTarget"]}, status: decided}
  - {state: Draining/ShortInWindow, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "the bind resets the record toward the new run's target", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/newTarget[runOpen]"]}, status: decided}
  - {state: Draining/ShortInWindow, event: capacity.reached, outcome: transition, to: Draining, note: "the capacity is back inside the window: the wait clears and the drain resumes toward its release", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/capacityReached"]}, status: decided}
  - {state: Draining/ShortInWindow, event: spec.replicas, outcome: ignore, note: "the held floor and the release's full capacity are recomputed from the new count; the wait keeps its clock", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/replicasUp"]}, status: decided}
  - {state: Draining/ShortInWindow, event: timer.readyTimeout, outcome: transition, to: Failed, note: "the wait, clocked from the dip, outlived the ready timeout inside the window: the park keeps the final step and the held stable instance and returns the traffic to it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/readyTimeout"]}, status: decided}
  - {state: Draining/ShortInWindow, event: timer.drainElapsed, outcome: transition, to: Draining/ShortElapsed, note: "the window elapsed while the capacity is short: the release waits for the capacity with the stable instance still held", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining/capacityDropped[drainElapsed]"]}, status: decided}
  - {state: Draining/ShortInWindow, event: pod.canaryCrashed, outcome: transition, to: Failed, note: "the ladder parks at the final step; the traffic returns to the held stable instance", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/canaryCrashed"]}, status: decided}
  - {state: Draining/ShortInWindow, event: pod.canaryRestarted, outcome: ignore, note: "an ungated drain has no soak to re-anchor", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/canaryRestarted"]}, status: decided}
  - {state: Draining/ShortInWindow, event: pod.canaryDeleted, outcome: ignore, note: "a further pod on its way out deepens the dip; the wait keeps the clock the first dip started", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/canaryPodDeleted"]}, status: decided}
  - {state: Draining/ShortInWindow, event: record.legacy, variants: [noTargetID], outcome: ignore, note: "a record with no target id under a pinned run adopts the run's id in place and keeps its step", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/record[noTargetID]"]}, status: decided}
  - {state: Draining/ShortInWindow, event: record.legacy, variants: [stableEqualsCanary], outcome: ignore, note: "a pair whose stable equals its canary hash is repaired from the replica's distinct current revision when the pass supplies one", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/record[stableEqualsCanary]"]}, status: decided}
  - {state: Draining/ShortInWindow, event: record.legacy, variants: [noStable], outcome: ignore, note: "backfilled from the observed stable revision and then never re-inferred", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/record[noStable]"]}, status: decided}
  - {state: Draining/ShortInWindow, event: record.legacy, variants: [negativeStep], outcome: transition, to: Staging, note: "today a negative step is clamped to 0, which runs step 0 as a live step: its split is re-programmed over the drain's 100% and its gate decides, which is wrong because an invalid write should not move a drain off the traffic it already shifted", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/record[negativeStep]"]}, status: decided}
  - {state: Draining/ShortInWindow, event: record.legacy, variants: [failedPhaseNoMarker], outcome: transition, to: Failed, note: "a Failed phase with no marker still parks; the hold re-projects the phase", invariants: [phase.is.input], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/record[failedPhaseNoMarker]"]}, status: decided}
  - {state: Draining/ShortInWindow, event: pass.resync, outcome: ignore, note: "the drain runs on with the capacity short; the release is not read before the window elapses", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort,inWindow]/resync"]}, status: decided}
  - {state: Draining/ShortInWindow, event: pass.staleRecord, outcome: defer, note: "the flush compares the whole record, the wait clock included, so a pass that read the copy from before the dip keeps the live record and requeues without writing its decision", placement: sim, coverage: {unit: ["TestBaseKeepsALiveHoldOverAPassThatMissedItsClockOrPhase"]}, status: decided}
  # --- Draining/ShortElapsed --------------------------------------------------------
  - {state: Draining/ShortElapsed, event: verb.pause, outcome: ignore, note: "the pass observes only; the wait clock keeps counting", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/pause"]}, status: decided}
  - {state: Draining/ShortElapsed, event: verb.unpause, outcome: ignore, note: "the wait resumes with its clock as the pause left it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/unpause"]}, status: decided}
  - {state: Draining/ShortElapsed, event: verb.promote, variants: [match], outcome: ignore, note: "the step is ungated, so the gate never reads the promote, and the hold on capacity returns before the release records it: the promote stays live and unconsumed", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/promote"]}, status: decided}
  - {state: Draining/ShortElapsed, event: verb.promote, variants: [stale], outcome: ignore, note: "a value naming another revision opens nothing and is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/promote[stale]"]}, status: decided}
