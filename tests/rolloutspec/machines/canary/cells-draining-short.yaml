  - {state: Draining/ShortElapsed, event: pod.canaryRestarted, outcome: ignore, note: "an ungated drain has no soak to re-anchor", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/canaryRestarted"]}, status: decided}
