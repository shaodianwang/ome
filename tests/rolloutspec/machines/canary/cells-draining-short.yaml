  - {state: Draining/ShortElapsed, event: record.legacy, variants: [stableEqualsCanary], outcome: ignore, note: "a pair whose stable equals its canary hash is repaired from the replica's distinct current revision when the pass supplies one", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Draining[capacityShort]/record[stableEqualsCanary]"]}, status: decided}
