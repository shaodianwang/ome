# Serving/Analysis: an intermediate step's split serves under the metric
# gate. The grid's analysis fixture serves inside its bake window with one
# passing sample consumed; the gate cells cite its sample, unavailable and
# timer rows, and the replay lane drives the gate with no sampler wired.
cells:
  - {state: Serving/Analysis, event: verb.pause, outcome: ignore, note: "the pass observes only and leaves the sampling clocks, so the stall timeout keeps counting under the pause; a forced promote present is consumed with the reason so it cannot override the gate once the pause clears", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/pause"]}, status: decided}
  - {state: Serving/Analysis, event: verb.unpause, outcome: ignore, note: "sampling resumes on its interval; a stall that elapsed under the pause parks on the first pass after it, since the pause stopped no clock", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/unpause"]}, status: decided}
  - {state: Serving/Analysis, event: verb.promote, variants: [match], windows: [before], outcome: transition, to: Staging/Final, note: "a promote is the operator's decision on any gate and overrides the metric gate: the step advances with PromotedThrough recorded and the analysis budget reset (Staging when the next step is intermediate)", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/promote"]}, status: decided}
  - {state: Serving/Analysis, event: verb.promote, variants: [match], windows: [boundary, after], outcome: ignore, note: "a copy re-shown as or after the advance lands is inert by PromotedThrough and handed back for removal", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/promote[reshown]"]}, status: decided}
  - {state: Serving/Analysis, event: verb.promote, variants: [stale], outcome: ignore, note: "a value naming another revision opens nothing and is left in place; only the canary revision's hash is a promote of this ladder", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/promote[stale]"]}, status: decided}
  - {state: Serving/Analysis, event: verb.promote, variants: [applied], outcome: ignore, note: "the applied verb re-shown is inert by PromotedThrough and handed back for removal; the record clears once no key carries the value", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/promote[applied]"]}, status: decided}
  - {state: Serving/Analysis, event: verb.promoteForce, variants: [match], windows: [before], outcome: transition, to: Staging/Final, note: "a force at a served step is a promote and overrides the gate the same way: the step advances with PromotedThrough recorded and the budget reset", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/promoteForce"]}, status: decided}
  - {state: Serving/Analysis, event: verb.promoteForce, variants: [match], windows: [boundary, after], outcome: ignore, note: "inert by PromotedThrough once the advance lands; a force racing a rollback or a park is consumed with the reason so it cannot open a later gate", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/promoteForce[reshown]"]}, status: decided}
  - {state: Serving/Analysis, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "a value naming another revision lifts nothing and is left in place", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/promoteForce[stale]"]}, status: decided}
  - {state: Serving/Analysis, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "the applied force re-shown is inert by PromotedThrough and handed back for removal", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/promoteForce[applied]"]}, status: decided}
  - {state: Serving/Analysis, event: verb.rollback, variants: [stableServes], windows: [before], outcome: transition, to: RollingBack, note: "the rejection is recorded and the rejected pods drain; the operator's request runs ahead of the gate, so no sample is read on that pass", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/rollback"]}, status: decided}
  - {state: Serving/Analysis, event: verb.rollback, variants: [stableServes], windows: [boundary, after], outcome: ignore, note: "the recorded rejection is the record that the request was applied, so a copy re-shown after the flush is inert", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/rollback[reshown]"]}, status: decided}
  - {state: Serving/Analysis, event: verb.rollback, variants: [stableEmpty], outcome: transition, to: RollingBack, note: "the operator's rollback is the operator's decision: it proceeds toward a stable revision that runs no live Instance, with a CanaryStableRevisionEmpty warning, and the split it held stands until a stable pod serves again; only a gate-decided rollback parks on an empty stable", placement: unit, coverage: {unit: ["TestReconcile_OperatorRollbackToAnEmptyStableProceedsWithTheWarning", "TestReconcile_OperatorRollbackToAnEmptyStableFromEveryLiveState"]}, status: decided}
  - {state: Serving/Analysis, event: verb.resume, variants: [own], outcome: reject, note: "nothing is parked, so the verb is consumed silently ahead of the holds rather than left to fire at the next terminal hold", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/resume"]}, status: decided}
  - {state: Serving/Analysis, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary, parked or in flight: removed with a RolloutResumeRejected warning so it cannot fire on a later canary carrying the same hash", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/resume[stale]"]}, status: decided}
  - {state: Serving/Analysis, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "a bare hash is addressed to whichever unit's record carries it, so a value another unit's canary carries is left for that unit's dispatch", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/resume[otherUnit]"]}, status: decided}
  - {state: Serving/Analysis, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "the index clamps into the new ladder, the sampling state and failure budget are kept for the clamped step and the clamped weight is written on the same pass; no hold arms when the clamped step's traffic does not exceed the weight on record", placement: unit, coverage: {replay: ["repin-clamps-an-analysis-step"]}, status: decided}
  - {state: Serving/Analysis, event: plan.repin, variants: [raise], outcome: transition, to: PreHold, note: "a clamped step whose traffic exceeds the weight on record would be immediate exposure, so the run layer arms the pre-step hold and the split keeps its recorded weight until a promote releases it", placement: unit, coverage: {replay: ["repin-clamps-an-analysis-step"]}, status: decided}
  - {state: Serving/Analysis, event: plan.drift, outcome: ignore, note: "the pinned plan executes, its metric source included; the run layer reports the drift and only a repin applies the edit", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/planDrift"]}, status: decided}
  - {state: Serving/Analysis, event: plan.unresolved, outcome: ignore, note: "with no executable body the unit is not dispatched and its Components take the full plan-gate hold, so the split and the sampling state freeze where they are until the plan resolves again; the run layer's plan conditions carry the signal", placement: unit, coverage: {unit: ["TestPlanGateHoldPartition"], replay: ["canary-group-stops-resolving-under-analysis"]}, status: decided}
  - {state: Serving/Analysis, event: run.lost, outcome: ignore, note: "the unit holds where it is with a CanaryRunLost warning; the gate is not evaluated without a pinned run, so no sample can advance or roll back an unpinned ladder", invariants: [unpinned.never.steps], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/runLost"]}, status: decided}
  - {state: Serving/Analysis, event: run.adopted, outcome: ignore, note: "the bind attaches the run's target id to a record that carries none; the step, split and sampling state are kept", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/runAdopted"]}, status: decided}
  - {state: Serving/Analysis, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "the record is reset to step 0 toward the new target, dropping the failure budget and samples so a stale budget cannot roll back the new revision; the stable identity is preserved", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/newTarget"]}, status: decided}
  - {state: Serving/Analysis, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "a retarget mid-ladder supersedes the run; the bind resets the record to step 0 toward the new run's target before the executor's pass, with the stable identity preserved", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/newTarget[runOpen]"]}, status: decided}
  - {state: Serving/Analysis, event: capacity.reached, outcome: ignore, note: "the split already serves; a count back at the staged number clears the wait clock a dip opened, so a later dip is clocked from its own start", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/capacityReached"]}, status: decided}
  - {state: Serving/Analysis, event: capacity.dropped, outcome: ignore, note: "the split keeps its phase and recorded weight through a dip and the wait is clocked; the gate keeps sampling the split that still serves", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/capacityDropped"]}, status: decided}
  - {state: Serving/Analysis, event: spec.replicas, outcome: ignore, note: "the staged count is recomputed from the new desired count on every pass; the step holds its split", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/replicasUp"]}, status: decided}
  - {state: Serving/Analysis, event: timer.readyTimeout, outcome: transition, to: Failed, note: "a split that served, dipped and stays short past the ready timeout parks Failed with the marker CapacityTimeout; the split keeps following the pods that serve, and the park is the capacity gate's verdict that the step's capacity did not hold", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/readyTimeout"]}, status: decided}
  - {state: Serving/Analysis, event: timer.pauseElapsed, outcome: ignore, note: "the bake window is read only together with a passing sample; the clock alone moves nothing, and a restart re-anchors it as it does a timed soak", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/pauseElapsed"]}, status: decided}
  - {state: Serving/Analysis, event: analysis.sample, variants: [pass], outcome: ignore, note: "a passing sample inside the bake window is recorded as conclusive and the step holds until the window elapses, so one good read cannot promote a split that has not served its bake", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/sample[pass]"]}, status: decided}
  - {state: Serving/Analysis, event: analysis.sample, variants: [passBaked], outcome: transition, to: Staging/Final, note: "a passing sample once the bake window has elapsed advances the step with the budget reset (Staging when the next step is intermediate); the window and the sample are read together", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/sample[passBaked]"]}, status: decided}
  - {state: Serving/Analysis, event: analysis.sample, variants: [fail], outcome: ignore, note: "a breach counts one failing check, at most one per interval so a burst of passes cannot spend the budget, and the step holds below the failure limit", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/sample[fail]"]}, status: decided}
  - {state: Serving/Analysis, event: analysis.sample, variants: [failAtLimit], outcome: transition, to: RollingBack, note: "the failing checks reach the failure limit and the gate decides a rollback: the rejection is recorded and the rejected pods drain; analysis is the one gate that can retreat without an operator", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/sample[failAtLimit]"]}, status: decided}
  - {state: Serving/Analysis, event: analysis.sample, variants: [failAtLimitStableEmpty], outcome: transition, to: Failed/StableMissing, note: "a gate-decided rollback whose member's stable revision runs no live Instance under a held floor parks Failed with the marker StableRevisionMissing and signals no revert, because that revision is not one the unit stood on in this ladder; the split is rewritten through the serving rule and the operator's rollback still proceeds from the park", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/sample[failAtLimitStableEmpty]"]}, status: decided}
  - {state: Serving/Analysis, event: analysis.sample, variants: [inconclusive], outcome: ignore, note: "an inconclusive sample under the default policy holds the step; the stall timeout counts from the last conclusive sample, or from step entry before any", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/sample[inconclusive]"]}, status: decided}
  - {state: Serving/Analysis, event: analysis.sample, variants: [inconclusiveRollbackPolicy], outcome: transition, to: RollingBack, note: "under OnInconclusive=Rollback an unreadable gate is treated as a failure and rolls back at once, so the fleet is never left split on a gate that cannot tell", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/sample[inconclusiveRollbackPolicy]"]}, status: decided}
  - {state: Serving/Analysis, event: analysis.sample, variants: [stalled], outcome: transition, to: Failed, note: "inconclusive samples past the stall timeout park the unit Failed with the marker AnalysisStalled: a stall means the gate cannot tell, not that the revision is bad, so the default parks rather than rolls back", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/sample[stalled]"]}, status: decided}
  - {state: Serving/Analysis, event: analysis.sample, variants: [stalledRollbackOnStall], outcome: transition, to: RollingBack, note: "under OnInconclusive=RollbackOnStall a stall reverts instead of parking, so an unreadable gate cannot leave the fleet split", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/sample[stalledRollbackOnStall]"]}, status: decided}
  - {state: Serving/Analysis, event: analysis.unavailable, variants: [noSampler], outcome: ignore, note: "today, with no sampler wired, the gate holds on every pass rather than advancing ungated, with no event and no stall clock running, which is wrong because an indefinite silent hold hides a wiring fault the status never names; a source that cannot be built at least stalls into a park", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/unavailable[noSampler]"], replay: ["repin-clamps-an-analysis-step"]}, status: decided}
  - {state: Serving/Analysis, event: analysis.unavailable, variants: [sourceError], outcome: ignore, note: "a source that cannot be built (an unreadable auth secret, an unbound provider) is consumed as an inconclusive sample dated now, so it holds, rolls back under the Rollback policy, or stalls into a park; a wiring error is never read as a metric breach", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/unavailable[sourceError]"]}, status: decided}
  - {state: Serving/Analysis, event: analysis.unavailable, variants: [noFreshSample], outcome: ignore, note: "a miss kicks a bounded background query and the step holds until its completion event or the step cadence re-reconciles; the reconcile never blocks on the metrics source", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/unavailable[noFreshSample]"]}, status: decided}
  - {state: Serving/Analysis, event: pod.canaryCrashed, outcome: transition, to: Failed, note: "a canary pod that served and keeps dying parks the ladder before any sample is read; the split returns to stable because capacity that keeps dying cannot be trusted with traffic", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/canaryCrashed"]}, status: decided}
  - {state: Serving/Analysis, event: pod.canaryRestarted, outcome: ignore, note: "the bake window re-anchors on the newest restart, as a timed soak does, so a restarted pod serves a full bake before a passing sample can advance the step", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/canaryRestarted"]}, status: decided}
  - {state: Serving/Analysis, event: pod.canaryDeleted, outcome: ignore, note: "a pod on its way out is a dip: the step keeps its phase and weight while the workload repairs it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/canaryPodDeleted"]}, status: decided}
  - {state: Serving/Analysis, event: record.legacy, variants: [noTargetID], outcome: ignore, note: "a record with no target id under a pinned run adopts the run's id in place and keeps its step and samples: re-arming it would restart a ladder that is already in flight", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/record[noTargetID]"]}, status: decided}
  - {state: Serving/Analysis, event: record.legacy, variants: [stableEqualsCanary], outcome: ignore, note: "a persisted pair whose stable equals its canary hash is repaired from the replica's distinct current revision when the controller supplies one, because the two identities must stay distinct for a primary retarget", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/record[stableEqualsCanary]"]}, status: decided}
  - {state: Serving/Analysis, event: record.legacy, variants: [noStable], outcome: ignore, note: "the stable identity is backfilled from the observed stable revision and then never re-inferred, because the live pod set stops naming the pre-canary stable as revisions retarget and drain", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/record[noStable]"]}, status: decided}
  - {state: Serving/Analysis, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "status is an unvalidated subresource, so a negative step from an external write is read back from the record before it can index the plan: the last step whose traffic weight the recorded weight reached, which here is step 0", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/record[negativeStep]"]}, status: decided}
  - {state: Serving/Analysis, event: record.legacy, variants: [failedPhaseNoMarker], outcome: transition, to: Failed, note: "a Failed phase with no marker is status written before the marker existed and still parks; the Failed hold re-projects the phase, so a write that dropped the marker cannot un-park the canary", invariants: [phase.is.input], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/record[failedPhaseNoMarker]"]}, status: decided}
  - {state: Serving/Analysis, event: pass.resync, outcome: ignore, note: "the gate is throttled to one evaluation per interval, so a pass inside the interval holds without sampling; the throttle bounds failure accrual and paces the background query", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/resync"]}, status: decided}
  - {state: Serving/Analysis, event: pass.staleRecord, outcome: defer, note: "the flush compares the live record with the one the pass read and keeps the live record, phase and traffic when they differ; the pass requeues and a sample consumed into the stale record is dropped with the rest of its decisions, so the next pass re-reads it", placement: unit, coverage: {unit: ["TestBaseKeepsTheLiveRecordOverAStalePass"], replay: ["repin-clamps-an-analysis-step"]}, status: decided}
