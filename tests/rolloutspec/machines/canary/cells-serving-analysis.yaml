# Serving/Analysis: an intermediate step's split serves under the metric
# gate. No grid fixture is analysis-gated, so every gate cell here is
# decided in promotion.go and rollback_target.go alone; the DECIDE notes
# record what the code does today and ask whether the grid should pin it.
cells:
  - {state: Serving/Analysis, event: verb.pause, outcome: ignore, note: "the pass observes only; the sampling clocks are left as they are, so the stall timeout keeps counting under the pause", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/pause"]}, status: current}
  - {state: Serving/Analysis, event: verb.unpause, outcome: ignore, note: "sampling resumes on its interval; a stall that elapsed under the pause parks on the first pass after it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/unpause"]}, status: current}
  - {state: Serving/Analysis, event: verb.promote, variants: [match], windows: [before], outcome: transition, to: Staging/Final, note: "a promote overrides the metric gate: the step advances with PromotedThrough recorded and the analysis budget reset (Staging when the next step is intermediate)", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/promote"]}, status: current}
  - {state: Serving/Analysis, event: verb.promote, variants: [match], windows: [boundary, after], outcome: ignore, note: "inert by PromotedThrough once the advance lands", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/promote[reshown]"]}, status: current}
  - {state: Serving/Analysis, event: verb.promote, variants: [stale], outcome: ignore, note: "a value naming another revision opens nothing", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/promote[stale]"]}, status: current}
  - {state: Serving/Analysis, event: verb.promote, variants: [applied], outcome: ignore, note: "the applied verb re-shown is inert and handed back for removal", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/promote[applied]"]}, status: current}
  - {state: Serving/Analysis, event: verb.promoteForce, variants: [match], windows: [before], outcome: transition, to: Staging/Final, note: "a force at a served step is a promote and overrides the gate", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/promoteForce"]}, status: current}
  - {state: Serving/Analysis, event: verb.promoteForce, variants: [match], windows: [boundary, after], outcome: ignore, note: "inert by PromotedThrough once the advance lands", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/promoteForce[reshown]"]}, status: current}
  - {state: Serving/Analysis, event: verb.promoteForce, variants: [stale], outcome: ignore, note: "a value naming another revision lifts nothing", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/promoteForce[stale]"]}, status: current}
  - {state: Serving/Analysis, event: verb.promoteForce, variants: [applied], outcome: ignore, note: "the applied force re-shown is inert", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/promoteForce[applied]"]}, status: current}
  - {state: Serving/Analysis, event: verb.rollback, variants: [stableServes], windows: [before], outcome: transition, to: RollingBack, note: "the rejection is recorded and the rejected pods drain", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/rollback"]}, status: current}
  - {state: Serving/Analysis, event: verb.rollback, variants: [stableServes], windows: [boundary, after], outcome: ignore, note: "the recorded rejection keeps a re-shown request inert", invariants: [one.verb.one.effect], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/rollback[reshown]"]}, status: current}
  - {state: Serving/Analysis, event: verb.rollback, variants: [stableEmpty], outcome: DECIDE, to: RollingBack, note: "today: the operator's rollback proceeds toward an empty stable revision with a warning. Question: as Staging/verb.rollback[stableEmpty].", placement: unit, status: current}
  - {state: Serving/Analysis, event: verb.resume, variants: [own], outcome: reject, note: "nothing is parked: consumed silently", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/resume"]}, status: current}
  - {state: Serving/Analysis, event: verb.resume, variants: [stale], outcome: reject, note: "the value addresses no canary: removed with a warning", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/resume[stale]"]}, status: current}
  - {state: Serving/Analysis, event: verb.resume, variants: [otherUnit], outcome: ignore, note: "left for the unit that owns it", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/resume[otherUnit]"]}, status: current}
  - {state: Serving/Analysis, event: plan.repin, variants: [holdOrTighten], outcome: ignore, note: "the index clamps into the new ladder; the sampling state and failure budget are kept for the clamped step", placement: unit, status: current}
  - {state: Serving/Analysis, event: plan.repin, variants: [raise], outcome: transition, to: PreHold, note: "the clamped step would raise traffic, so the run layer arms the pre-step hold", placement: unit, status: current}
  - {state: Serving/Analysis, event: plan.drift, outcome: ignore, note: "the pinned plan executes; a changed metric source is read at the next sample through the pinned body", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/planDrift"]}, status: current}
  - {state: Serving/Analysis, event: plan.unresolved, outcome: DECIDE, note: "today: the unit is not dispatched; the split and the sampling freeze. Question: as Staging/plan.unresolved.", placement: unit, status: current}
  - {state: Serving/Analysis, event: run.lost, outcome: ignore, note: "the unit holds where it is; the gate is not evaluated without a pinned run", invariants: [unpinned.never.steps], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/runLost"]}, status: current}
  - {state: Serving/Analysis, event: run.adopted, outcome: ignore, note: "the target id is attached; the step, split and sampling state are kept", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/runAdopted"]}, status: current}
  - {state: Serving/Analysis, event: target.new, variants: [observed], outcome: transition, to: Staging, note: "the record is reset to step 0 toward the new target, dropping the failure budget and samples so a stale budget cannot roll back the new revision", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/newTarget"]}, status: current}
  - {state: Serving/Analysis, event: target.new, variants: [runOpen], outcome: transition, to: Staging, note: "the bind resets the record toward the new run's target", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/newTarget[runOpen]"]}, status: current}
  - {state: Serving/Analysis, event: capacity.reached, outcome: ignore, note: "the split already serves; a count back at the staged number clears the wait clock", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/capacityReached"]}, status: current}
  - {state: Serving/Analysis, event: capacity.dropped, outcome: ignore, note: "the split keeps its phase and weight through a dip and the wait is clocked; the gate keeps sampling the split that still serves", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/capacityDropped"]}, status: current}
  - {state: Serving/Analysis, event: spec.replicas, outcome: ignore, note: "the staged count is recomputed; the step holds", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/replicasUp"]}, status: current}
  - {state: Serving/Analysis, event: timer.readyTimeout, outcome: DECIDE, to: Failed, note: "today: a split that dipped and stays short past the ready timeout parks Failed. Question: as Serving/Manual/timer.readyTimeout.", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/readyTimeout"]}, status: current}
  - {state: Serving/Analysis, event: timer.pauseElapsed, outcome: ignore, note: "the bake window is read together with a passing sample; the clock alone moves nothing, and a restart re-anchors it as it does a timed soak", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/pauseElapsed"]}, status: current}
  - {state: Serving/Analysis, event: analysis.sample, variants: [pass], outcome: DECIDE, note: "today: a passing sample inside the bake window is recorded and the step holds until the window elapses. Question: should the grid pin an analysis fixture for the pass, breach, inconclusive and stall columns, which today are decided in promotion.go alone?", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/sample[pass]"]}, status: current}
  - {state: Serving/Analysis, event: analysis.sample, variants: [passBaked], outcome: DECIDE, to: Staging/Final, note: "today: a passing sample once the bake window has elapsed advances the step with the budget reset (Staging when the next step is intermediate). Question: as analysis.sample[pass].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/sample[passBaked]"]}, status: current}
  - {state: Serving/Analysis, event: analysis.sample, variants: [fail], outcome: DECIDE, note: "today: a breach counts one failing check, at most one per interval, and the step holds. Question: as analysis.sample[pass].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/sample[fail]"]}, status: current}
  - {state: Serving/Analysis, event: analysis.sample, variants: [failAtLimit], outcome: DECIDE, to: RollingBack, note: "today: the failing checks reach the failure limit and the gate decides a rollback: the rejection is recorded and the rejected pods drain. Question: as analysis.sample[pass].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/sample[failAtLimit]"]}, status: current}
  - {state: Serving/Analysis, event: analysis.sample, variants: [failAtLimitStableEmpty], outcome: DECIDE, to: Failed/StableMissing, note: "today: a gate-decided rollback whose member's stable revision runs no live Instance under a held floor parks Failed with the marker StableRevisionMissing and signals no revert; the split is rewritten through the serving rule. Question: should a gate failure with an empty stable revision park (today) or proceed like the operator's rollback does?", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/sample[failAtLimitStableEmpty]"]}, status: current}
  - {state: Serving/Analysis, event: analysis.sample, variants: [inconclusive], outcome: DECIDE, note: "today: an inconclusive sample under the default policy holds the step; the stall timeout counts from the last conclusive sample. Question: as analysis.sample[pass].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/sample[inconclusive]"]}, status: current}
  - {state: Serving/Analysis, event: analysis.sample, variants: [inconclusiveRollbackPolicy], outcome: DECIDE, to: RollingBack, note: "today: an inconclusive sample under OnInconclusive=Rollback rolls back at once. Question: as analysis.sample[pass].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/sample[inconclusiveRollbackPolicy]"]}, status: current}
  - {state: Serving/Analysis, event: analysis.sample, variants: [stalled], outcome: DECIDE, to: Failed, note: "today: inconclusive samples past the stall timeout park the unit Failed with the marker AnalysisStalled. Question: as analysis.sample[pass].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/sample[stalled]"]}, status: current}
  - {state: Serving/Analysis, event: analysis.sample, variants: [stalledRollbackOnStall], outcome: DECIDE, to: RollingBack, note: "today: a stall under OnInconclusive=RollbackOnStall rolls back instead of parking. Question: as analysis.sample[pass].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/sample[stalledRollbackOnStall]"]}, status: current}
  - {state: Serving/Analysis, event: analysis.unavailable, variants: [noSampler], outcome: DECIDE, note: "today: with no sampler wired the gate holds rather than advancing ungated, forever, with no event. Question: should a missing sampler be reported (a condition or a park) rather than an indefinite silent hold?", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/unavailable[noSampler]"]}, status: current}
  - {state: Serving/Analysis, event: analysis.unavailable, variants: [sourceError], outcome: DECIDE, note: "today: a source that cannot be built (an unreadable auth secret, an unbound provider) is consumed as an inconclusive sample, so it holds, rolls back under the Rollback policy, or stalls into a park. Question: should a wiring error be told apart from an unreadable metric?", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/unavailable[sourceError]"]}, status: current}
  - {state: Serving/Analysis, event: analysis.unavailable, variants: [noFreshSample], outcome: DECIDE, note: "today: a miss kicks a bounded background query and the step holds until its completion event or the step cadence re-reconciles. Question: as analysis.sample[pass].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/unavailable[noFreshSample]"]}, status: current}
  - {state: Serving/Analysis, event: pod.canaryCrashed, outcome: transition, to: Failed, note: "the ladder parks at its step before any sample is read; the split returns to stable", invariants: [exec.order.fixed], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/canaryCrashed"]}, status: current}
  - {state: Serving/Analysis, event: pod.canaryRestarted, outcome: ignore, note: "the bake window re-anchors on the newest restart", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/canaryRestarted"]}, status: current}
  - {state: Serving/Analysis, event: pod.canaryDeleted, outcome: ignore, note: "a pod on its way out is a dip: the step keeps its phase and weight", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/canaryPodDeleted"]}, status: current}
  - {state: Serving/Analysis, event: record.legacy, variants: [noTargetID], outcome: DECIDE, note: "today: adopted in place. Question: as Staging/record.legacy[noTargetID].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/record[noTargetID]"]}, status: current}
  - {state: Serving/Analysis, event: record.legacy, variants: [stableEqualsCanary], outcome: DECIDE, note: "today: repaired from the replica's distinct current revision. Question: as Staging/record.legacy[stableEqualsCanary].", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/record[stableEqualsCanary]"]}, status: current}
  - {state: Serving/Analysis, event: record.legacy, variants: [noStable], outcome: ignore, note: "backfilled from the observed stable revision", invariants: [stable.never.reinferred], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/record[noStable]"]}, status: current}
  - {state: Serving/Analysis, event: record.legacy, variants: [negativeStep], outcome: ignore, note: "clamped to 0", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/record[negativeStep]"]}, status: current}
  - {state: Serving/Analysis, event: record.legacy, variants: [failedPhaseNoMarker], outcome: transition, to: Failed, note: "a Failed phase with no marker still parks", invariants: [phase.is.input], placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/record[failedPhaseNoMarker]"]}, status: current}
  - {state: Serving/Analysis, event: pass.resync, outcome: ignore, note: "the gate is throttled to one evaluation per interval; a pass inside the interval holds", placement: unit, coverage: {unit: ["TestReconcileCells/canary/Serving[A]/resync"]}, status: current}
  - {state: Serving/Analysis, event: pass.staleRecord, outcome: defer, note: "the flush keeps the live record and the pass requeues; a sample consumed into the stale record is lost and the next pass re-reads it", placement: sim, status: current}
