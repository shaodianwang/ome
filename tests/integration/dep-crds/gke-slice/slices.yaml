---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: slices.accelerator.gke.io
spec:
  group: accelerator.gke.io
  scope: Cluster
  names:
    kind: Slice
    listKind: SliceList
    plural: slices
    singular: slice
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - partitionIds
                - topology
                - type
              properties:
                partitionIds:
                  type: array
                  items:
                    type: string
                topology:
                  type: string
                  maxLength: 14
                  pattern: '^\d{1,4}x\d{1,4}(x\d{1,4})?$'
                type:
                  type: string
                  enum:
                    - v6e
                    - tpu7x
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
