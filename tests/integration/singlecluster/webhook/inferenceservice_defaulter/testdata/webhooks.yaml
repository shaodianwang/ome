# MutatingWebhookConfiguration for the InferenceService defaulter
# only. Canonical config/webhook/manifests.yaml installs the pod
# mutator + ISVC validator alongside this — none of which the
# defaulter suite needs. failurePolicy=Fail keeps the test
# semantics tight: a defaulter wiring regression will fail visibly
# on every Create rather than silently skip the mutation.
#
# envtest patches placeholder caBundle / clientConfig.service →
# clientConfig.url at install time; values here are scaffolding.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: inferenceservice-defaulter.ome.io
webhooks:
  - clientConfig:
      caBundle: Cg==
      service:
        name: ome-webhook-service
        namespace: ome
        path: /mutate-ome-io-v1beta1-inferenceservice
    failurePolicy: Fail
    name: inferenceservice.ome-webhook-server.defaulter
    sideEffects: None
    admissionReviewVersions: ["v1"]
    rules:
      - apiGroups: ["ome.io"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["inferenceservices"]
