# Stripped-down webhook fixture for the pod mutator only. The
# canonical config/webhook/manifests.yaml installs a defaulter for
# InferenceService alongside this — we don't want that handler in
# this suite, and installing the webhook config without registering
# a handler would 404 every Create with failurePolicy=Fail.
#
# envtest patches placeholder caBundle / clientConfig.service →
# clientConfig.url at install time; values here are scaffolding.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: pod-mutator.ome.io
webhooks:
  - clientConfig:
      caBundle: Cg==
      service:
        name: ome-webhook-service
        namespace: ome
        path: /mutate-pods
    failurePolicy: Fail
    name: inferenceservice.ome-webhook-server.pod-mutator
    reinvocationPolicy: IfNeeded
    sideEffects: None
    admissionReviewVersions: ["v1"]
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
