# Webhook fixture for the ISVC admission-matrix suite: the validating
# webhook configuration, exactly as the canonical manifests deploy it.
# No mutating webhook exists for InferenceService, so the validator
# judges the object as authored and the apiserver stores it unchanged.
#
# envtest patches the placeholder caBundle / clientConfig.service →
# clientConfig.url at install time; values here are scaffolding.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: inferenceservice.ome.io
webhooks:
  - clientConfig:
      caBundle: Cg==
      service:
        name: ome-webhook-service
        namespace: ome
        path: /validate-ome-io-v1beta1-inferenceservice
    failurePolicy: Fail
    name: inferenceservice.ome-webhook-server.validator
    sideEffects: None
    admissionReviewVersions: ["v1"]
    rules:
      - apiGroups: ["ome.io"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["inferenceservices"]
