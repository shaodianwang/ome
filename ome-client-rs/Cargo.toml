[package]
name = "ome-client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Generated Rust client types for the OME (ome.io/v1beta1) CRDs"

# The Rust analog of pkg/apis (the OME CRD types). Generated by kopium from
# config/crd/full/ — run `make rust-client`. The clientset/informers/listers
# layer is NOT here: kube-rs provides it generically (Api<T> / watcher+reflector
# / Store<T>), instantiated with these types by consumers (e.g. muse).
#
# Standalone crate (NOT a muse workspace member) so it stays reusable repo-wide.
# Versions resolved by cargo so kube + k8s-openapi stay compatible. serde_json is
# required: the generated types use serde_json::Value for free-form maps, and the
# CustomResource derive references it.
[dependencies]
kube = { version = "4.0.0", default-features = false, features = ["derive"] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# Optional — enabled by the `runtime` feature (the informer/lister helpers).
tokio = { version = "1.52.3", features = ["rt", "sync"], optional = true }
futures = { version = "0.3.32", optional = true }
tracing = { version = "0.1.44", optional = true }

[features]
default = []
# OmeClient clientset wrapper (typed Api<T> accessors).
client = ["kube/client"]
# Generic shared-informer / Store (lister) helpers; implies `client`.
runtime = ["client", "kube/runtime", "dep:tokio", "dep:futures", "dep:tracing"]

[dev-dependencies]
anyhow = "1.0.103"
kube = { version = "4.0.0", features = ["client", "rustls-tls"] }
rcgen = "0.14.8"
serde_json = "1.0.150"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing-subscriber = "0.3.23"
