[package]
name = "muse-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "MUSE read-plane API server (OEP-0021)"

[[bin]]
name = "muse"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
axum = "0.8.9"
clap = { version = "4", features = ["derive", "env"] }
# AsyncBufReadExt::lines over kube's (futures-io) log streams.
futures-util = "0.3"
# http-proxy: respect HTTP(S)_PROXY/NO_PROXY so a remote cluster reachable only
# via a corporate proxy works (e.g. msl-cw-use2-dev-2).
kube = { version = "4.0.0", features = ["client", "runtime", "rustls-tls", "http-proxy"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
ome-client = { path = "../../../ome-client-rs", features = ["runtime"] }
# reqwest: the console's inference test proxy forwards one chat request to a
# model's own endpoint. rustls (no OpenSSL) to match kube; honors HTTP(S)_PROXY.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "stream"] }
serde = "1.0.228"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
# BroadcastStream: adapt the activity-feed broadcast receiver into a Stream for SSE.
tokio-stream = { version = "0.1", features = ["sync"] }
# "fs" (ServeDir/ServeFile): serve the built web console (SPA) from muse-server.
tower-http = { version = "0.7", features = ["trace", "compression-gzip", "request-id", "util", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7"] }

# jemalloc: warming ~10^5-object informer caches churns transient allocations the
# system allocator retains, inflating RSS. jemalloc returns freed pages to the OS
# — aggressively when MALLOC_CONF enables a background purge thread (set in the
# chart). Skip MSVC (not a target); builds on Linux and macOS.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["unprefixed_malloc_on_supported_platforms"] }

[lints]
workspace = true
