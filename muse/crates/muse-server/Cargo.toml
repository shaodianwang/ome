[package]
name = "muse-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "MUSE read-plane API server (OEP-0021)"

[[bin]]
name = "muse"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
axum = "0.8.9"
clap = { version = "4", features = ["derive", "env"] }
# http-proxy: respect HTTP(S)_PROXY/NO_PROXY so a remote cluster reachable only
# via a corporate proxy works (e.g. msl-cw-use2-dev-2).
kube = { version = "4.0.0", features = ["client", "runtime", "rustls-tls", "http-proxy"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
ome-client = { path = "../../../ome-client-rs", features = ["runtime"] }
serde = "1.0.228"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.7", features = ["trace", "cors", "compression-gzip", "timeout", "request-id", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7"] }

[lints]
workspace = true
