# permissions for end users to view slices.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: slice-scheduler
    app.kubernetes.io/managed-by: kustomize
  name: slice-viewer-role
rules:
- apiGroups:
  - slice.tpu.google.com
  resources:
  - slices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - slice.tpu.google.com
  resources:
  - slices/status
  verbs:
  - get
