{{- if .Values.apf.enabled }}
apiVersion: flowcontrol.apiserver.k8s.io/v1
kind: FlowSchema
metadata:
  name: {{ include "slice-scheduler.fullname" . }}-{{ .Release.Namespace }}-high
  labels:
    {{- include "slice-scheduler.labels" . | nindent 4 }}
spec:
  matchingPrecedence: {{ .Values.apf.matchingPrecedence | default 8000 }}
  priorityLevelConfiguration:
    name: workload-high
  distinguisherMethod:
    type: ByUser
  rules:
    - resourceRules:
        - apiGroups: ["*"]
          clusterScope: true
          namespaces: ["*"]
          resources: ["*"]
          verbs: ["*"]
      nonResourceRules:
        - nonResourceURLs: ["*"]
          verbs: ["*"]
      subjects:
        - kind: ServiceAccount
          serviceAccount:
            name: {{ include "slice-scheduler.serviceAccountName" . }}
            namespace: {{ .Release.Namespace }}
{{- end }}
