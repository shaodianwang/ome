apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: jobset-1cube
spec:
  replicatedJobs:
  - name: workers
    replicas: 1
    template:
      spec:
        parallelism: 16
        completions: 16
        template:
          metadata:
            annotations:
              cloud.google.com/gke-tpu-slice-topology: 4x4x4
          spec:
            containers:
            - name: worker
              image: busybox
              command: ["sh", "-c", "echo Hello from TPU slice! && sleep 300"]
              resources:
                limits:
                  google.com/tpu: "4"
            nodeSelector:
              cloud.google.com/gke-tpu-topology: 4x4x4
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-slice: slice-1cube
            tolerations:
            - key: kwok.x-k8s.io/node
              operator: Exists
              effect: NoSchedule
