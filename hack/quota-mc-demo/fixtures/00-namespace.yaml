# The serving namespace. Applied to ALL THREE clusters.
#
# The hub needs it because the source InferenceServices are created there and an
# apply into a missing namespace is refused outright. Each member needs it
# because it ENROLLS this namespace — `--enrolled-namespaces=ome-mc-test` on the
# member's ome-quota-manager, which is where the set lives now: a leaf is a
# tenant and names no namespace, so which namespaces a cluster serves from is a
# property of the install. OME never creates one, and an enrolled namespace that
# does not exist holds no LocalQueue: the ClusterQueue still lands, but a
# workload in that namespace has no queue to charge.
#
# kueue.x-k8s.io/managed is what puts the namespace inside Kueue's scope. Every
# Kueue webhook on these members carries
# `namespaceSelector: matchLabels{kueue.x-k8s.io/managed: "true"}`, so an
# unlabelled namespace is invisible to Kueue: its pods are never gated, never
# become Workloads, and run outside quota whatever queue they name. It is also
# the blast-radius fence on the members' `pod` integration, which can gate a pod
# only in a namespace carrying this label.
#
# Harmless on the hub, which runs no Kueue.
apiVersion: v1
kind: Namespace
metadata:
  name: ome-mc-test
  labels:
    kueue.x-k8s.io/managed: "true"
