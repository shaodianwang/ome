# Two replicas consume eight chips per member, within the sixteen-chip share.
# The named runtime needs no model; OMENative reports admission through InferenceReplicas.
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata:
  name: mc-demo-fits
  namespace: ome-mc-test
  annotations:
    # Charge the AcceleratorQuota leaf that supplies the member LocalQueue.
    ome.io/local-queue: mc-demo.serving
  labels:
    ome.io/mc-demo: "true"
spec:
  deploymentMode: OMENative
  placement:
    policy: ClusterAffinity
    mode: All
    clusterAffinity:
      - matchExpressions:
          - key: accelerator
            operator: In
            values: [tpu7x]
  runtime:
    name: mc-demo-tpu
  engine:
    minReplicas: 2
    maxReplicas: 2
