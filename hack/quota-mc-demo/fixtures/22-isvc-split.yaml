# Eight replicas divide equally across the two selected members: four per home.
# Each home consumes its sixteen-chip quota share. Run this fixture alone.
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata:
  name: mc-demo-split
  namespace: ome-mc-test
  annotations:
    # Charge the AcceleratorQuota leaf that supplies the member LocalQueue.
    ome.io/local-queue: mc-demo.serving
  labels:
    ome.io/mc-demo: "true"
spec:
  deploymentMode: OMENative
  placement:
    policy: ClusterAffinity
    mode: Split
    clusterAffinity:
      - matchExpressions:
          - key: accelerator
            operator: In
            values: [tpu7x]
    split:
      replicas: 8
      maxReplicasPerCluster: 4
  runtime:
    name: mc-demo-tpu
  engine:
    minReplicas: 8
    maxReplicas: 8
