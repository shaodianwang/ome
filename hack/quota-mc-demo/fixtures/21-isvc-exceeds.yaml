# Five replicas request twenty chips per member against a sixteen-chip share.
# Kueue holds the excess pods; PlacementSatisfied reports the admission shortfall.
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata:
  name: mc-demo-exceeds
  namespace: ome-mc-test
  annotations:
    # Charge the AcceleratorQuota leaf that supplies the member LocalQueue.
    ome.io/local-queue: mc-demo.serving
  labels:
    ome.io/mc-demo: "true"
spec:
  deploymentMode: OMENative
  placement:
    policy: ClusterAffinity
    mode: All
    clusterAffinity:
      - matchExpressions:
          - key: accelerator
            operator: In
            values: [tpu7x]
  runtime:
    name: mc-demo-tpu
  engine:
    minReplicas: 5
    maxReplicas: 5
