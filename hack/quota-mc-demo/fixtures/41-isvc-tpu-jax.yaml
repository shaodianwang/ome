# Apply this local service to a member after installing its namespaced runtime.
# One leader and one worker share a 2x2x2 TPU slice. Hub placement and quota
# enrollment are separate steps described in the README.
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata:
  name: mc-demo-jax
  namespace: ome-mc-test
  labels:
    ome.io/mc-demo: "true"
spec:
  deploymentMode: OMENative
  runtime:
    apiGroup: ome.io
    kind: ServingRuntime
    name: mc-demo-tpu-jax
  engine:
    minReplicas: 1
    maxReplicas: 1
    topologyKey: cloud.google.com/gke-tpu-partition-2x2x2-id
    annotations:
      cloud.google.com/gke-tpu-slice-topology: 2x2x2
    leader:
      runner:
        name: ome-container
    worker:
      size: 1
      runner:
        name: ome-container
