# Pinned to one home, and what happens when that home goes away.
#
#   kubectl --context kind-ome-quota-hub apply -f hack/kwok-sim/fixtures/65-placement-pinned.yaml
#
# clusterSelector is an operator-imposed routing overlay AND-ed onto
# requirements, so this matches member B alone. Both labels come from
# --with-placement, which stamps accelerator=tpu7x on each member and zone=a /
# zone=b to tell them apart.
#
# Expect a derived copy on member B only; member A untouched.
#
# It is also the starting point for the re-placement paths. With the ISVC
# running, make its only home stop matching:
#
#   kubectl --context kind-ome-quota-hub label workloadcluster member-b zone=a --overwrite
#
# and the placer has no candidate left — status.placement reports why rather
# than moving the workload somewhere its operator excluded. Put the label back
# and it recovers. Cutting the member off instead (delete the WorkloadCluster,
# or corrupt its kubeconfig Secret) exercises the other half: unreachable is not
# the same as unwanted, and the two have different contracts.
#
# Needs a tree applied first (any of the 5*-fleet-*.yaml).
#
# Needs the enrolled namespace kwok-sim, which up.sh and fleet-up.sh create on
# every cluster. No fixture declares it: it is shared, so a file that owned it
# would take every other tenant down on `kubectl delete -f`. If it is missing:
# `kubectl create namespace kwok-sim`.
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata:
  name: place-pinned
  namespace: kwok-sim
  annotations:
    # The leaf this workload charges. Placement resolves the queue from this
    # first and the operator-configured default second, and that default is
    # empty on purpose: a LocalQueue is named for its leaf, so no one fleet-wide
    # name can address more than one tenant. Until the ISVC->(queue, priority)
    # resolver lands, a workload names its own leaf.
    ome.io/local-queue: sim-tenants.serving
  labels:
    kwok-sim/managed: "true"
spec:
  placement:
    mode: Single
    requirements: accelerator=tpu7x
    clusterSelector: zone=b
  model:
    name: demo-noop
  runtime:
    name: tpu7x-4x4x4
  engine:
    minReplicas: 1
    maxReplicas: 1
    leader: {}
    worker:
      size: 15
