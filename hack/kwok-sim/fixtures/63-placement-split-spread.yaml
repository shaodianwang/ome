# A service no single member has room for, spread across both.
#
#   kubectl --context kind-ome-quota-hub apply -f hack/kwok-sim/fixtures/50-fleet-proportional.yaml
#   kubectl --context kind-ome-quota-hub apply -f hack/kwok-sim/fixtures/63-placement-split-spread.yaml
#
# This is the fixture the fleet exists for. Three replicas is 192 chips — the
# whole fleet — and 50-fleet-proportional hands member A 128 and member B 64, so
# the only split that fits is 2 and 1. Neither member could run all three, which
# is what makes a converged placement evidence of real apportionment rather than
# an even division chosen up front.
#
# Expect 32 running pods on member A and 16 on member B. The derived copy on
# each member carries only that member's share: the placer rewrites
# engine.minReplicas per home, so nothing there records the fleet-wide figure.
#
#   hack/kwok-sim/fleet-status.sh
#   kubectl --context kind-ome-quota-hub -n kwok-sim get isvc place-split-spread \
#     -o jsonpath='{range .status.placement.candidates[*]}{.cluster}={.readyReplicas}{"\n"}{end}'
#
# spread: true is load-bearing. Packed (the default) fills the preferred home
# first, and stops only when quota refuses the next replica — which is a fine
# thing to watch, but it is 64-placement-split-capped that shows it without
# depending on which home the placer prefers.
#
# This consumes every chip in the fleet. Run it alone.
#
# Needs the enrolled namespace kwok-sim, which up.sh and fleet-up.sh create on
# every cluster. No fixture declares it: it is shared, so a file that owned it
# would take every other tenant down on `kubectl delete -f`. If it is missing:
# `kubectl create namespace kwok-sim`.
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata:
  name: place-split-spread
  namespace: kwok-sim
  annotations:
    # The leaf this workload charges. Placement resolves the queue from this
    # first and the operator-configured default second, and that default is
    # empty on purpose: a LocalQueue is named for its leaf, so no one fleet-wide
    # name can address more than one tenant. Until the ISVC->(queue, priority)
    # resolver lands, a workload names its own leaf.
    ome.io/local-queue: sim-tenants.serving
  labels:
    kwok-sim/managed: "true"
spec:
  placement:
    mode: Split
    requirements: accelerator=tpu7x
    split:
      replicas: 3
      spread: true
  model:
    name: demo-noop
  runtime:
    name: tpu7x-4x4x4
  engine:
    minReplicas: 3
    maxReplicas: 3
    leader: {}
    worker:
      size: 15
