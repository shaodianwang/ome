# A subtree that violates containment on purpose, to watch the freeze rule.
#
#   root                Cohort        no budget
#   └── frozen          Cohort        16 chips  <- less than its children total
#       ├── frozen.a    ClusterQueue  16 chips
#       └── frozen.b    ClusterQueue  16 chips
#
# The violation is authored on frozen rather than on the root, because
# the root is the controller's and it creates it with no budgets — and a node
# carrying no budgets is skipped by the containment check, which compares
# numbers it does not have.
#
# A parent's nominal must be at least the sum of its children's per (resource,
# flavor). Here it is half. Admission rejects a single write that breaks this,
# so the way a real cluster reaches the state is two children admitted
# concurrently, each valid against the tree it saw — which is exactly why the
# controller re-checks the whole tree afterwards.
#
#   kubectl apply -f hack/kwok-sim/fixtures/33-acceleratorquota-frozen.yaml
#   kubectl get aq
#   kubectl describe aq frozen | sed -n '/Conditions/,$p'
#
# Expect Degraded=True with reason ContainmentViolated on frozen, and
# Materialized=False with reason Frozen on it and both leaves. Expect their
# Kueue objects NOT to be created — and, if this subtree was valid and
# materialized earlier, to be left exactly as they were rather than deleted.
# That is the rule: a parent someone misauthored must not take its children's
# admitted workloads down with it.
#
# The freeze is confined to this subtree. Anything else on the root keeps
# materializing, which is the other half of the same property.
#
# The webhook may refuse the second leaf, since by then the violation is visible
# in one write. Apply the file twice, or apply it where the quota webhook is not
# serving, to reach the state the controller reports.
# Bare, exactly as a workload-mode controller makes it. Carried here so the file
# applies on a management plane too, where nothing creates a root.
apiVersion: ome.io/v1beta1
kind: AcceleratorQuota
metadata:
  name: root
spec:
  role: Cohort
---
apiVersion: ome.io/v1beta1
kind: AcceleratorQuota
metadata:
  name: frozen
spec:
  role: Cohort
  parentRef:
    name: root
  budgets:
  - resourceName: google.com/tpu
    resourceFlavor: tpu7x
    nominal: 16
---
apiVersion: ome.io/v1beta1
kind: AcceleratorQuota
metadata:
  name: frozen.a
spec:
  role: ClusterQueue
  parentRef:
    name: frozen
  budgets:
  - resourceName: google.com/tpu
    resourceFlavor: tpu7x
    nominal: 16
---
apiVersion: ome.io/v1beta1
kind: AcceleratorQuota
metadata:
  name: frozen.b
spec:
  role: ClusterQueue
  parentRef:
    name: frozen
  budgets:
  - resourceName: google.com/tpu
    resourceFlavor: tpu7x
    nominal: 16
