# The smallest tree that materializes: one leaf on the reserved root.
#
#   root       Cohort        no budget
#   └── solo   ClusterQueue  16 chips
#
# The root is declared bare, which is exactly what a workload-mode controller
# creates for itself, so applying it where one exists changes nothing. It has to
# be in the file because only workload mode auto-creates it — a management plane
# has no silicon to measure, so nothing there makes a root and every node would
# be refused for a parentRef that does not resolve.
#
# Start here rather than at 31 to watch one leaf become Kueue objects with no
# grouping tier in the way:
#
#   kubectl apply -f hack/kwok-sim/fixtures/32-acceleratorquota-solo.yaml
#   kubectl get aq -o wide
#   kubectl get clusterqueues,localqueues -A
#
# Expect a ClusterQueue named solo carrying the accelerator budget alongside a
# cpu/memory cover, and a LocalQueue named solo in every enrolled namespace —
# the leaf's name is the tenant, so it is also the queue name a workload carries.
# The cover is why a queue budgeted only for accelerators would admit nothing:
# Kueue refuses to admit a workload requesting a resource its queue does not
# cover, and every serving pod requests cpu and memory.
#
# solo sits directly under the root, so its name is already its path: the root
# contributes no segment.
#
# Remove it with `kubectl delete aq solo`, which is what reaps those objects —
# the node carries a finalizer and nothing else removes them.
# Bare, exactly as a workload-mode controller makes it. Carried here so the file
# applies on a management plane too, where nothing creates a root.
apiVersion: ome.io/v1beta1
kind: AcceleratorQuota
metadata:
  name: root
spec:
  role: Cohort
---
apiVersion: ome.io/v1beta1
kind: AcceleratorQuota
metadata:
  name: solo
spec:
  role: ClusterQueue
  parentRef:
    name: root
  budgets:
  - resourceName: google.com/tpu
    resourceFlavor: tpu7x
    nominal: 16
