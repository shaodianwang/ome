# A workload labelled for a queue that does not exist. It never runs, and no
# budget is charged for it.
#
#   kubectl --context kind-ome-quota-hub apply -f hack/kwok-sim/fixtures/50-fleet-proportional.yaml
#   kubectl --context kind-ome-quota-hub apply -f hack/kwok-sim/fixtures/68-placement-misrouted-queue.yaml
#
# The queue a derived workload joins is resolved in two steps: the source's
# ome.io/local-queue annotation first, then the operator-configured default
# (charts/ome-resources sets placement.localQueue: "default", which is the name
# OME gives every leaf's LocalQueue). This fixture overrides the first step with
# a name nothing provisioned.
#
# Expect: the derived InferenceService appears on both members and its pods are
# created and GATED — Kueue's pod webhook stamps them from the label and then
# finds no LocalQueue by that name to admit them through. sim-serving's admitted
# figure stays at 0 on both members:
#
#   kubectl --context kind-ome-quota-a get aq sim-serving -o wide
#   kubectl --context kind-ome-quota-a -n kwok-sim get pods
#   kubectl --context kind-ome-quota-a -n kwok-sim get pods -o jsonpath=
#     '{.items[0].spec.schedulingGates}{"\n"}'
#
# Why it is worth having: a misrouted queue looks exactly like a working one from
# the hub. Placement succeeds, the derived object is healthy, status.placement
# names its homes — and nothing runs. The only signal is at the pods, which is
# not where an operator looks first.
#
# The opposite failure has no fixture because it cannot be expressed in one. If
# the annotation is absent AND the operator's default is empty, the queue label
# is left off entirely, Kueue never gates the pods, and they run OUTSIDE quota
# altogether — a tree can be in place, correct, and completely bypassed. That is
# a deployment setting rather than a workload field, so to see it:
#
#   helm upgrade ome charts/ome-resources/ --kube-context kind-ome-quota-a \
#     --namespace ome --reuse-values \
#     --set ome.multicluster.placement.localQueue=""
#
# then apply 61-placement-all.yaml and watch the pods run with no queue-name
# label and admitted stay at 0 while the chips are genuinely consumed.
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata:
  name: place-misrouted
  namespace: kwok-sim
  labels:
    kwok-sim/managed: "true"
  annotations:
    # Nothing provisions a queue by this name. An empty value would NOT do the
    # same thing: it is indistinguishable from the annotation being absent, and
    # falls back to the operator's configured default.
    ome.io/local-queue: no-such-queue
spec:
  placement:
    mode: All
    requirements: accelerator=tpu7x
  model:
    name: demo-noop
  runtime:
    name: tpu7x-2x2x2
  engine:
    minReplicas: 1
    maxReplicas: 1
    leader: {}
    worker:
      size: 1
