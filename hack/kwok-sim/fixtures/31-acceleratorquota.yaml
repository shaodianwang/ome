# A three-node AcceleratorQuota tree over the simulated fleet (OEP-0024).
#
#   root                         Cohort        no budget
#   └── sim-tenants              Cohort        64 chips
#       ├── sim-tenants.serving  ClusterQueue  48 chips
#       └── sim-tenants.batch    ClusterQueue  16 chips
#
# Nodes are named by their path — the dot-joined chain from the top tier down,
# with root omitted. That name is the tenant, the ClusterQueue, and the
# LocalQueue in every enrolled namespace, so a workload reaches this budget by
# carrying "sim-tenants.batch" in kueue.x-k8s.io/queue-name. The convention is
# the author's, not the controller's: re-parenting a node leaves its name stale
# rather than renaming a live queue out from under its workloads.
#
# The reserved root is declared here, bare, which is byte-for-byte what a
# workload-mode controller creates for itself — so applying this on a cluster
# that already has one is a no-op, and applying it on one that does not is the
# difference between the tree landing and every node being refused.
#
# It has to be here because root is auto-created only where capacity derivation
# runs, which is workload mode alone: a management plane holds no silicon to
# measure. Apply this to a fleet hub without it and admission refuses the whole
# file, blaming each node for a parentRef that does not resolve — three errors
# with one cause, since a child is rejected for a parent that was itself
# rejected a moment earlier. Parents before children is deliberate (a dangling
# parentRef is refused rather than held), so a self-contained file has to carry
# its own root.
#
# Containment is exercised at sim-tenants: a parent's nominal must be at least
# the sum of its children's, per (resource, flavor), and 48 + 16 is exactly 64.
# It is NOT exercised at the root, because a node carrying no budgets is skipped
# — the check compares numbers and the root has none. To enforce a fleet total,
# patch one onto it:
#
#   kubectl patch aq root --type=merge -p \
#     '{"spec":{"budgets":[{"resourceName":"google.com/tpu","resourceFlavor":"tpu7x","nominal":64}]}}'
#
# 64 is one cube. The default --cubes 4x4x4,2x2x2 is two, so this tree budgets
# half the fleet and the root's status.capacity reports the whole of it — which
# is the number to read these against.
#
# up.sh does not apply this: a tree is what you are here to write, and the
# component works without one. Apply it by hand for a starting point:
#
#   kubectl apply -f hack/kwok-sim/fixtures/31-acceleratorquota.yaml
#   kubectl get aq -o wide
#   kubectl get cohorts,clusterqueues,localqueues -A
#
# 32, 33 and 34 are smaller trees for particular behaviours. They declare the
# same bare root and hang off it under their own names, so they coexist with
# this one —
# until you patch a fleet total onto the root, at which point they all count
# against it and the sum matters. Remove one with
# `kubectl delete aq <name>`, which is also what reaps its Kueue objects: the
# nodes carry a finalizer and nothing else removes them, since a frozen node
# keeps its objects on purpose.
#
#   32  one leaf, no grouping tier — the smallest thing that materializes
#   33  containment violated on purpose — the freeze rule
#   34  a budget naming a flavor that does not exist — FlavorMissing
#
# The enrolled namespaces are NOT carried here. up.sh and fleet-up.sh create
# them, on every cluster, from one list in lib/fixtures.sh — which is where they
# belong: enrollment is deploy config on ome-quota-manager
# (--enrolled-namespaces), not something any leaf binds, and every leaf gets a
# LocalQueue in each of them regardless of which tree is applied.
#
# They are shared, so no fixture owns them. A file that declared one would
# delete it on `kubectl delete -f`, taking every other tenant's workloads with
# it. If they are missing — a standup that did not finish — create them by hand:
#
#   kubectl create namespace kwok-sim
#   kubectl create namespace kwok-sim-batch
#
# Bare, exactly as a workload-mode controller makes it: role and nothing else.
# Applying it where one already exists changes nothing.
apiVersion: ome.io/v1beta1
kind: AcceleratorQuota
metadata:
  name: root
spec:
  role: Cohort
---
apiVersion: ome.io/v1beta1
kind: AcceleratorQuota
metadata:
  name: sim-tenants
spec:
  role: Cohort
  parentRef:
    name: root
  budgets:
  - resourceName: google.com/tpu
    resourceFlavor: tpu7x
    nominal: 64
---
apiVersion: ome.io/v1beta1
kind: AcceleratorQuota
metadata:
  name: sim-tenants.serving
spec:
  role: ClusterQueue
  parentRef:
    name: sim-tenants
  budgets:
  - resourceName: google.com/tpu
    resourceFlavor: tpu7x
    nominal: 48
---
apiVersion: ome.io/v1beta1
kind: AcceleratorQuota
metadata:
  name: sim-tenants.batch
spec:
  role: ClusterQueue
  parentRef:
    name: sim-tenants
  budgets:
  - resourceName: google.com/tpu
    resourceFlavor: tpu7x
    nominal: 16
