# A three-node AcceleratorQuota tree over the simulated fleet (OEP-0024).
#
#   root                 Cohort        (self-created, no budget)
#   └── sim-tenants      Cohort        64 chips
#       ├── sim-serving  ClusterQueue  48 chips   ns kwok-sim
#       └── sim-batch    ClusterQueue  16 chips   ns kwok-sim-batch
#
# The reserved root is NOT declared here. The controller creates it itself, and
# creates it bare, so a cluster reports its derived capacity before anyone has
# authored a budget — a management plane sizing a Proportional split needs to
# read a member's capacity exactly when that member has no tree yet. Declaring
# it in a fixture would duplicate that and hand the object to a second writer.
#
# Containment is exercised at sim-tenants: a parent's nominal must be at least
# the sum of its children's, per (resource, flavor), and 48 + 16 is exactly 64.
# It is NOT exercised at the root, because a node carrying no budgets is skipped
# — the check compares numbers and the root has none. To enforce a fleet total,
# patch one onto the root the controller made:
#
#   kubectl patch aq root --type=merge -p \
#     '{"spec":{"budgets":[{"resourceName":"google.com/tpu","resourceFlavor":"tpu7x","nominal":64}]}}'
#
# 64 is one cube. The default --cubes 4x4x4,2x2x2 is two, so this tree budgets
# half the fleet and the root's status.capacity reports the whole of it — which
# is the number to read these against.
#
# up.sh does not apply this: a tree is what you are here to write, and the
# component works without one. Apply it by hand for a starting point:
#
#   kubectl apply -f hack/kwok-sim/fixtures/31-acceleratorquota.yaml
#   kubectl get aq -o wide
#   kubectl get cohorts,clusterqueues,localqueues -A
#
# 32, 33 and 34 are smaller trees for particular behaviours. They hang off the
# same self-created root and bind their own namespaces, so they coexist with
# this one — until you patch a fleet total onto the root, at which point they
# all count against it and the sum matters. Remove one with
# `kubectl delete aq <name>`, which is also what reaps its Kueue objects: the
# nodes carry a finalizer and nothing else removes them, since a frozen node
# keeps its objects on purpose.
#
#   32  one leaf, no grouping tier — the smallest thing that materializes
#   33  containment violated on purpose — the freeze rule
#   34  a budget naming a flavor that does not exist — FlavorMissing
#
# The tenant namespaces are carried here rather than left to up.sh so that
# stays a single self-contained command.
apiVersion: v1
kind: Namespace
metadata:
  name: kwok-sim
---
apiVersion: v1
kind: Namespace
metadata:
  name: kwok-sim-batch
---
apiVersion: ome.io/v1beta1
kind: AcceleratorQuota
metadata:
  name: sim-tenants
spec:
  role: Cohort
  parentRef:
    name: root
  budgets:
  - resourceName: google.com/tpu
    resourceFlavor: tpu7x
    nominal: 64
---
apiVersion: ome.io/v1beta1
kind: AcceleratorQuota
metadata:
  name: sim-serving
spec:
  role: ClusterQueue
  parentRef:
    name: sim-tenants
  # A namespace charges exactly one leaf fleet-wide, which is why the second
  # tenant below gets its own.
  namespaces:
  - kwok-sim
  budgets:
  - resourceName: google.com/tpu
    resourceFlavor: tpu7x
    nominal: 48
---
apiVersion: ome.io/v1beta1
kind: AcceleratorQuota
metadata:
  name: sim-batch
spec:
  role: ClusterQueue
  parentRef:
    name: sim-tenants
  namespaces:
  - kwok-sim-batch
  budgets:
  - resourceName: google.com/tpu
    resourceFlavor: tpu7x
    nominal: 16
