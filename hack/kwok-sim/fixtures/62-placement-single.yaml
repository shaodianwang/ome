# One winner, and the loser swept.
#
#   kubectl --context kind-ome-quota-hub apply -f hack/kwok-sim/fixtures/62-placement-single.yaml
#
# Single mode fans the derived copy out to every candidate, lets them race, and
# keeps whichever is admitted first — status.placement.cluster names it. The
# other member's derived and its pods are then deleted.
#
# Which member wins is NOT fixed, and no fixture can make it so: the race is
# decided by whichever member's Kueue admits first. Read the winner rather than
# assuming one.
#
#   kubectl --context kind-ome-quota-hub -n kwok-sim get isvc place-single \
#     -o jsonpath='{.status.placement.phase} {.status.placement.cluster}{"\n"}'
#
# Watch the sweep on the loser:
#
#   kubectl --context kind-ome-quota-b -n kwok-sim get isvc,pods -w
#
# Needs 50-fleet-proportional.yaml applied first. It funds a whole cube on both
# members; under 51 or 52 only one member can admit, so the race is decided
# before it starts.
#
# Needs the enrolled namespace kwok-sim, which up.sh and fleet-up.sh create on
# every cluster. No fixture declares it: it is shared, so a file that owned it
# would take every other tenant down on `kubectl delete -f`. If it is missing:
# `kubectl create namespace kwok-sim`.
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata:
  name: place-single
  namespace: kwok-sim
  annotations:
    # The leaf this workload charges. Placement resolves the queue from this
    # first and the operator-configured default second, and that default is
    # empty on purpose: a LocalQueue is named for its leaf, so no one fleet-wide
    # name can address more than one tenant. Until the ISVC->(queue, priority)
    # resolver lands, a workload names its own leaf.
    ome.io/local-queue: sim-tenants.serving
  labels:
    kwok-sim/managed: "true"
spec:
  placement:
    policy: ClusterAffinity
    mode: Single
    clusterAffinity:
      - matchExpressions:
          - key: accelerator
            operator: In
            values: [tpu7x]
  model:
    name: demo-noop
  runtime:
    name: tpu7x-4x4x4
  engine:
    minReplicas: 1
    maxReplicas: 1
    leader: {}
    worker:
      size: 15
