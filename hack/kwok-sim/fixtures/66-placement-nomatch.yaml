# The negative control: a placement that matches nothing.
#
#   kubectl --context kind-ome-quota-hub apply -f hack/kwok-sim/fixtures/66-placement-nomatch.yaml
#
# No WorkloadCluster carries this label, so candidate matching returns nothing
# and the ISVC is never fanned out. Worth applying once, because "no derived
# anywhere" is also what a broken transport looks like. The ISVC status reads
# the same for both — phase Pending, Ready=Unknown/PlacementPending — and only
# the manager's log names the reason, NoMatch here, NoReadyClusters for the
# transport:
#
#   kubectl --context kind-ome-quota-hub -n ome logs deploy/ome-controller-manager \
#     | grep 'no placement candidates' | grep place-nomatch
#
# The same shape is a live source the orphan GC must never touch, so leaving it
# applied while exercising the others costs nothing and keeps a survivor in the
# sweep's view.
#
# Note the distinction it does NOT show: an ISVC with no spec.placement at all
# is not a fleet object and is never considered. Declaring a requirement that
# matches no cluster is a different state, and this is that one. Dropping the
# clusterAffinity term is a third: under ClusterAffinity an omitted affinity
# matches every registration.
#
# Needs the enrolled namespace kwok-sim, which up.sh and fleet-up.sh create on
# every cluster. No fixture declares it: it is shared, so a file that owned it
# would take every other tenant down on `kubectl delete -f`. If it is missing:
# `kubectl create namespace kwok-sim`.
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata:
  name: place-nomatch
  namespace: kwok-sim
  annotations:
    # The leaf this workload charges. Placement resolves the queue from this
    # first and the operator-configured default second, and that default is
    # empty on purpose: a LocalQueue is named for its leaf, so no one fleet-wide
    # name can address more than one tenant. Until the ISVC->(queue, priority)
    # resolver lands, a workload names its own leaf.
    ome.io/local-queue: sim-tenants.serving
  labels:
    kwok-sim/managed: "true"
spec:
  placement:
    policy: ClusterAffinity
    mode: Single
    clusterAffinity:
      - matchExpressions:
          - key: accelerator
            operator: In
            values: [does-not-exist]
  model:
    name: demo-noop
  runtime:
    name: tpu7x-4x4x4
  engine:
    minReplicas: 1
    maxReplicas: 1
    leader: {}
    worker:
      size: 15
