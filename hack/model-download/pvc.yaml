# Sample PVC for staging model weights on shared-vast (dynamically provisioned PV,
# Retain). download-job.yaml mounts it by this name.
# Reusable as-is: do NOT set spec.volumeName for a fresh claim (the provisioner
# binds a new PV). Generate variants with gen-download.sh.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ckpt-example-model
  namespace: <namespace>
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: shared-vast
  volumeMode: Filesystem
  resources:
    requests:
      storage: 3Ti
