# Provenance for the instance-machine cells corrected in the owner review
# session of 2026-09-20, which reconciled two decisions that had been
# written into the table as if only one of them applied: a global pause
# freezes REPAIR, and a fact-bearing hold authority (the scheduler's
# Unschedulable verdict, a PodGroup name being collected, a name a silent
# node still holds) TAKES a paused row. The engine wrote those holds only
# from the repair pass, so on a paused row they were never recorded and
# the precedence was never reached. The cells below now state the
# corrected behavior: under a pause the hold authorities keep recording
# and releasing, and only the repair they would otherwise decide is
# withheld.
#
# Provenance for the instance-machine cells an owner decided in the review
# session of 2026-09-20, which settled what a Held RetryBlock denies: every
# pod at the held revision, not only the first attempt at it. The Create
# pass's fill of a member a row lost, and the remainder of an attempt already
# materializing, are held on the same record as a fresh start; the milder
# states (a backoff still running, the one-at-a-time authorization) keep
# governing the opening of an attempt only.
#
# Provenance for the Update/GangSurgeTargetCleanup pod.waiting cell, which
# the same session reconciled with the arrow it contradicted. The cell read
# ignore in every window on the ground that the retirement's delete makes
# the pod invisible to the stuck classifier, while the declared arrow
# T-gangcleanup-stuck-failed said the row goes to Failed. Both halves of
# that were half true, and the classifier's rule is what settles it: it
# skips a pod carrying a deletionTimestamp, so the reading is open exactly
# while the retirement has landed no delete — the delete refused by the
# apiserver, withheld on the surge bucket's unsatisfied expectations, or
# never issued because the claim no longer matches the source's target.
# Nothing retires the row on a stuck reading in those windows: the marker
# outlives the wedge until an admitted delete or the operation deadline
# ends it. So the arrow is reachable and stays, and the cell is split the
# way the state's own timer.stuckPodGrace cell already was — before goes
# to Failed on the seven terminal kubelet reasons, boundary and after are
# ignore because the escalation pass skips an already-Failed row, and
# DeadlineExceeded stays ignore because the classifier never matches a
# reason the deadline backstop wrote. The stamp is diagnostic: the cleanup
# claim matches on revision and step, never phase.
#
# Provenance for the instance-machine cells an owner decided in the review
# session of 2026-09-20, which gave the gang surge the drain wait the
# single-pod surge already had: the source gang's serving gate is cleared on
# one pass and its pods are deleted on the pass that observes every routed
# member out of the per-revision routed Service.
# Selectors match the cells files exactly: an empty variants, windows or
# transition matches all of them.
history:

  # --- cells-create.yaml ---
  - {state: Create/CreatePods, event: pod.unschedulable, variants: [source], windows: [], transition: "", decision: owner-review-2026-09-20}
  - {state: Create/CreatePods, event: gang.podGroup, variants: [Terminating], windows: [], transition: "", decision: owner-review-2026-09-20}

  # --- cells-migrate.yaml ---
  - {state: Migrate/CreateSurge, event: pod.unschedulable, variants: [], windows: [], transition: "", decision: owner-review-2026-09-20}
