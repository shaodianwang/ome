# Bugfix provenance for the review cells in
# tests/rolloutspec/machines/instance/cells-create.yaml.
# Selectors match cells the same way grid expansion does: an empty
# variants / windows / transition matches all of them.
history:
  - state: Create/CreatePods
    event: pod.waiting
    variants: [ImagePullBackOff, ErrImagePull, InvalidImageName, CreateContainerConfigError]
    windows: [before]
    transition: ""
    prs: ["#1013"]
  - state: Create/CreatePods
    event: spec.revision
    variants: []
    windows: [before]
    transition: ""
    prs: ["#1013"]
  - state: Create/CreatePods
    event: spec.revision
    variants: []
    windows: [boundary, after]
    transition: ""
    prs: ["#1013"]
  - state: Create/CreatePods
    event: spec.replicasDown
    variants: []
    windows: [before]
    transition: ""
    prs: ["#1044"]
  - state: Create/CreatePods
    event: spec.replicasDown
    variants: []
    windows: [boundary, after]
    transition: ""
    prs: ["#1044"]
  - state: Create/CreatePods
    event: spec.pauseTrue
    variants: []
    windows: []
    transition: ""
    prs: ["#1279", "#762"]
  - state: Create/CreatePods
    event: spec.pauseFreeze
    variants: []
    windows: []
    transition: ""
    prs: ["#1279"]
  - state: Create/CreatePods
    event: spec.unpause
    variants: []
    windows: []
    transition: ""
    prs: ["#762"]
  - state: Create/CreatePods
    event: timer.operationDeadline
    variants: []
    windows: [before]
    transition: ""
    prs: ["#1013", "#1491", "#1507"]
  - state: Create/CreatePods
    event: api.conflict
    variants: []
    windows: []
    transition: ""
    prs: ["#872"]
  - state: Create/CreatePods
    event: api.quotaDenied
    variants: []
    windows: []
    transition: ""
    prs: ["#1147", "#1501"]
  - state: Create/CreatePods
    event: pod.phaseTerminal
    variants: []
    windows: []
    transition: ""
    prs: ["#1494"]

  # --- apiserver-rejection classification and scheduler-hold evidence ------
  - {state: Create/CreatePods, event: api.invalid, variants: [], windows: [], transition: "", prs: ["#1501"]}
  - {state: Create/CreatePods, event: api.throttled, variants: [], windows: [], transition: "", prs: ["#1501"]}
  - {state: Create/CreatePods, event: api.namespaceTerminating, variants: [], windows: [], transition: "", prs: ["#1501"]}
  - {state: Create/CreatePods, event: pod.unschedulable, variants: [source], windows: [], transition: "", prs: ["#1503"]}

  # --- PodGroup status as a decision input --------------------------------
  - {state: Create/CreatePods, event: gang.podGroup, variants: [Deleted], windows: [], transition: "", prs: ["#1506"]}
  - {state: Create/CreatePods, event: gang.podGroup, variants: [OwnershipConflict], windows: [], transition: "", prs: ["#1506"]}
  - {state: Create/CreatePods, event: gang.podGroup, variants: [PhaseFailed], windows: [], transition: "", prs: ["#1506"]}
  - {state: Create/CreatePods, event: gang.podGroup, variants: [Terminating], windows: [], transition: "", prs: ["#1506"]}
  - {state: Create/CreatePods, event: gang.podGroup, variants: [Unschedulable, ScheduleTimeout], windows: [], transition: "", prs: ["#1506"]}
  - {state: Create/CreatePods, event: pod.unschedulable, variants: [source], windows: [], transition: "", prs: ["#1506"]}
