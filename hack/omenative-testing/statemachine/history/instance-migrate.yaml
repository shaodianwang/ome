# Provenance for the review cells in
# tests/rolloutspec/machines/instance/cells-migrate.yaml.
# Selectors mirror the cell they annotate exactly; empty variants, windows
# and transition match everything, as in a cell selector.
#
# What each number changed, for the reader who does not want to open them:
#   #832  the owner's status.migrations record became the authority (accept
#         mailbox, record-driven dispatch, pair identity guards)
#   #869  the audit ledger's writes became compare-and-swap
#   #871  both escalation paths skip a Migrate-pinned row
#   #878  migration terminality: stuck-Terminating escalation inside the
#         drive, the expiry wedge exception, the absent-surge-slot resume
#   #1106 migration and update surges serialized on one Instance
#   #1122 a promoted surge resumes instead of re-promoting after a crash
#   #1147 a quota-blocked surge create is polled, not failed
#
# The decision reference parked-drain-yields-dispatch-head records the
# dispatch-head rule for a migration parked on its source teardown: a
# Draining record whose every source pod is Terminating past its own
# deletion deadline is tended in place and yields the head, so a queued
# Manual request is driven behind it instead of waiting on a kubelet that
# missed its own deadline.
