# p4678: [gen] ctrlrestart rollback engine-mn W1 N=2 SurgeThenDrain s1  Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 fault=ctrlrestart:settling co=none topo=engine-mn during=rotating rollback=1
# reason: the engine is bumped and the starting revision re-applied at the first pod of the new revision on engine alone as gangs of 1 leader + 1 worker, and as it lands the manager pod is deleted; the restarted manager carries nothing in memory and resumes the operation from status: nothing is created twice (peaks within the ceiling, no index collision) and nothing is deleted twice (every Component ends at its count); the rollback completes with every Instance back on the starting revision and serving, no pod of the new revision left, with every row settled and no hold left behind; each Instance is a gang, created and drained whole
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p4678 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
