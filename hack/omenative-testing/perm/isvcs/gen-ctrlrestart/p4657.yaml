# p4657: [gen] ctrlrestart drain pd-mn W1 N=2 SurgeThenDrain s1 co rolling  Ne=2 Nd=2 Nr=2 ceil_e=3 ceil_d=3 ceil_r=2 fault=ctrlrestart:rotating co=rolling topo=pd-mn
# reason: the manager pod is deleted at the first replacement observed, while its source drains and the next replacement is due; the restarted manager carries nothing in memory and resumes the operation from status; nothing is created twice (peaks within the ceiling, no index collision) and nothing is deleted twice (every Component ends at its count); the roll finishes within the same surge budget, every source drained once and every Instance ends on the new revision; the rolling group paces engine and decoder together and its run resumes with the roll
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p4657 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          rollingUpdate: {}
