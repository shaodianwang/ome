# p4668: [gen] ctrlrestart rollback engine N=4 SurgeThenDrain s1  Ne=4 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 fault=ctrlrestart:settling co=none topo=engine during=rotating rollback=1
# reason: the engine is bumped and the starting revision re-applied at the first pod of the new revision on engine alone, single-pod, and as it lands the manager pod is deleted; the restarted manager carries nothing in memory and resumes the operation from status: nothing is created twice (peaks within the ceiling, no index collision) and nothing is deleted twice (every Component ends at its count); the rollback completes with every Instance back on the starting revision and serving, no pod of the new revision left, with every row settled and no hold left behind
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p4668 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
