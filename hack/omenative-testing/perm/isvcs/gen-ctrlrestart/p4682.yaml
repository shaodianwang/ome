# p4682: [gen] ctrlrestart delete engine-mn W1 N=2  mode=recreate Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 fault=ctrlrestart:settling co=none topo=engine-mn
# reason: the service is deleted on engine alone as gangs of 1 leader + 1 worker, and as it lands the manager pod is deleted; the restarted manager carries nothing in memory and resumes the operation from status: nothing is created twice (peaks within the ceiling, no index collision) and nothing is deleted twice (every Component ends at its count); the delete completes with nothing of the service left, and the same manifest re-applied under the same name comes up whole on fresh pods, with every row settled and no hold left behind; each Instance is a gang, created and drained whole
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p4682 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
