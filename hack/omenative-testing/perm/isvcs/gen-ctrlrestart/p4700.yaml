# p4700: [gen] ctrlrestart idle once engine-mn W1 N=2  Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 fault=ctrlrestart:idle co=none topo=engine-mn during=idle
# reason: nothing is pushed on engine alone as gangs of 1 leader + 1 worker; the manager pod is deleted once while the service is settled: no pod of the service is created or deleted, every Instance stays Ready and serving on its running revision and no repair is recorded; the restarted manager carries nothing in memory and reads a fleet with no operation open from status, so it starts none; after the restart every row is Ready with no operation open and no hold; each Instance is a gang and stays whole
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p4700 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
