# p8543: [gen] crash once load new router engine+router N=4 SurgeThenDrain s1 rp RecreateInstance  Ne=4 Nd=0 Nr=2 ceil_e=5 ceil_d=0 ceil_r=3 restart=RecreateInstance fault=crashloop:new co=none topo=engine bump=engine,router form=load victimcomp=router once=1 floor_slack=1
# reason: the engine and the router are bumped together by name and roll side by side, each under its own surge; the pod of the first router Instance the push brings up has its runner killed once, once it is Ready and serving; the kubelet starts the container again and nothing kills it twice; RecreateInstanceOnPodRestart reads the runner's restart after Ready as its trigger: the Instance is rebuilt whole exactly once, named by one RestartTriggered event, and never rebuilt again; every bumped Instance ends on the new revision serving within the roll's budget, the killed one included, no row reads Failed, no hold or retry ladder was opened for it, the rows settle with no operation open, and the floor allows for the one Instance the kill takes while it restarts
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8543 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
