# p8481: [gen] crash once start idle pd N=4 rp RecreateInstance  Ne=4 Nd=4 Nr=2 ceil_e=4 ceil_d=4 ceil_r=2 restart=RecreateInstance fault=crashloop:old co=none topo=pd form=start during=idle once=1
# reason: the pod of the engine's highest Instance has its runner killed once, during its first start, before it was ever Ready; the kubelet starts the container again and nothing kills it twice; nothing is pushed; RecreateInstanceOnPodRestart reads a runner restart, and whether one before the first Ready counts is reported: a rebuild is allowed once, named by a RestartTriggered event, never twice; at the end the Instance is Ready and serving on the revision it should run, no row reads Failed, no hold or retry ladder was opened for it, the rows settle with no operation open, and every pod carries the label of what it runs; decoder and router stay as they were
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8481 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
