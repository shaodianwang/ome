# p8403: [gen] crash once load idle engine N=4 rp RecreateInstance  Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 restart=RecreateInstance fault=crashloop:old co=none topo=engine form=load during=idle once=1
# reason: the pod of the engine's highest Instance has its runner killed once, once it is Ready and serving; the kubelet starts the container again and nothing kills it twice; nothing is pushed; RecreateInstanceOnPodRestart reads the runner's restart after Ready as its trigger: the Instance is rebuilt whole exactly once, named by one RestartTriggered event, and never rebuilt again; at the end the Instance is Ready and serving on the revision it should run, no row reads Failed, no hold or retry ladder was opened for it, the rows settle with no operation open, and every pod carries the label of what it runs
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8403 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
