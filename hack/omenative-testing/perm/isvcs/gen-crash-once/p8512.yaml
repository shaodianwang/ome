# p8512: [gen] crash once start new pd-mn W1 N=2 SurgeThenDrain s1 rp None  Ne=2 Nd=2 Nr=2 ceil_e=3 ceil_d=2 ceil_r=2 restart=None fault=crashloop:new co=none topo=pd-mn form=start once=1 floor_slack=1
# reason: the leader pod of the first engine Instance the push brings up has its runner killed once, during its first start, before it was ever Ready; the kubelet starts the container again and nothing kills it twice; the SurgeThenDrain roll lands the new revision on every engine Instance within its budget; restart policy None promises no repair for a container the kubelet restarts: no RestartTriggered event names the Instance and its pod keeps its identity; at the end the Instance is Ready and serving on the revision it should run, no row reads Failed, no hold or retry ladder was opened for it, the rows settle with no operation open, and every pod carries the label of what it runs; the floor allows for the one Instance the kill takes while it restarts; decoder and router stay as they were
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8512 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
