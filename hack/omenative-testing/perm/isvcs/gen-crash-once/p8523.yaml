# p8523: [gen] crash once load idle router engine+router N=4 rp RecreateInstance  Ne=4 Nd=0 Nr=2 ceil_e=4 ceil_d=0 ceil_r=2 restart=RecreateInstance fault=crashloop:old co=none topo=engine form=load during=idle victimcomp=router once=1
# reason: the pod of the router's highest Instance has its runner killed once, once it is Ready and serving; the kubelet starts the container again and nothing kills it twice; nothing is pushed, so the router's own restart policy decides the repair: RecreateInstanceOnPodRestart reads the runner's restart after Ready as its trigger: the Instance is rebuilt whole exactly once, named by one RestartTriggered event, and never rebuilt again; at the end the router Instance is Ready and serving on its running revision, no row reads Failed, no hold or retry ladder was opened for it, the rows settle with no operation open, and every pod carries the label of what it runs; the engine, which nothing broke, keeps its pods and serves N
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8523 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
