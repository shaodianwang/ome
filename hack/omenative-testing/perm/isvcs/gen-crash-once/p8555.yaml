# p8555: [gen] crash once start new decoder pd N=4 SurgeThenDrain s1 rp RecreateInstance  Ne=4 Nd=4 Nr=2 ceil_e=5 ceil_d=5 ceil_r=2 restart=RecreateInstance fault=crashloop:new co=rolling topo=pd bump=engine,decoder form=start victimcomp=decoder once=1 floor_slack=1
# reason: the rollingUpdate group lists engine and decoder, so the bump carries both and the group paces them as one run; the pod of the first decoder Instance the push brings up has its runner killed once, during its first start, before it was ever Ready; the kubelet starts the container again and nothing kills it twice; RecreateInstanceOnPodRestart reads a runner restart, and whether one before the first Ready counts is reported: a rebuild is allowed once, named by a RestartTriggered event, never twice; every bumped Instance ends on the new revision serving within the roll's budget, the killed one included, no row reads Failed, no hold or retry ladder was opened for it, the rows settle with no operation open, and the floor allows for the one Instance the kill takes while it restarts
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8555 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          rollingUpdate: {}
