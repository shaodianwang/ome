# p8567: [gen] crash once load new decoder pd-mn W1 N=2 SurgeThenDrain s1 rp RecreateInstance  Ne=2 Nd=2 Nr=2 ceil_e=3 ceil_d=3 ceil_r=2 restart=RecreateInstance fault=crashloop:new co=rolling topo=pd-mn bump=engine,decoder form=load victimcomp=decoder once=1 floor_slack=1
# reason: the rollingUpdate group lists engine and decoder, so the bump carries both and the group paces them as one run; the leader pod of the first decoder Instance the push brings up has its runner killed once, once it is Ready and serving; the kubelet starts the container again and nothing kills it twice; RecreateInstanceOnPodRestart reads the runner's restart after Ready as its trigger: the Instance is rebuilt whole exactly once, named by one RestartTriggered event, and never rebuilt again; every bumped Instance ends on the new revision serving within the roll's budget, the killed one included, no row reads Failed, no hold or retry ladder was opened for it, the rows settle with no operation open, and the floor allows for the one Instance the kill takes while it restarts
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8567 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          rollingUpdate: {}
