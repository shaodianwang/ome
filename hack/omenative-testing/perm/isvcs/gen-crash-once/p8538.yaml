# p8538: [gen] crash once start old router engine+router N=4 SurgeThenDrain s1 rp RecreateInstance  Ne=4 Nd=0 Nr=2 ceil_e=5 ceil_d=0 ceil_r=2 restart=RecreateInstance fault=crashloop:old co=none topo=engine bump=engine form=start victimcomp=router once=1 floor_slack=1
# reason: the engine is bumped alone and, as the bump lands, the pod of the router's highest Instance has its runner killed once, during its first start, before it was ever Ready; the kubelet starts the container again and nothing kills it twice; the roll never touches the router, so its own restart policy decides the repair: RecreateInstanceOnPodRestart reads a runner restart, and whether one before the first Ready counts is reported: a rebuild is allowed once, named by a RestartTriggered event, never twice; the SurgeThenDrain roll lands the new revision on every engine Instance within its budget; at the end the router Instance is Ready and serving on its running revision, no row reads Failed, no hold or retry ladder was opened for it, the rows settle with no operation open, and the floor allows for the one Instance the kill takes while it restarts
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8538 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
