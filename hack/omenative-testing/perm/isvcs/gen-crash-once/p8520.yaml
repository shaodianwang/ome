# p8520: [gen] crash once start idle router engine+router N=4 rp None  Ne=4 Nd=0 Nr=2 ceil_e=4 ceil_d=0 ceil_r=2 restart=None fault=crashloop:old co=none topo=engine form=start during=idle victimcomp=router once=1
# reason: the pod of the router's highest Instance has its runner killed once, during its first start, before it was ever Ready; the kubelet starts the container again and nothing kills it twice; nothing is pushed, so the router's own restart policy decides the repair: restart policy None promises no repair for a container the kubelet restarts: no RestartTriggered event names the Instance and its pod keeps its identity; at the end the router Instance is Ready and serving on its running revision, no row reads Failed, no hold or retry ladder was opened for it, the rows settle with no operation open, and every pod carries the label of what it runs; the engine, which nothing broke, keeps its pods and serves N
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8520 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
