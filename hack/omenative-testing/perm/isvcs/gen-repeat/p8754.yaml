# p8754: [gen] repeat ctrlrestart push engine +router N=4 SurgeThenDrain s1 x3  Ne=4 Nd=0 Nr=2 ceil_e=5 ceil_d=0 ceil_r=2 fault=ctrlrestart:settling co=none topo=engine repeat=3
# reason: the manager is deleted right after the bump and again each time it is Ready, 3 times, while the roll lands under SurgeThenDrain: the roll resumes from status after every restart and converges with every Instance on the new revision; a restarted manager carries nothing in memory and resumes from status, so nothing is created twice (peaks within the ceiling, pods within what the operation explains, no index collision) and nothing is built on a third revision; after the last restart every row is Ready with no operation open and no hold
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8754 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
