# p8804: [gen] repeat evict push pd-mn W1 N=2 SurgeThenDrain s1 rp None x3  Ne=2 Nd=2 Nr=2 ceil_e=3 ceil_d=2 ceil_r=2 fault=evict:rotating order_soft=1 co=none topo=pd-mn victim=stable victimcomp=engine repeat=3 floor_slack=1
# reason: one engine pod is evicted through the Eviction API, the way a drain removes it, again each time its Instance is back and serving while the roll lands under SurgeThenDrain, 3 times, then left alone: the roll converges with every Instance on the new revision; across the window the untouched Instances hold the floor (N-maxUnavailable-1), the status reports each loss and never counts the short Instance whole, every repair recorded is for an Instance the fault took, the pods created are those repairs and the roll's own pods and no more (no hot loop), no pod comes back on a revision the service never pushed; after the lift every Instance is Ready and serving on its revision with no row mid-operation and no hold left behind; decoder and router are negative controls (co=none); order waived — each deletion is a drain with no preceding surge; an eviction the disruption budget refuses is asked again every few seconds and the operation's window waits for that repetition; under a budget that keeps refusing while the operation holds an Instance down, the repetitions are those the budget admits, at least one
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8804 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
