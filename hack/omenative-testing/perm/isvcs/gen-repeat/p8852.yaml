# p8852: [gen] repeat ctrlrestart delete engine-mn W1 +router N=2 x3  mode=recreate Ne=2 Nd=0 Nr=2 ceil_e=2 ceil_d=0 ceil_r=2 fault=ctrlrestart:settling co=none topo=engine-mn repeat=3
# reason: the service is deleted on engine behind a router as gangs of 1 leader + 1 worker, and as it lands the manager pod is deleted, and again each time it is Ready, 3 times in all, the window held open until the restarts are spent so the later ones land on the operation's settled end; the restarted manager carries nothing in memory and resumes the operation from status: nothing is created twice (peaks within the ceiling, no index collision) and nothing is deleted twice (every Component ends at its count); the delete completes with nothing of the service left, and the same manifest re-applied under the same name comes up whole on fresh pods; across the window no repair opens, the pods created are those the operation explains and no pod comes back on a revision the service never pushed; after the last restart every row is Ready with no operation open and no hold; each Instance is a gang, created and drained whole; the router is a negative control (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8852 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
