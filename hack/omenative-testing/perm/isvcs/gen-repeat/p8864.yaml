# p8864: [gen] repeat ctrlrestart scaledown pd-mn W1 N=2 x3  mode=scaledown Ne=2 Nd=2 Nr=2 ceil_e=2 ceil_d=2 ceil_r=2 fault=ctrlrestart:settling co=none topo=pd-mn to_e=1 repeat=3
# reason: the engine is scaled from N to N-1 on prefill/decode as gangs of 1 leader + 1 worker, and as it lands the manager pod is deleted, and again each time it is Ready, 3 times in all, the window held open until the restarts are spent so the later ones land on the operation's settled end; the restarted manager carries nothing in memory and resumes the operation from status: nothing is created twice (peaks within the ceiling, no index collision) and nothing is deleted twice (every Component ends at its count); the scale completes with the engine at N-1 and the survivors on their own pods; across the window no repair opens, the pods created are those the operation explains and no pod comes back on a revision the service never pushed; after the last restart every row is Ready with no operation open and no hold; each Instance is a gang, created and drained whole; decoder and router are negative controls (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8864 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
