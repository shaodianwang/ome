# p8818: [gen] repeat ctrlrestart push pd-mn W1 N=2 RecreatePod u1 x3  Ne=2 Nd=2 Nr=2 ceil_e=2 ceil_d=2 ceil_r=2 fault=ctrlrestart:settling co=none topo=pd-mn repeat=3
# reason: the manager is deleted right after the bump and again each time it is Ready, 3 times, while the roll lands under RecreatePod: the roll resumes from status after every restart and converges with every Instance on the new revision; a restarted manager carries nothing in memory and resumes from status, so nothing is created twice (peaks within the ceiling, pods within what the operation explains, no index collision) and nothing is built on a third revision; after the last restart every row is Ready with no operation open and no hold; decoder and router are negative controls (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8818 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
