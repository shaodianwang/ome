# p8723: [gen] repeat evict scale-up engine-mn W1 3->4 rp None x3  mode=scaledown Ne=3 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 fault=evict:settling co=none topo=engine-mn to_e=4 repeat=3 floor_slack=1
# reason: the engine grows from 3 to 4 while one engine pod is evicted through the Eviction API, the way a drain removes it, again each time its Instance is back and serving, 3 times, then left alone: the new Instance comes up and the scale lands at 4 with every Instance Ready; across the window the other Instances keep serving (floor N-1 on the engine, N elsewhere), the status reports each loss and never counts the short Instance whole, every repair recorded is for an Instance the fault took, the pods created are those repairs and the scale's new Instance and no more (no hot loop), no pod comes back on a revision the service never pushed; after the lift every Instance is Ready and serving on its revision with no row mid-operation and no hold left behind; exactly the removed pod is recreated each time under restart policy None
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8723 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
