# p8725: [gen] repeat evict push engine-mn W1 N=3 RecreatePod u1 rp None x3  Ne=3 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 fault=evict:rotating co=none topo=engine-mn victim=stable repeat=3 floor_slack=1
# reason: one engine pod is evicted through the Eviction API, the way a drain removes it, again each time its Instance is back and serving while the roll lands under RecreatePod, 3 times, then left alone: the roll converges with every Instance on the new revision; across the window the untouched Instances hold the floor (N-maxUnavailable-1), the status reports each loss and never counts the short Instance whole, every repair recorded is for an Instance the fault took, the pods created are those repairs and the roll's own pods and no more (no hot loop), no pod comes back on a revision the service never pushed; after the lift every Instance is Ready and serving on its revision with no row mid-operation and no hold left behind
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8725 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
