# p8800: [gen] repeat podkill steady pd-mn W1 N=2 rp None x3 target worker  mode=kill Ne=2 Nd=2 Nr=2 ceil_e=2 ceil_d=2 ceil_r=2 restart=None kill=worker co=none topo=pd-mn repeat=3
# reason: the worker of one engine gang is deleted by hand again each time its Instance is back and serving, 3 times, then left alone: each time exactly the removed pod is recreated under restart policy None within the budget and nothing else moves; across the window the other Instances keep serving (floor N-1), the status reports each loss and never counts the short Instance whole, every repair recorded is for an Instance the fault took, the pods created are those repairs and no more (no hot loop), no pod comes back on a revision the service never pushed and nothing surges on a service nobody bumped; after the lift every Instance is Ready and serving on its revision with no row mid-operation and no hold left behind
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8800 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
