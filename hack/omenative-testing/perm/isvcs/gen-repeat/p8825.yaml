# p8825: [gen] repeat preempt steady engine-mn W1 N=2 rp RecreateInstance x2  mode=kill Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 restart=RecreateInstance co=none topo=engine-mn via=preempt lift=after-settle repeat=2
# reason: one engine pod is preempted by a higher-priority filler (every node's spare CPU taken and every node closed to the case) again each time its Instance is placed and serving, 2 times, then left alone: each time the Instance waits with reason Unschedulable until the lift opens the nodes and drops the fillers, then the whole Instance (leader and workers) is rebuilt under restart policy RecreateInstanceOnPodRestart, nothing is taken down to make room and the fleet is back at N; across the window the status reports each loss and never counts the short Instance whole, every repair recorded is for an Instance the fault took, the pods created are those repairs and no more (no hot loop), no pod comes back on a revision the service never pushed; after the lift every Instance is Ready and serving on its revision with no row mid-operation and no hold left behind
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8825 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
