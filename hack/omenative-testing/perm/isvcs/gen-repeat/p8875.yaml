# p8875: [gen] repeat podkill scaledown engine-mn W1 N=3 rp RecreateInstance target worker x3  mode=scaledown Ne=3 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 restart=RecreateInstance kill=worker fault=podkill:settling co=none topo=engine-mn to_e=2 floor_slack=1 repeat=3
# reason: the engine is scaled from N to N-1 on engine alone as gangs of 1 leader + 1 worker, and as it lands the worker of one serving engine gang is deleted by hand, and again each time its Instance is back and serving, 3 times in all, then left alone; the controller replaces what the deletion took, the floor lowered by that one Instance holds, and the scale completes with the engine at N-1 and the survivors on their own pods (the Instance the deletion took rebuilt by design); across the window the status reports each loss and never counts the short Instance whole, every repair recorded is for an Instance the fault took, the pods created are those repairs and the operation's own pods and no more (no hot loop), no pod comes back on a revision the service never pushed; after the lift every Instance is Ready and serving on its revision with no row mid-operation and no hold left behind; under restart policy RecreateInstanceOnPodRestart the gang is rebuilt as a whole (a RestartTriggered names it) unless the operation takes it first, and the gang is never counted as serving while a member is missing
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8875 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
