# p4373: [gen] node canary pd-mn W1 N=2 persistent lift after-recover  mode=canary Ne=2 Nd=2 Nr=2 ceil_e=3 ceil_d=3 ceil_r=2 fault=node:canary-serving@0 floor_soft=1 co=none topo=pd-mn canary=auto lift=after-recover needs=forcedelete
# reason: the engine is bumped under the story ladder with automatic promotion on engine+decoder+router gang (2 Instances of 1 leader + 1 worker), and while the first step soaks its split the kubelet of the node under the highest stable-side engine Instance is stopped; the node reads NotReady on the cluster's own grace and no pod of the Instance on it serves, every other pod that node ran going with it, so the capacity floor is reported rather than judged; the node stays down: once its unreachable evidence is older than the deployed force-delete threshold the policy frees the pod names it holds and the controller rebuilds the Instance on other nodes, Ready and serving with every pod the node held replaced, while the node is still down; then the kubelet is started again with nothing of the Instance left on it; the ladder walks every step to Stable with every Instance on the canary revision and serving, with every row settled, no hold left behind and the reset mailbox never written; each Instance is a gang, so the loss takes the member the node ran and the restart policy decides whether that member or the whole gang is rebuilt
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p4373 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    # The eval judges a case well inside the cluster's default pod grace; a pod that ignores its stop signal must not outlive the verdict.
    terminationGracePeriodSeconds: 60
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    # The eval judges a case well inside the cluster's default pod grace; a pod that ignores its stop signal must not outlive the verdict.
    terminationGracePeriodSeconds: 60
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    # The eval judges a case well inside the cluster's default pod grace; a pod that ignores its stop signal must not outlive the verdict.
    terminationGracePeriodSeconds: 60
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          canary:
            steps:
              - { capacity: "10%", traffic: 10, pause: { duration: "20s" } }
              - { capacity: "30%", traffic: 30, pause: { duration: "20s" } }
              - { capacity: "60%", traffic: 60, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
