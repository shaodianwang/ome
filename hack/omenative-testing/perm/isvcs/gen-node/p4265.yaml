# p4265: [gen] node notready engine N=4 rp None mig Auto co rolling relocated  Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 fault=node:notready co=rolling topo=engine during=idle lift=after-recover expect=relocated needs=forcedelete
# reason: the kubelet under the highest-index engine Instance is stopped; the node reads NotReady and no pod of the Instance on it serves; once the node's unreachable evidence is older than the deployed force-delete threshold the policy frees the pod names it holds and the Instance is rebuilt on other nodes while the node is still down: the pod the node held is recreated at the same index on another node, and members on live nodes keep theirs; it serves on its running revision with no new revision and no reset mailbox; then the kubelet is started again and every pod the node held is gone; the move is the force-delete sweep plus the ordinary rebuild, not a migration, so migration mode Auto plays no part; a rebuild that recovers capacity already lost opens no new outage, so the rolling group does not hold it
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p4265 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", migrationPolicy: { mode: "Auto" }, updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          rollingUpdate: {}
