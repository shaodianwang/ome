# p4294: [gen] node notready pd-mn W1 N=2 rp RecreateInstance mig Never co none relocated  Ne=2 Nd=2 Nr=2 ceil_e=2 ceil_d=2 ceil_r=2 fault=node:notready co=none topo=pd-mn during=idle lift=after-recover expect=relocated needs=forcedelete
# reason: the kubelet under the highest-index engine Instance is stopped; the node reads NotReady and no pod of the Instance on it serves; once the node's unreachable evidence is older than the deployed force-delete threshold the policy frees the pod names it holds and the Instance is rebuilt on other nodes while the node is still down: the lost pod re-arms the whole-Instance rebuild on other nodes; it serves on its running revision with no new revision and no reset mailbox; then the kubelet is started again and every pod the node held is gone; the move is the force-delete sweep plus the ordinary rebuild, not a migration, so migration mode Never plays no part
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p4294 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", migrationPolicy: { mode: "Never" }, updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", migrationPolicy: { mode: "Never" }, updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
