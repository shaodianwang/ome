# p4241: [gen] node notready engine-mn W1 N=2 rp RecreateInstance mig Auto co none repaired  Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 fault=node:notready co=none topo=engine-mn during=idle lift=after-settle expect=repaired
# reason: the kubelet under the highest-index engine Instance is stopped and, once the node has read NotReady with no pod of the Instance on it serving for the settle window, started again; the pods it ran were never stopped, so the Instance returns to Ready and serving on its running revision within the budget, with no new revision and no reset mailbox; nothing else moves while the node is down: a NotReady pod is still present, so RecreateInstanceOnPodRestart reads neither a runner restart nor a lost gang member; migration mode Auto relocates only when an open attempt's deadline expires, and a Ready Instance has no attempt open
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p4241 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", migrationPolicy: { mode: "Auto" }, updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
