# p4326: [gen] node scaledown engine-mn W1 N=2 persistent lift after-recover  mode=scaledown Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 fault=node:settling floor_soft=1 co=none topo=engine-mn to_e=1 lift=after-recover needs=forcedelete
# reason: the engine is scaled from N to N-1 on engine alone as gangs of 1 leader + 1 worker, and as it lands the kubelet of the node under the highest engine Instance the scale keeps is stopped; the node reads NotReady on the cluster's own grace and no pod of the Instance on it serves, every other pod that node ran going with it, so the capacity floor is reported rather than judged; the node stays down: once its unreachable evidence is older than the deployed force-delete threshold the policy frees the pod names it holds and the controller rebuilds the Instance on other nodes, Ready and serving with every pod the node held replaced, while the node is still down; then the kubelet is started again with nothing of the Instance left on it; the scale completes with the engine at N-1 and the survivors on their own pods, with every row settled, no hold left behind and the reset mailbox never written; each Instance is a gang, so the loss takes the member the node ran and the restart policy decides whether that member or the whole gang is rebuilt
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p4326 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
