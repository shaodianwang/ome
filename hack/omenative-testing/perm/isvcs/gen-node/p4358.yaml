# p4358: [gen] node scaledown pd-mn W1 N=2 one-shot lift after-settle  mode=scaledown Ne=2 Nd=2 Nr=2 ceil_e=2 ceil_d=2 ceil_r=2 fault=node:settling floor_soft=1 co=none topo=pd-mn to_e=1 lift=after-settle
# reason: the engine is scaled from N to N-1 on prefill/decode as gangs of 1 leader + 1 worker, and as it lands the kubelet of the node under the highest engine Instance the scale keeps is stopped; the node reads NotReady on the cluster's own grace and no pod of the Instance on it serves, every other pod that node ran going with it, so the capacity floor is reported rather than judged; nothing rebuilds the Instance elsewhere in the meantime, and once that has held for the settle window the kubelet is started again: the pods it ran were never stopped, so they serve again on their own pods; the scale completes with the engine at N-1 and the survivors on their own pods, with every row settled, no hold left behind and the reset mailbox never written; each Instance is a gang, so the loss takes the member the node ran and the restart policy decides whether that member or the whole gang is rebuilt; decoder and router are negative controls (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p4358 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
