# p4376: [gen] node delete engine N=4 persistent lift after-recover  mode=recreate Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 fault=node:settling co=none topo=engine lift=after-recover needs=forcedelete
# reason: the service is deleted on engine alone, single-pod, and as it lands the kubelet of the node under the highest engine Instance is stopped; the node reads NotReady on the cluster's own grace and no pod of the Instance on it serves, every other pod that node ran going with it, so the capacity floor is reported rather than judged; the node stays down: the pods it held are stuck on their way out until its unreachable evidence is older than the deployed force-delete threshold and the policy frees their names, so the teardown completes with nothing of the service left in the API and the re-apply comes up whole on other nodes while the node is still down; then the kubelet is started again with nothing of the service left on it; the delete completes with nothing of the service left, and the same manifest re-applied under the same name comes up whole on fresh pods, with every row settled, no hold left behind and the reset mailbox never written
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p4376 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    # The eval judges a case well inside the cluster's default pod grace; a pod that ignores its stop signal must not outlive the verdict.
    terminationGracePeriodSeconds: 60
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
