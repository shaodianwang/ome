# p4332: [gen] node edit engine+router N=4 SurgeThenDrain s1 one-shot lift after-settle  Ne=4 Nd=0 Nr=2 ceil_e=5 ceil_d=0 ceil_r=2 fault=node:settling floor_soft=1 order_soft=1 co=none topo=engine during=rotating edit=strategy:RecreatePod lift=after-settle
# reason: the engine is bumped under SurgeThenDrain and its strategy edited to RecreatePod at the first pod of the new revision on engine behind a router, single-pod, and as it lands the kubelet of the node under the highest engine Instance still on the starting revision is stopped; the node reads NotReady on the cluster's own grace and no pod of the Instance on it serves, every other pod that node ran going with it, so the capacity floor is reported rather than judged; nothing rebuilds the Instance elsewhere in the meantime, and once that has held for the settle window the kubelet is started again: the pods it ran were never stopped, so they serve again on their own pods; the roll completes under the edited strategy with every Instance on the new revision and the edit on the live spec, with every row settled, no hold left behind and the reset mailbox never written; the router is a negative control (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p4332 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
