# p4344: [gen] node edit engine-mn W1+router N=2 SurgeThenDrain s1 persistent lift after-recover  Ne=2 Nd=0 Nr=2 ceil_e=3 ceil_d=0 ceil_r=2 fault=node:settling floor_soft=1 order_soft=1 co=none topo=engine-mn during=rotating edit=strategy:RecreatePod lift=after-recover needs=forcedelete
# reason: the engine is bumped under SurgeThenDrain and its strategy edited to RecreatePod at the first pod of the new revision on engine behind a router as gangs of 1 leader + 1 worker, and as it lands the kubelet of the node under the highest engine Instance still on the starting revision is stopped; the node reads NotReady on the cluster's own grace and no pod of the Instance on it serves, every other pod that node ran going with it, so the capacity floor is reported rather than judged; the node stays down: once its unreachable evidence is older than the deployed force-delete threshold the policy frees the pod names it holds and the controller rebuilds the Instance on other nodes, Ready and serving with every pod the node held replaced, while the node is still down; then the kubelet is started again with nothing of the Instance left on it; the roll completes under the edited strategy with every Instance on the new revision and the edit on the live spec, with every row settled, no hold left behind and the reset mailbox never written; each Instance is a gang, so the loss takes the member the node ran and the restart policy decides whether that member or the whole gang is rebuilt; the router is a negative control (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p4344 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    # The eval judges a case well inside the cluster's default pod grace; a pod that ignores its stop signal must not outlive the verdict.
    terminationGracePeriodSeconds: 60
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    # The eval judges a case well inside the cluster's default pod grace; a pod that ignores its stop signal must not outlive the verdict.
    terminationGracePeriodSeconds: 60
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
