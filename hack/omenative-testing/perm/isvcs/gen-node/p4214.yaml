# p4214: [gen] node notready engine N=4 rp RecreateInstance mig Never co rolling parked  Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 fault=node:notready co=rolling topo=engine during=idle lift=after-settle expect=parked
# reason: the kubelet under the highest-index engine Instance is stopped; the node reads NotReady and no pod of the Instance on it serves; nothing may rebuild the Instance while the node is down: a NotReady pod is still present, so RecreateInstanceOnPodRestart reads neither a runner restart nor a lost gang member; migration mode Never allows no migration at all; the rolling group would hold a repair while no run is open, and none opens; with no force-delete policy configured (the chart default) nothing frees its pod names, so across the hold window no new pod appears for it; then the kubelet is started again and only the teardown must converge; a rebuild elsewhere while the node is down is the force-delete path and fails this cell as configured
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p4214 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", migrationPolicy: { mode: "Never" }, updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          rollingUpdate: {}
