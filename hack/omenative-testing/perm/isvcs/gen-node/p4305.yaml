# p4305: [gen] node scaleup engine N=4 one-shot lift after-settle  mode=scaledown Ne=4 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 fault=node:settling floor_soft=1 co=none topo=engine to_e=5 lift=after-settle
# reason: the engine is scaled from N to N+1 on engine alone, single-pod, and as it lands the kubelet of the node under the highest engine Instance is stopped; the node reads NotReady on the cluster's own grace and no pod of the Instance on it serves, every other pod that node ran going with it, so the capacity floor is reported rather than judged; nothing rebuilds the Instance elsewhere in the meantime, and once that has held for the settle window the kubelet is started again: the pods it ran were never stopped, so they serve again on their own pods; the scale completes with the new Instance whole and serving and the survivors on their own pods, with every row settled, no hold left behind and the reset mailbox never written
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p4305 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
