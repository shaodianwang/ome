# p4219: [gen] node notready pd N=4 rp None mig Auto co rolling repaired  Ne=4 Nd=4 Nr=2 ceil_e=4 ceil_d=4 ceil_r=2 fault=node:notready co=rolling topo=pd during=idle lift=after-settle expect=repaired
# reason: the kubelet under the highest-index engine Instance is stopped and, once the node has read NotReady with no pod of the Instance on it serving for the settle window, started again; the pods it ran were never stopped, so the Instance returns to Ready and serving on its running revision within the budget, with no new revision and no reset mailbox; nothing else moves while the node is down: a pod that is NotReady but neither restarted nor Failed is no repair trigger under restart policy None; migration mode Auto relocates only when an open attempt's deadline expires, and a Ready Instance has no attempt open; the rolling group would hold a repair while no run is open, and none opens
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p4219 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", migrationPolicy: { mode: "Auto" }, updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", migrationPolicy: { mode: "Auto" }, updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          rollingUpdate: {}
