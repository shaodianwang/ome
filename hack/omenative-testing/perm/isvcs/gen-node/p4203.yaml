# p4203: [gen] node notready engine N=4 rp None mig Auto co rolling repaired  Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 fault=node:notready co=rolling topo=engine during=idle lift=after-settle expect=repaired
# reason: the kubelet under the highest-index engine Instance is stopped and, once the node has read NotReady with no pod of the Instance on it serving for the settle window, started again; the pods it ran were never stopped, so the Instance returns to Ready and serving on its running revision within the budget, with no new revision and no reset mailbox; nothing else moves while the node is down: a pod that is NotReady but neither restarted nor Failed is no repair trigger under restart policy None; migration mode Auto relocates only when an open attempt's deadline expires, and a Ready Instance has no attempt open; the rolling group plays no part: no repair opens, and one for an Instance that serves nothing would be admitted without its gate
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p4203 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", migrationPolicy: { mode: "Auto" }, updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          rollingUpdate: {}
