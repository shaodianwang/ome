# p2058: [gen] crashloop load pd N=8 SurgeThenDrain s1 rp RecreateInstance co none  Ne=8 Nd=8 Nr=2 ceil_e=9 ceil_d=8 ceil_r=2 fault=crashloop:old floor_soft=1 co=none topo=pd form=load
# reason: one old-revision engine pod has its runner killed every few seconds while it is up, so it dies after Ready and comes back between crashes; its Instance is off the target from that moment, so the roll owns it: the surge brings the fixed replacement up beside it and drains it, admitted within the same budget as its peers, and no repair is recorded for it after the bump; every Instance ends on the new revision; floor waived — the crash itself costs settled capacity for the length of the roll
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p2058 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: "25%" } } }
  decoder:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
