# p7725: [gen] broken imagepull delete engine-mn W1 N=2 rp None co none  mode=recreate Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 fault=imagepull:old co=none topo=engine-mn during=idle inst=0
# reason: the leader pod of the engine's gang 0 is pointed at an image that cannot be pulled on the settled service, so the kubelet parks it in ImagePullBackOff and it is never Ready again; once the status reports Instance 0 broken the service is deleted: every pod goes within the teardown budget, the broken one included, no pod stays Terminating and no finalizer wedges, and the same name comes back Ready on fresh pods with nothing of the break left; each Instance is a gang of a leader and a worker, counted whole
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7725 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
