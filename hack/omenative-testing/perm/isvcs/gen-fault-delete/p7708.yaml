# p7708: [gen] broken crashloop:start delete pd N=4 rp RecreateInstance co none  mode=recreate Ne=4 Nd=4 Nr=2 ceil_e=4 ceil_d=4 ceil_r=2 fault=crashloop:old co=none topo=pd form=start during=idle inst=0
# reason: the pod of the engine's Instance 0 is pointed at an image with no shell on the settled service, so it crashes at every start and is never Ready again; once the status reports Instance 0 broken the service is deleted: every pod goes within the teardown budget, the broken one included, no pod stays Terminating and no finalizer wedges, and the same name comes back Ready on fresh pods with nothing of the break left; decoder and router are neither broken nor scaled and stay as they were
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7708 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
