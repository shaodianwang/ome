# p7770: [gen] broken configkey once delete pd N=4 rp None  mode=recreate Ne=4 Nd=4 Nr=2 ceil_e=4 ceil_d=4 ceil_r=2 fault=configkey:missing co=none topo=pd during=idle inst=0 lift=after-settle
# reason: the ConfigMap key the runner of the pod of the engine's Instance 0 reads is removed and the runner restarted, so its next start waits in CreateContainerConfigError and it serves nothing; once the status reports Instance 0 broken the service is deleted and the key is put back and the kubelet's own retry starts the container: every pod goes within the teardown budget, the broken one included, no pod stays Terminating and no finalizer wedges, and the same name comes back Ready on fresh pods with nothing of the break left; decoder and router are neither broken nor scaled and stay as they were
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7770 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    runner: { env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p7770-config", key: "value" } } }] }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p7770-config }
data: { value: "1" }
