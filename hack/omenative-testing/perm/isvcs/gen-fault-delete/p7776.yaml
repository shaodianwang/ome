# p7776: [gen] broken configkey delete engine-mn W1 N=2 rp None  mode=recreate Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 fault=configkey:missing co=none topo=engine-mn during=idle inst=0
# reason: the ConfigMap key the runner of the leader pod of the engine's gang 0 reads is removed and the runner restarted, so its next start waits in CreateContainerConfigError and it serves nothing; the crash-loop repair opens as soon as the wait is seen and rebuilds the pod, which waits on the same key, so the Instance serves nothing while the key is away; once the status reports Instance 0 broken the service is deleted: every pod goes within the teardown budget, the waiting one included, no pod stays Terminating and no finalizer wedges, and the same name comes back Ready on fresh pods with the key the re-apply carries; each Instance is a gang of a leader and a worker, counted whole
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7776 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: { runner: { name: "ome-container", env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p7776-config", key: "value" } } }] } }
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p7776-config }
data: { value: "1" }
