# p10226: [gen] plain delete engine+router N=4  mode=recreate Ne=4 Nd=0 Nr=2 ceil_e=4 ceil_d=0 ceil_r=2 co=none topo=engine
# reason: the service is deleted on engine behind a router, single-pod with nothing broken: every pod goes within the teardown budget, no pod stays Terminating and no finalizer wedges, and the delete completes with nothing of the service left, and the same manifest re-applied under the same name comes up whole on fresh pods; the router is a negative control (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10226 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
