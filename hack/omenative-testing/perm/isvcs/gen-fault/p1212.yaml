# p1212: [gen] podkill settling engine N=8 SurgeThenDrain s25pct rp None  Ne=8 Nd=0 Nr=0 ceil_e=10 ceil_d=0 ceil_r=0 fault=podkill:settling floor_soft=1 order_soft=1 co=none topo=engine
# reason: kill a settled pod: repair overlaps the in-flight roll, both must complete; floor waived — the kill itself costs settled capacity the update budget cannot absorb while the repair restarts; order waived — the fault-induced deletion is a drain with no preceding surge
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p1212 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: "25%", maxUnavailable: 0 } } }
