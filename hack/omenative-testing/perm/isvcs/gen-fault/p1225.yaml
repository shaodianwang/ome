# p1225: [gen] podkill settling engine N=4 RecreatePod u50pct rp RecreateInstance  Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 fault=podkill:settling floor_soft=1 co=none topo=engine
# reason: kill a settled pod: repair overlaps the in-flight roll, both must complete; floor waived — the kill itself costs settled capacity the update budget cannot absorb while the repair restarts
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p1225 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: "50%" } } }
