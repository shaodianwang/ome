# p1298: [gen] podkill rotating engine-mn W1 N=2 SurgeThenDrain s1 rp None  Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 fault=podkill:rotating floor_soft=1 order_soft=1 co=none topo=engine-mn
# reason: kill the lowest settled gang's leader: repair overlaps the in-flight roll, both must complete; floor waived — the kill itself costs settled capacity the update budget cannot absorb while the repair restarts; order waived — the fault-induced deletion is a drain with no preceding surge
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p1298 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
