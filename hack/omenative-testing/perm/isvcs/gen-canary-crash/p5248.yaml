# p5248: [gen] canary crash storm crashloop:start engine N=8 s1 rp None victims 1 policyRef  mode=canary Ne=8 Nd=0 Nr=0 ceil_e=9 ceil_d=0 ceil_r=0 fault=crashloop:canary-serving@0 co=none topo=engine canary=auto form=start victims=1 nophase=Failed cell=canary/Serving/stableBroken[crashStart][policyRef]
# reason: 1 old-revision engine Instance(s) crash at every start from the first split on, under restart policy None; the canary walks all four steps to Stable inside its budgets, every broken Instance ends on the canary revision serving, no repair is recorded for one after the bump, and the healthy Instances keep serving above N-1
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p5248 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          policyRef: { name: p5248-policy, progression: canary }
---
apiVersion: ome.io/v1beta1
kind: RolloutPolicy
metadata:
  name: p5248-policy
  # Teardown deletes the case's documents in one pass, the policy with the
  # service that still references it.
  annotations: { ome.io/allow-in-use-delete: "true" }
spec:
  canary:
    steps:
      - { capacity: "10%", traffic: 10, pause: { duration: "20s" } }
      - { capacity: "30%", traffic: 30, pause: { duration: "20s" } }
      - { capacity: "60%", traffic: 60, pause: { duration: "20s" } }
      - { capacity: "100%", traffic: 100 }
