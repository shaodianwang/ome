# p5005: [gen] crashloop:new load engine N=4 RecreatePod u1 rp None co none  Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 fault=crashloop:new co=none topo=engine form=load
# reason: the pushed engine revision passes readiness, is promoted, and exits a few seconds later, every time the kubelet restarts it (Ready counted for the budget: the new pod was promoted, then crashed); the first Instance drained is rebuilt on the crashing revision; promoted, it admits the next Instance's start before it crashes (minReadySeconds is zero), so two Instances are off at once at the floor, as a Deployment would have it, and the start after that waits for a promotion that holds: at most 2 Instances are off the running revision, which keeps serving at N-2; status says why (a rolloutHold from the retry ladder or the budget, or a Failed row, and a RetryHeld or InstanceFailed event) and every further attempt at that revision is a retry the ladder announced, none once it has held; the fix push then lands on every Instance, serving, and nothing rebuilds the crashing revision
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p5005 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
