# p5034: [gen] crashloop:new load pd N=4 InPlaceIfPossible u1 rp RecreateInstance co none  Ne=4 Nd=4 Nr=2 ceil_e=4 ceil_d=4 ceil_r=2 fault=crashloop:new co=none topo=pd form=load
# reason: the pushed engine revision passes readiness, is promoted, and exits a few seconds later, every time the kubelet restarts it (Ready counted for the budget: the new pod was promoted, then crashed); the exit switch is a pod-template env diff, so in-place resolves to a recreate of the first Instance: at most 1 Instance is off the running revision, which keeps serving at N-1; status says why (a rolloutHold or a Failed row, and a RetryHeld or InstanceFailed event) and no further attempt at that revision follows; the fix push then lands on every Instance, serving, and nothing rebuilds the crashing revision
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p5034 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "InPlaceIfPossible", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
