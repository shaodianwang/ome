# p5073: [gen] crashloop:new load router engine+router N=4 SurgeThenDrain s1 rp None  Ne=4 Nd=0 Nr=2 ceil_e=5 ceil_d=0 ceil_r=3 fault=crashloop:new co=none topo=engine bump=engine,router form=load victimcomp=router
# reason: the engine and the router are bumped together by name and roll side by side, each under its own surge; the pushed router revision passes readiness, is promoted, and exits a few seconds later, every time the kubelet restarts it (Ready counted for the budget: the new pod was promoted, then crashed); at most 2 router Instances are off the running revision, which then has no Instance left serving until the fix lands; status says why (a rolloutHold on the router from the retry ladder or the budget, or a Failed router row, and a RetryHeld or InstanceFailed event naming it) and every further attempt at that revision is a retry the ladder announced, none once it has held; the engine rolls to its own new revision meanwhile, since nothing pairs it with the router; the fix push then lands on every bumped Instance, serving, and nothing rebuilds the crashing revision
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p5073 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
