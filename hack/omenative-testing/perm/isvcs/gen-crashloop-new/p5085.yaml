# p5085: [gen] crashloop:new load decoder pd-mn W1 N=2 SurgeThenDrain s1 rp None  Ne=2 Nd=2 Nr=2 ceil_e=3 ceil_d=3 ceil_r=2 fault=crashloop:new co=rolling topo=pd-mn bump=engine,decoder form=load victimcomp=decoder
# reason: the rollingUpdate group lists engine and decoder, so the bump carries both and the group paces them as one run; the pushed decoder revision passes readiness, is promoted, and exits a few seconds later, every time the kubelet restarts it (Ready counted for the budget: the new pod was promoted, then crashed); at most 2 decoder Instances are off the running revision, which then has no Instance left serving until the fix lands; status says why (a rolloutHold on the decoder from the retry ladder or the budget, or a Failed decoder row, and a RetryHeld or InstanceFailed event naming it) and every further attempt at that revision is a retry the ladder announced, none once it has held; the engine, a sound member of the group, converges on its own new revision meanwhile or holds with the group's reason; the fix push then lands on every bumped Instance, serving, and nothing rebuilds the crashing revision
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p5085 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          rollingUpdate: {}
