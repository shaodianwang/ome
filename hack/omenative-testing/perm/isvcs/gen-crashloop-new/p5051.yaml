# p5051: [gen] crashloop:new load pd-mn W1 N=2 SurgeThenDrain s1 rp None co rolling  Ne=2 Nd=2 Nr=2 ceil_e=3 ceil_d=3 ceil_r=2 fault=crashloop:new co=rolling topo=pd-mn form=load
# reason: the pushed engine revision passes readiness, is promoted, and exits a few seconds later, every time the kubelet restarts it (Ready counted for the budget: the new pod was promoted, then crashed); the promoted Instance crashes, so no further source is drained: at most 1 Instance is off the running revision, which keeps serving at N-1; status says why (a rolloutHold from the retry ladder or the budget, or a Failed row, and a RetryHeld or InstanceFailed event) and every further attempt at that revision is a retry the ladder announced, none once it has held; the fix push then lands on every Instance, serving, and nothing rebuilds the crashing revision; the decoder rolls to its own sound revision meanwhile (converges, or holds with a reason)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p5051 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          rollingUpdate: {}
