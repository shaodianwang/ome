# p5074: [gen] crashloop:new start router engine+router N=4 SurgeThenDrain s1 rp RecreateInstance  Ne=4 Nd=0 Nr=2 ceil_e=5 ceil_d=0 ceil_r=3 fault=crashloop:new co=none topo=engine bump=engine,router form=start victimcomp=router
# reason: the engine and the router are bumped together by name and roll side by side, each under its own surge; the pushed router revision dies at every start (its runner image has no shell for the fixture command); at most 1 router Instance is off the running revision, which keeps serving at N-1; status says why (a rolloutHold on the router from the retry ladder or the budget, or a Failed router row, and a RetryHeld or InstanceFailed event naming it) and every further attempt at that revision is a retry the ladder announced, none once it has held; the engine rolls to its own new revision meanwhile, since nothing pairs it with the router; the fix push then lands on every bumped Instance, serving, and nothing rebuilds the crashing revision
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p5074 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
