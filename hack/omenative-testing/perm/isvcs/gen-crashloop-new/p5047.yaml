# p5047: [gen] crashloop:new load engine-mn W1 N=2 InPlaceIfPossible u1 rp RecreateInstance co none  Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 fault=crashloop:new co=none topo=engine-mn form=load
# reason: the pushed engine revision passes readiness, is promoted, and exits a few seconds later, every time the kubelet restarts it (Ready counted for the budget: the new pod was promoted, then crashed); the exit switch is a pod-template env diff, so in-place resolves to a recreate of the first Instance; promoted, it admits the next Instance's start before it crashes (minReadySeconds is zero), so two Instances are off at once at the floor, as a Deployment would have it, and the start after that waits for a promotion that holds: at most 2 Instances are off the running revision, which then has no Instance left serving until the fix lands; status says why (a rolloutHold from the retry ladder or the budget, or a Failed row, and a RetryHeld or InstanceFailed event) and every further attempt at that revision is a retry the ladder announced, none once it has held; the fix push then lands on every Instance, serving, and nothing rebuilds the crashing revision
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p5047 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "InPlaceIfPossible", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
