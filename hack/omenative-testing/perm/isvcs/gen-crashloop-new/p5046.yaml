# p5046: [gen] crashloop:new start engine-mn W1 N=2 InPlaceIfPossible u1 rp RecreateInstance co none  Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 fault=crashloop:new co=none topo=engine-mn form=start
# reason: the pushed engine revision dies at every start (its runner image has no shell for the fixture command); the image patches the first Instance's pod in place and it crash-loops there: at most 1 Instance is off the running revision, which keeps serving at N-1; status says why (a rolloutHold from the retry ladder or the budget, or a Failed row, and a RetryHeld or InstanceFailed event) and every further attempt at that revision is a retry the ladder announced, none once it has held; the fix push then lands on every Instance, serving, and nothing rebuilds the crashing revision
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p5046 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "InPlaceIfPossible", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
