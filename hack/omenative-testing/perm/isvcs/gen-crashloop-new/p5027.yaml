# p5027: [gen] crashloop:new load pd N=4 RecreatePod u1 rp RecreateInstance co rolling  Ne=4 Nd=4 Nr=2 ceil_e=4 ceil_d=5 ceil_r=2 fault=crashloop:new co=rolling topo=pd form=load
# reason: the pushed engine revision passes readiness, is promoted, and exits a few seconds later, every time the kubelet restarts it (Ready counted for the budget: the new pod was promoted, then crashed); the first Instance drained is rebuilt on the crashing revision and stays the only one off: at most 1 Instance is off the running revision, which keeps serving at N-1; status says why (a rolloutHold or a Failed row, and a RetryHeld or InstanceFailed event) and no further attempt at that revision follows; the fix push then lands on every Instance, serving, and nothing rebuilds the crashing revision; the decoder rolls to its own sound revision meanwhile (converges, or holds with a reason)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p5027 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          rollingUpdate: {}
