# p5052: [gen] crashloop:new start pd-mn W1 N=2 SurgeThenDrain s1 rp RecreateInstance co none  Ne=2 Nd=2 Nr=2 ceil_e=3 ceil_d=2 ceil_r=2 fault=crashloop:new co=none topo=pd-mn form=start
# reason: the pushed engine revision dies at every start (its runner image has no shell for the fixture command); the surge replacement never joins rotation, so no source is drained: at most 1 Instance is off the running revision, which keeps serving at N-1; status says why (a rolloutHold from the retry ladder or the budget, or a Failed row, and a RetryHeld or InstanceFailed event) and every further attempt at that revision is a retry the ladder announced, none once it has held; the fix push then lands on every Instance, serving, and nothing rebuilds the crashing revision
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p5052 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
