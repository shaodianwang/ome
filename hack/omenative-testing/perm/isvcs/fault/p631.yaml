# p631: scale-up 2 to 3 with the source instance's node cordoned — the new instance schedules elsewhere and the scale converges, survivors untouched (single-node cordon; a full-cluster cordon is not a supported fault on a shared cluster)  mode=scaledown Ne=2 Nd=0 Nr=0 to_e=3 ceil_e=3 ceil_d=0 ceil_r=0 fault=cordon:source co=none topo=engine
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p631 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
