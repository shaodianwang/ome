# p633: gang leader killed with its node cordoned — the whole gang recreates on schedulable nodes and recovers (kill-mode contract: exactly one instance recreated, no over-cascade)  mode=kill Ne=1 Nd=0 Nr=0 ceil_e=1 ceil_d=0 ceil_r=0 kill=leader restart=RecreateInstance fault=cordon:source co=none topo=engine-mn
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p633 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 1
    maxReplicas: 1
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle:
      restartPolicy: "RecreateInstanceOnPodRestart"
      updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
