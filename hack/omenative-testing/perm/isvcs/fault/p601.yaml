# p601: gang migrate blocked mid-gang (quota admits 1 of 2 surge pods) — bounded terminal Failed, source gang keeps serving  mode=migrate Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 mig=Auto inst=0 fault=quota:1 expect=fail co=none topo=engine-mn
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p601 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle:
      instanceReadyTimeout: 60s
      updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
