# p602: PD engine migrate under zero-headroom quota — bounded terminal Failed, source keeps serving, decoder/router untouched  mode=migrate Ne=2 Nd=2 Nr=1 ceil_e=2 ceil_d=2 ceil_r=1 mig=Auto inst=0 fault=quota:0 expect=fail co=none topo=pd
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p602 }
spec:
