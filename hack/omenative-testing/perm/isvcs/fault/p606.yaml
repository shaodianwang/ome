# p606: migrate batch of 2 with quota admitting 1 surge — serial completion: first frees its source, second then proceeds (default long instanceReadyTimeout so the queued request parks, never expires)  mode=migrate Ne=3 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 mig=Auto inst=0,1 fault=quota:1 co=none topo=engine
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p606 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
