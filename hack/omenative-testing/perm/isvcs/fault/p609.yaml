# p609: in-place rollout immune to zero-headroom quota — patches live pods, no surge pod needed, UIDs stable, converges normally  Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 fault=quota:0 co=none topo=engine
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p609 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle:
      updateStrategy:
        type: InPlaceIfPossible
        rollingUpdate: { maxSurge: 1, maxUnavailable: 1 }
