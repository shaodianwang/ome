# p2428: [gen] crashloop idle start pd N=4 co rolling victim decoder rp RecreateInstance  Ne=4 Nd=4 Nr=2 ceil_e=4 ceil_d=4 ceil_r=2 fault=crashloop:old co=rolling topo=pd form=start during=idle victimcomp=decoder expect=repaired
# reason: the decoder's highest Instance's pod on the settled service is pointed at an image with no shell, so it crashes at every start and is never Ready again; no bump follows, and an Instance that serves nothing is repaired without touching its Component's budget or a group's gate, whatever group it sits in: it is rebuilt (every pod new) Ready and serving on its running revision within the rotate budget, a RestartTriggered event names it, and nothing surges above N; the rollingUpdate group lists the decoder, and its gate holds every consult while no run is open, but a rebuild that takes no serving capacity offline is not a consult, so the group holds nothing
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p2428 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          rollingUpdate: {}
