# p2474: [gen] crashloop idle load pd-mn W1 N=2 co seq victim engine rp RecreateInstance  Ne=2 Nd=2 Nr=2 ceil_e=2 ceil_d=2 ceil_r=2 fault=crashloop:old co=seq topo=pd-mn form=load during=idle victimcomp=engine expect=repaired notimpl=1 issue=1977
# reason: the engine's highest Instance's pod on the settled service has its runner killed every few seconds while it is up, so it dies after Ready and comes back between crashes; no bump follows, and an Instance that serves nothing is repaired within its Component's budget whatever group it sits in: it is rebuilt (every pod new) Ready and serving on its running revision within the budget, a RestartTriggered event names it, and nothing surges above N; the Sequential group lists the engine, and a repair that takes nothing further offline is not a consult for a group with no run open; parked: the repair is still put to the group's gate, which holds every consult while no run is open
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p2474 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          blueGreen: {}
        - components: [decoder]
          blueGreen: {}
