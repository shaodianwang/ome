# p1647: [gen] kill engine-mn W1 N=2 RecreatePod rp RecreateInstance target leader pause freeze (RecreatePod dormant)  mode=kill Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 restart=RecreateInstance kill=leader pause=freeze co=none topo=engine-mn
# reason: freeze holds every repair from a dead leader; downgrading to a plain pause must repair without ever unpausing
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p1647 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
