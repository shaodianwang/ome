# p1604: [gen] kill engine N=4 RecreatePod rp RecreateInstance pause true (RecreatePod dormant)  mode=kill Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 restart=RecreateInstance pause=true co=none topo=engine
# reason: pause suspends fleet changes, not the RestartPolicy: the instance (one pod) recreates while rollout-paused stays set
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p1604 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
