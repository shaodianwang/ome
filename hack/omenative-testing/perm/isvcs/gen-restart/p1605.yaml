# p1605: [gen] kill engine N=4 RecreatePod rp RecreateInstance pause freeze (RecreatePod dormant)  mode=kill Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 restart=RecreateInstance pause=freeze co=none topo=engine notimpl=1 issue=1354 inv_xfail=A
# reason: under freeze, RecreateInstance total pod loss is neither repaired (frozen, correct) nor demoted (truth-pass carve-out), so Phase=Ready persists over podCount=0 until the fix couples truthful demotion with a repair-eligibility path
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p1605 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
