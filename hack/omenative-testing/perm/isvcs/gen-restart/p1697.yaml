# p1697: [gen] kill engine-mn W2 N=2 InPlaceIfPossible rp RecreateInstance target worker pause freeze (InPlaceIfPossible dormant)  mode=kill Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 restart=RecreateInstance kill=worker pause=freeze co=none topo=engine-mn
# reason: freeze holds every repair from a dead worker; downgrading to a plain pause must repair without ever unpausing
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p1697 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 2 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "InPlaceIfPossible", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
