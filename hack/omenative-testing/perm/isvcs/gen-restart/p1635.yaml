# p1635: [gen] kill engine-mn W1 N=2 SurgeThenDrain rp None target leader pause true  mode=kill Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 restart=None kill=leader pause=true co=none topo=engine-mn
# reason: plain pause parks the Create recovery pass: holds degraded from a dead leader through the hold window, recovers only after unpause
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p1635 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
