# p1642: [gen] kill engine-mn W1 N=2 RecreatePod rp RecreateInstance target worker (RecreatePod dormant)  mode=kill Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 restart=RecreateInstance kill=worker co=none topo=engine-mn
# reason: steady-state kill from a dead worker: the whole instance (leader+workers) recreates, scoped to the killed instance, fleet returns to N
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p1642 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
