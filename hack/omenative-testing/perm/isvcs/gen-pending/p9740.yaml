# p9740: [gen] pending quota rollback engine N=4 RecreatePod u1 lift after-settle  Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 fault=quota:-1 co=none topo=engine during=draining rollback=1 lift=after-settle
# reason: a quota with no room for the one replacement pod is armed on the settled service (engine alone, single-pod), then the engine is bumped under the drain-first strategy and the starting revision re-applied as its first pod goes: the drained Instance's replacement cannot be admitted, so the roll waits with reason QuotaExceeded; the rollback then owes that Instance on the starting revision and its pod cannot be admitted either, so the rollback waits with the same reason inside its unschedulable grace, the capacity floor (N minus the drained Instance) holds, nothing settled is taken down to make room and no row reads Failed; once the cause is lifted the rollback completes with every Instance back on the starting revision and serving, no pod of the new revision left
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9740 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
