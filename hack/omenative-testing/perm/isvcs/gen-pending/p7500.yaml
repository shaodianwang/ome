# p7500: [gen] pending taint steady engine N=4 rp None lift after-settle  mode=kill Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 restart=None fault=taint:all co=none topo=engine lift=after-settle
# reason: a NoSchedule taint on every schedulable node is in place when one engine pod is deleted; the replacement pod cannot be placed, so the Instance waits with reason Unschedulable inside its unschedulable grace, nothing is taken down to make room, every other Instance keeps serving and no row reads Failed; once the cause is lifted the repair completes: the Instance (one pod) is recreated and the fleet is back at N serving
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7500 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
