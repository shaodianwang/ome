# p7557: [gen] pending quota steady engine-mn W1 N=2 rp None lift never  mode=kill Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 restart=None kill=leader fault=quota:-1 co=none topo=engine-mn lift=never
# reason: a quota one pod short (the leader's replacement alone is refused) is in place when one engine pod is deleted; the leader's replacement cannot be admitted, so the Instance waits with reason QuotaExceeded inside its unschedulable grace, nothing is taken down to make room, every other Instance keeps serving and no row reads Failed; the cause stays to the end, so the wait holds with its reason across the hold window
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7557 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
