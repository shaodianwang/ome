# p10702: [gen] pending taint edit pd-mn W1 N=2 SurgeThenDrain s1 lift after-settle  Ne=2 Nd=2 Nr=2 ceil_e=3 ceil_d=2 ceil_r=2 fault=taint:all co=none topo=pd-mn during=settling edit=strategy:RecreatePod lift=after-settle
# reason: a NoSchedule taint on every schedulable node is armed on the settled service (prefill/decode as gangs of 1 leader + 1 worker), then the engine is bumped under SurgeThenDrain and its strategy edited to RecreatePod as the push lands: the surge cannot be placed, and once the edit switches the roll to the drain-first strategy the drained Instance's replacement cannot be placed either, so the roll waits with reason Unschedulable under the edited strategy inside its unschedulable grace, the capacity floor (N minus the drained Instance) holds, nothing settled is taken down to make room and no row reads Failed; once the cause is lifted the roll completes under the edited strategy with every Instance on the new revision and the edit on the live spec; each Instance is a gang, placed whole; decoder and router are negative controls (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10702 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
