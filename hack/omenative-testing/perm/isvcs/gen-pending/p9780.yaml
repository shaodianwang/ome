# p9780: [gen] pending quota edit engine+router N=4 SurgeThenDrain s1 lift after-settle  Ne=4 Nd=0 Nr=2 ceil_e=5 ceil_d=0 ceil_r=2 fault=quota:-1 co=none topo=engine during=settling edit=strategy:RecreatePod lift=after-settle
# reason: a quota with no room for the one replacement pod is armed on the settled service (engine behind a router, single-pod), then the engine is bumped under SurgeThenDrain and its strategy edited to RecreatePod as the push lands: the surge cannot be admitted, and once the edit switches the roll to the drain-first strategy the drained Instance's replacement cannot be admitted either, so the roll waits with reason QuotaExceeded under the edited strategy inside its unschedulable grace, the capacity floor (N minus the drained Instance) holds, nothing settled is taken down to make room and no row reads Failed; once the cause is lifted the roll completes under the edited strategy with every Instance on the new revision and the edit on the live spec; the router is a negative control (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9780 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
