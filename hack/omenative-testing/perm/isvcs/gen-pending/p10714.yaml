# p10714: [gen] pending quota canary kept engine-mn W1 router N=2  mode=canary Ne=2 Nd=0 Nr=2 ceil_e=3 ceil_d=0 ceil_r=2 fault=quota:0 co=none topo=engine-mn canary=auto terminal=Failed cell=canary/Staging/readyTimeout[quota]
# reason: a quota with room for no further pod is in place when the canary push lands on engine+router gang (2 Instances of 1 leader + 1 worker), so the first step's canary pod (a gang that cannot form) cannot be admitted; the capacity step waits with reason QuotaExceeded on its row, nothing settled is taken down to make room, the stable revision keeps serving every Instance and no traffic names the canary; the quota stays, so the step parks the ladder Failed at its ready timeout with the wait still reported and nothing rolls back
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10714 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            readyTimeout: "90s"
            steps:
              - { capacity: "10%", traffic: 10, pause: { duration: "20s" } }
              - { capacity: "30%", traffic: 30, pause: { duration: "20s" } }
              - { capacity: "60%", traffic: 60, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
