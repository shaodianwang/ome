# p7513: [gen] pending taint roll engine N=4 SurgeThenDrain s1 rp RecreateInstance lift after-settle  Ne=4 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 fault=taint:all co=none topo=engine lift=after-settle
# reason: a NoSchedule taint on every schedulable node is in place when the bump lands under SurgeThenDrain; the surge cannot be placed, so the roll waits with reason Unschedulable inside its unschedulable grace, the capacity floor (N minus maxUnavailable) holds and nothing settled is taken down to make room; once the cause is lifted the roll converges with every Instance on the new revision
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7513 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
