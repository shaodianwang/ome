# p10711: [gen] pending quota canary lifted engine-mn W1 N=2  mode=canary Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 fault=quota:0 co=none topo=engine-mn canary=auto during=canary-failed verb=quotalift verb2=resume during2=canary-failed terminal=Stable cell=canary/Failed/capacityReached,canary/Failed/resume[afterCapacity]
# reason: a quota with room for no further pod is in place when the canary push lands on engine gang (2 Instances of 1 leader + 1 worker), so the first step's canary pod (a gang that cannot form) cannot be admitted; the capacity step waits with reason QuotaExceeded on its row, nothing settled is taken down to make room, the stable revision keeps serving every Instance and no traffic names the canary; the step parks the ladder Failed at its ready timeout, then the quota is lifted: the capacity the parked step asked for lands and the park holds anyway (still Failed at the same step with the capacity there, since capacity that arrives after the deadline does not un-park a canary), and a resume re-enters the ladder at its first step and walks every step to Stable with every Instance on the canary revision serving
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10711 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            readyTimeout: "90s"
            steps:
              - { capacity: "10%", traffic: 10, pause: { duration: "20s" } }
              - { capacity: "30%", traffic: 30, pause: { duration: "20s" } }
              - { capacity: "60%", traffic: 60, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
