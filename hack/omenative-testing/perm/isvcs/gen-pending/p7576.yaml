# p7576: [gen] pending quota steady engine+router N=4 rp None lift after-settle  mode=kill Ne=4 Nd=0 Nr=2 ceil_e=4 ceil_d=0 ceil_r=2 restart=None fault=quota:-1 co=none topo=engine lift=after-settle
# reason: a quota with no room for the one pod is in place when one engine pod is deleted; the replacement pod cannot be admitted, so the Instance waits with reason QuotaExceeded inside its unschedulable grace, nothing is taken down to make room, every other Instance keeps serving and no row reads Failed; once the cause is lifted the repair completes: the Instance (one pod) is recreated and the fleet is back at N serving; the router keeps its pods
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7576 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
