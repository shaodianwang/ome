# p9719: [gen] pending taint steady pd-mn W1 N=2 rp None lift never  mode=kill Ne=2 Nd=2 Nr=2 ceil_e=2 ceil_d=2 ceil_r=2 restart=None kill=leader fault=taint:all co=none topo=pd-mn lift=never
# reason: a NoSchedule taint on every schedulable node is in place when one engine pod is deleted; the leader's replacement cannot be placed, so the Instance waits with reason Unschedulable inside its unschedulable grace, nothing is taken down to make room, every other Instance keeps serving and no row reads Failed; the cause stays to the end, so the wait holds with its reason across the hold window
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9719 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
