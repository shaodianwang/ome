# p9764: [gen] pending quota rollback engine-mn W1 N=2 RecreatePod u1 lift after-settle  Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 fault=quota:-1 co=none topo=engine-mn during=draining rollback=1 lift=after-settle
# reason: a quota one pod short of the recreated gang (all members but one admitted, the gang cannot form) is armed on the settled service (engine alone as gangs of 1 leader + 1 worker), then the engine is bumped under the drain-first strategy and the starting revision re-applied as its first pod goes: the drained Instance's replacement cannot be admitted, so the roll waits with reason QuotaExceeded; the rollback then owes that Instance on the starting revision and its pod cannot be admitted either, so the rollback waits with the same reason inside its unschedulable grace, the capacity floor (N minus the drained Instance) holds, nothing settled is taken down to make room and no row reads Failed; once the cause is lifted the rollback completes with every Instance back on the starting revision and serving, no pod of the new revision left; each Instance is a gang, placed whole
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9764 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
