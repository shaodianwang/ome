# p12215: [gen] stale record scale-up engine-mn W1 N=2  mode=scaledown Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 fault=agerecord:idle co=none topo=engine-mn during=idle victimcomp=engine preroll=engine to_e=3
# reason: the engine rolled once before the story, so its status names the revision each Instance runs and the one before it; on engine alone as gangs of 1 leader + 1 worker, the engine's rolled-out record (the status entry naming the revision that owns its traffic, which a canary rollback would read as the revision to return to) is written back to the revision before the one it runs on the settled service, then the engine is scaled from N to N+1; the scale lands at N+1 with the new Instance on the revision the engine stands on, nothing rebuilt onto the aged revision, the survivors on their own pods, and the record level with that revision
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p12215 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
