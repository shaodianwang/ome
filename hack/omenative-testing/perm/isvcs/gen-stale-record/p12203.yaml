# p12203: [gen] stale record rollback engine N=4 SurgeThenDrain s1  Ne=4 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 fault=agerecord:settling co=none topo=engine during=rotating victimcomp=engine preroll=engine rollback=1
# reason: the engine rolled once before the story, so its status names the revision each Instance runs and the one before it; the engine is bumped and the starting revision re-applied at the first pod of the new revision on engine alone, single-pod, and the engine's rolled-out record (the status entry naming the revision that owns its traffic, which a canary rollback would read as the revision to return to) is written back to the revision before the one it runs as the rollback lands; the rollback completes with every Instance back on the starting revision and serving, never on the aged one, each pod slot created at most once in each direction, no engine pod ever rebuilt onto the aged revision, and the record names the starting revision once the rollback is done
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p12203 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
