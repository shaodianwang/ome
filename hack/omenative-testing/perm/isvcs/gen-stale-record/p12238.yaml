# p12238: [gen] stale record move engine-mn W1+router N=2  mode=migrate Ne=2 Nd=0 Nr=2 ceil_e=3 ceil_d=0 ceil_r=2 fault=agerecord:migrating co=none topo=engine-mn victimcomp=engine preroll=engine mig=Auto inst=0 at=accept
# reason: the engine rolled once before the story, so its status names the revision each Instance runs and the one before it; one engine Instance is asked to move on engine behind a router as gangs of 1 leader + 1 worker, and the engine's rolled-out record (the status entry naming the revision that owns its traffic, which a canary rollback would read as the revision to return to) is written back to the revision before the one it runs as soon as the move's request is recorded, the whole move still ahead; the move completes onto the revision the engine stands on, never the aged one: its ledger row reads Completed once, the request annotation is consumed, the moved Instance ends whole, Ready and serving off its source pod, the engine holds N whole Instances, and the record stays level with that revision; the router is a negative control (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p12238 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
