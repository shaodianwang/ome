# p12200: [gen] stale record steady engine N=4  Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 fault=agerecord:idle co=none topo=engine during=idle victimcomp=engine preroll=engine
# reason: the engine rolled once before the story, so its status names the revision each Instance runs and the one before it; on engine alone, single-pod, the engine's rolled-out record (the status entry naming the revision that owns its traffic, which a canary rollback would read as the revision to return to) is written back to the revision before the one it runs on the settled service, and nothing else is asked of it; nothing may move: no pod is created or taken down and every Instance keeps serving; the record reads level with the revision the engine stands on again on the controller's next pass over the service (its own, or the one the harness asks for by touching an inert annotation on the ISVC, since a status write wakes no controller), and every row ends Ready with no operation open
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p12200 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
