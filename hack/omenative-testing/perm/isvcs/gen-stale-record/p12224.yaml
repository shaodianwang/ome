# p12224: [gen] stale record edit engine+router N=4 SurgeThenDrain s1  Ne=4 Nd=0 Nr=2 ceil_e=5 ceil_d=0 ceil_r=2 fault=agerecord:settling co=none topo=engine during=rotating victimcomp=engine preroll=engine edit=strategy:RecreatePod
# reason: the engine rolled once before the story, so its status names the revision each Instance runs and the one before it; the engine is bumped under SurgeThenDrain and its strategy edited to RecreatePod at the first pod of the new revision on engine behind a router, single-pod, and the engine's rolled-out record (the status entry naming the revision that owns its traffic, which a canary rollback would read as the revision to return to) is written back to the revision before the one it runs as the edit lands; the roll completes under the edited strategy with every Instance on the pushed revision and the edit on the live spec, no engine pod ever rebuilt onto the aged revision, and the record names the pushed revision once the roll is done; the router is a negative control (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p12224 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
