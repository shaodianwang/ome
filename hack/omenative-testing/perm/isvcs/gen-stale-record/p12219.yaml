# p12219: [gen] stale record delete engine-mn W1 N=2  mode=recreate Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 fault=agerecord:idle co=none topo=engine-mn during=idle victimcomp=engine preroll=engine
# reason: the engine rolled once before the story, so its status names the revision each Instance runs and the one before it; on engine alone as gangs of 1 leader + 1 worker, the engine's rolled-out record (the status entry naming the revision that owns its traffic, which a canary rollback would read as the revision to return to) is written back to the revision before the one it runs on the settled service, then the service is deleted; the delete completes with no pod, InferenceReplica, Service or InferenceService left and nothing rebuilt onto the aged revision on the way out, and the same manifest re-applied under the same name comes up whole on fresh pods with a record naming the revision it runs
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p12219 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
