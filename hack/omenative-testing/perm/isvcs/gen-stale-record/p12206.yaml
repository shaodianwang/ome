# p12206: [gen] stale record scale-down engine N=4  mode=scaledown Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 fault=agerecord:idle co=none topo=engine during=idle victimcomp=engine preroll=engine to_e=3
# reason: the engine rolled once before the story, so its status names the revision each Instance runs and the one before it; on engine alone, single-pod, the engine's rolled-out record (the status entry naming the revision that owns its traffic, which a canary rollback would read as the revision to return to) is written back to the revision before the one it runs on the settled service, then the engine is scaled from N to N-1; the scale lands at N-1 with the survivors on their own pods, nothing created or rebuilt onto the aged revision, and the record level with the revision the engine stands on
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p12206 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
