# p9640: [gen] preempt scaledown pd-mn W1 N=2 lift after-settle  mode=scaledown Ne=2 Nd=2 Nr=2 ceil_e=2 ceil_d=2 ceil_r=2 fault=preempt:settling floor_soft=1 order_soft=1 co=none topo=pd-mn victimcomp=engine to_e=1 lift=after-settle
# reason: the engine is scaled from N to N-1 on prefill/decode as gangs of 1 leader + 1 worker, and as the scale lands fillers take the spare CPU of every node, the pending taint closes every node to the case, and a higher-priority filler presses on the node of a pod of the highest Instance the scale keeps (the Instance it takes is no target), so the scheduler preempts one pod of the case there; the Instance waits with reason Unschedulable, nothing settled is taken down to make room and no row reads Failed; once the lift opens the nodes and drops the fillers the scale completes with the engine at N-1 and the survivors on their own pods; floor and order waived, since the preemption itself takes a pod the budget cannot absorb; each Instance is a gang, placed whole; decoder and router are negative controls (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9640 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
