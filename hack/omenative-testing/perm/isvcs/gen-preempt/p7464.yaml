# p7464: [gen] preempt steady engine-mn W1 N=2 rp None lift after-settle  mode=kill Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 restart=None co=none topo=engine-mn via=preempt lift=after-settle
# reason: fillers take the spare CPU of every node and a higher-priority filler presses on the node of the aimed pod, so the scheduler preempts one pod of the case there; exactly the removed pod is recreated under restart policy None and its new pod waits with reason Unschedulable while every other Instance keeps serving and nothing is taken down to make room; once the fillers are dropped the Instance is placed again and serves, back at N
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7464 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
