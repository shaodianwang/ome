# p9627: [gen] preempt rollback engine+router N=4 SurgeThenDrain s1 lift after-settle  Ne=4 Nd=0 Nr=2 ceil_e=5 ceil_d=0 ceil_r=2 fault=preempt:settling floor_soft=1 order_soft=1 co=none topo=engine during=rotating victim=stable rollback=1 lift=after-settle
# reason: the engine is bumped and the starting revision re-applied at the first pod of the new revision on engine behind a router, single-pod, and as the rollback lands fillers take the spare CPU of every node, the pending taint closes every node to the case, and a higher-priority filler presses on the node of a settled pod of the starting revision, which the rollback keeps (the surge pod it withdraws is no target), so the scheduler preempts one pod of the case there; the Instance waits with reason Unschedulable, nothing settled is taken down to make room and no row reads Failed; once the lift opens the nodes and drops the fillers the rollback completes with every Instance back on the starting revision and serving, no pod of the new revision left; floor and order waived, since the preemption itself takes a pod the budget cannot absorb; the router is a negative control (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9627 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
