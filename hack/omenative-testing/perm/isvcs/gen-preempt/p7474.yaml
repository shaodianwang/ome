# p7474: [gen] preempt rotating engine-mn W1 N=2 SurgeThenDrain s1 rp RecreateInstance lift never  Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 fault=preempt:rotating floor_soft=1 order_soft=1 co=none topo=engine-mn lift=never
# reason: fillers take the spare CPU of every node and a higher-priority filler presses on the node of the aimed pod, so the scheduler preempts one pod of the case there while the roll is in flight under SurgeThenDrain; the roll's next pod waits with reason Unschedulable, nothing settled is taken down to make room and the capacity floor holds; the fillers stay to the end, so the wait holds with its reason across the hold window and no Instance reads Failed; floor and order waived — the preemption itself takes a pod the update budget cannot absorb
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7474 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
