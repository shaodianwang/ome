# p7456: [gen] preempt rotating pd N=4 SurgeThenDrain s1 rp None lift never  Ne=4 Nd=4 Nr=2 ceil_e=5 ceil_d=4 ceil_r=2 fault=preempt:rotating floor_soft=1 order_soft=1 co=none topo=pd lift=never
# reason: fillers take the spare CPU of every node and a higher-priority filler presses on the node of the aimed pod, so the scheduler preempts one pod of the case there while the roll is in flight under SurgeThenDrain; the roll's next pod waits with reason Unschedulable, nothing settled is taken down to make room and the capacity floor holds; the fillers stay to the end, so the wait holds with its reason across the hold window and no Instance reads Failed; decoder and router are negative controls (co=none); floor and order waived — the preemption itself takes a pod the update budget cannot absorb
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7456 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
