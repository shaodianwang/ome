# p9616: [gen] preempt scaleup engine N=4 lift after-settle  mode=scaledown Ne=4 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 fault=preempt:settling floor_soft=1 order_soft=1 co=none topo=engine to_e=5 lift=after-settle
# reason: the engine is scaled from N to N+1 on engine alone, single-pod, and as the scale lands fillers take the spare CPU of every node, the pending taint closes every node to the case, and a higher-priority filler presses on the node of the aimed pod, so the scheduler preempts one pod of the case there; the Instance waits with reason Unschedulable, nothing settled is taken down to make room and no row reads Failed; once the lift opens the nodes and drops the fillers the scale completes with the new Instance whole and serving and the survivors on their own pods; floor and order waived, since the preemption itself takes a pod the budget cannot absorb
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9616 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
