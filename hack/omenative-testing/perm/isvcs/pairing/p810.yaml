# p810: pairing 1x1 ST — the old pair must keep serving until the new cohort is Ready on both sides; with equal startups the first-mover window is a race  mode=pairing proto=nixl-v2 Ne=1 Nd=1 Nr=0 ceil_e=2 ceil_d=2 ceil_r=0 notimpl=1 issue=1818 inv_xfail=C co=bluegreen topo=pd
# reason: parked on the pair-floor gate's 1x1 mutual wall — under a surge strategy both first movers are admitted at operation start and each side drains its source when its own replacement is Ready, so the old pair breaks for the slower side's startup; the invariant records that window as the tracked bug
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p810 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 1
    maxReplicas: 1
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 1
    maxReplicas: 1
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    pairingProtocol: nixl-v1
    groups:
        - components: [engine, decoder]
          blueGreen: {}
