# p831: pairing swap v1→v2 on PD gangs with the last old-cohort decoder LEADER killed mid-transition — gang repair re-pairs and the roll converges  mode=pairing proto=nixl-v2 pkill=1 order_soft=1 inv_off=C Ne=2 Nd=2 Nr=0 ceil_e=3 ceil_d=3 ceil_r=0 co=bluegreen topo=pd-mn
# reason: the harness kills the last old-cohort decoder leader itself (pkill), so the unpaired recovery window is induced, not a gate failure; the no-pair escape legitimately admits progress until the gang repair re-forms a pair
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p831 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 2 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 2 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    pairingProtocol: nixl-v1
    groups:
        - components: [engine, decoder]
          blueGreen: {}
