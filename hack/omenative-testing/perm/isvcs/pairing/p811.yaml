# p811: pairing swap v1→v2 with the LAST old-cohort decoder pod killed mid-transition — recovery re-pairs and the roll converges onto v2  mode=pairing proto=nixl-v2 pkill=1 order_soft=1 inv_off=C Ne=2 Nd=2 Nr=0 ceil_e=3 ceil_d=3 ceil_r=0 co=bluegreen topo=pd
# reason: the harness itself destroys the last old-cohort pair member (pkill), so the unpaired recovery window is induced, not a gate failure; the no-pair escape legitimately admits progress until the pair re-forms
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p811 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    pairingProtocol: nixl-v1
    groups:
        - components: [engine, decoder]
          blueGreen: {}
