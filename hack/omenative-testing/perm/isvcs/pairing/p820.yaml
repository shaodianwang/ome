# p820: REJECT pairing swap v1→v2 under a rollingUpdate group — a mixable progression cannot keep a pair, webhook denies  mode=pairing proto=nixl-v2 expect=reject reason=PairingProtocolChangeUncoordinated Ne=2 Nd=2 Nr=0 ceil_e=2 ceil_d=2 ceil_r=0 co=rolling topo=pd
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p820 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    pairingProtocol: nixl-v1
    groups:
        - components: [engine, decoder]
          rollingUpdate: { maxUnavailable: 1 }
