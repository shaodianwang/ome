# p833: pairing swap v1→v2 with the router inside the blueGreen group — a no-revision-change member neither blocks the group nor rolls  mode=pairing proto=nixl-v2 Ne=2 Nd=2 Nr=2 ceil_e=3 ceil_d=3 ceil_r=2 co=bluegreen topo=pd
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p833 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    pairingProtocol: nixl-v1
    groups:
        - components: [engine, decoder, router]
          blueGreen: {}
