# p829: pairing swap v1→v2 on PD gangs InPlaceIfPossible — gangs fall back to whole-gang recreate, atomicity and the pair floor both hold  mode=pairing proto=nixl-v2 Ne=2 Nd=2 Nr=0 ceil_e=2 ceil_d=2 ceil_r=0 co=bluegreen topo=pd-mn
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p829 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 2 }
    lifecycle: { updateStrategy: { type: "InPlaceIfPossible", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 2 }
    lifecycle: { updateStrategy: { type: "InPlaceIfPossible", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  rollout:
    pairingProtocol: nixl-v1
    groups:
        - components: [engine, decoder]
          blueGreen: {}
