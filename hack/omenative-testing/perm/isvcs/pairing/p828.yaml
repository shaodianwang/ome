# p828: pairing swap v1→v2 on PD gangs RecreatePod unavail=1 — credit-0 gang drains ping-pong across e/d  mode=pairing proto=nixl-v2 Ne=2 Nd=2 Nr=0 ceil_e=2 ceil_d=2 ceil_r=0 co=bluegreen topo=pd-mn
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p828 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 2 }
    lifecycle: { updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 2 }
    lifecycle: { updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  rollout:
    pairingProtocol: nixl-v1
    groups:
        - components: [engine, decoder]
          blueGreen: {}
