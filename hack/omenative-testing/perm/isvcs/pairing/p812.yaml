# p812: pairing swap v1→v2 paused mid-transition — rollout-paused=true parks the transition, pair stays alive, lift resumes to convergence  mode=pairing proto=nixl-v2 pause=true Ne=3 Nd=3 Nr=0 ceil_e=4 ceil_d=4 ceil_r=0 co=bluegreen topo=pd
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p812 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    pairingProtocol: nixl-v1
    groups:
        - components: [engine, decoder]
          blueGreen: {}
