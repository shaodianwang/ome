# p824: pairing rebump v1→v2→v3 mid-transition — no Instance may strand on the intermediate cohort  mode=pairing proto=nixl-v2 proto2=nixl-v3 Ne=2 Nd=2 Nr=0 ceil_e=3 ceil_d=3 ceil_r=0 co=bluegreen topo=pd notimpl=1 issue=1347
# reason: parked on the mid-surge re-target wedge — re-patching the protocol while the first transition's surge is in flight strands the blueGreen group in Surging with no further update ops, so the fleet parks short of the final cohort; this case is the tracker for that wedge
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p824 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    pairingProtocol: nixl-v1
    groups:
        - components: [engine, decoder]
          blueGreen: {}
