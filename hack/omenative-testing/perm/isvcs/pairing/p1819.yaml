# p1819: pairing 1x1 gang ST with a slow engine gang — the decoder gang's replacement is Ready first; the old pair must keep serving until the new cohort serves on both sides  mode=pairing proto=nixl-v2 Ne=1 Nd=1 Nr=0 ceil_e=2 ceil_d=2 ceil_r=0 co=bluegreen topo=pd-mn
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p1819 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 1
    maxReplicas: 1
    annotations: { ome.io/deploymentMode: OMENative }
    leader: { runner: { name: ome-container, env: [ { name: TEST_STARTUP_DELAY, value: "40" } ] } }
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 1
    maxReplicas: 1
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    pairingProtocol: nixl-v1
    groups:
        - components: [engine, decoder]
          blueGreen: {}
