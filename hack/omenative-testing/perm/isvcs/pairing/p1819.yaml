# p1819: pairing 1x1 gang ST with a slow engine gang — the decoder gang's replacement is Ready first; the old pair must keep serving until the new cohort serves on both sides  mode=pairing proto=nixl-v2 Ne=1 Nd=1 Nr=0 ceil_e=2 ceil_d=2 ceil_r=0 notimpl=1 issue=1818 inv_xfail=C co=bluegreen topo=pd-mn
# reason: parked on the pair-floor gate's 1x1 mutual wall — under a surge strategy both first movers are admitted at operation start and each side drains its source when its own replacement is Ready, so the old pair breaks for the slower side's startup; the invariant records that window as the tracked bug
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p1819 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 1
    maxReplicas: 1
    annotations: { ome.io/deploymentMode: OMENative }
    leader: { runner: { env: [ { name: TEST_STARTUP_DELAY, value: "75" } ] } }
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 1
    maxReplicas: 1
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    pairingProtocol: nixl-v1
    groups:
        - components: [engine, decoder]
          blueGreen: {}
