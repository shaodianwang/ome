# p1818: pairing 1x1 ST with a slow decoder — the engine's replacement is Ready first; the old pair must keep serving until the new cohort serves on both sides  mode=pairing proto=nixl-v2 Ne=1 Nd=1 Nr=0 ceil_e=2 ceil_d=2 ceil_r=0 co=bluegreen topo=pd
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p1818 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 1
    maxReplicas: 1
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 1
    maxReplicas: 1
    annotations: { ome.io/deploymentMode: OMENative }
    runner: { env: [ { name: TEST_STARTUP_DELAY, value: "40" } ] }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    pairingProtocol: nixl-v1
    groups:
        - components: [engine, decoder]
          blueGreen: {}
