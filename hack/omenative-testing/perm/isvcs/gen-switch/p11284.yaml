# p11284: [gen] switch held by crash-start on the router alone engine+router N=4 strategy SurgeThenDrain to RecreatePod co none  Ne=4 Nd=0 Nr=2 ceil_e=4 ceil_d=0 ceil_r=3 co=none topo=engine bump=router during=held victimcomp=router edit=strategy:RecreatePod break=crash-start
# reason: the operator edits a roll whose push cannot start: the push gives the router runner a runner that dies at every start, so the roll parks on its first pod: the kubelet shows the break and the status says why (a rolloutHold gate from the retry ladder or the budget, a Failed row, a RetryHeld or InstanceFailed event); every bumped member's updateStrategy is patched from SurgeThenDrain to RecreatePod once the roll is parked on the broken pod; then the fix push, the override dropped, lands under the edit on every Instance of the bumped members, nothing of the broken revision is created again or left, no hold is left and the live spec carries the edit; nothing of the broken revision ever served; the budget (maxSurge 1, maxUnavailable 1) is valid under both strategies; the push bumps the router alone, which rolls under its own strategy and its own retry ladder: the engine is never rolled, every engine Instance keeps its pods and keeps serving on its running revision throughout, and the edit lands on the router's own strategy
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11284 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { instanceReadyTimeout: "90s", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
