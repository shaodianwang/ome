# p11258: [gen] switch held by crash-load pd-mn W1 N=2 strategy SurgeThenDrain to RecreatePod co none  Ne=2 Nd=2 Nr=2 ceil_e=3 ceil_d=2 ceil_r=2 co=none topo=pd-mn during=held break=crash-load edit=strategy:RecreatePod
# reason: the operator edits a roll whose push cannot start: the push gives the engine runner a runner that exits after Ready, so the roll parks on its first leader pod: the kubelet shows the break and the status says why (a rolloutHold gate from the retry ladder or the budget, a Failed row, a RetryHeld or InstanceFailed event); every bumped member's updateStrategy is patched from SurgeThenDrain to RecreatePod once the roll is parked on the broken pod; then the fix push, the override dropped, lands under the edit on every Instance of the bumped members, nothing of the broken revision is created again or left, no hold is left and the live spec carries the edit; the budget (maxSurge 1, maxUnavailable 1) is valid under both strategies
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11258 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { instanceReadyTimeout: "90s", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
