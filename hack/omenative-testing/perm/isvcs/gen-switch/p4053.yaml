# p4053: [gen] switch rotating over readiness persist engine-mn W1 N=2 strategy RecreatePod to SurgeThenDrain co none  Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 fault=readiness:old co=none topo=engine-mn form=persist during=rotating edit=strategy:SurgeThenDrain
# reason: the operator edits a roll over a fleet whose engine is already broken: the leader pod of the engine's highest Instance gets the readiness switch and stops passing readiness on the settled service, and the push follows once the status has reacted to it; the cause stays for the whole case; every bumped member's updateStrategy is patched from RecreatePod to SurgeThenDrain at the first updated pod; a step already in flight finishes under RecreatePod and every step afterwards runs under SurgeThenDrain, so the roll completes with every Instance of the bumped members on the new revision serving, every row settled, nothing held and the live spec carrying SurgeThenDrain; the broken Instance is off the target from the moment of the push, so the roll owns it: it ends on the new revision serving with no repair opened for it after the push; the budget (maxSurge 1, maxUnavailable 1) is valid under both strategies and the ceiling is N+1, since a surge step can be in flight on either side of the edit; the capacity floor is lowered by the broken Instance
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p4053 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
