# p3964: [gen] switch settling pd-mn W1 N=2 InPlaceIfPossible to RecreatePod co rolling  Ne=2 Nd=2 Nr=2 ceil_e=2 ceil_d=2 ceil_r=2 co=rolling topo=pd-mn during=settling edit=strategy:RecreatePod
# reason: every bumped member's updateStrategy is patched from InPlaceIfPossible to RecreatePod right after the bump lands; a step already in flight finishes under InPlaceIfPossible and every step that starts afterwards runs under RecreatePod; the budget (maxSurge 0, maxUnavailable 1) is valid under both; neither side surges, so the ceiling is N; maxUnavailable 1 gives either side the one slot it needs to drain or patch, so the floor N-1 holds throughout; a gang runs either in-place variant as a whole-gang recreate; the group paces engine and decoder together and both carry the edit; every Instance ends on the new revision and the live spec carries RecreatePod
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p3964 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "InPlaceIfPossible", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "InPlaceIfPossible", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          rollingUpdate: {}
