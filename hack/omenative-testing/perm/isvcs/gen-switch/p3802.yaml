# p3802: [gen] switch settling engine N=4 SurgeThenDrain to InPlaceIfPossible  Ne=4 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 co=none topo=engine during=settling edit=strategy:InPlaceIfPossible
# reason: every bumped member's updateStrategy is patched from SurgeThenDrain to InPlaceIfPossible right after the bump lands; a step already in flight finishes under SurgeThenDrain and every step that starts afterwards runs under InPlaceIfPossible; the budget (maxSurge 1, maxUnavailable 1) is valid under both; the ceiling is N+1 because a surge step can be in flight on either side of the edit; maxUnavailable 1 gives either side the one slot it needs to drain or patch, so the floor N-1 holds throughout; every Instance ends on the new revision and the live spec carries InPlaceIfPossible
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p3802 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
