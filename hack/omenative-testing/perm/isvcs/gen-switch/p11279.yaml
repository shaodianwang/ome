# p11279: [gen] switch held by crash-start once on the decoder pd N=4 strategy SurgeThenDrain to RecreatePod co rolling  Ne=4 Nd=4 Nr=2 ceil_e=5 ceil_d=5 ceil_r=2 co=rolling topo=pd during=held victimcomp=decoder break=crash-start edit=strategy:RecreatePod once=1
# reason: the operator edits a roll whose push breaks once: the push's first decoder pod has its runner killed once during its first start, before it was ever Ready, and the kubelet restarts it; every bumped member's updateStrategy is patched from SurgeThenDrain to RecreatePod as the break shows; the roll completes on its own under the edit with no hold behind it, the Instance Ready and serving on the new revision, every row settled, nothing escalated, and the live spec carries the edit; a rebuild is reported where the restart policy promises one, never required, never twice; the budget (maxSurge 1, maxUnavailable 1) is valid under both strategies; the engine's own roll converges or holds meanwhile and the fix lands on it too; the group paces engine and decoder together and both carry the edit
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11279 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          rollingUpdate: {}
