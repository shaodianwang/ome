# p4044: [gen] switch settling over configkey never engine-mn W1 N=2 strategy SurgeThenDrain to RecreatePod co none  Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 fault=configkey:missing co=none topo=engine-mn during=settling edit=strategy:RecreatePod lift=never
# reason: the operator edits a roll over a fleet whose engine is already broken: the ConfigMap key the engine runner reads is removed and the leader pod of the engine's highest Instance restarted, so it waits in CreateContainerConfigError on the settled service, and the push follows once the status has reacted to it; the cause stays for the whole case; every bumped member's updateStrategy is patched from SurgeThenDrain to RecreatePod right after the bump lands; no revision starts without the key, so the push parks on its first pod with the reason (a Failed row at the Instance ready timeout, an InstanceFailed event), nothing of the new revision serves and the hold is kept; the edit is on the live spec meanwhile; the budget (maxSurge 1, maxUnavailable 1) is valid under both strategies and the ceiling is N+1, since a surge step can be in flight on either side of the edit; the capacity floor is lowered by the broken Instance
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p4044 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: { runner: { name: "ome-container", env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p4044-config", key: "value" } } }] } }
    worker: { size: 1 }
    lifecycle: { instanceReadyTimeout: "90s", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p4044-config }
data: { value: "1" }
