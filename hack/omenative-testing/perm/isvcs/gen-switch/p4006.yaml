# p4006: [gen] switch rotating over configkey never engine N=4 strategy InPlaceIfPossible to SurgeThenDrain co rolling  Ne=4 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 fault=configkey:missing co=rolling topo=engine during=rotating edit=strategy:SurgeThenDrain lift=never
# reason: the operator edits a roll over a fleet whose engine is already broken: the ConfigMap key the engine runner reads is removed and the pod of the engine's highest Instance restarted, so it waits in CreateContainerConfigError on the settled service, and the push follows once the status has reacted to it; the cause stays for the whole case; every bumped member's updateStrategy is patched from InPlaceIfPossible to SurgeThenDrain at the first updated pod; no revision starts without the key, so the push parks on its first pod with the reason (a Failed row at the Instance ready timeout, an InstanceFailed event), nothing of the new revision serves and the hold is kept; the edit is on the live spec meanwhile; the budget (maxSurge 1, maxUnavailable 1) is valid under both strategies and the ceiling is N+1, since a surge step can be in flight on either side of the edit; the capacity floor is lowered by the broken Instance; the single-member group puts the roll under the run model
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p4006 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    runner: { env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p4006-config", key: "value" } } }] }
    lifecycle: { instanceReadyTimeout: "90s", updateStrategy: { type: "InPlaceIfPossible", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  rollout:
    groups:
        - components: [engine]
          rollingUpdate: {}
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p4006-config }
data: { value: "1" }
