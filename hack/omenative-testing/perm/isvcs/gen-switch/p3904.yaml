# p3904: [gen] switch settling engine-mn W1 N=2 InPlaceIfPossible to RecreatePod  Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 co=none topo=engine-mn during=settling edit=strategy:RecreatePod
# reason: every bumped member's updateStrategy is patched from InPlaceIfPossible to RecreatePod right after the bump lands; a step already in flight finishes under InPlaceIfPossible and every step that starts afterwards runs under RecreatePod; the budget (maxSurge 0, maxUnavailable 1) is valid under both; neither side surges, so the ceiling is N; maxUnavailable 1 gives either side the one slot it needs to drain or patch, so the floor N-1 holds throughout; a gang runs either in-place variant as a whole-gang recreate; every Instance ends on the new revision and the live spec carries RecreatePod
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p3904 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "InPlaceIfPossible", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
