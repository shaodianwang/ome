# p4170: [gen] switch rotating over configkey after-settle pd N=4 strategy InPlaceIfPossible to SurgeThenDrain co rolling  Ne=4 Nd=4 Nr=2 ceil_e=5 ceil_d=5 ceil_r=2 fault=configkey:missing co=rolling topo=pd during=rotating edit=strategy:SurgeThenDrain lift=after-settle
# reason: the operator edits a roll over a fleet whose engine is already broken: the ConfigMap key the engine runner reads is removed and the pod of the engine's highest Instance restarted, so it waits in CreateContainerConfigError on the settled service, and the push follows once the status has reacted to it; the cause is taken away once the edit has fired; every bumped member's updateStrategy is patched from InPlaceIfPossible to SurgeThenDrain at the first updated pod; a step already in flight finishes under InPlaceIfPossible and every step afterwards runs under SurgeThenDrain, so the roll completes with every Instance of the bumped members on the new revision serving, every row settled, nothing held and the live spec carrying SurgeThenDrain; the broken Instance is off the target from the moment of the push, so the roll owns it: it ends on the new revision serving with no repair opened for it after the push; the budget (maxSurge 1, maxUnavailable 1) is valid under both strategies and the ceiling is N+1, since a surge step can be in flight on either side of the edit; the capacity floor is lowered by the broken Instance; the group paces engine and decoder together and both carry the edit
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p4170 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    runner: { env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p4170-config", key: "value" } } }] }
    lifecycle: { instanceReadyTimeout: "90s", updateStrategy: { type: "InPlaceIfPossible", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { instanceReadyTimeout: "90s", updateStrategy: { type: "InPlaceIfPossible", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          rollingUpdate: {}
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p4170-config }
data: { value: "1" }
