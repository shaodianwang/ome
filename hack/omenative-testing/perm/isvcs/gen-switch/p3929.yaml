# p3929: [gen] switch rotating pd-mn W1 N=2 RecreatePod to InPlaceIfPossible  Ne=2 Nd=2 Nr=2 ceil_e=2 ceil_d=2 ceil_r=2 co=none topo=pd-mn during=rotating edit=strategy:InPlaceIfPossible
# reason: every bumped member's updateStrategy is patched from RecreatePod to InPlaceIfPossible at the first updated pod; a step already in flight finishes under RecreatePod and every step that starts afterwards runs under InPlaceIfPossible; the budget (maxSurge 0, maxUnavailable 1) is valid under both; neither side surges, so the ceiling is N; maxUnavailable 1 gives either side the one slot it needs to drain or patch, so the floor N-1 holds throughout; a gang runs either in-place variant as a whole-gang recreate; every Instance ends on the new revision and the live spec carries InPlaceIfPossible
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p3929 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
