# p11220: [gen] switch held by configkey engine-mn W1+router N=2 restartPolicy None to RecreateInstance co none  Ne=2 Nd=0 Nr=2 ceil_e=3 ceil_d=0 ceil_r=2 co=none topo=engine-mn during=held break=configkey edit=restartPolicy:RecreateInstanceOnPodRestart
# reason: the operator edits a roll whose push cannot start: the push gives the engine runner a ConfigMap key the ConfigMap lacks, so the roll parks on its first leader pod: the kubelet shows the break and the status says why (a rolloutHold gate from the retry ladder or the budget, a Failed row, a RetryHeld or InstanceFailed event); every bumped member's restartPolicy is patched from None to RecreateInstanceOnPodRestart once the roll is parked on the broken pod; then the fix push, the override dropped, lands under the edit on every Instance of the bumped members, nothing of the broken revision is created again or left, no hold is left and the live spec carries the edit; nothing of the broken revision ever served; the roll runs under SurgeThenDrain (maxSurge 1, maxUnavailable 0) and the policy decides what a pod restart rebuilds
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11220 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: { runner: { name: "ome-container", env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p11220-config", key: "value" } } }] } }
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", instanceReadyTimeout: "90s", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p11220-config }
data: { value: "1" }
