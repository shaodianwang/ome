# p3810: [gen] switch settling engine N=4 RecreatePod to InPlaceOnly  Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 co=none topo=engine edit=strategy:InPlaceOnly during=settling
# reason: every bumped member's updateStrategy is patched from RecreatePod to InPlaceOnly right after the bump lands; a step already in flight finishes under RecreatePod and every step that starts afterwards runs under InPlaceOnly; the budget (maxSurge 0, maxUnavailable 1) is valid under both; neither side surges, so the ceiling is N; maxUnavailable 1 gives either side the one slot it needs to drain or patch, so the floor N-1 holds throughout; every Instance ends on the new revision and the live spec carries InPlaceOnly
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p3810 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
