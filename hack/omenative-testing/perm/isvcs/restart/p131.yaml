# p131: kill engine restartPolicy=RecreateInstance  mode=kill Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 restart=RecreateInstance co=none topo=engine
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p131 }
spec:
