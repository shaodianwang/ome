# p1002: [gen] rollout engine N=4 SurgeThenDrain s25pct  Ne=4 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 co=none topo=engine
# reason: plain bump: rolls within the surge budget (peak <= 5), never below N ready
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p1002 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: "25%", maxUnavailable: 0 } } }
