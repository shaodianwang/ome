# p1038: [gen] rollout engine-mn W2 N=2 SurgeThenDrain s25pct  Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 co=none topo=engine-mn
# reason: plain bump: rolls within the surge budget (peak <= 3), never below N ready
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p1038 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 2 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: "25%", maxUnavailable: 0 } } }
