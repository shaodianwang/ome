# p3000: [gen] heal configkey engine N=4 rp None lift after-settle co none  Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 fault=configkey:missing co=none topo=engine during=idle lift=after-settle expect=heals
# reason: the engine runner's ConfigMap key is removed on the highest Instance's pod and the runner restarted, so its next start waits in CreateContainerConfigError; the crash-loop repair opens as soon as the wait is seen (the stuck-pod clock counts from the pod's creation, and the victim is older than the grace) and rebuilds the pod, which waits on the same key; the key is put back once that wait has held for the settle window, before any attempt escalates, and the kubelet's own retry starts the container on the rebuilt pod, or on the victim itself where the key returns before the repair opens; an open repair promotes the Instance; the Instance is Ready and serving again on its running revision with no new revision and no reset mailbox
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p3000 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    runner: { env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p3000-config", key: "value" } } }] }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p3000-config }
data: { value: "1" }
