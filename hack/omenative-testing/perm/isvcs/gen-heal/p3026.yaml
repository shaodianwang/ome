# p3026: [gen] heal configkey pd-mn W1 N=2 rp None lift after-failed co none  Ne=2 Nd=2 Nr=2 ceil_e=2 ceil_d=2 ceil_r=2 fault=configkey:missing co=none topo=pd-mn during=idle lift=after-failed expect=heals
# reason: the engine runner's ConfigMap key is removed on the highest Instance's gang leader and the runner restarted, so its next start waits in CreateContainerConfigError; the crash-loop repair opens as soon as the wait is seen (the stuck-pod clock counts from the pod's creation, and the victim is older than the grace) and rebuilds the pod, which waits on the same key; the wait outlives the stuck-pod grace, or the attempt its Instance ready timeout, and the escalation parks the repair at Failed with its Restart kept; the key is put back once the row reads Failed, the kubelet's own retry starts the container, and the parked repair resumes when its rebuilt set comes up (a set that stayed wedged would be rebuilt again on the update retry ladder, where one is configured) and promotes the Instance; the Instance is Ready and serving again on its running revision with no new revision and no reset mailbox
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p3026 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: { runner: { name: "ome-container", env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p3026-config", key: "value" } } }] } }
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", instanceReadyTimeout: "90s", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p3026-config }
data: { value: "1" }
