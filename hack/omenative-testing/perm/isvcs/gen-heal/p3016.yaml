# p3016: [gen] heal configkey engine-mn W1 N=2 rp None lift after-settle co none  Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 fault=configkey:missing co=none topo=engine-mn during=idle lift=after-settle expect=heals
# reason: the engine runner's ConfigMap key is removed on the highest Instance's gang leader and the runner restarted, so its next start waits in CreateContainerConfigError; the key is put back once that wait has held for the settle window, before any attempt escalates, and the kubelet's own retry starts the container on that pod, or on the one the crash-loop repair rebuilt when it opened first (the stuck-pod clock counts from the pod's creation, and the victim is older than the grace); the Instance is Ready and serving again on its running revision with no new revision and no reset mailbox
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p3016 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: { runner: { name: "ome-container", env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p3016-config", key: "value" } } }] } }
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p3016-config }
data: { value: "1" }
