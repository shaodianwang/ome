# p3002: [gen] heal configkey engine N=4 rp None lift after-failed co none  Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 fault=configkey:missing co=none topo=engine during=idle lift=after-failed expect=heals notimpl=1 issue=1978
# reason: parked: the repair that rebuilt the Instance keeps its operation when the row escalates to Failed, and a Failed row with an operation has no exit once its pods are runtime-ready, so the key's return starts the pods while the row stays Failed with nothing serving until the reset mailbox
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p3002 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    runner: { env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p3002-config", key: "value" } } }] }
    lifecycle: { restartPolicy: "None", instanceReadyTimeout: "90s", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p3002-config }
data: { value: "1" }
