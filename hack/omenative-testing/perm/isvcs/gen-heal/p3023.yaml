# p3023: [gen] heal configkey engine-mn W1 N=2 rp RecreateInstance lift after-failed co rolling  Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 fault=configkey:missing co=rolling topo=engine-mn during=idle lift=after-failed expect=heals
# reason: the engine runner's ConfigMap key is removed on the highest Instance's gang leader and the runner restarted, so its next start waits in CreateContainerConfigError; the runner-restart repair rebuilds the pod, which waits on the same key; the group gates only a fresh crash-loop repair of a pod set that still serves, and the runner-restart repair is not put to it, so it opens as with no group; the wait outlives the stuck-pod grace, or the attempt its Instance ready timeout, and the escalation parks the repair at Failed with its Restart kept; the key is put back once the row reads Failed, the kubelet's own retry starts the container, and the parked repair resumes when its rebuilt set comes up (a set that stayed wedged would be rebuilt again on the update retry ladder, where one is configured) and promotes the Instance; the Instance is Ready and serving again on its running revision with no new revision and no reset mailbox
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p3023 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: { runner: { name: "ome-container", env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p3023-config", key: "value" } } }] } }
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", instanceReadyTimeout: "90s", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          rollingUpdate: {}
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p3023-config }
data: { value: "1" }
