# p3013: [gen] heal configkey pd N=4 rp RecreateInstance lift after-settle co rolling  Ne=4 Nd=4 Nr=2 ceil_e=4 ceil_d=4 ceil_r=2 fault=configkey:missing co=rolling topo=pd during=idle lift=after-settle expect=heals
# reason: the engine runner's ConfigMap key is removed on the highest Instance's pod and the runner restarted, so its next start waits in CreateContainerConfigError; the runner-restart repair rebuilds the pod, which waits on the same key; the group gates only a fresh crash-loop repair of a pod set that still serves, and the runner-restart repair is not put to it, so it opens as with no group; the key is put back once that wait has held for the settle window, before any attempt escalates, and the kubelet's own retry starts the container on the rebuilt pod; an open repair promotes the Instance; the Instance is Ready and serving again on its running revision with no new revision and no reset mailbox
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p3013 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    runner: { env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p3013-config", key: "value" } } }] }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          rollingUpdate: {}
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p3013-config }
data: { value: "1" }
