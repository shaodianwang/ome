# p49: PD e=4 d=4 r=2 strategy=RecreatePod (per-Comp) + BlueGreen group  Ne=8 Nd=8 Nr=2 ceil_e=8 ceil_d=8 ceil_r=2 topo=pd
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p49 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,        name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime,   name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: RecreatePod, rollingUpdate: { maxSurge: 0, maxUnavailable: "100%" } } }
  decoder:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: RecreatePod, rollingUpdate: { maxSurge: 0, maxUnavailable: "100%" } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: RecreatePod, rollingUpdate: { maxSurge: 0, maxUnavailable: "100%" } } }
  rollout:
    groups:
        - components: [engine, decoder]
          blueGreen: {}
