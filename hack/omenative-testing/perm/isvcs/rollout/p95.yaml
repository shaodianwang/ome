# p95: PD MN e+d leader+1w N=3 RatioBalanced STD (odd-N gang surge)  Ne=3 Nd=3 Nr=2 ceil_e=4 ceil_d=4 ceil_r=3 topo=pd-mn
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p95 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 3
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: SurgeThenDrain, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 3
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: SurgeThenDrain, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: SurgeThenDrain, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    coordination:
      groups:
        - components: [engine, decoder]
          policy: RollingUpdate
          pacing: { type: RatioBalanced, ratioTolerance: 25, maxUnavailable: 1 }
