# p14: engine-only N=4 RecreatePod maxUnavail=1 (drain-first; SurgeThenDrain needs surge budget so maxSurge=0 stalls it)  Ne=8 Nd=0 Nr=0 ceil_e=8 ceil_d=0 ceil_r=0 topo=engine
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p14 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,        name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime,   name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle:
      updateStrategy:
        type: RecreatePod
        rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
