# p97: MN engine leader+1w N=8 max=10 SurgeThenDrain maxSurge=2 (8 gang Instances, two surges in flight)  Ne=8 Nd=0 Nr=0 ceil_e=10 ceil_d=0 ceil_r=0 topo=engine-mn
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p97 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 10
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: SurgeThenDrain, rollingUpdate: { maxSurge: 2, maxUnavailable: 0 } } }
