# p21: engine-only N=2 SurgeThenDrain maxSurge=2 (100%) maxUnavail=0  Ne=2 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 topo=engine
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p21 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,        name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime,   name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle:
      updateStrategy:
        type: SurgeThenDrain
        rollingUpdate: { maxSurge: 2, maxUnavailable: 0 }
