# p90: PD MN e+d leader+1w N=2 RatioBalanced InPlaceIfPossible (gang in-place->recreate under coord) [in-place->recreate drain-first under RatioBalanced: band unsatisfiable] infeasible=1  Ne=2 Nd=2 Nr=2 ceil_e=2 ceil_d=2 ceil_r=3 topo=pd-mn
# reason: in-place strategies bypass the ratio gate (RatioGateBypassed), so the gang fallback-recreate roll proceeds but sustains a 2:1 band deviation the harness band monitor flags
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p90 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: InPlaceIfPossible, rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: InPlaceIfPossible, rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: SurgeThenDrain, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          rollingUpdate: { maxUnavailable: 1 }
          maintainRatio: { tolerance: 25 }
