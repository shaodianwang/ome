# p44: COMPOSITION TEST — group pacing=2 vs per-Comp lifecycle (e.surge=1, d.surge=4)  Ne=8 Nd=8 Nr=2 ceil_e=9 ceil_d=12 ceil_r=3 topo=engine
# Per documented contract, group pacing.maxSurge=2 should be authoritative — both peak at 6.
# If per-Component lifecycle wins instead (B2 bug), engine peaks at 5 and decoder at 8.
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p44 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,        name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime,   name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: SurgeThenDrain, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: SurgeThenDrain, rollingUpdate: { maxSurge: 4, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: SurgeThenDrain, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          blueGreen: {}
