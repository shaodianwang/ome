# p62: PD RollingUpdate group + PerComponent pacing (surge) — each component paces on its OWN budget, no cross-ratio  Ne=4 Nd=4 Nr=2 ceil_e=5 ceil_d=5 ceil_r=3 topo=pd
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p62 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,        name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime,   name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: SurgeThenDrain, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: SurgeThenDrain, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: SurgeThenDrain, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    coordination:
      groups:
        - components: [engine, decoder]
          policy: RollingUpdate
          pacing: { type: PerComponent, maxUnavailable: 1 }
