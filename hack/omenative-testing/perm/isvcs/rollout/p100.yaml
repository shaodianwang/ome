# p100: MN engine leader+1w N=8 max=12 SurgeThenDrain maxSurge=50% (four gang surges in flight)  Ne=8 Nd=0 Nr=0 ceil_e=12 ceil_d=0 ceil_r=0 topo=engine-mn
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p100 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 12
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: SurgeThenDrain, rollingUpdate: { maxSurge: 50%, maxUnavailable: 0 } } }
