# p98: MN engine leader+2w N=12 max=14 SurgeThenDrain maxSurge=2 (12 3-pod gangs, two surges in flight)  Ne=12 Nd=0 Nr=0 ceil_e=14 ceil_d=0 ceil_r=0 topo=engine-mn
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p98 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 12
    maxReplicas: 14
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 2 }
    lifecycle: { updateStrategy: { type: SurgeThenDrain, rollingUpdate: { maxSurge: 2, maxUnavailable: 0 } } }
