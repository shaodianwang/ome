# p99: PD MN e+d leader+1w N=8 max=10 PerComponent SurgeThenDrain maxSurge=2 (large-N PD gang surge)  Ne=8 Nd=8 Nr=2 ceil_e=10 ceil_d=10 ceil_r=3 topo=pd-mn
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p99 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 10
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: SurgeThenDrain, rollingUpdate: { maxSurge: 2, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 8
    maxReplicas: 10
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: SurgeThenDrain, rollingUpdate: { maxSurge: 2, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: SurgeThenDrain, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          rollingUpdate: { maxUnavailable: 1 }
