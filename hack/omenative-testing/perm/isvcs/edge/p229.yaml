# p229: maxSurge=2 engine N=8 SurgeThenDrain (surge 2 -> peak 10)  Ne=8 Nd=0 Nr=0 ceil_e=10 ceil_d=0 ceil_r=0 co=none topo=engine floor_hard=1
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p229 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 2, maxUnavailable: 0 } } }
