# p222: %-budget maxSurge=100% engine (surge 8 -> peak 16)  Ne=8 Nd=0 Nr=0 ceil_e=16 ceil_d=0 ceil_r=0 co=none topo=engine
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p222 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: "100%", maxUnavailable: 0 } } }
