# p13031: [gen] pairing v1 to v2 then back 1x1 surge+recreate slow none mu0 group  mode=pairing Ne=1 Nd=1 Nr=0 ceil_e=2 ceil_d=1 ceil_r=0 co=bluegreen topo=pd proto=pair-v2 proto2=pair-v1 hold_max=240
# reason: the protocol is changed from pair-v1 to pair-v2 on 1 engine (surge) and 1 decoder (recreate) that one blueGreen group rolls together, and set back to pair-v1 once the first pair-v2 pod is Ready: with one pod a side the decoder's only pod goes down at once (holding it would wait forever on a replacement that starts only once it is gone) and comes back on pair-v2 while the engine surges its replacement, so the service serves no pair while the decoder's pod is away; the pods already on pair-v2 are replaced by pair-v1 pods, the pods that never moved stay, and no pod is left on pair-v2; while the decoder's only pod is replaced no engine pod can pair, so the pairable floor is reported rather than failed and the case holds the pair-alive check, the hold bound and the convergence; every Pairing hold lifts within 240 s; both sides end back on pair-v1 with the label on every pod, every live traffic target and every routing Service
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p13031 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 1
    maxReplicas: 1
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 1
    maxReplicas: 1
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  rollout:
    pairingProtocol: pair-v1
    groups:
        - components: [engine, decoder]
          blueGreen: {}
