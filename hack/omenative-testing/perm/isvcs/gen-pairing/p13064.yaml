# p13064: [gen] pairing v1 to empty 1x1 recreate+surge slow none mu0 group  mode=pairing Ne=1 Nd=1 Nr=0 ceil_e=1 ceil_d=2 ceil_r=0 co=bluegreen topo=pd proto=clear hold_max=240 inv_hard=L
# reason: the protocol pair-v1 is removed from 1 engine (recreate) and 1 decoder (surge) that one blueGreen group rolls together: an empty protocol pairs with anything, so nothing is held and each side rolls under its own budget; the engine keeps 0 and the decoder keeps 1 pairable serving pods at every tick (desired minus maxUnavailable; a sustained dip fails the case); every Pairing hold lifts within 240 s; both sides end with no protocol label on any pod, traffic target or Service
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p13064 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 1
    maxReplicas: 1
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 1
    maxReplicas: 1
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    pairingProtocol: pair-v1
    groups:
        - components: [engine, decoder]
          blueGreen: {}
