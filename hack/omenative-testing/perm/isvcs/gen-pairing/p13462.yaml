# p13462: [gen] pairing empty to v1 2P6D recreate+surge slow none mu1 ungrouped  mode=pairing Ne=2 Nd=6 Nr=0 ceil_e=2 ceil_d=9 ceil_r=0 co=none topo=pd proto=pair-v1 hold_max=240 inv_hard=L
# reason: the protocol pair-v1 is set for the first time on 2 engines (recreate) and 6 decoders (surge) with no rollout group: an empty protocol pairs with anything, so nothing is held and each side rolls under its own budget; the engine keeps 1 and the decoder keeps 5 pairable serving pods at every tick (desired minus maxUnavailable; a sustained dip fails the case); every Pairing hold lifts within 240 s; both sides end on pair-v1 with the label on every pod, every live traffic target and every routing Service
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p13462 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 6
    maxReplicas: 6
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 3, maxUnavailable: 1 } } }
