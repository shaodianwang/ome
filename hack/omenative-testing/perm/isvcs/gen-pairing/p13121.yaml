# p13121: [gen] pairing empty to v1 1x1 in-place+surge slow none mu1 group  mode=pairing Ne=1 Nd=1 Nr=0 ceil_e=1 ceil_d=2 ceil_r=0 co=bluegreen topo=pd proto=pair-v1 hold_max=240 inv_hard=L
# reason: the protocol pair-v1 is set for the first time on 1 engine (in-place) and 1 decoder (surge) that one blueGreen group rolls together: an empty protocol pairs with anything, so nothing is held and each side rolls under its own budget; the engine keeps 0 and the decoder keeps 0 pairable serving pods at every tick (desired minus maxUnavailable; a sustained dip fails the case); every Pairing hold lifts within 240 s; both sides end on pair-v1 with the label on every pod, every live traffic target and every routing Service
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p13121 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 1
    maxReplicas: 1
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "InPlaceIfPossible", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 1
    maxReplicas: 1
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          blueGreen: {}
