# p13312: [gen] pairing v1 to v2 to v3 6P2D surge+recreate slow both mu0 group  mode=pairing Ne=6 Nd=2 Nr=0 ceil_e=9 ceil_d=2 ceil_r=0 co=bluegreen topo=pd proto=pair-v2 proto2=pair-v3 hold_max=240 inv_hard=L
# reason: the protocol is changed from pair-v1 to pair-v2 on 6 engines (surge) and 2 decoders (recreate) that one blueGreen group rolls together, and changed again to pair-v3 once the first pair-v2 pod is Ready, with both sides' pods starting 40 s late so the two replacements are Ready at about the same time: the decoder takes one old pod down before its replacement starts and may take its last old pod down only once a pair-v2 engine serves, while the engine surges replacements and keeps an old pod serving while that pod is the last one that pairs; the second change rolls both sides on to pair-v3 the same way and no pod is left on pair-v2; the engine keeps 6 and the decoder keeps 1 pairable serving pods at every tick (desired minus maxUnavailable; a sustained dip fails the case); every Pairing hold lifts within 240 s; both sides end on pair-v3 with the label on every pod, every live traffic target and every routing Service
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p13312 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 6
    maxReplicas: 6
    annotations: { ome.io/deploymentMode: OMENative }
    runner: { env: [{ name: "TEST_STARTUP_DELAY", value: "40" }] }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 3, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    runner: { env: [{ name: "TEST_STARTUP_DELAY", value: "40" }] }
    lifecycle: { updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  rollout:
    pairingProtocol: pair-v1
    groups:
        - components: [engine, decoder]
          blueGreen: {}
