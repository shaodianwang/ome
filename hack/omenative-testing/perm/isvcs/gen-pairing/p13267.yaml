# p13267: [gen] pairing empty to v1 6P2D surge+surge slow none mu1 group  mode=pairing Ne=6 Nd=2 Nr=0 ceil_e=9 ceil_d=3 ceil_r=0 co=bluegreen topo=pd proto=pair-v1 hold_max=240 inv_hard=L
# reason: the protocol pair-v1 is set for the first time on 6 engines (surge) and 2 decoders (surge) that one blueGreen group rolls together: an empty protocol pairs with anything, so nothing is held and each side rolls under its own budget; the engine keeps 5 and the decoder keeps 1 pairable serving pods at every tick (desired minus maxUnavailable; a sustained dip fails the case); every Pairing hold lifts within 240 s; both sides end on pair-v1 with the label on every pod, every live traffic target and every routing Service
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p13267 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 6
    maxReplicas: 6
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 3, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          blueGreen: {}
