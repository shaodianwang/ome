# p13058: [gen] pairing v1 to v2 1x1 surge+recreate slow both mu1 group  mode=pairing Ne=1 Nd=1 Nr=0 ceil_e=2 ceil_d=1 ceil_r=0 co=bluegreen topo=pd proto=pair-v2 hold_max=240 inv_hard=L
# reason: the protocol is changed from pair-v1 to pair-v2 on 1 engine (surge) and 1 decoder (recreate) that one blueGreen group rolls together, with both sides' pods starting 40 s late so the two replacements are Ready at about the same time: with one pod a side the decoder's only pod goes down at once (holding it would wait forever on a replacement that starts only once it is gone) and comes back on pair-v2 while the engine surges its replacement, so the service serves no pair while the decoder's pod is away; the engine keeps 0 and the decoder keeps 0 pairable serving pods at every tick (desired minus maxUnavailable; a sustained dip fails the case); every Pairing hold lifts within 240 s; both sides end on pair-v2 with the label on every pod, every live traffic target and every routing Service
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p13058 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 1
    maxReplicas: 1
    annotations: { ome.io/deploymentMode: OMENative }
    runner: { env: [{ name: "TEST_STARTUP_DELAY", value: "40" }] }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 1
    maxReplicas: 1
    annotations: { ome.io/deploymentMode: OMENative }
    runner: { env: [{ name: "TEST_STARTUP_DELAY", value: "40" }] }
    lifecycle: { updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  rollout:
    pairingProtocol: pair-v1
    groups:
        - components: [engine, decoder]
          blueGreen: {}
