# p13239: [gen] pairing v1 to empty 2x2 in-place+surge slow none mu0 ungrouped  mode=pairing Ne=2 Nd=2 Nr=0 ceil_e=2 ceil_d=3 ceil_r=0 co=none topo=pd proto=clear hold_max=240 inv_hard=L
# reason: the protocol pair-v1 is removed from 2 engines (in-place) and 2 decoders (surge) with no rollout group: an empty protocol pairs with anything, so nothing is held and each side rolls under its own budget; the engine keeps 1 and the decoder keeps 2 pairable serving pods at every tick (desired minus maxUnavailable; a sustained dip fails the case); every Pairing hold lifts within 240 s; both sides end with no protocol label on any pod, traffic target or Service
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p13239 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "InPlaceIfPossible", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    pairingProtocol: pair-v1
