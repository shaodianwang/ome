# p13146: [gen] pairing v1 to v2 to v3 2x2 surge+surge slow decoder mu0 group  mode=pairing Ne=2 Nd=2 Nr=0 ceil_e=3 ceil_d=3 ceil_r=0 co=bluegreen topo=pd proto=pair-v2 proto2=pair-v3 hold=1 hold_max=240 inv_hard=L
# reason: the protocol is changed from pair-v1 to pair-v2 on 2 engines (surge) and 2 decoders (surge) that one blueGreen group rolls together, and changed again to pair-v3 once the first pair-v2 pod is Ready, with the decoder's pods starting 40 s late so the engine's replacement is Ready first: each side surges a replacement and keeps its old pod serving under a Pairing hold until the other side serves pair-v2, so no old pod leaves while the other side's old pods still need it; the second change rolls both sides on to pair-v3 the same way and no pod is left on pair-v2; the engine keeps 2 and the decoder keeps 2 pairable serving pods at every tick (desired minus maxUnavailable; a sustained dip fails the case); a Pairing hold is seen and every Pairing hold lifts within 240 s; both sides end on pair-v3 with the label on every pod, every live traffic target and every routing Service
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p13146 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    runner: { env: [{ name: "TEST_STARTUP_DELAY", value: "40" }] }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    pairingProtocol: pair-v1
    groups:
        - components: [engine, decoder]
          blueGreen: {}
