# p5825: [gen] rollback at draining engine N=4 RecreatePod u1 co rolling  Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 co=rolling topo=engine during=draining rollback=1
# reason: the starting revision is re-applied at the first pod of the starting revision draining; every Instance ends on it and serving, no pod of the new revision remains, the capacity floor holds throughout and no Instance is left mid-operation; Instances already on the new revision come back drain-first within the unavailable budget; the run that targeted the new revision closes as superseded and a fresh run brings the group back
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p5825 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: "OMENative", perm.test/rev: "v1" }
    lifecycle: { updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  rollout:
    groups:
        - components: [engine]
          rollingUpdate: {}
