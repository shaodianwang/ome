# p11068: [gen] rollback at held by imagepull once engine+router N=4 SurgeThenDrain s1 co none  Ne=4 Nd=0 Nr=2 ceil_e=5 ceil_d=0 ceil_r=2 co=none topo=engine during=held rollback=1 break=imagepull once=1
# reason: the operator rolls back a push its first pod cannot carry: the push's first engine pod is pointed at an image that cannot be pulled while its runner is still starting, before it was ever Ready, and the kubelet reports the pull failure; the starting revision is re-applied as soon as the break shows and the image is put back once the rollback has fired; every Instance of the bumped members ends on the starting revision and serving, no pod of the withdrawn revision remains, none is created after the rollback fired and no repair names a bumped Instance after it; the capacity floor holds throughout; the broken surge Instance never joins rotation and is withdrawn under the surge budget
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11068 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: "OMENative", perm.test/rev: "v1" }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
