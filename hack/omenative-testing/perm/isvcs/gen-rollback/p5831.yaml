# p5831: [gen] rollback at settling engine N=4 InPlaceIfPossible u1 co rolling  Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 co=rolling topo=engine during=settling rollback=1
# reason: the starting revision is re-applied at the moment the bump has landed, before any Instance moved; every Instance ends on it and serving, no pod of the new revision remains, the capacity floor holds throughout and no Instance is left mid-operation; an in-place roll comes back in place (UIDs stable); the run that targeted the new revision closes as superseded and a fresh run brings the group back
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p5831 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: "OMENative", perm.test/rev: "v1" }
    lifecycle: { updateStrategy: { type: "InPlaceIfPossible", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  rollout:
    groups:
        - components: [engine]
          rollingUpdate: {}
