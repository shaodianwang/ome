# p5951: [gen] rollback at rotating over configkey never engine N=4 RecreatePod u1 co none  Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 fault=configkey:missing co=none topo=engine during=rotating rollback=1 lift=never
# reason: the operator pushes a revision over a fleet whose engine is already broken: the ConfigMap key the engine runner reads is removed and the pod of the engine's highest Instance restarted, so it waits in CreateContainerConfigError on the settled service, and the push follows once the status has reacted to it; the cause stays for the whole case; the starting revision is re-applied at the first pod of the new revision; every Instance of the bumped members ends on the starting revision, no pod of the new revision remains, the capacity floor (lowered by the broken Instance) holds throughout and no Instance is left mid-operation; the broken engine Instance cannot serve while its cause stays, so it ends on the starting revision without serving, its Component one Instance short, and its row reads other than Ready; Instances already on the new revision come back drain-first within the unavailable budget
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p5951 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: "OMENative", perm.test/rev: "v1" }
    runner: { env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p5951-config", key: "value" } } }] }
    lifecycle: { instanceReadyTimeout: "90s", updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p5951-config }
data: { value: "1" }
