# p5961: [gen] rollback at last over readiness persist engine N=4 InPlaceIfPossible u1 co rolling  Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 fault=readiness:old co=rolling topo=engine form=persist during=last rollback=1
# reason: the operator pushes a revision over a fleet whose engine is already broken: the pod of the engine's highest Instance gets the readiness switch and stops passing readiness on the settled service, and the push follows once the status has reacted to it; the cause stays for the whole case; the starting revision is re-applied at the last Instance, every other one already on the new revision; every Instance of the bumped members ends on the starting revision, no pod of the new revision remains, the capacity floor (lowered by the broken Instance) holds throughout and no Instance is left mid-operation; the broken engine Instance cannot serve while its cause stays, so it ends on the starting revision without serving, its Component one Instance short, and its row reads other than Ready; an in-place roll comes back in place (UIDs stable); the run that targeted the new revision closes as superseded and a fresh run brings the group back
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p5961 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: "OMENative", perm.test/rev: "v1" }
    lifecycle: { updateStrategy: { type: "InPlaceIfPossible", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  rollout:
    groups:
        - components: [engine]
          rollingUpdate: {}
