# p11036: [gen] rollback at held by imagepull pd N=4 SurgeThenDrain s1 co none  Ne=4 Nd=4 Nr=2 ceil_e=5 ceil_d=4 ceil_r=2 co=none topo=pd during=held rollback=1 break=imagepull
# reason: the operator rolls back a push its first pod cannot carry: the push gives the engine runner an image that cannot be pulled, so the roll parks on its first pod: the kubelet shows the break, the status says why (a rolloutHold gate from the retry ladder or the budget, a Failed row, a RetryHeld or InstanceFailed event), and only then is the starting revision re-applied; every Instance of the bumped members ends on the starting revision and serving, no pod of the withdrawn revision remains, none is created after the rollback fired and no repair names a bumped Instance after it; the capacity floor holds throughout; nothing of the broken revision ever served; the broken surge Instance never joins rotation and is withdrawn under the surge budget
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11036 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: "OMENative", perm.test/rev: "v1" }
    lifecycle: { instanceReadyTimeout: "90s", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: "OMENative", perm.test/rev: "v1" }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
