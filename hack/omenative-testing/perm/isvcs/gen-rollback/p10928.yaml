# p10928: [gen] rollback at draining over crashloop start pd-mn W1 N=2 SurgeThenDrain s1 co rolling  Ne=2 Nd=2 Nr=2 ceil_e=3 ceil_d=3 ceil_r=2 fault=crashloop:old co=rolling topo=pd-mn form=start during=draining rollback=1
# reason: the operator pushes a revision over a fleet whose engine is already broken: the leader pod of the engine's highest Instance is pointed at an image whose runner dies at every start on the settled service, and the push follows once the status has reacted to it; the starting revision is re-applied at the first pod of the starting revision draining; every Instance of the bumped members ends on the starting revision, no pod of the new revision remains, the capacity floor (lowered by the broken Instance) holds throughout and no Instance is left mid-operation; the broken engine Instance ends Ready and serving on the starting revision, rebuilt by a repair or by the roll back or healed in place (the repairs that named it are reported, not judged); Instances already on the new revision come back under the surge budget; the run that targeted the new revision closes as superseded and a fresh run brings the group back
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10928 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: "OMENative", perm.test/rev: "v1" }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: "OMENative", perm.test/rev: "v1" }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          rollingUpdate: {}
