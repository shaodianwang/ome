# p11084: [gen] rollback at held by crash-start on the router alone engine+router N=4 SurgeThenDrain s1 co none  Ne=4 Nd=0 Nr=2 ceil_e=4 ceil_d=0 ceil_r=3 co=none topo=engine bump=router during=held victimcomp=router rollback=1 break=crash-start
# reason: the operator rolls back a push its first pod cannot carry: the push gives the router runner a runner that dies at every start, so the roll parks on its first pod: the kubelet shows the break, the status says why (a rolloutHold gate from the retry ladder or the budget, a Failed row, a RetryHeld or InstanceFailed event), and only then is the starting revision re-applied; every Instance of the bumped members ends on the starting revision and serving, no pod of the withdrawn revision remains, none is created after the rollback fired and no repair names a bumped Instance after it; the capacity floor holds throughout; nothing of the broken revision ever served; the broken surge Instance never joins rotation and is withdrawn under the surge budget; the push bumps the router alone, which rolls under its own strategy and its own retry ladder: the engine is never rolled, every engine Instance keeps its pods and keeps serving on its running revision throughout, and the router alone comes back
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11084 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: "OMENative", perm.test/rev: "v1" }
    lifecycle: { instanceReadyTimeout: "90s", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
