# p11029: [gen] rollback at held by crash-load once engine-mn W1+router N=2 SurgeThenDrain s1 co none  Ne=2 Nd=0 Nr=2 ceil_e=3 ceil_d=0 ceil_r=2 co=none topo=engine-mn during=held rollback=1 break=crash-load once=1
# reason: the operator rolls back a push its first pod cannot carry: the push's first engine leader pod has its runner killed once, once it is Ready and serving, and the kubelet restarts it; the starting revision is re-applied as soon as the restart shows; every Instance of the bumped members ends on the starting revision and serving, no pod of the withdrawn revision remains, none is created after the rollback fired and no repair names a bumped Instance after it; the capacity floor holds throughout; the broken surge Instance never joins rotation and is withdrawn under the surge budget
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11029 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: "OMENative", perm.test/rev: "v1" }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
