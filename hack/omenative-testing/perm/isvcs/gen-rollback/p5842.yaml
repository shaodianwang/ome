# p5842: [gen] rollback at draining pd N=4 SurgeThenDrain s1 co none  Ne=4 Nd=4 Nr=2 ceil_e=5 ceil_d=4 ceil_r=2 co=none topo=pd during=draining rollback=1
# reason: the starting revision is re-applied at the first pod of the starting revision draining; every Instance ends on it and serving, no pod of the new revision remains, the capacity floor holds throughout and no Instance is left mid-operation; Instances already on the new revision come back under the surge budget
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p5842 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: "OMENative", perm.test/rev: "v1" }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: "OMENative", perm.test/rev: "v1" }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
