# p5834: [gen] rollback at last engine N=4 InPlaceIfPossible u1 co none  Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 co=none topo=engine during=last rollback=1
# reason: the starting revision is re-applied at the last Instance, every other one already on the new revision; every Instance ends on it and serving, no pod of the new revision remains, the capacity floor holds throughout and no Instance is left mid-operation; an in-place roll comes back in place (UIDs stable)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p5834 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: "OMENative", perm.test/rev: "v1" }
    lifecycle: { updateStrategy: { type: "InPlaceIfPossible", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
