# p7051: [gen] readiness never engine-mn W1+router N=2 RecreatePod u1 rp RecreateInstance  Ne=2 Nd=0 Nr=2 ceil_e=2 ceil_d=0 ceil_r=2 restart=RecreateInstance fault=readiness:new co=none topo=engine-mn
# reason: the pushed revision carries the readiness switch, so its pods run and never pass readiness: the roll holds at the Instance ready timeout with the new Instance failed and the reason recorded, the old revision keeps serving at the floor and the broken revision never serves; a fix push without the switch then lands on every Instance; the first drained Instance's replacement is the one that fails (floor N-1); the router is untouched
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7051 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", instanceReadyTimeout: "90s", updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
