# p7036: [gen] readiness lost recover engine-mn W1+router N=2 rp None  Ne=2 Nd=0 Nr=2 ceil_e=2 ceil_d=0 ceil_r=2 restart=None fault=readiness:old co=none topo=engine-mn form=recover during=idle
# reason: the leader pod of the engine's highest gang stops passing its readiness probe while it keeps running; readiness is the runtime's own out-of-rotation signal, not a failure, so no restart policy rebuilds it: the Instance leaves the Ready endpoints at once, its row reports the drop (serving count below pod count), and nothing is rebuilt or surged; when the probe passes again the same pod returns to rotation and the row recovers, with no rebuild and no new revision; the router is untouched
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7036 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
