# p7005: [gen] readiness lost persist pd N=4 rp RecreateInstance  Ne=4 Nd=4 Nr=2 ceil_e=4 ceil_d=4 ceil_r=2 restart=RecreateInstance fault=readiness:old co=none topo=pd form=persist during=idle
# reason: the pod of the engine's highest Instance stops passing its readiness probe while it keeps running; readiness is the runtime's own out-of-rotation signal, not a failure, so no restart policy rebuilds it: the Instance leaves the Ready endpoints at once, its row reports the drop (serving count below pod count), and nothing is rebuilt or surged; the pod stays out of rotation and reported across the hold window, until an operator acts; decoder and router are untouched
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7005 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
