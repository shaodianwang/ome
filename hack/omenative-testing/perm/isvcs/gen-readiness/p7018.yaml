# p7018: [gen] readiness never pd N=4 SurgeThenDrain s1 rp None  Ne=4 Nd=4 Nr=2 ceil_e=5 ceil_d=4 ceil_r=2 restart=None fault=readiness:new co=none topo=pd
# reason: the pushed revision carries the readiness switch, so its pods run and never pass readiness: the roll holds at the Instance ready timeout with the new Instance failed and the reason recorded, the old revision keeps serving at the floor and the broken revision never serves; a fix push without the switch then lands on every Instance; the surge Instance is the one that fails and nothing drains (floor N); decoder and router are untouched
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7018 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", instanceReadyTimeout: "90s", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
