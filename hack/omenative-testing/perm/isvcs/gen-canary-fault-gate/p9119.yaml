# p9119: [gen] canary gate sibling router crashloop:load once at mid engine router N=8 rp None  mode=canary Ne=8 Nd=0 Nr=2 ceil_e=9 ceil_d=0 ceil_r=2 fault=crashloop:canary-serving@1 co=none topo=engine canary=auto form=load victims=1 victimcomp=router nophase=Failed cell=canary/Serving[soak]/siblingBroken[routerOnce] lift=after-settle
# reason: one running-revision router pod dies after Ready once while the second step soaks (the runner is killed once and left alone) on engine+router single (8 Instances), under restart policy None; the engine ladder walks every step to Stable, the router Instance is Ready and serving again on its running revision (brought back by the kubelet alone, or rebuilt by the repair where one opened), and the status reported the break while it lasted
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9119 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            steps:
              - { capacity: "10%", traffic: 10, pause: { duration: "20s" } }
              - { capacity: "30%", traffic: 30, pause: { duration: "20s" } }
              - { capacity: "60%", traffic: 60, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
