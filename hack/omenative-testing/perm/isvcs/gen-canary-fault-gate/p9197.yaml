# p9197: [gen] canary gate sibling decoder pushed crashInSoak exit rollback pd N=8  mode=canary Ne=8 Nd=8 Nr=2 ceil_e=9 ceil_d=9 ceil_r=2 fault=crashloop:new co=none topo=pd canary=auto form=load exitafter=10 during=canary-failed verb=rollback victimcomp=decoder terminal=RolledBack cell=canary/Serving/siblingBroken[crashInSoak],canary/Failed/rollback
# reason: the pushed decoder revision passes readiness and exits 10s later, inside the first soak while the engine's canary is up on engine+decoder+router single (8 Instances); the unit's step waits on the decoder's capacity and parks where it bit with a reason naming the gate, no traffic names the broken revision at the park while the stable side keeps serving, nothing promotes it, and then a rollback drains both sides back and holds at RolledBack with the rejected revision recorded
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9197 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          canary:
            readyTimeout: "90s"
            steps:
              - { capacity: "10%", traffic: 10, pause: { duration: "20s" } }
              - { capacity: "30%", traffic: 30, pause: { duration: "20s" } }
              - { capacity: "60%", traffic: 60, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
