# p9149: [gen] canary gate metric stable persist at idle pd N=8  mode=canary Ne=8 Nd=8 Nr=2 ceil_e=9 ceil_d=9 ceil_r=2 fault=metric:idle co=none topo=pd canary=auto form=persist analysis=pass failurelimit=1 nophase=RollingBack cell=canary/Idle/metricBreach[stable] health=pass
# reason: the running revision's error rate breaches the gate's threshold before the push lands (for the rest of the case) on engine+decoder+router single (8 Instances); the gate reads the canary revision alone, so it never counts the stable side's breach, never rolls the healthy canary back, and the ladder walks every gated step to Stable with every Instance on the canary revision serving
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9149 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-metrics, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: "OMENative", perm.test/error-rate: "0.0", perm.test/emit: "true", prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: "/metrics" }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: "OMENative", perm.test/error-rate: "0.0", perm.test/emit: "true", prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: "/metrics" }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          canary:
            steps:
              - capacity: "10%"
                traffic: 10
                analysis:
                  interval: "20s"
                  failureLimit: 1
                  initialDelay: "20s"
                  metrics:
                    - name: error_rate
                      query: 'max(canary_error_rate{inferenceservice="{{.ISVCName}}",component="{{.Component}}",revision_hash="{{.CanaryRevision}}"})'
                      operator: LTE
                      threshold: "0.05"
              - capacity: "30%"
                traffic: 30
                analysis:
                  interval: "20s"
                  failureLimit: 1
                  initialDelay: "20s"
                  metrics:
                    - name: error_rate
                      query: 'max(canary_error_rate{inferenceservice="{{.ISVCName}}",component="{{.Component}}",revision_hash="{{.CanaryRevision}}"})'
                      operator: LTE
                      threshold: "0.05"
              - capacity: "60%"
                traffic: 60
                analysis:
                  interval: "20s"
                  failureLimit: 1
                  initialDelay: "20s"
                  metrics:
                    - name: error_rate
                      query: 'max(canary_error_rate{inferenceservice="{{.ISVCName}}",component="{{.Component}}",revision_hash="{{.CanaryRevision}}"})'
                      operator: LTE
                      threshold: "0.05"
              - { capacity: "100%", traffic: 100 }
