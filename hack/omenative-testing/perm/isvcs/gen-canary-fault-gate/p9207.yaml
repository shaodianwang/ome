# p9207: [gen] canary gate metric stable recover at mid pd-mn W1 N=2  mode=canary Ne=2 Nd=2 Nr=2 ceil_e=3 ceil_d=3 ceil_r=2 fault=metric:canary-serving@1 co=none topo=pd-mn canary=auto form=recover victim=stable analysis=pass failurelimit=1 nophase=RollingBack cell=canary/Serving[analysis]/metricBreach[stable] health=pass
# reason: the running revision's error rate breaches the gate's threshold while the second step's analysis gate samples (for 45s and then recovers) on engine+decoder+router gang (2 Instances of 1 leader + 1 worker); the gate reads the canary revision alone, so it never counts the stable side's breach, never rolls the healthy canary back, and the ladder walks every gated step to Stable with every Instance on the canary revision serving
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9207 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-metrics-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: "OMENative", perm.test/error-rate: "0.0", perm.test/emit: "true", prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: "/metrics" }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: "OMENative", perm.test/error-rate: "0.0", perm.test/emit: "true", prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: "/metrics" }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          canary:
            steps:
              - capacity: "10%"
                traffic: 10
                analysis:
                  interval: "20s"
                  failureLimit: 1
                  initialDelay: "20s"
                  metrics:
                    - name: error_rate
                      query: 'max(canary_error_rate{inferenceservice="{{.ISVCName}}",component="{{.Component}}",revision_hash="{{.CanaryRevision}}"})'
                      operator: LTE
                      threshold: "0.05"
              - capacity: "30%"
                traffic: 30
                analysis:
                  interval: "20s"
                  failureLimit: 1
                  initialDelay: "20s"
                  metrics:
                    - name: error_rate
                      query: 'max(canary_error_rate{inferenceservice="{{.ISVCName}}",component="{{.Component}}",revision_hash="{{.CanaryRevision}}"})'
                      operator: LTE
                      threshold: "0.05"
              - capacity: "60%"
                traffic: 60
                analysis:
                  interval: "20s"
                  failureLimit: 1
                  initialDelay: "20s"
                  metrics:
                    - name: error_rate
                      query: 'max(canary_error_rate{inferenceservice="{{.ISVCName}}",component="{{.Component}}",revision_hash="{{.CanaryRevision}}"})'
                      operator: LTE
                      threshold: "0.05"
              - { capacity: "100%", traffic: 100 }
