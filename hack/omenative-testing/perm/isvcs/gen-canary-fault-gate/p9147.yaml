# p9147: [gen] canary gate sibling router pushed unpullable beside the ladder engine-mn W1 router N=2  mode=canary Ne=2 Nd=0 Nr=2 ceil_e=3 ceil_d=0 ceil_r=3 co=none topo=engine-mn canary=auto bump=engine,router img=example.com/canary-test/missing:none terminal=Stable nophase=Failed cell=canary/Staging/siblingBroken[routerParked] imgcomp=router
# reason: the router is pushed beside the engine ladder onto an image that cannot be pulled on engine+router gang (2 Instances of 1 leader + 1 worker); the router rolls on its own, never promotes a pod of that revision, keeps every router Instance serving on its running revision (an Instance whose running-revision pod still serves is kept on it, whatever failed attempt sits beside it) and says why it stopped (a hold, a Failed row or a RetryHeld or InstanceFailed event naming it), while the engine ladder walks every step to Stable unaffected; the router is left parked, as the status says
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9147 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            steps:
              - { capacity: "10%", traffic: 10, pause: { duration: "20s" } }
              - { capacity: "30%", traffic: 30, pause: { duration: "20s" } }
              - { capacity: "60%", traffic: 60, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
