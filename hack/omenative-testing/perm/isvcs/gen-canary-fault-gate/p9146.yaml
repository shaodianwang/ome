# p9146: [gen] canary gate sibling router imagepull once at mid engine-mn W1 router N=2 rp None  mode=canary Ne=2 Nd=0 Nr=2 ceil_e=3 ceil_d=0 ceil_r=2 fault=imagepull:canary-serving@1 co=none topo=engine-mn canary=auto victims=1 victimcomp=router nophase=Failed cell=canary/Serving[soak]/siblingBroken[routerOnce] lift=after-settle
# reason: one running-revision router pod sits in ImagePullBackOff once while the second step soaks (the image is put back 20s after the break bit) on engine+router gang (2 Instances of 1 leader + 1 worker), under restart policy None; the engine ladder walks every step to Stable, the router Instance is Ready and serving again on its running revision (brought back by the kubelet alone, or rebuilt by the repair where one opened), and the status reported the break while it lasted
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9146 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            steps:
              - { capacity: "10%", traffic: 10, pause: { duration: "20s" } }
              - { capacity: "30%", traffic: 30, pause: { duration: "20s" } }
              - { capacity: "60%", traffic: 60, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
