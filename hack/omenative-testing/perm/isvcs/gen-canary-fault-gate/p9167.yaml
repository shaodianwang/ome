# p9167: [gen] canary gate source unreachable never Hold at mid pd N=8  mode=canary Ne=8 Nd=8 Nr=2 ceil_e=9 ceil_d=9 ceil_r=2 fault=source:canary-serving@1 co=none topo=pd canary=auto form=unreachable analysis=pass failurelimit=1 terminal=Failed cell=canary/Serving[analysis]/sourceUnusable[unreachable] lift=never health=pass oninconclusive=hold
# reason: the analysis source points at a name that resolves nowhere while the second step's analysis gate samples on engine+decoder+router single (8 Instances); the gate reports that it cannot read health, holds the ladder at its step and counts no breach; the source never returns, so past the stall timeout the ladder parks Failed at that step with reason AnalysisStalled while the stable revision keeps serving every Instance the canary has not replaced, and nothing rolls back
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9167 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-metrics, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: "OMENative", perm.test/error-rate: "0.0", perm.test/emit: "true", prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: "/metrics" }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: "OMENative", perm.test/error-rate: "0.0", perm.test/emit: "true", prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: "/metrics" }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          canary:
            readyTimeout: "150s"
            steps:
              - capacity: "10%"
                traffic: 10
                analysis:
                  interval: "20s"
                  failureLimit: 1
                  initialDelay: "20s"
                  onInconclusive: Hold
                  metrics:
                    - name: error_rate
                      query: 'max(canary_error_rate{inferenceservice="{{.ISVCName}}",component="{{.Component}}",revision_hash="{{.CanaryRevision}}"})'
                      operator: LTE
                      threshold: "0.05"
              - capacity: "30%"
                traffic: 30
                analysis:
                  interval: "20s"
                  failureLimit: 1
                  initialDelay: "20s"
                  onInconclusive: Hold
                  metrics:
                    - name: error_rate
                      query: 'max(canary_error_rate{inferenceservice="{{.ISVCName}}",component="{{.Component}}",revision_hash="{{.CanaryRevision}}"})'
                      operator: LTE
                      threshold: "0.05"
              - capacity: "60%"
                traffic: 60
                analysis:
                  interval: "20s"
                  failureLimit: 1
                  initialDelay: "20s"
                  onInconclusive: Hold
                  metrics:
                    - name: error_rate
                      query: 'max(canary_error_rate{inferenceservice="{{.ISVCName}}",component="{{.Component}}",revision_hash="{{.CanaryRevision}}"})'
                      operator: LTE
                      threshold: "0.05"
              - { capacity: "100%", traffic: 100 }
