# p9107: [gen] canary gate source unreachable never RollbackOnStall at last engine router N=8  mode=canary Ne=8 Nd=0 Nr=2 ceil_e=9 ceil_d=0 ceil_r=2 fault=source:canary-serving@2 co=none topo=engine canary=auto form=unreachable analysis=pass failurelimit=1 terminal=RolledBack cell=canary/Serving[lastGate]/sourceUnusable[unreachable] lift=never health=pass oninconclusive=rollbackonstall
# reason: the analysis source is unreachable (the case's front for the store, which the run pinned, is aimed at nothing) while the last gate before the cutover samples on engine+router single (8 Instances); the gate reports that it cannot read health, holds the ladder at its step and counts no breach; the store never comes back, so past the stall timeout the fail-safe policy rolls the canary back instead of parking it: the canary drains to the stable revision and the rejected revision is recorded
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9107 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-metrics, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: "OMENative", perm.test/error-rate: "0.0", perm.test/emit: "true", prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: "/metrics" }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            readyTimeout: "150s"
            steps:
              - capacity: "10%"
                traffic: 10
                analysis:
                  interval: "20s"
                  failureLimit: 1
                  initialDelay: "20s"
                  onInconclusive: RollbackOnStall
                  metrics:
                    - name: error_rate
                      query: 'max(canary_error_rate{inferenceservice="{{.ISVCName}}",component="{{.Component}}",revision_hash="{{.CanaryRevision}}"})'
                      operator: LTE
                      threshold: "0.05"
              - capacity: "30%"
                traffic: 30
                analysis:
                  interval: "20s"
                  failureLimit: 1
                  initialDelay: "20s"
                  onInconclusive: RollbackOnStall
                  metrics:
                    - name: error_rate
                      query: 'max(canary_error_rate{inferenceservice="{{.ISVCName}}",component="{{.Component}}",revision_hash="{{.CanaryRevision}}"})'
                      operator: LTE
                      threshold: "0.05"
              - capacity: "60%"
                traffic: 60
                analysis:
                  interval: "20s"
                  failureLimit: 1
                  initialDelay: "20s"
                  onInconclusive: RollbackOnStall
                  metrics:
                    - name: error_rate
                      query: 'max(canary_error_rate{inferenceservice="{{.ISVCName}}",component="{{.Component}}",revision_hash="{{.CanaryRevision}}"})'
                      operator: LTE
                      threshold: "0.05"
              - { capacity: "100%", traffic: 100 }
