# p1883: canary-analysis engine final-step stall parks Failed  mode=canary Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 canary=auto analysis=inconclusive oninconclusive=hold failurelimit=1 cell=canary/Draining[A]/analysisStall[hold] co=none topo=engine
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p1883 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-metrics, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: "OMENative", perm.test/error-rate: "0.0", perm.test/emit: "false", prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: "/metrics" }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            readyTimeout: "90s"
            steps:
              - capacity: "100%"
                traffic: 100
                analysis:
                  interval: "20s"
                  failureLimit: 1
                  initialDelay: "20s"
                  onInconclusive: Hold
                  metrics:
                    - name: error_rate
                      query: 'max(canary_error_rate{inferenceservice="{{.ISVCName}}",component="{{.Component}}"})'
                      operator: LTE
                      threshold: "0.05"
