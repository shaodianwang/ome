# p318: TWO canary units on one ISVC, drives the router unit (engine unit idle)  mode=canary unit=router Ne=4 Nd=4 Nr=2 ceil_e=4 ceil_d=4 ceil_r=3 canary=auto cell=canary/Idle/newTarget[twoUnitsRouter] co=none topo=pd
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p318 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    # Two canary groups make no cross-group ordering promise; without this
    # admission rejects the shape before the case under test is reached.
    groupOrdering: Concurrent
    groups:
        # The mirror of p317: the same two-unit ISVC, driven from the other side.
        # The router's ladder is far shorter than the engine's — a router pod
        # whose backends are up is Ready in seconds — which is the whole reason
        # the two are separate runs rather than one shared plan.
        - components: [router]
          canary:
            steps:
              - { capacity: "50%", traffic: 50, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
        - components: [engine, decoder]
          canary:
            steps:
              - { capacity: "25%", traffic: 25, pause: {  } }
              - { capacity: "100%", traffic: 100 }
