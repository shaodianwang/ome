# p1955: canary engine promote while staging advances the referenced ladder without a soak once capacity lands  mode=canary Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 canary=manual during=canary-staging verb=promote cell=canary/Staging/promote[policyRef] co=none topo=engine
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p1955 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          policyRef: { name: p1955-policy, progression: canary }
---
apiVersion: ome.io/v1beta1
kind: RolloutPolicy
metadata:
  name: p1955-policy
  # Teardown deletes the case's documents in one pass, the policy with the
  # service that still references it.
  annotations: { ome.io/allow-in-use-delete: "true" }
spec:
  canary:
    steps:
      - { capacity: "50%", traffic: 50, pause: {  } }
      - { capacity: "100%", traffic: 100 }
