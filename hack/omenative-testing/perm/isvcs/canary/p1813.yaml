# p1813: canary pd-mn decoder gang canary unpullable beside a healthy engine canary  mode=canary Ne=2 Nd=2 Nr=0 ceil_e=3 ceil_d=3 ceil_r=0 canary=auto bump=engine,decoder img=example.com/canary-test/missing:none imgcomp=decoder terminal=Failed cell=canary/Staging/readyTimeout[gangDecoder] co=none topo=pd-mn
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p1813 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          canary:
            readyTimeout: "90s"
            steps:
              - { capacity: "50%", traffic: 50, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
