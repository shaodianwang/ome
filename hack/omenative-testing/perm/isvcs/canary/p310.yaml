# p310: canary engine manual 25/50/100 3-step  mode=canary Ne=4 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 canary=manual co=none topo=engine
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p310 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    canary:
      promotionPolicy: Manual
      steps:
        - { newCapacity: "25%", trafficWeight: 25, pause: {  } }
        - { newCapacity: "50%", trafficWeight: 50, pause: {  } }
        - { newCapacity: "100%", trafficWeight: 100 }
