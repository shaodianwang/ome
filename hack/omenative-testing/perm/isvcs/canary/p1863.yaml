# p1863: canary pd pairing re-target while staging  mode=canary Ne=2 Nd=2 Nr=0 ceil_e=3 ceil_d=3 ceil_r=0 canary=auto proto=pair-v2 proto2=pair-v3 during=canary-staging notimpl=1 issue=1347 cell=canary/Staging/pairingRetarget co=none topo=pd
# reason: parked on the mid-surge protocol re-target — the continuation seam parks the rollout permanently; the case states the intended outcome (converge on the final cohort, nothing stranded)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p1863 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    pairingProtocol: pair-v1
    groups:
        - components: [engine, decoder]
          canary:
            steps:
              - { capacity: "50%", traffic: 50, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
