# p1896: canary engine new target while rolling back re-arms toward it  mode=canary Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 canary=auto rollback=1 during=canary-rollingback verb=rebump terminal=Stable cell=canary/RollingBack/newTarget notimpl=1 issue=1858 co=none topo=engine
# reason: a new target presented while the canary is still rolling back is recorded as the rejected revision at once on the scheduler lane; the cell is undecided and this park records the observed outcome until the request is scoped to its target
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p1896 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            steps:
              - { capacity: "50%", traffic: 50, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
