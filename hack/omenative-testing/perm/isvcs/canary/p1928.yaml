# p1928: canary engine canary pod dies at a pre-step hold and the hold outlasts its return  mode=canary Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 canary=auto during=canary-serving@1 verb=planedit-repin fault=podkill:canary-prehold victim=canary verb2=resume during2=canary-prehold release=promote releaseafter=45 cell=canary/PreHold/capacityDropped,canary/PreHold/capacityReached co=none topo=engine
# The resume is inert at a live hold and only carries the release; the release waits out the pod's return, so the hold is judged after the dip and the recovery.
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p1928 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            steps:
              - { capacity: "25%", traffic: 25, pause: { duration: "20s" } }
              - { capacity: "50%", traffic: 50, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
