# p1916: canary engine resume left on the idle service is consumed  mode=canary Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 canary=auto prearm=resume cell=canary/Idle/resume notimpl=1 issue=1859 co=none topo=engine
# reason: a resume request that addresses no canary is left on the service instead of being consumed at the next arm; parked until the executor consumes unaddressed requests or the grid cell is decided as lingering
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p1916 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            steps:
              - { capacity: "50%", traffic: 50, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
