# p355: canary-analysis engine query error -> inconclusive  mode=canary Ne=12 Nd=0 Nr=0 ceil_e=13 ceil_d=0 ceil_r=0 canary=auto analysis=inconclusive health=pass oninconclusive=rollback failurelimit=1 cell=canary/Serving[A]/sampleInconclusive[queryError] co=none topo=engine
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p355 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-metrics, autoSync: true }
  engine:
    minReplicas: 12
    maxReplicas: 12
    annotations: { ome.io/deploymentMode: "OMENative", perm.test/error-rate: "0.0", perm.test/emit: "true", prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: "/metrics" }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            steps:
              - capacity: "50%"
                traffic: 50
                analysis:
                  interval: "20s"
                  failureLimit: 1
                  initialDelay: "20s"
                  onInconclusive: Rollback
                  metrics:
                    - name: bad
                      query: 'not_a_function('
                      operator: LTE
                      threshold: "0.05"
              - { capacity: "100%", traffic: 100 }
