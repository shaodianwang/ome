# p1899: canary engine group removed while rolling back keeps draining from the pin  mode=canary Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 canary=manual rollback=1 during=canary-rollingback verb=groupremove terminal=RolledBack cell=canary/RollingBack/canaryRemoved co=none topo=engine
# reason: the grid leaves this cell open (marked ?); the case locks the observed outcome: the pinned run finishes its drain to stable and holds at RolledBack
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p1899 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            steps:
              - { capacity: "50%", traffic: 50, pause: {  } }
              - { capacity: "100%", traffic: 100 }
