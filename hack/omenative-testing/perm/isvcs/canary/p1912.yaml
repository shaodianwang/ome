# p1912: canary engine quota lifted while parked keeps the park until a resume  mode=canary Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 canary=auto fault=quota:0 terminal=Stable during=canary-failed verb=quotalift verb2=resume during2=canary-failed cell=canary/Failed/capacityReached,canary/Failed/resume[afterCapacity] co=none topo=engine
# Capacity that lands after the deadline does not un-park the canary: the park holds until the resume, the decided exit.
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p1912 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            readyTimeout: "90s"
            steps:
              - { capacity: "50%", traffic: 50, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
