# p1959: canary router change beside a settled engine unit whose rolled-out record was aged leaves the engine idle and levels the record  mode=canary unit=router preroll=engine fault=agerecord:idle victimcomp=engine Ne=2 Nd=0 Nr=2 ceil_e=2 ceil_d=0 ceil_r=3 canary=auto cell=canary/Idle/newTarget[settledUnitStaleRecord] co=none topo=engine
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p1959 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    # Two canary groups make no cross-group ordering promise; without this
    # admission rejects the shape before the case under test is reached.
    groupOrdering: Concurrent
    groups:
        # As p1958, with the engine's rolled-out record aged back to its first
        # revision before the router's change. A run that resolved the engine's
        # stable from that record would arm its ladder with no work and make a
        # revision with no Instance its rollback target; the engine must stay
        # idle on the revision it stands on, and the record must be brought
        # level with it again.
        - components: [router]
          canary:
            steps:
              - { capacity: "50%", traffic: 50, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
        - components: [engine]
          canary:
            steps:
              - { capacity: "50%", traffic: 50, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
