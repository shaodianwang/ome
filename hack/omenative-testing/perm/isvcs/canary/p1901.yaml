# p1901: canary engine run lost while rolling back still drains to stable  mode=canary Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 canary=manual rollback=1 during=canary-rollingback verb=runlost terminal=RolledBack cell=canary/RollingBack/runLost notimpl=1 issue=1864 co=none topo=engine
# reason: a run lost in the first pass of the rollback leaves the revert behind the plan gate, which refuses the update with no run pinned while nothing re-opens one for a rolling-back unit; the Component keeps rolling toward the rejected revision and RolledBack is never reached
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p1901 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            steps:
              - { capacity: "50%", traffic: 50, pause: {  } }
              - { capacity: "100%", traffic: 100 }
