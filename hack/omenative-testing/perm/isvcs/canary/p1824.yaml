# p1824: canary engine forced promote at a capacity-short gate advances the step and holds the forced final gate without a park until a fixed image lands  mode=canary Ne=4 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 canary=manual bump=engine img=example.com/canary-test/missing:none during=canary-staging@0 verb=promote-force verb2=promote-force during2=canary-staging@1 release=rebump-fix releaseafter=150 nophase=Failed cell=canary/Staging/promoteForce,canary/Staging[final]/promoteForce co=none topo=engine
# reason: the pushed engine revision's image cannot be pulled, so every step stages short of its capacity; a forced promote at the first gate advances the step at once with no canary pod Ready, a second one at the final gate opens it into its drain with the stable revision carrying all the traffic, the forced wait outlives the plan's ready timeout without a CapacityTimeout park, and a fixed image then re-targets the ladder, which completes on the manual promotes
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p1824 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            readyTimeout: "90s"
            steps:
              - { capacity: "50%", traffic: 50, pause: {  } }
              - { capacity: "100%", traffic: 100, pause: {  } }
