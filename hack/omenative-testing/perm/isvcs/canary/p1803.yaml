# p1803: canary pd manual hold with a canary decoder pod dying  mode=canary Ne=2 Nd=2 Nr=0 ceil_e=3 ceil_d=3 ceil_r=0 canary=manual fault=podkill:canary-serving victim=canary victimcomp=decoder cell=canary/Serving[M]/capacityDropped[decoder],canary/Serving/capacityReached,canary/Serving/secondary[decoder] notimpl=1 issue=1829 inv_xfail=A co=none topo=pd
# reason: after the canary decoder pod is killed the InferenceReplica keeps the Instance at Phase=Ready with podCount 0 until the replacement lands, so the status-truth invariant reads a lie the product owns
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p1803 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          canary:
            steps:
              - { capacity: "50%", traffic: 50, pause: {  } }
              - { capacity: "100%", traffic: 100 }
