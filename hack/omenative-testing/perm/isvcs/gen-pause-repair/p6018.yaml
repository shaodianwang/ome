# p6018: [gen] pause after repair crashloop start engine N=4 rp None co rolling push none  Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 pause=true fault=crashloop:old co=rolling topo=engine form=start during=idle victimcomp=engine expect=repaired pauseat=after
# reason: the engine's highest Instance's pod on the settled service is pointed at an image with no shell, so it crashes at every start and is never Ready again; the service is paused after the repair has finished; while paused nothing is rebuilt; after the unpause nothing moves: every Instance keeps serving its running revision and no Instance is left mid-operation; the rollingUpdate group lists the broken Component and changes none of this: a repair of an Instance that serves nothing is admitted without the budget or the gate
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p6018 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  rollout:
    groups:
        - components: [engine]
          rollingUpdate: {}
