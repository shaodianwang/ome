# p6116: [gen] freeze during repair crashloop load pd N=4 rp RecreateInstance co rolling push none  Ne=4 Nd=4 Nr=2 ceil_e=4 ceil_d=4 ceil_r=2 pause=freeze fault=crashloop:old co=rolling topo=pd form=load during=idle victimcomp=engine expect=repaired pauseat=during
# reason: the engine's highest Instance's pod on the settled service has its runner killed every few seconds while it is up, so it dies after Ready and comes back between crashes; the service is frozen while the repair is in flight; while frozen the repair already open finishes, its new pods come up and serve, and nothing else is rebuilt; after the unpause nothing moves: every Instance keeps serving its running revision and no Instance is left mid-operation; the rollingUpdate group lists the broken Component and changes none of this: a repair of an Instance that serves nothing is admitted without the budget or the gate
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p6116 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          rollingUpdate: {}
