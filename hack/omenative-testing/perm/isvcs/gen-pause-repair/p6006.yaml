# p6006: [gen] freeze during repair crashloop start engine N=4 rp None co none push none  Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 pause=freeze fault=crashloop:old co=none topo=engine form=start during=idle victimcomp=engine expect=repaired pauseat=during
# reason: the engine's highest Instance's pod on the settled service is pointed at an image with no shell, so it crashes at every start and is never Ready again; the service is frozen while the repair is in flight; while frozen the repair already open finishes, its new pods come up and serve, and nothing else is rebuilt; after the unpause nothing moves: every Instance keeps serving its running revision and no Instance is left mid-operation
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p6006 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
