# p6029: [gen] pause after repair crashloop start engine N=4 rp RecreateInstance co none push fix  Ne=4 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 pause=true fault=crashloop:old floor_soft=1 co=none topo=engine form=start during=idle victimcomp=engine expect=repaired pauseat=after push=fix
# reason: the engine's highest Instance's pod on the settled service is pointed at an image with no shell, so it crashes at every start and is never Ready again; the service is paused after the repair has finished; while paused nothing is rebuilt; the fix pushed while paused lands on no Instance until the unpause; after the unpause the fix lands on every Instance, the broken one included, within the roll's budget; nothing repairs that Instance again on the revision it was running, and no Instance is left mid-operation; floor waived — the crash itself costs settled capacity
