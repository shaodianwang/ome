# p6173: [gen] freeze before repair crashloop load engine-mn W1 N=2 rp RecreateInstance co rolling push fix  Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 pause=freeze fault=crashloop:old floor_soft=1 co=rolling topo=engine-mn form=load during=idle victimcomp=engine expect=repaired pauseat=before push=fix
# reason: the engine's highest Instance's pod on the settled service has its runner killed every few seconds while it is up, so it dies after Ready and comes back between crashes; the service is frozen before the repair opens; while frozen nothing is rebuilt, the broken Instance included; the fix pushed while paused lands on no Instance until the unpause; after the unpause the fix lands on every Instance, the broken one included, within the roll's budget; nothing repairs that Instance again on the revision it was running, and no Instance is left mid-operation; the rollingUpdate group lists the broken Component and changes none of this: a repair of an Instance that serves nothing is admitted without the budget or the gate; floor waived — the crash itself costs settled capacity
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p6173 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  rollout:
    groups:
        - components: [engine]
          rollingUpdate: {}
