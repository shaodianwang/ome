# p6052: [gen] freeze before repair crashloop load engine N=4 rp RecreateInstance co rolling push none  Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 pause=freeze fault=crashloop:old co=rolling topo=engine form=load during=idle victimcomp=engine expect=repaired pauseat=before
# reason: the engine's highest Instance's pod on the settled service has its runner killed every few seconds while it is up, so it dies after Ready and comes back between crashes; the service is frozen before the repair opens; while frozen nothing is rebuilt, the broken Instance included; after the unpause the repair opens and rebuilds the broken Instance Ready and serving on its running revision, and everything else stays as it was; the rollingUpdate group lists the broken Component and changes none of this: a repair of an Instance that serves nothing is admitted without the budget or the gate
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p6052 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  rollout:
    groups:
        - components: [engine]
          rollingUpdate: {}
