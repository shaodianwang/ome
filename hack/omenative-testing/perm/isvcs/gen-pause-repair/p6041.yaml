# p6041: [gen] pause before repair crashloop load engine N=4 rp RecreateInstance co none push fix  Ne=4 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 pause=true fault=crashloop:old floor_soft=1 co=none topo=engine form=load during=idle victimcomp=engine expect=repaired pauseat=before push=fix
# reason: the engine's highest Instance's pod on the settled service has its runner killed every few seconds while it is up, so it dies after Ready and comes back between crashes; the service is paused before the repair opens; while paused the broken Instance is still repaired on the revision it runs, since a pause holds the fleet and not the repair, and nothing else is rebuilt; the fix pushed while paused lands on no Instance until the unpause; after the unpause the fix lands on every Instance, the broken one included, within the roll's budget; nothing repairs that Instance again on the revision it was running, and no Instance is left mid-operation; floor waived — the crash itself costs settled capacity
