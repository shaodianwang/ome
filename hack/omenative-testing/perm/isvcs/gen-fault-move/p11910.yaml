# p11910: [gen] fault-move quota lifted engine-mn W1+router N=2  mode=migrate Ne=2 Nd=0 Nr=2 ceil_e=3 ceil_d=0 ceil_r=2 fault=quota:0 co=none topo=engine-mn mig=Auto inst=0 expect=fail lift=1
# reason: a move of engine Instance 0 is requested on engine behind a router as gangs of 1 leader + 1 worker with a quota with room for no further pod in place, a gang that moves whole, so the quota keeps its replacement gang from forming: the replacement cannot be admitted, so the move waits on the quota with its row naming the wait and ends Failed within its bound, at its record deadline (the Instance ready timeout), with the source Instance still Ready and serving, the request annotation consumed and its ledger entry terminal (the slot freed); nothing exceeds N+1 alive and nothing settled is taken down to make room; then the quota is lifted and a fresh request moves the Instance (the waiting one, if the lift lands first): it completes, the source drains and the Instance ends whole on its replacement, still within N+1 alive; the router is a negative control (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11910 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { instanceReadyTimeout: "90s", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
