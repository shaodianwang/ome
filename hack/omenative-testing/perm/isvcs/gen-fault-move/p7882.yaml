# p7882: [gen] fault-move imagepull at surge on moved engine+router N=4 rp None  mode=migrate Ne=4 Nd=0 Nr=2 ceil_e=5 ceil_d=0 ceil_r=2 fault=imagepull:old co=none topo=engine victim=moved mig=Auto inst=0 at=surge
# reason: as soon as it appears, before it is Ready, the moved Instance's replacement pod is pointed at an image that cannot be pulled, so the kubelet parks it in ImagePullBackOff and it is never Ready again; the move finishes, or is abandoned with a reason its record carries, within budget and is recorded once (one ledger row, one controller record); the moved Instance ends whole, Ready and serving on one pod set, the engine holds N whole Instances on distinct indices, and nothing exceeds N+1 alive; no pod the fault hit survives unserving: the move or the repair rebuilds it under restart policy None (an Instance that serves nothing is rebuilt by the crash-loop repair once its pod has sat past the stuck-pod grace); a replacement that never comes up is the move's to abandon or to retry, and either way the Instance keeps serving on exactly one pod set; the router keeps its pods
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7882 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
