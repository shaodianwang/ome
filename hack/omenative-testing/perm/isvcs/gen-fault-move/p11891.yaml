# p11891: [gen] fault-move podkill at accept pd-mn W1 N=2 rp RecreateInstance target worker x2  mode=migrate Ne=2 Nd=2 Nr=2 ceil_e=3 ceil_d=2 ceil_r=2 kill=worker fault=podkill:migrating co=none topo=pd-mn mig=Auto inst=0 repeat=2
# reason: a move of engine Instance 0 is requested on prefill/decode as gangs of 1 leader + 1 worker and as soon as the request is recorded the worker of one engine gang is deleted by hand, and again each time its Instance is back and serving, 2 times in all, then left alone; the move completes end to end and is recorded once, the Instance the kill took is rebuilt under restart policy RecreateInstanceOnPodRestart (the whole Instance (leader and workers) is rebuilt), the floor lowered by that one Instance holds, nothing exceeds N+1 alive and no two gangs share an index; across the window the status reports each loss and never counts the short Instance whole, every repair is for an Instance the kill took, the controller creates no more pods than the move and the repairs explain, and after the lift every row is Ready with no operation open and no hold left behind
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11891 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
