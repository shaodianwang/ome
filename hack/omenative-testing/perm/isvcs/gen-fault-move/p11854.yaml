# p11854: [gen] fault-move preempt at surge on moved engine-mn W1+router N=2 lift after-settle  mode=migrate Ne=2 Nd=0 Nr=2 ceil_e=3 ceil_d=0 ceil_r=2 fault=preempt:migrating co=none topo=engine-mn victim=moved mig=Auto inst=0 at=surge lift=after-settle
# reason: a move of engine Instance 0 is requested on engine behind a router as gangs of 1 leader + 1 worker and as the replacement pod appears fillers take the spare CPU of every node, the pending taint closes every node to the case, and a higher-priority filler presses on the replacement's node, so the scheduler preempts it; the replacement waits with reason Unschedulable, nothing settled is taken down to make room and no row reads Failed; once the lift opens the nodes and drops the fillers the replacement is placed and the move completes with the moved Instance whole, Ready and serving; floor and order waived, since the preemption itself takes a pod the budget cannot absorb; each Instance is a gang, placed whole
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11854 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
