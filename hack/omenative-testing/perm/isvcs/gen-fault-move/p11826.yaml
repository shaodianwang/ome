# p11826: [gen] fault-move imagepull healed at accept on sibling engine-mn W1+router N=2  mode=migrate Ne=2 Nd=0 Nr=2 ceil_e=3 ceil_d=0 ceil_r=2 fault=imagepull:old co=none topo=engine-mn victim=sibling victimcomp=router mig=Auto inst=0 at=accept lift=after-settle
# reason: a move of engine Instance 0 is requested on engine behind a router as gangs of 1 leader + 1 worker and as soon as the request is recorded, before the replacement exists, the router's highest Instance's pod is pointed at an image that cannot be pulled, so the kubelet parks it in ImagePullBackOff and it is never Ready again; once the break has bitten for a settle window the harness takes it away again (the killer stops, or the pod is pointed back at the image it ran); the move finishes, or is abandoned with a reason its record carries, within budget and is recorded once (one ledger row, one controller record), the engine holds N whole Instances on distinct indices, nothing exceeds N+1 alive and the floor, lowered by the one Instance the fault took, holds; the move completes (a broken sibling is not the move's to care about) and the broken Instance ends Ready and serving again, healed where it stood or rebuilt by a repair, which is reported, not demanded
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11826 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
