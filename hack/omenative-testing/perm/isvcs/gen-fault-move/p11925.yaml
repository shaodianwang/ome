# p11925: [gen] fault-move node once at accept on moved engine-mn W1+router N=2 rp None  mode=migrate Ne=2 Nd=0 Nr=2 ceil_e=3 ceil_d=0 ceil_r=2 fault=node:notready floor_soft=1 co=none topo=engine-mn victim=moved mig=Auto inst=0 at=accept lift=after-settle
# reason: a move of engine Instance 0 is requested on engine behind a router as gangs of 1 leader + 1 worker and the kubelet of the node under the moved Instance's source pod is stopped as soon as the request is recorded, before the replacement exists; the node reads NotReady and the source serves nothing while the move's replacement surges elsewhere; once that has held for the settle window the kubelet is started again, so a source already on its way out leaves with it and the pods the node ran that the move did not take come back on their own: the move finishes on a live node, or is abandoned with a reason its record carries, within budget and is recorded once; the Instance ends whole, Ready and serving on one pod set, off the stopped node when the move completed, the engine holds N whole Instances on distinct indices and every row settles; the floor is waived: the dead node takes every pod on it, peers and siblings included, until the kubelet is back; nothing is relocated by policy, so the cell reads the same on either lane; each Instance is a gang, moved whole, and its members on live nodes may keep their pods
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11925 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
