# p11848: [gen] fault-move pending taint engine-mn W1+router N=2 lift after-settle  mode=migrate Ne=2 Nd=0 Nr=2 ceil_e=3 ceil_d=0 ceil_r=2 fault=taint:all co=none topo=engine-mn mig=Auto inst=0 lift=after-settle
# reason: a NoSchedule taint on every schedulable node is in place when a move of engine Instance 0 is requested on engine behind a router as gangs of 1 leader + 1 worker; the replacement cannot be placed, so the move waits with the Instance's operation reporting Unschedulable inside its unschedulable grace, nothing settled is taken down to make room, the engine keeps N serving and no row reads Failed; once the taint is lifted the replacement is placed, the move completes with its record Completed, the request consumed and the moved Instance whole, Ready and serving on its new placement; each Instance is a gang, placed whole
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11848 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
