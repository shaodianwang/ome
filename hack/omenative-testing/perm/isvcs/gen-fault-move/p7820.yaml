# p7820: [gen] fault-move node at surge on moved engine N=4 rp None  mode=migrate Ne=4 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 fault=node:notready floor_soft=1 co=none topo=engine victim=moved mig=Auto inst=0 at=surge lift=after-recover needs=forcedelete
# reason: the kubelet of the node under the moved Instance's source pod is stopped as the replacement pod appears, before it is Ready; the node reads NotReady and the source serves nothing; with the force-delete policy the pod names the dead node holds are freed once its unreachable evidence is older than the threshold: the move's replacement, surging elsewhere, takes over and the sweep drains the source, so the move finishes, or is abandoned with a reason its record carries, and either way the Instance ends whole, Ready and serving off the dead node, recorded once; under restart policy None the pod the node held is recreated at the same index on another node, and members on live nodes keep theirs; the floor is waived: the dead node takes every pod on it, peers and siblings included, and the same sweep rebuilds those; then the kubelet is started again
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7820 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    # The eval judges a case well inside the cluster's default pod grace; a pod that ignores its stop signal must not outlive the verdict.
    terminationGracePeriodSeconds: 60
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
