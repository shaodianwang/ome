# p11727: [gen] fault-move readiness persist at accept on peer pd N=4  mode=migrate Ne=4 Nd=4 Nr=2 ceil_e=5 ceil_d=4 ceil_r=2 fault=readiness:old co=none topo=pd form=persist victim=peer mig=Auto inst=0 at=accept
# reason: a move of engine Instance 0 is requested on prefill/decode, single-pod and as soon as the request is recorded, before the replacement exists, the pod of the moved Component's highest other Instance stops passing readiness while it keeps running (the readiness switch set in it); the switch stays set to the end of the case; the move completes (a peer that stops serving is not the move's to care about) and that Instance ends not serving with the status saying so, no repair demanded; the move is recorded once and the engine holds N Instances on distinct indices
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11727 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
