# p11833: [gen] fault-move configkey after-settle at surge on moved engine-mn W1+router N=2  mode=migrate Ne=2 Nd=0 Nr=2 ceil_e=3 ceil_d=0 ceil_r=2 fault=configkey:missing co=none topo=engine-mn victim=moved mig=Auto inst=0 at=surge lift=after-settle
# reason: a move of engine Instance 0 is requested on engine behind a router as gangs of 1 leader + 1 worker and as soon as it appears, before it is Ready, the ConfigMap key the moved Instance's replacement pod reads is removed and its runner restarted, so it waits in CreateContainerConfigError, as does every new pod of the engine while the key is away; once the wait has bitten for a settle window the key is put back; the move finishes, or is abandoned with a reason its record carries, within budget and is recorded once (one ledger row, one controller record), the engine holds N whole Instances on distinct indices, nothing exceeds N+1 alive and the floor, lowered by the one Instance the fault took, holds; the moved Instance ends whole, Ready and serving on one pod set
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11833 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: { runner: { name: "ome-container", env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p11833-config", key: "value" } } }] } }
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p11833-config }
data: { value: "1" }
