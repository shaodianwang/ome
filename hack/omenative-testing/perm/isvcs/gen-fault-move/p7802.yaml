# p7802: [gen] fault-move crashloop:load at accept on moved engine N=4 rp RecreateInstance  mode=migrate Ne=4 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 fault=crashloop:old co=none topo=engine form=load victim=moved mig=Auto inst=0 at=accept
# reason: as soon as the request is recorded, before its replacement exists, the moved Instance's source pod has its runner killed every few seconds while it is up, so it dies after Ready and comes back between crashes; the move finishes, or is abandoned with a reason its record carries, within budget and is recorded once (one ledger row, one controller record); the moved Instance ends whole, Ready and serving on one pod set, the engine holds N whole Instances on distinct indices, and nothing exceeds N+1 alive; no pod the fault hit survives unserving: the move or the repair rebuilds it under restart policy RecreateInstanceOnPodRestart (a runner that dies after Ready re-arms the whole-Instance rebuild)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7802 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
