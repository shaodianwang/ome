# p7874: [gen] fault-move node at surge on moved engine-mn W1 N=2 rp RecreateInstance  mode=migrate Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 fault=node:notready floor_soft=1 co=none topo=engine-mn victim=moved mig=Auto inst=0 at=surge lift=after-recover needs=forcedelete
# reason: the kubelet of the node under the moved Instance's source pod is stopped as the replacement pod appears, before it is Ready; the node reads NotReady and the source serves nothing; with the force-delete policy the pod names the dead node holds are freed once its unreachable evidence is older than the threshold: the move's replacement, surging elsewhere, takes over and the sweep drains the source, so the move finishes, or is abandoned with a reason its record carries, and either way the Instance ends whole, Ready and serving off the dead node, recorded once; under restart policy RecreateInstanceOnPodRestart the lost pod re-arms the whole-Instance rebuild on other nodes; the floor is waived: the dead node takes every pod on it, peers and siblings included, and the same sweep rebuilds those; then the kubelet is started again; the gang's members on live nodes may keep their pods
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7874 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
