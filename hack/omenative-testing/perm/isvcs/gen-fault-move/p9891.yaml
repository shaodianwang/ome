# p9891: [gen] fault-move pending taint engine N=4 lift never  mode=migrate Ne=4 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 fault=taint:all co=none topo=engine mig=Auto inst=0 lift=never
# reason: a NoSchedule taint on every schedulable node is in place when a move of engine Instance 0 is requested on engine alone, single-pod; the replacement cannot be placed, so the move waits with the Instance's operation reporting Unschedulable inside its unschedulable grace, nothing settled is taken down to make room, the engine keeps N serving and no row reads Failed; the taint stays to the end, so the wait holds with its reason across the hold window
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9891 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
