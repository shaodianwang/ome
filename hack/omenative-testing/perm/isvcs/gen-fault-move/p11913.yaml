# p11913: [gen] fault-move plain engine+router N=4  mode=migrate Ne=4 Nd=0 Nr=2 ceil_e=5 ceil_d=0 ceil_r=2 co=none topo=engine mig=Auto inst=0
# reason: a move of engine Instance 0 is requested on engine behind a router, single-pod with nothing in its way: the move completes end to end and is recorded once, the replacement comes up whole elsewhere and the source drains, the Instance ends Ready and serving on its replacement, nothing exceeds N+1 alive, the other Instances keep serving throughout and every row settles; the router is a negative control (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11913 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
