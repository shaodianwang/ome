# p7861: [gen] fault-move crashloop:load at surge on moved engine-mn W1 N=2 rp RecreateInstance  mode=migrate Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 fault=crashloop:old co=none topo=engine-mn form=load victim=moved mig=Auto inst=0 at=surge
# reason: as soon as it appears, before it is Ready, the moved Instance's replacement pod has its runner killed every few seconds while it is up, so it dies after Ready and comes back between crashes; the move finishes, or is abandoned with a reason its record carries, within budget and is recorded once (one ledger row, one controller record); the moved Instance ends whole, Ready and serving on one pod set, the engine holds N whole Instances on distinct indices, and nothing exceeds N+1 alive; no pod the fault hit survives unserving: the move or the repair rebuilds it under restart policy RecreateInstanceOnPodRestart (a runner that dies after Ready re-arms the whole-Instance rebuild); a replacement that never comes up is the move's to abandon or to retry, and either way the Instance keeps serving on exactly one pod set; each Instance is a gang, moved and rebuilt whole
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7861 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
