# p11701: [gen] fault-move stuck held configkey engine N=4 SurgeThenDrain s1  mode=migrate Ne=4 Nd=0 Nr=0 ceil_e=6 ceil_d=0 ceil_r=0 co=none topo=engine mig=Auto inst=0 stuck=held break=configkey
# reason: the engine is pushed onto a revision whose runner carries a ConfigMap key the ConfigMap lacks, so its pods wait in CreateContainerConfigError; the push is left until the retry ladder is spent (a retry block in state Held); then a move of engine Instance 0 is requested on engine alone, single-pod: the move finishes, or is abandoned with a reason its record carries, within budget and is recorded once; the moved Instance ends whole, Ready and serving on one pod set at the index the record names (the revision its replacement runs is reported, not judged); the Instances that served when the request was filed keep serving; the Components neither pushed nor moved keep their pods; and the status keeps reporting the push that has not landed, the hold itself
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11701 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    runner: { env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p11701-config", key: "value" } } }] }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p11701-config }
data: { value: "1" }
