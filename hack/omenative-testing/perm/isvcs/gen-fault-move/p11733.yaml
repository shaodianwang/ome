# p11733: [gen] fault-move pending taint pd N=4 lift never  mode=migrate Ne=4 Nd=4 Nr=2 ceil_e=5 ceil_d=4 ceil_r=2 fault=taint:all co=none topo=pd mig=Auto inst=0 lift=never
# reason: a NoSchedule taint on every schedulable node is in place when a move of engine Instance 0 is requested on prefill/decode, single-pod; the replacement cannot be placed, so the move waits with the Instance's operation reporting Unschedulable inside its unschedulable grace, nothing settled is taken down to make room, the engine keeps N serving and no row reads Failed; the taint stays to the end, so the wait holds with its reason across the hold window
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11733 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
