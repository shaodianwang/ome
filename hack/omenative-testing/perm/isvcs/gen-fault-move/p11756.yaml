# p11756: [gen] fault-move configkey never at accept on moved engine-mn W1 N=2  mode=migrate Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 fault=configkey:missing co=none topo=engine-mn victim=moved mig=Auto inst=0 at=accept lift=never
# reason: a move of engine Instance 0 is requested on engine alone as gangs of 1 leader + 1 worker and as soon as the request is recorded, before its replacement exists, the ConfigMap key the moved Instance's source pod reads is removed and its runner restarted, so it waits in CreateContainerConfigError, as does every new pod of the engine while the key is away; the key stays away to the end of the case; the engine's replacement cannot start either, so the move is abandoned with a reason its record carries, or waits with the status saying why (a row not Ready with its wait or failure recorded); the move is recorded once, nothing exceeds N+1 alive and the broken pod serves nothing
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11756 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: { runner: { name: "ome-container", env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p11756-config", key: "value" } } }] } }
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p11756-config }
data: { value: "1" }
