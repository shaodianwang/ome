# p11717: [gen] fault-move configkey never at surge on moved pd N=4  mode=migrate Ne=4 Nd=4 Nr=2 ceil_e=5 ceil_d=4 ceil_r=2 fault=configkey:missing co=none topo=pd victim=moved mig=Auto inst=0 at=surge lift=never
# reason: a move of engine Instance 0 is requested on prefill/decode, single-pod and as soon as it appears, before it is Ready, the ConfigMap key the moved Instance's replacement pod reads is removed and its runner restarted, so it waits in CreateContainerConfigError, as does every new pod of the engine while the key is away; the key stays away to the end of the case; the engine's replacement cannot start either, so the move is abandoned with a reason its record carries, or waits with the status saying why (a row not Ready with its wait or failure recorded); the move is recorded once, nothing exceeds N+1 alive and the broken pod serves nothing
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11717 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    runner: { env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p11717-config", key: "value" } } }] }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p11717-config }
data: { value: "1" }
