# p11762: [gen] fault-move readiness persist at accept on moved engine-mn W1 N=2  mode=migrate Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 fault=readiness:old co=none topo=engine-mn form=persist victim=moved mig=Auto inst=0 at=accept
# reason: a move of engine Instance 0 is requested on engine alone as gangs of 1 leader + 1 worker and as soon as the request is recorded, before its replacement exists, the moved Instance's source pod stops passing readiness while it keeps running (the readiness switch set in it); the switch stays set to the end of the case; the source is drained by the move anyway, so the move finishes, or is abandoned with a reason its record carries, within budget and is recorded once (one ledger row, one controller record), the engine holds N whole Instances on distinct indices, nothing exceeds N+1 alive and the floor, lowered by the one Instance the fault took, holds and the moved Instance ends whole, Ready and serving on its replacement
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11762 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
