# p11838: [gen] fault-move readiness recover at surge on moved engine-mn W1+router N=2  mode=migrate Ne=2 Nd=0 Nr=2 ceil_e=3 ceil_d=0 ceil_r=2 fault=readiness:old co=none topo=engine-mn form=recover victim=moved mig=Auto inst=0 at=surge
# reason: a move of engine Instance 0 is requested on engine behind a router as gangs of 1 leader + 1 worker and as soon as it appears, before it is Ready, the moved Instance's replacement pod stops passing readiness while it keeps running (the readiness switch set in it); once the drop has bitten for a settle window the switch is lifted; the move finishes, or is abandoned with a reason its record carries, within budget and is recorded once (one ledger row, one controller record), the engine holds N whole Instances on distinct indices, nothing exceeds N+1 alive and the floor, lowered by the one Instance the fault took, holds; the moved Instance ends whole, Ready and serving on one pod set
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11838 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
