# p11878: [gen] fault-move configkey never at accept on sibling pd-mn W1 N=2  mode=migrate Ne=2 Nd=2 Nr=2 ceil_e=3 ceil_d=2 ceil_r=2 fault=configkey:missing co=none topo=pd-mn victim=sibling mig=Auto inst=0 at=accept lift=never
# reason: a move of engine Instance 0 is requested on prefill/decode as gangs of 1 leader + 1 worker and as soon as the request is recorded, before the replacement exists, the ConfigMap key the decoder's highest Instance's pod reads is removed and its runner restarted, so it waits in CreateContainerConfigError, as does every new pod of the decoder while the key is away; the key stays away to the end of the case; the move completes (the decoder's key is not the engine's) and the decoder's Instance ends not serving with the status saying so; the move is recorded once and the engine holds N whole Instances
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11878 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: { runner: { name: "ome-container", env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p11878-config", key: "value" } } }] } }
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p11878-config }
data: { value: "1" }
