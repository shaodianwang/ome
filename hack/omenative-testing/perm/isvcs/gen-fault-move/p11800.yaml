# p11800: [gen] fault-move readiness recover at surge on moved engine+router N=4  mode=migrate Ne=4 Nd=0 Nr=2 ceil_e=5 ceil_d=0 ceil_r=2 fault=readiness:old co=none topo=engine form=recover victim=moved mig=Auto inst=0 at=surge
# reason: a move of engine Instance 0 is requested on engine behind a router, single-pod and as soon as it appears, before it is Ready, the moved Instance's replacement pod stops passing readiness while it keeps running (the readiness switch set in it); once the drop has bitten for a settle window the switch is lifted; the move finishes, or is abandoned with a reason its record carries, within budget and is recorded once (one ledger row, one controller record), the engine holds N whole Instances on distinct indices, nothing exceeds N+1 alive and the floor, lowered by the one Instance the fault took, holds; the moved Instance ends whole, Ready and serving on one pod set
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11800 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
