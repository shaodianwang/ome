# p8233: [gen] budget push engine-mn W1 N=8 RecreatePod u10pct  Ne=8 Nd=0 Nr=0 ceil_e=8 ceil_d=0 ceil_r=0 co=none topo=engine-mn
# reason: plain bump; the engine resolves a percent budget as N x percent rounded up and clamped to N, so maxUnavailable 10% of 8 is 1 (rounded down it would be 0 and the roll could not start); the drain-first roll keeps at least N-1 = 7 Instances ready and never surges above N, each gang Instance replaced or rebuilt whole; every Instance ends on the new revision
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8233 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: "10%" } } }
