# p8272: [gen] budget crashloop start engine-mn W1 N=8 SurgeThenDrain s10pct rp None  Ne=8 Nd=0 Nr=0 ceil_e=9 ceil_d=0 ceil_r=0 fault=crashloop:old floor_soft=1 co=none topo=engine-mn form=start
# reason: one old-revision engine pod is pointed at an image with no shell as the bump lands, so it crashes at every start and is never Ready again; its Instance is off the target from that moment, so the roll owns it: the surge brings the fixed replacement up beside it and drains it, admitted within the same budget as its peers, and no repair is recorded for it after the bump; the engine resolves a percent budget as N x percent rounded up and clamped to N, so maxSurge 10% of 8 is 1 (rounded down it would be 0 and the roll could not start); the peak stays at or under N+1 = 9; every Instance ends on the new revision; floor waived — the crash itself costs settled capacity for the length of the roll
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8272 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: "10%", maxUnavailable: 0 } } }
