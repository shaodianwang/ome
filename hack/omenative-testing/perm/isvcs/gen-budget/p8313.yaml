# p8313: [gen] budget canary engine-mn W1 N=4 RecreatePod u50pct  mode=canary Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 co=none topo=engine-mn canary=auto
# reason: a 4-step auto canary (10/30/60/100 percent capacity and traffic, timed soaks); the engine resolves a percent budget as N x percent rounded up and clamped to N, so maxUnavailable 50% of 4 is 2; each capacity step rebuilds its Instances drain-first at most 2 at a time, so at least N-2 = 2 stay ready and nothing surges above N; the ladder walks every step to Stable with every Instance on the canary revision
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8313 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: "50%" } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            steps:
              - { capacity: "10%", traffic: 10, pause: { duration: "20s" } }
              - { capacity: "30%", traffic: 30, pause: { duration: "20s" } }
              - { capacity: "60%", traffic: 60, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
