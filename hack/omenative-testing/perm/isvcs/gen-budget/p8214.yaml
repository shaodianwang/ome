# p8214: [gen] budget push pd N=4 SurgeThenDrain s50pct  Ne=4 Nd=4 Nr=2 ceil_e=6 ceil_d=4 ceil_r=2 co=none topo=pd
# reason: plain bump; the engine resolves a percent budget as N x percent rounded up and clamped to N, so maxSurge 50% of 4 is 2; the surge keeps the peak at or under N+2 = 6 Instances and never drops below N ready; every Instance ends on the new revision; decoder and router are negative controls (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8214 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: "50%", maxUnavailable: 0 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
