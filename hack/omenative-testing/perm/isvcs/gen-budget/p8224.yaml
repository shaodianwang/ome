# p8224: [gen] budget push engine-mn W1 N=4 SurgeThenDrain s10pct  Ne=4 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 co=none topo=engine-mn
# reason: plain bump; the engine resolves a percent budget as N x percent rounded up and clamped to N, so maxSurge 10% of 4 is 1 (rounded down it would be 0 and the roll could not start); the surge keeps the peak at or under N+1 = 5 Instances and never drops below N ready, each gang Instance replaced or rebuilt whole; every Instance ends on the new revision
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8224 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: "10%", maxUnavailable: 0 } } }
