# p8299: [gen] budget canary pd N=4 RecreatePod u10pct  mode=canary Ne=4 Nd=4 Nr=2 ceil_e=4 ceil_d=5 ceil_r=3 co=none topo=pd canary=auto
# reason: a 4-step auto canary (10/30/60/100 percent capacity and traffic, timed soaks); the engine resolves a percent budget as N x percent rounded up and clamped to N, so maxUnavailable 10% of 4 is 1 (rounded down it would be 0 and the roll could not start); each capacity step rebuilds its Instances drain-first at most 1 at a time, so at least N-1 = 3 stay ready and nothing surges above N; the ladder walks every step to Stable with every Instance on the canary revision; decoder and router are group members on their canonical surge budget
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8299 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: "10%" } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder, router]
          canary:
            steps:
              - { capacity: "10%", traffic: 10, pause: { duration: "20s" } }
              - { capacity: "30%", traffic: 30, pause: { duration: "20s" } }
              - { capacity: "60%", traffic: 60, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
