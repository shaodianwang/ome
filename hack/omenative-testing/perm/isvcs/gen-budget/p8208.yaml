# p8208: [gen] budget push engine N=8 SurgeThenDrain s50pct  Ne=8 Nd=0 Nr=0 ceil_e=12 ceil_d=0 ceil_r=0 co=none topo=engine
# reason: plain bump; the engine resolves a percent budget as N x percent rounded up and clamped to N, so maxSurge 50% of 8 is 4; the surge keeps the peak at or under N+4 = 12 Instances and never drops below N ready; every Instance ends on the new revision
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8208 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: "50%", maxUnavailable: 0 } } }
