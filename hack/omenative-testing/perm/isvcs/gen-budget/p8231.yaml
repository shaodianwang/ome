# p8231: [gen] budget push engine-mn W1 N=8 SurgeThenDrain s25pct  Ne=8 Nd=0 Nr=0 ceil_e=10 ceil_d=0 ceil_r=0 co=none topo=engine-mn
# reason: plain bump; the engine resolves a percent budget as N x percent rounded up and clamped to N, so maxSurge 25% of 8 is 2; the surge keeps the peak at or under N+2 = 10 Instances and never drops below N ready, each gang Instance replaced or rebuilt whole; every Instance ends on the new revision
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8231 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: "25%", maxUnavailable: 0 } } }
