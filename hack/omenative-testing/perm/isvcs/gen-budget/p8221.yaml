# p8221: [gen] budget push pd N=8 RecreatePod u10pct  Ne=8 Nd=8 Nr=2 ceil_e=8 ceil_d=8 ceil_r=2 co=none topo=pd
# reason: plain bump; the engine resolves a percent budget as N x percent rounded up and clamped to N, so maxUnavailable 10% of 8 is 1 (rounded down it would be 0 and the roll could not start); the drain-first roll keeps at least N-1 = 7 Instances ready and never surges above N; every Instance ends on the new revision; decoder and router are negative controls (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8221 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: "10%" } } }
  decoder:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
