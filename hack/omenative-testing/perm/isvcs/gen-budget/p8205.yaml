# p8205: [gen] budget push engine N=4 RecreatePod u50pct  Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 co=none topo=engine
# reason: plain bump; the engine resolves a percent budget as N x percent rounded up and clamped to N, so maxUnavailable 50% of 4 is 2; the drain-first roll keeps at least N-2 = 2 Instances ready and never surges above N; every Instance ends on the new revision
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8205 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: "50%" } } }
