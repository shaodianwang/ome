# p8292: [gen] budget canary engine N=8 SurgeThenDrain s50pct  mode=canary Ne=8 Nd=0 Nr=0 ceil_e=12 ceil_d=0 ceil_r=0 co=none topo=engine canary=auto
# reason: a 4-step auto canary (10/30/60/100 percent capacity and traffic, timed soaks); the engine resolves a percent budget as N x percent rounded up and clamped to N, so maxSurge 50% of 8 is 4; each capacity step builds its Instances at most 4 at a time, so the peak stays at or under N+4 = 12 and the fleet never drops below N ready; the ladder walks every step to Stable with every Instance on the canary revision
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8292 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: "50%", maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            steps:
              - { capacity: "10%", traffic: 10, pause: { duration: "20s" } }
              - { capacity: "30%", traffic: 30, pause: { duration: "20s" } }
              - { capacity: "60%", traffic: 60, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
