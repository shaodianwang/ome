# p8344: [gen] inplaceonly crashloop start env engine N=4 rp RecreateInstance  Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 fault=crashloop:old floor_soft=1 co=none topo=engine form=start edit=env expect=held
# reason: one old-revision engine pod is pointed at an image with no shell as the bump lands, so it crashes at every start and is never Ready again as a push that changes the runner env lands, a diff InPlaceOnly refuses: the roll owns the broken Instance from the bump and a repair yields to the roll, so under restart policy RecreateInstanceOnPodRestart the Instance stays broken through the hold while the healthy Instances keep serving and an InPlaceUpdateNotPossible event says why; the corrective push drops the env override and lands in place on every Instance, the broken one included (its image is patched back, same UID), with no repair recorded for it after the bump; floor waived — the crash itself costs settled capacity until the corrective push lands
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8344 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "InPlaceOnly", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
