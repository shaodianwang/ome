# p8373: [gen] inplaceonly crashloop start image engine-mn W1 N=4 rp RecreateInstance  Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 fault=crashloop:old floor_soft=1 co=none topo=engine-mn img=${OME_EVAL_NGINX_ALT_IMAGE} form=start edit=image
# reason: one old-revision engine pod is pointed at an image with no shell as the bump lands, so it crashes at every start and is never Ready again; its Instance is off the target from that moment, so the roll owns it: a gang runs every in-place strategy as a whole-gang recreate (eligibility reads the leader's spec alone, and a patched leader beside unpatched workers would split the gang), so InPlaceOnly refuses nothing on it, so the crashing gang is rebuilt whole at the new revision, admitted within maxUnavailable 1, and no repair is recorded for it after the bump under restart policy RecreateInstanceOnPodRestart; every Instance ends on the new revision; floor waived — the crash itself costs settled capacity for the length of the roll
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8373 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "InPlaceOnly", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
