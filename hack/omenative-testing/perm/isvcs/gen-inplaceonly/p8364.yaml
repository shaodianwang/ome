# p8364: [gen] inplaceonly image engine-mn W1 N=4 rp RecreateInstance  Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 co=none topo=engine-mn img=${OME_EVAL_NGINX_ALT_IMAGE} edit=image
# reason: the push changes the runner image; a gang runs every in-place strategy as a whole-gang recreate (eligibility reads the leader's spec alone, and a patched leader beside unpatched workers would split the gang), so InPlaceOnly refuses nothing on it: each gang is rebuilt at the new revision within maxUnavailable 1 (floor N-1), never surging above N, UIDs rotate; restart policy RecreateInstanceOnPodRestart plays no part, nothing restarts; every Instance ends on the new revision
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8364 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "InPlaceOnly", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
