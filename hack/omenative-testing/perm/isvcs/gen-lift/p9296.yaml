# p9296: [gen] readiness new lifted pd-mn W1 N=2 SurgeThenDrain s1 rp None  Ne=2 Nd=2 Nr=2 ceil_e=3 ceil_d=2 ceil_r=2 restart=None fault=readiness:new co=none topo=pd-mn form=recover
# reason: the push's first engine leader pod, the surge Instance's, gets the fixture's readiness switch file while its runner is still starting, before it was ever Ready, so it runs and does not pass readiness; the surge waits (nothing drains; floor N) and nothing rebuilds or restarts the pod, under either restart policy, because readiness is the runtime's own out-of-rotation signal and not a failure; once the pod has run the bite window without passing and the drop has held for the settle window the switch is lifted and the same pod passes readiness; the roll then lands the new revision on every Instance within its budget with no hold behind it: no row reads Failed, nothing is escalated or held, no repair is recorded, the pod keeps its identity and serves on the new revision, every row settles; decoder and router stay as they were
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9296 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
