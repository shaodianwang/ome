# p9311: [gen] imagepull new lifted engine N=4 SurgeThenDrain s1 rp RecreateInstance  Ne=4 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 restart=RecreateInstance fault=imagepull:new co=none topo=engine lift=after-settle
# reason: the push's first engine pod, the surge Instance's, is pointed at an image that cannot be pulled while its runner is still starting, before it was ever Ready, so the kubelet stops the container and parks the pod in ImagePullBackOff; the surge waits (nothing drains; floor N); once the pull failure has held for the settle window the pod is pointed back at the image it ran and the kubelet starts the container; the roll then lands the new revision on every Instance within its budget with no hold behind it: no row reads Failed, nothing is escalated or held, the Instance serves on the new revision, every row settles; RecreateInstanceOnPodRestart may read the kubelet's restart of the container as a runner restart, so one rebuild is reported, never required, never twice
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9311 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
