# p9309: [gen] imagepull lifted idle pd-mn W1 N=2 rp RecreateInstance  Ne=2 Nd=2 Nr=2 ceil_e=2 ceil_d=2 ceil_r=2 restart=RecreateInstance fault=imagepull:old co=none topo=pd-mn during=idle lift=after-settle expect=heals
# reason: the leader pod of the engine's highest Instance is pointed at an image that cannot be pulled, so the kubelet stops its container and parks it in ImagePullBackOff; once that has held for the settle window the image is pointed back; the kubelet's restart of the container is the runner restart the policy reads, so a rebuild may follow the return of the image, or the container simply starts again; either way the Instance is Ready and serving again on its running revision within the budget, with no new revision and no reset mailbox, and no Component exceeds N alive; decoder and router stay as they were
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9309 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
