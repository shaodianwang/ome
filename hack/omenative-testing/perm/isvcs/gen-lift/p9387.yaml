# p9387: [gen] imagepull new kept pd-mn W1 N=2 SurgeThenDrain s1 rp None  Ne=2 Nd=2 Nr=2 ceil_e=3 ceil_d=2 ceil_r=2 restart=None fault=imagepull:new co=none topo=pd-mn lift=never
# reason: the push points the engine runner at an image that cannot be pulled, so the pushed revision's first engine leader pod, the surge Instance's pod (nothing drains; floor N), is parked in ImagePullBackOff from its creation and is never Ready; the image is not put back: the roll holds at the Instance ready timeout with the new Instance Failed and the reason recorded (a RetryHeld or InstanceFailed event), the old revision keeps serving at the floor and the broken revision never serves; a fix push that drops the image then lands on every Instance with nothing of the broken revision left; decoder and router stay as they were
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9387 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", instanceReadyTimeout: "90s", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
