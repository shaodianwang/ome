# p9265: [gen] configkey new lifted engine N=4 RecreatePod u1 rp None  Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 restart=None fault=configkey:new co=none topo=engine lift=after-settle
# reason: the push points the engine runner at a ConfigMap key the ConfigMap lacks, so the pushed revision's first engine pod, the first drained Instance's replacement (floor N-1), waits in CreateContainerConfigError from its creation and is never Ready; once that wait has held for the settle window the key is added, the kubelet's own retry starts the container and the Instance comes up on its own; the RecreatePod roll lands the new revision on every Instance within its budget with no hold behind it: no row reads Failed, nothing is escalated or held, the Instance serves on the new revision, a repair is reported if one ran and never twice, every row settles
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9265 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    runner: { env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p9265-config", key: "value" } } }] }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p9265-config }
data: { value: "1" }
