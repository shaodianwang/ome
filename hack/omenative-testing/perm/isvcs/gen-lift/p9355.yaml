# p9355: [gen] configkey lifted fix push pd N=4 SurgeThenDrain s1 rp None  Ne=4 Nd=4 Nr=2 ceil_e=5 ceil_d=4 ceil_r=2 restart=None fault=configkey:missing floor_soft=1 co=none topo=pd during=idle lift=after-settle push=fix
# reason: the engine runner's ConfigMap key is removed on the highest Instance's pod and the runner restarted, so its next start waits in CreateContainerConfigError; the crash-loop repair opens as soon as the wait is seen and rebuilds the pod, which waits on the same key; once the wait has shown for the settle window the operator pushes the fix with no pause around it: a bump that gives the engine runner a literal value in place of the key it cannot read, so no pod of the new revision waits on the ConfigMap; the key is put back as the fix lands, so the broken pod may start again on its running revision while the roll is already replacing it, and the roll still owns it; the SurgeThenDrain roll lands the new revision on every engine Instance within its budget, the broken Instance Ready and serving on the new revision and never the last to land the fix, since its capacity is already lost; no repair is recorded for it after the push, because its revision stopped being the target at the bump and the roll owns it; every row settles with no operation open and no hold is left behind; the floor is reported, not judged, for the one Instance the break took; decoder and router stay as they were
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9355 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    runner: { env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p9355-config", key: "value" } } }] }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p9355-config }
data: { value: "1" }
