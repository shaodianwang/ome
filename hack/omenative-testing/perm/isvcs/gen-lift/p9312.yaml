# p9312: [gen] imagepull new lifted engine-mn W1 N=2 SurgeThenDrain s1 rp None  Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 restart=None fault=imagepull:new co=none topo=engine-mn lift=after-settle
# reason: the push's first engine leader pod, the surge Instance's, is pointed at an image that cannot be pulled while its runner is still starting, before it was ever Ready, so the kubelet stops the container and parks the pod in ImagePullBackOff; the surge waits (nothing drains; floor N); once the pull failure has held for the settle window the pod is pointed back at the image it ran and the kubelet starts the container; the roll then lands the new revision on every Instance within its budget with no hold behind it: no row reads Failed, nothing is escalated or held, the Instance serves on the new revision, every row settles; restart policy None reads nothing into the kubelet's restart of the container, so no repair is recorded
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9312 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
