# p9384: [gen] imagepull new kept engine+router N=4 SurgeThenDrain s1 rp None  Ne=4 Nd=0 Nr=2 ceil_e=5 ceil_d=0 ceil_r=2 restart=None fault=imagepull:new co=none topo=engine lift=never
# reason: the push points the engine runner at an image that cannot be pulled, so the pushed revision's first engine pod, the surge Instance's pod (nothing drains; floor N), is parked in ImagePullBackOff from its creation and is never Ready; the image is not put back: the roll holds at the Instance ready timeout with the new Instance Failed and the reason recorded (a RetryHeld or InstanceFailed event), the old revision keeps serving at the floor and the broken revision never serves; a fix push that drops the image then lands on every Instance with nothing of the broken revision left; the router stays as it was
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9384 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", instanceReadyTimeout: "90s", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
