# p9379: [gen] imagepull lifted push pd N=4 SurgeThenDrain s1 rp RecreateInstance  Ne=4 Nd=4 Nr=2 ceil_e=5 ceil_d=4 ceil_r=2 restart=RecreateInstance fault=imagepull:old floor_soft=1 co=none topo=pd lift=after-settle
# reason: the pod of the engine's highest Instance is pointed at an image that cannot be pulled as the bump lands, so the kubelet stops its container and parks it in ImagePullBackOff while the roll starts; once the pull failure has held for the settle window the pod is pointed back at the image it ran, unless the roll has already replaced it; the Instance was off the target from the bump, so the roll owns it under restart policy RecreateInstanceOnPodRestart: it ends on the new revision serving with no repair recorded for it after the bump, the SurgeThenDrain roll converges within its budget with every engine Instance on the new revision, and the floor is reported, not judged, for the one Instance the break took; decoder and router stay as they were
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9379 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
