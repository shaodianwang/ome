# p9280: [gen] configkey new lifted pd N=4 SurgeThenDrain s1 rp None  Ne=4 Nd=4 Nr=2 ceil_e=5 ceil_d=4 ceil_r=2 restart=None fault=configkey:new co=none topo=pd lift=after-settle
# reason: the push points the engine runner at a ConfigMap key the ConfigMap lacks, so the pushed revision's first engine pod, the surge Instance's pod (nothing drains; floor N), waits in CreateContainerConfigError from its creation and is never Ready; once that wait has held for the settle window the key is added, the kubelet's own retry starts the container and the Instance comes up on its own; the SurgeThenDrain roll lands the new revision on every Instance within its budget with no hold behind it: no row reads Failed, nothing is escalated or held, the Instance serves on the new revision, a repair is reported if one ran and never twice, every row settles; decoder and router stay as they were
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9280 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    runner: { env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p9280-config", key: "value" } } }] }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p9280-config }
data: { value: "1" }
