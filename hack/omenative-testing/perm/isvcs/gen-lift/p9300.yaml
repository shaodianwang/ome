# p9300: [gen] imagepull lifted idle engine-mn W1 N=2 rp None  Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 restart=None fault=imagepull:old co=none topo=engine-mn during=idle lift=after-settle expect=heals
# reason: the leader pod of the engine's highest Instance is pointed at an image that cannot be pulled, so the kubelet stops its container and parks it in ImagePullBackOff; the stuck-pod grace counts from the pod's creation and a long-serving pod is past it, so the crash-loop repair rebuilds the Instance under either restart policy as soon as the wait is seen, usually before the settle window ends, with nothing left to lift; where the wait does hold for the settle window the image is pointed back and the kubelet starts the container again; either way the Instance is Ready and serving again on its running revision within the budget, with no new revision and no reset mailbox, and no Component exceeds N alive
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9300 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
