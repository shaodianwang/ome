# p7304: [gen] tight quota completes engine-mn W1 N=2 RecreatePod  Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 fault=quota:1 co=none topo=engine-mn
# reason: the quota admits 1 more pod(s), one short of a 2-pod gang; the first gang drains within its own budget and its 2-pod gang replacement is admitted once the old pods are gone (at most a brief quota refusal while they terminate): the roll completes with no wait, at the floor N-1, and no second gang drains
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7304 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
