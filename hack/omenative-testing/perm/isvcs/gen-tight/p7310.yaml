# p7310: [gen] tight cordon never engine-mn W2 N=2 SurgeThenDrain  Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 fault=cordon:all co=none topo=engine-mn lift=never
# reason: every schedulable node is cordoned, so the surge 3-pod gang cannot be placed: the roll waits with the Instance's operation naming the capacity, no running gang drains (floor N) and every running gang keeps serving; the wait holds across the window with no churn and nothing torn down; the case ends with the squeeze in place
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7310 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 2 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
