# p7322: [gen] tight quota never pd-mn W2 N=2 SurgeThenDrain  Ne=2 Nd=2 Nr=2 ceil_e=3 ceil_d=2 ceil_r=2 fault=quota:2 co=none topo=pd-mn lift=never
# reason: the quota admits 2 more pod(s), one short of a 3-pod gang, so the surge 3-pod gang cannot be placed: the roll waits with the Instance's operation naming the capacity, no running gang drains (floor N) and every running gang keeps serving; the wait holds across the window with no churn and nothing torn down; the case ends with the squeeze in place
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7322 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 2 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 2 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
