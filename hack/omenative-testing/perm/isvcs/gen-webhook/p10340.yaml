# p10340: [gen] webhook scaledown engine+router N=4 lift after-hold  mode=scaledown Ne=4 Nd=0 Nr=2 ceil_e=4 ceil_d=0 ceil_r=2 fault=webhook:settling co=none topo=engine to_e=3 lift=after-hold
# reason: the engine is scaled from N to N-1 on engine behind a router, single-pod, then the admission webhook is made unreachable as the scale-down lands: the InferenceReplica spec write that shrinks the Component is refused by admission, so the scale must wait and the status must say why in the webhook's own words (an event on the ISVC or an InferenceReplica, a row failure or wait, a hold or a condition) while no Instance below the target is taken down, the survivors keep serving, the rows follow every change of the pods in rotation within the configured requeues, and the manager's events stay bounded; the manager's reconciles stay bounded; the webhooks are pointed back once the status has said why (or the reason wait has run out), and the scale completes with the engine at N-1, the survivors on their own pods, nothing created, and the rows settled with no hold, retry block or Failed row left; the router is a negative control (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10340 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
