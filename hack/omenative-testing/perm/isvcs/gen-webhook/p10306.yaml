# p10306: [gen] webhook delete engine N=4 lift after-hold  mode=recreate Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 fault=webhook:settling co=none topo=engine lift=after-hold
# reason: the service is deleted on engine alone, single-pod, then the admission webhook is made unreachable as the delete lands: the InferenceService update that releases its finalizer is refused by admission, so the delete must wait (or finish on the writes admission does not gate) and the status must say why in the webhook's own words (an event on the ISVC or an InferenceReplica, a row failure or wait, a hold or a condition) while the rows follow the pods on their way out and the manager's events stay bounded; the manager's reconciles stay bounded; the webhooks are pointed back once the status has said why (or the reason wait has run out), and the delete completes with no pod, InferenceReplica, Service or InferenceService left, and the same manifest re-applied under the same name comes up whole on fresh pods
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10306 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
