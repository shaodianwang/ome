# p10304: [gen] webhook move engine N=4 lift after-hold  mode=migrate Ne=4 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 fault=webhook:migrating co=none topo=engine mig=Auto inst=0 at=accept lift=after-hold
# reason: one engine Instance is asked to move on engine alone, single-pod, then the admission webhook is made unreachable as soon as the move's request is recorded, the whole move still ahead: the replacement pod the move creates is refused by admission, so the move must wait and the status must say why in the webhook's own words (an event on the ISVC or an InferenceReplica, a row failure or wait, a hold or a condition) while the N Instances keep serving (the source until its replacement serves), the rows follow every change of the pods in rotation within the configured requeues, and the manager's events stay bounded; the manager's reconciles stay bounded; the webhooks are pointed back once the status has said why (or the reason wait has run out), and the move completes: its ledger row reads Completed once, the request annotation is consumed, the moved Instance ends whole, Ready and serving off its source pod and created once, the engine holds N whole Instances, and the rows settle with no hold, retry block or Failed row left
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10304 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
