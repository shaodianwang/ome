# p8901: [gen] webhook steady engine N=4 lift after-window  Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 fault=webhook:idle co=none topo=engine during=idle lift=after-window
# reason: the admission webhook is made unreachable on the settled service (engine alone, single-pod): its webhooks are pointed at a Service that does not exist, so every write the webhooks intercept is refused while status writes pass; nothing may move: no pod created or taken down, every Instance keeps serving at N, the rows follow every change of the pods in rotation within the configured requeues and the manager's events stay bounded; the manager's reconciles stay bounded; the webhook stays unreachable across the hold window, then its webhooks are pointed back, admission must answer again and the rows still read Ready with no operation open and no hold, retry block or Failed row left
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8901 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
