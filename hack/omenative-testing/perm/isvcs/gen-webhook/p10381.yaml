# p10381: [gen] webhook scaledown pd N=4 lift after-window  mode=scaledown Ne=4 Nd=4 Nr=2 ceil_e=4 ceil_d=4 ceil_r=2 fault=webhook:settling co=none topo=pd to_e=3 lift=after-window
# reason: the engine is scaled from N to N-1 on prefill/decode, single-pod, then the admission webhook is made unreachable as the scale-down lands: the InferenceReplica spec write that shrinks the Component is refused by admission, so the scale must wait and the status must say why in the webhook's own words (an event on the ISVC or an InferenceReplica, a row failure or wait, a hold or a condition) while no Instance below the target is taken down, the survivors keep serving, the rows follow every change of the pods in rotation within the configured requeues, and the manager's events stay bounded; the manager's reconciles stay bounded; the webhook stays unreachable across the hold window, then its webhooks are pointed back, and the scale completes with the engine at N-1, the survivors on their own pods, nothing created, and the rows settled with no hold, retry block or Failed row left; decoder and router are negative controls (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10381 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
