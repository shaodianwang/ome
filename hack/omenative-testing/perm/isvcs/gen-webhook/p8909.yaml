# p8909: [gen] webhook steady engine-mn W1 N=2 lift after-window  Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 fault=webhook:idle co=none topo=engine-mn during=idle lift=after-window
# reason: the admission webhook is made unreachable on the settled service (engine alone as gangs of 1 leader + 1 worker): its Service is pointed at no pod, so every write the webhooks intercept is refused while status writes pass; nothing may move: no pod created or taken down, every Instance keeps serving at N, the rows follow every change of the pods in rotation within the configured requeues and the manager's events stay bounded; the manager's reconciles stay bounded; the webhook stays unreachable across the hold window, then its Service is pointed back, it must answer again and the rows still read Ready with no operation open and no hold, retry block or Failed row left
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8909 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
