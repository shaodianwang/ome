# p10390: [gen] webhook push rotating pd-mn W1 N=2 RecreatePod u1 lift after-hold  Ne=2 Nd=2 Nr=2 ceil_e=2 ceil_d=2 ceil_r=2 fault=webhook:rotating co=none topo=pd-mn lift=after-hold
# reason: the bump lands under RecreatePod on prefill/decode as gangs of 1 leader + 1 worker, then the admission webhook is made unreachable at the first pod of the new revision: the next pod the roll creates is refused by admission, so the roll must wait and the status must say why in the webhook's own words (an event on the ISVC or an InferenceReplica, a row failure or wait, a hold or a condition) while the capacity floor (N minus maxUnavailable) holds, the rows follow every change of the pods in rotation within the configured requeues, and the manager's events stay bounded; the manager's reconciles stay bounded; the webhooks are pointed back once the status has said why (or the reason wait has run out), and the roll completes with every Instance on the new revision, each pod slot created once (more is a double apply), the rows settled with no hold, retry block or Failed row left; decoder and router are negative controls (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10390 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
