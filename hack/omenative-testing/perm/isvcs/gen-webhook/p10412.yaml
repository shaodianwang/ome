# p10412: [gen] webhook canary at soak engine router N=8 after-hold  mode=canary Ne=8 Nd=0 Nr=2 ceil_e=9 ceil_d=0 ceil_r=2 fault=webhook:canary-serving@1 co=none topo=engine canary=auto nophase=Failed cell=canary/Serving[soak]/webhookDown[afterHold] lift=after-hold
# reason: the admission webhook is made unreachable while the second step of the engine unit's ladder soaks its split on engine+router single (8 Instances): its webhooks are pointed at a Service that does not exist, so every write the webhooks intercept is refused while status writes pass; the next pod the ladder creates is refused by admission, so the step must wait and the status must say why in the webhook's own words (an event on the ISVC or an InferenceReplica, a row failure or wait, a hold or a condition) while the stable side keeps serving and the rows follow the pods in rotation; the manager's reconciles stay bounded; the webhooks are pointed back once the status has said why (or the reason wait has run out), admission must answer again, and the ladder walks every step to Stable with the step index never going back, each pod slot of the unit created once, every Instance on the canary revision serving, the rows following the pods in rotation within the configured requeues, the manager's events bounded and nothing left held
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10412 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            steps:
              - { capacity: "10%", traffic: 10, pause: { duration: "20s" } }
              - { capacity: "30%", traffic: 30, pause: { duration: "20s" } }
              - { capacity: "60%", traffic: 60, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
