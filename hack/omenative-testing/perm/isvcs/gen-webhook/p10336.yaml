# p10336: [gen] webhook rollback engine+router N=4 lift after-hold  Ne=4 Nd=0 Nr=2 ceil_e=5 ceil_d=0 ceil_r=2 fault=webhook:settling co=none topo=engine during=rotating rollback=1 lift=after-hold
# reason: the engine is bumped and the starting revision re-applied at the first pod of the new revision on engine behind a router, single-pod, then the admission webhook is made unreachable as the rollback lands: the pods the rollback creates to bring its Instances back are refused by admission, so the rollback must wait and the status must say why in the webhook's own words (an event on the ISVC or an InferenceReplica, a row failure or wait, a hold or a condition) while the capacity floor (N minus maxUnavailable) holds, the rows follow every change of the pods in rotation within the configured requeues, and the manager's events stay bounded; the manager's reconciles stay bounded; the webhooks are pointed back once the status has said why (or the reason wait has run out), and the rollback completes with every Instance back on the starting revision and serving, no pod of the new revision left, each pod slot created at most once in each direction, the rows settled with no hold, retry block or Failed row left; the router is a negative control (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10336 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
