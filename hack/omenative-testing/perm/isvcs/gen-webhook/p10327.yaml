# p10327: [gen] webhook delete engine-mn W1 N=2 lift after-window  mode=recreate Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 fault=webhook:settling co=none topo=engine-mn lift=after-window
# reason: the service is deleted on engine alone as gangs of 1 leader + 1 worker, then the admission webhook is made unreachable as the delete lands: the InferenceService update that releases its finalizer is refused by admission, so the delete must wait (or finish on the writes admission does not gate) and the status must say why in the webhook's own words (an event on the ISVC or an InferenceReplica, a row failure or wait, a hold or a condition) while the rows follow the pods on their way out and the manager's events stay bounded; the manager's reconciles stay bounded; the webhook stays unreachable across the hold window, then its webhooks are pointed back, and the delete completes with no pod, InferenceReplica, Service or InferenceService left, and the same manifest re-applied under the same name comes up whole on fresh pods
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10327 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
