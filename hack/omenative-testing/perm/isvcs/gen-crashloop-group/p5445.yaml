# p5445: [gen] crashloop load group seq pd-mn W1 N=3 RecreatePod u1 rp None  Ne=3 Nd=3 Nr=2 ceil_e=3 ceil_d=3 ceil_r=2 fault=crashloop:old floor_soft=1 co=seq topo=pd-mn form=load fixfirst=1
# reason: one old-revision engine pod has its runner killed every few seconds while it is up, so it dies after Ready and comes back between crashes; the bump is the fix and lands on every Instance within the group's own rule: Sequential rolls the engine to completion before the decoder starts (the ordering check), and inside the engine the broken Instance lands first or at least never last; three gangs, because the drain-first roll has taken its first gang before the break lands and the dark gang then waits for that one slot: with two gangs the only peer precedes the broken gang by construction, with three the dark gang must be rebuilt ahead of the peer still waiting; the healthy peers never leave rotation beyond the budget, no repair is recorded for the broken Instance, and it ends on the new revision serving; floor waived — the crash itself costs settled capacity for the length of the roll
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p5445 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          blueGreen: {}
        - components: [decoder]
          blueGreen: {}
