# p5419: [gen] crashloop load group seq pd N=4 SurgeThenDrain s1 rp RecreateInstance  Ne=4 Nd=4 Nr=2 ceil_e=5 ceil_d=5 ceil_r=2 fault=crashloop:old floor_soft=1 co=seq topo=pd form=load fixfirst=1
# reason: one old-revision engine pod has its runner killed every few seconds while it is up, so it dies after Ready and comes back between crashes; the bump is the fix and lands on every Instance within the group's own rule: Sequential rolls the engine to completion before the decoder starts (the ordering check), and inside the engine the broken Instance lands first or at least never last; the healthy peers never leave rotation beyond the budget, no repair is recorded for the broken Instance, and it ends on the new revision serving; floor waived — the crash itself costs settled capacity for the length of the roll
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p5419 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          blueGreen: {}
        - components: [decoder]
          blueGreen: {}
