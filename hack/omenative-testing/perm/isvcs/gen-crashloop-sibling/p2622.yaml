# p2622: [gen] crashloop sibling start pd-mn W1 N=2 co rolling rp RecreateInstance  Ne=2 Nd=2 Nr=2 ceil_e=3 ceil_d=3 ceil_r=2 fault=crashloop:old co=rolling topo=pd-mn bump=engine,decoder form=start victimcomp=decoder floor_slack=1
# reason: the rollingUpdate group lists both Components and admits no push that names one without the other, so engine and decoder are bumped together and, as the bump lands, the decoder's highest Instance's pod is pointed at an image with no shell, so it crashes at every start and is never Ready again; both rolls converge within their budgets with every Instance on the new revision, and the decoder's broken Instance is the roll's to land, not a repair's: it ends on the new revision serving and no RestartTriggered event names it after the bump, while the group's gate paces the two members as one run; the broken decoder's own capacity is the one Instance the floor allows while the roll takes it first (floor_slack=1): no healthy decoder Instance is drained below N-1 while its replacement surges within the ceiling
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p2622 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          rollingUpdate: {}
