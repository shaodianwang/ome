# p2612: [gen] crashloop sibling start pd N=4 co canary rp None  Ne=4 Nd=4 Nr=2 ceil_e=5 ceil_d=4 ceil_r=2 fault=crashloop:old co=canary topo=pd form=start victimcomp=decoder bump=engine canary=auto notimpl=1 issue=1977
# reason: the engine is bumped alone and, as the bump lands, the decoder's highest Instance's pod is pointed at an image with no shell, so it crashes at every start and is never Ready again; the engine roll converges within its budget with every engine Instance on the new revision, while the decoder, which nothing bumped, keeps N with nothing rotated and its broken Instance is rebuilt by a repair (every pod new, Ready and serving on its running revision) that a RestartTriggered event names; the canary group lists both Components, so the engine's run is open while the decoder's repair is admitted; parked: with the run open the group's unavailability and ratio projections count the dark Instance twice, so the repair is denied, and whether the engine's roll completes beside it is undecided
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p2612 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder, router]
          canary:
            steps:
              - { capacity: "50%", traffic: 50, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
