# p2606: [gen] crashloop sibling start pd N=4 co rolling rp None  Ne=4 Nd=4 Nr=2 ceil_e=5 ceil_d=5 ceil_r=2 fault=crashloop:old co=rolling topo=pd bump=engine,decoder form=start victimcomp=decoder
# reason: the rollingUpdate group lists both Components and admits no push that names one without the other, so engine and decoder are bumped together and, as the bump lands, the decoder's highest Instance's pod is pointed at an image with no shell, so it crashes at every start and is never Ready again; both rolls converge within their budgets with every Instance on the new revision, and the decoder's broken Instance is the roll's to land, not a repair's: it ends on the new revision serving and no RestartTriggered event names it after the bump, while the group's gate paces the two members as one run
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p2606 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          rollingUpdate: {}
