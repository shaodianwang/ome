# p2629: [gen] crashloop sibling load pd-mn W1 N=2 co canary rp RecreateInstance  Ne=2 Nd=2 Nr=2 ceil_e=3 ceil_d=2 ceil_r=2 fault=crashloop:old co=canary topo=pd-mn form=load victimcomp=decoder bump=engine canary=auto notimpl=1 issue=1977
# reason: the engine is bumped alone and, as the bump lands, the decoder's highest Instance's pod has its runner killed every few seconds while it is up, so it dies after Ready and comes back between crashes; the engine roll converges within its budget with every engine Instance on the new revision, while the decoder, which nothing bumped, keeps N with nothing rotated and its broken Instance is rebuilt by a repair (every pod new, Ready and serving on its running revision) that a RestartTriggered event names; the canary group lists both Components, so the engine's run is open while the decoder's repair is admitted; parked: with the run open the group's unavailability and ratio projections count the dark Instance twice, so the repair is denied, and whether the engine's roll completes beside it is undecided
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p2629 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder, router]
          canary:
            steps:
              - { capacity: "50%", traffic: 50, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
