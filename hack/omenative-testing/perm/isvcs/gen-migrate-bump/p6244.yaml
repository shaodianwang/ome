# p6244: [gen] bump then move at last engine N=4 InPlaceIfPossible u1 co none  mode=migrate Ne=4 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 co=none topo=engine during=last mig=Auto inst=last
# reason: the move is requested when the roll has one Instance of the moved Component left, and names that Instance; both finish: every Instance ends on the new revision, the moved one among them and off the node it left, no Instance is left mid-operation, the move is recorded once and consumed once, the capacity floor holds throughout and the peak never exceeds N+1 (the move and the roll together stay within the roll's budget); the roll patches in place, the move is the only surge
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p6244 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "InPlaceIfPossible", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
