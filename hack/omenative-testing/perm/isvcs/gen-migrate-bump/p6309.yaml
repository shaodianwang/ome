# p6309: [gen] move then bump at surge engine-mn W1 N=2 InPlaceIfPossible u1 co rolling  mode=migrate Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 co=rolling topo=engine-mn mig=Auto inst=0 then=bump at=surge
# reason: the revision is pushed as the move's replacement pod starts; both finish: every Instance ends on the new revision, the moved one among them and off the node it left, no Instance is left mid-operation, the move is recorded once and consumed once, the capacity floor holds throughout and the peak never exceeds N+1 (the move and the roll together stay within the roll's budget); the gang roll falls back to a whole-gang recreate, the move is the only surge; the roll runs under a rollingUpdate group
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p6309 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "InPlaceIfPossible", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  rollout:
    groups:
        - components: [engine]
          rollingUpdate: {}
