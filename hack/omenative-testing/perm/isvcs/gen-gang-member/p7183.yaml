# p7183: [gen] podkill delete engine-mn W1+router N=2 rp None target leader  mode=recreate Ne=2 Nd=0 Nr=2 ceil_e=2 ceil_d=0 ceil_r=2 restart=None kill=leader fault=podkill:settling co=none topo=engine-mn
# reason: the service is deleted on engine behind a router as gangs of 1 leader + 1 worker, and as it lands the leader of one engine gang is deleted by hand; the deleted pod is one more on its way out: nothing is rebuilt on a service being deleted, every pod goes within the teardown budget and the delete completes with nothing of the service left, and the same manifest re-applied under the same name comes up whole on fresh pods; the router is a negative control (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7183 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
