# p7190: [gen] gang leader lost settling engine-mn W1+router N=2 SurgeThenDrain rp None  Ne=2 Nd=0 Nr=2 ceil_e=3 ceil_d=0 ceil_r=2 restart=None kill=leader fault=podkill:settling order_soft=1 co=none topo=engine-mn victim=stable victimcomp=engine floor_slack=1
# reason: the leader is deleted from a settled gang the moment the bump lands: only the lost leader comes back; no whole-gang rebuild and no RestartTriggered; the gang is never counted as serving while a member is missing, the untouched gangs keep serving (floor N-maxUnavailable-1), and the roll ends with every gang whole on the new revision; order waived — the deletion is a drain with no preceding surge; the router is a negative control (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7190 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
