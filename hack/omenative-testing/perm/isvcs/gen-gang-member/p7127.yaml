# p7127: [gen] gang worker lost settling engine-mn W2 N=3 SurgeThenDrain rp RecreateInstance  Ne=3 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 restart=RecreateInstance kill=worker fault=podkill:settling order_soft=1 co=none topo=engine-mn victim=stable floor_slack=1
# reason: the worker is deleted from a settled gang the moment the bump lands: the engine rebuilds the gang as a whole (a RestartTriggered names it) unless the roll takes it first, in which case every pod of it is new on the target; the gang is never counted as serving while a member is missing, the untouched gangs keep serving (floor N-maxUnavailable-1), and the roll ends with every gang whole on the new revision; order waived — the deletion is a drain with no preceding surge
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7127 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 2 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
