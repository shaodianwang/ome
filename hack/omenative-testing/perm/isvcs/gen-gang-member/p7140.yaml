# p7140: [gen] gang leader lost rotating engine-mn W2 N=3 RecreatePod rp None  Ne=3 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 restart=None kill=leader fault=podkill:rotating co=none topo=engine-mn victim=canary floor_slack=1
# reason: the leader is deleted from the gang forming on the new revision, at its first pod of that member: only the lost leader comes back; no whole-gang rebuild and no RestartTriggered; the gang is never counted as serving while a member is missing, the untouched gangs keep serving (floor N-maxUnavailable-1), and the roll ends with every gang whole on the new revision
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7140 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 2 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
