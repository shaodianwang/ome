# p8691: [gen] packed pool broken running then fix load pd-mn W1 N=2 RecreatePod u1 rp None co rolling  Ne=2 Nd=2 Nr=2 ceil_e=2 ceil_d=2 ceil_r=2 fault=crashloop:idle pool=packed floor_soft=1 co=rolling topo=pd-mn form=load inv_on=J,K
# reason: fillers take every node's spare CPU once the service has settled, so the only room a pod can be placed in is what a pod of the service vacates; one engine pod of the running revision has its runner killed every few seconds while it is up, so it dies after Ready and comes back between crashes; once the break has bitten the good push lands: the broken Instance, which serves nothing, is rolled first and comes back in the room it vacated, the others follow one at a time, never two Instances down at once, every Instance ends serving on the good revision, no repair is recorded for the broken Instance after the push and nothing rebuilds the running revision; the one-down rule and the landing order are reported, not asserted: a runner that exits after Ready can be Ready when the roll decides, so the roll need not read that Instance as serving nothing; the audit ledger records no AutoRecover row and no pod carries a hostname NotIn term (invariants J and K); the decoder rolls under the same one-down budget beside the engine (converges, or holds with a reason)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8691 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          rollingUpdate: {}
