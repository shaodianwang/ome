# p8649: [gen] packed pool bad push then fix start pd N=3 RecreatePod u1 rp None co rolling  Ne=3 Nd=3 Nr=2 ceil_e=3 ceil_d=3 ceil_r=2 fault=crashloop:new pool=packed co=rolling topo=pd form=start inv_on=J,K
# reason: fillers take every node's spare CPU once the service has settled, so the only room a pod can be placed in is what a pod of the service vacates; the pushed engine revision dies at every start (its runner image has no shell for the fixture command); the first Instance drained is rebuilt on the crashing revision in the room its pod vacated and the roll stops there, never two Instances down at once; status says why (a rolloutHold or a Failed row, and a RetryHeld or InstanceFailed event) and no further attempt at that revision follows; the good push then lands on the broken Instance first, in room this service's own pods vacated (the decoder rolls beside the engine, so its room counts too), then on the others one at a time, every Instance ends serving on it and nothing rebuilds the crashing revision; the audit ledger records no AutoRecover row and no pod carries a hostname NotIn term (invariants J and K); the decoder rolls under the same one-down budget beside the engine (converges, or holds with a reason)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8649 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          rollingUpdate: {}
