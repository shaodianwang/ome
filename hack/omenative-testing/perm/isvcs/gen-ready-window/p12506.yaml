# p12506: [gen] ready window 30s push engine N=3 SurgeThenDrain s1 u0  Ne=3 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 co=none topo=engine
# reason: the engine is pushed under a readiness window of 30s: a new pod counts as available only once it has been Ready for 30s, and the roll takes the next Instance on available pods alone; under SurgeThenDrain at maxUnavailable 0 the replacement surges beside its source, the source leaves rotation only once the replacement has been Ready for 30s, and the next Instance surges only after that; so the roll waits at least 30s between one Instance's new pods turning Ready and the next Instance being taken, the fleet keeps serving at N-0 throughout, and the push lands on every Instance
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p12506 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { minReadySeconds: 30, updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
