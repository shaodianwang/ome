# p12521: [gen] ready window 30s crash 5s push engine-mn W1 N=3 RecreatePod u1  Ne=3 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 fault=crashloop:new co=none topo=engine-mn form=load exitafter=5
# reason: the engine is pushed onto a revision whose runner carries the fixture runtime's exit switch, so its pods pass readiness and exit 5s after they are up, every time the kubelet starts them, under a readiness window of 30s; a pod that crashes before it has been Ready for 30s never counts as available, so the roll takes no further Instance: the first Instance taken down crash-loops on the pushed revision and the other 2 keep serving the running revision: at most 1 off, the budget, where without a window the same crash would admit the next Instance's start and leave two off; status says why (a rolloutHold from the retry ladder or a Failed row, and a RetryHeld or InstanceFailed event), every further attempt at that revision is one the ladder announced, the push ends held once the retry ladder (the product's bounded retries at the same revision) is spent, and the fix push then lands on every Instance, paced by the same window, with nothing rebuilding the crashing revision; each Instance is a gang of 1 leader + 1 worker, Ready as a whole and counted whole
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p12521 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { instanceReadyTimeout: "120s", minReadySeconds: 30, updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
