# p12563: [gen] ready window 30s crash 20s canary engine N=3 SurgeThenDrain s1 u0  mode=canary Ne=3 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 fault=crashloop:new co=none topo=engine canary=auto form=load exitafter=20 during=canary-failed verb=rebump-fix victimcomp=engine terminal=Stable cell=canary/Staging/canaryBroken[crashInWindow],canary/Failed/newTarget
# reason: a two-step canary (one Instance, then all) on an engine of 3 under a readiness window of 30s is pushed onto a revision whose runner carries the fixture runtime's exit switch, so its pod passes readiness and exits 20s after it is up, every time it is started; it never counts as available, so the first step's capacity gate never fills: no traffic names the broken revision, the stable side keeps every Instance serving, the ladder parks Failed at the capacity step when its readyTimeout of 90s expires, and the fix push at the park lands on every Instance
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p12563 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { minReadySeconds: 30, updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            readyTimeout: "90s"
            steps:
              - { capacity: "33%", traffic: 33, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
