# p12532: [gen] ready window 0 push engine-mn W1 N=3 SurgeThenDrain s1 u1  Ne=3 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 co=none topo=engine-mn
# reason: a plain push on the engine alone as gangs of 1 leader + 1 worker at maxSurge 1, maxUnavailable 1: two Instances may be in flight at once, the fleet keeps serving at N-1, and the push lands on every Instance; each Instance is a gang of 1 leader + 1 worker, Ready as a whole and counted whole
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p12532 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
