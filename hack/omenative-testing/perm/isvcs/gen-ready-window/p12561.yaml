# p12561: [gen] ready window 90s image edit engine N=3 InPlaceIfPossible u1  Ne=3 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 co=none topo=engine img=${OME_EVAL_NGINX_ALT_IMAGE} edit=image
# reason: the engine's runner image is edited under InPlaceIfPossible with a readiness window of 90s: each pod is patched in place (same UID) and restarts its container, so its Ready condition turns True anew and the window counts from that; the next Instance is patched only once the previous pod has been Ready again for 90s, at most one Instance is down at a time (maxUnavailable 1), and the edit lands on every one of the 3 Instances with no pod recreated
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p12561 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { minReadySeconds: 90, updateStrategy: { type: "InPlaceIfPossible", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
