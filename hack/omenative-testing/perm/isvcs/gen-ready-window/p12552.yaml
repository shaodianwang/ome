# p12552: [gen] ready window 0 push pd N=3 SurgeThenDrain s1 u1  Ne=3 Nd=3 Nr=2 ceil_e=4 ceil_d=3 ceil_r=2 co=none topo=pd
# reason: a plain push on the prefill/decode, single-pod at maxSurge 1, maxUnavailable 1: two Instances may be in flight at once, the fleet keeps serving at N-1, and the push lands on every Instance; the decoder and the router are not pushed and stay as they are
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p12552 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
