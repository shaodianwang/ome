# p12545: [gen] ready window 90s crash 20s push pd N=3 RecreatePod u1  Ne=3 Nd=3 Nr=2 ceil_e=3 ceil_d=3 ceil_r=2 fault=crashloop:new co=none topo=pd form=load exitafter=20
# reason: the engine is pushed onto a revision whose runner carries the fixture runtime's exit switch, so its pods pass readiness and exit 20s after they are up, every time the kubelet starts them, under a readiness window of 90s; a pod that crashes before it has been Ready for 90s never counts as available, so the roll takes no further Instance: the first Instance taken down crash-loops on the pushed revision and the other 2 keep serving the running revision: at most 1 off, the budget, where without a window the same crash would admit the next Instance's start and leave two off; status says why (a rolloutHold from the retry ladder or a Failed row, and a RetryHeld or InstanceFailed event), every further attempt at that revision is one the ladder announced, the push ends held once the retry ladder (the product's bounded retries at the same revision) is spent, and the fix push then lands on every Instance, paced by the same window, with nothing rebuilding the crashing revision; the decoder and the router are not pushed and stay as they are
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p12545 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { instanceReadyTimeout: "180s", minReadySeconds: 90, updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
