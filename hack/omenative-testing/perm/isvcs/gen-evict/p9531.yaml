# p9531: [gen] evict delete engine-mn W1 N=2  mode=recreate Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 fault=evict:settling co=none topo=engine-mn
# reason: the service is deleted on engine alone as gangs of 1 leader + 1 worker, and as the delete lands one of its pods is evicted through the Eviction API, as a node drain would, asked again while the disruption budget refuses it; the eviction is one more pod on its way out: every pod goes within the teardown budget, the delete completes with nothing of the service left, and the same manifest re-applied under the same name comes up whole on fresh pods; each Instance is a gang, rebuilt whole
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9531 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
