# p9529: [gen] evict scaledown engine-mn W1 N=2 x2  mode=scaledown Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 fault=evict:settling co=none topo=engine-mn to_e=1 floor_slack=1 repeat=2
# reason: the engine is scaled from N to N-1 on engine alone as gangs of 1 leader + 1 worker, and as the scale lands a settled engine pod is evicted through the Eviction API, as a node drain would, asked again while the disruption budget refuses it, and again once what it took has come back, 2 times in all; while an Instance is short the status says so and never counts it whole, every repair is for an Instance the eviction took, and the controller creates no more pods than the operation and the repairs explain; the controller replaces what it took, the floor lowered by that one Instance holds, and the scale completes with the engine at N-1 and the survivors on their own pods, with every row settled and no hold left behind; each Instance is a gang, rebuilt whole
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9529 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
