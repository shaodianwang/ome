# p7432: [gen] evict rotating engine-mn W1+router N=2 SurgeThenDrain s1 rp RecreateInstance  Ne=2 Nd=0 Nr=2 ceil_e=3 ceil_d=0 ceil_r=2 fault=evict:rotating floor_soft=1 order_soft=1 co=none topo=engine-mn
# reason: once the roll is in flight the lowest settled gang's leader is evicted through the Eviction API, as a node drain would, asked again while the disruption budget refuses it under SurgeThenDrain; the controller replaces it, the roll converges with every Instance on the new revision and no pod comes back under the old label; the router is a negative control (co=none); floor waived — the eviction itself costs settled capacity the update budget cannot absorb; order waived — the eviction is a drain with no preceding surge
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7432 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
