# p7413: [gen] evict steady engine-mn W1 N=2 rp None target worker  mode=kill Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 restart=None kill=worker co=none topo=engine-mn via=evict
# reason: the worker pod of one gang is evicted through the Eviction API, as a node drain would; the disruption budget admits it with every Instance serving, exactly the removed pod is recreated under restart policy None, no other Instance is touched and the fleet is back at N serving; nothing surges on a service nobody bumped
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7413 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
