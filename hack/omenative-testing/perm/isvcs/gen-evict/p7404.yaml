# p7404: [gen] evict rotating engine N=4 SurgeThenDrain s1 rp RecreateInstance  Ne=4 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 fault=evict:rotating co=none topo=engine
# reason: once the roll is in flight the newest new-revision pod is evicted through the Eviction API, as a node drain would, asked again while the disruption budget refuses it under SurgeThenDrain; the controller replaces it, the roll converges with every Instance on the new revision and no pod comes back under the old label
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7404 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
