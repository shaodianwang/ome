# p7409: [gen] evict steady pd N=4 rp RecreateInstance  mode=kill Ne=4 Nd=4 Nr=2 ceil_e=4 ceil_d=4 ceil_r=2 restart=RecreateInstance co=none topo=pd via=evict
# reason: one engine pod is evicted through the Eviction API, as a node drain would; the disruption budget admits it with every Instance serving, the Instance (one pod) is recreated under restart policy RecreateInstanceOnPodRestart, no other Instance is touched and the fleet is back at N serving; nothing surges on a service nobody bumped
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7409 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
