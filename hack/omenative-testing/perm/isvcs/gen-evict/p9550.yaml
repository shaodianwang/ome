# p9550: [gen] evict scaleup engine-mn W1+router N=2  mode=scaledown Ne=2 Nd=0 Nr=2 ceil_e=3 ceil_d=0 ceil_r=2 fault=evict:settling co=none topo=engine-mn to_e=3 floor_slack=1
# reason: the engine is scaled from N to N+1 on engine behind a router as gangs of 1 leader + 1 worker, and as the scale lands a settled engine pod is evicted through the Eviction API, as a node drain would, asked again while the disruption budget refuses it; the controller replaces what it took, the floor lowered by that one Instance holds, and the scale completes with the new Instance whole and serving and the survivors on their own pods, with every row settled and no hold left behind; each Instance is a gang, rebuilt whole; the router is a negative control (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9550 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
