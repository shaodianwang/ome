# p5342: [gen] canary podkill podkill once at auto engine-mn W1 N=2 rp None target leader  mode=canary Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 kill=leader fault=podkill:canary-serving@0 co=none topo=engine-mn canary=auto victim=stable victimcomp=engine nophase=Failed cell=canary/Serving/capacityDropped[gangOnce]
# reason: the leader pod of one old-revision engine gang is deleted by hand while the first step soaks its split on engine gang (2 Instances of 1 leader + 1 worker), under restart policy None; the step keeps its state across the capacity dip, the replacement comes back on the revision it ran, and the ladder walks every step to Stable with every Instance on the canary revision serving
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p5342 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            steps:
              - { capacity: "10%", traffic: 10, pause: { duration: "20s" } }
              - { capacity: "30%", traffic: 30, pause: { duration: "20s" } }
              - { capacity: "60%", traffic: 60, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
