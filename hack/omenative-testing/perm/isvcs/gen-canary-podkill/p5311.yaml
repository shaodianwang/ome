# p5311: [gen] canary podkill podkill again at auto engine-mn W1 N=2 rp None target leader  mode=canary Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 kill=leader fault=podkill:canary-serving@0 co=none topo=engine-mn canary=auto victim=stable victimcomp=engine nophase=Failed cell=canary/Serving/capacityDropped[gangRepeat] repeat=2
# reason: the leader pod of one old-revision engine gang is deleted by hand while the first step soaks its split on engine gang (2 Instances of 1 leader + 1 worker), and again each time what it took is back, 2 times in all, under restart policy None; each loss is reported on its row and repaired within the policy's scope, the controller creates no more pods than the roll and the repairs explain, no pod comes back on a revision the service never pushed, and the ladder walks every step to Stable with every Instance on the canary revision serving
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p5311 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            steps:
              - { capacity: "10%", traffic: 10, pause: { duration: "20s" } }
              - { capacity: "30%", traffic: 30, pause: { duration: "20s" } }
              - { capacity: "60%", traffic: 60, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
