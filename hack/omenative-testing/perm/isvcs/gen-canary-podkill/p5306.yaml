# reason: one old-revision engine pod is deleted by hand while the first step soaks its split on engine single (8 Instances), and again each time what it took is back, 2 times in all, under restart policy None; each loss is reported on its row and repaired within the policy's scope, the controller creates no more pods than the roll and the repairs explain, no pod comes back on a revision the service never pushed, and the ladder walks every step to Stable with every Instance on the canary revision serving
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p5306 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
