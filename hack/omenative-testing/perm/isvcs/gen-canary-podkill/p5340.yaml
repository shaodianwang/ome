# p5340: [gen] canary podkill evict once at manual pd-mn W1 N=2 rp None  mode=canary Ne=2 Nd=2 Nr=2 ceil_e=3 ceil_d=3 ceil_r=2 fault=evict:canary-serving@0 co=none topo=pd-mn canary=manual verbhold=30 victim=stable victimcomp=engine nophase=Failed cell=canary/Serving[M]/capacityDropped[evicted]
# reason: one old-revision engine pod is evicted through the Eviction API (as a node drain would) while the ladder waits at its first manual gate, which the harness promotes once the Instance is whole again on engine+decoder+router gang (2 Instances of 1 leader + 1 worker), under restart policy None; the step keeps its state across the capacity dip, the replacement comes back on the revision it ran, and the ladder walks every step to Stable with every Instance on the canary revision serving
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p5340 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          canary:
            steps:
              - { capacity: "10%", traffic: 10, pause: {  } }
              - { capacity: "30%", traffic: 30, pause: {  } }
              - { capacity: "60%", traffic: 60, pause: {  } }
              - { capacity: "100%", traffic: 100 }
