# p5302: [gen] canary podkill gate pd N=8 rp RecreateInstance  mode=canary Ne=8 Nd=8 Nr=2 ceil_e=9 ceil_d=9 ceil_r=3 co=none topo=pd canary=manual bump=engine,decoder,router img=${OME_EVAL_NGINX_ALT_IMAGE} during=canary-serving@0 verb=podkill verbhold=30 victim=stable victimcomp=engine cell=canary/Serving/capacityDropped[stable]
# reason: one old-revision engine pod is deleted by hand while the ladder waits at its first manual gate; its replacement comes back labelled as what it runs (the image its revision's pods ran, never the new template under the old label), and after the promote the roll finishes with every Instance on the final revision
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p5302 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder, router]
          canary:
            steps:
              - { capacity: "10%", traffic: 10, pause: {  } }
              - { capacity: "30%", traffic: 30, pause: {  } }
              - { capacity: "60%", traffic: 60, pause: {  } }
              - { capacity: "100%", traffic: 100 }
