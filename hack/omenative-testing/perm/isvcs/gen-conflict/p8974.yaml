# p8974: [gen] conflict steady engine-mn W1 N=2 once on ir  Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 fault=conflict:idle co=none topo=engine-mn form=once during=idle target=ir
# reason: a competing writer patches an annotation of every InferenceReplica of the service once on the settled service (engine alone as gangs of 1 leader + 1 worker), so the controller's next status write carries a stale resourceVersion and conflicts; the conflict must be retried without a lost decision: nothing may move: no pod created or taken down, every Instance keeps serving at N, the rows follow every change of the pods in rotation within the configured requeues and the manager's events stay bounded (a conflict storm is a hot loop); once the writer stops, the rows still read Ready with no operation open and no hold, retry block or Failed row left
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8974 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
