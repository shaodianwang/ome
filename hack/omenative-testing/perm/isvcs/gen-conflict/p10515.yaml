# p10515: [gen] conflict scaledown engine+router N=4 persist on ir  mode=scaledown Ne=4 Nd=0 Nr=2 ceil_e=4 ceil_d=0 ceil_r=2 fault=conflict:settling co=none topo=engine form=persist to_e=3 target=ir
# reason: the engine is scaled from N to N-1 on engine behind a router, single-pod, and a competing writer patches an annotation of every InferenceReplica of the service every few hundred milliseconds from as the scale-down lands until the operation completes, so the controller's next status write carries a stale resourceVersion and conflicts; the conflict must be retried without a lost decision: no Instance below the target is taken down, the survivors keep serving, the rows follow every change of the pods in rotation within the configured requeues, and the manager's events stay bounded (a lost write is a stale row, a conflict retried as a fresh decision is a double apply, a conflict storm is a hot loop); the scale completes with the engine at N-1, the survivors on their own pods, nothing created, and the rows settled with no hold, retry block or Failed row left; the router is a negative control (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10515 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
