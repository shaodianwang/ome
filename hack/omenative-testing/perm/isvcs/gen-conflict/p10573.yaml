# p10573: [gen] conflict edit pd N=4 SurgeThenDrain s1 persist on isvc  Ne=4 Nd=4 Nr=2 ceil_e=5 ceil_d=4 ceil_r=2 fault=conflict:settling co=none topo=pd form=persist during=rotating edit=strategy:RecreatePod target=isvc
# reason: the engine is bumped under SurgeThenDrain and its strategy edited to RecreatePod at the first pod of the new revision on prefill/decode, single-pod, and a competing writer patches an annotation of the ISVC every few hundred milliseconds from as the edit lands until the operation completes, so the controller's next status write carries a stale resourceVersion and conflicts; the conflict must be retried without a lost decision: the capacity floor (N minus maxUnavailable) holds, the rows follow every change of the pods in rotation within the configured requeues, and the manager's events stay bounded (a lost write is a stale row, a conflict retried as a fresh decision is a double apply, a conflict storm is a hot loop); the roll completes under the edited strategy with every Instance on the new revision and the edit on the live spec, each pod slot created at most once, the rows settled with no hold, retry block or Failed row left; decoder and router are negative controls (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10573 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
