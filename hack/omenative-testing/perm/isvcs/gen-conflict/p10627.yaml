# p10627: [gen] conflict canary at soak engine-mn W1 N=2 persist  mode=canary Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 fault=conflict:canary-serving@1 co=none topo=engine-mn canary=auto form=persist nophase=Failed cell=canary/Serving[soak]/competingWriter[persist] target=isvc
# reason: a competing writer bumps the ISVC's resourceVersion every few hundred milliseconds from the second step's soak until the ladder ends on engine gang (2 Instances of 1 leader + 1 worker), so the controller's status writes carry a stale resourceVersion, conflict and are retried; the ladder walks every step to Stable with the step index never going back, each pod slot of the unit created once, every Instance on the canary revision serving, the rows following the pods in rotation within the configured requeues, the manager's events bounded and nothing left held
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10627 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            steps:
              - { capacity: "10%", traffic: 10, pause: { duration: "20s" } }
              - { capacity: "30%", traffic: 30, pause: { duration: "20s" } }
              - { capacity: "60%", traffic: 60, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
