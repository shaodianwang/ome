# p10491: [gen] conflict move engine-mn W1 N=2 persist on ir  mode=migrate Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 fault=conflict:migrating co=none topo=engine-mn form=persist mig=Auto inst=0 at=accept target=ir
# reason: one engine Instance is asked to move on engine alone as gangs of 1 leader + 1 worker, and a competing writer patches an annotation of every InferenceReplica of the service every few hundred milliseconds from as soon as the move's request is recorded, the whole move still ahead until the operation completes, so the controller's next status write carries a stale resourceVersion and conflicts; the conflict must be retried without a lost decision: the N Instances keep serving (the source until its replacement serves), the rows follow every change of the pods in rotation within the configured requeues, and the manager's events stay bounded (a lost write is a stale row, a conflict retried as a fresh decision is a double apply, a conflict storm is a hot loop); the move completes: its ledger row reads Completed once, the request annotation is consumed, the moved Instance ends whole, Ready and serving off its source pod and created once, the engine holds N whole Instances, and the rows settle with no hold, retry block or Failed row left
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10491 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
