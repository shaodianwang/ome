# p10596: [gen] conflict push draining pd-mn W1 N=2 SurgeThenDrain s1 once on isvc  Ne=2 Nd=2 Nr=2 ceil_e=3 ceil_d=2 ceil_r=2 fault=conflict:draining co=none topo=pd-mn form=once target=isvc
# reason: the engine is bumped under the canonical surge budget on prefill/decode as gangs of 1 leader + 1 worker, and a competing writer patches an annotation of the ISVC once as the first pod of the old revision goes, so the controller's next status write carries a stale resourceVersion and conflicts; the conflict must be retried without a lost decision: the capacity floor (N minus maxUnavailable) holds, the rows follow every change of the pods in rotation within the configured requeues, and the manager's events stay bounded (a lost write is a stale row, a conflict retried as a fresh decision is a double apply, a conflict storm is a hot loop); the roll completes with every Instance on the new revision, each pod slot created once (more is a double apply), the rows settled with no hold, retry block or Failed row left; decoder and router are negative controls (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10596 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
