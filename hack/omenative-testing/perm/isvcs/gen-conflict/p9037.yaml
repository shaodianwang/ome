# p9037: [gen] conflict push draining engine N=4 SurgeThenDrain s1 persist on isvc  Ne=4 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 fault=conflict:draining co=none topo=engine form=persist target=isvc
# reason: the engine is bumped under the canonical surge budget on engine alone, single-pod, and a competing writer patches an annotation of the ISVC every few hundred milliseconds from as the first pod of the old revision goes until the operation completes, so the controller's next status write carries a stale resourceVersion and conflicts; the conflict must be retried without a lost decision: the capacity floor (N minus maxUnavailable) holds, the rows follow every change of the pods in rotation within the configured requeues, and the manager's events stay bounded (a lost write is a stale row, a conflict retried as a fresh decision is a double apply, a conflict storm is a hot loop); the roll completes with every Instance on the new revision, each pod slot created once (more is a double apply), the rows settled with no hold, retry block or Failed row left
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9037 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
