# p10456: [gen] conflict move engine N=4 once on isvc  mode=migrate Ne=4 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 fault=conflict:migrating co=none topo=engine form=once mig=Auto inst=0 at=accept target=isvc
# reason: one engine Instance is asked to move on engine alone, single-pod, and a competing writer patches an annotation of the ISVC once as soon as the move's request is recorded, the whole move still ahead, so the controller's next status write carries a stale resourceVersion and conflicts; the conflict must be retried without a lost decision: the N Instances keep serving (the source until its replacement serves), the rows follow every change of the pods in rotation within the configured requeues, and the manager's events stay bounded (a lost write is a stale row, a conflict retried as a fresh decision is a double apply, a conflict storm is a hot loop); the move completes: its ledger row reads Completed once, the request annotation is consumed, the moved Instance ends whole, Ready and serving off its source pod and created once, the engine holds N whole Instances, and the rows settle with no hold, retry block or Failed row left
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10456 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
