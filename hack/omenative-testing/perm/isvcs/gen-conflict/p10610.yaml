# p10610: [gen] conflict scaledown pd-mn W1 N=2 once on ir  mode=scaledown Ne=2 Nd=2 Nr=2 ceil_e=2 ceil_d=2 ceil_r=2 fault=conflict:settling co=none topo=pd-mn form=once to_e=1 target=ir
# reason: the engine is scaled from N to N-1 on prefill/decode as gangs of 1 leader + 1 worker, and a competing writer patches an annotation of every InferenceReplica of the service once as the scale-down lands, so the controller's next status write carries a stale resourceVersion and conflicts; the conflict must be retried without a lost decision: no Instance below the target is taken down, the survivors keep serving, the rows follow every change of the pods in rotation within the configured requeues, and the manager's events stay bounded (a lost write is a stale row, a conflict retried as a fresh decision is a double apply, a conflict storm is a hot loop); the scale completes with the engine at N-1, the survivors on their own pods, nothing created, and the rows settled with no hold, retry block or Failed row left; decoder and router are negative controls (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10610 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
