# p9021: [gen] conflict steady pd-mn W1 N=2 persist on isvc  Ne=2 Nd=2 Nr=2 ceil_e=2 ceil_d=2 ceil_r=2 fault=conflict:idle co=none topo=pd-mn form=persist during=idle target=isvc
# reason: a competing writer patches an annotation of the ISVC every few hundred milliseconds across the hold window (prefill/decode as gangs of 1 leader + 1 worker), so the controller's next status write carries a stale resourceVersion and conflicts; the conflict must be retried without a lost decision: nothing may move: no pod created or taken down, every Instance keeps serving at N, the rows follow every change of the pods in rotation within the configured requeues and the manager's events stay bounded (a conflict storm is a hot loop); once the writer stops, the rows still read Ready with no operation open and no hold, retry block or Failed row left; decoder and router are negative controls (co=none)
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9021 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
