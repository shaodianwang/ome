# p9046: [gen] conflict edit engine N=4 SurgeThenDrain s1 once on ir  Ne=4 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 fault=conflict:settling co=none topo=engine form=once during=rotating edit=strategy:RecreatePod target=ir
# reason: the engine is bumped under SurgeThenDrain and its strategy edited to RecreatePod at the first pod of the new revision on engine alone, single-pod, and a competing writer patches an annotation of every InferenceReplica of the service once as the edit lands, so the controller's next status write carries a stale resourceVersion and conflicts; the conflict must be retried without a lost decision: the capacity floor (N minus maxUnavailable) holds, the rows follow every change of the pods in rotation within the configured requeues, and the manager's events stay bounded (a lost write is a stale row, a conflict retried as a fresh decision is a double apply, a conflict storm is a hot loop); the roll completes under the edited strategy with every Instance on the new revision and the edit on the live spec, each pod slot created at most once, the rows settled with no hold, retry block or Failed row left
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9046 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
