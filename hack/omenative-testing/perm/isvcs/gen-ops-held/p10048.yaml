# p10048: [gen] stuck failed stuck scale-down engine-mn W1 N=2 SurgeThenDrain  mode=scaledown Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 co=none topo=engine-mn to_e=1 stuck=failed break=stuck
# reason: the engine is pushed onto a revision whose runner carries a readiness probe that never passes, so its pods run and never become Ready; its first attempt has failed (an Instance row reads Failed, the retry ladder is still running); the running Instances kept serving beside the broken replacements; then the engine is scaled down by one: the Instances that are not Ready go first, then the highest index, so a broken Instance is removed before a healthy one; the survivors keep their pods on the running revision; the healthy survivors keep serving throughout and the status keeps reporting the push that has not landed; each Instance is a gang, counted whole
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10048 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { instanceReadyTimeout: "90s", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
