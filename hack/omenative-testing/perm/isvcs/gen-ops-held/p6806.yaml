# p6806: [gen] stuck held delete engine N=3 SurgeThenDrain group none  mode=recreate Ne=3 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 co=none topo=engine img=example.com/canary-test/missing:none stuck=held
# reason: the push lands a revision whose image cannot be pulled; every attempt of the retry ladder has failed and the push is held (only a new revision or a release lifts it); the running Instances kept serving beside the failed replacements; then the service is deleted: every pod goes, stuck ones included, no pod stays Terminating and no finalizer wedges, and the same name comes back clean on fresh pods with nothing of the push left
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p6806 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
