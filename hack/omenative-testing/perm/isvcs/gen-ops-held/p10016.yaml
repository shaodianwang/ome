# p10016: [gen] stuck held crash-load delete engine N=3 RecreatePod  mode=recreate Ne=3 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 co=none topo=engine stuck=held break=crash-load
# reason: the engine is pushed onto a revision whose runner carries the fixture runtime's exit switch, so its pods pass readiness, are promoted and exit a few seconds later, every time the kubelet starts them; every attempt of the retry ladder has failed and the push is held (only a new revision or a release lifts it); the Instance each attempt drained served briefly on the pushed revision and crash-loops there; then the service is deleted: every pod goes, broken ones included, no pod stays Terminating and no finalizer wedges, and the same name comes back clean on fresh pods with nothing of the push left
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10016 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { instanceReadyTimeout: "90s", updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
