# p10014: [gen] stuck held crash-start scale-up engine N=3 SurgeThenDrain  mode=scaledown Ne=3 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 co=none topo=engine to_e=4 stuck=held break=crash-start
# reason: the engine is pushed onto a revision whose runner carries an image with no shell, so its pods crash at every start; every attempt of the retry ladder has failed and the push is held (only a new revision or a release lifts it); the running Instances kept serving beside the broken replacements; then the engine is scaled up by one: while held nothing starts (the new index waits as an empty slot) and nothing is rendered from the running revision; the survivors stay as they were; the healthy survivors keep serving throughout and the status keeps reporting the push that has not landed, the hold itself
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10014 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { instanceReadyTimeout: "90s", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
