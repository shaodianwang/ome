# p10078: [gen] stuck held crash-start on router scale-down engine-mn W1+router N=2 SurgeThenDrain  mode=scaledown Ne=2 Nd=0 Nr=2 ceil_e=2 ceil_d=0 ceil_r=3 co=none topo=engine-mn bump=router victimcomp=router to_e=1 stuck=held break=crash-start
# reason: the router is pushed onto a revision whose runner carries an image with no shell, so its pods crash at every start; every attempt of the retry ladder has failed and the push is held (only a new revision or a release lifts it); the engine, which the push never touched, keeps every Instance serving on its running revision; then the engine is scaled down by one: the highest index goes, as on a healthy fleet, the survivors keep their pods on the running revision, and the router's parked push is not the scale's to take: its pods stay as they were under the hold; the healthy survivors keep serving throughout and the status keeps reporting the push that has not landed, the hold itself; each Instance is a gang, counted whole
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10078 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { instanceReadyTimeout: "90s", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
