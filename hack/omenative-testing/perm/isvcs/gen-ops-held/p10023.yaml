# p10023: [gen] stuck failed stuck scale-up engine N=3 SurgeThenDrain  mode=scaledown Ne=3 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 co=none topo=engine to_e=4 stuck=failed break=stuck
# reason: the engine is pushed onto a revision whose runner carries a readiness probe that never passes, so its pods run and never become Ready; its first attempt has failed (an Instance row reads Failed, the retry ladder is still running); the running Instances kept serving beside the broken replacements; then the engine is scaled up by one: the new Instance is admitted on the pushed revision when the retry window allows it, never on the running revision, and is broken like its peers; the survivors stay as they were; the healthy survivors keep serving throughout and the status keeps reporting the push that has not landed
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10023 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { instanceReadyTimeout: "90s", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
