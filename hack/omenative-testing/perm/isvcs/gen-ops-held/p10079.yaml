# p10079: [gen] stuck held crash-start on router delete engine-mn W1+router N=2 SurgeThenDrain  mode=recreate Ne=2 Nd=0 Nr=2 ceil_e=2 ceil_d=0 ceil_r=3 co=none topo=engine-mn bump=router victimcomp=router stuck=held break=crash-start
# reason: the router is pushed onto a revision whose runner carries an image with no shell, so its pods crash at every start; every attempt of the retry ladder has failed and the push is held (only a new revision or a release lifts it); the engine, which the push never touched, keeps every Instance serving on its running revision; then the service is deleted: every pod goes, broken ones included, no pod stays Terminating and no finalizer wedges, and the same name comes back clean on fresh pods with nothing of the push left; each Instance is a gang, counted whole
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10079 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { instanceReadyTimeout: "90s", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
