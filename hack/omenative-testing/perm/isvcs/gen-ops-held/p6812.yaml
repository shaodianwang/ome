# p6812: [gen] stuck held scale-down engine N=3 RecreatePod group none  mode=scaledown Ne=3 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 co=none topo=engine img=example.com/canary-test/missing:none to_e=2 stuck=held
# reason: the push lands a revision whose image cannot be pulled; every attempt of the retry ladder has failed and the push is held (only a new revision or a release lifts it); the Instance each attempt drained is dark on the pushed revision; then the engine is scaled down by one: the Instances that are not Ready go first, then the highest index, so a stuck Instance is removed before a healthy one; the survivors keep their pods on the running revision; the healthy survivors keep serving throughout and the status keeps reporting the push that has not landed
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p6812 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
