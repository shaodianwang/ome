# p10022: [gen] stuck failed stuck delete engine N=3 SurgeThenDrain  mode=recreate Ne=3 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 co=none topo=engine stuck=failed break=stuck
# reason: the engine is pushed onto a revision whose runner carries a readiness probe that never passes, so its pods run and never become Ready; its first attempt has failed (an Instance row reads Failed, the retry ladder is still running); the running Instances kept serving beside the broken replacements; then the service is deleted: every pod goes, broken ones included, no pod stays Terminating and no finalizer wedges, and the same name comes back clean on fresh pods with nothing of the push left
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10022 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { instanceReadyTimeout: "90s", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
