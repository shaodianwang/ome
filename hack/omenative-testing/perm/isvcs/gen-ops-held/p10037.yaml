# p10037: [gen] stuck held crash-start on decoder delete pd N=3 SurgeThenDrain  mode=recreate Ne=3 Nd=3 Nr=2 ceil_e=3 ceil_d=4 ceil_r=2 co=none topo=pd bump=decoder victimcomp=decoder stuck=held break=crash-start
# reason: the decoder is pushed onto a revision whose runner carries an image with no shell, so its pods crash at every start; every attempt of the retry ladder has failed and the push is held (only a new revision or a release lifts it); the engine, which the push never touched, keeps every Instance serving on its running revision; then the service is deleted: every pod goes, broken ones included, no pod stays Terminating and no finalizer wedges, and the same name comes back clean on fresh pods with nothing of the push left; the router is neither pushed nor scaled and stays as it is
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10037 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { instanceReadyTimeout: "90s", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
