# p10019: [gen] stuck failed configkey delete engine N=3 RecreatePod  mode=recreate Ne=3 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 co=none topo=engine stuck=failed break=configkey
# reason: the engine is pushed onto a revision whose runner carries a ConfigMap key the ConfigMap lacks, so its pods wait in CreateContainerConfigError; its first attempt has failed (an Instance row reads Failed, the retry ladder is still running); the Instance each attempt drained is dark on the pushed revision; then the service is deleted: every pod goes, broken ones included, no pod stays Terminating and no finalizer wedges, and the same name comes back clean on fresh pods with nothing of the push left
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10019 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    runner: { env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p10019-config", key: "value" } } }] }
    lifecycle: { instanceReadyTimeout: "90s", updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p10019-config }
data: { value: "1" }
