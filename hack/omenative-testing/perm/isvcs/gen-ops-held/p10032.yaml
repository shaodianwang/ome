# p10032: [gen] stuck failed configkey scale-up pd N=3 RecreatePod  mode=scaledown Ne=3 Nd=3 Nr=2 ceil_e=4 ceil_d=3 ceil_r=2 co=none topo=pd to_e=4 stuck=failed break=configkey
# reason: the engine is pushed onto a revision whose runner carries a ConfigMap key the ConfigMap lacks, so its pods wait in CreateContainerConfigError; its first attempt has failed (an Instance row reads Failed, the retry ladder is still running); the Instance each attempt drained is dark on the pushed revision; then the engine is scaled up by one: the new Instance is admitted on the pushed revision when the retry window allows it, never on the running revision, and is broken like its peers; the survivors stay as they were; the healthy survivors keep serving throughout and the status keeps reporting the push that has not landed; decoder and router are neither pushed nor scaled and stay as they were
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10032 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    runner: { env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p10032-config", key: "value" } } }] }
    lifecycle: { instanceReadyTimeout: "90s", updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p10032-config }
data: { value: "1" }
