# p6800: [gen] stuck failed scale-down engine N=3 SurgeThenDrain group none  mode=scaledown Ne=3 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 co=none topo=engine img=example.com/canary-test/missing:none to_e=2 stuck=failed
# reason: the push lands a revision whose image cannot be pulled; its first attempt has failed (an Instance row reads Failed, the retry ladder is still running); the running Instances kept serving beside the failed replacements; then the engine is scaled down by one: the Instances that are not Ready go first, then the highest index, so a stuck Instance is removed before a healthy one; the survivors keep their pods on the running revision; the healthy survivors keep serving throughout and the status keeps reporting the push that has not landed
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p6800 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 3
    maxReplicas: 3
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
