# p162: engine N=4 partition=2  mode=partition Ne=4 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 partition=2 co=none topo=engine
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p162 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0, partition: 2 } } }
