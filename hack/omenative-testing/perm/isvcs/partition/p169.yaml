# p169: engine N=8 partition=4 maxSurge=NoLimit (unset)  mode=partition Ne=8 Nd=0 Nr=0 ceil_e=12 ceil_d=0 ceil_r=0 partition=4 co=none topo=engine
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p169 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxUnavailable: 0, partition: 4 } } }
