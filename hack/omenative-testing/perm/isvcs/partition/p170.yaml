# p170: engine-mn N=8 W=1 partition=2 RecreatePod  mode=partition Ne=8 Nd=0 Nr=0 ceil_e=8 ceil_d=0 ceil_r=0 partition=2 co=none topo=engine-mn
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p170 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1, partition: 2 } } }
