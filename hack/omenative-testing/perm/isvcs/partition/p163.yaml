# p163: engine N=4 partition=3  mode=partition Ne=4 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 partition=3 co=none topo=engine notimpl=1
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p163 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0, partition: 3 } } }
