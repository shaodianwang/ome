# p8101: [gen] router gang push engine-mn W1 N=2 RecreatePod u1  Ne=2 Nd=0 Nr=2 ceil_e=2 ceil_d=0 ceil_r=2 co=none topo=engine-mn
# reason: the engine (2 gangs of 1 leader + 1 worker) is bumped alone; each gang is drained and rebuilt whole at the new revision, one gang at a time within its budget (peak 2 gangs); no gang is ever split across revisions and no two gangs share an index; the router is not bumped: it never rolls (peak 2, the same pods) and stays in rotation throughout; every engine Instance ends on the new revision
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8101 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
