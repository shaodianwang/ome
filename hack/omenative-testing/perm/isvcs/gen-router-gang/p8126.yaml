# p8126: [gen] router gang scale engine-mn W2 2->1 SurgeThenDrain  mode=scaledown Ne=2 Nd=0 Nr=2 ceil_e=2 ceil_d=0 ceil_r=2 co=none topo=engine-mn to_e=1 to_r=2
# reason: the engine is scaled from 2 to 1 gang of 1 leader + 2 workers: only index 1 is removed, whole; the surviving gang keeps its pods (same UIDs) and serves throughout, so capacity never drops below min(start, target) = 1 and nothing surges above 2; no gang is left partial; the router holds at 2 and stays in rotation
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8126 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 2 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
