# p8103: [gen] router gang crashloop start engine-mn W1 N=2 SurgeThenDrain s1 rp None  Ne=2 Nd=0 Nr=2 ceil_e=3 ceil_d=0 ceil_r=2 fault=crashloop:old floor_soft=1 co=none topo=engine-mn form=start
# reason: the highest gang's old-revision leader pod is pointed at an image with no shell as the bump lands, so it crashes at every start and is never Ready again; its gang is the last the roll reaches, and the roll owns it: each gang surges whole at a fresh index and its source gang is drained once the new one serves, no repair is recorded for it after the bump under restart policy None, and every engine Instance (2 gangs of 1 leader + 1 worker) ends on the new revision serving; no gang is ever split across revisions and no two gangs share an index; the router is not bumped: it never rolls (peak 2, the same pods) and stays in rotation throughout; floor waived — the crash itself costs settled capacity for the length of the roll
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8103 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
