# p8122: [gen] router gang crashloop start engine-mn W2 N=2 RecreatePod u1 rp None  Ne=2 Nd=0 Nr=2 ceil_e=2 ceil_d=0 ceil_r=2 fault=crashloop:old floor_soft=1 co=none topo=engine-mn form=start
# reason: the highest gang's old-revision leader pod is pointed at an image with no shell as the bump lands, so it crashes at every start and is never Ready again; its gang is the last the roll reaches, and the roll owns it: each gang is drained and rebuilt whole at the new revision, one gang at a time, no repair is recorded for it after the bump under restart policy None, and every engine Instance (2 gangs of 1 leader + 2 workers) ends on the new revision serving; no gang is ever split across revisions and no two gangs share an index; the router is not bumped: it never rolls (peak 2, the same pods) and stays in rotation throughout; floor waived — the crash itself costs settled capacity for the length of the roll
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8122 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 2 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
