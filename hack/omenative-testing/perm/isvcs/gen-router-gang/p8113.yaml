# p8113: [gen] router gang canary auto engine-mn W1 N=2 SurgeThenDrain s1  mode=canary Ne=2 Nd=0 Nr=2 ceil_e=3 ceil_d=0 ceil_r=2 co=none topo=engine-mn canary=auto cell=canary/Idle/newTarget[routerIdleGang]
# reason: an engine-only ladder behind a router on 2 gangs of 1 leader + 1 worker: the group names the engine alone, so the router is idle (no run of its own, every router pod on its revision, peak 2) and stays in rotation; the 10 percent step asks ceil(0.2) = 1 new gang, the 50 percent step asks ceil(1.0) = 1, the same gang, so it moves traffic and adds no capacity; the stable revision keeps one gang until the cutover's traffic write lands, then the last gang rolls; each step's gang surges whole beside the stable one (peak 3); each gate is a timed soak; every engine Instance ends on the canary revision serving with nothing left on the stable one
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8113 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            steps:
              - { capacity: "10%", traffic: 10, pause: { duration: "20s" } }
              - { capacity: "50%", traffic: 50, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
