# p97: scaledown engine N=4→2 (graceful drain, no surge-up)  mode=scaledown Ne=4 Nd=0 Nr=0 to_e=2 ceil_e=4 ceil_d=0 ceil_r=0 topo=engine
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p97 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,        name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime,   name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle:
      updateStrategy:
        type: SurgeThenDrain
        rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
