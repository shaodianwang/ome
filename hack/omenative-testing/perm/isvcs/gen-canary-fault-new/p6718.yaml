# p6718: [gen] canary fault-new configkey kept exit rebump-fix pd-mn W1 N=2 rp None  mode=canary Ne=2 Nd=2 Nr=2 ceil_e=3 ceil_d=3 ceil_r=2 fault=configkey:new co=none topo=pd-mn canary=auto during=canary-failed verb=rebump-fix terminal=Stable cell=canary/Staging/canaryBroken[configMissing],canary/Failed/newTarget lift=never
# reason: the pushed engine revision reads a ConfigMap key the ConfigMap lacks, so its pod waits in CreateContainerConfigError on engine+decoder+router gang (2 Instances of 1 leader + 1 worker), under restart policy None; the ladder stops at the step where the break bites and parks with a reason, no traffic names the broken revision at the park while the stable side keeps serving every Instance the broken revision had not replaced, nothing promotes the broken revision, and then a fix push that drops the runner override lands on every Instance, serving, with nothing left on the broken revision
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p6718 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: { runner: { name: "ome-container", env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p6718-config", key: "value" } } }] } }
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          canary:
            readyTimeout: "90s"
            steps:
              - { capacity: "10%", traffic: 10, pause: { duration: "20s" } }
              - { capacity: "30%", traffic: 30, pause: { duration: "20s" } }
              - { capacity: "60%", traffic: 60, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p6718-config }
data: { value: "1" }
