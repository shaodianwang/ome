# p6690: [gen] canary fault-new taint lift never engine router N=8  mode=canary Ne=8 Nd=0 Nr=2 ceil_e=9 ceil_d=0 ceil_r=2 fault=taint:all co=none topo=engine canary=auto terminal=Failed cell=canary/Staging/readyTimeout[unschedulable] lift=never
# reason: every schedulable node carries a NoSchedule taint before the push lands on engine+router single (8 Instances), so the first step's canary pod cannot be placed; the Instance waits with reason Unschedulable on its row, no row reads Failed and nothing settled is taken down to make room; the taint stays, so the capacity step parks the ladder Failed at its ready timeout with the wait still reported, the stable revision keeps serving every Instance and nothing rolls back
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p6690 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            readyTimeout: "90s"
            steps:
              - { capacity: "10%", traffic: 10, pause: { duration: "20s" } }
              - { capacity: "30%", traffic: 30, pause: { duration: "20s" } }
              - { capacity: "60%", traffic: 60, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
