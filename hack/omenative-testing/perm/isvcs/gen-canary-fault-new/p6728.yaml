# p6728: [gen] canary fault-new taint lift after-settle pd-mn W1 N=2  mode=canary Ne=2 Nd=2 Nr=2 ceil_e=3 ceil_d=3 ceil_r=2 fault=taint:all co=none topo=pd-mn canary=auto nophase=Failed cell=canary/Staging/capacityReached[unschedulableLifted] lift=after-settle
# reason: every schedulable node carries a NoSchedule taint before the push lands on engine+decoder+router gang (2 Instances of 1 leader + 1 worker), so the first step's canary pod cannot be placed; the Instance waits with reason Unschedulable on its row, no row reads Failed and nothing settled is taken down to make room; the taint is lifted 20s after the wait showed and the ladder walks every step to Stable with every Instance on the canary revision serving
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p6728 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          canary:
            readyTimeout: "240s"
            steps:
              - { capacity: "10%", traffic: 10, pause: { duration: "20s" } }
              - { capacity: "30%", traffic: 30, pause: { duration: "20s" } }
              - { capacity: "60%", traffic: 60, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
