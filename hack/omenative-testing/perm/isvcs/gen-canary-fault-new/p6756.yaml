# p6756: [gen] canary fault-new crashInSoak exit rollback engine N=8 s1 rp None policyRef  mode=canary Ne=8 Nd=0 Nr=0 ceil_e=9 ceil_d=0 ceil_r=0 fault=crashloop:new co=none topo=engine canary=auto form=load exitafter=10 during=canary-failed verb=rollback victimcomp=engine terminal=RolledBack cell=canary/Serving/canaryBroken[crashInSoak][policyRef],canary/Failed/rollback[policyRef]
# reason: the pushed engine revision passes readiness and exits 10s later, inside the first step's 20s soak, every time the kubelet restarts it, under restart policy None; the ladder stops at the step where the break bites and parks with a reason, no traffic names the broken revision at the park while the stable side keeps serving every Instance the broken revision had not replaced, nothing promotes the broken revision, and then a rollback drains the broken revision and holds at RolledBack with the rejected revision recorded
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p6756 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          policyRef: { name: p6756-policy, progression: canary }
---
apiVersion: ome.io/v1beta1
kind: RolloutPolicy
metadata:
  name: p6756-policy
  # Teardown deletes the case's documents in one pass, the policy with the
  # service that still references it.
  annotations: { ome.io/allow-in-use-delete: "true" }
spec:
  canary:
    readyTimeout: "90s"
    steps:
      - { capacity: "10%", traffic: 10, pause: { duration: "20s" } }
      - { capacity: "30%", traffic: 30, pause: { duration: "20s" } }
      - { capacity: "60%", traffic: 60, pause: { duration: "20s" } }
      - { capacity: "100%", traffic: 100 }
