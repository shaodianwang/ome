# p6637: [gen] canary fault-new crashAfterSoak exit rollback engine N=8 s1 rp RecreateInstance  mode=canary Ne=8 Nd=0 Nr=0 ceil_e=9 ceil_d=0 ceil_r=0 fault=crashloop:new co=none topo=engine canary=auto form=load exitafter=40 during=canary-failed verb=rollback victimcomp=engine terminal=RolledBack cell=canary/Staging[next]/canaryBroken[crashAfterSoak],canary/Failed/rollback
# reason: the pushed engine revision passes readiness and exits 40s later, after the first step's 20s soak has advanced the ladder, every time the kubelet restarts it, under restart policy RecreateInstanceOnPodRestart; the first death restarts the soak and the second parks the ladder at the step it lands on, the step where the break bit or the next one, with a reason, no traffic names the broken revision at the park while the stable side keeps serving every Instance the broken revision had not replaced, nothing promotes the broken revision, and then a rollback drains the broken revision and holds at RolledBack with the rejected revision recorded
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p6637 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            readyTimeout: "90s"
            steps:
              - { capacity: "10%", traffic: 10, pause: { duration: "20s" } }
              - { capacity: "30%", traffic: 30, pause: { duration: "20s" } }
              - { capacity: "60%", traffic: 60, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
