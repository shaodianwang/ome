# p6746: [gen] canary fault-new crashInSoak kept exit rollback engine-mn W1 router N=2 rp None  mode=canary Ne=2 Nd=0 Nr=2 ceil_e=3 ceil_d=0 ceil_r=2 fault=crashloop:new co=none topo=engine-mn canary=auto form=load exitafter=10 during=canary-failed verb=rollback victimcomp=engine terminal=RolledBack cell=canary/Serving/canaryBroken[crashInSoak],canary/Failed/rollback
# reason: on engine+router gang (2 Instances of 1 leader + 1 worker), where the break lands on each gang Instance's leader runner: the pushed engine revision passes readiness and exits 10s later, inside the first step's 20s soak, every time the kubelet restarts it, under restart policy None; the ladder stops at the step where the break bites and parks with a reason, no traffic names the broken revision at the park while the stable side keeps serving every Instance the broken revision had not replaced, nothing promotes the broken revision, and then a rollback drains the broken revision and holds at RolledBack with the rejected revision recorded
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p6746 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            readyTimeout: "90s"
            steps:
              - { capacity: "10%", traffic: 10, pause: { duration: "20s" } }
              - { capacity: "30%", traffic: 30, pause: { duration: "20s" } }
              - { capacity: "60%", traffic: 60, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
