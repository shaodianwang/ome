# p6610: [gen] canary fault-new imagePull exit rebump-fix engine N=8 s1 rp None  mode=canary Ne=8 Nd=0 Nr=0 ceil_e=9 ceil_d=0 ceil_r=0 fault=imagepull:new co=none topo=engine canary=auto during=canary-failed verb=rebump-fix victimcomp=engine terminal=Stable cell=canary/Staging/canaryBroken[imagePull],canary/Failed/newTarget
# reason: the pushed engine revision's image cannot be pulled, under restart policy None; the ladder stops at the step where the break bites and parks with a reason, no traffic names the broken revision at the park while the stable side keeps serving every Instance the broken revision had not replaced, nothing promotes the broken revision, and then a fix push that drops the broken runner lands on every Instance, serving, with nothing left on the broken revision
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p6610 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            readyTimeout: "90s"
            steps:
              - { capacity: "10%", traffic: 10, pause: { duration: "20s" } }
              - { capacity: "30%", traffic: 30, pause: { duration: "20s" } }
              - { capacity: "60%", traffic: 60, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
