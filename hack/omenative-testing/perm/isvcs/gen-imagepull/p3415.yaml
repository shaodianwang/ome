# p3415: [gen] imagepull pd N=4 RecreatePod u1 rp RecreateInstance co rolling  Ne=4 Nd=4 Nr=2 ceil_e=4 ceil_d=5 ceil_r=2 fault=imagepull:old floor_soft=1 co=rolling topo=pd
# reason: one old-revision engine pod is pointed at an image that cannot be pulled as the bump lands, so the kubelet parks it in ImagePullBackOff and it is never Ready again; its Instance is off the target from that moment, so the roll owns it: the recreate drains it and rebuilds the Instance at the fixed revision, admitted within the same budget as its peers, and no repair is recorded for it after the bump; every Instance ends on the new revision; the group paces engine and decoder together as on any coordinated roll; floor waived — the broken pod costs settled capacity for the length of the roll
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p3415 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          rollingUpdate: {}
