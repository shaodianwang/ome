# p3450: [gen] imagepull idle pd N=4 rp None  Ne=4 Nd=4 Nr=2 ceil_e=4 ceil_d=4 ceil_r=2 fault=imagepull:old co=none topo=pd during=idle expect=repaired
# reason: one engine pod of the idle service is pointed at an image that cannot be pulled, so the kubelet parks it in ImagePullBackOff; nothing bumps the service, so the crash-loop repair owns it under either restart policy: once the pod has sat past the stuck-pod grace the Instance is rebuilt in place (the pod, every pod new, Ready and serving on the running revision) and a RestartTriggered event names it; no Component ever exceeds N alive
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p3450 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
