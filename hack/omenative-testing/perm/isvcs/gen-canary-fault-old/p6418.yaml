# reason: 1 old-revision engine Instance(s) die after Ready and come back between crashes before the push lands (the break bites on the idle service first), under restart policy RecreateInstanceOnPodRestart; the ladder walks every step to Stable inside its budgets, every broken Instance ends on the canary revision serving, no repair is recorded for one after the push, and the healthy Instances keep serving above N-1
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p6418 }
spec:
