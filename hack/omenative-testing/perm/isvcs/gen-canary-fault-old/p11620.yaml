# p11620: [gen] canary fault-old configkey kept at idle engine-mn W1 router N=2 rp None  mode=canary Ne=2 Nd=0 Nr=2 ceil_e=3 ceil_d=0 ceil_r=2 fault=configkey:idle co=none topo=engine-mn canary=auto terminal=Failed cell=canary/Idle/stableBroken[configMissing] lift=never
# reason: the operator pushes a canary while the ConfigMap key one old-revision engine pod reads is kept away on engine+router gang (2 Instances of 1 leader + 1 worker) (the pod waits in CreateContainerConfigError and the status reacted to it before the push); both revisions read the key, so the push cannot fix it: the stable-side break does not hold the ladder, the pod placed for the first capacity step waits on the same key, the ladder parks Failed at that step naming the missing key, the stable side keeps serving every Instance the break and the ladder did not take, no traffic reaches the step whose pod never came up, and nothing rolls back
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11620 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: { runner: { name: "ome-container", env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p11620-config", key: "value" } } }] } }
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            readyTimeout: "90s"
            steps:
              - { capacity: "10%", traffic: 10, pause: { duration: "20s" } }
              - { capacity: "30%", traffic: 30, pause: { duration: "20s" } }
              - { capacity: "60%", traffic: 60, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p11620-config }
data: { value: "1" }
