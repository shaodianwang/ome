# p6453: [gen] canary fault-old crashloop:load at capacity engine N=8 s1 rp None victims 3  mode=canary Ne=8 Nd=0 Nr=0 ceil_e=9 ceil_d=0 ceil_r=0 fault=crashloop:canary-staging co=none topo=engine canary=auto form=load victims=3 nophase=Failed cell=canary/Staging/stableBroken[crashLoad]
# reason: 3 old-revision engine Instance(s) die after Ready and come back between crashes while the first step builds canary capacity ahead of any traffic, under restart policy None; the ladder walks every step to Stable inside its budgets, every broken Instance ends on the canary revision serving, no repair is recorded for one after the push, and the healthy Instances keep serving above N-3
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p6453 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 8
    maxReplicas: 8
    annotations: { ome.io/deploymentMode: OMENative }
