# p6551: [gen] canary fault-old crashloop:start at gate pd N=8 s1 rp RecreateInstance victims 1  mode=canary Ne=8 Nd=8 Nr=2 ceil_e=9 ceil_d=9 ceil_r=3 fault=crashloop:canary-serving@1 co=none topo=pd canary=manual form=start victims=1 verbhold=30 nophase=Failed cell=canary/Serving[gate]/stableBroken[crashStart]
# reason: 1 old-revision engine Instance(s) crash at every start while the second step waits at its manual gate, promoted 30s after the break, under restart policy RecreateInstanceOnPodRestart; the ladder walks every step to Stable inside its budgets, every broken Instance ends on the canary revision serving, no repair is recorded for one after the push, and the healthy Instances keep serving above N-1
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p6551 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
