# p11564: [gen] canary fault-old configkey lifted at gate engine-mn W1 router N=2 rp RecreateInstance  mode=canary Ne=2 Nd=0 Nr=2 ceil_e=3 ceil_d=0 ceil_r=2 fault=configkey:canary-serving@1 co=none topo=engine-mn canary=manual verbhold=30 nophase=Failed cell=canary/Serving[gate]/stableBroken[configMissingOnce] lift=after-settle
# reason: one old-revision engine pod waits in CreateContainerConfigError once its ConfigMap key is removed and its runner restarted while the second step waits at its manual gate, promoted 30s after the break on engine+router gang (2 Instances of 1 leader + 1 worker), under restart policy RecreateInstanceOnPodRestart; the key is put back 20s after the wait showed; the ladder walks every step to Stable inside its budgets, the broken Instance ends on the canary revision serving, no repair is opened for it after the push, and the healthy Instances keep serving above N-1
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11564 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: { runner: { name: "ome-container", env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p11564-config", key: "value" } } }] } }
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            readyTimeout: "240s"
            steps:
              - { capacity: "10%", traffic: 10, pause: {  } }
              - { capacity: "30%", traffic: 30, pause: {  } }
              - { capacity: "60%", traffic: 60, pause: {  } }
              - { capacity: "100%", traffic: 100 }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p11564-config }
data: { value: "1" }
