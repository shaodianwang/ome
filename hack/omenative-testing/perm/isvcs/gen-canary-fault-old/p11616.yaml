# p11616: [gen] canary fault-old crashloop:load once at gate pd-mn W1 N=2 rp RecreateInstance  mode=canary Ne=2 Nd=2 Nr=2 ceil_e=3 ceil_d=3 ceil_r=2 fault=crashloop:canary-serving@1 co=none topo=pd-mn canary=manual form=load verbhold=30 nophase=Failed cell=canary/Serving[gate]/stableBroken[restartOnce] once=1
# reason: the runner of one Ready old-revision engine pod is killed exactly once while the second step waits at its manual gate, promoted 30s after the break on engine+decoder+router gang (2 Instances of 1 leader + 1 worker), under restart policy RecreateInstanceOnPodRestart; the kubelet starts it again and the ladder walks every step to Stable with the Instance ending on the canary revision serving, nothing escalates or holds the one restart, no repair is opened for it after the push (its revision is not the roll target), and the healthy Instances keep serving above N-1
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11616 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          canary:
            steps:
              - { capacity: "10%", traffic: 10, pause: {  } }
              - { capacity: "30%", traffic: 30, pause: {  } }
              - { capacity: "60%", traffic: 60, pause: {  } }
              - { capacity: "100%", traffic: 100 }
