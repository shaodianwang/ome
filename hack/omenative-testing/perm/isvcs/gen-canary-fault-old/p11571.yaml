# p11571: [gen] canary fault-old crashloop:load once at soak engine-mn W1 router N=2 rp RecreateInstance  mode=canary Ne=2 Nd=0 Nr=2 ceil_e=3 ceil_d=0 ceil_r=2 fault=crashloop:canary-serving@1 co=none topo=engine-mn canary=auto form=load nophase=Failed cell=canary/Serving[soak]/stableBroken[restartOnce] once=1
# reason: the runner of one Ready old-revision engine pod is killed exactly once while the second step soaks its split on engine+router gang (2 Instances of 1 leader + 1 worker), under restart policy RecreateInstanceOnPodRestart; the kubelet starts it again and the ladder walks every step to Stable with the Instance ending on the canary revision serving, nothing escalates or holds the one restart, no repair is opened for it after the push (its revision is not the roll target), and the healthy Instances keep serving above N-1
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11571 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine]
          canary:
            steps:
              - { capacity: "10%", traffic: 10, pause: { duration: "20s" } }
              - { capacity: "30%", traffic: 30, pause: { duration: "20s" } }
              - { capacity: "60%", traffic: 60, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
