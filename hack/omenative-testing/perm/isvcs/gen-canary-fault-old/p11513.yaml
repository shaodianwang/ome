# p11513: [gen] canary fault-old crashloop:load once at gate engine N=8 rp RecreateInstance  mode=canary Ne=8 Nd=0 Nr=0 ceil_e=9 ceil_d=0 ceil_r=0 fault=crashloop:canary-serving@1 co=none topo=engine canary=manual form=load verbhold=30 nophase=Failed cell=canary/Serving[gate]/stableBroken[restartOnce] once=1
# reason: the runner of one Ready old-revision engine pod is killed exactly once while the second step waits at its manual gate, promoted 30s after the break on engine single (8 Instances), under restart policy RecreateInstanceOnPodRestart; the kubelet starts it again and the ladder walks every step to Stable with the Instance ending on the canary revision serving, nothing escalates or holds the one restart, no repair is opened for it after the push (its revision is not the roll target), and the healthy Instances keep serving above N-1
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p11513 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
