# p12102: [gen] broken configkey waits up1 engine-mn W1 N=2 rp None  mode=scaledown Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 fault=configkey:missing co=none topo=engine-mn during=idle to_e=3 inst=0 expect=waits
# reason: the ConfigMap key the runner of the leader pod of the engine's gang 0 reads is removed and the runner restarted, so its next start waits in CreateContainerConfigError and it serves nothing; the crash-loop repair opens as soon as the wait is seen and rebuilds the pod, which waits on the same key, so the Instance serves nothing while the key is away; once the status reports Instance 0 broken the engine is scaled from 2 to 3: the scale-up is admitted and its new Instance 2, rendered from the same runner, waits on the same missing key with CreateContainerConfigError on its pod and a row that never reads Ready, as the broken Instance does; the healthy Instances keep their pods and keep serving throughout (never below 1 Ready), nothing surges above 3, neither waiting Instance serves across the hold window, and a repair that rebuilds a waiting pod is reported, not judged; the key returns only with the case's teardown; each Instance is a gang of a leader and a worker, counted whole
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p12102 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: { runner: { name: "ome-container", env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p12102-config", key: "value" } } }] } }
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p12102-config }
data: { value: "1" }
