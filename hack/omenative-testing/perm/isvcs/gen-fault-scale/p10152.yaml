# p10152: [gen] broken readiness once down1 engine-mn W1+router N=2 rp None  mode=scaledown Ne=2 Nd=0 Nr=2 ceil_e=2 ceil_d=0 ceil_r=2 fault=readiness:old co=none topo=engine-mn form=recover during=idle to_e=1 inst=0
# reason: the leader pod of the engine's gang 0 stops passing its readiness probe while it keeps running, so it leaves rotation; once the status first reports Instance 0 broken the engine is scaled from 2 to 1 and, once the scale has landed, the readiness switch is lifted and the same pod passes readiness again: the broken Instance 0 goes and Instance 1 stays; the survivors keep their pods and keep serving throughout (never below 1 Ready), no Component surges, and every row settles Ready with no operation open; the router is neither broken nor scaled and keeps its pods; each Instance is a gang of a leader and a worker, counted whole
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10152 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
