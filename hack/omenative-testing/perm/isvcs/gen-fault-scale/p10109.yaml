# p10109: [gen] broken crashloop:start once down1 engine-mn W1 N=2 rp None  mode=scaledown Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 fault=crashloop:old co=none topo=engine-mn form=start during=idle to_e=1 inst=0 lift=after-settle
# reason: the leader pod of the engine's gang 0 is pointed at an image with no shell on the settled service, so it crashes at every start and is never Ready again; once the status first reports Instance 0 broken the engine is scaled from 2 to 1 and, once the scale has landed, the pod is pointed back at the image it ran, where a repair has not rebuilt it first: the broken Instance 0 goes and Instance 1 stays; the survivors keep their pods and keep serving throughout (never below 1 Ready), no Component surges, and every row settles Ready with no operation open; each Instance is a gang of a leader and a worker, counted whole
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10109 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
