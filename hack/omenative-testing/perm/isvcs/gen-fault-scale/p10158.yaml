# p10158: [gen] broken sibling router crashloop:start down1 engine-mn W1+router N=2 rp None  mode=scaledown Ne=2 Nd=0 Nr=2 ceil_e=2 ceil_d=0 ceil_r=2 fault=crashloop:old co=none topo=engine-mn form=start during=idle victimcomp=router to_e=1 inst=0 expect=repaired
# reason: the pod of the router's Instance 0 is pointed at an image with no shell on the settled service, so it crashes at every start and is never Ready again; once the status reports the router's Instance 0 broken the engine is scaled from 2 to 1: the highest engine Instance 1 goes and the rest stay, since the broken Instance is the router's and not the scale's to take; the engine's healthy Instances keep their pods and keep serving throughout, the router's other Instances keep theirs (never below 1 Ready there) and nothing rotates or surges on the router; the router's Instance 0 is rebuilt, every pod new, Ready and serving on its running revision, by the crash-loop repair a RestartTriggered event names (a pod parked in CrashLoopBackOff past the stuck-pod grace is a wedge it rebuilds under every restart policy); every row settles Ready with no operation open; the engine is the negative control of the router's break: the scale is its only change; each engine Instance is a gang of a leader and a worker, counted whole
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10158 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
