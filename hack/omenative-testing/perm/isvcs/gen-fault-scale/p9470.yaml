# p9470: [gen] broken crashloop:load once down1 engine N=4 rp None  mode=scaledown Ne=4 Nd=0 Nr=0 ceil_e=4 ceil_d=0 ceil_r=0 fault=crashloop:old co=none topo=engine form=load during=idle to_e=3 inst=0 lift=after-settle
# reason: the pod of the engine's Instance 0 has its runner killed every few seconds while it is up, so it dies after Ready and comes back between crashes; once the status first reports Instance 0 broken the engine is scaled from 4 to 3 and, once the scale has landed, the killer stops and the kubelet's restart of the runner is the last: the broken Instance 0 goes and Instances 1, 2 and 3 stay; the survivors keep their pods and keep serving throughout (never below 3 Ready), no Component surges, and every row settles Ready with no operation open
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9470 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
