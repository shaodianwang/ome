# p10169: [gen] broken sibling router crashloop:start once up1 engine-mn W1+router N=2 rp None  mode=scaledown Ne=2 Nd=0 Nr=2 ceil_e=3 ceil_d=0 ceil_r=2 fault=crashloop:old co=none topo=engine-mn form=start during=idle victimcomp=router to_e=3 inst=0 lift=after-settle expect=heals
# reason: the pod of the router's Instance 0 is pointed at an image with no shell on the settled service, so it crashes at every start and is never Ready again; once the status reports the router's Instance 0 broken the engine is scaled from 2 to 3: a new engine Instance 2 comes up on the running revision and serves, nothing surges above 3; the engine's healthy Instances keep their pods and keep serving throughout, the router's other Instances keep theirs (never below 1 Ready there) and nothing rotates or surges on the router; once the scale has landed, the pod is pointed back at the image it ran, where a repair has not rebuilt it first and the router's Instance 0 is Ready and serving again on its running revision, the same pod started again or rebuilt by a repair recorded at most once; every row settles Ready with no operation open; the engine is the negative control of the router's break: the scale is its only change; each engine Instance is a gang of a leader and a worker, counted whole
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10169 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
