# p9415: [gen] broken imagepull down2 engine+router N=4 rp None co none  mode=scaledown Ne=4 Nd=0 Nr=2 ceil_e=4 ceil_d=0 ceil_r=2 fault=imagepull:old co=none topo=engine during=idle to_e=2 inst=0
# reason: the pod of the engine's Instance 0 is pointed at an image that cannot be pulled on the settled service, so the kubelet parks it in ImagePullBackOff and it is never Ready again; once the status reports Instance 0 broken the engine is scaled from 4 to 2: the broken Instance 0 goes first, then the highest healthy Instance 3; Instances 1 and 2 stay; the survivors keep their pods and keep serving throughout (never below 2 Ready), nothing is rebuilt during the scale, no Component surges, and every row settles Ready with no operation open; the router is neither broken nor scaled and keeps its pods
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9415 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
