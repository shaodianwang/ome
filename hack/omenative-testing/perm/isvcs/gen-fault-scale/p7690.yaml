# p7690: [gen] broken crashloop:load down1 engine-mn W1 N=2 rp RecreateInstance co none  mode=scaledown Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 fault=crashloop:old co=none topo=engine-mn form=load during=idle to_e=1 inst=0
# reason: the leader pod of the engine's gang 0 has its runner killed every few seconds while it is up, so it dies after Ready and comes back between crashes; once the status reports Instance 0 broken the engine is scaled from 2 to 1: the broken Instance 0 goes and Instance 1 stays; the survivors keep their pods and keep serving throughout (never below 1 Ready), nothing is rebuilt during the scale, no Component surges, and every row settles Ready with no operation open; each Instance is a gang of a leader and a worker, counted whole
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7690 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
