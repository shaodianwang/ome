# p10190: [gen] broken sibling decoder crashloop:start up1 pd-mn W1 N=2 rp None  mode=scaledown Ne=2 Nd=2 Nr=2 ceil_e=3 ceil_d=2 ceil_r=2 fault=crashloop:old co=none topo=pd-mn form=start during=idle victimcomp=decoder to_e=3 inst=0 expect=repaired
# reason: the leader pod of the decoder's gang 0 is pointed at an image with no shell on the settled service, so it crashes at every start and is never Ready again; once the status reports the decoder's Instance 0 broken the engine is scaled from 2 to 3: a new engine Instance 2 comes up on the running revision and serves, nothing surges above 3; the engine's healthy Instances keep their pods and keep serving throughout, the decoder's other Instances keep theirs (never below 1 Ready there) and nothing rotates or surges on the decoder; the decoder's Instance 0 is rebuilt, every pod new, Ready and serving on its running revision, by the crash-loop repair a RestartTriggered event names (a pod parked in CrashLoopBackOff past the stuck-pod grace is a wedge it rebuilds under every restart policy); every row settles Ready with no operation open; the engine is the negative control of the decoder's break: the scale is its only change; each engine Instance is a gang of a leader and a worker, counted whole
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10190 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
