# p12103: [gen] broken configkey waits up1 engine+router N=4 rp None  mode=scaledown Ne=4 Nd=0 Nr=2 ceil_e=5 ceil_d=0 ceil_r=2 fault=configkey:missing co=none topo=engine during=idle to_e=5 inst=0 expect=waits
# reason: the ConfigMap key the runner of the pod of the engine's Instance 0 reads is removed and the runner restarted, so its next start waits in CreateContainerConfigError and it serves nothing; the crash-loop repair opens as soon as the wait is seen and rebuilds the pod, which waits on the same key, so the Instance serves nothing while the key is away; once the status reports Instance 0 broken the engine is scaled from 4 to 5: the scale-up is admitted and its new Instance 4, rendered from the same runner, waits on the same missing key with CreateContainerConfigError on its pod and a row that never reads Ready, as the broken Instance does; the healthy Instances keep their pods and keep serving throughout (never below 3 Ready), nothing surges above 5, neither waiting Instance serves across the hold window, and a repair that rebuilds a waiting pod is reported, not judged; the key returns only with the case's teardown; the router is neither broken nor scaled and keeps its pods
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p12103 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    runner: { env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p12103-config", key: "value" } } }] }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p12103-config }
data: { value: "1" }
