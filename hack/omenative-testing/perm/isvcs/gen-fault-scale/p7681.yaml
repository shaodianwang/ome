# p7681: [gen] broken readiness down2 pd N=4 rp None co rolling  mode=scaledown Ne=4 Nd=4 Nr=2 ceil_e=4 ceil_d=4 ceil_r=2 fault=readiness:old co=rolling topo=pd form=persist during=idle to_e=2 inst=0
# reason: the pod of the engine's Instance 0 stops passing its readiness probe while it keeps running, so it leaves rotation; once the status reports Instance 0 broken the engine is scaled from 4 to 2: the broken Instance 0 goes first, then the highest healthy Instance 3; Instances 1 and 2 stay; the survivors keep their pods and keep serving throughout (never below 2 Ready), nothing is rebuilt during the scale, no Component surges, and every row settles Ready with no operation open; decoder and router are neither broken nor scaled and stay as they were; the rollingUpdate group lists engine and decoder, and a scale is not a run it paces
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7681 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  rollout:
    groups:
        - components: [engine, decoder]
          rollingUpdate: {}
