# p7646: [gen] broken imagepull toone pd N=4 rp None co none  mode=scaledown Ne=4 Nd=4 Nr=2 ceil_e=4 ceil_d=4 ceil_r=2 fault=imagepull:old co=none topo=pd during=idle to_e=1 inst=0
# reason: the pod of the engine's Instance 0 is pointed at an image that cannot be pulled on the settled service, so the kubelet parks it in ImagePullBackOff and it is never Ready again; once the status reports Instance 0 broken the engine is scaled from 4 to 1: the broken Instance 0 goes first, then the highest healthy Instances 3 and 2; Instance 1 stays; the survivors keep their pods and keep serving throughout (never below 1 Ready), nothing is rebuilt during the scale, no Component surges, and every row settles Ready with no operation open; decoder and router are neither broken nor scaled and stay as they were
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p7646 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
