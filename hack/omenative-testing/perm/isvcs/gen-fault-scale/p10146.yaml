# p10146: [gen] broken sibling router crashloop:start up1 engine+router N=4 rp None  mode=scaledown Ne=4 Nd=0 Nr=2 ceil_e=5 ceil_d=0 ceil_r=2 fault=crashloop:old co=none topo=engine form=start during=idle victimcomp=router to_e=5 inst=0 expect=repaired
# reason: the pod of the router's Instance 0 is pointed at an image with no shell on the settled service, so it crashes at every start and is never Ready again; once the status reports the router's Instance 0 broken the engine is scaled from 4 to 5: a new engine Instance 4 comes up on the running revision and serves, nothing surges above 5; the engine's healthy Instances keep their pods and keep serving throughout, the router's other Instances keep theirs (never below 1 Ready there) and nothing rotates or surges on the router; the router's Instance 0 is rebuilt, every pod new, Ready and serving on its running revision, by the crash-loop repair a RestartTriggered event names (a pod parked in CrashLoopBackOff past the stuck-pod grace is a wedge it rebuilds under every restart policy); every row settles Ready with no operation open; the engine is the negative control of the router's break: the scale is its only change
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10146 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
