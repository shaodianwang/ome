# p9421: [gen] broken imagepull up1 engine+router N=4 rp RecreateInstance co none  mode=scaledown Ne=4 Nd=0 Nr=2 ceil_e=5 ceil_d=0 ceil_r=2 fault=imagepull:old co=none topo=engine during=idle to_e=5 inst=0 expect=repaired
# reason: the pod of the engine's Instance 0 is pointed at an image that cannot be pulled on the settled service, so the kubelet parks it in ImagePullBackOff and it is never Ready again; once the status reports Instance 0 broken the engine is scaled from 4 to 5: a new Instance 4 comes up on the running revision and serves, the healthy Instances keep their pods and never leave rotation (never below 3 Ready), nothing surges above 5, and the broken Instance is rebuilt, every pod new, Ready and serving on its running revision, and a RestartTriggered event names it: a pod parked in ImagePullBackOff past the stuck-pod grace is a wedge the crash-loop repair rebuilds under every restart policy; under RecreateInstanceOnPodRestart the kubelet's kill of the running container ahead of the failed pull reads as a runner restart after Ready and triggers it at once; the router is neither broken nor scaled and keeps its pods
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p9421 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "RecreateInstanceOnPodRestart", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
