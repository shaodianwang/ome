# p10170: [gen] broken configkey down1 pd-mn W1 N=2 rp None  mode=scaledown Ne=2 Nd=2 Nr=2 ceil_e=2 ceil_d=2 ceil_r=2 fault=configkey:missing co=none topo=pd-mn during=idle to_e=1 inst=0
# reason: the ConfigMap key the runner of the leader pod of the engine's gang 0 reads is removed and the runner restarted, so its next start waits in CreateContainerConfigError and it serves nothing; the crash-loop repair opens as soon as the wait is seen and rebuilds the pod, which waits on the same key, so the Instance serves nothing while the key is away; once the status reports Instance 0 broken the engine is scaled from 2 to 1: the broken Instance 0 goes and Instance 1 stays; the survivors keep their pods and keep serving throughout (never below 1 Ready), no Component surges, and every row settles Ready with no operation open; the key returns only with the case's teardown; decoder and router are neither broken nor scaled and stay as they were; each Instance is a gang of a leader and a worker, counted whole
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p10170 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-multinode, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: { runner: { name: "ome-container", env: [{ name: "TEST_CONFIG_VALUE", valueFrom: { configMapKeyRef: { name: "p10170-config", key: "value" } } }] } }
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    leader: {}
    worker: { size: 1 }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p10170-config }
data: { value: "1" }
