# p324: REJECT analysis step with no metrics (MinItems=1)  mode=canary expect=reject Ne=4 Nd=0 Nr=0 ceil_e=5 ceil_d=0 ceil_r=0 topo=engine
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p324 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
  rollout:
    groups:
        # analysis with an empty metrics list -> CRD MinItems=1 denies the apply.
        - components: [engine]
          canary:
            steps:
              - { capacity: "100%", traffic: 100, analysis: { interval: "20s", failureLimit: 1, metrics: [] } }
