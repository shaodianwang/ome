# p329: REJECT canary group splitting a declared P/D pair (group=[router,engine])  mode=canary expect=reject reason=CanaryInvalid Ne=4 Nd=4 Nr=2 ceil_e=5 ceil_d=5 ceil_r=3 topo=pd
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p329 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
  rollout:
    groups:
        # Engine and decoder are ONE unit on an ISVC that declares both: they
        # speak a pairing protocol to each other, so rolling the engine without
        # the decoder can leave a new-protocol prefill with no pairable decode
        # and fail requests outright -> CanaryInvalid.
        - components: [router, engine]
          canary:
            steps:
              - { capacity: "50%", traffic: 50, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
