# p320: REJECT canary group missing its unit entrypoint (group=[decoder], engine unit)  mode=canary expect=reject reason=CanaryInvalid Ne=4 Nd=4 Nr=2 ceil_e=5 ceil_d=5 ceil_r=3 topo=pd
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p320 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
  decoder:
    minReplicas: 4
    maxReplicas: 4
    annotations: { ome.io/deploymentMode: OMENative }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
  rollout:
    groups:
        # The decoder is a SECONDARY of the engine unit, not a unit of its own.
        # A group that names it without the engine has no Component to drive the
        # step machine and traffic weight through -> CanaryInvalid.
        - components: [decoder]
          canary:
            steps:
              - { capacity: "50%", traffic: 50, pause: { duration: "20s" } }
              - { capacity: "100%", traffic: 100 }
