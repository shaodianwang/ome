# p8038: [gen] size N=2 push engine InPlaceIfPossible u1  Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 co=none topo=engine
# reason: a plain push on 2 Instances with maxUnavailable 1: the bump is an annotation diff, so the engine patches each pod in place (same UID, no surge above 2); the budget lets one Instance at a time be out of rotation while it is patched, and every Instance ends Ready on the new revision
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8038 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "InPlaceIfPossible", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
