# p8079: [gen] size scale pd 2->1 InPlaceIfPossible  mode=scaledown Ne=2 Nd=2 Nr=2 ceil_e=2 ceil_d=2 ceil_r=2 co=none topo=pd to_e=1 to_d=1 to_r=2
# reason: the fleet is scaled from 2 to 1 Instances per Component: only index 1 is removed; index 0 keeps its pod (same UID) and serves throughout, so capacity never drops below min(start, target) = 1 and nothing surges above 2; the update strategy (InPlaceIfPossible) is dormant under a scale and rebuilds nothing; engine and decoder scale together and the router holds at its count
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8079 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "InPlaceIfPossible", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
