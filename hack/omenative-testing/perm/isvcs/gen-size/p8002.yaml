# p8002: [gen] size N=1 push engine RecreatePod u1  Ne=1 Nd=0 Nr=0 ceil_e=1 ceil_d=0 ceil_r=0 co=none topo=engine
# reason: a plain push on one Instance with maxUnavailable 1: the single Instance is drained and rebuilt at the new revision, so zero serving while it is down is the configured outcome of this budget at this size; it comes back Ready and serving on the new revision with no surge above 1
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8002 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 1
    maxReplicas: 1
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
