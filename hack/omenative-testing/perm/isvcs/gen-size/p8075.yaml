# p8075: [gen] size scale engine 2->1 RecreatePod  mode=scaledown Ne=2 Nd=0 Nr=0 ceil_e=2 ceil_d=0 ceil_r=0 co=none topo=engine to_e=1
# reason: the fleet is scaled from 2 to 1 Instances per Component: only index 1 is removed; index 0 keeps its pod (same UID) and serves throughout, so capacity never drops below min(start, target) = 1 and nothing surges above 2; the update strategy (RecreatePod) is dormant under a scale and rebuilds nothing
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8075 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
