# p8009: [gen] size N=1 crashloop start engine RecreatePod u1 rp None  Ne=1 Nd=0 Nr=0 ceil_e=1 ceil_d=0 ceil_r=0 fault=crashloop:old floor_soft=1 co=none topo=engine form=start
# reason: one old-revision engine pod is pointed at an image with no shell as the bump lands, so it crashes at every start and is never Ready again; its Instance is the only one, so it is both the first and the last the roll reaches, and the roll owns it from that moment: the recreate drains it and rebuilds the Instance at the fixed revision, no repair is recorded for it after the bump under restart policy None, and it ends on the new revision serving; the single Instance serves nothing from the break until its rebuild is Ready, the configured outcome at this size; floor waived — the crash itself costs settled capacity for the length of the roll
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8009 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 1
    maxReplicas: 1
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { restartPolicy: "None", updateStrategy: { type: "RecreatePod", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
