# p8021: [gen] size N=1 push pd InPlaceIfPossible u1  Ne=1 Nd=1 Nr=1 ceil_e=1 ceil_d=1 ceil_r=1 co=none topo=pd
# reason: a plain push on one Instance with maxUnavailable 1: the bump is an annotation diff, so the engine patches the pod in place (same UID, no surge above 1); the budget lets the single Instance be out of rotation while it is patched, and it ends Ready on the new revision; decoder and router are negative controls (co=none), sized with the fleet
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8021 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 1
    maxReplicas: 1
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "InPlaceIfPossible", rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
  decoder:
    minReplicas: 1
    maxReplicas: 1
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 1
    maxReplicas: 1
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
