# p8034: [gen] size N=2 push engine SurgeThenDrain s1  Ne=2 Nd=0 Nr=0 ceil_e=3 ceil_d=0 ceil_r=0 floor_hard=1 co=none topo=engine
# reason: a plain push on 2 Instances per Component with maxSurge 1: the new revision comes up beside the running ones (peak 3) and each Instance is drained only once its replacement serves, so capacity never drops below 2 and at least one Instance always serves; every Instance ends on the new revision
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8034 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 2
    maxReplicas: 2
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
