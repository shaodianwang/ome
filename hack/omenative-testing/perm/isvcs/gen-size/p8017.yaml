# p8017: [gen] size N=1 push pd SurgeThenDrain s1  Ne=1 Nd=1 Nr=1 ceil_e=2 ceil_d=1 ceil_r=1 floor_hard=1 co=none topo=pd
# reason: a plain push on one Instance per Component with maxSurge 1: the new revision comes up beside the running one (peak 2) and the single Instance is drained only once its replacement serves, so capacity never drops below 1 and the service is never left with zero serving; every Instance ends on the new revision; decoder and router are negative controls (co=none), sized with the fleet
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata: { name: p8017 }
spec:
  model:   { apiGroup: ome.io, kind: ClusterBaseModel,      name: ome-coordtest-noop }
  runtime: { apiGroup: ome.io, kind: ClusterServingRuntime, name: ome-coordtest-cpu, autoSync: true }
  engine:
    minReplicas: 1
    maxReplicas: 1
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  decoder:
    minReplicas: 1
    maxReplicas: 1
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
  router:
    minReplicas: 1
    maxReplicas: 1
    annotations: { ome.io/deploymentMode: OMENative }
    lifecycle: { updateStrategy: { type: "SurgeThenDrain", rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } } }
