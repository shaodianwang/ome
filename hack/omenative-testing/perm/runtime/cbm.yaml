# Test ClusterBaseModel — noop format, points at a tiny 1Mi PVC.
# No real model bytes; the runtime is nginx and doesn't read the model.
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: ome-coordtest-noop
  labels:
    ome-coordtest/managed: "true"
spec:
  modelArchitecture: TestArchitecture
  modelFormat:    { name: noop, operator: Equal, version: "1.0.0", weight: 1 }
  modelFramework: { name: noop, operator: Equal,                  weight: 1 }
  modelParameterSize: "0"
  modelType: test
  storage:
    # A ClusterBaseModel is cluster-scoped, so the PVC's namespace has to be
    # named here; runtime_fixtures.py substitutes $OME_TEST_NS, the namespace
    # the cases run in. OME's CBM finalizer mounts the PVC read-only via a
    # short-lived metadata-extraction Job to validate the BaseModel. The
    # serving runtime is nginx and never reads the model.
    storageUri: pvc://${OME_TEST_NS}:ome-coordtest-noop-pvc/.
