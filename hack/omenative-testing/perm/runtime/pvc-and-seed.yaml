# 1Mi PVC the ClusterBaseModel references, plus a one-shot Job that writes
# a minimal config.json so OME's CBM finalizer thinks the model is valid.
# Apply once per cluster (idempotent — re-apply is fine).
#
# The placeholders here are substituted by runtime_fixtures.py; this file is a
# template, not directly appliable. The namespace must match $OME_TEST_NS:
# pods cannot mount a PVC from another namespace, and the OME validating
# webhook rejects an InferenceService whose model points at one that does.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ome-coordtest-noop-pvc
  namespace: ${OME_TEST_NS}
  labels:
    ome-coordtest/managed: "true"
spec:
  accessModes: [${OME_EVAL_PVC_ACCESS_MODE}]
  resources:
    requests: { storage: 1Mi }
  storageClassName: ${OME_EVAL_STORAGE_CLASS}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ome-coordtest-noop-seed
  namespace: ${OME_TEST_NS}
  labels:
    ome-coordtest/managed: "true"
spec:
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector: { kubernetes.io/arch: ${OME_EVAL_NODE_ARCH} }
      containers:
        - name: seed
          image: ${OME_EVAL_NGINX_IMAGE}
          command:
            - sh
            - -c
            - |
              cat > /m/config.json <<'JSON'
              {"architectures":["TestArchitecture"],"model_type":"test","hidden_size":1,"num_attention_heads":1,"num_hidden_layers":1,"vocab_size":1,"torch_dtype":"float32"}
              JSON
              echo "seed written"
          volumeMounts:
            - { name: m, mountPath: /m }
      volumes:
        - name: m
          persistentVolumeClaim: { claimName: ome-coordtest-noop-pvc }
