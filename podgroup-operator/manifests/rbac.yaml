apiVersion: v1
kind: ServiceAccount
metadata:
  name: podgroup-operator
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: podgroup-operator
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["podgroup.meta.com"]
  resources: ["podgroupdeployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["podgroup.meta.com"]
  resources: ["podgroupdeployments/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["podgroup.meta.com"]
  resources: ["podgroupdeploymentrollouts"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["podgroup.meta.com"]
  resources: ["podgroupdeploymentrollouts/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["scheduling.x-k8s.io"]
  resources: ["podgroups"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: podgroup-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: podgroup-operator
subjects:
- kind: ServiceAccount
  name: podgroup-operator
  namespace: kube-system
