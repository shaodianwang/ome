apiVersion: apps/v1
kind: Deployment
metadata:
  name: podgroup-operator
  namespace: kube-system
  labels:
    app.kubernetes.io/name: podgroup-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: podgroup-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podgroup-operator
    spec:
      serviceAccountName: podgroup-operator
      containers:
      - name: podgroup-operator
        image: podgroup-operator:latest
        imagePullPolicy: Never
        args:
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        ports:
        - name: metrics
          containerPort: 8080
        - name: healthz
          containerPort: 8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
        readinessProbe:
          httpGet:
            path: /readyz
            port: healthz
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      tolerations:
      - key: control-plane
        operator: Equal
        value: "true"
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
