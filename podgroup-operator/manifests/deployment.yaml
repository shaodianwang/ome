apiVersion: apps/v1
kind: Deployment
metadata:
  name: podgroup-operator
  namespace: kube-system
  labels:
    app.kubernetes.io/name: podgroup-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: podgroup-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podgroup-operator
    spec:
      serviceAccountName: podgroup-operator
      containers:
      - name: podgroup-operator
        image: podgroup-operator:latest
        imagePullPolicy: Never
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      tolerations:
      - key: control-plane
        operator: Equal
        value: "true"
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
