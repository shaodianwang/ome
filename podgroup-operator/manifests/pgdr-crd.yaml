apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: podgroupdeploymentrollouts.podgroup.meta.com
spec:
  group: podgroup.meta.com
  scope: Namespaced
  names:
    plural: podgroupdeploymentrollouts
    singular: podgroupdeploymentrollout
    kind: PodGroupDeploymentRollout
    shortNames:
    - pgdr
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Mode
      type: string
      jsonPath: .spec.mode
    - name: Wave
      type: integer
      jsonPath: .status.currentWave
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Step
      type: string
      jsonPath: .status.currentPhase
      priority: 1
    - name: Actions
      type: string
      jsonPath: .status.actions
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - mode
            properties:
              mode:
                type: string
                enum:
                - disagg
                - unified
              strategy:
                type: object
                properties:
                  maxUnavailablePercent:
                    type: integer
                    format: int32
                    minimum: 1
                    maximum: 100
                    default: 20
                  maxSkew:
                    type: integer
                    format: int32
                    minimum: 0
                    maximum: 0
                    default: 0
              base:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              prefill:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              decode:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              unified:
                type: object
                x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
    subresources:
      status: {}
