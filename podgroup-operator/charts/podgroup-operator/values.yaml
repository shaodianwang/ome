replicaCount: 1

image:
  repository: 588845226011.dkr.ecr.us-east-2.amazonaws.com/msl_infra/podgroup-operator
  tag: "0.1.10"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

metrics:
  bindAddress: ":8080"

healthProbe:
  bindAddress: ":8081"

leaderElection:
  enabled: false

nodeSelector: {}
tolerations: []
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/arch
          operator: In
          values:
          - amd64
topologySpreadConstraints: []
priorityClassName: ""

schedulerRbac:
  enabled: true
  subjects:
  - kind: User
    name: system:kube-scheduler
  - kind: User
    name: system:kube-scheduler:coscheduler
