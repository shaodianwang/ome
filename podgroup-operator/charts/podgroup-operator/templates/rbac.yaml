apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "podgroup-operator.fullname" . }}
  labels:
    {{- include "podgroup-operator.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["podgroup.meta.com"]
  resources: ["podgroupdeployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["podgroup.meta.com"]
  resources: ["podgroupdeployments/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["podgroup.meta.com"]
  resources: ["podgroupdeploymentrollouts"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["podgroup.meta.com"]
  resources: ["podgroupdeploymentrollouts/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["scheduling.x-k8s.io"]
  resources: ["podgroups"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "podgroup-operator.fullname" . }}
  labels:
    {{- include "podgroup-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "podgroup-operator.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "podgroup-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
