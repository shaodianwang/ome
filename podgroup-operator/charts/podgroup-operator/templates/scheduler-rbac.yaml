{{- if .Values.schedulerRbac.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "podgroup-operator.fullname" . }}-scheduler
  labels:
    {{- include "podgroup-operator.labels" . | nindent 4 }}
rules:
- apiGroups: ["scheduling.x-k8s.io"]
  resources: ["podgroups"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "podgroup-operator.fullname" . }}-scheduler
  labels:
    {{- include "podgroup-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "podgroup-operator.fullname" . }}-scheduler
subjects:
{{- range .Values.schedulerRbac.subjects }}
- kind: {{ .kind }}
  name: {{ .name }}
  {{- if .apiGroup }}
  apiGroup: {{ .apiGroup }}
  {{- else if eq .kind "User" }}
  apiGroup: rbac.authorization.k8s.io
  {{- end }}
  {{- if .namespace }}
  namespace: {{ .namespace }}
  {{- end }}
{{- end }}
{{- end }}
