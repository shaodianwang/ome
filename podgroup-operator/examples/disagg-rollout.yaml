apiVersion: podgroup.meta.com/v1alpha1
kind: PodGroupDeploymentRollout
metadata:
  name: sglang-pd
  namespace: podgroup-demo
spec:
  mode: disagg
  strategy:
    maxUnavailablePercent: 25
    maxSkew: 0
  prefill:
    groups: 8
    replicasPerGroup: 1
    topologyKey: ds.coreweave.com/nvlink.domain
    serviceTargetOrdinal: 0
    scheduleTimeoutSeconds: 60
    updateStrategy:
      type: RecreatePod
      rollingUpdate:
        maxSurge: 0
        maxUnavailablePercent: 25
    template:
      metadata:
        labels:
          app.kubernetes.io/component: sglang-prefill
      spec:
        terminationGracePeriodSeconds: 1
        tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
        containers:
        - name: prefill
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          ports:
          - name: http
            containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
              nvidia.com/gpu: "4"
            limits:
              nvidia.com/gpu: "4"
  decode:
    groups: 4
    replicasPerGroup: 1
    topologyKey: ds.coreweave.com/nvlink.domain
    serviceTargetOrdinal: 0
    scheduleTimeoutSeconds: 60
    updateStrategy:
      type: RecreatePod
      rollingUpdate:
        maxSurge: 0
        maxUnavailablePercent: 25
    template:
      metadata:
        labels:
          app.kubernetes.io/component: sglang-decode
      spec:
        terminationGracePeriodSeconds: 1
        tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
        containers:
        - name: decode
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          ports:
          - name: http
            containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
              nvidia.com/gpu: "4"
            limits:
              nvidia.com/gpu: "4"
