apiVersion: podgroup.meta.com/v1alpha1
kind: PodGroupDeployment
metadata:
  name: gpu-nvlink
  namespace: podgroup-demo
spec:
  groups: 2
  replicasPerGroup: 2
  updateStrategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  topologyKey: ds.coreweave.com/nvlink.domain
  serviceTargetOrdinal: 0
  scheduleTimeoutSeconds: 60
  template:
    metadata:
      labels:
        app.kubernetes.io/component: gpu-worker
    spec:
      terminationGracePeriodSeconds: 1
      tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: "true"
        effect: NoSchedule
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh", "-c", "sleep 3600"]
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
            nvidia.com/gpu: "4"
          limits:
            nvidia.com/gpu: "4"
