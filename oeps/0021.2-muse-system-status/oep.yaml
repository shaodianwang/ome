# Follows OEP-0021 (the MUSE read+write layer). This follow-up adds a read-only,
# admin-facing view of OME's *own* system components — the controller manager, the
# scheduler, the admission webhook, the model-agent DaemonSet — per aggregated
# cluster. It reads apps/v1 Deployments/DaemonSets from informer caches (never a
# per-request apiserver call) and derives a health rollup. The set of components
# is entirely config-driven: no component name, namespace, or label selector is
# baked into the binary.
see-also:
