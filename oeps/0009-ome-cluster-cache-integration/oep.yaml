feature-gates:
  - name: ClusterCacheBackedWeights
    description: |
      Enables an optional Sharded distribution for BaseModel /
      ClusterBaseModel, served via cluster_cache. When disabled (or
      when a BaseModel does not opt in via spec.distribution), the
      existing model-agent per-node-download behavior is unchanged.
disable-supported: true

