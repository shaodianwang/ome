# A new control-plane object (TrafficMap) is the routing projection of an
# InferenceService's multi-cluster placement: one per ISVC, controller-generated
# from status.placement + AcceleratorQuota allocation, consumed by a
# gateway-neutral publisher. Placement decides WHERE, quota decides HOW MUCH,
# TrafficMap decides the WEIGHTS. Both weight inputs -- a home's capacity and
# whether it is serving -- default to control-plane state and may each be refined
# by an observed signal: endpoint-reported capacity (a ceiling, never a raise) and
# an active end-to-end health probe. Opt-in via Helm; SMG is one optional backend.
see-also:
  - "/oeps/0018-multi-cluster-placement"   # placement race + per-home status.placement this projects from
  - "/oeps/0018.3-placement-modes"         # Single/All/Split; Split apportions the replicas we weight by
  - "/oeps/0024-quota"                      # AcceleratorQuota is the capacity denominator for weights
  - "/oeps/0011-inference-traffic-policy"   # L7 policy (headers/retries/hash) is orthogonal to home weights
  - "/oeps/0023-inferenceservice-status-urls" # per-home endpoint URLs TrafficMap references
  - "/oeps/0019-control-plane-split"        # the routing controller runs in the control plane

