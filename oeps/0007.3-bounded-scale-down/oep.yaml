# This proposal narrows and hardens the Delete path defined by OEP-0007. The
# 0007.2 follow-up was merged into the 0007.1 document, so this proposal uses
# 0007.3 rather than reusing that designation. It uses the InferenceReplica
# scale target introduced by OEP-0013 and preserves the rollout ordering
# defined by OEP-0017.
see-also:
  - "/oeps/0007-omenative-workload-strategy"
  - "/oeps/0007.1-omenative-coordinated-rollout"
  - "/oeps/0013-autoscaling"
  - "/oeps/0017-unified-rollout-v2"

stage: alpha

latest-milestone: "alpha"

milestone:
  alpha: "2026-08-16"
  beta: "TBD"
  stable: "TBD"

# An absent ConfigMap field disables pacing but retains batching and safety
# ordering. No binary feature gate is required.
feature-gates: []
disable-supported: true

