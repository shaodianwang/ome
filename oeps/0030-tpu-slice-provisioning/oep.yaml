title: Slice provisioning for OME TPU workloads
oep-number: "0030"
authors:
  - "@yan9fan"
status: implemented
# state: pkg/controller/v1beta1/sliceprovision provisions and releases slices for ISVCs that opt in with ome.io/tpu-slice-provisioning (lifecycle #1706, wired into the InferenceReplica engine #1710), on pkg/tpuslice shape derivation (#1702) and the GKE slice client (#1703); multi-host shapes with gang placement, unusable-host reprovisioning (#1905, #1984), lost and moved slice rebuilds (#2105, #2224) and slice lifecycle metrics (#1731, #1745, #1748). Beta's week-long zero-leak measurement is not done
# A 4-chip OME pod requires a matching 2x2x1 partition. Recommends Option 1
# (ome-controller provisions, ome-scheduler places): slice creation is a slow
# control-plane call and must stay out of the pod-binding path. Open Question 1
# is the only fact that would move it to Option 2.
creation-date: 2026-09-25
reviewers:
  - TBD
approvers:
  - TBD

see-also:
  - "/oeps/0022-ome-scheduler"  # topology-aware placement ONTO existing slices; this OEP is about creating them

# Alpha would be one shape (2x2x1), single-host, opt-in per ISVC on a test cluster.
stage: alpha

latest-milestone: "alpha"

milestone:
  alpha: "2026-09-28"
  beta: "TBD"
  stable: "TBD"

# Opt-in per ISVC during alpha; absence of PROVISION_ONLY on the candidate nodes
# short-circuits all slice work, so static pools are unaffected by construction.
feature-gates: []
disable-supported: true

# Slice lifecycle is the thing that can leak hardware, so it is the thing that
# must be counted. A slice deleted or moved from outside while its pods run counts
# as lost; a release held back while another workload's pods hold chips on its
# hosts counts as deferred.
metrics:
  - ome_tpu_slice_created_total
  - ome_tpu_slice_released_total
  - ome_tpu_slice_create_failures_total
  - ome_tpu_slice_release_deferred_total
  - ome_tpu_slice_lost_total
  - ome_tpu_slice_provision_duration_seconds
