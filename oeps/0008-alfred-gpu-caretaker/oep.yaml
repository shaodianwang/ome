replaces:
  - "ome-operator/alfred (archived repository, auto-patch/auto-repair focus) — its node-health reaction is partially realized here as Policy #2 (evacuate + signal)"

# The target maturity stage in the current dev cycle.
stage: alpha

latest-milestone: "alpha"

milestone:
  alpha: "2026-09-26"
  beta: "TBD"
  stable: "TBD"

feature-gates:
  - name: AlfredCaretaker
    description: |
      Enables the Alfred GPU Cluster Caretaker controller as an optional
      component of the OME deployment. When disabled, Alfred does not
      observe or act on the cluster. Individual policies (defragmentation,
      node-health) are toggled per-policy in Alfred's ConfigMap.
disable-supported: true

# Existing recommendation/migration metrics gain a `policy` label
# (e.g. policy=defragmentation|node-health) so per-policy behavior is
# distinguishable on one dashboard.
metrics:
  - alfred_cluster_fragmentation_score
  - alfred_node_fragmentation_score
  - alfred_recommendations_produced_total          # labels: policy
  - alfred_recommendations_accepted_total          # labels: policy
  - alfred_recommendations_rejected_total          # labels: policy
  - alfred_migration_calls_total                   # labels: policy
  - alfred_migration_outcome_total                 # labels: policy
  - alfred_observation_loop_duration_seconds
  # Policy #2 — node-health evacuation
  - alfred_nodehealth_evacuations_total            # labels: node, outcome
  - alfred_nodehealth_signals_total                # labels: node, reason
