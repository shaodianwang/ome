# state: alfred deployed from charts/ome-resources/templates/alfred at the image pinned by .alfred-oss-ref (#1676) and driven black-box by tests/integration/singlecluster/controller/alfred_kind (#1688): defrag, node-health evacuation, arbitration, recommend-only default. The caretaker engine itself lives outside this repo; only the alfred.ome.io annotations are in pkg/constants
creation-date: 2026-04-16
last-revised: 2026-06-04
