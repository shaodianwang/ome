title: "InferenceReplica as a public API, InferenceService as composition"
oep-number: "0026"
authors:
  - "@slin1237"
status: provisional
# state: design only; no code. The IR is still controller-only (pkg/webhook/admission/inferencereplica gates on ome.io/controller-write).
# The number 0026 was used once before by a draft ("deployment mode transitions", branch
# feat/oep-0026-deployment-mode-transitions) that was withdrawn and never merged; this is the only 0026 on main.
creation-date: 2026-09-21
reviewers:
  - TBD
approvers:
  - TBD

# InferenceReplica (IR) already has its own controller, status, scale subresource,
# revisions, update strategies, pause and the frozen state machine behind every
# cell. Three things keep it internal: only the InferenceService creates one,
# parentRef/component assume a parent, and the InferenceService controller is the
# writer of its spec. This OEP removes those three things and turns the
# InferenceService into the composition layer over pod sets: traffic, router
# wiring, per-revision Services, prefill/decode pairing, group rollouts and canary
# across sets, multi-cluster placement, status aggregation. Every role has two
# forms: inline (today's path, byte-for-byte) and referenced (bring your own IR).
see-also:
  - "/oeps/0007-omenative-workload-strategy"   # the IR and the engine it fronts; its "no new user-visible CRDs" line is what this OEP revises
  - "/oeps/0017-unified-rollout-v2"            # groups[] and the canary|blueGreen|rollingUpdate progressions that must name refs
  - "/oeps/0017.2-per-component-canary"        # canary units; the partition/rollback fields this OEP classifies as rollout-control
  - "/oeps/0018-multi-cluster-placement"       # derived ISVCs; placement stays a composition concern
  - "/oeps/0025-multi-cluster-routing"         # TrafficMap, the actuator for traffic across refs
  - "/oeps/0020.3-workload-restructure"        # the engine behind the IR; unchanged here

stage: alpha

