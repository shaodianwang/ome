# ome-scheduler is the official kube-scheduler framework built as a library with an
# OME placement plugin, deployed as a second scheduler that only pods opting in via
# schedulerName use. It owns topology-aware gang placement and bin-packing the default
# scheduler cannot do; Kueue is adopted for quota (Phase B); topology-aware preemption
# is built on the same core (Phase C); batch backfill is mostly Kueue config (Phase D).
