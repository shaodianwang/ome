milestone:
  alpha: "TBD"
  beta: "TBD"
  stable: "TBD"

# No feature gate and no config toggle. Admission rejects Proportional until
# the coordinator lands; the same change lifts the rejection. Pinned stays
# rejected and leaves the enum in Beta.
feature-gates: []
disable-supported: false

