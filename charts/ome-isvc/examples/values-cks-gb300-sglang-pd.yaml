# Example: single Llama4x prefill+decode disaggregated deployment on CW gb300.
#
# Pattern: one deployment, prefill+decode disaggregated servingMode, sit on
# top of the cks-gb300-sglang-pd vendor profile (the top-level default,
# so `vendor:` is omitted on the deployment). Tenant only sets replica
# counts, context length, coordination policy — everything else (image,
# NCCL envs, RDMA / multus, resources, probes, security context) is
# inherited from the vendor ClusterServingRuntime.
#
# Resulting resources:
#   - ClusterServingRuntime/cks-gb300-sglang-pd          (vendor profile)
#   - ClusterServingRuntime/llama4x-prod-llama4x-csr     (tenant child runtime)
#   - InferenceService/llama4x-prod-llama4x              (in ml-team-prod)

namespace:
  name: ml-team-prod

scope: cluster

# vendor: cks-gb300-sglang-pd  # already the chart-level default; omitted

deployments:
  - name: llama4x
    servingMode: pd

    prefill:
      replicas:
        min: 2
        max: 4
      contextLength: 1048576
      tensorParallelSize: 4
      gpuMemoryUtilization: 0.8
      maxConcurrentRequests: 256
      # Typed model-artifact knobs synthesise sglang flags only when set
      # (see README "Args layering" + "Synthesised CLI flags"). Mirrors
      # the production Llama4x nvfp4 launch on gb300.
      dtype: bfloat16
      quantization: modelopt_fp4
      kvCacheDtype: bfloat16
      moeRunnerBackend: flashinfer_trtllm
      speculative:
        algorithm: EAGLE3
        draftModelPath: $(MODEL_PATH)/draft_hf
        draftModelQuantization: unquant
      # Extra flags that have no typed knob equivalent. User entries win
      # on duplicate --flag against the chart base / synthesised layers.
      args:
        - --ep-size
        - "4"
        - --disaggregation-mode
        - prefill
        - --disaggregation-transfer-backend
        - nixl
        - --disaggregation-bootstrap-port
        - "8998"
      # env entries are merged into the vendor's env list by `name`
      # (predictable per-key strategic merge). Use this to extend the
      # vendor's infra env (e.g. workload-specific knobs the scientist
      # wants to toggle without rolling a new vendor image).
      env:
        - name: SGLANG_EXTERNAL_MODEL_PACKAGE
          value: sglang_meta.srt.models
        - name: SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN
          value: "1"
        - name: SGLANG_DISAGGREGATION_NIXL_BACKEND
          value: UCX

    decode:
      replicas:
        min: 2
        max: 4
      contextLength: 1048576
      tensorParallelSize: 4
      gpuMemoryUtilization: 0.8
      maxConcurrentRequests: 256
      dtype: bfloat16
      quantization: modelopt_fp4
      kvCacheDtype: bfloat16
      moeRunnerBackend: flashinfer_trtllm
      speculative:
        algorithm: EAGLE3
        draftModelPath: $(MODEL_PATH)/draft_hf
        draftModelQuantization: unquant
      args:
        - --ep-size
        - "4"
        - --disaggregation-mode
        - decode
        - --disaggregation-transfer-backend
        - nixl
      env:
        - name: SGLANG_EXTERNAL_MODEL_PACKAGE
          value: sglang_meta.srt.models
        - name: SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN
          value: "1"
        - name: SGLANG_DISAGGREGATION_NIXL_BACKEND
          value: UCX

    router:
      enabled: true
      replicas:
        min: 2
        max: 2
      timeoutSeconds: 300
      loadBalancingAlgorithm: round-robin

    coordination:
      policy: Sequential
      order: [decode, prefill]
      pacing:
        type: PerComponent
        maxSurge: 1
        maxUnavailable: 0

    modelRef:
      name: avo-tier5-pd-prod
      scope: cluster

# vendors.deployAll defaults to false; the chart auto-deploys
# cks-gb300-sglang-pd because some deployment above references it
# (via the top-level vendor default).

# Create the ClusterBaseModel inline. Scientists only specify `name`
# and `storageUri`; the OME controller infers everything else.
basemodels:
  - name: avo-tier5-pd-prod
    storageUri: oci://my-registry/avo-tier5-pd-prod:latest
