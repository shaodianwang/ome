{{- /*
servingruntime.yaml — emits one tenant CHILD (Cluster)ServingRuntime per
entry in .Values.deployments.

Each child runtime is intentionally thin:
  - It carries `metadata.annotations["ome.io/inherit-from"]: <vendor>`
    so the OME controller resolves the full spec at consume time
    against the matching vendor profile under templates/vendors/.
  - Its `spec` carries:
      * `runner.image`  — when the deployment overrides the image;
      * `runner.args`   — the COMPLETE args list (chart production
                          defaults + synthesised typed flags + user
                          `args:`). The vendor profile carries no
                          args; the chart owns the whole list to avoid
                          strategic-merge's wholesale-replace trap on
                          plain `[]string` lists.
      * `runner.env`    — user-supplied env entries from the values
                          block; merged into vendor env by `name` key
                          via strategic merge (predictable, additive).
    Other infrastructure (resources, RDMA, volumes, probes, security
    context) is inherited verbatim from the vendor profile.

Component naming translation:
  prefill -> engineConfig         (prefill+decode disaggregated servingMode)
  decode  -> decoderConfig        (prefill+decode disaggregated servingMode)
  engine  -> engineConfig         (standalone / multinode servingMode)
  router  -> routerConfig         (optional)

Strategic-merge inheritance (via the ome.io/inherit-from annotation):
  - child wins on collision;
  - listMapKey lists (e.g. `env`) merge per `name` — predictable, additive;
  - plain lists (e.g. `args`, `command`) are wholesale-replaced — this
    is exactly why the vendor profile leaves them empty: the chart
    re-emits the full child list so there is nothing to silently lose.
*/ -}}
{{- $root := . -}}
{{- $kind := include "ome-isvc.runtimeKind" $root -}}
{{- range $i, $deployment := .Values.deployments }}
{{- if $i }}
---
{{ end }}
{{- $servingMode := $deployment.servingMode -}}
{{- $hasEngine  := or (eq $servingMode "standalone") (eq $servingMode "multinode") -}}
{{- $hasPrefill := eq $servingMode "pd" -}}
{{- $hasDecode  := eq $servingMode "pd" -}}
{{- $hasRouter  := and (eq $servingMode "pd") (and $deployment.router $deployment.router.enabled) -}}
{{- $vendor := include "ome-isvc.deploymentVendor" (dict "root" $root "deployment" $deployment) -}}
apiVersion: ome.io/v1beta1
kind: {{ $kind }}
metadata:
  name: {{ include "ome-isvc.runtimeName" (dict "root" $root "deployment" $deployment) }}
  {{- if eq $kind "ServingRuntime" }}
  namespace: {{ $root.Values.namespace.name }}
  {{- end }}
  labels:
    {{- include "ome-isvc.deploymentLabels" (dict "root" $root "deployment" $deployment) | nindent 4 }}
  annotations:
    ome.io/inherit-from: {{ $vendor | quote }}
    {{- with include "ome-isvc.commonAnnotations" $root | trim }}
    {{- . | nindent 4 }}
    {{- end }}
  {{- /* Pre-compute args lists per component. componentArgs always
       returns at least the chart production defaults (see
       ome-isvc.engineDefaultArgs), so a tenant always ships a full
       args list rather than relying on the vendor (which has none). */}}
  {{- $prefillArgs := list }}
  {{- if $hasPrefill }}
  {{- $prefillArgs = include "ome-isvc.componentArgs" (dict "block" $deployment.prefill) | fromJsonArray }}
  {{- end }}
  {{- $decodeArgs := list }}
  {{- if $hasDecode }}
  {{- $decodeArgs = include "ome-isvc.componentArgs" (dict "block" $deployment.decode) | fromJsonArray }}
  {{- end }}
  {{- $engineArgs := list }}
  {{- if $hasEngine }}
  {{- $engineArgs = include "ome-isvc.componentArgs" (dict "block" $deployment.engine) | fromJsonArray }}
  {{- end }}
spec:
  {{- /* prefill -> engineConfig override -------------------------------- */ -}}
  {{- if $hasPrefill }}
  {{- $b := $deployment.prefill }}
  engineConfig:
    runner:
      name: ome-container
      {{- if $b.image }}
      image: {{ $b.image | quote }}
      {{- end }}
      {{- if gt (len $prefillArgs) 0 }}
      args:
        {{- toYaml $prefillArgs | nindent 8 }}
      {{- end }}
      {{- if and $b.env (gt (len $b.env) 0) }}
      env:
        {{- toYaml $b.env | nindent 8 }}
      {{- end }}
  {{- end }}
  {{- /* decode -> decoderConfig override -------------------------------- */ -}}
  {{- if $hasDecode }}
  {{- $b := $deployment.decode }}
  decoderConfig:
    runner:
      name: ome-container
      {{- if $b.image }}
      image: {{ $b.image | quote }}
      {{- end }}
      {{- if gt (len $decodeArgs) 0 }}
      args:
        {{- toYaml $decodeArgs | nindent 8 }}
      {{- end }}
      {{- if and $b.env (gt (len $b.env) 0) }}
      env:
        {{- toYaml $b.env | nindent 8 }}
      {{- end }}
  {{- end }}
  {{- /* engine -> engineConfig override (standalone / multinode) ------- */ -}}
  {{- if $hasEngine }}
  {{- $b := $deployment.engine }}
  engineConfig:
    runner:
      name: ome-container
      {{- if $b.image }}
      image: {{ $b.image | quote }}
      {{- end }}
      {{- if gt (len $engineArgs) 0 }}
      args:
        {{- toYaml $engineArgs | nindent 8 }}
      {{- end }}
      {{- if and $b.env (gt (len $b.env) 0) }}
      env:
        {{- toYaml $b.env | nindent 8 }}
      {{- end }}
    {{- if and (eq $servingMode "multinode") $b.workerSize }}
    worker:
      size: {{ $b.workerSize }}
    {{- end }}
  {{- end }}
  {{- /* router -> routerConfig override --------------------------------- */ -}}
  {{- if $hasRouter }}
  {{- $b := $deployment.router }}
  routerConfig:
    runner:
      name: router
      {{- if $b.image }}
      image: {{ $b.image | quote }}
      {{- end }}
      {{- if and $b.env (gt (len $b.env) 0) }}
      env:
        {{- toYaml $b.env | nindent 8 }}
      {{- end }}
  {{- end }}
{{- end }}
