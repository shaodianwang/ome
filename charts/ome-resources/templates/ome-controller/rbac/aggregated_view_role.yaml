---
# Read-only access to all ome.io CRDs (InferenceService, BaseModel, ServingRuntime,
# InferenceReplica, etc.), aggregated into the built-in view/edit/admin ClusterRoles.
#
# Kubernetes' built-in `view` role is aggregation-based and does NOT cover custom
# resources unless a role carries the aggregate-to-view label. Without this, a
# principal holding `view` (e.g. MUSE authenticating to a GKE cluster via its
# K8S_CLUSTER ACL `ClusterRole:view` grant) can read nodes/pods but is DENIED on
# ome.io resources — so its OME resource views come back empty. This role closes
# that gap the idiomatic way, for every `view`/`edit`/`admin` holder, cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ome-crd-viewer
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups: ["ome.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
