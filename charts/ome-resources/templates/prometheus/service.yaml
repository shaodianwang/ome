{{- if .Values.prometheus.enabled }}
# Fronts the bundled Prometheus Deployment on port 9090. KEDA
# ScaledObjects address this via
#   http://ome-prometheus.{{ .Release.Namespace }}.svc:9090
# so OEP-0013 prometheus triggers work out of the box.
apiVersion: v1
kind: Service
metadata:
  name: ome-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ome-prometheus.labels" . | nindent 4 }}
spec:
  type: {{ .Values.prometheus.service.type }}
  ports:
    - name: http-web
      port: {{ .Values.prometheus.service.port }}
      targetPort: http-web
      protocol: TCP
  selector:
    {{- include "ome-prometheus.selectorLabels" . | nindent 4 }}
{{- end }}
