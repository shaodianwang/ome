{{- if and .Values.alfred.enabled .Values.alfred.maintenanceCordon.enabled }}
# The only node write alfred makes: cordon a node that a maintenance rule with
# cordon: true puts under maintenance. patch allows any node field, and only
# alfred's code limits it to the cordon. Kept out of the base ClusterRole so
# installs without the opt-in stay read-only on nodes. Keep identical to
# upstream's charts/ome-alfred.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ome-alfred-maintenance-cordon
  labels:
    {{- include "ome-alfred.labels" . | nindent 4 }}
rules:
  - apiGroups: [ "" ]
    resources: [ "nodes" ]
    verbs: [ "get", "patch" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ome-alfred-maintenance-cordon
  labels:
    {{- include "ome-alfred.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ome-alfred-maintenance-cordon
subjects:
  - kind: ServiceAccount
    name: ome-alfred
    namespace: {{ .Release.Namespace }}
{{- end }}
