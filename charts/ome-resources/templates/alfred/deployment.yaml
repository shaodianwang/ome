{{- if .Values.alfred.enabled }}
{{- $a := .Values.alfred }}
{{- if $a.migration.apiVersion }}
{{- if ne $a.migration.apiVersion "v1" }}
{{- fail "alfred.migration.apiVersion must be v1 when set" }}
{{- end }}
{{- end }}
# Alfred, the GPU cluster caretaker. Every replica runs the read-only
# observation loop; only the leader decides and dispatches.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ome-alfred
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ome-alfred.labels" . | nindent 4 }}
spec:
  replicas: {{ $a.replicaCount }}
  selector:
    matchLabels:
      {{- include "ome-alfred.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ome-alfred.podLabels" . | nindent 8 }}
        logging-forward: enabled
      annotations:
        kubectl.kubernetes.io/default-container: alfred
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $a.metrics.port | quote }}
        prometheus.io/path: "/metrics"
        # A config change takes effect via hot reload, no restart needed; this
        # checksum only restarts pods when the rendered document changes AND
        # the pod template is being applied anyway.
        checksum/alfred-config: {{ $a.config | toYaml | sha256sum }}
        {{- with $a.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: ome-alfred
      {{- with $a.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: alfred
        image: {{ include "ome-alfred.image" . }}
        imagePullPolicy: {{ $a.image.pullPolicy }}
        args:
          - "--metrics-bind-address=:{{ $a.metrics.port }}"
          - "--health-probe-bind-address=:{{ $a.healthPort }}"
          - "--leader-elect=true"
          - "--config-name={{ $a.configMapName }}"
          - "--config-key=config.yaml"
          {{- if $a.migration.apiVersion }}
          - "--migration-api-version=v1"
          - "--migration-service-account=ome-alfred"
          - {{ printf "--migration-ack-timeout=%s" $a.migration.acknowledgementTimeout | quote }}
          - {{ printf "--migration-failure-backoff=%s" $a.migration.failureBackoff | quote }}
          {{- end }}
          {{- if $a.maintenanceCordon.enabled }}
          - "--enable-maintenance-cordon=true"
          {{- end }}
          {{- if $a.simulation.configMapName }}
          - "--simulation-workers=/etc/alfred-simulation/workers.json"
          - {{ printf "--simulation-timeout=%s" $a.simulation.timeout | quote }}
          {{- end }}
        env:
          # Alfred reads its namespace from the downward API: it holds the
          # config ConfigMap and the leader-election Lease.
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          # Labels alfred_leader_status so the leader is identifiable.
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
        ports:
        - name: metrics
          containerPort: {{ $a.metrics.port }}
          protocol: TCP
        - name: health
          containerPort: {{ $a.healthPort }}
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 10
        resources:
          {{- toYaml $a.resources | nindent 10 }}
        {{- if $a.simulation.configMapName }}
        volumeMounts:
          - name: simulation
            mountPath: /etc/alfred-simulation
            readOnly: true
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
      {{- if $a.simulation.configMapName }}
      volumes:
        - name: simulation
          configMap:
            name: {{ $a.simulation.configMapName | quote }}
      {{- end }}
      {{- with $a.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $a.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $a.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $a.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
{{- end }}
