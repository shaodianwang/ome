{{- if .Values.alfred.enabled }}
# Metrics endpoint: every replica observes, so scraping any pod works.
apiVersion: v1
kind: Service
metadata:
  name: ome-alfred-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ome-alfred.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "ome-alfred.selectorLabels" . | nindent 4 }}
  ports:
  - name: metrics
    port: {{ .Values.alfred.metrics.port }}
    targetPort: metrics
    protocol: TCP
{{- end }}
