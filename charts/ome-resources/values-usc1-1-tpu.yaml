# OME install overlay for msl-gcp-usc1-1-tpu (GKE; reuses the cluster's existing cert-manager).
# Use: helm upgrade --install ome ./charts/ome-resources -n ome \
#        -f charts/ome-resources/values-usc1-1-tpu.yaml
#
# Image: the tip-of-main build the dev cluster runs, from AWS ECR. usc1-1 runs
# ecr-credential-refresher; if controller pods ImagePullBackOff, set global.imagePullSecrets.
global:
  hub: 168653207203.dkr.ecr.us-east-2.amazonaws.com/msl_infra
  imagePullSecrets: []          # e.g. [{name: <ecr-pull-secret>}] if image pull is denied in the ome ns

ome:
  controller:
    tag: "7010c388"             # ome-manager; #495 env, #497 slice affinity, #511 port, #512 per-ISVC
    # Expose ISVCs via the cluster's Envoy Gateway (Gateway API) instead of the
    # cluster-local default — OME renders an HTTPRoute per ISVC on this gateway.
    ingressGateway:
      domain: "ext-gw-https.msl-gcp-usc1-1.metahpc.gcp.metafb.cloud"   # -> <isvc>.<ns>.<domain>
      urlScheme: "https"
      disableIngressCreation: false
      enableGatewayAPI: true
      # Per-ISVC subdomain routing (#512): host = <isvc>.<ns>.<domain> at root,
      # matching status.url. With <ns>=meta-ai it resolves under *.meta-ai.<domain>.
      perISVCSubdomain: true
      # omeIngressGateway is the gateway the HTTPRoute's parentRef attaches to
      # (httproute_builder splits it on "/"); must be namespace/name, not empty.
      omeIngressGateway: "envoy-gateway-system/meta-ai-ext-gw-https"
      ingressGateway:
        gateway: "envoy-gateway-system/meta-ai-ext-gw-https"
        gatewayService: "envoy-envoy-gateway-system-meta-ai-ext-gw-https-c35b1bd3.envoy-gateway-system.svc.cluster.local"
        className: "meta-ai-ext-gw-https"
      # Per-namespace gateways: this cluster has a dedicated Gateway per namespace
      # (prod-/sandbox-/staging-{int,ext}-gw-https), each with its own wildcard TLS
      # cert + DNS for *.<namespace>.<int|ext>-gw-https.<cluster-domain>. Route the
      # HTTPRoutes for ISVCs in those namespaces to their own Gateway so the
      # namespace-scoped host (<isvc>.<namespace>.<domain>, from domainTemplate)
      # actually resolves to a Gateway that serves it. Without this, ISVCs in these
      # namespaces attach only to the meta-ai Gateway and their published URL 404s.
      # Namespaces not listed (e.g. meta-ai) keep the cluster-default gateway above.
      namespaceIngressGateways:
        prod:
          primary:
            omeIngressGateway: "envoy-gateway-system/prod-int-gw-https"
            ingressDomain: "int-gw-https.msl-gcp-usc1-1.metahpc.gcp.metafb.cloud"
          additional:
            - omeIngressGateway: "envoy-gateway-system/prod-ext-gw-https"
              ingressDomain: "ext-gw-https.msl-gcp-usc1-1.metahpc.gcp.metafb.cloud"
        sandbox:
          primary:
            omeIngressGateway: "envoy-gateway-system/sandbox-int-gw-https"
            ingressDomain: "int-gw-https.msl-gcp-usc1-1.metahpc.gcp.metafb.cloud"
          additional:
            - omeIngressGateway: "envoy-gateway-system/sandbox-ext-gw-https"
              ingressDomain: "ext-gw-https.msl-gcp-usc1-1.metahpc.gcp.metafb.cloud"
        staging:
          primary:
            omeIngressGateway: "envoy-gateway-system/staging-int-gw-https"
            ingressDomain: "int-gw-https.msl-gcp-usc1-1.metahpc.gcp.metafb.cloud"
          additional:
            - omeIngressGateway: "envoy-gateway-system/staging-ext-gw-https"
              ingressDomain: "ext-gw-https.msl-gcp-usc1-1.metahpc.gcp.metafb.cloud"
  omeAgent:
    tag: "7010c388"             # keep ome-agent on the same build
  multiclusterAccess:
    enabled: false              # standalone install — not driven by a control-plane operator

# Operator only for now.
modelAgent:
  enabled: false

# Bundled Prometheus for OME/KEDA metrics. Large-cluster capacity and scrape
# controls are set explicitly for this fleet.
prometheus:
  enabled: true
  retention: 1h
  retentionSize: 12GB
  requireScrapeAnnotation: true
  goMemLimit: 9GiB
  scrapeLimits:
    sampleLimit: 10000
    targetLimit: 5000
    labelLimit: 100
    labelNameLengthLimit: 128
    labelValueLengthLimit: 2048
    bodySizeLimit: 50MB
    keepDroppedTargets: 100
  query:
    maxConcurrency: 8
    maxSamples: 10000000
    timeout: 30s
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 12Gi
  storage:
    sizeLimit: 16Gi
serviceMonitor:
  enabled: true
podMonitor:
  enabled: true
