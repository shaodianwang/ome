# Global settings that apply to all resources
global:
  # Image pull secrets for all containers in the chart
  # Example:
  # imagePullSecrets:
  #   - name: my-registry-secret
  hub: "ghcr.io/moirai-internal"
  imagePullSecrets: []

ome:
  version: &defaultVersion v0.1.4
  metricsaggregator:
    enableMetricAggregation: "false"
    enablePrometheusScraping: "false"
  # multiclusterAccess installs the long-lived ServiceAccount token used by
  # InferenceDeploymentOperator to manage OME resources from a control-plane
  # cluster.
  multiclusterAccess:
    enabled: true
  # modelCache configures the optional cluster-wide model cache provider used
  # by BaseModel and ClusterBaseModel resources with spec.distribution: Sharded.
  # Leave provider empty to keep the default PerNode/model-agent behavior.
  modelCache:
    # Provider implementation name. The built-in provider is "cluster_cache".
    provider: ""
    # HTTP endpoint for the provider control-plane API.
    # Example: http://cluster-cache.ome.svc.cluster.local:10090
    endpoint: ""
    # Provider-specific options passed to OME's model cache client.
    # Supported cluster_cache options:
    #   timeout: per-request timeout, e.g. 5m
    #   operation_retention: completed prewarm status retention, e.g. 10m
    options: {}
  controller:
    replicaCount: 3
    # Additional annotations applied to the controller pod template.
    # Merged after the chart's default annotations (prometheus.io/scrape, etc.).
    # Typical use: metric-pipeline schema tagging, e.g.
    #   podAnnotations:
    #     fb_metric_schema: ome_controller
    podAnnotations: {}
    deploymentMode: "RawDeployment"
    ingressGateway:
      domain: svc.cluster.local
      domainTemplate: "{{ .Name }}.{{ .Namespace }}.{{ .IngressDomain }}"
      urlScheme: http
      ingressGateway:
        gateway: istio-system/ingress-gateway
        gatewayService: istio-ingressgateway.istio-system.svc.cluster.local
        className: istio
      omeIngressGateway: ""
      additionalIngressDomains: null
      pathTemplate: ""
      disableIngressCreation: true
      enableGatewayAPI: false
    nodeSelector: {}
    tolerations: []
    topologySpreadConstraints: []
    affinity: {}
    image: ome-manager
    tag: *defaultVersion
    resources:
      limits:
        cpu: 2
        memory: 4Gi
      requests:
        cpu: 2
        memory: 4Gi
  omeAgent:
    image: ome-agent
    tag: *defaultVersion
    authType: InstancePrincipal
    compartmentId: ocid1.compartment.oc1..dummy-compartment
    vaultId: ocid1.vault.oc1.ap-osaka-1.dummy.dummy-vault
    region: ap-osaka-1
    modelInit:
      memoryRequest: 150Gi
      memoryLimit: 180Gi
      cpuRequest: 15
      cpuLimit: 15
      extraEnvVars: []
      extraVolumeMounts: []
    fineTunedAdapter:
      memoryRequest: 300Gi
      memoryLimit: 320Gi
      cpuRequest: 15
      cpuLimit: 15
    metadataJob:
      serviceAccount: ome-model-metadata
      memoryRequest: 256Mi
      memoryLimit: 512Mi
      cpuRequest: 100m
      cpuLimit: 500m
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      # Pass-through scheduling hints applied to the metadata Job pod.
      # Use these when the PVC's CSI driver only mounts on a subset of
      # nodes or when models live on tainted nodes (e.g., GPU nodes).
      nodeSelector: {}
      tolerations: []
      affinity: {}
      priorityClassName: ""
modelAgent:
  # Disabled by default — this fork consumes upstream-published
  # model-agent images rather than building/deploying locally.
  enabled: false
  # Additional annotations applied to the model-agent pod template.
  # Same shape and intent as ome.controller.podAnnotations above.
  podAnnotations: {}
  hostPath: /mnt/data/models
  priorityClassName: system-node-critical
  serviceAccountName: ome-model-agent
  image:
    # Docker registry hub. If set, overrides global.hub for model-agent.
    # If repository contains '/', hub is ignored.
    # Leave empty to use global.hub
    hub: ""
    repository: model-agent
    pullPolicy: Always
    tag: *defaultVersion

  # When enabled, the model agent will only run on nodes with GPU
  gpuNodesOnly: false

  # GPU node label selector (used when gpuNodesOnly is true)
  # Examples:
  #   For NVIDIA GPU operator: nvidia.com/gpu.present: "true"
  #   For Nebius: nebius.com/gpu: "true"
  #   For AWS: node.kubernetes.io/instance-type: g4dn.xlarge
  gpuNodeLabel:
    key: nvidia.com/gpu.present
    value: "true"

  nodeSelector: {}

  # Additional volumes to mount into the model-agent DaemonSet pods
  # Examples:
  # extraVolumes:
  #   - name: shared-tmp
  #     emptyDir: {}
  #   - name: config
  #     configMap:
  #       name: my-config
  extraVolumes: []

  # Additional volumeMounts for the model-agent container
  # Examples:
  # extraVolumeMounts:
  #   - name: shared-tmp
  #     mountPath: /tmp/shared
  #   - name: config
  #     mountPath: /etc/model-agent/config
  #     readOnly: true
  extraVolumeMounts: []

  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

  health:
    port: 8080

  # Additional environment variables for the model-agent container
  # Examples:
  # env:
  #   LOG_LEVEL: "debug"
  #   DOWNLOAD_RETRY: "5"
  env: {}

  resources:
    limits:
      cpu: '10'
      memory: 100Gi
    requests:
      cpu: '10'
      memory: 100Gi

# ServiceMonitor for the controller-manager metrics endpoint.
# Requires prometheus-operator (monitoring.coreos.com/v1) installed
# in the cluster. Leave disabled for clusters that use vanilla
# Prometheus pod-annotation discovery (the prometheus.io/scrape
# annotations on the controller pod continue to work).
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  # Extra labels merged onto the ServiceMonitor (e.g., to match the
  # operator's ruleSelector / serviceMonitorSelector).
  additionalLabels: {}
  # Prometheus relabel rules applied before scraping.
  relabelings: []
  # Prometheus relabel rules applied after scraping (drop/keep series).
  metricRelabelings: []

# PodMonitor for the model-agent DaemonSet. The DaemonSet has no
# fronting Service (it's addressed via node-local hostPath, not
# cluster DNS), so PodMonitor is the right scrape primitive.
podMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}
  relabelings: []
  metricRelabelings: []

# Optional single-replica Prometheus bundled by this chart so KEDA
# autoscaling triggers (OEP-0013) have a metrics source out of the
# box. Disable when your cluster already runs a Prometheus that
# scrapes OME pods — point KEDA at that one instead. NOT intended
# for long-term observability or alerting; retention is deliberately
# short and storage is emptyDir.
prometheus:
  enabled: false
  # Retention window. Short by design — this Prometheus exists for
  # autoscaling input, not long-term observability. Keeps emptyDir
  # usage bounded.
  retention: 30m
  scrapeInterval: 15s
  # Namespaces to discover InferenceService pods in. Empty = all namespaces
  # (discovery is already server-side filtered to ome.io/inferenceservice pods,
  # so it stays cheap even cluster-wide). Set a list to hard-scope discovery on
  # very large multi-tenant clusters, e.g. [ome, team-a, team-b].
  scrapeNamespaces: []
  image:
    repository: prom/prometheus
    tag: "v3.0.1"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  service:
    type: ClusterIP
    port: 9090
  storage:
    # emptyDir size cap. ~30 min retention at 15s scrape interval
    # for a typical OME cluster fits well under 1Gi; the cap exists
    # to protect the node from runaway disk use.
    sizeLimit: 2Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Extra labels merged onto every Prometheus-related resource.
  # Useful for fleet labels or cost-attribution tags.
  additionalLabels: {}
