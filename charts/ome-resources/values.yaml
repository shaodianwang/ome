# Global settings that apply to all resources
global:
  # Image pull secrets for all containers in the chart
  # Example:
  # imagePullSecrets:
  #   - name: my-registry-secret
  hub: "ghcr.io/moirai-internal"
  imagePullSecrets: []

ome:
  version: &defaultVersion v0.1.4
  metricsaggregator:
    enableMetricAggregation: "false"
    enablePrometheusScraping: "false"
  # modelCache configures the optional cluster-wide model cache provider used
  # by BaseModel and ClusterBaseModel resources with spec.distribution: Sharded.
  # Leave provider empty to keep the default PerNode/model-agent behavior.
  modelCache:
    # Provider implementation name. The built-in provider is "cluster_cache".
    provider: ""
    # HTTP endpoint for the provider control-plane API.
    # Example: http://cluster-cache.ome.svc.cluster.local:10090
    endpoint: ""
    # Provider-specific options passed to OME's model cache client.
    # Supported cluster_cache options:
    #   timeout: per-request timeout, e.g. 5m
    #   operation_retention: completed prewarm status retention, e.g. 10m
    options: {}
  benchmarkJob:
    image: genai-bench
    tag: 0.1.113
    cpuRequest: "2"
    memoryRequest: "2Gi"
    cpuLimit: "2"
    memoryLimit: "2Gi"
  controller:
    replicaCount: 3
    deploymentMode: "RawDeployment"
    ingressGateway:
      domain: svc.cluster.local
      domainTemplate: "{{ .Name }}.{{ .Namespace }}.{{ .IngressDomain }}"
      urlScheme: http
      disableIstioVirtualHost: false
      localGateway:
        gateway: knative-serving/knative-local-gateway
        gatewayService: knative-local-gateway.istio-system.svc.cluster.local
      ingressGateway:
        gateway: knative-serving/knative-ingress-gateway
        gatewayService: istio-ingressgateway.istio-system.svc.cluster.local
        className: istio
      omeIngressGateway: ""
      additionalIngressDomains: null
      pathTemplate: ""
      disableIngressCreation: true
      enableGatewayAPI: false
    nodeSelector: {}
    tolerations: []
    topologySpreadConstraints: []
    affinity: {}
    image: ome-manager
    tag: *defaultVersion
    resources:
      limits:
        cpu: 2
        memory: 4Gi
      requests:
        cpu: 2
        memory: 4Gi
  omeAgent:
    image: ome-agent
    tag: *defaultVersion
    authType: InstancePrincipal
    compartmentId: ocid1.compartment.oc1..dummy-compartment
    vaultId: ocid1.vault.oc1.ap-osaka-1.dummy.dummy-vault
    region: ap-osaka-1
    modelInit:
      memoryRequest: 150Gi
      memoryLimit: 180Gi
      cpuRequest: 15
      cpuLimit: 15
      extraEnvVars: []
      extraVolumeMounts: []
    fineTunedAdapter:
      memoryRequest: 300Gi
      memoryLimit: 320Gi
      cpuRequest: 15
      cpuLimit: 15
    metadataJob:
      serviceAccount: ome-model-metadata
      memoryRequest: 256Mi
      memoryLimit: 512Mi
      cpuRequest: 100m
      cpuLimit: 500m
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      # Pass-through scheduling hints applied to the metadata Job pod.
      # Use these when the PVC's CSI driver only mounts on a subset of
      # nodes or when models live on tainted nodes (e.g., GPU nodes).
      nodeSelector: {}
      tolerations: []
      affinity: {}
      priorityClassName: ""
  kedaConfig:
    enableKeda: true
    promServerAddress: "http://prometheus-operated.monitoring.svc.cluster.local:9090"
    customPromQuery: ""
    scalingThreshold: "10"
    scalingOperator: "GreaterThanOrEqual"
modelAgent:
  hostPath: /mnt/data/models
  priorityClassName: system-node-critical
  serviceAccountName: ome-model-agent
  image:
    # Docker registry hub. If set, overrides global.hub for model-agent.
    # If repository contains '/', hub is ignored.
    # Leave empty to use global.hub
    hub: ""
    repository: model-agent
    pullPolicy: Always
    tag: *defaultVersion

  # When enabled, the model agent will only run on nodes with GPU
  gpuNodesOnly: false

  # GPU node label selector (used when gpuNodesOnly is true)
  # Examples:
  #   For NVIDIA GPU operator: nvidia.com/gpu.present: "true"
  #   For Nebius: nebius.com/gpu: "true"
  #   For AWS: node.kubernetes.io/instance-type: g4dn.xlarge
  gpuNodeLabel:
    key: nvidia.com/gpu.present
    value: "true"

  nodeSelector: {}

  # Additional volumes to mount into the model-agent DaemonSet pods
  # Examples:
  # extraVolumes:
  #   - name: shared-tmp
  #     emptyDir: {}
  #   - name: config
  #     configMap:
  #       name: my-config
  extraVolumes: []

  # Additional volumeMounts for the model-agent container
  # Examples:
  # extraVolumeMounts:
  #   - name: shared-tmp
  #     mountPath: /tmp/shared
  #   - name: config
  #     mountPath: /etc/model-agent/config
  #     readOnly: true
  extraVolumeMounts: []

  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

  health:
    port: 8080

  # Additional environment variables for the model-agent container
  # Examples:
  # env:
  #   LOG_LEVEL: "debug"
  #   DOWNLOAD_RETRY: "5"
  env: {}

  resources:
    limits:
      cpu: '10'
      memory: 100Gi
    requests:
      cpu: '10'
      memory: 100Gi
