# MUSE console — one image (muse-server) serving the read-plane API + web UI.
# 2 replicas for HA (no downtime on rollout / node drain); the Service load-balances
# reads across them. Each replica keeps its own informer cache per aggregated
# cluster, so N replicas ≈ N× memory and N× the watch/list load on those apiservers
# — set to 1 for a very large fleet where that cost outweighs HA.
replicaCount: 2

image:
  # Under global.hub when set and repository has no "/", else used as a full ref.
  repository: muse-server
  tag: latest
  pullPolicy: IfNotPresent

# Optional registry prefix (matches the ome-resources chart's global.hub).
global:
  hub: ""

# Workload clusters muse-server aggregates. Each entry mounts a kubeconfig Secret
# (key: `kubeconfig`) and passes `--cluster <name>=<path>`. Empty ⇒ muse uses its
# in-cluster ServiceAccount under `config.localClusterName`.
clusters: []
#  - name: cw-use2-1
#    kubeconfigSecret: muse-kubeconfig-cw-use2-1

# muse-server config — all env/flag driven, no values baked into the image.
config:
  # Bind address. "::" (IPv6 unspecified) dual-stacks on Linux — it accepts both
  # IPv6 and IPv4 — so it works on IPv6, IPv4, and dual-stack clusters. Plain
  # 0.0.0.0 is IPv4-only and fails kubelet probes on an IPv6 cluster.
  host: "::"
  # Identity used for the ambient in-cluster client when `clusters` is empty.
  localClusterName: default
  logJson: false
  logFilter: info,muse=debug
  # Generated Kubernetes API types require a larger Tokio worker stack.
  workerThreadStackBytes: "67108864"
  webDir: /web # the image bakes the console here; "" ⇒ API-only
  listStrategy: auto # auto | streaming | paginated
  apiserverPreflightTimeoutSecs: 15
  eventHistoryLimit: 100
  # Per-cluster initial informer deadline; a timed-out cluster keeps syncing in
  # the background and can recover. The pod becomes ready as soon as one
  # cluster's cache is ready — the console serves that (possibly partial) fleet
  # and reports the remaining clusters' sync state alongside it. Set to null or
  # 0 to wait indefinitely.
  cacheSyncTimeoutSecs: 300
  capacityRefreshSecs: 10
  # Batch informer changes into one live-query invalidation. This controls the
  # responsiveness vs refetch/SSE load tradeoff; the binary has no baked default.
  liveInvalidationBatchMs: 1000
  # Heartbeat for idle SSE connections. The binary has no baked interval.
  sseKeepAliveSecs: 10
  # Age at which a canary sitting in one step becomes a fleet-triage finding
  # ("canary stuck at step N"). The binary has no baked threshold; set to null
  # to disable step-age detection.
  attentionStuckStepSecs: 1800
  capacityBackstopSecs: 120
  # Bound the operator-facing drill-down arrays in each capacity response.
  capacityMaxFragments: 12
  capacityMaxConsumers: 8
  shutdownGraceSecs: 2
  metricsUpkeepSecs: 5
  httpLatencyBuckets: [0.001, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10]
  # Dashboard-only health classification. Set a category (or the whole policy) to
  # null to render it neutrally; the binary supplies no threshold defaults.
  # Percent metrics use 0..100, while cache metrics are 0..1 fractions.
  dashboardPolicy:
    utilization:
      warningAt: 75
      criticalAt: 90
    availability:
      warningBelow: 100
      criticalBelow: 99
    errorRate:
      warningAt: 0.1
      criticalAt: 1
    kvCache:
      warningAt: 0.7
      criticalAt: 0.9
    prefixCache:
      warningBelow: 0.7
      criticalBelow: 0.4
  # OME's own control-plane components surfaced in the System panel (OEP-0021.2).
  # No baked-in set: the namespaces and label selectors that identify the
  # controller / scheduler / webhook / model-agent are install-specific, so they
  # live here (GitOps), not in the image. Empty ⇒ the System panel is empty rather
  # than guessing. Each entry: { name, group?, kind: Deployment|DaemonSet,
  # namespace, resourceName (exact object name) OR selector (matchLabels),
  # clusters? (omit ⇒ all aggregated clusters) }. Prefer resourceName for
  # control-plane singletons — and it is required for workloads that carry no
  # metadata labels of their own (the OME model-agent DaemonSet labels only its
  # pod template, so a label selector would never match it).
  # NOTE the RBAC caveat: components on remote workload clusters are read through
  # their mounted kubeconfig, whose identity must also have get/list/watch on
  # apps/v1 deployments+daemonsets.
  systemComponents: []
  #  - name: Controller manager
  #    group: control-plane
  #    kind: Deployment
  #    namespace: ome
  #    resourceName: ome-controller-manager
  #  - name: Model agent
  #    group: data-plane
  #    kind: DaemonSet
  #    namespace: ome
  #    resourceName: ome-model-agent-daemonset
  chat: # in-console inference test proxy (POST /v1/.../chat)
    enabled: false # off by default (forwards to a model endpoint)
    timeoutSecs: 60
    # Maximum bytes buffered from one upstream response. The server enforces this
    # while streaming, even when Content-Length is missing or incorrect.
    maxResponseBytes: 1048576
    connectTimeoutSecs: 5
    clientGraceSecs: 5 # lets the server's timeout response arrive before browser abort
    # HTTPS is required by default. Enable plaintext only in a controlled local
    # environment; it affects both status URLs and caller-selected gateway URLs.
    allowHttp: false
    # A caller override may always use the exact status.url origin. Any other
    # gateway must match one of these explicit entries; no domain is inferred from
    # status.url. Include a port for a non-default HTTPS listener.
    allowedHosts: []
    # Label-anchored suffixes, e.g. "serving.example.com". Suffix matches use the
    # default HTTPS port; configure an exact host for a non-default port.
    allowedHostSuffixes: []
    # mTLS the proxy presents to reach a model gateway that requires client certs.
    # OFF by default. Enabling it requires BOTH: (1) the pod's SA to have RBAC to
    # create cert-manager CertificateRequests (otherwise the CSI mount fails and the
    # pod never starts), and (2) the target gateway to authorize that pod identity.
    # The external gateway serves without a client cert, so leave this off unless a
    # gateway specifically demands mTLS and the SA has the RBAC above.
    tls:
      enabled: false
      # All three files below are required together when TLS identity is enabled.
      caCert: /var/facebook/rootcanal/ca.pem # from the rootcanal hostPath mount
      clientCert: /etc/muse/identity/tls.crt # from the cert-manager CSI mount
      clientKey: /etc/muse/identity/tls.key
      rootcanalHostPath: /var/facebook/rootcanal # node-delivered internal CA (hostPath)
      # Pod service-identity x509 issued by the cert-manager CSI driver (MKS ProdRA).
      identity:
        driver: csi.cert-manager.io
        issuerGroup: identity.mks.meta.com
        issuerKind: ProdRAClusterIssuer
        issuerName: prodra
        name: "" # empty ⇒ derived <cluster>/<namespace>/<serviceAccount> from the release; set to override
        type: MKS_SERVICEACCOUNT
  # On-demand pod inspection: live pod status, Events, and bounded log tails,
  # fetched per click on the deployment pods view. A deliberate exception to the
  # informer-only rule — one object per request, hard-bounded. Disabled unless
  # all three values are set. Remote-cluster kubeconfig identities need get on
  # pods/log and list on events for the full view; without them the pod status
  # still renders and events/logs degrade per-request.
  podInspect:
    timeoutSecs: 10
    logTailLines: 500
    logMaxBytes: 262144
    # Live log streaming (stern-style follow across a component's pods),
    # multiplexed over one SSE response. Bounded per session; requires the
    # inspection values above.
    streamMaxPods: 20
    streamMaxSecs: 900
  # On-demand monitoring through the shared PromQL Query Gateway. The
  # endpoint, trust, cluster identity, cache, and overload policy are deployment
  # config; muse-server has no compiled operational defaults.
  metrics:
    enabled: true
    gatewayUrl: https://observability-query-gateway.fbinfra.net/api/v1/
    queryRouting: 2 # Grafana Cloud native Prometheus metrics
    # MKS injects this service-identity certificate chain. The path is explicit so
    # non-MKS deployments can supply their own CA bundle instead.
    gatewayCaCert: /var/facebook/x509_identities/combined.pem
    # MUSE display cluster name -> metrics backend cluster ID. Missing entries produce one
    # unconfigured source and no upstream query fan-out for that cluster.
    clusterIds:
      msl-cw-use2-1: 652086758864/us-east-2/msl-cw-use2-1
      msl-cw-use2-2: 652086758864/us-east-2/msl-cw-use2-2
      msl-cw-use2-dev-2: 652086758864/us-east-2/msl-cw-use2-dev-2
      msl-gcp-usc1-1-tpu: msl-gcp-1-uwob1/us-central1/msl-gcp-usc1-1-tpu
      msl-gcp-usc1-2-tpu: msl-gcp-1-uwob1/us-central1/msl-gcp-usc1-2-tpu
    refreshSecs: 30 # active browser view refresh cadence
    queryConcurrency: 4 # shared Query Gateway in-flight limit per MUSE replica
    requestTimeoutSecs: 15
    cacheTtlSecs: 30
    cacheMaxEntries: 256
    maxResponseBytes: 8388608
    maxSeries: 5000
    maxScopePods: 2000
    # Each selected range supplies its Query Gateway lookback and evaluation step.
    # stepSeconds must be at least every catalog query's minimum step and no larger
    # than the range's seconds. Query Gateway currently accepts 60s granularity.
    timeRanges:
      default: 15m
      options:
        - id: 15m
          label: 15m
          seconds: 900
          stepSeconds: 60
        - id: 1h
          label: 1h
          seconds: 3600
          stepSeconds: 60
        - id: 6h
          label: 6h
          seconds: 21600
          stepSeconds: 300
    queriesFile: /etc/muse/metrics/metrics-queries.json # mount path (internal)
    # Default query set ships from charts/muse/files/metrics-queries.json
    # (deployment ranges: router → sglang → vllm; engine replica diagnostics:
    # instant only). Override per environment with a list of
    # { id, kind: instant|range, promql, window, step }, where range-query step
    # is the minimum cadence allowed for that expression.
    queries: []
  # jemalloc tuning (MALLOC_CONF). A background thread purges freed pages back to
  # the OS after a short decay, so RSS drops after the initial-list allocation
  # burst instead of lingering. Empty ⇒ jemalloc defaults (no background purge).
  mallocConf: "background_thread:true,dirty_decay_ms:5000,muzzy_decay_ms:5000"
  extraArgs: [] # any additional muse-server flags

service:
  port: 8080
  metricsPort: 9090
  api:
    # Headless service whose pod endpoints are registered in SMC for
    # mks-http-fe. This bypasses the interactive, TLS-terminating console
    # gateway for server-to-server API clients.
    enabled: true
    nameSuffix: api
    smcTierName: muse-api.muse.msl-mks-cp-lco-0.mks

# Gateway API exposure: attach an HTTPRoute to an existing (platform-owned) Envoy
# Gateway. The console is served under pathPrefix; the route strips the prefix
# before muse-server (which serves the SPA at / and the API at /v1). Disable to
# manage ingress yourself.
route:
  enabled: true
  gateway:
    name: ingress-eg-https
    namespace: envoy-gateway-system
    # HTTPS listener section names to attach to (mirror the ArgoCD route).
    sectionNames:
      - https
      - https-8443
  pathPrefix: /muse
  streams:
    # Gateway API request timeout for the exact SSE routes below. SSE responses
    # are intentionally long-lived, so 0s disables Envoy's finite route timeout.
    # Set null to omit the exact rules and use the general route's timeout policy.
    requestTimeout: 0s
    # Backend paths. The chart prepends pathPrefix for each exact external match,
    # then rewrites the request back to the full backend path.
    paths:
      - /v1/stream
  # Needed only if the backend Service is in a different namespace than the route
  # (it isn't here — both are in the release namespace).
  referenceGrant: false

# Optional Cilium policy: only the gateway's data-plane pods may reach muse-server.
networkPolicy:
  enabled: false
  gatewayPodSelector:
    app.kubernetes.io/managed-by: envoy-gateway

# Read-only ClusterRole (get/list/watch OME CRDs + nodes/pods) for the in-cluster
# case. Remote clusters are read via their mounted kubeconfig creds instead.
rbac:
  create: true

serviceAccount:
  create: true
  name: ""
  annotations: {} # e.g. a Meta service identity for gateway/manifold auth later

# muse-server holds one informer cache per aggregated cluster; the Pod cache
# dominates but is pruned to just the capacity-rollup fields, so it measures
# ~2Gi/replica per 150k pods watched (~0.25 cores steady). Memory scales
# ~linearly with the summed pod count of every aggregated cluster — size
# requests at ~15KiB x total pods and keep limit headroom for the initial-list
# spike, or the pod OOM-loops on startup without ever settling.
resources:
  requests:
    cpu: 500m
    memory: 10Gi
  limits:
    cpu: "2"
    memory: 14Gi

podAnnotations: {}

# Extra environment variables appended to the muse-server container. Used to point
# the injected cloud_oss exec-credential plugin at this pod's identity cert for
# GCP-IAM auth to GKE clusters, e.g.:
#   - {name: THRIFT_TLS_CL_CERT_PATH, value: /var/facebook/x509_identities/combined.pem}
#   - {name: THRIFT_TLS_CL_KEY_PATH,  value: /var/facebook/x509_identities/combined.pem}
#   - {name: THRIFT_TLS_SRV_CA_PATH,  value: /var/facebook/x509_identities/combined.pem}
extraEnv: []

nodeSelector: {}
tolerations: []
affinity: {}
