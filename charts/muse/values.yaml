# MUSE console — one image (muse-server) serving the read-plane API + web UI.
# 2 replicas for HA (no downtime on rollout / node drain); the Service load-balances
# reads across them. Each replica keeps its own informer cache per aggregated
# cluster, so N replicas ≈ N× memory and N× the watch/list load on those apiservers
# — set to 1 for a very large fleet where that cost outweighs HA.
replicaCount: 2

image:
  # Under global.hub when set and repository has no "/", else used as a full ref.
  repository: muse-server
  tag: latest
  pullPolicy: IfNotPresent

# Optional registry prefix (matches the ome-resources chart's global.hub).
global:
  hub: ""

# Workload clusters muse-server aggregates. Each entry mounts a kubeconfig Secret
# (key: `kubeconfig`) and passes `--cluster <name>=<path>`. Empty ⇒ muse uses its
# in-cluster ServiceAccount as a single "default" cluster (the one it runs in).
clusters: []
#  - name: cw-use2-1
#    kubeconfigSecret: muse-kubeconfig-cw-use2-1

# muse-server config — all env/flag driven, no values baked into the image.
config:
  # Bind address. "::" (IPv6 unspecified) dual-stacks on Linux — it accepts both
  # IPv6 and IPv4 — so it works on IPv6, IPv4, and dual-stack clusters. Plain
  # 0.0.0.0 is IPv4-only and fails kubelet probes on an IPv6 cluster.
  host: "::"
  webDir: /web # the image bakes the console here; "" ⇒ API-only
  listStrategy: auto # auto | streaming | paginated
  capacityRefreshSecs: 10
  chat: # in-console inference test proxy (POST /v1/.../chat)
    enabled: false # off by default (forwards to a model endpoint)
    timeoutSecs: 60
  # jemalloc tuning (MALLOC_CONF). A background thread purges freed pages back to
  # the OS after a short decay, so RSS drops after the initial-list allocation
  # burst instead of lingering. Empty ⇒ jemalloc defaults (no background purge).
  mallocConf: "background_thread:true,dirty_decay_ms:5000,muzzy_decay_ms:5000"
  extraArgs: [] # any additional muse-server flags

service:
  port: 8080
  metricsPort: 9090

# Gateway API exposure: attach an HTTPRoute to an existing (platform-owned) Envoy
# Gateway. The console is served under pathPrefix; the route strips the prefix
# before muse-server (which serves the SPA at / and the API at /v1). Disable to
# manage ingress yourself.
route:
  enabled: true
  gateway:
    name: ingress-eg-https
    namespace: envoy-gateway-system
    # HTTPS listener section names to attach to (mirror the ArgoCD route).
    sectionNames:
      - https
      - https-8443
  pathPrefix: /muse
  # Needed only if the backend Service is in a different namespace than the route
  # (it isn't here — both are in the release namespace).
  referenceGrant: false

# Optional Cilium policy: only the gateway's data-plane pods may reach muse-server.
networkPolicy:
  enabled: false
  gatewayPodSelector:
    app.kubernetes.io/managed-by: envoy-gateway

# Read-only ClusterRole (get/list/watch OME CRDs + nodes/pods) for the in-cluster
# case. Remote clusters are read via their mounted kubeconfig creds instead.
rbac:
  create: true

serviceAccount:
  create: true
  name: ""
  annotations: {} # e.g. a Meta service identity for gateway/manifold auth later

# muse-server holds one informer cache per aggregated cluster; the Pod cache
# dominates but is pruned to just the capacity-rollup fields, so a ~150k-pod fleet
# measures ~2Gi/replica (~0.25 cores steady). Requests track that; the limit keeps
# headroom for the initial-list spike. Memory still scales ~linearly with pod
# count — raise the limit for a substantially larger fleet.
resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 6Gi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
