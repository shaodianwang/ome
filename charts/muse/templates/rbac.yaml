{{- if .Values.rbac.create }}
# Read-only across the cluster muse-server runs in (the in-cluster / "default"
# case). Remote workload clusters are read via their mounted kubeconfig creds, so
# their RBAC lives there, not here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "muse.fullname" . }}
  labels: {{- include "muse.labels" . | nindent 4 }}
rules:
  - apiGroups: ["ome.io"]
    resources:
      - inferenceservices
      - basemodels
      - clusterbasemodels
      - servingruntimes
      - clusterservingruntimes
      - finetunedweights
      - inferencereplicas
      - workloadclusters
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  # On-demand pod inspection: bounded log tails and per-pod Events. Read-only,
  # per-click. Remote workload clusters read via their mounted kubeconfig, whose
  # identity must carry the same permissions for the full drill-down.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  # OME control-plane workloads for the System panel (OEP-0021.2): desired-vs-ready
  # health of the controller / scheduler / webhook / model-agent. Read-only.
  # Remote workload clusters read via their mounted kubeconfig, whose identity must
  # carry the same get/list/watch on these apps/v1 kinds.
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "muse.fullname" . }}
  labels: {{- include "muse.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "muse.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "muse.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.config.argo.enabled }}
---
# Argo CD delivery state is read only from its Application CRs. Access to Argo's
# cluster credential Secrets is deliberately excluded.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "muse.fullname" . }}-argocd-reader
  namespace: {{ required "config.argo.namespace is required when Argo observation is enabled" .Values.config.argo.namespace }}
  labels: {{- include "muse.labels" . | nindent 4 }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "muse.fullname" . }}-argocd-reader
  namespace: {{ required "config.argo.namespace is required when Argo observation is enabled" .Values.config.argo.namespace }}
  labels: {{- include "muse.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "muse.fullname" . }}-argocd-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "muse.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
