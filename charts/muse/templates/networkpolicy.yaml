{{- if .Values.networkPolicy.enabled }}
# Only the gateway's data-plane pods may reach muse-server (the gateway terminates
# TLS; nothing else should hit the backend directly). Adjust the selector to match
# your Envoy Gateway pods.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "muse.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "muse.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels: {{- include "muse.selectorLabels" . | nindent 6 }}
  ingress:
    - fromEndpoints:
        - matchLabels: {{- toYaml .Values.networkPolicy.gatewayPodSelector | nindent 12 }}
      toPorts:
        - ports:
            - port: {{ .Values.service.port | quote }}
              protocol: TCP
{{- end }}
