{{- if and .Values.route.enabled .Values.route.referenceGrant }}
# Only needed if you move the HTTPRoute into the gateway's namespace (a
# cross-namespace backendRef to muse-server's Service). By default the HTTPRoute
# lives in the release namespace alongside the Service, so this is off.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ include "muse.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "muse.labels" . | nindent 4 }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ .Values.route.gateway.namespace }}
  to:
    - group: ""
      kind: Service
{{- end }}
