{{- if .Values.service.api.enabled }}
{{- $smcTierName := required "service.api.smcTierName is required when service.api.enabled is true" .Values.service.api.smcTierName }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "muse.fullname" . }}-{{ .Values.service.api.nameSuffix }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "muse.labels" . | nindent 4 }}
  annotations:
    mks.meta.com/smc-tier-name: {{ $smcTierName | quote }}
spec:
  clusterIP: None
  selector: {{- include "muse.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- end }}
