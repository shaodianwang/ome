apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "muse.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "muse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "muse.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "muse.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "muse.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: muse-server
          image: {{ include "muse.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- range .Values.clusters }}
            - "--cluster={{ .name }}=/etc/muse/clusters/{{ .name }}/kubeconfig"
            {{- end }}
            {{- range .Values.config.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            # Config is env-driven (clap MUSE_* vars); nothing baked into the image.
            {{- if .Values.config.mallocConf }}
            # jemalloc purge tuning — read by the allocator at startup.
            - name: MALLOC_CONF
              value: {{ .Values.config.mallocConf | quote }}
            {{- end }}
            - name: MUSE_HOST
              value: {{ .Values.config.host | quote }}
            - name: MUSE_PORT
              value: {{ .Values.service.port | quote }}
            - name: MUSE_METRICS_PORT
              value: {{ .Values.service.metricsPort | quote }}
            - name: MUSE_LOG_JSON
              value: {{ .Values.config.logJson | quote }}
            - name: MUSE_LOG_FILTER
              value: {{ .Values.config.logFilter | quote }}
            - name: MUSE_WORKER_THREAD_STACK_BYTES
              value: {{ .Values.config.workerThreadStackBytes | quote }}
            - name: MUSE_LOCAL_CLUSTER_NAME
              value: {{ .Values.config.localClusterName | quote }}
            {{- with .Values.config.webDir }}
            - name: MUSE_WEB_DIR
              value: {{ . | quote }}
            {{- end }}
            - name: MUSE_LIST_STRATEGY
              value: {{ .Values.config.listStrategy | quote }}
            - name: MUSE_APISERVER_PREFLIGHT_TIMEOUT_SECS
              value: {{ .Values.config.apiserverPreflightTimeoutSecs | quote }}
            - name: MUSE_EVENT_HISTORY_LIMIT
              value: {{ .Values.config.eventHistoryLimit | quote }}
            {{- with .Values.config.cacheSyncTimeoutSecs }}
            - name: MUSE_CACHE_SYNC_TIMEOUT_SECS
              value: {{ . | quote }}
            {{- end }}
            - name: MUSE_CAPACITY_REFRESH_SECS
              value: {{ .Values.config.capacityRefreshSecs | quote }}
            {{- with .Values.config.liveInvalidationBatchMs }}
            - name: MUSE_LIVE_INVALIDATION_BATCH_MS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.sseKeepAliveSecs }}
            - name: MUSE_SSE_KEEP_ALIVE_SECS
              value: {{ . | quote }}
            {{- end }}
            - name: MUSE_CAPACITY_BACKSTOP_SECS
              value: {{ .Values.config.capacityBackstopSecs | quote }}
            - name: MUSE_CAPACITY_MAX_FRAGMENTS
              value: {{ .Values.config.capacityMaxFragments | quote }}
            - name: MUSE_CAPACITY_MAX_CONSUMERS
              value: {{ .Values.config.capacityMaxConsumers | quote }}
            - name: MUSE_SHUTDOWN_GRACE_SECS
              value: {{ .Values.config.shutdownGraceSecs | quote }}
            - name: MUSE_METRICS_UPKEEP_SECS
              value: {{ .Values.config.metricsUpkeepSecs | quote }}
            - name: MUSE_HTTP_LATENCY_BUCKETS
              value: {{ join "," .Values.config.httpLatencyBuckets | quote }}
            {{- with .Values.config.dashboardPolicy }}
            - name: MUSE_DASHBOARD_POLICY_JSON
              value: {{ toJson . | quote }}
            {{- end }}
            - name: MUSE_METRICS_REFRESH_SECS
              value: {{ .Values.config.metrics.refreshSecs | quote }}
            - name: MUSE_METRICS_QUERY_CONCURRENCY
              value: {{ .Values.config.metrics.queryConcurrency | quote }}
            - name: MUSE_METRICS_REQUEST_TIMEOUT_SECS
              value: {{ .Values.config.metrics.requestTimeoutSecs | quote }}
            - name: MUSE_CHAT_ENABLED
              value: {{ .Values.config.chat.enabled | quote }}
            {{- with .Values.config.chat.timeoutSecs }}
            - name: MUSE_CHAT_TIMEOUT_SECS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.chat.maxResponseBytes }}
            - name: MUSE_CHAT_MAX_RESPONSE_BYTES
              value: {{ . | int64 | quote }}
            {{- end }}
            {{- with .Values.config.chat.connectTimeoutSecs }}
            - name: MUSE_CHAT_CONNECT_TIMEOUT_SECS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.chat.clientGraceSecs }}
            - name: MUSE_CHAT_CLIENT_GRACE_SECS
              value: {{ . | quote }}
            {{- end }}
            - name: MUSE_CHAT_ALLOW_HTTP
              value: {{ .Values.config.chat.allowHttp | quote }}
            {{- with .Values.config.chat.allowedHosts }}
            - name: MUSE_CHAT_ALLOWED_HOSTS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.config.chat.allowedHostSuffixes }}
            - name: MUSE_CHAT_ALLOWED_HOST_SUFFIXES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.config.chat.tls.enabled }}
            # mTLS the chat proxy presents to reach a gated model gateway (certs mounted below).
            - name: MUSE_CHAT_CLIENT_CERT
              value: {{ .Values.config.chat.tls.clientCert | quote }}
            - name: MUSE_CHAT_CLIENT_KEY
              value: {{ .Values.config.chat.tls.clientKey | quote }}
            - name: MUSE_CHAT_CA_CERT
              value: {{ .Values.config.chat.tls.caCert | quote }}
            {{- end }}
            # Pod log fan-in streaming (GET /v1/logs/stream). Every knob is
            # required when enabled; the server disables only this feature (with
            # a logged reason) if one is missing or the buffer budget is exceeded.
            - name: MUSE_LOGS_ENABLED
              value: {{ .Values.config.logs.enabled | quote }}
            {{- if .Values.config.logs.allClusters }}
            {{- $names := list }}
            {{- range .Values.clusters }}
            {{- $names = append $names .name }}
            {{- end }}
            {{- if not $names }}
            {{- $names = list .Values.config.localClusterName }}
            {{- end }}
            - name: MUSE_LOGS_CLUSTERS
              value: {{ join "," $names | quote }}
            {{- else }}
            {{- with .Values.config.logs.clusters }}
            - name: MUSE_LOGS_CLUSTERS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.config.logs.maxSessions }}
            - name: MUSE_LOGS_MAX_SESSIONS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.logs.maxPodsPerSession }}
            - name: MUSE_LOGS_MAX_PODS_PER_SESSION
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.logs.maxTailsPerCluster }}
            - name: MUSE_LOGS_MAX_TAILS_PER_CLUSTER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.logs.bufferLines }}
            - name: MUSE_LOGS_BUFFER_LINES
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.logs.lineBytesMax }}
            - name: MUSE_LOGS_LINE_BYTES_MAX
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.logs.maxLinesPerSec }}
            - name: MUSE_LOGS_MAX_LINES_PER_SEC
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.logs.tailLinesMax }}
            - name: MUSE_LOGS_TAIL_LINES_MAX
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.logs.catchupLines }}
            - name: MUSE_LOGS_CATCHUP_LINES
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.logs.podRefreshSecs }}
            - name: MUSE_LOGS_POD_REFRESH_SECS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.logs.sessionMaxSecs }}
            - name: MUSE_LOGS_SESSION_MAX_SECS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.logs.startStaggerMs }}
            - name: MUSE_LOGS_START_STAGGER_MS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.logs.noticeIntervalSecs }}
            - name: MUSE_LOGS_NOTICE_INTERVAL_SECS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.logs.tailRetryBackoffSecs }}
            - name: MUSE_LOGS_TAIL_RETRY_BACKOFF_SECS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.logs.flushIntervalMs }}
            - name: MUSE_LOGS_FLUSH_INTERVAL_MS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.logs.batchMaxLines }}
            - name: MUSE_LOGS_BATCH_MAX_LINES
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.logs.clientBufferLines }}
            - name: MUSE_LOGS_CLIENT_BUFFER_LINES
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.logs.maxBufferBytes }}
            - name: MUSE_LOGS_MAX_BUFFER_BYTES
              value: {{ . | int64 | quote }}
            {{- end }}
            {{- with .Values.config.logs.sinceOptions }}
            - name: MUSE_LOGS_SINCE_OPTIONS_JSON
              value: {{ toJson . | quote }}
            {{- end }}
            {{- if .Values.config.metrics.enabled }}
            # Fleet metrics proxy → each cluster's Prometheus; query set mounted below.
            - name: MUSE_PROM_SERVICE
              value: {{ .Values.config.metrics.promService | quote }}
            - name: MUSE_METRICS_QUERIES_FILE
              value: {{ .Values.config.metrics.queriesFile | quote }}
            {{- with .Values.config.metrics.timeRanges }}
            - name: MUSE_METRICS_TIME_RANGES_JSON
              value: {{ toJson . | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.clusters .Values.config.metrics.enabled .Values.config.chat.tls.enabled }}
          volumeMounts:
            {{- range .Values.clusters }}
            - name: kubeconfig-{{ .name }}
              mountPath: /etc/muse/clusters/{{ .name }}
              readOnly: true
            {{- end }}
            {{- if .Values.config.metrics.enabled }}
            - name: metrics-queries
              mountPath: /etc/muse/metrics
              readOnly: true
            {{- end }}
            {{- if .Values.config.chat.tls.enabled }}
            - name: chat-rootcanal
              mountPath: {{ .Values.config.chat.tls.rootcanalHostPath }}
              readOnly: true
            - name: chat-identity
              mountPath: /etc/muse/identity
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.clusters .Values.config.metrics.enabled .Values.config.chat.tls.enabled }}
      volumes:
        # Each workload cluster's kubeconfig Secret (key: `kubeconfig`).
        {{- range .Values.clusters }}
        - name: kubeconfig-{{ .name }}
          secret:
            secretName: {{ .kubeconfigSecret }}
        {{- end }}
        {{- if .Values.config.metrics.enabled }}
        # The curated dashboard query set (ConfigMap → --metrics-queries-file).
        - name: metrics-queries
          configMap:
            name: {{ include "muse.fullname" . }}-metrics
        {{- end }}
        {{- if .Values.config.chat.tls.enabled }}
        # Internal CA on the node (hostPath) + a pod service-identity x509 from the
        # cert-manager CSI driver — the mTLS materials the model gateway requires.
        - name: chat-rootcanal
          hostPath:
            path: {{ .Values.config.chat.tls.rootcanalHostPath }}
            type: Directory
        - name: chat-identity
          csi:
            driver: {{ .Values.config.chat.tls.identity.driver }}
            readOnly: true
            volumeAttributes:
              csi.cert-manager.io/issuer-group: {{ .Values.config.chat.tls.identity.issuerGroup }}
              csi.cert-manager.io/issuer-kind: {{ .Values.config.chat.tls.identity.issuerKind }}
              csi.cert-manager.io/issuer-name: {{ .Values.config.chat.tls.identity.issuerName }}
              identity.mks.meta.com/name: {{ .Values.config.chat.tls.identity.name | default (printf "%s/%s/%s" (trimPrefix "muse-" (include "muse.fullname" .)) .Release.Namespace (include "muse.serviceAccountName" .)) | quote }}
              identity.mks.meta.com/type: {{ .Values.config.chat.tls.identity.type }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
