apiVersion: v1
kind: Service
metadata:
  name: {{ include "muse.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "muse.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "muse.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
