# ome-bot — the deterministic core of the OME Slack bot. One image carrying the
# bot and kubectl-ome. A relay (the Slack inbound handler) calls the HTTP API
# and posts the reply; this Deployment holds no Slack credential.
replicaCount: 1

image:
  # Under global.hub when set and repository has no "/", else used as a full ref.
  repository: ome-bot
  tag: latest
  pullPolicy: IfNotPresent

# Optional registry prefix (matches the other OME charts' global.hub).
global:
  hub: ""

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Pod annotations. On a cluster with platform pod identity, this is where the
# identity and auth-tool injection annotations go; they give the pod the
# exec-credential provider named in config.execCommand and a certificate to
# run it with. The chart bakes in no platform-specific annotation.
podAnnotations: {}
podLabels: {}

# Extra environment for the bot container, inherited by kubectl-ome and the
# exec-credential provider it runs (for example the TLS cert paths the
# injected provider reads).
extraEnv: []

# HOME for the container; kubectl-ome caches API discovery under it.
homeDir: /tmp

service:
  port: 8080
  api:
    # Headless Service whose pod endpoints the platform registers as the SMC
    # tier named in smcTierName, so mks-http-fe routes requests carrying that
    # name in the service_endpoint header to the bot. Required when enabled.
    enabled: false
    nameSuffix: api
    smcTierName: ""

# Volume holding the bot's secret files, mounted read-only at
# /etc/ome-bot/secrets: the HMAC key under config.auth.secretKey and every
# file a tool's envFromFiles names. Any volume source works, for example a
# Secret or a CSI secrets-store volume that mounts files directly. Required
# when config.auth.mode is hmac.
secrets:
  volume: {}
  #  secret:
  #    secretName: ome-bot

config:
  # kubectl-ome inside the image.
  kubectlOmePath: /usr/local/bin/kubectl-ome
  # Where rendered per-cluster kubeconfigs are written (an emptyDir).
  kubeconfigDir: /var/run/ome-bot/kubeconfigs
  # The exec-credential provider named in rendered kubeconfigs. Required when
  # any cluster entry uses tokenArgs. Empty ⇒ only kubeconfigPath/inCluster
  # entries are valid.
  execCommand: ""
  # KEY=VALUE pairs exported to kubectl-ome in addition to the pod env.
  env: []
  timeouts:
    commandSeconds: 25 # one kubectl-ome invocation
    probeSeconds: 10 # one cluster reachability probe
    fanoutSeconds: 60 # a command run on every cluster
    readHeaderSeconds: 10 # HTTP request header read
    shutdownSeconds: 10 # graceful drain on SIGTERM
  # Largest accepted request body.
  maxRequestBytes: 65536
  # Requests that run a process or probe clusters at once; more get 429 busy.
  maxInFlight: 8
  # Bytes of CLI output kept per cluster per command.
  outputLimitBytes: 12000
  # The OME controller Deployment whose image tag is reported as the installed
  # version. Both empty ⇒ the column is omitted.
  ome:
    namespace: ""
    managerDeployment: ""
  auth:
    # "hmac": every request carries X-OME-Bot-Timestamp and
    # X-OME-Bot-Signature = hex(HMAC-SHA256(key, timestamp + "\n" + body)).
    # "none": only for a Deployment that is unreachable except by port-forward.
    mode: hmac
    # File name of the shared key inside secrets.volume.
    secretKey: hmac
    maxSkewSeconds: 300
  # Read-only tools served by POST /v1/tool, rendered verbatim. Each needs
  # name, command, subcommands and timeoutSeconds; argsPrefix, forbiddenFlags,
  # env (KEY=VALUE) and envFromFiles (KEY: absolute path, read per call) are
  # optional. Arguments are passed after argsPrefix without a shell.
  tools: []
  #  - name: builds
  #    command: /usr/bin/python3
  #    argsPrefix: [/opt/ome/skills/ci-triage/scripts/main_builds.py]
  #    subcommands: [list, diff]
  #    timeoutSeconds: 60
  #    envFromFiles: {BUILDKITE_API_TOKEN: /etc/ome-bot/secrets/buildkite-token}
  #    env: [OME_CITRIAGE_SCRATCH=/tmp/scratch]
  # The built-in docs tool searches and reads .md and .yaml files under these
  # roots. The paths are the trees the image bakes in. Set to null to disable.
  docs:
    roots:
      - {name: docs, path: /opt/ome/docs}
      - {name: oeps, path: /opt/ome/oeps}
      - {name: skills, path: /opt/ome/skills}
      - {name: upstream-docs, path: /opt/ome/upstream/site/content/en/docs}
      - {name: kubectl-ome, path: /opt/ome/upstream/cmd/kubectl-ome}
    maxMatches: 50
    maxReadBytes: 24000
  # Kargo project read by GET /v1/release. Set exactly one of cluster, the
  # registry entry whose credentials read it, and inCluster: true, the pod's
  # own ServiceAccount. Empty => the endpoint answers not_configured.
  kargo: {}
  #  inCluster: true
  #  namespace: kargo-proj-a
  #  recentFreight: 5
  # The guarded kubectl-ome verbs (rollout pause|resume|promote|rollback|repin,
  # traffic drain|undrain, migration start, instance release-held, runtime
  # sync, scale) run only with this on, only on a registry entry with
  # `writable: true`, only for an actor the relay cleared (`actor.canMutate`),
  # and only with `--yes`. Off ⇒ every guarded verb answers mutations_off.
  mutations:
    enabled: false

# The fleet registry, rendered verbatim into the config. Each entry names one
# credential source:
#   server + tokenArgs      exec-credential kubeconfig rendered at startup
#   kubeconfigPath          a kubeconfig mounted by other means
#   inCluster: true         the pod's own ServiceAccount
# Optional: role (hub|member|standalone), hub, kargoStage,
# insecureSkipTLSVerify, certificateAuthorityData (base64), and writable
# (admits the guarded verbs once config.mutations.enabled is on; a
# development cluster, never a production one).
clusters: []
#  - name: member-a
#    provider: gke
#    role: member
#    hub: hub-a
#    server: https://member-a.example.com
#    certificateAuthorityData: ""
#    tokenArgs: [k8s, get-token, project-a, member-a, --provider, gcp, --output, exec-credential]

# Attach to a shared Gateway API gateway. Off by default: with auth.mode
# "none" the service must stay unreachable from outside the cluster.
route:
  enabled: false
  gateway:
    name: ""
    namespace: ""
    sectionNames: []
  pathPrefix: /ome-bot

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}
