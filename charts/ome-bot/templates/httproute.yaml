{{- if .Values.route.enabled }}
{{- if eq .Values.config.auth.mode "none" }}
{{- fail "route.enabled requires config.auth.mode hmac; an unauthenticated API must not be reachable through the gateway" }}
{{- end }}
# Attaches to a shared, platform-owned gateway and serves the API under
# pathPrefix, stripping it before the bot (which serves /v1 at the root).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ome-bot.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ome-bot.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- range .Values.route.gateway.sectionNames }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $.Values.route.gateway.name }}
      namespace: {{ $.Values.route.gateway.namespace }}
      sectionName: {{ . }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.route.pathPrefix | quote }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "ome-bot.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
