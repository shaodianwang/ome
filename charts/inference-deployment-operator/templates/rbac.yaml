apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "inference-deployment-operator.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "inference-deployment-operator.name" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: ome
rules:
  - apiGroups:
      - ome.io
    resources:
      - inferencedeployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ome.io
    resources:
      - inferencedeployments/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - ome.io
    resources:
      - inferencedeployments/finalizers
    verbs:
      - update
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "inference-deployment-operator.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "inference-deployment-operator.name" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: ome
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "inference-deployment-operator.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "inference-deployment-operator.name" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "inference-deployment-operator.name" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "inference-deployment-operator.name" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: ome
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "inference-deployment-operator.name" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "inference-deployment-operator.name" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: ome
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "inference-deployment-operator.name" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "inference-deployment-operator.name" . }}
    namespace: {{ .Release.Namespace }}
