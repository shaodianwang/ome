apiVersion: ome.io/v1alpha1
kind: InferenceDeployment
metadata:
  name: multicluster-test-e2e
  namespace: inference-deployment-system
spec:
  namespace: sandbox
  priorityClassName: staging
  checkpoint: "manifold://fair_llms_prod/tree/vllm_test/tier5_integRL_64x168_rev3-bz10zrx3/checkpoint_0000430/nvfp4-moe-fp8kv-gb300_config"
  clusters:
    - name: msl-cw-use2-dev-2
      prefill:
        minReplicas: 1
        maxReplicas: 1
      decode:
        minReplicas: 1
        maxReplicas: 1
      router:
        minReplicas: 2
        maxReplicas: 2
  sglang:
    image: 168653207203.dkr.ecr.us-east-2.amazonaws.com/msl_infra/prod-inference-gb300:20260605-ad8ee25e4
    gpus: 4
    args:
      tp-size: "4"
      ep-size: "4"
      dtype: bfloat16
      quantization: modelopt_fp4
      kv-cache-dtype: bfloat16
      moe-runner-backend: flashinfer_trtllm
      context-length: "1048576"
      speculative-algorithm: EAGLE3
      speculative-draft-model: "$(CC_MODEL_PATH)/draft_hf"
      fallback-speculative-draft-model-path: "$(MODEL_PATH)/draft_hf"
      speculative-draft-model-quantization: unquant
      preferred-sampling-params: '{"temperature": 1.0, "top_p": 0.9}'
      log-requests: "true"
      log-requests-level: "1"
      enable-request-time-stats-logging: "true"
      json-model-override-args: '{"attn_temperature_tuning_floor_scale":131072,"attn_temperature_tuning_layers":"global","attn_temperature_tuning_q_scale_constant":0.2}'
      disaggregation-transfer-backend: meta-p2p
    components:
      prefill:
        args:
          enable-sp: "true"
          disaggregation-bootstrap-port: "8998"
      decode:
        args:
          mem-fraction-static: "0.8"
    env:
      SGLANG_CLUSTER: cks
      SGLANG_EXTERNAL_MODEL_PACKAGE: sglang_meta.srt.models
      CUDA_ENABLE_USER_TRIGGERED_COREDUMP: "1"
      CUDA_COREDUMP_PIPE: /tmp/corepipe.cuda.%h.%p
      SGLANG_DISAGGREGATION_NIXL_BACKEND: UCX
  router:
    image: 168653207203.dkr.ecr.us-east-2.amazonaws.com/msl_infra/prod-inference-router:20260605-ad8ee25e4
    cpu: "16"
    memory: 32Gi
    args:
      port: "30080"
      metrics-port: "9090"
      model-name: llama4x
      backend-timeout: "300"
      bootstrap-port: "8998"
      k8s-namespace: "$(NAMESPACE)"
      prefill-label-selector: component=engine,ome.io/inferenceservice=$(INFERENCESERVICE_NAME)
      decode-label-selector: component=decoder,ome.io/inferenceservice=$(INFERENCESERVICE_NAME)
      k8s-engine-port: "30000"
