apiVersion: v1
kind: ConfigMap
metadata:
  name: inferenceservice-config
  namespace: ome
data:
  ingress: |-
    {
        "ingressGateway" : "istio-system/ingress-gateway",
        "ingressService" : "istio-ingressgateway.istio-system.svc.cluster.local",
        "omeIngressGateway" : "",
        "ingressDomain"  : "svc.cluster.local",
        "ingressClassName" : "istio",
        "additionalIngressDomains" : null,
        "domainTemplate": "{{ .Name }}.{{ .Namespace }}.{{ .IngressDomain }}",
        "urlScheme": "http",
        "pathTemplate": "",
        "disableIngressCreation": true,
        "enableGatewayAPI": false
    }

  deploy: |-
    {
      "defaultDeploymentMode": "RawDeployment",
      "replicas": {
        "defaultMinReplicas": 1,
        "defaultMaxReplicas": {
          "engine": 3,
          "decoder": 3,
          "router": 2
        }
      }
    }

  podDisruptionBudget: |-
    {
      "rawDeployment": {
        "maxUnavailable": 1
      }
    }

  # The scale-up and scale-down Pod batch sizes bound create and delete work in
  # Pod-equivalent units. Each Instance or gang is selected atomically, and a
  # first eligible Instance larger than its budget proceeds alone. Omitting a
  # batch field preserves that direction's unbounded selection. The scale-down
  # requeue interval polls while destructive work remains in flight; omitting
  # it leaves progress to watched resources and exact configured lifecycle
  # deadlines. These settings are read once at manager startup; invalid values
  # prevent startup, and a direct ConfigMap edit requires a manager restart.
  lifecycle: |-
    {
      "scaleUpPodBatchSize": 100,
      "scaleDownPodBatchSize": 100,
      "scaleDownRequeueInterval": "5s"
    }

  canaryAnalysis: |-
    {
      "bundledPrometheusAddress": "http://ome-prometheus.ome.svc:9090",
      "queryTimeout": "5s",
      "maxConcurrency": 8,
      "cacheTTL": "2m"
    }

  metricsAggregator: |-
    {
      "enableMetricAggregation": "false",
      "enablePrometheusScraping" : "false"
    }

  # podMonitor configures cluster-scope defaults applied to every PodMonitor OME
  # generates per InferenceService Component. Omit this key to keep the legacy
  # behavior (PodMonitors carry only OME's own labels; a label-selecting metrics
  # collector will not scrape them, so metrics flow only via the pod-annotation
  # scrape path). There is intentionally NO in-code default — supply the value
  # via this ConfigMap (Helm chart / GitOps), so scrape-pipeline-specific values
  # are never hardcoded in the binary.
  #
  # - labels:      merged into each PodMonitor's metadata.labels (NOT
  #                spec.selector). Opts the monitor into a label-selecting
  #                collector, e.g. an OTel target allocator whose
  #                podMonitorSelector is {monitoring.example.com/scrape-tier: cluster}.
  # - relabelings: appended to every PodMetricsEndpoint so scraped series carry
  #                the same label schema as the legacy pod-annotation scrape.
  #
  # podMonitor: |-
  #   {
  #     "labels": { "monitoring.example.com/scrape-tier": "cluster" },
  #     "relabelings": [
  #       { "sourceLabels": ["__meta_kubernetes_pod_label_ome_io_inferenceservice"], "targetLabel": "inferenceservice" },
  #       { "sourceLabels": ["__meta_kubernetes_pod_label_component"], "targetLabel": "component" },
  #       { "sourceLabels": ["__meta_kubernetes_pod_label_serving_runtime"], "targetLabel": "serving_runtime" },
  #       { "sourceLabels": ["__meta_kubernetes_namespace"], "targetLabel": "k8s_namespace_name" }
  #     ]
  #   }

  # modelCache configures the optional cluster-wide model cache provider used
  # by BaseModel/ClusterBaseModel resources with spec.distribution: Sharded.
  # Omit this key (or leave provider empty) to keep the default PerNode /
  # model-agent behavior. The built-in provider is "cluster_cache".
  #
  # modelCache: |-
  #   {
  #     "provider": "cluster_cache",
  #     "endpoint": "http://cluster-cache.ome.svc.cluster.local:10090",
  #     "options": {
  #       "timeout": "5m",
  #       "operation_retention": "10m"
  #     }
  #   }

  modelInit: |-
    {
        "image" : "ghcr.io/moirai-internal/ome-agent:v0.1.5",
        "memoryRequest": "320Gi",
        "memoryLimit": "320Gi",
        "cpuRequest": "15",
        "cpuLimit": "15",
        "compartmentId": "ocid1.compartment.oc1..aaaaaaaarncfmdarfvbvhfj2oknyuvvftcp4p6ra77xlswftk67kcffmm2xq",
        "authType" : "InstancePrincipal",
        "vaultId": "ocid1.vault.oc1.eu-frankfurt-1.ens4gnknaaec4.abtheljrqneswo524ce3ytfqv3wqdjz4yi2drovyjnuo5lghz2fr76a7l7lq",
        "region": "eu-frankfurt-1"
    }

  omeAgent: |-
    {
      "image": "ghcr.io/moirai-internal/ome-agent:v0.1.5",
      "serviceAccount": "ome-model-metadata",
      "cpuRequest": "100m",
      "memoryRequest": "256Mi",
      "cpuLimit": "500m",
      "memoryLimit": "512Mi",
      "backoffLimit": 2,
      "ttlSecondsAfterFinished": 3600,
      "nodeSelector": {},
      "tolerations": [],
      "affinity": {},
      "priorityClassName": ""
    }
