apiVersion: v1
kind: ConfigMap
metadata:
  name: inferenceservice-config
  namespace: ome
data:
  ingress: |-
    {
        "ingressGateway" : "istio-system/ingress-gateway",
        "ingressService" : "istio-ingressgateway.istio-system.svc.cluster.local",
        "omeIngressGateway" : "",
        "ingressDomain"  : "svc.cluster.local",
        "ingressClassName" : "istio",
        "additionalIngressDomains" : null,
        "domainTemplate": "{{ .Name }}.{{ .Namespace }}.{{ .IngressDomain }}",
        "urlScheme": "http",
        "pathTemplate": "",
        "disableIngressCreation": true,
        "enableGatewayAPI": false
    }

  deploy: |-
    {
      "defaultDeploymentMode": "RawDeployment"
    }

  canaryAnalysis: |-
    {
      "bundledPrometheusAddress": "http://ome-prometheus.ome.svc:9090",
      "queryTimeout": "5s",
      "maxConcurrency": 8,
      "cacheTTL": "2m"
    }

  metricsAggregator: |-
    {
      "enableMetricAggregation": "false",
      "enablePrometheusScraping" : "false"
    }

  # modelCache configures the optional cluster-wide model cache provider used
  # by BaseModel/ClusterBaseModel resources with spec.distribution: Sharded.
  # Omit this key (or leave provider empty) to keep the default PerNode /
  # model-agent behavior. The built-in provider is "cluster_cache".
  #
  # modelCache: |-
  #   {
  #     "provider": "cluster_cache",
  #     "endpoint": "http://cluster-cache.ome.svc.cluster.local:10090",
  #     "options": {
  #       "timeout": "5m",
  #       "operation_retention": "10m"
  #     }
  #   }

  modelInit: |-
    {
        "image" : "ghcr.io/moirai-internal/ome-agent:v0.1.5",
        "memoryRequest": "320Gi",
        "memoryLimit": "320Gi",
        "cpuRequest": "15",
        "cpuLimit": "15",
        "compartmentId": "ocid1.compartment.oc1..aaaaaaaarncfmdarfvbvhfj2oknyuvvftcp4p6ra77xlswftk67kcffmm2xq",
        "authType" : "InstancePrincipal",
        "vaultId": "ocid1.vault.oc1.eu-frankfurt-1.ens4gnknaaec4.abtheljrqneswo524ce3ytfqv3wqdjz4yi2drovyjnuo5lghz2fr76a7l7lq",
        "region": "eu-frankfurt-1"
    }

  omeAgent: |-
    {
      "image": "ghcr.io/moirai-internal/ome-agent:v0.1.5",
      "serviceAccount": "ome-model-metadata",
      "cpuRequest": "100m",
      "memoryRequest": "256Mi",
      "cpuLimit": "500m",
      "memoryLimit": "512Mi",
      "backoffLimit": 2,
      "ttlSecondsAfterFinished": 3600,
      "nodeSelector": {},
      "tolerations": [],
      "affinity": {},
      "priorityClassName": ""
    }
