# Permissions the metadata Job needs:
#   - read+write the single per-PVC status ConfigMap in the OME namespace
#     (deterministic name via constants.GetPVCMetadataConfigMapName).
#     The BaseModel/ClusterBaseModel controller Gets that ConfigMap by
#     exact name and updates the CR itself — the Job never writes to
#     basemodels / clusterbasemodels.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ome-model-metadata
  labels:
    app.kubernetes.io/component: ome-model-metadata-job
    app.kubernetes.io/managed-by: ome-controller-manager
    app.kubernetes.io/name: ome-model-metadata
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - create
      - update
      - patch
