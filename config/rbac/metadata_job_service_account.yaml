# ServiceAccount used by the metadata-extraction Job that the BaseModel /
# ClusterBaseModel controller spawns for PVC-backed models. The Job runs
# `ome-agent model-metadata` and writes the per-model status ConfigMap.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ome-model-metadata
  labels:
    app.kubernetes.io/component: ome-model-metadata-job
    app.kubernetes.io/managed-by: ome-controller-manager
    app.kubernetes.io/name: ome-model-metadata
