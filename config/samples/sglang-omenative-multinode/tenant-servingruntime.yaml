# Tenant runtime — THIS is the file scientists edit. It inherits the platform
# base via `ome.io/inherit-from` and adds the per-workload bits:
#   - the container image (your sglang build)
#   - the sglang launch command + flags (tp/ep size, dtype, context length, and
#     the MULTI-NODE distributed-init flags)
#   - the model path (cluster-cache fetched at runtime)
#
# Everything else (GPUs, IB, volumes, probes, infra env) comes from the base.
#
# MULTI-NODE launch: the engine is a gang of 1 leader + 3 workers. sglang needs
# a global `--node-rank` per node, the gang size `--nnodes`, and a shared
# `--dist-init-addr`. OME injects all three per pod, so the command is plain
# argv with $(VAR) substitution — no shell:
#   OME_INSTANCE_POD_RANK  = gang-global node rank 0..N-1 (leader 0, workers 1..3)
#   OME_INSTANCE_POD_COUNT = gang size (nnodes)
#   OME_LEADER_ADDRESS     = peer-DNS FQDN of the gang's leader pod
# (OME_RUNNER / OME_RUNNER_INDEX are also available, for per-runner sharding.)
#
# Requires an OME control plane with OME_INSTANCE_POD_RANK / _COUNT (the gang-
# global rank enhancement). On older controllers, derive the rank in an `sh -c`
# wrapper from OME_RUNNER + OME_RUNNER_INDEX (leader=0, worker=index+1) instead.
#
# Container name must be `ome-container` for the engine and `router` for the
# router — OME keys off those names.
apiVersion: ome.io/v1beta1
kind: ServingRuntime
metadata:
  name: srt-tier5-42b-bf16-mn
  namespace: sandbox
  annotations:
    ome.io/inherit-from: srt-tier5-42b-bf16-mn-base
spec:
  engineConfig:
    # Leader and worker run the SAME image + command + env — plain argv, since
    # OME injects the gang-global rank/size per pod (each pod substitutes its
    # own $(OME_INSTANCE_POD_RANK)). A single definition (anchors) serves both.
    leader:
      runner:
        name: ome-container
        image: &image 168653207203.dkr.ecr.us-east-2.amazonaws.com/msl_infra/prod-inference-gb300:20260601-ba882a31  # TODO: pin your sglang build
        command: &engineCmd
          - python3
          - -m
          - sglang_meta.launch_server
          - --host
          - "0.0.0.0"
          - --port
          - "30000"
          - --model-path
          - $(CC_MODEL_PATH)
          # Fallback to the PVC-backed ClusterBaseModel (OME injects $(MODEL_PATH)
          # from spec.model). With CC ACL-blocked on this checkpoint, the PVC is
          # what actually serves today. Drop this pair once CC is stable.
          - --fallback-model-path
          - $(MODEL_PATH)
          - --tp-size
          - "16"
          - --ep-size
          - "16"
          - --dtype
          - bfloat16
          - --kv-cache-dtype
          - bfloat16
          - --moe-runner-backend
          - flashinfer_trtllm
          - --context-length
          - "131072"
          # Multi-node — OME injects these per pod (gang-global), so no shell math:
          - --dist-init-addr
          - $(OME_LEADER_ADDRESS):5000
          - --nnodes
          - $(OME_INSTANCE_POD_COUNT)
          - --node-rank
          - $(OME_INSTANCE_POD_RANK)
          - --log-requests
          - --log-requests-level
          - "1"
          - --enable-request-time-stats-logging
        env: &workloadEnv       # CC_MODEL_PATH + CLUSTER_CACHE_* fetch the model at runtime (cluster cache)
          # The internal Manifold checkpoint to serve — no BaseModel CRD; the
          # weights are pulled by cluster cache at runtime.
          - name: CC_MODEL_PATH
            value: "manifold://fair_llms_prod/tree/vllm_test/consolidation_sv3_split_tier5_42b_128k-rsbvw4wb/checkpoint_0000150/checkpoint"
          - name: CLUSTER_CACHE_HEADLESS_SERVICE
            value: "cluster-cache-headless.clustercache.svc.cluster.local:10090"
          # TODO: a CC tensor-hash verify tag must match a precomputed artifact
          # for THIS model at tp16/ep16; omitted until you have one. Example
          # from the nvfp4 sample was "@tp4ep4".
          # - name: CLUSTER_CACHE_VERIFY_TENSOR_HASH_AGAINST
          #   value: "@tp16ep16"
          - name: CLUSTER_CACHE_GPU_DIRECT
            value: "1"
          - name: CLUSTER_CACHE_BBOX
            value: "1"
          - name: CLUSTER_CACHE_BARRIER_TIMEOUT_S
            value: "60"
          - name: CLUSTER_CACHE_HTTP_BATCH_REQUEST_TIMEOUT_SECS
            value: "60"
          - name: CLUSTER_CACHE_OVERLOAD_RETRY_ATTEMPTS
            value: "3"
          - name: SGLANG_CLUSTER
            value: cks
          - name: SGLANG_EXTERNAL_MODEL_PACKAGE
            value: sglang_meta.srt.models
    worker:
      runner:
        name: ome-container
        image: *image
        command: *engineCmd     # same wrapper; branches to worker ranks via OME_RUNNER
        env: *workloadEnv

  # Router — single entrypoint. NON-PD: there is no decode pool, so the router
  # routes all traffic to the engine. For a multi-node engine only the LEADER
  # pod serves the OpenAI API (workers do distributed compute), so the backend
  # selector targets engine leader pods.
  routerConfig:
    runner:
      name: router
      image: 168653207203.dkr.ecr.us-east-2.amazonaws.com/msl_infra/prod-inference-router:20260601-ba882a31  # TODO: pin your router build
      args:
        - --port
        - "30080"
        - --metrics-port
        - "9090"
        - --model-name
        - tier5-42b-bf16
        - --backend-timeout
        - "300"
        - --k8s-namespace
        - $(NAMESPACE)
        # Non-PD engine-only routing: this sgl-router build discovers backends via
        # --label-selector (it REJECTS --worker-label-selector) + --k8s-namespace
        # + --k8s-engine-port. Only the multi-node LEADER serves the OpenAI API,
        # so the selector pins ome.io/runner=leader.
        - --label-selector
        - component=engine,ome.io/runner=leader,ome.io/inferenceservice=$(INFERENCESERVICE_NAME)
        - --k8s-engine-port
        - "30000"
