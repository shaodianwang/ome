# Platform base runtime — the hardware/platform layer for a MULTI-NODE,
# engine-only (no PD) sglang deployment on gb300. Owned by the platform team;
# scientists don't normally edit this.
#
# It carries ONLY the stable bits: GPU/RDMA resources, volumes, probes, ports,
# IB networking, and infrastructure env (NCCL/CUDA/...). It has NO image and NO
# sglang flags — those volatile, per-workload bits live in the tenant runtime,
# which inherits everything here via `ome.io/inherit-from`.
#
# MULTI-NODE shape: the engine is a gang of 1 `leader` + N `worker` pods
# (LeaderWorkerSet). Leader and worker run on identical hardware, so the
# container template is written once with a YAML anchor (&gpuRunner) and reused
# under both `leader.runner` and `worker.runner`. The two differ only in the
# launch command's `--node-rank`, which the tenant runtime derives at runtime
# from the OME-injected env — so even the command can be shared.
#
# There is NO decoderConfig: this is engine + router only (not prefill-decode).
apiVersion: ome.io/v1beta1
kind: ClusterServingRuntime
metadata:
  name: srt-tier5-42b-bf16-mn-base
spec:
  disabled: false
  protocolVersions:
    - openAI
  # The ISVC validator ENFORCES that the named runtime supports the model's
  # format / architecture / framework — even with the runtime named explicitly —
  # so modelArchitecture MUST match the checkpoint's config.json, or the ISVC is
  # rejected ("architecture mismatch").
  supportedModelFormats:
    - modelFormat:
        name: safetensors
        version: "1.0.0"
        operator: GreaterThanOrEqual
      modelFramework:
        name: transformers
        operator: Equal
      modelArchitecture: Llama4xOmniForCausalLM   # checkpoint config.json: architectures=[Llama4xOmniForCausalLM], model_type=llama4x_omni
      autoSelect: false
      priority: 1

  # Engine — a multi-node gang. leader + worker share the &gpuRunner template.
  engineConfig:
    annotations:
      # IB macvlan interfaces for cross-node NCCL over RoCE (the gang spans
      # nodes and all-reduces over IB). TODO: confirm the interface list for
      # your cluster's fabric.
      k8s.v1.cni.cncf.io/networks: '[{"name":"ibs0p0-macvlan","namespace":"cw-multus"},{"name":"ibs0p1-macvlan","namespace":"cw-multus"},{"name":"ibs0p2-macvlan","namespace":"cw-multus"},{"name":"ibs0p3-macvlan","namespace":"cw-multus"},{"name":"ibs1p0-macvlan","namespace":"cw-multus"},{"name":"ibs1p1-macvlan","namespace":"cw-multus"},{"name":"ibs1p2-macvlan","namespace":"cw-multus"},{"name":"ibs1p3-macvlan","namespace":"cw-multus"},{"name":"ibs2p0-macvlan","namespace":"cw-multus"},{"name":"ibs2p1-macvlan","namespace":"cw-multus"},{"name":"ibs2p2-macvlan","namespace":"cw-multus"},{"name":"ibs2p3-macvlan","namespace":"cw-multus"},{"name":"ibs3p0-macvlan","namespace":"cw-multus"},{"name":"ibs3p1-macvlan","namespace":"cw-multus"},{"name":"ibs3p2-macvlan","namespace":"cw-multus"},{"name":"ibs3p3-macvlan","namespace":"cw-multus"}]'
      fb.metric.schema: &metricSchema "sglang_metrics"
    # MULTI-NODE: pod-level fields (volumes, nodeSelector, tolerations) MUST live
    # under leader:/worker:, NOT at engineConfig level. OME builds the gang pods
    # from Leader.PodSpec/Worker.PodSpec and does NOT merge engineConfig-level
    # pod fields in (single-pod DOES use them, so they work there). Declared at
    # engineConfig level for a gang, the volumes get dropped and the runner's
    # mounts have no backing volume → the kube-apiserver rejects the pod.
    # (OME [Core] bug — should propagate to leader/worker or reject at admission.)
    leader:
      nodeSelector: &arm64Node
        kubernetes.io/arch: arm64
      tolerations: &gpuTolerations
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes: &shmVolumes
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 940Gi
        - name: tmp-storage
          emptyDir: {}
      runner: &gpuRunner
        name: ome-container     # required by schema; image + command come from the tenant runtime
        ports:
          - containerPort: 30000
            name: http
            protocol: TCP
          - containerPort: 5000
            name: dist          # torch.distributed / NCCL init rendezvous (--dist-init-addr)
            protocol: TCP
        env: &infraEnv          # infra/hardware env; workload env (CC_MODEL_PATH, ...) is added in the tenant runtime
          - name: SGLANG_HOST_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: TRITON_PTXAS_PATH
            value: /usr/local/cuda/bin/ptxas
          - name: PYTHONUNBUFFERED
            value: "1"
          - name: NCCL_MNNVL_ENABLE
            value: "1"
          - name: NCCL_CUMEM_ENABLE
            value: "1"
          - name: NCCL_IB_ADDR_FAMILY
            value: AF_INET6
          - name: NCCL_SOCKET_IFNAME
            value: eth0
          - name: NCCL_SOCKET_FAMILY
            value: AF_INET6
          - name: CUDA_ENABLE_COREDUMP_ON_EXCEPTION
            value: "1"
          - name: CUDA_ENABLE_USER_TRIGGERED_COREDUMP
            value: "1"
          - name: CUDA_COREDUMP_GENERATION_FLAGS
            value: skip_global_memory,skip_shared_memory,skip_local_memory,skip_constbank_memory,skip_abort
          - name: CUDA_COREDUMP_FILE
            value: /opt/crash-dump/%h/core.cuda.%t.%p
          - name: CUDA_COREDUMP_PIPE
            value: /tmp/corepipe.cuda.%h.%p
          - name: SGLANG_HEALTH_CHECK_FAILURE_PYSPY_DUMP
            value: "1"
          - name: SGLANG_HEALTH_CHECK_FAILURE_CUDA_COREDUMP
            value: "1"
        resources: &gpu4Res     # 4 GPUs per node × 4 nodes (1 leader + 3 workers) = 16 GPUs (tp-size 16)
          requests:
            nvidia.com/gpu: "4"
            rdma/ib: "4"
          limits:
            nvidia.com/gpu: "4"
            rdma/ib: "4"
        volumeMounts: &shmMounts
          - mountPath: /dev/shm
            name: dshm
          - mountPath: /tmp
            name: tmp-storage
        securityContext: &privSec
          privileged: true
          capabilities:
            add:
              - IPC_LOCK
              - SYS_PTRACE
        # Only the leader serves the OpenAI HTTP API; workers join the gang and
        # do distributed compute. The HTTP health probes still target :30000 on
        # both — sglang exposes /health on every rank once the gang is up.
        readinessProbe: &gpuReadiness
          httpGet:
            path: /health
            port: 30000
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        livenessProbe: &gpuLiveness
          httpGet:
            path: /health
            port: 30000
          periodSeconds: 60
          timeoutSeconds: 30
          failureThreshold: 5
        startupProbe: &gpuStartup
          httpGet:
            path: /health
            port: 30000
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 60   # 30 min budget for first start (gang init + weight load)
    worker:
      # Same hardware + pod-level config as the leader (aliased).
      nodeSelector: *arm64Node
      tolerations: *gpuTolerations
      volumes: *shmVolumes
      runner: *gpuRunner

  # Router — single-pod, CPU-only, NOT gang-scheduled. Its own resources/ports;
  # reuses nodeSelector + metric schema.
  routerConfig:
    annotations:
      ome.io/enable-prometheus-scraping: "true"
      fb.metric.schema: *metricSchema
    nodeSelector: *arm64Node
    runner:
      name: router            # required by schema; image comes from the tenant runtime
      ports:
        - containerPort: 30080
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
      env:                    # downward-API identity the router uses to find backends
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: INFERENCESERVICE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['ome.io/inferenceservice']
      resources:
        requests:
          cpu: "16"
          memory: "16Gi"
        limits:
          cpu: "32"
          memory: "32Gi"
      readinessProbe:
        httpGet:
          path: /readiness
          port: 30080
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 5
      livenessProbe:
        httpGet:
          path: /liveness
          port: 30080
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 5
      startupProbe:
        httpGet:
          path: /readiness
          port: 30080
        periodSeconds: 20
        timeoutSeconds: 10
        failureThreshold: 30
