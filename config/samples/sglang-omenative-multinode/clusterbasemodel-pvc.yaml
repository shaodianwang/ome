# PVC-backed ClusterBaseModel — the sandbox fallback for the multi-node engine.
#
# The runtime loads the weights via cluster cache (CC_MODEL_PATH) as PRIMARY and
# falls back to this PVC ($(MODEL_PATH)) when CC isn't enabled for the tier yet.
# Drop this file + spec.model + the --fallback-model-path flag once CC is stable.
#
# How this PVC was populated (out of band — NOT create-manifold-pvc.sh):
#   - This cluster has NO OILFS CSI (only csi.vastdata.com), so the fast
#     Manifold-mount PVC doesn't work here — a real shared-vast copy is required.
#   - The in-cluster downloader (download-model-cws.sh) is denied: it authenticates
#     as SERVICE_IDENTITY:manifold.blobstore, which lacks read on the checkpoint's
#     ML_MODEL:titan_checkpoints ACL.
#   - So the 3Ti shared-vast PVC was filled via a writer pod + `manifold get`
#     under a USER identity that holds read on the ACL, with the HF config.json
#     staged into the same dir. Weights live at the PVC root.
#
# storageUri form:  pvc://<pvc-namespace>:<pvc-name>/<subpath>   ("." = root)
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: consolidation-sv3-tier5-42b-128k-ckpt150
spec:
  modelFormat:
    name: safetensors
    version: "1.0.0"
  modelFramework:
    name: transformers
  # From the checkpoint's config.json: architectures=[Llama4xOmniForCausalLM],
  # model_type=llama4x_omni. (Informational here — the ISVC names the runtime
  # explicitly, so it isn't used for runtime selection.)
  modelArchitecture: Llama4xOmniForCausalLM
  # bf16 — the config carries no quantization_config, so no quantization field.
  storage:
    storageUri: pvc://sandbox:consolidation-sv3-split-tier5-42b-128k-rsbvw4wb-checkpoint-150/.
