# Cluster-scoped ClusterBaseModel backed by a PVC in a specific namespace.
#
# OEP-0004 PVC URI format for ClusterBaseModel:
#   pvc://{namespace}:{pvc-name}/{sub-path}
#
# Note the colon separator between namespace and PVC name — this disambiguates
# the boundary from the sub-path's slashes. The metadata-extraction Job and
# all InferenceService pods that reference this model will be scheduled in
# the PVC's namespace ("model-storage" below).
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: llama-3-1-8b-instruct-shared
spec:
  modelCapabilities:
    - TEXT_TO_TEXT
  vendor: meta
  displayName: meta.llama-3.1-8b-instruct (shared pvc)
  storage:
    storageUri: pvc://model-storage:shared-models-pvc/meta/llama-3.1-8b-instruct
