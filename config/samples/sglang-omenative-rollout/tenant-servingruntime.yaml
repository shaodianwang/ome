# Tenant runtime — THIS is the file scientists edit. It inherits the platform
# base via `ome.io/inherit-from` and adds the per-workload bits:
#   - the container image (your sglang build)
#   - the sglang launch command + flags (tp/ep size, dtype, quant, context
#     length, speculative decode, PD wiring)
#   - your model path + cluster-cache env
#
# Everything else (GPUs, volumes, probes, networking, infra env) comes from the
# base — you don't repeat it here. Engine = prefill, decoder = decode; they
# share the same image + env (written once with an anchor, reused with *alias),
# and differ only in `--disaggregation-mode`.
#
# Container name must be `ome-container` for engine/decoder and `router` for the
# router — OME keys off those names.
apiVersion: ome.io/v1beta1
kind: ServingRuntime
metadata:
  name: srt-llama4x-nvfp4-pd
  namespace: sandbox
  annotations:
    ome.io/inherit-from: srt-llama4x-nvfp4-pd-base
spec:
  engineConfig:
    runner:
      name: ome-container
      image: &image 168653207203.dkr.ecr.us-east-2.amazonaws.com/msl_infra/prod-inference-gb300:20260601-ba882a31
      command:
        - python3
        - -m
        - sglang_meta.launch_server
        - --host
        - "0.0.0.0"
        - --port
        - "30000"
        # Primary: cluster cache fetches this manifold path at runtime.
        - --model-path
        - $(CC_MODEL_PATH)
        # Fallback: the PVC-mounted model. TEMPORARY — drop this
        # --fallback-model-path pair when CC is stable (see README).
        - --fallback-model-path
        - $(MODEL_PATH)
        - --tp-size
        - "4"
        - --ep-size
        - "4"
        - --dtype
        - bfloat16
        - --quantization
        - modelopt_fp4
        - --kv-cache-dtype
        - bfloat16
        - --moe-runner-backend
        - flashinfer_trtllm
        - --context-length
        - "1048576"
        - --speculative-algorithm
        - EAGLE3
        - --speculative-draft-model
        - $(CC_MODEL_PATH)/draft_hf
        - --fallback-speculative-draft-model-path
        - $(MODEL_PATH)/draft_hf
        - --speculative-draft-model-quantization
        - unquant
        - --preferred-sampling-params
        - '{"temperature": 1.0, "top_p": 0.9}'
        - --log-requests
        - --log-requests-level
        - "1"
        - --enable-request-time-stats-logging
        - --json-model-override-args
        - '{"attn_temperature_tuning_floor_scale":131072,"attn_temperature_tuning_layers":"global","attn_temperature_tuning_q_scale_constant":0.2}'
        - --disaggregation-mode
        - prefill
        - --disaggregation-transfer-backend
        - meta-p2p
        - --disaggregation-bootstrap-port
        - "8998"
      env: &workloadEnv       # CC_MODEL_PATH + CLUSTER_CACHE_* fetch the model at runtime (cluster cache)
        - name: CC_MODEL_PATH
          value: "manifold://fair_llms_prod/tree/vllm_test/tier5_integRL_64x168_rev3-bz10zrx3/checkpoint_0000430/nvfp4-moe-fp8kv-gb300_config"
        - name: CLUSTER_CACHE_HEADLESS_SERVICE
          value: "cluster-cache-headless.clustercache.svc.cluster.local:10090"
        - name: CLUSTER_CACHE_VERIFY_TENSOR_HASH_AGAINST
          value: "@tp4ep4"
        - name: CLUSTER_CACHE_GPU_DIRECT
          value: "1"
        - name: CLUSTER_CACHE_BBOX
          value: "1"
        - name: CLUSTER_CACHE_BARRIER_TIMEOUT_S
          value: "60"
        - name: CLUSTER_CACHE_HTTP_BATCH_REQUEST_TIMEOUT_SECS
          value: "60"
        - name: CLUSTER_CACHE_OVERLOAD_RETRY_ATTEMPTS
          value: "3"
        - name: SGLANG_CLUSTER
          value: cks
        - name: SGLANG_EXTERNAL_MODEL_PACKAGE
          value: sglang_meta.srt.models
        - name: SGLANG_DISAGGREGATION_NIXL_BACKEND
          value: UCX

  decoderConfig:
    runner:
      name: ome-container
      image: *image
      command:
        - python3
        - -m
        - sglang_meta.launch_server
        - --host
        - "0.0.0.0"
        - --port
        - "30000"
        # Primary: cluster cache fetches this manifold path at runtime.
        - --model-path
        - $(CC_MODEL_PATH)
        # Fallback: the PVC-mounted model. TEMPORARY — drop this
        # --fallback-model-path pair when CC is stable (see README).
        - --fallback-model-path
        - $(MODEL_PATH)
        - --tp-size
        - "4"
        - --ep-size
        - "4"
        - --dtype
        - bfloat16
        - --quantization
        - modelopt_fp4
        - --kv-cache-dtype
        - bfloat16
        - --moe-runner-backend
        - flashinfer_trtllm
        - --context-length
        - "1048576"
        - --speculative-algorithm
        - EAGLE3
        - --speculative-draft-model
        - $(CC_MODEL_PATH)/draft_hf
        - --fallback-speculative-draft-model-path
        - $(MODEL_PATH)/draft_hf
        - --speculative-draft-model-quantization
        - unquant
        - --preferred-sampling-params
        - '{"temperature": 1.0, "top_p": 0.9}'
        - --log-requests
        - --log-requests-level
        - "1"
        - --enable-request-time-stats-logging
        - --json-model-override-args
        - '{"attn_temperature_tuning_floor_scale":131072,"attn_temperature_tuning_layers":"global","attn_temperature_tuning_q_scale_constant":0.2}'
        - --disaggregation-mode
        - decode
        - --disaggregation-transfer-backend
        - meta-p2p
      env: *workloadEnv

  routerConfig:
    runner:
      name: router
      image: 168653207203.dkr.ecr.us-east-2.amazonaws.com/msl_infra/prod-inference-router:20260601-ba882a31
      args:
        - --port
        - "30080"
        - --metrics-port
        - "9090"
        - --model-name
        - llama4x
        - --backend-timeout
        - "300"
        - --bootstrap-port
        - "8998"
        - --k8s-namespace
        - $(NAMESPACE)
        - --prefill-label-selector
        - component=engine,ome.io/inferenceservice=$(INFERENCESERVICE_NAME)
        - --decode-label-selector
        - component=decoder,ome.io/inferenceservice=$(INFERENCESERVICE_NAME)
        - --k8s-engine-port
        - "30000"
