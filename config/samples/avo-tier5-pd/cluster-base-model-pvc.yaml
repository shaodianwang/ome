apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: avo-tier5-pd-test-pvc
spec:
  vendor: msl
  displayName: msl.avo-tier5-pd-test (PVC)
  disabled: false
  storage:
    # PVC-backed copy of the same checkpoint. The PVC must already exist
    # in the namespace where the InferenceService runs (cross-namespace
    # PVC mounts are not supported by Kubernetes).
    #
    # For the playground cluster, the live PVC is
    #   playground:tier5-code-prod-nvfp4-ptq
    # populated out of band. Substitute as appropriate for your cluster.
    storageUri: pvc://playground:tier5-code-prod-nvfp4-ptq/.
