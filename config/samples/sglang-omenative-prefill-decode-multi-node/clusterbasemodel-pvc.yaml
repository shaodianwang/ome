# PVC-backed ClusterBaseModel — the bf16 tier5-42b checkpoint, served by BOTH the
# prefill and decode gangs. SAME model + PVC as the engine-only multinode sample
# (config/samples/sglang-omenative-multinode/); this is the same ClusterBaseModel
# resource (apply one sample at a time, or share this one).
#
# The runtime loads the weights via cluster cache (CC_MODEL_PATH) as PRIMARY and
# falls back to this PVC ($(MODEL_PATH)) when CC isn't enabled for the tier yet.
# Drop this file + spec.model + the --fallback-model-path flag once CC is stable.
#
# storageUri form:  pvc://<pvc-namespace>:<pvc-name>/<subpath>   ("." = root)
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: consolidation-sv3-tier5-42b-128k-ckpt150
spec:
  modelFormat:
    name: safetensors
    version: "1.0.0"
  modelFramework:
    name: transformers
  # From the checkpoint's config.json: architectures=[Llama4xOmniForCausalLM].
  modelArchitecture: Llama4xOmniForCausalLM
  # bf16 — the config carries no quantization_config, so no quantization field.
  storage:
    storageUri: pvc://sandbox:consolidation-sv3-split-tier5-42b-128k-rsbvw4wb-checkpoint-150/.
