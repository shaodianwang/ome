# The deployment (InferenceService). PREFILL-DECODE disaggregated, with BOTH roles
# as multi-node gangs:
#
#   engine  (prefill) = 1 instance = 1 leader + worker.size (3) workers = 4 nodes,
#                       gang-scheduled, tp16 inside ONE NVLink (MNNVL) domain.
#   decoder (decode)  = 1 instance = 1 leader + worker.size (3) workers = 4 nodes,
#                       gang-scheduled, tp16 inside ITS OWN (separate) MNNVL domain.
#   router            = single CPU pod; routes prefill -> decode.
#
# = 8 GPU nodes (4 prefill + 4 decode). Prefill <-> decode KV moves over IB/RoCE
# (meta-p2p / NIXL), NOT NVLink, so the two gangs do NOT need to share a domain;
# each just needs internal co-location.
#
# CO-LOCATION IS LEADER-ANCHORED (per component):
#   leader -> NO affinity: it's the free "anchor" for its gang's domain.
#   worker -> requiredDuringScheduling podAffinity to ITS component's leader
#             (component + ome.io/runner=leader + instance-index), topologyKey
#             network.meta.com/domain -> the whole gang lands in the leader's domain.
# We anchor to the LEADER (scoped by component + instance-index) rather than a broad
# self-podAffinity over all component pods: the broad form collapses every instance's
# gang (and, across components, conflates engine vs decoder) into one domain once
# minReplicas>1, whereas anchoring scopes each gang to its own leader.
# SCHEDULING IS CAPACITY-BOUND, not an affinity bootstrap problem: each gang-scheduled
# 4-node gang stays Pending until a domain has 4 GPU-free nodes (the same affinity
# co-places fine when a domain has room). NOTE: for minReplicas>1 the worker selector's
# ome.io/instance-index must be templated per-instance (static "0" is correct only for
# a single instance; OME does not do this today).
#
# Pods:
#   sglang-tier5-42b-bf16-pd-engine-0-leader-0   + engine-0-worker-0..2    (prefill, domain A)
#   sglang-tier5-42b-bf16-pd-decoder-0-leader-0  + decoder-0-worker-0..2   (decode,  domain B)
#   sglang-tier5-42b-bf16-pd-router-0-default-0
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata:
  name: sglang-tier5-42b-bf16-pd
  namespace: sandbox
spec:
  deploymentMode: OMENative   # propagates to engine / decoder / router + ingress
  model:
    name: consolidation-sv3-tier5-42b-128k-ckpt150   # the ClusterBaseModel (clusterbasemodel-pvc.yaml)
    kind: ClusterBaseModel
  runtime:
    name: srt-tier5-42b-bf16-pdmn
  engine:                      # prefill — multi-node gang
    minReplicas: 1
    maxReplicas: 1
    leader:
      priorityClassName: staging
      # NO affinity — the leader anchors the prefill gang's NVLink domain.
      runner:
        name: ome-container
    worker:
      size: 3                  # 1 leader + 3 workers = 4 nodes (tp16)
      priorityClassName: staging
      # Workers co-locate with the ENGINE leader -> whole prefill gang in one domain.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: network.meta.com/domain
              labelSelector:
                matchLabels:
                  ome.io/inferenceservice: sglang-tier5-42b-bf16-pd
                  component: engine
                  ome.io/runner: leader
                  ome.io/instance-index: "0"
      runner:
        name: ome-container
    lifecycle:
      updateStrategy:
        type: RecreatePod      # a 4-node gang can't surge; drain + recreate in place
  decoder:                     # decode — multi-node gang (its own domain)
    minReplicas: 1
    maxReplicas: 1
    leader:
      priorityClassName: staging
      # NO affinity — the leader anchors the decode gang's (separate) domain.
      runner:
        name: ome-container
    worker:
      size: 3
      priorityClassName: staging
      # Workers co-locate with the DECODER leader (component=decoder, NOT engine).
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: network.meta.com/domain
              labelSelector:
                matchLabels:
                  ome.io/inferenceservice: sglang-tier5-42b-bf16-pd
                  component: decoder
                  ome.io/runner: leader
                  ome.io/instance-index: "0"
      runner:
        name: ome-container
    lifecycle:
      updateStrategy:
        type: RecreatePod
  router:
    minReplicas: 1
    maxReplicas: 1
    priorityClassName: staging
  rollout:
    coordination:
      groups:
        # Keep prefill + decode rolling together so the two pools never drift into a
        # version skew. With RecreatePod (no surge) each gang recreates in place. If
        # you have +1 gang of headroom per component (4 more nodes each), switch each
        # lifecycle to SurgeThenDrain + pacing RatioBalanced (see the rollout sample)
        # for a zero-downtime roll.
        - components: [engine, decoder]
          policy: RollingUpdate
