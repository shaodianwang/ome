# Platform base runtime — hardware/platform layer for a PREFILL-DECODE (PD)
# DISAGGREGATED, MULTI-NODE sglang deployment on gb300. Owned by the platform team;
# scientists don't normally edit this.
#
# Both roles are multi-node gangs that ALSO do PD transfer:
#   engine  (prefill) = gang of 1 leader + N workers, tp16 over NVLink inside ONE
#                       MNNVL domain; exposes a PD bootstrap port (8998).
#   decoder (decode)  = gang of 1 leader + M workers, tp16 over NVLink inside its
#                       OWN MNNVL domain.
# Prefill -> decode KV is transferred over IB/RoCE (meta-p2p / NIXL), NOT NVLink, so
# the two gangs live in DIFFERENT NVLink domains; each only needs INTERNAL
# co-location, which the ISVC's leader-anchored podAffinity provides.
#
# Carries ONLY stable bits: GPU/RDMA, volumes, probes, ports, IB networking, infra
# env. NO image / NO sglang flags — those live in the tenant runtime.
#
# MULTI-NODE: pod-level fields (volumes/nodeSelector/tolerations) live under
# leader:/worker:, NOT at engineConfig/decoderConfig level — OME builds gang pods
# from Leader/Worker PodSpec and drops component-level pod fields for a gang.
apiVersion: ome.io/v1beta1
kind: ClusterServingRuntime
metadata:
  name: srt-tier5-42b-bf16-pdmn-base
spec:
  disabled: false
  protocolVersions:
    - openAI
  # Must match the checkpoint's config.json (architectures=[Llama4xOmniForCausalLM]).
  # bf16 — no quantization_config, so no quantization field.
  supportedModelFormats:
    - modelFormat:
        name: safetensors
        version: "1.0.0"
        operator: GreaterThanOrEqual
      modelFramework:
        name: transformers
        operator: Equal
      modelArchitecture: Llama4xOmniForCausalLM
      autoSelect: false
      priority: 1

  # ===================== ENGINE (prefill) — multi-node gang =====================
  # The engine declares all the shared anchors; decoder reuses them via *alias.
  engineConfig:
    annotations:
      # IB macvlan: cross-node NCCL (intra-gang tp16 all-reduce over RoCE) AND the
      # NIXL / meta-p2p PD KV transfer (prefill -> decode).
      k8s.v1.cni.cncf.io/networks: &macvlanNets '[{"name":"ibs0p0-macvlan","namespace":"cw-multus"},{"name":"ibs0p1-macvlan","namespace":"cw-multus"},{"name":"ibs0p2-macvlan","namespace":"cw-multus"},{"name":"ibs0p3-macvlan","namespace":"cw-multus"},{"name":"ibs1p0-macvlan","namespace":"cw-multus"},{"name":"ibs1p1-macvlan","namespace":"cw-multus"},{"name":"ibs1p2-macvlan","namespace":"cw-multus"},{"name":"ibs1p3-macvlan","namespace":"cw-multus"},{"name":"ibs2p0-macvlan","namespace":"cw-multus"},{"name":"ibs2p1-macvlan","namespace":"cw-multus"},{"name":"ibs2p2-macvlan","namespace":"cw-multus"},{"name":"ibs2p3-macvlan","namespace":"cw-multus"},{"name":"ibs3p0-macvlan","namespace":"cw-multus"},{"name":"ibs3p1-macvlan","namespace":"cw-multus"},{"name":"ibs3p2-macvlan","namespace":"cw-multus"},{"name":"ibs3p3-macvlan","namespace":"cw-multus"}]'
      fb.metric.schema: &metricSchema "sglang_metrics"
    leader:
      nodeSelector: &arm64Node
        kubernetes.io/arch: arm64
      tolerations: &gpuTolerations
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes: &shmVolumes
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 940Gi
        - name: tmp-storage
          emptyDir: {}
      runner: &engineRunner
        name: ome-container     # required by schema; image + command come from the tenant runtime
        ports:
          - { containerPort: 30000, name: http, protocol: TCP }
          - { containerPort: 5000, name: dist, protocol: TCP }       # NCCL / torch.distributed rendezvous (--dist-init-addr)
          - { containerPort: 8998, name: bootstrap, protocol: TCP }  # PD bootstrap (--disaggregation-bootstrap-port)
        env: &infraEnv
          - name: SGLANG_HOST_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - { name: TRITON_PTXAS_PATH, value: /usr/local/cuda/bin/ptxas }
          - { name: PYTHONUNBUFFERED, value: "1" }
          - { name: NCCL_MNNVL_ENABLE, value: "1" }
          - { name: NCCL_CUMEM_ENABLE, value: "1" }
          - { name: NCCL_IB_ADDR_FAMILY, value: AF_INET6 }
          - { name: NCCL_SOCKET_IFNAME, value: eth0 }
          - { name: NCCL_SOCKET_FAMILY, value: AF_INET6 }
          - { name: CUDA_ENABLE_COREDUMP_ON_EXCEPTION, value: "1" }
          - { name: CUDA_ENABLE_USER_TRIGGERED_COREDUMP, value: "1" }
          - { name: CUDA_COREDUMP_GENERATION_FLAGS, value: skip_global_memory,skip_shared_memory,skip_local_memory,skip_constbank_memory,skip_abort }
          - { name: CUDA_COREDUMP_FILE, value: /opt/crash-dump/%h/core.cuda.%t.%p }
          - { name: CUDA_COREDUMP_PIPE, value: /tmp/corepipe.cuda.%h.%p }
          - { name: SGLANG_HEALTH_CHECK_FAILURE_PYSPY_DUMP, value: "1" }
          - { name: SGLANG_HEALTH_CHECK_FAILURE_CUDA_COREDUMP, value: "1" }
        resources: &gpu4Res     # 4 GPUs/node x 4 nodes = 16 GPUs (tp-size 16), per component
          requests:
            nvidia.com/gpu: "4"
            rdma/ib: "4"
          limits:
            nvidia.com/gpu: "4"
            rdma/ib: "4"
        volumeMounts: &shmMounts
          - { mountPath: /dev/shm, name: dshm }
          - { mountPath: /tmp, name: tmp-storage }
        securityContext: &privSec
          privileged: true
          capabilities:
            add: [IPC_LOCK, SYS_PTRACE]
        readinessProbe: &gpuReadiness
          httpGet: { path: /health, port: 30000 }
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        livenessProbe: &gpuLiveness
          httpGet: { path: /health, port: 30000 }
          periodSeconds: 60
          timeoutSeconds: 30
          failureThreshold: 5
        startupProbe: &gpuStartup
          httpGet: { path: /health, port: 30000 }
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 60   # 30 min budget for first start (gang init + weight load)
    worker:
      nodeSelector: *arm64Node
      tolerations: *gpuTolerations
      volumes: *shmVolumes
      runner: *engineRunner     # leader + worker run identical hardware/template

  # ===================== DECODER (decode) — multi-node gang =====================
  # Same hardware as the engine; the only difference is the runner has NO bootstrap
  # port (decode connects to the engine's bootstrap, it doesn't host one).
  decoderConfig:
    annotations:
      k8s.v1.cni.cncf.io/networks: *macvlanNets
      fb.metric.schema: *metricSchema
    leader:
      nodeSelector: *arm64Node
      tolerations: *gpuTolerations
      volumes: *shmVolumes
      runner: &decoderRunner
        name: ome-container
        ports:
          - { containerPort: 30000, name: http, protocol: TCP }
          - { containerPort: 5000, name: dist, protocol: TCP }   # this gang's own NCCL rendezvous
        env: *infraEnv
        resources: *gpu4Res
        volumeMounts: *shmMounts
        securityContext: *privSec
        readinessProbe: *gpuReadiness
        livenessProbe: *gpuLiveness
        startupProbe: *gpuStartup
    worker:
      nodeSelector: *arm64Node
      tolerations: *gpuTolerations
      volumes: *shmVolumes
      runner: *decoderRunner

  # ===================== ROUTER — single CPU pod ================================
  routerConfig:
    annotations:
      ome.io/enable-prometheus-scraping: "true"
      fb.metric.schema: *metricSchema
    nodeSelector: *arm64Node
    runner:
      name: router            # required by schema; image comes from the tenant runtime
      ports:
        - { containerPort: 30080, name: http, protocol: TCP }
        - { containerPort: 9090, name: metrics, protocol: TCP }
      env:                    # downward-API identity the router uses to find backends
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: INFERENCESERVICE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['ome.io/inferenceservice']
      resources:
        requests: { cpu: "16", memory: "16Gi" }
        limits: { cpu: "32", memory: "32Gi" }
      readinessProbe:
        httpGet: { path: /readiness, port: 30080 }
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 5
      livenessProbe:
        httpGet: { path: /liveness, port: 30080 }
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 5
      startupProbe:
        httpGet: { path: /readiness, port: 30080 }
        periodSeconds: 20
        timeoutSeconds: 10
        failureThreshold: 30
