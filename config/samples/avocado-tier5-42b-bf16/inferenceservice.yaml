# The deployment (InferenceService) for the Avocado Tier5 42B 128k BF16 server.
# MULTI-NODE, engine-only (no PD / no decoder), OMENative.
#
#   - engine = one multi-node gang: 1 leader + worker.size (3) workers = 4 nodes
#              (4 GPU/node x 4 = 16 GPU, tp16/ep16), gang-scheduled in ONE MNNVL domain.
#   - router = single CPU pod, the external entrypoint.
#
# WEIGHTS: cluster cache PRIMARY + PVC FALLBACK (mirrors sglang-omenative-multinode).
# spec.model -> ClusterBaseModel `prod-tier5-42b-128k-bf16` -> PVC
# `ckpt-tier5-42b-128k-bf16` (clusterbasemodel.yaml). OME mounts the PVC and injects
# $(MODEL_PATH); the runtime loads from CC first and falls back to the PVC if CC
# setup fails (the ring-collapse "exhausted owner candidates"), so a CC flap won't crash.
#
# Pods come up as:
#   avocado-tier5-42b-bf16-engine-0-leader-0
#   avocado-tier5-42b-bf16-engine-0-worker-0..2
#   avocado-tier5-42b-bf16-router-0-default-0
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata:
  name: avocado-tier5-42b-bf16
  namespace: prod
spec:
  deploymentMode: OMENative   # propagates to engine + router + ingress
  model:
    name: prod-tier5-42b-128k-bf16   # ClusterBaseModel -> pvc://prod:ckpt-tier5-42b-128k-bf16/.
    kind: ClusterBaseModel
  runtime:
    name: srt-avocado-tier5-42b-bf16-mn
  engine:
    minReplicas: 5            # 1 instance = 1 leader + worker.size workers (one gang)
    maxReplicas: 5
    # OME generates per-instance worker-to-leader affinity and stamps this same
    # key on the gang PodGroup. This does not select a scheduler: set
    # spec.schedulerName on the referenced ServingRuntime (or schedulerName on
    # both leader and worker) only after installing a gang-aware scheduler.
    topologyKey: network.meta.com/domain
    # priorityClassName MUST live under leader/worker for a multi-node gang — at the
    # engine (component) level it is DROPPED (OME #461). Set your prod priority class
    # under leader/worker if the 4-node gang would otherwise sit Pending.
    leader:
      runner:
        name: ome-container   # image/command/resources come from the runtime
    worker:
      size: 3                 # 3 workers + 1 leader = 4 nodes
      runner:
        name: ome-container
    lifecycle:
      updateStrategy:
        # RecreatePod: drain + recreate the 4-node gang in place (no surge headroom).
        type: RecreatePod
  router:
    minReplicas: 1
    maxReplicas: 1
