# Self-contained multi-node (LeaderWorkerSet) ServingRuntime — BF16 tier5 42b 128k
# on gb300 (16 GPU / 4 nodes, tp16/ep16). Namespaced (prod).
#
# Mirrors the BF16 reference runtime in
#   config/samples/sglang-omenative-multinode/tenant-servingruntime.yaml
#
# WEIGHT SOURCE: cluster cache PRIMARY + PVC FALLBACK.
#   --model-path $(CC_MODEL_PATH)          -> cluster cache (manifold), fast/GPU-direct when healthy
#   --fallback-model-path $(MODEL_PATH)    -> the PVC (OME mounts it from spec.model)
# If CC setup fails (ClusterCacheSetupError — e.g. the ring-collapse "exhausted
# owner candidates"), sglang switches model_path to the PVC fallback and keeps
# starting (sglang.py maybe_redirect_remote_paths -> _configured_fallback_model_path).
# There's also a byte-range-level fallback to the PVC during load. So a CC flap no
# longer crashes the pod — it just serves from the PVC.
#
# BF16: checkpoint is full-precision (config.json has no quantization_config) — plain
# bf16 flags, no nvfp4/megamoe/fp8/dp-attention/prefill-delayer.
#
# Multi-node rendezvous flags are OME-injected (do NOT hardcode):
#   --dist-init-addr $(OME_LEADER_ADDRESS):5000
#   --nnodes         $(OME_INSTANCE_POD_COUNT)
#   --node-rank      $(OME_INSTANCE_POD_RANK)
apiVersion: ome.io/v1beta1
kind: ServingRuntime
metadata:
  name: srt-avocado-tier5-42b-bf16-mn
  namespace: prod
spec:
  disabled: false
  protocolVersions: [openAI]
  supportedModelFormats:
    - modelFormat: {name: safetensors, version: "1.0.0", operator: GreaterThanOrEqual}
      modelFramework: {name: transformers, operator: Equal}
      modelArchitecture: Llama4xOmniForCausalLM   # BF16 — must match the ClusterBaseModel
      autoSelect: false
      priority: 1
  engineConfig:
    annotations:
      fb.metric.schema: &metricSchema sglang_metrics
      # IB macvlan interfaces NIXL/UCX needs; same set the devbox pods declare.
      k8s.v1.cni.cncf.io/networks: '[{"name":"ibs0p0-macvlan","namespace":"cw-multus"},{"name":"ibs0p1-macvlan","namespace":"cw-multus"},{"name":"ibs0p2-macvlan","namespace":"cw-multus"},{"name":"ibs0p3-macvlan","namespace":"cw-multus"},{"name":"ibs1p0-macvlan","namespace":"cw-multus"},{"name":"ibs1p1-macvlan","namespace":"cw-multus"},{"name":"ibs1p2-macvlan","namespace":"cw-multus"},{"name":"ibs1p3-macvlan","namespace":"cw-multus"},{"name":"ibs2p0-macvlan","namespace":"cw-multus"},{"name":"ibs2p1-macvlan","namespace":"cw-multus"},{"name":"ibs2p2-macvlan","namespace":"cw-multus"},{"name":"ibs2p3-macvlan","namespace":"cw-multus"},{"name":"ibs3p0-macvlan","namespace":"cw-multus"},{"name":"ibs3p1-macvlan","namespace":"cw-multus"},{"name":"ibs3p2-macvlan","namespace":"cw-multus"},{"name":"ibs3p3-macvlan","namespace":"cw-multus"}]'
    leader: &mnNode
      nodeSelector: {kubernetes.io/arch: arm64}
      tolerations: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}]
      volumes:
        - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 940Gi}}
        - {name: tmp-storage, emptyDir: {}}
      runner: &runner
        name: ome-container
        image: 168653207203.dkr.ecr.us-east-2.amazonaws.com/msl_infra/prod-inference-gb300:20260616-96d80beed
        ports:
          - {containerPort: 30000, name: http, protocol: TCP}
          - {containerPort: 5000,  name: dist, protocol: TCP}
        command:
          - python3
          - -m
          - sglang_meta.launch_server
          - --host
          - "0.0.0.0"
          - --port
          - "30000"
          - --model-path
          - $(CC_MODEL_PATH)          # cluster cache (primary)
          - --fallback-model-path
          - $(MODEL_PATH)             # PVC (OME-injected from spec.model) — used if CC setup fails
          - --tp-size
          - "16"
          - --ep-size
          - "16"
          - --dtype
          - bfloat16
          - --kv-cache-dtype
          - bfloat16
          - --moe-runner-backend
          - flashinfer_trtllm
          - --context-length
          - "131072"
          - --served-model-name
          - external
          # --- OME-injected multi-node rendezvous (do NOT hardcode) ---
          - --dist-init-addr
          - $(OME_LEADER_ADDRESS):5000
          - --nnodes
          - $(OME_INSTANCE_POD_COUNT)
          - --node-rank
          - $(OME_INSTANCE_POD_RANK)
          - --log-requests
          - --log-requests-level
          - "1"
          - --enable-request-time-stats-logging
          # Multimodal (llama4x_omni) projector config — model-specific.
          - --json-model-override-args
          - '{"architectures": ["Llama4xOmniForCausalLM"], "vision_config": {"projector_input_dim": 4096, "use_rowwise_vision_projection": true}}'
        env:
          # --- cluster cache (primary weight source) ---
          - name: CC_MODEL_PATH
            value: "manifold://fair_llms_prod/tree/vllm_test/consolidation_sv4_1_tier5_42b_128k-gxrj1qwt/checkpoint_0000200/checkpoint/"
          - {name: CLUSTER_CACHE_HEADLESS_SERVICE, value: "cluster-cache-headless.clustercache.svc.cluster.local:10090"}
          - {name: CLUSTER_CACHE_GPU_DIRECT, value: "1"}
          - {name: CLUSTER_CACHE_BBOX, value: "1"}
          - {name: CLUSTER_CACHE_BARRIER_TIMEOUT_S, value: "60"}
          - {name: CLUSTER_CACHE_HTTP_BATCH_REQUEST_TIMEOUT_SECS, value: "60"}
          - {name: CLUSTER_CACHE_OVERLOAD_RETRY_ATTEMPTS, value: "3"}
          - {name: SGLANG_CLUSTER, value: cks}
          - {name: SGLANG_EXTERNAL_MODEL_PACKAGE, value: sglang_meta.srt.models}
          - {name: SGLANG_DISABLE_FORCE_PREFILL_CUDA_GRAPH, value: "1"}
          # Reclaim fragmented (reserved-but-unallocated) HBM to avoid late-startup
          # CUDA OOM at 1M context.
          - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True"}
          # --- infra / hardware ---
          - {name: SGLANG_HOST_IP, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
          - {name: TRITON_PTXAS_PATH, value: /usr/local/cuda/bin/ptxas}
          - {name: PYTHONUNBUFFERED, value: "1"}
          - {name: NCCL_MNNVL_ENABLE, value: "1"}
          - {name: NCCL_CUMEM_ENABLE, value: "1"}
          - {name: NCCL_IB_ADDR_FAMILY, value: AF_INET6}
          - {name: NCCL_SOCKET_IFNAME, value: eth0}
          - {name: NCCL_SOCKET_FAMILY, value: AF_INET6}
          - {name: CUDA_ENABLE_COREDUMP_ON_EXCEPTION, value: "1"}
          - {name: CUDA_ENABLE_USER_TRIGGERED_COREDUMP, value: "1"}
          - {name: CUDA_COREDUMP_GENERATION_FLAGS, value: skip_global_memory,skip_shared_memory,skip_local_memory,skip_constbank_memory,skip_abort}
          - {name: CUDA_COREDUMP_FILE, value: /opt/crash-dump/%h/core.cuda.%t.%p}
          - {name: CUDA_COREDUMP_PIPE, value: /tmp/corepipe.cuda.%h.%p}
          - {name: SGLANG_HEALTH_CHECK_FAILURE_PYSPY_DUMP, value: "1"}
          - {name: SGLANG_HEALTH_CHECK_FAILURE_CUDA_COREDUMP, value: "1"}
        resources:
          requests: {nvidia.com/gpu: "4", rdma/ib: "4"}
          limits:   {nvidia.com/gpu: "4", rdma/ib: "4"}
        volumeMounts:
          - {mountPath: /dev/shm, name: dshm}
          - {mountPath: /tmp, name: tmp-storage}
        securityContext: {privileged: true, capabilities: {add: [IPC_LOCK, SYS_PTRACE]}}
        readinessProbe: {httpGet: {path: /health, port: 30000}, initialDelaySeconds: 120, periodSeconds: 30, timeoutSeconds: 10, failureThreshold: 5}
        livenessProbe:  {httpGet: {path: /health, port: 30000}, periodSeconds: 60, timeoutSeconds: 30, failureThreshold: 5}
        startupProbe:   {httpGet: {path: /health, port: 30000}, periodSeconds: 30, timeoutSeconds: 30, failureThreshold: 60}
    worker: *mnNode
  routerConfig:
    annotations: {ome.io/enable-prometheus-scraping: "true", fb.metric.schema: *metricSchema}
    nodeSelector: {kubernetes.io/arch: arm64}
    runner:
      name: router
      image: 168653207203.dkr.ecr.us-east-2.amazonaws.com/msl_infra/prod-inference-router:20260617-84917ed4f
      ports:
        - {containerPort: 30080, name: http, protocol: TCP}
        - {containerPort: 9090,  name: metrics, protocol: TCP}
      args:
        - --port
        - "30080"
        - --metrics-port
        - "9090"
        - --model-name
        - avocado-tier5-42b-bf16
        - --backend-timeout
        - "86400"
        - --k8s-namespace
        - $(NAMESPACE)
        - --label-selector
        - component=engine,ome.io/runner=leader,ome.io/inferenceservice=$(INFERENCESERVICE_NAME)
        - --k8s-engine-port
        - "30000"
      env:
        - {name: NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
        - {name: INFERENCESERVICE_NAME, valueFrom: {fieldRef: {fieldPath: "metadata.labels['ome.io/inferenceservice']"}}}
      resources: {requests: {cpu: "32", memory: 128Gi}, limits: {cpu: "32", memory: 128Gi}}
      readinessProbe: {httpGet: {path: /readiness, port: 30080}, periodSeconds: 30, timeoutSeconds: 10, failureThreshold: 5}
      livenessProbe:  {httpGet: {path: /liveness,  port: 30080}, periodSeconds: 30, timeoutSeconds: 10, failureThreshold: 5}
      startupProbe:   {httpGet: {path: /readiness, port: 30080}, periodSeconds: 20, timeoutSeconds: 10, failureThreshold: 30}
