# PVC-backed ClusterBaseModel — BF16 tier5 42b 128k (sv4.1 @ checkpoint_0000200).
#
# Weights live on the shared-vast PVC `ckpt-tier5-42b-128k-bf16` in `prod`,
# populated from Manifold by:
#   devops/download-model-cws.sh --name tier5-42b-128k-bf16 \
#     --manifold-path tree/vllm_test/consolidation_sv4_1_tier5_42b_128k-gxrj1qwt/checkpoint_0000200/checkpoint \
#     --namespace prod --pvc-size 3Ti --tls-secret inference-aqueduct-cert --deadline 21600 --wait
#
# This is the PVC FALLBACK behind cluster cache: the runtime loads from CC first
# and falls back to this PVC when CC setup fails (the ring-collapse "exhausted
# owner candidates"). Referenced by the ISVC's spec.model.
#
# storageUri form: pvc://<pvc-namespace>:<pvc-name>/<subpath>   ("." = root)
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: prod-tier5-42b-128k-bf16
spec:
  modelFormat:
    name: safetensors
    version: "1.0.0"
  modelFramework:
    name: transformers
  # From config.json: architectures=[Llama4xOmniForCausalLM], model_type=llama4x_omni,
  # NO quantization_config -> full-precision BF16.
  modelArchitecture: Llama4xOmniForCausalLM
  storage:
    storageUri: pvc://prod:ckpt-tier5-42b-128k-bf16/.
