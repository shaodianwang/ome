# Register a workload cluster with the control plane (OEP-0018, phase 1).
# The kubeconfig lives in a Secret; the WorkloadCluster references it. The
# WorkloadCluster controller (run the manager with --enable-multicluster)
# connects and reports a Ready/Reachable condition.
apiVersion: v1
kind: Secret
metadata:
  name: cw-use2-2-kubeconfig
  namespace: ome-system
type: Opaque
stringData:
  kubeconfig: |
    # <paste the workload cluster's kubeconfig here>
---
apiVersion: ome.io/v1beta1
kind: WorkloadCluster
metadata:
  name: cw-use2-2
  labels:
    provider: cw
    region: us-east-2
    gpu: gb300
spec:
  clusterSource:
    kubeConfig:
      secretRef: {name: cw-use2-2-kubeconfig, namespace: ome-system}
